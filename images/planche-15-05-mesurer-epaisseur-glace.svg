<text x="32" y="323" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="38" y="323" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">pelleter la neige jusqu’à la glace</text>
<text x="32" y="340" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="38" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">percer jusqu’à l’eau</text>
<text x="32" y="357" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="38" y="357" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">crocher le bout du ruban sous la glace</text>
<text x="32" y="374" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">4</text>
<text x="38" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">tirer le ruban, bien tendu</text>
<text x="32" y="391" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">5</text>
<text x="38" y="391" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">lire au ras du dessus de la glace</text>
