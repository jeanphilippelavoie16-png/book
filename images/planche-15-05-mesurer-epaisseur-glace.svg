<svg xmlns="http://www.w3.org/2000/svg" width="340" height="413" viewBox="0 0 340 413" role="img">
<title>Planche 15-05. Mesurer l’épaisseur de la glace</title>
<desc>Une coupe de la glace sur le lac. La neige est pelletée en petits bancs de chaque côté, la glace est nue autour d’un trou percé jusqu’à l’eau ; l’eau monte dans le trou presque au ras du dessus de la glace. Un ruban à mesurer descend dans le trou le long de la paroi, passe sous la glace, et son crochet est pris sous le bord du dessous de la glace. Une main tient le boîtier du ruban au-dessus du trou et tire vers le haut ; la mesure se lit au ras du dessus de la glace.</desc>
