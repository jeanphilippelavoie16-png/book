<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 58-09 — Le montage en gorge</title>
<desc>Un éclat d’os aiguisé aux deux bouts, la ligne nouée en son milieu, couché dans l’axe d’un petit poisson servant d’appât. La truite l’avale en long ; à la traction, la pièce pivote en travers de la gorge et ses deux pointes se plantent.</desc>
