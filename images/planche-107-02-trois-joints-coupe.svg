<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 107-02 — Les trois joints en coupe</title>
<desc>Trois joints coupés en travers, côte à côte. À gauche, une soudure bout à bout sur deux plats chanfreinés en V : le cordon remplit le V, et la ligne de fusion passe au-delà des bords d’origine des pièces, qui ont fondu avec l’apport ; le contour extérieur court sans interruption d’une pièce à l’autre par-dessus le cordon, c’est un seul morceau. Au centre, un brasage à recouvrement, fort ou tendre : deux plats superposés, un film d’apport mince dans un jeu serré, un petit congé à chaque bout ; chaque pièce garde son contour entier et ses arêtes vives. À droite, le même recouvrement raté : les pièces laissées écartées, un film d’apport épais qui remplit le vide au lieu d’être tiré par capillarité, et qui ne tient rien.</desc>
