<text x="22" y="336" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 59-03 — L’éperlan vidé d’un seul geste.</text>
<text x="32" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="38" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">derrière l’ouïe, par le dos</text>
<text x="32" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="38" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">sans traverser : le ventre tient</text>
<text x="32" y="395" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="38" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">tirer la tête : les viscères suivent</text>
</svg>