<svg xmlns="http://www.w3.org/2000/svg" width="340" height="413" viewBox="0 0 340 413" role="img">
<title>Planche 59-03 — L’éperlan vidé d’un seul geste</title>
<desc>Un éperlan vu de profil. En haut, la lame entre par le dos juste derrière l’ouïe et descend en biais vers l’avant ; sa pointe s’arrête avant la peau du ventre, qui reste entière. En bas, la tête est tirée vers l’avant : les viscères sortent du corps, attachés à elle, en un seul morceau.</desc>
