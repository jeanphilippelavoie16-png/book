<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 26-04 — Le garrot improvisé</title>
<desc>Trois temps sur une cuisse vue de face : une bande large nouée haut au-dessus de la plaie ; un bâton passé dans le nœud et tourné ; le bâton rabattu le long de la cuisse et tenu par un deuxième lien.</desc>
