<rect x="40" y="546" width="600" height="59" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="54" y="569.4" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — on n’entre pas dans une chambre qui fume : le monoxyde ne se voit pas, ne se sent pas</text>
<text x="54" y="587.3" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">et ne pique pas les yeux.</text>

<text x="40" y="636" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 70-01 — Le fumoir à froid : le feu est ailleurs, la fumée arrive refroidie.</text>
<text x="40" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="56" y="660" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">trou à feu jusqu’au genou, fermé d’une tôle</text>
<text x="40" y="678" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="56" y="678" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">tranchée couverte : la terre refroidit</text>
<text x="40" y="696" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="56" y="696" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">chambre en planches brutes, sans colle</text>
<text x="40" y="714" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">4</text>
<text x="56" y="714" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">registre de sortie, le seul réglage</text>
<text x="40" y="732" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">5</text>
<text x="56" y="732" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">pièces espacées, loin de la paroi</text>
<text x="40" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">6</text>
<text x="56" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">thermomètre à hauteur des pièces</text>
<text x="40" y="768" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">7</text>
<text x="56" y="768" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">amorce d’air, côté vent : la seule entrée</text>
</svg>
