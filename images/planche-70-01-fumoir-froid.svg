<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 70-01 — Le fumoir à froid : le feu est ailleurs, la fumée arrive refroidie</title>
<desc>Coupe de principe, vue de côté. À gauche, un trou à feu creusé dans le sol, profond jusqu’au genou, trois bûches au fond, fermé d’une tôle posée à plat : l’air n’entre que par une entaille sur le côté. De là part une tranchée en pente légère montante, fermée sur toute sa course par une tôle recouverte de terre tassée ; au-dessus du trou, la terre descend en talus jusqu’au bout de la tôle. La tranchée remonte par un coude court dans le plancher de la chambre ; une flèche y montre le sens de la fumée. La chambre de planches, haute et étroite, reçoit la fumée en bas et la rend en haut par une sortie que ferme en partie un registre coulissant. Trois poissons pendus par la queue à un bâton posé sur deux taquets ne se touchent pas et ne touchent pas la paroi, et un thermomètre traverse la paroi à leur hauteur.</desc>
