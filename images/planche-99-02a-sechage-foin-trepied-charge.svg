<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 99-02a — Le séchage du foin : le trépied chargé</title>
<desc>Trois perches d’épinette liées ensemble au sommet, les pieds écartés en triangle. En élévation, le trépied monté, avant le foin : deux perches devant, une au fond. Vu de dessus, sous l’élévation : les trois pieds en triangle et les perches qui se rejoignent au lien. En coupe par deux perches, le trépied chargé : le foin posé en couches sur les perches, chaque couche recouvrant le haut de celle du dessous, une coiffe de foin par-dessus le lien ; le foin s’arrête au-dessus du sol, et le centre reste creux, ouvert dessous : l’air y entre sous le bord du foin et monte. En détail, le sommet : les trois perches côte à côte, liées de plusieurs tours serrés, qui se croisent juste au-dessus du lien.</desc>
