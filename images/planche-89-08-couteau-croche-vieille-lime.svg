<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 89-08. Le couteau croche, d’une vieille lime</title>
<desc>Le couteau croche vu à plat, tel qu’on le tient : la lame de lime, le dos en haut, le tranchant vers soi, la soie ligaturée sur un bras d’une branche fourchue, l’autre bras qui s’écarte du dos de la lame et porte le pouce ; on tire vers soi. En détail : la lame en coupe, une face plate, l’autre en biseau ; la lame courbée en entier ou par le bout, vue de chant ; la soie en coupe, couchée dans sa rainure, pliée en crochet dans le bois, sous une ligature serrée.</desc>
