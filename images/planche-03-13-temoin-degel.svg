<svg xmlns="http://www.w3.org/2000/svg" width="340" height="413" viewBox="0 0 340 413" role="img">
<title>Planche 03-13. Le témoin de dégel</title>
<desc>En haut, en partant : un verre d’eau, puis le même verre gelé ; une pièce de monnaie, au-dessus de la glace, et une flèche rouge qui la pose sur la glace. En bas, au retour : trois verres de glace pareils. Dans le premier, la pièce est restée sur la glace : rien n’a dégelé. Dans le deuxième, elle est prise à mi-hauteur dans la glace : le dégel a été partiel. Dans le troisième, elle est couchée au fond : tout a dégelé puis regelé.</desc>
