<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 05-01. La chaudière à bascule contre les souris</title>
<desc>En haut, la chaudière de 20 L posée au sol, vide et sèche. Une broche raide passe dans deux trous sous le rebord, d’un bord à l’autre, tortillée dehors ; une canette vide est enfilée sur la broche par le milieu de ses deux bouts, couchée en travers du haut de la chaudière ; un doigt de gras sur le dessus, au milieu. Le bout de la canette, où passe la broche, est cerclé de rouge : elle doit tourner libre. Une planche appuyée du sol au rebord ; une souris la monte. En bas, la chaudière coupée, vue dans l’axe de la broche : la souris sur la canette qui commence à tourner ; puis la canette tournée, le gras de côté, la souris au fond. À droite, le bas d’un mur de planches : un bout de conserve aplati cloué de six clous par-dessus un trou au ras du plancher, dessiné en tireté sous la tôle.</desc>
