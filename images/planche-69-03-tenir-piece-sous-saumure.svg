<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 69-03 — Tenir la pièce sous la saumure</title>
<desc>Deux chaudières en coupe. La pièce au fond, couverte de saumure. À gauche, un disque de bois taillé au diamètre du contenant, et une pierre bouillie par-dessus. À droite, un sac fermé rempli de la même saumure, posé sur la pièce.</desc>
