<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 30-01 — Le poste de lavage à pédale, monté avec un bidon de lave-glace</title>
<desc>De face, au repos : le bidon de lave-glace pend par une corde qui le traverse haut dans les flancs ; une deuxième corde descend de la poignée à une branche en travers, un peu au-dessus du sol ; le savon pend à côté dans un bas de nylon noué. De côté : le pied appuie la branche au sol, le bidon bascule vers l’avant autour de sa corde et un filet coule du bouchon desserré dans les mains.</desc>
