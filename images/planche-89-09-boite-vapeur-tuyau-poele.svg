<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 89-09. La boîte à vapeur en tuyau de poêle</title>
<desc>En coupe, une longueur de tuyau de poêle couchée en légère pente sur deux piquets fourchus, bouchée de chiffons aux deux bouts, la pièce à cintrer dedans ; sous le bout bas, une bouilloire sur un petit feu dont le bec entre dans le tuyau par le dessous ; la vapeur monte le long du tuyau, l’eau condensée redescend et sort par un trou au point bas, avant le bec. À côté, la variante pour un bout de pièce : le tuyau debout dans un chaudron d’eau qui bout, un chiffon en haut que la pièce traverse, l’eau condensée qui retombe dans le chaudron.</desc>
