<text x="40" y="319" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 89-09. La boîte à vapeur en tuyau de poêle.</text>
<text x="50" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="56" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">tuyau de poêle, en légère pente</text>
<text x="50" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="56" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">chiffons aux deux bouts</text>
<text x="50" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="56" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">bec qui entre par le dessous</text>
<text x="50" y="395" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">4</text>
<text x="56" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">trou de purge au point bas</text>
<text x="362" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">5</text>
<text x="368" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">la pièce à cintrer</text>
<text x="362" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">6</text>
<text x="368" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">tuyau debout dans l’eau qui bout</text>
<text x="362" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">7</text>
<text x="368" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">chiffon en haut, la pièce au travers</text>
</svg>