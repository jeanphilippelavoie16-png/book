<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 31-04 — Le piège à graisse à deux chaudières</title>
<desc>Deux chaudières côte à côte, vues en coupe. La première reçoit l’eau de vaisselle : la graisse figée flotte en galette sur le dessus, les solides reposent au fond. Un bout de boyau a sa bouche à mi-hauteur, dans l’eau claire entre les deux couches ; il monte, traverse la paroi près du bord et se déverse dans la seconde chaudière. Une cuillère lève la galette.</desc>
