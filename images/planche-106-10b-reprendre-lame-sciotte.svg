<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 106-10b — Reprendre la lame de la sciotte</title>
<desc>Trois gestes sur la lame de la sciotte. En haut, égaliser : la lame dents en l’air, une lime plate couchée à plat sur les pointes et poussée sur la longueur ; deux dents plus hautes que les autres portent la lime et se font ramener au rang. Au milieu à gauche, refaire le fil : trois dents vues de côté, le tiers-point vu en bout, son triangle assis dans le creux entre deux dents, une face contre chaque dent voisine. Au milieu à droite, donner la voie : coupe en travers de la lame posée à plat sur un billot dur, la pointe de la dent en porte-à-faux sur le bord abattu du billot ; un poinçon posé sur la dent, frappé au marteau, la couche sur le bord abattu ; en tireté, la dent avant le coup. En bas, la lame vue sur ses pointes : une dent couchée d’un côté, la suivante de l’autre, et les deux lignes du trait, plus écartées que l’épaisseur de la lame.</desc>
