<title>Planche 112-07 — La lampe à graisse</title>
<desc>Une boîte de conserve à bords bas remplie de gras mou, une mèche de coton torsadée couchée au fond, une seule pointe qui sort au bord et porte la flamme ; l’encadré danger rappelle le monoxyde.</desc>
