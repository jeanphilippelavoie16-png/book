<text x="54" y="254.4" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Une lampe à graisse qui fume fait du monoxyde, qui endort avant de tuer : jamais dans une chambre</text>
<text x="54" y="272.3" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">fermée où quelqu’un dort.</text>
<text x="40" y="319" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 112-07 — La lampe à graisse.</text>
<text x="50" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="56" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">bande de vieux t-shirt, coton seulement</text>
<text x="50" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="56" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">torsadée serrée sur toute la longueur</text>
<text x="50" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="56" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">boîte de conserve à bords bas</text>
<text x="50" y="395" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">4</text>
<text x="56" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">gras mou, lard de phoque, huile de poisson</text>
<text x="362" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">5</text>
<text x="368" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">mèche couchée au fond du gras</text>
<text x="362" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">6</text>
<text x="368" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">sortir la mèche règle la lumière</text>
<text x="362" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">7</text>
<text x="368" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">une seule pointe dépasse du bord</text>
<text x="362" y="395" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">8</text>
<text x="368" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">support de métal, surface stable</text>
</svg>