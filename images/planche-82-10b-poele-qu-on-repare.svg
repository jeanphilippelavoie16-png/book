<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 82-10b — Le poêle qu’on répare : le joint de la porte</title>
<desc>Le joint de fortune de la porte du poêle. En coupe au bord haut de la porte, en deux temps : porte ouverte, la pâte d’argile et de cendre tamisée montée en bourrelet dans la rainure de la porte, un papier ciré contre la devanture du poêle ; porte refermée sur le papier, la pâte écrasée prend la forme de la devanture sans y coller. De face, le poêle, la porte fermée sur une feuille de papier pincée côté poignée et tirée vers l’extérieur ; au tireté, les autres places où la feuille s’essaie, tout le tour de la porte. Grossi au joint : à gauche, la pâte serre la feuille contre la devanture ; à droite, la pâte sèche et craquée s’est retirée, la feuille glisse et sort sans résistance. Encadré danger : une porte qui fuit empêche d’affamer le feu.</desc>
