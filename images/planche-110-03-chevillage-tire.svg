<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 110-03 — Le chevillage à tire</title>
<desc>Un poteau et une traverse assemblés à tenon et mortaise. Vu de face : le trou du tenon, en tireté, est percé plus près de l’épaulement que celui des joues. En coupe, vu de dessus : la cheville pointue entre dans le trou décalé, pousse le tenon vers le fond et tire l’épaulement contre le poteau ; chassée, elle reste cintrée dans le tenon et le joint reste serré.</desc>
