<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900" role="img">
<title>Planche 13-01 — Décanter, filtrer, désinfecter : ce que chacun enlève</title>
<desc>Trois vignettes en coupe, même point de vue, même échelle, posées sur la même ligne de fond. À gauche, la chaudière de décantation : eau au repos, dépôt au fond, boyau de siphonnage qui prend l'eau bien au-dessus du dépôt. Au centre, le coton serré tendu sur la gueule du bassin et, dans le fond percé du bassin, l'élément filtrant en coupe ; l'eau tombe goutte à goutte dans le contenant receveur. À droite, la marmite couverte à gros bouillons. Sous les vignettes, une règle des tailles en micromètres : le trait du pore de 1 micromètre coupe la règle en deux, les protozoaires sont entièrement à sa droite, la bactérie est à cheval sur lui, le virus est loin à sa gauche. Deux bandes sous la règle : la chaleur couvre toute la règle, le dissous n'est arrêté nulle part.</desc>

