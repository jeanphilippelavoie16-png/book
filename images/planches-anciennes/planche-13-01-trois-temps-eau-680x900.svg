<rect x="40" y="656" width="600" height="44" rx="2" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="58" y="676" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — bouillir une eau chargée en nitrate, en plomb ou en arsenic la concentre</text>
<text x="58" y="692" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">au lieu de la corriger : l'eau part en vapeur, eux restent. La marmite n'y touche pas.</text>

<text x="40" y="730" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 13-01 — Décanter, filtrer, désinfecter : ce que chacun enlève.</text>
<text x="40" y="750" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 décanter : 12 à 24 h sans bouger · 2 siphonner par-dessus le dépôt · 3 préfiltrer, trois</text>
<text x="40" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">ou quatre épaisseurs de coton · 4 le filtre à 1 µm · 5 gros bouillons, couvert : 1 minute,</text>
<text x="40" y="782" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">et 5 minutes sur un bassin à castors, rats musqués ou lièvres · 6 le pore de 1 µm : à sa</text>
<text x="40" y="798" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">droite, rien ne passe · 7 protozoaires retenus : Cryptosporidium 4 à 6 µm, Giardia 8 × 14 µm ·</text>
<text x="40" y="814" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">8 bactérie, 0,5 µm de large : la plupart, pas toutes · 9 virus, 0,03 µm : aucun filtre de</text>
<text x="40" y="830" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">terrain ne l'arrête · 10 la chaleur prend tout le vivant, quelle que soit sa taille ·</text>
<text x="40" y="846" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">11 dissous : sel, arsenic, nitrate, manganèse, plomb — rien de tout ça ne les enlève</text>
</svg>
