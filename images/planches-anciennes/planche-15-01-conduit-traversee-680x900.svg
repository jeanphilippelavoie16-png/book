<!-- lignes de rappel de la vue principale -->
<line x1="318.5" y1="84.8" x2="400" y2="112" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
<line x1="309" y1="141.3" x2="390" y2="135" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
