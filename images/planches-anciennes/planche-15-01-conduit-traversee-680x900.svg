<path d="M182 370 L182 227 L618 227 L618 60" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round"/>

<!-- les deux joints, gardés hors de l'épaisseur du mur -->
<path d="M300 165 L300 160 L316 160 L316 165" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
<path d="M300 227 L300 232 L316 232 L316 227" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
