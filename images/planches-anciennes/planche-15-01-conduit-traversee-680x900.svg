<line x1="602.2" y1="275.5" x2="526" y2="232" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>

<circle cx="310" cy="82" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="310" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1</text>
<circle cx="300" cy="142" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="300" y="146" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">2</text>
<circle cx="534" cy="100" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="534" y="104" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3</text>
<circle cx="548" cy="272" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="548" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">4</text>
<circle cx="610" cy="280" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="610" y="284" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">5</text>

<!-- ============ DÉTAIL : le même passage vu de la pièce ============ -->

<!-- le lambris de la pièce -->
<line x1="140" y1="460" x2="540" y2="460" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
