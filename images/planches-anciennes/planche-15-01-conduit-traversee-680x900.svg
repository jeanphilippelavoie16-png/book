<line x1="140" y1="640" x2="540" y2="640" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>

<!-- le trou dans le bois, le fourreau qui en fait le tour, le tuyau au centre -->
<rect x="256" y="470" width="168" height="168" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
<rect x="274" y="488" width="132" height="132" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
