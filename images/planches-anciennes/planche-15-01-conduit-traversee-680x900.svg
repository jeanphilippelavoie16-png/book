<circle cx="196" cy="476" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="196" y="480" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">7</text>

<!-- encadré danger -->
<rect x="40" y="690" width="600" height="44" rx="2" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="58" y="710" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — après un feu de cheminée, le feu couve des heures dans le bois du</text>
<text x="58" y="726" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">passage, sans fumée du côté de la pièce. On y remet la main le soir, puis la nuit.</text>

<!-- pied de planche -->
<text x="40" y="766" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 15-01 — Le conduit et sa traversée de mur.</text>
<text x="40" y="784" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 le trou bien plus grand que le tuyau · 2 l'incombustible qui borde le passage</text>
<text x="40" y="800" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3 l'espace d'air : rien ne touche le conduit · 4 la section la plus saine passe ici</text>
<text x="40" y="816" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">5 aucun joint dans l'épaisseur du mur · 6 le même jeu sur les quatre côtés</text>
<text x="40" y="832" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">7 la main à plat sur le bois du passage. Le jeu se lit sur la plaque de l'appareil</text>
</svg>
