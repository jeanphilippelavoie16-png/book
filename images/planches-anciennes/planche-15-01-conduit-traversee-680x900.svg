<path d="M400 64 Q412 59 424 64 Q436 69 448 64 Q460 59 472 64 Q484 69 496 64" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<path d="M400 394 Q412 389 424 394 Q436 399 448 394 Q460 389 472 394 Q484 399 496 394" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="415" y1="64" x2="415" y2="112" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="415" y1="280" x2="415" y2="392" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="481" y1="64" x2="481" y2="112" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="481" y1="280" x2="481" y2="392" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>

<!-- le conduit, objet principal -->
