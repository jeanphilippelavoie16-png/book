<!-- la main posée à plat sur le lambris : c'est l'échelle -->
<path d="M235 546 L234 518 A4.5 4.5 0 0 0 225 518 L225 528 Q224 530 223 528 L223 502 A4.5 4.5 0 0 0 214 502 L214 524 Q213 526 212 524 L212 496 A4.5 4.5 0 0 0 203 496 L203 522 Q202 524 201 522 L201 503 A4.5 4.5 0 0 0 192 503 L192 545 Q178 549 176 558 Q177 568 192 570 L192 578 L234 578 Z" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linejoin="round"/>
