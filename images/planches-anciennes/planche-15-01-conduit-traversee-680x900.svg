<line x1="140" y1="568" x2="176" y2="568" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="235" y1="568" x2="256" y2="568" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="424" y1="568" x2="540" y2="568" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="140" y1="604" x2="256" y2="604" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
