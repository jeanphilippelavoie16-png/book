<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900" role="img">
<title>Planche 15-01 — Le conduit et sa traversée de mur</title>
<desc>Deux vues à la même échelle. En haut, coupe verticale d'un mur de chalet traversé par le conduit du poêle : le tuyau part du poêle à gauche, monte, coude, traverse le mur à l'horizontale et remonte dehors à droite. Le trou percé dans le lambris, la charpente et le revêtement est beaucoup plus grand que le tuyau. Un fourreau incombustible borde le passage sur toute l'épaisseur du mur, séparé du bois par de l'air et séparé du tuyau par de l'air. Les joints de tuyau restent dans la pièce et dehors, aucun dans l'épaisseur du mur. En bas, le même passage vu de la pièce : le trou carré, le fourreau qui en fait le tour, le tuyau au centre, et le même espace d'air sur les quatre côtés. Une main posée à plat sur le lambris, à gauche du passage, donne l'échelle et sert de mesure.</desc>

<defs>
<pattern id="bois" width="8.5" height="8.5" patternUnits="userSpaceOnUse">
<path d="M0 8.5 L8.5 0" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
</pattern>
<pattern id="fourreau" width="12" height="12" patternUnits="userSpaceOnUse">
<path d="M0 12 L12 0" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
</pattern>
</defs>

<rect x="0" y="0" width="680" height="900" fill="#FFFFFF"/>

<!-- ============ VUE PRINCIPALE : coupe verticale du mur ============ -->

<!-- le mur coupé, hachuré en bois, interrompu en haut et en bas -->
<path d="M400 64 Q412 59 424 64 Q436 69 448 64 Q460 59 472 64 Q484 69 496 64 L496 112 L400 112 Z" fill="url(#bois)"/>
<path d="M400 280 L496 280 L496 394 Q484 399 472 394 Q460 389 448 394 Q436 399 424 394 Q412 389 400 394 Z" fill="url(#bois)"/>

<!-- le fourreau incombustible, hachure plus large -->
<rect x="390" y="130" width="116" height="10" fill="url(#fourreau)" stroke="#1A1A1A" stroke-width="1.4"/>
<rect x="390" y="252" width="116" height="10" fill="url(#fourreau)" stroke="#1A1A1A" stroke-width="1.4"/>

<!-- arêtes du mur, bords du passage, traits d'interruption -->
<line x1="400" y1="64" x2="400" y2="112" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
<line x1="496" y1="64" x2="496" y2="112" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
<line x1="400" y1="280" x2="400" y2="394" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
