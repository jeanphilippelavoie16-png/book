<rect x="40" y="318" width="600" height="44" rx="2" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="58" y="338" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — ce n'est pas la batterie qui blesse, c'est l'acide : il part au visage de</text>
<text x="58" y="354" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">celui qui est penché dessus. L'arc brûle la cornée sans qu'on le sente sur le coup.</text>

<text x="40" y="386" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 84-09 — Souder à l'arc avec deux batteries d'auto.</text>
<text x="40" y="404" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 masse mordue sur le métal nu · 2 batteries par terre, du côté d'où vient le vent</text>
<text x="40" y="420" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3 le + de la première au − de la seconde · 4 porte-électrode sur le + restant · 5 le vent</text>
</svg>
