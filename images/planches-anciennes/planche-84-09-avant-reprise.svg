<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>Planche 84-09 — Souder à l'arc avec deux batteries d'auto</title>
<desc>Vue de côté. Deux batteries de 12 volts posées au sol, reliées en série par la borne positive de la première à la borne négative de la seconde. La borne négative restée libre alimente la masse mordue sur la pièce ; la borne positive restée libre alimente le porte-électrode. Les batteries se tiennent à deux ou trois pas du joint, du côté d'où vient le vent.</desc>
