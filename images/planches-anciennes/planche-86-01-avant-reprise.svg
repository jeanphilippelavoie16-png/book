<text x="40" y="326" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 86-01 — Le mouflage : d'où vient l'avantage mécanique. Même charge, même montée.</text>
<text x="40" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 l'ancrage porte la charge plus la tension du brin qu'on tire</text>
<text x="40" y="360" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">2 la poulie fixe ne change que la direction : un seul brin porte</text>
<text x="40" y="376" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3 la poulie mobile : c'est d'elle seule que vient le gain · 4 deux brins, la moitié de l'effort</text>
<text x="40" y="392" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">5 quatre brins, le quart · 6 le câble à tirer : quatre mètres pour un mètre de montée</text>
</svg>
