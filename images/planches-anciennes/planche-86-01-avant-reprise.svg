<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>Planche 86-01 — Le mouflage : d'où vient l'avantage mécanique</title>
<desc>Trois montages comparés, même charge et même montée d'un mètre. À gauche, une poulie fixe seule : un seul brin porte la charge, et il faut tirer un mètre de câble. Au milieu, une poulie mobile ajoutée : deux brins portent, la moitié de l'effort, deux mètres de câble. À droite, deux poulies fixes et deux poulies mobiles : quatre brins portent, le quart de l'effort, quatre mètres de câble. Les traits courts en travers des brins comptent ceux qui portent la charge ; le brin qu'on tire n'en fait pas partie. La barre sous chaque montage donne la longueur de câble à tirer, à la même échelle que la montée.</desc>
