<!-- couche 4 : pied de planche et légende, un renvoi par ligne -->
<text x="40" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 105-01 — Le fil d’un couteau, en coupe.</text>
<text x="40" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="56" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">neuf : deux faces qui se rejoignent</text>
<text x="40" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="56" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">usé, arrondi : retour au grain grossier</text>
<text x="40" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="56" y="346" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">replié sur le côté : redresser au fusil</text>
<text x="40" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">4</text>
<text x="56" y="362" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">écaillé : reprendre à angle plus ouvert</text>
<text x="40" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">5</text>
<text x="56" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">morfil : bon signe, finir au cuir</text>
</svg>
