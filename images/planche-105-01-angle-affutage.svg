<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 105-01 — Le fil d’un couteau, en coupe.</title>
<desc>Cinq coupes très agrandies de la zone du fil d’une lame de couteau, même échelle, même cadrage, le fil vers le bas ; le dos est hors du dessin, au-delà de la ligne de rupture. 1, neuf : les deux faces du biseau se rejoignent en une arête vive. 2, usé : l’arête est devenue un arrondi, le fil neuf est rappelé en pointillé ; retour au grain grossier jusqu’au morfil. 3, replié : toute la pointe est couchée sur le côté ; on la redresse au fusil. 4, écaillé : un éclat en coquille est arraché à une face, la pointe manque, la cassure est en creux et en angles, le fil neuf est rappelé en pointillé ; on ouvre l’angle, et si ça persiste on recule jusqu’à l’acier sain. 5, morfil : le biseau est formé et une pellicule mince, trop mince pour être hachurée, part de l’apex vers le côté ; c’est la preuve que l’apex est atteint, et on l’enlève au cuir. En bas à droite, le couteau entier de profil, avec le plan de coupe marqué au travers de la lame et un petit cercle sur le fil, là où les coupes sont prises.</desc>
<defs>
<pattern id="acier" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<path d="M5 0 L5 10" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
</pattern>
<marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0" y="0" width="680" height="413" fill="#FFFFFF"/>

