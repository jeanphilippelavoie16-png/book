<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 58-07 — La brimbale de bois</title>
<desc>Brimbale de deux bouts de bois en croix, plantée au bord du trou, vue de côté avec la glace en coupe : la bascule sur son clou, près du trou, le long bras plus lourd que le bras de ligne chargé : au repos, son bout pose sur la glace, fanion couché ; le bâton fendu qui porte la ligne pend au bout du bras court, toute la mécanique bien au-dessus du niveau d’eau du trou. En tireté, la bascule à la touche : le bras de ligne descend, le fanion monte. À droite, le bâton fendu en détail.</desc>
