<text x="40" y="319" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 58-07 — La brimbale de bois.</text>
<text x="50" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="56" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">montant et bascule en croix</text>
<text x="50" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="56" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">clou ou cheville, graissé au suif</text>
<text x="50" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="56" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">fanion de toile rouge ou fer-blanc</text>
<text x="50" y="395" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">4</text>
<text x="56" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">ligne enroulée sur un bâton fendu</text>
<text x="362" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">5</text>
<text x="368" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">ligne coincée dans la fente</text>
<text x="362" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">6</text>
<text x="368" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">mécanique au-dessus du niveau du trou</text>
<text x="362" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">7</text>
<text x="368" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">neige dégagée dessous à chaque ronde</text>
<text x="362" y="395" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">8</text>
<text x="368" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">à la touche, le fanion monte</text>
</svg>