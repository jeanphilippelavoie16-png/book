<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 19-04 — Bouillir aux pierres, sans chaudron</title>
<desc>Coupe d’une fosse doublée d’une peau fraîche et pleine d’eau, avec un feu allumé à l’écart. Deux bâtons verts en pince, bouts écartés, lâchent une pierre chaude dans l’eau ; une pierre refroidie est ressortie sur le bord. Le feu ne touche jamais la peau.</desc>
