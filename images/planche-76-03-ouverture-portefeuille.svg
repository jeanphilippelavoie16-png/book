<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 76-03 — L’ouverture en portefeuille</title>
<desc>Un omble vidé, posé sur le dos, ventre ouvert : la lame entre par la cavité, à plat contre l’arête, et court le long du dos jusqu’à la peau sans la percer. Ouvert, le poisson s’étale en une feuille d’épaisseur régulière, peau dessous, et l’arête centrale sort d’une pièce.</desc>
