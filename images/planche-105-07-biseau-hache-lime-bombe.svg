<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 105-07 — Le biseau de hache, limé bombé</title>
<desc>À gauche, une tête de hache vue de flanc, une lime bâtarde posée sur le biseau, poussée par petits cercles le long du tranchant. À droite, deux coupes du taillant à la même échelle, plantées dans une bille : le biseau bombé, en pente continue, ressort du bois ; le biseau creusé à la meule, avec son épaule, reste coincé et son fil mince s’écaille.</desc>
