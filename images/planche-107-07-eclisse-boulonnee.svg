<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 107-07 — L’éclisse boulonnée</title>
<desc>Réparer un plat d’acier fissuré sans souder. D’abord un trou percé à chaque bout de la fissure. Puis une plaque de ferraille posée à cheval sur la cassure, tenue par deux boulons de chaque côté, décalés, jamais en ligne dans l’axe de la fissure. En coupe, la contreplaque de l’autre côté, le plat pris en sandwich et les boulons qui traversent les trois épaisseurs.</desc>
