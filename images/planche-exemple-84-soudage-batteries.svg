<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img">
  <title>Planche 84-09 — Souder à l'arc avec deux batteries d'auto</title>
  <desc>Deux batteries de 12 volts reliées en série : la borne positive de la première va à la borne négative de la seconde, ce qui donne 24 volts. La borne négative libre alimente la masse pincée sur la pièce, la borne positive libre alimente le porte-électrode.</desc>

  <style>
    .fond   { fill: #FFFFFF; }
    .trait  { fill: none; stroke: #1A1A1A; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    .fil    { fill: none; stroke: #1A1A1A; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .filpos { fill: none; stroke: #1A1A1A; stroke-width: 2.2; stroke-dasharray: 8 4; stroke-linecap: round; stroke-linejoin: round; }
    .corps  { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 1.6; }
    .plein  { fill: #E8E4DC; stroke: #1A1A1A; stroke-width: 1.6; }
    .borne  { fill: #FFFFFF; stroke: #1A1A1A; stroke-width: 1.6; }
    .arc    { fill: none; stroke: #1A1A1A; stroke-width: 1.8; stroke-linecap: round; }
    .t      { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; fill: #1A1A1A; }
    .tb     { font-family: Georgia, 'Times New Roman', serif; font-size: 14px; font-weight: bold; fill: #1A1A1A; }
    .ts     { font-family: Georgia, 'Times New Roman', serif; font-size: 12.5px; fill: #3A3A3A; }
    .tn     { font-family: Georgia, 'Times New Roman', serif; font-size: 11px; fill: #1A1A1A; letter-spacing: 0.06em; }
    .cadre  { fill: none; stroke: #1A1A1A; stroke-width: 1; }
    .danger { fill: none; stroke: #9B2C1E; stroke-width: 2; }
    .tdang  { font-family: Georgia, 'Times New Roman', serif; font-size: 13px; font-weight: bold; fill: #9B2C1E; }
  </style>

  <rect class="fond" x="0" y="0" width="680" height="600"/>

  <!-- montage en série : + de la première vers − de la seconde -->
  <path class="fil" d="M220 100 L220 74 L420 74 L420 100"/>
  <!-- négatif libre vers la masse -->
  <path class="fil" d="M120 100 L120 48 L56 48 L56 336 L152 336"/>
  <!-- positif libre vers le porte-électrode -->
  <path class="filpos" d="M520 100 L520 48 L624 48 L624 244 L462 244"/>

  <!-- batteries -->
  <rect class="corps" x="90" y="100" width="160" height="96" rx="3"/>
  <rect class="corps" x="390" y="100" width="160" height="96" rx="3"/>
  <line class="trait" x1="90" y1="126" x2="250" y2="126"/>
  <line class="trait" x1="390" y1="126" x2="550" y2="126"/>
  <text class="tb" x="170" y="164" text-anchor="middle">Batterie 12 V</text>
  <text class="tb" x="470" y="164" text-anchor="middle">Batterie 12 V</text>

  <!-- bornes -->
  <circle class="borne" cx="120" cy="100" r="10"/><text class="tn" x="120" y="104" text-anchor="middle">–</text>
  <circle class="borne" cx="220" cy="100" r="10"/><text class="tn" x="220" y="104" text-anchor="middle">+</text>
  <circle class="borne" cx="420" cy="100" r="10"/><text class="tn" x="420" y="104" text-anchor="middle">–</text>
  <circle class="borne" cx="520" cy="100" r="10"/><text class="tn" x="520" y="104" text-anchor="middle">+</text>

  <!-- tension résultante -->
  <rect class="plein" x="262" y="130" width="116" height="34" rx="3"/>
  <text class="tb" x="320" y="152" text-anchor="middle">24 V</text>
  <text class="ts" x="320" y="184" text-anchor="middle">en série, les tensions s'additionnent</text>

  <!-- pièce, masse, électrode -->
  <rect class="plein" x="152" y="322" width="28" height="28" rx="2"/>
  <rect class="plein" x="180" y="310" width="330" height="52" rx="2"/>
  <text class="tb" x="345" y="342" text-anchor="middle">Pièce à souder</text>
  <rect class="corps" x="418" y="232" width="48" height="26" rx="3"/>
  <line class="fil" x1="442" y1="258" x2="442" y2="306"/>
  <path class="arc" d="M424 300 L414 290 M460 300 L470 290 M442 294 L442 282"/>

  <!-- étiquettes de repère -->
  <line class="cadre" x1="92" y1="348" x2="92" y2="366"/>
  <text class="t" x="92" y="382" text-anchor="middle">Masse</text>
  <line class="cadre" x1="560" y1="245" x2="560" y2="266"/>
  <text class="t" x="560" y="282" text-anchor="middle">Porte-électrode</text>

  <!-- encadré danger, filet rouge -->
  <rect class="danger" x="40" y="404" width="600" height="82" rx="3"/>
  <text class="tdang" x="58" y="430">Danger</text>
  <text class="ts" x="58" y="452">Ce qui blesse ici n'est pas la batterie, c'est l'acide : il part au visage de celui qui est penché</text>
  <text class="ts" x="58" y="470">dessus. Un banc qu'on entend bouillonner est un banc qu'on arrête.</text>

  <!-- notes de montage -->
  <text class="tb" x="40" y="518">Placement</text>
  <text class="ts" x="40" y="538">Par terre, à deux ou trois pas du joint, du côté d'où vient le vent. Jamais sous la pièce,</text>
  <text class="ts" x="40" y="556">jamais sous les étincelles.</text>
  <text class="ts" x="40" y="580">Verre de soudeur : l'arc brûle la cornée en quelques secondes, et ça ne se sent que la nuit venue.</text>
</svg>
