<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 104-02 — Le point sellier et la couture rabattue</title>
<desc>Coupe le long d’une couture au point sellier : un seul fil, une aiguille à chaque bout, les deux aiguilles passent dans le même trou en sens inverse et leurs brins se croisent dans chaque trou. À côté, le serrage des deux brins ensemble. En bas, la couture rabattue en coupe : les deux bords repliés en crochet et emboîtés, puis aplatis et piqués, aucun bord coupé à l’air.</desc>
