<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900" role="img">
<title>Planche 01-01 — La fiche de relevé des quatre horloges</title>
<desc>Gabarit vierge à recopier à la main sur une feuille, puis à coller à la porte du congélateur. La feuille est en trois bandes, une par vitesse d'horloge. Bande du haut, à remplir une seule fois : l'heure où le courant est tombé, le compte des têtes, les litres d'eau mis de côté. Bande du milieu : les quatre échéances qui tombent à heure fixe, imprimées en délai — plus 6 heures pour le tri du réfrigérateur, plus 24 heures pour un congélateur à demi rempli, plus 48 heures pour un congélateur plein, plus 8, 16 et 24 heures pour l'arrêt d'une heure de la génératrice — chacune suivie d'une case vide où écrire l'heure vraie calculée depuis l'heure 0. Bande du bas, la plus grande : un tableau de onze lignes, une par heure, avec les colonnes heure vraie, heures de panne, température de la pièce chauffée, écart avec l'heure précédente, température buccale, combustible brûlé, et ce qui a été fait. Un crayon dessiné sous la feuille donne l'échelle des lignes. Un filet rouge porte le rappel sur le monoxyde de carbone.</desc>

