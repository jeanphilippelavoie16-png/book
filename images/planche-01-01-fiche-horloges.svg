<text x="62" y="124" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1</text>
<text x="62" y="224" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">2</text>
<text x="294" y="698" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3</text>
<text x="438" y="698" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">4</text>
<text x="478" y="698" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">5</text>

<text x="110" y="88" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">À l'heure 0, une seule fois — l'heure, les têtes, l'eau</text>
<text x="110" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Heure où le courant est tombé :</text>
<text x="434" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Têtes :</text>
<text x="530" y="120" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">sur</text>
<text x="110" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Retour annoncé (1 800 790-2424) :</text>
<text x="434" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Eau mise de côté :</text>
<text x="604" y="152" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">L</text>

<text x="110" y="188" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Le froid déjà payé — ce qui tombe à heure fixe</text>
<text x="162" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Frigo</text>
<text x="162" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">tri obligatoire</text>
<text x="162" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">+ 6 h</text>
<text x="294" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Congélateur</text>
<text x="294" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">à demi rempli</text>
<text x="294" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">+ 24 h</text>
<text x="426" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Congélateur</text>
<text x="426" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">plein</text>
<text x="426" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">+ 48 h</text>
<text x="558" y="218" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Génératrice</text>
<text x="558" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">arrêt d'une heure</text>
<text x="558" y="250" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">+ 8 h, 16 h, 24 h</text>

<text x="110" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Le corps et le combustible — chaque heure, une ligne</text>
<text x="127" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Heure</text>
<text x="127" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">vraie</text>
<text x="183" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">h de</text>
<text x="183" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">panne</text>
<text x="238" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Pièce</text>
<text x="238" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">°C</text>
<text x="238" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">18 à 24</text>
<text x="294" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Écart</text>
<text x="294" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">°C</text>
<text x="350" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Buccale</text>
<text x="350" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">°C</text>
<text x="350" y="358" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">35 ou +</text>
<text x="438" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Bois, essence,</text>
<text x="438" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">propane brûlés</text>
<text x="560" y="334" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Ce qui a été fait</text>

<rect x="96" y="718" width="528" height="56" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="112" y="740" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — génératrice, chaufferette au propane, gril, moteur : dehors,</text>
<text x="112" y="760" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">jamais dans un bâtiment, un garage ni sous un auvent, même entrouvert.</text>

<text x="40" y="794" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 01-01 — La fiche de relevé des quatre horloges, à recopier.</text>
<text x="40" y="818" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 l'heure 0, écrite avant tout le reste · 2 les heures qui tombent, calculées tout de suite</text>
<text x="40" y="836" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3 l'écart en °C avec l'heure d'avant : c'est la pente qui dit si la nuit est tenable</text>
<text x="40" y="854" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">4 ce qui a brûlé en 24 h, multiplié, donne la semaine · 5 le crayon donne l'échelle</text>
</svg>
