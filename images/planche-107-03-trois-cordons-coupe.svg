<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 107-03 — Trois cordons en coupe</title>
<desc>Deux plats d’acier soudés bout à bout, tranchés en travers du cordon, trois fois. À gauche, le bon cordon : un dessus à peine bombé qui se raccorde en douceur aux deux plats, et le métal fondu qui descend dans les deux pièces jusqu’en dessous. Au milieu, le manque de fusion : un boudin rond posé sur la surface, les flancs en surplomb, les bords nets ; dessous, les deux plats et le jour entre eux sont restés intacts. À droite, le caniveau : le cordon est entré dans la pièce, mais un sillon est creusé dans chaque plat le long de son bord.</desc>
