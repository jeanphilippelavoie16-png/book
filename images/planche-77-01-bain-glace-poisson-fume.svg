<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 77-01. Le bain de glace du poisson fumé</title>
<desc>En coupe, une chaudière large remplie de glace et d’eau ; les glaçons flottent à la surface. Un seau plus petit est posé debout dedans. Au fond du seau, une claie de bâtons tient le paquet de poisson hors de son jus ; le poisson fumé est roulé dans du papier. L’eau du bain monte plus haut que le dessus du poisson. Le couvercle est posé sur le seau, sans être vissé.</desc>
