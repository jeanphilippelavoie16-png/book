<text x="56" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">glaçons qui flottent : recharger chaque jour</text>
<text x="50" y="391" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">6</text>
<text x="56" y="391" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">surface de l’eau, plus haute que le paquet</text>
