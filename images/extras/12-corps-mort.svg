<svg xmlns="http://www.w3.org/2000/svg" width="340" height="413" viewBox="0 0 340 413" role="img">
<title>Planche 12, en plus. Le corps mort</title>
<desc>Le corps mort qui tient un cordon de la tente dans la neige, en deux vues. Vu de dessus, avant de remplir : un trou un peu plus long que la perche, creusé dans la neige ; au fond, une perche d’environ 1 m couchée en travers du cordon ; le cordon est noué au milieu de la perche et part vers la tente. En coupe, une fois rempli : la perche vue par le bout, au fond du trou ; le trou rempli de neige bien tassée jusqu’à la surface ; le cordon remonte dans la neige tassée jusqu’au bord du trou, du côté de la tente, puis en biais au-dessus de la neige vers la tente. Une flèche rouge, vers le bas, sur le trou : tasser la neige.</desc>
<defs>
<pattern id="h-neige" width="8" height="8" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="0.7" fill="#1A1A1A" stroke="none"/><circle cx="6" cy="6" r="0.7" fill="#1A1A1A" stroke="none"/></pattern>
<marker id="fl-r" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9 Z" fill="#9B2C1E" stroke="#9B2C1E" stroke-width="1" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="0" width="340" height="413" fill="#FFFFFF"/>
<text x="22" y="38" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#1A1A1A">Avant de remplir, vu de dessus</text>
<g transform="translate(22 46)" data-vue="plan">
