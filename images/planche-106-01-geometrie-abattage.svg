<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 106-01 — La géométrie d’abattage</title>
<desc>À gauche, le pied d’un arbre coupé dans l’axe de chute, l’arbre tombant vers la gauche : l’entaille de direction du côté de la chute, un trait horizontal et un trait oblique qui se rejoignent à la pointe, profonde d’au moins le tiers du diamètre et ouverte d’au moins 45 degrés ; du côté opposé, le trait d’abattage, horizontal, plus haut d’au moins 25 mm que le plancher de l’entaille, arrêté avant la pointe ; entre les deux, la charnière, environ un dixième du diamètre, hachurée. À droite, la souche vue de dessus au niveau des traits : la charnière est une bande de même épaisseur d’un bord à l’autre du tronc, et l’arbre tombe d’équerre avec elle, du côté de l’entaille.</desc>
