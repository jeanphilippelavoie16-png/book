<text x="40" y="285" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 68-06 — La caisse de sel du caveau.</text>
<text x="50" y="310" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="56" y="310" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">caisse de bouleau ou de tremble</text>
<text x="50" y="327" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="56" y="327" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">fond à lattes espacées</text>
<text x="50" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
