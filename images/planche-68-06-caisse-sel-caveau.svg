<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 68-06 — La caisse de sel du caveau</title>
<desc>Coupe d’une caisse de bois dont le fond est fait de lattes espacées, posée sur deux tasseaux dans un plat qui recueille le liquide. Deux couches de morceaux épais d’une main, chacun noyé dans le sel sans toucher son voisin, avec du sel au fond et sur le dessus, pressés par une planche et une pierre.</desc>
