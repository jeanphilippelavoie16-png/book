<svg xmlns="http://www.w3.org/2000/svg" width="340" height="413" viewBox="0 0 340 413" role="img">
<title>Planche 103-05 — La coupe en spirale</title>
<desc>Vue de dessus d’une peau ronde en cours de coupe : la lanière déjà coupée se détache du bord et traîne en boucle, le couteau travaille au bord extérieur, et le tracé qui reste à couper tourne vers le centre en gardant partout la même largeur.</desc>
