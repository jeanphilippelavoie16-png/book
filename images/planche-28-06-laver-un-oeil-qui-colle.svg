<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 28-06 — Laver un œil qui colle</title>
<desc>À gauche, un bol d’eau bouillie refroidie et deux boules de coton neuves, une par œil. À droite, une tête de profil : un coton posé sur l’œil, et sous l’œil une flèche qui va du coin du nez vers le coin extérieur, vers l’oreille. Le second coton du bol est pour l’autre œil.</desc>
