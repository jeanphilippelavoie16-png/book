<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 29-09 — Le piège à glaires</title>
<desc>À gauche, en coupe : un petit pot de verre fermé par un bouchon percé de deux trous. Deux tubes fins et souples traversent le bouchon. Le tube long descend presque jusqu’au fond du pot ; dehors, il remonte, passe par-dessus et redescend, et son bout entre dans la bouche du bébé, 100 millimètres au plus. Le tube court s’arrête juste sous le bouchon ; dehors, il part vers l’aide, qui aspire par son bout. L’air va du bébé au pot par le tube long, puis du pot à l’aide par le tube court ; une goutte de glaires tombe du tube long dans la flaque au fond du pot. À droite, le bouchon seul, vu de trois quarts, ses deux trous sur le dessus, et chaque tube au-dessus de son trou, dans son axe, prêt à y être enfoncé serré.</desc>
