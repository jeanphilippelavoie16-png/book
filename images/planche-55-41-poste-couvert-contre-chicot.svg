<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 55-41. Le poste couvert contre un chicot</title>
<desc>Deux vues. De face : un chicot cassé en haut ; devant lui, une petite cabane de bouts de bois plantés serrés en demi-cercle, appuyés contre le tronc, couverte de plaques d’écorce jusque sur le chicot ; une seule ouverture basse au milieu, encadrée de deux bâtons et d’un linteau, l’intérieur dans l’ombre ; un collet tenu ouvert dans l’ouverture ; une plume pendue à un fil sous un moignon de branche du chicot. De dessus, le toit enlevé : le chicot, un fer à cheval de piquets qui part du tronc et s’ouvre devant, l’appât au fond contre le tronc, le collet à l’entrée, et la flèche du seul chemin par où la bête entre.</desc>
