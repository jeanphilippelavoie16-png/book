<text x="40" y="319" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 55-41. Le poste couvert contre un chicot.</text>
<text x="50" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">1</text>
<text x="56" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">un chicot</text>
<text x="50" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">2</text>
<text x="56" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">écorce par-dessus, en bardeaux</text>
<text x="50" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">3</text>
<text x="56" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">bouts de bois plantés serrés</text>
<text x="50" y="395" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">4</text>
<text x="56" y="395" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">l’appât au fond</text>
<text x="362" y="344" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">5</text>
<text x="368" y="344" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">plume ou métal clair, au fil</text>
<text x="362" y="361" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">6</text>
<text x="368" y="361" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">une seule ouverture</text>
<text x="362" y="378" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">7</text>
<text x="368" y="378" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">le collet, tenu ouvert</text>
</svg>