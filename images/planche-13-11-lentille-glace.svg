<svg xmlns="http://www.w3.org/2000/svg" width="340" height="413" viewBox="0 0 340 413" role="img">
<title>Planche 13-11. La lentille de glace</title>
<desc>Deux vues. En haut, le disque de glace vu par la tranche, plus épais au centre qu’au bord, la paume nue posée à plat dessus qui le frotte d’avant en arrière, et le même disque retourné pour frotter l’autre côté. En bas, le soleil en haut à gauche : les rayons parallèles arrivent sur le disque, tenu par le bout entre le pouce, dessus, et l’index replié, dessous, la main qui vient de la droite et l’avant-bras couché sur une bûche ; le disque, vu de biais, est perpendiculaire aux rayons, et le cône de lumière part de sa face de l’autre côté, passe sous l’avant-bras et se resserre jusqu’à un petit point sur une cible sombre posée au sol, qui fume.</desc>
