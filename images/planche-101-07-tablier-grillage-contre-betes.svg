<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 101-07 — Le tablier de grillage contre les bêtes qui creusent</title>
<desc>Au pied du mur du poulailler ou du clapier, le grillage descend le long du mur, crampé jusqu’en bas, se plie à angle droit et se couche à plat vers l’extérieur sur au moins 30 cm, sous au moins 5 cm de terre ou de gravier ; sur le roc, des pierres plates à touche-touche le tiennent ; deux restes de grillage se cousent l’un à l’autre au fil de fer.</desc>
