<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 109-43. Rouler une bille à la corde double</title>
<desc>Monter une bille dans une boîte de camion sans la lever. De profil : un madrier en rampe du sol au plancher de la boîte, amarré en haut ; une corde frappée sur un point fixe du plancher descend le long de la rampe, passe sous la bille, fait le tour par le bas de la pente et remonte par-dessus ; on tire le bout remonté et la bille roule sur elle-même en montant, deux fois moins vite qu’on tire. De face, depuis le bas de la rampe : deux madriers, la bille couchée en travers, une corde par madrier, les deux tirées ensemble pour que la bille ne se mette pas en travers.</desc>
