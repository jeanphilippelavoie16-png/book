<path d="M302 112 L302 208" fill="none" stroke="#1A1A1A" stroke-width="1.4"/>
<path d="M158 208 L158 240 L238 240 L238 208" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-dasharray="7 4" stroke-linejoin="round"/>
<path d="M196 208 L196 184" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
<path d="M521 155 L576 196" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>

