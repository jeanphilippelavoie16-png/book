<circle cx="360" cy="76" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="360" y="80" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3</text>
<circle cx="140" cy="236" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="140" y="240" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">4</text>
<circle cx="68" cy="104" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="68" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">5</text>
<circle cx="68" cy="196" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="68" y="200" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">6</text>

<!-- couche 6 : cote, encadre danger, pied de planche -->
<text x="468" y="143" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">6 m (20 pi)</text>

<rect x="40" y="268" width="600" height="44" rx="2" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="58" y="288" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — le monoxyde ne se voit pas et ne se sent pas. Il ne monte pas au plafond :</text>
<text x="58" y="304" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">il se mêle à tout le volume. On s'endort au lieu de sortir.</text>

<text x="40" y="334" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 04-01 — La génératrice et sa distance aux ouvertures.</text>
<text x="40" y="352" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 la génératrice dehors : aucun mur dans le cercle de 6 m · 2 l'échappement dos aux</text>
<text x="40" y="368" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">portes, fenêtres et prises d'air · 3 jamais dans le garage, même la porte grande</text>
<text x="40" y="384" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">ouverte · 4 jamais sous la galerie ni sous un auvent · 5 jamais dans le tambour</text>
<text x="40" y="400" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">d'entrée · 6 jamais dans la remise, si loin soit-elle</text>
</svg>
