<circle cx="560" cy="94" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="560" y="98" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1</text>
