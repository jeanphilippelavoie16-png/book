<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>Planche 04-01 — La génératrice et sa distance aux ouvertures</title>
<desc>Vue de dessus. Une maison avec son garage attenant, sa galerie couverte, son tambour d'entrée et une remise détachée au fond de la cour. Un cercle de six mètres de rayon est tracé autour de la génératrice posée dehors sur le sol dégagé : aucun mur n'entre dans ce cercle, et l'échappement est tourné dos au bâtiment. Quatre emplacements sont barrés d'une croix parce qu'ils ont un toit au-dessus : dans le garage, sous la galerie, dans le tambour d'entrée et dans la remise, celle-ci pourtant bien au-delà des six mètres.</desc>
<defs>
<marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>

