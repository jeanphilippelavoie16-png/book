<path d="M302 208 L406 208" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>

<path d="M110 128 L142 128" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>
