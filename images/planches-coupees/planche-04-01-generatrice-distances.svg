<path d="M110 160 L142 160" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linecap="round"/>

<path d="M70 216 L122 216 L122 228" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M122 244 L122 256 L70 256 L70 216" fill="none" stroke="#1A1A1A" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>

