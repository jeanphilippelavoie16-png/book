<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440" role="img">
<title>Planche 83-01 — La zone de sécurité à l'abattage et les deux chemins de repli</title>
<desc>Vue de dessus. La souche est au centre. L'arbre couché est dessiné dans la direction de chute choisie, vers la droite ; sa longueur, ici 20 m, est cotée. Autour de la souche, la zone de sécurité à vider avant la première coupe est un cercle de 22,5 m de rayon, qui déborde l'arbre couché. Un arc plus lointain marque les 45 m à garder entre deux abatteurs qui travaillent en même temps. Un petit cercle en pointillé montre où tombe un recul de 7,5 m : sous le tronc de l'arbre couché. Les deux chemins de repli partent de la souche vers l'arrière, chacun à 45 degrés de l'axe de chute.</desc>

<defs>
<marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1A1A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="0" y="0" width="680" height="440" fill="#FFFFFF"/>

<!-- couche 1 : contour extérieur — la zone de sécurité -->
<circle cx="270" cy="162" r="117" fill="none" stroke="#1A1A1A" stroke-width="2.4"/>

<!-- couche 2 : contours internes — l'arbre couché, les chemins de repli, l'axe de chute -->
<line x1="270" y1="162" x2="374" y2="162" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round"/>
<line x1="270" y1="162" x2="192.2" y2="84.2" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<line x1="270" y1="162" x2="192.2" y2="239.8" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>
<line x1="396" y1="162" x2="426" y2="162" fill="none" stroke="#1A1A1A" stroke-width="1.4" stroke-linecap="round" marker-end="url(#fl)"/>

<!-- couche 3 : détails — cime, rayon de 7,5 m, arc de 45 m, angles, cotes -->
<path d="M270 162 L298 145 L374 162 L298 179 Z" fill="none" stroke="#1A1A1A" stroke-width="0.7" stroke-linejoin="round"/>
<path d="M292 162 L286 152.3 M292 162 L286 171.7 M310 162 L304 146.3 M310 162 L304 177.7 M330 162 L324 150.8 M330 162 L324 173.2 M350 162 L344 155.3 M350 162 L344 168.7" fill="none" stroke="#1A1A1A" stroke-width="0.7" stroke-linecap="round"/>

<circle cx="270" cy="162" r="39" fill="none" stroke="#1A1A1A" stroke-width="0.7" stroke-dasharray="5 3"/>
<path d="M480.6 60 A234 234 0 0 1 480.6 264" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>

<line x1="270" y1="162" x2="153" y2="162" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
<path d="M214 162 A56 56 0 0 1 230.4 122.4" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<path d="M214 162 A56 56 0 0 0 230.4 201.6" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<text x="198" y="195" text-anchor="end" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">45°</text>

<circle cx="270" cy="162" r="3" fill="#1A1A1A"/>

<line x1="270" y1="181" x2="270" y2="282" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="309" y1="181" x2="309" y2="224" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="374" y1="181" x2="374" y2="246" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="387" y1="181" x2="387" y2="264" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="504" y1="181" x2="504" y2="282" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>

<line x1="270" y1="222" x2="309" y2="222" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="270" y1="240" x2="374" y2="240" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="270" y1="258" x2="387" y2="258" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>
<line x1="270" y1="276" x2="504" y2="276" fill="none" stroke="#1A1A1A" stroke-width="0.7"/>

<text x="289.5" y="216" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">7,5 m</text>
<text x="322" y="234" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">20 m</text>
<text x="328.5" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">22,5 m</text>
<text x="440" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">45 m</text>

<!-- couche 4 : lignes de rappel -->
<line x1="444.75" y1="139.34" x2="416" y2="160" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
<line x1="250.67" y1="98.4" x2="230" y2="119" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
<line x1="403.78" y1="120.51" x2="370" y2="156" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
<line x1="143.53" y1="86.95" x2="167" y2="102" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
<line x1="535" y1="110" x2="500" y2="110" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>
<line x1="312.98" y1="111.47" x2="299" y2="133" fill="none" stroke="#1A1A1A" stroke-width="0.5" stroke-dasharray="3 2.5"/>

<!-- couche 5 : renvois numérotés -->
<circle cx="452" cy="134" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="452" y="138" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1</text>
<circle cx="257" cy="92" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="257" y="96" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">2</text>
<circle cx="410" cy="114" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="410" y="118" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3</text>
<circle cx="136" cy="82" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="136" y="86" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">4</text>
<circle cx="544" cy="110" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="544" y="114" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">5</text>
<circle cx="318" cy="104" r="9" fill="#FFFFFF" stroke="#1A1A1A" stroke-width="1.4"/>
<text x="318" y="108" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">6</text>

<!-- couche 6 : encadré danger et pied de planche -->
<rect x="40" y="294" width="600" height="42" rx="2" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="58" y="314" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — la zone ne se rouvre pas quand l'arbre touche le sol. Ce que la cime a arraché</text>
<text x="58" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">en descendant tombe après l'arbre : 30 secondes d'attente avant de revenir.</text>

<text x="40" y="356" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 83-01 — La zone de sécurité à l'abattage et les deux chemins de repli.</text>
<text x="40" y="374" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 l'axe de chute, décidé avant de toucher à la scie · 2 deux chemins de repli, à 45° vers</text>
<text x="40" y="390" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">l'arrière, dégagés sur au moins 2 m (6 pi) · 3 l'arbre couché : la zone vaut au moins sa</text>
<text x="40" y="406" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">longueur · 4 la zone vidée avant le premier trait, jamais moins de 22,5 m · 5 45 m entre</text>
<text x="40" y="422" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">deux abatteurs qui travaillent en même temps · 6 à 7,5 m, on est debout dans la zone de chute</text>
</svg>
