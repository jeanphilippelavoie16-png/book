<svg xmlns="http://www.w3.org/2000/svg" width="680" height="900" viewBox="0 0 680 900" role="img">
<title>Planche 16b-01 — Les trois zones de dégagement autour du bâtiment</title>
<desc>Vue de dessus. Le bâtiment et sa galerie au centre, entourés de trois limites de dégagement mesurées depuis le bâtiment, galerie comprise : 1,5 m, 10 m et 30 m. La bande de 0 à 1,5 m est dégagée jusqu'au sol minéral ; celle de 1,5 à 10 m garde ses arbres mais ne reçoit aucun entreposage ; la corde de bois et la bouteille de propane sont au-delà de 10 m, la bouteille avec 3 m de végétation dégagée tout autour. Entre 10 et 30 m, les conifères sont éclaircis. En bas, un détail vu de côté : deux conifères dont les branches sont coupées jusqu'à 2 m du sol et dont les cimes sont séparées de 3 m.</desc>

