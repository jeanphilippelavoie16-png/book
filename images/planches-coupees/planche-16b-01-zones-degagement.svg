<rect x="40" y="718" width="600" height="48" rx="2" fill="none" stroke="#9B2C1E" stroke-width="2"/>
<text x="58" y="739" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">Danger — un réservoir de propane contre un mur qui chauffe monte en pression et</text>
<text x="58" y="757" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#9B2C1E">relâche du gaz. Plus lourd que l'air, il coule au sol et attend sous la galerie.</text>

<text x="40" y="794" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#1A1A1A">Planche 16b-01 — Les trois zones de dégagement autour du bâtiment.</text>
<text x="40" y="814" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">1 de 0 à 1,5 m, galerie comprise : sol minéral · 2 de 1,5 à 10 m : rien d'entreposé</text>
<text x="40" y="832" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">3 bois de chauffage et matériaux à plus de 10 m · 4 propane à plus de 10 m, 3 m dégagés autour</text>
<text x="40" y="850" font-family="Georgia, 'Times New Roman', serif" font-size="12" fill="#1A1A1A">5 de 10 à 30 m : conifères espacés d'au moins 3 m · 6 branches coupées jusqu'à 2 m du sol</text>
</svg>
