<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 67-14. La pesée par substitution</title>
<desc>Deux fois le même fléau de chalet, cadré pareil. D’abord, la viande dans le plateau de toile de gauche, et du sable versé d’une boîte dans celui de droite jusqu’à l’équilibre. Ensuite, la viande ôtée et posée sur la table ; dans le même plateau de gauche, des sachets étalons marqués 1 kg et 500 g jusqu’au même équilibre ; le sable de droite n’a pas bougé. Ce qu’on a mis dans le plateau de gauche pèse ce que pesait la viande, que les deux bras soient égaux ou non.</desc>
