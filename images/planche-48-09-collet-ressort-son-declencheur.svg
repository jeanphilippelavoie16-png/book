<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 48-09 — Le collet à ressort et son déclencheur</title>
<desc>Un jeune bouleau plié au-dessus d’une piste de lièvre, retenu par un bâtonnet coincé sous le crochet taillé dans un piquet planté au bord de la piste ; la boucle du collet pend du bâtonnet, son bas à la hauteur du menton du lièvre. À droite, le crochet et le bâtonnet agrandis : le dessus du bâtonnet bute sous l’épaulement, son bout repose sur le pan incliné.</desc>
