<svg xmlns="http://www.w3.org/2000/svg" width="680" height="826" viewBox="0 0 680 826" role="img">
<title>Planche 106-10a — La sciotte à cadre</title>
<desc>Une scie à cadre montée sur une lame seule. De face : deux montants de bois franc, de la longueur de l’avant-bras, debout de chaque côté ; une traverse horizontale à mi-hauteur entre eux ; la lame tendue entre les pieds, dents en bas, chaque bout logé dans un trait de scie du pied et tenu par un clou en travers ; en haut, une corde en plusieurs tours d’une tête à l’autre, logée dans une encoche au dos de chaque tête, tordue au milieu par un bâton passé dans les tours, dont le bout descend s’appuyer contre la traverse. Des flèches montrent les têtes qui se rapprochent quand la corde raccourcit, et les pieds qui s’écartent en tendant la lame : la traverse sert de pivot. En bas à gauche, le pied coupé en travers au clou : le trait de scie, la lame dedans, le clou qui traverse les deux joues et la lame. En bas à droite, vue de dessus à mi-hauteur : le bout de la traverse est encoché en fourche et chevauche le montant, et le bout du bâton s’appuie contre le devant de la traverse.</desc>
