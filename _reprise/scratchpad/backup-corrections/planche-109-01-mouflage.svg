<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 109-01 — Palan de corde à quatre brins</title>
<desc>Palan de corde fabriqué, quatre brins, pendu à une perche, vue de long, par une estrope. En haut, le moufle fixe : deux joues de bois, deux réas sur leurs axes, un œil au-dessus pour l'estrope et un ringot en dessous, à gauche, où le bout mort est frappé. En bas, le moufle mobile : deux réas, un œil en dessous qui porte un billot par une élingue. La corde part du ringot, passe sous le premier réa mobile, par-dessus le premier réa fixe, sous le second réa mobile, par-dessus le second réa fixe, et ressort en brin menant, droit et en oblique jusqu'à la main qui tire, hors de l'aplomb de la charge. Quatre brins aboutissent au moufle mobile. La main sur le brin menant donne l'échelle. À droite, en détail, un moufle coupé par l'axe d'un réa : deux joues de bois, le réa de bois entre elles avec un jeu de chaque bord, l'axe d'acier plein qui traverse les trois, tête d'un bord et écrou de l'autre, et la corde couchée dans une gorge à fond rond, les joues débordant du réa et de la corde.</desc>
