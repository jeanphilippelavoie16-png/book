<style>
/* =====================================================================
   LE GRAND LIVRE DU CHALET — direction 2 : le grand guide de référence
   Page Blurb 8 × 10 po, PDF 8,125 × 10,25 po (fond perdu 0,125 po en tête,
   en pied et au petit fond ; aucun au grand fond).
   Grille (recto ; le verso est en miroir) :
     grand fond 17 | texte 151 (2 × 73 + 5) | 3,5 | marge 19 | petit fond 12,7  = 203,2 mm
     tête 19,05 | 49 lignes de 12,5 pt = 216,07 | pied 18,88                         = 254 mm

   ===================================================================== */
:root{
  --red:#9B2C1E;           /* le seul rouge : le danger, et rien d'autre */

}

html,body{ margin:0; padding:0; background:#fff }
body{ -webkit-print-color-adjust:exact; print-color-adjust:exact; color:#000;
  font-family:var(--serif); font-size:10pt; line-height:var(--lh);

  text-rendering:geometricPrecision }

/* ---------- la page ---------- */

.trim{ position:absolute; top:var(--bleed); width:203.2mm; height:254mm }
.recto .trim{ left:0 } .verso .trim{ left:var(--bleed) }
.m-trim .page, .m-contact .page, .m-one .page{ width:203.2mm; height:254mm }
.m-trim .trim, .m-contact .trim, .m-one .trim{ top:0; left:0 }

.flow{ position:absolute; top:19.05mm; width:151mm; height:calc(49 * var(--lh));

<script type="module">
const TITRES = /*TITRES*/;
const CHAP = "65", CHTITRE = "Fumage à froid";
const LH = 12.5 * 96 / 72;
const params = new URLSearchParams(location.search);
const MODE = params.get('mode') || 'print';

/* ---------- typographie française (Québec) ---------- */
function typo(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes){
    if (n.parentElement.closest('script,style')) continue;
    let s = n.nodeValue;
    s = s.replace(/'/g, '’');
    s = s.replace(/«[   ]*/g, '« ').replace(/[   ]*»/g, ' »');
    s = s.replace(/[   ]+([;:!?])(?=[\s)\]»]|$)/g, ' $1');
    s = s.replace(/(\d)[  ](?=\d{3}(?!\d))/g, '$1 ');
    s = s.replace(/(\d)[  ](°C|%|kg|g|mm|cm|m|km|h|L|cc|ppm|pi|po|min|j)(?![\wÀ-ÿ])/g, '$1 $2');
    s = s.replace(/(\d)[ ](?=[A-Za-zÀ-ÿ])/g, '$1 ');
    s = s.replace(/(^|[\s(≤≥=  ])-(?=\d)/g, '$1−');
    s = s.replace(/ — /g, ' — ');
    n.nodeValue = s;
  }
}

/* ---------- césure : motifs français, 3 lettres minimum de part et d'autre ---------- */
function hyphenate(root, hy){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = []; while (w.nextNode()) nodes.push(w.currentNode);
  for (const n of nodes){
    const p = n.parentElement;
    if (p.closest('h1,h2,h3,.kicker,.ref,.av,.som,.lieu,.dz-head,.rh,.folio,.n,th,.gl,.pp-k,.t-mat td:nth-child(2),.t-mat td:nth-child(4),svg,script,style')) continue;
    let s = hy(n.nodeValue);
    s = s.replace(/[A-Za-zÀ-ÿœŒ­]+/g, word => {
      if (!word.includes('­')) return word;
      const parts = word.split('­'), total = word.replace(/­/g, '').length;
      let out = parts[0], before = parts[0].length;
      for (let i = 1; i < parts.length; i++){
        const after = total - before;
        out += (before >= 3 && after >= 3 ? '­' : '') + parts[i];
        before += parts[i].length;
      }
      return out;
    });
    n.nodeValue = s;
  }
}

/* ---------- pagination ---------- */
function over(flow){
  const fr = flow.getBoundingClientRect();
  for (const c of flow.children){
    if (c.matches(SPAN)){                       // un bloc à cheval : il ne peut déborder que par le pied
      if (c.getBoundingClientRect().bottom > fr.bottom + 1.5) return true;
      continue;
    }
    const r = document.createRange(); r.selectNodeContents(c);
    for (const x of [...r.getClientRects(), ...c.getClientRects()]){
      if (x.width < .5 && x.height < .5) continue;
      if (x.left > fr.right - 2 || x.bottom > fr.bottom + 1.5) return true;
    }
  }
  return false;
}
const SPAN = 'h2.sec, header.ouv, .lede, .tblw, .dz';
function snap(flow){
  for (const el of flow.querySelectorAll(':scope > ' + SPAN.split(', ').join(', :scope > '))){
    if (el.dataset.pb0 === undefined) el.dataset.pb0 = parseFloat(getComputedStyle(el).paddingBottom) || 0;
    el.style.paddingBottom = el.dataset.pb0 + 'px';
    const cs = getComputedStyle(el);
    const h = el.getBoundingClientRect().height + parseFloat(cs.marginTop);
    const t = Math.ceil(h / LH - 0.02) * LH;
    el.style.paddingBottom = (parseFloat(el.dataset.pb0) + (t - h)) + 'px';
  }
}
function fits(flow){ snap(flow); return !over(flow); }
function markTop(flow){
  flow.querySelectorAll(':scope > .top').forEach(e => e.classList.remove('top'));
  const f = flow.firstElementChild;
  if (f && f.matches('h2.sec, .dz')) f.classList.add('top');
}
const txtOf = el => el.matches('p') ? el : el.querySelector('.txt');
function bounds(t){
  const res = [], w = document.createTreeWalker(t, NodeFilter.SHOW_TEXT);
  while (w.nextNode()){ const n = w.currentNode, v = n.nodeValue;
    for (let i = 0; i < v.length; i++) if (v[i] === ' ') res.push([n, i + 1]); }
  return res;
}
function splitText(flow, el, box){
  const t = txtOf(el); if (!t) return false;
  const b = bounds(t); const MIN = 9;
  if (b.length < MIN * 2) return false;
  const clone = el.cloneNode(true), ct = txtOf(clone);
  (box || flow).appendChild(clone);
  const setK = k => { const r = document.createRange(); r.setStart(t, 0); r.setEnd(b[k][0], b[k][1]);
    ct.innerHTML = ''; ct.appendChild(r.cloneContents()); };
  let lo = MIN, hi = b.length - MIN, best = -1;
  clone.classList.add('split-a');
  while (lo <= hi){ const mid = (lo + hi) >> 1; setK(mid); if (fits(flow)){ best = mid; lo = mid + 1; } else hi = mid - 1; }
  if (best < 0){ clone.remove(); return false; }
  setK(best);
  // une dernière ligne justifiée trop courte s'étire en trous : on recule d'une ligne
  const last = () => { clone.classList.remove('split-a'); const r = document.createRange(); r.selectNodeContents(ct);
    const rs = [...r.getClientRects()].filter(x => x.width > .5);
    if (!rs.length){ clone.classList.add('split-a'); return { n: 0, w: 1 }; }
    const fl = flow.getBoundingClientRect().left, cw = 78 * 96 / 25.4;
    const key = x => Math.floor((x.left - fl + 2) / cw) * 100000 + Math.round((x.top + x.height / 2) / 8);
    const tops = new Set(rs.map(key)); const mx = Math.max(...tops);
    const colL = Math.min(...rs.filter(x => key(x) === mx).map(x => x.left));
    const w = rs.filter(x => key(x) === mx).reduce((a, x) => Math.max(a, x.right), 0) - colL;
    clone.classList.add('split-a'); return { n: tops.size, w: w / (73 * 96 / 25.4) }; };
  const L0 = last();
  if (L0.w < .62){
    let k = best;
    while (k > MIN){ setK(k - 1); if (last().n < L0.n) { best = k - 1; break; } k--; }
    setK(best);
  }
  const r = document.createRange(); r.setStart(t, 0); r.setEnd(b[best][0], b[best][1]); r.deleteContents();
  el.classList.add('split-b');
  return true;
}
function splitTable(flow, w){
  const tbl = w.querySelector('table'), body = tbl.tBodies[0];
  if (body.rows.length < 3) return false;
  const cw = w.cloneNode(false), ct = tbl.cloneNode(false), tb = document.createElement('tbody');
  ct.appendChild(tbl.tHead.cloneNode(true)); ct.appendChild(tb); cw.appendChild(ct); flow.appendChild(cw);
  let n = 0;
  while (body.rows.length){
    const r = body.rows[0]; tb.appendChild(r);
    if (!fits(flow)){ body.insertBefore(r, body.firstChild); break; }
    n++;
  }
  if (n < 2){ while (tb.lastChild) body.insertBefore(tb.lastChild, body.firstChild); cw.remove(); return false; }
  if (!body.rows.length){ w.remove(); return true; }  // tout le tableau a tenu
  cw.classList.add('split-a'); w.classList.add('split-b');
  if (!tbl.caption){ const c = tbl.createCaption(); c.textContent = '(suite)'; }
  return true;
}
function splitDz(flow, dz){
  const body = dz.querySelector('.dz-body');
  const c = dz.cloneNode(false); c.appendChild(dz.querySelector('.dz-head').cloneNode(true));
  const cb = document.createElement('div'); cb.className = 'dz-body'; c.appendChild(cb);
  const s = document.createElement('div'); s.className = 'dz-suite'; s.textContent = 'suite page suivante'; c.appendChild(s);
  c.classList.add('open-b'); flow.appendChild(c);
  let moved = 0;
  while (body.firstElementChild){
    const p = body.firstElementChild; cb.appendChild(p);
    if (!fits(flow)){ body.insertBefore(p, body.firstChild); break; }
    moved++;
  }
  if (body.firstElementChild && splitText(flow, body.firstElementChild, cb)) moved++;
  if (!moved){ c.remove(); return false; }
  if (!body.firstElementChild){ c.classList.remove('open-b'); s.remove(); dz.remove(); return true; }
  dz.classList.add('cont');
  return true;
}
function trySplit(flow, el){
  if (el.matches('p, .li, .step, .step-sub, .step-p')) return splitText(flow, el) ? 'part' : 'none';
  if (el.matches('.tblw')){ const had = el.isConnected; const r = splitTable(flow, el); return r ? (el.isConnected ? 'part' : 'all') : 'none'; }
  if (el.matches('.dz')){ const r = splitDz(flow, el); return r ? (el.isConnected ? 'part' : 'all') : 'none'; }
  return 'none';
}
function fillPage(flow, sink){
  const rest = document.createElement('div');
  while (flow.lastElementChild) rest.insertBefore(flow.lastElementChild, rest.firstChild);
  while (rest.firstElementChild){
    const el = rest.firstElementChild;
    flow.appendChild(el); markTop(flow);
    if (fits(flow)) continue;
    rest.insertBefore(el, rest.firstChild); markTop(flow);
    const r = trySplit(flow, el);
    if (r === 'all') continue;
    break;
  }
  // un titre ne reste jamais seul en pied de page
  let last = flow.lastElementChild;
  while (last && last.matches('h2, h3, .kicker')){ rest.insertBefore(last, rest.firstChild); last = flow.lastElementChild; }
  snap(flow);
  while (rest.lastElementChild) sink.insertBefore(rest.lastElementChild, sink.firstChild);
}
function paginate(){
  const chains = {};
  document.querySelectorAll('.page[data-chain]').forEach(p => (chains[p.dataset.chain] ||= []).push(p));
  for (const pages of Object.values(chains)){
    for (let i = 0; i < pages.length; i++){
      const flow = pages[i].querySelector('.flow');
      const sink = pages[i + 1] ? pages[i + 1].querySelector('.flow') : document.createElement('div');
      fillPage(flow, sink);
    }
  }
}

/* ---------- après la pagination : marge, titres courants, section 9 ---------- */
function rel(el, trim){ const a = el.getBoundingClientRect(), t = trim.getBoundingClientRect(); return { top: a.top - t.top, bottom: a.bottom - t.top, left: a.left - t.left, right: a.right - t.left }; }
const PX = 96 / 25.4;
function placeNotes(page){
  const trim = page.querySelector('.trim'), mcol = page.querySelector('.mcol'), flow = page.querySelector('.flow');
  if (!mcol || !flow) return;
  const fb = rel(flow, trim).bottom;
  const obst = [];
  page.querySelectorAll('.flow .sn, .flow .dzmark, .flow .bignum').forEach(e => { const r = rel(e, trim); obst.push([r.top - 2, r.bottom + 5]); });
  page.querySelectorAll('.flow h2.s9').forEach(e => { const r = rel(e, trim); obst.push([r.top - 2, r.bottom + 4]); });
  page.querySelectorAll('.flow .tblw').forEach(e => { const r = rel(e, trim); obst.push([r.top, r.bottom + 4]); });
  const items = [], seen = new Set();
  page.querySelectorAll('.flow .ref, .flow .anc').forEach(e => {
    if (e.closest('.tblw')) return;
    const rs = e.getClientRects(); if (!rs.length) return;
    const top = rs[0].top - trim.getBoundingClientRect().top;
    if (top > fb) return;
    if (e.classList.contains('ref')){
      const n = e.dataset.ch; if (n === CHAP || seen.has(n) || !TITRES[n]) return; seen.add(n);
      items.push({ top, html: `<b>${n}</b><i>${TITRES[n]}</i>`, cls: 'rf' });
    } else {
      items.push({ top: top - 3, html: `<span class="v">${e.dataset.v}</span><span class="l">${e.dataset.l}</span>`, cls: 'fg' });
    }
  });
  items.sort((a, b) => a.top - b.top);
  let floor = 0;
  for (const it of items){
    const d = document.createElement('div'); d.className = 'mn ' + it.cls; d.innerHTML = it.html; mcol.appendChild(d);
    typo(d);
    const h = d.getBoundingClientRect().height;
    let y = Math.max(it.top, floor);
    let moved = true;
    while (moved){ moved = false; for (const [a, b] of obst) if (y < b && y + h > a){ y = b; moved = true; } }
    if (y + h > fb + 2){ d.remove(); continue; }
    d.style.top = y + 'px'; floor = y + h + 5;
  }
}
function heads(){
  let sec = null;
  const pages = [...document.querySelectorAll('#book .page')];
  for (const p of pages){
    const flow = p.querySelector('.flow');
    let atTop = sec;
    if (flow){
      const f = flow.firstElementChild;
      if (f && f.matches('h2.sec')) atTop = { n: f.dataset.n, t: f.dataset.t };
      const hs = flow.querySelectorAll(':scope > h2.sec');
      if (hs.length){ const l = hs[hs.length - 1]; sec = { n: l.dataset.n, t: l.dataset.t }; }
    }
    if (p.dataset.sec) atTop = { n: '5', t: 'Procédure' };
    p._sec = atTop;
    const fo = p.querySelector('.folio'); if (fo && !fo.textContent) fo.textContent = p.dataset.folio;
    const rh = p.querySelector('.rh');
    if (rh && !rh.innerHTML.trim()){
      const t = p.classList.contains('verso') ? CHTITRE : (atTop ? `${atTop.n} · ${atTop.t}` : CHTITRE);
      rh.innerHTML = `<span class="t">${t}</span><span class="cn">${CHAP}</span>`;
    }
    // section 9 : filet noir le long du texte, onglet noir au petit fond
    if (flow){
      const trim = p.querySelector('.trim');
      const h9 = flow.querySelector(':scope > h2.s9');
      const inS9 = h9 || (atTop && atTop.n === '9');
      if (inS9){
        const fr = rel(flow, trim);
        const start = h9 ? rel(h9, trim).bottom + 5 : fr.top + 2;
        const r = document.createRange(); r.selectNodeContents(flow);
        let end = start; for (const x of r.getClientRects()){ const b = x.bottom - trim.getBoundingClientRect().top; if (b > end && b <= fr.bottom + 2) end = b; }
        const bar = document.createElement('div'); bar.className = 'bar9';
        bar.style.top = start + 'px'; bar.style.height = (end - start) + 'px';
        bar.style.left = p.classList.contains('recto') ? (168 + 1.75) * PX - 1.3 + 'px' : (31.7 + 1.75) * PX - 1.3 + 'px';
        trim.appendChild(bar);
        const tab = document.createElement('div'); tab.className = 'tab9'; tab.textContent = '9';
        tab.style.top = `calc(var(--bleed) + 196mm)`;
        p.appendChild(tab);
      }
    }
  }
}

function arrange(){
  document.documentElement.classList.add('m-' + MODE);
  document.body.classList.add('m-' + MODE);
  if (MODE === 'contact'){
    const byF = f => document.querySelector(`.page[data-folio="${f}"]`);
    const sheet = document.createElement('div'); sheet.className = 'sheet';
    const spreads = [[null, 213, 'ouverture · 213'], [216, 217, 'matériel, procédure · 216–217'], [218, 219, 'procédure et planche · 218–219'],
                     [222, 223, 'danger, variante d’urgence · 222–223'], [null, 3, 'chapitre principal · tome 1, p. 3']];
    for (const [l, r, lab] of spreads){
      const s = document.createElement('div'); s.className = 'spread';
      const pp = document.createElement('div'); pp.className = 'pp2';
      for (const f of [l, r]){ const sl = document.createElement('div'); sl.className = 'slot' + (f === null ? ' blank' : ''); if (f !== null) sl.appendChild(byF(f)); pp.appendChild(sl); }
      const lb = document.createElement('div'); lb.className = 'lab'; lb.textContent = lab;
      s.appendChild(pp); s.appendChild(lb); sheet.appendChild(s);
    }
    document.getElementById('book').replaceChildren(sheet);
  }
  if (MODE === 'bleed'){
    const f = params.get('p');
    document.querySelectorAll('#book .page').forEach(p => { if (p.dataset.folio !== f) p.remove(); });
  }
  if (MODE === 'one'){
    const f = params.get('p');
    document.querySelectorAll('#book .page').forEach(p => { if (p.dataset.folio !== f) p.remove(); });
  }
}

async function main(){
  typo(document.getElementById('book'));
  let hy = null;
  try { const m = await import('https://cdn.jsdelivr.net/npm/hyphen@1.10.6/fr/+esm'); hy = (m.default || m).hyphenateSync; } catch(e){ console.warn('césure indisponible', e); }
  if (hy) hyphenate(document.getElementById('book'), hy);
  await document.fonts.ready;
  await Promise.all(['400 10pt "Source Serif 4"', '700 10pt "Source Serif 4"', 'italic 400 10pt "Source Serif 4"',
    'italic 600 11pt "Source Serif 4"', '600 15pt "Source Serif 4"', '300 25pt "Source Serif 4"',
    '600 9pt "Source Sans 3"', '700 9pt "Source Sans 3"', '500 7pt "Source Sans 3"', 'italic 500 7pt "Source Sans 3"'].map(f => document.fonts.load(f)));
  document.querySelectorAll('.plate-svg svg').forEach(deplierHachures);
  paginate();
  document.body.classList.remove('paginating');
  heads();
  document.querySelectorAll('#book .page').forEach(placeNotes);
  arrange();
  const rep = document.createElement('pre'); rep.id = 'rapport'; rep.style.display = 'none';
  rep.textContent = JSON.stringify([...document.querySelectorAll('.page')].map(p => ({ f: p.dataset.folio, over: p.querySelector('.flow') ? over(p.querySelector('.flow')) : null,
    words: p.querySelector('.flow') ? p.querySelector('.flow').innerText.replace(/­/g,'').split(/[\s  ]+/).filter(w => /[\p{L}\p{N}]/u.test(w)).length : null })));
  document.body.appendChild(rep);
  document.body.dataset.pret = '1';
}
main();
