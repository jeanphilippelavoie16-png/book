<body class="vA vB vC t5 lieu-c">
<div id="book"></div>
<template id="open"><header class="open"><div class="open-top"><span>Tome 5 · La forêt, le jardin et le chalet</span><span>Chapitre</span></div><div class="open-title"><div class="num">99</div><h1>Les façons de faire d’autrefois</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span class="on">Chalet</span><span>Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">Ce chapitre plante des choses qui mettent trois à cinq ans à rendre et qui rendent ensuite pendant des années — au moins huit à dix pour un gadellier, et un camerisier vit plus de trente ans : elles vont là où il y a de la terre, de l’herbe à faucher et une famille qui reviendra. La maison au village peut porter la rhubarbe, deux camerisiers et un gadellier dans la cour, et c’est une bonne idée tant que tout marche ; mais le pré, la talle, le fenil et la butte de maïs sont au chalet, parce que c’est lui qui finit par nourrir quand l’événement dure.</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Les façons d’autrefois font produire un terrain nordique sans engrais acheté ni machine : on plante une fois ce qui revient chaque année (arbustes fruitiers qui produisent des années et dont certains vivent plus de trente ans, rhubarbe, topinambour), on sème serré ce qui se protège mutuellement, on rajeunit la talle au lieu de la chercher ailleurs, et on fauche l’herbe pour que les bêtes passent l’hiver — rien de tout ça ne conserve : ça remplit le séchoir, le caveau et le fenil.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<p class="p0 lab kh"><strong class="runin">Le bon choix.</strong></p>
<p class="li"><strong>Maintenant, pendant que tout marche.</strong> Un camerisier donne quelques kilos par plant après trois ou quatre ans ; un pommier peut en mettre cinq avant sa première pomme ; un gadellier donne sa pleine récolte la troisième année ; un argousier fleurit sur du bois de trois ans. Ce qui n’est pas planté avant la crise ne produit pas pendant la crise. C’est la seule partie du livre où l’essentiel du travail se fait des années d’avance.</p>
<p class="li"><strong>Quand l’événement s’étire au-delà d’une saison.</strong> Le potager annuel (<span class="ref">ch. 95</span>) se ressème chaque printemps et meurt au premier gel ; une vivace est déjà en place au dégel, racines faites, et profite de la saison dès le premier jour.</p>
<p class="li"><strong>Quand il y a des bêtes, ou qu’il va y en avoir.</strong> Le lapin du <span class="ref">ch. 101</span> passe l’hiver sur du foin et du feuillage qu’on a coupés l’été. La chèvre, écartée au <span class="ref">ch. 101</span> tant que le foin n’est pas assuré, se décide ici, à la faux, en chiffres (<span class="ref">§5-G</span>).</p>
<p class="li"><strong>Sur un sol pauvre et acide.</strong> La rhubarbe pousse entre pH 5 et 6,8, la camerise entre 5 et 7, l’argousier entre 5,5 et 8,3 et sur des sols très pauvres, et le bleuet vit de l’acidité. Ce sont les plantes qui acceptent la pessière telle qu’elle est.</p>
<p class="li"><strong>En bord de mer.</strong> L’argousier tolère le sel et fixe son propre azote : c’est l’arbuste du talus battu par le vent du golfe.</p>
<p class="p0 lab kh"><strong class="runin">Le mauvais choix.</strong></p>
<p class="li"><strong>Pour les calories et le gras.</strong> Aucun arbuste ne donne de gras. Des fruits, de la vitamine C, du goût, oui ; de quoi passer l’hiver, non. Viande maigre seule, c’est le mal de caribou, mortel en quelques semaines, et une montagne de camerises n’y change rien (<span class="ref">ch. 19</span>, <span class="ref">ch. 72</span>).</p>
<p class="li"><strong>Les Trois Sœurs comme récolte de base.</strong> Même la variété de maïs la plus hâtive connue reste un pari de belle année sur la Côte-Nord (<span class="ref">§5-B</span>), et les deux autres sœurs aussi : le haricot gèle au premier froid, la courge d’hiver demande 120 à 135 jours (<span class="ref">ch. 98</span>, étapes 24 et 29). Les Trois Sœurs se tentent sous plastique ou contre le mur sud (<span class="ref">ch. 97</span>) ; elles ne se planifient pas comme la pomme de terre (<span class="ref">ch. 98</span>).</p>
<p class="li"><strong>Le feu dans une talle après la fonte de la neige en lisière, ou par temps sec.</strong> Le brûlage ancien marche au printemps humide ; le même feu en juillet est un feu de forêt (<span class="ref">§8</span>, <span class="ref">ch. 11</span>).</p>
<p class="li"><strong>Du foin pour une chèvre sans quelqu’un pour faucher, faner et rentrer chaque beau jour de l’été.</strong> Il en faut plusieurs centaines de kilos par bête (<span class="ref">§5-G</span>). Faute de bras, la chèvre reste écartée, et c’est le lapin et le foin d’arbre du <span class="ref">ch. 101</span> qui restent.</p>
<p class="p0 lab kh"><strong class="runin">Ce que chaque façon donne, et ce qu’elle coûte.</strong></p>
<table class="tspan"><colgroup><col style="width:14.0%"><col style="width:24.9%"><col style="width:28.8%"><col style="width:32.3%"></colgroup><thead><tr><th>Façon de faire</th><th>Ce qu’elle donne</th><th>Ce qu’elle demande</th><th>Où elle bute sur la Côte-Nord</th></tr></thead><tbody><tr><td class="c-item">Potager des habitants</td><td>Oignon, chou, navet d’hiver, citrouille, gadelle</td><td>Un jardin clos, du fumier, des semences</td><td>Rien, sauf la citrouille les étés frais</td></tr><tr><td class="c-item">Trois Sœurs</td><td>Maïs sec, haricot sec, courge, sur une même butte</td><td>Une variété de maïs très hâtive, de la chaleur, un plastique transparent ou un mur sud</td><td>Les trois sont des paris : le maïs faute de chaleur, le haricot qui gèle au premier froid, la courge d’hiver qui demande 120 à 135 jours (<span class="ref">ch. 98</span>, étapes 24 et 29)</td></tr><tr><td class="c-item">Jardin de poste nordique</td><td>Navet, chou, verdures de temps frais</td><td>Pente sud, rangs relevés, varech et poisson</td><td>Rien : il a été tenu plus au nord encore</td></tr><tr><td class="c-item">Arbustes et vivaces</td><td>Fruits de juin à septembre, rhubarbe, topinambour</td><td>Trois à cinq ans d’attente, deux variétés pour certains</td><td>Les gels de floraison, le lièvre, les oiseaux</td></tr><tr><td class="c-item">Talle rajeunie</td><td>Des bleuets gros et nombreux, sans rien planter</td><td>Une coupe ou un feu tous les deux ou trois ans</td><td>Le feu qui s’échappe</td></tr><tr><td class="c-item">Foin et pâture</td><td>L’hiver des bêtes</td><td>Une faux, du beau temps, des bras</td><td>Les étés pluvieux et le foin qui chauffe</td></tr></tbody></table>
<p class="p0 ri"><strong class="runin">Ce qui n’est pas dans ce chapitre.</strong> Le potager annuel, le sol, les billons et la toile anti-gel : <span class="ref">ch. 95</span>. Faire la terre — compost, fumier, cendre, varech, poisson, jachère : <span class="ref">ch. 96</span>. Les semis, la couche chaude, le châssis et la serre : <span class="ref">ch. 97</span>. La pomme de terre, les céréales à la main et les quantités pour un hiver : <span class="ref">ch. 98</span>. Garder ses semences : <span class="ref">ch. 100</span>. Les bêtes elles-mêmes, leur eau et leur abri : <span class="ref">ch. 101</span>. Les petits fruits sauvages et leurs quatre routes de conservation : <span class="ref">ch. 91</span>.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">Une vivace a déjà payé sa mise en place.</strong> Une annuelle doit germer dans une terre encore froide, faire ses racines, puis ses feuilles, puis ses fruits, le tout entre deux gels ; une vivace sort du dégel avec ses racines et ses réserves en place. C’est pour ça que la camerise est le premier fruit de l’année, avant la fraise, et que la rhubarbe se mange quand le jardin n’a encore rien donné. La saison courte ne se rallonge pas : on cesse seulement d’en gaspiller le début.</p>
<p class="p0 ri"><strong class="runin">Les Trois Sœurs se partagent le travail.</strong> Le maïs sert de tuteur au haricot grimpant ; la courge couvre le sol, étouffe les mauvaises herbes et garde l’humidité ; la butte draine, se réchauffe et tient le pied du maïs contre le vent. Mesuré au champ, l’ensemble donne plus d’énergie et plus de protéines que chacune des trois cultures seule sur la même surface. <strong>Le fait qui surprend :</strong> le haricot ne nourrit pas le maïs de l’année. L’azote qu’il fixe reste dans ses racines et ne se libère qu’en pourrissant : il sert au maïs de l’année suivante, ce qui explique qu’on replantait dans les mêmes buttes plusieurs années. La première année, le maïs mange ce qu’on lui donne — compost, fumier —, sinon le rendement baisse.</p>
<p class="p0 ri"><strong class="runin">Le maïs ne mûrit pas au nombre de jours sans gel, mais à la chaleur.</strong> Les Iroquoiens du Saint-Laurent cultivaient le maïs jusqu’à Stadaconé, où est Québec aujourd’hui. Le maïs de la vallée y demandait environ 100 jours sans gelée, qu’on n’avait pas toutes les années : on fumait l’anguille pour l’hiver au cas où la récolte manquerait. Sur la Côte-Nord, la saison sans gel dure 108 à 124 jours en moyenne selon la station, et 89 à 95 jours ou moins une année sur dix ; et les étés sont frais : une journée sans gel n’est pas une journée chaude (<span class="ref">ch. 97</span>, <span class="ref">§3</span>). Ce qui rend le maïs possible ici, c’est une variété qui fait tout plus vite — moins de feuilles, une fleur plus hâtive, un épi plus petit. Le maïs de Gaspé, parmi les plus hâtifs connus, émet son pollen une trentaine de jours avant un maïs de référence moderne semé au même endroit.</p>
<p class="p0 ri"><strong class="runin">Le maïs mangé seul rend malade ; la cendre corrige.</strong> Là où le maïs devient la base de la table, la pellagre suit : le grain est pauvre en une vitamine du groupe B et mal équilibré en protéines. Les peuples du maïs le cuisaient dans une lessive de cendre de bois franc, qui décolle la pelure et améliore la valeur du grain. Sur la Côte-Nord, le maïs ne sera jamais la base : c’est une raison de plus de le cuire à l’ancienne, pas une menace.</p>
<p class="p0 ri"><strong class="runin">Une talle vieillit, et le feu la rajeunit.</strong> Laissé à lui-même, le plant de bleuet se ramifie, met son énergie dans les tiges et forme de moins en moins de bourgeons à fruits, petits et perchés au bout des branches, là où le froid les tue. Détruire la partie aérienne pendant la dormance réveille les bourgeons du pied et du rhizome : des tiges neuves, droites, qui forment leurs bourgeons à fruits la première année et donnent leur plus grosse récolte la deuxième. Les feux de forêt faisaient ce travail ; on a appris à le faire exprès, en petit, au bon moment, ou à le faire sans feu, à la lame.</p>
<p class="p0 ri"><strong class="runin">Le foin se garde parce qu’il n’a plus d’eau.</strong> L’herbe fauchée contient de 70 à 90 % d’eau. Tant qu’elle en garde plus de 20 à 25 %, les bactéries et les moisissures y travaillent, et leur travail dégage de la chaleur ; au-delà d’un seuil, la chaleur appelle d’autres bactéries qui en dégagent davantage, jusqu’à l’inflammation. Faner, c’est une course entre le soleil et les microbes. Et un foin moisi, en plus de ce qu’il fait aux bêtes (<span class="ref">ch. 101</span>), lâche une poussière qui donne aux gens une maladie des poumons : le poumon du fermier<sup class="fnr" data-fn="99-1">1</sup>. <strong>Le fait qui surprend :</strong> la crise arrive quatre à huit heures après le travail au fenil, avec la fièvre, les frissons et la toux sèche d’une grippe, et personne ne la relie à la poussière de l’après-midi. On retourne au fenil le lendemain, et c’est ce retour qui abîme le poumon : une fois sensibilisé, on le reste des années, et chaque exposition relance la crise.</p>
<p class="p0 ri"><strong class="runin">Un clone garde la variété, une graine la mélange.</strong> Le pommier ne se féconde pas lui-même, et son pépin porte le mélange de deux parents : semé, il donne un arbre dont on ne sait rien d’avance. La bouture, la marcotte, le drageon, la division et le tubercule donnent au contraire une copie exacte : c’est pour ça que les gadelliers, la rhubarbe et le topinambour se transmettent d’un jardin à l’autre sans jamais passer par un sachet.</p>
<p class="p0 ri"><strong class="runin">Une plante repère fait le calcul de la chaleur.</strong> Un calendrier donne une date ; un lilas en première feuille dit que le printemps de cette année-ci, dans ce sol-ci, a accumulé assez de chaleur. Le repère intègre ce que la date ignore. La lune, elle, ne mesure rien de ce qui fait pousser une plante (<span class="ref">§5-I</span>).</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Seulement ce que demandent les procédures de ce chapitre. Ce qui s’achète d’avance se range au <span class="ref">ch. 00b</span>.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Semence de maïs très hâtif (maïs de Gaspé ou équivalent)</td><td>Quelques centaines de grains</td><td>Aucune par un maïs sucré ordinaire, qui demande une saison plus longue que la nôtre (<span class="ref">ch. 100</span>). Sans semence hâtive, la butte devient haricot à rames et courge, eux aussi en pari (<span class="ref">§9</span>)</td><td><span class="non">NON</span> <span class="negx">pour faire du maïs. La variété décide de tout (<span class="ref">§3</span>)</span></td></tr><tr><td class="c-item">Haricot grimpant sec et courge d’hiver</td><td>Selon les buttes</td><td>Pois grimpant sur branchages ; courge coureuse de n’importe quelle variété hâtive. Paris, comme le maïs : sous plastique transparent ou contre le mur sud (<span class="ref">ch. 97</span> ; <span class="ref">ch. 98</span>, étapes 24 et 29)</td><td>Oui</td></tr><tr><td class="c-item">Camerisiers</td><td><strong>Deux variétés non apparentées qui fleurissent en même temps</strong>, au minimum</td><td>Aucune. Un plant seul, ou deux plants de la même variété, fleurit sans fruit</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Amélanchier</td><td>1 ou plus</td><td>Drageon ou branche racinée d’un amélanchier sauvage, choisi au goût (<span class="ref">§5-E</span>)</td><td>Oui</td></tr><tr><td class="c-item">Pommetiers ou pommiers</td><td><strong>Deux variétés</strong> à 30 m l’une de l’autre au plus</td><td>Un pommetier du voisin ou un pommier sauvage dans le rayon fait la deuxième variété. Un pommetier ornemental à fleurs doubles ne compte pas : il n’a pas de pollen</td><td><span class="non">NON</span> <span class="negx">pour la deuxième variété</span></td></tr><tr><td class="c-item">Argousiers</td><td>Plusieurs, dont environ un mâle sur dix</td><td>Le sexe ne se voit qu’à la floraison : planter plus qu’il ne faut et éliminer ensuite</td><td><span class="non">NON</span> <span class="negx">pour le mâle</span></td></tr><tr><td class="c-item">Gadelliers, cassissiers, groseilliers</td><td>2 à 4</td><td>Boutures d’un plant existant (<span class="ref">§5-E</span>) ; gadelliers sauvages du sous-bois (<span class="ref">ch. 91</span>) transplantés</td><td>Oui</td></tr><tr><td class="c-item">Rhubarbe</td><td>Quelques plants suffisent à une famille</td><td>Un morceau de couronne pris à une vieille talle (<span class="ref">§5-E</span>)</td><td>Oui</td></tr><tr><td class="c-item">Topinambour</td><td>Une chaudière de tubercules</td><td>Un seul tubercule à deux yeux suffit à partir la talle</td><td>Oui</td></tr><tr><td class="c-item">Faux avec pierre à faux</td><td>1</td><td>Faucille (environ cinq fois plus lente) ; machette ou couteau long ; ou pas de faux du tout : foin d’arbre (<span class="ref">ch. 101</span>, <span class="ref">§9</span>, étape 8)</td><td>Oui. Le foin, non</td></tr><tr><td class="c-item">Fourche et râteau</td><td>1 de chaque</td><td>Fourche taillée dans une branche fourchue de bouleau ; râteau de planche à dents de bois ou de clous (<span class="ref">ch. 95</span>)</td><td>Oui</td></tr><tr><td class="c-item">Perches</td><td>Trois par trépied ; davantage pour une tente canadienne</td><td>Épinette ou sapin du terrain, assez longues pour que le foin ne touche pas le sol</td><td>Oui</td></tr><tr><td class="c-item">Tige de fer ou tuyau d’environ 1 cm, de 2,4 à 3 m</td><td>1</td><td>Tige de ferraillage, barre à mine mince, tuyau de galerie. <strong>C’est la sonde du fenil (<span class="ref">§5-G</span>, <span class="ref">§8</span>)</strong></td><td><span class="non">NON</span> <span class="negx">dès qu’il y a un tas de foin</span></td></tr><tr><td class="c-item">Thermomètre à tige longue</td><td>1</td><td>La tige de fer et la main</td><td>Oui</td></tr><tr><td class="c-item">Cendre de bois franc tamisée</td><td>Environ 1 volume pour 4 volumes d’eau</td><td>Chaux éteinte, <strong>à sa propre dose</strong> : environ 10 g par litre d’eau (étape 22). Le <span class="ref">ch. 112</span> (<span class="ref">§9-B</span>) dit comment la faire, pas comment la doser pour le maïs. <strong>Jamais cendre et chaux ensemble</strong></td><td>Oui</td></tr><tr><td class="c-item">Chaudron d’inox ou de fonte, pour la lessive</td><td>1</td><td>Aucun en aluminium : la lessive l’attaque et en tire de l’hydrogène (<span class="ref">§8</span>)</td><td><span class="non">NON</span> <span class="negx">pour l’aluminium</span></td></tr><tr><td class="c-item">Eau de rinçage tiède, prête avant la cendre</td><td>De quoi rincer 60 minutes sans interrompre</td><td>Chaudières tiédies près du poêle (<span class="ref">ch. 112</span>, <span class="ref">§4</span>)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Panier à claire-voie, ou sac de jute</td><td>1</td><td>Chaudière percée de trous de clou</td><td>Oui</td></tr><tr><td class="c-item">Toile, drap, papier</td><td>De quoi couvrir les arbustes en fleur</td><td>Branches de conifère, vieille couverture. Le plastique protège peu ou pas</td><td>Oui</td></tr><tr><td class="c-item">Gants imperméables, pour le lièvre pris au collet autour des arbustes</td><td>1 paire</td><td>Gants de caoutchouc réservés à ça, ou sacs de plastique serrés au poignet (<span class="ref">ch. 48</span>). <strong>Pas les gants de jardin</strong> : le cuir et le tissu boivent le sang jusqu’à la peau. Tularémie</td><td><span class="non">NON</span> <span class="negx">pour le lièvre</span></td></tr></tbody></table>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — Le potager des habitants</h3>
<p class="p0">Ce qu’un naturaliste suédois a vu dans les jardins du Canada français en 1749, entre Québec et Montréal, et ce qui s’en garde.</p>
<p class="step"><span class="sn">1</span><strong>Semer ce qu’ils semaient.</strong> De l’oignon avant tout — c’était le repas des jours maigres —, le chou blanc, le navet semé en abondance et mangé surtout l’hiver, la carotte, la betterave, le radis, le raifort, les pois, les fèves et les haricots, la salade, la chicorée, le concombre, le melon, la citrouille, le thym et la marjolaine. Un gadellier dans chaque petit jardin. Ils avaient aussi leur tabac près de la maison, à la mesure de la famille.</p>
<p class="step"><span class="sn">2</span><strong>Savoir ce qui manquait.</strong> Pas de pomme de terre : en 1749, les Canadiens n’en plantaient pas et riaient des Anglais qui l’aimaient tant. C’est le changement qui compte le plus pour un hiver de la Côte-Nord : la base du caveau, aujourd’hui, c’est elle (<span class="ref">ch. 98</span>).</p>
<p class="step"><span class="sn">3</span><strong>Clore le jardin.</strong> La citrouille se semait dans un champ fermé, en bonne terre riche, une fois la gelée passée, et souvent dans de vieilles couches chaudes (<span class="ref">ch. 97</span>). La clôture sans broche est au <span class="ref">ch. 95</span>.</p>
<p class="step"><span class="sn">4</span><strong>Cueillir la citrouille avant le froid, mûre ou pas.</strong> Dès que le froid s’annonce, on ramasse tout ce qui reste sur les tiges, on l’étale sur le plancher de la maison <strong>sans jamais les empiler</strong>, et les vertes finissent de mûrir. Dans une cave humide, elles pourrissent vite ; dans une pièce sèche chauffée de temps en temps, elles passent l’hiver — aujourd’hui, une pièce fraîche et sèche du chalet, 10 à 13 °C (<span class="ref">ch. 79</span>, groupe C), pas le caveau. À la table : coupée en deux, la chair tournée vers le feu du foyer jusqu’à ce qu’elle soit rôtie, puis grattée hors de l’écorce.</p>
<p class="step"><span class="sn">5</span><strong>Faire du navet la récolte d’hiver.</strong> C’est la leçon qui revient partout au nord : semé en quantité, il va au caveau (<span class="ref">ch. 79</span>) ou en fermentation (<span class="ref">ch. 80</span>).</p>
<p class="step"><span class="sn">6</span><strong>Monter le champ en billons.</strong> Les champs des environs de Québec étaient faits de planches bombées de 1,8 à 2,7 m de large, hautes d’environ 30 cm au milieu, entre deux sillons. C’est le billon du <span class="ref">ch. 95</span> à l’échelle d’un champ : il égoutte ce que personne n’avait drainé.</p>
<p class="step"><span class="sn">7</span><strong>Ne semer le grain qu’au printemps.</strong> Le froid de l’hiver détruisait le grain laissé en terre : aucun semis d’automne, tout en grain d’été. La même règle vaut ici, plus fort encore (<span class="ref">ch. 98</span>).</p>
<p class="step"><span class="sn">8</span><strong>Laisser la terre en jachère un an sur deux, et y mettre les bêtes.</strong> On ne labourait pas la jachère l’été : les herbes y poussaient librement et le bétail y pâturait toute la saison. C’est la rotation la plus simple qui soit, et elle nourrit les bêtes en même temps (<span class="ref">ch. 96</span>, <span class="ref">§5-E</span> ; ici <span class="ref">§5-H</span>).</p>
<p class="step"><span class="sn">9</span><strong>Lire ce que les jardiniers de 1749 croyaient de leurs semences.</strong> Ils faisaient venir leur graine de France chaque année, parce qu’elle perdait, disaient-ils, sa force à la troisième génération. Ce n’est pas la terre du Canada qui l’affaiblissait : une graine récoltée sur trop peu de plants s’appauvrit, et deux variétés voisines se croisent. Le <span class="ref">ch. 100</span> dit combien de plants garder et comment isoler — c’est ce qui manquait en 1749.</p>
<h3 class="sub">B — Les Trois Sœurs à la latitude de la Côte-Nord</h3>
<p class="p0">Le maïs (<em>Zea mays</em>), le haricot (<em>Phaseolus vulgaris</em>) et la courge (<em>Cucurbita</em> spp.) sur les mêmes buttes : c’est la culture en buttes des Haudenosaunee, que les premiers explorateurs ont trouvée en pleine vigueur. Ce qui suit est cette méthode, ramenée à ce qui a une chance ici. <strong>Et ici, les trois sœurs sont des paris</strong>, pas seulement le maïs : le maïs faute de chaleur, le haricot qui gèle au premier froid et ne mûrit pas en sol froid, la courge d’hiver qui demande 120 à 135 jours (<span class="ref">ch. 98</span>, étapes 24 et 29). Le haricot et la courge ne se font qu’en poussant à travers un plastique transparent ou contre le mur sud (<span class="ref">ch. 97</span>). La butte se tente ; elle ne se planifie pas.</p>
<p class="step"><span class="sn">10</span><strong>Choisir le maïs le plus hâtif qui existe, et rien d’autre.</strong> Le maïs de Gaspé, un maïs à grain dur à huit rangs, fait des plants de 60 à 90 cm et des épis d’environ 10 cm. Semé à la fin de mai en Nouvelle-Écosse, il a donné des épis secs vers le 20 juillet, soit environ 50 à 70 jours. Le sachet fait foi pour toute autre variété : un maïs qui demande plus de jours que l’été n’en donne ne fait pas « un peu moins », il ne fait rien (<span class="ref">ch. 95</span>, <span class="ref">ch. 100</span>). <strong>Le piège de ce maïs-là, c’est sa taille.</strong> À la butte, un maïs trop court se fait coucher par le haricot et étouffer par la courge : c’est pour ça qu’on écarte le maïs à éclater, et le maïs de Gaspé est plus court encore. Avec lui, le haricot grimpant reçoit sa propre perche au centre de la butte (étape 15).</p>
<p class="step"><span class="sn">11</span><strong>Prendre la place la plus chaude du terrain.</strong> Pente au sud, pied d’un mur exposé au sud, loin des creux où l’air froid coule la nuit (<span class="ref">ch. 95</span>, <span class="ref">§3</span>).</p>
<p class="step"><span class="sn">12</span><strong>Semer dans une terre réchauffée, pas froide et mouillée.</strong> Aucun repère de plante publié ne vaut ici pour le maïs (<span class="ref">§5-I</span>) : on réchauffe la terre sous un plastique transparent posé d’avance, et on sème par des fentes (<span class="ref">ch. 97</span>, étape 29). Tremper le grain quelques heures, <strong>huit au plus</strong>, puis garder le semis humide les deux premières semaines : un grain trempé sèche vite.</p>
<p class="step"><span class="sn">13</span><strong>Faire des buttes basses à 0,9 à 1,2 m les unes des autres</strong>, dans le rang et entre les rangs. Semer cinq à sept grains par butte, espacés, à 2,5 à 4 cm de profondeur. En 1605, Champlain décrivait des buttes semblables, à trois ou quatre grains, espacées d’environ 90 cm.</p>
<p class="step"><span class="sn">14</span><strong>Désherber et rechausser.</strong> À chaque sarclage, ramener doucement la terre autour des jeunes plants : c’est ce qui fait la butte, et c’est elle qui tient le maïs contre le vent.</p>
<p class="step"><span class="sn">15</span><strong>Semer les deux autres sœurs quand le maïs a environ 15 cm.</strong> Quatre ou cinq graines de haricot grimpant autour du maïs dans <strong>chaque</strong> butte ; quatre ou cinq graines de courge dans <strong>une butte sur sept</strong> seulement. Une courge par butte noierait le carré sous les tiges. Avec un maïs nain comme celui de Gaspé, planter en même temps une perche d’épinette au centre de la butte, et y guider les tiges du haricot au premier tour : il y grimpe au lieu de plier le maïs. Une seule perche pour quatre ou cinq plants laisse quand même quelques tiges s’enrouler sur le maïs voisin.</p>
<p class="step"><span class="sn">16</span><strong>Donner 25 mm d’eau par semaine</strong> quand il ne pleut pas — le même chiffre que le jardin : 25 L/m² (<span class="ref">ch. 95</span>).</p>
<p class="step"><span class="sn">17</span><strong>Nourrir le maïs la première année.</strong> Compost ou fumier bien fait au pied (<span class="ref">ch. 96</span>) : l’azote du haricot n’arrivera que l’an prochain. Replanter les mêmes buttes l’année suivante pour le toucher.</p>
<p class="step"><span class="sn">18</span><strong>Récolter le maïs quand les spathes sont sèches</strong>, et ne pas l’engranger tout de suite : étaler les épis au sec, plusieurs semaines si le grain doit être moulu, sinon il moisit. Laisser quelques feuilles d’enveloppe à chaque épi, les tresser en longues guirlandes, et les pendre sous le toit ou près du poêle. La semence se prend sur les plants les plus vigoureux et au milieu de l’épi — et il en faut beaucoup de plants (<span class="ref">ch. 100</span>).</p>
<p class="step"><span class="sn">19</span><strong>Sécher le haricot dans sa cosse ; le cuire selon le <span class="ref">ch. 98</span>, étape 26.</strong> Le chaudron qui mijote tout le jour au bord du poêle sans jamais bouillir ne détruit pas la toxine du haricot cru : c’est le gros bouillon qui la détruit.</p>
<p class="step"><span class="sn">20</span><strong>Sécher la courge en lanières, ou la garder entière au sec.</strong> Coupée en lanières, enfilée sur une corde près du feu jusqu’à ce qu’elle soit sèche, puis rangée. Une courge dure, entière, tenait quatre à cinq mois. Entière, elle va dans une pièce fraîche et sèche du chalet, 10 à 13 °C (<span class="ref">ch. 79</span>, groupe C) : pas au caveau, trop humide pour elle.</p>
<p class="step"><span class="sn">21</span><strong>Ne jamais mettre en pot la récolte de la butte sans autoclave.</strong> Maïs, haricot et courge sont peu acides : l’eau bouillante ne suffit pas, <strong>et le botulisme ne change ni l’odeur, ni le goût, ni l’apparence du pot</strong> (<span class="ref">ch. 78</span>). La façon d’autrefois — sécher — est justement celle qui ne court pas ce risque.</p>
<p class="step pk-d"><span class="sn">22</span><strong>Cuire le maïs sec à la lessive de cendre.</strong> L’eau de rinçage tiède est prête avant tout le reste, et le chaudron est d’inox ou de fonte, jamais d’aluminium (<span class="ref">§8</span>, point 3). Faire gonfler le maïs à grain dur dans l’eau bouillante, puis y ajouter de la cendre de bois franc tamisée, environ <strong>un volume de cendre pour quatre d’eau</strong> (un cinquième du mélange). Faire bouillir jusqu’à ce que les petites pointes noires du grain — le bout qui tenait à l’épi — se détachent et flottent, et que la pelure glisse quand on roule un grain entre les doigts — environ 45 minutes. Le grain à tester se sort à la cuillère et passe à l’eau froide avant d’aller aux doigts. Verser dans le panier, secouer et brasser dans l’eau courante d’un ruisseau jusqu’à ce que pelures et pointes soient parties, puis faire rebouillir environ 30 minutes dans une eau neuve et rincer encore : il ne doit rester aucune lessive. La lessive de cendre ne se goûte pas pour juger de sa force. Le grain ainsi traité se mange en soupe, entier ou écrasé. <strong>À la chaux éteinte plutôt qu’à la cendre, la dose n’est pas la même</strong> : environ 10 g de chaux par litre d’eau, une part de maïs pour deux parts d’eau, chauffé à environ 80 °C, sous le bouillon, de 20 à 45 minutes, laissé tremper la nuit, puis lavé deux ou trois fois pour enlever pelures, pointes et chaux. <strong>Jamais cendre et chaux ensemble dans la marmite</strong> : ensemble, elles font la lessive forte du savon (<span class="ref">ch. 112</span>, <span class="ref">§9-B</span>), pas une cuisson de maïs.</p>
<p class="step"><span class="sn">23</span><strong>Mesurer ce que la butte ne fera pas.</strong> Pour une table faite à environ deux tiers de maïs, on estime qu’il fallait un tiers d’acre par personne — environ 1 350 m². C’était la mesure des Wendats, beaucoup plus au sud, dans des étés bien plus chauds. Ici, les buttes donnent un complément : du grain sec, des haricots secs et des courges qui se gardent.</p>
<h3 class="sub">C — Les jardins des postes et des missions, plus au nord encore</h3>
<p class="p0">Sur la côte du Labrador, refroidie par un courant froid, un marchand anglais a jardiné seize ans à partir de 1770, les missionnaires moraves ont tenu des jardins à Nain dès la fin du XVIIIᵉ siècle, et les postes de la Compagnie de la Baie d’Hudson ont semé dans les années 1840. Leurs gestes, dans l’ordre où ils servent :</p>
<p class="step"><span class="sn">24</span><strong>Chercher les creux abrités et les pentes au sud.</strong> Leurs vieux rangs relevés se voient encore, envahis d’herbe, blottis dans les creux et sur les versants tournés au sud : ce sont les microclimats d’une côte refroidie par la mer.</p>
<p class="step"><span class="sn">25</span><strong>Couper la tourbe.</strong> Une terre de tourbe dense se desserrait avec du sable pris dessous, ou avec de la cendre. Le jardin qui a donné les meilleures récoltes du Labrador avait été fumé au varech et aux déchets de poisson (<span class="ref">ch. 96</span>).</p>
<p class="step"><span class="sn">26</span><strong>Pelleter la neige des planches au printemps</strong> pour que la terre se réchauffe plus tôt, semer à l’intérieur en mars et en avril, et allonger la saison au châssis et en bac (<span class="ref">ch. 97</span>). Un échec noté : des semis tués par trop de chaleur près du feu.</p>
<p class="step"><span class="sn">27</span><strong>Clôturer contre le vent</strong>, pas seulement contre les bêtes : les jardins des missions étaient clos avec soin pour ça.</p>
<p class="step"><span class="sn">28</span><strong>Faire du navet et du chou la récolte-vedette, et des verdures de temps frais l’appoint.</strong> Un poste de la rivière Churchill a rentré 36 barils de navets là où on en espérait 10 — à l’intérieur des terres, sur un sol sableux, à l’abri du courant froid de la côte. La laitue, le cresson et la moutarde aiment le temps frais et le soleil voilé : ce sont les verdures d’une côte brumeuse.</p>
<p class="step"><span class="sn">29</span><strong>Ils salaient aussi l’épinard pour l’hiver.</strong> Le livre n’en fait pas une méthode, faute de proportion connue : un légume peu acide tassé à l’abri de l’air est le terrain du botulisme, qui ne change ni l’odeur, ni le goût, ni l’apparence.</p>
<p class="step"><span class="sn">30</span><strong>Retenir les deux revers qu’ils ont écrits eux-mêmes.</strong> Le varech posé en paillis a fait pulluler des vers qui ont mangé la semence, et tout a été à ressemer : le varech se composte ou s’enfouit, il ne couvre pas un semis (<span class="ref">ch. 96</span>). Et la grande marée d’automne a noyé un jardin de bord de mer, choux et choux-fleurs compris : un jardin de grève se place au-dessus de la plus haute marée qu’on a vue, pas au-dessus de celle d’aujourd’hui.</p>
<h3 class="sub">D — Planter les vivaces et les arbustes fruitiers</h3>
<p class="step"><span class="sn">31</span><strong>Planter tôt, et planter le bon nombre.</strong> Le tableau dit combien de plants il faut pour qu’il y ait des fruits, pas seulement des fleurs.</p>
<table class="tspan"><colgroup><col style="width:13.8%"><col style="width:15.9%"><col style="width:14.3%"><col style="width:9.4%"><col style="width:15.1%"><col style="width:7.7%"><col style="width:24.0%"></colgroup><thead><tr><th>Plante</th><th>Froid supporté</th><th>Pollinisation</th><th>Espacement</th><th>Premiers fruits</th><th>Durée</th><th>À savoir</th></tr></thead><tbody><tr><td class="c-item">Camerisier (<em>Lonicera caerulea</em>)</td><td>−47 °C sans dommage ; fleur ouverte jusqu’à −7 °C</td><td><strong>Deux variétés non apparentées, fleurissant ensemble.</strong> Les deux portent des fruits</td><td>1 m en haie, 1,3 m isolé</td><td>Quelques-uns l’année après la plantation ; quelques kilos par plant après 3 ou 4 ans</td><td>Vit plus de 30 ans</td><td>Premier fruit de l’année. Ne drageonne pas, pas d’épines. Mûr quand l’intérieur est violet, pas vert</td></tr><tr><td class="c-item">Amélanchier (<em>Amelanchier</em> spp. ; <em>A. alnifolia</em> pour les variétés de pépinière)</td><td>−60 °C (<em>A. alnifolia</em>)</td><td>Un plant suffit ; plus de fruits s’il y en a d’autres</td><td>1 à 1,5 m ; la haie se ferme en 5 ans</td><td>3 à 5 ans ; pleine production de 6 à 8 ans</td><td>Se rajeunit (étape 39)</td><td>Mûrit par étapes : plusieurs cueillettes. Racines en surface, sensibles à l’herbe</td></tr><tr><td class="c-item">Gadellier et groseillier (<em>Ribes</em>)</td><td>Rustiques ; le gadellier sauvage pousse déjà en sous-bois sur la côte (<span class="ref">ch. 91</span>)</td><td>Autofertiles</td><td>1 à 1,25 m ; cassissier 0,6 à 1,5 m</td><td>Un peu la 2ᵉ année, plein la 3ᵉ ; environ 1 kg par plant, la moitié pour le cassis</td><td>Au moins 8 à 10 ans</td><td>Fleurit tôt : le gel de floraison est le vrai risque</td></tr><tr><td class="c-item">Argousier (<em>Hippophae rhamnoides</em>)</td><td>−43 °C</td><td><strong>Plants mâles et femelles séparés</strong> ; 7 à 12 % de mâles</td><td>1 m</td><td>Fleurs sur du bois de 3 ans</td><td>—</td><td>Tolère le sel et le sol pauvre, fixe son azote. Épines ; 5 à 7 kg par plant, très durs à cueillir. Mûr fin août, début septembre</td></tr><tr><td class="c-item">Pommetier, pommier (<em>Malus</em>)</td><td>Certaines variétés fruitent la plupart des années sans protection en site abrité à Whitehorse, au Yukon</td><td><strong>Deux variétés à 30 m au plus</strong> ; pommetier et pommier se pollinisent</td><td>—</td><td>Jusqu’à 5 ans</td><td>—</td><td>Le pépin ne donne pas la pomme (<span class="ref">§3</span>). Choisir une variété hâtive : une pomme d’octobre ne mûrit pas certaines années</td></tr><tr><td class="c-item">Rhubarbe (<em>Rheum rhabarbarum</em>)</td><td>Aime les hivers qui gèlent le sol</td><td>—</td><td>—</td><td>Quelques tiges la 2ᵉ année</td><td>Replanter ailleurs aux 6 à 8 ans</td><td><strong>Seules les tiges se mangent</strong> (<span class="ref">§7</span>)</td></tr><tr><td class="c-item">Topinambour (<em>Helianthus tuberosus</em>)</td><td>Indigène du Canada</td><td>—</td><td>30 à 35 cm dans le rang, rangs à 60 à 100 cm</td><td>La 1ʳᵉ année</td><td>Revient de lui-même</td><td>Environ 400 g par plant ailleurs ; plus petits ici (<span class="ref">§9</span>)</td></tr></tbody></table>
<p class="step"><span class="sn">32</span><strong>Placer contre le gel de floraison, pas seulement contre l’hiver.</strong> Camerise, amélanchier et gadellier fleurissent tôt : jamais dans un creux où l’air froid s’accumule, toujours dans un endroit où l’air circule. Les nuits claires de floraison, un drap ou du papier posé sur les petits arbustes les protège ; une bâche de plastique protège peu ou pas.</p>
<p class="step"><span class="sn">33</span><strong>Abriter du vent du nord et de l’ouest.</strong> Le dégât d’hiver d’un arbuste est souvent un dessèchement par le vent dominant, pas le froid lui-même : l’épinette laissée debout au nord-ouest vaut une clôture. Le topinambour, qui monte jusqu’à 3 m, fait lui-même un brise-vent d’été pour les planches plus basses.</p>
<p class="step"><span class="sn">34</span><strong>Planter un peu plus profond que dans le pot.</strong> L’amélanchier, 2,5 à 5 cm plus bas : il fera plusieurs tiges au lieu de drageons partout. Le gadellier un peu plus bas aussi, racines du haut à au moins 2,5 cm sous terre, et les branches rabattues à 10 à 15 cm pour le forcer à repartir.</p>
<p class="step"><span class="sn">35</span><strong>Rien d’autre à moins d’un mètre du pied.</strong> L’amélanchier a des racines de surface qui perdent contre l’herbe, et le jeune camerisier se tient sans herbe tant qu’il s’établit : paillis épais en large cercle, sans monter contre les tiges.</p>
<p class="step"><span class="sn">36</span><strong>Enlever les fleurs du gadellier l’année de la plantation</strong>, et ne pas toucher à la rhubarbe la première année : on nourrit la racine avant de nourrir la table.</p>
<p class="step"><span class="sn">37</span><strong>Tenir les gadelliers et les cassissiers loin des pins blancs.</strong> La rouille vésiculeuse passe une partie de sa vie sur le <em>Ribes</em> et l’autre sur le pin à cinq aiguilles, qu’elle abîme gravement ; le pin blanc (<em>Pinus strobus</em>) pousse dans le sud de la Côte-Nord. Au moins 300 m. Et l’amélanchier loin des genévriers (<em>Juniperus</em> spp.), pour la même raison et une autre rouille : 2 km si possible, ce qui se tient rarement sur une côte où le genévrier pousse sur les affleurements.</p>
<p class="step"><span class="sn">38</span><strong>Protéger l’écorce du lièvre et des cervidés.</strong> L’écorce de l’amélanchier est un mets recherché du lièvre et du cerf. Le lièvre (<em>Lepus americanus</em>) qui finit au collet autour des arbustes se manipule <strong>avec des gants imperméables</strong>, mis avant de toucher au collet : le cuir et le tissu des gants de jardin boivent le sang jusqu’à la peau, et la tularémie passe par la peau éraflée au dépouillement (<span class="ref">ch. 48</span>, étape 6). Il se cuit à 74 °C à cœur (<span class="ref">ch. 48</span>). Contre les oiseaux, le filet se pose à mailles de 1,25 cm au plus, sinon ils s’y prennent et y meurent ; le jaseur peut raser la récolte de camerises d’une année entière.</p>
<p class="step"><span class="sn">39</span><strong>Tailler en fin d’hiver, selon l’âge du bois.</strong></p>
<p class="li l2">Camerisier : éclaircir les vieilles branches quand l’arbuste devient dense, <strong>jamais plus du quart</strong> de l’arbuste la même année.</p>
<p class="li l2">Cassissier : il fruite surtout sur le bois d’un an. Garder 10 à 12 tiges, dont la moitié d’un an ; couper au ras du sol tout ce qui a plus de trois ans.</p>
<p class="li l2">Gadellier rouge et groseillier : ils fruitent sur les courts rameaux du bois de deux et trois ans. Garder trois ou quatre tiges de chaque âge — un, deux et trois ans —, soit 9 à 12 tiges ; couper tout ce qui dépasse trois ans.</p>
<p class="li l2">Amélanchier : ôter quelques branches au pied pour laisser entrer la lumière ; quand il est vieux et ne donne plus, le <strong>couper à environ 15 cm du sol</strong> et le laisser repartir.</p>
<p class="li l2">Pommier et pommetier : dans le nord, on les conduit en arbuste à plusieurs troncs, ce qui les rend plus rustiques et limite les pertes d’hiver.</p>
<p class="step"><span class="sn">40</span><strong>Cueillir à maturité, et conserver par les routes du <span class="ref">ch. 91</span>.</strong> Camerise : mordre quelques baies en deux ; verte dedans, elle n’est pas prête. Amélanche, camerise et gadelle se sèchent au séchoir près du poêle (<span class="ref">ch. 91</span>, <span class="ref">§9</span>, route 1) ; la gadelle, riche en pectine, prend en gelée sans pectine achetée (<span class="ref">ch. 91</span>, <span class="ref">§9</span>, route 4) ; le pommetier « Dolgo », à fruit de 1,5 cm, sert surtout à la gelée ; le pommetier « Rescue », à fruit de 3,5 cm, se garde environ trois semaines. Le cassis et l’argousier sont riches en vitamine C, ce qui compte en hiver (<span class="ref">ch. 20</span>) ; l’argousier se cueille en coupant la branche chargée, parce que le fruit mûr ne se détache pas.</p>
<h3 class="sub">E — Multiplier sans pépinière</h3>
<p class="step"><span class="sn">41</span><strong>Bouturer le gadellier.</strong> À la fin de l’automne, prendre sur un plant sain des tiges de l’été, les couper en bouts de 15 à 20 cm, le bas juste sous un bourgeon, le haut environ 10 mm au-dessus d’un bourgeon. Les piquer tout de suite à 15 cm les unes des autres, dans une terre qui s’égoutte, assez profond pour que seulement un ou deux bourgeons dépassent, puis couvrir de paille. Au printemps, la paille reste en paillis. Après une saison, le plant va à sa place. Au printemps, avant le débourrement<sup class="fnr" data-fn="99-2">2</sup>, ça marche aussi.</p>
<p class="step"><span class="sn">42</span><strong>Marcotter le groseillier.</strong> Les groseilliers de type européen reprennent mal de bouture : coucher une branche encore attachée au plant, la couvrir de terre en partie, la fixer au sol avec un crochet de bois. Elle racine là où elle touche la terre ; après une saison, on la sèvre et on la déterre. Une seule branche donne souvent plusieurs plants.</p>
<p class="step"><span class="sn">43</span><strong>Prendre l’amélanchier sauvage le meilleur au goût.</strong> Chaque amélanchier sauvage est un individu, avec son goût à lui ; son drageon ou sa bouture donne le même fruit. Goûter plusieurs talles en juillet ou en août, marquer la meilleure, y revenir en fin d’hiver : prélever un drageon, ou couper des branches et les mettre dans une chaudière d’eau à la maison, où elles font des racines ; on les plante au printemps quand les racines sont faites.</p>
<p class="step"><span class="sn">44</span><strong>Diviser la rhubarbe.</strong> Soulever la couronne tôt au printemps, avant la reprise, la couper en morceaux portant chacun au moins un gros bourgeon vigoureux, replanter chaque morceau <strong>debout</strong>, à 10 à 15 cm sous la surface. Des tiges qui deviennent minces d’une année à l’autre disent qu’il est temps ; une plantation se refait à un nouvel endroit tous les 6 à 8 ans.</p>
<p class="step"><span class="sn">45</span><strong>Replanter le topinambour.</strong> Un morceau de tubercule portant au moins deux yeux, à 10 cm de profondeur, dès que la terre dégèle — bien avant la date de dernier gel, il aime le frais.</p>
<p class="step"><span class="sn">46</span><strong>Ne pas semer de pépin pour avoir une pomme.</strong> Le pépin donne un arbre inconnu. Les variétés se multiplient par la greffe sur un porte-greffe ; sur un porte-greffe de pommetier de Sibérie, l’arbre fait 6 à 9 m. Un camerisier, lui, pousse sur ses propres racines : même rasé par le verglas ou le feu, il repart de la souche, et c’est la même variété qui repousse.</p>
<h3 class="sub">F — La talle gérée</h3>
<p class="p0">Chez les Premières Nations, les familles fréquentent souvent les mêmes talles depuis plusieurs générations, et le droit d’y cueillir se règle par les liens de famille et d’amitié. Une talle sur le territoire d’une famille se demande donc à cette famille. Voici comment on garde une talle productive au lieu d’en chercher une autre.</p>
<p class="step"><span class="sn">47</span><strong>Lire la talle.</strong> Plus de bleuets après un feu ou une coupe forestière ; <strong>le bouleau et le framboisier qui s’installent annoncent une talle qui décline.</strong> Au pied, des plants très ramifiés dont les rares bourgeons à fruits sont au bout des tiges : c’est une talle qui a besoin d’être rajeunie.</p>
<p class="step"><span class="sn">48</span><strong>Choisir la lame d’abord.</strong> Couper toutes les tiges <strong>au ras du sol</strong>, à la faucille, à la faux ou au couteau, pendant la dormance : après la première gelée forte de l’automne, quand le feuillage a tourné au rouge, ou au printemps avant le débourrement<sup class="fnr" data-fn="99-2">2</sup>. À l’automne, les tiges coupées trop haut meurent l’hiver ; au printemps, un chicot laissé long repousse de côté en tiges peu productives. Coupée à ras, la talle repart aussi bien qu’au feu, sans aucun risque de feu de forêt.</p>
<p class="step"><span class="sn">49</span><strong>Ou brûler, à l’ancienne, dans la seule fenêtre où c’est sûr.</strong> Au Labrador, on brûlait les talles de petits fruits ; chez les Cris et les Dénés de l’Ouest, on brûlait au printemps, quand la neige tenait encore en lisière de forêt et servait de coupe-feu, à faible intensité, tous les quelques ans. Les conditions qui rendent la méthode sûre, toutes ensemble :</p>
<p class="li l2">la plante dort (même fenêtre qu’à l’étape 48) ;</p>
<p class="li l2">le sol garde un peu d’humidité, et la neige est encore là autour ;</p>
<p class="li l2">un vent léger, pas de rafales ; tout autour, une bande de coupe-feu où rien ne peut brûler ;</p>
<p class="li l2">on allume du côté où va le vent, pour que le feu recule contre lui, lentement, au lieu de courir avec lui ;</p>
<p class="li l2">on brûle une partie de la talle à la fois, jamais tout ;</p>
<p class="li l2">le feu doit seulement <strong>faire éclater les bourgeons</strong>. Un feu chaud brûle l’humus, et c’est dans l’humus que vit le rhizome : on tue la talle qu’on voulait sauver ;</p>
<p class="li l2">avant d’allumer, le battoir et le râteau à feu sont en main, et l’eau à portée (<span class="ref">ch. 11</span>, <span class="ref">§9</span>, « Fabriquer les outils ») : c’est avec eux qu’on rabat une lisière qui part.</p>
<p class="step"><span class="sn">50</span><strong>Compter deux ou trois ans.</strong> Le bleuet à feuilles étroites (<em>Vaccinium angustifolium</em>) donne sa plus grosse récolte la deuxième année après la coupe ; le bleuet fausse-myrtille (<em>Vaccinium myrtilloides</em>), la troisième, et elle supporte mal les brûlages répétés. On recommence le cycle tous les deux ou trois ans. <strong>Diviser la talle en deux moitiés qu’on rajeunit à tour de rôle</strong> donne une moitié en fruits chaque année.</p>
<p class="step"><span class="sn">51</span><strong>À la floraison, repérer et surveiller.</strong> C’est le moment de voir quelles zones fleurissent le plus, et de surveiller le gel du printemps, qui peut anéantir la récolte en une nuit.</p>
<h3 class="sub">G — Le foin à la main</h3>
<p class="p0">Autour de Québec en 1749, le foin était fait d’un pâturin fin (<em>Poa</em>) et de trèfle blanc (<em>Trifolium repens</em>) ; on faisait les foins au début d’août, les prés ne se fauchaient qu’une fois l’été parce que le printemps arrive tard, et on montait des meules près des prés, coniques sur les prés humides. Rien de ça n’a changé pour un pré naturel du Nord : une seule coupe par été.</p>
<p class="step"><span class="sn">52</span><strong>Faucher au bon moment.</strong> Le foin perd vite sa valeur après la floraison ; faucher du début au milieu de la floraison. La fléole des prés (<em>Phleum pratense</em>), le « mil », la grande herbe à foin des pays froids, devient vite ligneuse : la couper avant ou juste à l’épiaison<sup class="fnr" data-fn="99-3">3</sup>.</p>
<p class="step"><span class="sn">53</span><strong>Faucher à la rosée.</strong> L’herbe mouillée de rosée se fauche bien mieux à la faux. Un matin clair, commencer tôt, pour que le fanage commence le jour même.</p>
<p class="step"><span class="sn">54</span><strong>Régler la faux sur soi.</strong> Le manche et ses poignées se placent selon la taille du faucheur : bras tendus, les deux mains à peu près à la même hauteur, la lame toujours parallèle au sol pendant tout le demi-cercle. On avance en ligne droite, coups larges, en coupant vers l’herbe déjà fauchée. Une lame de 75 cm laisse un andain — la bande d’herbe coupée — d’environ 175 cm ; sur un terrain égal et sans roches, on fauche à peu près 500 m² à l’heure.</p>
<p class="step"><span class="sn">55</span><strong>Aiguiser souvent, sur place.</strong> La pierre à faux se passe des deux côtés de la lame, en partant du talon, plusieurs fois par jour (<span class="ref">ch. 105</span>). C’est à ce moment-là que la faux coupe le faucheur : la pierre qui dérape hors du fil emmène les doigts qui la tiennent sur une lame qu’on vient de rendre tranchante, et un tendon de la main coupé ne se répare pas ici. Pour apprendre, on aiguise à genoux, le manche dans la main gauche et la pointe de la lame posée au sol : la lame ne bouge pas. Debout, le bout du manche posé par terre, la lame devant soi, pointe à droite, la main gauche tient la lame par le dos, jamais du côté du fil, juste derrière l’endroit où passe la pierre, et avance le long du dos à mesure. La pierre mouillée part du dos et descend vers le fil, jamais le long du fil, à petits coups qui se chevauchent, du talon vers la pointe : le dessus d’abord, puis le dessous. Aucune de ces prises n’empêche la coupure. Un fil qui rencontre une roche cachée s’ébrèche : un pré se nettoie de ses roches avant la première fauche, pas pendant.</p>
<p class="step"><span class="sn">56</span><strong>Faner le jour même.</strong> Retourner et éparpiller l’andain à la fourche pour que l’air et le soleil y entrent : ça accélère le séchage et dissipe la chaleur qui commence dès la coupe. Au soleil, on étale ; par temps gris mais venteux, on aère.</p>
<p class="step"><span class="sn">57</span><strong>Mettre en veillottes quand la pluie menace.</strong> Un foin à moitié sec qui se fait remouiller s’abîme bien plus qu’un foin fraîchement coupé sous la pluie. Avant l’averse, rassembler en gros andains ou en petits tas ronds — les veillottes — et les réétaler au soleil après.</p>
<p class="step"><span class="sn">58</span><strong>Par temps humide, sécher en l’air.</strong> Une meule posée sur un trépied de perches, ou étendue sur une « tente canadienne » — deux chevalets en A reliés par une perche faîtière, des perches sur les côtés — sèche là où le sol mouillé l’aurait fait pourrir. C’est long à monter et ça demande des perches : le terrain en a.</p>
<p class="step"><span class="sn">59</span><strong>Savoir quand rentrer.</strong> Le foin doit passer de 70 à 90 % d’eau à <strong>25 % au plus pour du foin en vrac</strong>. Sur le terrain : une poignée tordue qui craque, sans aucune humidité qui perle à la torsion, est à peu près à 25 à 30 %. <strong>C’est la limite, pas la cible</strong> : au premier craquement, on laisse encore sécher. Les feuilles fines sèchent d’abord ; la tige épaisse garde son jus plus longtemps : tordre des tiges, pas seulement des feuilles. Un bon foin est croustillant et d’un vert brillant ; un foin blanchi a pris la pluie. En climat humide, il faut rarement moins de trois jours.</p>
<p class="step pk-d"><span class="sn">60</span><strong>Monter le tas pour qu’il respire.</strong> Sur un lit de pierres qui laisse passer l’air ; un trépied de perches au centre d’une meule ronde pour l’aérer ; le cœur <strong>bien tassé</strong>, sinon le tas s’affaisse en séchant et la pluie y entre. Plusieurs petits tas valent mieux qu’un gros : le volume garde la chaleur. Sous un toit si possible, et <strong>jamais sous le toit où l’on dort</strong> (<span class="ref">§8</span>).</p>
<p class="step"><span class="sn">61</span><strong>Sonder les six premières semaines.</strong> C’est dans cette période que se déclarent la plupart des feux de foin. Enfoncer la tige de fer au cœur du tas, la laisser environ 20 minutes, la retirer, et la toucher d’abord du dos de la main, brièvement, avant de l’empoigner. <strong>Trop chaude pour la main, on sort le foin chaud — mais la tige ne dit pas de combien</strong> : tout le tableau du <span class="ref">§6</span>, de la zone de danger au foin qui va flamber, lui fait le même effet. On traite donc le tas comme le pire cas : l’eau prête, une deuxième personne, des planches sur le tas avant la première fourchée, et chaque fourchée sort dehors et se noie. Avec un thermomètre descendu au fond d’un tuyau, les seuils sont au <span class="ref">§6</span>. On marche sur le tas sur des planches : un foin qui a brûlé en dedans laisse une cavité sous une croûte qui cède.</p>
<p class="step"><span class="sn">62</span><strong>Compter le foin d’une chèvre avant d’acheter la chèvre.</strong> Une chèvre mange de 2 à 4 % de son poids en matière sèche par jour ; un foin sec contient 80 à 88 % de matière sèche. Pour une chèvre de 50 kg, c’est 1,1 à 2,5 kg de foin par jour. La saison sans gel dure 108 à 124 jours en moyenne selon la station ; en comptant le foin sur les quelque 240 à 257 autres, c’est <strong>270 à 640 kg par chèvre</strong>, avant le froid et le gaspillage. Une année courte, 89 à 95 jours sans gel ou moins, en demande davantage. Le froid compte : une chèvre au sec est à l’aise jusqu’à environ 0 °C, mais une chèvre mouillée commence à avoir froid dès 14 °C, et sous son seuil, sa ration doit monter d’environ 1 % par degré Fahrenheit, soit près de 2 % par degré Celsius. À −35 °C au vent, elle mange beaucoup plus. C’est ce foin-là que le <span class="ref">ch. 101</span> demande d’avoir avant la chèvre, et il faut les bras pour le faucher à la main.</p>
<p class="step"><span class="sn">63</span><strong>Mesurer ce que le pré donne.</strong> Le livre ne donne aucun rendement de pré : il dépend du sol, de l’herbe et de l’été. La première année, on pèse. La romaine du <span class="ref">ch. 101</span> (<span class="ref">§9</span>, étape 18) ne donne pas de kilos telle quelle : elle compare. On l’étalonne. Le sac vide suspendu au bras court, marquer d’une encoche l’endroit où le bidon l’équilibre : c’est le zéro. Mettre dans le sac 10 L d’eau en bidons pleins (1 L d’eau pèse 1 kg), marquer l’encoche du 10. Les encoches suivantes se reportent au même écart, 10 kg par écart, puisque le bidon s’éloigne du pivot d’autant pour chaque poids égal ajouté. Peser ensuite une brassée dans le même sac, compter les brassées, et comparer au foin d’une chèvre (étape 62) : le pré dit lui-même combien de bêtes il nourrit. Le lapin mange du foin à volonté, et le foin d’arbre coupé en juillet complète tout (<span class="ref">ch. 101</span>, <span class="ref">§9</span>, étape 8).</p>
<h3 class="sub">H — Le pâturage</h3>
<p class="step"><span class="sn">64</span><strong>Faire pâturer le regain.</strong> Après la fauche, l’herbe qui repousse se broute : c’est la pâture de fin d’été, sans travail de plus. La fléole supporte mieux la faux que le broutage répété : le pré se fauche d’abord, se pâture ensuite.</p>
<p class="step"><span class="sn">65</span><strong>Faire pâturer la jachère.</strong> La terre qui se repose un an sur deux porte ses herbes, et les bêtes les mangent tout l’été (étape 8).</p>
<p class="step"><span class="sn">66</span><strong>Le pré de grève.</strong> Sur les côtes du fleuve, les marais à spartine ont servi de pâturage aux troupeaux des premiers habitants, de pré à foin de mer, et de chaume pour couvrir les bâtiments. Deux conditions. L’abri des bêtes et les meules restent au-dessus de la plus haute marée d’automne (étape 30) ; les bêtes descendent pâturer à marée basse et remontent. Et un abri contre le vent et la pluie froide, qui fait perdre à la chèvre l’isolation de son poil mouillé.</p>
<h3 class="sub">I — Semer selon les signes, et ce qu’on disait de la lune</h3>
<p class="step"><span class="sn">67</span><strong>Semer quand le lilas le dit.</strong> Betterave, carotte, choux, laitue et épinard quand le lilas (<em>Syringa vulgaris</em>) est en première feuille ; haricot, concombre et courge quand il est en pleine floraison ; la pomme de terre quand les premiers pissenlits fleurissent. Pour le maïs, on attendait ailleurs que les feuilles du chêne aient la taille d’une oreille d’écureuil — le sol était alors assez chaud pour que la graine ne pourrisse pas, et la saison encore assez longue —, ou, dans la tradition des Trois Sœurs (<span class="ref">§5-B</span>), celles du cornouiller. Le chêne ne pousse pas sur la Côte-Nord. Un cornouiller y pousse, le hart rouge (cornouiller stolonifère), dans la sapinière et plus rarement dans la pessière ; mais la tradition ne dit pas de quel cornouiller elle parle, et aucun repère local n’est publié pour le maïs : sa terre se réchauffe sous plastique (étape 12).</p>
<p class="step"><span class="sn">68</span><strong>Prendre un repère qui pousse dans les conditions du jardin.</strong> Un lilas planté contre un mur au sud, ou à côté d’un stationnement, fleurit plus tôt que le jardin : il ne dit plus rien. On n’a besoin d’aucun registre : la plante fait elle-même l’addition de la chaleur de l’année.</p>
<p class="step"><span class="sn">69</span><strong>Se méfier des calendriers du sud.</strong> En règle générale, un même signe du printemps recule d’environ quatre jours par degré de latitude vers le nord. De Montréal à Sept-Îles, la latitude seule donne près de trois semaines de retard ; les formulations de la règle ne s’accordent pas sur ce qu’y ajoute la longitude. C’est un ordre de grandeur, que le fleuve et le relief déplacent encore.</p>
<p class="step"><span class="sn">70</span><strong>Tenir la lune pour ce qu’elle est : une croyance.</strong> Semer et récolter selon la phase de la lune et les signes de l’almanach : c’est une tradition presque universelle, et elle ne repose sur rien qu’on ait pu mesurer. L’attraction de la lune sur une plante est environ 300 000 fois plus faible que celle de la Terre, et la lumière de la pleine lune environ 128 000 fois plus faible que celle du soleil ; aucun lien constant n’a été trouvé entre la lune et la croissance. Elle ne fait de tort qu’une fois : quand on laisse passer une belle journée de semis, sol chaud et ciel clair, pour attendre la bonne lune.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:12.5%"><col style="width:14.8%"><col style="width:35.5%"><col style="width:37.2%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Achat de la semence de maïs</td><td>Jours à maturité sur le sachet</td><td>Le plus court trouvé ; maïs de Gaspé : épis secs vers le 20 juillet d’un semis de fin mai en Nouvelle-Écosse, soit environ 50 à 70 jours</td><td>Ne pas semer un maïs sucré ordinaire. Faire la butte en haricot à rames et courge (<span class="ref">§9</span>)</td></tr><tr><td class="c-item">Semis du maïs</td><td>Trempage ; profondeur</td><td>8 h au plus ; 2,5 à 4 cm, 5 à 7 grains par butte</td><td>Resemer ; garder humide deux semaines</td></tr><tr><td class="c-item">Buttes</td><td>Espacement</td><td>0,9 à 1,2 m dans les deux sens</td><td>Refaire avant de semer : trop serrées, la courge étouffe tout</td></tr><tr><td class="c-item">Semis des deux autres sœurs</td><td>Hauteur du maïs</td><td>Environ 15 cm ; haricot dans chaque butte, courge dans une sur sept</td><td>Attendre. Semé trop tôt, le haricot grimpe sur un maïs qui n’est pas là</td></tr><tr><td class="c-item">Toute la saison</td><td>Eau</td><td>25 mm par semaine, pluie comprise</td><td>Arroser au pied</td></tr><tr><td class="c-item">Haricot sec à la cuisson</td><td>Trempage, puis gros bouillon</td><td>Selon le <span class="ref">ch. 98</span>, étape 26</td><td>Monter à gros bouillon avant de servir, même si c’est déjà « cuit » au coin du poêle</td></tr><tr><td class="c-item">Avant la lessive du maïs</td><td>Eau de rinçage ; chaudron</td><td>Eau tiède prête pour 60 min de rinçage ; inox ou fonte</td><td>On ne verse pas la cendre</td></tr><tr><td class="c-item">Lessive du maïs</td><td>Proportion ; signes</td><td>Cendre : 1 volume pour 4 d’eau, environ 45 min. Chaux : environ 10 g par litre, 80 °C, 20 à 45 min, une nuit. Pointes noires qui flottent, pelure qui glisse</td><td>Prolonger. Rincer deux fois : aucune lessive ne doit rester</td></tr><tr><td class="c-item">Plantation des camerisiers</td><td>Variétés</td><td>Deux, non apparentées, qui fleurissent en même temps</td><td>En ajouter une compatible ; un plant seul ne donnera jamais</td></tr><tr><td class="c-item">Argousiers à la première floraison</td><td>Sexe des plants</td><td>Environ un mâle sur dix</td><td>Éliminer des mâles en trop, ou en ajouter un</td></tr><tr><td class="c-item">Pommiers</td><td>Distance entre deux variétés</td><td>30 m au plus</td><td>Planter la deuxième plus près, ou greffer une deuxième variété sur l’arbre</td></tr><tr><td class="c-item">Gadelliers</td><td>Distance aux pins blancs</td><td>300 m au moins</td><td>Déplacer les gadelliers, pas le pin</td></tr><tr><td class="c-item">Taille de fin d’hiver</td><td>Tiges gardées</td><td>Cassis : 10 à 12, la moitié d’un an. Gadellier rouge, groseillier : 9 à 12, trois ou quatre de chaque âge. Rien de plus de trois ans. Camerisier : un quart au plus</td><td>Couper au ras du sol ce qui dépasse</td></tr><tr><td class="c-item">Rhubarbe</td><td>Âge de la plantation ; tiges</td><td>Rien la 1ʳᵉ année ; quelques tiges la 2ᵉ ; tiges tirées, pas coupées ; hampe florale coupée dès qu’elle paraît</td><td>Diviser si les tiges s’amincissent ; replanter ailleurs aux 6 à 8 ans</td></tr><tr><td class="c-item">Talle</td><td>Moment de la coupe ou du feu</td><td>Dormance : feuillage rouge après la première gelée forte, ou avant le débourrement ; au printemps, sol humide et neige en lisière</td><td>Attendre la bonne fenêtre. Jamais de feu hors d’elle</td></tr><tr><td class="c-item">Talle rajeunie</td><td>Récolte</td><td>La 2ᵉ année (bleuet à feuilles étroites), la 3ᵉ (bleuet fausse-myrtille) ; cycle de 2 ou 3 ans</td><td>Rien la 2ᵉ année : coupe trop haute, ou feu trop chaud (<span class="ref">§7</span>)</td></tr><tr><td class="c-item">Fauche</td><td>Stade de l’herbe</td><td>Début à mi-floraison ; fléole avant ou à l’épiaison</td><td>Faucher sans attendre : la qualité baisse chaque jour</td></tr><tr><td class="c-item">Rentrée du foin</td><td>Humidité</td><td>25 % au plus en vrac. Le test de torsion (craque, rien ne perle, tiges comprises) dit 25 à 30 % : c’est le signal de laisser encore sécher, pas celui de rentrer</td><td>Encore du soleil ; en veillottes si la pluie menace</td></tr><tr><td class="c-item">Tas, 6 premières semaines</td><td>Sonde au cœur, 20 min, touchée du dos de la main d’abord</td><td>Tige supportable à la main. Au thermomètre : 52 °C, rien à faire</td><td>Tige trop chaude : elle ne dit pas de combien, donc le pire cas des lignes suivantes (étape 61)</td></tr><tr><td class="c-item">Tas</td><td>Température</td><td>66 °C</td><td>Zone de danger : sonder deux fois par jour, défaire le tas pour le refroidir</td></tr><tr><td class="c-item">Tas</td><td>Température</td><td>71 °C</td><td>Sonder aux deux heures. Défaire pour refroidir, mais <strong>eau prête et deux personnes avant la première fourchée</strong> : vers 77 °C, ouvrir le tas peut le faire flamber. Chaque fourchée chaude sort dehors et se noie</td></tr><tr><td class="c-item">Tas</td><td>Température</td><td>79 °C</td><td>Poches de feu probables : <strong>ne plus faire entrer d’air</strong>. Préparer l’eau et les bras (<span class="ref">§8</span>)</td></tr><tr><td class="c-item">Tas</td><td>Température</td><td>88 °C et plus</td><td>Sortir le foin chaud, eau prête : il peut s’enflammer à l’air. Chaque fourchée dehors, arrosée, loin de tout bâtiment</td></tr><tr><td class="c-item">Chèvre, l’hiver</td><td>Ration</td><td>2 à 4 % du poids en matière sèche, plus le froid</td><td>La peser ; augmenter avant qu’elle maigrisse</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:28.9%"><col style="width:27.6%"><col style="width:43.5%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Épis de maïs encore laiteux au premier gel</td><td>Variété trop tardive pour l’été qu’il a fait</td><td>Manger frais, grillé. Ne pas garder cette semence. Chercher plus hâtif (<span class="ref">ch. 100</span>)</td></tr><tr><td class="c-item">Maïs jaune et chétif, haricot vigoureux</td><td>Maïs affamé : l’azote du haricot n’arrive que l’an prochain</td><td>Compost ou fumier au pied maintenant ; replanter les mêmes buttes l’an prochain</td></tr><tr><td class="c-item">Tout le carré noyé sous les tiges de courge</td><td>Courge semée dans trop de buttes</td><td>Une butte sur sept, pas plus, l’an prochain. Couper des tiges cette année</td></tr><tr><td class="c-item">Épis moisis dans la réserve</td><td>Rentrés sans séchage</td><td>Jeter l’épi moisi entier : même la cuisson à la chaux n’enlève qu’une partie de la toxine des moisissures, pas assez pour rendre sûr un grain contaminé. Étaler le reste et laisser sécher plusieurs semaines avant de ranger</td></tr><tr><td class="c-item">Nausées, vomissements, diarrhée après un plat de haricots secs</td><td>Haricots jamais montés à gros bouillon (<span class="ref">ch. 98</span>, étape 26)</td><td>Faire boire (<span class="ref">ch. 26</span>). Le reste du plat remonte à gros bouillon ou se jette</td></tr><tr><td class="c-item">Citrouilles cueillies vertes qui pourrissent au lieu de mûrir</td><td>Empilées, ou gardées dans une cave humide</td><td>Les étaler une à une, au sec ; la cave humide pourrit la citrouille (<span class="ref">ch. 79</span>, groupe C : une pièce fraîche et sèche du chalet)</td></tr><tr><td class="c-item">Camerisiers en fleurs, aucun fruit</td><td>Une seule variété, ou deux qui ne fleurissent pas en même temps ; ou fleurs gelées sous −7 °C</td><td>Ajouter une variété compatible. Couvrir les nuits de gel de floraison</td></tr><tr><td class="c-item">Camerise bleue dehors, verte dedans</td><td>Pas mûre</td><td>Attendre ; goûter en mordant en deux</td></tr><tr><td class="c-item">Argousiers en fleurs, aucun fruit</td><td>Pas de mâle, ou que des mâles ; ou bois trop jeune</td><td>Identifier les sexes à la floraison ; attendre le bois de trois ans</td></tr><tr><td class="c-item">Pommier en fleurs chaque année, aucune pomme</td><td>Pas de deuxième variété à 30 m, ou le voisin est un pommetier ornemental à fleurs doubles</td><td>Planter une deuxième variété, ou greffer</td></tr><tr><td class="c-item">Pommes encore vertes et dures à la première grosse gelée</td><td>Variété d’octobre</td><td>Choisir une variété hâtive, comme certains pommetiers</td></tr><tr><td class="c-item">Pommier semé de pépin dont le fruit ne ressemble pas à la pomme d’origine</td><td>Normal : le pépin ne reproduit pas la pomme</td><td>Le garder s’il est bon ; sinon, s’en servir comme porte-greffe</td></tr><tr><td class="c-item">Branches de gadellier qui feuillent tard ou dépérissent ; moelle noire et creuse à la coupe</td><td>Larve de sésie dans la tige</td><td>Couper et brûler ces branches à la taille ; ne pas laisser vieillir les tiges</td></tr><tr><td class="c-item">Petites taches brunes sur les feuilles de gadellier, défeuillaison dès la fin juillet</td><td>Anthracnose, qui hiverne dans les feuilles tombées</td><td>Ramasser et brûler les feuilles tombées à l’automne ou avant le débourrement ; perte de récolte l’an prochain</td></tr><tr><td class="c-item">Poudre blanche sur les jeunes pousses de cassis ou de groseillier, qui brunit ensuite</td><td>Blanc (oïdium), favorisé par le temps chaud et humide et l’air qui ne circule pas</td><td>Couper les bouts atteints à la taille ; éclaircir ; déplacer vers un site aéré</td></tr><tr><td class="c-item">Tiges de rhubarbe de plus en plus minces</td><td>Couronne trop vieille, trop serrée</td><td>Diviser (étape 44)</td></tr><tr><td class="c-item">Feuilles de rhubarbe cuites avec les tiges ; brûlure de la bouche et de la gorge</td><td>L’acide oxalique du limbe. Les cas graves touchent les reins</td><td>Ne jamais manger le limbe ; il va au compost (<span class="ref">ch. 95</span>, <span class="ref">§7</span>)</td></tr><tr><td class="c-item">Topinambour partout, y compris là où on n’en veut plus</td><td>Normal : le moindre bout de racine repousse</td><td>Le confiner dans un coin à lui ; déterrer ce qui dépasse chaque automne</td></tr><tr><td class="c-item">Gaz et ballonnements après un plat de topinambour</td><td>Sa réserve, l’inuline, ne se digère pas</td><td>Pas un signe d’altération. En manger peu à la fois, cuit</td></tr><tr><td class="c-item">Talle envahie de jeunes bouleaux et de framboisiers</td><td>Talle qui se referme et décline</td><td>Rajeunir (étapes 48 à 50)</td></tr><tr><td class="c-item">Talle coupée ou brûlée qui repart mal</td><td>Feu trop chaud qui a brûlé l’humus et les rhizomes ; coupe trop hâtive à l’automne, qui a privé les rhizomes de leurs réserves ; ou coupe trop tardive au printemps</td><td>Si le feu a touché l’humus, y revenir d’abord : un feu de sol avance sans flamme ni fumée et peut ressortir plus loin, même après l’hiver. Gratter jusqu’au sol minéral et noyer partout où le dos de la main sent de la chaleur, et refaire le tour au dégel (<span class="ref">ch. 11</span>, <span class="ref">§9</span>). Puis laisser la partie morte se refaire d’elle-même ; brûler plus léger, ou couper à la lame, dans la fenêtre de l’étape 48</td></tr><tr><td class="c-item">Foin blanchi, décoloré</td><td>A pris la pluie en séchant</td><td>Il se donne, mais il vaut moins ; ne pas compter sur lui seul</td></tr><tr><td class="c-item">Foin poussiéreux, poudre blanche, grise ou noire au cœur des brassées</td><td>Foin moisi, rentré trop humide</td><td>Ne pas le donner au lapin (<span class="ref">ch. 101</span>, <span class="ref">§9</span>, étape 9). Le défaire dehors, jamais dans un bâtiment fermé, dos au vent, la poussière mouillée avant d’être brassée : elle donne le poumon du fermier (<span class="ref">§3</span>)</td></tr><tr><td class="c-item">Tas qui s’affaisse au centre, pluie entrée</td><td>Cœur mal tassé</td><td>Refaire le tas, cœur serré ; l’humide au soleil</td></tr><tr><td class="c-item">Tige de fer trop chaude pour la main</td><td>Le foin chauffe, et la tige ne dit pas de combien</td><td>Le pire cas du <span class="ref">§6</span> : eau prête, deux personnes, planches sur le tas ; chaque fourchée dehors et noyée (étape 61, <span class="ref">§8</span>)</td></tr><tr><td class="c-item">Chèvre qui maigrit en janvier</td><td>Ration d’été gardée en grand froid</td><td>Peser, augmenter ; l’abriter du vent et de la pluie froide</td></tr></tbody></table>
</template>
<template id="story-d">
<p class="pt"><span class="pn">1</span><strong class="plead">Un tas de foin rentré trop humide peut prendre feu tout seul, des semaines plus tard.</strong> Au-delà de 20 à 25 % d’eau, les bactéries du foin se multiplient et font monter l’intérieur du tas entre 54 et 60 °C ; d’autres bactéries, qui aiment la chaleur, prennent alors le relais et le poussent au-delà de 77 °C, où il peut s’enflammer sans étincelle. Un foin à 30 % d’eau peut rester chaud jusqu’à 40 jours, et la plupart des feux de foin se déclarent dans les six semaines qui suivent la rentrée. Trois mécanismes font de ce feu un piège :</p>
<p class="li"><strong>L’air nourrit le feu caché.</strong> Entre 66 et 77 °C, on défait le tas pour le refroidir ; mais vers le haut de cette plage, l’ouvrir lui donne l’oxygène qui lui manquait et peut le faire flamber à la fourche. Donc, dès 71 °C, et chaque fois que la tige de fer est trop chaude pour la main, parce qu’elle ne dit pas de combien : l’eau prête et deux personnes avant la première fourchée, et chaque fourchée chaude sort dehors et se noie. À 79 °C, on ne fait plus entrer d’air du tout ; à 88 °C, le foin chaud sort quand même, eau prête, parce qu’il peut s’enflammer à l’air de toute façon.</p>
<p class="li"><strong>Le foin brûle en dedans et laisse un trou.</strong> Une croûte de foin intact peut couvrir une cavité brûlée : on n’y marche que sur des planches, et jamais seul.</p>
<p class="li"><strong>Le foin qui couve dégage du monoxyde de carbone</strong>, sans odeur, qui endort avant d’alerter.</p>
<p class="pt cont0">D’où la règle qui ne se discute pas : <strong>le foin ne se range jamais sous le toit où quelqu’un dort</strong>, ni contre le chalet. Un fenil qui s’enflamme une nuit de septembre, adossé à la chambre des enfants, ne laisse le temps de rien. Et la sonde de fer passe au cœur du tas chaque jour les six premières semaines, touchée du dos de la main avant d’être empoignée : c’est l’instrument qui dit qu’il faut agir, pas de combien le tas est chaud.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Un feu de talle hors de sa fenêtre est un feu de forêt.</strong> Le brûlage ancien est sûr pour une raison précise : au printemps, le sol est humide, l’humus ne brûle pas en profondeur, et la neige qui reste en lisière arrête le feu. Qu’une seule de ces conditions manque, et c’est un autre feu. En été, par temps sec, le même feu entre dans l’humus sec, y couve sans flamme ni fumée visibles, et ressort ailleurs au premier vent (<span class="ref">ch. 11</span> : les signes du sol sec, et le point chaud qu’on cherche du dos de la main). <strong>Pas de neige en lisière, humus qui s’effrite sous le pied, vent qui monte : on coupe à la lame, on ne brûle pas.</strong> Et on ne quitte pas une talle brûlée avant d’avoir passé le dos de la main au ras du sol partout où le feu est passé — le dos, parce qu’une main à plat se referme sur ce qui brûle. Un brûlis qui a touché l’humus se revisite, au dégel aussi : un feu de sol peut passer l’hiver et ressortir plus loin. On gratte jusqu’au sol minéral et on noie (<span class="ref">ch. 11</span>, <span class="ref">§9</span>).</p>
<p class="pt"><span class="pn">3</span><strong class="plead">La lessive du maïs rend aveugle.</strong> La cendre bouillie dans l’eau fait une lessive, de la même famille que celle du savon, et la chaux éteinte aussi. <strong>Le mécanisme :</strong> une base dissout les tissus et continue de s’enfoncer tant qu’on ne la rince pas ; une brûlure qui ne fait pas mal tout de suite travaille encore. L’eau de rinçage tiède est donc prête <strong>avant</strong> qu’on verse la cendre ou la chaux, de quoi rincer 60 minutes sans interrompre, yeux ou peau (<span class="ref">ch. 112</span>, <span class="ref">§8</span>.1). Jamais de chaudron d’aluminium : la lessive l’attaque et en tire de l’hydrogène, qui s’enflamme au poêle (<span class="ref">ch. 112</span>, <span class="ref">§8</span>.2). Et le grain se rince jusqu’à ce qu’il ne reste aucune lessive : ce qui en reste brûle la bouche de ceux qui le mangent.</p>
