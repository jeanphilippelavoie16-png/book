<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>44 — Pister et retracer une bête — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}

<div id="book"></div>
<template id="open"><header class="open"><div class="open-top"><span>Tome 3 · Prélever</span><span>Chapitre</span></div><div class="open-title"><div class="num">44</div><h1>Pister et retracer une bête</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span>Chalet</span><span class="on">Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Suivre une bête vivante sans la lever jusqu’à un seul coup, puis, si elle part touchée, attendre le temps que dit la blessure et la retracer signe par signe : c’est ce qui fait qu’un orignal (<em>Alces americanus</em>) tiré finit sur la perche du chalet au lieu de pourrir à trois kilomètres.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h4 class="choix">C’est le bon choix :</h4>
<p class="li"><strong>Après tout coup de feu sur une bête qui est partie, même si on croit l’avoir manquée.</strong> Une bête touchée au cœur ou aux poumons part souvent à pleine course, et certaines s’en vont comme si le coup les avait ratées. On retrace d’abord ; on conclut au raté seulement au bout de la recherche.</p>
<p class="li"><strong>Au matin d’une neige tombée dans la nuit et arrêtée avant l’aube.</strong> Toutes les pistes visibles ont été faites pendant la nuit : la plus fraîche est celle qu’on suit.</p>
<p class="li"><strong>Sur une neige profonde à croûte de fin d’hiver</strong>, qui casse sous la botte et sous l’orignal mais porte l’homme en raquettes (<span class="ref">§9</span>).</p>
<p class="li"><strong>Sur un coup de muscle d’orignal</strong> (patte, cou, croupe, dos), quand on en est sûr et que le terrain est ouvert ou la neige bonne. C’est le seul cas où l’on suit <strong>tout de suite et vite</strong>, à l’inverse de tout le reste du chapitre : la bête qu’on laisse se calmer cesse de saigner et survit ; celle qu’on pousse continue de saigner, se fatigue et offre un deuxième coup. Elle finit aussi par s’arrêter épuisée, et c’est l’orignal qui charge : on l’approche par le côté, un arbre à portée, jamais avec le chien (<span class="ref">§8</span>, bloc 2). <strong>Jamais pour un ours</strong>, touché où que ce soit : il relève de l’attente et du bloc 1 du <span class="ref">§8</span>.</p>
<h4 class="choix">C’est un mauvais choix :</h4>
<p class="li"><strong>Suivre tout de suite une bête touchée à la panse.</strong> C’est le réflexe, et c’est lui qui perd la bête : sentie suivie, elle va plus vite que l’homme et beaucoup plus loin. Une bête blessée qu’on pousse peut aller jusqu’à <strong>10 à 12 km</strong> du coup de feu.</p>
<p class="li"><strong>Juger l’âge d’une piste à l’œil par grand froid calme.</strong> Sans soleil ni vent, une piste de plusieurs jours garde ses bords nets et a l’air de la matinée : seul le souffle sur les miettes tranche (étape 3).</p>
<p class="li"><strong>Suivre un ours noir (<em>Ursus americanus</em>) blessé dans le couvert épais à la brunante.</strong> Il saigne peu, il va au plus serré, et on le trouve à la distance où l’on ne peut plus épauler (<span class="ref">§8</span>, bloc 1).</p>
<p class="li"><strong>Mettre un chien libre sur une bête blessée</strong>, et à plus forte raison sur un orignal épuisé dans la neige profonde : le chien libre pousse la bête, et l’orignal va chercher le chien, laisse ou pas (<span class="ref">§8</span>, bloc 2).</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">Une bête blessée qui ne se sent pas suivie se couche.</strong> Elle cherche à se reposer, et c’est couchée que l’hémorragie fait son œuvre : la bête est alors souvent retrouvée morte à quelques centaines de mètres de l’endroit du coup, et, dans les recherches faites au chien, trois fois sur cinq à moins de 180 m. Une bête qu’on talonne court sur son adrénaline, cesse de se coucher et met des kilomètres entre elle et le chercheur. L’attente n’est pas de la politesse, c’est l’outil principal du chapitre.</p>
<p class="p0 ri"><strong class="runin">La poursuite coûte la viande deux fois.</strong> Le muscle vivant garde son énergie sous forme de glycogène. Après la mort, ce glycogène devient de l’acide lactique, et le muscle passe d’un pH d’environ <strong>6,9 à environ 5,5</strong> : c’est cette acidité qui donne la couleur rouge vif et qui freine les bactéries d’altération. Une bête qui a couru, qui a eu peur, qui s’est épuisée, a brûlé son glycogène avant de mourir : son muscle reste au-dessus de <strong>5,8</strong>, et la viande se garde moins longtemps, sans forcément paraître sombre. Plus haut encore, au-dessus de <strong>6,2</strong>, elle sort franchement sombre, ferme et sèche<sup class="fnr" data-fn="44-1">1</sup> : la couleur n’avertit que du cas marqué. Le glycogène ne se refait qu’au repos : une nuit le plus souvent, et jusqu’à quatre jours après un gros effort. Une bête poussée n’a pas ce repos. La bête perdue coûte toute la viande ; la bête retrouvée après une longue poursuite en coûte une partie.</p>
<p class="p0 ri"><strong class="runin">L’orignal voit mal et sent tout.</strong> Sa vue est faible ; son odorat et son ouïe compensent. Ce qui le fait partir, c’est l’odeur qui lui arrive et le bruit, beaucoup plus que la silhouette immobile. Tout le pistage d’une bête vivante se ramène donc au vent : où va l’air entre soi et la bête. Et la bête surveille sa propre piste : avant de se coucher, l’orignal marche contre le vent un moment, puis revient en arrière en décrivant un cercle partiel. Celui qui suit la piste arrive alors vers lui le vent dans le dos, et c’est son odeur qui le précède.</p>
<p class="p0 ri"><strong class="runin">Chaque organe saigne à sa façon.</strong> Le poumon mêle de l’air au sang : des bulles, un rose clair, une écume. Le foie est gorgé de sang pauvre en oxygène : un rouge très foncé, presque noir. Une artère sous pression gicle en fines gouttelettes rouge vif. La panse et l’intestin donnent peu de sang et beaucoup de ce qu’ils contiennent. Un muscle saigne franc, puis la plaie se referme quand la bête se calme. Lire le sang, c’est savoir quel organe est ouvert, donc combien de temps la bête mettra à mourir, donc combien de temps attendre.</p>
<p class="p0 ri"><strong class="runin">Une piste vieillit avec la météo, pas avec l’horloge.</strong> Les miettes de neige projetées par un pas restent poudreuses un moment, puis se soudent à la neige autour : c’est le même phénomène qui permet de bâtir un abri de neige. Le soleil fond les bords nets, le vent les arrondit. Par grand froid calme, rien de tout ça n’arrive, et une vieille piste ment.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Ce qu’il faut pour <strong>cette</strong> procédure. La frontale, la boussole, les jumelles et le dossard orange s’achètent au chapitre 00b.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Arme chargée, pour le coup de grâce et pour l’ours, de jour comme de nuit</td><td>1</td><td>Aucune pour l’ours. Pour l’orignal, rien ne remplace une arme à l’approche : sans elle, on n’approche pas, on attend de loin que le flanc ne bouge plus</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Ruban de marquage de couleur vive</td><td>1 rouleau</td><td>Papier hygiénique, qui se voit de loin et fond dans la pluie ; bandes de sac de plastique de couleur ; retailles de tissu ; lanière d’écorce de bouleau retournée, côté blanc dehors ; branche cassée qui pend (<span class="ref">§9</span>)</td><td>Oui</td></tr><tr><td class="c-item">Boussole</td><td>1</td><td>Deux repères alignés sur la ligne de fuite ; la ligne de rubans elle-même, qui donne la direction ; le fleuve, qui est au sud (<span class="ref">ch. 42</span> <span class="ref">§9</span>)</td><td>Oui, de jour. <strong>Non</strong> la nuit</td></tr><tr><td class="c-item">Jumelles</td><td>1 paire</td><td>S’asseoir et chercher des morceaux de bête plutôt qu’une bête : une oreille, une patte, une ligne horizontale dans un fouillis vertical (étape 9)</td><td>Oui</td></tr><tr><td class="c-item">Lampe frontale et piles de rechange portées contre le corps</td><td>1 par chercheur</td><td>Torche d’écorce de bouleau, sur la neige ou un sol détrempé seulement, et à deux (<span class="ref">§9</span>) ; ou rien, et la recherche reprend à l’aube (étape 34)</td><td>Oui</td></tr><tr><td class="c-item">Peroxyde d’hydrogène en petit flacon</td><td>1</td><td>Doigt mouillé frotté sur la tache : le sang s’étale en rouge, la couleur d’une feuille d’automne ne bouge pas (étape 21)</td><td>Oui</td></tr><tr><td class="c-item">Couteau et corde</td><td>1 et 1</td><td>Ce que demande la bête trouvée (<span class="ref">ch. 61</span>, <span class="ref">§4</span>)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Chien et laisse de <strong>6 à 9 m</strong>, tenue à la main</td><td>1</td><td>Corde à linge légère pour commencer, corde d’escalade ensuite ; sans chien, deux paires d’yeux (<span class="ref">§9</span>)</td><td>Oui</td></tr><tr><td class="c-item">Vêtement orangé, visible de dos, d’épaule et de face</td><td>1 par chercheur</td><td>Tout ce qui est orange et large (<span class="ref">ch. 42</span>, <span class="ref">§4</span>). Jamais de blanc ni de beige : à distance, c’est la couleur d’une croupe de bête</td><td><span class="non">NON</span> <span class="negx">dès que d’autres chassent le secteur, seul comme à plusieurs : l’homme accroupi dans les aulnes sur une piste de bête est exactement la silhouette brune que l’autre cherche (<span class="ref">ch. 42</span>, <span class="ref">§8</span>, bloc 4)</span></td></tr></tbody></table>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — Pister une bête vivante</h3>
<p class="p0">Lire une piste de bête saine — l’empreinte, le sens de la marche, l’âge, la piste sans neige — est au chapitre 43. Ce bloc-ci ne garde que ce qui sert à approcher une bête pour la tirer.</p>
<p class="step pk-d"><span class="sn">1</span><strong>Reconnaître la piste d’orignal : chapitre 43 (5-B).</strong> Le sabot et ses dimensions, les ergots. Deux pistes fraîches ensemble, une grande et une minuscule, c’est une femelle et son petit veau : on ne la suit plus (43, <span class="ref">§8</span>, bloc 2 ; ici, <span class="ref">§8</span>, bloc 2).</p>
<p class="step"><span class="sn">2</span><strong>Savoir dans quel sens elle va : chapitre 43 (étape 8).</strong> Les miettes projetées devant, le trou en trois parties, la main au fond.</p>
<p class="step"><span class="sn">3</span><strong>Dater la piste au souffle : chapitre 43 (étape 9).</strong> Si les miettes s’envolent, la bête est passée il y a moins de 20 minutes à une heure et elle est probablement tout près. Par grand froid calme, c’est la seule datation qui tienne (<span class="ref">§2</span>). La fraîcheur à trois niveaux du chapitre 42 (étape 6) sert à la carte ; pour suivre, une seule question compte : est-elle encore là ?</p>
<p class="step"><span class="sn">4</span><strong>Lire l’allure.</strong> L’orignal marche : c’est son allure de tous les jours. Sabots écartés, ergots marqués même sur sol dur, neige projetée loin devant : il court (43, 5-B). Dans un piétinement de vieilles pistes, la bonne est souvent la seule qui montre de la <strong>hâte</strong> : c’est à ça qu’on reconnaît, au point d’impact, la piste de la bête qu’on vient de tirer (étape 20). Une piste qui ralentit, qui zigzague d’une branche broutée à l’autre, annonce une bête qui mange ; une piste qui se met à tourner annonce une bête qui va se coucher (étape 7).</p>
<p class="step"><span class="sn">5</span><strong>Mettre le vent dans la face, ou de travers.</strong> Le vent se lit avant de partir et à chaque arrêt, à la pincée de neige fine ou de cendre lâchée à hauteur d’épaule (43, <span class="ref">§9</span>) ; un brin de duvet de quenouille accroché au canon le montre en continu pendant qu’on avance. On approche la bête en restant sous le vent, jamais au vent. Deux vents s’ajoutent au vent général, et ils décident de tout par temps calme :</p>
<p class="li"><strong>Le long des pentes.</strong> Au soleil, l’air chauffé monte le long des versants ; la nuit, et au petit matin tant que le soleil n’a pas touché la pente, l’air refroidi descend vers les fonds. Cette brise ne s’installe que si le vent général est faible. Quand l’air descend, on approche par en bas ; quand il monte, par en haut.</p>
<p class="li"><strong>Le long du fleuve.</strong> La brise du large qui entre sur la terre le jour est une brise de temps chaud : il faut que la terre chauffe plus vite que l’eau. De la mi-septembre à mars, la saison où l’on chasse, on ne compte pas dessus. Ce qui reste, c’est la brise de terre, faible, de nuit : l’air de la terre refroidie coule vers l’eau, surtout à l’automne et l’hiver, quand l’eau reste plus chaude que les nuits.</p>
<p class="step"><span class="sn">6</span><strong>Avancer comme on attend.</strong> Quelques pas lents, puis l’arrêt, immobile, plusieurs minutes, à regarder et à écouter : on passe <strong>au moins dix fois plus de temps immobile qu’en marche</strong>. Silhouette basse, jamais sur une crête. Quand la bête est en vue, même si elle a remarqué quelque chose, on avance en biais, jamais droit sur elle : une ligne oblique menace moins qu’une ligne droite. On ne bouge que lorsqu’elle a la tête basse ou cachée. Les heures qui rendent sont celles du petit matin et de la brunante, quand les bêtes bougent.</p>
<p class="step"><span class="sn">7</span><strong>Quand la piste se met à tourner, la quitter.</strong> C’est le crochet de l’orignal : il a marché contre le vent, il revient sur ses pas en arc de cercle et il se couche près de sa piste, du côté où l’odeur de celui qui suit lui arrivera. Continuer sur la piste, c’est lui livrer son odeur par le chemin qu’il a préparé. On la quitte, on fait un détour par le côté sous le vent, et on revient vers l’endroit où il est probablement couché <strong>le vent dans la face</strong>, lentement, en regardant loin devant, pas au sol.</p>
<p class="step"><span class="sn">8</span><strong>Ne pas la lever.</strong> Un orignal effrayé s’enfonce avec fracas dans le sous-bois ; le même, qui ne sait pas encore, se déplace presque aussi silencieusement qu’un chat : ne rien entendre ne veut pas dire qu’il n’est pas là.</p>
<p class="step pk-d"><span class="sn">9</span><strong>Chercher des morceaux, pas une bête — et ne jamais tirer sur un morceau.</strong> Dans les aulnes et les saules, on ne voit pas un orignal, on voit une oreille qui bouge à une trentaine de mètres, une patte grise, une ligne horizontale au milieu de tiges toutes verticales. Les pattes de l’orignal sont guêtrées de gris ou de blanc sous une robe brun foncé presque noire : le bas des pattes, pâle, se détache souvent mieux que le corps. Le morceau sert à <strong>repérer</strong>. Pour <strong>tirer</strong>, il faut la bête entière, vue et reconnue : l’œil qui complète un orignal à partir d’une patte grise le complète aussi sur une jambe de pantalon gris qui bouge dans les aulnes (<span class="ref">§8</span>, bloc 6).</p>
<p class="step"><span class="sn">10</span><strong>Deviner où elle va.</strong></p>
<table class="tspan"><colgroup><col style="width:11.9%"><col style="width:49.4%"><col style="width:38.7%"></colgroup><thead><tr><th>Moment</th><th>Où elle se tient</th><th>Ce que ça veut dire pour le pisteur</th></tr></thead><tbody><tr><td class="c-item">Été</td><td>Dans l’eau ou à côté : lacs, étangs de castor, plantes aquatiques ; à l’ombre des bois frais aux heures chaudes. L’orignal souffre de la chaleur</td><td>La piste mène à l’eau ; aux heures chaudes, la bête couchée est à l’ombre, dans le bois frais</td></tr><tr><td class="c-item">Rut, à partir de la mi-septembre</td><td>Les femelles appellent, les mâles répondent ; le mâle reste avec la même femelle une bonne partie du rut</td><td>Deux pistes ensemble, une grande et une moyenne ; mâles parfois agressifs envers l’homme (<span class="ref">§8</span>, bloc 2)</td></tr><tr><td class="c-item">Hiver</td><td>Activité réduite au minimum : c’est la saison de famine. Rameaux de sapin baumier (<em>Abies balsamea</em>), de bouleau, de saule, de cornouiller ; écorce de peuplier à la fin de l’hiver</td><td>Peu de déplacements ; broutage frais et crottes d’hiver, dures et sèches, qui mènent à elles</td></tr><tr><td class="c-item">Toute l’année, bête blessée</td><td>Le couvert épais, la descente, l’eau ; pour l’ours, le marécage, la tourbière, l’aulnaie</td><td>C’est là qu’on cherche quand la piste se perd (étape 32)</td></tr></tbody></table>
<p class="step pk-d"><span class="sn">11</span><strong>Travailler à deux.</strong> Le pisteur suit la piste, lentement. L’autre marche <strong>en retrait et sur le côté</strong>, jamais devant : sur une piste qui remonte le vent, l’homme placé devant est au vent de l’endroit où la bête ira se coucher, et c’est lui qu’elle sentira. Quand la piste se met à tourner, le pisteur s’arrête et ne bouge plus. Le deuxième fait seul le détour de l’étape 7, sous le vent, et revient le vent dans la face vers l’endroit où la bête est probablement couchée : <strong>en arrière</strong> du tournant, du côté où l’arc revient, pas plus loin sur la piste. Le pisteur sait par où l’autre est parti et ne tire jamais dans cette direction ; seul tire celui qui voit la bête entière sans l’autre dans son champ (<span class="ref">§8</span>, bloc 6).</p>
<p class="step pk-d"><span class="sn">12</span><strong>La pousse, pour un couvert qu’on connaît.</strong> À plusieurs : les pousseurs traversent le couvert, espacés, et les posteurs attendent au bout, là où la bête en sortira. Le but est de faire <strong>marcher</strong> la bête hors du couvert, pas de la faire courir : on pousse lentement, sans cris. Chacun sait où sont tous les autres avant le départ, et chaque posteur sait où sont ses deux voisins (<span class="ref">§8</span>, bloc 5). La pousse demande de connaître le terrain par cœur : où sont les coulées, par où sort une bête. Ça s’apprend en marchant les lisières du couvert en dehors de la chasse (<span class="ref">ch. 42</span>, étape 6).</p>
<h3 class="sub">B — Au coup de feu</h3>
<p class="step"><span class="sn">13</span><strong>Rester immobile et regarder.</strong> Tout se passe en même temps : on ne bouge pas, on garde les yeux sur la bête et l’oreille ouverte. Ce que la bête fait au coup se lit avec le tableau de l’étape 18. Une bête qui tombe sur place n’est pas une bête morte : elle est touchée à la colonne, et le choc peut la laisser paralysée une minute avant qu’elle se relève et reparte. <strong>On tire de nouveau tout de suite, sans attendre.</strong></p>
<p class="step"><span class="sn">14</span><strong>Marquer trois endroits avant de faire un pas.</strong> L’endroit exact où se tenait la bête au coup, pris sur un arbre ou une roche qu’on reconnaîtra de près ; l’endroit où elle a disparu, pris de la même façon ; et l’endroit où l’on se tenait soi-même, marqué d’un ruban ou du chapeau posé. Dès qu’on quitte son poste, la perspective change et plus rien ne ressemble à ce qu’on a vu. Un azimut à la boussole, du poste vers le point de disparition, fixe la direction. Un coup d’œil aux jumelles vers la fuite : la bête est peut-être tombée, ou debout dans le couvert, à regarder si on la suit.</p>
<p class="step"><span class="sn">15</span><strong>Écouter.</strong> Une bête qui s’écroule plus loin fait un bruit de chute, de branches cassées, parfois de coups de patte.</p>
<p class="step"><span class="sn">16</span><strong>Écrire l’heure du coup de feu sur deux rubans : un noué au poste, un gardé sur soi.</strong> C’est l’heure de départ des 24 heures du chapitre 61 si la bête est retrouvée morte plus tard : une bête qu’on retrouve le lendemain est morte <strong>après</strong> le coup, jamais avant, et c’est donc l’heure du coup qui compte, pas celle de la trouvaille. Le ruban du poste reste peut-être à des centaines de mètres de la bête ; celui de la poche, noué à la crosse ou au bouton du manteau, arrive avec elle, et l’heure se recopie sur la bête à la trouvaille (<span class="ref">ch. 61</span>, étape 4). On écrit sur la chose, pas dans un carnet.</p>
<p class="step"><span class="sn">17</span><strong>Ne jamais conclure au raté.</strong> Tant que la recherche n’est pas faite, la bête est touchée.</p>
<h3 class="sub">C — Attendre</h3>
<p class="step"><span class="sn">18</span><strong>Lire la réaction et choisir l’attente.</strong></p>
<table class="tspan"><colgroup><col style="width:25.0%"><col style="width:13.5%"><col style="width:15.8%"><col style="width:18.3%"><col style="width:27.4%"></colgroup><thead><tr><th>Ce que la bête a fait au coup</th><th>Ce que ça dit</th><th>Attendre au moins</th><th>Plus sûr</th><th>Ce que fait la bête</th></tr></thead><tbody><tr><td class="c-item">A rué des pattes arrière, puis a couru ; a titubé ; s’est effondrée ou s’est battue avec une branche</td><td>Organes vitaux</td><td><strong>30 min à 1 h</strong></td><td>1 h</td><td>Meurt en quelques secondes à quelques minutes ; peut courir de <strong>30 à 180 m</strong> sur l’adrénaline</td></tr><tr><td class="c-item">Sang rouge vif abondant, en gerbe, dès le départ</td><td>Cœur ou grosse artère</td><td><strong>30 min à 1 h</strong></td><td>1 h</td><td>Sprint court, quelques secondes à une minute</td></tr><tr><td class="c-item">Sang rose, mousseux<sup class="fnr" data-fn="44-2">2</sup></td><td>Poumons</td><td><strong>30 min à 1 h</strong></td><td>2 h ; <strong>4 à 6 h</strong> si un seul poumon semble touché (sang rose, aqueux, bulles très fines)</td><td>Deux poumons : quelques minutes. Un seul : des heures, parfois survie</td></tr><tr><td class="c-item">Bête voûtée, queue basse, qui s’en va au pas</td><td>Foie, panse ou intestin : le geste ne les sépare pas</td><td><strong>6 h</strong></td><td><strong>Toute la nuit</strong>, tant que le sang (étape 21) n’a pas dit lequel ; le délai de l’intestin, 24 à 36 h, si rien ne le dit</td><td>Selon l’organe : foie, 30 min à 3 ou 4 h ; panse ou intestin, de 8 h à plusieurs jours</td></tr><tr><td class="c-item">Sang foncé presque noir</td><td>Foie ou rein</td><td><strong>6 h</strong></td><td>Le lendemain matin si le coup est tiré tard ; <strong>8 à 12 h</strong></td><td>Se couche et meurt si on ne la pousse pas, en 30 min à 3 ou 4 h</td></tr><tr><td class="c-item">Sang pauvre, verdâtre, mêlé de brins de végétation ; odeur de panse<sup class="fnr" data-fn="44-3">3</sup> ; bête voûtée</td><td>Panse ou intestin</td><td><strong>6 h</strong>, même si la pluie, la neige ou la nuit menacent la piste</td><td><strong>Toute la nuit</strong> ; 18 à 24 h pour la panse, 24 à 36 h pour l’intestin</td><td>Mort lente : de 8 h à plusieurs jours. Poussée, elle part très loin</td></tr><tr><td class="c-item">Aucune réaction, ou un trot court</td><td>Raté possible, ou blessure légère</td><td><strong>30 min à 1 h</strong>, puis recherche complète</td><td>—</td><td>—</td></tr><tr><td class="c-item">Ours, même touché aux poumons</td><td>Organes vitaux</td><td><strong>30 min</strong></td><td>—</td><td>Saigne peu (<span class="ref">§8</span>, bloc 1)</td></tr><tr><td class="c-item">Tombée sur place</td><td>Colonne vertébrale</td><td><strong>Aucune</strong> : second coup immédiat</td><td>—</td><td>Peut se relever en une minute</td></tr><tr><td class="c-item">Orignal, coup sûr de patte, de cou, de croupe ou de dos, neige ou terrain ouvert</td><td>Muscle, sans organe</td><td><strong>Aucune</strong> : suivre tout de suite, vite. <strong>Jamais pour un ours</strong> : ligne « Ours »</td><td>—</td><td>Cesse de saigner si on la laisse ; s’épuise si on la pousse, et l’orignal épuisé charge (<span class="ref">§8</span>, bloc 2)</td></tr><tr><td class="c-item">Doute complet</td><td>—</td><td><strong>30 à 60 min</strong></td><td>—</td><td>—</td></tr></tbody></table>
<p class="p0">Les durées de la colonne « Ce que fait la bête » viennent du cerf de Virginie (<em>Odocoileus virginianus</em>). Chez l’orignal adulte tiré à la balle, le cœur touché le fait tomber en une dizaine de secondes, les deux poumons en une trentaine ; il court en moyenne 65 m, parfois jusqu’à 300 m, plus loin que le cerf : plus la bête est lourde, plus elle court loin. Pour le foie, la panse et l’intestin, rien n’est chiffré chez l’orignal : les attentes du tableau valent comme minimum.</p>
<p class="p0 ri"><strong class="runin">Une bête retrouvée plus de 24 heures après le coup a manqué son 7 °C</strong>, puisqu’elle n’a été ni ouverte ni refroidie : c’est le cas de toute bête attendue pour l’intestin. Le chapitre 61 (<span class="ref">§7</span>) s’applique d’office : pas de salaison longue, pas de fumage à froid ; et la bête touchée à la panse dont le contenu s’est étalé ne se sale ni ne se sèche.</p>
<p class="step"><span class="sn">19</span><strong>Attendre sans bouger, et sans suivre « juste pour voir ».</strong> Une bête touchée à la panse ne se suit même pas le temps d’aller chercher sa flèche. Si la bête se lève devant soi pendant la recherche, c’est que l’attente a été trop courte : on marque le dernier signe, on recule par où l’on est venu, et on reprend là <strong>au lever du jour</strong>. Une bête morte près du coup se retrouve, même sous une bonne neige ; la même bête poussée, morte à des kilomètres sous une neige mince, se retrouve beaucoup plus mal. L’attente se passe assis, habillé pour le froid, parce que l’homme qui a transpiré à l’approche gèle pendant qu’il attend (<span class="ref">ch. 25</span>).</p>
<h3 class="sub">D — Lire le point d’impact et le sang</h3>
<p class="step"><span class="sn">20</span><strong>Aller au point d’impact par le côté.</strong> Lentement, par un chemin qu’on n’aura pas besoin de relire, sans piétiner l’endroit où la bête se tenait. On y cherche le sang, le poil, les fragments d’os ou de viande, la flèche. Un point d’impact sans rien n’est pas un raté : on élargit en cercle jusqu’à la première piste qui montre de la hâte. Un premier ruban marque l’endroit.</p>
<p class="step"><span class="sn">21</span><strong>Lire le sang.</strong></p>
<table class="tspan"><colgroup><col style="width:35.0%"><col style="width:22.2%"><col style="width:42.8%"></colgroup><thead><tr><th>Ce qu’on voit</th><th>Ce que c’est</th><th>Ce que ça dit de la suite</th></tr></thead><tbody><tr><td class="c-item">Rouge clair à rose, mousseux, petites bulles</td><td>Poumons ou trachée</td><td>Bête qui meurt vite ; mais un coup <strong>haut</strong> aux poumons ne saigne pas dehors tant que la cage ne s’est pas remplie : la piste commence tard</td></tr><tr><td class="c-item">Rose, aqueux, bulles très fines, mêlé de rouge vif</td><td>Un seul poumon, et le muscle de l’épaule autour</td><td>Longue attente (étape 18)</td></tr><tr><td class="c-item">Rouge vif en fines gouttelettes, en gerbe, sur la végétation</td><td>Artère, sang sous pression</td><td>Piste abondante qui commence tout de suite ; bête proche</td></tr><tr><td class="c-item">Rouge très foncé, presque noir, sans bulles</td><td>Foie (ou rein) : sang de veine, pauvre en oxygène</td><td>Longue attente</td></tr><tr><td class="c-item">Sang rare, verdâtre ou clair, avec brins de végétation, suif ou liquide ; odeur aigre</td><td>Panse ou intestin</td><td>Attente de la nuit entière</td></tr><tr><td class="c-item">Rouge vif qui diminue de tache en tache ; bête qui ne se couche pas ou qui boite</td><td>Muscle, os de patte</td><td>Blessure qui se referme ; pour l’orignal, suivre vite ou pas du tout (étape 18). Pour l’ours, jamais vite (<span class="ref">§8</span>, bloc 1)</td></tr><tr><td class="c-item">Fragments d’os</td><td>Os touché : patte, épaule, colonne</td><td>Une bête touchée à l’épaule ou à la patte peut survivre ; elle boite</td></tr><tr><td class="c-item">Sang qui brunit et se confond avec les feuilles</td><td>Sang séché</td><td>Une goutte de peroxyde : le sang mousse au contact. Sans peroxyde, le doigt mouillé (<span class="ref">§9</span>, « Le test du sang »)</td></tr></tbody></table>
<p class="p0 ri"><strong class="runin">Le poil dit où.</strong> Sur le cerf, le poil du dos est long, grossier et foncé, souvent à pointe noire ; celui des flancs est court, brun à pointe foncée ; le bas de la cage mêle du blanc et du brun foncé, droit et épais ; celui du ventre est blanc, long, fin, parfois frisé. Pour l’orignal, deux repères sont sûrs : le poil le plus long, sur la bosse des épaules, et celui du bas des pattes, gris ou blanc, sans poil fin dessous. Le reste de la carte n’est publié nulle part. La prochaine bête dépecée montre la vraie carte : le poil du dos, du flanc, du ventre et de la patte, regardé une fois entre les doigts.</p>
<p class="step"><span class="sn">22</span><strong>Lire la flèche, s’il y en a une.</strong> Sang rouge vif ou rose mousseux dessus : organes vitaux. Sang foncé, bile, contenu d’estomac, flèche gluante à l’odeur aigre ou douceâtre, avec des débris de végétation ou du gravier : cavité abdominale. Presque rien : une éraflure. On la garde intacte, sans l’essuyer : elle est un indice pour toute la suite.</p>
<p class="step"><span class="sn">23</span><strong>Lire la hauteur et le côté.</strong> Du sang des deux côtés de la piste : la balle ou la flèche a traversé à plat. Du sang d’un seul côté : entrée haute, trajet plongeant, et souvent peu de sang dehors, parce que la sortie se bouche de poil, de gras ou d’organe. La hauteur du sang sur les branches donne la hauteur de la plaie. Les éclaboussures s’allongent <strong>dans le sens où la bête va</strong>.</p>
<h3 class="sub">E — Suivre</h3>
<p class="step"><span class="sn">24</span><strong>Marcher à côté de la piste, jamais dessus.</strong> On relira peut-être cette piste au retour, ou un chien la suivra : ce qu’on écrase est perdu pour les deux.</p>
<p class="step"><span class="sn">25</span><strong>Marquer chaque signe, et regarder la ligne des rubans.</strong> Un ruban à chaque tache ou chaque pas lisible. Trois rubans en ligne donnent la direction mieux que n’importe quel instinct : quand la piste se perd, on prolonge la ligne. Les rubans servent aussi à la nuit, à la pluie et au lendemain : la pluie efface une piste de sang en peu de temps, les rubans restent.</p>
<p class="step pk-d"><span class="sn">26</span><strong>Un sur le sang, un devant.</strong> À deux, l’un ne quitte jamais le dernier signe trouvé ; l’autre cherche le suivant et regarde loin devant, sans jamais entrer dans l’axe de l’arme du premier (<span class="ref">§8</span>, bloc 6). Une deuxième paire d’yeux double les signes trouvés. Seul, on ne dépasse jamais le dernier ruban sans avoir trouvé le signe suivant.</p>
<p class="step"><span class="sn">27</span><strong>La tête haute.</strong> Le nez au sol sur des gouttes, on rate la piste elle-même, les branches cassées qui disent par où la bête est passée, et la bête couchée devant. On regarde devant, à la hauteur où la bête serait couchée, et on ne baisse les yeux que pour confirmer. Les gouttes les plus fines se voient à genoux, sur les feuilles, les roches et les troncs couchés.</p>
<p class="step"><span class="sn">28</span><strong>Lire les lits.</strong> Un lit tiède, une neige fondue au fond, une bête qui se lève devant soi : on est trop près. Une bête couchée tête haute saute quand on approche. On recule, on marque, on attend <strong>une heure ou deux</strong> avant de reprendre.</p>
<p class="step"><span class="sn">29</span><strong>Lire la piste sans sang.</strong> Même avec du sang, la piste se suit surtout par ce qui a bougé : litière retournée, empreintes enfoncées, herbes couchées dans le sens de la fuite, prêles cassées, branches cassées, feuilles déplacées. Au petit matin, la ligne de rosée<sup class="fnr" data-fn="44-4">4</sup>. Tout ça se lit comme au chapitre 43 (<span class="ref">§9</span>, « Lire sans neige »), et se lit aussi sur une bête qui ne saigne plus (<span class="ref">§9</span>).</p>
<h3 class="sub">F — Quand le sang s’arrête</h3>
<p class="step"><span class="sn">30</span><strong>Savoir pourquoi il s’arrête.</strong> Trois raisons : la plaie est bouchée par un organe, du gras, du poil ou la flèche ; le coup est haut et le sang s’accumule dans la poitrine ou le ventre ; ou la bête s’est vidée de son sang et marche encore, sur ses derniers mètres. Dans les deux derniers cas, elle est tout près.</p>
<p class="step"><span class="sn">31</span><strong>Revenir au dernier ruban et chercher avec méthode.</strong> Deux façons :</p>
<p class="li"><strong>en cercles</strong> qui s’élargissent autour du dernier ruban ;</p>
<p class="li"><strong>en carré qui s’élargit</strong> : on marche droit, on tourne toujours du même côté, et chaque côté est un peu plus long que le précédent ; le chemin s’enroule autour du dernier ruban et couvre le terrain sans le repiétiner.</p>
<p>On se sert de la carte ou de repères pour ne pas laisser de trou dans le carré. Un orignal ou un ours couché se laissent dépasser : un jeune mâle blessé a déjà été retrouvé couché dans le fourré à moins de deux cents mètres, après qu’on fut passé à côté de lui.</p>
<p class="step"><span class="sn">32</span><strong>Chercher d’abord là où une bête blessée irait.</strong> Les coulées et les sentiers, surtout ceux qui <strong>descendent</strong>, et ceux qui mènent à <strong>l’eau</strong> ; le couvert le plus épais ; pour l’ours, le marécage et l’aulnaie. On regarde ce qui attire une bête qui fuit : une trouée, un passage, un fourré.</p>
<p class="step"><span class="sn">33</span><strong>Écouter les oiseaux.</strong> Les corbeaux et les corneilles qui appellent, les geais, l’écureuil roux (<em>Tamiasciurus hudsonicus</em>) qui s’alarme au même endroit : ils disent souvent où est la bête. Le lendemain matin, ce sont eux qui la trouvent les premiers.</p>
<h3 class="sub">G — La nuit, la neige, la pluie</h3>
<p class="step"><span class="sn">34</span><strong>La noirceur arrête la recherche d’une bête vivante.</strong> On marque le dernier signe de deux rubans, on prend l’azimut du retour, et on revient au lever du jour, en regardant et en écoutant pour le grand corbeau (<em>Corvus corax</em>) et les geais, dont le mésangeai du Canada (<em>Perisoreus canadensis</em>). Chercher de nuit, c’est se perdre et pousser la bête. La nuit ne sert qu’à trouver une bête <strong>déjà morte</strong> : poumons ou cœur sûrs, piste abondante, courte distance.</p>
<p class="step pk-d"><span class="sn">35</span><strong>Si l’on cherche de nuit, préparer le retour avant de partir, et partir armé.</strong> Azimut du chalet ou du chemin noté avant d’entrer dans le bois, rubans à chaque signe, lampe tenue bas et de côté pour que les gouttes et les foulées fassent ombre. L’arme chargée vient, de nuit comme de jour : la bête qu’on croit morte peut se relever, et une bête laissée la nuit attire l’ours, le coyote et les chiens — on revient vers elle comme vers un endroit occupé (<span class="ref">§8</span>, bloc 7). Les deux mains vont à l’arme : à deux, l’un éclaire et l’autre tient l’arme ; seul, la frontale et rien dans les mains. Prévenir le voisinage d’abord, d’un mot au rendez-vous (<span class="ref">ch. 16</span>, étape 19) : des lumières et une arme qui bougent dans le bois la nuit se lisent comme une menace par des voisins armés.</p>
<p class="step"><span class="sn">36</span><strong>Dans la neige.</strong> Tout est plus facile, sauf le début : sur la neige fraîche, les premiers mètres peuvent ne montrer que du poil, et le premier sang apparaître <strong>une vingtaine de mètres</strong> plus loin, puis grossir. L’ours et l’orignal dont la balle reste dans l’os et le muscle peuvent saigner très peu. On suit alors la piste elle-même, celle qui montre de la hâte. Une neige qui menace n’est pas une raison d’écourter l’attente (étape 19).</p>
<p class="step"><span class="sn">37</span><strong>Sous la pluie.</strong> On marque tout, tout de suite, plutôt qu’au retour ; la pluie efface le sang, pas les rubans. On cherche la piste plutôt que les taches (<span class="ref">§9</span>).</p>
<h3 class="sub">H — Le chien</h3>
<p class="step pk-t"><span class="sn">38</span><strong>Le chien suit l’odeur de la bête blessée, avec ou sans sang,</strong> de jour comme de nuit, jusqu’à <strong>48 heures</strong> après le coup. Un vieux sang reste sur place et continue d’émettre son odeur pendant des jours, bien plus longtemps que la piste d’un homme, que le vent disperse. Là où l’œil s’arrête — la panse qui ne saigne pas, la pluie, la nuit — le nez continue.</p>
<p class="step pk-d"><span class="sn">39</span><strong>Toujours en laisse, une laisse de 6 à 9 m, tenue à la main.</strong> Un chien libre pousse la bête blessée et la fait courir jusqu’à ce qu’on ne la retrouve plus. La laisse longue ne s’accroche pas comme une courte. Elle ne se noue jamais au poignet ni à la ceinture : l’orignal qui charge le chien arrive sur l’homme attaché à l’autre bout, et il faut pouvoir la lâcher (<span class="ref">§8</span>, bloc 2). Le maître suit le chien, regarde les signes que le chien lui montre — sang, poil, os — et c’est lui qui décide si la blessure est mortelle.</p>
<p class="step"><span class="sn">40</span><strong>Ne pas piétiner avant le chien.</strong> Si un chien doit venir, on marque le point d’impact et le dernier signe de deux rubans et on ne quadrille pas : chaque homme qui tourne en rond pose une piste de plus à démêler.</p>
<p class="step pk-d"><span class="sn">41</span><strong>N’importe quel bon chien de chasse peut apprendre</strong>, s’il est calme, endurant, et qu’il a du nez. Le dressage est à la <span class="ref">§9</span>. Face à un orignal, le chien est une cible (<span class="ref">§8</span>, bloc 2).</p>
<h3 class="sub">I — Trouver la bête</h3>
<p class="step"><span class="sn">42</span><strong>L’approche finale est au chapitre 61 (étape 2) et, pour l’ours, au chapitre 52 (étape 1)</strong> : par l’arrière et par le haut, jamais par la tête, arme prête, en regardant la respiration au flanc. On attend quelques minutes à courte distance. L’œil d’une bête morte est d’ordinaire ouvert ; un œil fermé, ou qui cligne, c’est une bête vivante : on recule et on attend. Le test de l’œil s’ajoute à la vérification du flanc, il ne la remplace pas, et il ne se fait qu’après une longue immobilité du flanc : depuis l’arrière, par-dessus le dos, avec une perche assez longue pour rester hors de portée des pattes et du panache. Un second tient l’arme prête ; seul, on la garde à portée de main. L’œil qui ne cligne pas au toucher de la perche dit la mort.</p>
<p class="step"><span class="sn">43</span><strong>Une bête trouvée tard se juge au chapitre 61 (<span class="ref">§7</span>)</strong>, avant tout autre geste. La viande qui tourne la première est au cuissot, autour de l’articulation de la hanche : c’est là qu’on met le nez et la sonde d’abord. Trouvée plus de 24 heures après le coup, elle a manqué son 7 °C : ni salaison longue, ni fumage à froid (étape 18).</p>
<h3 class="sub">J — Le petit gibier touché</h3>
<p class="step pk-d"><span class="sn">44</span><strong>L’oiseau ou le lièvre touché qui continue</strong> se cherche plus loin qu’on croit : une gélinotte touchée qui a continué se retrouve à <strong>70 ou 90 m</strong> dans la direction du vol. On marque le coup d’une branche cassée, on prend un repère dans l’axe du vol, et on marche droit sur la ligne. Le reste — les signes de maladie, la manipulation — est au chapitre 47 (<span class="ref">§5-I</span>) et dans les chapitres d’espèce. <strong>Les gants se mettent avant de ramasser un lièvre (<em>Lepus americanus</em>)</strong>, pas avant de le dépouiller (<span class="ref">§8</span>, rappels).</p>

<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:29.3%"><col style="width:23.0%"><col style="width:47.7%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">La bête se lève devant soi pendant la recherche</td><td>Attente trop courte</td><td>Marquer, reculer par son propre chemin, reprendre au lever du jour</td></tr><tr><td class="c-item">Plus un signe depuis un bon moment, et on continue quand même</td><td>On suit ce qu’on croit, plus ce qu’on voit</td><td>Revenir au dernier ruban. Cercles, puis carré qui s’élargit</td></tr><tr><td class="c-item">Les rubans ne font plus une ligne, ils tournent</td><td>On tourne en rond, ou la bête a fait son crochet</td><td>Arrêter. Relire la piste depuis le dernier ruban sûr</td></tr><tr><td class="c-item">Sang rouge vif qui diminue de tache en tache, aucun lit</td><td>Blessure musculaire qui se referme</td><td>Orignal : la pousser vite si la neige ou le terrain le permet, et l’approcher arrêtée par le côté, un arbre à portée (<span class="ref">§8</span>, bloc 2) ; sinon, elle survivra probablement. <strong>Ours : jamais vite</strong> (<span class="ref">§8</span>, bloc 1)</td></tr><tr><td class="c-item">Aucune piste fraîche au bout de la piste suivie, bête jamais vue</td><td>La piste était vieille : grand froid calme, jugée à l’œil</td><td>Refaire le test du souffle (étape 3)</td></tr><tr><td class="c-item">La bête se lève loin devant, avant qu’on l’ait vue</td><td>Approche par le mauvais côté du vent ou de la brise de pente</td><td>Ne pas la suivre. La reprendre plus tard, en contournant sous le vent</td></tr><tr><td class="c-item">Les chercheurs ne savent plus de quel côté est le chalet</td><td>Suivi le nez au sol, sans azimut</td><td>S’arrêter, revenir à la ligne de rubans, suivre les rubans à rebours jusqu’au poste de tir ; du poste, le chalet se retrouve par la pente, le fleuve au sud, en visant à côté (<span class="ref">ch. 42</span> <span class="ref">§9</span>)</td></tr><tr><td class="c-item">Viande sombre, presque violette, qui ne rougit pas à l’air</td><td>Bête épuisée avant de mourir : glycogène brûlé<sup class="fnr" data-fn="44-1">1</sup></td><td>Se mange en premier, fraîche ou congelée : elle se garde moins longtemps. Elle ne part <strong>ni en salaison ni en fumage à froid</strong> : le sel y pénètre mal et elle s’altère plus vite. Et le botulisme ne change ni l’odeur, ni le goût, ni l’apparence : une salaison ratée ne s’annonce pas (<span class="ref">ch. 68</span>)</td></tr><tr><td class="c-item">Bête retrouvée, flanc verdâtre côté panse, odeur aigre à la hanche</td><td>Trouvée trop tard</td><td>Chapitre 61, <span class="ref">§7</span> : on pare ou on jette selon ce qu’il dit</td></tr></tbody></table>

<template id="story-d">
<p class="pt"><span class="pn">1</span><strong class="plead">L’ours blessé est au bout de la piste, à bout portant, dans ce qu’on ne voit pas.</strong> L’ours saigne peu : le poil long et le gras bouchent facilement une plaie, et il a beaucoup des deux. Blessé, il va au couvert le plus épais — marécage, tourbière, aulnaie — et c’est là que la piste mène, à la distance où l’on ne peut plus épauler. On attend <strong>au moins 30 minutes</strong> même touché aux poumons, on ne le suit jamais vite, même sur un coup de patte, ni dans le couvert à la brunante ni la nuit, et on approche la bête à terre par l’arrière et par le haut, arme prête (<span class="ref">ch. 52</span>, étape 1).</p>
<p class="pt"><span class="pn">2</span><strong class="plead">L’orignal fait plus de blessés que l’ours, et il en veut au chien.</strong> En Alaska, où les deux abondent, l’orignal blesse plus de monde chaque année que l’ours. Il devient agressif quand on le harcèle, et trois orignaux ne fuient pas : <strong>le mâle au rut</strong>, de la fin de septembre à octobre, la saison même où l’on chasse ; <strong>la femelle suivie d’un petit veau</strong>, de la fin du printemps à l’été (<span class="ref">ch. 43</span>, <span class="ref">§8</span>, bloc 2) ; et <strong>l’orignal affamé et épuisé</strong>, surtout l’hiver dans la neige profonde : c’est exactement l’orignal qu’on a poursuivi. Il voit le chien comme un ennemi et fait un détour pour le frapper, <strong>même en laisse</strong> — le maître est à l’autre bout de la laisse, qui se tient à la main pour pouvoir la lâcher, jamais nouée au corps. Les signes : les longs poils de la bosse hérissés, les oreilles couchées vers l’arrière, la langue sur les lèvres ; si l’on voit ce dernier signe, on est déjà beaucoup trop près. Il charge en frappant devant lui des sabots avant. On court, et on met un arbre entre lui et soi : il ne poursuit pas loin, et on tourne autour d’un arbre plus vite que lui. Renversé, on se met en boule, les mains sur la tête, et on ne bouge plus tant qu’il n’est pas loin. Le mâle blessé couché dans un fourré se laisse dépasser : il est alors <strong>derrière</strong> le chercheur. Et l’orignal assommé qui se relève à un mètre d’un homme accroupi est au chapitre 61 (<span class="ref">§8</span>, bloc 1).</p>
<p class="pt"><span class="pn">3</span><strong class="plead">On se perd en suivant une bête.</strong> Le nez sur des gouttes, dans une piste qui zigzague, à la brunante, personne ne sait plus où il est, et l’homme qui a transpiré dans la poursuite s’arrête mouillé au moment où le froid tombe (<span class="ref">ch. 25</span>). La piste qu’on suit n’est pas le chemin du retour. L’azimut du retour se prend <strong>avant</strong> d’entrer dans le bois de nuit, et la ligne de rubans est la seule route sûre pour revenir au poste de tir.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">La bête blessée va vers l’eau, et la glace ne l’a pas attendue.</strong> La piste descend vers le lac, la décharge ou le marécage. Une bête qui a traversé une glace d’automne en courant ne prouve rien sur ce que cette glace portera à un homme qui marche, et les décharges et le tour des huttes de castor restent minces quand le reste du lac porte (<span class="ref">ch. 42</span>, étapes 8 et 9). On contourne par la rive.</p>
<p class="pt"><span class="pn">5</span><strong class="plead">Dans une pousse, le coup naturel du posteur vise un homme.</strong> Le posteur attend au bout du couvert, face au couvert, et la bête arrive vers lui en sortant du couvert où marchent les pousseurs : son coup, dans l’axe où la bête arrive, part droit vers eux. Et les posteurs se tiennent en ligne le long de la lisière : un coup tiré de côté, sur une bête qui longe la lisière, part le long de cette ligne, droit sur le posteur voisin. Le posteur laisse donc la bête sortir, franchir la ligne des posteurs et s’en éloigner vers l’extérieur, et il ne tire que lorsque derrière elle il n’y a <strong>ni le couvert, ni un autre posteur</strong>. Chacun connaît avant le départ la place de tous les autres, et la direction exacte de ses deux voisins, dans laquelle il ne tire jamais.</p>
<p class="pt"><span class="pn">6</span><strong class="plead">À deux sur une piste, on tire sur son partenaire.</strong> C’est ce chapitre qui crée la situation : le deuxième homme marche dans le couvert, sur le côté, là où la bête du crochet est attendue (étape 11), ou cherche le signe suivant devant le pisteur (étape 26, <span class="ref">§9</span>) ; et l’œil du pisteur est entraîné à compléter un orignal à partir d’un morceau — une oreille qui bouge, une patte grise, une ligne horizontale (étape 9). Le même œil complète une bête sur une jambe de pantalon gris qui bouge dans les aulnes. <strong>Le coup ne part jamais sur un morceau</strong>, seulement sur une bête vue entière et reconnue. À deux, chacun sait à chaque instant où est l’autre ; celui qui avance n’entre jamais dans l’axe de tir du pisteur ; et seul tire celui qui voit la bête sans l’autre dans son champ. L’orange sur chacun, de dos, d’épaule et de face, casse la ressemblance (<span class="ref">ch. 42</span>, <span class="ref">§8</span>, bloc 4).</p>
<p class="pt"><span class="pn">7</span><strong class="plead">La bête laissée la nuit, l’ours la trouve avant l’homme.</strong> Chaque bête qu’on attend toute la nuit, à la panse ou à l’intestin, est une carcasse offerte : une bête laissée la nuit attire l’ours, qui peut être dessus au matin. Un ours dans le secteur n’est jamais une raison de chercher de nuit : c’est une raison d’attendre le jour. On y revient de jour, arme chargée, par le côté le plus dégagé, et on regarde de loin avant d’entrer dans le couvert. <strong>Une bosse de terre, d’herbe et de branches à la place de la bête</strong><sup class="fnr" data-fn="44-5">5</sup>, une forte odeur de bête morte, des corbeaux et des geais réunis : un ours l’a prise et la garde, et il reste dans les environs même quand on ne le voit pas. On ne la lui dispute pas : on repart tout de suite par où l’on est venu, sans courir (<span class="ref">ch. 43</span>, <span class="ref">§8</span>, bloc 1).</p>
<p class="pt"><span class="pn">8</span><strong class="plead">Rappels qui s’appliquent quand la bête est retrouvée.</strong> Ils sont ailleurs dans le livre et répétés ici parce que ce chapitre finit là où la viande commence.</p>
<p class="li"><strong>Orignal, ours et lièvre : 74 °C à cœur</strong> à la cuisson (<span class="ref">ch. 61</span>, <span class="ref">ch. 48</span>, <span class="ref">ch. 52</span>).</p>
<p class="li"><strong>Jamais le foie ni les reins de cervidés</strong> : ils peuvent contenir un taux élevé de cadmium. Le foie qu’un sang presque noir a désigné reste une indication pour la recherche, pas un repas (<span class="ref">ch. 22</span>).</p>
<p class="li"><strong>Ours : la trichinellose</strong> ne se règle ni par le sel, ni par le fumage, ni par le gel domestique, seulement par la cuisson à cœur (<span class="ref">ch. 52</span>).</p>
<p class="li"><strong>Lièvre : gants dès qu’on le ramasse</strong>, à cause de la tularémie : le coup de feu met le sang dans la fourrure et dans la neige avant qu’on se penche (<span class="ref">ch. 48</span>).</p>
<p class="li"><strong>L’orignal de fin d’hiver est maigre</strong> (<span class="ref">ch. 41</span>). Sa viande seule, sans gras, mène au mal de caribou, mortel en quelques semaines (<span class="ref">ch. 19</span>).</p>
<p class="li"><strong>7 °C au cœur du cuissot dans les 24 heures</strong>, comptées depuis le coup de feu (étape 16, <span class="ref">ch. 61</span>).</p>
<p class="li"><strong>Bête trouvée après 24 heures, panse étalée sur la viande, viande sombre : ni salaison longue, ni fumage à froid</strong> (étape 18, <span class="ref">§7</span> ; <span class="ref">ch. 61</span>, <span class="ref">§7</span>). Le botulisme ne change ni l’odeur, ni le goût, ni l’apparence : une salaison ratée ne s’annonce pas.</p>
