<template id="story-e">
<p class="p0">Sans lampe, sans chien, sans neige, sans ruban, sans boussole, sans jumelles, sans montre, et sans personne à qui demander. C’est le cas ordinaire : une bête tirée en fin d’après-midi d’octobre, sur un sol de feuilles et de mousse, par un homme seul qui a une carabine, un couteau et ce qu’il a dans les poches.</p>
<h3 class="sub">Retracer sans neige et sans sang</h3>
<p class="p0">La piste d’une bête qui ne saigne plus n’est pas une ligne de gouttes, c’est une <strong>chaîne de perturbations</strong> : litière retournée, herbe couchée, rosée essuyée<sup class="fnr" data-fn="44-4">4</sup>, mousse écrasée, brindilles cassées. Chacune se lit comme au chapitre 43 (<span class="ref">§9</span>, « Lire sans neige » et « Quand la piste se perd »). On ne cherche pas un indice parfait, on cherche le suivant. Ce qui change quand la bête est touchée :</p>
<p class="li"><strong>On cherche la hâte.</strong> Au point d’impact, dans un piétinement de vieilles pistes, des sabots écartés et des ergots marqués sur un sol dur disent la seule bête qui court : c’est elle (étape 4).</p>
<p class="li"><strong>On n’attend pas le sang pour suivre.</strong> Un orignal a été retrouvé sans que le pisteur ait eu besoin d’une goutte : il suivait des herbes pliées et des prêles cassées depuis un pré jusque dans une tremblaie, et le jeune mâle était couché dans le fourré, à moins de deux cents mètres.</p>
<p class="li"><strong>La tête haute, parce que la bête est couchée devant.</strong> La bête blessée se laisse dépasser (étape 31) : le pisteur qui regarde ses pieds passe à côté d’elle, celui qui regarde loin la voit avant qu’elle se lève.</p>
<p>Quand la chaîne se casse, on revient au dernier indice sûr et on tourne en cercles serrés, puis larges, en regardant d’abord vers les <strong>descentes</strong>, les <strong>coulées</strong>, l’<strong>eau</strong> et le <strong>couvert le plus épais</strong> (étape 32).</p>
<h3 class="sub">Retracer sans lampe</h3>
<p class="p0">La réponse est d’abord de <strong>ne pas chercher</strong> : le dernier signe se marque, et la recherche reprend à l’aube. Ce qu’on y perd, c’est une nuit de chaleur dans la bête ; ce qu’on y gagne, c’est la bête. Une bête touchée aux organes vitaux et qu’on ne pousse pas meurt couchée dans la nuit, à quelques centaines de mètres. Une bête poussée à l’aveugle, on ne la revoit pas.</p>
<p>Au lever du jour, trois choses aident que la nuit n’avait pas : la rosée, qui garde la trace du dernier passage ; la lumière rasante, qui fait ombre dans chaque foulée (43, <span class="ref">§9</span>, « La lumière ») ; et les oiseaux. Les corbeaux et les geais trouvent une carcasse avant l’homme, et ils le disent. Des corbeaux qui appellent, des geais, un écureuil qui s’alarme au même endroit : on y va d’abord, de loin et arme prête, parce qu’ils appellent aussi quand un ours est dessus (<span class="ref">§8</span>, bloc 7).</p>
<p>Quand il faut chercher de nuit — bête sûrement morte à courte distance, redoux qui menace la viande — la torche d’écorce de bouleau (<span class="ref">ch. 85</span> <span class="ref">§9</span>) donne une flamme courte et vive ; on en prépare plusieurs avant de partir et on allume la suivante avant que la précédente s’éteigne. Elle projette des fragments enflammés : elle ne sert que <strong>sur la neige ou un sol détrempé</strong>, jamais au-dessus d’une litière de feuilles sèches ou de mousse sèche d’octobre, et loin des vêtements. On la tient de côté, au-dessus du sol et non au ras : la lumière qui arrive de biais fait encore sortir le relief d’une foulée. Au ras du sol, c’est une chandelle posée sur la neige à côté de la foulée qui fait l’ombre, pas la torche. Et la torche prend une main : <strong>à deux</strong>, l’un éclaire, l’autre tient l’arme ; <strong>seul à la torche</strong>, on n’a plus l’arme prête, donc on marque, on n’approche pas la bête, et on attend le jour. Un ours dans le secteur n’est pas une raison de chercher de nuit : c’est une raison d’attendre le jour. L’azimut ou le repère du retour se prend avant de partir.</p>
<h3 class="sub">Retracer sans chien</h3>
<p class="p0 ri"><strong class="runin">À deux, on fait le chien.</strong> L’un reste sur le dernier signe et ne le quitte pas. L’autre avance en demi-cercle devant lui, à quelques pas, et cherche le suivant. Quand il le trouve, il appelle, le premier le rejoint, marque, et on recommence. On change de rôle quand les yeux se fatiguent. Ce système est lent et il ne perd presque rien : le dernier signe n’est jamais abandonné. Celui qui cherche devant est dans l’axe de l’autre : si la bête se lève, seul tire celui qui la voit sans son partenaire dans son champ (<span class="ref">§8</span>, bloc 6).</p>
<p class="p0 ri"><strong class="runin">Seul,</strong> la règle devient : on ne dépasse jamais le dernier ruban sans avoir trouvé le signe suivant. On pose son sac ou son chapeau sur le dernier signe, on cherche autour, on revient au sac. La ligne des marques se relit en se retournant : ce qu’elle dit de la direction vaut mieux que ce qu’on croit se rappeler.</p>
<p class="p0 ri"><strong class="runin">Le nez de l’homme sert aussi.</strong> L’odeur de panse<sup class="fnr" data-fn="44-3">3</sup> se sent sur la flèche, sur une branche frottée, dans un lit. Une piste sans sang qui sent la panse est une bête touchée au ventre, qui ira se coucher près de l’eau ou dans le fourré si on la laisse tranquille (étapes 18, 32).</p>
<h3 class="sub">Faire un chien de sang avec le chien du chalet</h3>
<p class="p0">Tout bon chien de chasse peut apprendre. Il lui faut du calme, de l’endurance, du nez, et l’envie de suivre. Un chien ne naît pas chien de sang : il le devient, et le dressage tient en un geste répété une fois par semaine.</p>
<p class="step"><span class="sn">1</span><strong>Garder du sang de la prochaine bête.</strong> Au moment de la saignée et de l’éviscération (<span class="ref">ch. 61</span>), on recueille du sang et un morceau de peau ou la queue, en petits contenants fermés, et on les congèle. Un morceau de foie sert à traîner une odeur au bout d’une ficelle, et rien d’autre : on le reprend, il ne reste jamais sur la ligne, il ne finit jamais à portée du chiot, et il se jette ensuite avec les abats (<span class="ref">ch. 23</span>). Juger un foie « sain » à l’œil ne suffit pas : les kystes vont de quelques millimètres à 15 cm (<span class="ref">ch. 61</span>, note 1). Un chien qui mange des abats crus de gibier ramène au chalet le parasite des kystes du poumon et du foie (<span class="ref">ch. 61</span>, étape 14), et le chien infecté contamine la maisonnée, enfants compris, par ses excréments, par les mains et par les légumes du jardin (<span class="ref">ch. 52</span>, bloc 4).</p>
<p class="step"><span class="sn">2</span><strong>Le chiot, dès 7 à 10 semaines.</strong> On traîne le morceau de foie sur environ <strong>6 m</strong>, puis on dépose des gouttes de sang sur une ligne d’une <strong>trentaine de mètres</strong>, avec au bout un « prix » : le morceau de peau, la queue. La ligne vieillit <strong>un quart d’heure</strong> avant de lâcher le chiot. Il jappe, il mord le prix, il joue avec : c’est gagné. La récompense qui se mange, c’est sa nourriture à lui.</p>
<p class="step pk-t"><span class="sn">3</span><strong>Vieillir la ligne plutôt que la raccourcir.</strong> Une ligne fraîche fait un nuage d’odeur, et le chiot s’arrête pour lécher. Une ligne de <strong>2 à 4 heures</strong> l’oblige à suivre un trait. On passe à des lignes de <strong>270 à 370 m</strong>, avec un virage à angle droit : le chiot dépasse, revient, retrouve.</p>
<p class="step pk-t"><span class="sn">4</span><strong>Allonger et vieillir.</strong> Jusqu’à <strong>24 heures</strong> et <strong>800 m</strong>, avec moins de sang : environ <strong>240 mL</strong> pour toute la ligne. On marque sa ligne de rubans aux arbres pour savoir où elle passe quand le sang ne se voit plus. Une goutte à chaque pas au début, puis une goutte tous les <strong>9 à 14 m</strong> sur une ligne longue et tordue.</p>
<p class="step"><span class="sn">5</span><strong>La piste presque sans sang.</strong> Deux pattes de la dernière bête, gardées congelées, fixées au bout d’un bâton de marche ou sous une paire de bottes : on marche une piste de quelques centaines de mètres, avec des détours, et seulement quelques gouttes de sang sur toute la longueur. Le chien apprend alors l’odeur des glandes logées entre les deux doigts du sabot, propre à chaque bête : c’est elle qui reste quand la bête ne saigne plus.</p>
<p class="step"><span class="sn">6</span><strong>Une ligne par semaine, pas plus,</strong> et beaucoup d’éloges. Le chien apprend en se trompant et en se corrigeant seul ; celui qu’on guide dépend du maître.</p>
<p class="step"><span class="sn">7</span><strong>Le vrai test</strong> : rester sur la vieille ligne quand une piste chaude de bête saine la croise. Le chien qui suit une ligne de 20 à 24 heures faite d’un quart de litre de sang retrouvera des bêtes que l’œil ne suit plus. Il commence à donner sa mesure vers <strong>deux ans</strong> et s’améliore jusqu’à <strong>8 ou 10 ans</strong>.</p>
<p>Au travail, toujours la laisse de 6 à 9 m, même au chien le mieux dressé : un chien qui part devant pousse la bête, et un orignal qui se retourne cherche le chien (<span class="ref">§8</span>, bloc 2). La laisse se tient à la main, jamais nouée au corps, pour pouvoir la lâcher. À défaut de laisse, une corde à linge légère. La bête retrouvée, on laisse le chien la « trouver », la sentir, japper : c’est ce qui le fait recommencer. Il n’en mange rien de cru.</p>
<h3 class="sub">Fabriquer ce qui manque</h3>
<p class="p0 ri"><strong class="runin">Les marques.</strong> Le papier hygiénique se voit de loin et fond sous la pluie : ça en fait une bonne marque de recherche et une mauvaise marque de retour. Une bande de sac de plastique de couleur nouée à une branche ne fond pas. Une lanière d’écorce de bouleau, côté blanc dehors, se voit dans un sous-bois sombre ; elle se prend sur un arbre mort (<span class="ref">ch. 42</span> <span class="ref">§9</span>). Une branche cassée qu’on laisse pendre, le bout cassé vers la fuite, marque sans rien apporter. Dans la neige, un bâton planté. Chaque marque se pose <strong>à hauteur d’œil</strong>, pas au sol : on la cherche de loin, en revenant.</p>
<p class="p0 ri"><strong class="runin">Le test du sang.</strong> Sans peroxyde : le doigt mouillé de salive ou d’eau frotté sur la tache. Le sang séché se dissout et s’étale en rouge sur la peau ; le rouge d’une feuille d’érable ou de bleuet reste dans la feuille. En automne, c’est ce qui dit si on suit une bête ou des feuilles.</p>
<p class="p0 ri"><strong class="runin">La direction.</strong> La boussole se remplace par deux repères pris dans l’axe de la fuite, au coup de feu, et ensuite par la ligne de marques : trois marques alignées donnent l’axe, et l’axe prolongé donne où chercher. Pour revenir, la même ligne à rebours. Pour retrouver le chalet ensuite, le chapitre 42 (<span class="ref">§9</span>) : la pente, le fleuve au sud, viser à côté.</p>
<p class="p0 ri"><strong class="runin">Les jumelles.</strong> Sans elles, on s’assoit et on attend que quelque chose bouge. On cherche les morceaux de bête de l’étape 9 : l’oreille qui tourne, la patte grise, la ligne horizontale. On bouge la tête lentement, et on refait le même balayage plusieurs fois : ce qui ne bouge pas ne se voit pas du premier coup.</p>
<p class="p0 ri"><strong class="runin">La montre.</strong> Pour l’attente, les unités qui ne demandent pas d’heure suffisent : « jusqu’à la noirceur », « toute la nuit », « jusqu’au lever du jour ». Pour l’attente courte, on ne compte pas : on allume un feu, on fait bouillir l’eau, on boit, et on ne se relève pas avant que le feu soit tombé en braise. La hauteur du soleil, en largeurs de main à bout de bras, donne le temps qui reste avant la noirceur (<span class="ref">ch. 42</span> <span class="ref">§9</span>).</p>
<p class="p0 ri"><strong class="runin">La laisse du chien.</strong> Corde à linge, cordelette tressée. Pas de babiche : une laisse de pistage traîne dans la rosée, la neige et le mouillé, et la babiche retrempée redevient molle (<span class="ref">ch. 99</span>, <span class="ref">§2</span>). Elle doit faire <strong>6 à 9 m</strong> et ne pas avoir de nœud qui s’accroche.</p>
<h3 class="sub">L’orignal d’hiver, à la raquette</h3>
<p class="p0">Les Innus attendent l’hiver pour chasser l’orignal, et ils vont le chercher directement là où il se tient l’hiver, sur les hauteurs, plutôt que de l’attirer à la saline ou à l’appel comme à l’automne. Ce qui suit est la façon de faire la même chose sur le territoire du chalet : trouver une piste d’hiver et la suivre, en raquettes.</p>
<p class="p0 ri"><strong class="runin">Pourquoi ça marche dans ces conditions.</strong> En neige ordinaire, l’orignal passe partout grâce à ses longues pattes, mieux que le cerf et le loup. La croûte change tout : celle qui casse sous la botte et sous le sabot, mais porte la raquette, qui étale le poids (<span class="ref">ch. 89</span>). L’orignal y circule moins aisément, et il lui arrive de se blesser en chutant sur la croûte glacée. Face à un mâle en santé, à peine une confrontation de loups sur douze finit par sa prise ; dans la neige épaisse et croûtée, une meute en vient facilement à bout. L’hiver, l’orignal se déplace peu et se laisse trouver par ses pistes, son broutage et ses crottes. Et le froid aide la viande : il ne remplace ni l’éviscération ni le refroidissement. La bête s’ouvre et se vide sur place comme à l’automne, et la neige au contact de la carcasse ouverte la refroidit mieux que l’air froid (<span class="ref">ch. 61</span> ; <span class="ref">ch. 73</span>, <span class="ref">§9</span>) : un orignal entier dans sa peau ne gèle pas à cœur de la hanche avant que la viande tourne.</p>
<p class="p0 ri"><strong class="runin">Comment.</strong> Chercher, dans un secteur d’hiver connu, une piste où les miettes de neige s’envolent au souffle (étape 3). La suivre en raquettes (<span class="ref">ch. 89</span>), le vent dans la face, en quittant la piste quand elle tourne (étape 7). Quand la croûte porte la botte, la raquette glisse et n’accroche plus : on l’enlève et on marche (<span class="ref">ch. 89</span>). Sur neige croûtée, la bête levée se fatigue vite et l’homme gagne sur elle ; on la rejoint quand elle s’arrête, et on tire une bête arrêtée, de côté, à courte distance, après avoir regardé le canon (plus bas).</p>
<p class="p0 lab kh"><strong class="runin">Ce qui rend la méthode dangereuse quand les conditions changent :</strong></p>
<p class="li"><strong>La bête qui ne peut plus fuir se retourne.</strong> Un orignal affamé et épuisé dans la neige profonde, c’est exactement celui qui charge (<span class="ref">§8</span>, bloc 2). On ne l’approche pas de face, on ne l’approche pas avec un chien, et on garde un arbre à portée.</p>
<p class="li"><strong>La poursuite brûle la viande.</strong> Une bête poussée longtemps meurt sans glycogène : viande qui se garde mal, sombre dans le cas marqué (<span class="ref">§3</span>), et qui ne part ni en salaison ni en fumage à froid (<span class="ref">§7</span>). Au froid de janvier, la bête ouverte refroidit plus vite ; au redoux de mars, sur une croûte qui dégèle l’après-midi, beaucoup moins, et c’est le 7 °C en 24 heures qui décide (<span class="ref">ch. 61</span>).</p>
<p class="li"><strong>La chute dans la neige bouche le canon.</strong> On court en raquettes sur la croûte, on tombe, on se relève à genoux et on tire aussitôt sur la bête arrêtée : c’est la neige dans la bouche du canon, et le coup fait éclater l’arme à une main du visage. Après chaque chute, on regarde à travers le canon avant de tirer (<span class="ref">ch. 45</span>, <span class="ref">§8</span>, bloc 1, et étape 38).</p>
<p class="li"><strong>L’eau dort sous la neige des lacs.</strong> La piste traverse un lac gelé ; sous une neige épaisse, le poids a enfoncé la glace et l’eau est remontée dessus<sup class="fnr" data-fn="44-6">6</sup>. Elle mouille la raquette et le pied à −30 °C, loin du chalet. On sort vers la neige sèche ou la rive et on contourne ; au sec, on enlève tout de suite l’eau et la glace de la raquette, et on remet le pied au sec avant qu’il gèle (<span class="ref">ch. 89</span>, <span class="ref">§7</span> ; <span class="ref">ch. 25</span>).</p>
<p class="li"><strong>L’orignal de mars est maigre.</strong> C’est la saison de famine : il a brûlé son gras (<span class="ref">ch. 41</span>). Sa viande seule, sans gras à côté, mène au mal de caribou (<span class="ref">ch. 19</span>). La bête d’hiver se mange avec le gras de l’ours, du castor, de la moelle (<span class="ref">ch. 72</span>).</p>
<p class="li"><strong>L’homme qui poursuit transpire.</strong> Il s’arrête mouillé, loin, à la brunante, et c’est lui qui gèle (<span class="ref">ch. 25</span>). On poursuit en retirant des couches, pas en les gardant, et on remet tout avant de s’arrêter.</p>
<p class="li"><strong>Plus la poursuite est longue, plus la bête tombe loin du chalet.</strong> Tout ce qui tombe doit revenir au toboggan (<span class="ref">ch. 89</span>), et chaque kilomètre de poursuite se repaie en voyages de charge.</p>
<h3 class="sub">Ce qu’on perd, et ce qui ne se remplace pas</h3>
<p class="li"><strong>Sans chien, la bête touchée à la panse sans neige est souvent perdue.</strong> Elle saigne peu ou pas, et le nez d’un chien la suit jusqu’à deux jours ; l’œil ne suit que ce qui se voit. C’est la seule situation où le chien change le résultat plutôt que la vitesse.</p>
<p class="li"><strong>Sans lampe, on perd une nuit de chaleur dans la bête.</strong> Par une nuit douce de septembre, ça se paie à la hanche du cuissot (étape 43). Par une nuit froide, beaucoup moins.</p>
<p class="li"><strong>Sans ruban, on perd le lendemain</strong> : le papier fond sous la pluie, et une branche cassée se retrouve mal dans un bois qu’on ne connaît pas.</p>
<p class="li"><strong>La patience ne se remplace pas.</strong> Aucune technique ne rattrape une bête touchée à la panse qu’on a suivie trop tôt. La seule manière de retrouver cette bête-là, c’est de ne pas l’avoir poussée.</p>
<p class="li"><strong>L’arme à l’approche ne se remplace pas.</strong> Sans arme chargée, on n’approche pas une bête couchée : on attend, de loin, que le flanc ne bouge plus.</p>

<p class="fn" data-fn="27-1"><span class="fnn">1</span>L’œil infecté par derrière : paupières enflées et rouges ; l’œil poussé vers l’avant, ce qui se voit le mieux en regardant le visage d’en haut, par-dessus le front ; l’œil qui fait mal quand il bouge et qui bouge moins bien que l’autre ; la vue qui baisse ; de la fièvre. Au début, une partie de ces signes peut manquer : la paupière qui enfle chez quelqu’un qui a mal à une dent du haut ou au sinus suffit à partir.</p>
<p class="fn" data-fn="27-2"><span class="fnn">2</span>Un son aigu et rauque à chaque entrée d’air : l’air forcé à travers une gorge que l’enflure rétrécit.</p>
<p class="fn" data-fn="45-1"><span class="fnn">1</span>Le renflement est un anneau où le canon a gonflé sous le choc de la balle contre l’obstacle. Il se voit parfois dehors, comme un anneau autour du canon. Sinon, l’âme bien propre, regardée par la chambre contre une lumière vive, y montre une ombre en anneau — une tache de graisse fait la même ombre, d’où l’âme propre — et les doigts passés doucement le long du canon le sentent comme une bosse. Deux balles restées dans l’âme : on présume le canon renflé. Un canon renflé ne s’arrange pas en tirant.</p>
<p class="fn" data-fn="47-1"><span class="fnn">1</span><strong>Le tambourinage de la gélinotte.</strong> Un bruit sourd qui pulse, comme un tambour qu’on bat au loin. Le mâle le fait en comprimant l’air sous ses ailes, le plus souvent debout sur un billot, parfois sur une racine ou une roche. On l’entend surtout au printemps, et parfois à l’automne.</p>
<p class="fn" data-fn="47-2"><span class="fnn">2</span><strong>La trace du lagopède.</strong> L’hiver, le dessous de ses pieds est couvert de plumes jusqu’au bout des doigts, au point de ressembler à une patte de lièvre, et seules ses longues griffes dépassent : l’empreinte est ronde et floue, sans doigts nets (<span class="ref">ch. 43</span>, <span class="ref">§5</span>-F). La gélinotte et le tétras n’ont pas le pied emplumé : l’hiver, la gélinotte porte seulement de petites franges en peigne le long des doigts, et ses doigts marquent.</p>
<p class="fn" data-fn="81-1"><span class="fnn">1</span>Les premiers jours, les repas grossissent et la faim revient au bout de chacun : le repas complet de viande ne la coupe pas, le ventre est tendu, et l’envie de gras ne lâche pas. On maigrit alors que les portions sont grosses. Viennent ensuite la nausée et la diarrhée, que seul le gras arrête. Plus de viande maigre aggrave ; le gras renverse. L’enfant y arrive avant l’adulte : la part de protéines qu’il supporte plafonne plus bas (24).</p>
<p class="fn" data-fn="81-2"><span class="fnn">2</span>Acides, donc à l’eau bouillante : petits fruits, confitures, gelées, marinades acidifiées. Peu acides, donc à l’autoclave : viande, poisson, bouillon, champignons de culture, haricots, betteraves, carottes, maïs, courges (73).</p>
<p class="fn" data-fn="81-3"><span class="fnn">3</span>Le 66 °Brix ne se voit pas et ne se goûte pas : il se lit au réfractomètre ou au densimètre à sirop. Sans instrument, on ne fait pas de sirop de garde : on fait du sucre, qui se juge à l’œil et à la dent, ou un sirop léger gardé gelé dehors et mangé dans la saison (60).</p>
<p class="fn" data-fn="81-4"><span class="fnn">4</span>Trouble laiteux, mousse qui ne retombe pas, odeur aigre, filaments dans la chaudière. Le froid qui concentre la sève concentre aussi ce qui a tourné (60).</p>
<p class="fn" data-fn="84-1"><span class="fnn">1</span>Le serti est le repli de métal du pourtour de la boîte, là où le couvercle est roulé sur le corps. Avec la ligne de métal qui ferme le corps sur toute sa hauteur, c’est un des deux joints de la boîte. Une bosse, une arête pliée ou de la rouille à cet endroit, et le joint ne tient plus.</p>
<p class="fn" data-fn="84-2"><span class="fnn">2</span>Les premiers signes sont ceux d’une grippe : frissons, fièvre, fatigue, maux de tête, étourdissements, douleurs musculaires, parfois toux, maux de ventre, nausées et vomissements. Rien dans la liste n’est propre au hantavirus : ce qui la distingue, c’est d’avoir ouvert le chalet ou touché des crottes de souris dans les semaines d’avant. La forme grave ajoute l’essoufflement, puis une détresse respiratoire sévère.</p>
<p class="fn" data-fn="86-1"><span class="fnn">1</span>Le densimètre de batterie est une poire de caoutchouc au bout d’un tube de verre, avec un flotteur gradué dedans. On ouvre le bouchon d’un élément, on aspire l’électrolyte jusqu’à ce que le flotteur flotte sans toucher le fond ni les parois, on vide et on remplit deux ou trois fois dans le même élément, puis on lit la graduation au ras du liquide, l’œil à sa hauteur. Le chiffre lu est la densité : 1,277 pour un élément plein. L’acide retourne dans l’élément d’où il vient, lunettes sur le nez.</p>
<p class="fn" data-fn="86-2"><span class="fnn">2</span>Il porte « MPPT » sur son étiquette ou sur sa fiche. Un contrôleur marqué « PWM », le plus simple, ne le suit pas.</p>
<p class="fn" data-fn="86-3"><span class="fnn">3</span>Ça se lit sur l’étiquette de l’onduleur ou sur sa boîte : « onde sinusoïdale pure » (« pure sine wave ») ou « onde sinusoïdale modifiée » (« modified sine wave »).</p>
<p class="fn" data-fn="88-1"><span class="fnn">1</span>Un levain mûr est un levain nourri qui a fini de monter depuis son dernier repas : il a doublé de volume, il est plein de bulles, et il sent l’aigre. C’est le repère de l’étape 5. Un levain qui porte un liquide gris ou brun sur le dessus a passé ce point : il a faim (section 6).</p>
<p class="fn" data-fn="44-1"><span class="fnn">1</span>La viande d’une bête très épuisée avant sa mort reste d’un rouge très foncé à violacé à la coupe, ferme et sèche au toucher, et ne vire pas au rouge vif à l’air comme une viande normale. Elle est plus dure, et elle se garde moins longtemps. C’est le cas marqué : une bête moins épuisée donne une viande qui se garde moins bien elle aussi, sans que la couleur le montre.</p>
<p class="fn" data-fn="44-2"><span class="fnn">2</span>Le sang de poumon est rose ou rouge clair, mousseux, criblé de petites bulles d’air ; il reste en écume sur les feuilles au lieu de s’étaler. Un sang rose et aqueux, aux bulles très fines, mêlé de rouge vif, annonce un seul poumon et le muscle de l’épaule autour.</p>
<p class="fn" data-fn="44-3"><span class="fnn">3</span>L’odeur de panse est acide, parfois douceâtre ; sur une flèche, la panse laisse des débris de végétation ou du gravier. L’intestin laisse sur la flèche un enduit gluant à l’odeur aigre, et parfois des matières fécales.</p>
<p class="fn" data-fn="44-4"><span class="fnn">4</span>Au petit matin, l’herbe et les feuilles basses sont couvertes de rosée, qui les fait paraître argentées à contre-jour. Une bête qui passe fait tomber la rosée sur sa ligne de passage : on voit une bande plus sombre, qui se suit à contre-jour et disparaît quand le soleil a tout séché.</p>
<p class="fn" data-fn="44-5"><span class="fnn">5</span>Une bosse au sol, fraîche, couverte de branches, d’herbe et de terre, à l’endroit où la bête devrait être : la carcasse est dessous, recouverte par l’ours. Autour, une forte odeur de bête morte, et souvent des corbeaux, des geais qui se posent et repartent. Un lynx cache aussi ses restes, mais sous un petit monticule de neige ou d’aiguilles : un gros tas de terre fraîche sur une bête de la taille d’un orignal, c’est un ours.</p>
<p class="fn" data-fn="44-6"><span class="fnn">6</span>Sur un lac, la raquette s’alourdit d’un coup ; la trace fonce et se remplit d’eau derrière soi ; en avant, des taches sombres et affaissées dans la neige, parfois une tache d’où partent des bras comme des tentacules. C’est l’eau remontée par les fissures, qui peut dormir des semaines sous une neige épaisse.</p>

  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
