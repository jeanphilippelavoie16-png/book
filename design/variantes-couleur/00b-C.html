class="c-item">Récepteur radio <strong>à piles, avec la bande AM</strong> (pas seulement FM)</td><td class="c-qte">2</td><td class="c-sans">L’AM porte loin le soir et c’est elle qui passe encore quand le reste est tombé</td><td class="c-ch"><span class="gr">14</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Appareil de <strong>messagerie satellite bidirectionnelle avec fonction SOS</strong>, abonnement actif</td><td class="c-qte">1</td><td class="c-sans">Au village, les voisins sont à portée de voix. Au chalet, sans lui, une blessure évacuable devient une blessure mortelle : c’est la seule ligne du livre qui transforme un blessé en survivant. Le chapitre 35 le nomme « un qui marche » — pas un qui est dans le tiroir</td><td class="c-ch"><span class="gr">14</span><span class="gr">35</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Trois moyens d’allumage rangés à <strong>trois endroits différents</strong> : allumettes en contenant étanche, briquet à long bec, tige de ferrocérium</td><td class="c-qte">2 boîtes, 2 briquets, 1 tige par sac et 3 au chalet</td><td class="c-sans">Un briquet à −35 °C ne fonctionne pas sans être réchauffé contre le corps, et un seul moyen rangé à un seul endroit brûle avec l’endroit</td><td class="c-ch"><span class="gr">13</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.G</span>Le feu du bâtiment, et le feu de forêt</h3>
<p class="p0">Ces deux feux-là ne sont pas le même problème et n’ont pas la même horloge. Le premier se joue en trois minutes à l’intérieur. Le second se décide des années d’avance par l’aménagement, et se joue en quelques heures le jour où il arrive. Les deux bâtiments y sont exposés.</p>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Extincteur à poudre polyvalente <strong>ABC</strong>, le gros format et non le modèle de cuisine</td><td class="c-qte">1 près de chaque sortie, 1 près du poêle, 1 au hangar à génératrice</td><td class="c-sans">Les trois lettres disent ce qu’il éteint : <strong>A</strong> le bois et le tissu, <strong>B</strong> l’essence et l’huile, <strong>C</strong> ce qui est sous tension. Un extincteur qui ne porte que le A projette le carburant enflammé au lieu de l’étouffer. Le petit modèle se vide en quelques secondes, et il n’y a pas de deuxième essai : il y a une sortie</td><td class="c-ch"><span class="gr">82</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Cache d’évacuation, à l’extérieur du bâtiment</strong> : bottes, habits de neige, tuques, mitaines, sacs de couchage, lampes, allumettes en contenant étanche, un sifflet</td><td class="c-qte">1 jeu complet par personne</td><td class="c-sans">Sortir d’un chalet qui brûle à −35 °C en pyjama, c’est échanger un mode de mort contre un autre. La cache est dehors parce que c’est le bâtiment qui brûle. Le sifflet est pour les enfants : si l’adulte seul ne se relève pas, c’est avec lui — trois coups, une pause, trois coups — qu’ils appellent le voisin à portée d’oreille (<span class="ref">ch. 38</span>)</td><td class="c-ch"><span class="gr">82</span><span class="gr">38</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bacs rigides à couvercle clipsé (~60 L) et sacs à dos, <strong>trousse d’évacuation montée d’avance</strong></td><td class="c-qte">2 bacs, 2 sacs adultes 45 à 60 L, 2 sacs enfants 15 à 20 L</td><td class="c-sans">Un départ devant un feu de forêt se joue en quelques heures. Une trousse montée <strong>se prend</strong> ; une trousse à remplir ne part pas. Charger dans l’ordre : personnes, médicaments, papiers, eau, vêtements chauds, nourriture</td><td class="c-ch"><span class="gr">6</span><span class="gr">7</span><span class="gr">8</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Boîte étanche à joint, format lettre, pour les papiers</td><td class="c-qte">1</td><td class="c-sans">Les papiers mouillés ne servent plus, et c’est le premier objet qui sort</td><td class="c-ch"><span class="gr">6</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Coffre ou armoire pour les armes, contenant distinct pour les munitions, verrous de pontet, et <strong>deux jeux de clés</strong></td><td class="c-qte">1 contenant, 1 dispositif par arme, <strong>2 jeux de clés</strong></td><td class="c-sans">Le deuxième jeu de clés est la seule ligne qui compte ici : il existe pour le jour où la personne qui porte le premier est celle qu’on soigne, ou celle qui n’est pas revenue. Une carabine derrière une porte dont la clé est partie avec le blessé est une carabine perdue</td><td class="c-ch"><span class="gr">16</span><span class="gr">36</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.H</span>Les papiers et l’argent</h3>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Pièces d’identité de <strong>toute la famille</strong>, cartes d’assurance maladie, copies des polices, du titre, des actes — et un jeu gardé <strong>hors du bâtiment</strong></td><td class="c-qte">2 jeux</td><td class="c-sans">Ça ne pèse rien, ça ne s’achète pas en urgence, et ça disparaît définitivement dans un incendie ou dans un feu de forêt qui prend le rang au complet</td><td class="c-ch"><span class="gr">6</span><span class="gr">82</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Argent comptant en <strong>petites coupures</strong>, dont de la monnaie</td><td class="c-qte"><strong>2 à 3 semaines</strong> de besoins essentiels</td><td class="c-sans">Un terminal de paiement a besoin de courant, et le village au complet en manque en même temps</td><td class="c-ch"><span class="gr">6</span><span class="gr">8</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Fiche médicale par personne : allergies, médication et doses, conditions, numéro d’assurance maladie</td><td class="c-qte">1 par personne</td><td class="c-sans">Les doses et les allergies de quatre personnes vivent souvent dans une seule tête, et le jour où elles servent, c’est parfois cette tête-là qu’on soigne. Écrite, n’importe qui la trouve et la lit</td><td class="c-ch"><span class="gr">32</span><span class="gr">35</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.I</span>Ce qui est au palier 1 uniquement pour qui fait le travail</h3>
<p class="p0">Trois activités du livre tuent des gens chaque année au Québec. Si l’activité a lieu, son équipement est au palier 1 ; si elle n’a pas lieu, la ligne ne s’achète pas du tout. Il n’y a pas de demi-mesure au milieu.</p>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Scie à chaîne :</strong> pantalon de coupe <strong>non modifié</strong>, casque à visière, protecteurs auditifs, bottes à embout</td><td class="c-qte">1 jeu complet par opérateur</td><td class="c-sans">Le pantalon de coupe est bourré de longues fibres lâches : la chaîne les arrache, elles s’enroulent dans le pignon et <strong>arrêtent la scie</strong> en une fraction de tour. C’est la seule pièce du jeu qui fait quelque chose plutôt que de couvrir, et c’est pour ça qu’un pantalon recoupé ou rapiécé ne vaut plus rien. Le reste protège de ce qui vole. Une coupure de cuisse, seul, loin du chemin, en janvier, ne se soigne pas</td><td class="c-ch"><span class="gr">106</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Scie à chaîne :</strong> pansement compressif porté <strong>sur le corps</strong>, pas dans le camion, et moyen de communication porté sur le corps</td><td class="c-qte">2 pansements, 1 appareil</td><td class="c-sans">La fémorale vide un adulte en quelques minutes, et la main qui doit poser le pansement est déjà glissante. Un pansement resté à 300 m est un pansement qui n’existe pas</td><td class="c-ch"><span class="gr">26</span><span class="gr">106</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Sur la glace :</strong> pics à glace portés <strong>au cou, par-dessus le manteau</strong>, corde flottante avec objet flottant au bout, sifflet porté sur soi</td><td class="c-qte">1 paire de pics et 1 sifflet par personne, 1 corde par groupe</td><td class="c-sans">Des pics dans un sac à dos ne se sortent pas de l’eau. Une personne en choc thermique<sup class="fnr" data-fn="00b-1">1</sup> ne crie pas : le sifflet parle à sa place</td><td class="c-ch"><span class="gr">25</span><span class="gr">58</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Sur l’eau et sur la glace mince :</strong> VFI <strong>ajusté à chaque enfant</strong>, avec sangle d’entrejambe</td><td class="c-qte">1 par personne, dont 2 tailles enfant</td><td class="c-sans">Un VFI d’adulte sur un enfant de 4 ans remonte et lui passe par-dessus la tête au moment exact où il flotte. La sangle d’entrejambe est ce qui empêche ça, et c’est elle qu’on ne boucle pas</td><td class="c-ch"><span class="gr">39</span><span class="gr">57</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Perche de 4 m et corde flottante</strong>, au quai et à la talle de pêche</td><td class="c-qte">1 de chaque</td><td class="c-sans">C’est ce qui permet de sortir quelqu’un sans entrer à son tour</td><td class="c-ch"><span class="gr">25</span></td></tr></tbody></table>
<h3 class="sub">Ce qui n’est pas au palier 1, et pourquoi</h3>
<p class="p0">Quatre absences qui surprennent, parce qu’elles reviennent partout dans le livre.</p>
<p class="li"><strong>La génératrice.</strong> Elle est au palier 2. Elle rend du confort et sauve un congélateur ; elle ne sauve pas une vie, et elle en met une en jeu dès qu’elle tourne dans un bâtiment, un garage ou sous un auvent. Ce qui est au palier 1, c’est l’avertisseur de CO qui la surveille.</p>
<p class="li"><strong>Le filtre à eau.</strong> Il est au palier 2. L’ébullition est la méthode de référence et elle ne dépend d’aucune cartouche. Le filtre est le deuxième moyen indépendant, et un deuxième moyen appartient au palier 2 par définition.</p>
<p class="li"><strong>L’iodure de potassium.</strong> Il est au palier 3, avec son chapitre. C’est le scénario le moins probable des cinq que le livre nomme, et il se périme.</p>
<p class="li"><strong>Le fumoir, l’autoclave, le jardin.</strong> Ils produisent et transforment. Le palier 1 ne fait que traverser l’événement.</p>
<h2 class="palier pal2" data-sec="p2"><span class="pn">2</span><span class="pt2"><small>Palier 2</small>Essentiel</span></h2>
<p class="p0 ri crit kh"><strong class="runin">Le critère :</strong> ce qui fait la différence entre tenir et bien tenir. Le palier 1 fait passer l’événement ; le palier 2 fait qu’on en sort sans avoir tout dépensé.</p>
<h3 class="sub ss"><span class="ssn pal2">2.A</span>Eau, énergie, chaleur</h3>
<table class="tspan achat pal2"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Filtre à eau à pores <strong>de 1 µm ou moins</strong>, avec l’échelle de filtration écrite sur l’emballage, plus des cartouches de rechange</td><td class="c-qte">1 + 2 cartouches</td><td class="c-sans">Le deuxième moyen indépendant. Un pore de 1 µm arrête les parasites et la plupart des bactéries, pas les virus (0,03 µm) : le filtre clarifie, il ne remplace jamais l’ébullition ou la javel. La cartouche se change selon le <strong>débit total passé</strong>, pas selon le temps écoulé</td><td class="c-ch"><span class="gr">10</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bandelettes de <strong>chlore libre</strong>, plage 0 à 200 mg/L</td><td class="c-qte">1 boîte</td><td class="c-sans">Sans elles, la désinfection du puits est un geste sans preuve</td><td class="c-ch"><span class="gr">10</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Analyse d’eau en laboratoire</td><td class="c-qte">2 microbiologiques + 1 chimique par année</td><td class="c-sans">Un puits ne se goûte pas : ni les coliformes, ni l’arsenic, ni le manganèse ne changent l’eau au goût ou à l’œil. C’est la seule donnée du livre qui ne se produit pas soi-même, et c’est pour ça qu’elle s’achète <strong>maintenant</strong>, pendant que le laboratoire existe. Ce qu’on fait quand il n’existe plus est à la dernière section</td><td class="c-ch"><span class="gr">10</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Batterie de service 12 V, contrôleur de charge, panneau solaire à <strong>inclinaison hivernale forte</strong>, voltmètre lisible sans se lever, fusibles en double à chaque valeur</td><td class="c-qte">1 ensemble, 2 fusibles par valeur</td><td class="c-sans">C’est le seul étage d’éclairage qui tient des semaines. Le panneau à plat se couvre de neige en décembre ; le balai à long manche fait partie de l’achat</td><td class="c-ch"><span class="gr">85</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Génératrice, rallonges <strong>d’un calibre assez gros pour la longueur tirée</strong>, bidons étiquetés</td><td class="c-qte">Selon l’autonomie visée</td><td class="c-sans">La panne d’Hydro en janvier est un scénario de maison : c’est là qu’il y a un congélateur plein et une plomberie qui gèle. Une rallonge trop mince sur 30 m chauffe sur toute sa longueur et fait perdre de la tension au bout : le moteur du congélateur force et grille. <strong>Jamais dans un bâtiment, un garage ou sous un auvent</strong></td><td class="c-ch"><span class="gr">3</span><span class="gr">15</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Chaufferette <strong>conçue pour l’usage intérieur</strong>, et son combustible</td><td class="c-qte">1</td><td class="c-sans">Toute autre source de chaleur d’appoint dans une pièce fermée produit du CO. Sous 0 °C, le butane ne se vaporise plus — il bout à −0,5 °C — et la chaufferette s’éteint ; le propane, qui bout à −42 °C, continue de donner</td><td class="c-ch"><span class="gr">6</span><span class="gr">87</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lq">(et chalet fermé l’hiver)</span></div></td><td class="c-item">Antigel de plomberie <strong>non toxique</strong></td><td class="c-qte">Toilette 0,5 à 1 L, laveuse 2 L, lave-vaisselle 1 L</td><td class="c-sans">Une plomberie éclatée transforme une panne de trois jours en chantier de trois mois</td><td class="c-ch"><span class="gr">3</span><span class="gr">7</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span><span class="lq">(où il y a un poêle)</span></div></td><td class="c-item">Brosse de ramonage <strong>au diamètre exact du tuyau</strong>, avec tiges, et petit miroir d’inspection</td><td class="c-qte">1 jeu</td><td class="c-sans">Ramonage <strong>au moins une fois par année</strong> selon la quantité et la qualité du bois brûlé. Une brosse au mauvais diamètre polit la créosote au lieu de l’enlever</td><td class="c-ch"><span class="gr">83</span><span class="gr">82</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Humidimètre à broches</td><td class="c-qte">1</td><td class="c-sans">C’est l’instrument qui vérifie le 20 % au lieu de le supposer</td><td class="c-ch"><span class="gr">83</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Thermomètre d’ambiance <strong>minimum-maximum</strong></td><td class="c-qte">1 par local qui compte : stock, chambre froide, cache, caveau</td><td class="c-sans">C’est ce qui rend la cave et la cache utilisables au lieu d’optimistes</td><td class="c-ch"><span class="gr">5</span><span class="gr">73</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Thermomètre <strong>enregistreur</strong> pour la cave et le congélateur</td><td class="c-qte">1</td><td class="c-sans">Une année de relevés est la condition d’entrée des chapitres 68 et 79. Sans elle, la salaison longue et le caveau restent sur papier</td><td class="c-ch"><span class="gr">9</span><span class="gr">68</span><span class="gr">79</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Hache de fendage ou masse de fendeur, 2,5 à 3,5 kg, plus 2 coins d’acier</td><td class="c-qte">1 jeu</td><td class="c-sans">La scie abat, elle ne fend pas. Et le jour où la scie ne part pas, c’est la hache qui chauffe le bâtiment</td><td class="c-ch"><span class="gr">83</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal2">2.B</span>Le tranchant, le levage, la bête</h3>
<table class="tspan achat pal2"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Limes rondes <strong>au diamètre marqué par le fabricant de la chaîne</strong>, porte-lime ou guide d’angle, lime plate, jauge de limiteur, un manche par lime</td><td class="c-qte">1 jeu par pas de chaîne, 3 ou 4 limes rondes par chaîne</td><td class="c-sans">L’affûtage est le geste le plus rentable du livre. Une chaîne morte fait forcer, et la main qui force glisse</td><td class="c-ch"><span class="gr">105</span><span class="gr">106</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Chaînes de rechange affûtées, guide de rechange, pignon, huile de guide, huile deux temps <strong>du grade prescrit par le fabricant</strong></td><td class="c-qte">3 chaînes minimum</td><td class="c-sans">Une chaîne dans un clou, et la corvée de bois est finie pour la journée. Le rapport de mélange est celui du bouchon, pas celui d’un livre</td><td class="c-ch"><span class="gr">106</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Pierre combinée grossier/fin ou plaque diamantée, fusil à aiguiser</td><td class="c-qte">1 de chaque</td><td class="c-sans">Affûter enlève du métal ; le fusil redresse un fil déjà formé. Ce ne sont pas deux façons de faire la même chose</td><td class="c-ch"><span class="gr">105</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Couteaux : à désosser lame rigide 13 à 15 cm, à trancher lame souple 20 cm et plus, à fileter lame souple 15 cm</td><td class="c-qte">2 + 1 + 2</td><td class="c-sans">Deux lames à désosser permettent de continuer pendant que la main se réchauffe. Un seul couteau fait mal les deux gestes</td><td class="c-ch"><span class="gr">62</span><span class="gr">75</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Scie à os, lame de 40 cm et plus</td><td class="c-qte">1</td><td class="c-sans">Elle ouvre les os longs, donc la moelle, donc la meilleure réserve de gras de la bête. Jamais sur le crâne ni sur la colonne</td><td class="c-ch"><span class="gr">22</span><span class="gr">72</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Palan à chaîne ou treuil à mâchoires avec <strong>son câble</strong>, élingues dont la <strong>charge d’utilisation est marquée dessus</strong>, manilles forgées, crochets à <strong>linguet</strong>, cosses, serre-câbles forgés, moufle à chape ouvrante</td><td class="c-qte">1 appareil, 2 à 4 élingues, 4 à 6 manilles, 2 moufles</td><td class="c-sans">200 kg au-dessus d’une tête. La charge marquée sur l’élingue est la seule façon de savoir ce qu’elle tient, parce qu’un câble ne prévient pas : il s’use <strong>de l’intérieur</strong>, brin par brin, et une boucle formée sans cosse scie son propre œil là où on ne le voit pas. Le linguet existe parce qu’une charge qui remonte d’un coup décroche un crochet ouvert</td><td class="c-ch"><span class="gr">61</span><span class="gr">109</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Gambrel, crochets à viande à capacité largement supérieure à la charge, corde de nylon de 10 m, gardée sèche et sans nœud à demeure : un nœud laissé en place l’affaiblit beaucoup, et une corde gelée casse ses fibres si on la charge avant qu’elle ait dégelé</td><td class="c-qte">1 + 4 + 2</td><td class="c-sans">La bête se refroidit suspendue, pas couchée. Sept degrés en 24 heures, c’est la seule mesure qui décide si 200 kg passent l’hiver. Nylon neuf de 13 mm : environ 480 kg de charge de travail</td><td class="c-ch"><span class="gr">61</span><span class="gr">62</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Balance 0 à 50 kg au 100 g, et peson 0 à 200 kg</td><td class="c-qte">1 de chaque</td><td class="c-sans">Un pourcentage de sel sans masse n’existe pas</td><td class="c-ch"><span class="gr">62</span><span class="gr">46</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Table de travail lavable, ou contreplaqué scellé</td><td class="c-qte">1</td><td class="c-sans">Rien ne se dépose au sol, et une table de cuisine en bois ne se désinfecte pas</td><td class="c-ch"><span class="gr">62</span><span class="gr">48</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Lunettes de protection, masque, tablier imperméable, gants de travail, gants de cuir</td><td class="c-qte">1 jeu par manipulateur</td><td class="c-sans">La tularémie entre par une peau éraflée <strong>et par l’œil</strong> : dépouiller, c’est projeter de la gouttelette à hauteur de visage pendant deux heures. Les lunettes sont la pièce qu’on oublie parce qu’on ne se voit pas l’œil</td><td class="c-ch"><span class="gr">46</span><span class="gr">48</span><span class="gr">50</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal2">2.C</span>Garder ce qui a été pris</h3>
<table class="tspan achat pal2"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Papier de boucherie ciré, sacs <strong>conçus pour la congélation</strong>, ruban de congélation, étiquettes, marqueur indélébile, ruban qui tient au froid</td><td class="c-qte">Poids annuel de viande ÷ poids par paquet</td><td class="c-sans">Un sac ordinaire gèle, craque et laisse la pièce se dessécher. Une pièce non étiquetée se mange à l’envers, ou se jette trois mois plus tard par précaution</td><td class="c-ch"><span class="gr">9</span><span class="gr">73</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Coton à fromage (étamine), ficelle de boucher, crochets en S</td><td class="c-qte">Compter <strong>par carcasse</strong>, pas par année</td><td class="c-sans">La mousseline laisse passer l’air et pas la mouche. C’est le poste invisible jusqu’au jour du débitage</td><td class="c-ch"><span class="gr">9</span><span class="gr">62</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Glacières isolées et bacs de plastique à couvercle, 20 L, opaques</td><td class="c-qte">2 glacières, 4 à 6 bacs</td><td class="c-sans">Un poisson perd en quelques heures ce qu’un quartier d’orignal met une journée à perdre</td><td class="c-ch"><span class="gr">57</span><span class="gr">75</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Contenants <strong>non réactifs</strong> de qualité alimentaire : plastique alimentaire, acier inoxydable, grès vernissé</td><td class="c-qte">2 grands, 2 petits, plus 1 par fournée de fermentation</td><td class="c-sans">Ni aluminium, ni fer galvanisé, ni cuivre au contact d’un sel humide : le métal part dans la saumure, et ce qui est parti dans la saumure est parti dans la viande</td><td class="c-ch"><span class="gr">67</span><span class="gr">69</span><span class="gr">80</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Autoclave</strong> (marmite à pression pour conserves) avec manomètre ou soupape calibrée, son livret de barèmes éprouvés, et <strong>un jeu de joint et de soupape de rechange</strong></td><td class="c-qte">1, du plus grand volume que le poêle porte</td><td class="c-sans">C’est le seul « non » absolu du chapitre 78 : sans lui, la moitié peu acide du chapitre — viande, poisson, légumes — n’existe pas. C’est aussi une des routes de sauvetage du congélateur qui dégèle</td><td class="c-ch"><span class="gr">74</span><span class="gr">78</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Pots de type Mason à épaulement, <strong>couvercles plats neufs</strong>, marmite haute avec grille de fond, lève-pots, minuteries dont une <strong>mécanique</strong></td><td class="c-qte">1 couvercle neuf par pot rempli <strong>+ 20 %</strong></td><td class="c-sans">Les bagues se réutilisent, le couvercle plat est à usage unique. Un pot posé à même le métal chaud éclate. Le botulisme ne change ni l’odeur, ni le goût, ni l’apparence</td><td class="c-ch"><span class="gr">78</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Vinaigre à <strong>acidité déclarée sur l’étiquette, 5 %</strong>, et jus de citron du commerce</td><td class="c-qte">Nombre de pots prévus × le volume de la recette</td><td class="c-sans">Un vinaigre maison de titre inconnu ne remplace pas un vinaigre titré dans une conserve. Le seuil est un <strong>pH de 4,6</strong></td><td class="c-ch"><span class="gr">78</span><span class="gr">80</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bandelettes de <strong>pH</strong> dont la plage encadre <strong>3,2 à 4,6</strong>, ou pH-mètre étalonné</td><td class="c-qte">1 rouleau par saison</td><td class="c-sans">C’est la seule preuve que la choucroute est descendue assez bas. Et la choucroute est la source de vitamine C de janvier</td><td class="c-ch"><span class="gr">80</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Baril ou pots de fermentation <strong>à joint d’eau</strong>, avec poids d’immersion</td><td class="c-qte">60 à 100 L de capacité totale, 1 poids par contenant</td><td class="c-sans">Ce qui dépasse de la saumure grise et tourne</td><td class="c-ch"><span class="gr">20</span><span class="gr">80</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Sel <strong>iodé</strong> de table, gardé <strong>distinct</strong> du sel de salaison</td><td class="c-qte"><strong>Un peu plus de 2 kg par an pour la famille</strong> — environ 6 g par jour pour quatre, ce qui couvre l’iode de chacun</td><td class="c-sans">Il ne conserve rien et il marque le goût d’une saumure. Il est là pour la thyroïde, pas pour la cuisse</td><td class="c-ch"><span class="gr">21</span><span class="gr">67</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal2">2.D</span>Le corps, la tête, les enfants</h3>
<table class="tspan achat pal2"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bac opaque réservé à la pharmacie, thermomètre <strong>min-max rangé dedans</strong>, seringues orales graduées en mL, contenant scellé pour les objets piquants</td><td class="c-qte">1 bac, 1 thermomètre, 3 seringues ; plus 1 seringue de 10 mL <strong>par personne</strong>, réservée au lavage du nez</td><td class="c-sans">Un médicament gelé puis dégelé a l’air intact et ne l’est pas — c’est vrai des liquides, des suspensions et de tout ce qui s’injecte. Le min-max rangé <strong>dans</strong> le bac est la seule chose qui dise si le chalet est descendu sous zéro pendant les trois semaines où personne n’y était. Les seringues graduées servent deux fois : les doses d’enfant, et le dosage de la javel. Celles du nez sont une par personne, sinon on se passe le rhume par le nez (<span class="ref">ch. 28</span>)</td><td class="c-ch"><span class="gr">10</span><span class="gr">32</span><span class="gr">28</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Comprimés d’acide ascorbique 500 mg, datés</td><td class="c-qte">Réserve d’un hiver pour quatre, rotation annuelle</td><td class="c-sans">Les apports de référence sont de <strong>90 mg/j</strong> pour un homme adulte, <strong>75 mg/j</strong> pour une femme, <strong>25 mg/j</strong> de 4 à 8 ans. Le scorbut prend deux à trois mois, et personne ne compte ce qui reste de fruits frais</td><td class="c-ch"><span class="gr">20</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Vitamine D en gouttes</td><td class="c-qte"><strong>600 UI par jour</strong> et par personne, de 1 à 70 ans. Une goutte par jour d’un produit à 1 000 UI la goutte reste sous le plafond de chacun (3 000 UI à 4-8 ans, 4 000 UI adulte) ; à quatre pendant cinq mois, 600 gouttes — le nombre par flacon est sur l’étiquette</td><td class="c-sans">Cinq mois sans soleil utile, à quatre</td><td class="c-ch"><span class="gr">21</span><span class="gr">36</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Pèse-personne <strong>mécanique, sans pile</strong></td><td class="c-qte">1</td><td class="c-sans">La perte de poids est le premier signal fiable du mal de caribou et du déficit d’hiver. Elle se voit trois semaines avant que la personne s’en plaigne</td><td class="c-ch"><span class="gr">19</span><span class="gr">21</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Brosses à dents à soies souples</strong></td><td class="c-qte">1 par personne, et une de rechange <strong>aux 3 mois</strong> : 4 par personne par année (calcul)</td><td class="c-sans">La brosse enlève la plaque par frottement, et c’est l’essentiel du soin. Au chalet, une carie qui atteint la pulpe devient un abcès qui ne se soigne pas sur place, et l’abcès qui quitte la mâchoire peut fermer la gorge en quelques heures. Une brosse aux soies couchées ne frotte plus : la brosse de branche la remplace, en se refaisant sans cesse (<span class="ref">ch. 27</span> <span class="ref">§9</span>)</td><td class="c-ch"><span class="gr">27</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Dentifrice au fluorure</strong></td><td class="c-qte">Consommation observée × durée d’isolement retenue. La dose : un petit pois de 3 à 6 ans, environ 1 cm pour un adulte</td><td class="c-sans">La brosse fait le travail mécanique ; le dentifrice ajoute le fluorure, qui rend l’émail plus résistant, et c’est ce qu’on perd sans lui. Le petit pois n’est pas une économie : l’enfant en avale, et trop de fluorure avalé lui tache les dents de blanc. Le dernier tube s’étire à un brossage par semaine (<span class="ref">ch. 27</span> <span class="ref">§9</span>)</td><td class="c-ch"><span class="gr">27</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Papier hygiénique, produits d’hygiène menstruelle, couches ou culottes d’entraînement</td><td class="c-qte">Consommation mensuelle observée × durée d’isolement retenue <strong>× 1,5</strong></td><td class="c-sans">Le poste systématiquement oublié. Le tissu remplace les trois, et c’est ce que faisaient les générations d’avant — mais il faut alors laver du linge souillé tout l’hiver, donc de l’eau chaude, du savon et une corde à l’intérieur (dernière section). Le × 1,5 existe parce qu’une gastro à quatre consomme en trois jours ce qu’un mois normal consomme</td><td class="c-ch"><span class="gr">9</span><span class="gr">31</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Seau de nuit à couvercle hermétique 20 L, pelle et pic réservés à la bécosse, bran de scie ou tourbe</td><td class="c-qte">2 seaux, 1 baril de 200 L de bran de scie</td><td class="c-sans">À −35 °C, personne ne sort la nuit. Un seau sans couvercle règle un problème et en crée un autre</td><td class="c-ch"><span class="gr">31</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Réveil ou horloge <strong>mécanique à remonter, à trotteuse</strong>, calendrier mural couvrant tout l’hiver, tableau de la journée en images à hauteur d’enfant</td><td class="c-qte">2 réveils, 1 calendrier, 1 tableau</td><td class="c-sans">Une journée dont la forme ne change pas quand tout change. C’est la seule chose qui tienne un enfant de 4 ans pendant six semaines. La trotteuse compte aussi les respirations et le pouls d’un malade quand le téléphone est mort : compter à voix haute court trop vite sous stress (<span class="ref">ch. 26</span>, <span class="ref">ch. 28</span>)</td><td class="c-ch"><span class="gr">36</span><span class="gr">40</span><span class="gr">26</span><span class="gr">28</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Objet de réconfort de chaque enfant, <strong>plus son double caché</strong></td><td class="c-qte">1 paire par enfant</td><td class="c-sans">Le double existe pour la nuit où le premier est perdu, et cette nuit-là arrive</td><td class="c-ch"><span class="gr">40</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Gourde, une par enfant</td><td class="c-qte">1 par enfant</td><td class="c-sans">Si l’adulte seul ne se relève pas, l’enfant boit sans lui. La gourde dort dans le sac de couchage : si le poêle s’éteint, l’eau d’un pichet gèle, pas celle du sac (<span class="ref">ch. 38</span>)</td><td class="c-ch"><span class="gr">38</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span><span class="lq">elle voyage avec la personne</span></div></td><td class="c-item"><strong>Coupe menstruelle</strong></td><td class="c-qte">1 par femme ; elle dure <strong>5 à 10 ans</strong></td><td class="c-sans">C’est au chalet que le dernier paquet finit. La coupe se vide aux 6 à 12 heures et bout 5 à 10 minutes à la fin de chaque cycle. Sans elle, les serviettes de flanelle se cousent, et la sphaigne pâle se met en sachet (<span class="ref">ch. 29</span> <span class="ref">§9-A</span>) — mais une serviette qui n’a pas fini de sécher irrite, et au chalet l’hiver, c’est le poêle qui décide combien il en faut</td><td class="c-ch"><span class="gr">29</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Condoms</strong> en latex, et comprimés de <strong>contraception d’urgence</strong> achetés d’avance</td><td class="c-qte">Selon la durée d’isolement retenue (<span class="ref">ch. 29</span>)</td><td class="c-sans">Une grossesse commencée au chalet en janvier est un accouchement au chalet en octobre, sans salle d’opération. <strong>Tout corps gras détruit le latex</strong> — saindoux, graisse d’ours, vaseline, onguent — et au chalet, le gras est partout : on lubrifie à l’eau ou à la salive. La contraception d’urgence se prend jusqu’à 5 jours après. Seule une méthode posée d’avance ne dépend d’aucun stock : le stérilet au cuivre dure 12 ans, le stérilet hormonal et l’implant 3 à 5 ans (<span class="ref">ch. 29</span>, étape 10)</td><td class="c-ch"><span class="gr">29</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Guide d’identification illustré de la flore du Québec, <strong>sur papier</strong></td><td class="c-qte">1, plus 1 par cueilleur pour les champignons</td><td class="c-sans">Aucune application ne fonctionne sans réseau, et c’est exactement là que poussent les plantes</td><td class="c-ch"><span class="gr">33</span><span class="gr">92</span><span class="gr">93</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal2">2.E</span>Le feu de forêt et la fumée</h3>
<p class="p0">Le chapitre 2 le dit sans détour : la possibilité de rester est décidée des années d’avance par l’aménagement, pas le jour même par le courage. Ce qui suit est la part de cet aménagement qui s’achète. Le reste — dégager, espacer, élaguer — est du travail, pas une dépense.</p>
<table class="tspan achat pal2"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Grillage métallique à mailles de 3 mm</strong>, posé sur ou derrière chaque évent, chaque soffite et chaque ouverture</td><td class="c-qte">Tous les évents des deux bâtiments</td><td class="c-sans">Un bâtiment ne prend presque jamais par le front de flamme : il prend par un tison entré par un évent, pendant que le feu est encore à un kilomètre. La moustiquaire de fenêtre est en fibre de verre ou en nylon — elle fond avant le tison. Il faut du métal, et à 3 mm : une maille plus fine se bouche de charpie et le bâtiment ne respire plus</td><td class="c-ch"><span class="gr">2</span><span class="gr">82</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Boyau d’arrosage assez long pour atteindre <strong>le faîte du toit</strong>, plus le raccord et la lance</td><td class="c-qte">1 jeu par bâtiment</td><td class="c-sans">« Arrosez abondamment votre terrain et votre toit » avant de partir. Un boyau de 15 m qui arrête au coin de la maison ne fait pas ce travail</td><td class="c-ch"><span class="gr">7</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Échelle donnant accès au toit, <strong>dégagée et accessible l’hiver</strong></td><td class="c-qte">1</td><td class="c-sans">La même échelle sert au ramonage, aux gouttières et à l’arrosage du toit. Une échelle sous un banc de neige n’existe pas</td><td class="c-ch"><span class="gr">82</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item"><strong>Purificateur d’air portatif à filtre HEPA</strong>, choisi pour la dimension de la pièce, plus une réserve de filtres de rechange</td><td class="c-qte">1 pour la pièce où dorment les enfants</td><td class="c-sans">Un épisode de fumée dure des jours et la Cote air santé va de <strong>1 à 10+</strong>. L’appareil filtre les particules fines ; il ne filtre pas les gaz. Il est au palier 2 à la maison parce qu’il tourne en continu sur le réseau — au chalet, il descend au palier 4, faute de courant</td><td class="c-ch"><span class="gr">2</span><span class="gr">39</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Deuxième jeu de clés de véhicule et carte routière papier de deux itinéraires distincts</td><td class="c-qte">2 jeux, 1 carte</td><td class="c-sans">« Un feu de forêt peut restreindre ou bloquer la circulation » : un seul chemin de sortie n’est pas un plan d’évacuation</td><td class="c-ch"><span class="gr">2</span><span class="gr">7</span><span class="gr">42</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal2">2.F</span>Lire le territoire</h3>
<table class="tspan achat pal2"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Carte topographique du secteur imprimée grand format, plastifiée ou en pochette étanche</td><td class="c-qte">1 jeu, 2 copies</td><td class="c-sans">Le papier ne tombe pas en panne de pile</td><td class="c-ch"><span class="gr">42</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Boussole à plaquette transparente, <strong>réglable en déclinaison</strong>, réglée et avec la valeur écrite sur la carte : <strong>16 à 18° ouest</strong> sur la Côte-Nord (16° à Baie-Comeau, 17° à Sept-Îles, 17,5° à Havre-Saint-Pierre), en baisse d’environ 1,5° par dix ans</td><td class="c-qte">2</td><td class="c-sans">Non corrigée, elle envoie à 300 m de côté par kilomètre marché, avec assurance</td><td class="c-ch"><span class="gr">42</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Dossard orange fluorescent couvrant <strong>le dos, les épaules et la poitrine</strong></td><td class="c-qte">1 par personne présente, enfants et accompagnateurs compris</td><td class="c-sans">En période de chasse, c’est ce qui distingue un enfant d’un orignal (<em>Alces americanus</em>) à 200 m dans une pessière. Les épaules comptent autant que le dos : c’est ce qui dépasse d’un buisson quand le reste est caché, et l’orange fluorescent est la seule couleur que le bois ne porte pas</td><td class="c-ch"><span class="gr">16</span><span class="gr">42</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Tarière à glace manuelle avec couteaux de rechange, ruban à mesurer rigide ou jauge d’épaisseur crochetée, perche de sondage</td><td class="c-qte">1 de chaque</td><td class="c-sans">Sans mesure, les 10 et les 12 cm de glace ne sont qu’une opinion</td><td class="c-ch"><span class="gr">42</span><span class="gr">58</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Cartouches de .22</strong> à percussion annulaire</td><td class="c-qte">Le compte du <span class="ref">ch. 45</span> (<span class="ref">§5-A</span>) : <strong>1 par bête prise à la .22</strong> — lièvre, porc-épic, oiseau perché, écureuil, rat musqué, bête vivante au piège —, plus le réglage à 25 m et la pratique</td><td class="c-sans">C’est la cartouche qu’on tire le plus, et celle qui fait le plus de repas : une boîte de .22 tirée à la tête sur des bêtes assises fait bien plus de repas qu’une boîte de cartouches de fusil tirée au vol. C’est aussi la plus fragile : son amorce est logée dans le bourrelet de la douille, et elle craint l’humidité bien plus que les autres. Elle ne se refait pas au chalet</td><td class="c-ch"><span class="gr">45</span><span class="gr">47</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Cartouches de carabine, à balle de chasse : .308 Winchester, 7 mm Remington Magnum, .303 British</strong></td><td class="c-qte">Le compte du <span class="ref">ch. 45</span> (<span class="ref">§5-A</span>) : <strong>12 par carabine</strong> pour le réglage et le zéro froid, <strong>3 de plus par chute</strong>, puis le coup qui tue et le coup de grâce par bête. Le gros du stock en <strong>.308</strong></td><td class="c-sans">Rien ne remplace la balle sur l’orignal, l’ours et le phoque : l’arc de fortune ne garantit pas la force qu’il faut (<span class="ref">ch. 45</span> <span class="ref">§9</span>). Deux des quatre carabines tirent la .308 : une boîte sert deux armes et deux tireurs, et si l’une casse, ses cartouches passent à l’autre. La 7 mm et la .303 ont chacune la leur, qui ne sert à rien d’autre. <strong>Un seul calibre par caisse</strong> : la .308 et la .303 se glissent dans la chambre de la 7 mm, et leur balle, plus grosse que son âme, la fait céder (<span class="ref">ch. 45</span>, étape 39)</td><td class="c-ch"><span class="gr">45</span><span class="gr">61</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Cartouches de <strong>calibre 12</strong>, grenaille pour le <strong>petit gibier du bois</strong> : <strong>n° 7½ ou 8</strong> pour la gélinotte, <strong>n° 6</strong> quand les feuilles sont tombées ; <strong>n° 6 à 8</strong> pour l’écureuil ; <strong>n° 4 à 7½</strong> pour le lièvre, le n° 6 d’abord</td><td class="c-qte">Selon la boîte (<span class="ref">ch. 47</span>) : au vol, une prise coûte plus d’une cartouche (<span class="ref">ch. 45</span> <span class="ref">§5-A</span>)</td><td class="c-sans">Sur l’oiseau en vol et le lièvre qui court, rien ne remplace le fusil. <strong>En acier plutôt qu’en plomb pour ce qui ira dans l’assiette des enfants</strong>, et alors un ou deux numéros plus gros (ligne suivante). Une seule sorte de grenaille par veste : le plomb de la gélinotte ne voyage jamais avec l’acier du canard</td><td class="c-ch"><span class="gr">47</span><span class="gr">49</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Cartouches de <strong>calibre 12</strong>, grenaille <strong>non toxique</strong> pour la sauvagine : acier <strong>n° 2 ou 3</strong> pour le canard, <strong>BB, 1 ou 2</strong> pour l’outarde ; bismuth pour le vieux fusil à choke plein</td><td class="c-qte">De l’ordre de <strong>5 cartouches par canard abattu</strong> (<span class="ref">ch. 45</span> <span class="ref">§5-A</span>), et rien d’autre dans le sac</td><td class="c-sans">Les grains de plomb restent dans la chair et ne se retrouvent pas tous au découpage : c’est du plomb dans l’assiette de deux enfants. L’acier pèse environ <strong>un tiers de moins</strong> que le plomb au même numéro et porte moins loin : il se prend <strong>un ou deux numéros plus gros</strong> que le plomb au même usage — plus gros, c’est un numéro plus petit. Pas plus : trop gros, la gerbe se vide et l’oiseau passe entre les grains. Plus dur que le plomb, l’acier bat et gonfle un vieux canon à choke plein ; le bismuth, plus mou, y passe</td><td class="c-ch"><span class="gr">45</span><span class="gr">47</span><span class="gr">54</span></td></tr></tbody></table>
<h2 class="palier pal3" data-sec="p3"><span class="pn">3</span><span class="pt2"><small>Palier 3</small>Important</span></h2>
<p class="p0 ri crit kh"><strong class="runin">Le critère :</strong> ce qui évite une dégradation lente. Rien ici ne fait mourir demain ; tout ici fait que dans deux ans, le stock, le bâtiment ou les outils valent moins qu’aujourd’hui.</p>
<table class="tspan achat pal3"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Laine d’acier, tôle mince, mousse expansive, pièges à rongeurs</td><td class="c-qte">Autant qu’il y a de passages</td><td class="c-sans">Une souris traverse trois mois de réserve en une saison, et elle entre par un trou qu’on a vu sans le boucher</td><td class="c-ch"><span class="gr">5</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Quincaillerie par <strong>famille complète</strong> : vis en 2 ou 3 longueurs choisies, boulons <strong>avec leurs écrous et rondelles dans le même bac</strong>, clous communs et à toiture, goupilles et clavettes aux cotes du parc, assortiment de joints toriques, colliers de serrage, ruban d’électricien et de toile, fil de fer recuit, corde de nylon</td><td class="c-qte">Une famille à la fois, puis on recomplète</td><td class="c-sans">Un boulon sans son écrou est un déchet. L’assortiment de joints toriques est la seule famille où l’assortiment bon marché est un bon achat</td><td class="c-ch"><span class="gr">108</span><span class="gr">109</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bougies, filtres à air et à essence, corde de lanceur au diamètre, conduite d’essence au mètre, jeu de joints de carburateur</td><td class="c-qte">1 jeu <strong>par machine</strong></td><td class="c-sans">Ce sont exactement les pièces qui lâchent et exactement celles qu’on n’a pas. Une bougie coûte le prix d’un café et immobilise une génératrice pour six semaines</td><td class="c-ch"><span class="gr">106</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bidons de carburant <strong>à bec et à joint qui ferme vraiment</strong>, étiquetés au marqueur, plus un siphon à main, un entonnoir à grille et du stabilisateur de carburant</td><td class="c-qte">2 bidons par usage : un pour le mélange, un pour l’essence pure</td><td class="c-sans">Ce n’est pas l’essence qui brûle, c’est sa vapeur — et la vapeur d’essence est plus lourde que l’air : elle sort d’un bidon mal fermé, coule au plancher, traverse une pièce et trouve la veilleuse du chauffe-eau ou du frigo au propane à l’autre bout. D’où la règle qui décide de tout : <strong>le carburant ne dort pas dans le bâtiment où on dort</strong>. Les deux bidons distincts existent parce que du mélange deux temps versé dans la génératrice l’encrasse, et de l’essence pure dans la scie la serre</td><td class="c-ch"><span class="gr">15</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Époxy à deux composants, scellant à silicone, scellant de toiture, adhésif de contact à semelle — <strong>tous rangés hors gel</strong></td><td class="c-qte">1 de chaque</td><td class="c-sans">Le gel et la prise en masse les tuent sur la tablette, sans avertir</td><td class="c-ch"><span class="gr">104</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bardeaux de la même série que le toit, solin plié d’avance, membrane autocollante, clous à toiture, vitre ou polycarbonate à la dimension, moustiquaire</td><td class="c-qte">Selon le bâtiment</td><td class="c-sans">Un bardeau arraché en novembre devient une charpente pourrie en avril. Les bardeaux de la même série existent aujourd’hui et n’existeront plus dans cinq ans</td><td class="c-ch"><span class="gr">108</span><span class="gr">110</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Corde de joint de porte de poêle et ciment réfractaire, vitre à la dimension</td><td class="c-qte">1 jeu par poêle</td><td class="c-sans">Le joint s’écrase progressivement et personne ne voit le jour où il ne ferme plus. Le test du billet de banque<sup class="fnr" data-fn="00b-2">2</sup> le dit</td><td class="c-ch"><span class="gr">83</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Mèches de lampe au mètre, verres de cheminée de rechange, huile à lampe dans son contenant d’origine étiqueté</td><td class="c-qte">2 verres par lampe, 3 mèches</td><td class="c-sans">Le verre casse une fois par hiver, et il ne se remplace pas par autre chose</td><td class="c-ch"><span class="gr">85</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Comprimés d’<strong>iodure de potassium 65 mg</strong></td><td class="c-qte">1 boîte par personne, remplacée à l’expiration</td><td class="c-sans">Ne sert qu’en présence d’iode 131 — hors de là il ne reste que le risque — et le délai d’efficacité est court. C’est le scénario le moins probable du livre et le seul où l’objet ne s’improvise pas</td><td class="c-ch"><span class="gr">4</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Polythène 6 mil ou sacs à ordures épais, ruban d’emballage large</td><td class="c-qte">20 m², 2 rouleaux</td><td class="c-sans">La mise à l’abri de 24 à 48 h suppose qu’on puisse fermer une pièce. Ça sert aussi au feu de forêt et à la fumée</td><td class="c-ch"><span class="gr">4</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Élagueuse à perche et scie d’élagage</td><td class="c-qte">1 de chaque</td><td class="c-sans">C’est l’outil de la zone étendue : conifères espacés d’au moins <strong>3 m</strong>, branches basses élaguées jusqu’à <strong>2 m du sol</strong>. Une scie à chaîne ne fait pas ce travail-là en sécurité, en hauteur</td><td class="c-ch"><span class="gr">2</span><span class="gr">82</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Pompe 12 V ou à essence, avec boyau, puisant au lac</td><td class="c-qte">1</td><td class="c-sans">Elle fait deux choses que le chalet ne peut pas faire autrement : monter l’eau du lac au bâtiment, et arroser le terrain et le toit avant de partir, ce que la maison fait avec un boyau de jardin</td><td class="c-ch"><span class="gr">7</span><span class="gr">10</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Caveau : isolant rigide posé <strong>à l’extérieur</strong> de la structure, hygromètre, deux conduits de ventilation avec registres et <strong>grillage métallique à mailles fines</strong>, porte isolée à joint, pierre nette de drainage</td><td class="c-qte">1 ensemble</td><td class="c-sans"><strong>0 °C et 98 à 100 % d’humidité</strong>, sans brûler un watt — à la condition que ça ne descende jamais une fraction de degré sous zéro. Un seul conduit ne ventile pas</td><td class="c-ch"><span class="gr">79</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Semences à <strong>pollinisation libre</strong>, à saison courte, avec la date de récolte</td><td class="c-qte">Selon la surface</td><td class="c-sans">Les hybrides ne se reproduisent pas fidèlement. La saison sans gel fait 90 à 100 jours : le nombre de jours à maturité imprimé sur le sachet est le seul chiffre qui tranche</td><td class="c-ch"><span class="gr">95</span><span class="gr">100</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Semence du champ : <strong>pommes de terre de semence</strong>, <strong>orge nue</strong>, <strong>gourganes</strong> ou pois secs entiers</td><td class="c-qte">La première année (<span class="ref">ch. 98</span> <span class="ref">§9</span>) : pommes de terre à 0,2 à 0,25 kg/m², en morceaux de 40 à 60 g ; une planche de 100 m² d’orge nue à 12 à 15 g/m², soit 1,2 à 1,5 kg (calcul) ; gourganes ou pois à 17 à 20 g/m²</td><td class="c-sans">Sans semence, pas de pomme de terre, et rien ne fabrique en mai la semence qu’on n’a pas mise de côté en octobre. Le grain vendu pour manger la remplace s’il lève au test de 20 graines (<span class="ref">ch. 100</span>) ; l’orge perlée, l’avoine roulée et le pois cassé ne lèvent plus. <strong>Une semence achetée ne se mange pas, même la faim venue</strong> : elle est souvent enrobée d’un fongicide ou d’un insecticide, et ça ne part pas au rinçage</td><td class="c-ch"><span class="gr">98</span><span class="gr">100</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Semences d’<strong>engrais vert</strong>, dont au moins une légumineuse : pois, vesce commune, trèfle rouge ; avoine, sarrasin, seigle</td><td class="c-qte">1 à 20 g/m² selon l’espèce (<span class="ref">ch. 96</span> <span class="ref">§5-D</span>)</td><td class="c-sans">Sans bêtes, la légumineuse est la seule source d’azote qui se renouvelle. Les pois entiers du garde-manger la remplacent s’ils lèvent au test de 20 graines (<span class="ref">ch. 100</span>). <strong>Le sac se marque « semence » et ne se range pas avec la soupe</strong> : le seigle peut porter l’ergot, qui passe à travers le four, et la graine de vesce commune est toxique et ressemble à une lentille</td><td class="c-ch"><span class="gr">96</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Outils du jardin et du champ : <strong>bêche</strong> et <strong>fourche-bêche</strong>, râteau, pic ou barre à mine</td><td class="c-qte">1 de chaque</td><td class="c-sans">La bêche ou la fourche-bêche est l’outil du premier labour : sans l’une des deux, pas de champ, et sans bête de trait, la première année se fait à la bêche (<span class="ref">ch. 96</span>, <span class="ref">ch. 98</span>). Une douille fendue se ressoude ; une lame de ressort de camion refendue et emmanchée remplace la lame, un levier de merisier durci au feu le pic, une planche à clous le râteau (<span class="ref">ch. 95</span>, <span class="ref">ch. 96</span>, <span class="ref">ch. 111</span>)</td><td class="c-ch"><span class="gr">95</span><span class="gr">96</span><span class="gr">98</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Aiguilles à cuir triangulaires, aiguilles de sellier par paire, alêne à lame losange, fil de lin ciré en deux grosseurs, cire d’abeille, dé métallique ou paume de sellier, ciseaux réservés au tissu</td><td class="c-qte">1 assortiment de chaque</td><td class="c-sans">Sans le dé ou la paume, on pousse l’aiguille avec la paume de la main, une fois. Des ciseaux qui ont coupé du papier ne coupent plus droit</td><td class="c-ch"><span class="gr">104</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Chaux hydratée</td><td class="c-qte">20 kg</td><td class="c-sans">Entretien de la bécosse, et distance fosse-puits du chapitre 31</td><td class="c-ch"><span class="gr">31</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Multimètre, jumelles, raquettes ajustées par personne, traîneau de charge</td><td class="c-qte">1, 1 paire, 1 paire par personne, 1</td><td class="c-sans">Chacun remplace un déplacement, une devinette ou un dos</td><td class="c-ch"><span class="gr">9</span><span class="gr">15</span><span class="gr">42</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Radios portatives de courte portée, antenne filaire longue pour l’AM avec sa mise à la terre</td><td class="c-qte">4 radios, 1 antenne</td><td class="c-sans">Elles couvrent le groupe de chasse et la distance chalet-bûcher. La portée de la boîte est un maximum en ligne de vue, sans obstacle : pour la même radio, le fabricant annonce 26 km d’un sommet vers une vallée et moins d’un kilomètre entre des maisons. En pessière et en vallée, compter beaucoup moins, et mesurer sur place. Le fil d’antenne tendu et mis à la terre est ce qui fait apparaître les stations AM lointaines le soir</td><td class="c-ch"><span class="gr">14</span><span class="gr">16</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Multivitamine pour enfants sans fer surdosé</td><td class="c-qte">1 contenant par enfant par hiver</td><td class="c-sans">Cinq mois de répétition alimentaire chez deux corps en croissance</td><td class="c-ch"><span class="gr">21</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Pâte d’obturation temporaire</strong> : prémélangée <strong>sans eugénol</strong> (oxyde de zinc et sulfate de calcium ou de zinc, l’étiquette le dit), ou trousse <strong>à l’eugénol</strong> (poudre d’oxyde de zinc et son liquide)</td><td class="c-qte">1</td><td class="c-sans">Un bon ciment temporaire bouche le trou d’une obturation perdue jusqu’à <strong>6 mois</strong> ; sans lui, un coton changé chaque jour tient la nourriture dehors, et le froid, le sucré et l’air atteignent la dent. Les deux sortes ne se posent pas pareil : sans eugénol, la pâte prend à l’humidité de la bouche ; à l’eugénol, elle demande un trou sec, et son liquide est un deuxième flacon d’huile de girofle, le même poison bu. Le ciment durci, lui, se pose aussi chez l’enfant</td><td class="c-ch"><span class="gr">27</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Huile de clou de girofle</strong> (eugénol), petit flacon</td><td class="c-qte">1</td><td class="c-sans">Chez l’adulte seulement : un coton imbibé posé sur la carie, jamais sur la gencive, calme la douleur pendant une semaine au plus. C’est un soulagement, pas un traitement. Avec de la poudre d’oxyde de zinc, elle refait le ciment quand la pâte manque. Bue, c’est un poison, surtout pour un enfant, et une épice de cuisine n’en a pas l’air (<span class="ref">ch. 27</span> <span class="ref">§8</span>)</td><td class="c-ch"><span class="gr">27</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Soie dentaire</strong></td><td class="c-qte">30 cm par personne et par soir : environ 110 m par personne par année (calcul)</td><td class="c-sans">Entre les dents, la plaque durcit en tartre, et au chalet plus rien ne l’enlève. Un brin de ficelle de coton détordu la remplace (<span class="ref">ch. 27</span> <span class="ref">§9</span>)</td><td class="c-ch"><span class="gr">27</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Lames neuves</strong> dans leur emballage : lames de rasoir ou de scalpel</td><td class="c-qte">1 paquet</td><td class="c-sans">Un abcès s’ouvre sans anesthésie, donc en un seul trait franc, et une lame neuve sortie de son papier est propre sans rien de plus. Sinon, la lame la plus fine, affûtée et bouillie 30 minutes à gros bouillons — <strong>jamais passée au rouge</strong>, qui la détrempe pour de bon et lui ôte le trait franc (<span class="ref">ch. 34</span> <span class="ref">§9</span>)</td><td class="c-ch"><span class="gr">28</span><span class="gr">34</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Peigne fin à poux, en métal</strong></td><td class="c-qte">1 par maisonnée</td><td class="c-sans">Le bon peigne laisse moins d’un dixième de millimètre entre deux dents, et une lente fait 0,8 mm : un peigne de plastique plus ouvert en laisse passer, et une dent taillée au couteau n’approche pas de cet écart. Aucune plante ne tue les poux. Sans lui, les ongles, lente par lente, ou le rasoir (<span class="ref">ch. 34</span> <span class="ref">§9</span>)</td><td class="c-ch"><span class="gr">34</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i cl
