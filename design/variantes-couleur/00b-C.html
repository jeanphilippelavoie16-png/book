ass="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Soufre précipité</strong>, celui de la pharmacie, pour l’onguent contre la gale</td><td class="c-qte">De quoi faire l’onguent à <strong>6 g de soufre pour 100 g</strong> de vaseline ou de saindoux : environ 30 g d’onguent par adulte et par soir, moins pour un enfant, trois soirs de suite, toute la maison le même jour (<span class="ref">ch. 34</span>)</td><td class="c-sans">Rien de la forêt ne tue l’acarien sur la peau. Sans crème ni soufre, le linge bouilli empêche la maison de se réinfester, pas la peau de ceux qui ont la gale de guérir. La crème de perméthrine du commerce fait le même travail ; le soufre, lui, se mêle au chalet. <strong>Jamais plus de 10 g pour 100 g</strong> : au-delà de 15 %, le soufre brûle la peau</td><td class="c-ch"><span class="gr">34</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Vaseline</strong> et <strong>colle instantanée</strong> (cyanoacrylate)</td><td class="c-qte">1 pot et 1 tube par lieu</td><td class="c-sans">Les crevasses des mains qui travaillent l’hiver : chaque flexion rouvre la fente. Le jour, une goutte de colle dans la fente propre et sèche la scelle, et la douleur tombe ; rien d’autre ne le fait aussi vite. Le soir, la vaseline arrête presque toute l’eau qui sort de la peau. Le baume de cire d’abeille fondue dans du suif la remplace, et ferme moins bien (<span class="ref">ch. 24</span> <span class="ref">§9</span>). La vaseline fait aussi la base de l’onguent de soufre (<span class="ref">ch. 34</span>)</td><td class="c-ch"><span class="gr">24</span><span class="gr">34</span></td></tr></tbody></table>
<h2 class="palier pal4" data-sec="p4"><span class="pn">4</span><span class="pt2"><small>Palier 4</small>S’il reste du temps et de l’argent</span></h2>
<p class="p0 ri crit kh"><strong class="runin">Le critère :</strong> le confort, la redondance, et ce qui se bricole autrement. Rien ici ne manque à personne pendant un hiver.</p>
<table class="tspan achat pal4"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Ce qu’on gagne, et ce qui le remplace</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Fumoir</strong> du commerce</td><td class="c-qte">1</td><td class="c-sans">Ça se bricole : un cabanon, un baril d’acier non peint, un vieux congélateur vidé de sa mousse, ou le four du poêle à bois. Ce qui ne se bricole pas, c’est le thermomètre de chambre à demeure — et il est au palier 2</td><td class="c-ch"><span class="gr">70</span><span class="gr">71</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Balise de détresse <strong>406 MHz</strong> enregistrée</td><td class="c-qte">1</td><td class="c-sans">Redondance pure sur la messagerie satellite du palier 1. Elle envoie un appel, elle ne reçoit pas de réponse</td><td class="c-ch"><span class="gr">14</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">VHF maritime portative, flottante et étanche</td><td class="c-qte">1</td><td class="c-sans">Sur le fleuve, c’est la seule radio qu’écoutent en même temps la Garde côtière et les autres bateaux à portée : un appel est entendu par celui qui est à trois milles avant de l’être par qui que ce soit à terre. Utile seulement si les sorties sur l’eau deviennent régulières</td><td class="c-ch"><span class="gr">14</span><span class="gr">56</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Dosimètre ou compteur Geiger</td><td class="c-qte">1</td><td class="c-sans">Il mesure, il ne protège pas, et il ne change la conduite dans aucun des scénarios du chapitre 4</td><td class="c-ch"><span class="gr">4</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Purificateur d’air portatif <strong>au chalet</strong></td><td class="c-qte">1</td><td class="c-sans">Il vit sur le banc 12 V ou sur la génératrice. Tant que ces deux-là ne sont pas surdimensionnés, il prend le courant de l’éclairage</td><td class="c-ch"><span class="gr">2</span><span class="gr">85</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Lampe de luminothérapie</strong></td><td class="c-qte">1</td><td class="c-sans">Environ 10 000 lux à une trentaine de centimètres, 30 minutes au réveil, pour les jours où le froid interdit de sortir. Elle vit sur le banc 12 V ou la génératrice (<span class="ref">ch. 86</span>). Rien de ce qui brûle ne la remplace — il faudrait de l’ordre de 900 chandelles —, mais la sortie d’une heure dans l’heure du réveil reste le geste le plus efficace contre la déprime de l’hiver, et il ne coûte rien (<span class="ref">ch. 37</span>)</td><td class="c-ch"><span class="gr">37</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Poêle de sauna</strong> à bois, et son thermomètre</td><td class="c-qte">1</td><td class="c-sans">Se laver l’hiver avec la chaleur d’un seul feu. Ça se bricole, et chaque bricolage ajoute un danger : la truie du <span class="ref">ch. 83</span> sous une cage à pierres, le poêle de la tente d’hiver, ou des pierres chauffées dehors et portées sous une bâche (<span class="ref">ch. 37</span> <span class="ref">§9</span>). Ce qui ne se bricole pas, c’est l’avertisseur de CO du vestiaire, et c’est celui du palier 1</td><td class="c-ch"><span class="gr">37</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Arbustes et vivaces qui rendent des années : <strong>camerisiers</strong>, <strong>pommetiers</strong>, <strong>argousiers</strong>, gadelliers, rhubarbe, topinambour</td><td class="c-qte">Camerisiers : deux variétés non apparentées qui fleurissent en même temps, au minimum ; pommetiers : deux variétés à 30 m l’une de l’autre au plus ; argousiers : plusieurs, dont environ un mâle sur dix ; gadelliers : 2 à 4 (<span class="ref">ch. 99</span>)</td><td class="c-sans">Ce qui n’est pas en terre trois ans avant la crise ne nourrit personne pendant la crise ; seuls la rhubarbe et le topinambour donnent dès la première ou la deuxième saison. Un camerisier seul, ou deux de la même variété, fleurit sans fruit chaque année, et aucun soin n’y change rien. La rhubarbe, le gadellier et l’amélanchier se prennent aussi à une vieille talle ou dans le bois (<span class="ref">ch. 99</span>)</td><td class="c-ch"><span class="gr">99</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Deuxième congélateur</td><td class="c-qte">1</td><td class="c-sans">Un congélateur plein tient <strong>48 h</strong> porte fermée, un congélateur à moitié plein <strong>24 h</strong>. Deux appareils à moitié pleins sont pires qu’un seul plein</td><td class="c-ch"><span class="gr">74</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Abreuvoir chauffant 12 V pour le petit élevage</td><td class="c-qte">1</td><td class="c-sans">« Le seul luxe du chapitre qui change vraiment la vie » (chapitre 101) — à condition de vérifier l’ampérage au tableau <strong>avant</strong>, pas après. Sans lui : deux jeux de seaux qui alternent</td><td class="c-ch"><span class="gr">101</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Faux</strong> avec sa pierre à faux, fourche à foin, thermomètre à tige longue pour le fenil</td><td class="c-qte">1 de chaque</td><td class="c-sans">Le foin des bêtes d’hiver (<span class="ref">ch. 101</span>). La faucille coupe environ cinq fois moins vite, une machette deux fois moins vite, et le foin d’arbre ne demande aucune lame (<span class="ref">ch. 99</span> <span class="ref">§9</span>). La fourche se taille dans une branche fourchue de bouleau. La tige de fer enfoncée au cœur du tas dit déjà s’il faut sortir le foin qui chauffe ; le thermomètre dit de combien</td><td class="c-ch"><span class="gr">99</span><span class="gr">98</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Agrotextile</strong>, et <strong>plastique transparent</strong> fait pour le soleil, pour le tunnel et le paillis</td><td class="c-qte">La surface à protéger</td><td class="c-sans">Quelques degrés aux deux bouts de la saison : l’agrotextile, de 1 à 4 °C selon son poids ; le tunnel fermé, de 1 à 5 °C ; le paillis transparent, 4 à 8 °C dans le sol. Ils ne font pas un deuxième été. Draps secs, sapinage, paillassons, rideau de douche ou bâche claire les remplacent (<span class="ref">ch. 97</span> <span class="ref">§9</span>) — mais un plastique qui n’a pas été fait pour le soleil vieillit vite et se déchire au premier gros vent. <strong>Jamais de plastique transparent sur les pommes de terre</strong> : la lumière y fait la toxine, et la cuisson ne la détruit pas</td><td class="c-ch"><span class="gr">97</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Semence de <strong>maïs très hâtif</strong> (maïs de Gaspé ou équivalent)</td><td class="c-qte">Quelques centaines de grains</td><td class="c-sans">Un maïs sucré ordinaire demande une saison plus longue que la nôtre : sans variété très hâtive, pas de maïs, et la butte des Trois Sœurs reste un pari de belle année, sous plastique ou contre le mur sud (<span class="ref">ch. 99</span>)</td><td class="c-ch"><span class="gr">99</span><span class="gr">100</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Poste à souder à l’arc, chalumeau oxygaz complet avec <strong>pare-retours de flamme</strong>, chariot d’arrimage des bouteilles</td><td class="c-qte">1 poste</td><td class="c-sans">Ça se remplace : deux batteries de 12 V montées en série soudent (dernière section), et l’éclisse boulonnée répare sans souder du tout (<span class="ref">ch. 107</span>). Ce qui ne se remplace pas, c’est le masque à verre filtrant — avec des lunettes dessous, gants à crispin, tablier de cuir et un écran opaque autour du poste. « Quelques secondes d’exposition à un rayonnement UV intense suffisent » et les symptômes arrivent « plusieurs heures après » : le coup d’arc se ramasse au souper, pas à l’atelier, et <strong>il se ramasse aussi par celui qui passait dans la pièce</strong>. Un enfant qui a les yeux qui piquent la nuit ne fera pas le lien avec l’après-midi. Le pare-retours empêche la flamme de remonter dans le boyau jusqu’à la bouteille ; oxygène et gaz inflammable se rangent séparés d’au moins <strong>6,1 m</strong></td><td class="c-ch"><span class="gr">107</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Foyer de forge, soufflerie <strong>à débit réglable</strong>, enclume ou masse d’appui</td><td class="c-qte">1 ensemble</td><td class="c-sans">Transforme un ressort de camion en outil. C’est le seul poste du livre qui produit de l’outillage neuf, et le seul dont personne n’a besoin cet hiver</td><td class="c-ch"><span class="gr">111</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Machine à coudre mécanique à manivelle ou à pédalier</td><td class="c-qte">0 ou 1</td><td class="c-sans">Tout le chapitre 104 se fait à l’aiguille. La machine fait le droit fil vite, elle ne fait pas le mocassin</td><td class="c-ch"><span class="gr">104</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Réfractomètre 44 à 77 °Brix avec correcteur de température</td><td class="c-qte">1</td><td class="c-sans">Il sépare un sirop qui se garde d’un sirop qui moisit — mais on peut ne pas faire de sirop</td><td class="c-ch"><span class="gr">94</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Appelants pour la sauvagine</td><td class="c-qte">Une ou deux douzaines</td><td class="c-sans">Ils amènent les oiseaux plus près que l’approche et le passage : c’est la méthode qui coûte le moins de cartouches. Ils se remplacent : les premiers oiseaux pris, la tête calée droite sur un bâton fourchu planté dans la vase, font la meilleure silhouette qui soit, parce que c’est la vraie ; une motte de vase ou de neige coiffée d’un chiffon sombre en fait une autre</td><td class="c-ch"><span class="gr">47</span><span class="gr">54</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Touret ou meuleuse d’angle, pied à coulisse</td><td class="c-qte">1 de chaque</td><td class="c-sans">Le touret est réservé à la réparation d’un profil, pas à l’affûtage courant. La pierre et la lime font tout le reste</td><td class="c-ch"><span class="gr">105</span><span class="gr">109</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Rince-bouche à la <strong>chlorhexidine 0,12 %</strong></td><td class="c-qte">De quoi rincer 2 fois par jour pendant 2 semaines</td><td class="c-sans">Il sert les deux semaines où une dent replantée reprend. L’eau tiède bouillie ou traitée le remplace</td><td class="c-ch"><span class="gr">27</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Cire d’abeille, pour l’attelle d’une dent replantée</td><td class="c-qte">1 bloc</td><td class="c-sans">Au chalet, c’est elle qui tient une dent d’adulte replantée au moins 3 semaines, en la laissant bouger un peu, ce qui aide le ligament à se refaire. Le bloc du nécessaire à cuir du palier 3 fait l’affaire : cette ligne ne s’achète que s’il n’est pas là. Sans cire, un linge propre plié, mordu, et la nourriture liquide, et la dent a moins de chances de reprendre</td><td class="c-ch"><span class="gr">27</span><span class="gr">104</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Réserve de plaisir comptée pour la durée : café, thé, sucre, chocolat — et deux repas d’occasion cachés en septembre</td><td class="c-qte">Pour la durée d’isolement retenue</td><td class="c-sans">Le chapitre 36 la classe « négociable, et c’est une erreur ». Elle est au palier 4 par honnêteté de budget, pas par mépris : six mois d’hiver se traversent aussi avec ça</td><td class="c-ch"><span class="gr">36</span></td></tr></tbody></table>
<h2 class="sec s9" data-sec="r"><span class="t">Ce qui remplace ce qu’on n’a pas acheté</span></h2>
<p class="p0">Une liste d’achat suppose un magasin ouvert. Le jour où ce livre sert, il n’y en a pas, et les quatre paliers ci-dessus deviennent une liste de regrets. Ce qui suit est la sortie : pour chaque manque, le geste qui le couvre, avec ce qu’il coûte en rendement, en durée de garde ou en marge d’erreur. Les seize lignes qui ne se remplacent par rien sont ramassées à la fin, en un tableau.</p>
<h3 class="sub ss"><span class="ssn palr">A</span>L’eau</h3>
<p class="p0 ri"><strong class="runin">L’ébullition remplace tout le reste du chapitre 10.</strong> Filtre, javel, bandelettes, pastilles : une marmite à couvercle sur le poêle fait le travail des quatre. <strong>Une minute à gros bouillons</strong> — cinq sur un bassin à castors, à cause des kystes (<span class="ref">ch. 10</span>). Le couvercle n’est pas un détail : il divise le bois par deux, et le bois est la vraie dépense.<br><em class="perd">Ce qu’on perd :</em> rien sur le plan microbien, et tout sur le plan chimique. L’ébullition ne retire ni l’arsenic, ni le manganèse, ni les hydrocarbures — elle les <strong>concentre</strong>, puisqu’elle fait partir l’eau et pas eux. Une eau suspecte chimiquement ne se bout pas : elle se change de source.</p>
<p class="p0 ri"><strong class="runin">La javel sans compte-gouttes.</strong> Les seringues orales graduées en millilitres de la pharmacie (palier 2) sont l’instrument, et elles sont déjà dans la maison. Mieux : au lieu de doser un litre à la fois, doser le bidon complet — <strong>4 mL de javel 5,25 % pour un bidon de 20 L</strong>, brassé, 30 minutes d’attente. Une seule mesure lisible vaut mieux que vingt gouttes comptées à la lampe frontale.</p>
<p class="p0 ri"><strong class="runin">La javel qui ne sent plus rien est morte.</strong> Il n’y a pas de substitution : une bouteille éventée ne se rattrape pas en doublant la dose, parce que le titre est inconnu. On revient à l’ébullition.</p>
<p class="p0 ri"><strong class="runin">Le filtre improvisé</strong> — gravier, sable lavé, charbon du poêle dans un baril percé — clarifie et enlève une partie du mauvais goût (<span class="ref">ch. 10</span>). Il sert avant l’ébullition, jamais à sa place : le charbon de bois n’est pas du charbon actif, et un filtre à sable ne fait rien contre un virus.<br><em class="perd">Ce qu’on gagne quand même :</em> une eau tourbeuse filtrée demande beaucoup moins de javel, parce que la matière organique consomme le chlore avant les microbes.</p>
<p class="p0 ri"><strong class="runin">Les bidons opaques.</strong> Un bidon transparent se peint, ou se range dans un sac de jute, sous une bâche, dans une boîte. C’est la lumière qui fait verdir, pas le contenant : n’importe quelle ombre fait l’affaire.</p>
<p class="p0 ri"><strong class="runin">L’analyse de laboratoire ne se remplace par rien</strong>, et c’est la seule ligne de ce chapitre où l’absence se gère par une règle plutôt que par un geste : un puits jamais analysé se traite comme contaminé, pour toujours. Toute eau qui en sort est bouillie, y compris celle qui sert à se brosser les dents.</p>
<h3 class="sub ss"><span class="ssn palr">B</span>Le feu, la chaleur, la lumière</h3>
<p class="p0 ri"><strong class="runin">La lampe à graisse remplace la lampe à l’huile, la chandelle et la pile.</strong> Un contenant peu profond et incombustible — boîte de conserve à bords rabattus, écuelle de tôle, pierre creusée — rempli de graisse animale figée. Une mèche de coton torsadé posée dedans, une extrémité qui sort de quelques millimètres, appuyée sur le bord. On chauffe le fond du contenant à la main ou près du poêle pour amorcer : la flamme fait fondre le gras autour d’elle, le gras monte par capillarité, et la flamme se règle en sortant ou en rentrant la mèche (<span class="ref">ch. 85</span>). Le suif d’orignal (<em>Alces americanus</em>) et la graisse d’ours noir font une flamme courte et régulière.<br><em class="perd">Ce qu’on perd :</em> de la suie sur les murs, le linge et les poumons, une flamme nue dans un bâtiment de bois, et le rendement — une lampe à graisse éclaire assez pour circuler et manger, pas pour lire une étiquette de médicament. <strong>Une mèche trop grosse pompe plus que la flamme ne brûle : ça file noir, ça coule, et la suie visible signale le CO invisible.</strong></p>
<p class="p0 ri"><strong class="runin">La mèche.</strong> Coton tressé, <strong>jamais d’âme métallique</strong>. Un lacet de coton dont on a retiré l’embout, une bande découpée dans un vieux drap et roulée serré, trois brins de ficelle de coton tressés. La ficelle synthétique fond et fait une boule qui bouche.</p>
<p class="p0 ri"><strong class="runin">Le verre de cheminée ne se remplace pas.</strong> Une lampe sans son verre fume, ne se règle plus et n’éclaire plus le tiers. C’est pour ça qu’il est au palier 3 avec deux exemplaires par lampe.</p>
<p class="p0 ri"><strong class="runin">L’allumage.</strong> La tige de ferrocérium se gratte avec le dos d’une lame, un bout de lame de scie à métaux ou un éclat de verre — l’important est l’angle vif, pas l’outil. Le combustible d’amorce, c’est du coton carbonisé : des retailles de coton dans une boîte de conserve fermée, posée sur les braises jusqu’à ce que la fumée cesse de sortir, puis refroidie fermée. Une étincelle suffit dessus (<span class="ref">ch. 13</span>).</p>
<p class="p0 ri"><strong class="runin">Le bois sec sans humidimètre.</strong> Quatre tests qui ne coûtent rien. Le poids : deux billes de même essence et de même grosseur, l’une de l’an passé, l’autre de cette année — la différence de poids en main est la différence d’eau. Le son : deux billes sèches frappées l’une contre l’autre claquent, deux billes vertes font un bruit mat. Les bouts : un bois sec fend en étoile depuis le cœur et son écorce se détache. Et le test de la bulle : mouiller de savon liquide un bout de la bille et souffler de toutes ses forces par l’autre bout — un bois sec laisse passer l’air et fait des bulles, un bois vert non.<br><em class="perd">Ce qu’on perd :</em> le chiffre. Ces tests disent « sec » ou « pas sec », ils ne disent pas 20 %. Pour la salaison et le caveau, où le chiffre compte, ils ne suffisent pas.</p>
<h3 class="sub ss"><span class="ssn palr">C</span>La viande, le sel et le froid</h3>
<p class="p0 ri"><strong class="runin">La balance se fabrique, et c’est l’outil le plus rentable de cette section</strong>, parce que tous les pourcentages de sel du livre dépendent d’elle. Un fléau : une latte de bois franc droite, percée en son milieu et suspendue à un fil, deux plateaux identiques accrochés à égale distance des bouts. L’équilibre à vide se règle en rabotant le bras le plus lourd. Reste l’étalon : <strong>un litre d’eau pèse un kilogramme.</strong> Une bouteille remplie ras bord et bouchée est une masse de 1 kg connue, et une seringue de pharmacie en tire des masses de 100 g et de 10 g aussi exactes que l’eau versée. On coule ces masses dans du plomb de pêche ou on les taille dans de l’acier, on les marque au poinçon, et le chalet a un jeu de poids pour la vie. <strong>Les masses de plomb restent sur le plateau des poids et ne touchent jamais l’aliment</strong> : le plomb ne se voit pas, ne se goûte pas, et ce sont les enfants de moins de 6 ans qui y sont le plus sensibles.<br><em class="perd">Ce qu’on perd :</em> la vitesse et la petite pesée. Un fléau de fortune ne lit pas le gramme, donc il ne dose pas le sel de salaison nitrité (nitrite de sodium), qui se compte en grammes par kilogramme. Pour ce produit-là, la balance graduée au gramme reste obligatoire — et le salpêtre (nitrate de potassium) ne s’y substitue pas, parce que les deux ne se dosent pas pareil.</p>
<p class="p0 ri"><strong class="runin">Le thermomètre à sonde ne se remplace par rien.</strong> Le jus clair, la couleur, la fermeté au doigt sont des indices, pas une mesure, et le <strong>74 °C à cœur</strong> du gibier n’a aucune signature visible. Ce qui se fait sans thermomètre neuf, c’est de vérifier celui qu’on a : dans l’eau glacée brassée il doit lire 0 °C, dans l’eau qui bout à gros bouillons 100 °C. Un thermomètre décalé se corrige de tête si on connaît son écart.</p>
<p class="p0 ri"><strong class="runin">La potence et le gambrel.</strong> Une perche de bois franc de la grosseur du bras, deux encoches taillées en V à chaque bout pour recevoir les jarrets, une entaille au milieu pour la corde. La bête se lève au palan, ou à la moufle improvisée du chapitre 109, ou à un tour mort autour d’un arbre avec un levier passé dans la corde. La règle qui ne bouge pas : <strong>personne sous la charge</strong>, même une fraction de seconde, parce qu’une corde qui a gelé et dégelé casse sans avertir.<br><em class="perd">Ce qu’on perd :</em> rien sur le refroidissement, qui est le but. Ce qui lâche sous une bête, ce n’est presque jamais la perche : c’est la corde, le nœud ou la branche d’accrochage. Une perche fendue se voit ; une corde usée de l’intérieur, non.</p>
<p class="p0 ri"><strong class="runin">L’étamine (coton à fromage)</strong> se remplace par un vieux drap de coton, une taie d’oreiller, une chemise usée — tout ce qui laisse passer la lumière quand on le tient à bout de bras et qui n’accroche pas. Le tissu doit être <strong>sec avant d’être posé</strong> : une toile mouillée colle à la viande et fabrique exactement la surface humide qu’on cherche à éviter.</p>
<p class="p0 ri"><strong class="runin">Les contenants non réactifs.</strong> Le manque se gère par une interdiction, pas par un substitut : ni aluminium, ni galvanisé, ni cuivre, ni fonte nue au contact d’une saumure. Le sel humide arrache le métal, et ce qui part dans la saumure part dans la viande. Ce qui reste et qui traîne partout : le grès vernissé, l’inox, le plastique alimentaire — et un baril de bois franc doublé d’un sac de plastique alimentaire neuf, qui est la solution des vieux et qui marche encore.</p>
<p class="p0 ri"><strong class="runin">Les crochets en S</strong> se font au fil de fer recuit ou à la broche de clôture, pliés à froid autour d’un manche de marteau. Deux tours au lieu d’un seul pli : un crochet à un seul pli s’ouvre sous charge.</p>
<p class="p0 ri"><strong class="runin">Le sel du fleuve</strong> (<span class="ref">ch. 67</span>) est la seule réserve inépuisable de la Côte-Nord, et c’est un chantier : puiser au large d’un courant et non d’un quai ni d’un émissaire, décanter, évaporer au feu, et <strong>arrêter avant la fin</strong>. Les derniers sels à cristalliser sont le magnésium et le calcium : pousser jusqu’à sec donne un sel amer et collant qui reprend l’eau. Le livre ne chiffre pas le rendement, parce qu’il n’a aucune valeur de salinité pour l’estuaire.<br><em class="perd">Ce qu’on perd :</em> l’évaporation ne retire ni les métaux, ni les hydrocarbures dissous, et elle les concentre eux aussi.</p>
<h3 class="sub ss"><span class="ssn palr">D</span>Le métal, l’outil et la réparation</h3>
<p class="p0 ri"><strong class="runin">Souder avec des batteries d’auto.</strong> Deux batteries de 12 V montées <strong>en série</strong> — borne positive de l’une sur la négative de l’autre — donnent 24 V continu : c’est moins que la tension d’un arc de travail (25 à 35 V), et un poste lui-même amorce mal sous 60 V. À deux batteries, l’arc s’amorce difficilement et ne tient que très court ; <strong>trois batteries, 36 V, sont dans la plage d’un arc de travail et c’est le montage à préférer</strong>, même si l’amorçage reste plus dur qu’au poste. La masse se pince sur la pièce ; le porte-électrode, c’est une pince-étau à mâchoires isolées par un chiffon sec, ou un vrai porte-électrode s’il en traîne un. Ce qui décide entre la réparation et l’accident :</p>
<p class="step"><span class="sn">1</span><strong>Les batteries se placent loin du travail</strong>, câbles longs, et jamais sous la pièce. Une batterie au plomb dégage de l’hydrogène, qui s’accumule sous le couvercle ; une étincelle sur le dessus fait sauter le bac et projette de l’acide au visage.</p>
<p class="step"><span class="sn">2</span><strong>La dernière connexion se fait à la pièce, pas à la batterie.</strong> C’est celle qui étincelle.</p>
<p class="step"><span class="sn">3</span><strong>Il n’y a aucun réglage d’intensité.</strong> L’arc donne ce que les batteries peuvent donner. Une électrode collée est un court-circuit franc : on la décroche tout de suite, en tordant, sinon les câbles chauffent sur toute leur longueur et l’isolant fond.</p>
<p class="step"><span class="sn">4</span><strong>Le masque reste le masque.</strong> La variante d’urgence ne change rien au rayonnement : c’est le même arc, le même coup d’arc, la même cornée, et les mêmes yeux d’enfant dans la pièce.<br><em class="perd">Ce qu’on perd :</em> le contrôle du cordon, la pénétration régulière, et les batteries — deux soudures sérieuses vident un banc qu’il faudra recharger, et une batterie déchargée à fond par un court-circuit ne revient pas toujours. C’est une réparation d’urgence sur une pièce qui n’est ni sous pression, ni porteuse d’une charge suspendue.</p>
<p class="p0 ri"><strong class="runin">Ne pas souder du tout, souvent, est la meilleure réparation.</strong> L’éclisse boulonnée — une plaque percée posée à cheval sur la cassure, deux boulons de chaque côté, jamais alignés — se démonte, se contrôle à l’œil et se refait avec ce qu’on a (<span class="ref">ch. 107</span>). Le rivet, la ligature de fil recuit et le frettage à chaud tiennent tout ce qui travaille en compression.</p>
<p class="p0 ri"><strong class="runin">Les limes de chaîne ne se remplacent pas par une lime plus petite.</strong> Une lime d’un diamètre inférieur creuse sous le tranchant et laisse un crochet : la chaîne mord, tire, et la scie saute. Une lime trop grosse arrondit le fil et il ne coupe plus. Le diamètre est marqué par le fabricant de la chaîne, et c’est le seul chiffre du chapitre 106 qui ne s’improvise pas.<br><em class="perd">Ce qui se remplace, par contre :</em> le porte-lime. Deux traits de scie dans un bout de bois franc, à l’angle voulu, tiennent la lime aussi bien qu’un guide acheté.</p>
<p class="p0 ri"><strong class="runin">Aiguiser sans pierre.</strong> Un galet de rivière à grain fin, mouillé, fait une pierre à finir honnête. Le pied non émaillé d’une tasse de grès retourné fait une pierre à dresser d’appoint. Un morceau de cuir de ceinture collé sur une planche, chargé de cendre de bois fine ou de poussière d’émeri, remplace le fusil pour redresser un fil déjà formé.<br><em class="perd">Ce qu’on perd :</em> du temps, et la capacité de reprendre un profil abîmé. Une lame ébréchée demande d’enlever du métal, donc une vraie pierre grossière ou une lime.</p>
<p class="p0 ri"><strong class="runin">Les coins de fendage</strong> se taillent dans du bois franc vert — érable, bouleau jaune — séchés ensuite près du poêle, tête cerclée d’un tour de broche pour qu’elle ne s’éclate pas. Ils fendent l’épinette et le sapin sans problème.<br><em class="perd">Ce qu’on perd :</em> ils s’écrasent sur un nœud, et ils ne démarrent pas une bille de bois franc gelé.</p>
<h3 class="sub ss"><span class="ssn palr">E</span>Le corps</h3>
<p class="p0 ri"><strong class="runin">Le garrot improvisé.</strong> Une bande <strong>large</strong> — jamais une corde, jamais un fil, jamais une ceinture, qui ne se serre pas assez et tranche sans arrêter le sang. Un bandage triangulaire, une manche de chemise fendue, une courroie de sac : noué au-dessus de la plaie, un bâton solide passé dans le nœud, tourné jusqu’à l’arrêt complet du saignement, puis le bâton bloqué et l’heure inscrite sur le front du blessé (<span class="ref">ch. 26</span>). Un garrot qui suinte encore n’est pas assez serré.<br><em class="perd">Ce qu’on perd :</em> du tissu et des nerfs. Une bande étroite concentre la pression sur une ligne et écrase ce qui est dessous. Un garrot improvisé sauve la vie et coûte plus cher en tissu et en nerfs que le garrot du commerce — c’est exactement pour ça que celui-ci est au palier 1, et c’est le seul objet de cette section qu’on regrette de ne pas avoir acheté au moment où on l’improvise.</p>
<p class="p0 ri"><strong class="runin">Les gants jetables</strong> se remplacent par des gants de caoutchouc de ménage, lavés à l’eau savonneuse puis rincés à l’eau javellisée entre deux bêtes. Ce qui ne se remplace pas, c’est l’intégrité : un gant percé ne protège de rien, et la tularémie entre par une éraflure qu’on ne sent pas.</p>
<p class="p0 ri"><strong class="runin">Le savon se fabrique</strong> (<span class="ref">ch. 112</span>). Les cendres de bois franc lessivées à l’eau chaude donnent une lessive de potasse ; cuite avec du suif fondu et lavé, elle donne un savon. La force de la lessive se juge à l’ancienne : un œuf ou une petite patate y flotte en montrant un rond de la largeur d’une petite pièce de monnaie — s’il coule sous la surface, elle est trop faible et ne fera jamais de savon ; s’il flotte à moitié hors de la lessive, elle est trop forte et le savon brûlera la peau.<br><em class="perd">Ce qu’on perd, et il faut le savoir avant de commencer :</em> la lessive de cendres est du potassium, pas du sodium. <strong>Elle donne un savon mou, jamais une barre</strong>, et quelqu’un qui attend une barre conclura qu’il a raté sa fournée alors qu’il a simplement changé d’élément. Le savon mou lave le corps, le linge et la vaisselle ; il ne se transporte pas dans une poche. Et la lessive brûle la peau exactement comme la soude achetée : c’est le même produit, en plus incertain.</p>
<p class="p0 ri"><strong class="runin">Les sachets de réhydratation ne s’improvisent pas</strong> au milieu de la nuit avec du jus et du sel. La concentration décide si l’eau entre dans l’enfant ou en sort, et un mélange trop sucré aggrave la diarrhée. C’est un des rares postes du livre où la réponse est : acheter d’avance, point.</p>
<p class="p0 ri"><strong class="runin">Le papier hygiénique.</strong> Du tissu coupé en carrés, un seau à couvercle avec de l’eau, un lavage séparé à l’eau chaude savonneuse, un séchage près du poêle.<br><em class="perd">Ce qu’on perd :</em> de l’eau chaude, du savon et de la corde à linge en dedans — tous les jours, tout l’hiver. C’est le poste qui a l’air le plus facile à remplacer et qui coûte le plus de travail quotidien.</p>
<p class="p0 ri"><strong class="runin">La chaux de la bécosse</strong> se remplace par de la cendre de bois, qui assèche et coupe l’odeur, ou par du bran de scie, de la tourbe sèche ou de la litière d’aiguilles ramassée sous les épinettes à l’automne et gardée au sec. Un baril de 200 L rempli en septembre couvre l’hiver.</p>
<h3 class="sub ss"><span class="ssn palr">F</span>Sur la glace et sur l’eau</h3>
<p class="p0 ri"><strong class="runin">Les pics à glace</strong> se fabriquent en une demi-heure : deux gros clous ou deux tournevis, ou deux chevilles de bois franc ferrées d’un clou taillé en pointe, reliés par un cordon d’environ un mètre passé dans les manches des manteaux et derrière le cou (<span class="ref">ch. 58</span>). Ils se portent <strong>par-dessus le manteau</strong>, avant le premier pas sur la glace. Des pics dans un sac à dos sont des pics inutilisables : les mains ne fonctionnent plus après quelques minutes dans l’eau.</p>
<p class="p0 ri"><strong class="runin">L’écumoire</strong> se remplace par une louche percée ou une boîte de conserve clouée sur un manche. <strong>La perche de sondage</strong>, par un manche de hache ou une perche d’épinette. <strong>La perche de sauvetage</strong> de 4 m, par une jeune épinette ébranchée — à la condition qu’elle soit <strong>déjà au bord du trou</strong> : une perche qu’il faut aller couper n’existe pas.</p>
<p class="p0 ri"><strong class="runin">Le VFI ne se remplace par rien.</strong> Aucun montage de bidons, de bouteilles ou de mousse ne tient un enfant la tête hors de l’eau dans un courant, et un adulte en choc thermique ne nage pas.</p>
<h3 class="sub ss"><span class="ssn palr">G</span>Ce qui ne se remplace vraiment par rien</h3>
<p class="p0">Seize lignes, et il faut les acheter pendant qu’on peut.</p>
<table class="tspan rien"><colgroup><col style="width:24%"><col style="width:8%"><col style="width:68%"></colgroup><thead><tr><th>Ce qui manque</th><th>Palier</th><th>Pourquoi il n’y a pas de substitut</th></tr></thead><tbody><tr><td class="c-item">Avertisseur de CO</td><td class="c-pal"><span class="pb pal1">1</span></td><td>Aucun sens, aucun test, aucun montage ne détecte le monoxyde de carbone</td></tr><tr><td class="c-item">Messagerie satellite</td><td class="c-pal"><span class="pb pal1">1</span></td><td>Au chalet, c’est la seule chose qui fait venir quelqu’un</td></tr><tr><td class="c-item">Thermomètre à sonde</td><td class="c-pal"><span class="pb pal1">1</span></td><td>Le 74 °C à cœur n’a aucune signature visible : ni couleur, ni jus, ni fermeté</td></tr><tr><td class="c-item">Médicaments d’ordonnance</td><td class="c-pal"><span class="pb pal1">1</span></td><td>Ils se demandent des mois d’avance, ou ils n’existent pas</td></tr><tr><td class="c-item">Pantalon de coupe</td><td class="c-pal"><span class="pb pal1">1</span></td><td>Rien qu’on s’enroule autour de la cuisse n’arrête une chaîne</td></tr><tr><td class="c-item">VFI ajusté</td><td class="c-pal"><span class="pb pal1">1</span></td><td>Aucun flotteur improvisé ne tient une tête d’enfant hors de l’eau dans un courant</td></tr><tr><td class="c-item">Réhydratation orale</td><td class="c-pal"><span class="pb pal1">1</span></td><td>La concentration décide si l’eau entre dans l’enfant ou en sort ; elle ne se devine pas</td></tr><tr><td class="c-item">Autoclave</td><td class="c-pal"><span class="pb pal2">2</span></td><td>Sans lui, la moitié peu acide du chapitre 78 — viande, poisson, légumes — n’existe pas</td></tr><tr><td class="c-item">Couvercles plats de pots</td><td class="c-pal"><span class="pb pal2">2</span></td><td>À usage unique : un couvercle réutilisé scelle, et ne tient pas</td></tr><tr><td class="c-item">Vinaigre à acidité déclarée</td><td class="c-pal"><span class="pb pal2">2</span></td><td>Un vinaigre maison de titre inconnu ne descend pas une conserve sous <strong>pH 4,6</strong> de façon prouvée</td></tr><tr><td class="c-item">Analyse d’eau</td><td class="c-pal"><span class="pb pal2">2</span></td><td>Le seul chiffre du livre qui ne se produit pas soi-même</td></tr><tr><td class="c-item">Verre de cheminée de lampe</td><td class="c-pal"><span class="pb pal3">3</span></td><td>Une lampe sans verre fume, ne se règle plus et n’éclaire plus le tiers</td></tr><tr><td class="c-item">Acétaminophène, forme enfant</td><td class="c-pal"><span class="pb pal1">1</span></td><td>Aucune plante ne le remplace sans danger chez un enfant (<span class="ref">ch. 34</span>)</td></tr><tr><td class="c-item">Soufre précipité, contre la gale</td><td class="c-pal"><span class="pb pal3">3</span></td><td>Le linge et la chaleur arrêtent la contagion, pas la gale : seul un scabicide tue l’acarien sur la peau (<span class="ref">ch. 34</span>)</td></tr><tr><td class="c-item">Semence du champ</td><td class="c-pal"><span class="pb pal3">3</span></td><td>Rien ne fabrique en mai la semence qu’on a mangée l’hiver (<span class="ref">ch. 98</span>)</td></tr><tr><td class="c-item">Deuxième variété de camerisier</td><td class="c-pal"><span class="pb pal4">4</span></td><td>Un camerisier seul, ou deux de la même variété, fleurit chaque année sans donner de fruit (<span class="ref">ch. 99</span>)</td></tr></tbody></table>
<p class="p0">Huit des seize sont au palier 1, et ce n’est pas un hasard : <strong>le palier 1 est très exactement la liste de ce que la débrouille ne couvre pas.</strong> Tout le reste de ce chapitre peut attendre, se bricoler, se réparer ou se faire autrement. Ces huit-là, non.</p>
<h2 class="sec" data-sec="u"><span class="t">Si on n’achète qu’une chose ce mois-ci</span></h2>
<p class="une">L’avertisseur de monoxyde de carbone à pile, à affichage numérique en ppm. Un par étage habité, un par chambre où l’on dort porte fermée, un près du poêle.</p>
<p>C’est le seul objet de toute la liste qui travaille pendant que les quatre personnes dorment. Le monoxyde de carbone n’a ni odeur, ni couleur, ni goût : il n’existe aucun autre moyen de savoir qu’il est là. Et il arrive <strong>par les solutions</strong>, pas par les problèmes — le poêle qui remplace le propane, la génératrice rentrée trop près, la chaufferette d’appoint, le fumoir adossé au mur. Chaque fois que ce livre propose une façon de continuer sans le réseau, il ajoute une source de CO qui n’était pas là la veille.</p>
<p>L’affichage numérique en ppm n’est pas un raffinement : un avertisseur qui sonne dit qu’il faut sortir maintenant, un avertisseur qui affiche dit si le chiffre monte, redescend ou stagne quand on ouvre la porte — donc si le problème est réglé ou seulement dilué. Et surtout, un avertisseur ne sonne pas avant <strong>30 jours à 30 ppm</strong>, alors que l’air d’une maison ne devrait pas dépasser <strong>10 ppm sur 24 h</strong>. Un boîtier silencieux ne dit donc pas que l’air est bon ; il dit qu’on ne meurt pas vite. Celui qui affiche 25 ppm toutes les nuits depuis trois semaines explique les maux de tête du matin, la mauvaise humeur des enfants et le sommeil qui ne repose plus — quatre choses qu’on met sur le compte de l’hiver.</p>
<p>Et c’est le seul objet de la liste qui n’a <strong>aucune</strong> solution de rechange. Tout le reste de ce chapitre se fabrique, se répare, s’emprunte à un autre usage ou se remplace par de la technique. Pas celui-là : il n’existe aucun sens humain, aucun test, aucun montage de fortune qui détecte le monoxyde de carbone. C’est la seule chose qu’on ne peut pas se débrouiller pour avoir.</p>

<p class="fn" data-fn="00-1"><span class="fnn">1</span>La trace est une traînée rouge, chaude et douloureuse, qui part de la plaie et remonte le bras ou la jambe vers l’aisselle ou l’aine, où les ganglions enflent et font mal. La fièvre et les frissons peuvent arriver avant elle.</p>
<p class="fn" data-fn="00b-1"><span class="fnn">1</span>La première minute dans l’eau froide : une grande inspiration brusque, qui ne se commande pas, puis une respiration qui s’emballe, de 600 à 1 000 % plus rapide que la normale. Ça dure environ une minute, et même un bon nageur peut y rester.</p>
<p class="fn" data-fn="00b-2"><span class="fnn">2</span>Poêle froid, porte ouverte : poser un billet de banque en travers du joint, fermer et barrer la porte, puis tirer. Le billet doit résister. S’il glisse sans effort à un endroit, le joint ne ferme plus à cet endroit-là ; si la porte a un réglage, le serrer d’abord et refaire le test.</p>

   créent à la volée, trois histoires se suivent (texte courant, encadré
   danger, variante d'urgence), les planches pleine page prennent la page
   qui suit leur mention, les demi-planches et les photos flottent au
   premier endroit où elles tiennent, jamais au milieu d'un paragraphe.
   ===================================================================== */
const C = JSON.parse(document.getElementById('meta').textContent);
const BOOK = document.getElementById('book');
const WARN = [];
const PAGES = [];
let P = null;                 // page courante
let pendingPlates = [];       // planches pleine page qui attendent la fin de la page courante
const DSVG = '<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#fff"/><path d="M15.2 10 H18.8 L18.1 20.5 H15.9 Z" fill="#9B2C1E"/><rect x="15.4" y="22.3" width="3.2" height="3.2" fill="#9B2C1E"/></svg>';
const PT = 96/72;

function mkPage(kind, plate){
  const n = PAGES.length + 1, side = n % 2 ? 'recto' : 'verso';
  const el = document.createElement('section'); el.className = 'page ' + side; el.id = 'p' + C.num + '-' + n;
  if(kind !== 'open') el.innerHTML = '<div class="rh"><div class="grp"><span class="fo">' + C.num + '-' + n + '</span><span class="ch">' + C.num + ' · ' + C.title + '</span></div><span class="to">' + C.tome + '</span></div>';
  const bl = document.createElement('div'); bl.className = 'block'; el.appendChild(bl);
  if(kind === 'open') bl.innerHTML = document.getElementById('open').innerHTML;
  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});


/* =====================================================================
   00b — acheter par priorité. Le texte coule dans le moteur de chapitre
   (chapitre.js, non modifié : pages créées à la volée, tableaux coupés
   entre les rangées avec leur en-tête répété). Ce fichier est collé APRÈS
   le moteur, dans la même fonction : la déclaration de finishPages ci-
   dessous remplace celle du moteur (en JavaScript, la dernière déclaration
   d'une fonction dans une portée gagne), le reste du moteur ne bouge pas.
   Ce qui change par rapport à un chapitre au gabarit :
     - pied de page : l'échelle des quatre paliers, et non des neuf sections ;
     - onglet de tranche à la hauteur du palier, sur chaque page où il est ;
     - « Ce qui remplace… » : la bande sombre de la variante d'urgence sur la
       tranche, sur toute la hauteur des onglets ;
     - sommaire de l'ouverture : la page où commence chaque section ;
     - les paliers 2 à 4, et « Ce qui remplace… », commencent sur une page neuve :
       une page ne porte jamais deux onglets, et l'onglet du palier 2 ne
       tombe jamais sur la fin du palier 1 (pour, ci-dessous) ;
     - une liste à cocher se coupe dès la première rangée (splitTable) : les
       rangées sont hautes, en attendre deux laissait des fonds de page vides ;
       la suite d'une suite garde sa mention « Le tableau continue… ».
   ===================================================================== */
const SAUT = 'h2.palier:not(.pal1), h2[data-sec="r"]';   // le palier 1 suit « Comment lire », qui n'a pas d'onglet
function pour(f, q, p){
  while(q.length){
    if(f.children.length && q[0].matches && q[0].matches(SAUT)) return 'full';   // palier : page neuve
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTable(tb, f){
  const rows = Array.from(tb.tBodies[0].rows);
  const mk = (rs, kind) => { const t = tb.cloneNode(false); const cg = tb.querySelector('colgroup'); if(cg) t.appendChild(cg.cloneNode(true));
    if(kind === 'first'){ t.classList.remove('suite'); const cap = document.createElement('caption'); cap.className = 'tsuite'; cap.textContent = 'Le tableau continue page suivante'; t.appendChild(cap); }
    t.appendChild(tb.tHead.cloneNode(true)); const b = document.createElement('tbody'); rs.forEach(r => b.appendChild(r.cloneNode(true))); t.appendChild(b);
    if(kind === 'rest') t.classList.add('suite'); return t; };
  let best = 0;
  for(let k = 1; k < rows.length; k++){ const t = mk(rows.slice(0, k), 'first'); f.appendChild(t); syncNotes(f); const ok = !OVER(f); f.removeChild(t); syncNotes(f); if(ok) best = k; else break; }
  if(best < 1) return null;
  return [mk(rows.slice(0, best), 'first'), mk(rows.slice(best), 'rest')];
}
function finishPages(){
  const S = C.sections || {};
  const PAL = ['p1', 'p2', 'p3', 'p4'];
  const lab = s => PAL.includes(s) ? 'Palier ' + s.slice(1) + ' · ' + (S[s] || '') : (S[s] || '');
  const tabTop = n => (C.tabtop + (n - 1) * C.tabpas).toFixed(3) + 'in';
  const pk = {'Maison': 'm', 'Chalet': 'c', 'Les deux': '2'}[C.lieu] || '2';
  let cur = null; const start = {};
  PAGES.forEach(p => {
    p.el.classList.add('anc', 'a0b');
    const on = new Set();
    const flow = p.el.querySelectorAll('.block .frame > *');
    const startsNew = flow.length && flow[0].matches('[data-sec]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block [data-sec]').forEach(h => { const s = h.dataset.sec; on.add(s); cur = s; if(!start[s]) start[s] = p.n; });
    // onglets : chaque palier présent sur la page ; l'ouverture les porte tous (clé des onglets)
    const pals = p.kind === 'open' ? PAL : PAL.filter(s => on.has(s));
    pals.forEach(s => p.el.insertAdjacentHTML('beforeend', '<div class="ak-tab pal' + s.slice(1) + '" style="top:' + tabTop(+s.slice(1)) + '"><span>' + s.slice(1) + '</span></div>'));
    if(on.has('r')){
      // la bande sombre de la variante d'urgence : du titre de la section (ou du haut du bloc) au pied du bloc,
      // et elle s'arrête au titre de la section suivante s'il est sur la même page
      const pr = p.el.getBoundingClientRect(), br = p.el.querySelector('.block').getBoundingClientRect();
      const h = p.el.querySelector('.block [data-sec="r"]'), nx = p.el.querySelector('.block [data-sec="u"]');
      const top = h ? h.getBoundingClientRect().top : br.top, bot = nx ? nx.getBoundingClientRect().top - 8 : br.bottom;
      const e = document.createElement('div'); e.className = 'edge ak-r';
      e.style.top = (top - pr.top) + 'px'; e.style.height = (bot - top) + 'px';
      p.el.appendChild(e);
    }
    const last = [...on].pop();
    let lis = '';
    PAL.forEach(s => { lis += '<li class="pal' + s.slice(1) + (on.has(s) ? ' on' : '') + '">' + s.slice(1) + '</li>'; });
    const label = lab(last) || '';
    // « 00b » garde sa minuscule dans le titre courant, qui est en capitales
    p.el.querySelectorAll('.rh .fo, .rh .ch').forEach(e => { e.innerHTML = e.innerHTML.replace(/\b00b\b/g, '00<span class="minus">b</span>'); });
    p.el.insertAdjacentHTML('beforeend', '<div class="ft">' + (p.kind === 'open' ? '<span class="fo-ft">' + C.num + '-' + p.n + '</span>' : '')
      + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div>'
      + '<span class="lieu-ft"><i class="ak ak-' + pk + '"></i>Lieu · ' + C.lieu + '</span></div>');
  });
  document.querySelectorAll('.toc li[data-s]').forEach(li => { const s = li.dataset.s; li.querySelector('.f').textContent = start[s] ? C.num + '-' + start[s] : ''; });
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
