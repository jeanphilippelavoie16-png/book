/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Secours Sans', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', 'Secours Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   CHAPITRES D'ANCRAGE — 00 (le chapitre principal) et 00b (acheter par
   priorité). Posé après interieur.tpl.html et chapitre.css (non modifiés),
   avant couleur.css quand variante.py passe : les jetons du tome (--ta,
   --tsq, --t9, --tf, --tp, --tp2, --tx9…) viennent de là, avec un repli en
   noir et gris pour l'épreuve sans couleur. Tout est limité aux pages .anc
   ou aux classes propres à ces deux chapitres.
   ===================================================================== */

/* ---------- pictogrammes (variante C : --i-maison, --i-chalet, --i-deux) ---------- */
.ak{display:inline-block;flex:none;vertical-align:middle;background:currentColor;
  -webkit-mask:center/contain no-repeat;mask:center/contain no-repeat;
  height:var(--h,12pt);width:calc(var(--h,12pt) * var(--r,1))}
.ak-m{--r:1;-webkit-mask-image:var(--i-maison);mask-image:var(--i-maison)}
.ak-c{--r:1.29;-webkit-mask-image:var(--i-chalet);mask-image:var(--i-chalet)}
.ak-2,.ak-mc{--r:1.42;-webkit-mask-image:var(--i-deux);mask-image:var(--i-deux)}
.lieu-b{display:inline-flex;align-items:center;gap:4pt;font:700 8pt/1 var(--sans);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.lieu-b .ak{--h:12pt}

/* ---------- onglets de tranche : à la hauteur du bloc (00) ou du palier (00b) ---------- */
.ak-tab{position:absolute;z-index:2;width:0.56in;height:0.68in;display:flex;align-items:center;
  background:var(--ta,#000);color:#fff;font:700 15pt/1 var(--sans);letter-spacing:-.01em}
.recto .ak-tab{right:0;justify-content:flex-start;padding-left:6pt}
.verso .ak-tab{left:0;justify-content:flex-end;padding-right:6pt}
.vC .ak-tab{background:repeating-linear-gradient(135deg,var(--tx9) 0 1.1px,transparent 1.1px 5px),var(--ta)}

/* pied : le lieu de la page porte son pictogramme (00 : celui du bloc, pas celui du chapitre) */
.page.anc .ft .lieu-ft::before{content:none;display:none}
.page.anc .lieu-ft{display:flex;align-items:center;gap:4pt;white-space:nowrap}
.page.anc .lieu-ft .ak{--h:10pt}
.page.anc .lad li{width:13pt}

/* ================================================================ 00 */
.recto.a00 .block{padding-right:0.16in}
.verso.a00 .block{padding-left:0.16in}
.a00{--ks:1;--kl:1;--kt:1;--gap:0pt}

/* ---------- ouverture : l'en-tête des chapitres, puis la table en index ---------- */
.a00.ouv .open{margin-bottom:0}
.a00.ouv .open-title{padding-bottom:12pt}
.ouv-sous{flex:none;margin:9pt 0 0;text-indent:0;font:italic 500 calc(14pt*var(--ks))/1.25 var(--serif)}
.ouv-intro{flex:none;columns:2;column-gap:0.22in;column-rule:0.5pt solid var(--k40);margin-top:8pt;
  font-size:calc(9.6pt*var(--ks));line-height:calc(12.6pt*var(--ks))}
.ouv-intro p{text-indent:0;margin:0 0 4pt}
table.ak-index{flex:none;margin:12pt 0 0;font-family:var(--sans);column-span:none}
table.ak-index thead th{padding:4pt 5pt 3pt 0}
.frame table.ak-index td, table.ak-index td{vertical-align:middle;padding:calc(3pt*var(--ks)) 5pt calc(3pt*var(--ks)) 0;border-bottom:0.6pt solid var(--k40)}
table.ak-index tbody tr:last-child td{border-bottom:1.5pt solid var(--ta,#000)}
.ix-n span{display:inline-block;width:20pt;height:20pt;background:var(--tsq,#000);color:#fff;font:700 13pt/20pt var(--sans);text-align:center}
.ix-t{font:700 calc(12.4pt*var(--kl))/1.08 var(--sans)}
.ix-l .lieu-b{font-size:7.4pt;letter-spacing:.05em}
.ix-l .lieu-b .ak{--h:11pt}
.ix-o{font:500 8.4pt/1.2 var(--sans)}
.ix-c{white-space:nowrap}
.ix-c .gr{display:inline-block;min-width:17pt;margin:1pt 3pt 1pt 0;font:700 9.5pt/1 var(--sans);text-align:center;border:1pt solid var(--ta,#000);color:var(--ta,#000);padding:2.5pt 3pt 1.5pt}
.ix-p{font:700 10.5pt/1 var(--sans);text-align:right;white-space:nowrap}
table.ak-index th:last-child{text-align:right}

/* ---------- page de bloc (verso) : le bloc, en gros ---------- */
.bk-head{flex:none;display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:0 12pt;padding-bottom:8pt;border-bottom:5pt solid var(--ta,#000)}
.bk-num{width:1.08in;height:1.08in;background:var(--tsq,#000);color:#fff;font:700 82pt/1.08in var(--sans);text-align:center;letter-spacing:-.03em}
.bk-num.deux{font-size:62pt;letter-spacing:-.05em}
.vC .bk-num{background:repeating-linear-gradient(135deg,var(--tx9) 0 1.1px,transparent 1.1px 5px),var(--tsq)}
.bk-tt h1{margin:0;font:700 calc(35pt*var(--kt))/1.05 var(--sans);text-transform:uppercase;letter-spacing:.005em;hyphens:manual}
.bk-lieu .lieu-b{flex-direction:column;gap:4pt;padding:6pt 8pt 5pt;background:var(--ta,#000);color:#fff;font-size:9pt;letter-spacing:.07em}
.bk-lieu .ak{--h:24pt}
.bk-intro{flex:none;columns:2;column-gap:0.22in;column-rule:0.5pt solid var(--k40);padding-top:8pt;
  font-size:calc(9.7pt*var(--ks));line-height:calc(12.7pt*var(--ks))}
.bk-intro.one{columns:1}
.bk-intro p,.bk-outro p,.sr-intro p{text-indent:0;margin:0 0 4pt}
.bk-intro p.cite{column-span:all;margin:3pt 0 6pt;font:italic 700 calc(13pt*var(--ks))/1.25 var(--serif)}
.bk-outro{flex:none;margin-top:6pt;
  font:italic 400 calc(9.7pt*var(--ks))/calc(12.7pt*var(--ks)) var(--serif)}

/* les gestes : amorce en gros (lisible à un mètre), suite au corps de lecture, renvois en boîte */
ol.gestes{flex:none;list-style:none;margin:6pt 0 0;padding:0}
ol.gestes li{display:grid;grid-template-columns:18pt 1fr auto;gap:0 8pt;border-top:2pt solid var(--ta,#000);
  padding:calc(6pt + var(--gap)) 0 calc(7pt + var(--gap))}
ol.gestes li:last-child{border-bottom:2pt solid var(--ta,#000)}
ol.gestes .g-m{width:11pt;height:11pt;background:var(--tsq,#000);margin-top:calc(4pt*var(--kl))}
ol.gestes .g-t{min-width:0}
ol.gestes .g-lead{font:700 calc(17pt*var(--kl))/1.12 var(--sans);letter-spacing:.003em;hyphens:manual}
ol.gestes .g-exp{margin-top:3pt;font-size:calc(9.9pt*var(--ks));line-height:calc(12.9pt*var(--ks));hyphens:auto}
ol.gestes .g-refs{display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt;min-width:0.52in}
ol.gestes .gr{font:700 10.5pt/1 var(--sans);border:1.2pt solid var(--ta,#000);color:var(--ta,#000);padding:3pt 4pt 2pt;white-space:nowrap}
.bk-sans{flex:none;margin-top:auto;display:flex;align-items:baseline;gap:10pt;background:var(--t9,#000);color:#fff;padding:6pt 9pt;font:500 9.5pt/1.2 var(--sans)}
.bk-sans b{font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.bk-sans .bk-sp{margin-left:auto;font-weight:700}

/* ---------- page « Quand il n'y a rien » (recto, en face du bloc) ---------- */
.sr-head{flex:none;background:var(--t9,#000);color:#fff;padding:7pt 10pt 9pt}
.vC .sr-head{background:repeating-linear-gradient(135deg,var(--tx9) 0 1.1px,transparent 1.1px 5px),var(--t9)}
.sr-k{font:600 8pt/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;margin-bottom:6pt}
.sr-t{display:flex;align-items:center;gap:10pt}
.sr-n{flex:none;width:32pt;height:32pt;background:#fff;color:var(--t9,#000);font:700 23pt/32pt var(--sans);text-align:center}
.sr-t h2{margin:0;font:700 calc(23pt*var(--kt))/1 var(--sans);text-transform:uppercase;letter-spacing:.02em;hyphens:manual}
.sr-intro{flex:none;padding-top:8pt;font-size:calc(10pt*var(--ks));line-height:calc(13pt*var(--ks))}
ol.gestes.sr li{border-top-width:1pt;border-top-color:var(--k)}
ol.gestes.sr li:first-child{border-top:none}
ol.gestes.sr li:last-child{border-bottom:none}
ol.gestes.sr .g-lead{font-size:calc(13.2pt*var(--kl));line-height:1.16}
ol.gestes.sr .g-m{background:var(--t9,#000);width:9pt;height:9pt;margin-top:calc(3.6pt*var(--kl))}
ol.gestes.sr .g-exp{font-size:calc(9.7pt*var(--ks));line-height:calc(12.7pt*var(--ks))}
ol.gestes.sr .gr{font-size:9.5pt;border-width:1pt}

/* notes de bas de page des pages fixes : au pied du bloc */
.a00 .block > .fnz{margin-top:auto;padding-top:6pt}

/* ---------- le seuil ---------- */
.sx-head{flex:none;border-top:5pt solid var(--ta,#000);padding-top:7pt;margin-bottom:8pt}
.sx-head h1{margin:0;font:700 calc(27pt*var(--kt))/1 var(--sans);text-transform:uppercase;letter-spacing:.01em;hyphens:manual}
.sx-body{flex:none;font-size:calc(10.4pt*var(--ks));line-height:calc(13.8pt*var(--ks))}
.sx-body p{text-indent:0;margin:0 0 6pt}
.sx-body strong.runin{font-size:calc(12.5pt*var(--kl))}
.sx-body p.step{padding-left:30pt;margin:0 0 8pt;font-size:calc(10.6pt*var(--ks));line-height:calc(14pt*var(--ks))}
.sx-body p.step .sn{width:22pt;font:700 22pt/1 var(--sans);color:var(--tsq,#000)}
.sx-body p.step > strong:first-of-type{font:700 calc(14pt*var(--kl))/1.15 var(--sans)}
.sx-body table{margin:4pt 0 10pt;font-size:calc(9.6pt*var(--ks));line-height:calc(12.4pt*var(--ks))}
.sx-body table td:first-child{font:700 calc(11pt*var(--kl))/1.2 var(--sans)}

/* ---------- ce qui tue le plus vite ---------- */
.a00.dgr .danger .frame{padding:12pt 14pt 6pt}
.a00.dgr .dhead{font-size:15pt;padding:8pt 10pt}
.a00.dgr .dhead svg{width:22pt;height:19pt}
.a00.dgr .pt{padding-left:30pt;margin:0 0 12pt;font-size:calc(10.8pt*var(--ks));line-height:calc(14.4pt*var(--ks))}
.a00.dgr .pt .pn{font:700 26pt/1 var(--sans)}
.a00.dgr .pt .plead{font:700 calc(16pt*var(--kl))/1.15 var(--sans);margin-bottom:4pt}
.a00.dgr .pt.cont0{padding-left:0;font:600 calc(13.5pt*var(--kl))/1.3 var(--serif);margin-bottom:14pt}

/* ---------- quand il n'y a rien (ouverture) et tableau de substitution ---------- */
.a00 .qr.s9wrap{margin-top:0}
.a00 .qr h2.sec.s9{font-size:19pt;padding:9pt 10pt}
.qr-body{flex:1 1 0;min-height:0;padding-top:9pt}
.qr-intro{font-size:calc(10.4pt*var(--ks));line-height:calc(13.8pt*var(--ks))}
.qr-intro p{text-indent:0;margin:0 0 6pt}
.qr-body h3.sub{margin-top:10pt}
table.subst{font-size:calc(8.8pt*var(--ks));line-height:calc(11.4pt*var(--ks))}
table.subst td:first-child{font:700 calc(9.8pt*var(--ks))/1.2 var(--sans)}
table.subst td:nth-child(2){font-weight:600}

/* ================================================================ 00b */
/* intensité des paliers : 1 le plus foncé, 4 au trait ; R = ce qui remplace (bandeau de la section 9) */
.pal1{--pc:var(--tfi,#000);--pci:#fff;--pt:var(--tfi,#000)}
.pal2{--pc:var(--ta,#444);--pci:#fff;--pt:var(--ta,#444)}
.pal3{--pc:color-mix(in srgb,var(--ta,#444) 40%,#fff);--pci:var(--tfi,#000);--pt:color-mix(in srgb,var(--ta,#444) 40%,#fff)}
.pal4{--pc:var(--tp,#eee);--pci:var(--tfi,#000);--pt:var(--tp2,#ccc)}
.palr{--pc:var(--t9,#000);--pci:#fff;--pt:var(--t9,#000)}

p.lead0{text-indent:0}
h2.palier{column-span:all;display:flex;align-items:stretch;margin:14pt 0 8pt;background:var(--pc);color:var(--pci);break-after:avoid}
h2.palier:first-child{margin-top:0}
.vC h2.palier.pal1,.vC h2.palier.pal2{background:repeating-linear-gradient(135deg,var(--tx9) 0 1.1px,transparent 1.1px 5px),var(--pc)}
h2.palier.pal4{background:#fff;box-shadow:inset 0 0 0 2.5pt var(--ta,#000)}
h2.palier .pn{flex:none;width:0.95in;display:flex;align-items:center;justify-content:center;font:700 60pt/1 var(--sans);padding:4pt 0 2pt}
h2.palier .pt2{display:flex;flex-direction:column;justify-content:center;padding:9pt 12pt 9pt 2pt;font:700 25pt/1 var(--sans);text-transform:uppercase;letter-spacing:.02em}
h2.palier .pt2 small{font:600 9pt/1 var(--sans);letter-spacing:.18em;margin-bottom:6pt}
p.crit{column-span:all;margin:0 0 6pt;font-size:10pt;line-height:13.4pt}
p.crit strong.runin{text-transform:uppercase;font-size:9.6pt;letter-spacing:.06em}

/* sous-sections 1.A, 2.C… : pleine largeur, la cote du palier en pastille */
.frame h3.sub.ss{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 4pt;font-size:10.6pt;border-top:none;padding-top:0}
.ssn{flex:none;background:var(--pc);color:var(--pci);font:700 10.5pt/1 var(--sans);padding:3pt 5pt 2pt;letter-spacing:.02em}
.pal4.ssn{box-shadow:inset 0 0 0 1.2pt var(--ta,#000);background:#fff}

/* tableaux d'achat : Lieu (cases) | Item | Quantité | Sans ça | Ch. */
table.achat{margin:2pt 0 11pt;font-size:8pt;line-height:10.2pt}
table.achat thead th{background:var(--pc);color:var(--pci);border-top:none;border-bottom:none;padding:5pt 5pt 4pt;
  font:700 7.8pt/1.1 var(--sans);letter-spacing:.08em;text-transform:uppercase;vertical-align:middle}
table.achat.pal4 thead th{box-shadow:inset 0 2pt 0 var(--ta,#000)}
.frame table.achat td, table.achat td{padding:4.5pt 5pt 5pt;vertical-align:top;border-bottom:0.6pt solid var(--k40)}
table.achat tbody tr:last-child td{border-bottom:1.5pt solid var(--ta,#000)}
table.achat td.c-item{font:600 9.6pt/11.6pt var(--sans);letter-spacing:.005em}
table.achat td.c-item strong{font-weight:700}
table.achat td.c-qte{font:500 8.4pt/10.4pt var(--sans)}
table.achat td.c-qte strong{font-weight:700}
table.achat td.c-sans{font-size:8pt;line-height:10.3pt}
table.achat td.c-ch, table.achat th.c-ch{text-align:right}
table.achat .gr{display:block;font:700 8.8pt/1.3 var(--sans)}
table.achat td.c-lieu{padding-left:3pt;padding-right:2pt}
table.achat caption.tsuite{font-size:7.5pt}

/* la colonne Lieu : une case à cocher au crayon par endroit */
.lcell{display:flex;flex-direction:column;gap:3.5pt}
.lx{display:flex;align-items:center;gap:3pt;font:700 6.9pt/1 var(--sans);text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.lx .bx{flex:none;width:9.5pt;height:9.5pt;border:1pt solid var(--k);background:#fff}
.lx .ak{--h:9.5pt;color:var(--ta,#000)}
.lx.fl .ar{flex:none;width:9.5pt;text-align:center;font:700 9pt/1 var(--sans);color:var(--ta,#000)}
.lq{display:block;font:italic 500 6.9pt/8.4pt var(--sans);white-space:normal;margin-top:0.5pt}

/* légende des mentions, tableau « ce qui ne se remplace par rien » */
table.legende td{vertical-align:middle}
table.legende .lx{font-size:7.4pt}
table.rien td.c-item{font:700 9.4pt/1.2 var(--sans)}
.pb{display:inline-block;width:16pt;height:16pt;background:var(--pc);color:var(--pci);font:700 10pt/16pt var(--sans);text-align:center}

/* la dernière section : une seule chose */
p.une{column-span:all;text-indent:0;margin:2pt 0 10pt;padding:9pt 12pt 10pt;background:var(--tp,#eee);border-left:6pt solid var(--tfi,#000);
  font:700 16pt/1.22 var(--sans);letter-spacing:.005em}

/* « Ce qu'on perd : » à la ligne, en étiquette */
em.perd{font-family:var(--sans);font-style:normal;font-weight:700;font-size:.92em;text-transform:uppercase;letter-spacing:.05em}

/* sommaire de l'ouverture : deux colonnes, les titres entiers */
.toc.tocb{grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:2pt 12pt}
.toc.tocb li{align-items:center;padding:1.5pt 0}
.toc.tocb .t{white-space:normal;line-height:1.12}
.toc.tocb li[class*="pal"] .n{background:var(--pc);color:var(--pci);border-color:var(--pc)}
.toc.tocb li.pal4 .n{background:#fff;border-color:var(--ta,#000)}
.toc.tocb li.hors .n{border:none;width:11pt}

/* pied du 00b : l'échelle des quatre paliers, chacun à sa couleur */
.page.anc .lad li[class*="pal"].on{background:var(--pt);border-color:var(--pt);color:var(--pci)}
.page.anc .lad li.pal4.on{border-color:var(--ta,#000)}

/* onglets et bande des pages du 00b */
.page.anc.a0b::after{width:0.56in;font-size:13pt}   /* l'onglet du chapitre (variante C) : « 00b » tient dans sa partie visible */
.frame p.span{column-span:all}
.rh .minus{text-transform:none}
.toc .nw{white-space:nowrap}
.ak-tab.pal1,.ak-tab.pal2,.ak-tab.pal3,.ak-tab.pal4{background:var(--pt);color:var(--pci)}
.vC .ak-tab.pal1,.vC .ak-tab.pal2{background:repeating-linear-gradient(135deg,var(--tx9) 0 1.1px,transparent 1.1px 5px),var(--pt)}

body{--i-maison:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23000%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27 stroke-linecap=%27square%27%3E%3Cpath d=%27M2.5 11.5 12 3.5l9.5 8M5 9.5V21h14V9.5M10 21v-5.5h4V21M15.8 6.6V4h2.4v4.6%27/%3E%3C/svg%3E");--i-chalet:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 31 24%27 fill=%27none%27 stroke=%27%23000%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27 stroke-linecap=%27square%27%3E%3Cpath d=%27M1.5 12.5 10 5l8.5 7.5M3.5 11v10h13V11M3.5 14.5h13M3.5 18h13M25 3l-4 7h2.5L20 16h10l-3.5-6H29zM25 16v5%27/%3E%3C/svg%3E");--i-deux:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 34 24%27 fill=%27none%27 stroke=%27%23000%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27 stroke-linecap=%27square%27%3E%3Cpath d=%27M1 12.5 7.5 6.5l6.5 6M2.8 11v10h9.4V11M6.2 21v-4.5h2.6V21M17.5 12.5 25 6l7.5 6.5M19.3 11v10h11.4V11M19.3 14.5h11.4M19.3 18h11.4%27/%3E%3C/svg%3E");--i-minuteur:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23000%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27 stroke-linecap=%27square%27%3E%3Ccircle cx=%2712%27 cy=%2713.5%27 r=%278%27/%3E%3Cpath d=%27M12 13.5V8.5M9.5 2.5h5M12 2.5v3M18.4 6.8l1.4-1.4%27/%3E%3C/svg%3E");--i-thermo:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 24%27 fill=%27none%27 stroke=%27%23000%27 stroke-width=%271.8%27 stroke-linejoin=%27round%27 stroke-linecap=%27square%27%3E%3Cpath d=%27M10 14.6V4.5a2 2 0 0 1 4 0v10.1a4.2 4.2 0 1 1-4 0z%27/%3E%3Ccircle cx=%2712%27 cy=%2718.1%27 r=%271.9%27 fill=%27%23000%27/%3E%3Cpath d=%27M12 16V9M17 6h2M17 9h2M17 12h2%27/%3E%3C/svg%3E");--i-danger:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 24 22%27%3E%3Cpath d=%27M12 1 23.5 21H.5z%27 fill=%27%23000%27/%3E%3Cpath d=%27M10.7 7.5h2.6l-.5 7.5h-1.6z%27 fill=%27%23fff%27/%3E%3Crect x=%2710.8%27 y=%2716.4%27 width=%272.4%27 height=%272.4%27 fill=%27%23fff%27/%3E%3C/svg%3E")}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 (design/choix.md, décisions des 27 et 28 septembre 2026).
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, fonte (#363432, encre pâle #EEEBE6), choisie par JP à la place de la rouille (#7A4424) : un gris de fer
   chaud, loin du rouge danger, qui va donc partout comme le bleu du tome 4 (aplats, filets, carrés, bandeau 9).
   Teintes pâles dérivées comme pour les autres tomes : --tp = l'encre de couverture, --tp2 = l'encre mêlée
   d'environ 9 % de l'aplat (#DDDAD5). */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#363432;--tfi:#EEEBE6;--tfn:#EEEBE6;--ta:#363432;--tsq:#363432;--t9:#363432;--tp:#EEEBE6;--tp2:#DDDAD5;--tx:rgba(238,235,230,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}
.vA p.step .sn{color:var(--tsq)}
.vA p.li::before{background:var(--tsq)}
.vA thead th{border-top-color:var(--ta)}
.vA tbody tr:last-child td{border-bottom-color:var(--ta)}
.vA .lad li{border-color:var(--tsq)}
.vA .lad li.on{background:var(--tsq);color:#fff}
.vA .lad li.on.d{background:var(--red);border-color:var(--red)}
.vA .open-top{border-bottom-color:var(--ta)}
.vA .open-title{border-bottom-color:var(--ta)}
.vA .open-title .num{color:var(--tsq)}
.vA .toc .n{border-color:var(--tsq)}
.vA .toc li.d .n{border-color:var(--red)}
.vA .lieu .opts span{border-color:var(--tsq)}
.vA .lieu .opts span.on{background:var(--tsq);border-color:var(--tsq)}
.vA .encadre{border-color:var(--ta)}
/* onglet : haut de la tranche, dans la marge de tête (les bandes 8 et 9 ne montent jamais
   au-dessus de la zone utile, elles ne se touchent pas) */
.vA .page::after{content:"";position:absolute;top:0;width:0.3in;height:0.66in;background:var(--ta)}
.vA .recto::after{right:0}
.vA .verso::after{left:0}

/* =============================== B — AFFIRMÉE =============================== */
/* ouverture : l'aplat de la couverture du tome, à fond perdu en tête */
.vB .open-top{position:relative;z-index:1;color:var(--tfi);border-bottom-color:var(--tfi)}
.vB .open-title{position:relative;z-index:0;flex-direction:row;justify-content:flex-start;align-items:flex-end;gap:14pt;
  padding:16pt 0 17pt;border-bottom:none;color:var(--tfi)}
.vB .open-title::before{content:"";position:absolute;z-index:-1;top:-3in;bottom:0;background:var(--tf)}
.vB .recto .open-title::before{left:-0.5in;right:-0.625in}
.vB .verso .open-title::before{left:-0.625in;right:-0.5in}
.vB .open-title .num{font-size:150pt;line-height:.72;color:var(--tfn);letter-spacing:-.03em}
.vB .open-title h1{color:var(--tfi);padding-bottom:0}
.vB .open-meta{padding-top:10pt}
.vB .lieu .opts span.on{color:#fff}
/* tableaux : en-tête sur la teinte du tome */
.vB thead th{background:var(--tp2);border-top:2pt solid var(--ta);border-bottom:none;padding-left:4pt;color:var(--k)}
.vB td{padding-left:4pt}
/* encadré ordinaire (bon à savoir) : teinte pâle, filet de tome à gauche */
.vB .encadre{border:none;border-left:3pt solid var(--ta);background:var(--tp);padding:6pt 8pt 4pt 9pt}
/* section 9 : couleur du tome au lieu du noir, bandeau et tranche */
.vB h2.sec.s9{background:var(--t9)}
.vB h2.sec.s9 .n{background:#fff;color:var(--t9)}
.vB .edge:not(.d){background:var(--t9)}
.vB .toc li.h .n{background:var(--t9);border-color:var(--t9)}
/* onglet de tranche : plein, avec le numéro du chapitre ; se voit livre fermé */
.vB .page::after{content:var(--chnum);width:0.5in;height:0.84in;display:flex;align-items:flex-end;
  font:700 15pt/1 var(--sans);color:#fff;padding-bottom:6pt;box-sizing:border-box}
.vB .recto::after{justify-content:flex-start;padding-left:6pt}
.vB .verso::after{justify-content:flex-end;padding-right:6pt}
/* chapitres à trois chiffres (100 à 112 ; variante.py pose .chn3 sur le body) : à 15 pt, « 102 » dépasse le
   rognage ; 12 pt, comme dans les tomes assemblés (28 septembre 2026) */
.vB.chn3 .page::after{font-size:12pt;letter-spacing:-.01em}
.vB.chn3 .recto::after{padding-left:2pt}
.vB.chn3 .verso::after{padding-right:2pt}

/* =============================== C — CARACTÈRE =============================== */
/* trame fine sur les aplats : hachure au trait, comme dans les planches */
.vC .open-title::before{background:repeating-linear-gradient(135deg,var(--tx) 0 1.1px,transparent 1.1px 5px),var(--tf)}
.vC h2.sec.s9{background:repeating-linear-gradient(135deg,var(--tx9) 0 1.1px,transparent 1.1px 5px),var(--t9)}
.vC .page::after{background:repeating-linear-gradient(135deg,var(--tx9) 0 1.1px,transparent 1.1px 5px),var(--ta)}

/* pictogrammes : SVG au trait (variante.py fournit --i-…), teints par la couleur du texte */
.vC .pk{display:inline-block;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
/* ligne de lieu : pictogramme au-dessus du mot */
.vC .lieu .opts span{display:flex;flex-direction:column;align-items:center;gap:2pt;padding:5pt 0 3pt;line-height:1}
.vC .lieu .opts span::before{content:"";height:15pt;width:26pt;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.vC .lieu .opts span:nth-child(1)::before{-webkit-mask-image:var(--i-maison);mask-image:var(--i-maison)}
.vC .lieu .opts span:nth-child(2)::before{-webkit-mask-image:var(--i-chalet);mask-image:var(--i-chalet)}
.vC .lieu .opts span:nth-child(3)::before{-webkit-mask-image:var(--i-deux);mask-image:var(--i-deux)}
/* pied : lieu avec son pictogramme */
.vC .lieu-ft{display:flex;align-items:center;gap:4pt}
.vC .lieu-ft::before{content:"";width:17pt;height:11pt;background:currentColor;-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.vC.lieu-m .lieu-ft::before{-webkit-mask-image:var(--i-maison);mask-image:var(--i-maison)}
.vC.lieu-c .lieu-ft::before{-webkit-mask-image:var(--i-chalet);mask-image:var(--i-chalet)}
.vC.lieu-2 .lieu-ft::before{-webkit-mask-image:var(--i-deux);mask-image:var(--i-deux)}
/* sommaire : le 8 porte le triangle */
.vC .toc li.d .t::after{content:"";display:inline-block;width:8pt;height:7.5pt;margin-left:3pt;vertical-align:-0.5pt;background:var(--red);
  -webkit-mask:var(--i-danger) center/contain no-repeat;mask:var(--i-danger) center/contain no-repeat}
/* étapes clés : sous le numéro, minuteur (durée en gras), thermomètre (température en gras),
   triangle (renvoi au danger) */
.vC p.step.pk-t::after,.vC p.step.pk-c::after,.vC p.step.pk-d::after{content:"";position:absolute;left:2.5pt;top:14.5pt;width:13pt;height:13pt;
  background:var(--tsq);-webkit-mask:center/contain no-repeat;mask:center/contain no-repeat}
.vC p.step.pk-t::after{-webkit-mask-image:var(--i-minuteur);mask-image:var(--i-minuteur)}
.vC p.step.pk-c::after{-webkit-mask-image:var(--i-thermo);mask-image:var(--i-thermo)}
.vC p.step.pk-d::after{-webkit-mask-image:var(--i-danger);mask-image:var(--i-danger);background:var(--red)}
.vC p.step.pk-t,.vC p.step.pk-c,.vC p.step.pk-d{min-height:28pt}

/* chiffres clés en exergue */
.exergue{break-inside:avoid;margin:3pt 0 9pt;background:var(--tp);border-top:2.5pt solid var(--ta);padding:6pt 8pt 6pt;font-family:var(--sans)}
.exergue .ex-h{display:flex;align-items:center;gap:5pt;font:700 8pt/1.1 var(--sans);text-transform:uppercase;letter-spacing:.07em;margin-bottom:4pt}
.exergue .ex-h .pk{width:13pt;height:13pt;color:var(--tsq);-webkit-mask-image:var(--i-minuteur);mask-image:var(--i-minuteur)}
.exergue .ex-r{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:0 8pt;padding:3pt 0;border-top:0.5pt solid var(--k40)}
.exergue .ex-h + .ex-r{border-top:none}
.exergue .ex-n{font:700 34pt/0.9 var(--sans);color:var(--tsq);letter-spacing:-.01em;white-space:nowrap}
.exergue .ex-n small{font:700 11pt/1 var(--sans);letter-spacing:.04em;margin-left:2pt}
.exergue .ex-l{font:500 8.8pt/11pt var(--sans);color:var(--k)}
.exergue .ex-l b{font-weight:700}
.exergue .ex-f{font:italic 600 8pt/10.4pt var(--sans);margin-top:3pt;padding-top:4pt;border-top:0.5pt solid var(--k40)}

000%27/%3E%3Cpath d=%27M10.7 7.5h2.6l-.5 7.5h-1.6z%27 fill=%27%23fff%27/%3E%3Crect x=%2710.8%27 y=%2716.4%27 width=%272.4%27 height=%272.4%27 fill=%27%23fff%27/%3E%3C/svg%3E")}

<body class="vA vB vC t1 lieu-2">
<div id="book"></div>
<template id="open"><header class="open"><div class="open-top"><span>Tome 1 · Tenir</span><span>Chapitre</span></div><div class="open-title"><div class="num">00b</div><h1>Acheter par priorité</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span>Chalet</span><span class="on">Les deux</span></div></div><ol class="toc tocb"><li data-s="l" class="hors"><span class="n"></span><span class="t">Comment lire une ligne</span><span class="f">00b-00</span></li><li data-s="p1" class="pal1"><span class="n">1</span><span class="t">À acheter absolument</span><span class="f">00b-00</span></li><li data-s="p2" class="pal2"><span class="n">2</span><span class="t">Essentiel</span><span class="f">00b-00</span></li><li data-s="p3" class="pal3"><span class="n">3</span><span class="t">Important</span><span class="f">00b-00</span></li><li data-s="p4" class="pal4"><span class="n">4</span><span class="t">S’il reste du temps et de l’argent</span><span class="f">00b-00</span></li><li data-s="r" class="hors"><span class="n"></span><span class="t">Ce qui remplace ce qu’on n’a pas acheté</span><span class="f">00b-00</span></li><li data-s="u" class="hors"><span class="n"></span><span class="t">Si on n’achète qu’une chose ce <span class="nw">mois-ci</span></span><span class="f">00b-00</span></li></ol></div><p class="lieu-note">C’est le seul chapitre du livre qui vise les deux endroits en même temps, parce qu’un chèque se signe une fois et qu’il faut savoir lequel des deux bâtiments reçoit l’objet.</p></header></template>
<template id="story-main">
<p class="lead0">C’est aussi <strong>le seul inventaire du livre</strong>. Les 112 autres chapitres ont un tableau Matériel qui ne liste que ce qu’il faut pour leur procédure : le chapitre 68 donne le sel et la balance, il ne redonne pas l’avertisseur de monoxyde de carbone. Tout ce qui s’achète, se remplace ou se tient en réserve est ici, classé par ce qui arrive si on ne l’a pas.</p>
<h2 class="sec" data-sec="l"><span class="t">Comment lire une ligne</span></h2>
<p class="p0 ri span"><strong class="runin">La colonne Lieu.</strong> Elle applique la règle de bascule du livre : ce qui est court se vit à la maison, ce qui dure finit au chalet.</p>
<table class="tspan legende"><colgroup><col style="width:17%"><col style="width:83%"></colgroup><thead><tr><th>Mention</th><th>Ce que ça veut dire</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td>Vit au village. Le réseau, le rangement et le congélateur sont là, les voisins aussi</td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td>Vit au chalet. Hors réseau, isolé, et c’est lui qui porte le territoire</td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td>Il en faut un <strong>à chaque endroit</strong>. Un objet qui fait la navette est un objet qui manque toujours du mauvais bord</td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td>S’achète et se garde à la maison, où il y a la place, et <strong>monte au chalet le jour où l’événement s’étire</strong>. La ligne le dit parce que ça change l’emballage et le format</td></tr></tbody></table>
<p class="p0">Le « Maison → chalet » est la mention à lire deux fois. La réserve de fond vit à la maison parce que c’est là qu’il y a des tablettes et un congélateur ; mais elle est bâtie pour être déplaçable. Un sac de 20 kg de sel sur une palette de sous-sol ne monte pas au chalet en février. Quatre seaux de 5 kg, oui.</p>
<p class="p0 ri"><strong class="runin">La colonne Sans ça.</strong> Elle donne le mécanisme, pas la peur. C’est elle qui décide du palier.</p>
<p class="p0 ri"><strong class="runin">La dernière section.</strong> C’est la même liste lue à l’envers : ce qui se fabrique, se répare ou se remplace quand la ligne n’a jamais été achetée. C’est elle qu’on ouvre le jour où le chapitre sert, et c’est la plus longue.</p>
<p class="p0 ri"><strong class="runin">Les prix.</strong> Ce chapitre n’en imprime aucun. Un prix d’aujourd’hui est faux dans deux ans, et un prix approximatif imprimé dans un livre devient une ligne de budget que personne ne vérifie.</p>
<p class="p0 ri"><strong class="runin">Les quantités.</strong> Celles qui portent une source sont des quantités. Les autres sont des façons de calculer sa propre quantité, et c’est volontaire : un chiffre plausible non sourcé est une erreur, pas un repère (chapitre 108).</p>
<h2 class="palier pal1" data-sec="p1"><span class="pn">1</span><span class="pt2"><small>Palier 1</small>À acheter absolument</span></h2>
<p class="p0 ri crit kh"><strong class="runin">Le critère :</strong> sans cet objet, un scénario probable tourne mal tout de suite. Si le budget s’arrête à la fin de ce palier, la famille tient quand même. Chaque ligne porte en une phrase la raison pour laquelle elle est ici et pas au palier suivant.</p>
<h3 class="sub ss"><span class="ssn pal1">1.A</span>Ce qui avertit pendant que tout le monde dort</h3>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Avertisseur de <strong>monoxyde de carbone</strong> à pile, <strong>à affichage numérique en ppm</strong></td><td class="c-qte">1 par étage habité, 1 par chambre où l’on dort porte fermée, 1 près du poêle</td><td class="c-sans">Le CO n’a ni odeur, ni couleur, ni goût : c’est la seule chose au monde qui prévient. Et chaque solution de rechange du livre — poêle qui remplace le propane, génératrice, chaufferette, fumoir adossé — ajoute une source de CO qui n’existait pas la veille. L’affichage en ppm sépare « ça sonne » de « ça monte » : un avertisseur ne sonne pas avant <strong>30 jours à 30 ppm</strong> alors que l’air d’une maison ne devrait pas dépasser <strong>10 ppm sur 24 h</strong>, donc un boîtier muet ne prouve pas que l’air est bon</td><td class="c-ch"><span class="gr">87</span><span class="gr">83</span><span class="gr">82</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Piles neuves des avertisseurs, gardées <strong>au chaud</strong>, hors du stock commun</td><td class="c-qte">1 jeu par appareil, par saison</td><td class="c-sans">Un avertisseur nourri par la pile qu’on a prise pour un jouet est un avertisseur décoratif</td><td class="c-ch"><span class="gr">85</span><span class="gr">108</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Avertisseur de <strong>fumée</strong>, remplacé <strong>10 ans après la date de fabrication</strong></td><td class="c-qte">1 par chambre, 1 au corridor, 1 par étage, sous-sol compris</td><td class="c-sans">Au chalet, un départ de feu laisse environ trois minutes et il n’y a pas de service d’incendie au bout du chemin. La date de fabrication est imprimée au dos : un appareil de onze ans est un boîtier vide</td><td class="c-ch"><span class="gr">82</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.B</span>L’eau</h3>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Eau embouteillée scellée, hors gel</td><td class="c-qte"><strong>4 L par personne par jour</strong>, <strong>3 jours</strong> minimum : 48 L pour quatre (calcul)</td><td class="c-sans">Le 6 L par personne de l’aimant de frigo ne couvre que la boisson. C’est la moitié du besoin, et c’est l’erreur la plus répandue de toutes les trousses</td><td class="c-ch"><span class="gr">6</span><span class="gr">10</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bidons alimentaires <strong>opaques</strong>, 20 L</td><td class="c-qte">6, soit 120 L</td><td class="c-sans">Sept jours de tampon pendant que la pompe est morte et que le lac est sous un mètre de glace. Opaques parce que la lumière fait verdir l’eau entreposée</td><td class="c-ch"><span class="gr">5</span><span class="gr">10</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Eau de Javel non parfumée <strong>5,25 %</strong>, sans additif ni agent épaississant, <strong>datée au marqueur</strong></td><td class="c-qte">4 L, renouvelée à l’année</td><td class="c-sans">C’est le seul moyen de désinfection qui tient sans feu et sans électricité. La javel parfumée ou épaissie ne se dose pas, et une bouteille de trois ans a perdu son titre sans changer d’apparence</td><td class="c-ch"><span class="gr">10</span><span class="gr">31</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Compte-gouttes propre ou seringue de 1 mL</td><td class="c-qte">2</td><td class="c-sans">La dose est de <strong>2 gouttes (0,2 mL) de javel 5,25 % par litre, 30 minutes d’attente</strong>. Sans instrument, ce n’est plus une dose, c’est une intention</td><td class="c-ch"><span class="gr">10</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Marmite à couvercle, 8 à 12 L, qui va sur le dessus du poêle</td><td class="c-qte">1</td><td class="c-sans">L’ébullition <strong>1 minute à gros bouillons</strong> est la méthode de référence du livre, la seule qui ne dépend d’aucun consommable. Le couvercle divise le bois par deux</td><td class="c-ch"><span class="gr">10</span><span class="gr">87</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.C</span>Le froid, qui est la plus courte des horloges</h3>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Sac de couchage coté pour l’hiver, à capuchon</td><td class="c-qte">1 par personne</td><td class="c-sans">La panne de chauffage est la panne la plus probable et celle qui tue le plus vite. La cote de l’étiquette suppose un matelas isolant épais, des sous-vêtements longs secs et des bas : sans eux, elle ne vaut rien. La cote <strong>confort</strong> est celle d’une femme couchée détendue, la <strong>limite</strong> celle d’un homme recroquevillé qui a juste pas froid, l’<strong>extrême</strong> un seuil de survie, pas de sommeil. Acheter coté plus froid que le froid visé</td><td class="c-ch"><span class="gr">25</span><span class="gr">6</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Matelas de sol isolant</td><td class="c-qte">1 par personne</td><td class="c-sans">Le sol vole plus de chaleur que l’air. Un bon sac posé à même le plancher rend la moitié de ce qu’il annonce</td><td class="c-ch"><span class="gr">25</span><span class="gr">6</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bottes cotées pour le froid, mitaines, tuques, cache-cou, bas de <strong>laine</strong></td><td class="c-qte">2 jeux complets par personne ; pour les bas, compter <strong>deux paires sèches par jour</strong> de travail dehors, par personne (<span class="ref">ch. 24</span>, <span class="ref">ch. 25</span>)</td><td class="c-sans">Le coton mouillé refroidit ; la laine mouillée réchauffe encore. Sous un refroidissement éolien de −28 à −39, la peau exposée gèle en <strong>10 à 30 minutes</strong>. Un bas mouillé fait l’ampoule et le pied d’immersion</td><td class="c-ch"><span class="gr">25</span><span class="gr">104</span><span class="gr">24</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bâche ou toile de plastique, environ 2 × 3 m, comme pare-vapeur</td><td class="c-qte">2</td><td class="c-sans">C’est la couche qui va <strong>sous</strong> la personne en hypothermie, et c’est aussi ce qui ferme une pièce pour ne chauffer qu’elle</td><td class="c-ch"><span class="gr">25</span><span class="gr">3</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Bois sec fendu, <strong>≤ 20 % d’humidité</strong>, bûches de <strong>moins de 15 cm</strong></td><td class="c-qte">Consommation mesurée de l’hiver précédent, <strong>plus une marge</strong> : un hiver plus froid que le dernier en brûle davantage, et le bois qui n’a pas fini de sécher ne compte pas. Une corde = 3,6 m³ empilés</td><td class="c-sans">Deux cordes à 20 % battent trois cordes à 35 % : l’humidité a plus d’effet sur l’énergie du bois que l’essence. Du bois vert, c’est de la créosote et une cheminée qui prend</td><td class="c-ch"><span class="gr">83</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span><span class="lq">(partout où il y a un poêle)</span></div></td><td class="c-item">Contenant métallique à cendres, <strong>fond surélevé, couvercle métallique</strong>, et pelle métallique</td><td class="c-qte">1 jeu</td><td class="c-sans">Des cendres « éteintes » dans une chaudière de plastique sur une galerie de bois est un départ de feu classique. Il faut attendre <strong>au moins 7 jours</strong> avant de les transvider, en les brassant pour vérifier</td><td class="c-ch"><span class="gr">83</span><span class="gr">82</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.D</span>Manger</h3>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Thermomètre à sonde à lecture instantanée</strong>, 0 à 100 °C</td><td class="c-qte">2 : un de service, un qui attend que le premier tombe dans la neige</td><td class="c-sans">C’est l’objet le moins cher du livre et le seul qui prouve le <strong>74 °C à cœur</strong> du gibier, le <strong>82 °C</strong> de la volaille entière et le <strong>70 °C</strong> du poisson. Deux, parce qu’un thermomètre seul ne se vérifie pas : il s’étalonne dans l’eau glacée et l’eau bouillante</td><td class="c-ch"><span class="gr">46</span><span class="gr">66</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lq">(et chalet si froid mécanique)</span></div></td><td class="c-item">Thermomètre de réfrigérateur et thermomètre de congélateur, à demeure dans l’appareil</td><td class="c-qte">1 par appareil</td><td class="c-sans">Sans eux, le <strong>4 °C</strong> et le <strong>-18 °C</strong> sont une croyance. Un congélateur réglé « au maximum » n’est pas une mesure</td><td class="c-ch"><span class="gr">66</span><span class="gr">74</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Balance de cuisine <strong>0 à 5 kg, graduée au gramme</strong></td><td class="c-qte">1, plus 1 au stock</td><td class="c-sans">Tous les pourcentages de sel du livre se calculent <strong>sur le poids de la viande</strong>. Sans balance, il n’y a pas de pourcentage, il y a une impression — et une salaison ratée, c’est un quartier d’orignal perdu</td><td class="c-ch"><span class="gr">67</span><span class="gr">68</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span><span class="lq">en seaux de 5 kg</span></div></td><td class="c-item"><strong>Sel sans additif</strong>, un seul ingrédient à l’étiquette (sel à marinade, gros sel de salaison)</td><td class="c-qte">Le poids de viande et de poisson à traiter × le pourcentage de la méthode, doublé pour le sel de surface qui coule ; plus <strong>250 g par litre</strong> de la saumure qui trie l’ergot du grain de semence (<span class="ref">ch. 98</span>)</td><td class="c-sans">C’est le premier consommable qui manque. Quand le congélateur lâche en novembre avec 200 kg dedans, le sel est la route de sauvetage qui ne demande ni courant, ni pot, ni appareil (<span class="ref">ch. 74</span>). Il se tire du fleuve, mais c’est un chantier de bois et de feu, pas un dépannage, et le livre ne chiffre pas le rendement parce qu’il n’a aucune valeur de salinité pour l’estuaire (<span class="ref">ch. 67</span>, et dernière section)</td><td class="c-ch"><span class="gr">67</span><span class="gr">74</span><span class="gr">98</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx fl"><span class="ar">→</span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Gras acheté : saindoux, shortening, huile végétale</td><td class="c-qte"><strong>1 kg + 1 L par personne-mois</strong> avec la réserve sèche ; pour vivre de gibier, le compte du <span class="ref">ch. 19</span> : <strong>environ 370 g par jour pour quatre, 55 kg pour 150 jours</strong></td><td class="c-sans">Le gras n’est pas un luxe du stock, c’est une assurance-vie. Une famille rabattue sur le lièvre et l’orignal maigre fait le mal de caribou, et la viande maigre seule est mortelle</td><td class="c-ch"><span class="gr">5</span><span class="gr">19</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Réserve sèche : riz étuvé, farine, avoine, légumineuses, pâtes, sucre, lait en poudre</td><td class="c-qte">Par personne-mois : 4 kg, 4 kg, 2 kg, 3 kg, 2 kg, 1 kg, 1 kg — trois mois visés. Avec le gras de la ligne précédente, c’est environ 2 650 kcal par personne et par jour</td><td class="c-sans">C’est la réserve de fond, et elle vit à la maison parce que c’est là qu’il y a des tablettes. Le riz brun, la farine de blé entier et les noix contiennent du gras : ils rancissent et n’entrent pas en réserve de fond</td><td class="c-ch"><span class="gr">5</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span></div></td><td class="c-item">Contenants hermétiques <strong>opaques</strong> pour les denrées sèches</td><td class="c-qte">1 par denrée de base</td><td class="c-sans">Une souris traverse le carton, le bois mince et le sac de plastique. Trois mois de farine se perdent en une semaine</td><td class="c-ch"><span class="gr">5</span><span class="gr">100</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Ouvre-boîte manuel</strong></td><td class="c-qte">2</td><td class="c-sans">Deux, parce que c’est l’article le plus bête à casser et celui qui ferme l’accès à tout le reste des conserves</td><td class="c-ch"><span class="gr">6</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Aliments que les enfants mangent <strong>déjà</strong></td><td class="c-qte">2 semaines minimum</td><td class="c-sans">Une panne n’est pas le moment de découvrir les lentilles. Un enfant de 4 ans qui refuse de manger pendant 48 h, c’est un deuxième problème par-dessus le premier</td><td class="c-ch"><span class="gr">39</span><span class="gr">40</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.E</span>Le corps</h3>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Trousse de premiers soins, <strong>garrot artériel compris</strong> : pansements compressifs, bandes larges, compresses, ruban, ciseaux, pince à écharde, couverture de survie</td><td class="c-qte">1 par lieu, 1 dans le véhicule, 1 sur la ligne de piégeage</td><td class="c-sans">Le garrot est le seul objet de la trousse qui agit sur une mort en trois minutes, et la trousse vendue toute faite n’en contient pas : il s’achète à part. Une trousse sans garrot est une trousse pour les ampoules</td><td class="c-ch"><span class="gr">26</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span><span class="lq">la réserve voyage avec la personne</span></div></td><td class="c-item">Réserve de <strong>médicaments d’ordonnance</strong> de chaque personne</td><td class="c-qte"><strong>2 à 3 semaines</strong> d’avance</td><td class="c-sans">C’est le seul poste de la trousse qui se compte en semaines et non en 72 heures, et le seul qui ne s’improvise pas : il se prépare des mois d’avance</td><td class="c-ch"><span class="gr">32</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Acétaminophène</strong> et <strong>ibuprofène</strong>, en forme enfant (liquide, suppositoires) et en forme adulte</td><td class="c-qte">Les deux molécules, chacune dans les deux formes, datées et sorties aux deux rotations de l’année. La dose se lit sur l’étiquette, nulle part ailleurs (<span class="ref">ch. 32</span>)</td><td class="c-sans">Rien dans la forêt ne se donne à un enfant à la place : l’écorce de saule est un salicylé, de la famille de l’aspirine, et donnée pendant une grippe ou une varicelle, elle peut faire enfler son cerveau et lâcher son foie (<span class="ref">ch. 34</span>). Sans comprimé, la fièvre ne devient pas plus dangereuse, mais la douleur forte ne se calme pas : l’otite de nuit, la fracture, l’abcès. Deux molécules et non une : une rupture, une péremption ou un flacon gelé viderait sinon toute la catégorie d’un coup</td><td class="c-ch"><span class="gr">28</span><span class="gr">32</span><span class="gr">34</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Auto-injecteur d’épinéphrine, <strong>si une allergie grave est connue dans la maisonnée</strong></td><td class="c-qte">Selon l’ordonnance</td><td class="c-sans">Rien d’autre ne tient une anaphylaxie le temps d’un trajet de deux heures</td><td class="c-ch"><span class="gr">26</span><span class="gr">32</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span><span class="lq">la réserve voyage avec la personne</span></div></td><td class="c-item">Réserve d’alcool d’un adulte qui en dépend, <strong>si c’est le cas dans la maisonnée</strong></td><td class="c-qte">Jusqu’à la fin d’une descente, pas jusqu’à la dernière bouteille : à 10 verres par jour, <strong>250 verres sur 43 jours</strong>, et c’est un plancher (<span class="ref">ch. 38</span>, étape 57)</td><td class="c-sans">Chez un buveur dépendant, le sevrage commence quelques heures après le dernier verre et peut aller jusqu’à la mort. Il arrive le jour où la réserve finit : c’est donc la réserve qui décide si l’arrêt se fait en descente, versée par l’autre adulte, ou d’un coup</td><td class="c-ch"><span class="gr">38</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Sachets de <strong>solution de réhydratation orale</strong>, datés</td><td class="c-qte">Réserve permanente pour quatre</td><td class="c-sans">Une gastro à quatre dans un bâtiment sans eau courante déshydrate un enfant de 4 ans en une journée. Le jus dilué et le sel ne s’improvisent pas au milieu de la nuit</td><td class="c-ch"><span class="gr">30</span><span class="gr">39</span><span class="gr">31</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Thermomètre clinique numérique + piles de rechange</td><td class="c-qte">2</td><td class="c-sans">Deux, parce que le premier brise. La fièvre est le seul chiffre qui sépare « il couve quelque chose » de « on part maintenant »</td><td class="c-ch"><span class="gr">30</span><span class="gr">26</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Savon</strong> ordinaire, en quantité, jamais rationné</td><td class="c-qte">1 pain ou 1 bouteille par point d’eau, réserve de 12 mois</td><td class="c-sans">Le savon est la mesure nommée contre la tularémie, l’échinococcose et la gastro, et il travaille mécaniquement : il décolle, il ne tue pas — c’est le rinçage qui emporte. Il <strong>se fabrique</strong> (dernière section, <span class="ref">ch. 112</span>), mais pas en trois jours et pas sans gras ni cendres : d’ici là, il s’achète et il ne se rationne pas</td><td class="c-ch"><span class="gr">31</span><span class="gr">48</span><span class="gr">55</span><span class="gr">112</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Gants jetables</strong> de nitrile, en boîte</td><td class="c-qte">1 boîte par lieu, jamais un reste de boîte</td><td class="c-sans">« Toujours porter des gants à usage unique lorsqu’on dépouille ou éviscère un animal ». La tularémie entre par la peau, et le lièvre est la seule viande fraîche de janvier</td><td class="c-ch"><span class="gr">22</span><span class="gr">48</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item"><strong>Masques N95</strong>, à deux élastiques qui passent derrière la tête et à pince nasale</td><td class="c-qte">Assez pour changer de masque à chaque sortie</td><td class="c-sans">Il sert deux fois : à l’épidémie, et à la fumée de feu de forêt. Il filtre les particules fines, <strong>il ne filtre pas les gaz de la fumée</strong>. Il ne tient pas sur une barbe et ne se met pas à un enfant de moins de 2 ans</td><td class="c-ch"><span class="gr">30</span><span class="gr">2</span></td></tr></tbody></table>
<h3 class="sub ss"><span class="ssn pal1">1.F</span>Voir, savoir, joindre</h3>
<table class="tspan achat pal1"><colgroup><col style="width:12.5%"><col style="width:23%"><col style="width:17.5%"><col style="width:40%"><col style="width:7%"></colgroup><thead><tr><th class="c-lieu">Lieu</th><th class="c-item">Item</th><th class="c-qte">Quantité</th><th class="c-sans">Sans ça</th><th class="c-ch">Ch.</th></tr></thead><tbody><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Lampe frontale</td><td class="c-qte">1 par personne <strong>+ 2</strong>, à la taille des enfants pour les leurs</td><td class="c-sans">Décembre donne 15 à 16 heures de noirceur. Frontale et non lampe de poche : les deux mains servent, et une main qui tient une lampe ne tient pas un enfant</td><td class="c-ch"><span class="gr">85</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td class="c-item">Piles de rechange, <strong>d’un seul format pour tout le bâtiment</strong></td><td class="c-qte">Réserve d’une saison, entreposées <strong>hors des appareils</strong></td><td class="c-sans">L’inventaire des piles se fait par <strong>format</strong>, pas par nombre : on stocke des AA et l’appareil critique prend des CR2032. Les alcalines coulent en vieillissant et ruinent ce dans quoi elles sont restées</td><td class="c-ch"><span class="gr">9</span><span class="gr">85</span></td></tr><tr><td class="c-lieu"><div class="lcell"><span class="lx"><span class="bx"></span><i class="ak ak-m" aria-hidden="true"></i><b>Maison</b></span><span class="lx"><span class="bx"></span><i class="ak ak-c" aria-hidden="true"></i><b>Chalet</b></span></div></td><td
