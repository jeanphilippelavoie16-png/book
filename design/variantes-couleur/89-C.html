<p class="p0">Ce qui manque le jour où ça sert : la babiche séchée d’avance, le chaudron assez grand, la perceuse, le gabarit, la raquette du commerce — et surtout la semaine. Ce qui ne manque jamais au chalet : du bouleau vert, de l’épinette, une hache, le poêle, et une peau quand la chasse a donné. Les raquettes de fortune ci-dessous vont de la plus vite faite à la plus longue.</p>
<h3 class="sub">La raquette de sortie</h3>
<p class="p0">Elle ne sert pas à traverser le territoire. Elle sert à sortir d’un fond de neige jusqu’à la trace, au bois ou à la machine en panne.</p>
<p class="p0 ri"><strong class="runin">La botte de branches.</strong> Couper quelques branches de pin, de sapin baumier (<em>Abies balsamea</em>) ou d’épinette bien fournies, les poser ensemble, les gros bouts en avant, et les ligaturer serré par les gros bouts. Attacher la botte sous le pied. C’est tout. On perd presque tout : ça pèse, ça porte peu, et ça ne dure qu’une sortie. On y gagne de ne pas s’enfoncer jusqu’aux hanches.</p>
<p class="p0 ri"><strong class="runin">La perche en goutte.</strong> Une perche verte d’environ <strong>2,5 cm</strong> de diamètre et <strong>1,5 m</strong> de long — bouleau, saule, érable. La chauffer au-dessus du feu ou du poêle, ou la tremper une nuit si on a le temps, puis la plier en forme de goutte, les deux bouts réunis à l’arrière et ligaturés, écartée d’environ <strong>30 cm</strong> au plus large. Ligaturer deux traverses en travers du milieu : la plante du pied porte sur l’une, le talon sur l’autre. Tendre de la corde en diagonale d’un côté à l’autre du cadre, en croisillons, et nouer deux cordes à chaque traverse pour attacher la botte. Deux branches d’épinette noire pliées en boucle et ligaturées sous la botte font la même chose en plus grossier (<span class="ref">ch. 15</span>).</p>
<p class="p0 ri"><strong class="runin">La raquette de trois perches.</strong> Celle qui se fait sans rien cintrer. Pour chaque raquette, trois perches <strong>aussi longues que la personne est grande</strong>, grosses comme le pouce au gros bout et comme le petit doigt à la pointe, et six bâtons d’environ <strong>25 cm</strong> :</p>
<p class="step"><span class="sn">1</span>Poser les trois perches côte à côte, gros bouts en arrière. Réunir les trois pointes en avant et les nouer ensemble.</p>
<p class="step"><span class="sn">2</span>Ligaturer <strong>un bâton</strong> en travers des gros bouts, à l’arrière : c’est la surface qui porte.</p>
<p class="step"><span class="sn">3</span>Ligaturer <strong>trois bâtons</strong> jointifs en travers, <strong>un peu en avant du milieu</strong> : c’est le plancher de pivot, sous l’avant du pied.</p>
<p class="step"><span class="sn">4</span>Ligaturer <strong>deux bâtons</strong> là où le talon retombe.</p>
<p class="step"><span class="sn">5</span>Attacher la botte au plancher de pivot seulement, de façon que le pied <strong>pivote</strong> et que le talon reste libre.</p>
<p>Le principe est celui de toute raquette : parce que le pivot est en avant du milieu, l’arrière reste sur la neige et la pointe se lève d’elle-même à chaque pas. Une raquette qui bascule du nez vers le bas a son pivot trop en arrière : déplacer l’attache vers l’avant.</p>
<h3 class="sub">La patte d’ours de dépannage</h3>
<p class="p0">C’est la raquette que les Innus font pour les petits enfants et pour les temps durs, quand il faut des raquettes tout de suite. Elle sert aussi au début de l’hiver, quand il y a peu de neige, pour ménager la bonne paire.</p>
<p class="step"><span class="sn">1</span><strong>Le fût d’une seule perche</strong> de bouleau vert, chauffée au-dessus du poêle, ou d’une baguette fendue, épongée d’eau bouillante, pliée en rond ou en ovale. Les deux bouts se chevauchent à l’arrière et se ligaturent. Pas de gabarit : on plie sur le genou et on noue.</p>
<p class="step"><span class="sn">2</span><strong>Une seule traverse</strong>, juste devant les orteils.</p>
<p class="step"><span class="sn">3</span><strong>Le devant — le « front », devant la traverse — reste ouvert.</strong> Seul l’arrière de la traverse est lacé. On y gagne toute la pointe à lacer.</p>
<p class="step"><span class="sn">4</span><strong>Laçage avec n’importe quelle corde</strong> : corde, ficelle, ligne à pêche, babiche fraîche, ou toile déchirée en bandes — la toile ne vaut que pour cette raquette-là. Des passes croisées en diagonale, chaque croisement tordu d’un tour pour que rien ne glisse. Laisser le trou des orteils ouvert juste derrière la traverse.</p>
<p class="step"><span class="sn">5</span><strong>Attache</strong> : comme au bloc H, ou une bande de chambre à air (plus bas).</p>
<p>Elle se fait en un jour. Pour les enfants de quatre et six ans, c’est la bonne raquette : courte, elle permet un pas court et tourne vite dans le bois. <strong>Ce qu’on perd</strong> : la portance de tout le devant, et la vitesse en ligne droite. Elle est lente sur un lac et à sa place dans le bois dense.</p>
<h3 class="sub">La raquette de planche, pour la sloche du printemps</h3>
<p class="p0">Au printemps, quand la neige fond au soleil, la babiche s’engorge et chaque pas soulève un paquet de sloche. Une planche, elle, ne retient rien.</p>
<p class="li"><strong>Une planche mince, plate et raide</strong>, taillée au contour d’une queue de castor : épinette fendue et amincie, ou une planche de récupération du chalet. Mince pour être légère ; raide pour ne pas fléchir sous le pied quand elle ne porte que par ses deux bouts.</p>
<p class="li"><strong>Pas de traverse, pas de laçage.</strong> Seulement un trou découpé devant le pied, pour les orteils, et la même attache qu’une raquette lacée.</p>
<p class="li"><strong>Quelques heures de travail</strong>, contre plusieurs jours pour une raquette lacée.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd</strong> : une planche ne plie pas, ne laisse rien passer et ne se répare pas d’un brin de babiche. Elle est faite pour la neige molle et fondante, et c’est pour cette saison-là qu’on la garde.</p>
<h3 class="sub">Lacer sans babiche sèche</h3>
<p class="li"><strong>La peau de phoque</strong>, bien grattée, passe pour bonne et durable pour lacer ; le <span class="ref">ch. 56</span> la coupe en spirale.</p>
<p class="li"><strong>La peau fraîche, coupée gelée.</strong> Une peau crue grattée qu’on laisse geler dehors se coupe dehors, raide sous la lame ; on rentre les lanières de peau à mesure pour qu’elles dégèlent, et on lace avec. Le laçage sèche sur la raquette au lieu de sécher avant, et serre en séchant.</p>
<p class="li"><strong>La corde synthétique</strong> lace honnêtement une patte d’ours. Elle ne serre pas en séchant : le laçage se tend à la main, passe par passe.</p>
<p class="li"><strong>La toile</strong> en bandes : patte d’ours seulement.</p>
<h3 class="sub">L’attache sans courroie</h3>
<p class="li"><strong>La lanière simple nouée</strong>, au bloc H. C’est la seule qui ne demande rien d’autre qu’une lanière.</p>
<p class="li"><strong>Une bande de chambre à air</strong> coupée en travers dans un gros pneu : glissée sur l’avant du pied et tirée derrière le talon, elle tient sans nœud, s’enfile avec des mitaines et s’enlève d’une torsion. Au très grand froid, le caoutchouc raidit : la mettre au chaud avant de chausser. Elle serre sans arrêt et ne se desserre pas à la halte : la choisir assez lâche pour que les orteils bougent dedans, et la vérifier aux haltes comme la lanière (étape 37).</p>
<p class="li"><strong>Une bande de toile pliée en plusieurs épaisseurs</strong>, nouée comme la lanière simple.</p>
<h3 class="sub">Cintrer sans chaudron, sans boîte, sans gabarit</h3>
<p class="li"><strong>La perche verte entière, avec son écorce, se plie à la chaleur sèche.</strong> Elle contient déjà son eau. Promener la zone de pli au-dessus des braises ou le long du poêle, en la tournant sans arrêt, puis plier. On ne compte pas le temps : on chauffe en tenant la perche sous une légère pression de pliage, et elle est prête quand elle perd presque tout son ressort sous la main. La surface trop chaude pour la main ne dit rien du cœur. Jamais jusqu’à roussir : trop chauffé, le bois sèche et casse, et carbonisé il n’a plus de résistance. Ça vaut pour une perche mince ; une pièce épaisse sèche dehors avant de mollir dedans, et va à l’eau bouillante. Une baguette fendue, sans écorce, sèche en surface à la chaleur sèche et casse là (étape 9) : on la plie aux chiffons mouillés.</p>
<p class="li"><strong>Les chiffons ébouillantés</strong> enroulés sur la zone, arrosés de nouveau à mesure qu’ils tiédissent, remplacent le chaudron trop petit.</p>
<p class="li"><strong>La boîte à vapeur</strong> : une longueur de tuyau de poêle bouchée aux deux bouts de chiffons, posée en légère pente au-dessus d’une bouilloire dont le bec entre par le bas. Un trou au point bas laisse sortir l’eau qui se condense ; sans lui, elle descend noyer le bec. La vapeur d’une bouilloire qui bout à la pression de l’air est déjà mouillée : pas d’eau à mettre dans le tuyau, et surtout pas de pression. La pièce y reste le temps du bloc C. Au bout de 15 à 20 minutes, une pièce qu’on sort doit dégoutter : sinon, il n’entre pas assez de vapeur, et on chauffe plus fort ou on raccourcit le tuyau. Quand seul le bout d’une pièce plie, plus simple encore : le tuyau debout dans le chaudron d’eau qui bout, un chiffon en haut, et l’eau qui se condense retombe dans le chaudron.</p>
<p class="li"><strong>Pas de gabarit</strong> : le genou pour plier, une corde entre les deux bouts, et d’autres cordes pour tenir la forme pendant le séchage.</p>
<p class="li"><strong>La sangle improvisée</strong> : une bande de métal couchée sur la face extérieure de la zone de pli, aussi large qu’elle. Un feuillard de palette ou une vieille lame de scie à ruban couvre un fût ; pour la tête du toboggan, seule une bande de tôle couvre la largeur de la planche, et une sangle plus étroite laisse partir les échardes sur les arêtes. Un taquet de bois ligaturé au bout de la sangle appuie contre le bout proche de la pièce ; de l’autre côté, la sangle se ligature ou se serre à la pièce au-delà de la courbe (étape 14). C’est surtout pour la tête du toboggan qu’elle sauve la pièce.</p>
<h3 class="sub">Percer sans perceuse</h3>
<p class="p0">L’alène chauffée au rouge passe les trous fins d’un fût ; il faut la réchauffer souvent et racler le charbon entre deux passes. Le drille à archet et son clou aplati, et le fer rouge pour les trous du toboggan, sont au <span class="ref">ch. 110</span>, <span class="ref">§9</span>.2. Un trou brûlé est plus gros qu’un trou percé : on garde plus de bois entre deux trous voisins.</p>
<h3 class="sub">Les outils qu’on se fait</h3>
<p class="li"><strong>Le couteau croche.</strong> Une vieille lime ou une lame de couteau. Une face meulée plate, l’autre biseautée comme une plane. La lame chauffée et courbée — certaines en entier, d’autres par le bout seulement — puis emmanchée dans un manche recourbé, et ligaturée serré, parce que la lame tire fort sur le manche. Recuire avant de façonner, retremper, revenir : <span class="ref">ch. 111</span>. Une lame de scie à métaux fait l’affaire en dépannage (<span class="ref">ch. 94</span>). <strong>La prise</strong> : le manche tenu en travers du corps, <strong>le pouce appuyé sur le bout du manche</strong> pour guider la lame, et on tire vers soi. La lame vient vers le ventre, et c’est là qu’elle blesse : la pièce ne se tient donc ni à la main ni contre soi. On la serre au chevalet à planer — un banc où l’on s’assoit à califourchon, un bras pivotant que les pieds poussent pour coincer la pièce — et une pièce longue se pose de biais, pour que la partie finie passe à côté du corps et non devant. C’est l’outil qui fait les fûts, les traverses, les planches et les manches, et celui qui amincit la zone de pli.</p>
<p class="li"><strong>Les lunettes à fente</strong> (<span class="ref">§8</span>, point 4). Une pièce de bois un peu courbée pour épouser le visage, une encoche pour le nez, et une fente étroite à la hauteur des yeux : elle ne laisse entrer la lumière que par là. Une petite visière au-dessus de la fente, le devant noirci à la suie mêlée d’huile pour boire la lumière, l’intérieur creusé pour que les cils bougent. Une lanière de peau à chaque bout, nouée derrière la tête.</p>
<p class="li"><strong>L’aiguille à lacer.</strong> Plate, arrondie aux deux pointes, le chas au milieu : elle passe dans les deux sens sans qu’on la retourne. Os, andouiller, bois franc, clou aplati et percé. Plusieurs grosseurs pour les différentes mailles. Pour la ficelle du toboggan, un fil de collet tordu en boucle.</p>
<p class="li"><strong>L’espaceur.</strong> Une pointe d’andouiller ou une spatule de bois franc, pour égaliser les mailles.</p>
<p class="li"><strong>La brosse.</strong> Un bâton fendu au bout, un chiffon coincé dans la fente.</p>
<p class="li"><strong>La pince de deux bâtons.</strong> Deux bâtons liés serré de part et d’autre du bout de la planche.</p>
<h3 class="sub">Le toboggan sans rabot ni clous</h3>
<p class="p0">La hache fait les planches (équarrir au cordeau : <span class="ref">ch. 110</span>, <span class="ref">§9</span>.3) ; le couteau croche fait la zone de pli. Les clous ne sont pas nécessaires : un toboggan tient entièrement par ses ligatures de peau crue passées dans des trous, couchées dans leurs rainures sous les planches, avec quatre points par traverse (étape 52), posées après la dernière eau chaude. Une fente à la tête se ferme par deux trous et une ligature, comme à l’étape 50.</p>
<h3 class="sub">Quand le toboggan n’est pas le bon véhicule</h3>
<p class="li"><strong>La sloche et l’eau sur la glace</strong>, au début et à la fin de l’hiver : on met la charge sur une plateforme portée par <strong>deux patins</strong>, à <strong>10 à 15 cm</strong> au-dessus de la glace. La charge reste sèche, et l’eau passe dessous. C’est aussi ce qui transporte le canot et le bois à l’embâcle et à la débâcle.</p>
<p class="li"><strong>La peau de la bête elle-même</strong> : la viande enveloppée dans la peau d’orignal, poil dessous, tirée comme un traîneau. Ça va bien sur un lac ou une rivière gelés et sur la neige lisse, mal dans les broussailles. La peau isole, et c’est ce qui rend la méthode sûre ou dangereuse : enveloppée froide, ou découpée en morceaux assez petits pour avoir refroidi seuls, la viande voyage bien, et on ouvre le paquet dès l’arrivée. Un quartier encore chaud roulé dans sa peau et traîné des heures garde sa chaleur au cœur du cuissot, et le 7 °C en 24 heures est manqué (<span class="ref">ch. 61</span>, <span class="ref">§3</span> et <span class="ref">§9</span>). Le prix : une peau traînée ne fait plus un bon cuir (<span class="ref">ch. 61</span>, <span class="ref">ch. 102</span>).</p>
<p class="li"><strong>Le capot, la tôle roulée, les deux skis, la bâche entre deux perches, la porte</strong> : <span class="ref">ch. 15</span> et <span class="ref">ch. 26</span>.</p>
<h3 class="sub">Tirer sans harnais</h3>
<p class="p0 ri"><strong class="runin">Sur la terre ferme</strong>, la corde de tire se passe contre la poitrine, pas autour de la taille : une bande de toile large, une vieille ceinture ou une sangle de sac, passée en bandoulière et nouée au double de la corde, répartit la traction sur le haut du corps. <strong>Sur la glace</strong>, la bandoulière fait une boucle fermée autour du torse et ne tombe pas : la corde se tient à la main ou se pose sur une seule épaule (<span class="ref">§8</span>, point 2). Une corde mince qui scie l’épaule se double d’une mitaine repliée. Pour un blessé ou une charge lourde en descente, deux perches liées aux coins du toboggan font des brancards qui empêchent la charge de rattraper celui qui tire (<span class="ref">ch. 15</span>) ; sur la glace, ils se tiennent à la main et ne se lient pas à la ceinture.</p>
<h3 class="sub">Réparer sur la piste</h3>
<p class="li"><strong>Un fût cassé</strong> : une éclisse de bois vert de chaque côté de la cassure, ligaturée serré de babiche mouillée ou de corde. Tout de suite : un laçage qui a perdu sa tension se défait de proche en proche.</p>
<p class="li"><strong>Une babiche cassée</strong> : on noue le bout neuf pendant qu’il est mouillé (<span class="ref">ch. 103</span>). Garder toujours un ou deux brins de babiche dans la poche : un brin casse sans prévenir.</p>
<p class="li"><strong>Une raquette trempée</strong> : la sécher le soir, loin de la flamme, pendue. Près du poêle, on la retrouve cornée et cassante (<span class="ref">ch. 103</span>).</p>
<p class="li"><strong>Une corde de côté cassée</strong> : la refaire avant de repartir ; sans elle, les planches se décalent à la première bosse et tout l’effort passe dans la ligature des traverses.</p>
<p class="li"><strong>La raquette d’aluminium du commerce</strong>, celle qu’on a le plus de chances d’avoir aux pieds. Sa courroie cassée se remplace par la lanière simple du bloc H ou par une bande de chambre à air. Sa toile déchirée se recoud à la corde, par des trous percés d’un clou chauffé qui fond le plastique au lieu de le fendre, en points serrés de part et d’autre de la déchirure. Son cadre plié ou fissuré s’éclisse comme un fût de bois, avec deux baguettes et une ligature serrée.</p>
<h3 class="sub">Ce qui ne se remplace vraiment pas</h3>
<p class="li"><strong>Le temps.</strong> Une paire lacée, c’est environ une semaine de travail pour une personne : un jour pour les fûts, au moins un jour de séchage, une journée ou plus pour lacer chaque raquette, et la babiche faite avant (<span class="ref">ch. 103</span>). En février, avec une peau fraîche à préparer d’abord, on n’a pas cette semaine-là devant soi. L’automne est la saison des raquettes ; en février, on fait des pattes d’ours.</p>
<p class="li"><strong>La portance d’une grande raquette lacée.</strong> Aucune raquette de fortune ne flotte comme elle. Les raquettes de sortie ramènent à la trace ; elles ne traversent pas le territoire.</p>
<p class="li"><strong>La main du laçage.</strong> Une main exercée met une journée ou plus par raquette ; la première qu’on lace soi-même prend plus longtemps et ne sera pas belle. C’est une chose à avoir faite une fois avant d’en avoir besoin.</p>
<p class="li"><strong>La babiche craint l’eau et la chaleur</strong>, et le printemps lui apporte les deux. Frotté de gras, un laçage fini boit plus lentement (<span class="ref">ch. 103</span>) ; verni, il boit moins encore, mais il glisse sur les troncs et sur la glace. Sans vernis, la réponse au printemps est la raquette de planche.</p>
</template>
<template id="notes">
<p class="fn" data-fn="12-1"><span class="fnn">1</span>Une braise se cache sous la cendre. Lampe éteinte, porte du poêle ouverte, on brasse la cendre au tisonnier jusqu’au fond : une braise vivante luit rouge. Tant qu’un seul point rouge luit, le feu n’est pas mort, et il fait du CO sans flamme.</p>
<p class="fn" data-fn="12-2"><span class="fnn">2</span>Le fil, tenu au bout d’une broche, s’approche d’une flamme, dehors. Le coton brûle sans reculer devant la flamme, sent le papier brûlé et laisse une cendre grise et fine. Le nylon et le polyester fondent en se recroquevillant loin de la flamme, sentent le produit chimique et laissent une petite bille fondue. Un tissu mélangé ne se lit pas à coup sûr : dans le doute, il se range avec la bâche.</p>
<p class="fn" data-fn="43-1"><span class="fnn">1</span>Le bord avant du gros coussinet, celui qui regarde les doigts, fait deux bosses arrondies côte à côte. Celui d’un canidé est un petit triangle, sans ces deux bosses.</p>
<p class="fn" data-fn="43-2"><span class="fnn">2</span>Un gros rocher posé seul au milieu d’une tourbière, d’un plat ou d’une forêt, loin de toute falaise d’où il aurait pu tomber : c’est la glace des glaciers qui l’a laissé là.</p>
<p class="fn" data-fn="43-3"><span class="fnn">3</span>Là où le loup et le coyote ont un petit coussinet en triangle, celui du pied avant du renard se réduit à une barre étroite, posée en travers de l’empreinte. Autour de cette barre, le vide entre les doigts et le coussinet est grand, et le X se lit net.</p>
</template>

<script>
(function(){

  while(lo<=hi){ const mid=(lo+hi)>>1; const a=part(el,st[mid],true); f.appendChild(a); syncNotes(f); const ok=!OVER(f); f.removeChild(a); syncNotes(f); if(ok){best=mid;lo=mid+1;} else hi=mid-1; }

}
function splitTable(tb, f){

  const mk=(rs,kind)=>{ const t=tb.cloneNode(false); const cg=tb.querySelector('colgroup'); if(cg) t.appendChild(cg.cloneNode(true));

/* ---------- notes de bas de page ----------

const NOTES={};
document.getElementById('notes').content.querySelectorAll('p.fn').forEach(n=>NOTES[n.dataset.fn]=n);
function noteZone(f, make){
  let z=f.nextElementSibling;

  if(getComputedStyle(f).columnCount==='1') z.classList.add('one');

}
function sideOf(c, f, z){
  if(z.classList.contains('one')) return 'l';

}
function syncNotes(f){
  const seen=new Set();

  let z=noteZone(f, calls.length>0);
  if(!z) return;
  if(!calls.length){ z.remove(); return; }
  for(let it=0; it<4; it++){
    const want=calls.map(c=>c.dataset.fn+'|'+sideOf(c,f,z)).join(' ');
    const cur=Array.from(z.querySelectorAll('p.fn')).map(n=>n.dataset.fn+'|'+n.parentNode.dataset.side).join(' ');
    if(want===cur) break;
    z.querySelectorAll('.fnc').forEach(c=>c.textContent='');
    want.split(' ').forEach(w=>{ const [id,sd]=w.split('|'); z.querySelector('.fnc[data-side="'+sd+'"]').appendChild(NOTES[id].cloneNode(true)); });

/* =====================================================================

const C = JSON.parse(document.getElementById('meta').textContent);
const BOOK = document.getElementById('book');
const WARN = [];
const PAGES = [];
let P = null;                 // page courante
let pendingPlates = [];       // planches pleine page qui attendent la fin de la page courante
const DSVG = '<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#fff"/><path d="M15.2 10 H18.8 L18.1 20.5 H15.9 Z" fill="#9B2C1E"/><rect x="15.4" y="22.3" width="3.2" height="3.2" fill="#9B2C1E"/></svg>';
const PT = 96/72;

function mkPage(kind, plate){
  const n = PAGES.length + 1, side = n % 2 ? 'recto' : 'verso';
  const el = document.createElement('section'); el.className = 'page ' + side; el.id = 'p' + C.num + '-' + n;
  if(kind !== 'open') el.innerHTML = '<div class="rh"><div class="grp"><span class="fo">' + C.num + '-' + n + '</span><span class="ch">' + C.num + ' · ' + C.title + '</span></div><span class="to">' + C.tome + '</span></div>';
  const bl = document.createElement('div'); bl.className = 'block'; el.appendChild(bl);

    bl.appendChild(img);

}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];

}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px

    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';

function pour(f, q, p){

function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante

function finish(R, kind){

function story(kind){
  const tpl = document.getElementById('story-' + kind);

function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');

  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {

    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });

}
function fitTitle(){

function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
