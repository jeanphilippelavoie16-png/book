<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>89 — Raquettes et toboggan — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}

<template id="open"><header class="open"><div class="open-top"><span>Tome 5 · La forêt, le jardin et le chalet</span><span>Chapitre</span></div><div class="open-title"><div class="num">89</div><h1>Raquettes et toboggan</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span>Chalet</span><span class="on">Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Un fût de bouleau fendu, cintré à l’eau bouillante et lacé de babiche, et deux planches d’épinette relevées à la tête, remplacent la motoneige dès que la neige passe 30 cm : une paire bien faite tient deux saisons de gros usage, un toboggan se fait en une journée et demie d’atelier, et une patte d’ours de dépannage se fait en un jour avec n’importe quelle corde.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h3 class="sub">C’est le bon choix quand</h3>
<p class="li"><strong>La neige passe 30 cm et la machine ne part plus, ou le carburant se compte</strong> (<span class="ref">ch. 15</span>). À 61 cm et plus, sans raquettes, on ne bouge presque plus. Avec elles, on retrouve à peu près la mobilité d’un piéton sur sol dur : c’est tout ce qu’elles promettent, et c’est énorme.</p>
<p class="li"><strong>Il faut ramener ce qui ne se porte pas</strong> : le bois, un quartier d’orignal, un enfant de quatre ans, un blessé (<span class="ref">ch. 26</span>). Tirer au lieu de porter garde le dos, l’équilibre et les deux mains libres.</p>
<p class="li"><strong>On est à l’automne et la bête vient d’être abattue.</strong> C’est la seule fenêtre où tout se trouve en même temps : du bois vert qui plie, une peau fraîche pour la babiche, et des semaines devant soi pour laisser sécher.</p>
<p class="li"><strong>Une raquette du commerce a cassé son cadre ou son laçage.</strong> On la répare (<span class="ref">§9</span>) avant d’en refaire une : une éclisse et quelques brins de laçage valent mieux qu’une semaine.</p>
<h3 class="sub">C’est un mauvais choix quand</h3>
<p class="li"><strong>La croûte porte.</strong> Sur de la neige assez dure pour tenir un homme, la raquette glisse et n’accroche rien : on l’enlève et on marche, et on la remet quand la croûte cède.</p>
<p class="li"><strong>La pente est raide.</strong> La prise de la raquette devient nulle et elle part de côté. On monte en travers, en taillant une marche à chaque pas, ou on contourne.</p>
<p class="li"><strong>La neige fond au soleil.</strong> La babiche s’engorge de sloche, chaque pas soulève un paquet de neige mouillée collée au laçage, et la marche devient épuisante. C’est la saison de la raquette de planche (<span class="ref">§9</span>).</p>
<p class="li"><strong>Le toboggan doit traverser de la sloche ou de l’eau sur la glace.</strong> Il boit, la charge se mouille et gèle ensuite. Au début et à la fin de l’hiver, c’est un traîneau à patins qui passe (<span class="ref">§9</span>). En plein hiver, l’eau peut aussi dormir sous la neige d’un lac (<span class="ref">§7</span>).</p>
<p class="li"><strong>Le toboggan doit monter une longue pente raide.</strong> On le laisse en bas et on monte la charge sur le dos, en plusieurs voyages : ça coûte moins d’énergie que de le hisser.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">La raquette et le toboggan font la même chose : étaler le poids.</strong> Un pied s’enfonce parce que tout le corps porte sur une petite surface. Le laçage serré de la raquette et le fond plat du toboggan répartissent la même charge sur une surface plusieurs fois plus grande, et la neige, qui ne supporte pas le pied, supporte la surface. Le reste du chapitre sert à obtenir cette surface avec du bois qu’on a coupé soi-même et une peau qu’on a préparée soi-même.</p>
<p class="p0 ri"><strong class="runin">Le bois chaud et mouillé se plie ; le bois froid et sec casse.</strong> La chaleur et l’eau ensemble rendent le bois environ <strong>dix fois plus plastique</strong> que du bois sec à la température de la pièce. L’eau bouillante vaut la vapeur à la pression de l’air : pas besoin de chaudière, un chaudron suffit, et c’est la méthode commode quand une partie seulement de la pièce doit plier — la pointe d’une raquette, la tête d’un toboggan. Du bois vert, coupé de la veille, a déjà son eau : il ne lui manque que la chaleur.</p>
<p class="p0 ri"><strong class="runin">Dans une courbe, le bois se comprime à l’intérieur et s’étire à l’extérieur, et il ne s’étire presque pas.</strong> Tout le cintrage tient dans cette phrase. Le bois assoupli encaisse beaucoup de compression sur la face intérieure, mais la face extérieure rompt dès qu’on lui demande de s’allonger un peu : c’est là que partent les échardes. Un nœud, lui, refuse de se comprimer, et la pièce fait un coude à cet endroit. Plié librement, sans rien pour retenir la face extérieure, le bois ne tolère qu’environ <strong>3 %</strong> d’écart de longueur entre ses deux faces, ce qui correspond à un rayon d’environ <strong>33 fois l’épaisseur</strong> — 36 cm pour un fût de 11 mm. La pointe d’une raquette et la tête d’un toboggan sont bien plus serrées que ça. C’est pour ça qu’on amincit la zone de pli, qu’on la chauffe à fond, qu’on plie lentement, et qu’on garde une sangle prête (<span class="ref">§5-D</span>) : une bande d’acier posée sur la face extérieure l’empêche de s’allonger et force tout le travail en compression. Ainsi tenu, le bouleau à papier est parmi les meilleurs bois à cintrer qu’on ait mesurés : il plie jusqu’à un rayon d’environ <strong>2,5 fois son épaisseur</strong>, et au moins une pièce sur deux réussit à ce rayon. Une épinette mesurée de la même façon est jugée impropre au cintrage : c’est pour ça que la tête d’un toboggan d’épinette s’amincit autant.</p>
<p class="p0 ri"><strong class="runin">La courbe prend en séchant, pas en refroidissant.</strong> Sortie de son gabarit encore chaude, la pièce se redresse en partie. Tenue jusqu’à ce qu’elle sèche, elle garde sa forme. Le signe que c’est pris : le lien qui retient <strong>seul</strong> les deux bouts devient lâche tout seul, et une fois ôté, la pièce ne bouge plus. L’inverse est vrai aussi : <strong>un bois cintré qu’on remouille s’ouvre</strong>. C’est la raison des liens permanents qui tiennent la tête d’un toboggan, qui passe l’hiver dans la neige.</p>
<p class="p0 ri"><strong class="runin">La babiche serre en séchant et se relâche mouillée</strong> (<span class="ref">ch. 103</span>, <span class="ref">§3</span>). Lacée humide, elle rétrécit sur le fût et tend le laçage comme une peau de tambour ; trempée par la neige mouillée, elle boit, s’étire et blanchit. Tout l’entretien d’une raquette vient de là.</p>
<p class="p0 ri"><strong class="runin">Le toboggan est fait de deux planches, pas d’une.</strong> Une planche assez large ne se trouve pas dans une forêt d’épinettes, une seule planche fendrait, et deux planches liées ensemble plient sur les bosses au lieu de casser. Un toboggan long se dirige mieux qu’un court.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Ce qu’il faut pour <strong>cette</strong> procédure. Ce qui s’achète d’avance, raquettes du commerce comprises, est au <span class="ref">ch. 00b</span>.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item"><strong>Bille de bouleau à papier</strong> (<em>Betula papyrifera</em>) droite, sans nœud, sans pourriture</td><td>Assez longue pour un fût entier ; ou deux pour un fût en deux pièces (étape 5)</td><td><strong>Mélèze laricin</strong> (<em>Larix laricina</em>), bois dur et résistant, pris dans la tourbière ; un bouleau plus petit, en fût de deux pièces. Pour la raquette de printemps, une planche (<span class="ref">§9</span>)</td><td><strong>Non sur le fil droit.</strong> Un nœud ou un fil qui tourne dans la zone de pli casse la pièce, quelle que soit l’essence</td></tr><tr><td class="c-item"><strong>Épinette</strong> noire (<em>Picea mariana</em>) ou blanche (<em>Picea glauca</em>)</td><td>Deux traverses par raquette ; un tronc pour les deux planches d’un toboggan, plus des bâtons de 5 × 5 × 46 cm (2 × 2 × 18 po) pour les traverses</td><td>Mélèze laricin pour le toboggan. Bouleau en planches minces, d’à peine 6 mm (¼ po) : il plie bien mieux que l’épinette (<span class="ref">§3</span>)</td><td>Oui</td></tr><tr><td class="c-item"><strong>Hache</strong> affûtée (<span class="ref">ch. 105</span>)</td><td>1</td><td>Aucune pour abattre ; pour amincir, la plane ou le couteau croche</td><td><span class="non">NON</span></td></tr><tr><td class="c-item"><strong>Couteau croche</strong></td><td>1</td><td>Couteau droit bien affûté, plane, petit rabot. Il se fabrique (<span class="ref">§9</span>)</td><td>Oui, mais c’est l’outil du chapitre</td></tr><tr><td class="c-item"><strong>Coins et masse de bois</strong> pour fendre</td><td>Trois ou quatre coins</td><td>La hache seule pour une petite bille ; coins taillés dans du bouleau jaune ou de l’érable sec (<span class="ref">ch. 110</span>, <span class="ref">§9</span>.3)</td><td>Oui</td></tr><tr><td class="c-item"><strong>Chaudron d’eau bouillante et « brosse »</strong> : un bâton fendu, un vieux chiffon coincé dans la fente</td><td>1</td><td>Chiffons ébouillantés enroulés sur la zone de pli ; boîte à vapeur de tuyau de poêle (<span class="ref">§9</span>) ; chaleur sèche du poêle sur une perche verte entière, avec son écorce</td><td><strong>Non sur la chaleur</strong></td></tr><tr><td class="c-item"><strong>Gabarit</strong> : une planche, le contour tracé, des taquets cloués à l’intérieur</td><td>1 par forme</td><td>Le genou et une corde nouée entre les deux bouts</td><td>Oui</td></tr><tr><td class="c-item"><strong>Sangle de cintrage</strong> : une bande d’acier couchée sur la face extérieure, aussi large qu’elle, un taquet contre le bout proche de la pièce, une ligature ou une serre au-delà de la courbe de l’autre côté (étape 14)</td><td>1</td><td>Feuillard de palette ou vieille lame de scie à ruban pour un fût ; pour une planche de toboggan, seule une bande de tôle couvre la largeur (<span class="ref">§9</span>)</td><td>Oui, tant que rien ne lève à l’extérieur</td></tr><tr><td class="c-item"><strong>Perçage</strong> : vilebrequin ou perceuse à main, mèches fines</td><td>1</td><td>Alène chauffée au rouge ; drille à archet et clou aplati (<span class="ref">ch. 110</span>, <span class="ref">§9</span>.2)</td><td><span class="non">NON</span> <span class="negx"> : sans trous, pas de laçage</span></td></tr><tr><td class="c-item"><strong>Aiguille à lacer</strong>, plate, arrondie aux deux bouts, chas au milieu</td><td>1 ou 2</td><td>Os, andouiller, bois franc, clou aplati ; fil de collet tordu pour la ficelle du toboggan</td><td>Oui</td></tr><tr><td class="c-item"><strong>Babiche</strong> mouillée (<span class="ref">ch. 103</span>, blocs D et E)</td><td>Une peau pour commencer. Le centre, en grosse lanière serrée, en prend bien plus que la pointe et le talon ; couper le centre d’abord, dans la plus belle partie de la peau</td><td><strong>Peau de phoque bien grattée</strong> (<span class="ref">ch. 56</span>) ; corde ; toile en bandes et ligne à pêche pour la patte d’ours seulement (<span class="ref">§9</span>)</td><td><strong>Non sur la qualité du centre</strong> : c’est lui qui porte le poids</td></tr><tr><td class="c-item"><strong>Ficelle ou babiche</strong> pour les ligatures du toboggan</td><td>Quelques mètres</td><td>Babiche tordue, corde fine, fil de collet. La ficelle sert pendant le cintrage ; la babiche se pose après la dernière eau chaude, qui la cuit (<span class="ref">ch. 103</span>, <span class="ref">§9</span>)</td><td>Non</td></tr><tr><td class="c-item"><strong>Corde de côté et traits</strong> du toboggan</td><td>Une corde de côté, en boucle (étape 56) ; deux traits d’environ 7,6 m (25 pi), ou une corde nouée aux deux coins</td><td>Babiche tordue en deux brins ; n’importe quelle corde qui ne s’étire pas</td><td>Non</td></tr><tr><td class="c-item"><strong>Clous</strong> pour les traverses du toboggan</td><td>2 par traverse</td><td>Aucun : le toboggan tient entièrement à la ligature</td><td>Oui</td></tr><tr><td class="c-item"><strong>Toile ou peau</strong> pour envelopper la charge</td><td>1</td><td>Bâche, couverture, peau d’orignal</td><td>Oui</td></tr></tbody></table>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A. Choisir et fendre le bois (1 à 6)</h3>
<p class="step"><span class="sn">1</span><strong>Couper le bouleau à l’automne et le travailler vert, le jour même.</strong> Le bois de fût se travaille dès la coupe, pour garder le maximum de ressort. On le cherche au clair : le bouleau à papier ne supporte pas l’ombre. Il pousse en lisière, au bord des lacs et des chemins, et en peuplements presque purs dans les brûlis et les vieilles coupes. Trouver le bon arbre peut prendre des jours ; ça fait partie du travail.</p>
<p class="step"><span class="sn">2</span><strong>Refuser tout ce qui a un défaut dans la zone de pli</strong> : pourriture, nœud, fente, fil tordu, et le cœur de l’arbre. La pente du fil ne doit pas dépasser <strong>1 sur 15</strong> : sur une fente de 30 cm, le fil ne dévie pas de plus de 2 cm. La fente elle-même fait l’essai — un bois qui fend droit a le fil droit.</p>
<p class="step"><span class="sn">3</span><strong>Fendre, ne pas scier.</strong> Moitiés, puis quarts, aux coins (<span class="ref">ch. 110</span>, <span class="ref">§9</span>.3). Une fente suit le fil, un trait de scie le coupe, et un fil coupé devient une écharde au cintrage. Tirer les baguettes loin du cœur.</p>
<p class="step"><span class="sn">4</span><strong>Orienter la pièce avant de la tailler.</strong> Les cernes doivent courir le long des faces qui vont se courber, pas les traverser, et <strong>la face qui regardait le cœur de l’arbre ira à l’intérieur de la courbe</strong> : elle a moins de gerces, et c’est elle qui travaille en compression.</p>
<p class="step"><span class="sn">5</span><strong>Dégrossir à la hache, puis au couteau croche</strong>, jusqu’à la section du fût : environ <strong>27 mm</strong> de haut sur <strong>11 mm</strong> d’épais à la pointe et <strong>14 mm</strong> au talon (27 × 11 à 14 mm, soit 1 1/16 × 7/16 à 9/16 po). En bois vert, garder un peu de gras : la pièce rétrécit en séchant. La finition se fait après le premier pli. Longueur : le tour du gabarit plus <strong>5 cm</strong> (2 po), la pointe de la raquette au milieu du bâton, les deux bouts au talon. Un bouleau trop court donne un <strong>fût en deux pièces</strong>, réunies par une longue enture à mi-bois (<span class="ref">ch. 110</span>, <span class="ref">§5</span>.4 et <span class="ref">§5</span>.7) ligaturée de babiche mouillée (<span class="ref">ch. 103</span>, étape 31). Placée sur un côté, entre les deux traverses, l’enture est ensuite tenue par le laçage du centre, qui s’enroule autour du fût.</p>
<p class="step"><span class="sn">6</span><strong>Arrondir le dessous.</strong> Le chant du dessous se façonne bien rond et un peu plus large que celui du dessus : un chant vif coupe la babiche qui passe autour. Faire une encoche au couteau sur le dessus, pour ne jamais monter une pièce à l’envers.</p>
<h3 class="sub">B. Le gabarit (7 et 8)</h3>
<p class="step"><span class="sn">7</span><strong>Le meilleur gabarit est la paire qu’on a déjà.</strong> Poser une raquette du commerce sur une planche, tracer le contour intérieur, clouer des taquets le long du trait à l’intérieur, et préparer ceux de l’extérieur avec leurs clous déjà plantés, pour les fixer vite quand le bois arrive chaud. Sans modèle : une raquette d’usage courant fait environ <strong>30 × 107 cm</strong> (12 × 42 po) ; la raquette longue de neige poudreuse et de terrain plat, <strong>30 × 152 cm</strong> (12 × 60 po) ; la patte d’ours est courte, large et ovale. La taille se décide pour qui la raquette est faite : plus lourd, plus grande ; bois dense et côtes, plus courte. <strong>La première paire se fait plate.</strong> Une pointe relevée monte mal les côtes, et plier une pièce dans deux sens à la fois demande une main qu’on n’a pas encore.</p>
<p class="step"><span class="sn">8</span><strong>Sans planche</strong>, le fût plié se ferme en rapprochant les deux bouts et en les nouant d’une corde solide, et d’autres cordes le tiennent en forme pendant qu’il sèche.</p>
<p class="p0 ri"><strong class="runin">Les formes selon la neige et le terrain.</strong> Au chalet, la forme se choisit d’abord pour le bois dense et les côtes : ovale, à queue courte ou sans queue, parce qu’elle manœuvre entre les arbres.</p>
<table class="tspan"><colgroup><col style="width:22.0%"><col style="width:42.1%"><col style="width:35.9%"></colgroup><thead><tr><th>Forme</th><th>Où elle sert</th><th>Ce qu’elle coûte</th></tr></thead><tbody><tr><td class="c-item"><strong>Patte d’ours</strong> : courte, large, ovale, sans queue</td><td>Broussailles, bois dense, abords du camp, endroits serrés ; la raquette des enfants</td><td>Lente en ligne droite ; porte moins en neige très profonde</td></tr><tr><td class="c-item"><strong>Queue de castor</strong> : ovale, queue courte</td><td>Le travail de tous les jours : bois de chauffage, ligne de trappe, et la longue route en tirant un toboggan</td><td>La raquette à tout faire ; aucune spécialité</td></tr><tr><td class="c-item"><strong>Longue à pointe relevée</strong></td><td>Neige poudreuse profonde, terrain plat et découvert, ouvrir la trace</td><td>Difficile sur une piste tapée et dans les côtes, glissante sur la glace, plus fatigante à porter</td></tr><tr><td class="c-item"><strong>Planche</strong> (<span class="ref">§9</span>)</td><td>Neige molle et fondante du printemps</td><td>Ne vaut que pour cette neige-là</td></tr></tbody></table>
<h3 class="sub">C. Assouplir (9 à 12)</h3>
<p class="step"><span class="sn">9</span><strong>Travailler à côté du poêle, jamais dehors.</strong> Le bois doit être plié dès qu’il sort de l’eau chaude : la surface qui refroidit ou qui sèche avant le pli redevient raide, et c’est elle qui casse.</p>
<p class="step pk-t"><span class="sn">10</span><strong>Durée : une demi-heure par 2,5 cm d’épaisseur pour du bois vert, une heure par 2,5 cm pour du bois sec.</strong> Pour un fût vert de 11 à 14 mm, environ <strong>15 minutes</strong> de chaleur mouillée. Trop longtemps à la pression de l’air n’abîme presque rien ; trop peu fait casser.</p>
<p class="step"><span class="sn">11</span><strong>La méthode la plus simple : éponger.</strong> Tremper la brosse dans l’eau bouillante et la passer sur <strong>les deux faces</strong> de la zone de pli, sans arrêt, en déplaçant le bâton. Après 10 à 15 minutes, envelopper la zone d’un chiffon, la fléchir doucement dans les deux sens, puis reprendre l’eau. Recommencer jusqu’à ce qu’elle plie sans craquer. La pointe, qui a la courbe la plus serrée, doit être la mieux assouplie de toutes.</p>
<p class="step"><span class="sn">12</span><strong>Jamais de pression.</strong> La vapeur à la pression de l’air suffit, et la pression n’ajoute que du risque. Sur du chêne étuvé 20 minutes à environ <strong>120 kPa</strong>, près de deux cintrages sur dix ont raté, contre moins d’un sur dix à la pression de l’air : écart faible, mais dans le mauvais sens. À <strong>240 kPa</strong>, dix minutes suffisent pour en faire rater quatre sur dix. L’autoclave à conserves travaille à 70 kPa (<span class="ref">ch. 78</span>) : il n’apporte rien au bois que le chaudron ne donne déjà.</p>
<h3 class="sub">D. Cintrer et laisser prendre (13 à 18)</h3>
<p class="step"><span class="sn">13</span><strong>Commencer par la pointe.</strong> Placer le milieu du bâton au nez du gabarit, face du cœur contre les taquets, et plier lentement, d’une pression régulière : un pli brusque se concentre en un point et casse. Fixer les taquets extérieurs de la pointe, finir un côté, puis l’autre.</p>
<p class="step"><span class="sn">14</span><strong>Regarder la face extérieure pendant qu’on plie.</strong> Au premier soulèvement d’écharde, arrêter, rechauffer, et poser la sangle : la bande d’acier couchée sur la face extérieure de la zone de pli, serrée au bois de part et d’autre de la courbe — ou appuyée par un taquet contre le bout de la pièce quand le bout est proche, comme sur une planche de toboggan —, et on plie les deux ensemble. La sangle doit être aussi large que le bois, sinon les échardes partent sur les arêtes.</p>
<p class="step"><span class="sn">15</span><strong>Ne rien percer, ne rien mortaiser avant de plier.</strong> Chaque trou est un point faible où la courbe casse.</p>
<p class="step"><span class="sn">16</span><strong>Refermer la queue provisoirement.</strong> Rapprocher les deux bouts et les nouer d’une corde, sans ligature définitive : les traverses doivent entrer <strong>avant</strong> la fermeture (bloc E).</p>
<p class="step"><span class="sn">17</span><strong>Laisser sécher dans la forme.</strong> Pour du bouleau vert dans la chaleur d’une tente ou du chalet, on compte <strong>un à trois jours</strong> ; d’autres laissent le fût <strong>au moins une semaine</strong> sur la forme, bois vert ou sec. Entre les deux, c’est le bois qui tranche, par un signe mécanique : <strong>quand la corde qui retient seule les deux bouts devient lâche, la courbe est prise.</strong> Sur un gabarit à taquets, la corde ne porte presque rien et ne dit rien : l’essai est d’enlever un taquet extérieur. Le fût ne bouge pas, c’est pris ; il s’écarte, on replante le taquet et on attend. Retirée trop tôt, la pièce s’ouvre : on la remet dans la forme, réchauffée au besoin (<span class="ref">§7</span>). Sécher dans l’air de la pièce, pas collé au poêle : une surface qui sèche trop vite se gerce.</p>
<p class="step"><span class="sn">18</span><strong>Égaliser les deux fûts</strong> une fois secs, au couteau croche, pour que les deux contours soient pareils.</p>
<h3 class="sub">E. Poser les traverses et fermer le cadre (19 à 23)</h3>
<p class="step"><span class="sn">19</span><strong>Tailler deux traverses d’épinette</strong>, sèches. Elles divisent la raquette en trois zones — pointe, centre, talon — et sont espacées d’environ <strong>38 à 41 cm</strong> (15 à 16 po).</p>
<p class="step"><span class="sn">20</span><strong>Trouver leur place à l’équilibre.</strong> Écarter le fût, y coincer les deux traverses sans les fixer, et tenir la raquette par le milieu, en équilibre sur une main. Déplacer les traverses jusqu’à ce que le <strong>talon soit plus lourd d’environ 85 g</strong> que la pointe : sans balance, la queue doit descendre doucement quand on la tient au centre. C’est ce qui fait traîner la queue et lever la pointe à chaque pas. Marquer les deux places.</p>
<p class="step"><span class="sn">21</span><strong>Mortaiser le côté intérieur du fût</strong>, à environ <strong>6 mm</strong> (¼ po) de profondeur : c’est assez pour un joint serré, et chaque millimètre de plus affaiblit la courbe.</p>
<p class="step"><span class="sn">22</span><strong>Entrer les traverses, puis fermer la queue.</strong> Écarter les deux branches, glisser les traverses dans leurs mortaises, relâcher. Une fois la queue fermée, elles ne peuvent plus entrer. Pour fermer : superposer les deux bouts, percer <strong>trois trous à environ 10 cm</strong> (4 po) du bout, et ligaturer de babiche mouillée qui serrera en séchant. <strong>Jamais de vis</strong> : le bois fend autour à la première saison.</p>
<p class="step"><span class="sn">23</span><strong>Faire une gauche et une droite.</strong> La bouche — l’ouverture où entre le pied — n’est pas centrée : décalée d’un côté, elle fait pencher légèrement la raquette vers l’extérieur, et les deux raquettes ne se frappent plus à chaque pas. Décaler la bouche vers l’intérieur laisse plus de raquette dehors, donc plus de poids, et c’est ce côté qui devrait descendre. On le vérifie une fois le centre lacé : tenue par la corde des orteils, la raquette doit pencher, côté extérieur plus bas. Si elle penche de l’autre côté, elle va à l’autre pied.</p>
<h3 class="sub">F. Percer et poser les lisières (24 à 26)</h3>
<p class="step"><span class="sn">24</span><strong>Percer la pointe et le talon, pas le centre.</strong> Des paires de petits trous, <strong>en diagonale et rapprochés</strong>, percés en biais : la babiche passe ainsi surtout <strong>dans</strong> le bois, à l’abri, au lieu de frotter sur la neige et la croûte. Le centre n’a pas de trous : son laçage s’enroule autour du fût lui-même. Dans chaque traverse, trois trous : un à environ <strong>4 cm</strong> (1 ½ po) de chaque bout, un au milieu.</p>
<p class="step"><span class="sn">25</span><strong>Poser la lisière.</strong> C’est un cordon de babiche fine passé dans les trous du fût et dans ceux des traverses, qui forme une rangée de petites boucles le long du bord intérieur de la pointe et du talon. Le laçage de ces deux zones s’accroche aux boucles, pas au bois.</p>
<p class="step"><span class="sn">26</span><strong>Préparer la babiche</strong> au <span class="ref">ch. 103</span>, blocs D et E. Pour lacer, des brins de <strong>3 à 6 m</strong> (10 à 20 pi) : plus long, ils s’emmêlent. Deux bouts s’aboutent sans nœud : une fente au couteau dans chaque bout, chacun passé dans la fente de l’autre et tiré. Une fois sec, le raccord ne se voit presque plus. <strong>La babiche se pose toujours mouillée.</strong></p>
<h3 class="sub">G. Lacer en trois zones (27 à 34)</h3>
<p class="step"><span class="sn">27</span><strong>Choisir la babiche.</strong> L’orignal (<em>Alces americanus</em>) lace une raquette : plusieurs peuples l’ont toujours fait, et c’est la peau que le territoire donne. Pour le laçage, elle passe pourtant pour <strong>moins durable</strong> que le caribou (<em>Rangifer tarandus</em>) ou le phoque, sans qu’aucune durée soit publiée. La peau de phoque bien grattée passe pour bonne et durable ; sa coupe en spirale est au <span class="ref">ch. 56</span>. Donc : phoque quand on en a ; orignal sinon, la plus belle peau pour le centre (<span class="ref">ch. 103</span>, étape 18), en comptant relacer plus tôt et en gardant de la babiche de réserve sur soi.</p>
<p class="step"><span class="sn">28</span><strong>L’ordre : la pointe, puis le centre, puis le talon.</strong> La raquette se tient serrée entre les genoux, ou entre deux perches plantées.</p>
<p class="step"><span class="sn">29</span><strong>La pointe, en babiche fine.</strong> Faire un œil au bout du brin et le passer en nœud coulant dans la boucle de lisière du coin où la traverse rejoint le fût. Monter le brin jusqu’à la boucle du milieu de la pointe, le tordre autour, redescendre au coin opposé, le tordre autour de sa boucle. Revenir en travers, en accrochant chaque fois la boucle suivante d’une boucle torsadée, et en tordant le brin autour des passes déjà posées. La pointe se remplit de triangles serrés.</p>
<p class="step"><span class="sn">30</span><strong>Le centre commence par le cordon d’orteils</strong>, en babiche forte : un brin tendu en travers du fût, juste derrière la traverse avant, passé <strong>cinq ou six fois</strong> et arrêté d’une demi-clé. Puis deux <strong>haubans</strong>, de part et d’autre du futur trou des orteils : chacun va du cordon d’orteils à la traverse avant, enroulé plusieurs fois. C’est sous la plante du pied que le laçage force le plus, et c’est là qu’on le double.</p>
<p class="step"><span class="sn">31</span><strong>Le reste du centre, en babiche forte, autour du fût.</strong> Même geste qu’à la pointe, mais chaque passe fait le tour du fût lui-même et s’y arrête d’un nœud de cabestan. Maille d’environ <strong>2 cm</strong> (¾ po) pour l’usage courant ; <strong>plus lâche là où la neige est mouillée</strong>, parce qu’une maille fine s’y bouche ; plus serrée pour la neige poudreuse, qui passe au travers. Le centre, lacé serré autour du fût, tient aussi l’enture d’un fût en deux pièces.</p>
<p class="step"><span class="sn">32</span><strong>Le trou des orteils</strong>, environ <strong>10 cm</strong> (4 po) de large, en demi-cercle juste derrière la traverse avant : quand le laçage du centre atteint ses bords, le brin ne passe plus autour de la traverse mais dans le cordon d’orteils. Le border en tordant le brin autour des haubans et du cordon. Le faire généreux : une chaussure d’hiver épaisse doit y descendre sans frotter.</p>
<p class="step"><span class="sn">33</span><strong>Le talon, en babiche la plus fine</strong>, comme la pointe. Égaliser les mailles au fur et à mesure avec l’espaceur (<span class="ref">§9</span>), en tirant chaque passe à la même tension.</p>
<p class="step"><span class="sn">34</span><strong>Faire sécher la raquette dehors, à plat et à l’ombre, trois ou quatre jours</strong>, hors de portée des chiens et des rongeurs, qui mangent la babiche fraîche. Jamais près du poêle : surchauffée, la babiche devient cornée et cassante, et ça ne se rattrape pas (<span class="ref">ch. 103</span>). Et comme elle serre en séchant (<span class="ref">§3</span>), une raquette lacée trop serré, séchée à −30 °C, casse son cadre (<span class="ref">ch. 103</span>, étape 32).</p>
<h3 class="sub">H. L’attache (35 à 38)</h3>
<p class="step"><span class="sn">35</span><strong>Chausser mou.</strong> Mocassin, mukluk ou botte souple (<span class="ref">ch. 104</span>) : une semelle et un talon de cuir dur, en frottant, usent le laçage en quelques sorties, et ils gèlent le pied.</p>
<p class="step"><span class="sn">36</span><strong>La lanière simple.</strong> Une lanière large de cuir souple, fixée de part et d’autre de la bouche, derrière la traverse avant. Ses deux attaches sont assez écartées pour que le pied entre jusqu’aux orteils, et tirées vers le bas pour que le pied ne puisse pas glisser en avant et buter contre la traverse. La boucle qui passe sur les orteils reste lâche, pour que le pied bouge. Le reste de la lanière fait le tour du talon et se noue. Pour chausser : le pied entre dans la boucle <strong>par l’avant</strong>, tourne dedans, puis passe sous la bride des orteils. Bien réglée une fois pour toutes, cette attache s’enlève d’un tour de cheville.</p>
<p class="step"><span class="sn">37</span><strong>Régler par le talon.</strong> Trop serrée, le poids écrase le tendon du talon, et la circulation des orteils coupe : la gelure vient de là. Trop lâche, la lanière tombe et l’orteil sort de sa bride. Vérifier le serrage à chaque halte.</p>
<p class="step"><span class="sn">38</span><strong>Les orteils ne vont dans le trou que pour agripper en montée.</strong> Quand le talon se lève, la pointe du pied doit pouvoir descendre dans le trou ; mais on n’y enfonce pas les orteils à chaque pas, ce qui fait mal et fait perdre les ongles. En descente, le pied reste posé en travers de la traverse.</p>
<h3 class="sub">I. Marcher (39 à 42)</h3>
<p class="step"><span class="sn">39</span><strong>Lever la pointe juste assez pour dégager la neige</strong>, la pousser devant, et laisser la queue glisser. Genoux souples, pas un peu écarté pour que la raquette arrière passe au-dessus de l’autre : le cadre qui passe trop près frappe la cheville et laisse un bleu profond.</p>
<p class="step"><span class="sn">40</span><strong>En montée,</strong> droit dans les pentes douces, en travers et en marches dans les raides, la raquette posée le plus à plat possible, la pointe levée pour ne pas buter. <strong>En descente,</strong> le corps bien en arrière : penché en avant, on passe cul par-dessus tête, et le cadre peut frapper l’arrière de la tête.</p>
<p class="step"><span class="sn">41</span><strong>Ne jamais faire porter le cadre en pont</strong> sur un tronc ou un fossé, ne pas sauter avec : c’est comme ça que les fûts cassent. Dans la neige mince, surveiller les chicots à peine couverts, qui crèvent le laçage. Quand la neige mouillée fait une boule sous le pied, la frapper tout de suite d’un bâton.</p>
<p class="step"><span class="sn">42</span><strong>Ouvrir la trace.</strong> En neige profonde, le plus fort devant, et on le relaie souvent (<span class="ref">ch. 15</span>) : dans une file en raquettes, le troisième ou le quatrième marche déjà sur une piste ferme.</p>
<h3 class="sub">J. Le toboggan de deux planches (43 à 57)</h3>
<p class="p0">C’est le toboggan innu de la Basse-Côte-Nord : deux planches minces tirées d’un seul tronc, relevées à la tête, liées à des traverses par une ficelle qui ne touche jamais la neige.</p>
<p>Le temps, pour une main exercée : une journée et demie d’atelier, plus les quelques heures en forêt pour tirer les deux planches du tronc.</p>
<p class="step"><span class="sn">43</span><strong>Choisir un tronc d’épinette ou de mélèze le plus libre de nœuds possible</strong>, le fendre en deux par le cœur, aux coins (<span class="ref">ch. 110</span>, <span class="ref">§9</span>.3), et tirer <strong>une planche de chaque moitié</strong> : venues du même arbre, elles plient pareil.</p>
<p class="step"><span class="sn">44</span><strong>Planches brutes :</strong> environ <strong>2,5 à 3,2 cm</strong> d’épais (1 à 1 ¼ po), <strong>17 cm</strong> de large (6 ¾ po), <strong>2,4 m</strong> de long (96 po). Plus long se dirige mieux ; on en a fait jusqu’à <strong>4 m</strong> (13 pi).</p>
<p class="step"><span class="sn">45</span><strong>Amincir à la hache.</strong> Coincer un bout de la planche entre deux arbres rapprochés, et travailler debout, la jambe hors de la trajectoire, ou à genoux, le genou appuyé derrière la planche. Quand un éclat menace de filer trop loin, donner <strong>quelques coups juste en dessous</strong> : ils l’arrêtent. Viser la planche à l’œil et la faire ressorter pour lire le gauchissement. Au sortir de la hache : environ <strong>16 mm</strong> (5/8 po) au plus épais, les bouts amincis à <strong>10 à 13 mm</strong> (3/8 à ½ po).</p>
<p class="step"><span class="sn">46</span><strong>Finir au rabot ou au couteau croche</strong> à un peu plus de <strong>13 mm</strong> (½ po). Dresser un chant de chaque planche, et mettre les deux chants dressés ensemble : c’est le joint du milieu.</p>
<p class="step"><span class="sn">47</span><strong>Marquer la zone de pli de deux traits</strong> en travers, plier au genou pour essayer, et gratter la zone au couteau croche entre deux essais, jusqu’à ce qu’elle plie franchement.</p>
<p class="step"><span class="sn">48</span><strong>Tailler quatre ou cinq traverses</strong> dans des bâtons d’épinette de <strong>5 × 5 × 46 cm</strong> (2 × 2 × 18 po), finies à environ <strong>32 × 22 mm</strong> (1 ¼ × 7/8 po), et les faire <strong>sécher une nuit sous le poêle</strong> : des traverses sèches ne rétrécissent plus une fois ligaturées. Sous le poêle seulement si la main tient sous la tôle ; sinon, à côté, là où elle tient. Un bois chauffé longtemps sans s’enflammer se change en charbon, et ce charbon prend feu bien plus bas que le bois neuf (<span class="ref">ch. 82</span>, étape 3) : de l’épinette résineuse oubliée toute une nuit sous un poêle trop chaud, c’est le feu pendant que tout le monde dort.</p>
<p class="step"><span class="sn">49</span><strong>Le premier pli.</strong> Coincer une <strong>pince de deux bâtons</strong> liés serré en travers du bout de la planche : elle sert de poignée et tire toute la largeur en même temps, sans tordre. Passer la brosse d’eau bouillante sur <strong>les deux faces</strong> de la zone, tenir la planche à <strong>8 à 10 cm</strong> (3 à 4 po) du poêle chaud, puis la plier lentement sur le genou, entre les deux traits. Deux ou trois applications d’eau, un pli après chacune.</p>
<p class="step"><span class="sn">50</span><strong>Si la planche fend</strong>, arrêter tout de suite : percer un trou de chaque côté de la fente, y passer une ficelle mouillée et serrer. La fente s’arrête là. D’autres trous et d’autres ligatures plus loin si elle a couru.</p>
<p class="step"><span class="sn">51</span><strong>Lier les deux planches.</strong> Deux trous dans chaque planche à environ <strong>20 cm</strong> (8 po) du bout, une ligature qui les réunit, puis deux bâtons serrés à la ficelle en travers, environ <strong>60 cm</strong> (2 pi) plus bas, comme serre-joint.</p>
<p class="step"><span class="sn">52</span><strong>Poser les traverses, et noyer la ficelle.</strong> Chaque traverse sert de gabarit pour tracer sa place <strong>sous</strong> les planches. Elle se lie en <strong>quatre points</strong> : un à chaque bout, un de chaque côté du joint du milieu. À chaque point, deux trous, un de chaque côté de la traverse : la ficelle monte par l’un, passe par-dessus la traverse et redescend par l’autre. <strong>Sous le toboggan, tailler une rainure entre les deux trous</strong> : la ficelle s’y couche à fleur de bois et ne frotte jamais la neige. Une ficelle qui dépasse dessous s’use sur la neige et freine. Passer les boucles de ficelle, couper la traverse à largeur, tailler une <strong>encoche sous chaque bout</strong> de la traverse (étape 56), glisser la traverse dans ses boucles, serrer, nouer. Deux clous rabattus sur la ficelle, si on en a. Les deux premières traverses se posent ainsi : celle où commence la courbe, puis la suivante, à plat.</p>
<p class="step"><span class="sn">53</span><strong>La tête.</strong> Poser la traverse de tête au bout des planches pliées, un peu creusée du côté du toboggan. Puis mettre le toboggan à plat, s’agenouiller dessus, un pied contre la zone de pli, et tirer le haut vers soi jusqu’à la courbe voulue. L’attacher de la traverse de tête à la première traverse à plat, derrière la courbe, par <strong>deux liens doubles de chaque côté</strong>, en ficelle. Remettre de l’eau bouillante, rechauffer près du poêle, et reprendre le pli en tirant d’une main la tête et de l’autre les liens. La tête monte d’environ <strong>32 cm</strong> (12 ½ po) sur un toboggan de 2,4 m, et jusqu’à <strong>45 cm</strong> (18 po) sur les grands.</p>
<p class="step"><span class="sn">54</span><strong>Les liens de la tête sont permanents</strong>, et on les fait très forts : babiche tordue ou tendon, posés <strong>après la dernière eau chaude</strong>, qui cuit la babiche au lieu de l’assouplir (<span class="ref">ch. 103</span>, <span class="ref">§9</span>). Un bois cintré qui passe l’hiver dans la neige se remouille et cherche à se redresser : ces liens l’en empêchent.</p>
<p class="step"><span class="sn">55</span><strong>Les dernières traverses</strong>, vers le talon, de la même façon. Les dimensions d’un toboggan éprouvé : environ <strong>2,35 m</strong> (92 ½ po) hors tout, <strong>1,9 m</strong> (75 po) à plat sous la tête ; <strong>19 cm</strong> (7 ½ po) de large à la traverse de tête, <strong>30 cm</strong> (12 po) au milieu, <strong>20 cm</strong> (8 po) au talon. Les grands toboggans de charge, en planches plus larges, allaient jusqu’à <strong>46 cm</strong> (18 po) entre les deux premières traverses et se rétrécissaient à <strong>13 à 18 cm</strong> (5 à 7 po) au talon.</p>
<p class="step"><span class="sn">56</span><strong>La corde de côté.</strong> Une seule corde, en boucle. Elle part d’un bout de la traverse où commence la courbe, descend d’un côté en passant <strong>sous le bout de chaque traverse suivante</strong>, dans son encoche, jusqu’à la dernière, remonte de l’autre côté de la même façon, et revient se tendre et se nouer à la traverse de départ. Elle renforce les côtés et <strong>empêche les deux planches de glisser l’une contre l’autre</strong> dans les bosses. Seule la traverse de tête n’a pas d’encoches.</p>
<p class="step"><span class="sn">57</span><strong>Les traits.</strong> Deux cordes d’environ <strong>7,6 m</strong> (25 pi), une à chaque bout de la traverse de tête, nouées à la corde de côté, qui répartit la traction sur toutes les traverses ; ou une seule corde dont les deux bouts se nouent aux deux coins. Couper le talon à longueur, ligaturer toute fente qui y apparaît.</p>
<h3 class="sub">K. Tirer une charge (58 à 65)</h3>
<p class="step"><span class="sn">58</span><strong>Envelopper avant de charger.</strong> Étendre une toile ou une peau sur le toboggan, poser la charge dessus, rabattre, et attacher (nœud de camionneur, <span class="ref">ch. 109</span>). La neige et la glace ne touchent plus rien. Mettre le poids sur la partie qui porte au sol, jamais dans la tête.</p>
<p class="step pk-d"><span class="sn">59</span><strong>Sur la terre ferme, tirer de la poitrine, harnais lâche.</strong> Les deux bouts de la corde noués aux coins, le double de la corde contre la poitrine, ou un harnais ajusté large. <strong>Sur la glace, rien de tout ça, ni ceinture</strong> : chacun fait une boucle fermée autour du corps. La corde se tient à la main, ou se pose sur une seule épaule, les deux brins partant vers l’arrière du même côté : on baisse l’épaule, elle tombe (<span class="ref">§8</span>). Tirer fait suer : se découvrir avant de suer, se couvrir avant d’avoir froid à la halte, parce que la sueur dans les couches refroidit celui qui s’arrête (<span class="ref">ch. 58</span>, étape 21 ; <span class="ref">ch. 104</span>, <span class="ref">§8</span>.1).</p>
<p class="step pk-d"><span class="sn">60</span><strong>L’enfant voyage emmailloté dans une peau ou un sac de couchage</strong>, calé entre les paquets, avec sous lui une couche qui ne s’écrase pas : une peau avec son poil, un matelas, du sapinage. Un sac écrasé sous son poids n’isole plus rien du bas, et c’est par le bas qu’un corps immobile se vide (<span class="ref">ch. 25</span>, étape 6). Sur la glace, ni attaché, ni enfermé bras dedans (<span class="ref">§8</span>). Autrefois, chaque personne capable de marcher tirait son propre toboggan, plus petit pour les enfants : celui de six ans peut tirer le sien, à sa taille, avec une charge à sa mesure.</p>
<p class="step"><span class="sn">61</span><strong>Fossé :</strong> arrêter le toboggan au fond, avancer jusqu’au bout de la corde, et tirer d’un coup, à plusieurs si on est plusieurs.</p>
<p class="step"><span class="sn">62</span><strong>Virage en forêt :</strong> continuer tout droit jusqu’à ce que le toboggan arrive au point de virage, puis tourner. Tourner trop tôt le jette contre les arbres de l’intérieur.</p>
<p class="step"><span class="sn">63</span><strong>Montée raide :</strong> frapper une longue corde au toboggan, monter jusqu’au bout, le hisser, et l’<strong>ancrer</strong> à un arbre à chaque reprise avant de remonter. Longue pente raide : laisser le toboggan en bas et monter la charge sur le dos.</p>
<p class="step"><span class="sn">64</span><strong>Descente :</strong> quelqu’un derrière, sur une corde, retient pour que le toboggan ne rattrape pas ceux de devant. Descente courte en forêt : celui qui retient se place derrière un arbre et laisse filer. Pente en travers : ceux qui tiennent restent <strong>au-dessus</strong> du toboggan, le plus loin que la corde le permet. Très raide : on le descend au bout d’une longue corde. En descente, des brancards rigides valent mieux qu’une corde : une corde laisse la charge frapper les jambes (<span class="ref">ch. 15</span>).</p>
<p class="step"><span class="sn">65</span><strong>En file, celui qui ouvre la trace (étape 42) tire peu ou rien</strong> ; les charges lourdes suivent sur la trace déjà tapée.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:12.6%"><col style="width:17.7%"><col style="width:34.7%"><col style="width:35.1%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Choix de la bille</td><td>Pente du fil, lue sur la fente</td><td><strong>≤ 1 sur 15</strong> (2 cm sur 30 cm) ; aucun nœud dans la zone de pli</td><td>Bois de chauffage. Aucune technique ne rattrape un fil tordu</td></tr><tr><td class="c-item">Fût dégrossi</td><td>Section</td><td>Environ <strong>27 mm</strong> de haut ; <strong>11 mm</strong> d’épais à la pointe, <strong>14 mm</strong> au talon</td><td>Reprendre au couteau croche ; en bois vert, garder un peu de gras</td></tr><tr><td class="c-item">Assouplissement</td><td>Durée de chaleur mouillée</td><td><strong>½ h par 2,5 cm</strong> d’épaisseur en bois vert (environ 15 min pour un fût), <strong>1 h par 2,5 cm</strong> en bois sec</td><td>Le bois craque au premier essai : reprendre l’eau, ne pas forcer</td></tr><tr><td class="c-item">Pendant le pli</td><td>Face extérieure</td><td>Aucune écharde qui lève</td><td>Arrêter, rechauffer, poser la sangle</td></tr><tr><td class="c-item">Séchage dans la forme</td><td>Corde qui retient seule les deux bouts ; sur un gabarit à taquets, un taquet extérieur enlevé</td><td>Corde <strong>lâche</strong> d’elle-même ; fût qui ne bouge pas sans son taquet. De 1 à 3 jours (bouleau vert) à au moins une semaine</td><td>Laisser encore. Une pièce sortie trop tôt s’ouvre : la remettre dans la forme</td></tr><tr><td class="c-item">Pose des traverses</td><td>Écart ; équilibre</td><td><strong>38 à 41 cm</strong> ; talon plus lourd d’environ <strong>85 g</strong> : la queue descend quand on tient le centre</td><td>Déplacer les traverses <strong>avant</strong> de mortaiser</td></tr><tr><td class="c-item">Mortaise</td><td>Profondeur</td><td><strong>6 mm</strong></td><td>Plus profond affaiblit le fût ; moins, la traverse sort</td></tr><tr><td class="c-item">Queue</td><td>Fermeture</td><td>3 trous à <strong>10 cm</strong> du bout, ligature de babiche</td><td>Jamais de vis</td></tr><tr><td class="c-item">Laçage</td><td>Trou des orteils ; maille du centre ; cordon d’orteils</td><td><strong>10 cm</strong> de large ; maille d’environ <strong>2 cm</strong> ; <strong>5 ou 6</strong> passes</td><td>Relacer avant de sécher : sec, rien ne se reprend</td></tr><tr><td class="c-item">Après laçage</td><td>Séchage</td><td>Dehors, à plat, à l’ombre, <strong>3 à 4 jours</strong></td><td>Laçage mou au toucher : pas sec, attendre</td></tr><tr><td class="c-item">À chaque halte</td><td>Pieds dans l’attache</td><td>Orteils roses et chauds, qui bougent ; talon sans douleur</td><td>Froid mais sensible : desserrer, remuer les orteils, réchauffer le pied contre une peau chaude. Blanc ou insensible : gelure, <strong>ne pas frotter</strong> (<span class="ref">§7</span> ; <span class="ref">ch. 25</span>, étapes 15 à 21)</td></tr><tr><td class="c-item">Planches du toboggan</td><td>Épaisseur</td><td>Au sortir de la hache, <strong>16 mm</strong>, bouts à <strong>10 à 13 mm</strong> ; finies, un peu plus de <strong>13 mm</strong>, la zone de pli grattée plus mince</td><td>Gratter la zone de pli au couteau croche entre deux essais au genou, jusqu’à ce qu’elle plie franchement</td></tr><tr><td class="c-item">Tête du toboggan</td><td>Hauteur</td><td>Environ <strong>32 cm</strong> sur 2,4 m ; jusqu’à <strong>45 cm</strong></td><td>Reprendre l’eau chaude et le pli</td></tr><tr><td class="c-item">Dessous du toboggan</td><td>Ficelle</td><td>Couchée dans sa rainure, à fleur de bois</td><td>Recreuser la rainure avant la première sortie</td></tr><tr><td class="c-item">Avant chaque départ</td><td>Corde de côté, liens de la tête</td><td>Tendus ; les deux planches alignées ; la tête à sa hauteur</td><td>Retendre. Une tête qui s’ouvre est un lien qui a lâché</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:29.2%"><col style="width:26.9%"><col style="width:43.8%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Des échardes lèvent sur la face extérieure pendant le pli</td><td><strong>Rupture en traction</strong> : fil de travers, bois pas assez chaud, pli trop rapide</td><td>Grande écharde : on peut parfois la remettre en place et la ligaturer. Fût qui s’ouvre sur sa longueur : pièce perdue, en refaire une. La suivante se plie plus chaude, plus lentement, avec la sangle</td></tr><tr><td class="c-item">Un pli ou un bourrelet d’un chant à l’autre sur la face intérieure</td><td><strong>Rupture en compression</strong>, la plus bénigne : bois mal assoupli ou de mauvaise qualité</td><td>Bourrelet seul : l’araser au couteau et garder la pièce. Fibres séparées et gonflées de travers : pièce perdue</td></tr><tr><td class="c-item">La pièce fait un coude net à un endroit</td><td><strong>Un nœud</strong> : il ne se comprime pas, la courbe casse autour</td><td>Pièce perdue pour un fût. On choisit mieux la suivante (étape 2)</td></tr><tr><td class="c-item">Le fût s’ouvre quand on le sort de la forme</td><td>Sorti avant d’être sec</td><td>Le remettre dans la forme, rechauffer si nécessaire, et attendre que la corde des bouts soit lâche</td></tr><tr><td class="c-item">La queue fend autour de sa fixation</td><td>Vis, ou trous trop près du bout</td><td>Ligature de babiche seulement, trous à 10 cm du bout</td></tr><tr><td class="c-item">Le laçage a blanchi, s’est détendu, les mailles pendent</td><td>La babiche a bu l’eau de la neige mouillée</td><td>Sécher lentement, loin de la flamme. Si elle ne se retend pas en séchant, relacer (<span class="ref">ch. 103</span>)</td></tr><tr><td class="c-item">Une boule de neige colle sous le pied à chaque pas</td><td>Neige mouillée collée à la babiche</td><td>La frapper au bâton tout de suite. Au printemps, passer à la raquette de planche (<span class="ref">§9</span>)</td></tr><tr><td class="c-item">Orteils blancs, engourdis, qui ne se réchauffent pas en marchant</td><td><strong>Gelure qui commence</strong> : attache trop serrée, circulation coupée</td><td>Enlever l’attache. <strong>Ne pas frotter ni masser</strong> : la glace dans les tissus déchire les cellules quand on frotte. Réchauffer le pied contre une peau chaude, le ventre ou l’aisselle de quelqu’un d’autre, et seulement s’il ne regèlera pas avant l’abri (<span class="ref">ch. 25</span>, étapes 15 à 21). Régler l’attache plus lâche</td></tr><tr><td class="c-item">Sur un lac, la raquette s’alourdit d’un coup ; la trace fonce et se remplit d’eau derrière soi ; des taches sombres et affaissées dans la neige, parfois une tache d’où partent des bras comme des tentacules</td><td><strong>Eau sous la neige</strong> : le poids de la neige a enfoncé la glace, l’eau est remontée par les fissures. En plein hiver aussi, et elle peut dormir des semaines sous une neige épaisse (<span class="ref">ch. 58</span>, <span class="ref">§3</span> et <span class="ref">§7</span>)</td><td>Sortir vers la neige sèche ou la rive et contourner le secteur. Au sec, enlever tout de suite l’eau et la glace de la raquette et du dessous du toboggan, avant qu’elles prennent. Remettre le pied au sec : un pied mouillé à −35 °C gèle sans avertissement (<span class="ref">ch. 25</span>, bloc E ; <span class="ref">ch. 104</span>, <span class="ref">§8</span>.1)</td></tr><tr><td class="c-item">Douleur au tendon d’Achille après quelques kilomètres</td><td>Tour de talon trop serré</td><td>Relâcher le tour du talon</td></tr><tr><td class="c-item">Ongles d’orteils noirs, douloureux</td><td>Orteils enfoncés dans le trou à chaque pas</td><td>Les orteils ne descendent qu’en montée (étape 38)</td></tr><tr><td class="c-item">Bleu à la cheville, du côté intérieur</td><td>Le cadre de l’autre raquette la frappe</td><td>Pas plus écarté ; vérifier que la bouche est décalée du bon côté (étape 23)</td></tr><tr><td class="c-item">La tête du toboggan s’est ouverte</td><td>Liens de la tête lâches, bois remouillé</td><td>Retendre les liens de la tête, mouillés, pour qu’ils serrent en séchant</td></tr><tr><td class="c-item">Les deux planches glissent l’une contre l’autre dans les bosses</td><td>Corde de côté lâche ou cassée</td><td>Retendre ou refaire la corde de côté</td></tr><tr><td class="c-item">La ficelle est usée ou coupée sous le toboggan</td><td>Pas noyée dans sa rainure</td><td>Recreuser la rainure, reficeler</td></tr><tr><td class="c-item">La babiche est rongée, trouée</td><td>Chiens ou rongeurs</td><td>Pendre haut et loin ; relacer la zone</td></tr></tbody></table>

<p class="pt"><span class="pn">1</span><strong class="plead">L’enfant sur le toboggan refroidit pendant que celui qui tire a chaud.</strong> Celui qui tire transpire et trouve qu’il fait doux ; l’enfant, immobile, ne produit presque pas de chaleur, et son petit corps en perd plus vite qu’un adulte (<span class="ref">ch. 25</span>, bloc F ; <span class="ref">ch. 39</span>). Le blessé couché sur le toboggan aussi, et plus encore (<span class="ref">ch. 26</span>). La sensation de celui qui tire est donc exactement le mauvais thermomètre. Et un enfant qui refroidit <strong>devient tranquille</strong> : emmitouflé sur la charge, il a l’air de dormir. Sous lui, une peau avec son poil ou du sapinage : un sac écrasé n’isole plus du bas (étape 60). On s’arrête pour lui <strong>à intervalle fixe, décidé avant de partir</strong>, pas quand celui qui tire a envie de souffler (<span class="ref">ch. 25</span>, étape 34 ; <span class="ref">ch. 15</span>, étape 25). Sur un lac, c’est le vent qui fait le froid : à un indice de −40, la peau nue gèle en 5 à 10 minutes (<span class="ref">ch. 25</span>, tableau du refroidissement éolien). Joues, oreilles, doigts, et est-ce qu’il répond. Pas l’air qu’il a : sa réponse.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Sur la glace, rien ne doit rester attaché à ce qui coule.</strong> Un toboggan qui passe à travers la glace tire vers le fond celui qui le traîne par une ceinture bouclée. Une raquette qui ne se défait pas garde au pied une grande palette qui accroche le bord de la glace et empêche de battre des jambes pour remonter à l’horizontale (<span class="ref">ch. 15</span>, étape 34). Dans l’eau, tout ce qui fait une boucle fermée autour du corps retient comme une attache : un harnais, une corde en bandoulière, le double de la corde contre la poitrine, une sangle, un sac de couchage fermé sur les bras. La traction vient de l’arrière et du bas, et elle serre la boucle au lieu de la faire glisser. Sur la glace, donc : la corde de tire tenue à la main, ou posée sur une seule épaule, les deux brins vers l’arrière, pour tomber quand on baisse l’épaule ; les brancards tenus à la main, jamais liés au corps ; la ceinture du sac à dos détachée ; les pics à glace au cou (<span class="ref">ch. 15</span>, Matériel). L’enfant n’est ni attaché, ni sous la charge lacée, ni enfermé bras dedans : le sac reste ouvert, les bras libres pour saisir le bord ou la perche tendue (<span class="ref">ch. 25</span>, étape 26), ou bien il traverse à pied, dans la trace. Le blessé sanglé au toboggan (<span class="ref">ch. 26</span>) : on défait ses sangles le temps de traverser, ou on contourne le lac. Aux raquettes, seule une attache dont le pied sort sans les mains : la lanière, qui s’enfile et s’enlève d’un mouvement du pied, réglée assez lâche pour sortir d’un tour de cheville. Une boucle, une sangle ou une bande de chambre à air s’ouvre à la main : on l’essaie sur la rive, et si le pied n’en sort pas d’un tour de cheville, on traverse sans raquettes, dans la trace, ou on contourne. Et la glace se mesure avant, raquettes ou pas (<span class="ref">ch. 15</span>, étapes 20 à 23). En plein froid, de l’eau peut aussi dormir sous la neige d’un lac et tremper le pied sans prévenir (<span class="ref">§7</span>).</p>
<p class="pt"><span class="pn">3</span><strong class="plead">Dans une pente, la charge va plus vite que soi.</strong> Un toboggan chargé, retenu par une corde dans le dos de celui qui tire, le rattrape, lui fauche les jambes et le renverse devant lui. Une jambe cassée à une journée du chalet, en février, n’est plus une blessure, c’est une nuit dehors. En descente, toujours quelqu’un derrière sur une corde, ou des brancards rigides, et personne en bas de la trajectoire (étape 64).</p>
<p class="pt"><span class="pn">4</span><strong class="plead">La neige brûle les yeux, et ça ne se sent que des heures plus tard.</strong> Le soleil renvoyé par la neige brûle la surface de l’œil pendant la marche, sans douleur sur le moment : c’est le coup d’arc du soudeur, donné par la neige. Six à douze heures plus tard, les yeux piquent comme pleins de sable, pleurent, rougissent, font mal à chaque mouvement et ne supportent plus la lumière. C’est au pire après une neige fraîche, et même quand une brume légère voile le soleil : se croire à l’abri parce que le soleil est voilé est le mauvais réflexe. Attendre d’avoir mal pour se protéger, c’est trop tard : la brûlure est déjà faite. Sur un lac ou dans la neige du printemps, des verres foncés ou des lunettes à fente (<span class="ref">§9</span>) dès le départ. Atteint : un bandeau sur les yeux ou un linge mouillé, qui arrête le mouvement des yeux, et du repos. Ça guérit en un à deux jours, parfois quelques-uns, sans séquelle, si on ne s’y expose plus.</p>
