<p class="p0">Sans pharmacie, sans rien d’acheté, sans personne qui vient. C’est ici que le chapitre sert.</p>
<h3 class="sub">9-A. Les serviettes qu’on coud, et la sphaigne</h3>
<p class="p0 ri"><strong class="runin">La serviette cousue.</strong> Trois parties, qui se lavent et sèchent séparément.</p>
<p class="li"><strong>L’enveloppe</strong> : une bande de flanelle de coton de la largeur de l’entrejambe de la culotte, un peu plus longue qu’elle devant et derrière, doublée dessous d’un tissu qui ne laisse pas passer l’humidité : le nylon enduit d’un vieil imperméable ou d’une toile de tente déchirée. Deux ailes qui se replient sous la culotte et se ferment d’un bouton-pression, d’un bouton ou d’une épingle de sûreté. La doublure se coud sur le pourtour seulement, pour ne pas la percer au milieu.</p>
<p class="li"><strong>L’âme</strong> : plusieurs épaisseurs de flanelle, de vieille couche ou de drap, pliées en rectangle et glissées dans l’enveloppe. Plus d’épaisseurs la nuit et pour les pertes après l’accouchement. Une âme séparée se déplie pour sécher, là où une serviette cousue épaisse garde l’humidité au centre.</p>
<p class="li"><strong>Sans culotte</strong> : une ceinture de corde ou d’élastique à la taille, et la serviette tenue devant et derrière par deux épingles.</p>
<p>On en coud au moins cinq par femme. La flanelle d’une chemise usée fait l’affaire. Ce qui compte est la couleur pâle, qui montre si la tache est partie au lavage.</p>
<p class="p0 ri"><strong class="runin">La sphaigne.</strong> C’est l’absorbant qui ne s’achète pas. Les Cris et les Dénés du Nord en garnissaient les couches des bébés, et plusieurs peuples du Nord en faisaient aussi les serviettes des femmes et une réserve d’hiver. Elle retient <strong>15 à 22 fois son poids sec</strong>.</p>
<p class="step"><span class="sn">1</span><strong>Choisir.</strong> La longue sphaigne <strong>pâle</strong> — blanchâtre, jaunâtre, à peine rosée — du dessus des buttes, pas celle des creux mouillés, qui absorbe moins. <strong>Jamais la sphaigne rouge</strong> : les peuples qui se servaient de la mousse l’écartaient presque tous, parce qu’elle passait pour irriter la peau et donner des plaies.</p>
<p class="step"><span class="sn">2</span><strong>Cueillir en août</strong>, avec des gants, à pleines mains (<span class="ref">ch. 31</span>, « Le papier hygiénique devient de la sphaigne »). Un champignon de la sphaigne entre par la moindre égratignure de la main et y fait, une à douze semaines plus tard, une petite bosse indolore qui ressemble à une piqûre d’insecte, puis d’autres bosses qui s’ouvrent comme des furoncles et guérissent très lentement ; il ne se soigne qu’avec un médicament d’ordonnance. Les gants règlent la question.</p>
<p class="step"><span class="sn">3</span><strong>Débarrasser</strong> des brindilles, des aiguilles et des bestioles ; étendre sur une toile au soleil, ou pendre, jusqu’à ce que les insectes l’aient quittée ; finir de sécher au-dessus du poêle.</p>
<p class="step"><span class="sn">4</span><strong>Garder</strong> au sec, dans un sac de jute.</p>
<p class="step"><span class="sn">5</span><strong>Employer</strong> : une poignée tassée dans un sachet de coton bouilli, cousu ou noué, qui prend la place de l’âme dans l’enveloppe. <strong>Jamais la mousse nue contre la peau, jamais contre une déchirure ou une plaie</strong> : le champignon de l’étape 2 entre par là. Après un accouchement, pas de sphaigne tant que le périnée n’est pas guéri (étape 73) ; de la flanelle bouillie jusque-là. Le sachet mouillé se vide au feu ; le coton se lave comme le reste.</p>
<p class="step"><span class="sn">6</span><strong>Les couches du bébé</strong> se font de la même façon. La mousse pâle était jugée meilleure que le tissu contre les rougeurs de couche.</p>
<p><em>Ce qu’on perd</em> : la sphaigne sert une fois ; il en faut des sacs pour un hiver, et elle moisit si on la range humide. La flanelle s’use en <strong>un an</strong> environ. Et la serviette qui n’est pas complètement sèche irrite : au chalet l’hiver, c’est le poêle qui décide combien il en faut, parce qu’une âme mouillée ne sèche pas dans une pièce froide.</p>
<h3 class="sub">9-B. Le collier des jours</h3>
<p class="p0">Un collier qui remplace le calendrier et le crayon, et qui se lit au toucher dans le noir.</p>
<p class="step"><span class="sn">1</span><strong>Trente-deux marques</strong> sur une cordelette fermée en boucle : des perles, des rondelles de bois percées, des bouts d’os, ou simplement des nœuds.</p>
<p class="step"><span class="sn">2</span><strong>La marque 1</strong> se distingue de toutes les autres : une perle rouge, un bout de cuivre, un nœud triple. C’est le premier jour des règles. Pour que le sens se sente dans le noir, sa voisine du côté où l’anneau avance, la marque 2, se distingue de la 32, sa voisine de l’autre côté : une perle plus petite, ou un bout de fil qui pend du nœud.</p>
<p class="step"><span class="sn">3</span><strong>Les marques 2 à 7</strong>, et <strong>20 à 32</strong> : des jours où le risque est faible, tous pareils — perles brunes, nœuds simples.</p>
<p class="step"><span class="sn">4</span><strong>Les marques 8 à 19</strong> : les douze jours fertiles, d’une autre sorte qui se sent sous les doigts — perles blanches, nœuds doubles.</p>
<p class="step"><span class="sn">5</span><strong>La marque 27</strong> se distingue aussi, un nœud plus gros ou une perle plus foncée : c’est le premier jour où les règles ont le droit de revenir.</p>
<p class="step"><span class="sn">6</span><strong>Un anneau qui glisse</strong> : une rondelle de métal, une bague de caoutchouc de pot, une boucle de fil de laiton.</p>
<p class="step"><span class="sn">7</span><strong>Chaque matin</strong>, l’anneau avance d’une marque, jours de saignement compris. Au premier jour des règles, il retourne à la marque 1.</p>
<p class="step"><span class="sn">8</span><strong>La vérification</strong> : si les règles reviennent avant que l’anneau touche la marque 27, le cycle a duré moins de 26 jours ; si elles ne sont pas revenues le lendemain de la marque 32, il a dépassé 32 jours. Chaque cycle hors plage se marque sur le collier même, pas dans la mémoire : un nœud d’arrêt sur un fil noué à la marque 1, fil qui se refait à neuf au premier de l’an. Au troisième nœud, le collier ne protège plus assez, et c’est la méthode des deux jours qui prend le relais.</p>
<p><em>Ce qu’on perd</em> : douze jours par cycle sans relation ou avec condom, et <strong>12 grossesses sur 100 femmes</strong> par année telle que la méthode se suit d’habitude. Il ne vaut rien après un accouchement, pendant l’allaitement ou pendant une disette, tant que le cycle n’est pas redevenu régulier.</p>
<h3 class="sub">9-C. Le nécessaire d’accouchement quand rien n’est prêt</h3>
<p class="li"><strong>Les liens</strong> : lacets de coton, ficelle, bandes de drap déchirées. Au chalet, sans four, ils bouillent <strong>20 minutes</strong> comptées à partir du bouillon, dans un chaudron à couvercle, et sortent à la fourchette bouillie aussi. Bouillir <strong>désinfecte</strong> : ça tue presque tous les germes, pas tous. Ce qui peut survivre, ce sont les spores, et celle du tétanos en est une : elle survit 10 à 15 minutes à 121 °C, plus chaud que l’eau qui bout. Pour couper le cordon, une lame et des liens désinfectés ainsi font l’affaire ; le vaccin de la mère (étape 21) couvre ce que l’ébullition laisse passer.</p>
<p class="li"><strong>La lame</strong> : une lame de rasoir neuve dans son papier, un couteau d’office bouilli 20 minutes. Une lame qu’on ne peut pas faire bouillir se passe au rouge dans la flamme, comme l’aiguille du <span class="ref">ch. 26</span>, section 9 — tout le tranchant, pas seulement la pointe —, et refroidit à l’air sans qu’on l’essuie. Le rouge tue ce que l’ébullition laisse, spores comprises ; une lame seulement noircie n’a pas été assez chauffée. Rien n’oblige à couper le cordon vite quand le bébé respire : le temps de faire bouillir la lame existe, et on peut attendre le placenta. Pour le bébé à ranimer, il faut au contraire que lien et lame soient prêts avant la naissance.</p>
<p class="li"><strong>Le cornet</strong>, pour écouter le cœur du bébé (étape 23) : un tube creux, de bois ou d’argile, dont un bout se pose sur le ventre et l’autre contre l’oreille. À défaut, l’oreille nue sur le ventre, dans une pièce où tout se tait.</p>
<p class="li"><strong>Les gants</strong> : des sacs de plastique propres, retournés, qu’on ne touche qu’à l’intérieur ; à défaut, les mains frottées au savon jusqu’aux coudes et les ongles coupés ras.</p>
<p class="li"><strong>Le dessous</strong> : des sacs à ordures ouverts, recouverts de draps bouillis ; des sacs de jute ou des guenilles bouillis et séchés.</p>
<p class="li"><strong>Le bonnet</strong> : la manche d’un chandail de laine nouée au bout, un bas de laine. Les serviettes réchauffées sur le poêle. Le coin chaud fermé de couvertures suspendues.</p>
<p class="li"><strong>La poire</strong> : presque jamais nécessaire. Pour un bébé mou né dans des eaux teintées de vert ou de jaune, un petit pot, un bouchon percé de deux trous et deux tubes fins et souples, bouillis : l’un va jusqu’au fond du pot, l’autre juste sous le bouchon. Le premier entre dans la bouche du bébé, <strong>pas plus de 10 cm</strong> ; on aspire par le second, et les glaires tombent dans le pot. La poire de caoutchouc vaut mieux que ce piège, qui met la bouche de l’aide en jeu.</p>
<h3 class="sub">9-D. L’accouchement seule</h3>
<p class="p0">Une femme qui accouche seule a les mêmes étapes et une paire de mains de moins. Tout se prépare pour que rien ne manque à portée de bras.</p>
<p class="step"><span class="sn">1</span><strong>Dès les contractions régulières</strong> : le poêle chargé et le coffre à bois plein — personne ne va fendre pendant les heures qui viennent —, la pièce qui monte vers 25 °C, une lampe frontale sur la tête. Si le chalet a une balise ou une messagerie satellite, c’est le moment de s’en servir, pas après (<span class="ref">ch. 14</span>).</p>
<p class="step"><span class="sn">2</span><strong>À portée de bras, sur un linge propre</strong> : les deux serviettes et le bonnet au chaud, la boîte des liens et de la lame, le bol, de l’eau et de la boisson, des linges, une toile et un drap sous elle.</p>
<p class="step"><span class="sn">3</span><strong>Boire, uriner, bouger</strong> comme en 5-E, étape 37.</p>
<p class="step"><span class="sn">4</span><strong>Pour la naissance</strong> : accroupie, le dos appuyé contre le lit, sur la toile : le bassin s’ouvre et la pesanteur aide le bébé à descendre. À quatre pattes si le travail se sent dans le dos, ou si les épaules coincent. C’est la position où elle se sent bien qui est la bonne ; pas à plat sur le dos, qui écrase les vaisseaux du bébé, sauf s’il arrive très vite.</p>
<p class="step"><span class="sn">5</span><strong>Souffler au couronnement</strong> pour que la tête sorte lentement. Une main sous la tête qui sort, sans tirer.</p>
<p class="step"><span class="sn">6</span><strong>Le bébé tout de suite sur sa poitrine</strong>, séché, la serviette mouillée jetée, la deuxième par-dessus, le bonnet. Se couvrir tous les deux d’une couverture.</p>
<p class="step"><span class="sn">7</span><strong>S’il ne respire pas</strong> : frotter le dos. Puis le coucher sur le lit entre ses genoux, à plat sur le linge chaud, la tête vers elle, et souffler comme en 5-F : <strong>le cordon peut rester attaché</strong> s’il est assez long. Si la poitrine ne se soulève pas quand elle souffle, elle replace la tête, dégage la bouche, et, si ça ne suffit pas, noue et coupe le cordon : les liens et la lame sont à portée de bras (étape 2).</p>
<p class="step"><span class="sn">8</span><strong>Ne pas couper le cordon</strong> : rien ne presse. Elle le nouera et le coupera après le placenta, les mains libres.</p>
<p class="step"><span class="sn">9</span><strong>Le mettre au sein tout de suite.</strong> C’est ce qui fait sortir le placenta et ce qui la protège de l’hémorragie, et c’est le seul de ses gestes qui fait les deux.</p>
<p class="step"><span class="sn">10</span><strong>Le placenta</strong> : accroupie au-dessus du bol quand il vient ; ne pas tirer.</p>
<p class="step"><span class="sn">11</span><strong>Frotter son propre utérus</strong>, couchée ou accroupie, fort, sur le bas du ventre, jusqu’à le sentir dur ; y revenir aux quelques minutes la première heure. <strong>Uriner</strong> dans le bol, sur le lit.</p>
<p class="step"><span class="sn">12</span><strong>Boire, manger, rester au chaud avec le bébé contre elle.</strong></p>
<p><em>Ce qu’on perd</em> : la deuxième paire de mains. Seule, elle ne peut pas se faire une compression à deux mains ni une compression de l’aorte ; si le frottement, la tétée et la vessie vide n’arrêtent pas le saignement, rien d’autre ne l’arrêtera ici. C’est pour ça que, pour un deuxième bébé ou les suivants, qui viennent vite, un adulte ne quitte pas le chalet les dernières semaines.</p>
<h3 class="sub">9-E. Nourrir le bébé quand le sein ne suffit pas</h3>
<p class="li"><strong>Le lait de la mère à la tasse.</strong> Exprimé à la main (étape 84), donné à la petite tasse ou à la cuillère, quelques jours, le temps qu’une crevasse guérisse ou que le bébé apprenne à prendre le sein.</p>
<p class="li"><strong>Une autre femme qui allaite</strong> peut nourrir le bébé : c’est le meilleur remplaçant qui existe.</p>
<p class="li"><strong>La préparation commerciale</strong>, s’il y en a : exactement comme l’étiquette le dit. Allonger le lait pour qu’il dure plus longtemps affame le bébé ; une tasse ou une tétine sale le tue.</p>
<p class="li"><strong>Le lait de chèvre ou de vache frais</strong>, en dernier recours : <strong>100 mL de lait, 50 mL d’eau propre, 10 g de sucre</strong> (deux cuillères à thé), portés à ébullition, refroidis, donnés tout de suite. Tout ce qui touche le lait — tasse, cuillère, contenant — bout <strong>20 minutes</strong> avant chaque usage ; rien ne reste plus de <strong>2 heures</strong> à la température de la pièce. Le lait cru ne se donne jamais (<span class="ref">ch. 101</span>). <strong>L’eau propre n’est jamais celle d’un puits qui n’a pas été analysé</strong> : le nitrate y est invisible, il empêche le sang du bébé de porter l’oxygène, surtout avant 3 mois, et l’ébullition le concentre au lieu de l’enlever (<span class="ref">ch. 10</span>, section 8). C’est le geste qui rassure et qui empire. <em>Ce qu’on perd</em> : la protection contre les infections que donne le lait maternel, et des vitamines que le lait animal n’a pas. La vitamine C d’abord : c’est ainsi que se faisait le scorbut du nourrisson (<span class="ref">ch. 20</span>), vers <strong>5 ou 6 mois</strong>, quand les réserves venues de la mère sont épuisées. Le bébé est irritable, crie quand on lui touche les jambes, ne les bouge plus et les garde repliées en grenouille ; ses gencives saignent autour des dents qui percent. Ce qui le prévient avant 6 mois : le lait maternel, ou une préparation commerciale, qui en est enrichie. Le lait fait maison n’en a presque pas. <strong>7 mg de vitamine C par jour</strong> suffisent à empêcher le scorbut ; un bébé au sein en reçoit environ 40. Sans autre source : un comprimé de 500 mg (<span class="ref">ch. 20</span>) dissous dans 100 mL d’eau bouillie refroidie, <strong>8 mL par jour</strong> à la seringue orale ou à la cuillère, le reste jeté ; jamais plus que ce que donnerait le sein. Le fer manque aussi : jusque vers 6 mois, le bébé vit sur les réserves de sa naissance, et le lait animal n’en ajoute presque pas. Le lait fait maison demande un supplément de vitamines et minéraux pour nourrisson : fer, zinc, vitamines A et C, acide folique ; le lait de chèvre manque surtout d’acide folique. Il manque aussi la vitamine D (étape 78). Le bébé nourri ainsi a besoin d’autres aliments dès 6 mois, riches en fer d’abord : la viande, au moins deux fois par jour ; un manque de fer à cet âge peut abîmer le cerveau pour de bon.</p>
<h3 class="sub">9-F. Ce qui ne se remplace pas</h3>
<p class="li"><strong>La salle d’opération.</strong> Le bébé en travers, la tête qui ne passe pas le bassin, l’utérus déchiré, le placenta posé devant le col : aucun geste ne remplace l’opération (<span class="ref">ch. 35</span>). Le placenta qui ne se décolle pas pendant que la mère saigne a un dernier geste, dangereux, en 9-G.</p>
<p class="li"><strong>Le sang perdu.</strong> Aucune boisson ne le remplace (<span class="ref">ch. 26</span>). On le garde dans le corps ou on ne l’a plus.</p>
<p class="li"><strong>L’antibiotique</strong> d’une infection de l’utérus ou d’un abcès du sein. Aucune plante ne le remplace, et aucune ne remplace non plus le misoprostol : ce qui arrête le sang au chalet, ce sont les mains et le sein.</p>
<p class="li"><strong>L’injection de vitamine K.</strong> La vitamine K par la bouche protège moins bien ; sans rien, on surveille.</p>
<p class="li"><strong>La contraception posée d’avance.</strong> Ce qui se fait avec rien — collier, deux jours, retrait — laisse, tel qu’on le suit d’habitude, de 12 à 20 grossesses sur 100 femmes par année. Seule la méthode de la température avec la glaire descend à 2, au prix d’une discipline de chaque matin ; et l’allaitement, à 2 aussi, pour six mois au plus.</p>
<h3 class="sub">9-G. Les gestes de dernier recours</h3>
<p class="p0">Ces gestes font mal, portent l’infection jusque dans l’utérus, et peuvent tuer. Ils ne se font que si, sans eux, la mère ou le bébé meurt avant qu’une route s’ouvre. Pour chacun : mains et bras frottés au savon et à l’eau bouillie jusqu’aux coudes, ongles ras, gants (9-C), et on ne touche plus rien d’autre que le bébé, le cordon et l’intérieur de la mère. Après, l’infection de l’utérus est à craindre (section 7 ; section 8, point 6), et l’antibiotique qui la prévient manque (<span class="ref">ch. 32</span>).</p>
<p class="p0 ri"><strong class="runin">Le siège.</strong> Les fesses d’abord ; par un pied, pareil, la mère couchée, parce que couchée, le cordon descend moins.</p>
<p class="step"><span class="sn">1</span><strong>Aucune poussée avant le col tout à fait ouvert.</strong> Même quand l’envie est forte, attendre encore quelques contractions : le corps, plus petit que la tête, passe un col pas tout à fait ouvert, qui retient ensuite la tête.</p>
<p class="step"><span class="sn">2</span><strong>Rien ne se tire.</strong> Les fesses et le ventre sortent seuls, les jambes aussi d’ordinaire. Si elles ne viennent pas, les doigts entrent et les abaissent doucement, sans tirer sur le bébé. On dégage un peu de cordon en le tirant doucement hors du vagin, et on n’y touche plus.</p>
<p class="step"><span class="sn">3</span><strong>Envelopper le corps</strong> dans un linge chaud dès qu’il sort, et le garder enveloppé jusqu’au bout : s’il a froid, il cherche à respirer dedans, et ses poumons se remplissent de liquide.</p>
<p class="step"><span class="sn">4</span><strong>Le tenir par les hanches ou plus bas</strong>, jamais par le ventre ni le dos : la pression y blesse ses organes. Quelqu’un appuie juste au-dessus de l’os du pubis de la mère — pas sur le ventre — pour garder la tête du bébé fléchie, pas pour le pousser.</p>
<p class="step"><span class="sn">5</span><strong>Les épaules.</strong> On abaisse doucement le corps pour dégager l’épaule du dessus. Si elle ne vient pas, les doigts entrent, trouvent l’épaule, suivent le bras jusqu’au coude et le ramènent en travers de la poitrine en tirant doucement sur le coude. Puis on relève doucement le corps pour l’épaule du dessous et son bras.</p>
<p class="step"><span class="sn">6</span><strong>La tête dernière, le moment qui tue.</strong> Le bébé se tourne face au dos de la mère. Il repose sur l’avant-bras de l’aide, un doigt de cette main dans sa bouche ; l’autre main sur ses épaules, un doigt sur l’arrière de la tête, qui la garde fléchie, le menton contre la poitrine : c’est comme ça qu’elle passe le bassin. On abaisse le corps jusqu’à voir les cheveux de la nuque. <strong>Jamais tirer fort, jamais plier le cou : il casse.</strong> Puis, la tête toujours fléchie, on relève le corps vers le ventre de la mère pour dégager le visage, l’arrière de la tête encore dedans. La mère arrête de pousser et souffle, et la tête sort <strong>le plus lentement possible</strong> : trop vite, elle saigne dans le cerveau ; trop longtemps coincée, le cordon pincé entre la tête et le bassin le prive d’air.</p>
<p class="p0 ri"><strong class="runin">Les épaules qui ne sortent toujours pas</strong>, après les quatre essais de l’étape 43. Loin de tout, casser la clavicule du bébé vaut mieux que le laisser mourir : un doigt entre, accroche la clavicule, tire vers la tête du bébé et la casse. Il faut beaucoup de force.</p>
<p class="p0 ri"><strong class="runin">Le placenta qui ne vient pas, pendant qu’elle saigne à en mourir.</strong> C’est le seul moyen de lui sauver la vie, et il est dangereux : infection grave, col, placenta ou utérus déchirés et saignement pire, et une douleur qui peut à elle seule la faire tomber en choc.</p>
<p class="step"><span class="sn">1</span>Une main tient le cordon. L’autre, les doigts et le pouce serrés en cône, suit le cordon dans le vagin : la main entière y entre. Le placenta y est peut-être déjà décollé, posé au fond : on le sort, et on frotte l’utérus jusqu’à ce qu’il durcisse.</p>
<p class="step"><span class="sn">2</span>Encore collé : la main du dehors monte sur le ventre et soutient l’utérus ; celle du dedans suit le cordon jusque dans l’utérus, trouve la paroi, puis le bord du placenta. Quelqu’un la tient et la fait respirer à fond.</p>
<p class="step"><span class="sn">3</span>Le côté du petit doigt décolle le bord de la paroi ; puis les doigts glissent entre le placenta et la paroi et le pèlent, comme on pèle une orange à peau épaisse. Il sort dans le creux de la main, sans laisser de morceau ni de caillot.</p>
<p class="step"><span class="sn">4</span>Frotter l’utérus, ou la compression à deux mains (étape 67) s’il reste mou. Puis le choc : la tête basse, les hanches et les jambes hautes, boire (étape 69).</p>
<p class="p0 ri"><strong class="runin">Un morceau resté dedans, et elle saigne à en mourir.</strong> Une compresse stérile repliée sur les doigts : l’utérus est glissant, et la compresse ramasse les petits morceaux. Mieux, une bande de tissu solide nouée d’une ficelle, stérilisée d’avance dans le paquet (étape 28), dont la ficelle reste dehors. Les doigts entrent dans l’utérus et essuient les morceaux de placenta et de membranes. Un tissu qui s’effiloche laisse des bouts dedans : du solide seulement. C’est très douloureux, et on lui dit pourquoi : un morceau qui reste empêche l’utérus de se serrer.</p>
<p class="p0 ri"><strong class="runin">L’utérus retourné.</strong> Rarement, il suit le placenta hors du corps, retourné comme un gant : après une traction sur le cordon ou une poussée sur le ventre, ou tout seul, sans que personne ait mal fait. Il saigne fort ; vite, mais calmement. On le remet par le vagin et le col, <strong>la partie la plus proche du col d’abord</strong>, le fond de l’utérus en dernier, sans forcer ; s’il ne rentre pas, on le roule avec les doigts. S’il ne rentre toujours pas, on le met au moins dans le vagin. Puis frotter jusqu’à ce qu’il durcisse, la compression à deux mains au besoin ; elle se couche sur le dos, une couverture pliée sous les hanches. Choc (étape 69).</p>
<p><em>Ce qu’on perd</em> : tout ce qui rend ces gestes moins dangereux ailleurs, l’antibiotique qui les suit et le sang qui remplace celui qu’elle a perdu. Mais ici, la mère qui saigne à mort et le bébé coincé n’ont pas d’autre issue.</p>

<p class="fn" data-fn="29-1"><span class="fnn">1</span>La glaire cervicale : une humidité qu’on sent à la vulve ou qu’on voit sur les doigts, sur la culotte ou sur un papier essuyé à l’extérieur du vagin. Les jours fertiles, elle devient claire, glissante et élastique, comme du blanc d’œuf cru ; les jours secs, on ne voit et on ne sent rien.</p>
<p class="fn" data-fn="29-2"><span class="fnn">2</span>Le choc toxique vient vite, pendant les règles avec un tampon ou une coupe, et aussi après un accouchement : forte fièvre, ou chaud et froid avec des frissons ; mal dans les muscles, comme une grippe ; vomissements et diarrhée ; une rougeur de la peau rugueuse comme du papier sablé ; les paumes, la plante des pieds, la langue et le blanc des yeux qui deviennent rouge vif ; étourdie, confuse. La peau peut enfler ou peler par grandes plaques.</p>
<p class="fn" data-fn="29-3"><span class="fnn">3</span>Un saignement de carence en vitamine K : un saignement qu’on n’attendait pas et qui ne s’arrête pas — au cordon, à une égratignure —, du sang dans les selles ou dans ce que le bébé vomit, des bleus sans coup. La forme tardive, entre 2 et 12 semaines, touche presque seulement les bébés allaités et saigne une fois sur deux dans le cerveau, où rien ne se voit : c’est pour ça que la vitamine se donne d’avance au lieu d’attendre un signe.</p>
<p class="fn" data-fn="29-4"><span class="fnn">4</span>La grossesse hors de l’utérus s’implante ailleurs, le plus souvent dans une trompe. Au début, peu ou pas de signes, puis ils deviennent graves : une douleur au ventre qui n’est pas celle des règles, ou un ventre sensible au toucher, souvent d’un seul côté ; un saignement différent des règles habituelles, ou pas de règles du tout ; des étourdissements ; un évanouissement ; parfois une douleur aux épaules. C’est l’ensemble qui fait penser à elle, pas un signe seul. Quand la trompe se déchire, la douleur devient soudaine et aiguë, en coup de couteau au bas du ventre, d’un côté ou partout ; le sang qui coule dans le ventre peut donner mal à l’épaule droite en appuyant sous les côtes, et en quelques heures le ventre devient dur et elle tombe en choc.</p>
<p class="fn" data-fn="29-5"><span class="fnn">5</span>La prééclampsie se remarque à des maux de tête sévères, à une douleur qui serre le haut du ventre sous les côtes comme une barre, à une vue qui change d’un coup, et à une enflure qui devient générale : les jambes, mais aussi les mains et le visage. Elle peut mener à des convulsions : yeux qui roulent, visage et mains qui tressautent, corps raide ou secoué, peau bleue, perte de conscience, parfois la langue mordue, l’urine ou les selles qui partent ; puis un sommeil, et au réveil une confusion.</p>
<p class="fn" data-fn="29-6"><span class="fnn">6</span>Le tirage : à chaque inspiration, la peau entre les côtes et sous le sternum se creuse vers l’intérieur, parce que le bébé force pour faire entrer l’air.</p>
</template>

  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
