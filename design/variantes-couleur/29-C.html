<p class="p0">La colonne de droite est la vraie. L’écart entre les deux colonnes, c’est la fatigue, l’envie et la nuit où on se dit que ce jour-là ne compte pas.</p>
<h3 class="sub">C — La grossesse</h3>
<p class="step pk-t"><span class="sn">19</span><strong>Compter.</strong> La date prévue tombe <strong>280 jours</strong> (40 semaines) après le premier jour des dernières règles. Le bébé est à terme de <strong>37 à 42 semaines</strong>, et la plupart naissent entre 39 et 41. Sans échographie, la date est approximative : c’est pour ça que tout ce qui est en 5-D est prêt à 37 semaines.</p>
<p class="step"><span class="sn">20</span><strong>Manger un repas de plus, surtout du gras et des glucides.</strong> Il faut <strong>340 kcal</strong> de plus par jour au deuxième trimestre, <strong>452 kcal</strong> au troisième, puis <strong>330 kcal</strong> pendant les six premiers mois d’allaitement et <strong>400 kcal</strong> après. À 9 kcal le gramme, c’est l’équivalent d’environ <strong>38 g de gras pur</strong> par jour au deuxième trimestre et <strong>50 g</strong> au troisième. Les protéines, elles, ne montent qu’à <strong>71 g par jour</strong> (<span class="ref">ch. 19</span>) : une femme enceinte qui mange plus de viande maigre au lieu de plus de gras court au mal de caribou, et <strong>la viande maigre seule tue en quelques semaines</strong>. Elle se sert en même temps que les enfants, pas après.</p>
<p class="step"><span class="sn">21</span><strong>La multivitamine prénatale</strong>, commencée deux ou trois mois avant la grossesse et prise jusqu’après l’accouchement : au moins <strong>0,4 mg d’acide folique</strong> et <strong>16 à 20 mg de fer</strong>. L’acide folique protège la colonne et le cerveau du bébé, surtout au tout début de la grossesse : d’où les mois d’avance. Elle s’achète d’avance, pendant que tout marche. Deux autres choses se font à ce moment-là, une fois pour toutes : <strong>le vaccin de la mère contre le tétanos</strong>, mis à jour avant ou pendant la grossesse, qui protège aussi le nouveau-né du tétanos par le cordon (section 7) ; et <strong>son groupe sanguin avec le Rh</strong> : une mère Rh négatif reçoit une injection à 28 semaines, et parfois après la naissance ; et un groupe différent entre la mère et le bébé est une des causes de la jaunisse du premier jour (section 7).</p>
<p class="step"><span class="sn">22</span><strong>Ce qu’elle ne mange pas, et pourquoi.</strong></p>
<p class="li l2"><strong>Aucun foie</strong>, d’aucune bête : trop de vitamine A pour le bébé. Et pour tout le monde, <strong>jamais le foie ni les reins d’un cervidé</strong> : le cadmium (<span class="ref">ch. 22</span>).</p>
<p class="li l2"><strong>Le gibier cuit à 74 °C à cœur</strong>, sans exception : la viande crue ou saignante porte la toxoplasmose, un parasite qui atteint le bébé.</p>
<p class="li l2"><strong>Le poisson fumé à froid se réchauffe à 70 °C à cœur avant qu’elle en mange.</strong> La listériose pousse au froid, dans un aliment qui a l’air, l’odeur et le goût d’un aliment sain, et elle tue le bébé avant la naissance. Pour tout le monde, le botulisme de type E fait sa toxine dès <strong>3 °C</strong> et ne change ni l’odeur, ni le goût, ni l’apparence (<span class="ref">ch. 77</span>).</p>
<p class="li l2"><strong>Le lait cru se fait bouillir</strong> (<span class="ref">ch. 101</span>).</p>
<p class="li l2"><strong>La viande autour du trajet de la balle se pare large et se jette</strong> : les éclats de plomb se dispersent loin du trou et ne se voient pas (<span class="ref">ch. 62</span>), et le plomb nuit au développement de l’enfant, avant comme après la naissance. La balle sans plomb supprime le problème.</p>
<p class="li l2"><strong>Le poisson se compte comme au chapitre 46.</strong> Le modèle du poisson de mer y a une ligne à part pour la femme enceinte, qui sert de gabarit ; au lac, le touladi (truite grise), le doré et le brochet sont les plus limités.</p>
<p class="li l2"><strong>Pas d’eau traitée à l’iode</strong> (<span class="ref">ch. 10</span>) : il donne un goitre au nouveau-né, <strong>et pendant l’allaitement aussi</strong> : l’iode passe dans le lait et ralentit la thyroïde du bébé, dont le cerveau en a besoin pour se faire. Si l’iode est le seul moyen de traiter l’eau, il vaut mieux que l’eau non traitée, le moins de jours possible. <strong>Pas d’ibuprofène ni d’aspirine</strong>, l’acétaminophène pour peu de jours seulement ; <strong>pas de remède de plantes</strong> (<span class="ref">ch. 33</span>), l’écorce de saule comprise, parente de l’aspirine, ni le thé du Labrador. <strong>Les tisanes qui passent</strong> : l’églantier (le fruit du rosier sauvage), le gingembre, la pelure d’orange ou d’autres agrumes, <strong>pas plus de deux ou trois tasses par jour</strong>. Le sapin baumier et l’épinette n’y sont pas : rien ne dit qu’ils sont sans danger pour le bébé. Pendant la grossesse, la vitamine C vient de l’églantier (<span class="ref">ch. 20</span>). <strong>Jamais le cèdre</strong> (thuya, <em>Thuja occidentalis</em>) : sa thuyone est toxique.</p>
<p class="step"><span class="sn">23</span><strong>Le bébé qui bouge, et le cœur qu’on écoute.</strong> Les mouvements se sentent vers 20 semaines. Après <strong>26 semaines</strong>, si le bébé semble moins bouger, la femme se repose et compte : <strong>moins de six mouvements distincts en deux heures</strong> est un signe de danger (section 7).</p>
<p class="li l2"><strong>Le cœur</strong> s’entend souvent dans les deux derniers mois, l’oreille collée au ventre dans une pièce silencieuse, mieux avec un cornet (9-C). Il bat vite et léger, comme une montre sous un oreiller, <strong>120 à 160 fois par minute</strong>, à peu près deux fois le pouls de la mère. Un battement lent est souvent le pouls de la mère : on lui tient le poignet en écoutant, et s’ils vont ensemble, c’est elle qu’on entend. Un souffle, « chou-ou, chou-ou », est le cordon : il donne la vitesse, pas la position.</p>
<p class="li l2"><strong>La position.</strong> Le cœur le plus fort <strong>sous le nombril</strong> : le bébé a sans doute la tête en bas ; <strong>au-dessus</strong> : il est peut-être en siège. Sur le ventre, une main sur le dos du bébé, l’autre pousse doucement de côté le bout du haut : si tout le dos suit, la tête est en bas ; si le dos reste en place, c’est la tête qu’on bouge, en haut, et c’est un siège. Les deux bouts du bébé dans les flancs de la mère : il est en travers. Beaucoup tournent la tête en bas vers le huitième mois ; en travers après, c’est la section 2.</p>
<p class="li l2"><strong>Deux bébés.</strong> Le ventre grossit plus vite qu’on l’attend, la main sent deux têtes ou deux fesses, on entend deux cœurs. Pour le vérifier, deux personnes écoutent chacune à un endroit et tapent le rythme de la main : deux rythmes qui ne tombent pas ensemble, ce sont sans doute deux bébés. Les jumeaux naissent plus souvent avant terme : la préparation de 5-D se fait dès le sixième mois.</p>
<p class="step"><span class="sn">24</span><strong>Les signes qui disent que la vie est en jeu</strong> sont au tableau de la section 7. Ils se lisent une fois par semaine, à deux, pendant toute la grossesse.</p>
<h3 class="sub">D — Préparer l’accouchement, avant 37 semaines</h3>
<p class="step pk-c"><span class="sn">25</span><strong>La pièce.</strong> La plus facile à chauffer, sans courant d’air : <strong>25 à 28 °C</strong>. Si la pièce ne monte pas jusque-là, on chauffe un coin : le lit près du poêle, des couvertures suspendues autour. Le repère sans thermomètre : quand la pièce devient trop chaude pour un adulte en manches courtes, elle est juste pour le bébé. On chauffe au poêle à bois, jamais avec un appareil à combustion sans cheminée (<span class="ref">ch. 87</span>). <strong>Le piège est dans la pièce même</strong> : fermer, calfeutrer, entourer le lit de couvertures pour garder la chaleur, c’est le geste qui laisse monter le monoxyde de carbone, qui n’a ni odeur ni couleur : on s’endort au lieu de sortir. Ses signes (mal de tête, fatigue, nausées, étourdissements) sont aussi ceux du travail, de l’épuisement d’après la naissance et de la prééclampsie, et on les met sur leur compte. Deux personnes qui ont mal à la tête en même temps, et ça passe dehors : tout le monde sort, on ouvre, on coupe le feu (<span class="ref">ch. 87</span>, section 7). Les animaux sortent de la pièce.</p>
<p class="step"><span class="sn">26</span><strong>Le lit.</strong> Toile de plastique dessous, draps bouillis et séchés dessus, et d’autres pliés à côté pour les changer.</p>
<p class="step"><span class="sn">27</span><strong>Le linge.</strong> Bouilli, séché à la corde, plié pendant qu’il sèche, rangé dans un sac fermé (même méthode que le pansement : <span class="ref">ch. 26</span>, section 9) : de quoi essuyer, couvrir, changer, et garnir les premiers jours de saignement.</p>
<p class="step pk-t"><span class="sn">28</span><strong>Les liens et la lame.</strong> La stérilisation se fait <strong>à la maison, pendant que tout marche</strong>, au four de la cuisinière : trois liens de ficelle de coton, et des ciseaux s’il y en a, enveloppés dans <strong>quatre épaisseurs de tissu</strong> et ficelés, cuits <strong>1 heure à 170 °C</strong> (ou 2 heures et demie à 150 °C). Ils sortent stériles ; le paquet refroidit, monte au chalet fermé et sec, et ne s’ouvre qu’au moment de s’en servir. Rien de plastique ni de caoutchouc au four. L’autoclave de la maison (<span class="ref">ch. 78</span>) stérilise aussi, caoutchouc compris : <strong>121 °C pendant 20 minutes</strong>, soit 103 kPa (15 lb), le paquet posé <strong>sur la grille, au-dessus de l’eau</strong>, et <strong>après la purge</strong> : l’air resté dans la marmite fait mentir le manomètre (<span class="ref">ch. 78</span>, étape 17), et 103 kPa ne veulent plus dire 121 °C. Une lame neuve reste dans son papier ; un papier mouillé ou percé ne la garde plus stérile. <strong>Au chalet, sans four, les liens et la lame bouillent 20 minutes</strong> (9-C) : c’est la méthode normale là-bas, pas un pis-aller. Le tout dans une boîte de métal à couvercle, <strong>au sec</strong> : les germes reviennent dans ce qu’on range mouillé.</p>
<p class="step"><span class="sn">29</span><strong>Le coin du bébé.</strong> À portée de main du lit, une surface ferme à hauteur de taille couverte d’un linge chaud, le linge roulé pour les épaules, les deux serviettes et le bonnet sur le réchaud du poêle.</p>
<p class="step"><span class="sn">30</span><strong>Les rôles.</strong> Deux adultes, pas un : l’aide qui s’occupe de la mère, et quelqu’un pour le bébé. À un seul aidant, s’il faut choisir, <strong>la mère qui saigne passe avant le bébé</strong>.</p>
<p class="step"><span class="sn">31</span><strong>Se pratiquer.</strong> L’aide répète les insufflations de 5-F sur une poupée ou un paquet de linge de la taille d’un bébé, et apprend à trouver l’utérus sur le ventre de la mère. La mère apprend à sentir le sien : après la naissance, c’est elle qui le surveille le mieux.</p>
<p class="step"><span class="sn">32</span><strong>À boire et à manger</strong> prêts : boisson de réhydratation (<span class="ref">ch. 26</span>), bouillon, eau sucrée.</p>
<p class="step"><span class="sn">33</span><strong>Les médicaments prescrits</strong> (misoprostol, vitamine K), s’il y en a, dans la boîte, avec leur dose écrite au feutre sur la boîte même.</p>
<h3 class="sub">E — Le travail et la naissance</h3>
<p class="step"><span class="sn">34</span><strong>Les signes.</strong> Des contractions régulières qui durent <strong>au moins 20 secondes</strong> et se rapprochent ; un peu de glaire teintée de sang ; la poche des eaux qui se rompt, d’un coup ou goutte à goutte.</p>
<p class="step pk-t"><span class="sn">35</span><strong>Les eaux.</strong> Claires ou rosées : normal. <strong>Vertes ou jaunes</strong> : le bébé a fait ses premières selles (le méconium) dans l’utérus, et il pourrait avoir besoin de 5-F à la naissance. On écoute le cœur du bébé tout de suite après (étape 37) : s’il tombe sous 100, c’est le cordon (section 7). Une fois la poche rompue, <strong>rien dans le vagin</strong>, et la température de la mère aux 4 heures. Le travail devrait commencer dans les <strong>12 heures</strong> et le bébé naître dans les <strong>24 heures</strong> : au-delà, les germes montent dans l’utérus (section 8).</p>
<p class="step"><span class="sn">36</span><strong>La phase de début.</strong> Elle peut durer longtemps et n’a pas de durée normale. La mère dort entre les contractions, mange si elle a faim, boit.</p>
<p class="step pk-t"><span class="sn">37</span><strong>La phase active.</strong> Les contractions deviennent fortes et rapprochées. La mère boit <strong>au moins une tasse (environ 250 mL) par heure</strong> — la boisson de réhydratation si c’est long —, <strong>urine au moins toutes les deux heures</strong> (une vessie pleine ralentit le travail et fait saigner après), et <strong>change de position chaque heure</strong> : marcher, s’accroupir, quatre pattes. Cette phase dure d’habitude moins de <strong>12 heures</strong> pour un premier bébé et moins de <strong>10 heures</strong> pour les suivants ; plus de 12 heures de contractions fortes sans progrès est un signe d’alarme (section 7). <strong>Le cœur du bébé s’écoute environ une fois par heure</strong> (étape 23), juste après une contraction : pendant, on l’entend souvent mal, et ça ne veut rien dire. Normal : <strong>120 à 160</strong>. Il peut monter à 180 ou descendre à 100 un moment, mais il revient à la fin de la contraction ou quand la mère change de position. <strong>Sous 100 ou au-dessus de 180, et qui ne revient pas</strong> : section 7.</p>
<p class="step pk-t"><span class="sn">38</span><strong>La poussée.</strong> L’envie de pousser vient quand le col est ouvert. Accroupie, à quatre pattes, à demi assise : la mère prend la position où ça descend ; une corde attachée à une solive, qu’elle tire vers le bas en poussant, l’aide. La naissance se fait d’habitude en moins de <strong>3 heures</strong> de poussée pour un premier, <strong>2 heures</strong> pour les suivants. Si rien ne bombe à la vulve après <strong>30 minutes</strong> de bonnes poussées, ou si rien ne descend après <strong>1 heure</strong> : vider la vessie, changer de position, faire boire. <strong>Jamais de poussée sur le ventre</strong> : ça décolle le placenta ou déchire l’utérus.</p>
<p class="step pk-t"><span class="sn">39</span><strong>Le couronnement.</strong> Quand la tête reste à la vulve entre deux contractions, ouverte à peu près de la grandeur d’une paume, l’aide se lave les mains et met les gants. Des linges trempés dans de l’eau bouillie <strong>2 minutes</strong>, salée d’une pincée et refroidie jusqu’à tiède, se tiennent contre le périnée : la peau s’assouplit. Une main à plat sur le périnée, un linge sur l’anus.</p>
<p class="step"><span class="sn">40</span><strong>Ralentir la tête.</strong> La mère souffle fort et vite au lieu de pousser, ou donne de toutes petites poussées entre les contractions : <strong>pas plus de 1 cm</strong> de tête à la fois. Une tête qui sort lentement déchire moins. <strong>On ne ralentit pas</strong> s’il y a eu un jet de sang avant la naissance, si le cordon est sorti ou si le bébé semble en difficulté : il doit sortir vite.</p>
<p class="step"><span class="sn">41</span><strong>La tête est sortie.</strong> Essuyer la bouche et le nez avec un linge sur le doigt ; pas d’aspiration. Tâter le cou : un cordon lâche se fait passer par-dessus la tête ; un cordon serré se desserre si on peut, sinon on garde la tête collée contre la cuisse de la mère et le corps sort en culbute autour. On ne coupe pas le cordon avant la sortie du bébé : sans lui, le bébé n’a plus d’oxygène avant son premier souffle.</p>
<p class="step"><span class="sn">42</span><strong>Les épaules.</strong> À la contraction suivante, une petite poussée. La mère à demi assise, l’aide guide la tête vers le bas, vers l’anus de la mère, pour dégager l’épaule du dessus, puis vers le ventre de la mère pour l’autre. Guider, <strong>jamais tirer</strong>, jamais plier le cou : un cou tiré d’un coup ou plié trop loin déchire les nerfs du bras du bébé.</p>
<p class="step pk-t"><span class="sn">43</span><strong>Les épaules qui bloquent.</strong> Le signe : la tête sortie se fait ravaler contre la vulve, comme une tortue rentre la sienne, et ne tourne pas. Après <strong>environ 5 minutes</strong>, la pression commence à faire saigner le cerveau du bébé. La seule traction permise tient la tête, <strong>jamais le cou</strong>, tire droit dans l’axe du bébé, sans à-coup et sans plier : c’est ce qui la sépare de la traction interdite à l’étape 42. Quatre essais, dans l’ordre, un à la fois : (1) la mère à quatre pattes, les mains en coupe autour de la tête, traction droite et douce en comptant jusqu’à <strong>30</strong> ; (2) la mère au bord du lit, qui tire ses genoux vers ses épaules aussi loin qu’elle peut, quelqu’un qui appuie fort <strong>juste au-dessus de l’os du pubis — pas sur le ventre</strong> —, la mère qui pousse de toutes ses forces, et la même traction en comptant jusqu’à 30 ; (3) la mère à quatre pattes, une main gantée entre dans le vagin le long du dos du bébé, les doigts derrière l’épaule qui est du côté du dos de la mère, et pousse cette épaule vers l’avant jusqu’à ce qu’elle glisse de côté ; (4) la main remonte le long du dos du bébé, contourne son corps, plie un bras, prend la main et la sort en travers de la poitrine, sans enfoncer la clavicule. On ne tire jamais par le cou. Si les quatre échouent : 9-G. Ce bébé aura presque sûrement besoin de 5-F.</p>
<p class="step"><span class="sn">44</span><strong>Le bébé est sorti.</strong> Sur le ventre de la mère, peau contre peau. <strong>Le sécher tout de suite, tête comprise</strong>, jeter la serviette mouillée, le couvrir de la deuxième serviette chaude, lui mettre le bonnet. Il reste peau contre peau <strong>au moins une heure</strong> sans être séparé.</p>
<p class="step"><span class="sn">45</span><strong>Dans les 30 secondes, regarder s’il respire.</strong> Il crie ou respire régulièrement, et il rosit en une ou deux minutes : tout va bien. Il ne respire pas, ou seulement par hoquets : 5-F, tout de suite.</p>
<p class="step"><span class="sn">46</span><strong>Le sein dans la première heure.</strong> La première tétée fait contracter l’utérus : le placenta sort mieux et la mère saigne moins. Le premier lait, jaune et épais (le colostrum), est tout ce dont le bébé a besoin.</p>
<h3 class="sub">F — Le bébé qui ne respire pas</h3>
<p class="step"><span class="sn">47</span><strong>Frotter.</strong> En le séchant, frotter fermement le dos <strong>2 ou 3 fois</strong>. Jamais de tape, jamais la tête en bas.</p>
<p class="step"><span class="sn">48</span><strong>Toujours rien : nouer et couper le cordon</strong> (étapes 53-54) pour pouvoir le déplacer, et le coucher sur le dos sur la surface ferme et chaude, la poitrine découverte, le reste couvert. Le linge roulé sous les épaules, la tête droite, le nez vers le plafond : pas renversée loin en arrière, ce qui referme la gorge.</p>
<p class="step"><span class="sn">49</span><strong>Si les eaux étaient teintées de vert ou de jaune</strong>, vider la bouche puis le nez d’abord : poire, ou linge sur le doigt.</p>
<p class="step"><span class="sn">50</span><strong>Souffler.</strong> La bouche de l’aide couvre la bouche et le nez du bébé, un linge mince entre les deux si on en a. On ne souffle que <strong>l’air que les joues gonflées contiennent</strong>, jamais celui de la poitrine : trop d’air déchire les poumons d’un nouveau-né. D’abord <strong>3 à 5 insufflations lentes</strong>, qui chassent le liquide, puis <strong>40 petites bouffées par minute</strong> — de 30 à 50, c’est correct —, soit à peu près une toutes les secondes et demie. Cette ventilation commence <strong>dans la première minute</strong> de vie.</p>
<p class="step"><span class="sn">51</span><strong>La poitrine doit se soulever</strong> à chaque bouffée. Si elle ne bouge pas : replacer la tête, vider la bouche, ouvrir la bouche, souffler un peu plus fort.</p>
<p class="step pk-t"><span class="sn">52</span><strong>Après une minute</strong>, regarder et écouter. Il respire ou crie : on arrête, peau contre peau, et on le surveille. Le cœur se sent avec deux doigts sur la poitrine : compter 6 secondes et multiplier par 10. Normal : <strong>120 à 160</strong>. Sous <strong>100</strong>, on continue de souffler. <strong>Ce qui fait repartir un nouveau-né, c’est l’air, pas le massage cardiaque</strong> : tout l’effort va aux insufflations. On arrête après <strong>10 minutes</strong> de ventilation efficace sans aucun battement, ou après <strong>20 minutes</strong> sans respiration avec un cœur sous 60.</p>
<h3 class="sub">G — Le cordon et le placenta</h3>
<p class="step pk-t"><span class="sn">53</span><strong>Attendre 1 à 3 minutes</strong> avant de nouer : le sang du placenta passe au bébé. Le cordon, gros et bleu, devient mince et blanc et cesse de battre. Rien n’oblige à couper vite : on peut attendre la sortie du placenta. La seule exception est le bébé à ranimer (étape 48).</p>
<p class="step"><span class="sn">54</span><strong>Nouer et couper.</strong> Un lien à <strong>2 travers de doigt</strong> du ventre du bébé, un autre à <strong>5 travers de doigt</strong>, chacun serré d’un nœud plat (droite sur gauche, gauche sur droite). Couper entre les deux avec la lame stérile. Regarder le bout : s’il suinte, un troisième lien entre le premier et la peau. Le moignon reste à l’air, sans rien dessus.</p>
<p class="step pk-t"><span class="sn">55</span><strong>Le placenta vient seul</strong>, d’ordinaire en moins d’une heure. Les signes qu’il s’est décollé : un petit jet de sang (une poignée, pas un filet), le cordon qui s’allonge hors de la vulve, l’utérus qui remonte vers le nombril. À <strong>30 minutes</strong> sans signe : le bébé au sein, la mère urine.</p>
<p class="step"><span class="sn">56</span><strong>À une heure</strong>, ou plus tôt si elle saigne beaucoup : la mère s’assoit ou s’accroupit au-dessus du bol et pousse avec une contraction. Les membranes qui suivent se tournent doucement en corde avant d’être tirées, pour ne pas se déchirer.</p>
<p class="step pk-d"><span class="sn">57</span><strong>Ne jamais tirer sur le cordon pour hâter le placenta, ne jamais appuyer sur le ventre.</strong> Encore attaché, le placenta arrache le cordon, ou l’utérus se retourne et sort avec lui (section 8).</p>
<p class="step"><span class="sn">58</span><strong>Examiner le placenta</strong>, avec des gants. Le côté du bébé est lisse, parcouru de vaisseaux comme des racines. Le côté de la mère est fait de lobes qu’on rassemble dans les deux mains en coupe : <strong>un trou, un bord déchiré, ou des vaisseaux qui partent du bord vers nulle part</strong> veulent dire qu’un morceau est resté dedans, et un morceau resté fait saigner et infecte. Le bout du cordon montre trois trous, un gros et deux petits.</p>
<p class="step"><span class="sn">59</span><strong>Le placenta s’enterre profond</strong>, pour que les bêtes ne le déterrent pas — renard, ours, chien du chalet —, ou se brûle.</p>
<h3 class="sub">H — L’hémorragie après l’accouchement</h3>
<p class="step"><span class="sn">60</span><strong>Ce qui est normal.</strong> Autant qu’une grosse journée de règles, du sang foncé ou rosé qui sort par petits coups quand l’utérus se contracte, quand la mère tousse, bouge ou se lève. <strong>Trop : 500 mL, environ deux tasses.</strong> Sur des linges, on compte les linges trempés.</p>
<p class="step pk-t"><span class="sn">61</span><strong>Tâter l’utérus</strong>, main à plat sur le ventre : juste après le placenta, puis <strong>toutes les 5 à 10 minutes pendant une heure</strong>, puis <strong>toutes les 15 à 30 minutes pendant une ou deux heures</strong>. Il doit être dur, rond, de la grosseur d’un pamplemousse ou moins, bien au centre du ventre, ni à gauche ni à droite.</p>
<p class="step pk-t"><span class="sn">62</span><strong>Mou : le frotter.</strong> La main posée sur le dessus de l’utérus serre en tournant, jusqu’à ce qu’il durcisse. Revérifier <strong>toutes les 1 à 2 minutes</strong> ; s’il ramollit, recommencer. La mère et l’aide apprennent ce geste tous les deux.</p>
<p class="step"><span class="sn">63</span><strong>Le bébé au sein.</strong> S’il ne tète pas, on roule doucement les mamelons entre les doigts : c’est la même ocytocine.</p>
<p class="step"><span class="sn">64</span><strong>Vider la vessie.</strong> Accroupie sur un bol dans le lit, ou couchée en urinant dans un linge épais ; de l’eau tiède versée sur la vulve aide. Elle devrait uriner dans les <strong>2 ou 3 premières heures</strong>.</p>
<p class="step"><span class="sn">65</span><strong>Revoir le placenta.</strong> Un morceau manquant tient l’utérus ouvert. Faire téter, rouler les mamelons ; s’il ne sort pas et qu’elle saigne à en mourir, 9-G.</p>
<p class="step"><span class="sn">66</span><strong>L’utérus est dur et ça saigne quand même</strong> : c’est une déchirure, d’où coule un filet rouge clair et continu. Rouler <strong>10 à 15 compresses</strong> stériles, ou un linge bouilli, en tampon épais et le presser fermement sur l’endroit qui saigne, sans le lâcher. Le tampon se roule d’un seul morceau et se noue d’une ficelle qui reste dehors : une compresse oubliée dans le vagin infecte, et la ficelle fait le compte à la place de la mémoire.</p>
<p class="step pk-d"><span class="sn">67</span><strong>Ça saigne encore, l’utérus reste mou : la compression à deux mains.</strong> Mains lavées, gant, la main faite la plus petite possible entre dans le vagin, jusqu’au fond, au-dessus du col, et s’y ferme en poing — <strong>jamais dans l’utérus</strong>, où la main porterait les germes jusqu’à la plaie ouverte du placenta (section 8, point 6). L’autre main, sur le ventre, ramène l’utérus vers ce poing et le serre entre les deux. On relâche doucement quand il est dur, puis on sort les caillots du vagin. C’est douloureux pour elle, et c’est ce qui la garde en vie.</p>
<p class="step"><span class="sn">68</span><strong>Toujours rien : la compression de l’aorte.</strong> L’aide se place au-dessus de la mère, le poing droit juste au-dessus et à côté du nombril, du côté gauche de la mère, le bras tendu, et pousse fort vers le dos. La main gauche cherche le pouls à l’aine, au pli de la cuisse : on appuie <strong>jusqu’à ce qu’il disparaisse</strong>, et on tient jusqu’à ce que le saignement soit maîtrisé.</p>
<p class="step"><span class="sn">69</span><strong>Les signes du choc</strong> : étourdie, faible, confuse ; peau pâle, sueurs froides ; pouls de plus de <strong>100</strong> par minute, faible et filant ; respiration rapide. La coucher les pieds plus hauts que la tête, la tête tournée sur le côté, la garder au chaud, la faire boire si elle est consciente (la boisson du <span class="ref">ch. 26</span>), rien par la bouche si elle ne l’est pas. <strong>Encore enceinte</strong>, elle se couche sur le côté gauche, les jambes surélevées, jamais à plat sur le dos : couchée sur le dos, l’utérus écrase la grosse veine qui ramène au cœur le sang des jambes ; sur le côté gauche, il la libère. Le réflexe du secourisme, à plat sur le dos les pieds en l’air, est ici le mauvais <strong>dès 20 semaines</strong>, quand le haut de l’utérus arrive au nombril : sur le dos, le sang revient mal au cœur, la pression tombe, et le bébé en reçoit moins. Une femme en santé compense sans que ça paraisse ; une femme en choc n’a plus rien pour compenser. Si elle doit rester sur le dos, une main pousse l’utérus vers sa gauche.</p>
<p class="step pk-d"><span class="sn">70</span><strong>Le misoprostol, s’il a été prescrit.</strong> <strong>Avant toute dose, la main sur le ventre</strong> : un utérus encore gros et dur comme à terme, où l’on sent des parties de bébé, veut dire qu’il y en a un deuxième, et la dose attend que le dernier soit né. Puis, en prévention, <strong>600 µg</strong> (3 comprimés de 200 µg) par la bouche dès que le bébé est sorti. En traitement, si rien n’a été donné en prévention et qu’elle saigne : <strong>800 µg</strong> (4 comprimés) sous la langue. <strong>Jamais avant la sortie du dernier bébé</strong>, et pas de deuxième dose par-dessus la prévention (section 8). Il donne souvent à la mère des frissons, de la fièvre et des nausées, et de la diarrhée au bébé qui tète.</p>
<h3 class="sub">I — Les six semaines qui suivent</h3>
<p class="step"><span class="sn">71</span><strong>L’utérus rapetisse</strong> : le lendemain de la naissance, il est à la hauteur du nombril, un peu plus bas chaque jour. S’il ramollit, on le frotte et on fait téter plus souvent.</p>
<p class="step pk-t"><span class="sn">72</span><strong>Les pertes durent de 3 à 6 semaines.</strong> Plus abondantes que des règles les deux premiers jours, puis moins ; rosées, puis brunes de plus en plus pâles, puis jaunâtres. Un caillot de temps en temps, le matin ou après une tétée, n’inquiète pas si le saignement diminue après. Un gros effort les fait redevenir rouges : c’est un avertissement, pas un accident. Des serviettes, <strong>ni tampon ni coupe</strong>, changées au moins <strong>toutes les 4 heures</strong> ; se laver chaque jour, s’essuyer de l’avant vers l’arrière, aucune douche vaginale. <strong>Rien dans le vagin, aucune relation, tant que ça saigne.</strong> Pas de bain assise dans l’eau la première semaine.</p>
<p class="step"><span class="sn">73</span><strong>La déchirure qu’on ne coud pas.</strong> Une petite déchirure guérit seule : <strong>deux semaines</strong> au lit, les jambes serrées la plupart du temps, en les bougeant souvent et en buvant assez : le risque de caillot (section 7) n’est jamais aussi haut que dans les semaines qui suivent la naissance, et une femme couchée qui ne bouge pas, qui manque d’eau ou qui a beaucoup saigné l’augmente encore. Sans escalier ni pente raide. Si ça brûle en urinant, verser de l’eau tiède pendant.</p>
<p class="step"><span class="sn">74</span><strong>Le repos, six semaines.</strong> Au chalet, c’est l’aide qui fend le bois, charrie l’eau et pellette : une mère qui reprend l’ouvrage trop tôt se remet à saigner.</p>
<p class="step"><span class="sn">75</span><strong>Manger autant qu’enceinte, et boire</strong> : 330 kcal de plus par jour pendant l’allaitement (étape 20), et l’eau de l’allaitement au chapitre 19.</p>
<p class="step"><span class="sn">76</span><strong>Le moral.</strong> Des pleurs et des sautes d’humeur les jours qui suivent la naissance sont normaux et passent en <strong>deux semaines</strong> environ. Au-delà, ou si la tristesse s’alourdit, c’est une dépression, et elle se soigne comme le reste du moral de l’hiver (<span class="ref">ch. 36</span>) ; devant l’idée de mourir, on pose la question clairement (<span class="ref">ch. 35</span>). Rare et différente, la psychose d’après la naissance éclate d’un coup, le plus souvent dans les deux premières semaines (section 7). Une mère qui se désintéresse du bébé peut aussi saigner, faire de la fièvre ou être à bout : on vérifie le corps avant de conclure au caractère.</p>
<p class="step"><span class="sn">77</span><strong>La contraception reprend maintenant</strong> (5-B), pas au retour des règles.</p>
<h3 class="sub">J — L’allaitement</h3>
<p class="step pk-t"><span class="sn">78</span><strong>La première tétée dans l’heure</strong>, puis à la demande, <strong>8 fois ou plus par 24 heures</strong>, jour et nuit. Rien d’autre, pas même de l’eau, pendant six mois, <strong>sauf la vitamine D</strong> : le lait maternel donne tout, sauf elle, et on n’expose pas un bébé au soleil pour qu’il la fabrique. <strong>10 µg (400 UI) par jour</strong>, en gouttes, dès la naissance. Les gouttes de la famille (<span class="ref">ch. 00b</span>) ne sont pas celles du bébé : à <strong>1 000 UI</strong> la goutte, une seule touche déjà le plafond d’un bébé de moins de six mois.</p>
<p class="step"><span class="sn">79</span><strong>Mettre au sein.</strong> La mère s’installe, le dos appuyé. La main sur le haut du dos du bébé, jamais sur sa tête : un bébé à qui on pousse la tête recule. Le menton touche le sein, le mamelon se pose sur la lèvre du haut, et on attend que la bouche s’ouvre <strong>très grand</strong> ; à ce moment, on l’amène au sein, le mamelon pointé vers le palais. Bonne prise : une grande partie de l’aréole dans la bouche, les lèvres retournées, le menton collé au sein, le nez dégagé, pas de douleur qui dure toute la tétée, et on l’entend avaler. Pour l’enlever, un doigt dans le coin de sa bouche fait entrer l’air et brise la succion.</p>
<p class="step pk-t"><span class="sn">80</span><strong>Boit-il assez ?</strong> Une couche mouillée le premier jour, deux le deuxième, trois le troisième, puis <strong>au moins six par 24 heures</strong> après la première semaine, d’une urine claire. Le méconium, noir et collant, est parti avant le <strong>5e jour</strong> ; ensuite, au moins une selle jaune ou verte par jour jusqu’à 4 semaines. Il perd de <strong>5 à 10 %</strong> de son poids les premiers jours et le retrouve <strong>entre 10 et 14 jours</strong>. Il se pèse directement, couché dans un bassin posé sur la balance de cuisine au gramme (<span class="ref">ch. 00b</span>), qu’on remet à zéro avec le bassin vide : pour un bébé de 3,5 kg, 10 %, c’est 350 g, et un pèse-personne ne lit pas cet écart, surtout par différence avec un adulte. Un bébé très difficile à réveiller pour boire, à l’urine foncée, boit trop peu : plus de tétées, tout de suite.</p>
<p class="step"><span class="sn">81</span><strong>Les seins engorgés</strong>, lourds et tendus les premiers jours : téter plus souvent. Si le bébé n’arrive pas à prendre un sein trop dur, en exprimer un peu à la main, ou appuyer quelques instants autour du mamelon pour assouplir l’aréole. <strong>En tirer juste assez pour être confortable, jamais le vider</strong> : un sein vidé produit davantage, et l’engorgement revient.</p>
<p class="step"><span class="sn">82</span><strong>Les crevasses.</strong> Presque toujours une mauvaise prise : on la corrige (étape 79), on varie les positions, on commence par le sein le moins douloureux. Un peu de lait étendu sur le mamelon, laissé sécher à l’air. Acétaminophène au besoin. Si la douleur empêche la tétée, on exprime le lait à la main et on le donne à la tasse et à la cuillère quelques jours.</p>
<p class="step pk-t"><span class="sn">83</span><strong>La mastite.</strong> Une zone du sein dure, rouge, enflée, chaude, avec de la fièvre, des frissons et des courbatures comme une grippe. <strong>On continue d’allaiter, du sein malade aussi : le lait reste bon.</strong> Du <strong>froid</strong> 10 à 15 minutes toutes les 1 ou 2 heures entre les tétées, <strong>pas de chaleur</strong> ; un massage léger seulement, en effleurant du mamelon vers l’aisselle, jamais en profondeur, ce qui blesse le sein. Ibuprofène ou acétaminophène. Si ça ne commence pas à diminuer en <strong>24 heures</strong>, si la rougeur s’étend, si la fièvre dure plus de 24 heures : c’est une infection qui demande un antibiotique (section 7).</p>
<p class="step"><span class="sn">84</span><strong>Exprimer à la main.</strong> Mains lavées, un contenant propre et large. Le pouce et l’index de part et d’autre de l’aréole, à <strong>2 à 5 cm</strong> du mamelon ; enfoncer vers les côtes, rapprocher les doigts en pince, relâcher, en rythme, comme le bébé tète. Ne pas glisser sur la peau ni étirer le mamelon. Tourner autour du sein. Le lait vient en gouttes, puis en petits jets.</p>
<h3 class="sub">K — Le nouveau-né, la première semaine</h3>
<p class="step pk-t"><span class="sn">85</span><strong>Au chaud.</strong> Une ou deux couches de vêtements de plus qu’un adulte, et le bonnet. <strong>Pas de bain avant 24 heures</strong> : le séchage suffit, et le bain le refroidit. La nuit dans une pièce froide, il retourne peau contre peau. Température normale : <strong>36,5 à 37,5 °C</strong>.</p>
<p class="step"><span class="sn">86</span><strong>Le cordon.</strong> Chaque jour, nettoyer le tour avec un linge ou un coton trempé d’eau bouillie tiède, puis sécher. <strong>Pas d’alcool</strong> : il retarde la chute. La couche repliée sous le nombril ; rien sur le moignon, qui reste sec. Il noircit et tombe seul entre le <strong>5e et le 21e jour</strong> ; on ne tire pas dessus. Quelques gouttes de sang à la chute sont normales.</p>
<p class="step"><span class="sn">87</span><strong>La vitamine K.</strong> Le nouveau-né naît avec peu de vitamine K, et le lait maternel en contient peu : à l’hôpital, on la lui donne pour prévenir des saignements rares mais parfois mortels. Si elle a été prescrite pendant la grossesse pour une naissance hors de l’hôpital : <strong>2 mg par la bouche à la première tétée</strong>, puis de nouveau <strong>entre 2 et 4 semaines</strong> et <strong>entre 6 et 8 semaines</strong>. Sans elle, on surveille les signes de saignement<sup class="fnr" data-fn="29-3">3</sup> jusqu’à 6 mois.</p>
<p class="step"><span class="sn">88</span><strong>La jaunisse.</strong> Le blanc des yeux et la peau jaunissent souvent vers le <strong>2e ou 3e jour</strong> et redeviennent normaux après la première semaine. Elle est pire quand le bébé boit peu : la réponse est de le faire téter plus. Le jaune se voit mieux à la lumière du jour, et en appuyant un instant du doigt sur le bout du nez ou le front. <strong>Celle qui paraît dans les 24 premières heures n’est pas celle-là</strong> : c’est une urgence (section 7). Un bébé jaune qui est aussi somnolent, irritable ou qui boit mal est en danger (section 7).</p>
<p class="step"><span class="sn">89</span><strong>Les yeux</strong> qui collent un peu de jaune les premières semaines se lavent au lait maternel ou à l’eau bouillie refroidie, avec un linge propre. Rouges, enflés, pleins de pus : section 7.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:22.2%"><col style="width:20.1%"><col style="width:28.7%"><col style="width:28.9%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Chaque changement</td><td>Temps de port</td><td>Serviette 3-6 h ; coupe 6-12 h ; tampon <strong>8 h au plus</strong></td><td>Raccourcir ; la nuit, une serviette plus épaisse plutôt qu’un tampon</td></tr><tr><td class="c-item">Fin de chaque cycle</td><td>Coupe</td><td>Bouillie 5 à 10 min</td><td>La faire bouillir avant la réutiliser</td></tr><tr><td class="c-item">Serviette rangée</td><td>Au toucher et au nez</td><td>Sèche, sans odeur</td><td>La relaver et la sécher près du poêle</td></tr><tr><td class="c-item">Retour des règles, collier</td><td>Marque où est l’anneau</td><td>Règles revenues entre le jour 27 et le jour 33</td><td>Un nœud d’arrêt de plus sur le collier ; au troisième dans l’année, passer aux deux jours (9-B)</td></tr><tr><td class="c-item">Après 26 semaines, si doute</td><td>Mouvements du bébé, mère au repos</td><td><strong>6 mouvements ou plus en 2 heures</strong></td><td>Section 7</td></tr><tr><td class="c-item">Travail actif, chaque heure</td><td>Liquide bu ; position</td><td>1 tasse (250 mL) ; une nouvelle position</td><td>Boisson de réhydratation ; faire marcher</td></tr><tr><td class="c-item">Travail actif, chaque heure, juste après une contraction ; et dès que les eaux se rompent</td><td>Cœur du bébé (étape 37)</td><td>120 à 160 ; revient après la contraction</td><td>Changer la mère de position, réécouter ; sous 100 ou au-dessus de 180 qui ne revient pas : section 7</td></tr><tr><td class="c-item">Travail actif, aux 2 h</td><td>Urine</td><td>Elle a uriné</td><td>Accroupie sur un bol, eau tiède</td></tr><tr><td class="c-item">Eaux rompues, aux 4 h</td><td>Température de la mère</td><td>Moins de <strong>38 °C</strong></td><td>Section 7</td></tr><tr><td class="c-item">Travail actif</td><td>Durée</td><td>Moins de 12 h (1er bébé), moins de 10 h (suivants)</td><td>Section 7</td></tr><tr><td class="c-item">Poussée</td><td>Descente</td><td>La vulve bombe en 30 min ; le bébé descend en 1 h</td><td>Vessie, position, boire ; puis section 7</td></tr><tr><td class="c-item">Naissance + 30 s</td><td>Respiration</td><td>Il crie ou respire</td><td>5-F : ventiler <strong>avant 1 minute</strong></td></tr><tr><td class="c-item">Ventilation + 1 min</td><td>Cœur, poitrine qui monte</td><td>Cœur au-dessus de 100</td><td>Continuer ; corriger la tête et la bouche</td></tr><tr><td class="c-item">Naissance + 1 h</td><td>Placenta</td><td>Sorti, complet, 3 vaisseaux au cordon</td><td>5-G, étape 56 ; morceau manquant : 5-H</td></tr><tr><td class="c-item">1re heure, toutes les 5-10 min ; puis aux 15-30 min</td><td>Utérus</td><td>Dur, rond, au centre du ventre</td><td>Frotter (5-H)</td></tr><tr><td class="c-item">24 premières heures</td><td>Sang perdu</td><td>Moins de 500 mL (2 tasses)</td><td>5-H</td></tr><tr><td class="c-item">2 à 3 h après</td><td>Urine de la mère</td><td>Elle a uriné</td><td>Étape 64</td></tr><tr><td class="c-item">1re heure, toutes les 15 min</td><td>Bébé : peau du pied ou du front, respiration</td><td>Chaude ; moins de 60 respirations par minute, sans tirage</td><td>Peau contre peau, couvrir ; section 7</td></tr><tr><td class="c-item">Chaque jour, 1re semaine</td><td>Couches mouillées</td><td>Autant que l’âge en jours, puis 6 et plus</td><td>Plus de tétées</td></tr><tr><td class="c-item">Jours 1 à 14</td><td>Poids du bébé, au gramme, dans un bassin (étape 80)</td><td>Perte de 10 % au plus ; poids de naissance repris entre 10 et 14 jours</td><td>Plus de tétées ; vérifier la prise</td></tr><tr><td class="c-item">Chaque jour, 6 semaines</td><td>Pertes de la mère</td><td>Qui diminuent ; moins d’une serviette pleine par heure</td><td>Section 7</td></tr><tr><td class="c-item">Chaque jour, 6 semaines</td><td>Mal de tête, vue, enflure des mains et du visage de la mère</td><td>Rien de tout ça</td><td>Section 7, prééclampsie : elle peut venir après la naissance</td></tr><tr><td class="c-item">Chaque jour</td><td>Température de la mère</td><td>Moins de 38 °C</td><td>Section 7</td></tr><tr><td class="c-item">Jour 5 à 21</td><td>Cordon</td><td>Sec, tombé sans rougeur</td><td>Section 7</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<p class="p0">Aucun de ces signes n’attend. La colonne de droite dit ce qu’on fait ici ; quand elle dit que la vie est en jeu, tout moyen de partir qui existe encore sert maintenant (<span class="ref">ch. 2</span>, <span class="ref">ch. 15</span>), et sinon c’est l’horloge en heures du chapitre 35.</p>
<table class="tspan"><colgroup><col style="width:38.2%"><col style="width:14.7%"><col style="width:47.1%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Protection traversée chaque heure pendant plusieurs heures ; règles de plus d’une semaine ; caillots de plus de 2,5 cm</td><td>Règles trop abondantes</td><td>Repos, fer et viande rouge (<span class="ref">ch. 21</span>) ; si c’est chaque mois, surveiller la pâleur de la paupière</td></tr><tr><td class="c-item">Retard de règles, puis douleur inhabituelle au ventre, souvent d’un côté, saignement, étourdissement, évanouissement, parfois douleur à l’épaule</td><td>Grossesse hors de l’utérus<sup class="fnr" data-fn="29-4">4</sup></td><td><strong>La vie est en jeu.</strong> La coucher, la garder au chaud ; rien ne se fait à la main (<span class="ref">ch. 35</span>)</td></tr><tr><td class="c-item">Saignement en début de grossesse</td><td>Souvent sans suite ; une fois sur deux, une fausse couche</td><td>Surveiller la quantité ; abondant (deux serviettes par heure pendant deux ou trois heures), ou avec faiblesse et douleur forte au ventre : la vie est en jeu</td></tr><tr><td class="c-item">Saignement après 14 semaines, sans les signes des trois lignes suivantes</td><td>Le placenta, une fausse couche, un début de travail ; ce n’est pas toujours un danger</td><td><strong>Rien dans le vagin, ni doigt ni main</strong>, tant qu’elle saigne ; repos ; surveiller la quantité, la douleur, le bébé qui bouge</td></tr><tr><td class="c-item">Sang rouge vif en fin de grossesse ou pendant le travail, <strong>sans douleur</strong> entre les contractions, ventre mou</td><td>Placenta posé devant le col (placenta prævia)</td><td><strong>La vie de la mère et du bébé est en jeu</strong> : une fois le col ouvert, elle peut se vider de son sang très vite. <strong>Rien dans le vagin</strong> : un doigt qui va « voir le col » troue le placenta posé dessus et fait pire. Couchée sur le côté gauche, au chaud (étape 69) ; ce qui manque est une césarienne</td></tr><tr><td class="c-item">Douleur entre les contractions, qui monte ; ventre dur tout le temps et sensible au toucher ; du sang, ou pas de sang du tout ; cœur du bébé très rapide ou très lent ; jet de sang frais pendant la poussée</td><td>Placenta qui se décolle</td><td><strong>La vie de la mère et du bébé est en jeu.</strong> Si la naissance est proche, la mère pousse fort et vite : le bébé doit sortir en quelques minutes. Préparer 5-F et 5-H, les deux en auront besoin. Sinon, choc (étape 69)</td></tr><tr><td class="c-item">Douleur très forte, puis une sensation de déchirure dans le ventre, puis moins de douleur ; <strong>les contractions s’arrêtent</strong> ; le bébé se sent lâche sous la peau du ventre, sans cœur</td><td>Utérus déchiré</td><td><strong>La vie de la mère est en jeu</strong>, et vite. Pousser ne sert plus : il n’y a plus de contractions. Choc (étape 69) ; ce qui manque est une opération</td></tr><tr><td class="c-item">Maux de tête sévères, douleur en barre dans le haut du ventre, vue qui change d’un coup, enflure qui gagne les mains et le visage — <strong>pendant la grossesse, et aussi dans les jours et les semaines qui suivent la naissance</strong></td><td>Prééclampsie<sup class="fnr" data-fn="29-5">5</sup></td><td><strong>La vie de la mère et du bébé est en jeu.</strong> Si elle convulse : sur le côté, rien dans la bouche, rien de dur autour d’elle. Après la naissance, un mal de tête violent se lit d’abord comme elle, pas comme de la fatigue</td></tr><tr><td class="c-item">Fièvre, frissons, douleur au bas du dos ou sur un côté, brûlure en urinant, envies pressantes, pendant la grossesse</td><td>Infection du rein</td><td><strong>Plus grave chez la femme enceinte qu’ailleurs</strong> : elle peut passer dans le sang, et la vie est alors en jeu. Boire beaucoup, acétaminophène (pas d’ibuprofène), repos ; le reste au <span class="ref">ch. 28</span>, étape 36 ; l’antibiotique manque (<span class="ref">ch. 32</span>)</td></tr><tr><td class="c-item">Fièvre de 38,5 °C ou plus, ou de 38 °C plus de 24 heures, pendant la grossesse, sans les signes du rein</td><td>Infection</td><td>Boire ; acétaminophène quelques jours ; chercher la cause : l’utérus si les eaux ont coulé (plus bas)</td></tr><tr><td class="c-item">Après 26 semaines, moins de 6 mouvements en 2 heures au repos</td><td>Bébé en souffrance</td><td>Se reposer et recompter ; rien d’autre ne se fait ici</td></tr><tr><td class="c-item">Contractions régulières de 20 s ou plus, plus de 7 par jour, avant 37 semaines ; eaux rompues avant 37 semaines</td><td>Travail prématuré</td><td>Préparer 5-D en entier maintenant, la chaleur surtout (étape 25)</td></tr><tr><td class="c-item">Douleur et enflure d’une seule jambe, pendant la grossesse ou dans les semaines d’après</td><td>Caillot de sang dans la jambe</td><td><strong>La vie est en jeu</strong> : il peut monter au poumon. Couchée, jambes plus hautes que les hanches, immobile, linges chauds sur l’enflure, <strong>jamais masser</strong></td></tr><tr><td class="c-item">Douleur ou serrement à la poitrine, essoufflement soudain sans raison ; parfois elle crache du sang ou s’effondre</td><td>Caillot monté au poumon</td><td><strong>La vie est en jeu.</strong> Immobile, jamais masser la jambe ; encore enceinte, sur le côté gauche (étape 69). Ce qui la soigne, un médicament qui empêche le sang de coaguler, n’est pas au chalet</td></tr><tr><td class="c-item">Ventre plus gros que la date ; deux têtes ou deux fesses sous la main ; deux cœurs ; après le premier bébé, un utérus encore gros et dur où l’on sent un bébé</td><td>Jumeaux (étape 23)</td><td>Le premier naît comme les autres ; son cordon se noue serré des deux côtés, parce que les jumeaux partagent parfois un placenta. Chercher la position du deuxième : il naît d’ordinaire dans les <strong>15 à 20 minutes</strong>. <strong>Aucun misoprostol avant lui</strong> (étape 70), aucun médicament pour relancer le travail. Rien en 2 heures : le premier au sein, ou les mamelons roulés ; en travers, il ne naît pas seul (section 2). Elle saigne entre les deux : le deuxième doit sortir au plus vite, mamelons, poussée forte. Après, elle saigne davantage : 5-H prêt</td></tr><tr><td class="c-item">Eaux rompues depuis 12 h sans travail, ou 24 h sans naissance ; fièvre de 38 °C pendant le travail</td><td>Infection qui monte dans l’utérus</td><td>Rien dans le vagin ; boire ; la naissance doit venir (section 8)</td></tr><tr><td class="c-item">Plus de 12 h de contractions fortes sans progrès ; rien ne descend après 1 h de poussée</td><td>Bébé mal placé ou trop gros pour le bassin</td><td>Vessie, position, boire ; puis <strong>la vie des deux est en jeu</strong> : ce qui manque est une césarienne</td></tr><tr><td class="c-item">Cordon sorti avant le bébé ; cœur du bébé (étape 37) qui ralentit d’un coup quand les eaux se rompent, ou qui reste sous 100 d’une contraction à l’autre</td><td>Cordon écrasé par la tête</td><td>Mère à genoux, la poitrine au sol, les fesses en l’air ; main gantée qui repousse la tête loin du cordon ; cordon remis dedans pour qu’il reste chaud et humide, sinon enveloppé dans un linge propre. Si la naissance est proche : pousser fort et vite, et 5-F prêt</td></tr><tr><td class="c-item">Les fesses ou un pied se présentent d’abord ; le cœur s’entendait au-dessus du nombril</td><td>Siège</td><td>9-G, du début à la fin. Rien ne se tire ; la tête vient en dernier, et c’est elle qui tue quand on la brusque</td></tr><tr><td class="c-item">Tête qui se fait ravaler à la vulve et ne tourne pas</td><td>Épaules coincées</td><td>Étape 43, sans attendre ; puis 9-G</td></tr><tr><td class="c-item">Placenta pas sorti à 1 h, ou morceau manquant ; utérus qui reste mou</td><td>Placenta retenu ou incomplet</td><td>5-G, étape 56 ; 5-H. Pas de traction sur le cordon. Elle saigne à en mourir et il ne vient pas : 9-G</td></tr><tr><td class="c-item">L’utérus sort par la vulve, retourné comme un gant, avec le placenta ou derrière lui ; elle saigne fort</td><td>Utérus retourné</td><td>9-G, tout de suite ; choc (étape 69)</td></tr><tr><td class="c-item">Pendant les règles avec un tampon ou une coupe, ou après la naissance : fièvre soudaine, rougeur rugueuse comme du papier sablé, vomissements, diarrhée, étourdie, confuse</td><td>Choc toxique<sup class="fnr" data-fn="29-2">2</sup></td><td><strong>La vie est en jeu.</strong> Retirer tout de suite ce qui est dans le vagin ; boire ; l’antibiotique manque (<span class="ref">ch. 32</span>)</td></tr><tr><td class="c-item">Plus de 500 mL ; une serviette pleine par heure deux heures de suite ; caillots plus gros qu’un œuf</td><td>Hémorragie</td><td>5-H, dans l’ordre</td></tr><tr><td class="c-item">Faible, pâle, sueurs froides, pouls de plus de 100</td><td>Choc</td><td>Étape 69</td></tr><tr><td class="c-item">Fièvre de 38 °C ou plus, frissons, ventre douloureux au toucher, pertes qui sentent mauvais, dans les jours qui suivent</td><td>Infection de l’utérus</td><td><strong>La vie est en jeu</strong>, et vite : le traitement est un antibiotique, qu’aucune plante ne remplace (<span class="ref">ch. 32</span>). Boire, repos ; si elle ne s’améliore pas en 1 ou 2 jours, un morceau de placenta est resté</td></tr><tr><td class="c-item">Saignement qui reprend plus d’un jour après la naissance, ou qui ne tarit pas</td><td>Morceau de placenta, ou infection</td><td>Frotter l’utérus, faire téter ; surveiller la fièvre</td></tr><tr><td class="c-item">Tristesse qui dure plus de deux semaines ou s’alourdit</td><td>Dépression après l’accouchement</td><td><span class="ref">Ch. 36</span> ; l’aide prend le bébé la nuit pour qu’elle dorme. L’idée de mourir : on pose la question clairement (<span class="ref">ch. 35</span>)</td></tr><tr><td class="c-item">D’un coup, le plus souvent dans les deux premières semaines : elle voit, entend ou sent des choses qui ne sont pas là ; elle tient à des idées ou à des peurs qui ne tiennent pas debout ; elle parle et pense trop vite, ne tient pas en place, ou s’effondre, ou passe de l’un à l’autre ; elle est très confuse. Souvent, elle ne se sait pas malade</td><td>Psychose d’après la naissance</td><td><strong>La vie de la mère et celle du bébé sont en jeu</strong>, et ça empire vite. Elle n’est jamais seule, ni avec le bébé ; quelqu’un veille, jour et nuit ; elle dort le plus possible, l’aide prend les tétées de nuit au biberon de lait exprimé ou à la tasse ; les armes loin d’elle (<span class="ref">ch. 35</span>). Le calme et le silence dans la maison</td></tr><tr><td class="c-item">Bébé : plus de 60 respirations par minute, tirage<sup class="fnr" data-fn="29-6">6</sup>, narines qui battent, grognement ; peau qui reste bleue plus de 5 minutes</td><td>Détresse respiratoire</td><td>Peau contre peau, au chaud ; frotter le dos ; s’il cesse de respirer, 5-F</td></tr><tr><td class="c-item">Bébé : moins de 35,5 °C ; ne tète pas ; ne bouge pas ; convulsions</td><td>Froid, infection</td><td>Peau contre peau, tétées ; <strong>sa vie est en jeu</strong></td></tr><tr><td class="c-item">Bébé : plus de 38 °C</td><td>Trop couvert, trop près du poêle — ou infection</td><td>L’éloigner de la chaleur, lui enlever une couche ou plus, le faire téter plus souvent, et reprendre sa température après la tétée. Une chaleur venue du poêle ou des couvertures retombe quand on l’enlève ; si elle ne retombe pas, ou sans cause de chaleur évidente : infection, <strong>sa vie est en jeu</strong>. Au-dessus de 40 °C, un bain d’eau tiède, environ 2 °C de moins que lui ; jamais froide : il passerait vite au froid</td></tr><tr><td class="c-item">Bébé jaune <strong>dans les 24 premières heures</strong></td><td>Jaunisse qui n’est pas celle des premiers jours : un groupe sanguin différent de celui de la mère, une infection</td><td><strong>Sa vie est en jeu</strong> ; ce qui la soigne n’est pas au chalet. Tétées, au moins 8 par 24 heures</td></tr><tr><td class="c-item">Bébé jaune et somnolent, irritable ou qui boit mal</td><td>Jaunisse qui monte</td><td>Plus de tétées, au moins 8 par 24 heures ; le réveiller pour boire</td></tr><tr><td class="c-item">Bébé jaune dont l’urine est jaune foncé ou brune, ou les selles pâles, couleur crème</td><td>Le foie ne fait pas son travail</td><td>Aucun remède ici. Ne pas confondre avec la jaunisse d’un bébé allaité qui dure jusqu’à 2 mois : s’il prend du poids et mouille et salit ses couches normalement, elle est sans gravité</td></tr><tr><td class="c-item">Yeux du bébé rouges, enflés, pleins de pus</td><td>Infection de l’œil</td><td>Laver comme à l’étape 89 ; le médicament qui la soigne n’est pas au chalet (<span class="ref">ch. 32</span>)</td></tr><tr><td class="c-item">Rougeur autour du cordon qui apparaît ou s’intensifie, pus, mauvaise odeur</td><td>Infection du cordon</td><td>Nettoyer, sécher, laisser à l’air ; c’est une infection qui demande un antibiotique, et <strong>sa vie peut être en jeu</strong></td></tr><tr><td class="c-item">Bébé qui ne tète plus, raide, pleure sans arrêt, fiévreux, dans les premiers jours</td><td>Tétanos du nouveau-né</td><td><strong>Sa vie est en jeu.</strong> Ce qui le prévient : le vaccin de la mère, fait avant ou pendant la grossesse (étape 21), puis la lame et les liens stériles ou bouillis (5-D, 9-C)</td></tr><tr><td class="c-item">Bébé qui saigne sans raison, jusqu’à 6 mois</td><td>Carence en vitamine K</td><td>Étape 87 et la note des signes ; <strong>sa vie est en jeu</strong></td></tr><tr><td class="c-item">Mastite qui ne diminue pas en 24 h, rougeur qui s’étend, bosse douloureuse</td><td>Infection du sein, abcès</td><td>Continuer d’allaiter, du froid ; l’antibiotique manque (<span class="ref">ch. 32</span>)</td></tr></tbody></table>

<p class="pt"><span class="pn">1</span><strong class="plead">DANGER</strong> </p>
<p class="pt"><span class="pn">1</span><strong class="plead">L’hémorragie après l’accouchement tue dans les 24 premières heures.</strong> C’est là que surviennent la plupart des morts. Le mécanisme : ce n’est pas un caillot qui ferme les vaisseaux du placenta, c’est l’utérus qui les écrase en durcissant. Un utérus mou, une vessie pleine ou un morceau de placenta resté dedans les laissent ouverts. <strong>Le saignement peut être caché</strong> : le sang s’accumule dans l’utérus, le dessus de l’utérus remonte dans le ventre, et la mère pâlit et s’évanouit sans qu’on voie de sang. D’où la main sur le ventre toutes les quelques minutes la première heure, même quand tout a l’air correct.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Tirer sur le cordon ou appuyer sur le ventre pour sortir le placenta</strong> peut retourner l’utérus et le faire sortir avec lui, ce qui peut tuer la mère. Le mécanisme : tant que le placenta tient à la paroi, tirer sur le cordon tire l’utérus, ou arrache le cordon. On attend, on fait téter, on fait uriner, on fait pousser ; ce qui reste quand elle saigne à en mourir est en 9-G.</p>
<p class="pt"><span class="pn">3</span><strong class="plead">Un nouveau-né qui ne respire pas a une minute.</strong> Ce qui le sauve est l’air soufflé dans ses poumons, commencé dans cette minute-là, pas le massage cardiaque. Souffler avec la poitrine au lieu des joues déchire ses poumons.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">Le froid tue le nouveau-né sans bruit.</strong> Nu à 23 °C, il perd sa chaleur comme un adulte nu à 0 °C, et mouillé, davantage. Le sécher et le mettre peau contre peau passe avant tout, sauf la respiration.</p>
<p class="pt"><span class="pn">5</span><strong class="plead">Le misoprostol donné avant la sortie du dernier bébé peut déchirer l’utérus.</strong> Il ne sert jamais à lancer ni à hâter un travail. Sans échographie, un deuxième bébé passe inaperçu : avant toute dose, la main sur le ventre (étape 70). Après une dose de prévention, on ne rajoute pas de dose : ce qu’une deuxième dose ajoute n’est pas établi, et sa toxicité possible est à craindre.</p>
<p class="pt"><span class="pn">6</span><strong class="plead">L’infection de l’utérus tue vite, et son remède n’est pas au chalet.</strong> Elle entre par les mains, par une lame ou un lien qui n’était pas stérile, par ce qu’on met dans le vagin, et par les eaux rompues depuis plus de 24 heures. La seule défense qui existe ici est de ne pas la faire entrer.</p>
<p class="pt"><span class="pn">7</span><strong class="plead">Enceinte, la listériose tue le bébé avant la naissance</strong> , dans un poisson fumé à froid ou un gibier saignant qui ont l’air, l’odeur et le goût d’un aliment sain. Pour tout le monde, le botulisme de type E du poisson fait sa toxine dès 3 °C, dans le froid du frigo ou de la cache, sans rien changer à l’odeur, au goût ni à l’apparence.</p>
<p class="pt"><span class="pn">8</span><strong class="plead">La prééclampsie et la grossesse hors de l’utérus tuent la mère.</strong> La prééclampsie fait monter la pression du sang jusqu’aux convulsions et à l’attaque dans le cerveau ; et elle peut commencer <strong>après</strong> la naissance, dans les jours ou les semaines qui suivent, quand plus personne ne la guette. La grossesse hors de l’utérus grossit dans une trompe jusqu’à la déchirer, et la mère saigne dans son ventre sans qu’on voie le sang (note 4). Pour les deux, ce qui soigne n’est pas au chalet : ce qui reste, c’est de lire les signes de la section 7 tôt, tant qu’une route existe.</p>
<p class="pt"><span class="pn">9</span><strong class="plead">Le monoxyde de carbone dans la pièce chauffée pour la naissance.</strong> Il n’a ni odeur ni couleur : on s’endort au lieu de sortir. La pièce qu’on ferme et qu’on calfeutre pour le bébé est celle où il s’accumule, et ses signes se confondent avec la fatigue du travail et de l’après (étape 25).</p>
