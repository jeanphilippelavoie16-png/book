<p class="p0">Sans poêle de fabrication, sans tuyau, sans cabane, sans thermomètre : un bain de chaleur se fait encore, parce que tout ce qu’il demande est une pièce qui garde l’air et des pierres qui gardent la chaleur. Chaque version en dessous est plus dangereuse que la précédente, et chacune dit pourquoi.</p>
<h3 class="sub">Le bain de vapeur sous une bâche</h3>
<p class="p0">C’est la version sans rien : des perches, une bâche, des pierres et un feu dehors.</p>
<p class="p0 ri"><strong class="runin">Le principe.</strong> Les pierres chauffent dans un feu <strong>à l’extérieur</strong>, puis on les porte dans un abri fermé et on les arrose. Aucun feu dans l’abri, donc aucun tuyau à monter. La chaleur dure ce que durent les pierres.</p>
<p class="p0 lab kh"><strong class="runin">L’abri.</strong></p>
<p class="step"><span class="sn">1</span><strong>Choisir un replat à l’abri du vent, près du feu des pierres</strong>, assez près pour porter une pierre à la pelle sans courir, assez loin pour qu’une flammèche ne tombe pas sur la bâche. Loin des arbres morts et du bûcher.</p>
<p class="step"><span class="sn">2</span><strong>L’armature : des perches vertes pliées en dôme</strong>, les bouts plantés dans la neige tapée ou la terre, attachés au sommet et croisés à mi-hauteur. Assez haut pour s’asseoir, pas plus : chaque volume de trop est de l’air à chauffer avec des pierres qui refroidissent. À défaut de perches qui plient, trois perches en trépied contre un arbre ou un appentis appuyé à un rocher.</p>
<p class="step"><span class="sn">3</span><strong>La couverture : la bâche, puis par-dessus ce qui isole</strong> — une deuxième bâche, des couvertures de laine, des branches de sapin, de la neige pelletée contre le bas. Une bâche seule laisse partir la chaleur en quelques minutes ; doublée, elle la garde. Le bas se ferme à la neige tapée, comme le bas de la toile de la tente d’hiver (<span class="ref">ch. 12</span>) : c’est par là que l’air froid entre.</p>
<p class="step"><span class="sn">4</span><strong>La porte : un rabat</strong> de bâche ou de couverture, lesté en bas d’une perche, qui se pousse de l’intérieur. Jamais attaché : quelqu’un qui se sent mal doit sortir d’un coup d’épaule.</p>
<p class="step"><span class="sn">5</span><strong>Une petite ouverture en haut</strong>, du côté opposé à la porte, qu’on agrandit ou qu’on bouche d’un bout de bâche : l’air usé sort par là, l’air frais entre par le bas de la porte. C’est la ventilation de l’étape 7, en toile.</p>
<p class="step"><span class="sn">6</span><strong>Le bac à pierres au centre, séparé des gens.</strong> Une vieille marmite de fonte, un demi-baril ou une grande poêle d’acier, jamais galvanisés (section 5-C), le tout posé sur un lit de pierres plates ; à défaut, un trou creusé jusqu’au sol et tapissé de pierres. Autour, <strong>une barrière de deux billes vertes</strong> couchées, qui marquent la limite qu’on ne franchit pas et qui arrêtent le pied qui glisse. La bâche ne touche jamais le bac ni les pierres : une bâche de plastique fond, coule et prend feu au contact d’une pierre qui sort d’un feu.</p>
<p class="step"><span class="sn">7</span><strong>Le plancher : du sapinage épais, posé en écailles comme au <span class="ref">ch. 12</span> (section 5-E), gardé loin du bac.</strong> Le sapinage sec qui touche une pierre chaude s’enflamme ; on garde un rond de sol nu autour du bac, comme autour du poêle de la tente.</p>
<p class="p0 lab kh"><strong class="runin">Les pierres.</strong></p>
<p class="step"><span class="sn">8</span><strong>Les mêmes pierres qu’au sauna</strong> (étapes 10 à 14) : sèches, foncées, denses, éprouvées au feu <strong>avant</strong> le jour du bain. Une pierre inconnue qui éclate dans un abri de toile éclate à hauteur de figure de gens assis.</p>
<p class="step"><span class="sn">9</span><strong>Les chauffer longtemps, au cœur du feu</strong>, empilées sur un lit de bûches, recouvertes de bois, le feu nourri jusqu’à ce qu’il tombe en braises. Elles sont prêtes quand une goutte d’eau jetée dessus ne s’étale pas mais danse en sifflant et disparaît.</p>
<p class="step"><span class="sn">10</span><strong>Les sortir à la pelle, ou avec deux bâtons verts taillés en pince</strong>, comme les pierres à faire bouillir l’eau (<span class="ref">ch. 10</span>, section 9).</p>
<p class="step"><span class="sn">11</span><strong>Brosser chaque pierre avant qu’elle entre.</strong> Une branche verte de sapin, deux ou trois coups dehors : on fait tomber les braises, le charbon et la cendre collés dessus. <strong>C’est l’étape qui empêche le monoxyde.</strong> Des pierres seules n’en font presque pas ; ce sont les braises et le charbon qu’on laisse avec elles qui en font, et l’eau jetée dessus ne le chasse pas tant qu’elles sont là. Pas une braise sous la bâche.</p>
<p class="step"><span class="sn">12</span><strong>Charger le bac, fermer, attendre que l’air se réchauffe</strong> avant de jeter la première eau.</p>
<p class="p0 lab kh"><strong class="runin">Le bain.</strong></p>
<p class="step pk-d"><span class="sn">13</span><strong>Toujours à deux, jamais après un verre.</strong> Les règles de la section 8 valent ici plus qu’ailleurs : il n’y a ni porte qui s’ouvre toute seule, ni thermomètre, ni avertisseur possible sous la bâche.</p>
<p class="step"><span class="sn">14</span><strong>L’eau à la louche, tiède, une à la fois, annoncée</strong>, personne penché au-dessus du bac. La vapeur monte d’un coup ; le visage au-dessus est le premier brûlé.</p>
<p class="step"><span class="sn">15</span><strong>Des séances plus courtes qu’au sauna.</strong> Sans thermomètre, la mesure est le corps, et le corps se trompe dans la chaleur mouillée : on sort avant d’en avoir envie, et au premier mal de tête, étourdissement ou nausée.</p>
<p class="step pk-d"><span class="sn">16</span><strong>Sortir vers le chaud, pas vers la neige.</strong> On sort à quatre pattes, on s’assoit, puis on traverse <strong>habillé</strong> au chalet ou dans la tente chauffée. La chaleur des pierres ne suit pas dehors, et un corps mouillé à −30 °C perd sa chaleur par l’eau et par l’air en même temps (<span class="ref">ch. 31</span>, section 8, point 6).</p>
<p class="step"><span class="sn">17</span><strong>Les enfants de 4 et 6 ans</strong> entrent à la fin, quand les pierres ont baissé, une courte séance, assis de l’autre côté de la barrière de billes avec un adulte entre eux et le bac, et pas d’eau sur les pierres pendant qu’ils sont là. Un bac de pierres est au niveau d’un enfant assis, comme la truie du sauna l’est d’un enfant debout : d’où la barrière ici et la garde de fer là-bas (section 5-A, étape 6).</p>
<p class="step"><span class="sn">18</span><strong>Après :</strong> les pierres restent dans le bac jusqu’au lendemain ; le feu dehors se noie ou se couvre de neige, et on vérifie qu’il ne couve pas avant de se coucher.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd.</strong> La mesure : ni thermomètre, ni avertisseur, ni porte, rien qui arrête une erreur avant le corps. La durée : la chaleur baisse dès que les pierres entrent, et relancer demande de ressortir, de rechauffer et de rebrosser. Le lavage : on sue, mais on se lave mieux au chalet, à l’eau chaude. La marge : chaque danger du sauna est présent, plus la bâche qui brûle et les pierres au ras du sol.</p>
<h3 class="sub">Le sauna dans la tente d’hiver</h3>
<p class="p0">La tente à poêle du <span class="ref">ch. 12</span> fait un sauna quand elle est de toile. On monte au-dessus du poêle de tôle une petite cage de fil de fer ou de treillis, ni l’un ni l’autre galvanisé, remplie de pierres éprouvées. Elle ne repose pas sur la tôle mince du dessus : ses pattes portent sur les pieux du <span class="ref">ch. 12</span> (section 5-D), ou sur deux traverses de fer liées d’un pieu à l’autre, <strong>jamais dans la neige</strong>, qui fond sous le poêle et la ferait pencher contre lui ou contre la toile. Les pierres restent sur le poêle, pas autour du tuyau. Toutes les règles du <span class="ref">ch. 12</span> s’appliquent, et certaines deviennent plus sévères :</p>
<p class="li"><strong>quelqu’un de sec et habillé veille</strong> le poêle pendant qu’un autre sue, et le feu est mort avant que le dernier adulte se couche ;</p>
<p class="li"><strong>l’avertisseur de CO de la tente quitte sa place pendant le sauna</strong> : la chaleur et la vapeur le sortent de sa plage, et c’est lui qui gardera la nuit. Il passe dans la poche intérieure de celui qui veille, contre le corps, et revient au coucher comme le veut le <span class="ref">ch. 12</span> (section 5-F, point 3) : bouton d’essai, affichage lu ;</p>
<p class="li"><strong>pas d’eau jetée près de la toile</strong> : la vapeur se dépose sur la toile froide, y gèle la nuit et retombe en pluie au premier feu du matin, comme le givre d’haleine du <span class="ref">ch. 12</span> ; on arrose seulement les pierres, peu à la fois ;</p>
<p class="li"><strong>une tente de nylon ne fait pas de sauna</strong> : le nylon fond là où la toile roussit ;</p>
<p class="li">le rond de neige nue autour du poêle reste nu, sapinage loin.</p>
<p>Ce qu’on perd : la tente est l’abri où on dort, et on y met de l’humidité qu’elle mettra des jours à perdre. C’est une chaleur d’occasion, pas un sauna de semaine.</p>
<h3 class="sub">Le sauna à fumée, quand il n’y a pas de tuyau</h3>
<p class="p0">C’est la forme la plus ancienne du sauna, et la seule cabane de sauna qui se bâtit sans une pièce de métal : un poêle de pierres sèches dans une cabane, la fumée qui sort par la porte et par une trappe sous le toit.</p>
<p class="p0 ri"><strong class="runin">Le poêle.</strong> Un foyer étroit entre deux murets de grosses pierres sèches, et un toit de pierres qui le franchit ; par-dessus, le tas de pierres de sauna, les plus grosses en bas. Les vieux saunas finlandais montaient ce toit en voûte de pierres sans mortier, ce qui demande un savoir de maçon que ce livre n’enseigne pas. Le plus simple est une dalle plate, épaisse et dense, posée en travers du foyer comme un linteau, ou deux dalles appuyées l’une contre l’autre en toit. Plus le foyer est étroit, moins la dalle travaille : on le fait juste assez large pour les bûches refendues, et la dalle porte à plat sur toute l’épaisseur de chaque muret. Chaque pierre porteuse passe l’épreuve du feu et de l’eau de la section 5-B (étape 14), dehors, avant d’être montée : une dalle qui se fend fait tomber le tas dans le foyer. Si une pierre porteuse craque pendant une chauffe, on laisse mourir le feu, personne n’entre, et on défait le poêle à froid pour la remplacer. Le feu chauffe directement les pierres, et la fumée remplit la cabane avant de sortir. Les pierres et les murs emmagasinent la chaleur des heures durant.</p>
<p class="p0 ri"><strong class="runin">La cabane</strong> est celle de la section 5-A (étapes 2 à 4), petite, basse, porte vers l’extérieur sans loquet, avec une trappe près du toit, du côté opposé à la porte.</p>
<p class="p0 lab kh"><strong class="runin">La chauffe.</strong></p>
<p class="step"><span class="sn">1</span><strong>La fumée sort d’abord par la porte ouverte, puis par la trappe haute.</strong> Elle doit sortir lentement, sans coup de vent, et sa couche doit rester le plus haut possible — au niveau du banc ou plus haut. On règle avec la trappe et la porte ; l’été, si le vent le permet, tout reste ouvert.</p>
<p class="step"><span class="sn">2</span><strong>Bois sec, mélangé, coupé le plus petit possible : 2 à 5 cm.</strong> Le petit bois fait six fois moins de monoxyde que le gros. La dernière charge se fait en tout petit bois de peuplier faux-tremble (<em>Populus tremuloides</em>) ou d’aulne rugueux (<em>Alnus incana</em>) ; l’aulne n’a pas de gomme.</p>
<p class="step pk-c"><span class="sn">3</span><strong>Viser une chaleur basse et égale : 60 à 80 °C.</strong> Un sauna à fumée trop chaud se gâte.</p>
<p class="step"><span class="sn">4</span><strong>Chaque charge fait un pic de monoxyde</strong>, très haut au premier allumage, puis à chaque ajout.</p>
<p class="p0 lab kh"><strong class="runin">Avant d’entrer.</strong></p>
<p class="step"><span class="sn">5</span><strong>Attendre au moins une heure</strong>, porte et trappe ouvertes, que les braises s’éteignent et que la fumée parte.</p>
<p class="step"><span class="sn">6</span><strong>Sortir le charbon et la cendre</strong> au contenant métallique. C’est l’étape qui décide : fermer la trappe sur des braises pour garder la chaleur fait monter le monoxyde très haut et l’y garde, et l’eau jetée sur les pierres <strong>ne le chasse pas</strong> tant qu’il reste des braises — elle les ranime. Une fois les braises sorties, l’eau sur les pierres n’en fait presque plus.</p>
<p class="step"><span class="sn">7</span><strong>Fermer seulement ensuite</strong>, et entrer comme dans le sauna de la section 5-E.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd.</strong> Des heures de bois et de surveillance pour chaque bain. La propreté : la suie noircit tout, et on en ressort marqué si on s’appuie au mur. Et surtout la marge sur le monoxyde : c’est la version où il est le plus présent, et la seule protection est d’attendre et de sortir les braises. Personne n’entre « pour voir » avant l’heure. Les enfants de 4 et 6 ans n’y vont que lorsque les adultes y ont passé une première séance sans le moindre mal de tête.</p>
<h3 class="sub">La cage et le baril, sans soudeuse</h3>
<p class="p0">La cage à pierres de la truie se fait sans poste, parce que rien n’y pend à une ligature : les deux piles de pierres sèches de l’étape 6 portent tout, et les barres ne font que s’y poser. Le fond de treillis ou de fers croisés repose sur les barres, au-dessus du baril, sans le toucher. Les quatre fers debout qui tiennent le tas sur les côtés se lient aux barres et se cerclent à deux hauteurs de fil de fer doublé et tordu à la pince (<span class="ref">ch. 107</span>, section 9-D) ; une ligature tient mal en traction, et elle ne sert ici qu’à retenir les pierres de côté. Les cerceaux d’un deuxième baril, coupés au ciseau à froid, font les cercles. Avec des batteries d’auto montées en série (<span class="ref">ch. 107</span>, section 9-A), on soude au lieu de ligaturer. <strong>Ce qu’on perd</strong> : une cage ligaturée se relâche en chauffant ; on resserre le fil à froid avant chaque saison, et une pile de pierres qui a bougé se remonte avant le feu.</p>
<h3 class="sub">Le balai de bouleau</h3>
<p class="step"><span class="sn">1</span><strong>En été, par temps sec</strong>, couper des branches de bouleau à papier (<em>Betula papyrifera</em>) d’environ 50 cm, pleines de feuilles, sans en couper le bout. Pas de branches mouillées, pas de branches de cime trop minces, pas de branches pendantes trop molles.</p>
<p class="step"><span class="sn">2</span><strong>Les réunir, le dessous pâle des feuilles vers l’extérieur</strong>, et lier le manche à deux endroits d’une pousse de saule (<em>Salix</em> spp.) d’un an, tordue pour l’assouplir, le bout repassé dans le manche.</p>
<p class="step"><span class="sn">3</span><strong>Pour l’hiver</strong> : le suspendre dans un endroit frais, sombre et aéré pour le faire sécher, ou l’enfermer tout de suite dans un sac en chassant l’air et la geler dehors.</p>
<p class="step"><span class="sn">4</span><strong>Avant de s’en servir</strong>, tremper un balai séché environ une heure et demie à deux heures dans de l’eau tiède ; entre deux coups, le garder dans une chaudière d’eau presque froide. <strong>Jamais dans l’eau chaude ni sur les pierres.</strong></p>
<p class="step"><span class="sn">5</span>On s’en fouette doucement les jambes, le dos et les bras : ça remue l’air chaud contre la peau et ça sent la forêt d’été.</p>
<h3 class="sub">Dormir au chaud sans chauffer la nuit</h3>
<p class="p0">Quand le bois manque et que le poêle meurt à minuit, ce qu’on garde chaud, c’est le lit, pas la pièce :</p>
<p class="li"><strong>autant sous soi que sur soi</strong> : couvertures pliées sous le corps, sapinage sous le matelas, ou le matelas monté sur des planches plutôt que posé au plancher froid ;</p>
<p class="li"><strong>la roche du poêle ou la bouteille d’eau chaude</strong> au pied du lit, enveloppée (<span class="ref">ch. 06</span>, section 9) : des pieds chauds font s’endormir ;</p>
<p class="li"><strong>la tuque</strong>, toute la nuit ;</p>
<p class="li"><strong>les deux enfants dans le même lit</strong>, dans la pièce la plus chaude, près de la cible de 19 °C du <span class="ref">ch. 39</span> ; les adultes dorment dans la pièce plus froide, dans un lit chaud.</p>
<p>Ce qu’on perd : la marge pour les enfants, qui se découvrent. Celle des adultes aussi, en partie : une chambre froide ne gâte pas leur sommeil, mais le froid agit sur leur cœur par le visage et l’air respiré sans les réveiller, et c’est pour ça qu’elle se garde au-dessus de 10 °C même dans un lit chaud (étape 51).</p>
<h3 class="sub">La lumière, sans lampe de luminothérapie</h3>
<p class="p0">Une lampe de luminothérapie donne environ 10 000 lux à une trentaine de centimètres. Une chandelle donne environ 11 lux à la même distance. Il en faudrait de l’ordre de <strong>900</strong> pour faire la même chose, et 900 chandelles dans une pièce sont 900 feux et 900 sources de monoxyde (<span class="ref">ch. 85</span>). La lumière qui soigne l’hiver ne se fabrique pas au chalet : elle est dehors, et elle est gratuite.</p>
<p class="li"><strong>Sortir dans l’heure du réveil, ou dès qu’il fait clair, une heure si on peut</strong> (étape 55). Même sous un ciel bas de janvier, le dehors donne des centaines à des milliers de fois la lumière d’une pièce éclairée à la chandelle.</p>
<p class="li"><strong>Déplacer la journée vers la lumière</strong> (<span class="ref">ch. 85</span>) : le travail fin et les repas de famille se font quand il fait jour, à la fenêtre ; la veillée se fait à la flamme basse.</p>
<p class="li"><strong>Blanchir ce qui entoure la place du matin</strong> : un drap blanc au mur, une tôle polie. Ça ne fait pas une lampe de luminothérapie, ça rend la table du déjeuner moins sombre.</p>
<p>Ce qu’on perd : les jours où le froid interdit de sortir (seuils du <span class="ref">ch. 25</span>). Ces jours-là, il n’y a pas de remplacement : la chaise à la fenêtre, et la sortie du lendemain.</p>
<h3 class="sub">Le massage et l’étirement, avec rien</h3>
<p class="p0">Le gras propre de la cuisine — suif ramolli dans les mains, graisse d’ours ou d’orignal fondue et refroidie — fait l’huile de massage ; la graisse rance va aux lampes (<span class="ref">ch. 85</span>), pas sur la peau. Les étirements de l’étape 62 ne demandent qu’un banc et le plancher. Ce qu’on perd : rien, sinon le temps de le faire.</p>
<h3 class="sub">Ce qui ne se remplace pas</h3>
<p class="p0 ri"><strong class="runin">L’avertisseur de CO du vestiaire.</strong> Il ne voit rien de la pièce chaude, il ne vaut rien sous 4,4 °C, et pourtant rien d’autre ne voit le monoxyde. Sans lui, ou avec lui dans un vestiaire froid, la prévention reste — poêle qui brûle vif, charges avant la séance, enfants après la dernière charge, braises sorties, sortie au premier mal de tête — et ne prévient de rien.</p>
<p class="p0 ri"><strong class="runin">Une deuxième personne.</strong> Aucune variante ne remplace quelqu’un qui voit l’autre tomber.</p>
<p class="p0 ri"><strong class="runin">La lumière du jour.</strong> Rien de ce qui brûle ou s’allume au chalet n’en approche.</p>
</template>
<template id="notes">
<p class="fn" data-fn="28-1"><span class="fnn">1</span>Chez l’enfant couché calme, torse nu : à chaque inspiration, le bas de la cage thoracique se creuse vers l’intérieur pendant que le haut du ventre se soulève. Ça compte seulement si c’est permanent et bien visible au repos ; un creux qui paraît quand l’enfant pleure ou mange, ou la peau qui se creuse seulement entre les côtes ou au-dessus de la clavicule, ne suffit pas. Chez l’adulte, c’est la peau qui se creuse entre les côtes ou au-dessus des clavicules.</p>
<p class="fn" data-fn="28-2"><span class="fnn">2</span>Les narines s’ouvrent grand à chaque inspiration, comme chez quelqu’un qui vient de courir, alors que la personne est couchée au repos.</p>
<p class="fn" data-fn="28-3"><span class="fnn">3</span>Un son court, répété, comme un petit grognement ou une plainte, à chaque expiration : l’enfant ferme à moitié sa gorge pour garder de l’air dans ses poumons.</p>
<p class="fn" data-fn="28-4"><span class="fnn">4</span>Un son rauque et aigu qu’on entend quand la personne <strong>inspire</strong>, pas quand elle expire. Au repos, il veut dire que le passage de l’air dans la gorge est en train de se fermer.</p>
<p class="fn" data-fn="28-5"><span class="fnn">5</span>Presser fermement le flanc d’un verre transparent sur la tache et regarder à travers. Une tache qui pâlit et disparaît sous la pression est une rougeur ordinaire. <strong>Une tache qui reste visible à travers le verre</strong> est du sang sorti sous la peau. Elle commence souvent en petits points rouges comme des piqûres d’épingle, puis s’étend en taches rouges ou violettes. Sur une peau foncée, on regarde les zones pâles : paumes, plantes des pieds, palais, blanc des yeux, intérieur des paupières. Tous les malades graves n’ont pas de taches : leur absence ne rassure pas.</p>
<p class="fn" data-fn="28-6"><span class="fnn">6</span>La personne couchée ou assise, on lui demande d’amener le menton sur la poitrine, ou on soulève doucement sa tête pour le faire. Une nuque raide résiste : le geste est très douloureux, parfois impossible, alors que tourner la tête de côté l’est beaucoup moins. Le signe se cherche chez l’enfant plus vieux et l’adulte ; le tout-petit peut ne pas l’avoir.</p>
<p class="fn" data-fn="28-7"><span class="fnn">7</span>Le bleu ou le gris se voit d’abord aux lèvres, à la langue, aux gencives et sous les ongles ; sur une peau foncée, aux paumes, aux lèvres, à la langue, aux gencives et autour des yeux. Il apparaît tard, quand il manque déjà beaucoup d’oxygène.</p>
<p class="fn" data-fn="28-8"><span class="fnn">8</span>Une peau tachetée de violet, de gris et de pâle, comme du marbre ; sur une peau foncée, elle se voit mieux aux paumes et à la plante des pieds. Avec la fièvre et des mains et des pieds froids, c’est la circulation qui se ferme à la peau pour garder le sang au centre du corps (<span class="ref">ch. 26</span>, section 8).</p>
<p class="fn" data-fn="28-9"><span class="fnn">9</span>Une fièvre qui dure au moins 5 jours et ne cède pas aux médicaments, le plus souvent chez un enfant de moins de 5 ans, avec plusieurs de ces signes : les yeux rouges <strong>sans écoulement</strong>, apparus au bout d’un ou deux jours ; les lèvres rouges, sèches et fendues, la langue rouge comme une fraise ; les paumes et la plante des pieds rouges ou violacées, les mains et les pieds enflés ; une éruption de taches rouges sur le tronc ; des ganglions enflés au cou. Vers le 10e jour, la peau du bout des doigts pèle.</p>
<p class="fn" data-fn="28-10"><span class="fnn">10</span>Derrière l’oreille, sur l’os qu’on sent en arrière du pavillon : une bosse rouge, chaude, douloureuse au toucher, qui pousse le pavillon vers l’avant et le décolle de la tête. On compare avec l’autre côté, en regardant l’enfant de face puis de derrière. L’enfant est fatigué, irritable, entend moins de ce côté.</p>
<p class="fn" data-fn="28-11"><span class="fnn">11</span>Des gestes brusques, sans but, que l’enfant ne contrôle pas, des mains d’abord, puis des pieds et du visage, avec des grimaces ; ils disparaissent pendant le sommeil. Dans les cas légers, l’enfant a seulement l’air maladroit et peine à s’habiller et à manger. Ils peuvent n’apparaître qu’une fois tous les autres signes disparus.</p>
<p class="fn" data-fn="28-12"><span class="fnn">12</span>L’enfant a une forte fièvre apparue en moins d’une journée, il est anxieux, assis, penché en avant, la bouche ouverte, la salive qui coule parce qu’avaler fait trop mal. Il ne tousse pas et sa voix n’est pas rauque, ce qui le distingue du croup, où la toux aboie. Il refuse de se coucher : c’est sa façon de garder l’air ouvert.</p>
<p class="fn" data-fn="28-13"><span class="fnn">13</span>Un mal de gorge qui s’aggrave au lieu de passer, plus fort d’un côté ; la voix étouffée, comme avec une patate chaude dans la bouche ; la bouche qui n’ouvre plus qu’à moitié parce que les mâchoires se contractent ; à la lampe, un côté du fond de la gorge bombe et pousse la luette — le petit bout de chair qui pend au milieu — vers l’autre côté.</p>
<p class="fn" data-fn="28-14"><span class="fnn">14</span>On demande à la personne de suivre un doigt des yeux, à gauche, à droite, en haut, en bas. Dans l’infection de l’orbite, bouger l’œil fait mal, un œil suit moins bien que l’autre, elle voit le doigt en double ; vu de profil ou d’en haut, l’œil malade dépasse l’autre.</p>
<p class="fn" data-fn="28-15"><span class="fnn">15</span>Aucune urine depuis plus de 8 heures ; pas de larmes quand il pleure ; les yeux enfoncés ; la bouche et la langue sèches ; une soif extrême, ou au contraire un enfant qui ne veut plus boire ; une respiration plus rapide ; étourdi ou confus ; une peau froide et bleutée qui, pincée doucement entre deux doigts, ne reprend pas sa place tout de suite.</p>
<p class="fn" data-fn="28-16"><span class="fnn">16</span>Un vomi vert franc, ou jaune-vert comme de l’herbe écrasée : c’est de la bile. Chez un enfant, c’est un signe qui ne se discute pas, même si le reste a l’air d’une gastro ordinaire.</p>
<p class="fn" data-fn="28-17"><span class="fnn">17</span>Des traînées rouges, chaudes et douloureuses partent de l’infection et remontent le long du bras ou de la jambe, vers l’aisselle ou l’aine, souvent avec fièvre et frissons : l’infection gagne les vaisseaux lymphatiques (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-18"><span class="fnn">18</span>La peau craque sous le doigt quand on appuie, comme s’il y avait des bulles dessous : c’est du gaz que l’infection fabrique. Elle peut aussi virer au bronze, au violet ou au noir et se couvrir de cloques au liquide brun. La douleur est bien plus forte que ce que la peau laisse voir, puis la zone devient insensible (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-19"><span class="fnn">19</span>Le triangle qui va des coins de la bouche jusqu’à la racine du nez, entre les yeux : le nez, la lèvre du haut, les ailes du nez, le creux à côté du nez. Les veines de cette zone se vident vers une grosse veine à la base du crâne, derrière les yeux.</p>
<p class="fn" data-fn="37-1"><span class="fnn">1</span>Une douleur d’angine stable vient à un effort connu, toujours le même, reste courte et passe au repos. Celle qui interdit le sauna est prolongée et vient d’ordinaire au repos. Elle peut annoncer un infarctus : ce signe veut dire que la vie est en jeu, et la chaleur n’a rien à y faire.</p>
<p class="fn" data-fn="37-2"><span class="fnn">2</span>Dans les premières minutes d’un arrêt du cœur, la personne inconsciente fait souvent encore des bouffées : des halètements bruyants, comme un ronflement, de plus en plus espacés, la bouche qui s’ouvre comme celle d’un poisson sorti de l’eau. Ce n’est pas une respiration, c’est le signe de l’arrêt.</p>
</template>

  if(kind === 'open') bl.innerHTML = document.getElementById('open').innerHTML;
  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
