<p class="p0">Plus de levure, plus de poudre à pâte, plus de four, plus de farine de magasin, pas de moulin : le pain ne disparaît pas, il change de forme. Chaque forme se paie en quelque chose, et c’est dit à chaque fois.</p>
<h3 class="sub">9-A. Plus de levure</h3>
<p class="p0 ri"><strong class="runin">Le levain part aussi de la farine qu’on moud soi-même.</strong> Elle porte les mêmes microbes du champ que celle du sac ; un levain de farine complète fraîche se part comme en 5.A. Ce qu’on perd : rien, sinon les semaines d’un levain neuf.</p>
<p class="p0 ri"><strong class="runin">La réserve séchée revit.</strong> Une cuillerée d’écailles, une cuillerée d’eau tiède, une cuillerée de farine, au chaud. Le lendemain, on double, et ainsi de suite chaque jour jusqu’à ce qu’il double entre deux repas. Ce qu’on perd : quelques jours. Si rien ne bouge après plusieurs jours de repas au chaud, le pot est mort, et on repart de farine et d’eau.</p>
<p class="p0 ri"><strong class="runin">Le morceau de pâte gardé.</strong> Avant de façonner les miches, on garde une boule de pâte levée dans un pot, et on la nourrit comme un levain. C’est le même principe : une part de ce qui fermente ensemence la suite. Ça évite d’entretenir deux choses quand on cuit souvent.</p>
<p class="p0 ri"><strong class="runin">Le levain emprunté.</strong> Un voisin ou un membre du groupe de chasse qui a un levain en a pour tout le monde : une cuillerée en part un autre. Les mineurs du Klondike faisaient exactement ça, et certains levains qui ont passé la piste Chilkoot vivent encore (<span class="ref">ch. 16</span> pour ce qui se partage entre voisins).</p>
<p class="p0 ri"><strong class="runin">Le dernier sachet de levure.</strong> La levure du sachet est <em>Saccharomyces cerevisiae</em>, l’espèce qu’on trouve le plus souvent dans les levains. Un levain se part aussi au sachet : un sachet de levure saupoudré dans 375 mL d’eau tiède, 375 mL de farine incorporée peu à peu, un pot couvert légèrement, au chaud pendant 24 heures, 72 heures pour un goût plus prononcé. Ensuite, il se nourrit comme un autre. Les prospecteurs du Klondike, eux, partaient le plus souvent d’un simple mélange de farine et d’eau, comme en 5.A. Ce qu’on perd : le dernier sachet, qui ne servira plus à une fournée rapide.</p>
<p class="p0 ri"><strong class="runin">Le pain sans levée.</strong> Sans rien pour lever, la pâte de farine, d’eau et de sel s’étale mince et cuit vite au poêlon ou sur la pierre (9-C). Ce qu’on perd : la mie et le volume. Ce qu’on garde : toutes les calories de la farine, et le bois d’un four tenu chaud de trois quarts d’heure à une heure.</p>
<h3 class="sub">9-B. Plus de poudre à pâte</h3>
<p class="p0 ri"><strong class="runin">La bannique au levain.</strong> On remplace la poudre à pâte par une bonne part de levain mûr, on réduit l’eau d’autant, et on laisse la pâte reposer au chaud quelques heures avant de la cuire. Elle lève moins qu’avec la poudre et goûte l’aigre. Ce qu’on perd : les vingt minutes ; ce qui se cuisait tout de suite se prépare le matin pour le souper.</p>
<p class="p0 ri"><strong class="runin">Le bicarbonate et l’acide.</strong> Le bicarbonate seul ne fait rien ; avec un acide, il fait du gaz tout de suite. Les anciens pains bruns à la vapeur le mariaient au lait suri. Au chalet, l’acide, c’est le levain. Le dosage se trouve à la fournée : s’il reste un goût de savon, il y avait plus de bicarbonate que d’acide, et on en met moins la fois suivante.</p>
<p class="p0 ri"><strong class="runin">Rien du tout.</strong> La bannique sans poudre ni levain est une galette : aplatie mince, piquée, cuite vite. Elle se mange, elle se garde sèche, et elle voyage dans une poche.</p>
<h3 class="sub">9-C. Plus de four</h3>
<p class="p0 ri"><strong class="runin">La bannique dans le sable, telle que la cuisent les Innus.</strong> C’est la façon de cuire un pain épais sans four, sans chaudron et sans poêlon. Il lui faut un banc de sable sec, et la Côte-Nord n’en manque pas.</p>
<p class="step"><span class="sn">1</span>Trouver du sable sec, pris en hauteur : une plage au-dessus de l’eau, un talus sablonneux. Pas de galets ramassés sous l’eau ou sous la neige autour du feu : une pierre gorgée d’eau éclate à la chaleur (<span class="ref">ch. 87</span>).</p>
<p class="step"><span class="sn">2</span>Faire un bon feu directement sur le sable et le laisser tomber jusqu’à ce qu’il ne reste que la braise : c’est elle qui a chauffé le sable dessous.</p>
<p class="step"><span class="sn">3</span>Pendant ce temps, faire une pâte de bannique ferme (5.E, ou 9-B sans poudre), en galette ronde et épaisse, bien farinée dessus et dessous : la farine sèche empêche le sable de coller.</p>
<p class="step"><span class="sn">4</span>Écarter la braise. Poser la galette à même le sable chaud, la couvrir d’une couche de sable chaud, puis ramener la braise par-dessus.</p>
<p class="step"><span class="sn">5</span>Laisser cuire lentement, environ trois quarts d’heure.</p>
<p class="step"><span class="sn">6</span>Dégager la galette avec un bâton, la secouer et la brosser. Elle sonne creux quand on la frappe ; la sonde au cœur lit 88 °C ou plus. Si elle est encore molle, elle retourne sous le sable.</p>
<p>Ce qu’on perd : un peu de croûte, qu’on gratte, et le contrôle du feu, parce qu’on ne voit pas le pain cuire. Ce qu’on gagne : aucun ustensile, et un pain qui cuit pendant qu’on fait autre chose. La planche montre la coupe.</p>
<p class="p0 ri"><strong class="runin">Le pain à la vapeur, sur le poêle qui chauffe déjà.</strong> Le chaudron d’eau qui reste en permanence sur le poêle (<span class="ref">ch. 87</span>, étape 19) ne suffit pas tel quel : il sert à la vaisselle et n’est pas tenu au bouillon. Pour la vapeur, il passe sur la zone chaude et bout à gros bouillons, couvercle fermé, pendant toute la cuisson.</p>
<p class="step"><span class="sn">1</span>Graisser l’intérieur d’une boîte de conserve vide, propre, ou d’une petite chaudière de métal à couvercle. Pas de galvanisé : la pâte, mouillée et chaude contre le métal pendant des heures, prend le plomb que le galvanisé d’avant 1994 peut contenir, et une pâte au levain, acide, attaque le métal plus encore (<span class="ref">ch. 94</span> et 80).</p>
<p class="step"><span class="sn">2</span>La remplir aux deux tiers, jamais plus, de pâte au levain qui a levé une fois, ou de pâte de bannique.</p>
<p class="step"><span class="sn">3</span>Fermer avec un couvercle graissé — une soucoupe, un rond de tôle — et l’attacher à la ficelle ou à la broche : la pâte qui lève pousserait un couvercle simplement posé.</p>
<p class="step"><span class="sn">4</span>Poser le moule sur un trépied dans le chaudron (trois écrous, un rond de broche), verser de l’eau bouillante jusqu’à mi-hauteur du moule, couvrir le chaudron. Ajouter de l’eau bouillante à mesure qu’elle baisse, jamais de l’eau froide.</p>
<p class="step"><span class="sn">5</span>Cuire jusqu’à 88 °C ou plus au cœur. Les anciens pains bruns à la vapeur, des pâtes lourdes, cuisaient de 3 h 30 à 4 heures selon la pâte.</p>
<p>Ce qu’on perd : la croûte, des heures, et la zone chaude du poêle, tenue assez vive pour garder le bouillon tout ce temps ; l’hiver, ce feu chauffe la maison de toute façon. Ce qu’on ne perd pas : le pain, qui ne peut pas brûler dans une vapeur à 100 °C.</p>
<p class="p0 ri"><strong class="runin">La bannique au bâton.</strong> Une pâte ferme, roulée en boudin et enroulée en spirale serrée autour d’une baguette verte écorcée, de bouleau ou de peuplier ; jamais de cèdre (thuya, <em>Thuja occidentalis</em>), dont la thuyone est convulsivante, jamais de cerisier, dont le rameau cassé sent l’amande amère d’un composé cyanogène, ni d’if (<span class="ref">ch. 94</span>). Tenue au-dessus de la braise, pas dans la flamme, et tournée. Elle est cuite quand elle glisse du bâton et sonne creux. C’est le pain que l’enfant de 6 ans peut cuire lui-même au feu du soir. Ce qu’on perd : la quantité ; c’est du pain à la bouchée.</p>
<p class="p0 ri"><strong class="runin">La galette sur la pierre plate.</strong> Une pierre plate, sèche, ramassée en hauteur (<span class="ref">ch. 87</span>), posée au bord des braises jusqu’à ce qu’une goutte d’eau y grésille, graissée, et la pâte étalée mince dessus, retournée une fois. C’est la cuisson la moins exigeante du chapitre. Ce qu’on perd : l’épaisseur, parce qu’une galette épaisse brûle dessous avant de cuire au cœur.</p>
<p class="p0 ri"><strong class="runin">Les grands-pères sur le bouilli.</strong> Une pâte de bannique molle, déposée à la cuillère sur un ragoût qui mijote, couvercle fermé et jamais soulevé : la vapeur du chaudron les cuit. Ils sont cuits quand une brindille plantée au centre ressort sèche. La viande du ragoût, elle, reste soumise à sa règle : le gibier atteint 74 °C à cœur (<span class="ref">ch. 87</span>). Ce qu’on gagne : un seul feu, un seul chaudron, un repas complet.</p>
<p class="p0 ri"><strong class="runin">Le four de fortune sur le poêle</strong> (5.D, étapes 24 à 26) reste la solution d’intérieur quand il fait −35 °C et que personne ne cuit dehors.</p>
<h3 class="sub">9-D. Plus de farine de magasin, et pas de moulin</h3>
<p class="p0 ri"><strong class="runin">Le moulin à café manuel.</strong> Il fait de la semoule plus que de la farine. Deux ou trois passages, un tamis entre chaque, et ce qui reste dans le tamis repasse. Ce qu’on perd : du temps et des bras, à se relayer.</p>
<p class="p0 ri"><strong class="runin">Deux pierres.</strong> Une pierre dormante, large, plate ou creusée en cuvette, et une molette, allongée, qui se tient à deux mains. On la pousse et on la tire sur le grain, à genoux, et la mouture se ramasse au bout de la pierre. La pierre doit être dure et ne pas s’effriter, un granit ; une pierre qui s’effrite, comme un grès tendre, finit dans le pain et sous la dent. Ce qu’on perd : le temps. On moud pour le jour.</p>
<p class="p0 ri"><strong class="runin">Le billot et le pilon.</strong> Un billot creusé au feu et raclé, un pilon taillé dans un nœud de bouleau (<span class="ref">ch. 72</span>). Il concasse le grain en gruau plus qu’il ne fait de la farine : le grain doit être bien sec, sinon il s’écrase en pâte au lieu d’éclater. Un sac de toile et un marteau sur une pierre plate font le même concassé.</p>
<p class="p0 ri"><strong class="runin">Le grain grillé.</strong> Grillé à sec dans le poêlon, le grain devient cassant et se pile beaucoup mieux. Ce qu’on perd : la levée, parce que la chaleur a cuit les protéines qui font le gluten, et la germination. Le grain grillé fait des galettes et des bouillies, pas du pain levé.</p>
<p class="p0 ri"><strong class="runin">Sans moudre du tout.</strong> Le grain entier se cuit comme du riz, ou concassé en bouillie. Le tremper la veille raccourcit le feu, comme pour les légumineuses (<span class="ref">ch. 5</span>), et la marmite norvégienne (<span class="ref">ch. 3</span>) finit la cuisson sans bois : amenée à plein bouillon, enfoncée dans sa boîte, la bouillie cuit pendant qu’on fait autre chose. Elle se mange à la sortie de la boîte et ne passe jamais la nuit tiède dedans pour le déjeuner du lendemain (<span class="ref">ch. 3</span>) : le grain porte des spores du sol que l’ébullition ne tue pas, le grain cuit laissé tiède les réveille, et la toxine qu’elles font dans la bouillie résiste au réchauffage. C’est du pain sans four, sans moulin et sans levain : on perd la forme, on garde les calories et les fibres.</p>
<p class="p0 ri"><strong class="runin">Le pain de grain germé, sans farine.</strong> Faire germer le grain comme au <span class="ref">ch. 20</span> — rincé, égoutté, humide, près du poêle, jamais dessus — jusqu’à ce que la pointe blanche perce. L’écraser humide au hachoir à viande manuel, qui ne moud pas le grain sec mais broie très bien le grain germé, ou le piler au mortier. On obtient une pâte collante, sans farine ni levain. Saler, façonner en galettes épaisses d’un doigt, cuire à feu doux au poêlon couvert, en retournant, jusqu’à ce que le cœur soit cuit à fond et non collant, 88 °C ou plus à la sonde. Cette pâte-là se mange cuite, comme toute pâte : le germe peut porter des bactéries logées dans la graine, que le rinçage n’enlève pas et que la cuisson à fond tue. Les germes qu’on mange crus pour leur vitamine C suivent leur propre règle, qui distingue les adultes des enfants (<span class="ref">ch. 96</span> <span class="ref">§8</span>, bloc 2). Ce qu’on perd : la vitamine C que la germination avait fabriquée (<span class="ref">ch. 20</span>), et la levée. Ce qu’on gagne : du pain avec un grain qu’on n’a aucun moyen de moudre.</p>
<p class="p0 ri"><strong class="runin">Étirer la farine qui baisse.</strong> Pomme de terre cuite et pilée du caveau (<span class="ref">ch. 79</span>), amidon de rhizome de quenouille (<em>Typha latifolia</em>, <span class="ref">ch. 92</span> <span class="ref">§9-F</span>), pollen de quenouille, écorce interne séchée, grillée et moulue des seules essences admissibles : bouleau à papier, épinettes, mélèze laricin, pin gris, pin blanc, peuplier. Jamais de cèdre, de cerisier ni d’if : la thuyone du cèdre est convulsivante, et aucune cuisson ne règle ni elle ni les composés du cerisier (<span class="ref">ch. 94</span>, étapes 44 à 47). Tout ça s’ajoute à la farine de blé, et rien ne la remplace. Rien de tout ça ne fait de gluten, donc plus la part est grosse, plus le pain est bas et dense. La proportion se trouve à la fournée ; ce livre n’en donne aucune.</p>
<p class="p0 ri"><strong class="runin">Orge, avoine, sarrasin.</strong> En galette au poêlon, en bouillie. Mêlés au blé en petite part, ils l’alourdissent ; plus la part grossit, plus la miche descend.</p>
<h3 class="sub">9-E. Tenir le levain quand le chalet refroidit</h3>
<p class="p0">Le levain supporte une semaine sans repas au frais ; il ne supporte pas le gel. Tout ce qui suit sert à le garder au-dessus de zéro sans rien d’acheté.</p>
<p class="p0 ri"><strong class="runin">Le pied du sac de couchage.</strong> La nuit où le feu ne sera pas tenu, le pot, couvercle posé et enveloppé dans un bas de laine, dort au pied d’un sac de couchage occupé. La chaleur d’un corps le garde loin du gel jusqu’au matin.</p>
<p class="p0 ri"><strong class="runin">La masse chaude autour du poêle.</strong> Les briques, les pierres et la marmite d’eau qu’on met autour du poêle pour tenir la nuit (<span class="ref">ch. 83</span>) restent tièdes longtemps après que le feu est mort. Le pot se pose contre elles.</p>
<p class="p0 ri"><strong class="runin">La bascule d’urgence.</strong> Si le chalet doit être laissé à geler, le levain part avec les gens, dans une poche intérieure, comme à la montée (5.B). La réserve séchée part avec lui : ce que le gel fait à un levain séché, on ne le sait pas. Une réserve de plus de deux ou trois mois ne lève plus seule : elle repart comme un levain neuf (9-A). Si le pot de service ne survit pas, c’est elle, ou le pot de la maison (5.B, étape 12), qui repartira un levain.</p>
<p class="p0 ri"><strong class="runin">Le pot qui a gelé quand même.</strong> Le laisser dégeler lentement à la température de la pièce, pas contre le poêle, puis le nourrir chaque jour au chaud. S’il double de nouveau entre deux repas, il a survécu. S’il ne fait que des bulles faibles et aigres après plusieurs jours, c’est la levure qui est morte : on repart de la réserve séchée, d’un levain emprunté ou de farine et d’eau (9-A).</p>
<h3 class="sub">9-F. Ce qui ne se remplace pas</h3>
<p class="p0 ri"><strong class="runin">Le blé.</strong> Sans blé, ou à la rigueur sans seigle, il n’y a pas de pain levé : il y a des galettes, des bouillies et du grain cuit, qui nourrissent autant et se mangent moins bien.</p>
<p class="p0 ri"><strong class="runin">La semence traitée, l’ergot, le grain moisi.</strong> Aucune faim ne les rend mangeables, aucun lavage, aucune cuisson (section 8).</p>
<p class="p0 ri"><strong class="runin">La chaleur au cœur.</strong> Un pain qui n’a pas atteint 88 °C au centre n’est pas cuit, quelle que soit sa croûte. Le four, le chaudron, le sable ou la vapeur ne sont que des façons d’amener le cœur de la pâte à ce chiffre.</p>
</template>
<template id="notes">
<p class="fn" data-fn="27-1"><span class="fnn">1</span>L’œil infecté par derrière : paupières enflées et rouges ; l’œil poussé vers l’avant, ce qui se voit le mieux en regardant le visage d’en haut, par-dessus le front ; l’œil qui fait mal quand il bouge et qui bouge moins bien que l’autre ; la vue qui baisse ; de la fièvre. Au début, une partie de ces signes peut manquer : la paupière qui enfle chez quelqu’un qui a mal à une dent du haut ou au sinus suffit à partir.</p>
<p class="fn" data-fn="27-2"><span class="fnn">2</span>Un son aigu et rauque à chaque entrée d’air : l’air forcé à travers une gorge que l’enflure rétrécit.</p>
<p class="fn" data-fn="45-1"><span class="fnn">1</span>Le renflement est un anneau où le canon a gonflé sous le choc de la balle contre l’obstacle. Il se voit parfois dehors, comme un anneau autour du canon. Sinon, l’âme bien propre, regardée par la chambre contre une lumière vive, y montre une ombre en anneau — une tache de graisse fait la même ombre, d’où l’âme propre — et les doigts passés doucement le long du canon le sentent comme une bosse. Deux balles restées dans l’âme : on présume le canon renflé. Un canon renflé ne s’arrange pas en tirant.</p>
<p class="fn" data-fn="47-1"><span class="fnn">1</span><strong>Le tambourinage de la gélinotte.</strong> Un bruit sourd qui pulse, comme un tambour qu’on bat au loin. Le mâle le fait en comprimant l’air sous ses ailes, le plus souvent debout sur un billot, parfois sur une racine ou une roche. On l’entend surtout au printemps, et parfois à l’automne.</p>
<p class="fn" data-fn="47-2"><span class="fnn">2</span><strong>La trace du lagopède.</strong> L’hiver, le dessous de ses pieds est couvert de plumes jusqu’au bout des doigts, au point de ressembler à une patte de lièvre, et seules ses longues griffes dépassent : l’empreinte est ronde et floue, sans doigts nets (<span class="ref">ch. 43</span>, <span class="ref">§5</span>-F). La gélinotte et le tétras n’ont pas le pied emplumé : l’hiver, la gélinotte porte seulement de petites franges en peigne le long des doigts, et ses doigts marquent.</p>
<p class="fn" data-fn="81-1"><span class="fnn">1</span>Les premiers jours, les repas grossissent et la faim revient au bout de chacun : le repas complet de viande ne la coupe pas, le ventre est tendu, et l’envie de gras ne lâche pas. On maigrit alors que les portions sont grosses. Viennent ensuite la nausée et la diarrhée, que seul le gras arrête. Plus de viande maigre aggrave ; le gras renverse. L’enfant y arrive avant l’adulte : la part de protéines qu’il supporte plafonne plus bas (24).</p>
<p class="fn" data-fn="81-2"><span class="fnn">2</span>Acides, donc à l’eau bouillante : petits fruits, confitures, gelées, marinades acidifiées. Peu acides, donc à l’autoclave : viande, poisson, bouillon, champignons de culture, haricots, betteraves, carottes, maïs, courges (73).</p>
<p class="fn" data-fn="81-3"><span class="fnn">3</span>Le 66 °Brix ne se voit pas et ne se goûte pas : il se lit au réfractomètre ou au densimètre à sirop. Sans instrument, on ne fait pas de sirop de garde : on fait du sucre, qui se juge à l’œil et à la dent, ou un sirop léger gardé gelé dehors et mangé dans la saison (60).</p>
<p class="fn" data-fn="81-4"><span class="fnn">4</span>Trouble laiteux, mousse qui ne retombe pas, odeur aigre, filaments dans la chaudière. Le froid qui concentre la sève concentre aussi ce qui a tourné (60).</p>
<p class="fn" data-fn="84-1"><span class="fnn">1</span>Le serti est le repli de métal du pourtour de la boîte, là où le couvercle est roulé sur le corps. Avec la ligne de métal qui ferme le corps sur toute sa hauteur, c’est un des deux joints de la boîte. Une bosse, une arête pliée ou de la rouille à cet endroit, et le joint ne tient plus.</p>
<p class="fn" data-fn="84-2"><span class="fnn">2</span>Les premiers signes sont ceux d’une grippe : frissons, fièvre, fatigue, maux de tête, étourdissements, douleurs musculaires, parfois toux, maux de ventre, nausées et vomissements. Rien dans la liste n’est propre au hantavirus : ce qui la distingue, c’est d’avoir ouvert le chalet ou touché des crottes de souris dans les semaines d’avant. La forme grave ajoute l’essoufflement, puis une détresse respiratoire sévère.</p>
<p class="fn" data-fn="86-1"><span class="fnn">1</span>Le densimètre de batterie est une poire de caoutchouc au bout d’un tube de verre, avec un flotteur gradué dedans. On ouvre le bouchon d’un élément, on aspire l’électrolyte jusqu’à ce que le flotteur flotte sans toucher le fond ni les parois, on vide et on remplit deux ou trois fois dans le même élément, puis on lit la graduation au ras du liquide, l’œil à sa hauteur. Le chiffre lu est la densité : 1,277 pour un élément plein. L’acide retourne dans l’élément d’où il vient, lunettes sur le nez.</p>
<p class="fn" data-fn="86-2"><span class="fnn">2</span>Il porte « MPPT » sur son étiquette ou sur sa fiche. Un contrôleur marqué « PWM », le plus simple, ne le suit pas.</p>
<p class="fn" data-fn="86-3"><span class="fnn">3</span>Ça se lit sur l’étiquette de l’onduleur ou sur sa boîte : « onde sinusoïdale pure » (« pure sine wave ») ou « onde sinusoïdale modifiée » (« modified sine wave »).</p>
<p class="fn" data-fn="88-1"><span class="fnn">1</span>Un levain mûr est un levain nourri qui a fini de monter depuis son dernier repas : il a doublé de volume, il est plein de bulles, et il sent l’aigre. C’est le repère de l’étape 5. Un levain qui porte un liquide gris ou brun sur le dessus a passé ce point : il a faim (section 6).</p>

  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
