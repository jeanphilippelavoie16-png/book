<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>88 — Le pain — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}

<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Un levain de farine et d’eau, nourri, fait lever le pain sans levure achetée aussi longtemps qu’il reste de la farine ou du grain à moudre ; le grain de blé intact, très sec et scellé, tient des décennies, alors que la farine complète rancit vite dès que le grain est cassé.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h4 class="choix">C’est le bon choix quand :</h4>
<p class="li">Il reste de la farine et plus de levure. La farine est une réserve de fond du stock : un sac de 2,5 kg porte une journée de la famille (<span class="ref">ch. 5</span>). Une fournée d’un kilo de farine porte environ 3 600 kcal, soit à peu près 40 % des 9 000 kcal de la journée des quatre. Sans pain, cette farine se mange en sauce et en bouillie ; avec du pain, elle se mange à chaque repas.</p>
<p class="li">L’hiver se passe au lièvre et à l’orignal. <strong>La viande maigre seule donne le mal de caribou, mortel en quelques semaines</strong>, et tant que la farine tient, la part des protéines reste basse (<span class="ref">ch. 19</span>). La bannique frite porte en plus le gras que la viande d’hiver n’a plus (section 5.E).</p>
<p class="li">On n’en a pas encore besoin. Un levain neuf n’est pas stable : ses bactéries et ses levures se relaient pendant les premiers mois, et ses levées changent d’une semaine à l’autre (section 3). Le bon moment pour le partir, c’est à la maison, maintenant, quand un pain raté ne coûte qu’un sac de farine d’épicerie. Le même raisonnement vaut pour le moulin : on apprend à moudre avant que la farine du sac soit finie.</p>
<p class="li">La farine de magasin est finie et le grain est là. Moulu à mesure, il donne une farine complète : une miche plus lourde, mais les fibres que la farine blanche a perdues (<span class="ref">ch. 21</span>).</p>
<h4 class="choix">C’est un mauvais choix quand :</h4>
<p class="li">Le bois est compté. Une miche au four demande un four chaud pendant 45 à 60 minutes, plus le temps de le monter. Une bannique cuit en 20 minutes au poêlon, et un pain à la vapeur cuit sur la zone chaude du poêle qui chauffe la maison de toute façon, dans un chaudron tenu à gros bouillon (9-C). En janvier, quand la pile baisse, c’est le four qui est un luxe, pas le pain.</p>
<p class="li">Le grain vient d’on ne sait où. Grain de provende, grain à oiseaux, blé acheté pour semer, grain qui sent le moisi : rien de ça ne se moud. Le blé du grain à oiseaux peut se semer (<span class="ref">ch. 96</span>), pas se moudre : vendu pour des bêtes, il n’est pas trié pour l’humain. Ni la mouture ni la cuisson ne retirent l’ergot, le traitement de semence ou les toxines de moisissure (section 8).</p>
<p class="li">Le sel est la contrainte. Le pain en prend 2 % du poids de la farine : une fournée d’un kilo par jour, c’est 600 g de sel par mois. L’automne, quand le sel part à la salaison (<span class="ref">ch. 67</span> et 68), le pain se fait avec moins de sel, ou sans ; il lève quand même et goûte plus fade.</p>
<p class="li">Le grain germé est la source de vitamine C qui ne dépend ni de la forêt ni de la saison (<span class="ref">ch. 20</span>). Cuit en galette (section 9-D), il perd ce que la germination avait fabriqué, parce que la chaleur détruit la vitamine.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">Le levain est une culture qu’on sélectionne, pas qu’on attrape.</strong> Un mélange de farine et d’eau n’est pas stérile : la farine porte ses propres bactéries et levures, venues du champ, et les mains en ajoutent. L’air de la pièce n’est pas la source principale. Les premiers jours, ce sont des bactéries lactiques qui prennent le dessus : elles mangent les sucres de la farine, font de l’acide, et le mélange descend sous pH 4 en quelques repas. Les levures arrivent après, à un moment qui varie d’un pot à l’autre, et ce sont elles qui font le gaz qui soulève la pâte. Chaque repas (on retire une part, on remet farine et eau) donne l’avantage à ce qui supporte l’acide et mange vite. C’est pour ça qu’un levain peut vivre des années, et pour ça qu’un pot neuf trompe : il s’emballe, se calme, reprend, et ses levées changent pendant ses premiers mois.</p>
<p class="p0 ri"><strong class="runin">La chaleur règle la vitesse ; le gel tue la levée.</strong> Le levain traditionnel se tient à 20 à 24 °C et se nourrit toutes les 6 à 24 heures. Plus froid, il ralentit et se nourrit moins souvent : au frigo, une fois par semaine. Sous 0 °C, c’est autre chose. La levure pousse bien entre 20 et 30 °C et supporte très mal le gel : la levée d’une pâte congelée baisse dès quatre jours, et un levain gardé trois mois à −20 °C ne lève presque plus. Un pot oublié une nuit de janvier dans le véhicule n’est peut-être pas mort, mais c’est la partie qui fait lever qui a écopé.</p>
<p class="p0 ri"><strong class="runin">Le blé lève ; les autres grains beaucoup moins.</strong> Mouillées et pétries, les protéines du blé (<em>Triticum aestivum</em>) forment un réseau élastique, le gluten, qui retient le gaz de la levure comme la chambre à air retient l’air. Le blé roux de printemps, dur et riche en protéines, en fait le plus : c’est la farine à pain, celle qui boit environ les deux tiers de son poids d’eau et donne une pâte à la fois forte et extensible. L’orge et l’avoine font des galettes et des bouillies. Le seigle lève au levain en miche dense et humide, plus longue à cuire.</p>
<p class="p0 ri"><strong class="runin">Le four cuit jusqu’à un plafond.</strong> Au four, la croûte sèche et brunit, mais le cœur de la miche, plein d’eau, monte vers 100 °C et plafonne juste en dessous, quelle que soit la chaleur du four. Le pain de blé est cuit quand ce cœur atteint au moins 88 °C : en dessous, la mie reste pâteuse. Une croûte noire sur un cœur tiède veut dire un four trop chaud, pas un pain cuit. L’amidon, lui, prend entre 60 et 82 °C environ, et il finit de prendre pendant que la miche refroidit : tranchée chaude, la mie est gommeuse.</p>
<p class="p0 ri"><strong class="runin">La farine est un aliment cru.</strong> Elle vient d’un champ, avec ce que le sol, l’eau et les excréments des bêtes y ont laissé, et rien dans la mouture ne la stérilise : c’est la cuisson qui le fait. Le levain, la pâte qui lève et la pâte à modeler de farine et de sel que les enfants tripotent sont de la farine crue, et les enfants de 5 ans et moins sont parmi les plus vulnérables à ce qu’elle peut porter. Le sol laisse aussi des spores dans le grain, qui survivent au four au centre de la mie, quelle que soit la miche ; c’est l’acidité du levain qui les empêche de germer ensuite, et les miches hautes de 10 cm et plus tournent plus souvent (section 7, pain filant).</p>
<p class="p0 ri"><strong class="runin">Le grain entier est une boîte fermée.</strong> Le germe du grain contient son huile, et c’est elle qui rancit. Tant que l’enveloppe est intacte, l’air n’y touche presque pas : du blé roux à 7 à 10 % d’eau, en boîtes de conserve scellées, gardé entre 13 et 27 °C, a fait du pain accepté après 32 ans, et le volume des miches n’avait pas bougé. Une chaudière fermée n’est pas une boîte scellée, et le test de l’ongle dit sec ou humide, pas 10 ou 12 % d’eau : le grain du chalet tient moins longtemps, d’une durée qui n’a pas été mesurée. Moulu, le germe est éventré et étalé dans toute la farine : la farine complète rancit vite à la température d’une pièce. D’où la règle du chapitre : <strong>on garde le grain, on moud à mesure.</strong> Ce qui gâte le grain, c’est l’eau et la chaleur ensemble : au-dessus de 12 % d’eau il commence à se dégrader, au-dessus de 15 % il moisit, et plus il est froid, plus il tolère d’humidité. Le gel ne l’abîme pas.</p>
<p class="p0 ri"><strong class="runin">La poudre à pâte fait lever sans rien de vivant.</strong> C’est un acide et une base secs qui font du gaz une fois mouillés et chauffés ; le bicarbonate seul ne fait du gaz qu’avec un acide, lait suri ou levain. C’est ce qui fait lever une bannique en vingt minutes, et c’est ce qui s’éteint dans l’armoire sans changer d’aspect : on la teste avant de compter dessus (section 6).</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Ce tableau ne liste que ce que les gestes de ce chapitre demandent. Ce qui s’achète, en quelle quantité et pour quel lieu, relève du chapitre 00b.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Farine de blé, ou grain de blé à moudre</td><td>Environ 1 kg par grosse fournée</td><td>Farine complète moulue au chalet (5.F) ; orge, avoine, sarrasin en galette seulement ; farine allongée de pomme de terre, de quenouille ou d’écorce interne (9-D). Le seigle lève au levain, en miche dense</td><td><span class="non">NON</span> <span class="negx">— sans blé, on fait des galettes, pas du pain levé</span></td></tr><tr><td class="c-item">Pot à levain en verre ou en grès alimentaire, deux fois le volume du levain</td><td>2 : un en service, un de rechange</td><td>Un pot de verre quelconque, une chaudière de plastique alimentaire. Jamais de métal nu ni de poterie glaçurée d’origine inconnue : le levain vit des années sous pH 4, et c’est cet acide qui attaque le métal et fait migrer les métaux d’une glaçure, sans goût ni odeur (<span class="ref">ch. 80</span>). Le couvercle se pose, il ne se visse pas : le gaz doit sortir</td><td>Oui</td></tr><tr><td class="c-item">Eau potable tiède</td><td>—</td><td>Eau bouillie refroidie à la température du corps : tiède à l’intérieur du poignet, comme un biberon. Les levains d’essai se partent à l’eau non chlorée ; l’eau qu’on vient de traiter à la javel est faite pour tuer ce qu’on veut faire pousser (<span class="ref">ch. 10</span>)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Sel</td><td>2 % du poids de la farine</td><td>Moins, ou rien du tout (section 2)</td><td>Oui</td></tr><tr><td class="c-item">Balance</td><td>1</td><td>Mesures en volume : 125 mL de farine tout usage pèsent 66 g ; le fléau du <span class="ref">ch. 5</span> <span class="ref">§9</span></td><td>Oui</td></tr><tr><td class="c-item">Thermomètre à sonde (celui du gibier)</td><td>1</td><td>Le son creux de la miche frappée dessous, et une brindille de bois propre plantée au cœur qui ressort sèche. Moins sûr sur une grosse miche (section 7)</td><td>Oui</td></tr><tr><td class="c-item">Thermomètre d’ambiance près du levain</td><td>1</td><td>Le levain vit là où la pièce est confortable en chandail : ni sur le poêle, ni sur la tablette du mur du nord</td><td>Oui</td></tr><tr><td class="c-item">Chaudron de fonte à couvercle</td><td>1</td><td>Chaudron d’acier épais sur un doigt de sable sec (<span class="ref">ch. 87</span> <span class="ref">§9</span>) ; cloche de chaudière renversée sur une plaque surélevée (5.D) ; boîte de conserve dans un chaudron d’eau (9-C)</td><td>Oui</td></tr><tr><td class="c-item">Moulin à grain à main</td><td>1</td><td>Moulin à café manuel ; deux pierres ; billot creusé et pilon ; hachoir à viande manuel pour le grain germé (9-D)</td><td>Oui — la farine se fait sans lui, plus lentement</td></tr><tr><td class="c-item">Tamis</td><td>1</td><td>Moustiquaire de fenêtre, coton lâche, sac de farine en toile</td><td>Oui</td></tr><tr><td class="c-item">Poudre à pâte ou bicarbonate, pour la bannique</td><td>Selon la recette</td><td>Le levain (9-B) ; rien, et la bannique devient une galette plate</td><td>Oui</td></tr><tr><td class="c-item">Boîte tiède pour la levée et le levain</td><td>1</td><td>Glacière, caisse de bois ou tiroir bourré de linge de laine, avec une bouteille d’eau chaude au toucher, pas bouillante (5.B)</td><td>Oui</td></tr><tr><td class="c-item">Moules</td><td>1 ou 2</td><td>Boîte de conserve vide, poêlon de fonte, plaque, ou la miche posée à même le fond fariné du chaudron</td><td>Oui</td></tr></tbody></table>
<p class="p0">Deux lignes seulement ne se négocient pas. Le blé, parce que c’est son gluten qui fait lever, le seigle mis à part, en miche dense. Et l’eau propre, parce qu’elle reste crue des jours dans le levain avant de passer au four.</p>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">5.A Partir le levain, à la maison, avant d’en avoir besoin</h3>
<p class="step"><span class="sn">1</span>Dans un pot deux fois plus grand que le mélange, verser à volumes égaux de la farine et de l’eau tiède : 125 mL de chaque suffit. La farine tout usage part, la farine de blé entier aussi.</p>
<p class="step"><span class="sn">2</span>Brasser jusqu’à une pâte lisse, poser le couvercle sans le visser, écrire la date au feutre sur le pot. Laisser à la température de la pièce, loin du poêle et des courants d’air.</p>
<p class="step"><span class="sn">3</span>Chaque jour, à peu près à la même heure, retirer environ la moitié du pot et la remplacer par de la farine et de l’eau tiède, à volumes égaux. Brasser.</p>
<p class="step"><span class="sn">4</span>Les premières bulles viennent en deux ou trois jours. Ce sont d’abord des bactéries qui acidifient ; la levure s’installe après. Le pot peut s’emballer les premiers jours, puis se calmer : c’est la population qui change, pas le levain qui meurt. Continuer les repas.</p>
<p class="step"><span class="sn">5</span>Le levain est prêt quand il double de volume entre deux repas. On attend qu’il le fasse deux fois de suite avant de lui confier une fournée entière.</p>
<p class="step"><span class="sn">6</span>Une fois le levain prêt, ce qu’on retire ne se jette plus : c’est une pâte à bannique, à galette ou à crêpe (5.E, 9-B). Cuite, toujours ; jamais goûtée crue.</p>
<h3 class="sub">5.B Le garder vivant : maison, bascule, hiver au chalet</h3>
<p class="step"><span class="sn">7</span>À la maison, entre deux fournées, le pot va au frigo et se nourrit une fois par semaine. On le sort la veille d’une fournée pour qu’il se réveille.</p>
<p class="step"><span class="sn">8</span>Pendant une panne, rien ne change pour lui : il passe sur le comptoir et se nourrit chaque jour, comme au début.</p>
<p class="step"><span class="sn">9</span>À la bascule vers le chalet, le pot voyage dans l’habitacle, contre soi s’il fait −30 °C.</p>
<p class="step"><span class="sn">10</span>Au chalet, l’hiver, le levain vit entre 20 et 24 °C. La nuit, quand le feu baisse et que la pièce refroidit, il passe dans la boîte tiède : une glacière ou une caisse bourrée de linge de laine, le pot au centre, une bouteille d’eau chaude au toucher, pas bouillante, à côté du pot et non collée contre : le levain veut ses 20 à 24 °C, pas la chaleur d’une bouillotte. C’est la marmite norvégienne du <span class="ref">ch. 3</span> en petit, et la même boîte sert à faire lever la pâte.</p>
<p class="step"><span class="sn">11</span>Quand la farine se compte, le levain se garde petit — quelques cuillerées — et ce qu’on retire à chaque repas va dans la galette du jour. Un levain qu’on ne peut plus nourrir tous les jours se garde au frais, au-dessus du gel, et se nourrit une fois par semaine, comme au frigo.</p>
<p class="step"><span class="sn">12</span><strong>La réserve séchée.</strong> Une fois par saison, étaler une cuillerée de levain mûr<sup class="fnr" data-fn="88-1">1</sup> en couche mince sur un papier ou une assiette, et la laisser sécher à l’air de la pièce, loin du poêle, jusqu’à ce qu’elle casse en écailles. Émietter, mettre dans un petit pot fermé, écrire la date au feutre sur le pot, ranger au frais, au-dessus du gel. Un pot vit au chalet, un à la maison. Des levures séchées dans une galette de farine sont restées vivantes, sans perte notable, six mois à la température d’un frigo et quatre mois à celle d’une pièce ; ce que le gel fait à une réserve séchée, on ne le sait pas : elle se garde au frais, au-dessus du gel. Un levain de blé séché lève encore bien le pain après un mois ; après deux ou trois mois, même nourri de nouveau, il fait encore son acide mais ne lève plus assez, parce que sa levure est presque toute morte. Un pot de trois mois n’est donc plus un levain prêt : c’est une semence, qu’on refait lever comme en 9-A avant de compter dessus. D’où le pot refait à chaque saison.</p>
<h3 class="sub">5.C Le pain au levain</h3>
<p class="p0">La recette est celle des mineurs du Klondike, qui faisaient leur pain au levain tout l’hiver avec un sac de farine. Les mesures sont en volume ; les grammes sont donnés pour la farine tout usage, à 66 g les 125 mL.</p>
<p class="step"><span class="sn">13</span>La veille au soir, nourrir le levain pour en avoir au moins 500 mL de mûr le matin. En garder une cuillerée à part : c’est la semence de la fournée suivante.</p>
<p class="step"><span class="sn">14</span>Le matin, dans un grand bol, mélanger 1 L de farine (environ 530 g), 60 mL de sucre s’il y en a, le sel, les 500 mL de levain, 15 à 20 mL d’huile ou de saindoux fondu et 500 à 625 mL d’eau tiède, jusqu’à une pâte à crêpes épaisse. Sans bol, on fait comme sur la piste du Klondike : un puits creusé dans la farine, et la pâte se mélange à même le sac.</p>
<p class="li l2"><strong>Le sel :</strong> 5 mL dans la recette des mineurs. Jusqu’à 20 g pour le kilo de farine de toute la fournée quand le sel ne manque pas : c’est 2 % du poids de la farine, la dose des pains d’essai. Le pourcentage se calcule <strong>sur la farine</strong>, comme celui du tome 4 se calcule sur la viande.</p>
<p class="li l2"><strong>Le sucre</strong> nourrit la levée ; il se retire quand le sucre manque, et la pâte lève plus lentement.</p>
<p class="step"><span class="sn">15</span>Couvrir et laisser au chaud, dans la boîte tiède au besoin, jusqu’à ce que le volume double et que la pâte soit pleine de bulles.</p>
<p class="step"><span class="sn">16</span>Ajouter de 500 mL à 1 L de farine de plus, peu à peu, en pétrissant : la pâte colle d’abord, puis devient une boule lisse et élastique. La farine blanche de blé roux boit environ les deux tiers de son poids d’eau ; la farine complète en boit davantage et le fait lentement, donc on en ajoute moins à la fois et on attend qu’elle ait bu. Le test : un bout de pâte étiré entre les doigts s’amincit jusqu’à laisser passer le jour sans déchirer.</p>
<p class="step"><span class="sn">17</span>Laisser lever jusqu’au double. Dans une cuisine chaude, c’est environ 4 heures. Au chalet en janvier, dans une pièce fraîche, c’est plus long, parfois beaucoup plus : on attend le double, pas l’heure, ou on fait lever dans la boîte tiède (étape 10).</p>
<p class="step"><span class="sn">18</span>Dégonfler, diviser, façonner des miches serrées. <strong>Deux miches basses plutôt qu’une haute :</strong> les miches hautes de 10 cm et plus tournent plus souvent au pain filant (section 7), et au four de fortune le centre d’une grosse miche est le dernier à cuire.</p>
<p class="step"><span class="sn">19</span>Laisser doubler une dernière fois, sur la plaque ou dans le moule fariné.</p>
<p class="step pk-c"><span class="sn">20</span>Cuire (5.D). Au four : 200 °C pendant 10 minutes, puis 150 °C pendant 30 à 40 minutes. La miche est cuite quand la sonde plantée au cœur lit <strong>88 °C ou plus</strong> et qu’elle sonne creux quand on la frappe dessous.</p>
<p class="step"><span class="sn">21</span>Sortir la miche du moule tout de suite, la laisser refroidir sur une grille ou en travers de deux bâtons, et ne la trancher que tiède.</p>
<h3 class="sub">5.D Cuire sans four de cuisine</h3>
<p class="p0 ri"><strong class="runin">Dans un four sans thermomètre.</strong> Ni la maison ni le chalet n’ont de four à bois : celui-ci est la cuisinière à bois d’un voisin, ou n’importe quel four dont le cadran ne dit plus rien.</p>
<p class="step"><span class="sn">22</span>Un four à bois se monte avec du bois sec fendu fin, qui donne une chaleur vive (<span class="ref">ch. 83</span>), et se tient chaud avant d’enfourner. Il est plus chaud du côté du foyer : tourner la miche d’un demi-tour à mi-cuisson.</p>
<p class="step"><span class="sn">23</span>Sans thermomètre de four, c’est la miche qui sert de thermomètre. Elle doit continuer à monter pendant les 15 premières minutes, commencer à brunir ensuite, brunir pendant 20 minutes, puis finir. Brunie avant 15 minutes, le four est trop chaud : la croûte fige la miche avant que la chaleur atteigne le cœur. Encore pâle à 35 minutes, il est trop froid : on ranime le feu. Une miche blanche prend de 45 à 60 minutes, une miche de farine complète de 35 à 45 minutes. La sonde tranche.</p>
<p class="p0 ri"><strong class="runin">Sur un poêle de chauffage, sans four.</strong> Au chalet, le four est parti avec le propane (<span class="ref">ch. 87</span>, étape 18). C’est le chaudron de fonte couvert qui le remplace.</p>
<p class="step"><span class="sn">24</span>Faire chauffer le chaudron vide, couvercle mis, sur la zone chaude du dessus. Le surélever de quelques millimètres sur trois écrous ou un anneau de broche, ou le poser sur un doigt de sable sec dans un chaudron plus large (<span class="ref">ch. 87</span>) : la chaleur n’arrive que par le fond, et un fond de fonte à plat sur la fonte brûle la croûte avant que le cœur cuise.</p>
<p class="step"><span class="sn">25</span>Déposer la miche dans le chaudron chaud, sur un fond fariné ou dans un moule plus petit posé sur un rond de broche, et refermer. Tourner le chaudron d’un quart de tour à chaque passage. Le dessus brunit à peine : on retourne la miche pour la fin de la cuisson, ou on accepte un pain pâle. La sonde décide, pas l’horloge.</p>
<p class="step"><span class="sn">26</span><strong>La cloche de chaudière,</strong> quand aucun chaudron n’est assez grand pour la miche. Il lui faut un fond, comme au chaudron : une plaque ou un poêlon de fonte posé sur trois écrous ou sur un doigt de sable sec, sur la zone tiède du poêle, et la miche dans son moule sur cette plaque. Une grande chaudière de métal propre, renversée par-dessus, garde l’air chaud autour du pain. Une chaudière mince n’a pas la masse d’un couvercle de fonte : elle perd sa chaleur dans la pièce, le dessus cuit mal, et on retourne la miche pour finir. Posée à même le poêle sur un simple rond de broche, la miche brûle dessous avant de cuire au cœur : c’est le fond, sur la zone tiède, qui fait le four. La sonde décide, pas l’horloge.</p>
<p class="p0 lab kh"><strong class="runin">Dehors, le chaudron sur la braise.</strong></p>
<p class="step"><span class="sn">27</span>Allumer le feu de 30 à 45 minutes d’avance pour avoir un lit de braise de bouleau, avec un mur de neige tassée du côté du vent (<span class="ref">ch. 87</span> <span class="ref">§9</span>).</p>
<p class="step"><span class="sn">28</span>Poser le chaudron sur une couronne de braise, jamais sur un tas au centre, qui ferait un point brûlé. Mettre trois fois plus de braise sur le couvercle que dessous, étalée en damier, jamais en tas. Un couvercle bombé ne garde pas la braise : poser dessus une tôle ou un poêlon renversé qui la porte.</p>
<p class="step"><span class="sn">29</span>Toutes les 10 à 15 minutes, soulever le chaudron et lui faire faire un quart de tour, puis tourner le couvercle d’un quart de tour dans l’autre sens. Soulever le couvercle à plat.</p>
<p class="step pk-d"><span class="sn">30</span>La braise reste dehors, à l’air libre : ni sur un couvercle à l’intérieur, ni dans un chaudron rentré pour finir la cuisson, ni dans un garage, une remise ou sous un abri (section 8).</p>
<h3 class="sub">5.E La bannique, le pain de vingt minutes</h3>
<p class="step"><span class="sn">31</span>Mélanger 750 mL de farine (environ 400 g), 7 mL de poudre à pâte et 2 mL de sel. Faire un puits, y mettre 60 mL de gras — saindoux, beurre, suif fondu (<span class="ref">ch. 72</span>) —, verser dessus 310 mL d’eau chaude, et mélanger à la main, juste assez pour que ça tienne. Une bannique trop pétrie devient dure.</p>
<p class="step"><span class="sn">32</span>Diviser en deux boules, les aplatir en rondelles de 1 cm d’épaisseur, les piquer à la fourchette.</p>
<p class="step"><span class="sn">33</span>Cuire 20 minutes sur un feu vif, dans un poêlon de fonte bien graissé, en retournant quand le dessous est doré.</p>
<p class="step"><span class="sn">34</span><strong>La bannique frite,</strong> quand la viande est maigre. Faire fondre un gros morceau de saindoux ou de gras rendu dans le poêlon, y étendre la pâte, dorer d’un côté jusqu’à ce qu’une croûte se forme, retourner. Elle boit le gras du poêlon, et c’est pour ça qu’on la fait (<span class="ref">ch. 19</span>).</p>
<p class="step"><span class="sn">35</span>Le levain retiré aux repas (étape 6) se mêle à la pâte de bannique : elle goûte l’aigre, lève un peu, et se passe de poudre à pâte si on lui laisse le temps (9-B).</p>
<h3 class="sub">5.F Moudre le grain</h3>
<p class="step pk-d"><span class="sn">36</span><strong>Trier avant de moudre.</strong> Étendre une poignée de grain sur un drap blanc, en plein jour. Le bon grain a sa couleur naturelle, la même d’un grain à l’autre : brun roux pour le blé roux, blond pour le blé blanc. Retirer tout grain noir ou violet foncé, dur, allongé : c’est l’ergot, qui a le plus souvent la taille et la forme du grain, parfois bien plus gros, mais jamais sa couleur, et qui, cassé, est blanc violacé dedans. Refuser le lot entier s’il porte des grains rose ou rouge vif, bleus ou verts, à l’enrobage graisseux ou poudreux : c’est de la semence traitée. Ce rose-là est un colorant, mis là justement pour se voir ; il ne ressemble pas au brun roux d’un blé roux. Refuser aussi le lot qui porte des grains minces, ratatinés, blanc craie, parfois rosés au germe : c’est la fusariose, une moisissure prise au champ, qui peut laisser sa toxine dans le grain. Elle s’est faite avant la récolte, et son duvet ne se voit guère qu’à la loupe : le nez, à la chaudière, ne la trouve pas forcément. Sentir quand même : un grain qui sent le moisi ou le renfermé, ou qui colle en mottes, ne se moud pas (section 8). Dans le doute sur une tache qu’on ne s’explique pas, le grain est contaminé.</p>
<p class="step"><span class="sn">37</span>Le grain doit être sec : il casse net sous l’ongle au lieu de s’écraser (<span class="ref">ch. 5</span> <span class="ref">§9</span>). Un grain humide encrasse les meules et moisit une fois en farine.</p>
<p class="step"><span class="sn">38</span>Au moulin à main, faire un premier passage réglé gros, puis un second réglé fin. On moud pour la fournée, pas pour le mois : la farine complète rancit vite à la température d’une pièce. Ce qui est moulu d’avance se garde au froid, dehors l’hiver, en contenant fermé.</p>
<p class="step"><span class="sn">39</span>Tamiser si on veut une miche plus haute : ce qui passe la moustiquaire lève mieux. Ce qui reste dans le tamis, le son et le germe, va dans la bouillie du matin ; ce sont les fibres que le <span class="ref">ch. 21</span> réclame. Au moulin, la farine blanche fait environ les trois quarts du grain ; au tamis de maison, on en tire moins.</p>
<p class="step"><span class="sn">40</span>Un kilo de grain moulu entier donne un kilo de farine complète, à la poussière près.</p>
<h3 class="sub">5.G Garder le grain entier</h3>
<p class="step"><span class="sn">41</span>Le grain vit en chaudières alimentaires fermées, par lots — un lot qui se gâte ne contamine pas les autres —, posées sur des madriers, jamais à même un plancher de béton, qui pompe l’humidité vers le contenant.</p>
<p class="step"><span class="sn">42</span>Au chalet, le froid est l’allié. Le gel n’abîme pas le grain, et il tue les insectes vivants, pas leurs œufs. Un lot où des insectes sont apparus passe quelques jours dehors en janvier, rentre, se réchauffe, ressort : plusieurs cycles tuent ce qui éclot entre deux.</p>
<p class="step"><span class="sn">43</span>Une chaudière rentrée du froid ne s’ouvre qu’une fois revenue à la température de la pièce. Ouverte froide, elle aspire l’air humide de la maison, qui se condense sur le grain.</p>
<p class="step"><span class="sn">44</span>Le laurier, les clous et le sel enfouis dans le grain n’ont aucun effet sur les insectes ni sur leurs œufs.</p>
<p class="step"><span class="sn">45</span>Enfoncer le bras dans la chaudière de temps en temps. Une zone tiède, une odeur de moisi, des grains collés en mottes : c’est une moisissure qui travaille, souvent dans une partie du lot seulement (section 7).</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:15.4%"><col style="width:18.8%"><col style="width:25.8%"><col style="width:40.0%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible</th><th>Hors cible</th></tr></thead><tbody><tr><td class="c-item">Levain, jours 1 à 3</td><td>Bulles, odeur</td><td>Bulles en deux ou trois jours, odeur aigre</td><td>Aucune bulle au quatrième jour : pièce trop froide. Remettre entre 20 et 24 °C, continuer les repas</td></tr><tr><td class="c-item">Levain, avant la fournée</td><td>Levée entre deux repas</td><td>Double de volume, deux fois de suite</td><td>Ne double pas : on ne lui confie pas la farine. Nourrir, réchauffer, attendre</td></tr><tr><td class="c-item">Levain en service</td><td>Température du coin où il vit</td><td>20 à 24 °C</td><td>Plus froid : il ralentit, se nourrit moins souvent. Près de 0 °C : le rentrer tout de suite, c’est la levée qui risque</td></tr><tr><td class="c-item">Levain, surface</td><td>Liquide gris ou brun sur le dessus</td><td>Absent, ou mince</td><td>C’est de l’alcool : le levain a faim. Remélanger et nourrir plus souvent</td></tr><tr><td class="c-item">Poudre à pâte, avant la bannique</td><td>5 mL dans 80 mL d’eau chaude</td><td>Mousse forte</td><td>Mousse faible : elle ne lèvera pas la bannique. Levain (9-B) ou galette plate</td></tr><tr><td class="c-item">Bicarbonate</td><td>7 mL et 15 mL de vinaigre</td><td>Pétille</td><td>Rien : il ne fait plus lever</td></tr><tr><td class="c-item">Grain, avant la mouture</td><td>Couleur, odeur, dureté</td><td>La couleur naturelle du grain : brun roux pour le blé roux, blond pour le blé blanc. Aucun grain rose ou rouge vif, bleu, vert, noir, ni blanc craie et ratatiné. Odeur de paille, casse net sous l’ongle</td><td>Section 7. Un lot tout rose ou tout rouge est d’une couleur uniforme, et c’est de la semence traitée</td></tr><tr><td class="c-item">Pâte, après le pétrissage</td><td>Un bout étiré entre les doigts</td><td>S’amincit jusqu’à laisser passer le jour</td><td>Déchire : pétrir encore. Farine complète : le son coupe le réseau et la pâte déchire plus tôt, accepter une miche plus basse</td></tr><tr><td class="c-item">Levée</td><td>Volume</td><td>Double : environ 4 h au chaud, plus longtemps au frais</td><td>Ne monte presque pas, même dans la boîte tiède : levain faible. Nourrir le levain plus fort à la prochaine</td></tr><tr><td class="c-item">Four, 15 premières minutes</td><td>La miche monte encore</td><td>Monte, puis commence à brunir</td><td>Brunie avant : trop chaud. Pâle à 35 min : trop froid</td></tr><tr><td class="c-item">Fin de cuisson</td><td>Température au cœur, à la sonde</td><td>88 °C ou plus pour le blé ; 96 à 99 °C pour le seigle</td><td>Moins : remettre au four ; au chaudron, retourner et prolonger</td></tr><tr><td class="c-item">Fin de cuisson, sans sonde</td><td>Son de la miche frappée dessous</td><td>Creux</td><td>Mat : pas cuit</td></tr><tr><td class="c-item">Grain en réserve</td><td>Le bras enfoncé dans la chaudière</td><td>Froid et sec partout</td><td>Zone tiède, moisi, mottes : section 7</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:31.4%"><col style="width:21.7%"><col style="width:46.9%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Traînées ou taches orangées, roses ou rouges dans le levain</td><td>Contamination</td><td>Jeter le pot entier. Laver et ébouillanter le pot, repartir de la réserve séchée ou d’un pot neuf</td></tr><tr><td class="c-item">Duvet, taches vertes, noires ou blanches cotonneuses sur le levain</td><td>Moisissure dans un aliment mou</td><td>Jeter le pot entier. Un aliment mou ne se gratte pas : la moisissure y pénètre plus loin que ce qu’on voit</td></tr><tr><td class="c-item">Levain qui a gelé et ne lève plus au chaud, malgré des repas quotidiens</td><td>La levure n’a pas survécu au gel</td><td>Repartir de la réserve séchée (9-A) ou d’un levain emprunté</td></tr><tr><td class="c-item">Mie collante qui file en fils quand on écarte deux morceaux, odeur de fruit pourri ou de melon trop mûr, un jour ou deux après la cuisson, surtout l’été</td><td>Pain filant : spores de <em>Bacillus</em> venues du sol par le grain, qui ont survécu au four au centre de la miche</td><td>Jeter toute la fournée. À la suivante : plus de levain, donc plus d’acide, et c’est l’acide qui tient les spores, pas le four ; des miches basses ; une cuisson complète, au moins 88 °C au cœur, pour une mie qui ne colle pas</td></tr><tr><td class="c-item">Taches de moisissure sur le pain</td><td>Moisissure dans un aliment mou</td><td>Jeter la miche entière, pas seulement la tranche</td></tr><tr><td class="c-item">Grains noirs ou violet foncé, durs, allongés, dans le lot</td><td>Ergot (<em>Claviceps purpurea</em>)</td><td>Trier grain par grain sur un drap blanc. Beaucoup de sclérotes, ou du seigle qui en porte : ne pas moudre le lot</td></tr><tr><td class="c-item">Grains rose ou rouge vif, bleus ou verts, enrobage graisseux ou poudreux</td><td>Semence traitée ; pour le rose, aussi un grain moisi au champ (ligne suivante)</td><td>Refuser le lot dans les deux cas, même vendu pour l’humain, même sans odeur. Jamais de mouture, jamais de lavage pour « récupérer ». Le lot sort de la cuisine (section 8)</td></tr><tr><td class="c-item">Grains minces, ratatinés, blanc craie, parfois rosés au germe</td><td>Fusariose : moisissure prise au champ, toxine possible dans le grain</td><td>Ne pas moudre le lot, même s’il ne sent rien : la moisissure s’est faite avant la récolte</td></tr><tr><td class="c-item">Grain qui sent le moisi ou le renfermé, en mottes, zone tiède dans la chaudière</td><td>Moisissure en cours, toxines possibles</td><td>Jeter le lot touché, sans le goûter. La cuisson ne détruit pas ces toxines</td></tr><tr><td class="c-item">Crottes, grains rongés</td><td>Rongeurs</td><td>Jeter les denrées touchées ; ni tamiser, ni laver (<span class="ref">ch. 5</span>). Mouiller avant de toucher : une chaudière ou un sac souillé ne se vide pas et ne se secoue pas à sec, parce que l’hantavirus de la souris sylvestre se respire dans la poussière des crottes sèches (protocole au <span class="ref">ch. 104</span> <span class="ref">§8</span>)</td></tr><tr><td class="c-item">Petits papillons, toiles, vers dans le grain, sans crottes de rongeur</td><td>Insectes</td><td>Cycles de gel (5.G), puis tamiser</td></tr><tr><td class="c-item">Farine qui sent le moisi ou le renfermé, fait des mottes ou porte des taches</td><td>La farine a pris l’humidité et moisit</td><td>La jeter sans la goûter : les toxines de moisissure passent le four (section 8, partie 3)</td></tr><tr><td class="c-item">Farine restée sèche, sans mottes ni taches, qui sent le rance, l’amer</td><td>Le gras du germe s’est oxydé</td><td>Qualité perdue. Finir en galette relevée ; ne plus moudre d’avance. Au moindre doute entre rance et moisi, c’est la ligne du dessus</td></tr><tr><td class="c-item">Croûte noire, cœur cru et collant</td><td>Four trop chaud</td><td>Finir à four plus doux ou au chaudron couvert, jusqu’à ce que la sonde lise 88 °C ou plus au cœur</td></tr><tr><td class="c-item">Bannique plate et dure</td><td>Poudre à pâte éventée, ou pâte trop pétrie</td><td>Tester la poudre (section 6) ; mélanger à peine</td></tr></tbody></table>

<p class="pt"><span class="pn">1</span><strong class="plead">1 — La semence traitée ne se mange jamais.</strong> Le grain vendu pour semer est souvent enrobé d’un fongicide ou d’un insecticide fait pour rester sur le grain. Le colorant qui le signale est rouge ou rose pour les céréales, bleu ou vert pour le canola et les légumineuses, et l’enrobage est graisseux ou poudreux. Il ne part pas au rinçage (<span class="ref">ch. 20</span>). Du pain fait à la maison avec du blé de semence traité au mercure a empoisonné des gens de 4 à 70 ans ; les plus atteints sont morts malgré les soins. Le grain de semence se sème (<span class="ref">ch. 96</span>). Il ne se moud pas, même en famine.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">2 — L’ergot passe à travers le four.</strong> Le sclérote d’ergot pousse à la place du grain, le plus souvent de la même taille et de la même forme, parfois bien plus gros, mais noir violacé. Il est toxique en petite quantité. La mouture n’en réduit pas la toxicité : la farine est aussi toxique que le grain. Le four en détruit une partie dans la croûte, presque rien dans la mie : la cuisson ne rend pas sûre une farine d’ergot. Le seigle est la céréale la plus touchée, et c’est un temps frais, nuageux et humide à la floraison qui le fait pousser, un temps que la Côte-Nord connaît bien. Le grain de provende est vendu pour des bêtes : le blé fourrager tolère deux fois et demie plus d’ergot et trois fois plus d’excréments que le blé de meunerie. On ne moud que du grain vendu pour l’humain, et on le trie quand même (5.F).</p>
<p class="pt"><span class="pn">3</span><strong class="plead">3 — Le grain moisi ne se rattrape pas au four.</strong> Les moisissures du grain humide font des toxines qui tiennent à 120 °C et en partie à 180 °C ; aucune cuisson ne les détruit complètement. À forte dose, elles tuent ; à petite dose répétée, elles empoisonnent lentement. Un grain qui sent le moisi, qui colle ou qui chauffe dans la chaudière sort de la cuisine, et on ne le goûte pas pour décider.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">4 — La braise ne rentre pas.</strong> Un chaudron de braises rentré pour finir un pain, une pelletée de braise posée sur un couvercle à l’intérieur : c’est un barbecue au charbon dans le chalet. La braise brûle sans flamme et presque sans fumée, et c’est ce qui trompe : elle fait du monoxyde de carbone, qui n’a ni odeur ni couleur. Il donne mal à la tête, fatigue, nausée, et on s’endort au lieu de sortir. Chez un enfant de 4 ou 6 ans, il a l’air de la fatigue ou du mauvais caractère, et un parent attentif conclut au caractère : un enfant qui devient mou ou grognon dans la pièce où la braise est entrée sort dehors avant qu’on cherche pourquoi (<span class="ref">ch. 39</span>). Le pain à la braise se cuit dehors, à l’air libre. Par −35 °C avec du vent, le réflexe est de cuire à l’abri, et chaque abri garde le monoxyde comme le chalet : ni garage ni remise, même porte ouverte, ni galerie couverte, auvent ou abri d’auto, ni tente d’hiver ou son vestibule (<span class="ref">ch. 12</span>). L’abri du vent, c’est le mur de neige de l’étape 27, ouvert sur le ciel. Dedans, le pain cuit sur le poêle, dont la cheminée sort les gaz (<span class="ref">ch. 87</span> et 83).</p>
<p class="pt"><span class="pn">5</span><strong class="plead">5 — La farine est crue.</strong> Le levain, la pâte qui lève, le bol qu’on lèche et la pâte à modeler de farine et de sel sont de la farine crue, avec ce que le champ y a laissé, et les enfants de 5 ans et moins sont parmi les plus vulnérables. Tout ce qui est fait de farine se mange cuit (section 3).</p>
