<p class="p0">Tout ce chapitre se fait sans rien acheter. Ce qui manque le jour où il sert, c’est une règle, une lumière, du temps pour attendre et un œil exercé. Les trois premiers se remplacent ou se fabriquent ; le quatrième se prend l’hiver d’avant.</p>
<h3 class="sub">Une règle qu’on a toujours sur soi</h3>
<p class="p0 ri"><strong class="runin">Mesurer sa main une fois, au chalet, avec une vraie règle.</strong> La largeur de la paume aux jointures, la longueur du pouce, la longueur de l’index, l’écart entre le pouce et le petit doigt, doigts écartés. Ce sont quatre mesures qu’on ne perd jamais. Les écrire dans un carnet ne sert à rien : on les <strong>grave au couteau sur le manche du bâton de marche</strong>, une encoche par mesure, avec la valeur en chiffres. Le fait vit sur la chose.</p>
<p class="p0 ri"><strong class="runin">Le bâton entaillé.</strong> Un bâton droit, écorcé, entaillé aux 5 cm sur 50 cm contre une règle, puis aux 10 cm jusqu’au bout. Il mesure une empreinte, une foulée, une épaisseur de neige, une hauteur de brout. À défaut de règle pour l’entailler, la page de ce livre fait <strong>25,4 cm de haut</strong> : on reporte sa hauteur sur le bâton, puis sa moitié et son quart. Des marques moins rondes que les 5 cm, mais justes. Sa largeur ne sert pas : elle se mesure jusqu’au fond de la reliure.</p>
<p class="p0 ri"><strong class="runin">Les gabarits à l’échelle.</strong> Les planches des empreintes de ce chapitre sont dessinées <strong>grandeur nature</strong>, règle imprimée dans la marge. On pose le livre ouvert à côté de l’empreinte et on compare les formes. C’est plus sûr qu’une mesure : l’œil compare une forme mieux qu’il ne retient un chiffre.</p>
<h3 class="sub">Le bâton de pistage</h3>
<p class="p0">C’est l’outil qui retrouve une empreinte qu’on ne voit plus. Une branche droite d’environ 90 cm, écorcée par endroits pour que les marques se voient, pointue au bout. Sur la meilleure empreinte de la piste, on marque au couteau, <strong>à partir de la pointe</strong> :</p>
<p class="step"><span class="sn">1</span><strong>la longueur de l’empreinte</strong> (première encoche) ;</p>
<p class="step"><span class="sn">2</span><strong>sa largeur</strong> (deuxième encoche, comptée depuis la première) ;</p>
<p class="step"><span class="sn">3</span><strong>le pas</strong> : d’une empreinte à la suivante, <strong>de l’autre pied</strong>, mesuré de centre à centre (troisième encoche, depuis la pointe). C’est la moitié de la foulée des fiches, pas la foulée ;</p>
<p class="step"><span class="sn">4</span><strong>la largeur de la piste</strong> (quatrième encoche, reportée depuis la troisième vers la pointe, pour qu’elle reste sur le bâton).</p>
<p>Si le pas de la bête dépasse le bâton, on prend une perche plus longue : un bâton trop court ne mesure rien.</p>
<p>Une bête qui marche ou qui trotte garde le même espacement sur de longues distances : c’est ce qui rend l’outil juste. Quand la piste s’efface, on pose la troisième encoche sur le centre de la dernière empreinte sûre, le bâton dans le sens de la marche : <strong>la pointe tombe à la hauteur de la suivante, qui est celle de l’autre pied</strong>, décalée sur le côté de la largeur de piste. On la cherche là, à genoux, de près, et nulle part ailleurs. Pour une bête qui bondit, la troisième encoche mesure d’un groupe au groupe suivant.</p>
<p>Trois corrections, parce que la bête n’est pas une machine : <strong>le pas raccourcit dans une montée et dans une descente</strong>, il change dans une neige plus molle ou plus dure, et il s’allonge quand la bête accélère. Quand deux pistes de la même espèce se croisent, le bâton dit laquelle est la bonne : ses encoches ne tombent juste que sur une.</p>
<h3 class="sub">La lumière</h3>
<p class="p0">Une empreinte est un relief. Elle se voit par son ombre, et une lumière d’en haut n’en fait pas.</p>
<p class="li"><strong>Le soleil bas</strong>, le matin et le soir, dessine tout. À midi en hiver, par temps gris, la neige est plate.</p>
<p class="li"><strong>La tête au ras du sol, la trace entre soi et la lumière.</strong> On se couche presque, joue à la neige ou à la terre, et on regarde la trace à contre-jour, en rasant. Les creux et les tassements apparaissent en taches mates ou luisantes que l’œil debout ne voit pas, même sur un sol dur ou dans une litière de feuilles.</p>
<p class="li"><strong>Par lumière plate, une frontale tenue à la main, au ras de la neige</strong>, à côté de l’empreinte, fait des ombres rasantes. C’est la meilleure lumière de pistage qui soit, et elle marche la nuit. <strong>À la brunante et la nuit</strong>, une chandelle posée sur la neige fait la même chose. En plein jour gris, elle est trop faible pour faire une ombre : on reste à la frontale ou à la lecture de profil, la tête au ras du sol.</p>
<p class="li"><strong>Au plein soleil, jeter l’ombre de son corps sur l’empreinte</strong> : elle réapparaît.</p>
<p class="li"><strong>Tourner autour</strong>, et <strong>revenir par le même chemin</strong> : une empreinte invisible d’un côté ou le matin ressort de l’autre côté ou l’après-midi.</p>
<h3 class="sub">Les doigts</h3>
<p class="p0 ri"><strong class="runin">Tâter le fond</strong> d’un trou dans la neige profonde, main nue : les pointes d’un sabot, les doigts d’un canidé marquent plus profond. On y sent le sens de la marche et parfois le nombre de doigts.</p>
<p class="p0 ri"><strong class="runin">Le piédestal</strong>, quand une neige nouvelle a comblé une empreinte : la neige tassée par le pied est plus dure que la neige tombée par-dessus. On creuse un cercle tout autour, on souffle la neige molle, puis on gratte du bout des doigts nus jusqu’à ce que l’empreinte durcie apparaisse, debout sur son petit socle. Elle ne dira pas toujours l’espèce, mais elle dira la vraie taille, que le creux laissé en surface ne dit pas.</p>
<h3 class="sub">Dater sans rien</h3>
<p class="p0">Le souffle et la boue sont à la <span class="ref">§5-A</span> (étapes 9 et 10) ; ils ne demandent déjà rien. Le reste :</p>
<p class="li"><strong>Sa propre trace témoin.</strong> À côté de la piste, avec le poing ou le talon, on fait une empreinte en appuyant à peu près comme la bête a appuyé, et on la regarde vieillir pendant qu’on lit le reste. Au retour, quelques heures plus tard, on en refait une à côté de la première, avec le même geste : on a sous les yeux, côte à côte, ce que ces heures-là ont fait à cette neige-là, ce jour-là, et on compare à la piste. Le temps qu’il fait détruit une trace plus que tout le reste, la pesanteur qui fait crouler les bords vient ensuite, puis la nature du sol : la trace témoin les mesure tous les trois à la fois.</p>
<p class="li"><strong>L’herbe couchée</strong> montre au soleil sa face luisante pendant environ deux heures, et se redresse en environ une journée. Ce sont des ordres de grandeur : la trace témoin dit ce qu’ils valent dans cette herbe-là, ce jour-là.</p>
<p class="li"><strong>Le bois</strong> : sève qui coule sur un écorçage frais, sève durcie sur un vieux ; bois clair qui fonce avec les mois, jusqu’au noir des vieilles cicatrices. Une cassure de branche se date de la même façon qu’une empreinte : on en casse une à côté et on compare.</p>
<p class="li"><strong>La crotte</strong> : luisante et molle, fraîche ; terne et croûtée, vieille. Une forte pluie ou une neige les efface vite : une crotte nette après une tempête est postérieure à la tempête.</p>
<p class="li"><strong>Le sang</strong> sur la neige ou une branche, près d’un reste de repas : rouge vif frais, puis rubis, puis croûte brune.</p>
<h3 class="sub">Savoir qui vient la nuit, sans veiller</h3>
<p class="p0">Autour du chalet, la question n’est pas toujours « quelle bête est-ce », mais « qui vient manger au fumoir, à la cache, au caveau, au poulailler ». On ne veille pas toute une nuit à −30 °C pour le savoir : on prépare une surface qui écrit toute seule, et on la lit au matin.</p>
<p class="p0 ri"><strong class="runin">La bande lissée.</strong> Le soir, on efface. L’hiver, on balaie une bande de neige d’un mètre de large autour de la cache ou en travers d’une coulée, avec une branche de sapin traînée à plat. L’été, on étend une bande de sable fin, de cendre tamisée du poêle <strong>de plus de sept jours</strong> — une braise vit des jours dans une cendre froide au toucher, et la bande longe des bâtiments de bois (<span class="ref">ch. 82</span>) — ou la boue d’une grève, et on la lisse avec une planche tirée à plat. Au matin, <strong>tout ce qui a traversé est écrit, et on sait que ça a été écrit depuis la veille au soir</strong> : c’est ce qui manque à une piste trouvée au hasard. On relisse chaque soir, et chaque matin donne le compte de la nuit. Une bande étroite qu’on relit tous les jours apprend plus sur les visites d’un secteur qu’une grande bande qu’on lit une fois.</p>
<p class="p0 ri"><strong class="runin">La plaque de suie.</strong> Pour les petites bêtes, dont la patte ne marque rien dans une neige dure ou une terre sèche, et pour lire les doigts et les griffes au détail près :</p>
<p class="step"><span class="sn">1</span>Une tôle plate et lisse : une plaque à biscuits, un couvercle de baril aplati, une feuille d’aluminium épaisse, le côté d’un vieux réservoir.</p>
<p class="step"><span class="sn">2</span>On la <strong>noircit dehors</strong>, au-dessus de la flamme d’une <strong>chandelle</strong> dont on a laissé la mèche longue : une mèche longue fume, et la fumée noire, c’est de la suie (<span class="ref">ch. 85</span>). Jamais à l’intérieur : cette flamme-là fait aussi du monoxyde de carbone. On passe la tôle au-dessus jusqu’à ce qu’elle soit uniformément noire, sans la chauffer au point de brûler la suie. Une lampe à l’huile à mèche montée noircit plus vite, mais une flamme trop haute et le choc thermique du froid dehors font fendre son verre de cheminée, et c’est le verre qui tient la flamme à distance du reste (<span class="ref">ch. 85</span>) : la chandelle d’abord.</p>
<p class="step pk-d"><span class="sn">3</span>On la pose à plat au fond d’une boîte de planches ou d’écorce ouverte d’un bout. <strong>Autour du fumoir, de la cache, du caveau et du poulailler, sans appât</strong> : l’odeur de ce qu’on y garde attire déjà ce qu’on veut identifier. Un appât posé près des bâtiments, nuit après nuit, apprend aux bêtes que la nourriture est là, l’ours le premier, et un ours qui trouve à manger près des gens perd sa peur des gens (<span class="ref">ch. 95</span>, <span class="ref">§8</span>, bloc 4 ; <span class="ref">ch. 23</span>, <span class="ref">§8</span>, bloc 7). <strong>Loin des bâtiments</strong>, l’appât se pose au fond — un bout de poisson, de viscère —, pour que la bête marche sur toute la longueur de la tôle pour l’atteindre. Pour une bête de la taille d’une martre, une boîte d’une trentaine de centimètres de large et de haut sur 80 de long ; pour plus gros, la tôle se pose à découvert, loin des bâtiments, l’appât attaché au milieu.</p>
<p class="step"><span class="sn">4</span>Au matin, <strong>chaque pied qui a marché a enlevé la suie</strong> : l’empreinte apparaît en clair sur le noir, doigts, coussinets et griffes compris, souvent plus nette que dans n’importe quelle neige.</p>
<p class="step"><span class="sn">5</span>On la lit sur place et on la renoircit.</p>
<p>La plaque se protège de la pluie et de la neige, qui la brouillent : c’est surtout un outil d’été et d’abri. Ce qu’elle apprend sert tout l’hiver : la martre qui vient au fumoir viendra au poste couvert qu’on montera sur son chemin (<span class="ref">ch. 55</span>, <span class="ref">§9</span>, « Le poste couvert »).</p>
<h3 class="sub">Lire une crotte avec un bâtonnet</h3>
<p class="p0">Une crotte dit qui l’a laissée, mais surtout <strong>ce qu’il a mangé, donc où est la nourriture</strong>. On l’ouvre au bâtonnet, on l’étale, on regarde — jamais aux doigts, et on ne respire pas la poussière d’une crotte sèche (<span class="ref">§8</span>, bloc 3).</p>
<p class="li"><strong>Poil et os</strong> : un carnivore. Du poil d’orignal ou de castor dans une crotte de loup, du lièvre dans une crotte de lynx : on sait ce que la meute ou le chat chasse en ce moment, et donc où.</p>
<p class="li"><strong>Écailles de poisson</strong> : loutre, qui fait ses tas au même endroit, sur une pointe.</p>
<p class="li"><strong>Petits fruits entiers et graines</strong> : ours, ou renard et coyote l’été et l’automne. Une crotte d’ours pleine de bleuets entiers dit qu’une talle n’est pas loin.</p>
<p class="li"><strong>Piquants de porc-épic</strong> : pékan.</p>
<p class="li"><strong>Fibre de bois</strong> : porc-épic, orignal l’hiver, lièvre ; <strong>sciure et copeaux</strong> : castor. Des crottes d’herbivores dures et fibreuses, c’est l’hiver et les rameaux ; molles, c’est l’été et le vert.</p>
<p class="li"><strong>Moulée</strong> : chien.</p>
<h3 class="sub">Écouter</h3>
<p class="li"><strong>Les mains en cornet</strong> derrière les oreilles, on tourne lentement sur soi : le son est le plus fort face à sa source.</p>
<p class="li"><strong>L’écureuil roux</strong> crie de deux façons : un cri aigu quand il voit un oiseau de proie, <strong>un aboiement grave quand un prédateur est au sol</strong>. Un écureuil qui aboie dans la même épinette depuis un moment regarde quelque chose sous lui : une martre, un renard, un lynx — ou soi.</p>
<p class="li"><strong>Les corbeaux, les geais et les aigles réunis</strong> au même endroit, qui se posent et repartent : une carcasse (<span class="ref">§8</span>, bloc 1).</p>
<p class="li"><strong>Les oiseaux qui s’affolent</strong> sur le passage de quelque chose disent où ce quelque chose est passé, et dans quel sens il va.</p>
<h3 class="sub">Lire sans neige</h3>
<p class="p0">L’été, il n’y a presque jamais d’empreinte complète ; on suit une chaîne de dérangements.</p>
<p class="li"><strong>La rosée essuyée.</strong> Tôt le matin, ce qui a traversé une clairière a fait tomber les gouttes des herbes et laisse une ligne mate dans l’herbe luisante. Elle disparaît dès que le soleil sèche l’herbe : c’est une piste de l’aube, qu’on suit tout de suite ou jamais.</p>
<p class="li"><strong>L’herbe couchée</strong> penche dans le sens de la marche.</p>
<p class="li"><strong>Les feuilles et les cailloux retournés</strong> montrent leur face humide ou plus foncée.</p>
<p class="li"><strong>Les toiles d’araignée déchirées</strong> en travers d’une coulée : quelque chose est passé depuis que l’araignée l’a tissée.</p>
<p class="li"><strong>La sortie d’un ruisseau.</strong> Une bête sort de l’eau là où c’est facile : on cherche la berge basse et ouverte, les roches mouillées, la boue remuée, l’eau troublée en aval. Une piste qui ressort mouillée sèche peu à peu sur quelques mètres : une piste humide qui devient sèche est fraîche.</p>
<p class="li"><strong>Les roches.</strong> Sur un sol dur, la mousse et le lichen arrachés ou écrasés gardent la marque ; sinon, on contourne le terrain dur pour retrouver la piste à la sortie.</p>
<p class="li"><strong>La hauteur de la cassure</strong> dit la taille de la bête : des tiges cassées à hauteur de poitrine d’homme ne sont pas un renard.</p>
<h3 class="sub">Quand la piste se perd</h3>
<p class="step"><span class="sn">1</span><strong>Marquer la dernière empreinte sûre</strong> d’une branche plantée, d’une mitaine, de trois cailloux. On y reviendra dix fois, et c’est de là que tout repart.</p>
<p class="step"><span class="sn">2</span><strong>Regarder loin devant, pas à ses pieds.</strong> À dix ou vingt mètres, la piste se voit comme une ligne de dérangements que l’œil perd quand il est collé dessus. Les yeux au sol ratent la bête couchée devant.</p>
<p class="step"><span class="sn">3</span><strong>Poser le bâton</strong> sur la dernière empreinte sûre et chercher à la pointe.</p>
<p class="step"><span class="sn">4</span><strong>Chercher avec méthode, et à deux si on peut</strong> : en cercles qui s’élargissent autour de la dernière empreinte sûre, en commençant du côté où la bête allait, ou en carré qui s’élargit ; à deux, l’un ne quitte pas la dernière empreinte sûre pendant que l’autre cherche. C’est la même méthode que pour une bête blessée : chapitre 44 (étapes 26 et 31).</p>
<p class="step pk-d"><span class="sn">5</span><strong>Penser comme la bête.</strong> Elle prend le chemin le plus facile : le sentier tassé d’un lièvre, un chemin de motoneige, la glace d’un ruisseau — qui se lit depuis la rive (<span class="ref">§8</span>, bloc 5) —, le dessus d’un chablis, la berge basse. Une piste qui disparaît sur un sentier de lièvre est souvent dedans, recouverte par les pistes des lièvres.</p>
<p class="step"><span class="sn">6</span><strong>Connaître ses ruses.</strong> L’orignal fait un crochet avant de se coucher : quand sa piste se met à tourner, on la quitte (<span class="ref">ch. 44</span>, étape 7). Le lièvre levé tourne en rond et revient : on l’attend. La martre se recoupe et fouille chaque trou. Le lynx file droit en vieille forêt et serpente dans la repousse. Les loups vont en file dans la neige et se servent des pistes tassées là où il y en a. L’ours prend les sentiers.</p>
<p class="step"><span class="sn">7</span><strong>Le vent.</strong> Une poignée de neige poudreuse ou d’herbe sèche lâchée à hauteur d’épaule dit d’où il vient.</p>
<h3 class="sub">Approcher la bête au bout de la piste</h3>
<p class="p0">L’approche elle-même — le vent dans la face, au moins dix fois plus de temps immobile qu’en marche, le crochet de l’orignal qu’on quitte pour revenir sous le vent, la marche à deux — est au chapitre 44 (étapes 5 à 7 et 11). Ce chapitre-ci n’ajoute que la lecture : quand la miette de neige s’envole au souffle et que la piste change d’allure, raccourcit ou tourne vers un fourré, la bête est couchée tout près. On regarde devant, à hauteur de bête, l’œil noir d’un lièvre blanc, pas la piste. Le lièvre se gîte souvent sur une petite butte d’où il voit autour (<span class="ref">ch. 47</span>, étape 5) : on arrive par le côté, pas par la piste.</p>
<p class="p0 ri"><strong class="runin">Sauf l’ours.</strong> Une piste d’ours fraîche qui entre dans un fourré ne se suit pas dedans. On la contourne de loin, en se faisant entendre : on parle fort, on tape des mains. Un ours qui entend venir du monde s’en va ; un ours surpris à quelques pas se défend, et le fourré, où l’on ne voit rien devant soi, est justement l’endroit où on le surprend (<span class="ref">§8</span>, bloc 1).</p>
<h3 class="sub">Le retour</h3>
<p class="p0">Quand il recommence à neiger, on rentre : la piste du retour est la première qui disparaît.</p>
<h3 class="sub">S’exercer l’hiver d’avant</h3>
<p class="p0">L’œil ne s’achète pas. Il se prend autour du chalet, dans les années ordinaires :</p>
<p class="li"><strong>Chaque matin de neige</strong>, suivre une piste de renard ou de lièvre jusqu’à ce qu’elle raconte quelque chose ; faire deviner aux enfants la bête et le sens de la marche.</p>
<p class="li"><strong>Mesurer sa propre foulée</strong> au pas, au trot et à la course dans la neige, et voir de combien elle change : c’est ce qui arrive à la bête aussi.</p>
<p class="li"><strong>Faire marcher, trotter et courir le chien du chalet</strong> dans une neige fraîche, puis lire ses pistes : c’est le seul canidé dont on connaît d’avance l’allure.</p>
<p class="li"><strong>Vieillir ses propres marques.</strong> Dans un coin de sable ou de terre lissée derrière le chalet, faire une rangée de marques avec un même bâton, en appuyant de plus en plus fort ; revenir six heures plus tard et refaire la même rangée à côté ; recommencer à douze, dix-huit, vingt-quatre heures, puis chaque jour pendant une semaine. Refaire la même chose dans la neige. Une saison de ce jeu apprend à dater mieux que n’importe quel tableau.</p>
<h3 class="sub">Ce qu’on perd, et ce qui ne se remplace pas</h3>
<p class="p0">Sans règle, on perd la précision : on sépare encore un loup d’un renard, plus un coyote d’un gros renard. Sans lumière rasante, on perd les empreintes de la neige plate de midi. Sans neige, on perd presque tout ce qui est vitesse et nombre : l’été, on sait qu’une bête est passée, rarement combien, rarement quand — sauf devant une bande lissée ou une plaque de suie, qui ne disent que ce qui s’est passé à un seul endroit.</p>
<p>Ce qui ne se remplace pas, c’est l’expérience. Aucune fiche ne donne l’empreinte à moitié fondue, la piste dans la poudreuse profonde, la bête qui marche quand elle devrait bondir. Les fourchettes de ce chapitre ont été mesurées sur des bêtes d’Alaska, des Rocheuses et du nord-est américain, dans des neiges et des boues de toutes sortes : elles servent à trier, pas à trancher au millimètre.</p>
</template>
<template id="notes">
<p class="fn" data-fn="12-1"><span class="fnn">1</span>Une braise se cache sous la cendre. Lampe éteinte, porte du poêle ouverte, on brasse la cendre au tisonnier jusqu’au fond : une braise vivante luit rouge. Tant qu’un seul point rouge luit, le feu n’est pas mort, et il fait du CO sans flamme.</p>
<p class="fn" data-fn="12-2"><span class="fnn">2</span>Le fil, tenu au bout d’une broche, s’approche d’une flamme, dehors. Le coton brûle sans reculer devant la flamme, sent le papier brûlé et laisse une cendre grise et fine. Le nylon et le polyester fondent en se recroquevillant loin de la flamme, sentent le produit chimique et laissent une petite bille fondue. Un tissu mélangé ne se lit pas à coup sûr : dans le doute, il se range avec la bâche.</p>
<p class="fn" data-fn="43-1"><span class="fnn">1</span>Le bord avant du gros coussinet, celui qui regarde les doigts, fait deux bosses arrondies côte à côte. Celui d’un canidé est un petit triangle, sans ces deux bosses.</p>
<p class="fn" data-fn="43-2"><span class="fnn">2</span>Un gros rocher posé seul au milieu d’une tourbière, d’un plat ou d’une forêt, loin de toute falaise d’où il aurait pu tomber : c’est la glace des glaciers qui l’a laissé là.</p>
<p class="fn" data-fn="43-3"><span class="fnn">3</span>Là où le loup et le coyote ont un petit coussinet en triangle, celui du pied avant du renard se réduit à une barre étroite, posée en travers de l’empreinte. Autour de cette barre, le vide entre les doigts et le coussinet est grand, et le X se lit net.</p>
</template>

<script>
(function(){
const OVER = f => (f.scrollHeight > f.clientHeight + 1) || (f.scrollWidth > f.clientWidth + 1);
function stops(el){
  const out=[]; const tw=document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
  while((n=tw.nextNode())){ const t=n.data; for(let i=0;i<t.length;i++){ if(t[i]===' '||t[i]==='\n') out.push([n,i]); } }
  return out;
}
function part(el, s, first){
  const r=document.createRange();
  if(first){ r.setStart(el,0); r.setEnd(s[0],s[1]); } else { r.setStart(s[0],s[1]+1); r.setEnd(el, el.childNodes.length); }
  const c=el.cloneNode(false); c.appendChild(r.cloneContents());
  if(!first){ c.classList.add('cont'); }
  return c;
}
function splitPara(el, f){
  const st=stops(el); if(st.length<14) return null;
  let lo=0, hi=st.length-1, best=-1;
  while(lo<=hi){ const mid=(lo+hi)>>1; const a=part(el,st[mid],true); f.appendChild(a); syncNotes(f); const ok=!OVER(f); f.removeChild(a); syncNotes(f); if(ok){best=mid;lo=mid+1;} else hi=mid-1; }
  if(best<11) return null;
  if(st.length-best<6) best=st.length-7;
  if(best<11) return null;
  return [part(el,st[best],true), part(el,st[best],false)];
}
function splitTable(tb, f){
  const rows=Array.from(tb.tBodies[0].rows);
  const mk=(rs,kind)=>{ const t=tb.cloneNode(false); const cg=tb.querySelector('colgroup'); if(cg) t.appendChild(cg.cloneNode(true));
    if(kind==='first'){ const cap=document.createElement('caption'); cap.className='tsuite'; cap.textContent='Le tableau continue page suivante'; t.appendChild(cap); }
    t.appendChild(tb.tHead.cloneNode(true)); const b=document.createElement('tbody'); rs.forEach(r=>b.appendChild(r.cloneNode(true))); t.appendChild(b);
    if(kind==='rest') t.classList.add('suite'); return t; };
  let best=0;
  for(let k=1;k<=rows.length;k++){ const t=mk(rows.slice(0,k),'first'); f.appendChild(t); syncNotes(f); const ok=!OVER(f); f.removeChild(t); syncNotes(f); if(ok) best=k; else break; }
  if(best<2) return null;
  return [mk(rows.slice(0,best),'first'), mk(rows.slice(best),'rest')];
}
/* ---------- notes de bas de page ----------
   Chaque cadre a, juste après lui, une zone de notes à deux cases (une par colonne).
   On la resynchronise à chaque essai de remplissage : la note prend sa place dans la
   hauteur du cadre avant qu'on juge si le bloc tient. Si l'appel passe à la page
   suivante, sa note le suit. */
const NOTES={};
document.getElementById('notes').content.querySelectorAll('p.fn').forEach(n=>NOTES[n.dataset.fn]=n);
function noteZone(f, make){
  let z=f.nextElementSibling;
  if(z && z.classList.contains('fnz')) return z;
  if(!make) return null;
  z=document.createElement('div'); z.className='fnz';
  if(getComputedStyle(f).columnCount==='1') z.classList.add('one');
  z.innerHTML='<div class="fnc" data-side="l"></div><div class="fnc" data-side="r"></div>';
  f.after(z); return z;
}
function sideOf(c, f, z){
  if(z.classList.contains('one')) return 'l';
  const fr=f.getBoundingClientRect(), r=c.getBoundingClientRect();
  return (r.left-fr.left) < fr.width/2 ? 'l' : 'r';
}
function syncNotes(f){
  const seen=new Set();
  const calls=Array.from(f.querySelectorAll('sup.fnr')).filter(c=>NOTES[c.dataset.fn] && !seen.has(c.dataset.fn) && seen.add(c.dataset.fn));
  let z=noteZone(f, calls.length>0);
  if(!z) return;
  if(!calls.length){ z.remove(); return; }
  for(let it=0; it<4; it++){
    const want=calls.map(c=>c.dataset.fn+'|'+sideOf(c,f,z)).join(' ');
    const cur=Array.from(z.querySelectorAll('p.fn')).map(n=>n.dataset.fn+'|'+n.parentNode.dataset.side).join(' ');
    if(want===cur) break;
    z.querySelectorAll('.fnc').forEach(c=>c.textContent='');
    want.split(' ').forEach(w=>{ const [id,sd]=w.split('|'); z.querySelector('.fnc[data-side="'+sd+'"]').appendChild(NOTES[id].cloneNode(true)); });
    z.classList.add('on');
  }
}

/* =====================================================================
   Moteur de chapitre (build_chapitre.py). Les fonctions au-dessus
   (OVER, splitPara, splitTable, noteZone, syncNotes) sont celles de
   interieur.tpl.html, recopiées à la construction. Ici : les pages se
   créent à la volée, trois histoires se suivent (texte courant, encadré
   danger, variante d'urgence), les planches pleine page prennent la page
   qui suit leur mention, les demi-planches et les photos flottent au
   premier endroit où elles tiennent, jamais au milieu d'un paragraphe.
   ===================================================================== */
const C = JSON.parse(document.getElementById('meta').textContent);
const BOOK = document.getElementById('book');
const WARN = [];
const PAGES = [];
let P = null;                 // page courante
let pendingPlates = [];       // planches pleine page qui attendent la fin de la page courante
const DSVG = '<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#fff"/><path d="M15.2 10 H18.8 L18.1 20.5 H15.9 Z" fill="#9B2C1E"/><rect x="15.4" y="22.3" width="3.2" height="3.2" fill="#9B2C1E"/></svg>';
const PT = 96/72;

function mkPage(kind, plate){
  const n = PAGES.length + 1, side = n % 2 ? 'recto' : 'verso';
  const el = document.createElement('section'); el.className = 'page ' + side; el.id = 'p' + C.num + '-' + n;
  if(kind !== 'open') el.innerHTML = '<div class="rh"><div class="grp"><span class="fo">' + C.num + '-' + n + '</span><span class="ch">' + C.num + ' · ' + C.title + '</span></div><span class="to">' + C.tome + '</span></div>';
  const bl = document.createElement('div'); bl.className = 'block'; el.appendChild(bl);
  if(kind === 'open') bl.innerHTML = document.getElementById('open').innerHTML;
  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();

<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
