<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>43 — Les traces et les signes des animaux — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}

<template id="open"><header class="open"><div class="open-top"><span>Tome 3 · Prélever</span><span>Chapitre</span></div><div class="open-title"><div class="num">43</div><h1>Les traces et les signes des animaux</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span class="on">Chalet</span><span>Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">C’est autour du chalet que les pistes décident de quelque chose : où poser un collet, où attendre à la brunante, qui a tourné autour de la cache de viande pendant la nuit, et où ne pas aller. Au village, le même savoir dit seulement quel chien a traversé la cour.</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Une trace dit quelle bête est passée, à quelle allure, dans quel sens et depuis combien de temps : dans la neige, elle se lit de quelques minutes à quelques jours selon le vent et le soleil ; dans la boue, ses bords sont secs et croûtés au bout d’une heure au moins ; une griffade d’ours sur un tremble se lit encore des années plus tard.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<p class="p0 lab kh"><strong class="runin">Quand c’est le bon geste.</strong></p>
<p class="li"><strong>Le deuxième matin après une neige, pour savoir ce qui vit là.</strong> La première nuit ne montre que les bêtes qui ont bougé cette nuit-là ; la deuxième en ajoute assez pour dresser l’inventaire d’un secteur, sans que les pistes se mêlent encore.</p>
<p class="li"><strong>Le premier matin après une neige, pour trouver une bête.</strong> Tout ce qui est sur la neige neuve a été fait depuis qu’elle a cessé de tomber : la piste la plus nette est la plus fraîche (<span class="ref">ch. 47</span>, étape 6).</p>
<p class="li"><strong>Avant de poser une ligne de collets ou de pièges.</strong> Une ligne se pose sur des pistes, pas sur une impression (<span class="ref">ch. 48</span>, étape 3 ; <span class="ref">ch. 55</span>).</p>
<p class="li"><strong>Au retour au chalet après une absence.</strong> Le tour du bâtiment, de la cache et du caveau dit qui est venu, combien de fois, et s’il est reparti. Le tas de viscères se lit <strong>de loin</strong> : une piste d’ours qui y mène renvoie au <span class="ref">§8</span>, bloc 1, parce qu’un ours qui mange là garde ce qu’il mange. <strong>Une piste d’ours qui entre dans la remise, le caveau, la cache ou sous le chalet, et qui ne ressort pas</strong> : il est peut-être encore dedans. On n’ouvre pas la porte, on ne passe pas la tête dessous : un ours coincé ou surpris de près se défend. On se tient loin, on lui laisse le chemin libre vers le bois, et on fait du bruit de là. Un ours qui entend venir du monde s’en va.</p>
<p class="li"><strong>Tôt le matin au printemps</strong>, quand le gel de la nuit tient encore la neige : c’est l’heure où les empreintes n’ont pas encore fondu.</p>
<p class="p0 lab kh"><strong class="runin">Quand c’en est un mauvais.</strong></p>
<p class="li"><strong>Après un redoux suivi d’un gel.</strong> Les bêtes marchent sur la croûte sans laisser de trace. Une neige vide ne veut pas dire un secteur vide.</p>
<p class="li"><strong>À midi, sur un versant exposé au sud, au printemps.</strong> Le soleil agrandit les empreintes d’heure en heure : un renard devient un lynx, un coyote devient un loup (<span class="ref">§3</span>). Mesurer là où il y a de l’ombre, ou revenir sur le versant nord.</p>
<p class="li"><strong>Pour chercher une bête blessée.</strong> L’attente avant de suivre, le sang, et la recherche en cercles ou en carré qui s’élargit sont au chapitre 44 (blocs C, D et F). Ce chapitre-ci lit les bêtes vivantes et saines.</p>
<p class="li"><strong>Pour suivre un lièvre qu’on vient de lever.</strong> Il décrit un grand cercle et revient près de son point de départ : on l’attend, on ne le suit pas (<span class="ref">ch. 47</span>, étape 8).</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">Trois mots, qu’on n’emploie pas l’un pour l’autre.</strong> L’<strong>empreinte</strong> est la marque d’un seul pied. La <strong>piste</strong> est une suite d’empreintes. La <strong>trace</strong> est tout ce que la bête laisse derrière elle : piste, crotte, poil, griffade, reste de repas. La <strong>foulée</strong>, dans ce chapitre, est la distance entre deux posés <strong>du même pied</strong> — un cycle complet. Au pas, elle vaut à peu près la distance de l’épaule à la hanche : elle donne la longueur de la bête. Le <strong>pas</strong>, comme longueur, en est la moitié : d’une empreinte à la suivante, <strong>de l’autre pied</strong>. Les fiches donnent la foulée ; le bâton de pistage mesure le pas (<span class="ref">§9</span>).</p>
<p class="p0 ri"><strong class="runin">Le pied dit la famille.</strong> Quatre questions suffisent presque toujours : combien de doigts, les griffes marquent-elles, l’empreinte est-elle symétrique, quel pied est le plus grand.</p>
<p class="li"><strong>Les canidés</strong> (loup, coyote, renard) : quatre doigts devant et derrière, griffes presque toujours visibles, empreinte ovale et symétrique, doigts presque parallèles. Entre les doigts et le coussinet, un espace vide en forme de <strong>X</strong> chez le renard et le loup, <strong>plutôt de H chez le coyote</strong>. Le pied avant est le plus grand : c’est l’avant qui porte le poids.</p>
<p class="li"><strong>Le lynx</strong> : quatre doigts, <strong>griffes rarement visibles</strong>, empreinte ronde, aussi large que longue ; un doigt central dépasse l’autre ; le coussinet a deux lobes à l’avant quand on le voit<sup class="fnr" data-fn="43-1">1</sup>. Le pied est si poilu que le dessin est flou, même l’été.</p>
<p class="li"><strong>Les mustélidés</strong> (martre, vison, loutre, belette) : <strong>cinq doigts</strong> groupés un-trois-un ; quand le petit doigt intérieur ne marque pas, un-trois ; coussinet en V renversé, plus long d’un côté ; griffes visibles.</p>
<p class="li"><strong>L’ours</strong> : cinq doigts, griffes qui ne marquent pas toujours ; le pied arrière ressemble à un pied humain, <strong>mais son plus petit doigt est à l’intérieur</strong>. L’arrière est le plus grand : c’est l’arrière-train qui est lourd.</p>
<p class="li"><strong>Les rongeurs</strong> (castor, rat musqué, porc-épic, écureuil) : quatre doigts devant, cinq derrière ; les trois doigts du milieu du pied arrière sont parallèles. Le pied arrière est le plus grand ; chez le porc-épic, avant et arrière ont le même dessin.</p>
<p class="li"><strong>Le lièvre</strong> : pieds arrière beaucoup plus grands que les avant, qui se posent <strong>devant</strong> eux.</p>
<p class="li"><strong>Les cervidés</strong> : deux sabots, et deux <strong>ergots</strong>, petits doigts placés plus haut derrière la patte, qui ne marquent que dans la neige, dans la boue ou quand la bête va vite.</p>
<p class="p0 ri"><strong class="runin">Le corps dit l’allure.</strong> Une bête ne choisit pas sa façon de marcher, sa forme la lui impose, et l’allure se lit de loin quand l’empreinte ne se lit plus.</p>
<p class="li"><strong>Au pas</strong>, les pieds se posent l’un après l’autre et laissent une ligne ; souvent le pied arrière se pose exactement dans l’empreinte du pied avant (pose directe). Plus la bête compte sur la discrétion, plus la pose est directe : le lynx pose presque toujours ses pieds arrière dans ses propres trous.</p>
<p class="li"><strong>Au trot</strong>, les pattes opposées bougent ensemble. La piste ressemble à celle du pas, mais la foulée est plus longue et la piste plus étroite. Les canidés trottent pour se déplacer, souvent de biais, les avant d’un côté de la ligne, les arrière de l’autre.</p>
<p class="li"><strong>Le bond</strong>, les deux pieds arrière poussant ensemble, laisse des groupes séparés par des vides : lièvre, écureuil. <strong>Les mustélidés</strong>, longs et bas, <strong>bondissent par paires</strong> dans la neige, les pieds arrière tombant dans les trous des avant : deux trous côte à côte, un vide, deux trous.</p>
<p class="li"><strong>Une allure qui change est un événement.</strong> Un carnivore galope rarement longtemps avec un espacement égal ; au pas ou au trot, il garde le même espacement sur de longues distances. La piste d’un lynx qui marche et qui bondit sur quelques mètres raconte une tentative de prise.</p>
<p class="p0 ri"><strong class="runin">Les dents disent qui a mangé.</strong> Les cervidés n’ont <strong>pas d’incisives en haut</strong> : ils pincent la pousse et l’arrachent, et laissent un <strong>bout effiloché</strong>. Le lièvre et les rongeurs ont des incisives en ciseau et doivent pencher la tête pour couper : ils laissent une <strong>coupe nette, en biais</strong>. Et la largeur d’une marque de dent trie les rongeurs : <strong>6 mm</strong> le castor, <strong>3,6 mm</strong> le porc-épic, <strong>2,3 mm</strong> le lièvre, <strong>1 mm</strong> l’écureuil roux et le campagnol.</p>
<p class="p0 lab kh"><strong class="runin">La neige enregistre, puis elle efface — et elle ment entre les deux.</strong></p>
<p class="li"><strong>Elle se soude.</strong> Les miettes de neige que le pied projette en avant se soudent à la neige dessous en <strong>20 minutes à une heure</strong> selon le froid, l’humidité et la neige : c’est le frittage, le même phénomène qui fait tenir un abri de neige. Tant qu’elles s’envolent au souffle, la bête est passée il y a très peu de temps (<span class="ref">§5-A</span>, étape 9).</p>
<p class="li"><strong>Elle grossit les empreintes.</strong> Le soleil fond les bords, surtout le bord opposé au soleil ; le vent sublime la neige du côté sous le vent. Une empreinte peut <strong>quadrupler de surface</strong>, et ses doigts finissent par se fondre dans le coussinet. C’est ainsi qu’un coyote devient un lynx, dans l’œil de celui qui a mesuré une seule empreinte au soleil de midi.</p>
<p class="li"><strong>Elle les rapetisse.</strong> Le manteau de neige se tasse sous son propre poids ; comme la neige colle aux troncs, <strong>des creux en entonnoir autour des arbres</strong> signalent le tassement. En quelques heures, une empreinte rétrécit, et parfois disparaît.</p>
<p class="li"><strong>Par grand froid calme, elle ne change plus.</strong> Sans soleil ni vent, une piste de trois jours a l’air de la nuit dernière. L’âge d’une trace, c’est de la météo : il faut savoir le temps qu’il a fait.</p>
<p class="p0 ri"><strong class="runin">La boue aussi.</strong> L’eau tient les bords d’une empreinte nets ; en séchant, les grains tombent dedans et les bords s’arrondissent, puis croûtent — <strong>une heure au moins</strong> pour des bords secs et croûtés. L’eau qui remplit une empreinte fraîche dans un sol détrempé est trouble, et <strong>s’éclaircit en une heure environ</strong>. Une pluie légère arrondit les bords ; une forte pluie efface tout.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Ce qu’il faut pour <strong>lire</strong> ; les jumelles et les frontales s’achètent au chapitre 00b.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Ruban à mesurer ou règle</td><td>1</td><td><strong>La main mesurée une fois</strong> (<span class="ref">§9</span>) ; le bâton entaillé aux 5 cm ; la hauteur de la page de ce livre, 25,4 cm ; la règle imprimée sur les planches des empreintes</td><td>Oui</td></tr><tr><td class="c-item">Lampe frontale</td><td>1</td><td>Soleil bas du matin ou du soir ; l’ombre de son propre corps jetée sur l’empreinte ; <strong>à la brunante et la nuit seulement</strong>, une chandelle tenue au ras de la neige</td><td>Oui</td></tr><tr><td class="c-item">Bâton de pistage, droit, d’environ 90 cm</td><td>1</td><td>N’importe quelle branche droite, écorcée au couteau aux endroits à marquer ; une perche plus longue si le pas de la bête dépasse le bâton</td><td>Oui</td></tr><tr><td class="c-item">Bâtonnet pour ouvrir une crotte</td><td>1</td><td>Une brindille. <strong>Jamais les doigts</strong> (<span class="ref">§8</span>)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Jumelles</td><td>1 paire</td><td>Monter sur une butte ; s’arrêter plus longtemps</td><td>Oui</td></tr><tr><td class="c-item">Marques pour la dernière empreinte sûre</td><td>3 ou 4</td><td>Branche cassée plantée dans la neige ; mitaine posée ; ruban de couleur ; trois cailloux</td><td>Oui</td></tr></tbody></table>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<p class="p0">Un chapitre de référence : une méthode de lecture en quinze étapes (5-A), puis les fiches par espèce (5-B à 5-F), les signes sur les arbres (5-G) et les confusions (5-H).</p>
<h3 class="sub">5-A. Lire une trace, dans l’ordre</h3>
<p class="step"><span class="sn">1</span><strong>S’arrêter avant de marcher dessus.</strong> La pire erreur de lecture, c’est le pisteur : ses pieds, ceux des enfants, le chien. On arrête tout le monde à distance et on garde le chien attaché.</p>
<p class="step"><span class="sn">2</span><strong>Regarder la scène avant l’empreinte.</strong> D’où vient la piste, où va-t-elle, dans quel milieu, à quelle saison, et la surface a-t-elle changé depuis le passage (neige tombée, vent, soleil) ? Une empreinte de mustélidé moyen le long d’un ruisseau est plus souvent un vison qu’une martre ; la même en vieille forêt de conifères, l’inverse.</p>
<p class="step"><span class="sn">3</span><strong>Approcher par le côté, et par le bas s’il y a une pente.</strong> On marche à côté de la piste, jamais dedans, et du côté aval, pour qu’une glissade ne détruise rien.</p>
<p class="step"><span class="sn">4</span><strong>Chercher la meilleure empreinte, pas la première.</strong> Suivre sur vingt ou trente mètres. Une empreinte nette se trouve <strong>sous les épinettes</strong>, où la neige est plus mince et plus ferme, sur un chemin tassé, sur une croûte saupoudrée de neige fraîche, au bord d’une flaque. Trois empreintes avant et trois arrière, si on peut, plutôt qu’une.</p>
<p class="step"><span class="sn">5</span><strong>Compter les doigts, chercher les griffes, regarder la forme.</strong> Les quatre questions du <span class="ref">§3</span>. Sur un sabot : pointu ou rond, ergots ou non.</p>
<p class="step"><span class="sn">6</span><strong>Mesurer la longueur et la largeur comme les fiches le font.</strong> Le pied arrière du lièvre, des rongeurs et de l’ours se mesure <strong>talon compris</strong> : l’exclure donne une mesure plus petite que la fiche, et une autre bête. L’avant de l’ours se lit avec ou sans son petit talon rond, qui marque rarement (5-C). Les griffes ne comptent pas dans la longueur : elle s’arrête au bout du coussinet du doigt le plus avancé. La griffe se regarde à part : marque-t-elle ou non (<span class="ref">§3</span>). Mesurer ce que le pied a touché, pas le trou qu’il a laissé : une empreinte enfoncée paraît plus grande qu’elle n’est.</p>
<p class="step"><span class="sn">7</span><strong>Trouver un bout où la bête ne se pressait pas,</strong> sur terrain plat, piste droite, espacement égal sur plusieurs foulées. C’est là qu’on mesure la foulée et la largeur de piste. Le trot pris pour un pas fait croire à une bête plus grosse : c’est l’erreur qui transforme un coyote en loup. <strong>Mesurer de centre à centre</strong> d’empreinte : le centre bouge peu quand la neige fond.</p>
<p class="step"><span class="sn">8</span><strong>Lire le sens de la marche.</strong> Trois indices, du plus sûr au moins sûr :</p>
<p class="li">les <strong>miettes de neige projetées vers l’avant</strong>, qui se voient même de loin ;</p>
<p class="li">la forme du trou dans la neige profonde : <strong>une petite entrée</strong> où le pied est entré, <strong>un étranglement</strong> où la patte a pivoté, <strong>une sortie plus large</strong> où le pied est ressorti ;</p>
<p class="li"><strong>le fond du trou, tâté avec la main nue</strong> : les pointes d’un sabot, les doigts d’un canidé marquent plus profond que l’arrière. Chez le lièvre, <strong>le sens de la marche va vers les grandes empreintes</strong> : ce sont les pieds arrière, posés devant. La moitié des gens le lisent à l’envers.</p>
<p class="step"><span class="sn">9</span><strong>Dater dans la neige.</strong> Souffler sur les miettes au bord de l’empreinte : si elles s’envolent, la bête est passée depuis moins de 20 minutes à une heure, et elle est probablement tout près ; si elles sont soudées, c’est plus vieux, sans qu’on sache de combien. Ensuite, la météo : une piste nette sur une neige tombée hier soir date de la nuit ; des bords arrondis et secs disent le vent ou le soleil ; des empreintes remplies à moitié de neige neuve sont d’avant ou de pendant la dernière chute. Tout ça se range dans les trois niveaux du chapitre 42 (étape 6) — du jour, de la semaine, de la saison — et pas plus fin.</p>
<p class="step"><span class="sn">10</span><strong>Dater dans la boue.</strong> Bords nets et humides, grains qui commencent à tomber dedans : quelques minutes. Bords secs et croûtés : <strong>une heure au moins</strong>. Eau trouble au fond de l’empreinte : moins d’une heure environ ; claire : plus. Des feuilles ou brindilles dans l’empreinte : poussées par le vent après le passage, ou écrasées par le pied pendant — les écrasées sont enfoncées sous le bord.</p>
<p class="step"><span class="sn">11</span><strong>Nommer l’allure.</strong> Ligne régulière : pas ou trot, et la foulée tranche. Paires de trous côte à côte : mustélidé qui bondit. Groupes de quatre avec les grandes empreintes devant : lièvre ou écureuil. Espacement qui s’allonge ou change : la bête a été dérangée, ou elle a chassé.</p>
<p class="step"><span class="sn">12</span><strong>Chercher les autres signes à moins de cent mètres.</strong> Crotte, urine, poil sur une branche, lit, tunnel, reste de repas, arbre marqué (5-G). Ce sont eux qui confirment l’espèce quand l’empreinte ne le fait pas.</p>
<p class="step"><span class="sn">13</span><strong>Confronter à la fiche</strong> (5-B à 5-F), puis à la table des confusions (5-H). Si deux espèces restent possibles, suivre la piste jusqu’à une empreinte nette plutôt que de trancher au hasard.</p>
<p class="step pk-d"><span class="sn">14</span><strong>Décider.</strong> Une trace lue sans décision est une promenade : collet ici, attente là, rien à faire, ou s’en aller (<span class="ref">§8</span>). La décision s’écrit sur la carte du territoire, au crayon, pas ailleurs (<span class="ref">ch. 42</span>, étape 7).</p>
<p class="step"><span class="sn">15</span><strong>Refaire le chemin au retour.</strong> Une empreinte invisible le matin sous une lumière plate ressort l’après-midi sous le soleil bas. Aller et revenir par la même route, c’est lire chaque trace sous deux lumières.</p>
<h3 class="sub">5-B. Les cervidés</h3>
<p class="p0">Deux sabots en cœur, la pointe dans le sens de la marche, deux ergots derrière dans la neige ou la boue. Pas de griffes, pas de doigts. Sabots avant plus grands. Allure ordinaire : le pas.</p>
<table class="tspan"><colgroup><col style="width:5.5%"><col style="width:24.2%"><col style="width:28.7%"><col style="width:41.6%"></colgroup><thead><tr><th>Espèce</th><th>Empreinte</th><th>Piste</th><th>Autres signes</th></tr></thead><tbody><tr><td class="c-item"><strong>Orignal</strong> (<em>Alces americanus</em>)</td><td>Deux croissants allongés et pointus. Avant <strong>11 à 18 cm de long, souvent plus</strong>, sur <strong>9,5 à 15 cm</strong> ; arrière 10,5 à 16,5 cm sur 9 à 12 cm. Un sabot de plus de 18 cm reste un orignal. Les pointes marquent plus profond. Les ergots marquent dans la neige et la boue</td><td>Pas lent, en ligne droite ; il enjambe les chablis et passe dans une neige qui arrête le loup. <strong>Sabots écartés et ergots marqués sur un sol dur : une bête qui court.</strong> <strong>Deux pistes fraîches ensemble, une grande et une minuscule</strong>, de la fin du printemps à l’été : une femelle et son petit veau, et on ne suit plus (<span class="ref">§8</span>, bloc 2). Avant de se coucher, il remonte le vent un moment, puis revient en demi-cercle : ce qui suit sa piste arrive sur lui du côté d’où vient le vent (<span class="ref">ch. 44</span>, étape 7)</td><td><strong>Brout effiloché</strong> sur saule, bouleau, tremble, sapin baumier, cornouiller : les rameaux mordus l’hiver, les feuilles arrachées l’été. Par endroits, une <strong>ligne de broutage à 1,8 ou 2,4 m</strong> du sol ; un saule brouté des années de suite prend la forme d’un balai. <strong>Écorçage</strong> vers la fin de l’hiver, surtout sur les trembles et les peupliers : raclé de bas en haut avec les dents du bas, bord inférieur net. <strong>Crottes d’hiver</strong> en boulettes ovales de <strong>2,5 à 4,5 cm</strong>, dures et sèches ; l’été, bouses molles. Jusqu’à une vingtaine de dépôts par jour. <strong>Frottis</strong> à l’automne : écorce effilochée et petites branches cassées à la hauteur du panache</td></tr><tr><td class="c-item"><strong>Caribou</strong> (<em>Rangifer tarandus</em>)</td><td><strong>Plus large que long</strong> : les sabots les plus ronds de tous les cervidés, deux demi-lunes creuses très écartées. Avant <strong>8 à 13 cm</strong> de long sur <strong>10 à 15 cm</strong> de large ; arrière 7,5 à 11,5 cm sur 9 à 12 cm</td><td>Pas, aux bords des tourbières et autour des gros blocs erratiques<sup class="fnr" data-fn="43-2">2</sup> où poussent les lichens</td><td><strong>Cratères d’alimentation</strong> : trous creusés à la patte dans la neige jusqu’aux lichens du sol ; dans une harde voisine, on ne les a pas vus creuser dans plus d’environ <strong>1,25 m</strong> de neige. Certains caribous passent l’hiver dans les vieilles pessières et sapinières, aux lichens des arbres. Crottes d’hiver en <strong>petites boulettes creusées d’un côté</strong></td></tr></tbody></table>
<h3 class="sub">5-C. L’ours noir</h3>
<table class="tspan"><colgroup><col style="width:5.1%"><col style="width:26.2%"><col style="width:18.4%"><col style="width:50.4%"></colgroup><thead><tr><th>Espèce</th><th>Empreinte</th><th>Piste</th><th>Autres signes</th></tr></thead><tbody><tr><td class="c-item"><strong>Ours noir</strong> (<em>Ursus americanus</em>)</td><td>Cinq doigts ; le <strong>plus petit à l’intérieur</strong>, à l’inverse du pied humain ; griffes pas toujours visibles. Avant large et court, le petit talon rond marque rarement : jusqu’à <strong>15 cm</strong> de large, et jusqu’à <strong>20 cm</strong> de long quand le talon marque. Arrière comme un pied humain élargi, talon entier : <strong>14 à 22,5 cm</strong> de long sur <strong>9 à 15 cm</strong></td><td>Pas lourd ; le pied arrière se pose souvent devant l’avant. Il prend <strong>les mêmes sentiers et chemins que les gens</strong>, le soir et au petit matin : ses pistes fraîches se voient le matin, sur les sentiers</td><td><strong>Arbre de marquage</strong> près d’un sentier : griffades verticales <strong>à hauteur des yeux</strong>, parfois jusqu’à 3,7 m, morsures, écorce polie, <strong>poils collés dans la sève</strong>. <strong>Griffades</strong> sur les trembles et les peupliers, qui restent <strong>des années</strong> en cicatrices noires. <strong>Écorçage de printemps</strong> : longs sillons verticaux de dents dans le bois, lanières d’écorce au pied ou pendantes. <strong>Billots roulés ou éventrés</strong>, fourmilières creusées, <strong>pierres retournées à l’envers sur la végétation</strong>. <strong>Lit de jour</strong> : cuvette ou végétation couchée près d’une source de nourriture, <strong>plusieurs crottes autour</strong> ; il y revient. <strong>Crottes</strong> foncées, <strong>450 g ou plus</strong>, pleines de petits fruits entiers et de graines l’été et l’automne, à l’odeur presque sucrée ; au printemps, petites, denses, tubulaires. <strong>Bosse de terre, d’herbe et de branches</strong> : une carcasse cachée (<span class="ref">§8</span>)</td></tr></tbody></table>
<h3 class="sub">5-D. Les canidés et le lynx</h3>
<p class="p0">Chez les quatre, le pied avant est plus grand que l’arrière. Les canidés marquent leurs griffes et trottent ; le lynx cache ses griffes et marche.</p>
<table class="tspan"><colgroup><col style="width:6.3%"><col style="width:23.5%"><col style="width:35.5%"><col style="width:34.8%"></colgroup><thead><tr><th>Espèce</th><th>Empreinte</th><th>Piste</th><th>Autres signes</th></tr></thead><tbody><tr><td class="c-item"><strong>Loup gris</strong> (<em>Canis lupus</em>)</td><td>Quatre doigts, griffes, ovale, X entre doigts et coussinet. Avant <strong>9,5 à 14,5 cm</strong> de long sur <strong>7 à 12,5 cm</strong> ; arrière nettement plus petit, 9,5 à 13 cm sur 6,5 à 11,5 cm. Les doigts marquent plus profond que le coussinet</td><td>Trot en ligne droite. <strong>Foulée de trot 130 à 155 cm</strong> ; au pas, 111 à 124 cm. Largeur de piste 12 à 23 cm. <strong>Dans la neige, la meute marche en file</strong>, chacun dans les pas du premier : une seule piste peut cacher plusieurs loups, qui se séparent plus loin. Sur une piste tassée, il va plus de trois fois plus vite qu’à côté ; il s’en sert là où il y en a, sans les rechercher partout. Les étangs de castor gelés, balayés par le vent et moins enneigés que la forêt, les rives gelées et les barrages sont des passages fréquents</td><td><strong>Crottes en corde de plus de 2,5 cm de diamètre</strong>, jusqu’à 3,8 cm, longues de 10 à 18 cm, pleines de poil de cervidé, de castor ou de lièvre, <strong>franges de poil effilées</strong> aux bouts, éclats d’os. <strong>Urine de marquage</strong> : seuls le mâle et la femelle dominants lèvent la patte. Carcasse d’orignal tuée dans une neige croûtée ou sur la glace lisse, où l’orignal n’a pas d’appui</td></tr><tr><td class="c-item"><strong>Coyote</strong> (<em>Canis latrans</em>)</td><td>Même dessin, en plus petit ; l’espace entre doigts et coussinet fait plutôt un <strong>H</strong>. Avant <strong>5,5 à 8 cm</strong> sur <strong>4 à 6 cm</strong> ; arrière 5,5 à 7,5 cm sur 3 à 5 cm</td><td>Trot en ligne ; <strong>foulée de trot 84 à 118 cm</strong> ; au pas, 61 à 98 cm</td><td>Crottes en corde de <strong>2 à 2,5 cm</strong> de diamètre, 7,5 à 15 cm de long, poil de petits mammifères, os, graines, fruits ; sur les sentiers, les roches, en vue. Grattages à côté</td></tr><tr><td class="c-item"><strong>Renard roux</strong> (<em>Vulpes vulpes</em>)</td><td><strong>5 à 7 cm</strong> de long sur <strong>3,5 à 5,5 cm</strong> ; pied très poilu l’hiver, doigts flous ; coussinet avant en barre<sup class="fnr" data-fn="43-3">3</sup>, qui dessine un <strong>X</strong> franc</td><td><strong>Une ligne droite</strong> : chaque pied arrière dans l’empreinte de l’avant, les pieds posés l’un devant l’autre comme sur un fil. Foulée au pas <strong>56 à 67 cm</strong>, au trot 79 à 102 cm. Son trot de biais laisse des paires d’empreintes qui ressemblent à une martre</td><td><strong>Urine à l’odeur de moufette</strong> sur une brindille, une souche, une motte : c’est le test qui sépare le renard du chien. <strong>Plongeons</strong> : un trou dans la neige, museau le premier, au bout d’un bond en arc, là où il a entendu un campagnol sous la neige. Crottes en corde effilée de <strong>moins de 1,6 cm</strong> de diamètre, poil et petits os l’hiver, petits fruits l’été ; grattage autour</td></tr><tr><td class="c-item"><strong>Lynx du Canada</strong> (<em>Lynx canadensis</em>)</td><td><strong>Ronde, aussi large que longue</strong> : en moyenne <strong>8,7 cm de long sur 9 cm de large</strong> à l’avant ; fourchette de 6 à 11 cm de long. <strong>Pas de griffes</strong>, doigts flous sous le poil, gros coussinet flou</td><td><strong>Pas en pose directe</strong>, foulée de <strong>47 à 94 cm</strong> (72 en moyenne) ; un <strong>sillon</strong> d’environ 27 cm de large même dans la neige molle, tracé par le poil des pieds. Il flotte : il porte trois fois moins par centimètre carré qu’un chat. <strong>Piste droite en vieille forêt, sinueuse dans la repousse</strong> : là, il chasse. Quelques mètres de bonds au milieu d’un pas : une tentative sur un lièvre ou un oiseau</td><td><strong>Crottes rarement enterrées</strong>, au milieu de la piste ou à une croisée. <strong>Caches</strong> : monticules de neige ou de débris sur les restes d’un lièvre. <strong>Lits</strong> : cuvettes rondes et nettes, <strong>à croûte de glace</strong> quand il s’y est reposé longtemps. Il lui arrive de marcher sur la piste du pisteur</td></tr></tbody></table>
<h3 class="sub">5-E. Les mustélidés</h3>
<p class="p0">Cinq doigts un-trois-un, griffes, bonds par paires dans la neige. Leur piste se reconnaît de loin : deux trous côte à côte, un vide, deux trous, et des vides qui alternent souvent court-long quand la bête accélère.</p>
<table class="tspan"><colgroup><col style="width:11.7%"><col style="width:19.6%"><col style="width:32.6%"><col style="width:36.2%"></colgroup><thead><tr><th>Espèce</th><th>Empreinte</th><th>Piste</th><th>Autres signes</th></tr></thead><tbody><tr><td class="c-item"><strong>Martre d’Amérique</strong> (<em>Martes americana</em>)</td><td>Avant <strong>4 à 7 cm</strong> sur <strong>3,5 à 6,5 cm</strong> ; pieds poilus l’hiver, coussinets flous</td><td>Paires de bonds ; elle marche aussi, en diagonale, quand elle examine quelque chose — ce qui trompe. <strong>Piste erratique qui se recoupe</strong>, de trou en souche : <strong>une piste sinueuse est une martre qui chasse</strong>. Elle emprunte les sentiers tassés des lièvres</td><td><strong>Tunnels</strong> dans la neige au pied des souches et des chablis. Elle frotte son ventre sur ce qui dépasse la neige pour marquer</td></tr><tr><td class="c-item"><strong>Vison d’Amérique</strong> (<em>Neogale vison</em>)</td><td>Avant <strong>3 à 5 cm</strong> sur <strong>2 à 4,5 cm</strong> ; un peu plus petit que la martre, l’écart est parfois mince</td><td>Paires de bonds <strong>le long des cours d’eau</strong>, qu’il quitte peu</td><td>Brun chocolat toute l’année et lié à l’eau ; la belette, elle, est blanche l’hiver</td></tr><tr><td class="c-item"><strong>Loutre de rivière</strong> (<em>Lontra canadensis</em>)</td><td>Avant <strong>5,5 à 8 cm</strong> ; arrière jusqu’à 10 cm sur 9,5 cm</td><td>Bonds, puis <strong>glissades de 1 à 5 m</strong> sur le ventre : la piste fait <strong>point-trait</strong>, comme du morse. Elle coupe d’un plan d’eau à l’autre par les fossés, les décharges, les barrages de castor</td><td><strong>Latrines</strong> sur les points hauts des berges ou sur les sentiers de traverse entre deux plans d’eau : herbe couchée, <strong>tas de crottes faits d’écailles de poisson</strong>. <strong>Grattages</strong> : herbe ratissée en petits tas. Elle revient parfois après une ou deux semaines seulement : <strong>des crottes vieillies ne veulent pas dire qu’elle est partie</strong>. Occupe les huttes de castor abandonnées</td></tr><tr><td class="c-item"><strong>Belette</strong> (hermine, <em>Mustela erminea</em>)</td><td><strong>2 à 3 cm</strong> de long sur 1 à 2 cm : la plus petite piste de carnivore du livre</td><td>Paires de bonds aux espacements irréguliers, courts et longs, qui plongent sous la neige et ressortent plus loin</td><td><strong>Petits trous</strong> dans la neige, par où elle chasse dans les tunnels des campagnols. Blanche l’hiver, <strong>bout de la queue noir</strong></td></tr></tbody></table>
<p class="p0 ri"><strong class="runin">Le pékan</strong> (<em>Pekania pennanti</em>), s’il passe par là, fait une piste de la taille d’une grosse martre : il marche davantage, suit le dessus des billots, traîne les pieds et la queue, laisse un sillon dans la neige molle et creuse rarement. Des crottes faites de piquants de porc-épic désignent le pékan.</p>
<h3 class="sub">5-F. Les rongeurs, le lièvre et les oiseaux</h3>
<table class="tspan"><colgroup><col style="width:12.7%"><col style="width:25.0%"><col style="width:20.1%"><col style="width:42.3%"></colgroup><thead><tr><th>Espèce</th><th>Empreinte</th><th>Piste</th><th>Autres signes</th></tr></thead><tbody><tr><td class="c-item"><strong>Castor du Canada</strong> (<em>Castor canadensis</em>)</td><td>Avant <strong>6 à 10 cm</strong>, comme une petite main, sans palmure ; arrière <strong>12 à 18 cm</strong> de long sur 8 à 13 cm, cinq doigts <strong>entièrement palmés</strong>, le plus grand pied de rongeur</td><td>Pas lourd, en se dandinant ; <strong>la queue peut traîner</strong> entre les pieds. Coulées de l’eau aux arbres coupés</td><td><strong>Souches taillées en crayon</strong>, gros copeaux au pied, marques de dents de <strong>6 mm</strong>. Bâtons écorcés dans l’eau. <strong>Hutte</strong> d’environ <strong>5 m</strong> de diamètre sur <strong>2 m</strong> de haut. <strong>Réserve de branches</strong> dans l’eau devant la hutte, dont les bouts dépassent et retiennent la neige. Barrage. Monticules de boue au bord de l’eau, marqués au castoréum, l’odeur musquée de ses glandes (<span class="ref">ch. 50</span>)</td></tr><tr><td class="c-item"><strong>Rat musqué</strong> (<em>Ondatra zibethicus</em>)</td><td>Avant <strong>2 à 4 cm</strong> ; arrière <strong>4 à 7 cm</strong></td><td>Pas ; <strong>la queue traîne</strong> et laisse un trait mince entre les pieds</td><td><strong>Huttes</strong> de végétaux et de boue de <strong>0,5 à 1 m</strong> de haut. Après le gel, il ronge des <strong>ouvertures dans la glace jusqu’à 90 m</strong> de la hutte : ce sont ses relais. Coulées au fond vaseux (<span class="ref">ch. 53</span>)</td></tr><tr><td class="c-item"><strong>Porc-épic d’Amérique</strong> (<em>Erethizon dorsatum</em>)</td><td>Avant <strong>5,5 à 8,5 cm</strong>, arrière <strong>7 à 10 cm</strong> ; avant et arrière ont le même dessin</td><td><strong>Sillon large et traînant</strong> dans la neige, qui revient sur lui-même, de l’arbre à la tanière (<span class="ref">ch. 51</span>, étape 4)</td><td>Écorce enlevée <strong>en plaques irrégulières haut dans l’arbre</strong>, marques de dents de <strong>3,6 mm</strong> en travers ou en biais. <strong>Rameaux coupés net sur la neige</strong> au pied de l’arbre. <strong>Crottes oblongues de 1,5 à 3 cm</strong>, arquées comme une noix de cajou, pleines de fibre de bois qui sent la résine l’hiver, en tas devant la tanière</td></tr><tr><td class="c-item"><strong>Écureuil roux</strong> (<em>Tamiasciurus hudsonicus</em>)</td><td>Avant <strong>2,5 à 3 cm</strong> ; arrière 2 à 5,5 cm</td><td>Groupes de quatre, <strong>les grands pieds arrière devant</strong>, qui vont <strong>d’un arbre à un autre</strong></td><td><strong>Amas</strong> d’écailles et de rafles de cônes au pied d’un perchoir, qui peut faire plus d’un demi-mètre de haut et de large, percé de trous, avec des tunnels dessous. Petits lambeaux d’écorce, pousses pelées sous les arbres. Champignons coincés dans les branches</td></tr><tr><td class="c-item"><strong>Lièvre d’Amérique</strong> (<em>Lepus americanus</em>)</td><td>Avant <strong>5 à 7,5 cm</strong> ; arrière <strong>8 à 15 cm</strong> de long, et <strong>de 4 à 12,5 cm de large</strong> selon que les doigts s’écartent dans la neige molle</td><td>Bonds : deux grandes empreintes arrière <strong>devant</strong>, deux petites avant derrière. <strong>Sentiers</strong> creusés en gouttière dans la neige, qui suivent les sentiers de l’été</td><td><strong>Brout coupé net en biais</strong>, marques de dents de <strong>2,3 mm</strong>, à la hauteur où il atteint <strong>depuis la neige du moment</strong> : la hauteur du brout dit l’épaisseur de neige qu’il y avait. Crottes rondes, un peu aplaties, brunes, faites de fibres. Gîte : petite cuvette sous des branches basses (<span class="ref">ch. 47</span>, étape 5)</td></tr><tr><td class="c-item"><strong>Gélinotte huppée</strong> (<em>Bonasa umbellus</em>)</td><td>Trois doigts devant, un petit derrière : <strong>4 à 5,5 cm</strong> de long sur <strong>4,5 à 6 cm</strong>. L’hiver, des écailles poussent sur les côtés des doigts et font raquette</td><td>Pas en ligne ; dans la neige molle, un <strong>sillon</strong></td><td><strong>Trou de neige</strong> où elle a passé la nuit (<span class="ref">ch. 47</span>) : petit trou peu profond, <strong>empreintes d’ailes</strong> autour, et <strong>des crottes au fond</strong>, laissées juste avant l’envol. Crottes d’environ <strong>2,5 cm</strong>, un peu courbes, <strong>un bout blanc</strong>. Bourgeons de tremble et de saule cueillis net ; au coucher du soleil, elle monte manger dans la cime des trembles</td></tr><tr><td class="c-item"><strong>Tétras du Canada</strong> (<em>Canachites canadensis</em>)</td><td>Trois doigts devant ; le doigt arrière, petit, marque peu. Dans la neige molle, un sillon plutôt que des empreintes</td><td>Pas, en pessière et en sapinière</td><td>L’hiver, il passe le jour <strong>dans les épinettes à manger des aiguilles</strong> et la nuit sur la neige sous les branches basses, ou enfoui dedans : rameaux dénudés, crottes sèches en forme de gros vers sous l’arbre. Il se laisse approcher (<span class="ref">ch. 49</span>)</td></tr><tr><td class="c-item"><strong>Lagopède des saules</strong> (<em>Lagopus lagopus</em>)</td><td><strong>3,5 à 4,5 cm</strong> de long ; l’hiver, les plumes des pieds font des <strong>raquettes</strong> qui brouillent tout : une empreinte ronde et floue, sans doigts nets</td><td>En bande dès septembre, dans les saulaies des bords d’eau et en terrain ouvert</td><td>Saules aux bourgeons cueillis. Il s’enfouit dans la neige par mauvais temps. Le pied emplumé réduit de plus de 60 % la pression de son pas</td></tr><tr><td class="c-item"><strong>Outarde</strong> (bernache du Canada, <em>Branta canadensis</em>)</td><td>Trois doigts palmés vers l’avant : <strong>10 à 12 cm</strong> de long sur <strong>9,5 à 12,5 cm</strong></td><td>Pas, sur les battures, les grèves et les champs</td><td>—</td></tr><tr><td class="c-item"><strong>Canards</strong> (canard noir, <em>Anas rubripes</em>, et colvert)</td><td>Palmés, trois doigts, la palmure d’ordinaire visible ; plus petits que ceux de l’outarde (10 à 12 cm)</td><td>Pas dans la vase des bords d’eau</td><td>—</td></tr></tbody></table>
<h3 class="sub">5-G. Les signes sur les arbres</h3>
<p class="p0">Un arbre garde une trace des mois et des années. Le bois frais, jaune ou blanc, <strong>suinte de la sève</strong> ; exposé à l’air, il fonce et la sève durcit. Une écorchure fonce avec le temps.</p>
<table class="tspan"><colgroup><col style="width:39.6%"><col style="width:12.4%"><col style="width:48.0%"></colgroup><thead><tr><th>Ce qu’on voit</th><th>Qui</th><th>À quoi on le reconnaît</th></tr></thead><tbody><tr><td class="c-item">Rameau terminé par un <strong>bout effiloché</strong></td><td>Orignal</td><td>Pas d’incisives en haut : il arrache. Jusqu’à 1,8 ou 2,4 m du sol, plus haut qu’un homme</td></tr><tr><td class="c-item">Rameau <strong>coupé net en biais</strong></td><td>Lièvre</td><td>À la hauteur de la neige du moment plus la longueur d’un lièvre dressé ; marques de 2,3 mm</td></tr><tr><td class="c-item">Écorce raclée <strong>de bas en haut</strong>, bord inférieur net, sur tremble ou peuplier</td><td>Orignal, fin d’hiver</td><td>Sillons des dents du bas ; tronc cicatrisé de noir les années suivantes. Des marques plus hautes que la bête : elle marchait sur une neige épaisse et tassée</td></tr><tr><td class="c-item"><strong>Longs sillons verticaux</strong> dans le bois, lanières d’écorce au pied</td><td>Ours noir, au printemps</td><td>Les incisives raclent le bois à la verticale ; les rongeurs, eux, rongent en travers</td></tr><tr><td class="c-item"><strong>Griffades</strong> noires sur un tremble ou un peuplier</td><td>Ours noir</td><td>Visibles des années. Morsures, poils collés dans la sève et écorce polie en plus : <strong>arbre de marquage</strong>, près d’un sentier, marques à hauteur des yeux</td></tr><tr><td class="c-item">Plaques d’écorce enlevées <strong>haut dans l’arbre</strong>, rameaux coupés sur la neige</td><td>Porc-épic</td><td>Marques de dents de 3,6 mm, en travers ou en biais ; crottes oblongues au pied</td></tr><tr><td class="c-item"><strong>Souche en crayon</strong>, gros copeaux</td><td>Castor</td><td>Marques de dents de 6 mm ; un chemin vers l’eau</td></tr><tr><td class="c-item">Petits lambeaux d’écorce d’environ 1,3 cm sur 5 à 7,5 cm, pousses pelées au sol</td><td>Écureuil roux</td><td>Rongement fin ; écailles de cônes autour</td></tr><tr><td class="c-item">Écorce effilochée et branches cassées à hauteur de panache, à l’automne</td><td>Orignal mâle</td><td><strong>Frottis</strong> du rut, souvent sur un jeune arbre lisse</td></tr><tr><td class="c-item">Bourgeons cueillis net, crottes groupées sur une souche, un billot, une roche</td><td>Gélinotte, tétras</td><td>Aucune marque de dent</td></tr><tr><td class="c-item">Trous d’une vingtaine de centimètres de large et jusqu’à 35 cm de profond, copeaux au pied</td><td>Grand pic</td><td>Il va chercher les fourmis charpentières dans le cœur du bois</td></tr><tr><td class="c-item">Rangées parallèles de petits trous d’environ 6 mm</td><td>Pic maculé</td><td>Il boit la sève ; les trous neufs se font au-dessus des vieux</td></tr></tbody></table>
<h3 class="sub">5-H. Les confusions</h3>
<table class="tspan"><colgroup><col style="width:7.3%"><col style="width:11.6%"><col style="width:81.1%"></colgroup><thead><tr><th>On croit voir</th><th>C’est peut-être</th><th>Ce qui tranche</th></tr></thead><tbody><tr><td class="c-item"><strong>Lynx</strong></td><td><strong>Loup</strong></td><td>Le lynx est rond, sans griffes, flou, avec un doigt central en avance ; le loup est ovale, griffu, net, avec un X. Le lynx marche en pose directe et creuse un sillon de poil ; le loup trotte, foulée d’un mètre et demi. Et la profondeur : un lynx pèse une dizaine de kilos, un loup de 23 à 50 kg ; à neige égale, le loup enfonce bien plus</td></tr><tr><td class="c-item"><strong>Lynx</strong></td><td>Renard ou coyote dans une neige fondue</td><td>L’empreinte agrandie par le soleil a perdu ses griffes et ses doigts. Suivre jusqu’à l’ombre des épinettes ou à une neige plus froide, et mesurer là. La foulée ne ment pas autant que l’empreinte</td></tr><tr><td class="c-item"><strong>Loup</strong></td><td><strong>Chien</strong></td><td>Des empreintes humaines à côté : chien. L’empreinte du chien est plus ronde, celle du loup plus longue et étroite ; à taille égale, la foulée du loup, aux longues pattes, est nettement plus longue. La crotte du chien est <strong>pleine de moulée</strong>, sans poil ni frange</td></tr><tr><td class="c-item"><strong>Coyote</strong></td><td><strong>Renard</strong></td><td>Le renard a un X franc et un pied poilu aux doigts flous, et <strong>son urine sent la moufette</strong> ; le coyote a un H, des coussinets nets, une taille au-dessus. Dans la poudreuse, une femelle coyote et un gros renard mâle ont presque la même foulée : suivre jusqu’à un chemin tassé</td></tr><tr><td class="c-item"><strong>Martre</strong></td><td>Renard au trot de biais</td><td>Les deux font des paires d’empreintes de même taille. La martre a cinq doigts et une piste erratique ; le renard, quatre doigts et une ligne droite</td></tr><tr><td class="c-item"><strong>Martre</strong></td><td>Pékan, vison</td><td>Le pékan est plus gros, marche, suit les billots, traîne les pieds. Le vison est plus petit et ne quitte pas l’eau</td></tr><tr><td class="c-item"><strong>Lièvre</strong></td><td><strong>Écureuil roux</strong></td><td>La taille : le pied arrière du lièvre fait <strong>8 à 15 cm</strong>, celui de l’écureuil <strong>2 à 5,5 cm</strong>. Le lièvre suit ses sentiers vers le couvert ; l’écureuil va d’un arbre à un autre et disparaît dans le tronc. Et le dessin du groupe : l’écureuil pose ses deux petits pieds avant <strong>côte à côte</strong>, sur la même ligne que les grands ; le lièvre les pose <strong>l’un derrière l’autre</strong>, décalés, derrière les deux grands côte à côte</td></tr><tr><td class="c-item"><strong>Orignal</strong></td><td>Caribou</td><td>Le sabot d’orignal est un cœur long et pointu ; celui du caribou, un rond plus large que long, aux deux moitiés écartées en croissant. Le caribou se cherche aux bords des tourbières et près des blocs erratiques</td></tr><tr><td class="c-item"><strong>Ours</strong></td><td>Homme pieds nus</td><td>Le petit doigt de l’ours est à l’intérieur ; des marques de griffes au bout des doigts</td></tr><tr><td class="c-item"><strong>Loutre</strong></td><td>Castor</td><td>La loutre glisse, fait des latrines d’écailles et coupe entre deux plans d’eau ; le castor traîne une queue plate et coupe des arbres</td></tr><tr><td class="c-item"><strong>Gélinotte</strong></td><td>Lièvre au gîte</td><td>Le trou de neige de la gélinotte porte des marques d’ailes et des crottes courbes à bout blanc au fond ; le lièvre ne s’enfouit pas, il se ramasse sous des branches basses, et ses crottes sont rondes</td></tr></tbody></table>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:16.4%"><col style="width:19.4%"><col style="width:25.9%"><col style="width:38.4%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Avant de mesurer</td><td>Nombre d’empreintes lisibles</td><td><strong>3 avant et 3 arrière</strong></td><td>Suivre la piste jusqu’à une neige plus ferme, sous les conifères</td></tr><tr><td class="c-item">Avant de mesurer</td><td>Surface</td><td>Neige froide, à l’ombre ; pas de creux en entonnoir autour des troncs</td><td>Au soleil : l’empreinte a grossi. Entonnoirs : elle a rapetissé. Mesurer de centre à centre</td></tr><tr><td class="c-item">À la mesure de la foulée</td><td>Espacement</td><td><strong>Égal sur plusieurs foulées</strong>, terrain plat, piste droite</td><td>Espacement qui varie : c’est un galop ou un bond ; chercher plus loin un bout au pas</td></tr><tr><td class="c-item">À la mesure de la foulée</td><td>Allure : pas ou trot</td><td>Foulée dans la fourchette que la fiche donne pour l’allure au pas</td><td>Trop longue pour une bête au pas : c’est un trot, et la bête est plus petite qu’on croit</td></tr><tr><td class="c-item">Âge, neige</td><td>Miettes au bord</td><td>S’envolent au souffle : <strong>moins de 20 minutes à une heure</strong></td><td>Soudées : plus vieux ; lire la météo depuis la dernière neige</td></tr><tr><td class="c-item">Âge, boue</td><td>Bords et eau</td><td>Bords humides et nets ; eau trouble</td><td>Bords secs et croûtés, eau claire : <strong>une heure au moins</strong></td></tr><tr><td class="c-item">Sens de la marche</td><td>Miettes, forme du trou, fond</td><td>Les trois indices d’accord</td><td>Deux contre un : suivre dix mètres et relire</td></tr><tr><td class="c-item">Avant de ramasser une crotte</td><td>L’outil</td><td>Un bâtonnet</td><td>Ne pas toucher (<span class="ref">§8</span>)</td></tr><tr><td class="c-item">Sur une piste, avant d’aller plus loin</td><td>Bosse fraîche de terre, d’herbe et de branches ; odeur de bête morte ; corbeaux ou geais réunis</td><td><strong>Aucun des trois</strong></td><td><strong>Un seul des trois suffit</strong> : on ne s’approche pas, on repart par où on est venu (<span class="ref">§8</span>, bloc 1)</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:35.6%"><col style="width:26.5%"><col style="width:37.9%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Une « piste de loup » de 15 cm, sans griffes, sur un versant au soleil</td><td>Empreinte fondue ; souvent un renard, un coyote ou un lynx</td><td>Mesurer à l’ombre ou tôt le matin ; lire la foulée</td></tr><tr><td class="c-item">Piste de « lynx » avec des griffes au bout des doigts</td><td>Canidé</td><td>Chercher entre les doigts et le coussinet le X du renard ou du loup, ou le H du coyote</td></tr><tr><td class="c-item">« Loup » qui zigzague, avec des empreintes de bottes à côté</td><td>Chien</td><td>Laisser tomber</td></tr><tr><td class="c-item">Pistes du lièvre lues « vers l’arrière »</td><td>Les grandes empreintes sont les pieds arrière, posés devant</td><td>Le sens de la marche va vers les grandes empreintes</td></tr><tr><td class="c-item">Piste qui a l’air d’être de la nuit, par un grand froid calme</td><td>La neige ne change plus : l’âge ne se lit pas</td><td>Se fier aux miettes (souffle) et à la dernière neige, pas au bord de l’empreinte</td></tr><tr><td class="c-item">Aucune piste après un redoux et un gel</td><td>La croûte porte les bêtes</td><td>Attendre la prochaine neige avant de conclure que le secteur est vide</td></tr><tr><td class="c-item">Crottes de loutre vieilles, aucune fraîche</td><td>Elle revient aux une ou deux semaines</td><td>Ne pas rayer le secteur</td></tr><tr><td class="c-item">Crotte de canidé pleine de grains</td><td>Chien</td><td>—</td></tr><tr><td class="c-item">Brout coupé net à hauteur de hanche, en plein été</td><td>Lièvre de l’hiver précédent, qui mangeait dressé sur la neige</td><td>La hauteur du brout dit l’épaisseur de la neige de cet hiver-là, pas la présence d’un lièvre aujourd’hui</td></tr><tr><td class="c-item">Deux espèces encore possibles après la fiche</td><td>Empreinte trop floue</td><td>Suivre jusqu’à une empreinte nette. Ne pas trancher au hasard</td></tr></tbody></table>

<p class="pt"><span class="pn">1</span><strong class="plead">1 — Une bosse fraîche de terre, d’herbe et de branches. Ou une odeur de bête morte. Ou des corbeaux et des geais réunis. Un seul des trois suffit : une carcasse, et un ours qui la garde tout près.</strong> Une bosse fraîche sans odeur et sans un oiseau ne rassure sur rien. Le réflexe du pisteur est d’aller voir ce qui attire les oiseaux. C’est l’inverse qu’il faut faire. L’ours couvre les grosses carcasses et les garde ; même absent de la carcasse, il reste dans les environs, sans qu’on le voie. Un ours surpris sur sa nourriture souffle, claque des dents, couche les oreilles et charge. On ne s’approche pas, on ne reste pas pour regarder : on repart tout de suite par où on est venu, sans courir. Ce qui vaut pour la carcasse d’une bête vaut pour la viande qu’on a laissée soi-même dans le bois : si un ours l’a prise, on ne la lui dispute pas. Et la taille du tas n’autorise rien : un petit monticule ne se lit pas comme la cache d’un lynx qu’on pourrait aller voir.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">S’il vient quand même, on ne court pas</strong>  : la course lance la poursuite, et l’ours court, grimpe et nage mieux qu’un homme. On s’arrête, face à lui, et on lui parle d’une voix calme ; la charge d’un ours qui défend sa nourriture s’arrête souvent avant le contact, et on recommence alors à s’éloigner. <strong>S’il touche, on se défend</strong> avec tout ce qui tombe sous la main — roche, bâton, hache —, en frappant la face et le museau, en criant. <strong>On ne fait pas le mort devant un ours noir.</strong> La mise en boule du bloc 2 vaut pour l’orignal, jamais pour l’ours. Et l’ours qui fait le plus peur n’est pas le plus dangereux : celui qui souffle et claque des dents défend ; celui qui s’avance calmement, sans un bruit, les yeux fixés sur soi, chasse, et c’est lui qu’on affronte le plus tôt et le plus fort. <strong>2 — En Alaska, où les deux abondent, l’orignal blesse chaque année plus de monde que l’ours.</strong> On le croit placide parce qu’il fuit presque toujours. Trois situations où il ne fuit pas : <strong>la femelle avec un petit veau</strong>, de la fin du printemps à l’été — deux pistes fraîches ensemble, une grande et une minuscule, et on ne suit plus ; <strong>le mâle au rut</strong>, de la fin de septembre à octobre ; et <strong>l’orignal de fin d’hiver</strong>, affamé et épuisé par la neige profonde, couché sur le sentier tassé qu’il ne veut plus quitter. <strong>Un veau seul</strong> veut dire qu’on s’est peut-être placé entre lui et sa mère. L’orignal prévient : <strong>poils de la bosse hérissés, oreilles couchées</strong>, il se lèche le museau — si on voit ça, on est beaucoup trop près. Il déteste les chiens et se détourne pour en frapper un, même tenu en laisse. Contrairement à l’ours, <strong>on court</strong> : il ne poursuit pas loin, et on tourne autour d’un arbre plus vite que lui. L’hiver, en raquettes dans la neige profonde, la course ne va pas loin : ce qui compte, c’est <strong>l’arbre ou l’obstacle solide</strong> qu’on met entre lui et soi, et c’est vers lui qu’on va. Renversé, on se met en boule, la tête dans les bras, et on ne bouge plus tant qu’il n’est pas loin — devant l’orignal seulement, jamais devant l’ours (bloc 1). <strong>3 — Une crotte de renard, de coyote ou de loup ne se touche pas, même gelée dure comme une roche.</strong> Les canidés sauvages portent le ver adulte de l’échinococcose ; ses œufs sortent avec les crottes et restent dessus et autour. <strong>Le froid ne les tue pas</strong> : ils survivent jusqu’à huit mois dehors l’automne et l’hiver, et le congélateur ne les tue pas non plus. Ils ne se prennent que par la bouche : avec les doigts qui ont émietté une crotte pour voir ce qu’elle contenait, puis qui ont tenu un morceau de pain. En théorie, un seul œuf suffit. La maladie est très rare, mais sa forme la plus grave ronge le foie comme un cancer lent et ne se déclare que cinq à quinze ans plus tard. <strong>Une crotte s’ouvre au bâtonnet</strong>, ne se renifle pas de près, et on se lave les mains au savon avant de manger. Le reste — le renard qu’on dépouille, le chien du chalet — est au chapitre 55. <strong>4 — Un lièvre trouvé mort sur une piste, sans collet et sans blessure, ne se touche pas, gants ou pas.</strong> Pas plus que celui qui se laisse approcher, faible, en bon état de chair : c’est le tableau de la tularémie. La bactérie passe à l’humain par la peau, les yeux, l’air qu’on respire près de la bête et la viande mal cuite ; contre l’air, le gant ne fait rien. On n’y touche pas, on ne le rapporte pas, et le chien n’y va pas (<span class="ref">ch. 48</span>, étape 7). Tout autre lièvre — pris au collet, tiré — se ramasse avec des gants (<span class="ref">ch. 48</span>). <strong>5 — La piste d’une bête sur la glace ne dit rien de la glace, même celle d’une bête plus lourde que soi.</strong> Un lynx pèse une dizaine de kilos, un loup de 23 à 50 : ni l’un ni l’autre ne pèse un homme habillé pour l’hiver. La piste d’un orignal ou d’un caribou ne prouve pas davantage : elle dit seulement que la glace a tenu <strong>à cet endroit-là, le jour où la bête est passée</strong>. Juste à côté, au-dessus d’un courant, d’une source ou d’une hutte, elle ne porte pas, et un redoux a pu passer depuis (<span class="ref">ch. 42</span>, bloc 1). Et les pistes se concentrent justement là où la glace est la plus mince : la loutre passe par les décharges, qui restent souvent ouvertes tout l’hiver, et par les entrées et les barrages des étangs de castor ; le vison ne quitte pas les cours d’eau ; les relais du rat musqué sont des trous qu’il garde ouverts dans la glace, jusqu’à 90 m de sa hutte (5-F). <strong>Une piste qui mène à un lac, un ruisseau ou une rivière se suit par la rive.</strong> Un ruisseau et une rivière, c’est du courant d’un bout à l’autre : ce que le chapitre 42 dit de la décharge vaut pour toute leur longueur. La glace se sonde comme au chapitre 42 (étape 9), piste ou pas piste. <strong>6 — En saison de chasse, on piste en orange, enfants compris.</strong> Celui qui lit des traces ne se voit pas comme un chasseur, et c’est pour ça qu’il sort en brun. Mais il suit à genoux, dans la repousse et les aulnes, les mêmes pistes fraîches d’orignal que d’autres suivent l’arme à la main, et une silhouette brune qui bouge dans les aulnes ressemble à ce que l’autre cherche (<span class="ref">ch. 42</span>, bloc 4). <strong>7 — Un renard qui s’approche, un loup qui titube, une bête qui bave ou n’a pas peur : on la traite comme enragée.</strong> La lecture naturelle est celle d’une bête apprivoisée, et c’est la mauvaise. On n’y touche pas, et une morsure ou une griffure se traite tout de suite, sans attendre un symptôme : la fenêtre de traitement de la rage se ferme avant le premier (<span class="ref">ch. 55</span>, <span class="ref">§7</span> et <span class="ref">§8</span>, bloc 2).</p>
