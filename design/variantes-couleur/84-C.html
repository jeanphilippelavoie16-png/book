<p class="p0">C’est le moment de la bascule du <span class="ref">ch. 2</span>. La maison est vidangée et fermée derrière (<span class="ref">ch. 2</span>, étape 9 ; <span class="ref">ch. 3</span>), la route a pris plus de temps que prévu, la fin du trajet s’est faite en motoneige, la clarté baisse, il fait −30 °C, deux enfants de 4 et 6 ans ont froid et faim. Le chalet est à la température du dehors depuis des semaines. Personne ne viendra. Ce qui suit est l’ordre des premières heures, et il n’est pas celui du printemps : <strong>l’air avant le feu, le conduit avant le feu, le feu avant l’eau, et l’eau pas le premier jour.</strong></p>
<h3 class="sub">Ce qui se fait avant de quitter la maison</h3>
<p class="p0">Quatre gestes, et ils décident de la première nuit plus que tout ce qu’on fera là-bas.</p>
<p class="li"><strong>Un avertisseur de CO se décroche et part dans la cabine</strong>, dans une poche de manteau, pas dans la boîte du camion ni dans le traîneau. C’est le seul qui n’aura jamais gelé.</p>
<p class="li"><strong>Les sacs de couchage et un matelas de sol par personne voyagent au sec et au chaud</strong>, dans la cabine ou en dessous des enfants. Ceux du chalet sont des blocs de froid, et peut-être des nids.</p>
<p class="li"><strong>Un thermos d’eau chaude par personne.</strong> C’est l’eau du premier soir, en attendant la neige fondue, et c’est aussi la première bouillotte (<span class="ref">ch. 25</span>, <span class="ref">§9</span>).</p>
<p class="li"><strong>Le briquet dans une poche intérieure</strong>, contre le corps. Un briquet au butane gelé ne donne pas de flamme ; réchauffé dans la main, il en redonne une.</p>
<h3 class="sub">La première demi-heure, à la porte</h3>
<p class="p0">Deux adultes, deux rôles. Le premier ouvre le chalet. Le second garde les enfants et surveille le conduit de l’extérieur.</p>
<p class="p0 ri"><strong class="runin">Les enfants attendent au chaud, pas dedans.</strong> Un chalet fermé depuis décembre n’est pas un abri en arrivant : il est aussi froid que dehors, plus noir, et plein de ce qu’on n’a pas encore regardé. Si le véhicule s’est rendu à la porte, ils attendent dedans, avec l’avertisseur de voyage : c’est le seul endroit chaud, donc le seul où il est dans sa plage. La neige qui bouche le tuyau d’échappement renvoie le monoxyde dans l’habitacle par le plancher, et un enfant qui s’endort après la route, c’est justement ce qu’on s’attend à voir. Donc : tuyau dégagé à la pelle avant <strong>chaque</strong> redémarrage, pas seulement le premier (<span class="ref">ch. 2</span>, <span class="ref">§9</span> ; <span class="ref">ch. 15</span>, étape 31) ; l’arrière du véhicule tourné loin des portes et des fenêtres qu’on vient d’ouvrir au chalet ; fenêtre entrouverte du côté opposé au vent ; moteur une dizaine de minutes par période de 30 minutes. Si la fin du trajet s’est faite en motoneige, ils restent dans leur sac, dans le toboggan, à l’abri du vent du côté sous le vent du chalet ou dans la galerie fermée, habits de neige sur le dos, avec l’adulte qui surveille le toit. Ils bougent les orteils sur commande et on leur fait attacher une botte plutôt que de leur demander s’ils ont froid (<span class="ref">ch. 2</span>, <span class="ref">§9</span> ; <span class="ref">ch. 39</span>). Si le travail sur le conduit s’étire — une perche à fabriquer de nuit, un bonnet de glace qui résiste —, un feu long s’allume dehors, à l’écart du toit, et les enfants s’installent à côté avant que le froid les prenne (<span class="ref">ch. 82</span>, <span class="ref">§9</span>).</p>
<p class="p0 lab kh"><strong class="runin">Entrer.</strong></p>
<p class="li">La porte est souvent sous un banc de neige tassé par le vent, qui ne se pellette pas comme de la neige folle : il se découpe en blocs, au bout de la pelle ou à la raquette posée sur le côté.</p>
<p class="li">Le cadenas gelé ne se force pas. Deux façons, l’une <strong>ou</strong> l’autre. La clé se chauffe au briquet, s’enfonce, se retire, se chauffe encore, et le métal dégèle le cylindre de l’intérieur. Ou du gel hydroalcoolique, du lave-glace ou de l’alcool à brûler versé dans le cylindre fait fondre la glace et l’empêche de reprendre. Jamais le briquet après l’alcool : la flamme prend sur le cadenas et les mitaines imbibés, et le méthanol du lave-glace ou de l’alcool à brûler brûle d’une flamme à peine visible en plein jour. Jamais d’eau chaude : elle fond la glace et regèle aussitôt, en pire.</p>
<p class="li">La porte gelée dans son cadre ne se tire pas par la poignée, qui cède avant la glace. On frappe le cadre du plat de la main ou du manche de la hache sur toute sa hauteur, du côté des pentures d’abord.</p>
<p class="li"><strong>Flairer au ras du plancher</strong> en ouvrant. Les bouteilles ont été fermées en octobre, mais c’est le moment de le savoir. Une odeur de propane : personne n’entre (<span class="ref">ch. 87</span>, heure 0).</p>
<p class="p0 ri"><strong class="runin">Tout ouvrir tout de suite.</strong> Portes et fenêtres, pendant qu’on fait le reste dehors. Le temps d’aération du printemps — au moins 30 minutes — ne coûte aucune chaleur maintenant, parce qu’il n’y en a pas : le chalet est aussi froid dedans que dehors. Il coûtera cher une heure plus tard, une fois le feu allumé. C’est pour ça qu’il se fait <strong>avant</strong>, pendant qu’on regarde le conduit, et pas après.</p>
<h3 class="sub">Le conduit, avant tout</h3>
<p class="p0">C’est le seul point de la journée où une erreur tue toute la famille dans son sommeil. Il se traite en trois regards.</p>
<p class="p0 ri"><strong class="runin">D’en bas, dehors.</strong> Le chapeau : un bonnet de neige soufflée, une croûte de verglas, du givre blanc sur le grillage, un nid qui dépasse. La nuit, la lampe frontale en plein faisceau, et les jumelles s’il y en a. À l’arrivée, aucun feu n’a tourné depuis des semaines : ce qui ferme le grillage vient du dehors, neige soufflée, verglas, givre de brouillard. Après l’allumage, c’est autre chose : la fumée d’un feu de bois est pleine de vapeur d’eau, et cette vapeur se condense et gèle sur le métal le plus froid du chalet, qui est le grillage du chapeau à −30 °C. C’est pour ça que le regard d’en bas se refait le soir, avant de se coucher (plus bas).</p>
<p class="p0 ri"><strong class="runin">Dégager le chapeau sans monter sur le toit.</strong> Un toit de tôle à −30 °C, givré, dans le noir, sans personne pour appeler, est le mauvais endroit pour tomber. La perche se fabrique sur place, à la hache et au couteau : une épinette noire (<em>Picea mariana</em>) sèche, droite, ébranchée au ras ; au bout, un crochet de broche épaisse ou un long clou plié, ligaturé serré au fil de fer, ou simplement la fourche naturelle d’une branche coupée à une main du tronc. Sa longueur n’est pas la hauteur de l’avant-toit : c’est la distance entre les mains, debout au sol ou sur le banc de neige, et le chapeau, qui est souvent en retrait du bord et plus haut que lui. Elle se mesure une fois à l’automne, une perche en main, et la longueur s’écrit au crayon gras sur le mur du pignon, à côté de la perche rangée : si la perche a disparu, celle qu’on fabrique se coupe à cette longueur. On se tient au bout du versant, du côté du pignon, hors de la trajectoire du versant qui porte le conduit : une plaque qui part glisse droit vers le bas de la pente, pas sur le côté. Avant le premier feu, le toit froid garde mieux sa neige ; une fois le chalet chauffé, personne ne se met sous ce versant. On casse le bonnet de neige, on gratte le givre du grillage, on décroche ce qui est posé sur le chapeau ou coincé entre le capuchon et le grillage. Un nid <strong>dans</strong> le conduit est sous le grillage : il ne s’atteint pas d’en haut à la perche, il se sort par le bas (plus bas, et 5-B, étape 32). Sur un chalet d’un étage, ça se fait debout sur le banc de neige, qui ajoute sa hauteur. Pour un chalet plus haut, l’échelle fabriquée à l’automne (<span class="ref">ch. 82</span>, <span class="ref">§4</span>), jamais seul, l’autre adulte au pied, et les enfants dans le véhicule ou le toboggan, là où cet adulte les voit, loin du bord du toit.</p>
<p class="p0 ri"><strong class="runin">De l’intérieur.</strong> D’abord la clé du tuyau : ouverte. Puis porte du poêle ouverte, miroir posé au fond du foyer ou dans la buse, lampe frontale : sur un conduit droit, on doit voir un rond de ciel ou, la nuit, de noir plus pâle que le tuyau ; sous un chapeau à capuchon plein, une lumière sur le pourtour plutôt qu’un rond. Sur un tuyau de chalet, la première section se démonte : regarder au travers vaut tous les miroirs. Un conduit qui sort par le mur vers une cheminée extérieure, ou qui fait un coude, ne montre rien au miroir même quand il est dégagé : on regarde vers le haut par le bouchon de ramonage du té, au pied de la cheminée extérieure, et on démonte la section à chaque coude. Des brindilles, des plumes ou de la paille tombées dans le foyer ou dans le té disent le nid avant qu’on le voie.</p>
<p class="p0 ri"><strong class="runin">La torche, les deux adultes ensemble.</strong> Celui de dedans tient une torche de papier journal ou d’écorce de bouleau allumée haut dans le foyer, contre l’entrée du tuyau, le temps de chauffer le conduit, en la renouvelant au besoin. Celui de dehors regarde le chapeau. Un filet de fumée ou un tremblement d’air chaud en haut : le conduit est ouvert. De la fumée qui roule dans la pièce <strong>pendant</strong> les premières secondes, puis qui se met à monter : c’était le conduit froid, et c’est normal. De la fumée qui revient <strong>après</strong> que la torche a chauffé le conduit, ou rien au chapeau : obstruction. Pas de feu. Une cheminée extérieure, froide sur toute sa hauteur, peut refouler plus longtemps qu’un tuyau qui monte dans la pièce : une fenêtre du même étage ouverte du côté du vent, une deuxième torche, puis seulement la conclusion.</p>
<p class="p0 ri"><strong class="runin">Si le conduit ne se dégage pas.</strong> Il n’y a pas de variante. Un conduit bouché qu’on n’atteint pas veut dire aucun feu dans ce bâtiment ce soir, et aucun appareil à combustion à la place. Ce qui reste :</p>
<p class="li"><strong>Un autre bâtiment qui a son poêle et son conduit</strong> — hangar, camp de chasse, voisin (<span class="ref">ch. 16</span>). Son conduit est aussi froid et aussi fermé depuis l’automne que celui du chalet : il passe par les mêmes trois regards et la même torche avant tout feu. S’il ne peut pas être vérifié, même règle : pas de feu dans ce bâtiment non plus.</p>
<p class="li"><strong>Le véhicule.</strong> C’est l’abri où l’on s’endort, et c’est là que le monoxyde tue : la neige s’accumule sous le vent et rebouche le tuyau pendant la nuit, le gaz entre par le plancher, rien ne se sent, et personne ne se réveille. L’échappement se dégage avant <strong>chaque</strong> redémarrage (<span class="ref">ch. 2</span>, <span class="ref">§9</span> ; <span class="ref">ch. 15</span>, étapes 31 et 32), moteur une dizaine de minutes par période de 30 minutes, un adulte reste éveillé, et l’avertisseur de voyage passe dans l’habitacle : il y fait chaud, il y est dans sa plage.</p>
<p class="li"><strong>L’abri de neige et le feu long</strong> (<span class="ref">ch. 82</span>, <span class="ref">§9</span>).</p>
<p>C’est une nuit dure. C’est une nuit dont on se réveille.</p>
<h3 class="sub">Le premier feu</h3>
<p class="li">Le feu monté en octobre, allumé par le haut, clé du tuyau ouverte, air grand ouvert. Si rien ne s’allume, <span class="ref">ch. 13</span>.</p>
<p class="li">Porte entrouverte <strong>jusqu’à 15 minutes</strong>, un adulte devant tout ce temps, pour que le conduit chauffe et tire fort. Au-delà, le poêle monte à une chaleur qu’il n’est pas fait pour tenir.</p>
<p class="li">Des charges petites et vives, souvent, pas une grosse d’un coup. Un bâtiment glacé donne envie de bourrer le poêle ; un poêle bourré dans un conduit froid gazéifie son bois sans le brûler, et ce qu’il n’a pas brûlé se dépose dans le tuyau froid (<span class="ref">ch. 83</span>, <span class="ref">§3</span>).</p>
<p class="li"><strong>L’avertisseur de voyage reste sur un adulte</strong>, dans une poche de poitrine laissée ouverte, où il reste tiède et où l’air de la pièce l’atteint, tant que l’air à la hauteur où dormiront les enfants n’a pas passé 4,4 °C au thermomètre. Posé plus tôt, il refroidit avec la pièce et se retrouve dans l’état de celui du mur, pendant les heures où l’on pousse le poêle. Ensuite seulement, il se pose là où les enfants vont dormir, à 2 m ou plus du poêle, loin de la fenêtre qu’on laisse entrouverte pour l’air. Personne ne dort avant, pas même une sieste.</p>
<p class="li"><strong>L’avertisseur du mur</strong>, lui, se décroche et se réchauffe dans une poche intérieure ou dans la pièce qui tiédit, jamais près du poêle : au-dessus de <strong>37,8 °C</strong>, il sort aussi de sa plage. Une fois revenu au-dessus de 4,4 °C, pile neuve et bouton d’essai. S’il sonne au bouton, on sait que son circuit, sa sirène et sa pile marchent ; on ne sait pas ce que l’hiver a fait à sa cellule, que le bouton n’éprouve pas. La première nuit, il est le deuxième avertisseur, pas le premier.</p>
<p class="li">Une entrée d’air reste ouverte en permanence, même à −35 °C : un poêle tire son air de la pièce, et une pièce fermée finit par le lui refuser (<span class="ref">ch. 39</span>, <span class="ref">§9</span> ; <span class="ref">ch. 83</span>, <span class="ref">§3</span>).</p>
<p class="li">Les fenêtres ouvertes pour l’aération se referment dès que le feu tire, sauf celle-là.</p>
<h3 class="sub">Le feu d’abord, l’eau jamais la première journée</h3>
<p class="p0">La question se pose parce que tout le monde a soif et que le robinet est là. La réponse est simple : <strong>le feu d’abord, et la plomberie ne se touche pas.</strong></p>
<p class="p0 ri"><strong class="runin">Si la plomberie a été vidangée en octobre</strong>, il n’y a rien à sauver et rien à faire : robinets ouverts, pompe coupée, et on la laisse comme ça. L’eau du premier soir vient du thermos, puis de la neige ou de la glace fondue sur le poêle, dans un chaudron où l’on a laissé un fond d’eau pour que le fond ne roussisse pas, et elle passe par l’ébullition comme toute eau de surface (<span class="ref">ch. 10, 30</span>-E et 5-I). La glace de lac donne plus d’eau que la neige à volume égal. Le sac de neige suspendu à côté du poêle fond sans prendre de place sur la plaque (<span class="ref">ch. 3</span>, <span class="ref">§9</span>).</p>
<p class="p0 ri"><strong class="runin">Si elle ne l’a pas été</strong> — la fermeture a été bâclée, ou quelqu’un a remis l’eau en novembre —, le mal est fait, et il ne faut pas l’aggraver. La glace tient les fentes fermées ; c’est au dégel que tout se met à couler, souvent en même temps, souvent dans un mur. Donc, <strong>avant d’allumer</strong> : pompe coupée, robinet principal fermé s’il y en a un, tous les robinets et les drains ouverts pour que l’eau de fonte ait une sortie, des chaudrons sous les joints qu’on voit. Puis on laisse les tuyaux dégeler au rythme du bâtiment, sans les chauffer. Jamais de flamme sur un tuyau : dans un mur, elle allume la charpente derrière, et sur le cuivre elle défait les soudures en amont. Si un tuyau doit dégeler plus vite, c’est du robinet ouvert vers le bouchon de glace, jamais au milieu, avec des guenilles et de l’eau chaude (<span class="ref">ch. 3</span>, <span class="ref">§9</span>) : chauffé au milieu, l’eau fondue et la vapeur restent coincées entre deux glaces, et le tuyau fend. Les fentes se trouvent au dégel et se ferment à froid, à la chambre à air et aux colliers.</p>
<p class="p0 ri"><strong class="runin">L’eau courante revient-elle cet hiver ?</strong> Un système d’été — prise au lac, conduite en surface ou dans un vide sanitaire ouvert — ne revient pas avant le dégel. On vit à la chaudière et au trou dans la glace (<span class="ref">ch. 10, 30</span>-I ; la glace se lit au <span class="ref">ch. 58</span>), et c’est une corvée de chaque jour qui entre dans l’horaire (<span class="ref">ch. 36</span>). Un système d’hiver — puits, conduite enfouie sous le gel, vide sanitaire fermé — se remet en eau seulement quand la pièce où est chaque appareil a tenu 18 °C et que les tuyaux sont tièdes à la main sur toute la longueur qu’on peut toucher, <strong>y compris dans le vide sanitaire</strong>, qui est le dernier endroit du chalet à dégeler. Puis l’ordre de la section 5-B, étapes 36 à 40, pompe amorcée.</p>
<h3 class="sub">Une pièce, pas le chalet</h3>
<p class="li">On chauffe la pièce du poêle et on ferme les autres. Une couverture de laine clouée au cadre fait une porte là où il n’y en a pas.</p>
<p class="li">On ne cherche pas à rendre la pièce confortable le premier soir : on cherche à la rendre sûre et tiède. Le poêle aura réchauffé l’air bien avant les murs, le plancher et les meubles, et ceux-là continueront de boire la chaleur toute la nuit.</p>
<p class="li"><strong>L’humidité.</strong> Quatre personnes qui respirent et un chaudron qui bout mettent de l’eau dans l’air, et cette eau se dépose sur ce qui est froid : fenêtres, murs extérieurs, matelas, sacs de couchage. Les sacs restent roulés dans leur housse jusqu’au coucher ; le chaudron bout avec son couvercle ; le linge mouillé sèche près du poêle, pas contre un mur froid. Au redoux des jours suivants, le givre des murs fond et coule : c’est de l’eau de condensation, pas une fuite de toit.</p>
<p class="li"><strong>Le temps que met le chalet à se réchauffer ne se devine pas.</strong> Il se mesure une fois, une fin de semaine de février, du moment où on ouvre la porte au moment où la pièce du poêle est tiède, et il s’écrit au crayon gras sur le mur à côté du poêle, et sur la fiche de décision du <span class="ref">ch. 2</span> (<span class="ref">§4</span>), à côté de la durée du trajet. Le jour de la bascule, c’est ce chiffre qui dit, à la maison, s’il faut partir à midi ou à huit heures.</p>
<h3 class="sub">Dégeler sans faire éclater</h3>
<p class="p0">Tout ce qui est dans le chalet a gelé. Ce qui contenait de l’eau a pris du volume, et une partie casse au gel, une autre au dégel.</p>
<p class="li"><strong>Les bocaux et les bouteilles</strong> dégèlent lentement, dans la pièce, loin du poêle et jamais dessus : le verre glacé qu’on pose sur une plaque chaude éclate. Ce qui a fendu au gel se jette, avec tout ce que le verre cassé a touché. Un bocal de conserve maison qui a gelé se jette aussi, fendu ou non : son joint a travaillé, et un pot d’orignal gelé en janvier, dégelé en mars et ouvert en mai a pu passer des semaines descellé (<span class="ref">ch. 78</span>, <span class="ref">§6</span>).</p>
<p class="li"><strong>Une boîte de conserve ne se réchauffe jamais fermée</strong>, gelée ou pas : la vapeur n’a pas de sortie et la boîte éclate. Une boîte qui a gelé se juge à son serti une fois dégelée (<span class="ref">ch. 5</span>). Pour la boîte comme pour le bocal, le botulisme ne change ni l’odeur, ni le goût, ni l’apparence.</p>
<p class="li"><strong>La toilette</strong> : si la cuvette ou le réservoir ont gelé pleins, on ne tire pas la chasse, on regarde la porcelaine au dégel. En attendant, la chaudière de nuit et la bécosse (<span class="ref">ch. 31</span>).</p>
<p class="li"><strong>Les batteries</strong> : une batterie de banc ou de motoneige trouvée à plat a pu geler. Elle ne se charge pas et ne se survolte pas avant d’avoir dégelé, parce qu’une batterie gelée qu’on force peut exploser et projeter son acide au visage. Paroi bombée ou fendue : elle est finie, elle sort. Une batterie intacte dégèle dans la pièce, loin du poêle et de toute flamme, avant qu’on la branche. Un banc au lithium muni de son système de gestion ne s’abîme pas au froid, mais il ne prend aucune charge avant d’avoir passé +5 °C (<span class="ref">ch. 86</span>, <span class="ref">§3</span>).</p>
<p class="li"><strong>Les bouteilles de propane</strong> ne se réchauffent pas, ni au feu ni en dedans (<span class="ref">ch. 87</span>, étape 3) : réchauffée, la bouteille monte en pression, la soupape lâche du gaz, et ce gaz coule au plancher jusqu’au poêle allumé. À −30 °C, elles débitent mal de toute façon (<span class="ref">ch. 87</span>, <span class="ref">§3</span>) : on ne compte pas sur le propane le premier jour. Tout se fait au poêle.</p>
<h3 class="sub">Les souris, en janvier</h3>
<p class="p0">Les crottes de souris gelées sont sèches comme en mai, et le balai les met dans l’air de la même façon. L’aération est déjà faite, à la porte. Le reste change :</p>
<p class="li"><strong>La javel diluée gèle.</strong> Le lavage de l’étape 30 attend que la pièce soit au-dessus de zéro.</p>
<p class="li">En attendant, on ne balaie pas, on ne secoue pas un matelas, on ne vide pas un tiroir d’un coup. Le coin où dormiront les enfants se couvre d’une bâche propre sortie du véhicule, posée à plat sans être glissée, et on n’y marche que sur la bâche.</p>
<p class="li">Dès que la pièce dégèle, gants, masque, javel 1 pour 9, 10 minutes, ramassé mouillé, <strong>avant</strong> que les enfants se couchent, et les enfants à l’autre bout de la pièce ou dehors pendant ce temps.</p>
<p class="li">Sans javel : de l’eau savonneuse en abondance, et on ramasse quand tout est détrempé (<span class="ref">ch. 79</span>). Dans un repli qui dure des mois, rien ne reste pour de bon sous la bâche.</p>
<h3 class="sub">Où dorment les enfants la première nuit</h3>
<p class="li"><strong>Dans la pièce du poêle, avec les adultes.</strong> Pas dans la chambre fermée, qui ne sera pas chaude cette nuit. Pas dans la mezzanine, qui est la place la plus chaude du chalet et la pire ce soir-là : c’est la seule où l’on ne voit pas un enfant sans monter. Devant le monoxyde, c’est le plus petit corps qui tombe le premier (<span class="ref">ch. 39</span>), et il ne se plaint pas : il devient mou et silencieux. Il dort là où l’adulte de garde le voit sans se lever.</p>
<p class="li"><strong>Surélevés, jamais au plancher.</strong> Dans une pièce chauffée au poêle, l’air se range en couches, et le plancher d’un chalet qui dégèle est la dernière chose à se réchauffer. Un banc, la table, deux chaises dos à dos, des caisses : n’importe quoi qui les monte à hauteur de genou.</p>
<p class="li"><strong>Sur ce qui a voyagé avec eux.</strong> Leur matelas de sol et leur sac, secs et tièdes. Pas les matelas du chalet, qui sont des blocs de froid qu’un corps d’enfant mettrait la nuit à réchauffer, et peut-être des nids. À défaut de matelas de sol, des couvertures pliées, des manteaux, et en dernier recours du sapinage de sapin baumier (<em>Abies balsamea</em>) posé serré sous une bâche (<span class="ref">ch. 39</span>, <span class="ref">ch. 82</span>, <span class="ref">§9</span>).</p>
<p class="li"><strong>L’avertisseur de voyage à la tête des enfants</strong>, à 2 m ou plus du poêle, dès que l’air y a passé 4,4 °C (plus haut).</p>
<p class="li"><strong>Une bouillotte dans chaque sac</strong>, contre le tronc, sous deux épaisseurs de tissu : une bouteille d’eau chaude bien fermée, à une température qu’un adulte tient à pleine main sans lâcher, ou des pierres chauffées au poêle, prises au sec, jamais au bord du lac ni dans un ruisseau, parce qu’une pierre qui a de l’eau dedans éclate au feu. Un enfant engourdi qui dort ne sent pas la brûlure et ne s’écarte pas (<span class="ref">ch. 25</span>, <span class="ref">§9</span> ; <span class="ref">ch. 39</span>, <span class="ref">§9</span> ; <span class="ref">ch. 82</span>, <span class="ref">§9</span>).</p>
<h3 class="sub">La première nuit</h3>
<p class="li"><strong>Deux adultes, deux quarts.</strong> Celui qui veille reste assis dans la pièce du poêle (<span class="ref">ch. 82</span>, <span class="ref">§9</span>). Le conduit n’a encore rien prouvé : il a tiré à la torche et une soirée au feu, pas une nuit à −35 °C.</p>
<p class="li"><strong>Des petites charges vives, pas de charge étouffée.</strong> Le chalet sera froid au matin, et c’est le prix accepté (<span class="ref">ch. 83</span>, étape 22).</p>
<p class="li"><strong>Le tour du conduit.</strong> Avant de se coucher, et une fois au milieu de la nuit, celui qui veille sort avec la frontale et regarde le chapeau depuis le côté du pignon, jamais sous le versant qui porte le conduit : après des heures de chauffe, c’est le moment où la tôle est le plus prête à lâcher sa neige, et il est seul dehors. Le givre se referme sur un grillage froid pendant une nuit calme et très froide, sur un conduit qui a pourtant bien tiré en soirée. Dedans, le dos de la main sur le mur autour de la traversée du tuyau (<span class="ref">ch. 82</span>, <span class="ref">§9</span>).</p>
<p class="li"><strong>Un enfant qui devient mou, deux personnes qui ont mal à la tête en même temps</strong> : tout le monde dehors d’abord, les questions ensuite (<span class="ref">§8</span>).</p>
<h3 class="sub">Le lendemain</h3>
<p class="li"><strong>Le toit de tôle.</strong> La chaleur qui traverse le toit fait fondre la neige contre la tôle, et la surface lisse la laisse partir d’un coup, en plaque. Un chalet froid depuis des semaines garde sa neige ; le même chalet chauffé depuis une nuit peut la lâcher sur la porte. On repère la ligne du bord du toit, on pellette le chemin de la bécosse et du bois en dehors, et les enfants ne jouent pas sous l’avant-toit. On ne déneige pas un toit de tôle par le bas : la plaque part sur celui qui tire. Après toute glissade, le conduit se regarde d’en bas : une plaque qui part peut plier ou arracher le tuyau qui traverse le toit, et un tuyau ouvert sous la tôle rend ses gaz au chalet.</p>
<p class="li"><strong>La corde de bois</strong> se dégage. La neige se brosse sur chaque brassée avant d’entrer : elle fond sur le support et mouille la bûche du dessous.</p>
<p class="li"><strong>La génératrice</strong>, s’il y en a une, dehors et loin des ouvertures (<span class="ref">ch. 15</span>). Les batteries du banc, si elles sont gelées, dégèlent avant qu’on les charge.</p>
<p class="li"><strong>Faire savoir qu’on est là</strong> : ceux qu’on a prévenus au départ (<span class="ref">ch. 2</span>, étape 9, point 3), le voisin, le groupe de chasse (<span class="ref">ch. 14</span> ; <span class="ref">ch. 16</span>).</p>
<p class="li"><strong>Le reste du chalet</strong>, une pièce par jour, en ouvrant la porte de la pièce voisine quand celle du poêle tient sa chaleur. La décision de l’eau courante, selon le type de système (plus haut).</p>
<h3 class="sub">Ce qu’on perd, et ce qui ne se remplace pas</h3>
<p class="p0">On perd la plomberie jusqu’au dégel, si le système est d’été, et l’eau devient un travail de chaque jour. On perd l’avertisseur du mur pour la première nuit, et une partie de la confiance qu’on lui accorde pour l’hiver. On perd le regard sur le conduit si on arrive de nuit : la frontale voit un bonnet de neige, pas un grillage à moitié givré. On perd des heures de chaleur à réchauffer une masse qui ne rend rien le premier soir, et une nuit de sommeil pour deux adultes.</p>
<p>Ne se remplacent pas :</p>
<p class="step"><span class="sn">1</span><strong>Un conduit bouché qu’on n’atteint pas.</strong> Aucun montage ne rend sûr un feu dont les gaz ne sortent pas. La réponse est ailleurs que dans ce bâtiment.</p>
<p class="step"><span class="sn">2</span><strong>L’avertisseur de CO qui n’a pas gelé.</strong> Il n’existe pas de version maison. Sans lui, les cinq règles du <span class="ref">ch. 39</span> (<span class="ref">§9</span>) s’appliquent sans exception, et la première nuit se passe avec un adulte éveillé en permanence dans la pièce.</p>
<p class="step"><span class="sn">3</span><strong>La fermeture d’octobre.</strong> Tout ce qui rend les premières heures possibles — le feu monté, le bois rentré, le conduit brossé, la plomberie vide, les bouchons sur la pompe — se fait à l’automne ou ne se fait pas. Le jour de la bascule, on ne fait qu’en profiter.</p>
</template>
<template id="notes">
<p class="fn" data-fn="27-1"><span class="fnn">1</span>L’œil infecté par derrière : paupières enflées et rouges ; l’œil poussé vers l’avant, ce qui se voit le mieux en regardant le visage d’en haut, par-dessus le front ; l’œil qui fait mal quand il bouge et qui bouge moins bien que l’autre ; la vue qui baisse ; de la fièvre. Au début, une partie de ces signes peut manquer : la paupière qui enfle chez quelqu’un qui a mal à une dent du haut ou au sinus suffit à partir.</p>
<p class="fn" data-fn="27-2"><span class="fnn">2</span>Un son aigu et rauque à chaque entrée d’air : l’air forcé à travers une gorge que l’enflure rétrécit.</p>
<p class="fn" data-fn="45-1"><span class="fnn">1</span>Le renflement est un anneau où le canon a gonflé sous le choc de la balle contre l’obstacle. Il se voit parfois dehors, comme un anneau autour du canon. Sinon, l’âme bien propre, regardée par la chambre contre une lumière vive, y montre une ombre en anneau — une tache de graisse fait la même ombre, d’où l’âme propre — et les doigts passés doucement le long du canon le sentent comme une bosse. Deux balles restées dans l’âme : on présume le canon renflé. Un canon renflé ne s’arrange pas en tirant.</p>
<p class="fn" data-fn="47-1"><span class="fnn">1</span><strong>Le tambourinage de la gélinotte.</strong> Un bruit sourd qui pulse, comme un tambour qu’on bat au loin. Le mâle le fait en comprimant l’air sous ses ailes, le plus souvent debout sur un billot, parfois sur une racine ou une roche. On l’entend surtout au printemps, et parfois à l’automne.</p>
<p class="fn" data-fn="47-2"><span class="fnn">2</span><strong>La trace du lagopède.</strong> L’hiver, le dessous de ses pieds est couvert de plumes jusqu’au bout des doigts, au point de ressembler à une patte de lièvre, et seules ses longues griffes dépassent : l’empreinte est ronde et floue, sans doigts nets (<span class="ref">ch. 43</span>, <span class="ref">§5</span>-F). La gélinotte et le tétras n’ont pas le pied emplumé : l’hiver, la gélinotte porte seulement de petites franges en peigne le long des doigts, et ses doigts marquent.</p>
<p class="fn" data-fn="81-1"><span class="fnn">1</span>Les premiers jours, les repas grossissent et la faim revient au bout de chacun : le repas complet de viande ne la coupe pas, le ventre est tendu, et l’envie de gras ne lâche pas. On maigrit alors que les portions sont grosses. Viennent ensuite la nausée et la diarrhée, que seul le gras arrête. Plus de viande maigre aggrave ; le gras renverse. L’enfant y arrive avant l’adulte : la part de protéines qu’il supporte plafonne plus bas (24).</p>
<p class="fn" data-fn="81-2"><span class="fnn">2</span>Acides, donc à l’eau bouillante : petits fruits, confitures, gelées, marinades acidifiées. Peu acides, donc à l’autoclave : viande, poisson, bouillon, champignons de culture, haricots, betteraves, carottes, maïs, courges (73).</p>
<p class="fn" data-fn="81-3"><span class="fnn">3</span>Le 66 °Brix ne se voit pas et ne se goûte pas : il se lit au réfractomètre ou au densimètre à sirop. Sans instrument, on ne fait pas de sirop de garde : on fait du sucre, qui se juge à l’œil et à la dent, ou un sirop léger gardé gelé dehors et mangé dans la saison (60).</p>
<p class="fn" data-fn="81-4"><span class="fnn">4</span>Trouble laiteux, mousse qui ne retombe pas, odeur aigre, filaments dans la chaudière. Le froid qui concentre la sève concentre aussi ce qui a tourné (60).</p>
<p class="fn" data-fn="84-1"><span class="fnn">1</span>Le serti est le repli de métal du pourtour de la boîte, là où le couvercle est roulé sur le corps. Avec la ligne de métal qui ferme le corps sur toute sa hauteur, c’est un des deux joints de la boîte. Une bosse, une arête pliée ou de la rouille à cet endroit, et le joint ne tient plus.</p>
<p class="fn" data-fn="84-2"><span class="fnn">2</span>Les premiers signes sont ceux d’une grippe : frissons, fièvre, fatigue, maux de tête, étourdissements, douleurs musculaires, parfois toux, maux de ventre, nausées et vomissements. Rien dans la liste n’est propre au hantavirus : ce qui la distingue, c’est d’avoir ouvert le chalet ou touché des crottes de souris dans les semaines d’avant. La forme grave ajoute l’essoufflement, puis une détresse respiratoire sévère.</p>
</template>

function views(){

    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();

<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
