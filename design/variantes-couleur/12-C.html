<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>12 — La tente d’hiver et l’abri de neige — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}

<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Monter avant la noirceur un abri où une famille passe la nuit à −35 °C, la tente de toile chauffée au poêle quand on a la toile, la neige quand on n’a rien, le tenir des semaines s’il le faut, et ne pas y mourir du monoxyde que le chauffage fabrique.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h4 class="choix">C’est le bon choix quand :</h4>
<p class="li">Le chalet est perdu et partir coûterait plus cher que rester (<span class="ref">ch. 2</span>). La tente de toile est l’abri de repli que le chapitre 82 demande d’avoir. Pour une nuit ou deux, l’abri de neige la remplace.</p>
<p class="li">La sortie a duré plus que prévu et la noirceur arrive avant le chalet. L’abri se décide dès qu’on sait qu’on ne rentrera pas, pas quand la clarté baisse : le bois de la nuit, l’abri et le lit prennent tout ce qui reste de jour, et en décembre le soleil se couche vers 15 h 20. À la lampe frontale, personne ne le fait bien.</p>
<p class="li">Deux maisonnées doivent hiverner ensemble et le chalet n’en loge qu’une. Une seule longue tente à deux poêles (section 5G) demande moins de toile et moins de bois que deux tentes.</p>
<h4 class="choix">C’est un mauvais choix quand :</h4>
<p class="li"><strong>Le redoux ou la pluie arrive, et l’abri est en neige.</strong> Par temps doux, une voûte de neige occupée ramollit par le haut, dégoutte, puis tombe sur ceux qui dorment dessous. Par redoux, on dort sous la toile ou dans la tranchée bâchée, pas sous une voûte.</p>
<p class="li"><strong>Il fait trop froid pour casser des perches.</strong> L’épinette gelée dur casse net au lieu de plier, et la perche perd son appui au pied. On monte alors la charpente liée de la tente de prospecteur (5C), pas le shaputuan (5G).</p>
<p class="li"><strong>On compte chauffer un abri de neige.</strong> Il ne se chauffe pas, parce que sa paroi fond à 0 °C. Pour avoir une source de chaleur, il faut une toile et un poêle, ou un feu dehors.</p>
<p class="li"><strong>On n’a qu’une bâche de plastique, ou un tissu synthétique, et on veut y mettre un poêle à bois fermé.</strong> Le polyéthylène ne laisse pas passer l’air et fond au contact du tuyau, et le nylon comme le polyester fondent aussi. Une bâche accepte un feu ouvert devant elle (section 9), ou au centre d’un cône ouvert au sommet (5H). Un poêle dans un volume clos, non.</p>
<p class="li"><strong>La neige du sous-bois coule dans la main comme du sucre.</strong> Elle ne donne ni blocs ni caverne. On la brasse en butte (5I-1), ou on va chercher la neige que le vent a tassée.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0">Une toile de tente n’isole presque rien. Elle arrête le vent, et c’est tout : la chaleur vient du poêle et repart dès qu’il s’éteint. Une nuit sous la toile se joue donc par le dessous. Couché sur la neige, un corps perd sa chaleur par contact beaucoup plus vite que dans l’air (<span class="ref">ch. 25</span>). Et le vent qui passe sous le bas de la toile emporte la chaleur du poêle avant qu’elle serve. Trois gestes de ce chapitre ne coûtent rien et sont ceux qu’on bâcle : le plancher foulé, le sapinage épais, le pied de la toile renchaussé de neige.</p>
<p>La neige isole parce qu’elle est surtout de l’air emprisonné entre des cristaux. Elle porte parce qu’on la dérange. Piétinée, pelletée ou brassée, elle voit ses grains se briser et se rapprocher. La vapeur d’eau se dépose ensuite à leurs points de contact et y soude de petits ponts de glace. C’est le <strong>frittage</strong>, et il durcit en quelques heures une neige qu’on a remuée. Un plancher foulé devient une dalle, et une butte brassée devient une voûte qu’on peut creuser. Mais le frittage ralentit beaucoup par grand froid : l’attente qui suffit un jour doux ne suffit pas à −35 °C.</p>
<p>Là où le manteau est mince et longtemps exposé au grand froid, la neige a un défaut invisible en surface : elle pourrit par le fond. Ses grains du bas deviennent de gros cristaux à faces planes, sans cohésion, qui coulent comme du sucre, et ils restent souvent là toute la saison. Cette neige ne se taille pas en blocs, et une caverne y croule. La neige qui se taille est celle que le vent a cassée en fines particules puis comprimée : la <strong>plaque à vent</strong>. Elle se forme surtout sur les versants sous le vent.</p>
<p>Un abri de neige ne se chauffe pas au-dessus de zéro, parce que sa paroi fond à 0 °C. Quand l’intérieur chauffe trop, le plafond ramollit et dégoutte, et par temps doux il s’effondre. On ne chauffe donc pas une maison de neige. On la ferme, et la chaleur des corps suffit : l’intérieur ne passe pas 0 °C, mais c’est loin des −35 °C du dehors. L’air froid est plus lourd et tombe. C’est pourquoi l’entrée se fait plus basse que le banc où l’on couche : le froid reste dans le trou d’entrée au lieu de monter dans les sacs. Cette <strong>trappe à froid</strong> sert aussi sous la tente, où un lit de neige foulée à hauteur des genoux garde le froid en bas.</p>
<p class="p0 ri"><strong class="runin">Chaque abri fabrique le monoxyde de carbone à sa façon</strong>, et c’est ce qui tue dans ce chapitre. Le CO a presque exactement le poids de l’air. Il ne monte donc pas au plafond et ne descend pas au plancher : il se mélange à tout le volume. Il n’a ni odeur ni couleur et n’irrite rien. Au lieu de sortir, on s’endort.</p>
<p class="li"><strong>Dans la tente à poêle</strong>, le poêle raccordé à son tuyau ne suffit pas. Une tente chauffée tire comme une cheminée : l’air chaud monte, pousse vers le haut et fuit par le haut, et en bas la pression tombe sous celle du dehors. Plus le haut fuit et plus le bas est fermé, plus cet effet est fort, et une toile glacée, renchaussée de neige, est fermée en bas. Tant que le feu est vif, le tuyau, plus chaud que la tente, tire plus fort qu’elle. Quand le feu tombe en braise, le tuyau refroidit et son tirage faiblit : la tente peut alors l’emporter, faire descendre l’air par le tuyau et verser dans la tente la fumée et le CO du feu qui couve. C’est quand le feu est réduit à l’état de braise et que le tirage est faible que ce refoulement arrive le plus, et un gros feu couvant fuit de la fumée même porte fermée. Or la braise, qui brûle sans flamme, fait justement du CO. Au Québec, un abri de toile chauffé au bois a intoxiqué des campeurs par une nuit de froid intense : l’ouverture du toit, qui faisait l’entrée d’air frais, était à moitié fermée, et le CO est entré par le poêle. Par grand froid, les mouvements d’air peuvent même rabattre le CO vers le bas, là où l’on dort. Une ouverture en haut ne suffit donc pas : il faut une entrée d’air au ras du plancher. Une toile de coton respire, une bâche de polyéthylène ne respire pas. Le poêle bourré puis étouffé pour la nuit aggrave tout : un feu qui manque d’air couve, et un feu qui couve fait du CO.</p>
<p class="li"><strong>Dans le cône ouvert au sommet</strong>, la fumée sort parce que la flamme la chauffe et la pousse vers le haut. Quand le feu tombe en braise, le tirage faiblit au moment même où la braise, qui brûle sans flamme, fait du CO.</p>
<p class="li"><strong>Dans l’abri de neige</strong>, un réchaud, une lampe ou une chandelle n’ont pas de tuyau du tout : tout ce qu’ils brûlent reste dedans. En laboratoire, dans une boîte de carton partiellement aérée de 200 L, le volume d’un baril, tenue à −6 °C, un réchaud de camping a porté l’air à environ 400 ppm en moins de dix minutes, et l’y a maintenu. À 400 ppm, le mal de tête et la nausée arrivent en 1 à 3 heures. Dans de vraies cavernes de neige neuves, 15 à 21 minutes de réchaud ont donné en moyenne 14 à 67 ppm, avec un pic de 120 ppm à l’allumage, le pire moment. Un brûleur encrassé multipliait le CO jusqu’à dix fois, et cinq cavernes creusées selon le même plan donnaient des résultats très différents : ce qui s’est bien passé hier dans un abri ne prouve rien pour celui d’aujourd’hui. Sous une petite tente, deux heures de réchaud au kérosène ont bloqué en moyenne plus du cinquième de l’hémoglobine d’adultes en santé. Et le même réchaud a donné un pic moyen plus de deux fois plus haut dans une tente 4 saisons, faite pour couper le vent, que dans une tente 3 saisons. <strong>Même quand rien ne brûle, un abri bouché se vicie.</strong> L’haleine ajoute du gaz carbonique à l’air et lui prend de l’oxygène, et la neige n’en échange qu’une partie par ses pores : c’est ce qui rend vite irrespirable la poche d’air fermée d’un enseveli d’avalanche. Le trou d’aération sert donc toute la nuit, flamme ou pas.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Tente de toile de coton type prospecteur, avec jupe à neige et sortie de poêle</td><td>1, à la taille de la maisonnée</td><td>Toile de chaloupe, vieille toile, rideaux, peaux cousues, <strong>si c’est du coton ou de la peau</strong> (test du fil, section 9). Un tissu synthétique ou enduit se range avec la bâche : cône à feu ouvert (5H) ou appentis, jamais de poêle. Sans rien : la neige (5I)</td><td>Oui. La neige la remplace quelques nuits, pas un hiver</td></tr><tr><td class="c-item">Poêle de tôle pour tente</td><td>1 par tente, 1 par bout de shaputuan</td><td>La truie du <span class="ref">ch. 83</span> (section 9), en petit : bidon d’acier, petit baril, chaudière de tôle épaisse, avec une porte découpée, une sortie en haut à l’arrière et un lit de sable au fond</td><td>Oui</td></tr><tr><td class="c-item">Tuyau en sections emboîtables, un coude, une clé</td><td>De quoi sortir plus haut que le faîte</td><td>Tôle roulée sur une bille avec un joint agrafé (<span class="ref">ch. 82</span>, section 9)</td><td><strong>Non.</strong> Sans tuyau, pas de poêle sous une toile</td></tr><tr><td class="c-item">Collerette de traversée : plaque incombustible cousue dans la toile, percée au tuyau</td><td>1 par poêle</td><td>Couvercle de baril ou flanc de bidon aplati, percé et cousu à la toile au fil de fer (section 9)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Pare-étincelles au bout du tuyau, ouvertures d’au plus 1 cm</td><td>1 par tuyau</td><td>Treillis métallique ou tôle perforée roulé et serré au fil (<span class="ref">ch. 82</span>)</td><td><strong>Non.</strong> Chaque escarbille qui retombe perce le toit</td></tr><tr><td class="c-item">Avertisseur de CO à pile, <strong>à affichage numériq <p class="p0">Ce tableau ne liste que ce qu’utilisent les procédures du chapitre. Le reste, vêtements, piles et réserve de bois compris, est au chapitre 00b.</p>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A. Choisir la place, pour tous les abris</h3>
<p class="step"><span class="sn">1</span><strong>À l’abri du vent, près de l’eau et du bois mort debout.</strong> L’eau épargne la fonte de neige, qui coûte cher en bois (<span class="ref">ch. 10</span>). L’épinette morte debout se brûle le jour même où on la coupe (<span class="ref">ch. 83</span>, section 9).</p>
<p class="step"><span class="sn">2</span><strong>Pas de branche lourde de neige au-dessus de la tête.</strong> La chaleur la fait lâcher, et elle ensevelit ce qui est dessous et éteint le feu.</p>
<p class="step"><span class="sn">3</span><strong>Pas au fond d’un creux.</strong> Par nuit claire et calme, l’air froid coule vers le bas et s’y accumule.</p>
<p class="step"><span class="sn">4</span><strong>La porte sous le vent dominant, l’entrée d’air basse du côté du vent</strong> (5C, point 7). Ce sont deux côtés opposés, et on ne les confond pas.</p>
<p class="step"><span class="sn">5</span><strong>Assez de neige, et la bonne.</strong> La tente de prospecteur se monte sur n’importe quelle neige. Le shaputuan demande au moins un mètre de neige. Pour le quinzhee, n’importe quelle neige sert, qu’on monte en butte. La caverne se creuse dans une congère d’environ 3 m, et les blocs se taillent dans la plaque à vent. Pour faire le test, on enfonce la lame à fond. La plaque résiste de la même façon sur toute la profondeur et donne un bloc qui tient quand on le soulève. La neige de sucre, elle, coule.</p>
<h3 class="sub">B. Le plancher de neige foulée</h3>
<p class="step"><span class="sn">1</span><strong>Enlever les raquettes et fouler en bottes</strong>, à petits pas serrés, toute l’aire de la tente et un peu plus. La raquette répartit le poids et ne tasse que le dessus, alors que la botte tasse en profondeur. Un plancher foulé seulement en raquettes cède plus tard sous les pas des occupants, et la chaleur s’en va par les trous.</p>
<p class="step"><span class="sn">2</span><strong>Égaliser ensuite en raquettes</strong>, en passes croisées.</p>
<p class="step"><span class="sn">3</span><strong>Laisser prendre pendant qu’on coupe la charpente.</strong> Le frittage finit le travail. Par grand froid, il faut le laisser prendre plus longtemps.</p>
<p class="step"><span class="sn">4</span><strong>Si la neige manque</strong>, on la pellette dans l’aire et on la foule par couches.</p>
<p class="step"><span class="sn">5</span><strong>Le lit de neige, pour la trappe à froid.</strong> Sur à peu près la moitié du plancher, au fond de la tente, on monte de la neige foulée aux raquettes et tapée à la pelle, jusqu’à la hauteur des genoux. Le froid reste dans l’allée, entre le lit et le poêle. On peut aussi descendre le poêle dans un trou, plus bas que le lit. Une perche couchée au bord du lit l’empêche de s’égrener.</p>
<h3 class="sub">C. La tente de prospecteur : la charpente se coupe sur place</h3>
<p class="p0">Seuls la toile, le poêle et le tuyau voyagent, au toboggan (<span class="ref">ch. 89</span>). La charpente se coupe sur place.</p>
<p class="step"><span class="sn">1</span><strong>Trois perches horizontales.</strong> Le faîte au milieu, un peu plus long que la toile, et une traverse de chaque côté, plus bas, à la hauteur du haut des murs.</p>
<p class="step"><span class="sn">2</span><strong>Porter le faîte.</strong> À chaque bout, deux perches croisées en X et liées au croisement (brêlage, <span class="ref">ch. 110</span>) font un chevalet. On peut aussi suspendre le faîte à une corde tendue entre deux arbres. Les traverses reposent sur des piquets fourchus en Y plantés dans la neige foulée.</p>
<p class="step"><span class="sn">3</span><strong>Poser la toile</strong> sur le faîte et tirer les murs sur les traverses.</p>
<p class="step"><span class="sn">4</span><strong>Dans la neige, un piquet ne tient pas.</strong> Chaque cordon s’amarre à un bout de bois couché dans une petite fosse et recouvert de neige foulée. Ce corps mort gèle en place pendant la nuit et tient mieux qu’un piquet dans le sol.</p>
<p class="step"><span class="sn">5</span><strong>Coucher la jupe à neige</strong> à plat sur la neige, à l’extérieur.</p>
<p class="step"><span class="sn">6</span><strong>Renchausser.</strong> On pellette la neige contre le bas des murs, sur au moins un demi-mètre de haut, et on la tape à la pelle. Elle ferme le passage au vent sous la toile, et c’est l’isolant le moins cher de l’hiver.</p>
<p class="step"><span class="sn">7</span><strong>Sauf à un endroit : l’entrée d’air basse.</strong> On garde au ras du plancher de l’allée, dans le mur qui reçoit le vent, une ouverture qui ne se renchausse jamais. Du côté du vent, le vent y pousse l’air vers l’intérieur et relève la pression dans le bas de la tente. La porte, elle, est sous le vent : on n’y met pas l’entrée d’air. Une boîte de conserve ouverte aux deux bouts, glissée sous la jupe et dégagée dehors, fait l’affaire. C’est là que le poêle prend son air. Elle réduit la dépression qui fait refouler le tuyau quand le feu baisse (section 3), mais elle ne l’empêche pas : une entrée d’air ne suffit pas toujours, et le vent peut renverser le courant qui y passe. La vraie protection reste la règle de la nuit (5F, point 1). L’entrée se déneige après chaque bordée.</p>
<h3 class="sub">D. Le poêle sur pieux et la traversée du tuyau</h3>
<p class="step"><span class="sn">1</span><strong>La place du poêle :</strong> près de la porte, dans l’allée, avec le lit au fond. Le tuyau sort par le mur de devant avec un coude, ou par le toit.</p>
<p class="step"><span class="sn">2</span><strong>Quatre pieux verts de conifère</strong>, plantés à travers le plancher foulé, aussi profond que la pelle le permet, jusqu’au sol si on peut. Le poêle s’y pose, surélevé au-dessus du plancher. La neige fond sous le poêle, et les pieux le gardent d’aplomb pendant que le trou se creuse dessous. Sans eux, il s’enfonce et se couche, tuyau compris. Chaque matin, on regarde si la tête des pieux a charbonné.</p>
<p class="step"><span class="sn">3</span><strong>Un lit de sable, de cendre ou de petites pierres au fond du poêle</strong>, de l’épaisseur d’une main, si la tôle est mince (<span class="ref">ch. 83</span>, section 9).</p>
<p class="step"><span class="sn">4</span><strong>Pas de sapinage autour du poêle.</strong> On garde un rond de neige nue entre les pieux et devant la porte du poêle. Une braise qui tombe y fait fondre la neige au lieu d’allumer le lit.</p>
<p class="step"><span class="sn">5</span><strong>Le tuyau :</strong> des sections emboîtées serré, chaque joint arrêté d’une vis ou d’un tour de fil. Un joint qui bouge au vent s’ouvre et fuit dans la tente. La clé se place dans la première section.</p>
<p class="step"><span class="sn">6</span><strong>La traversée de la toile.</strong> Jamais de tuyau contre la toile. Il passe dans la collerette, une plaque incombustible cousue dans la toile et percée à peine plus grand que lui. La toile commence au bord de la plaque, et c’est la distance que la plaque met entre la toile et le tuyau qui la protège. Le test est celui de la main, des chapitres 83 et 82, fait au plus fort d’un feu vif : la main tient sur la toile au bord de la plaque. Si elle ne tient pas, la plaque est trop petite.</p>
<p class="step"><span class="sn">7</span><strong>Dehors, le tuyau monte plus haut que le faîte</strong>, coiffé du pare-étincelles. Une escarbille qui sort bas retombe encore rouge sur la toile, et plus elle tombe de haut, plus elle a le temps de s’éteindre. Trois haubans de fil de fer tiennent le tuyau contre le vent : un tuyau qui se déboîte dehors renvoie la fumée dans la tente par le joint ouvert.</p>
<p class="step"><span class="sn">8</span><strong>La première flambée se fait vive, air grand ouvert.</strong> Elle sèche la toile, raidit les cassures du shaputuan et montre les fuites. On cherche la fumée à chaque joint et au bord de la collerette.</p>
<h3 class="sub">E. Le sapinage posé en écailles</h3>
<p class="step"><span class="sn">1</span><strong>Le bois.</strong> Le sapin baumier (<em>Abies balsamea</em>) est le plus doux sous le corps. L’épinette noire (<em>Picea mariana</em>) est souvent la seule qu’il y a, et elle fait l’affaire. Les branches des perches ébranchées sur l’aire foulée font la première couche. On prend des branches courtes et souples, et on laisse les grosses tiges.</p>
<p class="step"><span class="sn">2</span><strong>Partir du fond et avancer vers la porte.</strong> Au premier rang, les branches sont couchées côte à côte. Le bout coupé est piqué dans la neige, vers le fond. La pointe va vers la porte, et la courbe naturelle de la branche vers le haut, comme un ressort.</p>
<p class="step"><span class="sn">3</span><strong>Chaque rang recouvre les bouts coupés du rang d’avant</strong>, comme les écailles d’un poisson ou les bardeaux d’un toit. Il ne reste en surface que des pointes souples, et aucun bout de tige ne touche le dos.</p>
<p class="step"><span class="sn">4</span><strong>Serrer comme un tapis</strong>, jusqu’à ce qu’un genou appuyé ne sente plus la neige.</p>
<p class="step"><span class="sn">5</span><strong>Dans une tente à deux portes</strong>, on part du milieu et on pose vers chaque porte.</p>
<p class="step"><span class="sn">6</span><strong>Rien autour du poêle</strong> (5D, point 4).</p>
<p class="step"><span class="sn">7</span><strong>Par-dessus :</strong> les peaux poil en haut, la bâche de sol, les matelas.</p>
<p class="step"><span class="sn">8</span><strong>L’entretien.</strong> Le sapinage s’écrase. On ajoute une couche fraîche par-dessus au lieu de tout changer : l’ancienne, tassée, fait l’isolant du dessous. Les aiguilles sèches tombées près du poêle se ramassent, car elles brûlent comme de l’amadou.</p>
<h3 class="sub">F. La nuit sous la toile</h3>
<p class="step"><span class="sn">1</span><strong>Décider avant de se coucher. Il n’y a que deux façons.</strong> Première façon : quelqu’un veille, assis près du poêle, et le nourrit pour garder une flamme claire, air <strong>et clé</strong> ouverts, à tour de rôle : la relève se compte en recharges (<span class="ref">ch. 18</span>). Deuxième façon : le feu est <strong>mort avant que le dernier adulte se couche</strong>, sans une braise rouge dans le poêle<sup class="fnr" data-fn="12-1">1</sup>. On y arrive en le laissant brûler, air et clé grands ouverts, en restant debout jusqu’au bout, ou en sortant la braise dans une chaudière de métal, dehors, sous le vent de la tente et loin de l’entrée d’air basse. On ne s’endort jamais pendant que le feu meurt. C’est l’heure du refoulement (section 3), et l’avertisseur ne la couvre pas : une toile ne garde pas la chaleur, et la tente passe sous 4,4 °C pendant que la braise couve encore (point 3). <strong>Jamais le poêle bourré puis étouffé pour la nuit pendant que tout le monde dort</strong>, ni la clé fermée pour garder la chaleur. Ce feu-là manque d’air, et le tuyau refoule une fois refroidi.</p>
<p class="step"><span class="sn">2</span><strong>Avant de se coucher, un tour dehors :</strong> l’entrée d’air basse est dégagée, et le pare-étincelles n’est bouché ni de givre, ni de suie, ni de neige. Une grille bouchée ferme le tuyau : la fumée n’a plus d’autre sortie que la tente.</p>
<p class="step"><span class="sn">3</span><strong>L’avertisseur de CO</strong> se pose à hauteur de tête des dormeurs, à plus de 2 m du poêle. On se fie à ce qu’il affiche, jamais à son silence (<span class="ref">ch. 87</span>) : il est fait pour ne pas sonner avant 4 minutes à 400 ppm, ni avant une heure à 70 ppm. Il n’est pas fait non plus pour une pièce à moins de 4,4 °C : sous ce seuil, sa pile faiblit et sa cellule peut perdre de sa sensibilité, et une tente où le poêle s’éteint y descend vite. Le jour, il se garde dans une poche intérieure. Au coucher, on le pose et on appuie sur le bouton d’essai. Le bouton prouve la pile, le circuit et la sirène, pas la cellule qui sent le CO. S’il a passé des heures au froid, on le réchauffe contre le corps avant de le poser. Mais la cellule de certains avertisseurs contient de l’eau : si elle a gelé, elle peut rester abîmée pour de bon, et le bouton d’essai ne le montrera pas. C’est pour ça qu’il vit dans la poche intérieure, jamais au fond d’un sac ou d’un traîneau.</p>
<p class="step"><span class="sn">4</span><strong>La place la plus chaude du lit est au milieu.</strong> Elle va aux plus frileux, donc aux enfants, entre deux adultes. Celui qui frissonne change de place.</p>
<p class="step"><span class="sn">5</span><strong>La neige sur le toit.</strong> Tant que le poêle chauffe, elle glisse sur la toile tiède. Une fois le poêle éteint, elle s’accumule, et une bordée mouillée écrase une tente. À chaque réveil, un coup de manche de pelle par en dedans la fait tomber.</p>
<p class="step"><span class="sn">6</span><strong>Le givre du matin.</strong> L’haleine de la nuit gèle sur la toile froide. Au premier feu, ce givre fond et tombe en pluie. On roule donc les sacs avant d’allumer.</p>
<h3 class="sub">G. Le shaputuan : la longue tente à deux portes</h3>
<p class="p0">Le shaputuan est la grande tente d’hiver des Innus. Elle est longue, a une porte à chaque bout et porte ses feux en ligne dans l’axe. Rien de rigide ne voyage : on casse la charpente sur place, et la neige fait le mur. Quand deux maisonnées hivernent ensemble, chacune a son bout et son poêle près de sa porte, avec une seule allée au milieu. Deux portes veulent aussi dire deux sorties : si le feu part à un poêle, on sort par l’autre bout.</p>
<p class="step"><span class="sn">1</span><strong>L’aire.</strong> On la choisit à l’abri du vent, près de l’eau, là où il y a au moins un mètre de neige, et on la foule (5B) en ellipse allongée.</p>
<p class="step"><span class="sn">2</span><strong>Les perches de côté.</strong> Ce sont des épinettes d’au moins 8 cm de diamètre, qui dépassent de beaucoup la hauteur des yeux. On les ébranche sur l’aire foulée, et leurs branches font la première couche de sapinage.</p>
<p class="step"><span class="sn">3</span><strong>Les planter</strong> tout autour de l’ellipse, penchées vers l’intérieur à 75 ou 80°, à un coude l’une de l’autre, soit 30 à 40 cm. Leur nombre suit la longueur voulue.</p>
<p class="step"><span class="sn">4</span><strong>La poutre de faîte</strong> est faite de deux épinettes liées ensemble. Elle repose sur trois épinettes fourchues en Y, plantées dans l’axe.</p>
<p class="step"><span class="sn">5</span><strong>Casser les perches.</strong> À la hauteur des yeux, on entaille chaque perche et on la casse vers la poutre, en gardant des fibres entre les deux parties. On lie chaque point de contact à la poutre et on coupe l’excédent. Les fibres gardées se raidissent à la chaleur de la tente dans leur nouvel angle.</p>
<p class="step"><span class="sn">6</span><strong>Pas par trop grand froid.</strong> L’épinette gelée dur casse net et perd son appui au pied. On attend le redoux, ou on monte la charpente liée (5C).</p>
<p class="step"><span class="sn">7</span><strong>Les bouts.</strong> On plante des épinettes à chaque extrémité et on les lie en haut aux perches cassées, en laissant la place de la porte.</p>
<p class="step"><span class="sn">8</span><strong>La toile des côtés</strong> se fixe aux perches par des agrafes, des clous à toiture ou un laçage. <strong>À mesure qu’on avance</strong>, on plante en dedans des pieux appuyés contre la toile, et on pellette la neige dehors, contre elle, jusqu’à la hauteur des cassures. Les pieux tiennent la toile contre la poussée de la neige. La neige, elle, tient la toile, isole le bas et fait le mur. On garde une entrée d’air basse par poêle, du côté du vent (5C, point 7).</p>
<p class="step"><span class="sn">9</span><strong>La toile du dessus</strong> passe par-dessus la poutre. Elle est tenue par des épinettes couchées de chaque côté.</p>
<p class="step"><span class="sn">10</span><strong>Dedans :</strong> le sapinage part du milieu vers chaque porte. Chaque poêle a ses quatre pieux, et son tuyau traverse la toile du dessus dans sa collerette. Les peaux vont sur le sapinage.</p>
<h3 class="sub">H. Le cône de bâches</h3>
<p class="p0">C’est la tente conique des Innus et des Naskapis, faite de deux bandes de peaux de caribou (<em>Rangifer tarandus</em>) : la bande du bas se posait en premier, et celle du haut la recouvrait. Des bâches font la même chose. Le feu est au milieu, et la fumée sort par le sommet. On a chaud tant que la flamme brûle, on respire de la fumée, et c’est un abri pour veiller plus que pour dormir.</p>
<p>Un feu ouvert sous une toile va contre tout ce que ce chapitre dit du CO. Celui-ci marche pour trois raisons : le sommet reste grand ouvert, une flamme claire pousse la fumée vers le haut, et quelqu’un la garde éveillé toute la nuit. Qu’on ferme le sommet pour garder la chaleur, qu’on laisse le feu tomber en braise ou qu’on s’endorme tous, et c’est un abri fermé avec un feu dedans (section 3).</p>
<p class="step"><span class="sn">1</span><strong>La charpente.</strong> Trois perches de 3,5 à 4,5 m et d’environ 5 cm de diamètre sont liées ensemble à un bout (brêlage de trépied, <span class="ref">ch. 110</span>), puis dressées et écartées. On appuie en rond cinq ou six perches de plus dans la fourche du trépied, sans les lier.</p>
<p class="step"><span class="sn">2</span><strong>La porte</strong> se tourne à 90° ou plus du vent.</p>
<p class="step"><span class="sn">3</span><strong>La bâche du bas se pose en premier.</strong> Elle fait le tour de la base, attachée aux perches par des cordons noués en dedans. Sa longueur décide du plancher : divisée par un peu plus de 3, elle donne le diamètre du rond qu’elle ferme. Pour se coucher les pieds au feu, il faut, de chaque côté du rond de pierres, la longueur d’un adulte couché dans son sac, plus l’écart que le test de la main demande entre le pied du sac et le feu (section 9, « Le feu de la nuit », point 4). Le diamètre se mesure donc sur place, avec les corps. Les anciennes tentes coniques avaient de 3 à 5,5 m de base : il faut de plus de 9 m à plus de 17 m de bâche pour la bande du bas, sans le recouvrement. On aboute des bâches, lacées ou cousues bord à bord. Une seule bâche de 3 m ferme un plancher de moins d’un mètre : là-dedans, on veille assis, on ne se couche pas.</p>
<p class="step"><span class="sn">4</span><strong>La bâche du haut se pose en dernier</strong>, et elle recouvre par l’extérieur le haut de la première. C’est le bardeau : la pluie et la neige fondue coulent par-dessus le joint au lieu d’entrer. Posé dans l’autre ordre, le joint devient une gouttière qui verse dans la tente.</p>
<p class="step"><span class="sn">5</span><strong>Le sommet reste ouvert</strong>, sur 30 à 50 cm entre les perches, pour la fumée. On ne le ferme jamais pour garder la chaleur : l’abri de toile intoxiqué de la section 3 avait son ouverture du haut fermée à moitié.</p>
<p class="step"><span class="sn">6</span><strong>La porte</strong> est un pan de bâche attaché en haut aux perches et lesté en bas d’une petite bille, qui l’empêche de battre.</p>
<p class="step"><span class="sn">7</span><strong>Le foyer</strong> se fait au centre, dans un rond de pierres sèches, prises sur une crête ou un talus, <strong>jamais sur une rive ni dans un ruisseau</strong> : l’eau prise dans la pierre se vaporise, la fait éclater, et les éclats partent à hauteur d’homme (<span class="ref">ch. 83</span>). Il se fait sur le sol dégagé ou sur une plateforme de billes vertes (section 9). Le sapinage fait le tour, <strong>jamais jusqu’au foyer</strong>.</p>
<p class="step"><span class="sn">8</span><strong>On se couche en rond, les pieds vers le feu</strong>, si le plancher a la taille voulue (point 3). Sinon, on veille assis.</p>
<p class="step"><span class="sn">9</span><strong>La base</strong> se renchausse contre le vent, mais le feu tire son air par le bas : on la laisse respirer du côté de la porte.</p>
<p class="step"><span class="sn">10</span><strong>La nuit, on veille par quarts, et le veilleur garde une flamme claire plutôt qu’un lit de braise.</strong> La flamme entretient le tirage, alors que la braise fait du CO sans en avoir.</p>
<p class="step"><span class="sn">11</span><strong>Le feu reste petit.</strong> Une grande flamme lance des escarbilles sur le plastique du haut, qui fond et tombe en gouttes brûlantes sur les dormeurs et sur le sapinage. La chaleur qui part par le sommet ouvert est de toute façon énorme.</p>
<h3 class="sub">I. La maison de neige</h3>
<p class="p0">Il y en a trois, et c’est la neige qui choisit. Quatre règles valent pour toutes. L’entrée est plus basse que le banc. La voûte est en arc. Le trou d’aération reste ouvert, même quand rien ne brûle (section 3). <strong>Aucune flamme dedans, éveillé ou non</strong> : la neige fond dehors, à l’air libre. On y ajoute une pelle, qui reste dedans.</p>
<p>Celui qui creuse n’est jamais seul. Un autre <strong>adulte</strong> reste à l’entrée, le voit ou lui parle sans arrêt, et ne fait rien d’autre. Un adulte seul avec les enfants ne creuse ni quinzhee ni caverne : il fait l’appentis ou la tranchée (section 9).</p>
<h4 class="choix">I-1. Le quinzhee : la butte brassée, dans n’importe quelle neige</h4>
<p class="p0">C’est la maison de neige du sous-bois, parce qu’elle se fait avec la neige qui ne se taille pas.</p>
<p class="step"><span class="sn">1</span><strong>Planter au centre une perche droite</strong>, plus haute que la butte prévue. Elle deviendra le trou d’aération. Une deuxième perche, couchée au sol, pointe vers la future porte, dos au vent.</p>
<p class="step"><span class="sn">2</span><strong>Pelleter une butte de plus de 2 m de haut en brassant.</strong> On mêle la neige de sucre du fond à celle du dessus. Pendant que la butte monte, un ou deux adultes la foulent en raquettes. Brasser la neige, c’est déclencher le frittage.</p>
<p class="step"><span class="sn">3</span><strong>Hérisser toute la butte de bâtons</strong> coupés à la longueur de paroi voulue, soit au moins 30 cm, enfoncés jusqu’à la tête et perpendiculaires à la surface.</p>
<p class="step"><span class="sn">4</span><strong>Attendre deux à trois heures</strong> par un froid ordinaire, davantage par grand froid. On en profite pour faire le bois, le repas et le sapinage.</p>
<p class="step"><span class="sn">5</span><strong>Creuser par une porte basse et petite</strong>, juste assez large pour un adulte à quatre pattes, et ne jamais l’agrandir. Un adulte creuse dedans. L’autre, à l’entrée, sort la neige et ne le quitte ni des yeux ni de la voix. Si la neige coule en poudre au lieu de sortir en mottes, on arrête et on attend encore : la butte n’a pas pris. Celui qui creuse ne garde que sa couche de base, et une couche sèche l’attend dans un sac. On se mouille en creusant, sans exception.</p>
<p class="step"><span class="sn">6</span><strong>Arrêter à chaque bâton.</strong> Quand la pelle en touche un, on arrête de creuser à cet endroit. On garde la voûte en arc et lisse : les gouttes coulent alors le long de la paroi au lieu de tomber sur les sacs.</p>
<p class="step"><span class="sn">7</span><strong>Garder de la neige pour le banc.</strong> On la tape à hauteur des genoux, en tout cas plus haut que la porte. Une petite rigole entre le banc et la paroi reçoit l’eau de fonte.</p>
<p class="step"><span class="sn">8</span><strong>Faire le test de la lumière, de jour.</strong> On bouche la porte : là où la paroi luit plus clair, elle est mince. On égalise ensuite en grattant les zones sombres.</p>
<p class="step"><span class="sn">9</span><strong>Tirer la perche du centre.</strong> Son trou fait le trou d’aération. On laisse un bâton planté dedans pour le rouvrir à chaque réveil, parce que le givre le referme tout seul.</p>
<p class="step"><span class="sn">10</span><strong>Fermer la porte</strong> d’un bloc ou d’un sac, juste assez pour couper le vent.</p>
<p class="step"><span class="sn">11</span><strong>Sur le banc :</strong> le sapinage en écailles, puis la bâche, les matelas et les sacs.</p>
<p>Il faut compter deux ou trois heures d’attente et trois ou quatre heures de creusage, sans le pelletage de la butte. Ces durées sont celles d’une équipe de pelleteurs, qui finit les murs à deux dedans et deux dehors : à deux adultes, c’est plus long. En décembre sur la Côte-Nord, le soleil se couche vers 15 h 20 et le jour dure à peine plus de 8 heures. Le quinzhee se commence donc à la première clarté, et celui qu’on n’a pas commencé le matin ne se finit pas de jour : on fait l’appentis ou la tranchée (section 9).</p>
<h4 class="choix">I-2. La caverne dans une congère</h4>
<p class="p0">Ici, le vent a déjà fait le travail de la butte. La caverne se creuse dans une congère d’environ 3 m, contre une rive de lac ou en bordure d’une clairière, du côté sous le vent. Elle va plus vite que le quinzhee, parce qu’il n’y a rien à attendre. Les règles sont les mêmes : porte basse, banc plus haut, voûte en arc, murs et plafond d’au moins 30 cm, trou d’aération. On ne la creuse pas au pied d’une pente raide chargée par le vent : le vent qui fait la congère y fait aussi la plaque qui glisse.</p>
<h4 class="choix">I-3. La maison de blocs</h4>
<p class="p0">C’est la maison de neige des Inuits, l’iglou. Elle demande de la plaque à vent, un bon outil et de la pratique. Elle s’apprend un hiver ordinaire, sur le lac devant le chalet, et pas le soir où on en a besoin.</p>
<p class="step"><span class="sn">1</span><strong>Tester la neige.</strong> On enfonce la lame, qui doit résister pareil sur toute sa longueur. Un premier bloc soulevé doit tenir d’un morceau. Sinon, cette neige ne fera pas de maison.</p>
<p class="step"><span class="sn">2</span><strong>Tailler les blocs</strong> : 20 à 25 cm d’épaisseur, environ 60 cm de large, un peu plus en longueur. On les scie à la profondeur de la lame, on tranche le fond net, et on les soulève. On taille là où la maison va se bâtir : le constructeur est debout dans la fosse d’où sortent les blocs, et cette fosse devient le plancher.</p>
<p class="step"><span class="sn">3</span><strong>Poser le premier rang</strong> en cercle autour de la fosse. Chaque bloc penche vers l’intérieur et la ligne se courbe vers le dedans. Le premier bloc se taille en biseau, comme une rampe. Quand le cercle revient à lui, le bloc suivant, plus long, se pose sur cette pente, et le rang devient une spirale qui continue de monter. Les joints se croisent d’un rang à l’autre.</p>
<p class="step"><span class="sn">4</span><strong>Monter la spirale</strong> en refermant peu à peu. Chaque bloc s’appuie sur les deux qui sont dessous et penche un peu plus que le précédent.</p>
<p class="step"><span class="sn">5</span><strong>Poser la clé.</strong> Le dernier trou, au sommet, se ferme d’un bloc taillé à sa forme. C’est un deuxième adulte qui le pose, de dehors.</p>
<p class="step"><span class="sn">6</span><strong>Colmater tous les joints</strong> avec de la neige écrasée entre les mains.</p>
<p class="step"><span class="sn">7</span><strong>Faire la porte</strong> sous le premier rang, à partir d’une tranchée creusée dehors. Des blocs posés le long de la tranchée et coiffés d’un toit en arc font un passage couvert, plus bas que le plancher : c’est la trappe à froid.</p>
<p class="step"><span class="sn">8</span><strong>Le banc.</strong> On laisse en place la neige d’un côté de la fosse, ou on empile des blocs. On le couvre de sapinage, ou de brindilles de saule (<em>Salix</em> spp.) et d’aulne rugueux (<em>Alnus incana</em>), puis de peaux.</p>
<p class="step"><span class="sn">9</span><strong>Percer le trou d’aération</strong> près du sommet.</p>
<p class="step"><span class="sn">10</span><strong>Si l’abri doit durer</strong>, on monte tout autour un mur de blocs de 60 à 90 cm de haut. Une seule nuit de poudrerie peut user une paroi jusqu’à la percer.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:16.8%"><col style="width:22.0%"><col style="width:27.5%"><col style="width:33.7%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Avant de monter la charpente</td><td>Le plancher foulé sous le poids d’un adulte en bottes</td><td>La botte n’enfonce plus</td><td>Fouler encore, et laisser prendre plus longtemps par grand froid</td></tr><tr><td class="c-item">Première flambée</td><td>Fumée aux joints du tuyau et au bord de la collerette</td><td>Aucune fumée dans la tente</td><td>Serrer, visser ou ligaturer le joint. Refaire la collerette</td></tr><tr><td class="c-item">Au plus fort d’un feu vif</td><td>La main sur la toile au bord de la collerette, et sur la toile la plus proche du poêle</td><td>La main tient</td><td>Agrandir la plaque, éloigner la toile, réduire le feu</td></tr><tr><td class="c-item">Chaque soir</td><td>Entrée d’air basse, du côté du vent</td><td>Ouverte, dégagée dehors</td><td>Déneiger, rouvrir. Ne jamais la boucher pour « garder la chaleur »</td></tr><tr><td class="c-item">Chaque soir</td><td>Pare-étincelles et bout du tuyau</td><td>Grille libre de givre, de suie et de neige</td><td>Déglacer, gratter. Une grille bouchée ferme le tuyau</td></tr><tr><td class="c-item">Chaque soir</td><td>Avertisseur de CO</td><td>Gardé au chaud le jour. Au coucher : posé à plus de 2 m du poêle, bouton d’essai qui sonne, affichage à 0 ppm</td><td>Le réchauffer contre le corps. Le bouton prouve la pile et la sirène, pas la cellule. Sans avertisseur fiable : feu mort avant le coucher (5F, point 1)</td></tr><tr><td class="c-item">Au coucher, sans veilleur</td><td>Le poêle</td><td>Plus une braise rouge quand on brasse la cendre, lampe éteinte</td><td>Attendre debout, air et clé ouverts, ou sortir la braise dehors dans une chaudière de métal</td></tr><tr><td class="c-item">Chaque semaine, poêle froid</td><td>Le tuyau, démonté section par section. Le poêle de tente encrasse comme la truie du <span class="ref">ch. 83</span></td><td>Dépôt poudreux qui se gratte. Aucune croûte noire, dure et luisante</td><td>Gratter dehors (<span class="ref">ch. 83</span>, section 9). Croûte luisante : pas de feu avant de l’avoir enlevée</td></tr><tr><td class="c-item">Chaque matin</td><td>Pieux du poêle</td><td>D’aplomb, tête non charbonnée</td><td>Replanter, en remplacer un. Poêle froid pour le faire</td></tr><tr><td class="c-item">Chaque matin</td><td>Le rond de neige nue autour du poêle</td><td>Pas une aiguille sèche à portée de la porte du poêle</td><td>Ramasser, élargir le rond</td></tr><tr><td class="c-item">Après chaque bordée</td><td>Toit de la tente, tuyau, haubans, pare-étincelles</td><td>Pas de poche de neige sur la toile. Tuyau d’aplomb. Grille libre</td><td>Faire glisser la neige, retendre, déglacer la grille</td></tr><tr><td class="c-item">Quinzhee, avant de creuser</td><td>Temps depuis la fin du pelletage</td><td>2 à 3 h par froid ordinaire, davantage par grand froid</td><td>Attendre. La neige doit sortir en mottes, pas couler</td></tr><tr><td class="c-item">Quinzhee, pendant le creusage</td><td>Bâtons repères</td><td>On s’arrête au premier bâton touché</td><td>Si un bâton tombe à l’intérieur, la paroi est trop mince là : reboucher de neige tassée</td></tr><tr><td class="c-item">Tout abri de neige, à chaque réveil, et après une poudrerie ou une bordée</td><td>Trou d’aération et entrée</td><td>Le bâton passe librement. L’entrée n’est pas bouchée de neige soufflée</td><td>Rouvrir tout de suite, avant de se rendormir</td></tr><tr><td class="c-item">Tranchée, au coucher et après une bordée</td><td>La bâche du toit</td><td>Tendue sur ses perches, sans poche qui descend vers les visages</td><td>Dégager la neige du dessus, ajouter une perche</td></tr><tr><td class="c-item">Tout abri de neige, à chaque réveil</td><td>Plafond</td><td>Sec au toucher, pas de gouttes qui tombent, pas d’affaissement</td><td>Porte ouverte, lisser la voûte. S’il baisse : tout le monde dehors</td></tr><tr><td class="c-item">Chaque matin, tout abri</td><td>Tête et estomac de chacun, enfants compris</td><td>Personne n’a mal à la tête ni mal au cœur</td><td>Tout le monde dehors avant de chercher pourquoi (section 8)</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:27.6%"><col style="width:28.8%"><col style="width:43.6%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Une personne ou plus a mal à la tête ou mal au cœur au réveil, et ça passe dehors</td><td>Monoxyde de carbone jusqu’à preuve du contraire. À deux en même temps, c’est lui</td><td>Tout le monde dehors, dans les sacs, bottes aux pieds. Poêle éteint et braise sortie, entrée basse et porte grandes ouvertes le temps d’aérer. On rentre une fois la source supprimée : sans feu, ou avec quelqu’un d’éveillé qui garde une flamme claire. S’il y a un avertisseur à affichage, réchauffé, on attend qu’il lise 0 ppm</td></tr><tr><td class="c-item">Nausée ou vomissement la nuit, pris pour de la viande qui passe mal</td><td>Monoxyde de carbone, jusqu’à preuve du contraire</td><td>Même chose. On le prend souvent pour la digestion</td></tr><tr><td class="c-item">Un enfant mou, grognon, qui veut se recoucher</td><td>Monoxyde de carbone possible : chez l’enfant, il a l’air de la fatigue (<span class="ref">ch. 39</span>)</td><td>Dehors d’abord, les questions ensuite</td></tr><tr><td class="c-item">Fumée par la porte du poêle ou par les joints quand le feu baisse</td><td>Le tuyau refoule : manque d’air par le bas, ou sortie bouchée (grille givrée, suie, neige dans le bout du tuyau)</td><td>Rouvrir l’entrée d’air basse et relancer une flamme claire. Si la fumée continue, c’est la sortie : feu éteint, braise sortie, tout le monde dehors, puis dégager la grille et le bout du tuyau</td></tr><tr><td class="c-item">Odeur de fumée froide dans la tente au réveil</td><td>Le tuyau a refoulé pendant la nuit</td><td>Même lecture que le mal de tête : dehors, aérer, puis trouver pourquoi (entrée basse bouchée, grille bouchée, poêle étouffé, feu laissé mourir pendant qu’on dormait)</td></tr><tr><td class="c-item">Ronflement grave dans le tuyau, tuyau qui rougit, étincelles à la sortie</td><td>Feu de cheminée (<span class="ref">ch. 83</span>, section 8)</td><td>Fermer l’air du poêle et la clé. Tout le monde dehors avec les sacs. Surveiller la toile autour de la collerette et le toit sous la sortie. Jamais d’eau dans un tuyau rouge</td></tr><tr><td class="c-item">Flamme jaune au réchaud</td><td>Combustion incomplète : beaucoup plus de CO</td><td>Éteindre. Nettoyer le brûleur. Réchaud dehors seulement</td></tr><tr><td class="c-item">Toile qui brunit ou roussit autour de la collerette</td><td>Plaque trop petite, ou tuyau trop chaud contre elle</td><td>Agrandir la plaque, baisser le feu. Une toile roussie a perdu sa résistance et se déchire</td></tr><tr><td class="c-item">Petits trous ronds dans le toit</td><td>Escarbilles : pare-étincelles absent, percé ou bouché</td><td>Réparer la grille. Rapiécer les trous (<span class="ref">ch. 104</span>)</td></tr><tr><td class="c-item">Poêle qui penche, tuyau qui force sur la collerette</td><td>Pieux enfoncés, charbonnés ou mal plantés</td><td>Laisser refroidir, replanter plus profond</td></tr><tr><td class="c-item">Plancher qui cède sous les pas, flaque près du poêle</td><td>Plancher foulé en raquettes seulement, ou poêle posé sans pieux</td><td>Fouler en bottes autour, remonter le poêle sur pieux</td></tr><tr><td class="c-item">Toile qui s’affaisse sous la neige</td><td>Poêle éteint pendant une bordée</td><td>Faire tomber la neige par en dedans, relancer le feu</td></tr><tr><td class="c-item">Perche qui casse net au lieu de plier (shaputuan)</td><td>Trop froid pour casser en gardant les fibres</td><td>Arrêter. Attendre le redoux, ou charpente liée (5C)</td></tr><tr><td class="c-item">Neige qui coule en poudre au creusage du quinzhee</td><td>Butte pas encore frittée</td><td>Sortir, attendre, recommencer à creuser plus tard</td></tr><tr><td class="c-item">Plafond d’abri de neige qui dégoutte ou qui baisse</td><td>Trop chaud dedans, ou redoux</td><td>Ouvrir la porte, éteindre toute flamme. S’il baisse, tout le monde dehors</td></tr><tr><td class="c-item">Parois intérieures luisantes, glacées</td><td>L’haleine et la chaleur des corps ont glacé la paroi. L’abri vieillit</td><td>Gratter la glace, tenir le trou d’aération bien ouvert. Après plusieurs nuits : un abri neuf</td></tr><tr><td class="c-item">Réveil trempé dans un abri de neige</td><td>Banc trop bas, pas de rigole, pas d’isolant sous le corps</td><td>Remonter le banc, creuser la rigole, doubler le sapinage</td></tr></tbody></table>
