<template id="story-d">
<p class="pt"><span class="pn">1</span><strong class="plead">Un poêle raccordé à son tuyau peut quand même intoxiquer une tente.</strong> Une tente chauffée tire comme une cheminée. Quand le feu tombe en braise, le tuyau refroidit, son tirage faiblit, et la tente peut faire descendre l’air par le tuyau et verser dans la tente la fumée et le CO de la braise. Au Québec, des campeurs ont été intoxiqués par le poêle à bois d’un abri de toile, une nuit de froid intense où l’ouverture du toit était à moitié fermée. Les premiers signes ont été un mal de tête et un mal de cœur, vers 2 h du matin, et on les prend pour la digestion. Le CO n’a ni odeur ni couleur, il a le poids de l’air et se mélange à tout le volume, et par grand froid il peut être rabattu vers ceux qui dorment. On s’endort au lieu de sortir. Quatre règles, sans exception. <strong>Une entrée d’air au ras du plancher, du côté du vent, qui ne se renchausse jamais.</strong> <strong>Un pare-étincelles dégagé chaque soir</strong> : bouché, il ferme le tuyau, et la fumée n’a plus que la tente. <strong>Quelqu’un veille, air et clé ouverts, ou le feu est mort avant que le dernier adulte se couche</strong> : jamais un poêle bourré puis étouffé, jamais un feu qu’on laisse mourir en dormant. <strong>Un avertisseur de CO à affichage, gardé au chaud, qu’on lit au lieu de l’écouter</strong> : sous 4,4 °C, et pendant les minutes où il est fait pour se taire, son silence ne prouve rien.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Dans un abri de neige, rien ne brûle, éveillé ou non. Sous une toile, rien ne brûle que le poêle raccordé à son tuyau</strong> , ou le feu du cône ouvert au sommet, qu’on veille. Ni réchaud, ni lampe, ni fanal, ni chandelle, ni chaufferette au propane, même celle vendue pour l’intérieur : aucun n’a de tuyau, et tout ce qu’ils brûlent reste dedans. En laboratoire, un réchaud de camping a porté une boîte de la taille d’un baril à environ 400 ppm en moins de dix minutes, et 400 ppm donnent le mal de tête et la nausée en 1 à 3 heures. Deux heures sous une petite tente avec un réchaud ont bloqué en moyenne plus du cinquième de l’hémoglobine d’adultes en santé. L’allumage est le pire moment. Un brûleur encrassé ou une flamme jaune multiplient le CO. Deux abris faits de la même façon ne donnent pas la même chose. On fait fondre la neige dehors, à l’air libre, jamais dans l’entrée ni dans le passage couvert. Une chandelle brûle normalement dans un air chargé de CO : elle ne sert pas de test. Chez un enfant de 4 ou 6 ans, l’intoxication a l’air de la fatigue ou du mauvais caractère au bout d’une journée dehors (<span class="ref">ch. 39</span>). <strong>Un enfant qui devient mou dans un abri où quelque chose brûle sort dehors avant qu’on cherche pourquoi.</strong></p>
<p class="pt"><span class="pn">3</span><strong class="plead">Une génératrice ne fonctionne jamais dans un bâtiment, dans un garage ou sous un auvent</strong> , ni dans le vestibule d’une tente, ni sous une bâche tendue. Elle fabrique du CO en continu, et une toile le retient exactement comme un mur. Elle va dehors, dégagée, l’échappement loin de toute ouverture, et d’abord de l’entrée d’air basse de la tente, par où le poêle aspire l’air du dehors (<span class="ref">ch. 3</span>, <span class="ref">ch. 87</span>). Même chose pour une motoneige qu’on laisse tourner à côté de la tente.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">L’abri de neige peut s’effondrer sur quelqu’un.</strong> Une butte creusée avant d’avoir pris tombe sur celui qui creuse, et un corps sous une masse de neige ne respire plus et ne se dégage pas seul. Celui qui creuse n’est jamais seul : un autre adulte reste à l’entrée, pelle en main, le voit ou lui parle sans arrêt, et ne fait rien d’autre. Celui qui arrête de répondre est dessous. Un adulte seul avec les enfants ne creuse ni quinzhee ni caverne. Une voûte occupée par redoux ou sous la pluie ramollit et descend la nuit sur ceux qui dorment : on ne dort pas sous la neige quand il fait doux, et on garde une pelle dedans. Une bâche chargée de neige sur une tranchée, sans perches dessous, s’affaisse, et une bordée de nuit la plaque sur les visages : du plastique collé au visage d’un enfant qui dort, c’est l’étouffement. Enfin, même sans flamme, un abri dont la poudrerie a bouché l’entrée et le trou d’aération se vicie du souffle de ceux qui dorment dedans. Après une poudrerie ou une bordée, on dégage l’entrée et le trou avant de se rendormir.</p>
<p class="pt"><span class="pn">5</span><strong class="plead">Une tente de toile brûle d’un coup</strong> , avec son sapinage sec et ses sacs de couchage. Le feu part du poêle, et le poêle est près de la porte : la sortie est du côté du feu. Un couteau reste à la tête du lit, parce que la toile se tranche et qu’on sort par le mur du fond. Le shaputuan a une porte à chaque bout : on sort par l’autre. Un feu de cheminée sous une toile, c’est la toile qui prend : le tuyau mince rougit à la collerette, et les escarbilles pleuvent sur le toit. Dehors, devant l’appentis, l’épinette lance beaucoup d’étincelles, et l’enveloppe d’un sac synthétique fond à la première : la seule pièce du chapitre qui ne se remplace pas est celle qui brûle d’abord.</p>
</template>
<template id="story-e">
<p class="p0">La nuit dehors sans tente, sans poêle, avec une bâche, du sapin, un feu, et un couteau ou une hache. Tout ce qui suit se fait avec ça et avec ce qui pousse autour.</p>
<h3 class="sub">L’ordre des gestes</h3>
<p class="p0">L’abri se décide dès qu’on sait qu’on ne rentrera pas. Il se fait à la lumière, et en décembre elle finit vers 15 h 20 (section 2). L’ordre est le suivant :</p>
<p class="step"><span class="sn">1</span>le bois de toute la nuit, parce que c’est le travail le plus long ;</p>
<p class="step"><span class="sn">2</span>l’appentis ;</p>
<p class="step"><span class="sn">3</span>le lit ;</p>
<p class="step"><span class="sn">4</span>le feu, en dernier, avec sa plateforme et son mur.</p>
<p>Les enfants ramassent les branches mortes basses des épinettes, sèches même sous la neige : c’est le bois d’allumage, et c’est un vrai travail (<span class="ref">ch. 40</span>). Le bois de la nuit se coupe en entier avant la noirceur, parce qu’à −30 °C, à 3 h du matin, personne ne trouve de bois sec à la lampe frontale. On prend l’épinette morte debout (<span class="ref">ch. 83</span>, section 9). Par grand froid, même une tige verte de la grosseur du poignet se casse facilement, contre un arbre ou sous la botte, sans hache.</p>
<h3 class="sub">L’appentis de bâche</h3>
<p class="step"><span class="sn">1</span><strong>La place</strong> (5A) : sous le vent d’un fourré ou d’un rocher, avec du bois mort autour, rien au-dessus.</p>
<p class="step"><span class="sn">2</span><strong>Fouler l’aire</strong> en bottes puis en raquettes (5B), ou creuser jusqu’au sol si la neige est mince.</p>
<p class="step"><span class="sn">3</span><strong>Le faîte :</strong> une perche liée entre deux arbres, à hauteur de poitrine, ou posée sur deux piquets fourchus.</p>
<p class="step"><span class="sn">4</span><strong>La bâche</strong> descend du faîte jusque dans la neige, derrière. Le dos de l’appentis est au vent. Le bas de la bâche est enfoui dans la neige et chargé de bûches.</p>
<p class="step"><span class="sn">5</span><strong>Les côtés</strong> se ferment de branches de sapin plantées serrées, puis de neige pelletée contre elles.</p>
<p class="step"><span class="sn">6</span><strong>Sans bâche</strong>, on couche des perches du faîte jusqu’à la neige. On les couvre de branches de sapin posées en écailles, <strong>en commençant par le bas</strong> et en montant, pour que chaque rang recouvre celui du dessous comme des bardeaux, puis on met de la neige sur le dos. Ça coule quand le feu fait fondre la neige du toit : du côté du feu, on ne met pas de neige.</p>
<h3 class="sub">Le puits d’arbre, pour une personne et vite</h3>
<p class="p0">Sous une grosse épinette dont les branches basses touchent la neige, la neige est moins profonde près du tronc. On creuse tout autour du tronc, jusqu’au sol si on peut, et on tasse les parois. On coupe des branches pour couvrir le trou et pour tapisser le fond. <strong>Pas de feu dans le puits</strong> : la neige des branches fond, tombe sur le feu et l’éteint, ou sur le dormeur, et une épinette noire s’allume de bas en haut (<span class="ref">ch. 11</span>).</p>
<h3 class="sub">Le lit</h3>
<p class="p0">Le sapinage se pose en écailles (5E), <strong>plus épais que sous une tente</strong>, parce qu’aucun poêle ne chauffe le plancher. On continue jusqu’à ce qu’un genou appuyé ne sente plus le froid. S’il n’y a qu’une bâche, elle fait le toit, et le sapinage fait le dessous : c’est lui l’isolant, pas le plastique. On se couche en rang le long de l’ouverture, les pieds vers le feu, les enfants entre les adultes, chacun dans son sac ou dans l’enveloppe croisée (<span class="ref">ch. 25</span>).</p>
<h3 class="sub">Le feu de la nuit</h3>
<p class="step"><span class="sn">1</span><strong>La plateforme.</strong> Sur la neige profonde, un feu s’enfonce dans son propre trou et s’y noie. On couche donc côte à côte des billes vertes sur la neige, puis une ou deux autres couches par-dessus, la couche du haut en travers de celle du dessous. Le feu se fait sur ce radeau. Une plateforme de bois vert continue de couver après qu’on a noyé ce qu’il y avait dessus (<span class="ref">ch. 13</span>) : le matin, on la défait.</p>
<p class="step"><span class="sn">2</span><strong>Le feu long.</strong> Il se fait aussi long que le rang des dormeurs, parallèle à l’ouverture, pour que chaque corps reçoive sa part de rayonnement. Des billes longues de bois mort, couchées dans le sens du feu, brûlent longtemps et se poussent au lieu de se recharger.</p>
<p class="step"><span class="sn">3</span><strong>Le mur réflecteur</strong> se monte derrière le feu, du côté opposé à l’abri. On plante quatre pieux de 1,5 m, puis on empile des billes vertes en deux rangs entre les pieux. On remplit l’espace entre les rangs de terre, qui renforce le mur et renvoie mieux la chaleur, et on lie le haut des pieux. De la neige ne sert pas de remplissage : à côté du feu, elle fond et s’écoule. Quand la terre est gelée sous la neige, les deux rangs de billes vertes font le mur sans remplissage : il tient moins et renvoie moins, mais il renvoie. Sans mur, la chaleur qui part de l’autre côté du feu chauffe la forêt (<span class="ref">ch. 17</span>).</p>
<p class="step"><span class="sn">4</span><strong>La distance entre le feu et la bâche</strong>, c’est la main. Si la main ne tient pas sur la bâche, le feu est trop près : le polyéthylène ramollit et fond bien avant qu’un bout de bois s’allume.</p>
<p class="step"><span class="sn">5</span><strong>Quelqu’un veille.</strong> À deux adultes, on se relaie aux recharges (<span class="ref">ch. 18</span>). Seul avec deux enfants, on met moins de billes mais de plus grosses, et on accepte que le feu tombe à un moment de la nuit. C’est alors le sapinage sous les corps et les sacs qui portent jusqu’au matin, d’où l’épaisseur du lit.</p>
<p class="step"><span class="sn">6</span><strong>Boire chaud.</strong> On fait fondre la neige dans le chaudron sur un fond d’eau (<span class="ref">ch. 10</span>). La décoction se fait avec des aiguilles de sapin baumier ou d’épinette, <strong>jamais de cèdre</strong> (thuya, <em>Thuja occidentalis</em>) : la thuyone du cèdre est toxique (<span class="ref">ch. 20</span>). Les pierres chauffées vont dans les sacs. Elles sont prises au sec, jamais dans l’eau ni sur une rive, parce que l’eau prise dedans les fait éclater au feu. Elles sont roulées dans deux épaisseurs de tissu, parce que la peau engourdie ne sent pas la brûlure (<span class="ref">ch. 25</span>).</p>
<h3 class="sub">La tranchée bâchée, quand le feu est impossible</h3>
<p class="p0">Il n’y a pas de bois sec, ou le vent tourne et rabat la fumée dans l’appentis. On creuse alors une tranchée étroite, jusqu’au sol si la neige le permet, juste assez longue pour les corps couchés serrés. <strong>Des perches se posent en travers de la tranchée avant la bâche</strong>, serrées. La bâche s’étend sur les perches, chargée de neige sur les bords. Si on met de la neige sur le dessus, elle porte sur les perches, jamais sur le plastique seul : une bâche sans perches s’affaisse sous la neige et descend sur les visages (section 8, point 4). S’il n’y a pas de bâche, les perches couvertes de sapin en écailles, puis de neige, font le toit. Il n’y a qu’une entrée, plus basse que le lit, qu’on ferme d’un sac. Sous le corps, il faut du sapinage, et une ouverture reste au toit. <strong>Aucune flamme dedans.</strong> La chaleur vient des corps, et la neige la garde (<span class="ref">ch. 25</span>, section 9). Après une bordée, on dégage le dessus et l’ouverture.</p>
<h3 class="sub">La tente à poêle faite avec ce qui traîne</h3>
<p class="p0">On a un poêle et du tuyau récupérés dans les cendres du chalet (<span class="ref">ch. 82</span>, section 9) ou une truie de baril (<span class="ref">ch. 83</span>, section 9), mais pas de tente.</p>
<p class="li"><strong>La toile.</strong> Une toile de coton, quelle qu’elle soit : toile de chaloupe, bâche de coton d’un hangar, rideaux épais cousus ensemble (<span class="ref">ch. 104</span>), <strong>s’ils sont de coton</strong>. Une tente d’été, une toile de chaloupe récente ou un rideau occultant peuvent être en nylon, en polyester, ou enduits : on vérifie. Le coton respire, roussit au lieu de fondre, et se recoud. Le synthétique fond au tuyau et sous les escarbilles, et un tissu enduit ne laisse pas passer l’air : il se range avec la bâche, pour le cône ou l’appentis, jamais avec un poêle. Un tissu enduit se voit à son envers luisant ou caoutchouté. Pour le reste, le test se fait dehors, sur un fil tiré du bord et approché d’une flamme<sup class="fnr" data-fn="12-2">2</sup>. On peut ajouter du plastique <strong>loin du poêle</strong>, en second toit par-dessus le coton, jamais autour du tuyau, et jamais au point de fermer le bas : on garde l’entrée d’air basse (5C, point 7).</p>
<p class="li"><strong>La collerette.</strong> On aplatit un couvercle de baril, le flanc d’un bidon ou une plaque de tôle de toiture. On perce au centre un trou juste un peu plus grand que le tuyau, en taillant en étoile au ciseau à froid et en rabattant les languettes. On perce ensuite le pourtour d’une rangée de trous au clou. On découpe dans la toile une ouverture nettement plus petite que la plaque, et plus grande que le tuyau. La plaque se coud à la toile au fil de fer, en passant par ses trous. Le test de la main, au plus fort d’un feu vif (5D, point 6), dit si elle est assez grande.</p>
<p class="li"><strong>Le pare-étincelles.</strong> Un bout de treillis ou de tôle perforée, roulé en manchon et serré au fil sur le haut du tuyau, avec des ouvertures d’au plus 1 cm (<span class="ref">ch. 82</span>) : assez petites pour retenir l’escarbille. Une moustiquaire métallique, plus fine, se bouche plus vite de givre et de suie, et on ne la prend qu’à défaut. Une grille bouchée ferme le tuyau, et la fumée n’a plus d’autre sortie que la tente : on la regarde chaque soir (5F, point 2).</p>
<p class="li"><strong>Les haubans.</strong> Du fil à balles, de la broche de clôture ou du fil électrique récupéré, tendus à trois arbres ou à trois corps morts.</p>
<p class="li"><strong>Ce qu’on perd :</strong> une toile qui n’est pas traitée contre le feu roussit plus vite, et le test de la main se refait après chaque grosse flambée.</p>
<h3 class="sub">Ce qu’on perd en choisissant cette version</h3>
<p class="li"><strong>L’appentis et le feu :</strong> la nuit devient une suite de petits sommes entre deux recharges. On brûle énormément de bois, et la fumée tourne avec le vent. Ce qui fait face au feu chauffe, ce qui est tourné vers la bâche gèle, et on se retourne sans arrêt.</p>
<p class="li"><strong>L’abri de neige :</strong> des heures de travail, toute la clarté d’une journée d’hiver pour le quinzhee, du linge mouillé qu’on ne sèche nulle part dedans, et aucune source de chaleur. On y dort, on n’y vit pas.</p>
<p class="li"><strong>La tranchée :</strong> il fait noir et c’est étroit. Un enfant s’y sent enterré et ne dort pas. C’est l’abri du soir où rien d’autre n’est possible.</p>
<p class="li"><strong>Le cône de bâches :</strong> la fumée dans les yeux, le plastique qui fond au sommet, et une veille obligatoire toute la nuit.</p>
<h3 class="sub">Ce qui ne se remplace pas</h3>
<p class="li"><strong>Le sac de couchage d’hiver</strong> et une couche de linge sèche. Tout ce chapitre suppose qu’on arrive au lit sec. L’enveloppe croisée (<span class="ref">ch. 25</span>) remplace le sac, alors que rien ne remplace le sec.</p>
<p class="li"><strong>L’avertisseur de CO.</strong> Rien ne le sent et aucun montage ne le fabrique. Sans lui, il reste la règle : ni réchaud, ni lampe, ni fanal, ni chandelle, ni chaufferette dans un abri fermé, et une tente à poêle qui respire par le bas, avec quelqu’un d’éveillé, ou un feu mort avant que le dernier adulte se couche.</p>
<p class="li"><strong>La lumière du jour.</strong> En décembre, elle dure à peine plus de 8 heures. Un quinzhee ne se creuse pas dans un après-midi, et un appentis monté à la lampe frontale n’a pas de bois pour la nuit.</p>
<p class="li"><strong>La pratique de la maison de blocs.</strong> Elle s’apprend un hiver ordinaire, et pas la nuit où on en a besoin.</p>
</template>
<template id="notes">
<p class="fn" data-fn="12-1"><span class="fnn">1</span>Une braise se cache sous la cendre. Lampe éteinte, porte du poêle ouverte, on brasse la cendre au tisonnier jusqu’au fond : une braise vivante luit rouge. Tant qu’un seul point rouge luit, le feu n’est pas mort, et il fait du CO sans flamme.</p>
<p class="fn" data-fn="12-2"><span class="fnn">2</span>Le fil, tenu au bout d’une broche, s’approche d’une flamme, dehors. Le coton brûle sans reculer devant la flamme, sent le papier brûlé et laisse une cendre grise et fine. Le nylon et le polyester fondent en se recroquevillant loin de la flamme, sentent le produit chimique et laissent une petite bille fondue. Un tissu mélangé ne se lit pas à coup sûr : dans le doute, il se range avec la bâche.</p>

    if(want===cur) break;
    z.querySelectorAll('.fnc').forEach(c=>c.textContent='');
    want.split(' ').forEach(w=>{ const [id,sd]=w.split('|'); z.querySelector('.fnc[data-side="'+sd+'"]').appendChild(NOTES[id].cloneNode(true)); });
    z.classList.add('on');
  }
}

/* =====================================================================
   Moteur de chapitre (build_chapitre.py). Les fonctions au-dessus
   (OVER, splitPara, splitTable, noteZone, syncNotes) sont celles de
   interieur.tpl.html, recopiées à la construction. Ici : les pages se
   créent à la volée, trois histoires se suivent (texte courant, encadré
   danger, variante d'urgence), les planches pleine page prennent la page
   qui suit leur mention, les demi-planches et les photos flottent au
   premier endroit où elles tiennent, jamais au milieu d'un paragraphe.
   ===================================================================== */
const C = JSON.parse(document.getElementById('meta').textContent);
const BOOK = document.getElementById('book');
const WARN = [];
const PAGES = [];
let P = null;                 // page courante
let pendingPlates = [];       // planches pleine page qui attendent la fin de la page courante
const DSVG = '<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#fff"/><path d="M15.2 10 H18.8 L18.1 20.5 H15.9 Z" fill="#9B2C1E"/><rect x="15.4" y="22.3" width="3.2" height="3.2" fill="#9B2C1E"/></svg>';
const PT = 96/72;

function mkPage(kind, plate){
  const n = PAGES.length + 1, side = n % 2 ? 'recto' : 'verso';
  const el = document.createElement('section'); el.className = 'page ' + side; el.id = 'p' + C.num + '-' + n;
  if(kind !== 'open') el.innerHTML = '<div class="rh"><div class="grp"><span class="fo">' + C.num + '-' + n + '</span><span class="ch">' + C.num + ' · ' + C.title + '</span></div><span class="to">' + C.tome + '</span></div>';
  const bl = document.createElement('div'); bl.className = 'block'; el.appendChild(bl);
  if(kind === 'open') bl.innerHTML = document.getElementById('open').innerHTML;
  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
