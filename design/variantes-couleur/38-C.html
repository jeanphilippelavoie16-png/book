<p class="pt"><span class="pn">1</span><strong class="plead">L’alcool, une chicane et une arme dans la même soirée.</strong> Trois faits mis bout à bout. L’ivresse est une cause majeure de blessures par violence et de suicide. Chez des survivants de coups de feu tirés contre eux-mêmes, six sur dix environ reliaient leur geste à une chicane avec leur partenaire ou leur famille ; dans un autre groupe, six sur dix en avaient eu une dans les 24 heures. Et un geste sur quatre suit la décision de moins de 5 minutes. Le soir où ces trois choses se trouvent dans la même pièce est celui qu’on prépare, pas le fond de février. Donc : les armes sont verrouillées <strong>avant</strong> le soir, pas pendant la chicane ; l’adulte qui boit ne garde pas les clés ; aucune chicane ne se règle après le souper (<span class="ref">ch. 36</span>, point 15). <strong>Quand un adulte a peur de l’autre</strong>, ce n’est plus un conflit à régler mais une situation de sécurité : on ne reste pas seul avec la personne, c’est l’adulte qui a peur qui garde sur lui la culasse ou la pièce mobile, et c’est lui qui s’éloigne avec les enfants, sans attendre que l’autre se calme : chez le voisin si le trajet peut se faire ce soir-là, dans le froid et le noir, avec les enfants ; sinon, il fait le signal « venez » (<span class="ref">ch. 16</span>, étape 5 ; <span class="ref">ch. 36</span>, point 7), qui fait monter le voisin dès qu’il le voit ou l’entend. Pas le signal d’absence : celui-là ne fait monter personne avant le lendemain.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Couper d’un coup l’alcool d’un buveur dépendant peut le tuer.</strong> Le buveur dépendant, c’est celui qui se sent mal quelques heures après son dernier verre — mains qui tremblent, sueurs, nausée, mal de tête —, ou qui boit beaucoup depuis longtemps. Le sevrage commence vers 6 heures après le dernier verre ; des convulsions peuvent venir entre 6 et 48 heures ; un délire commence d’habitude entre 48 et 72 heures, et il peut être mortel (note 4). Au chalet, il n’y a rien pour le traiter, sauf si la pharmacie contient une benzodiazépine : c’est la classe de médicament qui sert de base au traitement du sevrage, et l’interdit de l’étape 13, qui vise le sommeil et le calme après un choc, ne la vise pas. C’est la seule exception à la règle de ne jamais donner la médication d’ordonnance d’une autre personne (<span class="ref">ch. 35, 5</span>-D, étape 3). Elle ne va qu’à celui qui tremble et sue parce qu’il a arrêté, jamais par-dessus un verre, et jamais à celui qui a déjà convulsé ou déliré en arrêtant. Diazépam : 10 à 20 mg toutes les 6 à 12 heures le premier jour, puis 5 à 10 mg toutes les 6 à 12 heures pendant trois à cinq jours ; lorazépam : 0,5 à 1 mg toutes les 6 à 8 heures ; oxazépam : 15 à 30 mg toutes les 6 à 8 heures. Rien au-delà d’une semaine. Celui qui en prend dort trop, respire lentement, tombe ou délire si la dose est trop forte, et bien plus s’il reboit par-dessus : on ne redonne pas tant qu’il somnole, et l’autre adulte garde la boîte. L’arrêt brutal arrive dans trois situations banales : la réserve finit, la bouteille est mise sous clé par précaution, ou la personne décide d’arrêter du jour au lendemain. La réponse est la descente de l’étape 57 : environ 10 % de la dose de départ en moins tous les quatre jours, versés par l’autre adulte, et la réserve calculée jusqu’à la fin de la descente. Quelqu’un qui a déjà convulsé ou halluciné en arrêtant n’a pas de solution sûre au chalet.</p>
<p class="pt cont0">Quand la réserve finit quand même, tout ce qui contient de l’alcool dans le chalet devient de l’alcool pour lui : lave-glace, antigel de conduite d’essence, hydrate de méthyle, combustible à réchaud en boîte, alcool à friction. Les quatre premiers contiennent souvent du méthanol, et le méthanol tue en retard : <strong>1 à 72 heures</strong> peuvent passer sans aucun signe, puis viennent somnolence, confusion, mal de tête, étourdissements et démarche qui titube — les signes de l’ivresse —, puis la vue qui se trouble<sup class="fnr" data-fn="38-5">5</sup> et la cécité, souvent pour de bon. <strong>60 à 240 mL</strong> peuvent tuer un adulte. La réponse reste la descente calculée jusqu’au bout ; et un trait de feutre au niveau du bidon, comme le compte des comprimés (<span class="ref">ch. 36</span>, section 9), dit si quelqu’un y boit.</p>
<p class="pt"><span class="pn">3</span><strong class="plead">Le monoxyde de carbone se déguise en chagrin, en angoisse et en panique.</strong> Il est incolore, inodore, sans goût, et n’irrite rien : rien ne l’annonce. Ses premiers signes — maux de tête, fatigue, nausées, vomissements, étourdissements — sont aussi ceux du choc, de la crise de panique et du deuil. Une maisonnée qui vient de perdre quelqu’un attribue tout à la peine, et une maison en panne improvise son chauffage le premier soir, avec un appareil qui n’a jamais servi là. Chez l’enfant, le monoxyde a l’air de la fatigue ou du mauvais caractère, et un parent en deuil y voit le chagrin de l’enfant. Seul un avertisseur détecte ce gaz. Signes chez une personne ou plusieurs, et plus encore s’ils s’améliorent dehors : sortir tout le monde, aérer, et ne rien rallumer avant d’avoir trouvé la cause (<span class="ref">ch. 83</span>). <strong>La génératrice ne tourne jamais dans un bâtiment, un garage ni sous un auvent</strong> — c’est justement pendant les premiers jours d’un choc, à la maison en panne, qu’on la rentre pour la protéger de la neige.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">Le deuil coupe l’appétit, et un chalet sans appétit mange du maigre.</strong> Les gens en deuil oublient de manger, et celui qui cuisine sans cœur cuit ce qui est rapide : du lièvre (<em>Lepus americanus</em>), de l’orignal (<em>Alces americanus</em>) maigre, du poisson sans gras. La viande maigre seule donne le mal de caribou<sup class="fnr" data-fn="38-6">6</sup>, mortel en quelques semaines : le gras et les glucides ne sont pas un agrément, ils sont ce qui empêche la ration de tuer (<span class="ref">ch. 19</span>). L’épuisement fait sauter d’autres gestes : le gibier se cuit à <strong>74 °C à cœur</strong>, au thermomètre, même quand personne n’a la tête à ça ; on ne mange <strong>ni le foie ni les reins des cervidés</strong> — cadmium (<span class="ref">ch. 22</span>) ; et le lièvre se dépouille avec des gants étanches, parce que la tularémie entre par une main coupée (<span class="ref">ch. 48</span>).</p>
<p class="pt"><span class="pn">5</span><strong class="plead">Pas de cèdre dans la tisane du soir.</strong> La thuyone du thuya occidental donne des convulsions, et aucune dose sûre n’a pu être établie pour ce livre. Sapin baumier ou épinette seulement (5-G, étape 41).</p>

<p class="p0 ri"><strong class="runin">Tenir quand on est l’adulte qui reste seul avec les enfants.</strong> L’autre adulte est mort, ou il a été évacué blessé, ou il est parti chercher de l’aide et n’est pas revenu. Tout ce que le livre a monté pour deux adultes tombe d’un coup : les quarts de nuit, la règle des clés tenue par l’autre, le tiers à qui parler, la personne qui prend le relais d’une tâche ou d’un chagrin. Il reste un adulte, un enfant de 4 ans, un enfant de 6 ans, un poêle et un voisin. Ce qui suit se fait avec ça.</p>
<h3 class="sub">Les vingt-quatre premières heures, dans l’ordre</h3>
<p class="step"><span class="sn">1</span><strong>La chaleur.</strong> Le feu entretenu, et la nuit choisie honnêtement (<span class="ref">ch. 83</span>, étape 22) : jamais une grosse charge étouffée. Tout le reste se fait mieux dans une pièce chaude.</p>
<p class="step"><span class="sn">2</span><strong>Les enfants.</strong> Dire, court et vrai, en mots exacts, sans personne pour se partager la phrase : « Maman est morte » — ou papa —, « moi, je reste avec vous. Ce soir, on dort tous dans la grande pièce. » Puis nommer qui fait quoi maintenant, parce que l’organigramme rassure plus que le réconfort (<span class="ref">ch. 40, 5</span>-F, étape 41). Une tâche à chacun dans l’heure.</p>
<p class="step"><span class="sn">3</span><strong>Le corps</strong>, si c’est une mort : <span class="ref">ch. 35, 5</span>-F. Une personne retrouvée froide dans la neige n’est pas morte tant qu’elle n’a pas été réchauffée (<span class="ref">ch. 35</span>, section 2 et 5-F, étape 1). Les enfants voient le corps ou ne le voient pas, mais ils savent, et un mensonge ne tient pas dans une maison de trois personnes.</p>
<p class="step"><span class="sn">4</span><strong>Le signal « venez » part ce soir, pas quand on sera à bout</strong> (<span class="ref">ch. 16</span>, étape 5 ; <span class="ref">ch. 36</span>, point 7) : pas le signal d’absence, qui ne ferait monter le voisin qu’une fois manqué. Un adulte seul avec des enfants est le cas pour lequel le regroupement du <span class="ref">ch. 18</span> existe. Le voisin qui sait peut venir, ou prendre les enfants une journée, ou accueillir tout le monde ; le voisin qui ne sait pas ne peut rien.</p>
<p class="step"><span class="sn">5</span><strong>Manger soi-même</strong>, et quelque chose de gras. L’adulte qui tient la maison est la seule personne dont la ration ne sera surveillée par personne.</p>
<p class="step"><span class="sn">6</span><strong>Aucune décision irréversible cette nuit.</strong> Rester ou partir se décide à la clarté, sur les critères du <span class="ref">ch. 2</span>. Seule exception : un danger qui ne peut pas attendre.</p>
<h3 class="sub">Rétrécir la journée : ce qui reste et ce qui tombe</h3>
<p class="p0">Seul, on ne fait plus tout. On choisit, et on choisit d’avance, parce qu’à la fin d’une journée seul, on choisit mal.</p>
<table class="tspan"><colgroup><col style="width:27.5%"><col style="width:39.2%"><col style="width:33.3%"></colgroup><thead><tr><th>Ce qui reste, même à bout</th><th>Pourquoi</th><th>Ce qui tombe sans remords</th></tr></thead><tbody><tr><td class="c-item">Le feu, jamais étouffé la nuit</td><td>Le froid et le monoxyde n’attendent pas</td><td>Le rendement, les petites corvées d’entretien</td></tr><tr><td class="c-item">L’eau</td><td>Rien ne la remplace</td><td>L’eau charriée du lac : on fond la neige sur le poêle (<span class="ref">ch. 36</span>, section 9)</td></tr><tr><td class="c-item">Le gras à chaque repas</td><td>Le mal de caribou (section 8)</td><td>La variété, le pain, les repas longs</td></tr><tr><td class="c-item">74 °C au thermomètre ; les gants pour dépouiller le lièvre</td><td>La fatigue ne change rien à ce qui survit dans une viande mal cuite, ni à la tularémie qui entre par une main coupée (section 8, point 4)</td><td>—</td></tr><tr><td class="c-item">Les trois ancrages des enfants : lever, dîner, coucher (<span class="ref">ch. 40</span>, étape 2)</td><td>C’est leur seule mesure de sécurité</td><td>La plage d’école, les jeux organisés, le linge plié</td></tr><tr><td class="c-item">Le signal d’absence, matin et soir, et le sentier entretenu</td><td>C’est ce qui fait venir quelqu’un si l’adulte ne se relève pas (<span class="ref">ch. 36</span>, section 9)</td><td>Les ouvrages d’hiver, jusqu’à ce que ça aille mieux</td></tr><tr><td class="c-item">Dormir</td><td>Après 17 heures debout, on juge comme avec 0,05 d’alcool dans le sang ; après 24 heures, comme avec 0,10</td><td>Tout ce qui se fait « pendant que les enfants dorment » et qui n’est pas dormir</td></tr></tbody></table>
<h3 class="sub">La nuit, sans quart</h3>
<p class="li">On dort dans la même pièce que les enfants.</p>
<p class="li">Le poêle se choisit honnêtement (<span class="ref">ch. 83</span>, étape 22) : accepter un matin froid et rallumer, ou ajouter de la masse autour du poêle, ou se lever une fois pour une petite charge vive. Jamais une grosse charge étouffée pour passer la nuit : c’est elle qui fabrique le monoxyde, et quand un seul adulte dort, l’avertisseur est le seul qui veille.</p>
<p class="li">La sieste, si l’adulte en a besoin, se prend pendant la plage de silence des enfants, l’après-midi (<span class="ref">ch. 40</span>, étape 24) : 15 à 30 minutes, 7 à 9 heures après le lever ; si les nuits sont celles de l’étape 39, 15 à 20 minutes au plus, avant 15 h. C’est le seul moment de la journée où les deux horaires peuvent coïncider.</p>
<p class="li">Les travaux qui blessent se font le matin, reposé, jamais le soir : la fatigue d’une journée seul avec deux enfants s’additionne heure par heure, et une nuit écourtée la fait partir de plus haut le lendemain.</p>
<h3 class="sub">Ce que les enfants savent faire si l’adulte ne se relève pas</h3>
<p class="p0">C’est la partie qui se prépare en septembre (5-A, étape 4) et qui se répète chaque mois comme un jeu, sans dramatiser, trajet jusqu’à l’abri compris. Ce n’est pas faire de l’enfant de 6 ans un soignant (<span class="ref">ch. 40</span>, étape 44) : c’est lui donner trois gestes, dans cet ordre.</p>
<p class="step pk-d"><span class="sn">1</span><strong>Si l’avertisseur crie, ou s’il y a de la fumée ou du feu : on sort tout de suite.</strong> Avant tout le reste, sans essayer de réveiller l’adulte et sans s’habiller : ce qu’on a sur le dos, les sacs de couchage dans les bras, et on va à l’abri (plus bas). Deux minutes à chercher des tuques dans le monoxyde se paient en perte de conscience (<span class="ref">ch. 83</span>, section 8) : on s’habille à l’abri. Pour l’avertisseur, la porte reste grande ouverte derrière soi, et l’air entre jusqu’à l’adulte ; pour le feu, elle se ferme (<span class="ref">ch. 82, 5</span>-F).</p>
<p class="step"><span class="sn">2</span><strong>Réveiller</strong> : secouer l’adulte et crier son nom. S’il ne répond pas, on ne réessaie pas dix fois : on passe au geste suivant.</p>
<p class="step"><span class="sn">3</span><strong>Rester au chaud, dedans, ensemble</strong> : les deux habits de neige, puis les deux enfants dans les sacs de couchage rangés à leur portée (section 4), l’un contre l’autre. On ne touche pas au poêle. On mange ce qui est dans la boîte à hauteur d’enfant — du pemmican (<span class="ref">ch. 72</span>), des biscuits, rien à cuire — et on boit à la gourde qui dort dans le sac. Dehors, c’est le froid qui tue : on ne sort que pour le geste 1.</p>
<p class="p0 ri"><strong class="runin">L’abri.</strong> Il se choisit en septembre et se montre aux enfants : un bâtiment fermé, hors du vent — la remise, le bûcher fermé, le hangar —, assez loin du chalet pour qu’un feu ne l’atteigne pas et assez près pour y arriver pieds nus, au point de rassemblement dehors (<span class="ref">ch. 18</span>, étape 12 ; <span class="ref">ch. 82, 5</span>-F). Dedans : la caisse d’évacuation du <span class="ref">ch. 82</span> — bottes, habits de neige, tuques, mitaines, sacs de couchage, une lampe — ; de quoi s’asseoir hors du plancher ou de la neige nue, parce qu’un corps posé sur la neige perd sa chaleur beaucoup plus vite que dans l’air (<span class="ref">ch. 82</span>, section 9) : un banc, un lit de branches de sapin, un matelas de sol ; et un sifflet. Là, les enfants s’habillent, se mettent à deux dans les sacs et font ce qu’ils savent déjà pour l’enfant perdu : <em>s’asseoir, souffler, rester</em> (<span class="ref">ch. 39</span>, étape 5). Trois coups de sifflet, une pause, trois coups (<span class="ref">ch. 16</span>, étape 5), puis on se tait pour écouter.</p>
<p class="p0 ri"><strong class="runin">On ne rentre pas au chalet : c’est un adulte qui vient chercher les enfants.</strong> Après une alarme, le chalet n’est sûr que quand quelqu’un a lu l’avertisseur, et un enfant ne sait pas le lire (<span class="ref">ch. 83</span>, section 8). Ce qui fait venir quelqu’un : le sifflet, si le voisin est à portée d’oreille, et le signal d’absence, qui manquera au prochain rendez-vous (plus bas). Personne ne peut dire combien de temps deux enfants de 4 et 6 ans tiennent là à −35 °C : un petit corps a beaucoup de peau pour peu de masse et se refroidit plus vite qu’un adulte (<span class="ref">ch. 39</span>, section 3). Ce qui les garde, c’est le bâtiment fermé, les deux ensemble dans les sacs, le corps levé de la neige, et une attente aussi courte que possible : c’est tout le travail du signal réglé plus bas.</p>
<p>Le reste, c’est le voisin qui le fait, et c’est pour ça que le signal d’absence est réglé autrement.</p>
<h3 class="sub">Le signal, réglé pour un adulte seul</h3>
<p class="p0">Il y a deux signaux, et ils ne font pas le même travail. Le signal « venez » (section 4) se fait quand on peut encore le faire, et fait monter le voisin dès qu’il le voit ou l’entend. Le signal d’absence couvre le cas où plus personne n’est en état de rien faire : c’est son absence qui parle. Le <span class="ref">ch. 36</span> règle ce signal d’absence pour deux adultes : la lumière qui manque deux soirs de suite fait monter le voisin. Pour un adulte seul avec deux jeunes enfants, <strong>un seul signal manqué suffit</strong>, parce qu’un adulte absent au signal veut dire deux enfants seuls. Si le voisin voit la fenêtre de chez lui, le signal se fait <strong>deux fois par jour</strong>, matin et soir : le temps le plus long que les enfants pourraient passer seuls devient celui qui sépare deux signaux, plus le trajet du voisin. Et le sentier se tape une fois par semaine même sans raison d’y aller (<span class="ref">ch. 36</span>, section 9) : c’est lui qui rend ce trajet court.</p>
<h3 class="sub">Le chagrin de l’adulte, devant et derrière les enfants</h3>
<p class="li"><strong>Pleurer devant eux n’est pas un échec, à condition de dire ce que c’est</strong> : « Je pleure parce que maman me manque. Ce n’est pas de ta faute. Je vais continuer à m’occuper de vous. » Un enfant lit le visage de l’adulte avant tout le reste (<span class="ref">ch. 40</span>) ; un chagrin nommé lui fait moins peur qu’un chagrin caché qu’il devine. Et les enfants aussi ont le droit d’être tristes, sans qu’on attende d’eux qu’ils soient forts.</p>
<p class="li"><strong>Ce qui ne descend pas jusqu’à eux</strong> : les peurs de l’adulte sur la survie, les décisions à prendre (<span class="ref">ch. 40</span>, étape 49), les confidences. Un enfant de 6 ans à qui l’on confie ses angoisses devient le soutien de l’adulte, et c’est une charge hors de sa portée qui laisse des traces (<span class="ref">ch. 40</span>, étape 44).</p>
<p class="li"><strong>Le chagrin de l’adulte vient souvent la nuit,</strong> quand les enfants dorment et que plus rien n’occupe les mains. C’est là que l’étape 39 s’applique : 15 à 20 minutes, puis se lever, s’asseoir près du poêle, écrire une lettre qui partira au printemps (<span class="ref">ch. 36</span>, point 21), revenir quand le sommeil revient.</p>
<p class="li"><strong>Les anniversaires au calendrier,</strong> pour alléger d’avance les journées qui vont peser.</p>
<h3 class="sub">Le travail qui blesse, fait seul</h3>
<p class="p0">La règle du groupe — jamais de bûchage seul (<span class="ref">ch. 16</span>, étape 18) — ne peut pas tenir ; son mécanisme, lui, tient : quelqu’un doit savoir où l’on est et quand l’on revient. Seul, un adulte blessé laisse deux enfants seuls, et c’est ce qui décide de tout le reste :</p>
<p class="li">on brûle d’abord le bois fendu à l’automne, et on ne bûche que près du chalet, à portée de voix, de jour et reposé ;</p>
<p class="li">le trou dans la glace se fait au plus près du chalet, sur un chemin sondé (<span class="ref">ch. 58</span>) ; on ne traverse plus de glace douteuse, on ne part plus loin en motoneige, on ne chasse plus hors de vue du sentier ;</p>
<p class="li">l’enfant de 6 ans sait où est l’adulte pendant ces travaux, et que si l’adulte n’est pas revenu au repas suivant, on applique les gestes 3 et, s’il le faut, 1 — rester au chaud dedans, et sortir seulement pour l’avertisseur, la fumée ou le feu —, et le signal d’absence manquera ;</p>
<p class="li">on porte moins lourd et on fait plus de voyages : une entorse, seul, ce sont des jours sans eau ni bois.</p>
<h3 class="sub">Mettre du délai entre soi et l’arme</h3>
<p class="p0">L’adulte seul est aussi celui qui peut, un soir, avoir des idées noires, et il n’y a plus personne pour garder la clé. Ce qui reste de la règle, c’est la distance et le temps. Le <span class="ref">ch. 36</span> (section 9) envoie les armes chez le voisin et, s’il n’y a personne où les porter, garde la culasse ou la pièce mobile sur soi et met le reste dans une cache. Pour l’adulte seul, ce chapitre inverse la règle, parce qu’une pièce gardée sur soi ne met aucun délai entre soi et l’arme : c’est la culasse ou la pièce mobile qui va <strong>dans une boîte enfouie sous la neige, loin du sentier</strong>, ou <strong>chez le voisin</strong> avec les armes. Une arme qui ne se défait pas d’un geste va entière chez le voisin ou dans la cache. Un geste sur quatre suit la décision de moins de 5 minutes ; une pièce enfouie ne se récupère pas dans ce temps-là. Si la chasse est nécessaire, la pièce revient pour la chasse et repart après. Les comprimés de la pharmacie se comptent au feutre sur le contenant (<span class="ref">ch. 36</span>, section 9).</p>
<p>Le plan de la prochaine fois (étape 54) se fait aussi pour soi, seul, pendant une bonne journée : ses signes à soi, ce qu’on fait seul pour laisser passer vingt minutes, où aller être avec du monde, qui vient, ce qui s’éloigne. Et la septième question, qui n’est pas facultative ici : les deux raisons de rester, qui dorment dans la même pièce.</p>
<h3 class="sub">Partir ou rester, seul</h3>
<p class="p0">Pas le soir même, pas en plein bouleversement, et jamais sur l’humeur : sur les critères du <span class="ref">ch. 2</span>, à la clarté, avec une date écrite au calendrier. Trois voies réelles : se regrouper avec le voisin (<span class="ref">ch. 18</span>, qui est écrit pour ce cas), descendre à la maison du village où il y a d’autres adultes, ou rester en rétrécissant tout comme plus haut. Rester seul tout un hiver avec deux enfants de 4 et 6 ans n’est pas impossible, mais c’est la voie qui laisse le moins de marge, et elle se choisit en le sachant.</p>
<h3 class="sub">Ce qu’on perd, et ce qui ne se remplace pas</h3>
<p class="li"><strong>La deuxième paire de mains et la deuxième paire d’yeux la nuit.</strong> Rien ne les remplace. On coupe tout ce qui demandait deux personnes, et on ne fait pas semblant du contraire.</p>
<p class="li"><strong>Le tiers.</strong> Personne dans la maison n’est hors du chagrin ni hors des décisions. Le contact de la semaine avec le voisin (<span class="ref">ch. 36</span>, point 20) devient la seule conversation d’adulte : il ne se saute pas.</p>
<p class="li"><strong>L’autre parent, pour les enfants.</strong> La routine les tient ; elle ne le remplace pas. C’est une raison de plus de ne pas rester seul tout l’hiver si une autre voie existe.</p>
<p class="li"><strong>L’avertisseur de monoxyde de carbone.</strong> Quand un seul adulte dort, il est le seul qui veille. Rien de fabricable ne le remplace.</p>
<p class="li"><strong>La marge.</strong> À deux, une erreur se rattrape par l’autre. Seul, chaque erreur se paie par les enfants, et c’est ce qui justifie de rétrécir la journée avant d’y être forcé.</p>
</template>
<template id="notes">
<p class="fn" data-fn="28-1"><span class="fnn">1</span>Chez l’enfant couché calme, torse nu : à chaque inspiration, le bas de la cage thoracique se creuse vers l’intérieur pendant que le haut du ventre se soulève. Ça compte seulement si c’est permanent et bien visible au repos ; un creux qui paraît quand l’enfant pleure ou mange, ou la peau qui se creuse seulement entre les côtes ou au-dessus de la clavicule, ne suffit pas. Chez l’adulte, c’est la peau qui se creuse entre les côtes ou au-dessus des clavicules.</p>
<p class="fn" data-fn="28-2"><span class="fnn">2</span>Les narines s’ouvrent grand à chaque inspiration, comme chez quelqu’un qui vient de courir, alors que la personne est couchée au repos.</p>
<p class="fn" data-fn="28-3"><span class="fnn">3</span>Un son court, répété, comme un petit grognement ou une plainte, à chaque expiration : l’enfant ferme à moitié sa gorge pour garder de l’air dans ses poumons.</p>
<p class="fn" data-fn="28-4"><span class="fnn">4</span>Un son rauque et aigu qu’on entend quand la personne <strong>inspire</strong>, pas quand elle expire. Au repos, il veut dire que le passage de l’air dans la gorge est en train de se fermer.</p>
<p class="fn" data-fn="28-5"><span class="fnn">5</span>Presser fermement le flanc d’un verre transparent sur la tache et regarder à travers. Une tache qui pâlit et disparaît sous la pression est une rougeur ordinaire. <strong>Une tache qui reste visible à travers le verre</strong> est du sang sorti sous la peau. Elle commence souvent en petits points rouges comme des piqûres d’épingle, puis s’étend en taches rouges ou violettes. Sur une peau foncée, on regarde les zones pâles : paumes, plantes des pieds, palais, blanc des yeux, intérieur des paupières. Tous les malades graves n’ont pas de taches : leur absence ne rassure pas.</p>
<p class="fn" data-fn="28-6"><span class="fnn">6</span>La personne couchée ou assise, on lui demande d’amener le menton sur la poitrine, ou on soulève doucement sa tête pour le faire. Une nuque raide résiste : le geste est très douloureux, parfois impossible, alors que tourner la tête de côté l’est beaucoup moins. Le signe se cherche chez l’enfant plus vieux et l’adulte ; le tout-petit peut ne pas l’avoir.</p>
<p class="fn" data-fn="28-7"><span class="fnn">7</span>Le bleu ou le gris se voit d’abord aux lèvres, à la langue, aux gencives et sous les ongles ; sur une peau foncée, aux paumes, aux lèvres, à la langue, aux gencives et autour des yeux. Il apparaît tard, quand il manque déjà beaucoup d’oxygène.</p>
<p class="fn" data-fn="28-8"><span class="fnn">8</span>Une peau tachetée de violet, de gris et de pâle, comme du marbre ; sur une peau foncée, elle se voit mieux aux paumes et à la plante des pieds. Avec la fièvre et des mains et des pieds froids, c’est la circulation qui se ferme à la peau pour garder le sang au centre du corps (<span class="ref">ch. 26</span>, section 8).</p>
<p class="fn" data-fn="28-9"><span class="fnn">9</span>Une fièvre qui dure au moins 5 jours et ne cède pas aux médicaments, le plus souvent chez un enfant de moins de 5 ans, avec plusieurs de ces signes : les yeux rouges <strong>sans écoulement</strong>, apparus au bout d’un ou deux jours ; les lèvres rouges, sèches et fendues, la langue rouge comme une fraise ; les paumes et la plante des pieds rouges ou violacées, les mains et les pieds enflés ; une éruption de taches rouges sur le tronc ; des ganglions enflés au cou. Vers le 10e jour, la peau du bout des doigts pèle.</p>
<p class="fn" data-fn="28-10"><span class="fnn">10</span>Derrière l’oreille, sur l’os qu’on sent en arrière du pavillon : une bosse rouge, chaude, douloureuse au toucher, qui pousse le pavillon vers l’avant et le décolle de la tête. On compare avec l’autre côté, en regardant l’enfant de face puis de derrière. L’enfant est fatigué, irritable, entend moins de ce côté.</p>
<p class="fn" data-fn="28-11"><span class="fnn">11</span>Des gestes brusques, sans but, que l’enfant ne contrôle pas, des mains d’abord, puis des pieds et du visage, avec des grimaces ; ils disparaissent pendant le sommeil. Dans les cas légers, l’enfant a seulement l’air maladroit et peine à s’habiller et à manger. Ils peuvent n’apparaître qu’une fois tous les autres signes disparus.</p>
<p class="fn" data-fn="28-12"><span class="fnn">12</span>L’enfant a une forte fièvre apparue en moins d’une journée, il est anxieux, assis, penché en avant, la bouche ouverte, la salive qui coule parce qu’avaler fait trop mal. Il ne tousse pas et sa voix n’est pas rauque, ce qui le distingue du croup, où la toux aboie. Il refuse de se coucher : c’est sa façon de garder l’air ouvert.</p>
<p class="fn" data-fn="28-13"><span class="fnn">13</span>Un mal de gorge qui s’aggrave au lieu de passer, plus fort d’un côté ; la voix étouffée, comme avec une patate chaude dans la bouche ; la bouche qui n’ouvre plus qu’à moitié parce que les mâchoires se contractent ; à la lampe, un côté du fond de la gorge bombe et pousse la luette — le petit bout de chair qui pend au milieu — vers l’autre côté.</p>
<p class="fn" data-fn="28-14"><span class="fnn">14</span>On demande à la personne de suivre un doigt des yeux, à gauche, à droite, en haut, en bas. Dans l’infection de l’orbite, bouger l’œil fait mal, un œil suit moins bien que l’autre, elle voit le doigt en double ; vu de profil ou d’en haut, l’œil malade dépasse l’autre.</p>
<p class="fn" data-fn="28-15"><span class="fnn">15</span>Aucune urine depuis plus de 8 heures ; pas de larmes quand il pleure ; les yeux enfoncés ; la bouche et la langue sèches ; une soif extrême, ou au contraire un enfant qui ne veut plus boire ; une respiration plus rapide ; étourdi ou confus ; une peau froide et bleutée qui, pincée doucement entre deux doigts, ne reprend pas sa place tout de suite.</p>
<p class="fn" data-fn="28-16"><span class="fnn">16</span>Un vomi vert franc, ou jaune-vert comme de l’herbe écrasée : c’est de la bile. Chez un enfant, c’est un signe qui ne se discute pas, même si le reste a l’air d’une gastro ordinaire.</p>
<p class="fn" data-fn="28-17"><span class="fnn">17</span>Des traînées rouges, chaudes et douloureuses partent de l’infection et remontent le long du bras ou de la jambe, vers l’aisselle ou l’aine, souvent avec fièvre et frissons : l’infection gagne les vaisseaux lymphatiques (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-18"><span class="fnn">18</span>La peau craque sous le doigt quand on appuie, comme s’il y avait des bulles dessous : c’est du gaz que l’infection fabrique. Elle peut aussi virer au bronze, au violet ou au noir et se couvrir de cloques au liquide brun. La douleur est bien plus forte que ce que la peau laisse voir, puis la zone devient insensible (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-19"><span class="fnn">19</span>Le triangle qui va des coins de la bouche jusqu’à la racine du nez, entre les yeux : le nez, la lèvre du haut, les ailes du nez, le creux à côté du nez. Les veines de cette zone se vident vers une grosse veine à la base du crâne, derrière les yeux.</p>
<p class="fn" data-fn="37-1"><span class="fnn">1</span>Une douleur d’angine stable vient à un effort connu, toujours le même, reste courte et passe au repos. Celle qui interdit le sauna est prolongée et vient d’ordinaire au repos. Elle peut annoncer un infarctus : ce signe veut dire que la vie est en jeu, et la chaleur n’a rien à y faire.</p>
<p class="fn" data-fn="37-2"><span class="fnn">2</span>Dans les premières minutes d’un arrêt du cœur, la personne inconsciente fait souvent encore des bouffées : des halètements bruyants, comme un ronflement, de plus en plus espacés, la bouche qui s’ouvre comme celle d’un poisson sorti de l’eau. Ce n’est pas une respiration, c’est le signe de l’arrêt.</p>
<p class="fn" data-fn="38-1"><span class="fnn">1</span>On revit l’événement comme s’il recommençait : on revoit, on entend, parfois on sent la scène, et le corps réagit comme sur le moment — sursaut, cœur qui cogne, sueurs. Ça peut être assez réel pour faire croire qu’on hallucine ou qu’on devient fou. Ce n’est ni l’un ni l’autre : c’est une réaction ordinaire au stress.</p>
<p class="fn" data-fn="38-2"><span class="fnn">2</span>La personne pense sans arrêt à la personne morte, s’ennuie d’elle au point d’avoir mal, reste en colère contre la mort, s’isole, désespère, et n’arrive plus à ressentir quoi que ce soit de bon ni à reprendre ses activités. Elle peut même ressentir dans son corps les malaises que la personne morte avait à la fin de sa maladie. Ce qui distingue ce deuil-là, c’est que rien ne change d’un mois à l’autre.</p>
<p class="fn" data-fn="38-3"><span class="fnn">3</span>Les paroles qui alertent : « je veux en finir », « je vais me tuer », « vous seriez tellement mieux sans moi », « je suis inutile », « j’ai tout raté dans ma vie », « je serais bien mieux mort », « la vie ne vaut pas la peine d’être vécue ». Les comportements : s’isoler ; mettre de l’ordre dans ses affaires ; donner des objets personnels ; s’intéresser aux moyens de s’enlever la vie ; boire ou prendre des médicaments de façon inhabituelle ; être agité ou sans énergie ; écrire un testament ou un message d’adieu ; mal dormir, mal manger ; négliger son apparence et son hygiène ; et surtout, <strong>un regain d’énergie soudain après une période noire</strong>, que l’entourage prend pour une guérison.</p>
<p class="fn" data-fn="38-4"><span class="fnn">4</span>Environ 6 heures après le dernier verre : les mains tremblent, on sue, on a la nausée, mal à la tête. Entre 6 et 48 heures, des convulsions peuvent survenir — la personne tombe, se raidit, puis ses membres se secouent. Entre 12 et 24 heures, certains voient des choses qui n’existent pas. D’habitude entre 48 et 72 heures commence le délire, qui peut tuer : confusion croissante, angoisse, sueurs abondantes, cauchemars, visions qui terrifient, impression que le plancher bouge ou que les murs tombent.</p>
<p class="fn" data-fn="38-5"><span class="fnn">5</span>La vue devient floue, la lumière fait mal aux yeux ; on voit comme à travers une brume ou une peau posée sur l’œil, comme dans une tempête de neige, ou des points qui dansent et des éclairs. Puis la vue baisse, en partie ou au complet. Les pupilles restent grandes même à la lumière.</p>
<p class="fn" data-fn="38-6"><span class="fnn">6</span>Nausée et diarrhée chez quelqu’un qui mange pourtant de la viande maigre à sa faim, avec des repas de plus en plus gros, une faim qui revient au bout de chacun, un ventre tendu et une agitation sans cause. Seul le gras arrête la diarrhée.</p>

  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
