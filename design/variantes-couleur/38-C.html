<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>38 — Le deuil, le choc et la peur des adultes — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}

<body class="vA vB vC t2 lieu-2">
<div id="book"></div>
<template id="open"><header class="open"><div class="open-top"><span>Tome 2 · Le corps</span><span>Chapitre</span></div><div class="open-title"><div class="num">38</div><h1>Le deuil, le choc et la peur des adultes</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span>Chalet</span><span class="on">Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">Le choc frappe là où la famille se trouve, et c’est presque toujours la maison : la nouvelle qui entre par la radio, l’accident sur la 138, la mort d’un parent au village. Là, les voisins sont de l’autre côté de la rue et le rassemblement autour de ceux qui ont perdu quelqu’un se fait tout seul ; il suffit de ne pas le refuser. Ce qui dure — un deuil qui traverse l’hiver, une peur qui ne lâche plus, un couple enfermé avec deux enfants dans une seule pièce chauffée — finit au chalet, et là, tout ce que le village fournissait sans qu’on y pense se fabrique à la main : le rassemblement, l’adieu, le tiers à qui parler, la personne qui prend le relais. Le chapitre 36 monte la structure d’un hiver. Celui-ci traite de ce qui la fait craquer.</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Reconnaître ce qu’une catastrophe, une mort ou une peur qui dure font normalement à un adulte, et tenir — soi, le couple, le groupe — sans funérailles, sans médecin et sans personne à appeler : le choc se compte en heures, ses suites en semaines, le deuil en mois.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h4 class="choix">C’est le bon chapitre quand :</h4>
<p class="li">quelqu’un vient de mourir, ou on vient de l’apprendre, et les heures qui suivent se passent à ne plus savoir quoi faire. La section 5-B est écrite pour être lue à ce moment-là, à voix haute s’il le faut ;</p>
<p class="li">un adulte « n’est plus là » depuis l’événement : il tremble, oublie, fonctionne en automatique, ne dort plus — ou à l’inverse ne s’arrête plus de travailler. Les deux sont des réactions ordinaires, et c’est précisément ce que les gens qui les vivent ignorent : ils croient devenir fous (5-C) ;</p>
<p class="li">on est sans nouvelles de quelqu’un resté ailleurs, et on ne sait pas s’il faut le pleurer (5-E) ;</p>
<p class="li">la peur a pris racine : crises où le cœur s’emballe, sursauts, nuits blanches (5-F, 5-G) ;</p>
<p class="li">le couple ou le groupe se chicane pour des riens, plus fort qu’avant, et les enfants l’entendent (5-H) ;</p>
<p class="li">la réserve d’alcool ou de tabac baisse plus vite que prévu, ou va finir (5-J) ;</p>
<p class="li">un adulte se retrouve seul avec les deux enfants (section 9).</p>
<h4 class="choix">C’est le mauvais chapitre quand :</h4>
<p class="li">le changement est arrivé d’un coup, chez une personne ou plusieurs, dans un chalet ou une maison où quelque chose brûle pour chauffer, et qu’il vient avec mal de tête, nausée ou étourdissement, surtout si ça passe dehors. Le choc, la panique et le chagrin donnent exactement ces signes, et une maisonnée en deuil met tout sur le compte de la peine : c’est du monoxyde de carbone tant qu’on n’a pas trouvé mieux (section 8, point 3). Chez l’enfant, le monoxyde a l’air de la fatigue ou du mauvais caractère, c’est-à-dire de ce qu’on attend d’un enfant en deuil ;</p>
<p class="li">la poitrine serre chez quelqu’un qui n’a jamais fait de crise d’angoisse. La panique donne une douleur à la poitrine, le cœur aussi. Une crise de panique culmine en 10 à 15 minutes ; une douleur qui persiste une fois la personne calmée, qui est venue à l’effort (<span class="ref">ch. 24</span>, section 8, point 1), ou dont on doute de l’origine se traite comme le cœur (<span class="ref">ch. 35</span>), pas avec ce chapitre ;</p>
<p class="li">quelqu’un parle de mourir, donne ses affaires ou remonte d’un coup après des semaines noires. La conduite complète est au <span class="ref">ch. 36</span> (5-F, 5-G et section 9) et passe avant tout ce qui suit. Ce chapitre-ci ajoute les moments où le risque monte et ce qui se fait après la crise (5-I) ;</p>
<p class="li">un adulte a peur d’un autre adulte. Les règles de chicane de la section 5-H supposent deux personnes qui ne se font pas peur ; entre deux personnes dont l’une craint l’autre, elles servent à l’agresseur. C’est une question de sécurité : section 8, point 1 ;</p>
<p class="li">il s’agit des enfants : <span class="ref">ch. 40</span>. Ce chapitre-ci les touche seulement là où ils dépendent de l’adulte qui tient.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0">La plupart des gens se remettent d’une catastrophe et d’une perte, souvent avec le seul soutien de leurs proches, en semaines ou en mois. Les réactions des premiers temps ne sont pas une maladie ; ce qui les rend dangereuses, c’est deux choses : ce qu’on fait pour les fuir — boire, rester couché, s’isoler, travailler sans arrêt — et ce qu’on prend pour elles alors que c’est autre chose — le monoxyde, le cœur, l’envie de mourir. Tout le chapitre tient entre ces deux pièges.</p>
<p>Ce qui aide une personne à traverser se ramène à <strong>cinq choses</strong>, et elles servent de squelette à toute la procédure : se sentir <strong>en sécurité</strong> ; <strong>se calmer</strong> ; se sentir <strong>capable d’agir</strong>, seul et à plusieurs ; être <strong>relié</strong> à d’autres ; garder <strong>de l’espoir</strong>. Aucune ne demande un professionnel. Toutes se fabriquent au chalet, avec des gestes précis : le corps et les armes mis à l’abri pour la sécurité, la respiration et la pause pour le calme, une tâche vraie pour la capacité, le voisin et le rassemblement pour le lien, une date au calendrier pour l’espoir.</p>
<p>Deux réflexes naturels sont mauvais, et le livre les retourne. Le premier : « il faut que ça sorte », faire raconter l’événement en détail à tout le monde, tout de suite. Évaluée sérieusement, la séance où l’on fait tout raconter une fois, peu après l’événement, ne prévient ni le stress post-traumatique, ni l’anxiété, ni la dépression, et deux des six effets mesurés allaient dans le mauvais sens : on la déconseille fermement. Écouter qui veut parler, oui ; faire parler qui ne veut pas, non. Le second : le comprimé pour dormir de la pharmacie. Les benzodiazépines ne sont pas indiquées pour les symptômes de stress ni pour le sommeil dans le premier mois après un événement : rien ne prouve qu’elles aident, elles pourraient allonger le temps de rétablissement, et l’organisme s’y habitue.</p>
<p>Le troisième ressort est le temps. Une crise suicidaire est souvent courte : chez des survivants de tentatives presque mortelles, <strong>un sur quatre</strong> avait mis moins de 5 minutes entre la décision et le geste, près de la moitié moins de 20, et sept sur dix moins d’une heure. Ce qui s’interpose pendant ce temps-là — une culasse absente, une personne dans la pièce — laisse passer la crise. C’est tout le fondement de la règle des clés du <span class="ref">ch. 36</span>.</p>
<p>Reste le territoire. L’effort physique réduit les symptômes d’anxiété et de dépression : le bois, l’eau, la raquette ne sont pas seulement des corvées, ce sont les traitements qui restent quand il n’y a plus rien à la pharmacie. Le travail qui nourrit se voit, se mesure et se termine, ce que le chapitre 36 organise en « ouvrages ». Et la taille du groupe compte : jusqu’aux années 1950, les Innus du Labrador passaient neuf mois par année sur le territoire en groupes de trois à cinq couples avec leurs enfants. Aujourd’hui encore, sur le territoire, la nourriture se partage et les peines aussi : quand quelque chose arrive, on se rassemble autour de la famille qui souffre. Deux adultes seuls n’ont personne qui ne soit pas partie à leurs chicanes ni personne pour prendre le relais d’un deuil ; c’est le défaut structurel que les sections 5-D, 5-H et 9 compensent.</p>
<p>Un dernier fait, qui va contre l’intuition : le risque suicidaire n’est pas au plus haut au fond de l’hiver. Dans l’hémisphère nord, il est au plus bas en décembre-janvier et au plus haut en avril-mai ; au Canada, la semaine la plus haute de l’année dépasse la plus basse de 20 à 30 %, et l’écart est plus grand dans les climats froids. Le mécanisme n’est pas établi ; une des explications avancées est la plus utile au chalet : au printemps, les autres se remettent à vivre, on attendait un recommencement, et celui qui ne remonte pas mesure l’écart. La débâcle n’est pas la fin de la surveillance (5-I).</p>

ent</td><td>Ça dure : chacune de ces fuites empire ce qu’elle soulage (5-J)</td></tr></tbody></table>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Ce chapitre se pratique presque sans objets. Ce qu’il demande, ce sont des gestes et quelques décisions prises en septembre.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Avertisseur de monoxyde de carbone à piles</td><td>1 dans la pièce de l’appareil à combustion + 1 près des chambres (<span class="ref">ch. 36</span>)</td><td><strong>Aucune.</strong> Aucun sens humain ne détecte ce gaz, et ses symptômes sont ceux du chagrin et de l’angoisse (section 8)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Montre ou horloge à trotteuse</td><td>1</td><td>Chandelle graduée pendant qu’il reste une montre qui marche (<span class="ref">ch. 36</span>, <span class="ref">ch. 40</span>). Sans rien : la pause d’une chicane se compte en gestes — un seau puisé, une brassée rentrée —, jamais à l’humeur</td><td>Oui</td></tr><tr><td class="c-item">Contenant gradué réservé à l’alcool du jour, si un adulte dépend de l’alcool (5-A, étape 3)</td><td>1</td><td>Bouteille marquée d’un trait de feutre par jour ; pot de verre encoché à la lime. Ce qui compte : la dose se voit, et c’est l’autre adulte qui verse (5-J)</td><td><span class="non">NON</span> <span class="negx">si un adulte dépend de l’alcool</span></td></tr><tr><td class="c-item">Marque de tombe : planche de bois dur, pieu équarri ou pierre plate</td><td>1 par mort</td><td>Nom et dates gravés au couteau, brûlés au fer rouge, grattés à la pointe dans la pierre. Plus haute que la neige de mars : une tombe qu’on ne retrouve pas au printemps n’a pas été marquée</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Signal d’absence quotidien convenu avec le voisin</td><td>1 (<span class="ref">ch. 36</span>, section 9)</td><td>Lumière à une fenêtre, drapeau au bout d’une perche, fumée à heure fixe. Ce qui compte : son <strong>absence</strong> fait monter le voisin, une fois le signal manqué et pas avant (section 9)</td><td><span class="non">NON</span> <span class="negx">si un adulte est seul</span></td></tr><tr><td class="c-item">Signal « venez » convenu avec le voisin</td><td>1 (<span class="ref">ch. 16</span>, étape 5 ; <span class="ref">ch. 36</span>, point 7)</td><td>Trois coups, une pause, trois coups, au sifflet, à la corne ou sur un chaudron ; de nuit, deux feux à quelques pas l’un de l’autre (<span class="ref">ch. 16</span>, section 9). Ce qui compte : il fait monter le voisin <strong>dès qu’il le voit ou l’entend</strong>, sans attendre un signal manqué (section 8, point 1)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Sacs de couchage des enfants, rangés à leur portée</td><td>1 par enfant</td><td>Couvertures empilées et un habit de neige : ce qui compte, c’est qu’un enfant de 6 ans puisse s’y mettre seul, avec son frère ou sa sœur (section 9)</td><td><span class="non">NON</span> <span class="negx">si un adulte est seul</span></td></tr><tr><td class="c-item">Boîte de nourriture sans cuisson, à hauteur d’enfant, et une gourde d’eau par enfant</td><td>1 boîte ; 1 gourde par enfant</td><td>Pemmican (<span class="ref">ch. 72</span>), biscuits, fruits séchés ; un pot à couvercle vissé fait la boîte. La gourde dort dans le sac de couchage : si le poêle s’éteint, l’eau d’un pichet gèle, pas celle du sac (section 9)</td><td><span class="non">NON</span> <span class="negx">si un adulte est seul</span></td></tr><tr><td class="c-item">Abri des enfants, dehors : bâtiment fermé hors du vent, avec la caisse d’évacuation du <span class="ref">ch. 82</span> et un sifflet</td><td>1</td><td>Remise, bûcher fermé, hangar ; à défaut, la caisse seule, au point de rassemblement (<span class="ref">ch. 82, 5</span>-F). Dedans, de quoi s’asseoir hors du plancher ou de la neige : banc, lit de branches de sapin, matelas de sol (section 9)</td><td><span class="non">NON</span> <span class="negx">si un adulte est seul</span></td></tr></tbody></table>
<p class="p0">Le verrouillage des armes, le coffre de la pharmacie, le calendrier mural et la liste au mur sont déjà au <span class="ref">ch. 36</span> ; ils servent ici sans être recopiés. Ce qui s’achète est au <span class="ref">ch. 00b</span>.</p>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — En septembre, pendant que tout va bien</h3>
<p class="step"><span class="sn">1</span><strong>Nommer à voix haute, entre adultes, les chicanes qu’on sait qui viendront, et décider maintenant comment elles se tranchent.</strong> Elles sont toujours les mêmes : qui décide de partir et sur quels critères (<span class="ref">ch. 2</span>) ; la réserve de plaisir — café, sucre, tabac, alcool — et qui y touche (<span class="ref">ch. 36</span>) ; qui fait l’eau et le bois, et qui fait la maison ; le bruit et le sommeil dans une seule pièce ; en groupe, qui reprend l’enfant d’une autre famille, et ce qu’on doit au voisin (<span class="ref">ch. 16</span>). Une chicane tranchée en septembre revient en février comme un rappel ; non tranchée, elle revient comme un procès.</p>
<p class="step"><span class="sn">2</span><strong>Convenir d’un mot de pause</strong> (5-H). Un mot, le même pour tout le monde, qui arrête une discussion sans qu’on ait à expliquer pourquoi. Il se choisit à froid et se respecte sans négociation, sinon il ne vaut rien.</p>
<p class="step pk-d"><span class="sn">3</span><strong>Si un adulte dépend de l’alcool, le dire et compter.</strong> Le signe : il se sent mal quelques heures après son dernier verre — mains qui tremblent, sueurs, nausée, mal de tête —, ou il boit beaucoup depuis longtemps. La réserve d’un buveur dépendant ne se calcule pas jusqu’à la dernière bouteille : elle se calcule jusqu’à la fin d’une descente (5-J), parce que l’arrêt brutal peut tuer (section 8, point 2). Décider qui verse.</p>
<p class="step"><span class="sn">4</span><strong>Décider, à deux, ce qui se passe si l’un des deux meurt ou part.</strong> Qui reste avec les enfants, où va le corps en attendant le dégel (<span class="ref">ch. 35, 5</span>-F), vers qui on se regroupe (<span class="ref">ch. 18</span>), quel signal part, et ce que l’enfant de 6 ans sait faire si l’adulte restant ne se relève pas, abri dehors compris (section 9). Ça s’apprend comme un jeu, et ça se répète une fois par mois avec les gestes du mois (<span class="ref">ch. 36</span>, point 22).</p>
<p class="step"><span class="sn">5</span><strong>Apprendre les deux gestes de la panique aux deux adultes</strong> : la respiration et le retour au présent (étape 9). On les apprend calme ; en pleine crise, on ne retient rien de nouveau.</p>
<h3 class="sub">B — Les premières heures, après le choc</h3>
<p class="step pk-d"><span class="sn">6</span><strong>Le corps d’abord.</strong> Blessures, froid, puis eau et sucre si la personne est bien éveillée : somnolente, confuse ou qui vomit, elle ne boit pas (<span class="ref">ch. 35, 5</span>-D, étape 2). En état de choc, une blessure peut ne pas faire mal sur le moment : on regarde au lieu de demander. Dans un bâtiment qui chauffe par combustion, une personne étourdie ou nauséeuse — une seule suffit —, c’est dehors avant de parler (section 8, point 3).</p>
<p class="step"><span class="sn">7</span><strong>Un seul adulte calme, voix basse, phrases courtes.</strong> Le calme se transmet ; l’agitation aussi. Dire à la personne qu’elle est en sécurité <strong>si c’est vrai</strong>, jamais sinon, et qu’on reste.</p>
<p class="step"><span class="sn">8</span><strong>Ne pas faire raconter.</strong> Écouter si la personne parle, aussi longtemps qu’elle veut. Ne pas lui demander de détailler, ni d’expliquer, ni d’analyser ce qui s’est passé, ni de dire ce qu’elle ressent. C’est l’inverse du réflexe, et c’est la section 3 qui dit pourquoi.</p>
<p class="step"><span class="sn">9</span><strong>La panique se traverse en respirant, pas en discutant.</strong> Le cœur cogne, le souffle manque, la poitrine serre, on sue, la tête tourne, on a mal au cœur, et la personne est souvent convaincue qu’elle va mourir, perdre la tête ou s’évanouir. Ça monte à un sommet en 10 à 15 minutes et ça redescend. Deux gestes :</p>
<p class="li l2"><strong>respirer</strong> : inspirer lentement par le nez en sentant l’air remplir les poumons, expirer doucement par la bouche ; l’aidant respire avec elle, à voix haute ;</p>
<p class="li l2"><strong>revenir au présent</strong> par les sens : « Qu’est-ce que tu vois ? Qu’est-ce que tu entends ? Qu’est-ce que tu sens sous tes mains ? » Une question à la fois, des réponses concrètes : le poêle, le bois qui craque, la table.</p>
<p class="stepc">Si la douleur à la poitrine persiste une fois la personne calmée, si elle est venue à l’effort (<span class="ref">ch. 24</span>, section 8, point 1), ou si c’est la première de sa vie, elle se traite comme le cœur (<span class="ref">ch. 35</span>), quelle que soit sa durée : dans le doute, c’est le cœur.</p>
<p class="step"><span class="sn">10</span><strong>Une tâche dans l’heure.</strong> Courte, vraie, qui se termine et se voit : rentrer une brassée, faire chauffer l’eau, allumer les lampes. C’est la capacité d’agir de la section 3, et c’est le geste qui coupe la sidération. <strong>Jamais</strong> une tâche dangereuse : ni scie à chaîne, ni glace, ni arme, ni conduite (<span class="ref">ch. 36</span>, point 35).</p>
<p class="step"><span class="sn">11</span><strong>Relier.</strong> Les enfants apprennent la nouvelle d’un adulte, en mots exacts, et reçoivent une tâche liée (<span class="ref">ch. 40, 5</span>-E). À la maison, on laisse entrer les voisins qui viennent. Au chalet, le signal « venez » part le soir même (<span class="ref">ch. 36</span>, point 7 ; <span class="ref">ch. 16</span>, étape 5), pas le signal d’absence, qui ne fait monter le voisin qu’une fois manqué : un voisin qui sait ne sert à rien s’il apprend au printemps.</p>
<p class="step"><span class="sn">12</span><strong>Aucune décision qui ne se défait pas, ce soir-là.</strong> Ni partir, ni vendre, ni brûler, ni jeter. Seules exceptions : ce qui ne peut pas attendre — le feu, le corps (<span class="ref">ch. 35</span>), un danger réel (<span class="ref">ch. 2</span>).</p>
<p class="step pk-d"><span class="sn">13</span><strong>Pas de benzodiazépine pour dormir ou se calmer pendant le premier mois.</strong> Ce sont par exemple le lorazépam, le diazépam, l’oxazépam : le nom est écrit sur la boîte. Le traitement qu’une personne prenait <strong>avant</strong> pour autre chose continue comme prescrit ; ce qui est visé, c’est le comprimé qu’on sort de la pharmacie pour passer la nuit après un choc ou une mort. L’interdit ne vise pas le sevrage d’alcool : pour lui, c’est au contraire cette classe de médicament qui sert de traitement (section 8, point 2). Et un calmant ou un somnifère, prescrit ou acheté sans ordonnance, pris avec l’alcool du soir, ralentit la respiration (étape 56).</p>
<p class="step"><span class="sn">14</span><strong>La première nuit : dormir où on peut, tous ensemble si ça aide.</strong> Un lit devenu vide se quitte pour quelques nuits ; changer le lit de place aide certains. Le sommeil reviendra mal : c’est prévu (5-G).</p>
<h3 class="sub">C — Les jours et les semaines qui suivent</h3>
<p class="step"><span class="sn">15</span><strong>Dire une fois, à voix haute, ce qui est normal.</strong> Se sentir engourdi, fonctionner en automatique, refuser d’y croire ; oublier, mal se concentrer, perdre le fil ; dormir mal, manger mal ; sentir un serrement dans la poitrine ; être en colère, contre tout ; se sentir coupable d’avoir survécu ou de n’avoir rien pu empêcher ; ne plus se sentir en sécurité nulle part ; devenir hypervigilant et surprotéger les enfants ; avoir peur que ça recommence. Savoir que c’est ordinaire enlève la peur de devenir fou, qui est la moitié du poids.</p>
<p class="step"><span class="sn">16</span><strong>Remettre la journée en place</strong> : lever à l’heure, trois repas, dehors tous les jours (<span class="ref">ch. 36, 5</span>-B). Pas parce qu’on en a envie ; parce que la routine est un des facteurs qui font tenir, et qu’elle se reprend avant l’envie.</p>
<p class="step"><span class="sn">17</span><strong>Bouger tous les jours, et fort.</strong> Le bois, l’eau, la raquette. L’effort réduit l’anxiété et la tristesse ; au chalet, c’est le traitement qui ne s’épuise pas.</p>
<p class="step"><span class="sn">18</span><strong>Les images qui reviennent</strong> (tableau de la section 3) : on ne les combat pas, on revient au présent par les sens (étape 9). Elles doivent s’espacer. Si elles ne s’espacent pas un mois après, on le marque d’un trait au calendrier, et ça pèse dans la décision de rester ou de descendre, comme un critère que ce chapitre ajoute à ceux du <span class="ref">ch. 2</span>.</p>
<p class="step"><span class="sn">19</span><strong>Ce qui dit que ça dépasse une réaction ordinaire</strong> : plus d’une semaine sans dormir, avec confusion ; la personne ne mange plus et ne se lave plus alors que la nourriture et l’eau sont là, ou ne s’occupe plus des enfants ; elle agit de façon imprévisible et destructrice ; elle menace de se faire du mal ou d’en faire aux autres ; elle boit de plus en plus. On passe alors au 5-I et au <span class="ref">ch. 36</span>.</p>
<h3 class="sub">D — Quand quelqu’un meurt : le deuil sans funérailles</h3>
<p class="step"><span class="sn">20</span><strong>Le corps n’est pas ce chapitre.</strong> S’assurer que c’est bien une mort, l’heure, le froid, l’attente du dégel, l’enterrement provisoire : <span class="ref">ch. 35, 5</span>-F et 9-E. Et une personne froide n’est pas morte tant qu’elle n’a pas été réchauffée (<span class="ref">ch. 35</span>).</p>
<p class="step"><span class="sn">21</span><strong>Faire l’adieu dans les jours qui suivent, même si l’enterrement attend le printemps.</strong> Il n’y a ni salon, ni église, ni service ; l’adieu, lui, ne dépend d’aucun des trois, et il se prépare à sa façon. Ce qui le fait tenir : tout le monde est là, les enfants compris, avec une tâche (<span class="ref">ch. 40, 5</span>-E) ; le nom et les dates sont dits à voix haute ; chaque adulte dit une chose vraie sur la personne ; les enfants apportent un dessin ou un objet ; si la famille prie, elle prie, et si elle chante, elle chante ; puis on mange ensemble. Un adieu fait en février et un enterrement fait en mai sont deux moments, pas un adieu remis à plus tard.</p>
<p class="step"><span class="sn">22</span><strong>Écrire sur la chose même.</strong> Le nom et les dates se gravent sur la marque de la tombe ou de l’endroit où le corps attend, pas dans un cahier (section 4). C’est le seul registre qui survivra, et le seul qu’on retrouvera.</p>
<p class="step"><span class="sn">23</span><strong>Une arme de plus est entrée dans le système des clés.</strong> La carabine de la personne morte est une arme dont plus personne ne se sent responsable. Elle rejoint le jour même le verrouillage du <span class="ref">ch. 36</span>, la culasse ou la pièce mobile retirée, munitions ailleurs.</p>
<p class="step"><span class="sn">24</span><strong>Garder un objet ; se servir du reste.</strong> Au chalet, les mitaines, le couteau, les outils de la personne morte servent, et s’en servir ne la trahit pas, pas plus que souffrir moins. On garde une chose qui ne sert à rien, et celle-là ne sert à personne d’autre.</p>
<p class="step"><span class="sn">25</span><strong>Nommer qui reprend ses tâches.</strong> Chaque tâche de la personne morte a un nouveau titulaire, dit à voix haute (<span class="ref">ch. 18</span>, étape 8 ; <span class="ref">ch. 40</span>, étape 41). Une tâche orpheline se fait en retard, et chaque retard rappelle l’absence.</p>
<p class="step"><span class="sn">26</span><strong>Le deuil vient par vagues.</strong> Il n’a pas de durée fixe et pas d’ordre. Il revient aux anniversaires, qu’on inscrit au calendrier mural pour qu’ils n’arrivent pas par surprise. Quand la mort était attendue après une longue maladie, le soulagement du moment est ordinaire, et la peine peut arriver des mois plus tard, quand on mesure que c’est définitif.</p>
<p class="step"><span class="sn">27</span><strong>La culpabilité et la colère font partie du deuil.</strong> « J’aurais dû voir », « c’est ma faute », la colère contre le sort, contre Dieu, contre la mort elle-même. Elles se disent ; elles ne se discutent pas. Contre la culpabilité, un seul argument vaut la peine d’être répété : ce qu’on sait maintenant, on ne le savait pas le jour même.</p>
<p class="step"><span class="sn">28</span><strong>Le deuil se fait à plusieurs.</strong> Sur le territoire, on se rassemble autour de la famille qui souffre (section 3). Au chalet, le voisin monte, une famille regroupée prend les tâches pour quelques jours (<span class="ref">ch. 18</span>), et le contact de la semaine continue même quand on n’a rien à dire (<span class="ref">ch. 36</span>, point 20). Ne pas s’isoler complètement ; ne pas non plus s’interdire d’être seul.</p>
<p class="step"><span class="sn">29</span><strong>Six mois.</strong> On marque la date au calendrier. Si, six mois après la mort, rien n’a bougé (note 2), ce n’est plus un deuil ordinaire. Au chalet, le critère ne commande pas un traitement qu’on n’a pas : il pèse dans la décision de rester ou de descendre à la maison du village, où il y a d’autres adultes, comme un critère que ce chapitre ajoute à ceux du <span class="ref">ch. 2</span>.</p>
<h3 class="sub">E — Sans nouvelles : quand on ne sait pas s’il faut pleurer</h3>
<p class="step"><span class="sn">30</span><strong>Nommer la chose.</strong> Quand on ne sait pas si une personne est morte ou vivante — les parents restés en ville, le fils parti chercher de l’aide, l’adulte évacué qui n’a pas donné signe de vie —, le deuil ordinaire ne peut pas commencer, et l’incertitude use sans relâche. On appelle ça une perte ambiguë. Le nom compte : il dit que ce qu’on vit est une chose connue, et pas une faiblesse de ne pas « passer à autre chose ».</p>
<p class="step"><span class="sn">31</span><strong>Fixer quand on cherchera, et s’y tenir.</strong> Les nouvelles une fois par jour, à heure fixe, pas toute la journée à attendre un nom (<span class="ref">ch. 36</span>, point 13) ; une date pour la prochaine tentative de contact. Entre les deux, on s’occupe de ce qui est à portée. La question reste ouverte ; la vie, elle, ne peut pas rester en suspens.</p>
<p class="step"><span class="sn">32</span><strong>Aux enfants, « on ne sait pas » est une réponse vraie</strong>, et c’est la seule qui tiendra (<span class="ref">ch. 40</span>, étape 13). Ce qu’on sait — qui s’occupe d’eux, où on dort, ce qu’on mange — se répète autant de fois qu’ils le demandent.</p>
<p class="step"><span class="sn">33</span><strong>Écrire ce qu’on aurait à dire à la personne</strong> — les lettres qui partiront au printemps (<span class="ref">ch. 36</span>, point 21). Si elle revient, elle les lira ; sinon, elles auront été dites.</p>
<h3 class="sub">F — La peur qui dure et l’anxiété</h3>
<p class="step"><span class="sn">34</span><strong>Ce qui aide :</strong> l’effort physique quotidien (étape 17) ; une tâche qui change quelque chose de réel ; la routine tenue ; les nouvelles une fois par jour et pas plus (<span class="ref">ch. 36</span>) ; quelqu’un à qui parler qui n’est pas partie à la peur (<span class="ref">ch. 36</span>, point 20) ; et se rappeler ce qui a marché la dernière fois qu’on a traversé une mauvaise passe.</p>
<p class="step"><span class="sn">35</span><strong>Ce qui empire, en ayant l’air d’aider :</strong> boire pour oublier ; rester couché ; s’isoler parce que tout paraît insurmontable ; et, le moins connu, <strong>se tenir occupé sans arrêt</strong> pour ne pas penser. Le premier jour, travailler du matin au soir ressemble à du courage ; la troisième semaine, c’est une fuite, et elle finit en épuisement à une époque où l’épuisement coûte un doigt dans une scie. S’y ajoutent la vigilance qui ne se relâche jamais — recompter le stock, ne plus laisser les enfants hors de vue — et la prise de risques : la motoneige menée trop vite, la glace douteuse traversée quand même.</p>
<p class="step"><span class="sn">36</span><strong>Changer l’inquiétude en liste de gestes.</strong> Au conseil de maison (<span class="ref">ch. 36</span>, point 18), chaque peur se dit, puis se trie en deux : ce qu’on peut faire cette semaine, et ce qu’on ne peut pas faire. La première moitié reçoit un nom et un jour ; la deuxième se dit à voix haute et s’arrête là. Une peur qui a un geste attaché pèse moins qu’une peur qui tourne en rond.</p>
<p class="step"><span class="sn">37</span><strong>La crise de panique qui revient</strong> se traite comme la première (étape 9). L’autre adulte reste, parle bas, respire à voix haute, et ne discute pas le contenu de la peur pendant la crise : on en parlera après, à la clarté.</p>
<h3 class="sub">G — L’insomnie</h3>
<p class="step"><span class="sn">38</span><strong>Les premières nuits après une mort ou un choc,</strong> mal dormir est ordinaire. On se couche quand même, on se relève si on veut, et on ne prend pas de benzodiazépine (étape 13).</p>
<p class="step"><span class="sn">39</span><strong>Quand l’insomnie s’installe, on applique le contrôle du stimulus :</strong></p>
<p class="li l2">se coucher quand on a <strong>sommeil</strong> — bâillements, paupières lourdes —, pas quand on est fatigué ;</p>
<p class="li l2">si le sommeil n’est pas venu au bout de <strong>15 à 20 minutes</strong>, ou si on s’est réveillé et qu’il ne revient pas, <strong>se lever</strong> sans regarder l’heure, aller ailleurs — au chalet, la chaise près du poêle, à la lumière la plus faible — et faire quelque chose de calme ; revenir au lit quand le sommeil revient. Autant de fois qu’il le faut ;</p>
<p class="li l2">se lever <strong>à la même heure</strong> tous les matins, quelle qu’ait été la nuit (<span class="ref">ch. 36</span>, point 8) ;</p>
<p class="li l2">pas de sieste si on peut s’en passer : la nuit en a besoin. Si on tombe de sommeil — pas seulement de fatigue —, <strong>15 à 20 minutes</strong> au plus, <strong>avant 15 h</strong>.</p>
<p class="stepc">C’est dur les premières nuits, et c’est ce qui défait l’habitude du lit où l’on ne dort pas.</p>
<p class="step"><span class="sn">40</span><strong>Un verre fait tomber plus vite ; boire plus brise la deuxième moitié de la nuit.</strong> Le tabac qui finit brise le sommeil pendant <strong>une semaine</strong> ; le café le soir aussi.</p>
<p class="step"><span class="sn">41</span><strong>La boisson chaude du soir se fait au sapin baumier (<em>Abies balsamea</em>) ou à l’épinette blanche (<em>Picea glauca</em>), jamais au cèdre (thuya, <em>Thuja occidentalis</em>).</strong> Il contient de la thuyone, qui donne des convulsions ; aucune dose sûre n’a pu être établie pour ce livre, donc l’espèce est écartée plutôt que dosée (<span class="ref">ch. 20</span>, <span class="ref">ch. 33</span>).</p>
<p class="step"><span class="sn">42</span><strong>Plus d’une semaine sans dormir, avec confusion,</strong> dépasse l’insomnie ordinaire : 5-I, et d’abord le tour du monoxyde — un mal de tête au lever, chez une personne ou plusieurs, qui passe une fois dehors, est un cas du <span class="ref">ch. 83</span> avant d’être un cas de moral.</p>
<h3 class="sub">H — La colère, le couple et le groupe enfermés</h3>
<p class="step"><span class="sn">43</span><strong>Vérifier le corps avant le caractère.</strong> La colère est attendue après une perte. Mais trois choses la fabriquent de toutes pièces, et on les écarte avant de juger quelqu’un : le <strong>tabac qui finit</strong>, qui rend irritable pendant <strong>2 à 4 semaines</strong> ; le <strong>manque de sommeil</strong> — après 17 heures debout, on réagit comme avec 0,05 d’alcool dans le sang (<span class="ref">ch. 36</span>) ; et la <strong>faim</strong>.</p>
<p class="step"><span class="sn">44</span><strong>Commencer par une demande, pas par un reproche.</strong> Une conversation difficile finit presque toujours comme elle commence : dans 96 % des cas, ses trois premières minutes en donnent l’issue. Une ouverture en critique ou en sarcasme finit mal. « J’ai besoin qu’on parle de l’eau : je la fais seul depuis dix jours » se règle ; « tu fais jamais rien » ne se règle pas. Une seule chose à la fois.</p>
<p class="step pk-t"><span class="sn">45</span><strong>Le mot de pause, et la règle des vingt minutes.</strong> Quand le cœur dépasse <strong>100 battements par minute</strong>, on n’entend plus ce que l’autre dit, si fort qu’on essaie. Le pouls se prend au poignet, sous la base du pouce, avec l’index et le majeur posés à plat, compté 15 secondes et multiplié par 4. Il ne vaut qu’au repos, assis depuis une dizaine de minutes : au retour du bois ou de l’eau, un cœur à plus de 100 dit l’effort, pas la chicane. Sans montre, on se fie au cœur qu’on sent cogner et à la voix qui monte. Celui qui le sent dit le mot convenu (étape 2), et la discussion s’arrête sur-le-champ. La pause dure <strong>au moins 20 minutes</strong>, le temps que le corps redescende, <strong>à faire autre chose</strong> : une pause passée à préparer sa réplique ne calme rien. Celui qui a demandé la pause dit quand on reprend. Deux règles déjà écrites tiennent par-dessus : aucune chicane ne se règle après le souper (<span class="ref">ch. 36</span>, point 15), et personne ne sort fâché dans le froid (<span class="ref">ch. 36</span>, section 8, point 6).</p>
<p class="step"><span class="sn">46</span><strong>Guetter l’ordre dans lequel un couple se défait :</strong> la critique, puis le mépris, puis la défensive, puis le mur — l’un des deux ne répond plus, se ferme, attend que ça passe. Le sarcasme n’est pas de l’humour : c’est déjà du mépris, et une discussion qui s’ouvre sur lui finit mal (étape 44). En face, les <strong>tentatives de réparation</strong> : une blague, une main sur l’épaule, « on recommence ». Elles se font maladroitement, et elles s’acceptent même maladroites ; un couple qui refuse les réparations de l’autre est un couple en panne (section 7).</p>
<p class="step"><span class="sn">47</span><strong>Ce qui ne se dit pas devant les enfants se dit ailleurs, pas à voix basse devant eux</strong> : chuchoter devant eux est pire que se parler normalement ailleurs, parce qu’ils entendent le ton sans les mots (<span class="ref">ch. 40</span>, étape 49).</p>
<p class="step"><span class="sn">48</span><strong>En groupe, un nom par domaine</strong> (<span class="ref">ch. 18</span>, étape 8), et la chicane entre deux familles se règle entre les deux adultes qui ont autorité sur la chose, pas devant tout le monde. Dans un groupe, il y a presque toujours quelqu’un qui n’est pas partie à la chicane : c’est lui qui préside la discussion. C’est l’avantage que deux adultes seuls n’ont pas (section 3).</p>
<p class="step pk-d"><span class="sn">49</span><strong>Quand la colère devient une menace :</strong> ne pas rester seul avec la personne ; garder une distance ; surveiller ce qu’elle a à portée de main — hache, couteau, arme ; ne pas la toucher ; parler bas, lentement, sans provoquer, et lui dire fermement qu’elle ne fera de mal à personne, ni à elle-même. Si l’alcool est dans la pièce, c’est la section 8, point 1.</p>
<h3 class="sub">I — Quelqu’un qui décroche</h3>
<p class="step pk-d"><span class="sn">50</span><strong>Les signes et la conduite complète sont au <span class="ref">ch. 36</span></strong> (5-F, 5-G, section 7, section 8, point 1, section 9) : poser directement la question, ne pas garder le secret, verrouiller avant de parler, présence continue<sup class="fnr" data-fn="38-3">3</sup>. Ce chapitre-ci ajoute ce qui les entoure.</p>
<p class="step"><span class="sn">51</span><strong>Les moments où le risque monte :</strong></p>
<p class="li l2"><strong>après une perte</strong>, et aux anniversaires de la perte ;</p>
<p class="li l2"><strong>le soir d’une chicane, avec de l’alcool.</strong> Chez des survivants de coups de feu tirés contre eux-mêmes, six sur dix environ reliaient leur geste à une chicane avec leur partenaire ou leur famille ; la plupart étaient des hommes jeunes, sans dépression importante, et le geste avait presque toujours été impulsif. Dans un autre groupe, six sur dix aussi avaient eu une chicane dans les 24 heures précédentes. L’absence de dépression visible ne protège pas ;</p>
<p class="li l2"><strong>au printemps.</strong> Le pic est en avril-mai, pas en février (section 3). Quand la maisonnée revit avec la débâcle, celui qui ne remonte pas voit l’écart. On ne relâche pas la surveillance parce que la lumière revient.</p>
<p class="step"><span class="sn">52</span><strong>Pourquoi le délai marche :</strong> un geste sur quatre suit la décision de moins de 5 minutes, près de la moitié de moins de 20, et sept sur dix de moins d’une heure. Une culasse ou une pièce mobile gardée sur l’autre adulte (<span class="ref">ch. 36</span>, section 9), ou, pour l’adulte seul, enfouie dans une boîte sous la neige loin du sentier (section 9 de ce chapitre), ne se récupère pas en cinq minutes : chaque minute qu’il faut pour l’avoir est une minute où la crise peut passer.</p>
<p class="step"><span class="sn">53</span><strong>Poser la question soulage.</strong> La crainte de « donner l’idée » retient bien des gens, et elle est fausse : la plupart des gens qui y pensent se sentent soulagés et compris quand on leur demande. Après la réponse, on écoute sans discuter si c’est bien ou mal, on ne promet pas le secret, et on ne laisse pas la personne seule.</p>
<p class="step pk-d"><span class="sn">54</span><strong>Le plan de la prochaine fois.</strong> Il se fait <strong>après</strong> la crise, quand la personne va mieux, à deux, à voix haute. S’il s’écrit, c’est sur une seule carte que la personne garde sur elle. Six questions, dans l’ordre : 1. <em>Mes signes à moi</em> : à quoi ça ressemble quand ça commence — une pensée, une humeur, un geste. C’est le signal pour sortir le plan. 2. <em>Ce que je fais seul pour laisser passer</em> : une corvée qui occupe les mains, dedans, ou dehors de jour et à portée de vue, n’importe quoi qui fait passer vingt minutes. Pas de sortie seul la nuit avec ces idées-là : dans le froid, le jugement lâche avant la douleur (<span class="ref">ch. 36</span>, section 8, point 6). 3. <em>Où je vais être avec du monde sans rien dire</em> : jouer avec les enfants, aller chez le voisin. 4. <em>À qui je le dis, avec les mots</em> : « ça revient ». L’autre adulte s’engage à répondre sans drame et sans reproche. 5. <em>Qui vient si ça ne passe pas</em> : le voisin et le signal convenu (<span class="ref">ch. 16</span>, <span class="ref">ch. 36</span>, point 7), à la place de la ligne d’aide qui n’existe pas. 6. <em>Ce qui s’éloigne</em> : la culasse ou la pièce mobile, les munitions, les comprimés comptés (<span class="ref">ch. 36</span>, section 9).</p>
<p class="stepc">Et une septième, facultative, que la personne dit elle-même : <em>mes raisons de rester</em> — les enfants par leur nom, ce qu’on fera au printemps.</p>
<p class="step"><span class="sn">55</span><strong>Garder en sécurité sans ligne d’aide</strong> : <span class="ref">ch. 36</span>, section 9, « Garder quelqu’un en danger ». Tout y est ; rien ne se recopie ici.</p>
<h3 class="sub">J — L’alcool, le tabac et la fuite</h3>
<p class="step"><span class="sn">56</span><strong>Ce que l’alcool fait vraiment au chalet.</strong> L’ivresse est une cause majeure de blessures par violence et de suicide : c’est le soir arrosé qui tue. Bu en quantité, l’alcool freine le deuil et fabrique de l’anxiété ; il brise aussi la deuxième moitié de la nuit (étape 40). Pris avec un calmant ou un somnifère, il ralentit la respiration (étape 13). Et dehors, il donne une fausse chaleur en ouvrant les vaisseaux de la peau (<span class="ref">ch. 25</span>).</p>
<p class="step"><span class="sn">57</span><strong>Qui dépend de l’alcool ne s’arrête pas d’un coup.</strong> Le corps d’un buveur dépendant (étape 3) s’est ajusté à l’alcool ; quand celui-ci disparaît, le sevrage commence en quelques heures et peut aller jusqu’à la mort<sup class="fnr" data-fn="38-4">4</sup>. Ça arrive quand la réserve finit, quand la bouteille est mise sous clé, ou quand la personne décide d’arrêter le jour même. La descente se fait ainsi : 1. <strong>une semaine à dose fixe</strong>, versée par l’autre adulte, mesurée dans le contenant gradué ; 2. puis, <strong>tous les quatre jours, environ 10 % de la dose de départ en moins</strong>, en marches égales : à 10 verres par jour, 9 pendant quatre jours, puis 8, et ainsi de suite jusqu’à zéro ; 3. si les tremblements, les sueurs, la nausée ou le mal de tête reviennent, c’est trop vite : on <strong>remonte</strong> jusqu’à la dose où ils disparaissent, on <strong>tient une semaine</strong>, puis on descend d’une marche <strong>par semaine</strong>.</p>
<p class="stepc">La réserve d’un buveur dépendant se calcule donc jusqu’à la fin de cette descente, pas jusqu’à la dernière bouteille (étape 3). Le calcul, pour 10 verres par jour : une semaine à 10, puis quatre jours à chaque marche de 9 à 1, soit 70 + 4 × 45 = <strong>250 verres sur 43 jours</strong>. C’est un plancher : une remontée ajoute sa semaine et fait passer chaque marche qui reste de quatre jours à sept. Pendant toute la descente, il boit beaucoup d’eau. La règle des clés du <span class="ref">ch. 36</span> ne veut pas dire « couper » : elle veut dire que c’est l’autre qui verse.</p>
<p class="stepc">S’il convulse malgré tout : noter l’heure ; le coucher sur le côté, loin de ce qui cogne et du poêle ; ne pas le retenir ; rien entre les dents ; le garder sur le côté après. Ce sont les gestes du <span class="ref">ch. 28</span> (étape 13), et ils valent pour l’adulte. Plus de 5 minutes, ou une deuxième crise dans les 5 minutes : la vie est en jeu. Pendant et après une crise, il ne boit que bien éveillé (<span class="ref">ch. 35, 5</span>-D, étape 2).</p>
<p class="step pk-d"><span class="sn">58</span><strong>Le cas qui n’a pas de solution au chalet :</strong> quelqu’un qui a déjà fait des convulsions ou vu des choses qui n’existent pas en arrêtant de boire. Pour lui, même une descente est dangereuse, et il n’y a rien pour traiter la crise si elle vient, à moins que la pharmacie ait ce qu’il faut (section 8, point 2). C’est une raison de ne pas hiverner au chalet, qui se pèse en septembre, pas en février : un critère que ce chapitre ajoute à la décision de rester ou partir (<span class="ref">ch. 2</span>).</p>
<p class="step"><span class="sn">59</span><strong>Le tabac qui finit</strong> rend irritable <strong>2 à 4 semaines</strong>, laisse sans énergie et affamé aussi longtemps, et brise le sommeil <strong>une semaine</strong>. Chaque envie ne dure que <strong>quelques minutes</strong> : elle se laisse passer en sortant, en buvant de l’eau, en s’occupant les mains. La date où la réserve finira se dit d’avance à toute la maisonnée, pour que l’humeur de la troisième semaine soit lue comme un sevrage et non comme un caractère (étape 43).</p>
<p class="step"><span class="sn">60</span><strong>Les fuites qui ne ressemblent pas à des fuites :</strong> le travail sans fin, le lit, l’isolement, la prise de risques (étape 35). Elles se reconnaissent à une chose : elles soulagent sur le moment et empirent à la semaine. Celle qui les voit en premier, c’est l’autre adulte ; la personne touchée est souvent la dernière à s’en rendre compte. D’où l’importance de le dire, en une phrase, au conseil de maison.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:16.4%"><col style="width:23.2%"><col style="width:21.0%"><col style="width:39.4%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Première heure après le choc</td><td>Blessures, froid, eau ; mal de tête, nausée, étourdissement chez quiconque est à l’intérieur, enfants compris</td><td>Regardées, pas demandées ; aucun mal de tête ni nausée sans cause</td><td>Mal de tête ou nausée, chez une personne ou plusieurs : dehors, section 8, point 3</td></tr><tr><td class="c-item">Crise de panique</td><td>Durée de la montée</td><td>Sommet en <strong>10 à 15 minutes</strong>, puis descente</td><td>Douleur à la poitrine qui persiste une fois la personne calmée, venue à l’effort, ou la première de sa vie : <span class="ref">ch. 35</span>, quelle que soit sa durée</td></tr><tr><td class="c-item">Premier mois après le choc</td><td>Benzodiazépine pour dormir ou se calmer après le choc</td><td><strong>Zéro</strong></td><td>Arrêter ; le traitement prescrit avant pour autre chose continue. Le sevrage d’alcool n’est pas visé (section 8, point 2)</td></tr><tr><td class="c-item">Chaque chicane</td><td>Pouls de celui qui parle</td><td>Sous <strong>100</strong> battements par minute</td><td>Mot de pause ; <strong>20 minutes au moins</strong>, à faire autre chose</td></tr><tr><td class="c-item">Chaque chicane</td><td>Les trois premières minutes</td><td>Une demande, pas un reproche</td><td>Arrêter et recommencer par la demande</td></tr><tr><td class="c-item">Chaque nuit, une fois l’insomnie installée</td><td>Temps éveillé au lit</td><td><strong>15 à 20 minutes</strong>, pas plus</td><td>Se lever, aller ailleurs, revenir quand le sommeil revient</td></tr><tr><td class="c-item">Chaque jour</td><td>Sommeil</td><td>Pas plus d’<strong>une semaine</strong> d’insomnie avec confusion</td><td>5-I, et le tour du monoxyde (<span class="ref">ch. 83</span>)</td></tr><tr><td class="c-item">Chaque jour, adulte en deuil</td><td>Tâche vraie faite ; repas avec du gras</td><td>Oui ; oui</td><td>Non deux jours de suite : 5-C, étape 19 ; section 8, point 4</td></tr><tr><td class="c-item">Un mois après le choc</td><td>Images qui reviennent</td><td>De moins en moins fréquentes</td><td>Trait au calendrier ; pèse dans la décision de rester ou de descendre (5-C, étape 18)</td></tr><tr><td class="c-item">En continu</td><td>Humeur basse sans deuil pour l’expliquer</td><td>Moins de <strong>2 semaines</strong></td><td>Seuil de la dépression : <span class="ref">ch. 36, 5</span>-E</td></tr><tr><td class="c-item">Six mois après la mort</td><td>Le deuil bouge-t-il ?</td><td>Oui, même un peu</td><td>Non : note 2 ; pèse dans la décision de rester ou de descendre (5-D, étape 29)</td></tr><tr><td class="c-item">Buveur dépendant, tous les quatre jours</td><td>Dose versée</td><td><strong>10 %</strong> de la dose de départ en moins, environ</td><td>Tremblements, sueurs : remonter, tenir <strong>1 semaine</strong>, puis une marche <strong>par semaine</strong></td></tr><tr><td class="c-item">Tabac fini</td><td>Irritabilité</td><td>S’éteint d’habitude en <strong>2 à 4 semaines</strong></td><td>Si ça dure bien au-delà, chercher une autre cause ; section 7</td></tr><tr><td class="c-item">Avril-mai</td><td>Surveillance de l’adulte qui a traversé un deuil ou une crise</td><td>Maintenue</td><td>On ne relâche pas parce que les autres vont mieux</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:35.9%"><col style="width:21.2%"><col style="width:42.9%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Mal de tête, nausée, étourdissements, chez une personne ou plusieurs, mis sur le compte du chagrin, meilleurs dehors ; un enfant mou, fatigué, de mauvais caractère</td><td><strong>Monoxyde de carbone jusqu’à preuve du contraire</strong></td><td>Section 8, point 3 : sortir, aérer, trouver la cause avant de rallumer (<span class="ref">ch. 83</span>)</td></tr><tr><td class="c-item">Douleur ou serrement à la poitrine qui persiste une fois la personne calmée, qui est venu ou revient à l’effort, ou le premier de sa vie</td><td>Se traite comme le cœur tant qu’on ne sait pas, quelle que soit sa durée</td><td><span class="ref">Ch. 35</span> ; <span class="ref">ch. 24</span>, section 8, point 1</td></tr><tr><td class="c-item">Tout le monde demande à la personne de « raconter ce qui s’est passé », encore et encore</td><td>Le réflexe qui nuit</td><td>Arrêter. Écouter qui parle ; ne faire parler personne (5-B, étape 8)</td></tr><tr><td class="c-item">Depuis la mort, un adulte travaille du matin au soir et ne s’arrête plus</td><td>Fuite par le travail</td><td>Le dire en une phrase au conseil de maison ; imposer une heure sans travail par jour ; lui retirer d’abord la scie à chaîne s’il est épuisé (<span class="ref">ch. 36</span>, point 35)</td></tr><tr><td class="c-item">Un adulte reste couché, ne mange plus, ne s’occupe plus des enfants</td><td>La réaction dépasse l’ordinaire</td><td>5-C, étape 19 ; 5-I ; <span class="ref">ch. 36</span></td></tr><tr><td class="c-item">On boit un peu plus chaque soir depuis l’événement</td><td>Fuite, et risque de la section 8, point 1</td><td>Contenant gradué, l’autre verse (5-J) ; armes verrouillées avant le soir</td></tr><tr><td class="c-item">Mains qui tremblent, sueurs, nausée quelques heures après la dernière bouteille</td><td><strong>Sevrage alcoolique</strong></td><td>Remonter à la dose sans signes s’il en reste, puis la descente de l’étape 57. S’il n’en reste plus : présence continue tant que les signes durent, et au moins trois jours, puisque le délire commence d’habitude entre 48 et 72 heures — trois jours sont un plancher, pas une fin ; rien de dangereux à portée ; de l’eau s’il est bien éveillé ; s’il convulse, les gestes de l’étape 57 ; convulsions et confusion sont des signes du <span class="ref">ch. 35</span> (5-B, étape 6). Section 8, point 2, pour la pharmacie et pour le lave-glace</td></tr><tr><td class="c-item">Chicanes pour des riens depuis que le tabac est fini</td><td>Sevrage de nicotine, <strong>2 à 4 semaines</strong></td><td>Le nommer ; marcher ; attendre la fin de la vague</td></tr><tr><td class="c-item">Sarcasme, roulement d’yeux, l’un des deux ne répond plus</td><td>Le couple suit l’ordre critique, mépris, défensive, mur</td><td>Mot de pause ; recommencer par une demande ; accepter les tentatives de réparation (5-H)</td></tr><tr><td class="c-item">Les tentatives de réparation — la blague, la main tendue — sont refusées</td><td>Le couple est en panne, pas un des deux</td><td>Conseil de maison forcé, contact extérieur (<span class="ref">ch. 36</span>) ; rotation des tâches</td></tr><tr><td class="c-item">Un adulte a peur d’un autre adulte</td><td>Ce n’est pas une chicane</td><td>Section 8, point 1. Les règles de la section 5-H ne s’appliquent pas</td></tr><tr><td class="c-item">Au printemps, la maisonnée revit et un adulte ne remonte pas, ou se calme d’un coup</td><td>Le moment où le risque est au plus haut</td><td>Question directe, règle des clés, présence (<span class="ref">ch. 36</span>)</td></tr><tr><td class="c-item">Rien ne bouge six mois après la mort</td><td>Deuil prolongé (note 2)</td><td>5-D, étape 29</td></tr><tr><td class="c-item">La journée d’un anniversaire, tout s’effondre à nouveau</td><td>Une vague, attendue</td><td>Rien à corriger. La date était au calendrier ; on allège la journée</td></tr><tr><td class="c-item">Les enfants ne parlent plus jamais de la personne morte</td><td>Ils ont compris que ça fait mal aux adultes</td><td><span class="ref">Ch. 40, 5</span>-E : en reparler, devant eux, avec les mots exacts</td></tr></tbody></table>
