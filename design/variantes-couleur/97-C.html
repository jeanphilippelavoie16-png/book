<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>97 — Allonger la saison — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}

<body class="vA vB vC t5 lieu-c">
<div id="book"></div>
<template id="open"><header class="open"><div class="open-top"><span>Tome 5 · La forêt, le jardin et le chalet</span><span>Chapitre</span></div><div class="open-title"><div class="num">97</div><h1>Allonger la saison</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span class="on">Chalet</span><span>Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">Les semis d’avril se font là où l’on vit en avril : à la maison si on y est encore, au chalet sinon. La méthode ne change pas ; seule la lumière change (<span class="ref">§5-C</span>).</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Allonger la saison, c’est enlever à chaque bout de l’été la poignée de nuits de gel qui le ferme — par le fumier qui fermente, le verre qui garde le soleil, l’eau qui gèle et la toile qui cache le ciel — pour gagner plusieurs semaines sur une saison sans gel qui tombe à 87 à 96 jours une année sur dix sur la côte ; ça ne conserve rien, ça fait mûrir ce qui, autrement, ne mûrirait pas.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<p class="p0 ri"><strong class="runin">Le bon choix.</strong> Pour les espèces qui tiennent <em>presque</em> dans la saison : la tomate (<em>Solanum lycopersicum</em>), la courge (<em>Cucurbita pepo</em>), le concombre (<em>Cucumis sativus</em>), le haricot (<em>Phaseolus vulgaris</em>), le chou d’automne (<em>Brassica oleracea</em>). Pour elles, trois semaines de plus changent une récolte nulle en récolte. Aux deux bouts de l’été, et pas au milieu : la saison est fermée par très peu de nuits. À Sept-Îles, juin compte en moyenne 1,5 nuit de gel et septembre 3,9, et plus des deux tiers de ces nuits restent entre 0 et −2 °C à la station — l’ordre de ce qu’une toile ou un plastique retiennent, sachant que le rang, plus bas, est plus froid (<span class="ref">§3</span>). Garder ces nuits-là, c’est garder l’essentiel de septembre, qui apporte à lui seul les trois quarts de la chaleur de juin (<span class="ref">§3</span>). Reste, en septembre, environ une nuit de gel sur trois qui descend sous −2 °C : là, la couverture devient un pari. Par nuit claire et calme : c’est le gel que les couvertures arrêtent. Et quand quelqu’un est au chalet matin et soir, parce que tout ce qui se ferme sur une plante s’ouvre aussi.</p>
<p class="p0 ri"><strong class="runin">Le mauvais choix.</strong> Quand le froid arrive avec le vent et les nuages, une masse d’air froid qui entre, plutôt que par une nuit claire : le vent emporte la chaleur que la toile devait garder, la température descend bien sous ce qu’une couverture retient, et la protection devient un pari. Ce soir-là, on ne couvre plus, on récolte (<span class="ref">§9</span>). Pour le maïs sucré (<em>Zea mays</em>) en plein air : dans un été frais et court, il ne mûrit que sous plastique transparent. Pour une couche chaude montée avec un petit tas de fumier vieilli : un petit tas chauffe mal et refroidit vite, et un fumier qui a déjà chauffé ne chauffe plus seul. Pour une serre adossée sous le bord d’un toit qui déverse sa neige : la neige qui glisse la crève.</p>
<p class="p0 lab kh"><strong class="runin">Ce que chaque moyen gagne, et ce qu’il coûte.</strong></p>
<table class="tspan"><colgroup><col style="width:18.5%"><col style="width:20.1%"><col style="width:37.1%"><col style="width:24.2%"></colgroup><thead><tr><th>Moyen</th><th>Ce qu’il fait</th><th>Ce qu’il gagne</th><th>Ce qu’il coûte</th></tr></thead><tbody><tr><td class="c-item">Le site : pente, lac au vent, abri du nord (<span class="ref">§5-A</span>)</td><td>Évite le lac d’air froid des creux</td><td>C’est la protection la plus importante de toutes</td><td>Rien, une fois choisi. Mal choisi, rien ne le rattrape</td></tr><tr><td class="c-item">Toile sèche, drap, sapinage, la nuit (<span class="ref">§5-E</span>)</td><td>Cache le ciel au sol qui rayonne</td><td>Juste les quelques degrés d’une nuit claire</td><td>Deux gestes par jour. Mouillée, elle refroidit</td></tr><tr><td class="c-item">Agrotextile (couverture flottante)</td><td>Même chose, et il reste posé des semaines</td><td>Léger : 1 à 2 °C, sans garantie. Moyen : 2 à 3 °C. Lourd : jusqu’à 4 °C, mais il ne laisse passer que 30 à 50 % de la lumière</td><td>Il se déchire à l’ongle, au sabot, au piquet</td></tr><tr><td class="c-item">Plastique sur arceaux (tunnel)</td><td>Une serre de 35 cm de haut</td><td>Fermé, sans trou : de 1 °C (plastique mince) à 5 °C (épais). Des jeunes légumes ont passé −2 °C quelques heures dessous. Percé ou fendu pour l’aération : environ 1 °C seulement, d’où les trous bouchés les soirs de gel (<span class="ref">§5-E</span>)</td><td>Fermé, il dépasse 54 °C en une heure de soleil</td></tr><tr><td class="c-item">Châssis froid vitré (<span class="ref">§5-D</span>)</td><td>La même serre, avec du verre et un coffre</td><td>Plusieurs semaines d’avance sur les plants au moment du repiquage</td><td>L’aération, chaque matin de soleil</td></tr><tr><td class="c-item">Couche chaude au fumier (<span class="ref">§5-B</span>)</td><td>Chauffe le terreau par en dessous</td><td>Un terreau entre 10 et 29 °C sous vitre, en avril, quand dehors il gèle encore</td><td>Du fumier frais en quantité, une semaine à la monter, un thermomètre</td></tr><tr><td class="c-item">Paillis de plastique transparent (<span class="ref">§5-D</span>)</td><td>Laisse entrer le soleil dans le sol et l’y garde</td><td>Environ 4 à 8 °C de plus dans le sol ; le noir, 2 à 3 °C</td><td>Les mauvaises herbes poussent dessous. <strong>Jamais sur les pommes de terre</strong> (<span class="ref">§8</span>)</td></tr><tr><td class="c-item">Baril ou bidon d’eau (<span class="ref">§5-F</span>)</td><td>Gèle avant la plante, et chauffe en gelant</td><td>334 kJ par litre qui prend en glace, rendus lentement, seulement quand l’air descend sous zéro</td><td>Il en faut beaucoup, et au soleil le jour</td></tr><tr><td class="c-item">Semis dans la maison (<span class="ref">§5-C</span>)</td><td>Fait la levée avant que la terre dégèle</td><td>Une récolte quatre à six semaines plus tôt qu’un semis en pleine terre</td><td>La lumière, qui manque en avril</td></tr></tbody></table>
<p class="p0">Ce qui ne se trouve pas ici : le jardin lui-même, le sol, le compost, l’eau et la clôture (<span class="ref">ch. 95</span>) ; la terre à fabriquer (<span class="ref">ch. 96</span>) ; garder la semence (<span class="ref">ch. 100</span>) ; le fumier des bêtes (<span class="ref">ch. 101</span>) ; ce qu’on fait de la récolte une fois sauvée (<span class="ref">ch. 78, 79</span> et 80).</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">La saison est courte en jours, et beaucoup plus courte en chaleur.</strong> Sur la côte, la saison sans gel dure 109 à 113 jours une année sur deux, et tombe à 87 jours ou moins une année sur dix à Sept-Îles (96 à Baie-Comeau). Mais les jours ne disent pas tout. Au-dessus de 5 °C, Sept-Îles accumule environ 1 040 degrés-jours<sup class="fnr" data-fn="97-1">1</sup> par an, Montréal 2 250 : moins de la moitié. Au-dessus de 10 °C, le seuil où les légumes venus des pays chauds commencent à souffrir, Sept-Îles en reçoit 410 et Montréal 1 320 : moins du tiers. En juillet, le mois le plus chaud, environ deux nuits sur cinq descendent à 10 °C ou moins. C’est pour ça que le chou, la carotte (<em>Daucus carota</em> subsp. <em>sativus</em>) et la pomme de terre (<em>Solanum tuberosum</em>) prospèrent et que la tomate, le haricot et le concombre peinent en plein air : ce qui manque à ces trois-là, ce n’est pas des jours, c’est des degrés.</p>
<p class="p0 ri"><strong class="runin">La saison est fermée par quelques nuits, pas par un mur.</strong> De 1991 à 2020 (depuis 1994 à Longue-Pointe-de-Mingan), juillet est le seul mois sans aucun gel aux quatre stations de la côte ; août en a connu (−1,0 °C à Sept-Îles le 27 août 2006). Mais la plupart des gels de juin et de septembre sont faibles, entre 0 et −2 °C sous abri, et le tissu d’un légume récolté ne commence à geler qu’un peu sous zéro : vers −0,2 °C pour la laitue, −1,4 °C pour la carotte, −2 °C pour l’ail. Passer ces nuits couvert, c’est rouvrir des semaines entières de chaleur utile de part et d’autre : septembre vaut à Sept-Îles 150 degrés-jours au-dessus de 5 °C, contre 196 en juin.</p>
<p class="p0 ri"><strong class="runin">Le gel qui tue au jardin vient d’en haut, pas du vent.</strong> Par nuit claire, calme et sèche, le sol rayonne sa chaleur vers un ciel très froid. L’air se refroidit d’abord au ras du sol, devient plus lourd, coule dans les creux et s’y empile, le plus froid en bas. Deux conséquences qu’on ne devine pas. D’abord, le gel des normales se lit à hauteur d’homme, sous abri ; un plant de 20 cm vit plus bas, dans l’air le plus froid de la nuit. Ensuite, l’absence de gelée blanche ne rassure pas : quand l’air est très sec, la température passe sous zéro sans que le givre se forme. Ce gel « noir » fait <strong>plus</strong> de dégâts que la gelée blanche, parce que la glace qui se dépose sur les feuilles, en se formant, libère un peu de chaleur.</p>
<p class="p0 lab kh"><strong class="runin">On n’a que quatre sources de chaleur, et chaque méthode en exploite une.</strong></p>
<p class="li"><em>Le sol.</em> Il se charge le jour et rend la nuit. Un sol nu, tassé et humide en garde et en rend le plus. Un sol fraîchement bêché est plein d’air, qui conduit mal : il est plus froid la nuit. Un paillis organique ou de l’herbe entre les rangs l’empêche de se charger le jour : même résultat. D’où le paradoxe : le paillis qui garde le frais en juillet rend la nuit plus froide en septembre.</p>
<p class="li"><em>Le soleil derrière une vitre.</em> Le verre et le plastique laissent entrer la lumière et gardent la chaleur qu’elle fait en touchant le sol. Ils la gardent si bien qu’une heure de soleil suffit à monter l’air sous un couvert fermé au-delà de 54 °C. Une serre ou un châssis se ferme contre le froid et s’ouvre contre le soleil, tous les jours.</p>
<p class="li"><em>Le fumier qui fermente.</em> Un tas de fumier frais, mêlé de litière, chauffe parce que ses microbes mangent. Monté en couche sous un châssis, il chauffe le terreau par en dessous pendant qu’il gèle dehors. C’est la seule source des quatre qui travaille la nuit sans avoir été chargée le jour.</p>
<p class="li"><em>L’eau qui gèle.</em> Un litre d’eau qui prend en glace rend 334 kJ, et il les rend à 0 °C. Mais il les rend lentement, par la surface du contenant, et seulement quand l’air autour est plus froid que lui : c’est une réserve, pas une chaufferette. Par degré, à poids égal, l’eau garde environ cinq fois plus de chaleur que le granit.</p>
<p class="p0 ri"><strong class="runin">Les anciens le savaient sans les chiffres.</strong> La couche chaude au fumier de cheval, le châssis vitré, le paillasson de paille qu’on roulait sur les couches le soir, l’ados, la bande de terre inclinée vers le sud où les maraîchers faisaient passer l’hiver aux laitues : chacun exploite une de ces sources. L’ados en est l’exemple le plus simple. Une planche de terre relevée de 32 cm sur 1,28 m fait face au sud avec une pente d’environ 14°. Aux équinoxes, le soleil de midi est à 40° au-dessus de l’horizon à Sept-Îles ; sur l’ados, il frappe comme s’il était à 54°, soit environ un quart de soleil de plus par mètre carré, sans rien acheter.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Seulement ce que demandent les procédures de ce chapitre. Ce qui s’achète d’avance : <span class="ref">ch. 00b</span>.</p>

<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — Lire la saison et le terrain</h3>
<p class="step"><span class="sn">1</span><strong>Les dates.</strong> Les normales de 1991 à 2020, aux stations de la côte :</p>
<table class="tspan"><colgroup><col style="width:10.2%"><col style="width:15.5%"><col style="width:13.2%"><col style="width:18.1%"><col style="width:15.3%"><col style="width:14.8%"><col style="width:12.9%"></colgroup><thead><tr><th>Station</th><th>Il gèle encore, une année sur deux, le… ou après</th><th>…une année sur dix, le… ou après</th><th>Il gèle déjà, une année sur deux, le… ou avant</th><th>…une année sur dix, le… ou avant</th><th>Saison sans gel, une année sur deux</th><th>…une année sur dix, au plus</th></tr></thead><tbody><tr><td class="c-item">Sept-Îles</td><td>31 mai</td><td>11 juin</td><td>19 septembre</td><td>4 septembre</td><td>111 jours</td><td>87 jours</td></tr><tr><td class="c-item">Baie-Comeau</td><td>27 mai</td><td>11 juin</td><td>17 septembre</td><td>4 septembre</td><td>113 jours</td><td>96 jours</td></tr><tr><td class="c-item">Natashquan</td><td>27 mai</td><td>12 juin</td><td>18 septembre</td><td>6 septembre</td><td>109 jours</td><td>93 jours</td></tr></tbody></table>
<p class="stepc">Havre-Saint-Pierre n’a pas de normales de gel. Longue-Pointe-de-Mingan, sa voisine à l’ouest, compte en moyenne 3,3 nuits de gel en juin et 6,3 en septembre (mesures de 1995 à 2020) : plus du double de Sept-Îles en juin, une fois et demie en septembre. Natashquan, plus à l’est encore, n’en compte que 0,6 et 2,1. Ce n’est donc pas l’est de la côte qui gèle plus, c’est un endroit : deux stations voisines ne se ressemblent pas, et seul le thermomètre au ras des plants (étape 2) dit à laquelle ressemble le terrain. <strong>On plante pour la mauvaise année</strong> (<span class="ref">ch. 41</span>) : c’est elle qui décide des variétés (<span class="ref">§5-H</span>), pas la moyenne.</p>
<p class="step"><span class="sn">2</span><strong>Mettre le thermomètre là où vit la plante</strong>, à 20 ou 30 cm du sol, pas au mur du chalet. Celui d’une station est à hauteur d’homme ; par nuit claire, le rang est plus froid. Un minimum-maximum dit le matin jusqu’où la nuit est descendue au ras des plants.</p>
<p class="step"><span class="sn">3</span><strong>Lire la carte du froid du terrain une fois, le matin de la première gelée blanche.</strong> Là où le givre couvre tout, l’air froid s’accumule ; là où il n’y en a pas, il coule plus loin. Cinq minutes, avant que le soleil efface tout, et on sait où monter la couche et où ne rien planter de tendre.</p>
<p class="step"><span class="sn">4</span><strong>Ne pas barrer la descente de l’air froid.</strong> Sur une pente, l’air froid coule comme de l’eau. Une clôture pleine, un mur de branchages serrés ou un talus <strong>en bas</strong> du jardin l’arrêtent et le font s’empiler derrière eux, sur les plants. Laisser le bas de la clôture ajouré, ou une brèche au point le plus bas. En haut de la pente, au contraire, un obstacle détourne l’air froid qui descendrait sur le jardin.</p>
<p class="step"><span class="sn">5</span><strong>Profiter de ce qui est déjà là.</strong> Un grand lac ou le fleuve au vent diminue la fréquence des gels. Un rocher ou une rangée d’arbres voisins rendent de la chaleur la nuit, mais peuvent aussi retenir l’air froid : la gelée blanche du point 3 dit lequel des deux l’emporte ici. Le pied d’un mur ou d’une clôture de planches exposés au sud, à l’abri du nord, est la meilleure place du terrain pour la couche et le châssis.</p>
<p class="step"><span class="sn">6</span><strong>Travailler la terre tôt, jamais à la veille d’une nuit de gel.</strong> Une terre qu’on vient de bêcher est pleine d’air, et plus froide la nuit. Si elle vient d’être travaillée, la tasser au dos de la bêche ou au rouleau, puis l’arroser.</p>
<h3 class="sub">B — La couche chaude au fumier</h3>
<p class="p0">La couche chaude fait lever en avril, sous vitre, ce qui ne lèverait pas dehors avant juin. Elle sert surtout à faire des <strong>plants</strong>, qu’on repique ensuite au jardin.</p>
<p class="step"><span class="sn">7</span><strong>À l’automne, creuser la fosse</strong>, tant que la terre n’est pas gelée : en avril, elle l’est. Au moins 46 cm de profondeur, environ 90 cm plus large que le coffre pour pouvoir rechausser, sur un endroit élevé et bien égoutté, au sud d’un mur, d’un bâtiment ou d’une clôture de planches jointes. Un lit de 10 cm de gros gravier au fond draine et aère. Couvrir la fosse pour l’hiver, planches et feuilles, sinon elle se remplit de neige et ses parois gèlent : on la déneige avant de charger. Préparer en même temps le terreau : terre de jardin mêlée d’un quart à un tiers de fumier <strong>bien pourri</strong>, mise en tas pour l’hiver.</p>
<p class="step"><span class="sn">8</span><strong>Le coffre.</strong> Madriers, l’arrière au moins 15 cm plus haut que le devant : la pluie s’écoule et les plants voient plus de ciel. Largeur intérieure un peu plus courte que le châssis pour qu’il porte sur les bords : 173 cm (5 pi 8 po) pour un châssis de 91 × 183 cm (3 × 6 pi), sinon la mesure de la vieille fenêtre qu’on a. Coins renforcés, sinon le coffre s’affaisse (<span class="ref">ch. 110</span>). Le coffre doit pouvoir se soulever.</p>
<p class="step"><span class="sn">9</span><strong>Faire chauffer le fumier avant de charger.</strong> Frais, pas froid, pas pourri, jamais déjà chauffé ; le fumier de cheval est le meilleur. Le mettre en tas près de la fosse, tassé et couvert : un petit tas chauffe mal et refroidit vite. Dès qu’il fume, le retourner pour l’homogénéiser. Il est prêt quand il rechauffe franchement, cinq ou six jours après. Un fumier très pailleux chauffe lentement, puis trop fort plus tard. Mêler au neuf du vieux fumier mouillé, qui a déjà perdu son feu, donne une chaleur plus douce et qui dure plus longtemps.</p>
<p class="step"><span class="sn">10</span><strong>Charger.</strong> Pelleter le fumier par lits successifs, secoué à la fourche pour le mélanger, chaque lit tassé avant le suivant. Épaisseur : <strong>60 à 75 cm</strong> pour une couche faite tôt, quand il gèle encore la nuit — 26 nuits d’avril sur 30 à Sept-Îles ; 30 cm seulement pour une couche montée par temps doux. Poser le coffre, remettre 10 à 15 cm de fumier tassé dedans, puis <strong>rechausser</strong> : du fumier empilé contre l’extérieur du coffre jusqu’en haut, sur 30 à 38 cm de large. Il empêche le froid d’entrer par les côtés, et c’est lui qui garde la couche. Les maraîchers d’autrefois faisaient cette ceinture en vieux fumier court, plus large, 40 à 50 cm : c’est l’<em>accot</em>.</p>
<p class="step"><span class="sn">11</span><strong>Deux ou trois jours fermée</strong>, châssis posés et couverts de volets de planches ou de paillassons. Puis ouvrir, retasser le fumier, l’égaliser, et étendre <strong>13 à 15 cm de terreau</strong> : trop plutôt que pas assez, parce que le fumier se tasse encore. Le terreau doit arriver presque au bord bas du coffre : plus les plants sont près de la vitre, plus ils sont trapus.</p>
<p class="step"><span class="sn">12</span><strong>Attendre que le coup de feu passe.</strong> Le fumier atteint sa plus grande chaleur trois ou quatre jours après la charge, et peut la tenir cinq ou six jours ; un thermomètre planté à 8 cm dans le terreau peut marquer 50 °C. On ne sème pas là-dedans : les racines cuisent. Soulever un peu les châssis chaque jour pour laisser sortir la chaleur. <strong>C’est le thermomètre qui décide, pas le nombre de jours</strong> : on sème quand le terreau est redescendu vers 30 °C, entre 27 et 32 °C ; le plus prudent attend 24 °C. Selon le fumier, ça prend de six à dix jours.</p>
<p class="step"><span class="sn">13</span><strong>Semer</strong> en lignes espacées de 10 cm, à la même profondeur qu’en pleine terre. Ou poser des caisses de semis sur la couche ; si le fumier est encore trop chaud, les poser sur des lattes pour laisser une lame d’air dessous.</p>
<p class="step pk-c"><span class="sn">14</span><strong>Tenir la couche entre 10 et 29 °C</strong>, jamais au-delà. Après la levée, viser 16 à 18 °C pour les choux et la laitue, 18 à 24 °C pour la tomate. Aérer en soulevant le châssis <strong>du côté sous le vent</strong>, quel qu’il soit, sans courant d’air froid direct sur les plants : une couche qu’on n’aère pas donne des plants qui filent<sup class="fnr" data-fn="97-2">2</sup> et qui pourrissent. Arroser peu : un terreau plutôt sec qu’humide, parce que les plants pourrissent sur terre mouillée.</p>
<p class="step"><span class="sn">15</span><strong>Les nuits froides</strong>, couvrir les châssis : volets de planches de la même taille, paillassons, deux ou trois épaisseurs de toile à sac clouées sur trois lattes et roulées d’un bout à l’autre par une seule personne, ou une couche égale de foin de marais.</p>
<p class="step"><span class="sn">16</span><strong>Quand elle faiblit, la réchauffer.</strong> Le <em>réchaud</em> des anciens : entourer la couche d’une bande de fumier <strong>neuf</strong> bien pressé, de 40 à 60 cm de large et de la hauteur de la couche. Il chauffe à son tour et recharge la couche par les côtés.</p>
<p class="step"><span class="sn">17</span><strong>Quand les plants touchent la vitre</strong>, soulever le coffre d’un bloc de bois sous chaque coin.</p>
<p class="step"><span class="sn">18</span><strong>Endurcir avant de repiquer</strong> : enlever les châssis quelques heures, puis des journées, puis des nuits (<span class="ref">§5-C</span>, étape 26).</p>
<p class="step pk-d"><span class="sn">19</span><strong>Après la saison</strong>, le fumier usé de la couche n’a chauffé que quelques jours : c’est du <strong>fumier cru</strong>. Il va au tas de fumier du <span class="ref">ch. 101</span>, à l’écart du jardin, jamais au composteur (<span class="ref">ch. 95</span>), ou sous des cultures qu’on récoltera au moins 120 jours plus tard pour ce qui touche la terre, 90 jours pour le reste (<span class="ref">ch. 101</span>). Voir <span class="ref">§8</span>.</p>
<h3 class="sub">C — Les semis dans la maison et le calendrier</h3>
<p class="step"><span class="sn">20</span><strong>Compter à rebours depuis le repiquage</strong>, jamais en avant depuis le calendrier. Le nombre de jours à maturité du sachet se compte à partir du <strong>repiquage</strong> pour ce qui se sème à l’intérieur, à partir de la <strong>levée</strong> pour ce qui se sème en pleine terre ; mais aucune règle n’oblige les semenciers à la suivre, et ce nombre a été mesuré ailleurs, plus au chaud. Ici, il s’allonge.</p>
<table class="tspan"><colgroup><col style="width:13.2%"><col style="width:17.1%"><col style="width:18.7%"><col style="width:29.7%"><col style="width:21.3%"></colgroup><thead><tr><th>Espèce</th><th>Du semis à la levée</th><th>De la levée au repiquage</th><th>Repiquer, sur la côte</th><th>Donc semer vers</th></tr></thead><tbody><tr><td class="c-item">Chou</td><td>4 à 10 jours</td><td>5 à 7 semaines</td><td>Fin mai – début juin, sous agrotextile</td><td>Début à mi-avril</td></tr><tr><td class="c-item">Brocoli</td><td>7 à 10 jours</td><td>5 à 7 semaines</td><td>Fin mai – début juin, sous agrotextile</td><td>Début à mi-avril</td></tr><tr><td class="c-item">Laitue</td><td>6 à 8 jours</td><td>3 à 5 semaines</td><td>Fin mai – début juin</td><td>Fin mars à début mai</td></tr><tr><td class="c-item">Oignon (de semis)</td><td>7 à 10 jours</td><td>8 semaines</td><td>Début juin</td><td>Fin février à fin mars</td></tr><tr><td class="c-item">Tomate</td><td>6 à 12 jours</td><td>5 à 7 semaines</td><td>Mi-juin en plein air ; début juin sous tunnel ou châssis</td><td>Mi à fin avril</td></tr><tr><td class="c-item">Poivron</td><td>9 à 14 jours</td><td>6 à 8 semaines</td><td>Mi-juin, sous tunnel</td><td>Début avril. Un pari de belle année</td></tr><tr><td class="c-item">Concombre</td><td>6 à 10 jours</td><td>4 semaines</td><td>Mi-juin, sous tunnel</td><td>Début mai</td></tr><tr><td class="c-item">Courge, courgette</td><td>4 à 6 jours</td><td>3 à 4 semaines</td><td>Mi-juin, sous tunnel</td><td>Mi-mai</td></tr></tbody></table>
<p class="stepc">Les dates de repiquage sont tirées du tableau de <span class="ref">§5-A</span> : les choux et la laitue sortent dès la fin mai, endurcis (étape 26) et sous agrotextile, parce que les seuils de gel du <span class="ref">§5-G</span> sont ceux de plants d’automne, pas de jeunes plants de printemps ; le reste attend la date d’une année sur dix, ou sort plus tôt sous plastique.</p>
<p class="step"><span class="sn">21</span><strong>Faire lever au chaud</strong> : environ 21 °C, sur le dessus du réfrigérateur ou près du poêle, jamais au soleil direct, qui chauffe le terreau au point de tuer la graine. <strong>La laitue fait exception</strong> : elle lève au frais, entre 10 et 18 °C, ni sur le frigo ni près du poêle. Tenir le terreau humide sous une pellicule. Dès que la moitié des graines ont levé, enlever la pellicule et sortir de la chaleur : désormais, c’est la lumière qui compte. Température de la pièce ensuite : 13 à 21 °C, loin des courants d’air.</p>
<p class="step pk-d"><span class="sn">22</span><strong>La fenêtre ne suffit pas, et c’est normal.</strong> En mars et en avril, à cette latitude, les jours sont encore courts, souvent gris, et la vitre refroidit les plants la nuit par rayonnement : des semis sur l’appui de la fenêtre filent presque toujours. Avec une lampe : 5 à 10 cm au-dessus du feuillage, remontée à mesure, 16 heures par jour. Une couverture de survie drapée au-dessus du support de lampes, sans toucher les tubes et en laissant l’air passer aux bouts, gagne 3 à 6 °C dans une pièce froide sous des tubes fluorescents, qui chauffent un peu ; sous une lampe DEL, qui chauffe moins, le gain est moindre. Au chalet, la lampe tourne sur les batteries (<span class="ref">ch. 85, 86</span>), et c’est la plus grosse charge du printemps : deux tubes fluorescents de 40 W allumés 16 heures tirent environ 1,3 kWh par jour, plus les pertes de l’onduleur, soit plus que ce que 400 W de panneaux rendent par la batterie en avril (<span class="ref">ch. 86</span>, étape 2), et ça pendant toutes les semaines des semis. Une lampe DEL donne la même lumière pour moins de courant. Elle entre au bilan du <span class="ref">ch. 86</span> (étape 1) avant qu’on sème, pas après. <strong>Si une génératrice recharge les batteries pour ça : jamais dans un bâtiment, un garage ni sous un auvent</strong> (<span class="ref">§8</span>).</p>
<p class="step"><span class="sn">23</span><strong>Sans lampe</strong>, la fenêtre le jour, les plants reculés de la vitre la nuit, et surtout : <strong>sortir les plants sous le châssis ou dans la couche chaude dès qu’elle est prête</strong>. Sous une vitre, dehors, ils ont tout le ciel ; c’est la vraie lampe du chalet.</p>
<p class="step"><span class="sn">24</span><strong>Repiquer en godet</strong> à la deuxième vraie feuille, en tenant le plant <strong>par une feuille, jamais par la tige</strong> : le plant se remet d’une feuille abîmée, pas d’une tige écrasée. Écrire l’espèce et la date au feutre sur le godet.</p>
<p class="step"><span class="sn">25</span><strong>Les pommes de terre de semence</strong> sortent du caveau et passent deux jours au chaud avant la plantation : les germes repartent, et le tubercule ne ruisselle pas de condensation au moment d’aller en terre. Un tubercule aux germes ramifiés et chevelus est trop vieux : il donne un plant faible.</p>
<p class="step"><span class="sn">26</span><strong>Endurcir une à deux semaines.</strong> Quelques heures dehors, à l’ombre, à l’abri du vent, par plus de 7 °C ; allonger chaque jour la durée et le soleil. Repiquer en fin d’après-midi ou par temps couvert, et arroser à fond.</p>
<h3 class="sub">D — Le châssis froid, l’ados et le sol qu’on réchauffe</h3>
<p class="step"><span class="sn">27</span><strong>Le châssis froid</strong> est une couche chaude sans fumier. Le coffre et la vieille fenêtre sont au <span class="ref">ch. 95</span> ; ce qui change ici, c’est la préparation. <strong>À l’automne</strong>, empiler au moins 15 cm de terre riche là où ira le coffre, et la couvrir de feuilles ou de litière sans graines de mauvaises herbes, ainsi que le sol autour : sous les feuilles et la neige, elle gèle moins profond que la terre nue. Au printemps, enlever les feuilles avant de poser le coffre : laissées là, elles garderaient la terre froide (étape 30). Poser le coffre (planches de 30 cm, l’arrière 15 cm plus haut), rechausser l’extérieur de terre ou de fumier, et poser le verre <strong>quelques jours avant</strong> de semer ou de repiquer, pour réchauffer la terre. On ne met jamais un plant dans une terre froide. Du coton tendu remplace le verre, sauf quand une grosse gelée s’annonce.</p>
<p class="step"><span class="sn">28</span><strong>L’ados.</strong> Prendre une bande de terre orientée est-ouest, large de 1,28 m. En la bêchant, la baisser de 16 cm du côté sud et la relever de 16 cm du côté nord : 32 cm de pente vers le sud. Tendre un cordeau sur la crête, trancher le bord nord à la bêche et le battre au dos de la bêche pour faire un talus presque vertical. S’il y a un mur qui coupe le vent du nord, faire l’ados à quelques pas <strong>devant</strong> le mur, pas contre : il faut pouvoir en faire le tour. C’est là que vont les premières salades du printemps et le dernier rang de l’automne. Il complète le billon du <span class="ref">ch. 95</span> : le billon draine, l’ados capte en plus le soleil bas.</p>
<p class="step pk-d"><span class="sn">29</span><strong>Réchauffer le sol avant de semer.</strong> Poser un plastique <strong>transparent</strong> sur une terre humide, bien tendu, les bords enterrés, et le laisser jusqu’au semis : il monte la terre de 4 à 8 °C. Le noir ne gagne que 2 à 3 °C et seulement s’il colle au sol, puisqu’il chauffe par contact ; en revanche il étouffe les mauvaises herbes, alors que le transparent les fait lever. Enlever le transparent au semis, ou planter au travers par des fentes. <strong>Jamais sur les rangs de pommes de terre</strong> (<span class="ref">§8</span>).</p>
<p class="step"><span class="sn">30</span><strong>Le paillis organique a deux saisons.</strong> Au printemps, seulement sur une terre déjà réchauffée, après la levée (<span class="ref">ch. 95</span>). En septembre, <strong>le retirer</strong> des rangs qu’on veut couvrir les nuits de gel : il empêche le sol de se charger le jour, et l’air au ras du sol est plus froid la nuit. Les racines qu’on laisse en terre, elles, se paillent : là, c’est le sol qu’on protège, pas le feuillage (<span class="ref">ch. 79</span>).</p>
<h3 class="sub">E — Tunnels et couvertures</h3>
<p class="step"><span class="sn">31</span><strong>Les arceaux.</strong> Un fil de fer n° 9 de 165 cm, planté par ses deux bouts, fait un arceau d’environ 90 cm de base et 35 cm de haut. Des perches d’aulne ou d’épinette pliées font la même chose (<span class="ref">§9</span>). Un arceau aux 90 cm à 1,5 m, plus serrés là où le vent frappe. La forme basse et étalée garde le mieux la chaleur du sol pendant une nuit de gel.</p>
<p class="step"><span class="sn">32</span><strong>La couverture.</strong> Plastique transparent : il chauffe davantage le jour. Agrotextile : il respire et laisse passer la pluie, mais protège moins. Enterrer ou lester trois côtés ; le quatrième, celui qu’on ouvre, se leste de pierres ou de sacs de terre qu’on enlève, jamais laissé libre. La terre pelletée sur le bord est ce qui tient le mieux au grand vent.</p>
<p class="step"><span class="sn">33</span><strong>L’aération, tous les matins de soleil.</strong> Ouvrir au moins une fente, quelle que soit la température de l’air : sous un couvert fermé, une heure de soleil suffit pour dépasser 54 °C. Par temps couvert et sans soleil, on peut laisser fermé. Des trous de 5 cm tous les 60 à 90 cm dans les côtés d’un plastique font une aération permanente, pour qui n’est pas là à midi. <strong>Mais ils coûtent la protection</strong> : un plastique percé ou fendu ne gagne plus qu’environ 1 °C une nuit de gel. Les soirs de gel, on ferme tout : trous bouchés d’une motte ou d’une pierre plate, ou une toile ou un plastique entier posé par-dessus. Les tomates, les poivrons et les courges veulent un arceau solide : le plastique qui bat au vent use les pousses.</p>
<p class="step"><span class="sn">34</span><strong>Découvrir à temps.</strong> Sous couvert, les plants s’endurcissent moins au froid, et les fleurs de courge et de concombre ne sont pas visitées par les insectes : on ouvre le tunnel quand elles apparaissent, et on le referme les nuits de gel.</p>
<p class="step"><span class="sn">35</span><strong>La toile de nuit</strong> (sans arceaux) se pose <strong>avant le coucher du soleil</strong> : après, la chaleur du sol est déjà partie. Elle doit rester <strong>sèche</strong> : un tissu mouillé qui s’évapore refroidit ce qu’il touche, et le rang est plus froid dessous qu’à découvert. Elle ne doit pas toucher les feuilles, qui gèlent là où la toile les touche : piquets, chaudières renversées, branches entre les deux. Elle s’enlève le matin, sinon le sol ne se recharge pas pour la nuit suivante.</p>
<h3 class="sub">F — La serre adossée au chalet</h3>
<p class="step pk-d"><span class="sn">36</span><strong>Où.</strong> Contre le mur sud du chalet, l’axe long est-ouest. <strong>Jamais sous le bord d’un toit qui déverse sa neige ou ses glaçons</strong>, ou alors sous un auvent solide qui les détourne. <strong>Jamais par-dessus une sortie d’évacuation ou une prise d’air d’un appareil qui brûle</strong> — poêle, réfrigérateur, chauffe-eau ou cuisinière au propane (<span class="ref">ch. 87</span>) —, ni sous la cheminée : ce qui brûle dans le chalet rejetterait ses gaz dans la serre fermée, et l’appareil y prendrait son air (<span class="ref">§8</span>, bloc 2). Si le mur sud porte une sortie, la serre va à côté, ou la sortie est prolongée au-delà du vitrage.</p>
<p class="step"><span class="sn">37</span><strong>Le vitrage.</strong> Le soleil de midi est à 40° au-dessus de l’horizon aux équinoxes et à 63° à la Saint-Jean : un vitrage incliné à environ 50° de l’horizontale reçoit de face le soleil de mars et de septembre, les deux bouts qu’on cherche à allonger. D’octobre à avril, un vitrage vertical reçoit environ un quart de moins qu’un vitrage à 60°, mais il chauffe deux fois moins en été. Vieilles fenêtres ou plastique ; <strong>deux épaisseurs</strong> séparées par une lame d’air coupent la perte de chaleur de moitié.</p>
<p class="step"><span class="sn">38</span><strong>La masse.</strong> Le mur du chalet fait le mur nord massif. Dans la serre, des barils ou des bidons <strong>pleins d’eau, foncés, fermés</strong>, alignés contre ce mur, là où le soleil de midi les frappe, et qui servent de pieds aux tablettes de semis. Autant que la place en laisse. Pleins veut dire presque à ras : un contenant fermé qui peut geler à fond garde de l’air sous le bouchon, parce que la glace prend plus de place que l’eau et bombe le baril ou fend le bidon. Isoler le bas des murs jusqu’à environ 60 cm sous terre, pour que la chaleur reste dans le sol de la serre au lieu de fuir sous le mur.</p>
<p class="step"><span class="sn">39</span><strong>L’aération.</strong> Une ouverture basse face au vent d’été, une haute à l’opposé : l’air entre en bas, se réchauffe et sort en haut. Une serre sans ouverture haute cuit ses plants le premier jour de juin ensoleillé.</p>
<p class="step pk-d"><span class="sn">40</span><strong>Rien ne brûle dans la serre</strong> (<span class="ref">§8</span>). La chaleur du jour passe au chalet par deux ouvertures dans le mur commun, une en haut et une en bas — une fenêtre ouverte en haut, une trappe ou la porte en bas : l’air chaud entre au chalet par le haut, l’air frais revient à la serre par le bas. On les referme au coucher du soleil.</p>
<h3 class="sub">G — Passer les nuits de gel de juin et de septembre</h3>
<p class="step"><span class="sn">41</span><strong>Chaque soir de la période à risque</strong> — de la fin mai à la mi-juin, puis de la fin août jusqu’à ce que le jardin soit rentré, et plus longtemps sur un terrain qui gèle plus que sa station (étapes 1 et 2) — regarder le ciel au coucher du soleil. <strong>Ciel clair, pas de vent, air sec : on couvre.</strong> Aucun seuil de thermomètre ne se transpose d’un terrain à l’autre sans des nuits de mesure ; la règle, c’est le ciel. Une toile posée pour rien coûte dix minutes ; une toile oubliée coûte la saison.</p>
<p class="step"><span class="sn">42</span><strong>Un ou deux jours avant</strong>, quand le temps se met au beau et au froid, mouiller le sol sur 30 cm : 25 mm d’eau dans un sol sablonneux, jusqu’à 50 mm dans un sol argileux, soit 25 à 50 L par mètre carré, l’équivalent d’une à deux semaines d’arrosage (<span class="ref">ch. 95</span>). Un sol humide garde et rend plus de chaleur. Pas le soir même : il faut que l’eau ait le temps de descendre, sinon la surface mouillée s’évapore et refroidit.</p>
<p class="step"><span class="sn">43</span><strong>Ne pas sarcler, ne pas bêcher.</strong> Arracher l’herbe entre les rangs (elle rend le sol plus froid la nuit), tirer le paillis hors des rangs à couvrir (étape 30).</p>
<p class="step"><span class="sn">44</span><strong>Avant le coucher du soleil</strong> : bidons d’eau entre les plants, couverture sur arceaux ou sur piquets, un plastique par-dessus la toile s’il pleut ou si la rosée est forte, bords lestés.</p>
<p class="step"><span class="sn">45</span><strong>Le matin</strong>, découvrir quand le soleil est dessus et que tout a dégelé. Ne juger les dégâts qu’après le dégel : un chou d’automne établi encaisse −2 à −4 °C, et un chou raide de givre à l’aube n’est pas forcément perdu ; une tomate translucide et molle à midi l’est (<span class="ref">§7</span>).</p>
<p class="step"><span class="sn">46</span><strong>Jamais arroser les feuilles à la chaudière le soir d’un gel.</strong> Une feuille mouillée se refroidit par évaporation sous la température de l’air ; il faudrait l’arroser sans arrêt toute la nuit pour que l’eau qui gèle compense. Quelques chaudières font plus de mal que rien.</p>
<p class="p0 ri"><strong class="runin">Ce que chaque légume encaisse,</strong> plant établi, à l’automne :</p>
<table class="tcol"><colgroup><col style="width:24.5%"><col style="width:75.5%"></colgroup><thead><tr><th>Encaisse</th><th>Espèces</th></tr></thead><tbody><tr><td><strong>Rien.</strong> À protéger ou à récolter avant la première petite gelée</td><td>Haricot, maïs, feuillage de pomme de terre, poivron, concombre, courgette. La citrouille et la courge d’hiver supportent parfois une très petite gelée, mais on les protège. La tomate non plus, mais ses fruits mûrissent après cueillette (<span class="ref">§9</span>)</td></tr><tr><td><strong>Une petite gelée</strong>, de 0 à −2 °C</td><td>Betterave (<em>Beta vulgaris</em>), carotte, laitue (<em>Lactuca sativa</em>), oignon, ail, ciboulette, persil, pois (<em>Pisum sativum</em>), radis, rhubarbe, épinard (<em>Spinacia oleracea</em>), bette à carde</td></tr><tr><td><strong>Une gelée modérée</strong>, de −2 à −4 °C</td><td>Chou, chou chinois, chou frisé, chou-rave, navet (<em>Brassica rapa</em>), brocoli et chou-fleur (vers −3 °C)</td></tr><tr><td><strong>Gagne à geler</strong></td><td>Panais (<em>Pastinaca sativa</em>) et salsifis, meilleurs après plusieurs gelées modérées ; chou de Bruxelles. Les racines deviennent plus sucrées quand la terre passe sous 4 °C</td></tr></tbody></table>
<p class="p0">Les légumes venus des pays chauds commencent à souffrir sous 10 °C, bien avant le gel ; une citrouille supporte une nuit à 2 °C si la journée monte à 21 °C.</p>
<p>Ces seuils sont ceux de plants établis qui arrivent à maturité à l’automne, endurcis par les nuits fraîches. Un jeune plant repiqué au printemps n’a pas ces seuils : sa pousse tendre gèle plus facilement que le feuillage endurci d’automne, et un plant tenu sous couvert s’endurcit moins (étape 34). Au printemps, la petite gelée se passe sous agrotextile, pas à découvert.</p>
<h3 class="sub">H — Les variétés hâtives</h3>
<p class="step"><span class="sn">47</span><strong>Le sachet tranche</strong> (<span class="ref">ch. 95</span>, <span class="ref">ch. 100</span>) : à espèce égale, toujours le plus petit nombre de jours. Les variétés suivantes ont fait leurs preuves dans un été frais et court, en sol froid. Elles servent de repères pour lire un sachet, pas de liste d’achat.</p>
<table class="tspan"><colgroup><col style="width:15.5%"><col style="width:52.8%"><col style="width:31.8%"></colgroup><thead><tr><th>Espèce</th><th>Variétés hâtives éprouvées dans un été frais</th><th>Remarque</th></tr></thead><tbody><tr><td class="c-item">Haricot</td><td>’Contender’ (la plus hâtive), ’Provider’</td><td>En plein air, mais sous agrotextile au début</td></tr><tr><td class="c-item">Pois</td><td>’Spring’ (la plus hâtive), ’Alaska’, ’Sugar Ann’</td><td>Semis direct, tôt</td></tr><tr><td class="c-item">Chou</td><td>’Early Jersey Wakefield’ (le plus hâtif) ; ’Golden Acre’, dans sa version hybride (F1)</td><td>Pour l’été ; les choux de garde sont plus tardifs</td></tr><tr><td class="c-item">Brocoli, chou-fleur</td><td>’Waltham 29’ ; ’Early Snowball’</td><td></td></tr><tr><td class="c-item">Carotte</td><td>’Nantes Coreless’</td><td>Hâtive, et se garde bien</td></tr><tr><td class="c-item">Laitue</td><td>’Buttercrunch’ (supporte un peu de gel) ; ’Grand Rapids’ (la mieux adaptée aux jours sombres)</td><td></td></tr><tr><td class="c-item">Radis, épinard, navet</td><td>’Cherry Belle’ ; ’Melody’ ; ’Tokyo Cross’</td><td>Les plus rapides du jardin</td></tr><tr><td class="c-item">Pomme de terre</td><td>’Kennebec’, ’Superior’ (hâtives) ; ’Green Mountain’ (mi-saison à tardive, gros rendement)</td><td>’Kennebec’ verdit vite à la lumière : butter tôt (<span class="ref">ch. 95</span>)</td></tr><tr><td class="c-item">Courgette</td><td>’Gold Rush’, ’Black Jack’</td><td>Sous tunnel au début</td></tr><tr><td class="c-item">Tomate</td><td>En plein air : ’Subarctic 25’. Sous tunnel ou serre : ’Early Girl’ (F1)</td><td>En plein air, la récolte reste faible</td></tr><tr><td class="c-item">Maïs sucré</td><td>Seulement sous plastique transparent</td><td>Sinon, mauvais choix (<span class="ref">§2</span>)</td></tr></tbody></table>
<p class="stepc">’Golden Acre’ sous ce nom, ’Early Girl’, ’Tokyo Cross’, ’Gold Rush’ et ’Melody’ sont des hybrides F1. Un F1 donne sa récolte, pas sa semence : la graine gardée ne redonne pas la variété (<span class="ref">ch. 100</span>). Le sachet le dit, « F1 » ou « hybride » d’un côté, « pollinisation libre » de l’autre.</p>
<p class="step"><span class="sn">48</span><strong>Garder la graine des plants qui ont mûri les premiers</strong>, année après année, sur les variétés à pollinisation libre seulement : la variété se déplace lentement vers la précocité, et c’est le seul moyen qui agit sur la saison elle-même (<span class="ref">ch. 100</span>).</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:16.1%"><col style="width:15.4%"><col style="width:37.3%"><col style="width:31.2%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Automne</td><td>Fosse de couche creusée, terreau et terre du châssis en tas sous les feuilles</td><td>Fosse ≥ 46 cm ; terre ≥ 15 cm, non gelée au printemps</td><td>Au printemps, monter la couche hors terre sur un endroit sec, fortement rechaussée</td></tr><tr><td class="c-item">Tas de fumier</td><td>Il chauffe</td><td>Fume au bout de quelques jours ; retourné ; rechauffe franchement 5 à 6 jours après</td><td>Tas trop petit, trop sec ou fumier déjà chauffé : grossir, humecter à l’eau tiède, ajouter du frais</td></tr><tr><td class="c-item">Couche chargée</td><td>Épaisseur de fumier</td><td>60 à 75 cm tôt en saison ; jamais moins de 30 cm</td><td>Recharger avant de poser le terreau</td></tr><tr><td class="c-item">Couche, du 3e au 10e jour environ</td><td>Terreau à 8 cm</td><td>Coup de feu jusqu’à 50 °C ; semer à 30 °C ou moins (24 °C, le plus prudent) : le thermomètre décide, pas le calendrier</td><td>Attendre ; lever les châssis un peu chaque jour</td></tr><tr><td class="c-item">Couche et châssis, après la levée</td><td>Air sous la vitre</td><td>10 à 29 °C ; choux 16 à 18 °C ; tomate 18 à 24 °C</td><td>Aérer du côté sous le vent ; couvrir la nuit</td></tr><tr><td class="c-item">Chaque matin de soleil</td><td>Tunnel, châssis, serre</td><td>Au moins une fente ouverte, quelle que soit la température de l’air</td><td>Ouvrir tout de suite : une heure de soleil suffit à dépasser 54 °C sous un couvert fermé</td></tr><tr><td class="c-item">Semis dans la maison</td><td>Levée ; lumière ; pièce</td><td>Levée à ≈ 21 °C (laitue : 10 à 18 °C) ; lampe à 5-10 cm, 16 h par jour ; pièce à 13-21 °C</td><td>Plants qui filent : plus de lumière, moins de chaleur, sortir sous le châssis</td></tr><tr><td class="c-item">Avant le repiquage</td><td>Endurcissement</td><td>1 à 2 semaines, dehors par plus de 7 °C</td><td>Rallonger. Le plant non endurci souffre au premier soleil et au premier vent du lac</td></tr><tr><td class="c-item">Repiquage des espèces tendres</td><td>Date</td><td>Après la date d’une année sur dix (≈ 11-12 juin) en plein air ; plus tôt seulement sous tunnel ou châssis</td><td>Garder sous vitre</td></tr><tr><td class="c-item">Sol à réchauffer</td><td>Plastique</td><td>Transparent sur sol humide : +4 à 8 °C ; noir collé au sol : +2 à 3 °C</td><td>Retendre, enterrer les bords</td></tr><tr><td class="c-item">Soir de la période à risque</td><td>Ciel et vent</td><td>Clair, calme, sec → couvert posé avant le coucher du soleil</td><td>Couvrir même sans certitude</td></tr><tr><td class="c-item">Un ou deux jours avant la nuit froide</td><td>Sol</td><td>Humide sur 30 cm : 25 à 50 L/m²</td><td>Arroser le sol, pas le feuillage</td></tr><tr><td class="c-item">Couverture de nuit</td><td>Contact, eau, lest, trous</td><td>Rien ne touche les feuilles ; tissu sec ; pourtour lesté ; trous d’aération du tunnel bouchés</td><td>Arceaux, plastique par-dessus, pierres, mottes</td></tr><tr><td class="c-item">Serre adossée</td><td>Neige du toit ; ouvertures ; masse</td><td>Hors de la chute de neige ; ouverture basse et haute ; eau au soleil de midi</td><td>Déplacer, ajouter un déflecteur, ouvrir le haut</td></tr><tr><td class="c-item">Récolte de sauvetage</td><td>Tomates</td><td>Vert mûr<sup class="fnr" data-fn="97-3">3</sup>, fermes, saines ; 16 à 18 °C à l’obscurité</td><td>Les immatures ne mûriront pas : cuisine du jour</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:34.1%"><col style="width:23.6%"><col style="width:42.3%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">La couche ne chauffe pas au bout de quelques jours</td><td>Fumier vieux, déjà chauffé, froid ou trop sec ; tas trop petit</td><td>Ajouter du fumier frais, humecter à l’eau tiède, rechausser. Sinon, c’est un châssis froid</td></tr><tr><td class="c-item">Levée qui flétrit ou meurt dans une couche encore très chaude</td><td>Semé pendant le coup de feu : racines cuites</td><td>Ressemer quand le terreau est redescendu ; caisses sur lattes</td></tr><tr><td class="c-item">La couche refroidit trop tôt, nuits encore gelantes</td><td>Chaleur épuisée</td><td>Réchaud : 40 à 60 cm de fumier neuf pressé autour</td></tr><tr><td class="c-item">Plants qui filent, pâles, couchés vers la lumière</td><td>Manque de lumière, ou trop de chaleur pour la lumière reçue</td><td>Lampe plus proche ; pièce plus fraîche ; sortir sous vitre ; aérer davantage la couche</td></tr><tr><td class="c-item">Tiges qui pourrissent au pied, en couche ou en godet</td><td>Trop humide, pas assez d’air</td><td>Arroser moins, aérer, espacer</td></tr><tr><td class="c-item">Plants flétris, brûlés, un midi de soleil</td><td>Couvert resté fermé</td><td>Ouvrir chaque matin ; trous d’aération permanents, bouchés les soirs de gel</td></tr><tr><td class="c-item">Feuilles gelées en taches, seulement là où la toile appuyait</td><td>Contact de la couverture</td><td>Arceaux, piquets ; rien ne touche</td></tr><tr><td class="c-item">Rang plus gelé sous la toile qu’à côté</td><td>Toile mouillée qui s’évapore</td><td>Plastique par-dessus ; toile sèche</td></tr><tr><td class="c-item">Feuillage translucide, gorgé d’eau, mou après le dégel<sup class="fnr" data-fn="97-4">4</sup></td><td>Gel</td><td>Tendres : récolter tout de suite ce qui se mange. Rustiques : attendre midi pour juger</td></tr><tr><td class="c-item">Le jardin du bas gèle, celui du haut rien</td><td>Air froid accumulé</td><td>Planter la saison suivante plus haut ; ouvrir le bas de la clôture</td></tr><tr><td class="c-item">Gel derrière une clôture pleine au bas du terrain</td><td>L’obstacle retient l’air froid</td><td>Ajourer le bas ou faire une brèche au point le plus bas</td></tr><tr><td class="c-item">Pomme de terre aux taches grises ou gris-bleu sous la pelure, molle en dégelant</td><td>Tubercule gelé</td><td>Ne descend pas au caveau (<span class="ref">ch. 79</span>) : cuisine tout de suite</td></tr><tr><td class="c-item">Pommes de terre vertes sous un plastique transparent</td><td>Lumière à travers le plastique</td><td>Enlever le plastique, rebutter, et planter un piquet au bout du rang : à la récolte, tout ce rang se traite comme vert, quelle que soit alors sa couleur, parce que le vert pâlit au noir et que la toxine reste (<span class="ref">ch. 95</span>, <span class="ref">§7</span>). Voir <span class="ref">§8</span></td></tr><tr><td class="c-item">Tomate vert foncé qui ne rougit pas, ou qui pourrit en caisse</td><td>Cueillie trop jeune, blessée, ou gardée trop froide</td><td>Les immatures ne rougiront pas. Trier chaque semaine ; 16 à 18 °C</td></tr><tr><td class="c-item">Serre ou châssis écrasés, vitres brisées</td><td>Neige ou glace du toit</td><td>Déplacer, ou poser un déflecteur solide au-dessus</td></tr><tr><td class="c-item">Plants sortis de la couche qui stagnent au jardin</td><td>Repiqués sans endurcissement, ou en terre froide</td><td>Endurcir 1 à 2 semaines ; réchauffer le sol au plastique avant</td></tr></tbody></table>

<p class="pt"><span class="pn">1</span><strong class="plead">Sous la couche chaude, il y a du fumier cru.</strong> Ce qui pousse jusqu’à la récolte dans la couche chaude pousse à 13 ou 15 cm au-dessus d’un fumier retourné une fois, jamais composté : il n’a pas tenu les 55 à 77 °C pendant 15 jours, retourné au moins cinq fois, qui font un compost. C’est du fumier cru. Le mécanisme est une contamination fécale : elle ne se voit pas, ne se sent pas, et frappe surtout les enfants de moins de cinq ans — il y en a un dans ce chalet. Un fumier cru se tient au moins <strong>120 jours</strong> sous terre avant la récolte d’un légume dont la partie mangée touche la terre, <strong>90 jours</strong> pour les autres ; une couche montée en avril ne répond à aucune des deux règles au mois de mai. Donc : <strong>la couche chaude fait des plants, pas des salades</strong>. Ce qu’on y récolte directement (radis, laitue, épinard) se mange <strong>cuit</strong>. Le fumier usé part au tas de fumier, à l’écart du jardin, jamais au composteur (<span class="ref">ch. 101</span> ; <span class="ref">ch. 95</span> pour le composteur), et jamais étendu frais sous ce qui se mange cru.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Rien ne brûle dans une serre adossée au chalet, et rien du chalet n’y brûle.</strong> Une serre fermée contre le mur partage son air avec le chalet par les ouvertures qu’on laisse pour la chaleur. Une chaufferette, un fanal, une chandelle ou un poêle allumés une nuit de gel dans une serre fermée y font du monoxyde de carbone, sans odeur ni couleur, qui passe au chalet où les gens dorment. Le même gaz y arrive sans aucune flamme dans la serre si elle couvre la sortie d’évacuation ou la prise d’air d’un appareil du chalet — poêle, réfrigérateur, chauffe-eau ou cuisinière au propane — ou si elle passe sous la cheminée : l’appareil rejette ses gaz dans la serre et y prend son air, et c’est le jour où il brûle mal que la serre les renvoie au chalet (<span class="ref">§5-F</span>, étape 36). On s’endort au lieu de sortir ; chez un enfant, l’intoxication a l’air de la fatigue ou du mauvais caractère (<span class="ref">ch. 3</span>, <span class="ref">ch. 12</span>). La chaleur de la serre vient du soleil, de l’eau et du sol, jamais d’une flamme. Et une génératrice, quelle qu’en soit la raison — recharger les batteries des lampes à semis comprise — <strong>jamais dans un bâtiment, un garage, une serre, ni sous un auvent</strong>.</p>
<p class="pt"><span class="pn">3</span><strong class="plead">La récolte sauvée d’un coup pousse à la conserve improvisée.</strong> Le soir du gel, on cueille tout ; le lendemain, il y en a trop, et on met en pots. Les légumes du jardin — haricots, betteraves, carottes, courges, choux — sont <strong>peu acides</strong> : ils ne se conservent en pot qu’à l’autoclave, selon le barème de cet aliment-là. <strong>Pas de barème pour cet aliment, pas de pot</strong> : la courgette et le concombre n’ont pas de barème d’autoclave dans les recettes éprouvées, et ils ne vont en pot qu’en marinade éprouvée (<span class="ref">ch. 78</span>). <strong>La tomate n’est pas l’exception</strong> : elle est à la limite, et en pot elle prend l’acide ajouté de la recette éprouvée, jamais au goût (<span class="ref">ch. 78</span>). Le sel n’y change rien, le vinaigre versé au goût n’y change rien, et <strong>le botulisme ne modifie ni l’odeur, ni le goût, ni l’apparence du pot</strong>. Ce qui ne peut pas être mis en pot correctement va au caveau (<span class="ref">ch. 79</span>), en fermentation (<span class="ref">ch. 80</span>), ou se mange.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">Jamais de plastique transparent sur les pommes de terre.</strong> Le plastique transparent laisse passer la lumière jusqu’aux tubercules près de la surface, et c’est la lumière qui fait former les glyco-alcaloïdes dans la pomme de terre. Le vert en est le témoin, pas le poison, et un témoin qui s’efface : <strong>le vert pâlit au noir, la toxine reste</strong>. <strong>La cuisson ne les détruit pas.</strong> Une pomme de terre verdie se coupe large, le vert jeté, et se pèle ; verdie en profondeur, elle se jette (<span class="ref">ch. 79</span>, <span class="ref">§7</span>). Une bouchée amère se recrache, et le reste du lot se jette (<span class="ref">ch. 95</span>, <span class="ref">§7</span>). Sur les pommes de terre : plastique noir, ou paille, ou rien, et le buttage du <span class="ref">ch. 95</span>.</p>
<p class="pt"><span class="pn">5</span><strong class="plead">Le fumier et la terre portent les spores du tétanos.</strong> Elles entrent par une éraflure, une écorchure, une petite plaie : pas besoin d’une grande blessure. La couche chaude se monte à la fourche et se juge au thermomètre ; la main n’entre dans le fumier que si elle n’a ni coupure ni éraflure. Le rappel de chacun se vérifie avant la saison des couches : une plaie souillée de fumier ou de terre n’est couverte que si la dernière dose a moins de 5 ans (<span class="ref">ch. 32</span>). Une éraflure souillée se lave, puis se surveille deux semaines : des crampes et une raideur soudaines qui prennent le cou, puis le visage, ce n’est pas un torticolis (<span class="ref">ch. 26</span>).</p>
