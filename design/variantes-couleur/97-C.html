<p class="p0">Sans agrotextile acheté, sans polyéthylène, sans thermomètre peut-être, et avec le gel qui arrive trop tôt. C’est le cas pour lequel ce chapitre existe : une nuit claire de début septembre, le jardin de l’année dans les rangs, et personne à qui emprunter quoi que ce soit.</p>
<h3 class="sub">La nuit du gel : sauver la récolte en une heure</h3>
<p class="p0 ri"><strong class="runin">Décider avant le coucher du soleil</strong>, pas après. Ciel clair, pas de vent, air sec, fin août ou septembre : ce soir, on agit. S’il vente et que le ciel se couvre de froid, on ne couvre plus, on cueille.</p>
<p class="p0 lab kh"><strong class="runin">D’abord cueillir ce qui ne supporte rien et qu’on ne pourra pas couvrir.</strong></p>
<p class="li"><em>Tomates</em> : toutes celles qui sont vert mûr (<span class="ref">§6</span>, note), à la main, sans la tige. Les vert foncé encore petites restent : elles ne mûriront pas cueillies. Ou arracher le plant entier, fruits dessus, et le pendre tête en bas dans un endroit frais et sombre : les fruits mûrissent sur le plant et se cueillent à mesure.</p>
<p class="li"><em>Haricots, courgettes, concombres</em> : tout ce qui a une taille mangeable. C’est la cuisine de la semaine. En pot : les haricots à l’autoclave, selon leur barème (<span class="ref">ch. 78</span>) ; la courgette et le concombre, qui n’ont pas de barème d’autoclave, en marinade éprouvée (<span class="ref">ch. 78</span>) ou en fermentation (<span class="ref">ch. 80</span>). Voir <span class="ref">§8</span>, bloc 3.</p>
<p class="li"><em>Courges et citrouilles</em> qui ont commencé à prendre couleur : elles continuent à tourner cueillies, mais se gardent moins bien que celles mûries sur un plant vert. On les mange en premier ; les autres vont à la cure au chaud du <span class="ref">ch. 79</span>.</p>
<p class="p0 ri"><strong class="runin">Ensuite couvrir, dans cet ordre.</strong> Ce qui a le plus de valeur et le moins de résistance d’abord : tomates restées au plant, courges, haricots. Le chou, le chou frisé, le navet et le brocoli passent une gelée de −2 à −4 °C sans aide ; la carotte, la betterave, la laitue et l’épinard passent 0 à −2 °C. Le panais, lui, gagne à geler.</p>
<p class="p0 lab kh"><strong class="runin">Couvrir avec ce qu’il y a.</strong></p>
<p class="li"><em>Draps, couvertures de lit, rideaux</em> — secs. S’il y a de la rosée ou de la pluie, un plastique ou une toile de tente <strong>par-dessus</strong>, pour que le tissu reste sec.</p>
<p class="li"><em>Le sapinage</em> : branches de sapin baumier (<em>Abies balsamea</em>) ou d’épinette noire (<em>Picea mariana</em>) couchées en écailles sur les rangs bas. Elles cachent le ciel sans écraser.</p>
<p class="li"><em>Le foin de marais ou de grève</em>, étendu en couche égale sur un châssis, des arceaux ou des branches, pas à même les plants : ce qu’il touche gèle comme sous une toile. C’est une couverture des anciens pour les couches chaudes, et il se ramasse sur la côte. Le foin de grève se rince d’avance à l’eau douce : son sel, sinon, reste dans le sol (<span class="ref">ch. 95</span>).</p>
<p class="li"><em>Chaudières, boîtes de carton, caisses</em> renversées sur les plants isolés. Une chaudière de métal touche le plant au sommet : la retourner sur deux bouts de bois.</p>
<p class="li"><em>La terre elle-même.</em> Une terre sèche conduit mal la chaleur : sur un petit plant de tomate ou un jeune rang de pommes de terre, quelques pelletées de terre <strong>sèche</strong> jetées dessus pour une nuit le protègent ; on dégage à la main le lendemain matin. Ça ne marche que pour une nuit courte, et seulement sur ce qui plie sans casser.</p>
<p class="li"><em>L’eau qui gèle.</em> Des bouteilles de 2 L ou des bidons pleins, serrés en anneau autour d’un plant de tomate, le tout coiffé d’un sac qui repose sur le haut des bouteilles, jamais sur le plant : l’eau gèle avant la plante et chauffe en gelant. C’est le principe des anneaux d’eau vendus pour ça, qui tiennent vers −9 °C. Celui qu’on bricole tient moins, d’autant moins qu’il y a peu d’eau ; personne n’a mesuré de combien.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on ne fait pas :</strong> arroser le feuillage à la chaudière (<span class="ref">§5-G</span>, étape 46), bêcher, laisser le paillis contre les rangs couverts, laisser une toile toucher les feuilles.</p>
<p class="p0 ri"><strong class="runin">Le lendemain.</strong> Découvrir quand le soleil est dessus et que tout a dégelé. Attendre midi pour juger. Ce qui est translucide et mou se mange <strong>le jour même</strong> : un tissu gelé puis dégelé ne se garde plus. Les pommes de terre dont le feuillage a noirci sont défanées par le gel : on les laisse en terre une à deux semaines, le temps que la pelure épaississe, puis on arrache par temps sec, plus tôt seulement si la terre menace de geler (<span class="ref">ch. 98</span>, étape 15). Celles qui montrent des taches grises sous la pelure à la coupe ne descendent pas au caveau (<span class="ref">ch. 79</span>). La carotte, la betterave et le navet restent en terre sous un paillis tant que le sol ne gèle pas : le froid les sucre. Ils se récoltent avant que la terre prenne.</p>
<p class="p0 ri"><strong class="runin">Faire mûrir les tomates vertes.</strong> Laver, sécher, envelopper chacune dans une feuille de papier journal, poser en un seul rang dans une caisse, dans un endroit sombre à 16 à 18 °C : un coin du chalet loin du poêle. Ouvrir la caisse chaque semaine et jeter tout ce qui mollit ou tache. Quand une tomate commence à rougir, la sortir du papier et la poser à la température de la pièce. <strong>Ce qu’on perd :</strong> une partie du lot, qui pourrit en caisse.</p>
<h3 class="sub">Fabriquer ce qui manque</h3>
<p class="p0 ri"><strong class="runin">Le paillasson.</strong> C’est la couverture de nuit des maraîchers d’autrefois, et elle se fait avec ce qui pousse au bord de l’eau.</p>
<p class="li"><em>Le métier.</em> Sur un sol plat, planter de champ deux planches de 2 m de long et 10 cm de large, parallèles, à 1,33 m l’une de l’autre : elles fixent la largeur. Entre elles, trois lignes à 33 cm d’écart, et au bout de chaque ligne un piquet gros comme un doigt, qui dépasse de 4 cm. Six piquets : ils fixent la longueur.</p>
<p class="li"><em>La ficelle.</em> Tendre fort trois ficelles d’un piquet à l’autre, bouclées au piquet du haut. Au piquet du bas, ne pas couper : garder le double de la longueur tendue, qu’on enroule sur une bobine de bois de 12 cm. Il faut <strong>18 m de ficelle pour un paillasson de 2 m</strong>. Faute de ficelle : racine d’épinette fendue, écorce interne d’aulne rouie, ou feuilles de quenouille (<em>Typha latifolia</em>) tordues (<span class="ref">ch. 103</span>).</p>
<p class="li"><em>La paille.</em> Poser un lit mince et égal sur les ficelles, pied de la paille contre une planche ; un autre lit depuis l’autre planche, <strong>tête-bêche</strong> sur le premier. Paille de céréale si on en a ; sinon foin de grève rincé, grandes herbes sèches, feuilles de quenouille : une natte de tiges sèches du coin, tressée ou cousue, protège aussi.</p>
<p class="li"><em>La couture.</em> À genoux au bas du métier, prendre de la main gauche une pincée de paille grosse comme un doigt en soulevant la ficelle tendue dessous ; de la main droite, passer la bobine sous la ficelle et la ramener entre la pincée et la ficelle du dessus : un nœud coulant. Pincée suivante, nœud suivant, jusqu’en haut.</p>
<p class="li">Ce paillasson couvre un châssis de 91 × 183 cm avec de la marge, se roule le matin, sèche vite parce qu’il est mince. Les anciens le voulaient léger et prompt à sécher, et c’est ce qui compte : un paillasson qui reste mouillé refroidit ce qu’il couvre (<span class="ref">§5-E</span>, étape 35).</p>
<p class="p0 ri"><strong class="runin">Le tunnel sans plastique acheté.</strong> Arceaux de perches d’aulne ou d’épinette écorcées, pliées fraîches et plantées tous les 90 cm à 1,5 m ; une perche faîtière liée sur le dessus contre le vent. Couverture : rideau de douche, bâche claire, toile de tente crevée, sacs transparents fendus et cousus, vieilles fenêtres appuyées en pignon. Ce qui compte, c’est que ça laisse passer la lumière et que ce soit <strong>lesté sur tout le bord</strong> : pierres, sacs de terre, terre pelletée, et des pierres qu’on enlève du côté qu’on ouvre. Des trous de 5 cm tous les 60 à 90 cm sur les côtés font l’aération de ceux qui ne sont pas là à midi, mais un tunnel percé ne gagne plus qu’environ 1 °C : les soirs de gel, on bouche les trous d’une motte ou on pose une toile par-dessus (<span class="ref">§5-E</span>, étape 33). <strong>Ce qu’on perd :</strong> un plastique qui n’a pas été fait pour le soleil vieillit vite dehors, et il se déchire au premier gros vent.</p>
<p class="p0 ri"><strong class="runin">Le châssis sans menuisier.</strong> Un coffre de perches empilées, les coins entaillés à mi-bois (<span class="ref">ch. 110</span>), plus haut au nord qu’au sud, rechaussé de terre ou de fumier jusqu’en haut ; une vieille fenêtre dessus, ou un cadre de perches tendu de coton ou de plastique. Le coton suffit au printemps avancé ; le verre vaut mieux dès qu’une grosse gelée menace. <strong>Ce qu’on perd :</strong> l’étanchéité du coffre de madriers. Un coffre qui laisse passer l’air par les joints perd sa chaleur la nuit ; on bouche avec de la mousse tassée et on rechausse plus haut.</p>
<p class="p0 ri"><strong class="runin">La couche sans cheval.</strong> Au chalet, il n’y a pas de cheval, et c’est la pièce qui manque le plus : sans lui, pas de couche chaude. Ce qu’on monte avec ce qu’on a, c’est une couche <strong>sourde</strong> : elle chauffe moins fort, se monte quand les gelées ne sont plus qu’accidentelles, et donne ses produits six semaines à deux mois plus tard qu’une couche chaude.</p>
<p class="li"><em>La recette</em> : un tiers de litière fraîche du poulailler ou du clapier (<span class="ref">ch. 101</span>), deux tiers de feuilles, de mousse ou d’herbe fraîchement coupée, bien mêlés, mouillés, en lit de 40 cm tassé, couvert de 20 cm de terreau mêlé de terre. La mousse chauffe moins que les feuilles, mais plus longtemps, et ne coûte rien près du bois. Tas couvert, retourné dès qu’il fume, semé au thermomètre, comme au <span class="ref">§5-B</span>.</p>
<p class="li"><em>Ce qui y pousse se mange cuit</em> : c’est du fumier cru (<span class="ref">§8</span>, bloc 1).</p>
<p class="li"><em>En août</em>, l’herbe est partout : la même couche, montée à la fin d’août sous un châssis, permet de tenter épinards et laitues d’automne, à manger cuits.</p>
<p class="li"><em>Le volume.</em> C’est lui qui manque le plus souvent. Le lit de 40 cm d’un seul châssis (<span class="ref">§5-B</span>, étapes 7 et 10) demande environ 2 m³ de matière, d’un coup, plus le rechaussage. Faute de l’avoir, on fait un châssis froid (<span class="ref">§5-D</span>, étape 27).</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd :</strong> la chaleur forte et régulière du cheval, et toute prévision. On ne sait pas d’avance combien de jours elle tiendra ; on le sait au thermomètre, ou à la main (<span class="ref">§4</span>). Le réchaud (<span class="ref">§5-B</span>, étape 16) se fait avec la même matière.</p>
<p class="p0 ri"><strong class="runin">La masse qui garde la chaleur, avec ce qu’on a.</strong> Des bidons, des chaudières fermées, des bouteilles, pleins d’eau avec un peu d’air sous le bouchon, noircis à la suie ou peints foncé, au fond du châssis ou le long du mur de la serre, au soleil. Un baril de 200 L qui perd 10 °C rend environ 8 400 kJ ; le même baril qui gèle en entier en rend environ 67 000, autant qu’une chaufferette de 1 500 W allumée un peu plus de douze heures. Mais c’est l’énergie, pas la puissance : le baril la rend lentement, par sa surface, seulement quand l’air est plus froid que lui, et une nuit de gel ne le fait pas geler en entier. Un muret de pierres sèches au nord d’une planche fait la même chose, en moins bien : à poids égal, la pierre garde cinq fois moins de chaleur que l’eau par degré, mais elle ne gèle pas, ne coule pas et ne coûte rien. <strong>Ce qu’on perd :</strong> la place. La masse qui compte se mesure en centaines de litres, et un châssis de 91 × 183 cm n’en loge que quelques bidons.</p>
<p class="p0 ri"><strong class="runin">L’ados à la bêche</strong> (<span class="ref">§5-D</span>, étape 28) ne demande rien d’autre qu’une bêche et un cordeau : c’est la façon la moins chère de gagner du soleil au printemps.</p>
<p class="p0 ri"><strong class="runin">Les semis sans lampe.</strong> La fenêtre la plus au sud, des godets de papier journal, et la couche chaude ou le châssis comme vraie lampe dès qu’ils sont prêts (<span class="ref">§5-C</span>, étape 23). Passer la main sur les plants chaque jour et les garder au frais plutôt qu’au chaud les tient plus trapus (<span class="ref">ch. 95</span>). <strong>Ce qu’on perd :</strong> les plants les plus longs à faire. Sans lampe, l’oignon de semis, qu’il faudrait semer de fin février à fin mars, et le poivron, début avril, filent avant que la couche soit prête ; on sème alors l’oignon en bulbilles et on renonce au poivron.</p>
<h3 class="sub">Ce que la variante ne remplace jamais</h3>
<p class="li"><strong>Les jours de la variété.</strong> Couche, châssis, tunnel et toile avancent le début de quelques semaines et reculent la fin de quelques nuits ; ils ne font pas un deuxième été. Une espèce qui demande plus de jours que la saison allongée n’en donne sort du jardin (<span class="ref">ch. 95</span>, <span class="ref">ch. 100</span>).</p>
<p class="li"><strong>La présence.</strong> Tout ce qui se ferme sur une plante dépasse 54 °C en une heure de soleil. Un tunnel fermé un matin où personne n’est là, c’est la récolte perdue. Aucun moyen de ce chapitre ne tient une semaine sans quelqu’un matin et soir.</p>
<p class="li"><strong>Le thermomètre de la couche chaude.</strong> Sans lui, on sème trop tôt et on cuit les racines, ou trop tard et la couche a refroidi. La main dit brûlant ou tiède, jamais 30 °C.</p>
<p class="li"><strong>L’autoclave</strong>, pour la récolte sauvée d’un coup (<span class="ref">§8</span>, bloc 3).</p>
<p class="li"><strong>La règle du fumier cru</strong> et celle du plastique transparent sur les pommes de terre : elles ne coûtent rien, elles sont donc dans les deux versions.</p>
</template>
<template id="notes">
<p class="fn" data-fn="24-1"><span class="fnn">1</span>L’« anesthésie en selle » : la peau que toucherait une selle — l’intérieur des cuisses, les fesses, le pourtour de l’anus et les organes génitaux — ne sent plus, ou sent « à travers un gant ». Elle se teste en effleurant ces zones d’un brin de foin ou du bout d’un doigt, des deux côtés, et en comparant avec le bas de la cuisse.</p>
<p class="fn" data-fn="24-2"><span class="fnn">2</span>Le pied qui tombe : assis, talon au sol, on relève la pointe du pied vers le tibia, puis on marche quelques pas sur les talons. Un pied qui ne se relève pas, qui claque au sol à chaque pas ou dont la pointe accroche, c’est un nerf qui ne commande plus le muscle.</p>
<p class="fn" data-fn="24-3"><span class="fnn">3</span>La pointe de la cheville, ce sont les deux bosses osseuses de chaque côté de la cheville : l’intérieure est le bout du tibia, l’extérieure le bout du péroné. La bosse du bord extérieur du pied se trouve à mi-longueur du pied, là où le bord s’élargit ; celle du bord intérieur, un peu en avant et en dessous de la cheville intérieure.</p>
<p class="fn" data-fn="24-4"><span class="fnn">4</span>La tête du péroné est la petite bosse osseuse du côté extérieur de la jambe, juste sous le genou, un peu vers l’arrière.</p>
<p class="fn" data-fn="24-5"><span class="fnn">5</span>La hernie de l’aine se cherche debout, la main à plat sur le pli de l’aine : on tousse, ou on pousse comme pour forcer. Une bosse qui vient pousser contre la main et repart quand on se détend, c’est elle. Elle est plus fréquente chez l’homme, et chez lui elle peut descendre dans les bourses et les faire enfler d’un seul côté.</p>
<p class="fn" data-fn="29-1"><span class="fnn">1</span>La glaire cervicale : une humidité qu’on sent à la vulve ou qu’on voit sur les doigts, sur la culotte ou sur un papier essuyé à l’extérieur du vagin. Les jours fertiles, elle devient claire, glissante et élastique, comme du blanc d’œuf cru ; les jours secs, on ne voit et on ne sent rien.</p>
<p class="fn" data-fn="29-2"><span class="fnn">2</span>Le choc toxique vient vite, pendant les règles avec un tampon ou une coupe, et aussi après un accouchement : forte fièvre, ou chaud et froid avec des frissons ; mal dans les muscles, comme une grippe ; vomissements et diarrhée ; une rougeur de la peau rugueuse comme du papier sablé ; les paumes, la plante des pieds, la langue et le blanc des yeux qui deviennent rouge vif ; étourdie, confuse. La peau peut enfler ou peler par grandes plaques.</p>
<p class="fn" data-fn="29-3"><span class="fnn">3</span>Un saignement de carence en vitamine K : un saignement qu’on n’attendait pas et qui ne s’arrête pas — au cordon, à une égratignure —, du sang dans les selles ou dans ce que le bébé vomit, des bleus sans coup. La forme tardive, entre 2 et 12 semaines, touche presque seulement les bébés allaités et saigne une fois sur deux dans le cerveau, où rien ne se voit : c’est pour ça que la vitamine se donne d’avance au lieu d’attendre un signe.</p>
<p class="fn" data-fn="29-4"><span class="fnn">4</span>La grossesse hors de l’utérus s’implante ailleurs, le plus souvent dans une trompe. Au début, peu ou pas de signes, puis ils deviennent graves : une douleur au ventre qui n’est pas celle des règles, ou un ventre sensible au toucher, souvent d’un seul côté ; un saignement différent des règles habituelles, ou pas de règles du tout ; des étourdissements ; un évanouissement ; parfois une douleur aux épaules. C’est l’ensemble qui fait penser à elle, pas un signe seul. Quand la trompe se déchire, la douleur devient soudaine et aiguë, en coup de couteau au bas du ventre, d’un côté ou partout ; le sang qui coule dans le ventre peut donner mal à l’épaule droite en appuyant sous les côtes, et en quelques heures le ventre devient dur et elle tombe en choc.</p>
<p class="fn" data-fn="29-5"><span class="fnn">5</span>La prééclampsie se remarque à des maux de tête sévères, à une douleur qui serre le haut du ventre sous les côtes comme une barre, à une vue qui change d’un coup, et à une enflure qui devient générale : les jambes, mais aussi les mains et le visage. Elle peut mener à des convulsions : yeux qui roulent, visage et mains qui tressautent, corps raide ou secoué, peau bleue, perte de conscience, parfois la langue mordue, l’urine ou les selles qui partent ; puis un sommeil, et au réveil une confusion.</p>
<p class="fn" data-fn="29-6"><span class="fnn">6</span>Le tirage : à chaque inspiration, la peau entre les côtes et sous le sternum se creuse vers l’intérieur, parce que le bébé force pour faire entrer l’air.</p>
<p class="fn" data-fn="97-1"><span class="fnn">1</span>Un degré-jour, c’est un degré au-dessus du seuil pendant un jour. Une journée à 15 °C de moyenne compte 10 degrés-jours au-dessus de 5 °C ; une journée à 4 °C n’en compte aucun. Le total dit combien de chaleur utile la saison a vraiment donnée.</p>
<p class="fn" data-fn="97-2"><span class="fnn">2</span>Un plant qui file est long, mince, pâle, et penche vers la lumière. Il casse au premier vent au repiquage. Il manque de lumière, ou il a trop chaud pour la lumière qu’il reçoit.</p>
<p class="fn" data-fn="97-3"><span class="fnn">3</span>Une tomate « vert mûr » a atteint presque sa taille finale et est passée du vert foncé à un vert pâle tirant sur le blanc ; elle est ferme et pleine. Une tomate vert foncé, encore petite, ne rougira pas.</p>
<p class="fn" data-fn="97-4"><span class="fnn">4</span>Un tissu gelé devient translucide, comme trempé d’eau, et mou ; au dégel, la peau d’une feuille de chou se détache, la carotte se couvre de cloques et se fend en long, la tomate ramollit, avec une frontière nette entre la partie morte et la partie saine.</p>
</template>

function finishPages(){

    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
