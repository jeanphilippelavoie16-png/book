<p class="p0">C’est le cas ordinaire, pas le cas rare : le guide a pris l’eau, l’herbier est resté à la maison, c’est janvier et il n’y a plus de feuille, ou c’est une espèce qu’on n’a jamais vue. La règle ne fléchit pas : <strong>une plante dont on n’est pas sûr ne va dans aucune bouche</strong>, ni la sienne, ni surtout celle d’un enfant (<span class="ref">ch. 33</span>, <span class="ref">§9</span>). Ce qui reste est plus large qu’on pense, parce que la moitié de ce chapitre ne dépend d’aucune plante.</p>
<h3 class="sub">Trois ressources qui se reconnaissent sans guide</h3>
<p class="li"><strong>Le sapin et l’épinette</strong>, au toucher, dans le noir : le sapin a des aiguilles plates et molles et des cloques de gomme sur l’écorce lisse ; l’épinette, des aiguilles piquantes qui roulent entre les doigts. Le cèdre n’a pas d’aiguilles du tout (<span class="ref">ch. 33</span>, <span class="ref">§9</span>). <strong>Ce triage sépare le sapin du cèdre, pas du tout de l’if du Canada</strong>, un arbuste bas du sous-bois aux aiguilles plates et molles lui aussi, mortel frais ou sec (<span class="ref">§8</span>). Ce qui tranche, sur la plante même où l’on prend les aiguilles : un <strong>arbre à tronc unique</strong>, qui porte des <strong>cloques de gomme</strong> sur son écorce, jamais un arbuste bas aux tiges couchées ; et mieux encore, un arbre marqué en été (<span class="ref">ch. 20</span>, <span class="ref">§5-C</span>). L’épinette, elle, ne se confond pas avec l’if : ses aiguilles piquent et roulent. Ils donnent la tisane, le sirop, la gomme, donc l’onguent de plaie et de pied d’athlète.</p>
<p class="li"><strong>Le peuplier baumier</strong>, au nez et aux doigts, au printemps : trois caractères qui se vérifient à la main — le bourgeon brun-orangé, qui colle, qui sent le baume — et, dès que la neige part, la queue ronde des feuilles de l’automne, au sol sous l’arbre (étape 2).</p>
<p class="li"><strong>Le framboisier</strong>, en été, à sa canne épineuse et à son fruit (<span class="ref">ch. 91</span>). Hors saison, sans fruit, on ne le prend pas.</p>
<p>Tout le reste — saule, savoyane, plantain, thé du Labrador — attend qu’on soit sûr.</p>
<h3 class="sub">Ce qui marche sans aucune plante</h3>
<table class="tspan"><colgroup><col style="width:13.5%"><col style="width:51.5%"><col style="width:35.0%"></colgroup><thead><tr><th>Mal</th><th>Ce qu’on fait avec rien</th><th>Ce qu’on perd</th></tr></thead><tbody><tr><td class="c-item">Toux, rhume</td><td>Eau sucrée chaude, ou sirop de sucre seul, à la cuillère (<span class="ref">§3</span>) ; boire</td><td>Le goût du sapin et un peu de vitamine C, pas l’effet</td></tr><tr><td class="c-item">Mal de gorge</td><td>Sirop de sucre, boissons chaudes</td><td>Les tanins du framboisier</td></tr><tr><td class="c-item">Diarrhée</td><td>La solution de réhydratation au sucre et au sel, pesés, moins salée que des larmes (<span class="ref">ch. 26</span>, <span class="ref">§9</span> ; <span class="ref">ch. 30</span>, étape 20)</td><td>Rien d’essentiel : c’est elle qui soignait</td></tr><tr><td class="c-item">Constipation</td><td>Eau, marche, gruau, fruits séchés du stock (<span class="ref">ch. 21</span>)</td><td>Les petits fruits de la forêt</td></tr><tr><td class="c-item">Plaie qui s’infecte</td><td>Lavage au jet, eau salée à 9 g/L, pansement bouilli changé chaque jour (<span class="ref">ch. 26</span>, <span class="ref">ch. 32</span>)</td><td>L’effet de la résine sur le staphylocoque</td></tr><tr><td class="c-item">Furoncle, abcès</td><td>Compresses chaudes ; incision hors des zones interdites (étapes 23 à 25)</td><td>Rien : la compresse et la lame ne sont pas des plantes</td></tr><tr><td class="c-item">Brûlure</td><td>L’eau, 20 minutes, et un linge propre (<span class="ref">ch. 26</span>) ; le miel s’il y en a</td><td>L’onguent de bourgeons pour la suite</td></tr><tr><td class="c-item">Douleur</td><td>Chaleur ou froid, repos, attelle (<span class="ref">ch. 26</span>, <span class="ref">§9</span>)</td><td>Le salicylé, faible de toute façon</td></tr><tr><td class="c-item">Fièvre</td><td>Pièce moins chauffée, linge léger, boire (<span class="ref">ch. 32</span>, <span class="ref">§9</span>)</td><td>Rien que la forêt donnait à un enfant</td></tr><tr><td class="c-item">Insomnie</td><td>La routine (<span class="ref">ch. 36</span>, <span class="ref">ch. 40</span>)</td><td>Rien : aucune plante ne faisait dormir</td></tr><tr><td class="c-item">Poux</td><td>Peigne, ongles, rasoir ; linge à l’eau chaude ou au sac (§J)</td><td>Rien : aucune plante ne tuait les poux</td></tr><tr><td class="c-item">Gale</td><td>Linge chauffé ou isolé, toute la maison le même jour (§K)</td><td>Rien : la forêt ne tuait pas l’acarien</td></tr><tr><td class="c-item">Pied d’athlète</td><td>Sécher, aérer, changer de bas, bottes au sec (étape 55)</td><td>L’onguent à la résine</td></tr><tr><td class="c-item">Piqûre</td><td>Dard retiré tout de suite, eau et savon (étapes 59 et 61)</td><td>Le plantain</td></tr></tbody></table>
<h3 class="sub">Peser sans balance : le fléau à bras égaux</h3>
<p class="p0">Le fléau du <span class="ref">ch. 33</span> (<span class="ref">§9</span>) s’équilibre à vide en déplaçant les attaches des plateaux : les bras n’ont plus la même longueur, et ça ne gêne pas là-bas, parce que la pierre-étalon répète toujours la même charge du même côté. Ici, on compare deux charges entre elles, et des bras inégaux trompent. Par exemple, des plateaux de 20 et de 25 g équilibrés sur un bras de 30 cm mettent l’autre bras à 24 cm ; des charges égales ne s’équilibrent plus, et un sirop visé à 2 pour 1 peut sortir à 1,6 pour 1, sous le seuil où il se garde. Le fléau se règle donc autrement.</p>
<p class="step"><span class="sn">1</span><strong>Le pivot au milieu exact.</strong> Mesurer la baguette avec une ficelle, plier la ficelle en deux : le pli marque le milieu. L’encoche de suspension va là.</p>
<p class="step"><span class="sn">2</span><strong>Les plateaux à la même distance.</strong> Deux encoches à égale distance du milieu, prises avec la même ficelle ; les plateaux y pendent et n’en bougent plus.</p>
<p class="step"><span class="sn">3</span><strong>La tare en ajoutant, jamais en déplaçant.</strong> À vide, le plateau léger reçoit un caillou ou une boulette de gomme jusqu’à l’horizontale. Déplacer une attache rendrait les bras inégaux.</p>
<p class="step"><span class="sn">4</span><strong>L’épreuve.</strong> Deux charges en équilibre, on les inverse d’un plateau à l’autre : l’équilibre doit tenir. S’il bascule, les bras ne sont pas égaux ; on reprend au point 1.</p>
<p class="p0 ri"><strong class="runin">Le sirop et l’onguent</strong>, qui sont des rapports. Verser l’infusion filtrée dans un contenant posé sur un plateau, et un contenant pareil, vide, sur l’autre : les deux contenants s’annulent. Sucre dans le contenant vide jusqu’à l’équilibre : c’est une part. Mettre ce sucre de côté, recommencer : deux parts. Les deux parts de sucre vont dans l’infusion. Même méthode pour l’onguent de bourgeons : une part de bourgeons, puis trois pesées de gras égales à elle.</p>
<p class="p0 ri"><strong class="runin">Le saule et le framboisier</strong>, qui se dosent en grammes. Un rapport ne suffit plus : il faut la pierre-étalon faite d’avance, le jour où une balance existe encore (<span class="ref">ch. 33</span>, <span class="ref">§9</span>). Sans elle, le fléau à bras égaux la fabrique par moitiés, à partir du sac de sucre, dont le poids est imprimé : 1 kg partagé entre les deux plateaux jusqu’à l’équilibre donne deux tas de 500 g ; un tas retourne au sac, l’autre se repartage. À la neuvième moitié, il reste un peu moins de 2 g (1 000 ÷ 512). La pierre qui équilibre ce petit tas dose une prise d’écorce de saule, sous les 3 g de l’étape 32 ; deux pierres, une prise de feuille de framboisier (étape 10).</p>
<p><em>Ce qu’on perd :</em> la précision au gramme. Pour le sirop, c’est sans importance : il tient s’il est assez sucré, et le fléau penche toujours du côté du trop sucré si on le charge jusqu’à ce qu’il bascule. Pour le saule, la pierre faite par moitiés est approchée : on ne l’arrondit jamais vers le haut, et une prise ne prend jamais deux pierres.</p>
<h3 class="sub">Le sirop quand il n’y a plus de sucre</h3>
<p class="p0">Le sucre du sirop peut venir de l’arbre, dans cet ordre. D’abord le <strong>sirop de sève</strong>, fait comme au <span class="ref">ch. 94</span> (<span class="ref">§5-C</span> à <span class="ref">§5-E</span>) : des dizaines de kilos de sève pour un kilo de sirop (<span class="ref">ch. 94</span>, <span class="ref">§3</span>), évaporés <strong>dehors</strong>, sur un grand feu, dans une casserole large, jamais dans le chalet (<span class="ref">ch. 94</span>, <span class="ref">§8</span>) ; seule la fin se fait au petit chaudron, sur un feu réglé, jusqu’à 66-67 °Brix. Ensuite, à part, une infusion forte d’aiguilles (étape 1), versée dans le sirop fini ; puis on ramène le mélange à 66-67 °Brix au petit chaudron et on met en pot chaud (<span class="ref">ch. 94</span>, étapes 27 et 29). Infuser les aiguilles dans la sève avant des heures d’ébullition chasserait justement ce qu’elles apportent : ce qui part en vapeur (<span class="ref">ch. 33</span>, <span class="ref">§9</span>) et la vitamine C, dont un jus bouilli jusqu’au dixième de son volume perd la moitié (<span class="ref">ch. 20</span>, étape 8). Hors saison, le <strong>sucre de sève</strong> fait au printemps (<span class="ref">ch. 94</span>, étape 31) remplace le sucre acheté, deux parts pour une d’infusion. Le sirop de sève gardé, lui, est déjà à la limite : allongé d’infusion, il tombe sous 66 °Brix et retourne au petit chaudron.</p>
<p><em>Ce qu’on perd :</em> la saison. La sève ne coule que quelques semaines, et il en faut beaucoup pour un peu de sirop (<span class="ref">ch. 94</span>). Sans sucre d’aucune sorte, il reste la tisane chaude, qui fait boire.</p>
<h3 class="sub">La compresse qui garde sa chaleur</h3>
<p class="p0">Un sac de linge rempli de sable sec ou de gravier fin, chauffé près des braises, roulé dans un deuxième linge et posé sur la compresse mouillée : le sable garde la chaleur que le linge mince perd en quelques minutes. Des pierres sèches font la même chose, jamais des pierres prises dans un ruisseau, un gravier humide ou la neige, qui éclatent au feu (<span class="ref">ch. 26</span> et <span class="ref">ch. 33</span>, <span class="ref">§9</span>). La peau d’un malade fiévreux, endormi ou refroidi ne sent pas la brûlure, et il ne retire pas son bras (<span class="ref">ch. 26</span>, <span class="ref">§9</span>) : ce qui est confortable à une main chaude le cuit. On regarde sous la compresse à chaque changement.</p>
<h3 class="sub">Ouvrir un abcès avec ce qu’il y a</h3>
<p class="p0">Le geste, la lame et le rinçage sont au <span class="ref">ch. 28</span> (étape 54 et <span class="ref">§9</span>), avec les garde-fous des étapes 24 et 25.</p>
<p class="li"><strong>La lame.</strong> Une lame de rasoir neuve, s’il y en a, parce qu’elle coupe en un seul trait. Sinon la lame la plus fine, affûtée (<span class="ref">ch. 105</span>), <strong>bouillie</strong> 30 minutes à gros bouillons dans une casserole couverte (<span class="ref">ch. 28</span>, <span class="ref">§9</span>). Jamais la pointe d’un couteau passée au rouge : le rouge dépasse de loin la température de revenu, la pointe se ramollit pour de bon et le fil ne fait plus un trait franc (<span class="ref">ch. 105</span>, <span class="ref">§3</span>). Le rouge reste pour l’aiguille à écharde (<span class="ref">ch. 26</span>, <span class="ref">§9</span>).</p>
<p class="li"><strong>Le lavage.</strong> La bouteille souple percée au clou chauffé et l’eau bouillie salée à 9 g/L (<span class="ref">ch. 26</span> et <span class="ref">ch. 32</span>, <span class="ref">§9</span>). Sans sel, l’eau bouillie seule : le jet compte plus que ce qu’il contient.</p>
<p class="li"><strong>La douleur.</strong> Il n’y a pas d’anesthésie : la vitesse du seul trait franc fait tout. C’est pour ça que l’enfant, et l’abcès profond, mal délimité ou de plus de 5 cm, ne s’ouvrent pas (étape 24).</p>
<p><em>Ce qu’on perd :</em> la stérilité, et la possibilité de reprendre si on s’est trompé d’endroit. C’est pourquoi la liste de l’étape 25 ne se discute pas.</p>
<h3 class="sub">Venir à bout des poux sans peigne fin</h3>
<p class="p0">Le peigne fin se remplace mal : le meilleur, en métal, laisse <strong>moins d’un dixième de millimètre</strong> entre deux dents, et une lente fait <strong>0,8 mm</strong> de long. Un peigne de plastique plus ouvert en laisse passer, et une dent taillée au couteau n’approche pas de cet écart. Sans lui, il reste deux méthodes.</p>
<p class="step"><span class="sn">1</span><strong>Les ongles.</strong> La serviette humide 30 minutes, puis mèche par mèche, au jour, près d’une fenêtre, chaque lente vivante pincée entre deux ongles et glissée jusqu’au bout du cheveu. C’est long, et on recommence aux jours 5, 9 et 13. Quand il n’y a que quelques lentes, couper au ciseau, un par un, les cheveux qui les portent.</p>
<p class="step"><span class="sn">2</span><strong>Le rasoir.</strong> Ce qui n’a pas de cheveu n’a pas de lente. Les ciseaux d’abord, au plus court, puis le rasoir sur la peau mouillée et savonnée. Chez un enfant, on le fait avant le jour où la fatigue de tout le monde en fait une punition.</p>
<p>Dans les deux cas, le linge suit la règle du <span class="ref">ch. 31</span>, et ce qui n’a pas touché une tête depuis 2 jours ne porte plus de pou vivant.</p>
<p><em>Ce qu’on perd :</em> avec les ongles, la certitude, parce qu’une lente oubliée recommence tout ; avec le rasoir, les cheveux, et chez un enfant qui a peur, un peu de fierté (<span class="ref">ch. 40</span>).</p>
<h3 class="sub">Traiter le linge d’une maison qui a la gale, sans laveuse</h3>
<p class="p0">La gale ne se règle qu’en un seul jour pour tout le monde, et c’est le linge qui fait défaut. Le chaudron du poêle ne contient pas la literie de quatre personnes.</p>
<p class="step"><span class="sn">1</span><strong>Ce qui se porte contre la peau</strong> — sous-vêtements, pyjamas, draps, taies, serviettes — va à l’eau bouillante, par charges, le jour du traitement. Sans thermomètre, l’eau qui bout dépasse largement les 50 °C ; on la laisse bouillir 10 minutes par charge.</p>
<p class="step"><span class="sn">2</span><strong>Ce qui ne bouillit pas</strong> — manteaux, couvertures de laine, peaux, bottes, toutous — va dans des sacs fermés, un coffre ou une pièce qu’on ferme, <strong>une semaine</strong>, dans la partie <strong>chauffée et sèche</strong> du chalet. Pas dans la remise, et pas dehors : le froid humide d’ici garde l’acarien en vie au lieu de le tuer (étape 51).</p>
<p class="step"><span class="sn">3</span><strong>La maisonnée vit la semaine dans du linge neuf ou bouilli</strong> pendant que le reste attend.</p>
<p class="p0 ri"><strong class="runin">L’onguent de soufre, s’il y a du soufre.</strong> C’est le seul scabicide qui se mêle au chalet : du <strong>soufre précipité</strong>, celui de la pharmacie, dans de la vaseline, <strong>6 g de soufre pour faire 100 g d’onguent</strong>, les deux pesés au fléau à bras égaux (plus haut). Sans vaseline, du saindoux ou un gras rendu : c’était la base de l’onguent de soufre d’autrefois. Jamais plus de 10 g pour 100 g : au-delà de 15 %, le soufre brûle la peau, et un onguent à 10 % posé trois jours de suite sur des nourrissons en a tué plusieurs. Une couche mince du cou aux orteils, plantes des pieds comprises, <strong>trois soirs de suite</strong> ; un bain avant chaque couche et un autre le lendemain de la dernière ; environ 30 g par adulte à chaque fois, moins pour un enfant. Une seule couche ne suffit pas : moins d’un malade sur deux s’en débarrasse, contre neuf sur dix en trois soirs. Toute la maison, le même jour, comme le linge.</p>
<p><em>Ce qu’on perd :</em> sans crème ni soufre, rien de tout ça ne guérit la peau de ceux qui ont déjà la gale ; ça empêche seulement de se la redonner. C’est la moitié du travail, et la seule qui se fait sans pharmacie.</p>
<h3 class="sub">Le pied d’athlète quand il n’y a plus de gomme propre</h3>
<p class="p0">Sécher et aérer ôte au champignon la macération dont il vit : bas de laine changés deux fois par jour et séchés au-dessus du poêle, bottes ouvertes près du feu la nuit, pieds nus dans le chalet, entre-orteils essuyés un par un. Le bois pourri de bouleau, séché et réduit en poudre fine, a servi de poudre à bébé chez les Cris et les Métis : le bois sec boit l’humidité. L’avertissement : le bois qui pourrit dans l’humidité est l’endroit où pousse le champignon de la blastomycose, commun au Québec près des lacs du Bouclier canadien, et on l’attrape surtout en respirant ses spores ; broyer du bois pourri, c’est les mettre en l’air. Le livre ne la prend pas. <em>Ce qu’on perd :</em> l’effet de la résine sur le champignon, qui est réel au laboratoire.</p>
<h3 class="sub">Ce qu’on perd, honnêtement</h3>
<p class="li"><strong>La dose.</strong> Dès qu’on sort des trois préparations dosées, il n’y en a plus. Le sirop, la compresse, le peigne et le linge bouilli n’ont pas besoin de dose ; tout le reste en aurait.</p>
<p class="li"><strong>La vitesse.</strong> Le saule prend une semaine, le peigne deux, la laque d’ongle neuf mois. Rien de la forêt ne soulage aussi vite qu’un comprimé.</p>
<p class="li"><strong>L’enfant.</strong> Presque rien de ce qui s’avale dans ce chapitre ne lui est permis. Pour un enfant, la forêt soigne par la peau, par l’eau chaude et par le peigne.</p>
<h3 class="sub">Ce qui ne se remplace pas</h3>
<p class="li"><strong>L’antibiotique</strong>, quand une infection dépasse son trait de crayon ou passe dans le sang.</p>
<p class="li"><strong>Le scabicide</strong>, pour la peau de ceux qui ont la gale. Le linge seul ne guérit personne ; seul l’onguent de soufre se fabrique, et seulement s’il y a du soufre au stock.</p>
<p class="li"><strong>L’antifongique en comprimé</strong>, pour l’ongle et pour la teigne du cuir chevelu de l’enfant.</p>
<p class="li"><strong>L’épinéphrine</strong>, pour la réaction allergique grave à une piqûre.</p>
<p class="li"><strong>L’acétaminophène de l’enfant</strong>, pour sa fièvre : rien dans la forêt ne lui est permis à la place.</p>
<p class="li"><strong>La certitude sur la plante.</strong> Il n’y a pas de version dégradée de l’identification (<span class="ref">ch. 33</span>, <span class="ref">§9</span>).</p>
</template>
<template id="notes">
<p class="fn" data-fn="34-1"><span class="fnn">1</span>Un abcès mûr est une bosse rouge, chaude et luisante qui, pressée doucement entre deux doigts posés de chaque côté, cède comme un ballon plein d’eau : on sent le liquide bouger sous la peau. Souvent une tache blanche ou jaune apparaît au sommet, là où le pus va sortir. Une bosse dure partout n’est pas mûre : compresses chaudes et patience. Une bosse qui bat sous les doigts n’est pas un abcès et ne se coupe jamais ; une bosse dure, fixe, qui grossit ou dure plus de deux semaines non plus (étapes 24 et 25).</p>
<p class="fn" data-fn="34-2"><span class="fnn">2</span>Une brûlure qui touche toutes les couches de la peau est blanche, peut avoir l’air de cuir, et peut ne pas faire mal au début. Le miel n’a fait ses preuves que sur les brûlures moins profondes, celles qui cloquent.</p>
<p class="fn" data-fn="34-3"><span class="fnn">3</span>Le déficit en G6PD est un manque héréditaire, surtout chez les hommes, d’une enzyme des globules rouges. Il ne se voit pas : on le sait par une analyse, ou parce qu’un médicament ou des fèves ont déjà donné à la personne une jaunisse — peau et blanc des yeux jaunes — avec des urines foncées, de la fatigue et le souffle court. Ses frères et sœurs aussi, tant qu’on ne sait pas.</p>
<p class="fn" data-fn="34-4"><span class="fnn">4</span>La lente vivante ressemble à une pellicule gonflée, luisante, blanc grisâtre et translucide, collée au cheveu : elle ne part pas en soufflant, alors qu’une pellicule s’envole. Le pou adulte est grisâtre, de la taille d’une graine de sésame, et il fuit la lumière.</p>
<p class="fn" data-fn="34-5"><span class="fnn">5</span>La teigne fait des plaques rondes où la peau pèle en fines écailles, avec des cheveux cassés court dans la plaque ; parfois la plaque enfle, suinte et fait des croûtes.</p>
<p class="fn" data-fn="34-6"><span class="fnn">6</span>Il commence 5 à 7 jours après le début d’un virus, par des nausées et des vomissements brusques et très violents ; puis l’enfant devient mou, confus, désorienté ou agité, et il peut convulser. C’est une atteinte du cerveau et du foie.</p>

<script>
(function(){

function splitPara(el, f){

  while(lo<=hi){ const mid=(lo+hi)>>1; const a=part(el,st[mid],true); f.appendChild(a); syncNotes(f); const ok=!OVER(f); f.removeChild(a); syncNotes(f); if(ok){best=mid;lo=mid+1;} else hi=mid-1; }

function splitTable(tb, f){

/* ---------- notes de bas de page ----------

const NOTES={};

function noteZone(f, make){

function sideOf(c, f, z){

function syncNotes(f){

function finishPages(){

function fitTitle(){

function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();

  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
