<p class="p0">La situation que ce chapitre prépare : un adulte seul, blessé, deux enfants de 4 et 6 ans, et un poêle qui demande du bois chaque jour. L’autre adulte est malade, parti, ou blessé lui aussi. Le bois se rentre quand même. Voici comment, et avec quoi.</p>
<h3 class="sub">L’ordre, quand on est seul et blessé</h3>
<p class="p0 ri"><strong class="runin">Ne faire que le bois du jour, et le faire en premier.</strong> Deux jours de bois gardés près du poêle (<span class="ref">ch. 83</span>, section 9) sont ce qui rend une blessure supportable : la première journée se passe à se soigner, pas à fendre. Ensuite, une seule corvée de bois par jour, en plein jour, aux heures chaudes. L’eau vient après. Le reste attend.</p>
<p class="p0 ri"><strong class="runin">Choisir la tâche selon la blessure, pas selon l’habitude.</strong> Le dos : rien du sol, tout à hauteur de hanche, tout tiré, rien porté — le toboggan chargé au tas, tiré de la poitrine jusqu’à la porte (<span class="ref">ch. 89</span>, section 5-K). La cheville : le travail qui se fait debout sur place, avec la béquille à portée, jamais sur la glace ni en terrain inégal ; le bois se fait tomber du dessus de la pile plutôt que d’aller le chercher. Le coude : l’autre main, le manche grossi, le bracelet pour le côté extérieur, et le bois fendu plus gros, qui demande moins de coups par bûche au prix d’un feu plus lent à prendre ; de l’autre main, fatigué, le coup rate plus souvent, et les pieds écartés, le billot et la hache affûtée de l’étape 11 ne se négligent plus. Le genou : aucun travail à genoux ni accroupi.</p>
<p class="p0 ri"><strong class="runin">Donner aux enfants une vraie tâche à leur taille.</strong> L’enfant de 6 ans peut tirer son propre toboggan, à sa taille, avec une charge à sa mesure (<span class="ref">ch. 89</span>, étape 60) : l’allumage, le petit bois, les bûches une à une. Celui de 4 ans porte le menu bois dans la boîte. Un enfant qu’on écarte conclut qu’il est de trop : quand un adulte tombe, on augmente ses tâches, on ne les diminue pas (<span class="ref">ch. 40</span>, étapes 4 et 43).</p>
<p class="p0 ri"><strong class="runin">Refaire le calcul de rester.</strong> Un adulte seul, blessé, avec deux enfants, c’est exactement la situation où s’organiser à plusieurs familles (<span class="ref">ch. 18</span>) ou partir (<span class="ref">ch. 2</span>) devient la bonne réponse. Le chapitre 26 le dit du soignant : celui qui devient le deuxième patient double le problème.</p>
<h3 class="sub">La béquille de fourche</h3>
<p class="p0">Un jeune aulne, un bouleau ou un érable qui fourche naturellement. La fourche part un peu sous la hauteur de la main ; les deux branches montent de chaque côté du bras et se referment à l’aisselle. <strong>La longueur : la taille du blessé moins 40 cm, jusqu’à l’appui de l’aisselle</strong>, et cet appui s’arrête à environ 5 cm sous le creux de l’aisselle, deux ou trois doigts. Une traverse liée entre les deux branches, à l’endroit où tombe la main, sert de poignée. Les deux branches se lient ensemble au sommet, rembourrées d’un linge plié ou d’un bout de fourrure. Au pied, dans la neige, un anneau de branche souple lacé en croix, comme une petite raquette, empêche le bâton de s’enfoncer.</p>
<p class="p0 ri"><strong class="runin">Le poids va dans les mains, coudes tendus, jamais dans l’aisselle.</strong> L’appui qui écrase le creux de l’aisselle, jour après jour, blesse l’artère et les nerfs du bras qui passent là ; une béquille trop longue fait exactement ça. Le haut de la béquille se serre contre les côtes, il ne porte pas. <strong>Une béquille seule, comme un bâton, se tient sous le bras du côté sain.</strong> C’est ce qui permet d’avancer la béquille et le pied blessé ensemble, en appuyant sur la béquille pour soulager le pied, puis de faire passer le bon pied devant. On tourne en pivotant sur le bon pied.</p>
<p><em>Ce qu’on perd :</em> une béquille seule soulage moins que deux, et une fourche ne se règle pas : si elle est trop longue, on recoupe le pied ; trop courte, on cloue ou on lie une cale dessous.</p>
<h3 class="sub">L’étrier de cheville</h3>
<p class="p0">C’est l’attelle en pince, en forme de U : une longue bande qui part de l’intérieur du mollet, passe sous le talon et remonte à l’extérieur du mollet. Dans une plaque d’écorce de bouleau à papier (<em>Betula papyrifera</em>) trempée dans l’eau chaude jusqu’à devenir souple, moulée sur la jambe et laissée sécher en place (<span class="ref">ch. 26</span>, section 9) ; à défaut, deux épaisseurs de carton ou deux bardeaux reliés sous le talon par une bande de cuir. Rembourrer les deux chevilles osseuses. Tenir le tout par une bande élastique en huit autour de la cheville, <strong>sans fermer l’attelle sur le devant</strong> : c’est le côté ouvert qui laisse de la place à l’enflure. La bande se desserre pour la nuit. Les premiers jours, l’enflure monte, et c’est la nuit que l’attelle bien serrée devient un garrot : couleur et chaleur des orteils se regardent au lever, au coucher et, les deux premières nuits, à chaque réveil pour le poêle (<span class="ref">ch. 26</span>, section 7).</p>
<p><em>Ce qu’on perd :</em> l’étrier tient la cheville droite mais ne l’empêche pas de pointer ; il sert les premiers jours, pas pour marcher en forêt.</p>
<h3 class="sub">La botte comme support</h3>
<p class="p0">Après les premiers jours, la botte de cuir montante fait le support lacé : la cheville bandée, la botte lacée serré sur le cou-de-pied et autour de la cheville, plus lâche sur les orteils. Une botte trop serrée écrase le pied et gèle les orteils (<span class="ref">ch. 104</span>, section 3) : si les orteils refroidissent, on délace le bas. <em>Ce qu’on perd :</em> un support acheté tient mieux sur le côté, et la botte ne se porte pas la nuit ; la nuit, la cheville repose surélevée, sans rien.</p>
<h3 class="sub">L’attelle de genou</h3>
<p class="p0">Deux perches droites ou deux planches, de la mi-cuisse à au-dessus de la cheville, une de chaque côté, rembourrées là où elles touchent les os, liées en trois points au moins, jamais sur la rotule. Elle sert pour la fracture, le gros ligament rompu, le tendon qui a lâché (étapes 50 et 52), pas pour l’entorse ordinaire. <em>Ce qu’on perd :</em> chaque semaine d’attelle se paie en raideur, et le genou est une des articulations qui raidissent le plus ; c’est pour ça qu’elle est réservée aux grosses blessures.</p>
<h3 class="sub">Le bracelet de contre-appui</h3>
<p class="p0">Une bande de cuir ou de chambre à air, nouée ou bouclée serrée autour du gras de l’avant-bras, juste sous le coude. Elle doit se faire sentir quand on serre le poing ; si les doigts picotent, elle est trop serrée. Elle se porte pour travailler, pas pour dormir.</p>
<h3 class="sub">Grossir le manche</h3>
<p class="p0">Un manche trop mince fait serrer plus fort, et c’est un des facteurs du coude du bûcheron. Enrouler une lanière de cuir, du ruban ou une corde serrée, puis du cuir par-dessus, jusqu’à ce que les doigts ne se referment plus complètement sur le manche. Un manche plus souple au toucher transmet aussi un peu moins de vibrations aux doigts. <em>Ce qu’on perd :</em> un manche grossi se tient moins précisément ; on le grossit là où la main serre, pas là où elle glisse.</p>
<h3 class="sub">Les attelles de pouce et de poignet</h3>
<p class="p0">Pour le pouce : une bande d’écorce de bouleau trempée chaude, moulée autour du pouce et du bord du poignet, et laissée sécher en place, le pouce légèrement écarté comme pour tenir un verre. Pour le poignet de la nuit : une latte de bois mince ou une écorce moulée sous l’avant-bras et la paume, le poignet droit, tenue par une bande. <strong>Jamais de peau crue mouillée moulée autour d’un membre qui enfle</strong> : la babiche serre en séchant (<span class="ref">ch. 103</span>), et elle ferait garrot pendant la nuit.</p>
<h3 class="sub">Le froid et la chaleur sans rien</h3>
<p class="p0">Le froid : <strong>la neige d’hiver est à la température de l’air</strong>, bien plus froide que la glace qui fond, et posée vingt minutes à travers un linge, elle peut geler la peau qu’elle engourdit. On la mouille d’eau jusqu’à en faire une gadoue, qui reste à 0 °C tant qu’il y a de la glace dedans, ou on la laisse dans la maison le temps qu’elle commence à fondre ; puis dans un sac de plastique. Ou un linge trempé dans l’eau du lac et renouvelé quand il tiédit. Toujours un linge entre le froid et la peau, et jamais sur une peau déjà engourdie. La chaleur, après 48 heures : une bouteille d’eau chaude roulée dans un linge, une pierre sèche ou un bas de riz chauffés <strong>près</strong> du poêle et non dessus, la pierre enveloppée épais (<span class="ref">ch. 25</span>, section 9). Même règle que pour le froid : jamais sur une peau qui fourmille ou qui sent mal, parce qu’elle brûle sans prévenir.</p>
<h3 class="sub">Les poids, la planche d’équilibre</h3>
<p class="p0">Les poids des exercices du coude : une boîte de conserve, une bouteille d’eau qu’on remplit un peu plus à mesure que la douleur le permet, une pierre dans un bas. La planche d’équilibre : une planche posée à plat sur une bûche fendue en deux, face plate au sol, pour qu’elle bascule d’un côté à l’autre sans rouler. On y monte près d’un mur ou d’une table, une main prête, sur le pied blessé seulement quand il tient déjà sur une couverture pliée.</p>
<h3 class="sub">Le chevalet de sciage</h3>
<p class="p0">Deux paires de perches solides croisées en X et liées à la croisée, reliées l’une à l’autre par une traverse basse et une perche en diagonale pour qu’elles ne s’écartent pas ; les croisées s’assemblent à mi-bois (<span class="ref">ch. 110</span>). La bille se couche dans les deux X, à hauteur de hanche. On scie debout, le dos droit, et la bille ne pince pas la lame si on coupe à l’extérieur des appuis. C’est la pièce qui sauve le dos de toute une saison de sciotte.</p>
<h3 class="sub">Le porte-bûches</h3>
<p class="p0">Un rectangle de toile épaisse ou de peau, un bâton glissé dans un ourlet à chaque bout pour faire deux poignées. On y couche la brassée, on prend les deux poignées d’une main ou des deux, et la charge pend contre la jambe au lieu d’être serrée à bout de bras. <em>Ce qu’on perd :</em> on en porte moins à la fois qu’avec un toboggan.</p>
<h3 class="sub">La genouillère</h3>
<p class="p0">Un carré de feutre épais, de peau de mouton ou de peau d’orignal pliée en trois, noué derrière le genou par deux lacets, ou un sac de toile bourré de sapinage posé au sol là où l’on s’agenouille. Le sapinage s’écrase en quelques jours et se change.</p>
<h3 class="sub">Le coussinet en beigne</h3>
<p class="p0">Un rond de feutre, de carton double ou de cuir mince, plus grand que l’ampoule, percé au centre d’un trou de la taille de l’ampoule, posé autour d’elle et tenu par du ruban. La pression se reporte sur l’anneau, l’ampoule ne touche plus rien.</p>
<h3 class="sub">Le baume</h3>
<p class="p0">De la cire d’abeille fondue dans du suif ou de la graisse d’ours, au bain-marie, versée dans un petit pot. La cire fait film sur la peau ; la graisse la rend tartinable. <em>Ce qu’on perd :</em> la vaseline arrête presque toute l’eau qui sort de la peau, et l’huile d’olive cent soixante-dix fois moins. La lanoline, la graisse de la laine de mouton, n’en arrête que 20 à 30 % ; le suif et la graisse d’ours n’ont pas été mesurés. C’est la cire qui rapproche le baume de la vaseline ; plus il y en a, plus il ferme, et plus il est dur à étendre.</p>
<h3 class="sub">Quand la colle manque</h3>
<p class="p0">Rien ne scelle une crevasse aussi vite. On la couvre de baume le soir, sous un doigtier taillé dans le doigt d’un vieux gant et tenu par un tour de ruban, pour que le baume reste dans la fente toute la nuit. <em>Ce qu’on perd :</em> la crevasse se rouvre au premier geste du matin, et guérit en plus de temps.</p>
<h3 class="sub">La gouttière d’ongle</h3>
<p class="p0">Un bout de gaine de fil électrique, de la grosseur qui coiffe le bord de l’ongle, fendu sur toute sa longueur au couteau et enfilé sur le bord de l’ongle incarné, entre l’ongle et la peau. Il garde la peau loin de l’ongle pendant qu’il pousse. Un bout de soie dentaire ou de fil fin glissé sous le coin de l’ongle le soulève de la même façon, en plus petit. <em>Ce qu’on perd :</em> ça tient mal dans une botte qui frotte ; on vérifie chaque soir, à l’étape 7.</p>
<h3 class="sub">Ce qu’on perd en tout</h3>
<p class="p0">La précision. Sans radiographie, les règles des étapes 41 et 50 laissent passer quelques fractures, et plus chez l’enfant : dans le doute, on traite comme une fracture et on accepte d’avoir immobilisé pour rien. Le temps. Un tendon, un dos ou une cheville qui guérit en travaillant guérit plus lentement qu’au repos avec quelqu’un pour rentrer le bois à sa place ; on le compte en semaines de plus, et on ne s’en étonne pas. La marge. Un corps seul, sans relève, finit par casser au même endroit : la vraie substitution à un physiothérapeute, c’est une deuxième paire de bras (<span class="ref">ch. 18</span>).</p>
<h3 class="sub">Ce qui ne se remplace pas</h3>
<p class="p0">Le ligament croisé rompu, le ménisque qui bloque, le tendon de la rotule ou de l’épaule qui a lâché : rien de ce chapitre ne les recoud, et la section 5-H dit comment vivre avec jusqu’à ce qu’on puisse les faire réparer. La queue de cheval écrasée demande une chirurgie, vite (étape 22), et la hernie coincée aussi (section 8). Le doigt mort des vibrations, une fois installé, peut rester pour de bon. Et le cœur qui lâche dans la neige ne se soigne pas au chalet (section 8) : ce qui s’y fait, c’est de s’arrêter à temps.</p>
</template>
<template id="notes">
<p class="fn" data-fn="24-1"><span class="fnn">1</span>L’« anesthésie en selle » : la peau que toucherait une selle — l’intérieur des cuisses, les fesses, le pourtour de l’anus et les organes génitaux — ne sent plus, ou sent « à travers un gant ». Elle se teste en effleurant ces zones d’un brin de foin ou du bout d’un doigt, des deux côtés, et en comparant avec le bas de la cuisse.</p>
<p class="fn" data-fn="24-2"><span class="fnn">2</span>Le pied qui tombe : assis, talon au sol, on relève la pointe du pied vers le tibia, puis on marche quelques pas sur les talons. Un pied qui ne se relève pas, qui claque au sol à chaque pas ou dont la pointe accroche, c’est un nerf qui ne commande plus le muscle.</p>
<p class="fn" data-fn="24-3"><span class="fnn">3</span>La pointe de la cheville, ce sont les deux bosses osseuses de chaque côté de la cheville : l’intérieure est le bout du tibia, l’extérieure le bout du péroné. La bosse du bord extérieur du pied se trouve à mi-longueur du pied, là où le bord s’élargit ; celle du bord intérieur, un peu en avant et en dessous de la cheville intérieure.</p>
<p class="fn" data-fn="24-4"><span class="fnn">4</span>La tête du péroné est la petite bosse osseuse du côté extérieur de la jambe, juste sous le genou, un peu vers l’arrière.</p>
<p class="fn" data-fn="24-5"><span class="fnn">5</span>La hernie de l’aine se cherche debout, la main à plat sur le pli de l’aine : on tousse, ou on pousse comme pour forcer. Une bosse qui vient pousser contre la main et repart quand on se détend, c’est elle. Elle est plus fréquente chez l’homme, et chez lui elle peut descendre dans les bourses et les faire enfler d’un seul côté.</p>
</template>

<script>
(function(){

}
function splitPara(el, f){

  while(lo<=hi){ const mid=(lo+hi)>>1; const a=part(el,st[mid],true); f.appendChild(a); syncNotes(f); const ok=!OVER(f); f.removeChild(a); syncNotes(f); if(ok){best=mid;lo=mid+1;} else hi=mid-1; }

function splitTable(tb, f){

  const mk=(rs,kind)=>{ const t=tb.cloneNode(false); const cg=tb.querySelector('colgroup'); if(cg) t.appendChild(cg.cloneNode(true));
    if(kind==='first'){ const cap=document.createElement('caption'); cap.className='tsuite'; cap.textContent='Le tableau continue page suivante'; t.appendChild(cap); }

    if(kind==='rest') t.classList.add('suite'); return t; };

/* ---------- notes de bas de page ----------
   Chaque cadre a, juste après lui, une zone de notes à deux cases (une par colonne).
   On la resynchronise à chaque essai de remplissage : la note prend sa place dans la

const NOTES={};
document.getElementById('notes').content.querySelectorAll('p.fn').forEach(n=>NOTES[n.dataset.fn]=n);
function noteZone(f, make){

function sideOf(c, f, z){

}

function pour(f, q, p){

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';

  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;

    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {

    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });

}
function fitTitle(){

function edges(){

    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');

  });

function checks(){

  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });

}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){

function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();

  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));

  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
