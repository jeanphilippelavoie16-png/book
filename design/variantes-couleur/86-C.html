<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>86 — L’électricité du chalet et le froid mécanique — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}

<template id="open"><header class="open"><div class="open-top"><span>Tome 5 · La forêt, le jardin et le chalet</span><span>Chapitre</span></div><div class="open-title"><div class="num">86</div><h1>L’électricité du chalet et le froid mécanique</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span class="on">Chalet</span><span>Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">Au village, le courant vient d’Hydro et la panne se traverse avec une génératrice dans la cour (<span class="ref">ch. 3</span>). Au chalet, il n’y a pas de ligne : le banc de batteries est le réseau, et c’est là que finit tout événement qui dure (<span class="ref">ch. 2</span>). Ce chapitre dimensionne cette installation et le congélateur qu’elle porte. Deux choses servent aussi à la maison : le calcul du congélateur selon la température de la pièce (étape 2), et la règle de grouper dans chaque bloc de génératrice tout ce qui attend du courant (étape 26).</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Un congélateur coffre posé dans la remise non chauffée tient la viande presque toute l’année sur quelques centaines de watts de panneaux dressés à 60° et un banc gardé au chaud, parce que sa consommation baisse avec le soleil, alors que le même coffre posé dans la cuisine vide ce banc presque tous les jours de décembre.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h4 class="choix">C’est le bon choix quand :</h4>
<p class="li">La famille est montée au chalet pour de bon et qu’il y a de la viande à tenir d’avril à novembre, les mois où l’air du dehors ne le fait pas (<span class="ref">ch. 73</span>). De décembre à mars, l’air fait l’essentiel du travail gratuitement, et le congélateur n’est plus qu’un appoint.</p>
<p class="li">Un coin dégagé au sud voit le soleil de midi en décembre. Le 21 décembre, à la latitude de Sept-Îles, le soleil de midi n’est qu’à 16° au-dessus de l’horizon : un arbre de 10 m jette une ombre de 34 m. Le matin et l’après-midi, il est plus bas encore (étape 15). Un panneau derrière une rangée d’épinettes ne produit rien du mois.</p>
<p class="li">Un ruisseau descend d’au moins un mètre près du chalet. C’est la seule source qui produit la nuit sans vent ni essence. En décembre, un petit ruisseau avec quelques mètres de pente bat un champ entier de panneaux, mais seulement monté pour l’hiver, conduite enfouie et roue à l’abri, et compté sur son débit du creux de l’hiver (section 9 C).</p>
<h4 class="choix">C’est un mauvais choix quand :</h4>
<p class="li"><strong>Le coffre est dans la pièce chauffée.</strong> À 20 °C autour de lui, il consomme deux fois et demie ce qu’il consomme dans une remise en novembre, et cinq fois en décembre. Ce n’est pas un détail d’installation : c’est la différence entre un banc qui passe l’hiver et un banc vide 85 jours sur 100 en décembre.</p>
<p class="li"><strong>L’onduleur reste allumé jour et nuit pour un compresseur qui tourne deux heures.</strong> Un onduleur mange à vide de 6,5 à 10 W selon sa taille, soit 150 à 240 Wh par jour. En décembre, c’est plus que ce que demande le coffre de la remise.</p>
<p class="li"><strong>On compte sur le soleil seul pour la pire semaine.</strong> Sur onze hivers, la pire suite de sept jours a donné le septième de la moyenne de décembre. La réserve de ces jours-là — le banc, la génératrice ou le froid du dehors — se décide avant, pas pendant.</p>
<p class="li"><strong>Le banc au plomb est dans la remise en janvier.</strong> Il n’y rend plus que la moitié de sa capacité, et à −35 °C une batterie à 62 % gèle déjà : on la garde au-dessus de 85 %. Ce qui reste d’utilisable fait moins du dixième de l’étiquette.</p>
<p class="li"><strong>Le banc au lithium est dans un bâtiment qui descend sous 5 °C la nuit.</strong> Chargé sous le seuil de sa fiche, +5 °C pour celle qu’on a lue, il s’abîme pour de bon. Avec un système de gestion qui coupe la charge au froid, le soleil du matin passe pendant que la batterie dit non ; sans cette coupure, elle dit oui, et c’est pire (section 3).</p>
<p class="li"><strong>Le banc est fait de batteries de démarrage.</strong> Elles sont faites pour se vider trois secondes et se remplir tout de suite (<span class="ref">ch. 85</span>). En décharges profondes répétées, elles meurent bien avant leur heure.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">Un congélateur consomme en proportion de l’écart entre ses −18 °C et l’air qui l’entoure.</strong> L’énergie qu’il faut pour tenir une différence de température est proportionnelle à cette différence. Le chiffre en kilowattheures par an de l’étiquette est mesuré à 32 °C, couvercle fermé : un écart de 50 °C. Ce 32 °C tient lieu d’une cuisine ordinaire où l’on ouvre : un coffre qu’on ouvre tous les jours dans le chalet chauffé est plus près de son étiquette que du calcul. Dans une pièce à 20 °C, l’écart tombe à 38 ; dans une remise à −3 °C en novembre, à 15 ; à −10 °C en décembre, à 8. Le coffre de la remise consomme donc le moins au moment exact où le soleil donne le moins. C’est l’argument du chapitre. Le coffre, en plus, garde son froid quand on lève le couvercle : l’air froid est lourd et reste au fond, alors qu’il tombe par la porte d’un vertical.</p>
<p class="p0 ri"><strong class="runin">En décembre, à cette latitude, le soleil est rare, bas et souvent caché.</strong> La plus belle journée de décembre ne donne guère plus de huit heures de soleil franc. Incliné à 60°, un panneau en tire près de trois fois ce qu’il tire à plat — 1,34 kWh par kilowatt de panneau et par jour, contre 0,47 — et il se déneige presque seul. À la verticale, il ne perd presque rien en décembre (1,31) mais perd le quart de son année par rapport à 60°. Le long de la côte, à 60°, décembre donne de 1,05 vers Baie-Comeau à 1,70 vers Havre-Saint-Pierre. Mais la moyenne cache la semaine : un jour de décembre sur trois donne moins de 0,5, et la pire semaine de onze hivers a donné 0,19 par jour.</p>
<p class="p0 ri"><strong class="runin">Le froid attaque le plomb par trois bouts, et ils s’enchaînent.</strong> La capacité d’abord : la moitié à −18 °C, moins encore plus bas. La charge ensuite : une batterie froide demande une tension plus haute, et un contrôleur qui ne le sait pas la laisse à moitié pleine. Le gel enfin, parce que l’électrolyte d’une batterie pleine est de l’acide concentré et celui d’une batterie vide, presque de l’eau :</p>
<table class="tspan"><colgroup><col style="width:21.3%"><col style="width:22.7%"><col style="width:31.1%"><col style="width:24.8%"></colgroup><thead><tr><th>État de charge</th><th>Densité au densimètre</th><th>Tension au repos, 12 V, plomb ouvert</th><th>L’électrolyte gèle vers</th></tr></thead><tbody><tr><td class="c-item">100 %</td><td>1,280</td><td>12,73 V</td><td>-69 °C</td></tr><tr><td class="c-item">85 %</td><td>1,250</td><td>12,56 V</td><td>-52 °C</td></tr><tr><td class="c-item">62 %</td><td>1,200</td><td>12,27 V</td><td>-27 °C</td></tr><tr><td class="c-item">40 %</td><td>1,150</td><td>11,96 V</td><td>-15 °C</td></tr><tr><td class="c-item">20 %</td><td>1,100</td><td>11,66 V</td><td>-7 °C</td></tr></tbody></table>
<p class="p0">La tension ne vaut qu’au repos : six heures au moins sans charge ni décharge (section 6). Le densimètre<sup class="fnr" data-fn="86-1">1</sup> se lit n’importe quand, corrigé pour la température.</p>
<p>La chaîne se lit dans ce sens : froid, charge incomplète, état de charge bas, gel, bac fendu. Une batterie dont le bac a bombé ou fendu est finie ; une batterie intacte qui a gelé dégèle dans la pièce avant qu’on la branche (<span class="ref">ch. 84</span>, <span class="ref">§9</span>), et le gel a d’ordinaire abîmé ses plaques pour de bon. Le lithium-fer-phosphate inverse le problème : il se décharge jusqu’à −20 °C, mais il ne doit pas se charger sous le seuil de sa fiche, +5 °C pour celle qu’on a lue. Chargé plus froid, il s’abîme pour de bon. Ce n’est pas la chimie qui refuse : c’est son système de gestion qui coupe la charge, <strong>s’il a cette coupure et qu’elle est réglée</strong>. Le seuil se lit sur la fiche ou dans le réglage de la batterie installée. Faute de fiche, on regarde l’afficheur du contrôleur un matin où la batterie est froide, panneaux au soleil : un courant de charge nul dit que la coupure existe. Un courant qui entre dit qu’elle n’existe pas : on débranche aussitôt, et ce banc ne se charge plus qu’au-dessus du seuil.</p>
<p class="p0 ri"><strong class="runin">Chaque conversion coûte, et le plomb coûte le plus quand il est presque plein.</strong> Le plomb rend 80 % de ce qu’on y met, le lithium 92 %. Au-dessus de 80 % de charge, le rendement de charge du plomb tombe à 50 % ou moins. C’est justement là qu’on le garde l’hiver pour qu’il ne gèle pas. L’onduleur perd 10 % au mieux en marche, et consomme même quand rien n’y est branché.</p>
<p class="p0 ri"><strong class="runin">Une génératrice rend plus par litre quand elle travaille fort.</strong> Une génératrice à onduleur de 1 800 W nominaux, avec un plein de 3,6 L, tourne 3,2 h à pleine charge et 8,1 h au quart : 1,6 kWh par litre à plein, 1,0 au quart. Un compresseur de congélateur seul la laisse bien sous le quart : on paie le moteur pour peu de courant. D’où les blocs groupés de l’étape 26.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Congélateur coffre, idéalement vendu pour le garage, avec sa plage de température basse annoncée</td><td>1</td><td>Le coffre de la maison, qui monte à la bascule. Sa carrosserie n’est pas faite pour être levée pleine : on le vide dans des glacières le temps de le charger, ou on le glisse plein sur une planche portée à plusieurs. Plein, fermé et immobile, il tient 48 h. Un vertical fonctionne, mais perd son froid à chaque ouverture. Un coffre à compresseur 12 V se branche au banc sans onduleur</td><td>Oui</td></tr><tr><td class="c-item">Thermomètre min-max dans le coffre, et un autre dans la remise</td><td>2</td><td>Le gobelet d’eau gelée et la pièce de monnaie dans le coffre (<span class="ref">ch. 74</span>). La remise se lit au thermomètre extérieur, à l’ombre</td><td><span class="non">NON</span> <span class="negx">— c’est lui qui dit quand brancher et quand débrancher</span></td></tr><tr><td class="c-item">Wattmètre de prise (compteur de kilowattheures)</td><td>1</td><td>Pince ampèremétrique et une montre. La pince lit des ampères, et sur un seul fil : autour du cordon entier, elle lit zéro. On la referme sur un seul conducteur d’une rallonge dont on a séparé les deux fils sur quelques centimètres, sans entamer l’isolant. On additionne les minutes de marche du compresseur sur une journée. Ampères × 120 donne des watts par excès sur un moteur : c’est un plafond, pas une mesure</td><td>Oui</td></tr><tr><td class="c-item">Banc de batteries à décharge profonde : plomb ouvert (batteries de 6 V en série), AGM, ou lithium-fer-phosphate</td><td>Selon l’étape 20</td><td>Des batteries de démarrage d’appoint, de même âge et de même capacité, en parallèle, jamais celle du camion, qui doit repartir (section 9 A). Elles durent beaucoup moins longtemps, et une batterie dont un élément lâche prend le courant de toutes les autres (section 7)</td><td><span class="non">NON</span> <span class="negx">si le plan passe par le soleil</span></td></tr><tr><td class="c-item">Contrôleur de charge, avec sonde de température</td><td>1</td><td>Le lecteur, au voltmètre, qui branche le panneau le matin et le débranche à la tension d’absorption (section 9)</td><td>Oui</td></tr><tr><td class="c-item">Panneaux et support à 60° ou plus</td><td>Selon l’étape 17</td><td>Panneau vissé à plat sur le mur sud : il perd le quart de son année et presque rien de son décembre, et la neige n’y tient pas</td><td>Oui</td></tr><tr><td class="c-item">Onduleur à onde sinusoïdale pure, dont la pointe annoncée dépasse avec marge trois fois le courant de marche du compresseur : la pointe est souvent de trois fois, parfois plus</td><td>1</td><td>La génératrice branchée directement sur le coffre, par blocs (<span class="ref">ch. 74</span>, <span class="ref">§9</span>). Un coffre à compresseur 12 V, qui s’en passe</td><td><span class="non">NON</span> <span class="negx">pour un coffre de 120 V sur le banc</span></td></tr><tr><td class="c-item">Chargeur de batteries de 120 V</td><td>1</td><td>La prise 12 V de la génératrice ; l’alternateur du camion ; un petit moteur attelé à un alternateur (section 9)</td><td>Oui</td></tr><tr><td class="c-item">Génératrice</td><td>1</td><td>L’alternateur du camion ; le moteur de la souffleuse ou de la tondeuse attelé à un alternateur d’auto (section 9)</td><td>Oui</td></tr><tr><td class="c-item">Câble de cuivre de bonne section, cosses serties, un fusible au positif près de la borne</td><td>Selon l’étape 21</td><td>Câbles de survoltage, gros et courts ; câble de soudeuse</td><td><span class="non">NON</span> <span class="negx">sur le fusible</span></td></tr><tr><td class="c-item">Voltmètre (multimètre)</td><td>1</td><td>Pour le plomb ouvert, un densimètre fait le même travail. Pour le plomb scellé et le lithium, rien</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Avertisseur de CO à pile, à affichage en ppm</td><td>1 par bâtiment chauffé</td><td>Aucune. Rien ne sent le monoxyde, et aucun montage ne le détecte</td><td><span class="non">NON</span> <span class="negx">dès qu’un moteur tourne sur le terrain</span></td></tr></tbody></table>
<p class="p0">Le banc, le contrôleur, les panneaux, le voltmètre et les thermomètres min-max ont leur rang d’achat au <span class="ref">ch. 00b</span> ; la génératrice y est rangée pour la maison, où se vit la panne courte (<span class="ref">ch. 3</span>). Les fusibles, les cosses et les pièces de rechange sont au <span class="ref">ch. 104</span>.</p>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">5.1 Faire le bilan en wattheures par jour</h3>
<p class="step"><span class="sn">1</span><strong>Lister ce qui tire sur le banc, un appareil à la fois.</strong> L’éclairage se mesure point par point comme au <span class="ref">ch. 85</span>. La radio a son propre banc et n’entre pas dans ce compte (<span class="ref">ch. 14</span>, étape 7).</p>
<p class="step"><span class="sn">2</span><strong>Le coffre : partir de l’étiquette, corriger pour l’endroit.</strong> L’étiquette donne des kilowattheures par an mesurés à 32 °C ; divisés par 365, c’est la journée d’un coffre dans une pièce à 32 °C. Un coffre moyen vendu au Canada est à 288 kWh par an, soit 0,79 kWh par jour. Multiplier par l’écart réel (température de l’air autour, plus 18) et diviser par 50. Pour un coffre moyen, avec la température moyenne du mois à Sept-Îles comme température de la remise :</p>
<table class="tcol nest"><colgroup><col style="width:22.9%"><col style="width:22.9%"><col style="width:22.9%"><col style="width:31.3%"></colgroup><thead><tr><th>Mois</th><th>Coffre dans la remise (kWh/j)</th><th>Même coffre dans le chalet à 20 °C (kWh/j)</th><th>400 W de panneaux à 60° produisent (kWh/j, avant les pertes du contrôleur et de la batterie)</th></tr></thead><tbody><tr><td>Janvier</td><td>0,04</td><td>0,60</td><td>0,69</td></tr><tr><td>Février</td><td>0,07</td><td>0,60</td><td>1,04</td></tr><tr><td>Mars</td><td>0,18</td><td>0,60</td><td>1,37</td></tr><tr><td>Avril</td><td>0,29</td><td>0,60</td><td>1,52</td></tr><tr><td>Mai</td><td>0,38</td><td>0,60</td><td>1,49</td></tr><tr><td>Juin</td><td>0,47</td><td>0,60</td><td>1,42</td></tr><tr><td>Juillet</td><td>0,52</td><td>0,60</td><td>1,44</td></tr><tr><td>Août</td><td>0,51</td><td>0,60</td><td>1,37</td></tr><tr><td>Septembre</td><td>0,44</td><td>0,60</td><td>1,26</td></tr><tr><td>Octobre</td><td>0,34</td><td>0,60</td><td>1,00</td></tr><tr><td>Novembre</td><td>0,24</td><td>0,60</td><td>0,69</td></tr><tr><td>Décembre</td><td>0,12</td><td>0,60</td><td>0,54</td></tr></tbody></table>
<p class="stepc">C’est un calcul, pas une mesure : il ignore les ouvertures, le soleil sur la remise, la viande tiède qu’on rentre. Il donne l’ordre de grandeur, et c’est l’ordre de grandeur qui décide où va le coffre. La dernière colonne est ce que les panneaux produisent ; ce qui ressort de la batterie est d’environ le quart de moins (étape 17).</p>
<p class="step"><span class="sn">3</span><strong>Mesurer le vrai chiffre, une journée.</strong> Wattmètre entre la prise et le coffre, 24 heures, sans ouvrir. Ce chiffre remplace le tableau pour ce coffre-là, à cette saison-là. Il s’écrit au feutre sur le couvercle, avec le mois.</p>
<p class="step"><span class="sn">4</span><strong>Ajouter l’onduleur.</strong> À vide, de l’ordre de 6,5 W pour un appareil de 800 VA et de 10 W pour un de 1 200 VA ; celui qu’on a donne le sien sur sa fiche. S’il reste allumé, de 156 à 240 Wh par jour. En marche, 10 % de pertes au mieux : diviser la consommation du coffre par 0,9. Certains onduleurs ont un mode économie, à 1 W sur la fiche lue : sous quelques watts de charge, l’onduleur s’endort, sonde sa sortie par une impulsion toutes les deux ou trois secondes, et repart dès qu’un appareil tire plus que son seuil. Le compresseur qui démarre quand le thermostat ferme en est un, et le mode économie remplace alors l’interrupteur qu’on actionne à la main entre les blocs. Un appareil qui tire plus que le seuil même au repos — afficheur, commande électronique, lampe — le garde éveillé jour et nuit. La journée au wattmètre de l’étape 3, onduleur en mode économie, dit si le coffre qu’on a tient −18 °C ainsi.</p>
<p class="step"><span class="sn">5</span><strong>Additionner.</strong> Novembre, coffre dans la remise : éclairage 60 Wh (quatre points de 3 W, cinq heures), coffre 240 Wh ÷ 0,9 = 267 Wh, onduleur allumé seulement pendant les blocs du compresseur, quatre heures à 6,5 W = 26 Wh. Total : environ 350 Wh par jour. Décembre, même installation : environ 220 Wh. Le même mois de novembre avec le coffre à la cuisine et l’onduleur allumé jour et nuit : 60 + 667 + 156, près de 900 Wh.</p>
<h3 class="sub">5.2 Placer le coffre</h3>
<p class="step"><span class="sn">6</span><strong>Dans la remise, pas dans le chalet.</strong> Côté nord ou à l’ombre, posé sur des madriers qui laissent passer l’air dessous, à quelques centimètres des murs pour que le condenseur respire. Une remise au soleil de mars fait un four (<span class="ref">ch. 73</span>).</p>
<p class="step"><span class="sn">7</span><strong>Lire la plage de température du coffre dans son manuel.</strong> Les coffres vendus pour le garage sont annoncés jusqu’à −17 °C d’air ambiant. Un coffre ordinaire a sa propre plage, écrite dans son manuel ; elle s’écrit au feutre sur le couvercle. Sous sa plage, le compresseur peine ou s’arrête en croyant avoir assez froid. Sans manuel, le min-max du coffre le dit : un maximum qui remonte au-dessus de −18 °C alors que la remise est plus froide que ça.</p>
<p class="step"><span class="sn">8</span><strong>Sous la plage du coffre, débrancher</strong> : −17 °C dans la remise pour un coffre de garage, à la limite de son manuel pour un coffre ordinaire. Le coffre plein devient la cache du <span class="ref">ch. 73</span>, et c’est la meilleure qu’on ait. Rebrancher quand le thermomètre du coffre remonte vers −18 °C. En janvier, le maximum quotidien moyen tourne autour de −10 °C : la remise ne tient pas −18 °C toute la journée, mais un coffre plein et fermé traverse une journée douce sur sa propre glace. Au pire, il glisse au Cas 2 du <span class="ref">ch. 74</span> : gelé, sans tenir la consigne.</p>
<p class="step"><span class="sn">9</span><strong>Refroidir la viande avant de la rentrer.</strong> Un quartier tiède fait tourner le compresseur des heures et réchauffe les paquets voisins. La viande se refroidit à l’air de la nuit (<span class="ref">ch. 73</span>), ou elle entre pendant un bloc de génératrice (étape 26), jamais sur le banc un soir gris.</p>
<p class="step"><span class="sn">10</span><strong>Combler les vides de cruches d’eau</strong> (<span class="ref">ch. 74</span>, étape 32). Un coffre plein est sa propre réserve.</p>
<p class="step pk-d"><span class="sn">11</span><strong>L’été, un coffre fait aussi un bon réfrigérateur.</strong> Un thermostat extérieur branché entre la prise et lui le fait tourner en réfrigérateur, et il garde son froid à l’ouverture comme le congélateur. Dans une pièce à 20 °C, il travaille sur un écart d’environ 17 °C au lieu de 38 : moins de la moitié d’un congélateur. Le thermostat coupe et repart avec un écart propre à l’appareil : réglable au degré près sur un thermostat électronique, plus large sur un mécanique. On le règle serré s’il se règle ; c’est le haut de cet écart qui compte, pas le chiffre du bouton. S’il a un délai contre les redémarrages rapprochés, on le met à quelques minutes : un compresseur qui repart aussitôt arrêté démarre dur et fait sauter sa protection. On le règle pour que le <strong>maximum</strong> du min-max reste sous 3 °C, et on le vérifie chaque matin. Au-dessus, le botulisme de type E produit sa toxine dans un sac de poisson fermé, sans oxygène, et il ne change ni l’odeur, ni le goût, ni l’apparence. Le poisson n’y dort pas en sac fermé : emballage qui respire, la semaine pour le frais, 14 jours au plus pour le fumé (<span class="ref">ch. 75</span>, étape 29 et <span class="ref">§8</span>) ; au-delà, le congélateur, le sel ou la fumée (<span class="ref">ch. 77</span>).</p>
<h3 class="sub">5.3 Monter les panneaux</h3>
<p class="step"><span class="sn">12</span><strong>Viser le sud vrai.</strong> Sur la Côte-Nord, l’aiguille de la boussole pointe environ 17° à l’ouest du nord vrai : le sud vrai se lit à 197° au cadran, pas à 180°. Sans boussole, l’ombre la plus courte de la journée le donne (section 9).</p>
<p class="step"><span class="sn">13</span><strong>Incliner à 60°, ou plus si la neige est l’ennemie.</strong> À 60°, le panneau perd 5 % de son année par rapport à l’inclinaison qui rend le plus, et produit près de trois fois plus qu’à plat en décembre. À 75°, décembre est pareil et l’été perd davantage. À la verticale, sur le mur sud, décembre ne perd presque rien et la neige ne reste pas.</p>
<p class="step"><span class="sn">14</span><strong>Le bord bas au-dessus de la plus haute neige probable, et aucun rebord en bas.</strong> À Sept-Îles, la neige au sol fait en moyenne un demi-mètre en février, mais les plus hauts relevés passent 2 m : 224 cm en janvier, 216 en février. S’y ajoute le tas que fait au pied la neige qui glisse du panneau à 60°, et qui monte au-dessus du sol d’alentour. Un panneau qu’on dégage à la pelle après chaque neige peut se poser plus bas qu’un panneau laissé seul tout l’hiver. Un rebord retient la neige qui glisse et la regèle sur la première rangée de cellules.</p>
<p class="step"><span class="sn">15</span><strong>Dégager l’horizon sud, et plus bas à mesure qu’on s’écarte du sud.</strong> Le 21 décembre, à midi, le soleil est à 16° plein sud, et un arbre fait de l’ombre sur trois fois et demie sa hauteur. Deux heures avant et après midi, il n’est plus qu’à 12°, à une trentaine de degrés du sud ; trois heures avant et après, à 6°, à une quarantaine de degrés. Un arbre qui reste sous 16° plein sud mais dépasse 12° une trentaine de degrés plus à l’est ou à l’ouest coupe le panneau du matin ou de l’après-midi, et la journée de décembre n’a guère que huit heures. Ce qui pousse dans cet arc se coupe à l’automne, pas en décembre dans la neige à la taille. La fumée de la cheminée ne passe pas devant non plus.</p>
<p class="step"><span class="sn">16</span><strong>Les panneaux près du banc.</strong> Le courant d’un panneau est sur son étiquette. Pour une douzaine d’ampères, à 15 m du banc, il faut du câble de 25 à 35 mm² ; à 3 m, de 6 mm². Deux panneaux en série divisent le cuivre par quatre, mais seulement avec un contrôleur qui suit le point de puissance maximale<sup class="fnr" data-fn="86-2">2</sup> et accepte la tension double. Un contrôleur ordinaire ramène la tension des panneaux à celle de la batterie et perd la différence : la série n’y gagne rien.</p>
<p class="step"><span class="sn">17</span><strong>Dimensionner le champ.</strong> Puissance des panneaux (W) = besoin (Wh/j) ÷ (heures d’ensoleillement × 0,77). Le 0,77 compte les pertes du contrôleur et de la batterie. À 60°, à Sept-Îles : 1,49 h en décembre, 2,0 en novembre, 1,88 en janvier. Ajouter 15 à 25 % si le contrôleur ne suit pas le point de puissance maximale. Novembre, coffre dans la remise : 350 ÷ (2,0 × 0,77) = 230 W. Décembre : 220 ÷ (1,49 × 0,77) = 190 W. Coffre à la cuisine, décembre : 770 W. Le calcul donne la moyenne ; onze hivers simulés donnent la vérité. Avec 400 W à 60° et un banc de 2,4 kWh tiré jusqu’à la moitié, une demande de 350 Wh par jour laisse la batterie vide un jour sur cinq en décembre et en janvier, et presque jamais le reste de l’année. À 900 Wh par jour, elle est vide 85 jours sur 100 en décembre, et encore un jour sur dix en juillet.</p>
<h3 class="sub">5.4 Le banc de batteries</h3>
<p class="step"><span class="sn">18</span><strong>Au chaud, dans un coffre ventilé vers dehors.</strong> Le banc vit dans le volume chauffé, dans un coffre fermé côté pièce, couvercle à joint. Une bouche d’au moins 2,5 cm pour deux batteries de 12 V chargées doucement part du haut du coffre et traverse le mur, parce que l’hydrogène monte. Elle grandit en surface avec le courant : en fin de charge, presque tout le courant qui entre dans une batterie pleine devient du gaz. En 12 V, compter environ 9 cm² d’ouverture par ampère de fin de charge — un trou de 3,5 cm pour un ampère, de 7 cm pour quatre —, le double de surface en 24 V ; faute de connaître ce courant, 40 % du courant maximal du chargeur. Le chargeur de 17 A de l’étape 28 demande ainsi un trou de 9 cm. Au-delà d’un petit banc, une seconde bouche de même taille au bas du coffre, dehors elle aussi, fait entrer l’air que la première fait sortir. Dehors, son bout remonte au-dessus de la neige de fin février, coudé vers le bas contre la pluie, et se dégage comme les panneaux : la neige contre le mur la bouche, et l’air humide du coffre qui sort à −35 °C givre et referme un petit tuyau. Le <span class="ref">ch. 104</span> veut le banc hors de toute pièce où l’on dort ; dans un chalet d’une seule pièce, c’est le coffre étanche côté pièce et ventilé dehors qui en tient lieu, adossé au mur extérieur, du côté opposé au couchage et loin du poêle : on ne charge ni ne manipule une batterie près d’une source de chaleur. <strong>Dans le coffre, seulement les batteries, la sonde et le fusible.</strong> L’onduleur, le contrôleur, le chargeur, les interrupteurs et les relais font des étincelles en coupant : ils restent dehors du coffre, l’onduleur vissé contre sa paroi extérieure pour garder ses câbles courts. Seuls les câbles traversent, par un passage bouché serré autour d’eux. <strong>Avant de toucher une cosse</strong>, la charge est arrêtée et le couvercle ouvert quelques minutes, pour que le gaz accumulé dessous s’en aille avant la première étincelle. L’hiver, le bas d’un bâtiment chauffé est en dépression par rapport au dehors : l’air chaud monte et fuit par le haut, et le poêle qui tire son air de la pièce creuse encore l’écart. Le coffre relié au dehors peut alors aspirer par sa bouche et pousser son air, hydrogène compris, vers la pièce par le passage des câbles ; le vent sur le mur fait la même chose. L’essai : poêle allumé, charge arrêtée, une bande de papier mince tenue au passage des câbles. Tirée vers la pièce, elle dit que le passage fuit : on le rebouche. Faute de place au chaud, un contenant enfoui dehors amortit les écarts de température ; il a la même bouche, qui sort au-dessus de la neige, et la marge de gel de l’étape 31 s’applique.</p>
<p class="step"><span class="sn">19</span><strong>Choisir la chimie selon le chauffage.</strong> Chalet habité et chauffé tout l’hiver : plomb ou lithium. Chalet qui refroidit sous 5 °C la nuit : plomb, parce que le lithium n’y doit pas charger le matin (section 3). Le plomb ouvert coûte le moins, se vérifie au densimètre et dégage le plus d’hydrogène. L’AGM en dégage beaucoup moins et ne se vérifie qu’au voltmètre. Le lithium-fer-phosphate rend 92 % et ne se répare pas ; il ne dégage de gaz qu’abîmé, surchargé, ou rechargé après une décharge trop profonde.</p>
<p class="step"><span class="sn">20</span><strong>Dimensionner.</strong> Capacité (Ah) = besoin (Wh/j) × jours de réserve ÷ (tension × 0,42). Le 0,42 compte 85 % de rendement et une décharge limitée à la moitié, sur une batterie autour de 20 °C. Trois jours de réserve en règle générale. Décembre, coffre dans la remise, 220 Wh par jour : 220 × 3 ÷ (12 × 0,42) = 130 Ah à 12 V. Même mois, coffre à la cuisine : 525 Ah. Pour la pire semaine, sept jours plutôt que trois, ou la génératrice (étape 32).</p>
<p class="step"><span class="sn">21</span><strong>Câbler court et gros.</strong> La chute visée est de 0,3 V sur un système de 12 V. Jusqu’à 5 m de câble au total, aller et retour, la section en mm² vaut au moins les ampères divisés par 3. Au-delà, ampères × longueur totale en mètres ÷ 15. Un onduleur de 800 VA à pleine puissance tire environ 60 A à 12 V : 25 mm². La pointe du compresseur passe par les mêmes câbles, et c’est elle qui trouve le câble trop mince (section 7).</p>
<p class="step"><span class="sn">22</span><strong>En parallèle, le courant fait le même chemin pour chaque batterie.</strong> Le plus pris à la première batterie, le moins à la dernière — en diagonale —, ou des câbles de même longueur jusqu’à deux barres communes. Branché au même bout, c’est la première batterie qui travaille et la dernière qui dort. En série, jamais des batteries d’âges ou de capacités différentes : la plus faible se fait vider puis surcharger à chaque cycle.</p>
<p class="step"><span class="sn">23</span><strong>Un fusible au positif, près de la borne.</strong> Il protège le câble qui le suit : il coupe quand ce câble se coupe sur une tôle ou touche la masse plus loin. Il ne protège rien de ce qui tombe entre deux bornes. Une clé en travers des deux bornes d’une batterie, ou des bornes de deux batteries voisines, fait un court-circuit en amont de tout fusible : la clé rougit, se soude, crache du métal fondu, et l’étincelle éclate dans le coffre où dort l’hydrogène. Une bague ou un bracelet de montre qui touche une borne fait la même chose autour du doigt. Le 12 V ne se sent pas sur la peau, et c’est ce qui trompe la main habituée : ce n’est pas le choc qui blesse, c’est le métal qui chauffe. Avant de travailler au banc, bague et montre enlevées, manche de la clé entouré de ruban isolant jusqu’à la tête, borne voisine couverte d’un chiffon épais ou d’un bout de caoutchouc. Pour du lithium, qui donne des courants de court-circuit énormes, un fusible dont le pouvoir de coupure dépasse le courant de court-circuit du banc : un fusible ordinaire peut éclater sans couper.</p>
<p class="step"><span class="sn">24</span><strong>Régler le contrôleur sur la chimie, et coller sa sonde sur une batterie.</strong> Plomb ouvert : absorption de 14,1 à 14,7 V à 25 °C, maintien à 13,5 V. Au froid, la tension de charge du plomb monte de 0,03 V par degré sous 25 °C pour une batterie de 12 V, ouverte ou scellée : à 0 °C, 0,75 V de plus ; à −10 °C, plus d’un volt. <strong>Jamais pour le lithium</strong> : cette correction pousserait ses éléments au-delà de la tension où son système de gestion coupe. Une sonde laissée au chaud sur le boîtier du contrôleur charge une batterie froide comme si elle était tiède : elle ne se remplit jamais, et une batterie jamais pleine est une batterie qui gèle.</p>
<h3 class="sub">5.5 La génératrice, en blocs chargés à plein</h3>
<p class="step pk-d"><span class="sn">25</span><strong>Dehors, toujours.</strong> Jamais dans un bâtiment, jamais dans un garage, jamais dans la remise du coffre, jamais sous un auvent ni dans un abri de toile, même pour la protéger de la neige. Au moins 6 m de tout bâtiment, l’échappement tourné à l’opposé des portes et des fenêtres. La neige se balaie sur la machine arrêtée et froide. Le mécanisme est à la section 8.</p>
<p class="step"><span class="sn">26</span><strong>Grouper dans le même bloc tout ce qui attend du courant.</strong> Chaque bloc porte le coffre, le chargeur de batteries au plus fort courant que le banc accepte, et tout ce qui attendait le courant : la pompe, les outils, l’eau à chauffer. La machine de l’exemple rend 1,6 kWh par litre à pleine charge et 1,0 au quart : plus le bloc est chargé, moins le litre coûte. Quand il n’y a rien d’autre à brancher, le coffre seul par blocs reste le recours du <span class="ref">ch. 74</span>, <span class="ref">§9</span>.</p>
<p class="step"><span class="sn">27</span><strong>Combien d’heures pour le coffre.</strong> Heures par jour = consommation du coffre (kWh/j) ÷ puissance du compresseur en marche (kW), lue au wattmètre. Si le compresseur tire 100 W : 6 heures par jour dans un chalet à 20 °C, un peu moins de 3 heures dans une remise à 0 °C, un peu plus d’une heure à −10 °C. Ces heures se groupent en un ou deux blocs : un coffre plein et fermé travaille le reste du jour sur sa glace. Le thermomètre du coffre décide, pas la montre (<span class="ref">ch. 3</span>, étape 18).</p>
<p class="step"><span class="sn">28</span><strong>Charger vite pendant le bloc, finir au soleil.</strong> Le plomb accepte beaucoup de courant quand il est bas, et de moins en moins en approchant du plein ; au-dessus de 80 %, chaque litre rend la moitié, ou moins. La génératrice monte le banc de la moitié vers 80 %, les panneaux finissent. Le chargeur se choisit pour ce que le banc accepte : 10 à 13 % de sa capacité en ampères pour du plomb ouvert. Pour le banc de 130 Ah de l’étape 20, 13 à 17 A, soit de 180 à 250 W environ côté batterie : avec le coffre, le bloc reste sous le quart d’une machine de 1 800 W. C’est une raison de plus d’y mettre la pompe, les outils et l’eau à chauffer.</p>
<p class="step"><span class="sn">29</span><strong>Le moteur froid et le carburant</strong> sont au <span class="ref">ch. 15</span> (les parts de carburant, faire partir un moteur gelé) et au <span class="ref">ch. 102</span> (l’entretien des petits moteurs).</p>
<h3 class="sub">5.6 Traverser la semaine grise</h3>
<p class="step"><span class="sn">30</span><strong>Avant décembre</strong> : banc plein, panneaux dégagés après chaque neige (<span class="ref">ch. 85</span>), coffre dans la remise, cruches dans les vides.</p>
<p class="step"><span class="sn">31</span><strong>Écrire le seuil de bascule sur le coffre à batteries, au feutre.</strong> Banc au chaud : génératrice quand il touche la moitié, 12,10 V au repos ou 1,172 au densimètre pour du plomb ouvert. Banc au froid : génératrice quand il touche 85 %, 12,56 V au repos ou 1,250 au densimètre, parce que c’est là que se décide le gel. Lithium : la batterie ne calcule pas elle-même son état de charge ; il se lit à un moniteur de batterie ajouté au banc, et la génératrice part à la moitié, comme le plomb au chaud. Sans moniteur, la dernière alarme est celle du système de gestion : sur la batterie lue, une alerte à 3,10 V par élément, 12,4 V pour une batterie de 12 V, puis la coupure de tout ce qui tire à 2,80 V par élément, 11,2 V, au moins 30 secondes plus tard. L’alerte veut dire génératrice tout de suite, pas demain. Les réglages de la batterie installée se lisent dans son application ou sa fiche et s’écrivent au feutre à côté.</p>
<p class="step"><span class="sn">32</span><strong>Compter l’essence en kilowattheures manquants.</strong> Au quart de charge, où le bloc groupé de l’étape 26 amène la machine, chaque kilowattheure coûte un litre ; le plomb n’en rend que 80 %, et un bon chargeur 93 % : environ 1,35 L par kilowattheure qui manque, davantage avec un vieux chargeur qui chauffe. La pire semaine, coffre dans la remise : sept jours à 220 Wh, 1,5 kWh, environ deux litres. Coffre à la cuisine : sept jours à près de 900 Wh, plus de 6 kWh, plus de huit litres. Ces comptes supposent une semaine sans aucun soleil.</p>
<p class="step"><span class="sn">33</span><strong>Couper dans cet ordre</strong> : l’onduleur hors des blocs du compresseur, puis l’éclairage général (<span class="ref">ch. 85</span>, étape 25), et en dernier le coffre, qui reste une cache une fois débranché dans une remise froide.</p>
<h3 class="sub">5.7 Ce que ça change au <span class="ref">ch. 74</span></h3>
<p class="step"><span class="sn">34</span>Le tri du <span class="ref">ch. 74</span> vaut au chalet tel quel. Trois choses changent. La panne se cherche d’abord au banc : tension, fusible, onduleur en défaut, sonde du contrôleur, neige sur le panneau. Le coffre de la remise est déjà dans l’air froid : l’hiver, il glisse au Cas 1 ou au Cas 2 du <span class="ref">ch. 74</span> sans qu’on le déplace. Et les heures de génératrice que le <span class="ref">ch. 74</span> laissait à mesurer se calculent à l’étape 27.</p>

<p class="pt"><span class="pn">1</span><strong class="plead">La génératrice, le camion et le petit moteur ne tournent jamais dans un bâtiment, un garage ou sous un auvent.</strong> Ni dans la remise du coffre, ni dans un abri de toile, ni « juste pour la nuit » sous la galerie parce qu’il neige. Au moins 6 m de tout bâtiment, l’échappement à l’opposé des portes et des fenêtres. Le monoxyde de carbone n’a ni odeur ni couleur, et il prend dans le sang la place de l’oxygène : le sang circule encore et ne transporte plus rien. Les premiers signes — mal de tête, fatigue, nausée — sont exactement ceux d’une semaine grise au chalet, donc ils n’avertissent personne. On s’endort au lieu de sortir. Chez un enfant, ça ressemble à de la fatigue ou à du mauvais caractère, et un parent attentif conclut au caractère. Le camion qui recharge le banc au ralenti est un moteur comme les autres : un tuyau d’échappement pris dans la neige renvoie le gaz dans la cabine, et personne n’attend dedans pour se réchauffer. L’avertisseur à pile est le seul organe qui voie le gaz venir.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Un banc au plomb qui charge dégage de l’hydrogène, et l’hydrogène explose sur presque toute sa plage.</strong> Il s’enflamme entre 4,1 % et 72 % dans l’air : il n’existe presque pas de mélange trop riche pour brûler. Il est léger, il monte, il s’accumule sous le couvercle d’un coffre fermé. L’étincelle vient d’un interrupteur, d’un relais, d’une cosse qu’on serre, d’une clé ou d’une bague tombée en travers de deux bornes, de la dernière connexion d’un câble de survoltage. D’où la bouche en haut du coffre, vers dehors, rien qui coupe le courant dans le coffre, le couvercle ouvert avant de toucher une cosse, et la dernière connexion faite loin de la batterie (étapes 18 et 23). <strong>Une batterie gelée ne se charge pas et ne se survolte pas</strong> : c’est exactement la combinaison — froid, batterie déchargée, survoltage — qui a projeté de l’acide et des éclats de plastique au visage d’un bûcheron.</p>
<p class="pt"><span class="pn">3</span><strong class="plead">Le congélateur électrique lâche sans bruit, et le poisson ne prévient pas.</strong> Un fusible, un onduleur en défaut, un banc vidé par une semaine grise, un compresseur hors de sa plage : dans la remise, personne n’entend rien. Le botulisme de type E produit sa toxine dès 3 °C, et le sac d’omble de fontaine (truite mouchetée) bien fermé est justement le milieu sans oxygène où il travaille. Le botulisme ne change ni l’odeur, ni le goût, ni l’apparence. Le thermomètre min-max du coffre se lit chaque matin, toute l’année ; un coffre trouvé au-dessus de 3 °C avec du poisson dedans relève du <span class="ref">ch. 74</span>, et on ne goûte pas pour décider.</p>
