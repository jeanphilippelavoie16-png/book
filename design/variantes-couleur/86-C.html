<p class="p0 ri"><strong class="runin">Sans chargeur, sans contrôleur, sans onduleur, sans essence achetée pour ça.</strong> Tout ce qui tourne sur le terrain peut charger une batterie, à condition de lui donner la bonne vitesse : un aimant qui passe devant une bobine fait du courant, que ce soit dans un alternateur de camion, un moteur de tapis roulant ou une génératrice. Et quand le contrôleur manque, c’est le lecteur qui le devient, au voltmètre : il branche, il lit, il débranche à la tension d’absorption.</p>
<p class="p0 ri"><strong class="runin">L’ordre, le jour où le chargeur ou la génératrice manque.</strong> D’abord le panneau branché direct, qui ne coûte rien. Ensuite la prise 12 V de la génératrice ou le petit moteur attelé à un alternateur, qui coûtent de l’essence. Le camion en dernier, parce qu’il en brûle le plus et qu’il faut qu’il reparte. Le ruisseau est le chantier de la saison qui vient, pas celui de la soirée : il se mesure l’été et se bâtit avant les glaces. Le vent ne vaut le chantier que sur un site exposé.</p>
<h3 class="sub">A. Charger une batterie sans chargeur</h3>
<p class="p0 lab kh"><strong class="runin">Avant de brancher quoi que ce soit, deux vérifications.</strong></p>
<p class="li"><strong>Elle n’a pas gelé.</strong> Une batterie qui a attendu basse au froid a pu geler : à 20 %, elle gèle à −7 °C (section 3). Bac bombé ou fendu, parois ondulées, givre sur le dessus, et pour le plomb ouvert, de la glace ou une bouillie qu’on voit en ouvrant un bouchon : on ne la branche nulle part, ni au camion, ni au banc, ni derrière l’ampoule (section 8, point 2). Intacte mais restée dehors, elle rentre d’abord dans la pièce, loin du poêle, et dégèle avant qu’on la branche (<span class="ref">ch. 84</span>, <span class="ref">§9</span>).</p>
<p class="li"><strong>La tension est la même des deux bords.</strong> Tout ce qui suit branche une batterie de 12 V sur une source de 12 V : un camion, une autre batterie, la prise de la génératrice. Une batterie de 6 V seule, branchée sur un circuit de 12 V que l’alternateur tient vers 14 V, prend un courant que rien ne limite : elle bout, dégage son hydrogène à côté du moteur, et le câble chauffe. Un banc de 6 V se charge par paires, chaque paire restée câblée en série et portée ensemble.</p>
<p class="p0 ri"><strong class="runin">Au camion.</strong> Un alternateur d’auto ne donne rien sous environ 1 000 tr/min à son arbre, une partie seulement de son courant au ralenti du moteur, et son courant plein vers 6 000 tr/min. Quand sa plaque porte deux intensités, comme « 40-70 A », la première est celle d’un régime proche du ralenti. Une cale sur l’accélérateur, qui tient le moteur au-dessus du ralenti, fait donc monter le courant. Le camion reste à 6 m du chalet : plutôt que de tirer des câbles minces sur cette distance, on porte la batterie au camion, une de 12 V ou une paire de 6 V à la fois, et on la branche en parallèle sur la sienne avec des câbles courts. Une batterie qui charge monte en état de charge, donc son point de gel descend à mesure : c’est pour ça qu’on la charge, une fois qu’on l’a vue intacte. Le prix est dans le réservoir : au ralenti, un moteur de 3 L brûle 1,8 L à l’heure, un moteur de 5 L, 3 L à l’heure — quatre à sept fois ce que brûle une génératrice de 1 800 W au quart de charge. Le camion est la charge de dernier recours, pas celle de tous les jours.</p>
<p class="p0 ri"><strong class="runin">À la prise 12 V de la génératrice.</strong> Quand la génératrice en a une, elle sert à ça ; celle de l’exemple donne 8,3 A. Cinq heures, une quarantaine d’ampères-heures : deux journées de décembre du coffre dans la remise. Cette prise n’est pas régulée comme un chargeur : le voltmètre décide de l’arrêt.</p>
<p class="p0 ri"><strong class="runin">Le panneau branché direct sur la batterie.</strong> Une étiquette de panneau « de 12 V » porte typiquement autour de 20 V à vide. Branché sur une batterie, il est tenu vers le bas tant qu’elle se remplit, puis la tension grimpe au-delà de l’absorption, et la batterie bout et perd son eau. Le lecteur fait le contrôleur : il branche le matin, lit, et débranche quand la batterie atteint 14,1 à 14,7 V en charge. Au froid, pour le plomb seulement, ce seuil monte : 0,75 V de plus à 0 °C, plus d’un volt à −10 °C (étape 24). Pour le lithium, la tension de sa fiche, sans correction, et jamais sous le seuil de température de la section 3. La fréquence des lectures suit le rapport entre le champ et le banc. En décembre, deux lectures, à midi et au milieu de l’après-midi, suffisent. Au printemps et en été, 400 W de panneaux poussent plus de 20 A en plein soleil dans un banc de 130 Ah qui n’en veut que 13 à 17 (étape 28) : à l’approche du plein, on lit toutes les heures, ou on ne branche qu’une partie du champ. La nuit, le panneau se débranche : sans diode antiretour, il laisse la batterie se vider à l’envers dans le noir. Ce qu’on perd : les lectures de la journée, et de l’eau dans le plomb ouvert si on les manque.</p>
<p class="p0 ri"><strong class="runin">Le chargeur mort.</strong> Quand un vieux chargeur meurt par sa petite électronique ou son redresseur, son transformateur, lui, est encore bon, et déjà à la bonne tension. Le redresseur se refait avec les diodes d’un alternateur de ferraille, montées sur deux plaques : trois sur la plaque positive, trois sur la négative, et trois bornes de phase. Tout dépend du nombre de fils qui sortent du secondaire, le côté basse tension du transformateur, aux fils les plus gros.</p>
<p class="li"><strong>Deux fils</strong> : un pont de quatre diodes. Chaque fil va à une borne de phase, deux des trois bornes seulement ; la plaque positive va au positif de la batterie, la négative au négatif.</p>
<p class="li"><strong>Trois fils</strong>, celui du milieu étant un point milieu : deux diodes suffisent. Les deux fils des bouts vont à deux bornes de phase, la plaque positive au positif de la batterie, et le fil du milieu directement au négatif. La plaque négative reste en l’air, rien n’y est branché. Brancher un pont de quatre diodes aux deux bouts d’un tel secondaire double la tension, et elle arrive sans aucune régulation dans la batterie.</p>
<p>Avant de brancher la batterie, on lit la tension à vide au voltmètre : elle doit être du même ordre que celle d’une batterie en charge. Le double, c’est le mauvais montage. Côté 120 V, les connexions restent dans le boîtier d’origine, isolées avant qu’on branche le cordon, et le fil de terre du cordon reste vissé au boîtier de métal : un fil du primaire qui touche le boîtier fait alors sauter le fusible au lieu de mettre le boîtier sous tension. Le fusible reste. On ne touche pas au primaire tant que le cordon est dans la prise. Il n’y a plus de coupure automatique : le voltmètre, encore.</p>
<p class="p0 ri"><strong class="runin">L’ampoule de phare en série.</strong> Pour brancher une batterie très basse sur une source forte — le camion, surtout —, une ampoule de phare de 12 V en série plafonne le courant à ce qu’elle tire allumée à pleine tension : ses watts divisés par 12, un peu plus de 4 A pour une ampoule de 55 W. C’est un plafond, pas le courant de charge. L’ampoule ne voit que l’écart entre la source et la batterie, deux ou trois volts au camion, et le courant réel n’en est qu’une fraction : la charge prend des jours, pas des heures. Elle brille quand la batterie est creuse, et pâlit à mesure qu’elle se remplit : c’est un ampèremètre qu’on lit de l’autre bout de la pièce. Elle réduit aussi l’étincelle d’une connexion franche sur une batterie creuse. Elle se pose hors du coffre et loin de la batterie qui charge : elle chauffe, et une batterie qui charge dégage de l’hydrogène. Sur une autre batterie comme source, même pleine, l’écart est plus petit encore, et le montage finit comme le paragraphe suivant.</p>
<p class="p0 ri"><strong class="runin">Deux batteries.</strong> Une batterie pleine branchée en parallèle sur une vide, de même tension, lui donne jusqu’à ce que les deux aient la même tension, pas plus. On se retrouve avec deux batteries à moitié : utile pour démarrer, inutile pour remplir. Les batteries des véhicules comme réserve de courant du terrain sont au <span class="ref">ch. 3</span>, <span class="ref">§9</span>.</p>
<h3 class="sub">B. Le petit moteur et l’alternateur d’auto : un chargeur à essence</h3>
<p class="p0">Le moteur de la tondeuse, de la souffleuse, ou celui d’une génératrice dont la tête a brûlé, fait tourner un alternateur d’auto par une courroie. Un alternateur à régulateur intégré sort déjà 14 V régulés : c’est un chargeur tout fait, sans onduleur et sans chargeur 120 V entre les deux.</p>
<p class="li"><strong>Le bon alternateur.</strong> Celui d’un véhicule plus ancien, à régulateur intégré, dont la fiche porte une borne de témoin de charge — marquée L, D+, IND, 15, 61, R ou 1 — et souvent une borne S, qui se branche sur la batterie : sans elle, il charge mal. Une borne marquée C, COM, LIN, BSS, RC, SIG ou RLO dit un alternateur commandé par l’ordinateur du véhicule. Monté seul, un tel alternateur ne produit rien, ou part de lui-même à une tension réglée en usine, entre 13,5 et 15 V, une fois passé 3 000 à 4 000 tr/min ; rien ne les distingue de l’extérieur. L’essai tranche : entraîné vite, voltmètre sur la batterie ; une tension qui monte au-dessus de celle de la batterie au repos dit qu’il charge. Une borne DFM, FR, DF, M ou LI ne commande rien : elle renseigne l’ordinateur.</p>
<p class="li"><strong>Le rapport de poulies.</strong> L’alternateur donne tout son courant vers 6 000 tr/min. Si la plaque du moteur dit 3 600 tr/min, une poulie de moteur 1,7 fois plus grande que celle de l’alternateur l’y amène. Mais un alternateur de 70 A pousse dans un banc bas bien plus que les 10 à 13 % de sa capacité que demande l’étape 28 : un banc de 130 Ah n’en veut que 13 à 17. Pour un petit banc, on vise un régime plus bas, des poulies de même diamètre ou presque, et le voltmètre coupe à l’absorption. Une courroie du même profil que la poulie de l’alternateur : en V sur une poulie en V, à nervures sur une poulie à nervures. Une poulie récupérée, deux arbres alignés au fil tendu.</p>
<p class="li"><strong>L’excitation.</strong> L’alternateur ne part pas seul : il lui faut un peu de courant de la batterie dans son rotor pour commencer à produire. C’est le fil du témoin de charge du tableau de bord. Il se branche au positif de la batterie à travers une ampoule témoin et un interrupteur. On ouvre l’interrupteur à l’arrêt, sinon le rotor vide la batterie pendant la nuit.</p>
<p class="li"><strong>La place.</strong> Dehors, à 6 m, l’échappement à l’opposé des ouvertures, comme n’importe quel moteur (section 8).</p>
<p>Ce qu’on perd : le rendement de cet assemblage n’est pas chiffré ici, la courroie s’use et se désaligne, et le bruit est celui d’une tondeuse pendant des heures.</p>
<h3 class="sub">C. Le courant du ruisseau</h3>
<p class="p0">C’est la source que personne ne regarde, et en décembre, c’est la meilleure, à une condition : qu’elle soit montée pour l’hiver, conduite enfouie, prise sous la glace, roue à cuillers et dynamo à l’abri (plus bas, « L’hiver »), et comptée sur le débit du creux de l’hiver. Un ruisseau qui remplit encore au milieu de l’hiver une chaudière de 20 L en 4 secondes, soit 5 L/s, et qui descend de 4 m entre la prise et la roue, donne environ 100 W, jour et nuit : 2,4 kWh par jour, plus que 1 000 W de panneaux en décembre. Monté l’été avec une roue à augets à l’air libre, le même ruisseau ne donne rien de janvier à mars.</p>
<p class="p0 ri"><strong class="runin">Mesurer d’abord, en basse saison.</strong> Dans le nord du Québec, les petits ruisseaux sont au plus bas au milieu de l’hiver et au plus haut au printemps. La mesure qui compte est celle de la fin de l’hiver, ou celle d’une fin d’été sèche.</p>
<p class="step"><span class="sn">1</span><strong>Le débit, au seau.</strong> Un petit barrage de planches ou de pierres envoie tout le ruisseau dans une goulotte, la goulotte dans la chaudière. Litres par seconde = 20 ÷ secondes pour remplir. Au-delà d’une chaudière en quelques secondes, un baril de 200 L.</p>
<p class="step"><span class="sn">2</span><strong>La hauteur de chute, au boyau.</strong> Un boyau transparent plein d’eau, un bout tenu à la surface de l’eau à l’endroit de la future prise ; on lève l’autre bout, plus bas, jusqu’à ce que l’eau cesse de couler. La hauteur entre ce bout et la surface de l’eau à cet endroit, c’est la chute de ce tronçon. On recommence de tronçon en tronçon jusqu’à la roue, on additionne, et on retranche 2 à 5 cm par mesure, parce que l’eau pousse encore un peu dans le boyau. Plus rapide avec un manomètre au bas d’un boyau plein : 9,8 kPa par mètre de chute, soit environ 1 m par 10 kPa (0,7 m par livre au pouce carré, si la jauge à pneus n’a que cette échelle).</p>
<p class="step"><span class="sn">3</span><strong>Le calcul.</strong> Watts ≈ 5 × litres par seconde × mètres de chute. Les pertes de la conduite, de la roue et de la dynamo sont dans le 5. Exemples : 20 L/s sur 1 m, 100 W ; 10 L/s sur 2 m, 100 W ; 5 L/s sur 8 m, 200 W. Sous 1 m de chute ou sous 0,6 L/s, ça ne vaut pas le chantier. Un ruisseau où vit la truite garde au moins le dixième de son débit moyen de l’année. En basses eaux d’hiver, c’est une bien plus grosse part de ce qui coule : on ne le détourne jamais au complet.</p>
<p class="p0 lab kh"><strong class="runin">Bâtir.</strong></p>
<p class="li"><strong>La prise.</strong> Un petit bassin derrière le barrage, une grille — grillage, tôle percée — devant l’entrée de la conduite, qui arrête les feuilles, le bois et la glace. La conduite descend vers la roue : un vieux tuyau de puits, le boyau de la pompe, du tuyau de poêle pour une chute courte. Plus elle est grosse et courte, moins elle mange de chute ; on vise à perdre moins d’un dixième de la hauteur dans le tuyau.</p>
<p class="li"><strong>La roue à augets, pour une chute d’un mètre environ.</strong> L’eau tombe par-dessus dans des augets — chaudières coupées, cruches, planchettes clouées sur deux disques de contreplaqué ou sur une roue de vélo — et la roue tourne par le poids. C’est la roue qui rend le plus (jusqu’aux trois quarts de l’énergie de l’eau) ; celle que le courant pousse par-dessous rend le moins (du quart à un peu moins de la moitié). Mais elle n’exploite que la hauteur de son propre diamètre : une roue de vélo ou des disques de contreplaqué plafonnent autour d’un mètre, et le reste de la chute est perdu. Les roues se gardent pour les chutes de moins de 3 m ; au-delà d’un mètre ou deux, la roue à cuillers prend toute la hauteur. La roue à augets tourne lentement, et il faut multiplier la vitesse beaucoup. On compte ses tours à la montre une fois montée ; la dynamo en demande des centaines à la minute (plus bas), et le rapport à trouver est le quotient des deux : une roue qui fait 20 tours à la minute, pour une dynamo qui en veut 800, demande 40 fois. Le pédalier et la roue arrière d’un vélo ne multiplient que par le rapport de leurs dents, plateau divisé par pignon, quelques fois seulement : c’est un étage, pas le multiplicateur entier. Les autres étages se font en courroies en V et poulies.</p>
<p class="li"><strong>La roue à cuillers, pour une chute de plus d’un mètre ou deux, et peu d’eau.</strong> Le tuyau se rétrécit en buse au bout, et le jet frappe des cuillers ou des demi-tasses boulonnées sur le bord d’un disque, qui renvoient l’eau vers l’arrière. C’est le principe de la turbine Pelton. Elle tourne vite, assez pour un alternateur avec peu de multiplication, et c’est elle qui passe l’hiver, à l’abri.</p>
<p class="li"><strong>La dynamo : un moteur à aimants permanents.</strong> Moteur de tapis roulant, de trottinette électrique : tourné à la main, il produit. Un moteur à courant continu à aimants permanents rend plus de 80 % à pleine charge quand il travaille en dynamo. Sa tension est proportionnelle à sa vitesse, et la plaque donne la paire : un moteur marqué 90 V à 5 000 tr/min donne 9 V à 500 tr/min. Il faut dépasser la tension d’absorption de la batterie, plus la chute de la diode : le moteur de l’exemple demande plus de 800 tr/min, à peu près le régime où l’alternateur d’auto commence. Son avantage n’est donc pas la vitesse, c’est qu’il ne demande aucune excitation : ses aimants produisent dès qu’il tourne, sans fil de témoin ni batterie pour l’amorcer. On calcule la vitesse sur la plaque, on choisit les poulies en conséquence. Une diode dans le fil positif empêche la batterie de faire tourner la dynamo comme un moteur quand l’eau baisse. L’alternateur d’auto marche aussi, mais il lui faut au moins 1 000 tr/min pour commencer, 6 000 pour donner tout son courant, et l’excitation de la section B : une roue lente ne l’atteint pas sans une cascade de poulies.</p>
<p class="li"><strong>La charge de délestage, qui n’est pas facultative.</strong> Un panneau solaire se débranche sans dommage ; une roue à eau non. Sans charge, la dynamo s’emballe, sa tension grimpe, et la roue et les roulements prennent la vitesse qu’aucune pièce n’a été faite pour tenir. La charge est résistive : des ampoules de phare en parallèle, douilles au sec au-dessus d’un baril d’eau et verre dans l’eau pour que leur chaleur serve. <strong>Elle se branche du côté de la roue, avant le fusible et avant le système de gestion d’un banc au lithium</strong>, pour que la roue ne se retrouve jamais à vide quand la batterie sort du circuit : un fusible qui saute, un système de gestion qui coupe la charge parce que le banc est plein ou froid. Jamais dans le coffre à batteries : une ampoule chaude sous un couvercle plein d’hydrogène, c’est l’étincelle de la section 8. Chaque ampoule allumée se voit dans le baril ; une ampoule éteinte, c’est une charge en moins, et la roue accélère : on la change le jour même.</p>
<p class="li"><strong>La nuit, personne ne fait le régulateur.</strong> Une source qui produit vingt-quatre heures sur vingt-quatre ne se règle pas au voltmètre : le banc plein à minuit reçoit toute la production jusqu’au matin, et le plomb ouvert bout toute la nuit dans son coffre. La régulation doit se passer de quelqu’un d’éveillé. Deux façons, sans électronique. Soit la roue ne donne au banc que ce que le chalet tire en moyenne, bridée à la buse ou à la vanne, et le reste de l’eau passe à côté. Soit les ampoules de délestage restent branchées côté roue jour et nuit et avalent tout ce qui dépasse la consommation moyenne ; le banc ne reçoit que la différence. Dans les deux cas, le banc se juge le matin, au densimètre et au niveau des éléments. Un plomb ouvert dont le niveau baisse de jour en jour a bouilli la nuit : une ampoule de plus, ou un peu moins d’eau à la buse. Un banc dont la densité baisse de jour en jour manque de courant : une ampoule de moins. Ce qui reste pour le banc quand il est plein doit le tenir à sa tension de maintien, 13,5 V à 25 °C, corrigée pour le froid comme à l’étape 24, et pas plus haut : au-dessus, il bout. Le voltmètre le dit le matin, roue qui tourne, banc plein : à la tension de maintien ou sous elle, c’est un filet ; au-dessus, une ampoule de plus.</p>
<p class="p0 ri"><strong class="runin">L’hiver.</strong> Une roue à eau à l’air libre ne passe pas l’hiver ici : la glace s’y forme et s’y accumule, et il est pratiquement impossible de l’en empêcher. Ce qui passe l’hiver, c’est une conduite enfouie sous la ligne de gel, une prise sous la glace dans un trou d’eau qui ne gèle pas jusqu’au fond, et la roue à cuillers avec sa dynamo dans un petit abri. Un trou d’eau qui ne gèle pas, c’est une glace mangée par en dessous par le courant ou une source : on n’y va pas sur la glace pour entretenir la prise, on y va du bord ou pas du tout (<span class="ref">ch. 58</span>). Le travail dans le ruisseau se fait à deux et pas seul : l’eau glacée coupe les mains en minutes (<span class="ref">ch. 25</span>, le 1-10-1). Le débit de calcul est celui du milieu de l’hiver, quand le ruisseau est au plus bas.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd :</strong> des jours de chantier, le barrage que la crue du printemps emporte, et un ruisseau qui baisse au moment où on en a le plus besoin. Ce qu’on gagne : la seule source qui ne dépend ni du ciel ni du réservoir.</p>
<h3 class="sub">D. Le vent</h3>
<p class="p0">Le vent est la plus faible des trois sources autour d’un chalet en forêt, et il faut le dire. Une éolienne demande une moyenne annuelle d’au moins 15 km/h ; en terrain ouvert, à Sept-Îles, la moyenne est de 14 km/h, et un chalet sous les arbres en a moins. Elle vaut la peine sur une pointe exposée au fleuve, au bord d’un grand lac, sur une butte dénudée — et là, elle a deux qualités que le soleil n’a pas : le vent souffle la nuit, et il souffle plus en hiver (15 km/h en décembre, 12 en juillet). L’air froid, plus lourd, porte environ 16 % d’énergie de plus à −20 °C qu’à +20 °C.</p>
<p class="li"><strong>La puissance est au cube de la vitesse.</strong> 10 % de vent en plus, 30 % de puissance en plus. D’où la hauteur : le vent gagne environ 12 % chaque fois qu’on double la hauteur, donc la puissance gagne 40 %. Au-dessus des cimes, le vent est plus fort et moins turbulent.</p>
<p class="li"><strong>Le diamètre compte au carré.</strong> Doubler le diamètre des pales quadruple la puissance.</p>
<p class="li"><strong>Bâtir.</strong> Le même moteur à aimants permanents qu’au ruisseau, sur une tête qui pivote au bout d’un mât haubané, une queue en tôle qui la garde face au vent, des pales taillées dans du bois ou dans un gros tuyau de plastique fendu en long. Le moteur se choisit sur sa plaque : ses volts divisés par ses tours donnent ce qu’il sort à chaque tour, et il doit dépasser 15 V au régime que l’hélice atteint vraiment ; sinon, une multiplication entre les deux. Le moteur de l’exemple du ruisseau demande plus de 800 tr/min. Le câble descend de la tête qui pivote au mât qui ne pivote pas : laissé lâche en boucle, il se tord à mesure que la tête suit le vent, et se détord à la main à chaque visite. La diode, la charge de délestage branchée du côté de l’éolienne avant le fusible, le voltmètre et le réglage de nuit du ruisseau, tels quels. Si une petite éolienne de voilier ou de camp traîne quelque part, c’est elle qu’on monte : elle a déjà ses pales, sa queue et son frein.</p>
<p class="li"><strong>Le mât.</strong> Un mât qu’on lève ou qu’on couche tombe sur toute sa hauteur : personne dans cette longueur, du côté où il penche, pendant la manœuvre. Le mât basculant, monté couché et relevé au treuil ou au véhicule, évite de grimper. Un mât de métal au-dessus des cimes devient la cible de la foudre sur le terrain, et son câble la conduit jusqu’au coffre à batteries dans le chalet : le câble se débranche du banc quand l’orage approche.</p>
<p class="li"><strong>L’arrêter avant la tempête.</strong> Une petite éolienne s’arrête pour se protéger vers 70 km/h. Celle qu’on bâtit n’a pas ce frein : on prévoit de quoi la replier de côté ou attacher les pales avant le gros vent, et on l’arrête quand le givre alourdit une pale et la déséquilibre. Le givre qui s’en détache est projeté loin. Une pale qui tourne frappe : avant de s’approcher, on arrête le rotor. Un moteur à aimants se freine quand on relie ses deux fils de sortie ensemble : il s’arrête, ou, par très grand vent, tourne encore lentement. On fait ce court-circuit avec un interrupteur au pied du mât, jamais à la main nue sur les fils, et un interrupteur qui coupe d’abord la batterie avant de relier les fils : dans l’autre ordre, c’est la batterie qu’il met en court-circuit. Le frein sert pour un arrêt court ; pour des jours, ou pour la tempête annoncée, on couche le mât ou on attache les pales.</p>
<p>Ce qu’on perd : beaucoup de travail pour peu de courant, sauf sur un site vraiment venteux.</p>
<h3 class="sub">E. Le froid sans courant</h3>
<p class="p0">Quand il ne reste ni banc, ni génératrice, ni onduleur, le coffre redevient la meilleure caisse isolée du terrain, et tout ce qui suit est déjà écrit ailleurs : la cache d’hiver au <span class="ref">ch. 73</span>, la génératrice branchée directement sur le coffre par blocs, le thermostat ponté et le joint refait au <span class="ref">ch. 74</span>, <span class="ref">§9</span>, le caveau au <span class="ref">ch. 79</span>. Ce qui ne se fait pas au chalet : changer le compresseur de 120 V d’un coffre pour un compresseur de 12 V. Ça s’est déjà fait, mais le circuit est scellé sous pression, et ce qui manque au chalet n’est pas le brasage : c’est tout ce qui l’entoure. Le gaz se vide et se récupère avant de couper, au coupe-tube, jamais à la scie ; aucune flamme sur un circuit qui en contient encore. On purge à l’azote sec avant de braser, on change le filtre déshydrateur à chaque ouverture, et le circuit ne reste pas ouvert plus d’un quart d’heure : l’humidité qui y entre fait des bouchons de glace et ronge l’huile. Puis la pompe à vide retire l’air, et le gaz de la plaque se remet dans la quantité de la plaque, à la balance. Il manque au chalet l’azote, le filtre, la pompe, la balance et le gaz. Et des coffres récents tournent à l’isobutane ou au propane, des gaz qui brûlent. La plaque du coffre nomme son gaz ; sur bien des appareils récents, les tuyaux où il passe sont marqués de rouge et une étiquette avertit. Sur un circuit à gaz inflammable, aucune flamme ni brasure : le gaz qui sort d’un tuyau ouvert prend feu au chalumeau.</p>
<h3 class="sub">F. Trouver le sud sans boussole</h3>
<p class="p0">Un bâton planté droit dans un sol plat, une pierre au bout de l’ombre tous les quarts d’heure autour du milieu de la journée. La pierre la plus proche du bâton marque le midi solaire, et la ligne du bâton à cette pierre pointe le nord vrai ; le sud est à l’opposé. La même ombre donne l’heure juste du midi, qui ne tombe pas à 12 h à l’horloge.</p>
<h3 class="sub">G. Ce qui ne se remplace pas</h3>
<p class="li"><strong>La batterie.</strong> Des plaques de plomb et de l’acide ne se fabriquent pas au chalet. Une batterie au bac bombé ou fendu est perdue, une batterie gelée intacte l’est d’ordinaire (<span class="ref">ch. 84</span>, <span class="ref">§9</span>), une batterie au lithium gonflée aussi (<span class="ref">ch. 104</span>). Tout ce chapitre protège le banc avant le reste, parce que c’est la seule pièce qui ne repousse pas.</p>
<p class="li"><strong>L’onduleur, pour un compresseur de 120 V.</strong> Sans lui et sans génératrice, le coffre est une caisse.</p>
<p class="li"><strong>L’avertisseur de CO.</strong> Aucun montage ne voit le monoxyde. Ce qui le remplace n’est pas un objet mais une règle tenue sans exception : aucun moteur dans un bâtiment, 6 m entre le moteur et les murs.</p>
<p class="li"><strong>Le fusible.</strong> Un boulon ou un bout de fil à sa place ne coupe rien : le prochain court-circuit fait fondre le câble au lieu du fusible, sous le plancher ou dans le mur.</p>
<p>Souder avec les batteries du banc est au <span class="ref">ch. 103</span> : c’est la même énergie, qu’il faudra recharger.</p>

<p class="fn" data-fn="27-1"><span class="fnn">1</span>L’œil infecté par derrière : paupières enflées et rouges ; l’œil poussé vers l’avant, ce qui se voit le mieux en regardant le visage d’en haut, par-dessus le front ; l’œil qui fait mal quand il bouge et qui bouge moins bien que l’autre ; la vue qui baisse ; de la fièvre. Au début, une partie de ces signes peut manquer : la paupière qui enfle chez quelqu’un qui a mal à une dent du haut ou au sinus suffit à partir.</p>
<p class="fn" data-fn="27-2"><span class="fnn">2</span>Un son aigu et rauque à chaque entrée d’air : l’air forcé à travers une gorge que l’enflure rétrécit.</p>
<p class="fn" data-fn="45-1"><span class="fnn">1</span>Le renflement est un anneau où le canon a gonflé sous le choc de la balle contre l’obstacle. Il se voit parfois dehors, comme un anneau autour du canon. Sinon, l’âme bien propre, regardée par la chambre contre une lumière vive, y montre une ombre en anneau — une tache de graisse fait la même ombre, d’où l’âme propre — et les doigts passés doucement le long du canon le sentent comme une bosse. Deux balles restées dans l’âme : on présume le canon renflé. Un canon renflé ne s’arrange pas en tirant.</p>
<p class="fn" data-fn="47-1"><span class="fnn">1</span><strong>Le tambourinage de la gélinotte.</strong> Un bruit sourd qui pulse, comme un tambour qu’on bat au loin. Le mâle le fait en comprimant l’air sous ses ailes, le plus souvent debout sur un billot, parfois sur une racine ou une roche. On l’entend surtout au printemps, et parfois à l’automne.</p>
<p class="fn" data-fn="47-2"><span class="fnn">2</span><strong>La trace du lagopède.</strong> L’hiver, le dessous de ses pieds est couvert de plumes jusqu’au bout des doigts, au point de ressembler à une patte de lièvre, et seules ses longues griffes dépassent : l’empreinte est ronde et floue, sans doigts nets (<span class="ref">ch. 43</span>, <span class="ref">§5</span>-F). La gélinotte et le tétras n’ont pas le pied emplumé : l’hiver, la gélinotte porte seulement de petites franges en peigne le long des doigts, et ses doigts marquent.</p>
<p class="fn" data-fn="81-1"><span class="fnn">1</span>Les premiers jours, les repas grossissent et la faim revient au bout de chacun : le repas complet de viande ne la coupe pas, le ventre est tendu, et l’envie de gras ne lâche pas. On maigrit alors que les portions sont grosses. Viennent ensuite la nausée et la diarrhée, que seul le gras arrête. Plus de viande maigre aggrave ; le gras renverse. L’enfant y arrive avant l’adulte : la part de protéines qu’il supporte plafonne plus bas (24).</p>
<p class="fn" data-fn="81-2"><span class="fnn">2</span>Acides, donc à l’eau bouillante : petits fruits, confitures, gelées, marinades acidifiées. Peu acides, donc à l’autoclave : viande, poisson, bouillon, champignons de culture, haricots, betteraves, carottes, maïs, courges (73).</p>
<p class="fn" data-fn="81-3"><span class="fnn">3</span>Le 66 °Brix ne se voit pas et ne se goûte pas : il se lit au réfractomètre ou au densimètre à sirop. Sans instrument, on ne fait pas de sirop de garde : on fait du sucre, qui se juge à l’œil et à la dent, ou un sirop léger gardé gelé dehors et mangé dans la saison (60).</p>
<p class="fn" data-fn="81-4"><span class="fnn">4</span>Trouble laiteux, mousse qui ne retombe pas, odeur aigre, filaments dans la chaudière. Le froid qui concentre la sève concentre aussi ce qui a tourné (60).</p>
<p class="fn" data-fn="84-1"><span class="fnn">1</span>Le serti est le repli de métal du pourtour de la boîte, là où le couvercle est roulé sur le corps. Avec la ligne de métal qui ferme le corps sur toute sa hauteur, c’est un des deux joints de la boîte. Une bosse, une arête pliée ou de la rouille à cet endroit, et le joint ne tient plus.</p>
<p class="fn" data-fn="84-2"><span class="fnn">2</span>Les premiers signes sont ceux d’une grippe : frissons, fièvre, fatigue, maux de tête, étourdissements, douleurs musculaires, parfois toux, maux de ventre, nausées et vomissements. Rien dans la liste n’est propre au hantavirus : ce qui la distingue, c’est d’avoir ouvert le chalet ou touché des crottes de souris dans les semaines d’avant. La forme grave ajoute l’essoufflement, puis une détresse respiratoire sévère.</p>
<p class="fn" data-fn="86-1"><span class="fnn">1</span>Le densimètre de batterie est une poire de caoutchouc au bout d’un tube de verre, avec un flotteur gradué dedans. On ouvre le bouchon d’un élément, on aspire l’électrolyte jusqu’à ce que le flotteur flotte sans toucher le fond ni les parois, on vide et on remplit deux ou trois fois dans le même élément, puis on lit la graduation au ras du liquide, l’œil à sa hauteur. Le chiffre lu est la densité : 1,277 pour un élément plein. L’acide retourne dans l’élément d’où il vient, lunettes sur le nez.</p>
<p class="fn" data-fn="86-2"><span class="fnn">2</span>Il porte « MPPT » sur son étiquette ou sur sa fiche. Un contrôleur marqué « PWM », le plus simple, ne le suit pas.</p>
<p class="fn" data-fn="86-3"><span class="fnn">3</span>Ça se lit sur l’étiquette de l’onduleur ou sur sa boîte : « onde sinusoïdale pure » (« pure sine wave ») ou « onde sinusoïdale modifiée » (« modified sine wave »).</p>

<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
