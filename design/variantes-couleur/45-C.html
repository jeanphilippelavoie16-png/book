<p class="p0">Sans armurier, sans magasin, sans pièce qu’on commande, et un jour avec la boîte presque vide. L’ordre de repli se décide avant ce jour-là : les engins d’abord, qui prennent la nuit sans rien consommer (<span class="ref">ch. 48, 53, 60</span>) ; l’arc, la fronde et le bâton pour le petit gibier qui se fige au lieu de fuir (la chasse est au <span class="ref">ch. 47</span>, <span class="ref">§9</span>) ; la .22 pour ce que l’arc ne prend pas ; la carabine pour l’orignal, l’ours et le phoque, et pour rien d’autre.</p>
<p class="p0 ri"><strong class="runin">La bête qui se laisse approcher n’est pas toujours une bête facile.</strong> Ces armes-là choisissent la bête qui ne part pas, et la maladie en fait autant. Le lièvre accroupi à couvert qui se fie à son camouflage est normal (<span class="ref">ch. 47</span> <span class="ref">§3</span>) ; celui qui reste là, faible, léthargique, quand on est dessus, et en bon état de chair, porte le tableau de la tularémie : il ne se prend pas et ne se touche pas (<span class="ref">ch. 48</span>, étape 7 et <span class="ref">§7</span>). Le tétras perché ou debout, tête haute, plumage serré, qui suit des yeux celui qui approche, est normal ; l’oiseau au sol, plumage gonflé, yeux fermés ou enflés, qui ne suit rien et se laisse prendre, ne se prend pas, ne se touche pas (<span class="ref">ch. 49</span>, <span class="ref">§8</span> bloc 2).</p>
<h3 class="sub">L’arc tiré d’une bille fendue</h3>
<p class="p0">C’est l’arc de mélèze des Innus et des Naskapis, pour le petit gibier pendant que la balle va au gros : une bille de mélèze, une corde de peau crue, une flèche à tête ronde. Un arc sans raffinement : cassé, il se remplace par un autre bout de bois de la forêt.</p>
<p class="p0 ri"><strong class="runin">Choisir le bois.</strong> Le mélèze laricin (<em>Larix laricina</em>), qui pousse au bord des tourbières à sphaignes, ou l’épinette noire (<em>Picea mariana</em>) : ce sont les deux bois de cet arc-là, pour l’arc comme pour les flèches, et secs, ils se valent en flexion. Le bouleau à papier est au moins aussi résistant une fois sec, mais les arcs du Nord sont en mélèze et en épinette : un arc de bouleau est un essai, qui se juge à la perche à crans avant d’aller au bois. Chercher un tronc droit, sans branche ni nœud sur une longueur un peu plus grande que l’arc, pas tordu en vrille : une écorce dont les fentes tournent autour du tronc annonce un fil qui tourne, et un arc tiré de là casse en travers. Pas un arbre penché : son bois de réaction, qu’on reconnaît au cœur décentré sur la coupe, est nettement plus faible. Le bois mort debout, sec et sain, vaut mieux que le vert ; le vert se travaille plus facilement et se sèche ensuite.</p>
<p class="p0 ri"><strong class="runin">Fendre.</strong> Ouvrir la bille par le centre, puis chaque moitié par son centre, aux coins de bois (<span class="ref">ch. 106</span> <span class="ref">§9</span>.3). Garder la demi-bille ou le quart dont le fil court droit d’un bout à l’autre, et laisser le cœur du côté du ventre, où on l’enlèvera : le bois des premiers cernes autour du cœur tient parfois moitié moins en flexion que le bois mûr. Un jeune tronc de la bonne grosseur peut servir entier, écorcé, sans fendre : c’est plus rapide, mais tout ce bois-là est du bois de jeunesse, et l’arc est plus faible et plus cassant.</p>
<p class="p0 ri"><strong class="runin">Le dos ne se touche jamais.</strong> Le dos, c’est la face sous l’écorce. On enlève l’écorce et la couche molle juste dessous au racloir, sans entailler le bois. Tout le reste du travail se fait <strong>au ventre</strong>, du côté du cœur : gratter du côté du dos casse l’arc au premier bandage.</p>
<p class="p0 ri"><strong class="runin">La forme.</strong> Une longueur de <strong>1,2 à 1,8 m (4 à 6 pi)</strong>. Au centre, environ <strong>2,5 cm d’épaisseur et 3,8 cm de largeur</strong>, et à peine plus mince et plus étroit vers les bouts. Garder la poignée pleine ; amincir le ventre des deux bras jusqu’à ce qu’ils plient. Aux deux bouts, <strong>les encoches</strong> : deux entailles taillées en biais sur les côtés, limées lisses, jamais une fente dans l’axe du bois — une fente s’ouvre sous la corde et remonte le fil.</p>
<p class="p0 ri"><strong class="runin">Sécher.</strong> Un bois dégrossi sèche plus vite qu’une bille. <strong>Enduire les deux bouts</strong> de poix ou de cire : les bouts sèchent trop vite, fendent, et la fente remonte dans l’arc. Sécher à l’abri, au frais, jamais bandé, jamais au-dessus du poêle. Au froid de l’hiver dehors, le séchage à l’air est très lent ; dans le chalet chauffé, il va plus vite, mais à l’écart de la chaleur. Pour savoir quand c’est sec, on pèse comme au <span class="ref">ch. 106</span> : la masse s’écrit <strong>au charbon sur le bois même</strong>, et deux pesées égales à une semaine d’intervalle disent que le bois a fini de perdre son eau. Dehors, un bois de l’épaisseur d’un arc met des semaines à des mois ; mis dehors à l’automne, il ne finit qu’au printemps. Une pièce deux fois plus épaisse sèche environ trois fois plus lentement : c’est pourquoi on dégrossit d’abord. La balance dit le jour.</p>
<p class="p0 ri"><strong class="runin">Égaliser les deux bras.</strong> Un bras plie toujours plus que l’autre — le bout le plus gros de la bille est le plus raide. On gratte le ventre du gros bout <strong>jusqu’à ce qu’il tire comme le petit</strong>. Pour voir, une perche à crans : une perche plantée ou accrochée au mur, des crans tous les quelques centimètres, l’arc posé par la poignée au sommet, la corde tirée d’un cran à la fois. On recule de quelques pas et on regarde. Les deux bras doivent décrire deux arcs de cercle égaux. Là où un bras reste droit, on gratte le ventre à cet endroit, et seulement là ; là où il plie déjà, on ne touche plus. <strong>On ne tire jamais l’arc à pleine allonge avant que la courbe soit égale</strong> : c’est le point plat qui ne plie pas qui fait casser le point voisin qui plie trop. La pleine allonge, c’est la flèche tirée jusqu’à ce que sa pointe arrive presque à l’arc, à 2,5 cm au moins de l’endroit où elle repose : la longueur de la flèche, moins quelques centimètres. Et jamais la corde lâchée à vide, sans flèche (<span class="ref">§8</span>, bloc 6).</p>
<p class="p0 ri"><strong class="runin">Bander et débander.</strong> Une corde plus longue sert pendant l’égalisation ; la corde finale laisse environ un poing fermé, pouce levé, entre elle et la poignée : c’est la vieille mesure des archers. <strong>L’arc se débande après chaque séance</strong> et se range à plat ou pendu, au frais. Laissé bandé, il flue et perd son ressort, et c’est définitif.</p>
<p class="p0 ri"><strong class="runin">Câbler le dos quand le bois est faible ou qu’il commence à lâcher.</strong> Un seul tendon tordu, long de <strong>seize fois l’arc</strong>, bouclé à une encoche et passé <strong>huit allers-retours</strong> d’une encoche à l’autre le long du dos, soit seize longueurs d’arc. Pour un arc de 1,2 m, c’est environ <strong>19 m</strong> de tendon tordu d’un seul morceau ; pour 1,8 m, près de <strong>29 m</strong>. C’est plus que tout le fil de tendon d’un orignal, une quinzaine de mètres (<span class="ref">ch. 99</span>, <span class="ref">§2</span>) : le câble complet demande le tendon de plus d’une bête. Au milieu, on y met <strong>deux tours de torsion</strong> avec un bâtonnet, ce qui retend le câble et raidit l’arc, puis on le ligature à la poignée par une lanière de peau crue. Le câble travaille en traction avec le dos. Un câble plus court, de quelques longueurs seulement, n’est pas la méthode décrite : c’est un essai. C’est aussi ce qu’on essaie sur un arc dont une écharde se soulève, avant de le jeter ; l’arc câblé pour ça s’essaie d’abord sur la perche à crans, de côté, jamais à la joue (<span class="ref">§8</span>, bloc 6). Plus simple et plus grossier : un deuxième arc ligaturé au premier par la poignée, les deux formant un X vu de côté, ses bouts reliés à ceux du premier par une cordelette, et une seule corde, sur l’un des deux.</p>
<p class="p0 ri"><strong class="runin">Mesurer l’arc.</strong> Accrocher l’arc par la poignée à une poutre, corde vers le bas, et suspendre une chaudière à la corde. Verser de l’eau jusqu’à ce que la corde descende à l’allonge voulue, mesurée de la corde jusqu’au dos de la poignée : <strong>un litre pèse un kilo</strong>, la chaudière pesée vide compte avec l’eau, et le total dit la force de l’arc. Pour le petit gibier, le chiffre compte peu : la flèche doit voler droit et frapper assez pour rouler un lagopède. Pour le gros gibier, le mécanisme est ailleurs : l’arc doit pousser une pointe large et tranchante jusque dans la cage thoracique d’une grosse bête. Pour l’orignal, on demande à l’arc <strong>22,7 kg à 71 cm d’allonge</strong>. Ce chiffre ne s’appuie sur aucune mesure de pénétration publiée : un plancher n’est pas une garantie. L’essai à 71 cm ne vaut que pour un arc du haut de la fourchette et une flèche de plus de 71 cm : un arc court tiré aussi loin plie son bois bien plus fort (<span class="ref">§3</span>). Un arc de bille qui n’arrive pas à 22,7 kg ne va pas sur un orignal.</p>
<p>Un arc qui y arrive, avec la pointe large décrite plus bas, reste un dernier recours. Avant les fusils, c’est ainsi que l’arc a pris le gros gibier : la bête poussée dans les bancs de neige profonde, le chasseur en raquettes là où elle s’enlisait. Ça marchait parce que la neige la tenait sur place. Mais la flèche tue par le sang que la bête perd, pas par le choc : touchée, elle reste debout de quelques secondes à plusieurs heures. Un orignal touché ne s’approche donc pas à quelques pas, même enneigé : la conduite du <span class="ref">ch. 61</span> (étape 2 et <span class="ref">§8</span>, bloc 1) — attendre, approcher par l’arrière — suppose une arme chargée pour le coup de grâce, et l’arc n’en donne pas. Ce n’est pas l’arc qu’on apprend en premier.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd.</strong> La portée : un tireur exercé renverse un lagopède ou un lièvre accroupi à <strong>une vingtaine de mètres</strong>, et un débutant, à beaucoup moins. La durée : un arc de fortune perd son ressort ou casse, et on en refait un. La pluie : la corde mouillée s’allonge. Le temps de pratique, qui ne se remplace par rien.</p>
<h3 class="sub">La corde</h3>
<p class="p0 ri"><strong class="runin">En peau crue ou en tendon.</strong> La corde de l’arc de mélèze est une lanière de peau crue d’orignal, tordue ou tressée. Celle de l’arc câblé est du tendon tordu, avec <strong>une boucle à chaque bout</strong>. La peau crue se coupe et se prépare comme la babiche du <span class="ref">ch. 99</span> (<span class="ref">§5-C</span> à 5-E) ; le tendon se lève, se sèche et se défibre comme au <span class="ref">ch. 99</span> (<span class="ref">§5-A</span> et 5-B). Les deux se tordent en contre-toron (<span class="ref">ch. 99</span>, <span class="ref">§5-G</span>) : deux brins tordus chacun dans un sens et enroulés l’un sur l’autre dans l’autre sens. Le tendon mouillé colle et durcit en séchant ; les reprises se font sans nœud, en roulant les deux pointes l’une sur l’autre dans le sens de la torsion.</p>
<p class="p0 ri"><strong class="runin">Les boucles.</strong> Une boucle fixe, tressée ou ligaturée, au bout qui va à l’encoche du bas. L’autre bout se noue autour de l’encoche du haut quand l’arc est bandé à la bonne hauteur, puis, la longueur trouvée, se refait en deuxième boucle. La corde se ligature de tendon à l’endroit où la flèche s’appuie, là où les doigts l’usent.</p>
<p class="p0 ri"><strong class="runin">Contre l’eau.</strong> Une babiche retrempée redevient molle et s’allonge (<span class="ref">ch. 99</span>). Frottée au gras, elle boit l’eau plus lentement : on graisse la corde d’un arc, parce qu’on ne lui demande pas de serrer en séchant. Une corde de rechange voyage roulée dans une poche intérieure, sèche.</p>
<p class="p0 ri"><strong class="runin">Ce qui la remplace.</strong> Une corde synthétique tressée qui ne s’étire pas sous la main, un fil de pêche tressé doublé. Ce qui s’étire comme un élastique ne fait pas une corde d’arc : il boit la force au lieu de la rendre.</p>
<h3 class="sub">La flèche mousse</h3>
<p class="p0 ri"><strong class="runin">Le fût.</strong> Du mélèze ou de l’épinette sec, refendu en baguettes de section carrée, puis arrondi au couteau et au racloir. Longueur : <strong>61 à 76 cm</strong>, à peu près la moitié de l’arc. Un fût croche se redresse à la chaleur : le passer au-dessus des braises sans le roussir, le plier dans le bon sens, le tenir droit jusqu’à ce qu’il refroidisse. Le contrôle : le fût roulé sur une planche plane roule sans sautiller.</p>
<p class="p0 ri"><strong class="runin">La tête.</strong> En œuf, au bout du fût. Deux façons. La première : garder au bout de la baguette une épaisseur de bois qu’on taille en bulbe arrondi — un seul morceau, rien à coller. La deuxième : un nœud de bouleau, un bout de panache ou d’os percé, enfoncé sur le bout aminci, collé à la poix et ligaturé de tendon. <strong>Du poids au bout la porte plus loin</strong> : un clou enfoncé dans la tête, une petite pierre ligaturée. Une douille vide de .22, qui ne se recharge pas, enfoncée par le collet sur un bout très aminci, fait une tête plate de métal d’un seul coup, le culot en avant : c’est un essai, qui se juge sur une cible avant d’aller au bois. Les douilles de carabine, elles, se gardent (étape 4). Le fût tout seul, sans tête ni plume, tire encore : c’était la flèche de l’écureuil sur une branche basse et du lièvre accroupi sous une épinette.</p>
<p class="p0 ri"><strong class="runin">L’encoche.</strong> Coupée ou limée en travers au bout arrière, <strong>jamais fendue</strong> : une fente s’ouvre sous la corde et remonte le fût.</p>
<p class="p0 ri"><strong class="runin">L’empennage.</strong> Trois plumes : queue de gélinotte ou de tétras (<span class="ref">ch. 49</span> <span class="ref">§9</span>), de lagopède des saules (<em>Lagopus lagopus</em>), rémiges d’outarde fendues. Toujours d’un oiseau pris et plumé comme aux <span class="ref">ch. 49</span> et 54, jamais d’un oiseau trouvé mort sur la grève ou dans le bois : ses plumes portent ce qui l’a tué, et elles passent par les doigts (<span class="ref">ch. 49</span>, <span class="ref">§8</span> bloc 2). Fendre le tuyau en long, garder la moitié qui porte la barbe, laisser un bout de tuyau nu à chaque extrémité. Poser les trois plumes à égale distance autour du fût, près de l’encoche, ligaturer les bouts de tuyau au tendon mouillé, et enduire la ligature de poix (<span class="ref">ch. 94</span> §F) — la poix d’hiver porte plus de gras, sinon elle casse au froid (<span class="ref">ch. 94</span> <span class="ref">§9</span>). La plume dirige la flèche : une flèche sans plume vole encore, mais moins droit.</p>
<p class="p0 ri"><strong class="runin">Le tir.</strong> À quoi on tire la flèche mousse, et comment on s’approche, est au <span class="ref">ch. 47</span> (<span class="ref">§9</span>). Deux choses tiennent à la flèche elle-même : on vise la tête ou le cou, et on tire devant un talus ou un tronc, parce qu’une flèche qui manque s’enfonce sous la neige et se perd.</p>
<h3 class="sub">La pointe large, pour plus gros que le petit gibier</h3>
<p class="p0 ri"><strong class="runin">Ce qu’elle fait.</strong> Une flèche ne renverse pas une grosse bête : elle la tue en coupant, par le sang qui sort des vaisseaux tranchés. Une lame affûtée tranche la paroi élastique d’un vaisseau ; émoussée, elle la coupe mal, et la bête saigne moins. Une pointe ronde, conique ou en aiguille — le clou laissé rond, l’éclat d’os — entre moins loin dans la chair qu’une lame et coupe moins. Chez l’orignal, le poil épais et le cuir boivent le sang et referment la plaie : il faut que la flèche ressorte de l’autre côté, une entrée et une sortie. Dans le Nord, quand l’arc servait encore, la pointe du gros gibier était déjà de fer : lame de fer sur un avant-fût de panache, feuille de fer-blanc, gros clou battu en ciseau pour le gros gibier à courte distance, lime battue enfoncée au bout du fût et ligaturée au tendon.</p>
<p class="p0 ri"><strong class="runin">La tôle d’acier.</strong> Des trois pointes — tôle, clou, os —, c’est la meilleure : le métal fait la meilleure lame de fortune. La pointe large que les chasseurs à l’arc du début du siècle dernier taillaient eux-mêmes pour le gros gibier mesurait <strong>7,6 cm de long, 3,2 cm de large, un peu moins de 0,8 mm d’épais</strong>, et pesait <strong>14 g</strong>. Une lame de ressort recuite puis retrempée (<span class="ref">ch. 107</span>) garde son fil ; l’acier doux coupe aussi bien, mais ne le tient pas, et il se relime à chaque sortie.</p>
<p class="p0 ri"><strong class="runin">Découper.</strong> Le ressort recuit (<span class="ref">ch. 107</span>) se raye en diagonale à la scie à métaux et se casse en triangles à l’étau. Sans scie : choisir le morceau de tôle qui a déjà à peu près la forme, et l’user sur une pierre rugueuse ; une tôle assez molle se bat à froid pour faire le tranchant, sur une enclume de fortune, avec un marteau plus dur qu’elle.</p>
<p class="p0 ri"><strong class="runin">La soie.</strong> À la base du triangle, deux entailles en biais au ciseau à froid laissent deux ailettes et, entre elles, une soie d’environ <strong>2,5 cm sur 1 cm</strong>. Deux petites encoches limées au bas des ailettes recevront le tendon.</p>
<p class="p0 ri"><strong class="runin">Affûter à la lime, dès la pointe.</strong> Une lame qui coupe dès qu’elle touche est celle qui entre le mieux quand l’arc est faible, et le fil rude de la lime coupe mieux la viande que le fil poli à la pierre. L’essai : un élastique tendu sur une petite ouverture ; la pointe qui le coupe sans effort est prête. Elle se reprend avant chaque sortie.</p>
<p class="p0 ri"><strong class="runin">Poser.</strong> Au bout du fût, une entaille <strong>sciée ou limée, jamais fendue au couteau</strong> — une fente remonte le fût —, <strong>dans le plan de l’encoche</strong>, aussi profonde que la soie est longue. Amincir le bout du fût en biseau jusqu’aux faces de la lame. La soie entre à la poix chaude (<span class="ref">ch. 94</span> §F), et le tendon mouillé serre le bout du fût sur toute la longueur de l’entaille, croisé dans les encoches des ailettes, tour sur tour : c’est la ligature qui tient le bois fermé sur la soie. Le tendon colle et durcit en séchant, sans nœud.</p>
<p class="p0 ri"><strong class="runin">La longueur.</strong> Le fût se mesure sans la pointe : à pleine allonge, son bout dépasse encore la main d’au moins 2,5 cm (« Égaliser les deux bras »), et la lame reste devant.</p>
<p class="p0 ri"><strong class="runin">L’équilibre.</strong> La flèche finie, pointe et plumes posées, se pose en travers d’un doigt. Elle vole droit quand elle s’y tient en équilibre <strong>à 10 à 16 % de sa longueur en avant du milieu</strong> : de 6 à 10 cm sur une flèche de 61 cm, de 8 à 12 cm sur une de 76 cm. Le poids de métal au bout sert : une flèche trop légère pour l’arc fait l’effet d’un tir à vide (<span class="ref">§8</span>, bloc 6).</p>
<p class="p0 ri"><strong class="runin">Le clou.</strong> Un gros clou, tête coupée, battu à froid sur l’enclume jusqu’à faire un ciseau ou une petite lame, puis limé tranchant. Laissé rond, il perce sans couper. Le bout du fût se ligature, puis se perce au diamètre du clou. Sans vilebrequin : un éclat d’os pointu planté debout, et le fût roulé entre les paumes dessus, la ligature gardant le bois entier. Le clou y entre à la poix. C’est la pointe du gros gibier <strong>à courte distance</strong>, et celle qu’on garde au carquois pendant la tournée de lagopède, pour le loup que la flèche mousse ne tuerait pas.</p>
<p class="p0 ri"><strong class="runin">L’os.</strong> Un os long de patte posé sur une pierre et cassé d’un coup de pierre ; parmi les éclats, en garder un qui a déjà sa pointe, et l’user sur une pierre rugueuse. Il se pose comme la tôle. L’os perce, il ne coupe pas : il ne tient pas de fil, il s’écaille ou casse. Sur une grosse bête, c’est la dernière des trois.</p>
<p class="p0 lab kh"><strong class="runin">Ce que la pointe ne fait pas.</strong></p>
<p class="li"><strong>Elle ne fait pas l’arc.</strong> Là où l’orignal est le gros gibier courant, on demande à l’arc <strong>22,7 kg</strong>. Ceux qui l’ont pris à l’arc tiraient des arcs de <strong>23 à 36 kg</strong>, faits par des facteurs d’arc, avec une lame d’acier de ressort. Un arc de bille de mélèze n’a jamais été mesuré à ces forces : la chaudière dit s’il y arrive (« Mesurer l’arc »), et même s’il y arrive, aucun de ces chiffres ne s’appuie sur une mesure de pénétration publiée. Un arc de fortune ne garantit rien.</p>
<p class="li"><strong>Un seul tir vaut d’être tiré.</strong> La bête de travers, la patte avant portée en avant — sinon l’omoplate arrête la flèche —, le point juste derrière la patte, au tiers inférieur de la poitrine. Jamais de face, ni de trois quarts vers soi, ni de derrière : l’os de l’épaule devant, la masse de l’arrière-train derrière arrêtent la flèche avant ce qui tue. Et de près : avec un arc de magasin, un chasseur ordinaire ne tire pas au-delà de 27 m ; avec un arc de bille, pas plus loin que la distance où l’on renverse un lagopède à coup sûr (« Ce qu’on perd »).</p>
<p class="li"><strong>Elle tue par où elle passe.</strong> Une flèche au flanc a laissé un orignal trotter bien plus de 90 m avant qu’il se couche ; une flèche qui a traversé la poitrine de part en part en a tué un autre presque sur-le-champ. La bête touchée qu’on n’effraie pas meurt plus près d’où elle a été touchée : on attend, on n’approche pas (<span class="ref">ch. 61</span>, étape 2), et l’arc ne donne pas de coup de grâce.</p>
<h3 class="sub">Le lance-pierre, la fronde et le bâton</h3>
<p class="p0 ri"><strong class="runin">Le lance-pierre.</strong> Une fourche de bois dur — bouleau, érable rouge (<em>Acer rubrum</em>) — coupée avec un peu de tronc pour le manche, des branches grosses comme le pouce, séchée comme la bille d’arc. Deux bandes d’élastique égales et une pochette de cuir grande comme la paume, percée aux deux bouts. <strong>Deux attaches, deux façons de faire.</strong> La bande et la pochette forment un ensemble, ligaturé d’avance au tendon mouillé, au chaud, et laissé sécher : le tendon ne tient qu’une fois sec, et dehors, par grand froid, il gèle au lieu de sécher. L’attache à la fourche, elle, se fait et se défait <strong>à froid, à mains gantées</strong> : une gorge taillée au bout de chaque branche, la bande repliée en boucle dans la gorge et serrée d’un tour de cordelette sèche, ou passée dans un trou percé en haut de la branche. Une bande qui glisse de son attache en pleine tension envoie la pochette dans l’œil (<span class="ref">§8</span>, bloc 6) : l’attache s’essaie à bout de bras, de côté, avant le premier tir. <strong>L’essai de la bande</strong> : l’étirer à bout de bras et la lâcher. Une bonne bande claque et revient d’un coup ; une mauvaise revient lentement, comme de la pâte. La plupart des chambres à air sont en butyl, un caoutchouc choisi pour garder l’air et qui rebondit peu ; le tube de latex, du caoutchouc naturel, rebondit bien mieux : l’essai tranche. <strong>Les bandes, avec leur pochette, voyagent dans une poche intérieure</strong>, pas sur la fourche au froid, et se montent au moment de tirer. Les munitions : des galets ronds du ruisseau, tous de la même grosseur, parce qu’une pierre ronde vole plus droit qu’une pierre plate ; les billes d’un roulement mort, quand il y en a. <strong>Ce qu’on perd</strong> : la portée et la certitude. Une pierre assomme ; sur le corps d’un oiseau, elle ne tue pas toujours. C’est l’arme du tétras perché et de l’écureuil sur la branche (<span class="ref">ch. 47</span> <span class="ref">§9</span>).</p>
<p class="p0 ri"><strong class="runin">La fronde.</strong> Deux cordes d’environ <strong>60 cm</strong>, une pochette de cuir ou de toile grande comme la paume entre les deux, une pierre dedans. Une corde enroulée au majeur et tenue dans la paume, l’autre pincée entre le pouce et l’index ; on fait tourner, on lâche celle du pouce. Rien à acheter, rien qui fige au froid, et beaucoup de pratique avant que la pierre aille où on veut. La pierre part droit devant elle à l’instant où la corde est lâchée, en ligne avec le cercle qu’elle décrivait : lâchée un peu tôt ou un peu tard, elle part de côté, ou derrière le lanceur. Pendant l’apprentissage, la pierre peut partir n’importe où autour du cercle : personne sur les côtés ni derrière.</p>
<p class="p0 ri"><strong class="runin">Le bâton de jet.</strong> Un bâton de bois franc lourd, long comme le bras du bout des doigts à l’épaule, à bout mousse, naturellement coudé et <strong>aplati sur deux faces comme un boomerang</strong> : il vole à plat et touche plus souvent. Comment on le lance, et sur quoi, est au <span class="ref">ch. 47</span> (<span class="ref">§9</span>).</p>
<h3 class="sub">Entretenir avec rien</h3>
<p class="p0 ri"><strong class="runin">L’eau bouillante remplace le nettoyant.</strong> Verrou sorti, crosse démontée si elle se démonte, sinon emmaillotée d’un linge, arme tenue bouche en bas, eau bouillante savonneuse versée par la chambre, puis de l’eau bouillante claire. L’acier chaud sèche vite ; on passe des chiffons secs tant qu’il est chaud, et un chiffon gras tout de suite après, l’été. C’est aussi ce qui enlève les sels d’une amorce corrosive.</p>
<p class="p0 ri"><strong class="runin">Le cordon et la baguette, pour nettoyer seulement.</strong> Le cordon est une ficelle, un plomb de pêche fendu et une boucle (<span class="ref">§4</span>). La baguette est une baguette de bouleau ou d’épinette refendue, plus mince que l’âme, poncée droite, le bout arrondi ; le bouleau, qui encaisse sec bien plus de travail que l’épinette noire avant de casser, vaut mieux. Le bois n’use pas les rayures ; ce qui les use, c’est de frotter la bouche. Ni l’un ni l’autre ne pousse une balle coincée : c’est le travail de la tige de métal (<span class="ref">§4</span>, étape 37).</p>
<p class="p0 ri"><strong class="runin">L’huile.</strong> L’huile à moteur dépanne, l’été, en film mince. L’hiver, sur ce qui bouge : rien. Pour l’acier du dehors et pour le rangement, <strong>la moelle des os du bas de la patte</strong> — canons et phalanges — donne un gras plus mou au froid que celle du fémur : chez tous les cervidés où on l’a mesuré, du caribou au chevreuil, le gras des extrémités est fait pour rester souple au froid. Le fondre et le filtrer comme au <span class="ref">ch. 72</span>, en garder un petit pot. Un gras animal rancit à l’air (<span class="ref">ch. 72</span>) : il se renouvelle à chaque nettoyage, il ne se laisse pas des mois. <strong>Jamais de gras salé</strong> — bacon, lard salé, graisse de salaison : le sel et l’humidité, c’est la rouille.</p>
<p class="p0 ri"><strong class="runin">Régler sans rien.</strong> Une cible d’écorce prise sur une bûche de chauffage ou un bouleau abattu, avec un point de charbon, un sac à dos plein de sable sous le fût, la visée à travers le canon de l’étape 28 sur une carabine à verrou. Sur une hausse et un guidon qui ne se règlent plus : une arme qui tire trop bas, hausse au plus haut, se corrige en <strong>limant le haut du guidon</strong>, un rien à la fois, parce qu’un guidon plus bas oblige à relever le canon pour viser (<span class="ref">§3</span>). Une arme qui tire trop haut, hausse au plus bas, demande un guidon plus haut : une goutte de <strong>soudure à l’étain</strong> sur le guidon, reprise à la lime (<span class="ref">ch. 103</span>). Jamais de brasure : sa chaleur peut enlever la trempe du bout du canon.</p>
<h3 class="sub">Ce qui ne se remplace pas</h3>
<p class="li"><strong>L’amorce et la poudre.</strong> Elles ne se fabriquent pas au chalet. La douille, elle, se garde : c’est la seule partie de la cartouche qui resserve, pour qui a stocké d’avance les amorces, la poudre et les données de charge <strong>de cette poudre-là</strong>. On ne récupère jamais la poudre de vieilles cartouches pour s’en servir ailleurs. Deux choses tuent dans ce stock-là, et aucune ne se voit. <strong>Des amorces en vrac qui se touchent partent toutes ensemble</strong> quand une seule part : elles restent dans leurs plateaux d’origine, jamais versées dans un pot. <strong>Une poudre qui prend feu dans un contenant solide et fermé le fait éclater comme une explosion</strong> : elle reste dans son contenant d’origine, fait pour s’ouvrir sous une faible pression. Ni les unes ni l’autre ne vont dans un pot de verre vissé, une chaudière à joint ou la caisse des cartouches, et elles ne se gardent pas ensemble.</p>
<p class="li"><strong>La cartouche de l’orignal, de l’ours et du phoque.</strong> L’arc de bille prend le petit gibier et libère des balles ; il ne remplace pas la balle.</p>
<p class="li"><strong>L’oiseau en vol.</strong> Ni l’arc, ni la fronde, ni le lance-pierre ne prennent un canard qui passe (<span class="ref">ch. 54</span> <span class="ref">§9</span>).</p>
<p class="li"><strong>La pratique.</strong> Un arc se refait ; l’œil et la main qui le tirent juste ne se refont pas en un hiver de disette. C’est l’hiver d’avant qu’on apprend.</p>
</template>
<template id="notes">
<p class="fn" data-fn="45-1"><span class="fnn">1</span>Le renflement est un anneau où le canon a gonflé sous le choc de la balle contre l’obstacle. Il se voit parfois dehors, comme un anneau autour du canon. Sinon, l’âme bien propre, regardée par la chambre contre une lumière vive, y montre une ombre en anneau — une tache de graisse fait la même ombre, d’où l’âme propre — et les doigts passés doucement le long du canon le sentent comme une bosse. Deux balles restées dans l’âme : on présume le canon renflé. Un canon renflé ne s’arrange pas en tirant.</p>

    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
