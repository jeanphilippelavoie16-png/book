<template id="story-e">
<p class="p0">Le premier printemps. Pas de fumier, pas de compost mûr, pas de balance, une trouée de mousse sur du sable gris, et une saison déjà entamée. La règle qui gouverne toute cette section tient en une phrase : <strong>un engrais rare ne s’étend pas, il se met au trou.</strong> On ne fait pas la terre d’un champ la première année ; on fait la terre d’une centaine de trous.</p>
<p class="p0 ri"><strong class="runin">Les poquets.</strong> Au lieu de bêcher 100 m², on creuse des trous à l’espacement de plantation : un coup de bêche de profond, la mousse gardée de côté. Chaque trou reçoit la meilleure terre qu’on trouve — la couche noire ramassée sous les aulnes, les bouleaux et les trembles, là où les feuilles pourrissent depuis longtemps —, une poignée de varech rincé et haché, un peu de cendre d’os et de cendre de poêle froide prise à la cuillère, mêlées à la terre du trou et jamais posées contre la racine. Pas de cendre dans le trou d’une pomme de terre (étape 16). On plante dedans. Entre les trous, la mousse reste : c’est déjà un paillis. L’urine va au pied des plants, pas entre les rangs. <strong>Ce qu’on perd :</strong> la surface ; un poquet nourrit un plant, pas une planche. <strong>Ce qu’on gagne :</strong> tout ce qu’on avait va là où poussent les racines, et la terre des poquets de cette année devient la planche de l’an prochain.</p>
<p class="p0 ri"><strong class="runin">Le billon de varech, comme à Terre-Neuve.</strong> C’est la méthode des ports de pêche de Terre-Neuve, même climat, même grève, venue d’Irlande et d’Écosse : des planches qu’on ne laboure pas, couvertes à la bêche avec la terre des rigoles creusées de chaque côté.</p>
<p class="step"><span class="sn">1</span>Tracer une planche de la largeur qu’on atteint des deux bords, environ 1,2 m, sur le sol <strong>non retourné</strong> : mousse, herbe ou gazon.</p>
<p class="step"><span class="sn">2</span>Poser les pommes de terre de semence en rangs sur la surface.</p>
<p class="step"><span class="sn">3</span>Les couvrir d’une couche épaisse de varech rincé — et de fumier composté, s’il y en a : un fumier cru sous des pommes de terre de la même saison nourrit la gale et ne tient pas son délai (étape 20).</p>
<p class="step"><span class="sn">4</span>De chaque côté, creuser une rigole à la bêche. Les mottes qu’on en tire se posent à l’envers sur le varech, la mousse ou l’herbe en dessous, la terre au-dessus.</p>
<p class="step"><span class="sn">5</span>Butter à mesure que les tiges montent, avec la terre des rigoles, pour que pas un tubercule ne voie la lumière (<span class="ref">ch. 95</span>, étape 13).</p>
<p>Pourquoi ça marche : la mousse ou le gazon retourné pourrit en dessous, le varech nourrit, la planche surélevée se réchauffe et s’égoutte, et les rigoles drainent. L’année suivante, la planche se bêche normalement : les billons sont devenus le champ. <strong>Ce qu’on perd :</strong> on ne sait pas ce que la méthode rend ici, elle n’a jamais été mesurée sur la Côte-Nord ; et dans un sable grossier, le billon sèche — là, on plante à plat sous une épaisse couche de varech, et on arrose.</p>
<p class="p0 ri"><strong class="runin">Le capelan, non.</strong> C’est l’engrais le plus riche qu’on puisse ramasser sans rien, et c’est la tentation de la première année. Au chalet, il ne va ni au jardin ni au tas (étape 22, <span class="ref">§8</span> point 2) : le premier signe que l’ours l’a trouvé arrive après qu’il a mangé, et un ours récompensé revient, sans reprendre sa crainte. Le varech de la même grève fait le travail plus lentement, sans l’appeler.</p>
<p class="p0 ri"><strong class="runin">L’urine chaque jour.</strong> C’est le seul azote qui ne demande ni saison ni récolte préalable. Un pot réservé à l’urine seule, vidé chaque jour au pied des choux et des pommes de terre, enfoui d’un coup de binette, à raison d’une journée d’une personne par mètre carré pour la saison, jamais sur les feuilles, et plus rien le dernier mois avant la récolte. <strong>Ce qu’on perd :</strong> rien, tant que le pot ne reçoit que l’urine de la famille (étape 24).</p>
<p class="p0 ri"><strong class="runin">Les pois du garde-manger et les nodules du bord du chemin.</strong> Les pois entiers de la soupe lèvent s’ils ne sont ni fendus ni décortiqués (<span class="ref">ch. 100</span> <span class="ref">§9</span> : test de 20 graines d’abord). Semés tôt, comme tout pois, roulés dans l’eau où on a écrasé les nodules roses d’une vesce sauvage, ils nodulent quand la terre passe 10 °C. Mais il faut choisir, planche par planche. Un pois qu’on laisse mûrir met son azote dans sa graine, et la graine part à la cuisine : les fanes enfouies après la récolte en rendent peu. Une récolte d’environ 220 g de pois secs au mètre carré laisse environ 340 g de fanes et 3,4 g d’azote, dont la moitié sert l’année suivante : le dixième de ce que demandent des pommes de terre de garde. Le pois enfoui en fleur, sans récolte, donne l’azote du tableau de l’étape 26 à la planche suivante. La première année, on mange les pois ; la planche qu’on veut nourrir pour la deuxième reçoit des pois qu’on ne récoltera pas.</p>
<p class="p0 ri"><strong class="runin">L’avoine, le sarrasin et la pomme de terre, comme les colons.</strong> Sur la terre neuve, les colons semaient d’abord le sarrasin, l’avoine et la pomme de terre ; quoi semer d’autre la première année, et en quelle quantité, est au <span class="ref">ch. 98</span> <span class="ref">§9</span>. Le sarrasin est fait pour les sols pauvres et étouffe ce qui pousse autour ; fauché en fleur, cinq à six semaines après le semis, il s’enfouit et prépare la planche. L’avoine couvre et meurt l’hiver. La pomme de terre nettoie la terre derrière elle, et une terre neuve et acide lui évite la gale, qui ne s’installe qu’au-dessus d’un pH de 5,2 : pour elle, l’acidité du podzol est un avantage, <strong>tant que la terre n’a reçu ni cendre ni coquille</strong>. Le premier chaulage le lui retire.</p>
<p class="p0 ri"><strong class="runin">Faire la cendre qu’on n’a pas.</strong> Si le poêle ne donne pas assez de cendre, l’abattis en donne, à condition de le brûler sur la terre minérale, hors des jours secs (étape 10 ; <span class="ref">§8</span>, point 3). Mais seule la cendre d’un feu de bois non traité va au jardin : pas de bois de démolition d’origine inconnue, même quand la cendre manque (étape 16). Les os de la saison, bouillis pour leur graisse (<span class="ref">ch. 72</span>), puis brûlés blancs dans le poêle, donnent la cendre d’os, sauf ceux du trajet de la balle (étape 23). Les coquilles vides se ramassent sur l’estran à marée basse — jamais les restes d’une cueillette : les bivalves de la grève ne se mangent pas (<span class="ref">ch. 41</span> <span class="ref">§8</span> point 7) —, se brossent, se sèchent sur le rebord du poêle, et s’écrasent entre deux pierres un soir d’hiver.</p>
<p class="p0 lab kh"><strong class="runin">Mesurer sans instrument.</strong></p>
<p class="li">Le pH : les trois lectures du <span class="ref">ch. 95</span> <span class="ref">§9</span> (ce qui pousse, vinaigre et bicarbonate, eau de chou rouge et ses deux témoins). Elles donnent un rang, pas une valeur (étape 18).</p>
<p class="li">La texture : le ruban dans la main, et le bocal (étapes 3 et 4) ; à défaut de savon en poudre, un peu de savon ordinaire, en sachant que la mousse gêne la lecture.</p>
<p class="li">La vie du sol : les vers, comparés à la bordure le même jour (étape 6) ; les nodules roses (étape 27).</p>
<p class="li"><strong>Le poids : une balance à fléau.</strong> Un bâton droit pendu <strong>par son milieu</strong> à une ficelle, et jamais ailleurs : pendu hors du milieu, le poids du bâton lui-même fausse la pesée. Une encoche de chaque côté, à la même distance du milieu : d’un côté pend une bouteille de plastique vide, de l’autre le sac vide. S’ils ne s’équilibrent pas à vide, on ajoute un caillou au côté léger, au même crochet : c’est la tare. Puis on remplit la bouteille d’un litre d’eau (1 kg), ou au quart pour 250 g, et on remplit le sac de coquille broyée jusqu’à l’équilibre. Pas de bouteille de verre : elle pèse lourd même vide, et une tare oubliée fausse tout. Une fois la mesure faite, on marque au couteau le niveau dans le contenant qui servira toujours, et on ne pèse plus jamais.</p>
<p class="p0 lab kh"><strong class="runin">Les outils qu’on fait.</strong></p>
<p class="li"><strong>La traîne à roches</strong> : deux patins de bois franc, des planches clouées en travers, le devant relevé pour qu’elle ne pique pas ; tirée à la corde, au VTT ou à la motoneige, comme on tirait le varech.</p>
<p class="li"><strong>La charrue à rigoles</strong> : deux planches clouées en V, pointe en avant, lestées d’une roche ; tirée à la corde, elle ouvre la rigole qui vide le champ à la fonte.</p>
<p class="li"><strong>Le levier à racines</strong> : un merisier de la grosseur du bras, la pointe durcie au feu.</p>
<p class="li"><strong>Le vindas</strong> pour les souches qui ne cèdent pas au levier, toujours avec son cliquet (<span class="ref">ch. 109</span> <span class="ref">§9</span> ; <span class="ref">§8</span>, point 4).</p>
<p class="li"><strong>La fourche à varech</strong> : n’importe quelle fourche ; à défaut, une branche fourchue en trois, les dents durcies au feu. Le varech mouillé est lourd : on le laisse égoutter sur la grève avant de le charger.</p>
<p class="li"><strong>Le pilon à coquilles</strong> : une bûche de bois franc dans une chaudière de métal, ou deux pierres plates.</p>
<p class="p0 lab kh"><strong class="runin">Ce que la variante ne remplace jamais.</strong></p>
<p class="li"><strong>Le temps.</strong> Un podzol ne devient pas une terre de jardin en une saison. La première année nourrit la plante ; c’est la deuxième et la troisième qui nourrissent le sol.</p>
<p class="li"><strong>La rotation contre la hernie.</strong> Aucune astuce ne raccourcit la vie de spores qui tiennent plus de 18 ans. Une planche de choux atteinte est perdue pour les choux pendant sept ans.</p>
<p class="li"><strong>Les excréments humains et ceux du chien.</strong> Aucune pénurie ne les fait entrer au jardin, ni une urine qui les a touchés.</p>
<p class="li"><strong>Le poisson cru et les os crus hors du jardin du chalet.</strong> Aucune pénurie d’azote ne vaut un ours habitué à quelques pas de la porte (<span class="ref">§8</span>, point 2).</p>
<p class="li"><strong>La cendre du bois traité hors du jardin</strong>, même quand la cendre manque (étape 16).</p>

<p class="fn" data-fn="68-1"><span class="fnn">1</span>La fleur blanche, mince et sèche des saucissons et des jambons secs : une moisissure normale sur ces produits. Toute autre moisissure — noire, verte, duveteuse — n’en est pas, ni une surface visqueuse.</p>
<p class="fn" data-fn="96-1"><span class="fnn">1</span>La couche pâle a la couleur de la cendre ou du sable délavé ; elle peut manquer. La couche du dessous est franchement plus rouge que tout le reste, avec une limite nette ; frottée mouillée entre les doigts, elle a un toucher un peu limoneux. Plus bas, la couleur tourne au jaune.</p>
<p class="fn" data-fn="96-2"><span class="fnn">2</span>La pâte est poussée vers le haut par le pouce, au-dessus de l’index, en une bande d’épaisseur égale, jusqu’à ce qu’elle casse sous son propre poids. On mesure ce qui dépassait avant la cassure. Ensuite, une pincée détrempée frottée dans la paume : si elle gratte, il y a du sable.</p>
<p class="fn" data-fn="96-3"><span class="fnn">3</span>Une graminée dont les racines blanches courent sous terre, à l’horizontale, en longs cordons articulés. Chaque morceau coupé par la bêche redonne un plant.</p>
<p class="fn" data-fn="96-4"><span class="fnn">4</span>Un piquet de métal ou une tige de fer enfoncé au cœur du tas et laissé une heure : il ressort chaud à la main quand le tas travaille, froid quand il dort. La main à plat dans le tas ouvert dit la même chose. Ni l’un ni l’autre ne dit si le tas a atteint 55 °C : pour ça, la sonde (étape 20).</p>
<p class="fn" data-fn="96-5"><span class="fnn">5</span>Une plante grimpante qui s’accroche aux autres par des vrilles au bout de ses feuilles ; chaque feuille porte huit à douze paires de petites folioles. Les fleurs, bleu violacé, en épis serrés, sont toutes tournées du même côté de la tige. Elle pousse en tapis dans les fossés, les bords de chemin et les vieux champs.</p>
<p class="fn" data-fn="96-6"><span class="fnn">6</span>Chez le pois et la vesce, les nodules sont de petits renflements allongés en doigt, souvent ramifiés, collés aux racines — pas des grains de terre : ils ne se détachent pas en rinçant. On les coupe au couteau.</p>
<p class="fn" data-fn="96-7"><span class="fnn">7</span>Des renflements blancs sur les racines, qui grossissent vite, puis noircissent et pourrissent. On arrache le plant qui flétrit à midi et on regarde : une racine saine est fine et ramifiée. Ne pas confondre avec les nodules d’un pois, beaucoup plus petits, allongés en doigt, et qui ne poussent que sur les légumineuses.</p>
<p class="fn" data-fn="96-8"><span class="fnn">8</span>Le ver fil de fer est la larve d’un petit coléoptère, le taupin : un ver allongé et dur au toucher, qui ressemble à un ver de farine, avec trois paires de pattes courtes à l’avant. Le ver blanc est une larve grasse, blanche ou jaune pâle, recourbée en C. On les trouve en retournant la terre autour d’un légume rongé.</p>
</template>

  let z=noteZone(f, calls.length>0);
  if(!z) return;
  if(!calls.length){ z.remove(); return; }
  for(let it=0; it<4; it++){
    const want=calls.map(c=>c.dataset.fn+'|'+sideOf(c,f,z)).join(' ');
    const cur=Array.from(z.querySelectorAll('p.fn')).map(n=>n.dataset.fn+'|'+n.parentNode.dataset.side).join(' ');
    if(want===cur) break;
    z.querySelectorAll('.fnc').forEach(c=>c.textContent='');
    want.split(' ').forEach(w=>{ const [id,sd]=w.split('|'); z.querySelector('.fnc[data-side="'+sd+'"]').appendChild(NOTES[id].cloneNode(true)); });
    z.classList.add('on');
  }
}

/* =====================================================================
   Moteur de chapitre (build_chapitre.py). Les fonctions au-dessus
   (OVER, splitPara, splitTable, noteZone, syncNotes) sont celles de
   interieur.tpl.html, recopiées à la construction. Ici : les pages se
   créent à la volée, trois histoires se suivent (texte courant, encadré
   danger, variante d'urgence), les planches pleine page prennent la page
   qui suit leur mention, les demi-planches et les photos flottent au
   premier endroit où elles tiennent, jamais au milieu d'un paragraphe.
   ===================================================================== */
const C = JSON.parse(document.getElementById('meta').textContent);
const BOOK = document.getElementById('book');
const WARN = [];
const PAGES = [];
let P = null;                 // page courante
let pendingPlates = [];       // planches pleine page qui attendent la fin de la page courante
const DSVG = '<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#fff"/><path d="M15.2 10 H18.8 L18.1 20.5 H15.9 Z" fill="#9B2C1E"/><rect x="15.4" y="22.3" width="3.2" height="3.2" fill="#9B2C1E"/></svg>';
const PT = 96/72;

function mkPage(kind, plate){
  const n = PAGES.length + 1, side = n % 2 ? 'recto' : 'verso';
  const el = document.createElement('section'); el.className = 'page ' + side; el.id = 'p' + C.num + '-' + n;
  if(kind !== 'open') el.innerHTML = '<div class="rh"><div class="grp"><span class="fo">' + C.num + '-' + n + '</span><span class="ch">' + C.num + ' · ' + C.title + '</span></div><span class="to">' + C.tome + '</span></div>';
  const bl = document.createElement('div'); bl.className = 'block'; el.appendChild(bl);
  if(kind === 'open') bl.innerHTML = document.getElementById('open').innerHTML;
  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
