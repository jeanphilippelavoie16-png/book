<p class="p0">Plus de trousse, plus de chaudron, plus de rivet, et, au bout, plus de canot. Il reste l’épinette, le feu, les jeunes arbres et la bête.</p>
<h3 class="sub">Réparer sans chaudron</h3>
<p class="li"><strong>La gomme mâchée.</strong> Les grains et les écailles durs d’une épinette tombée ne fondent pas bien sur un petit feu. Les mâcher longtemps, jusqu’à ce qu’ils ramollissent, les étendre sur la couture ou sur le bord de la pièce, puis <strong>les lisser au tison</strong> — un bout de bois rougi. Sans le tison, elle colle mal. C’est une réparation d’urgence : elle tient moins bien que la gomme cuite, et on la refait au premier feu sérieux.</p>
<p class="li"><strong>La gomme de sapin.</strong> Sans épinette, la gomme des vésicules du sapin baumier (<span class="ref">ch. 94</span>, étape 32) dépanne : une grande déchirure de canot de toile a déjà été ramenée jusqu’au bout du voyage à la gomme de sapin et à l’écorce de bouleau. On la reprend à la gomme d’épinette dès qu’on en trouve.</p>
<p class="li"><strong>La pièce collée à froid.</strong> Une pièce d’écorce bordée de gomme crue et pressée sur la déchirure tient par le seul collant de la gomme, le temps d’une courte distance. C’est ce qui ramène à la grève où l’on fera le feu.</p>
<p class="li"><strong>Boucher un grand trou.</strong> Tasser dans l’ouverture de l’herbe, des copeaux, de la mousse ou de l’écorce interne mêlés de gomme — ou même de glaise — puis couvrir de gomme ou de suif. C’est ainsi qu’on fermait les grandes ouvertures des canots faits à la hâte. Sur une déchirure d’accident, sous la poussée de l’eau, c’est une transposition : le bourrage tient au-dessus de la ligne d’eau, ou le temps de gagner la grève, et se reprend au premier feu.</p>
<p class="li"><strong>Le suif seul.</strong> Sans gomme, une couture se passe au suif chaud. Il étanche moins longtemps et se refait souvent, mais il ferme.</p>
<h3 class="sub">Fondre la gomme sans chaudron</h3>
<p class="li"><strong>Dans l’eau qui bout.</strong> Faire bouillir de l’eau dans un contenant d’écorce (<span class="ref">ch. 94</span> <span class="ref">§9</span> explique pourquoi l’écorce ne brûle pas tant qu’il y a du liquide contre elle), y jeter la gomme crue : elle fond et remonte, assez épaisse pour se cueillir à la cuillère d’écorce. Une gomme déjà cuite a perdu sa térébenthine, qui la rendait plus légère que l’eau : elle coule au fond au lieu de remonter, et une gomme très cuite n’y fond même plus, l’eau qui bout n’étant pas assez chaude. On y met la gomme crue. La saleté s’enlève avec une lanière d’écorce ou un bâton plat. Avantage réel : la gomme posée sur l’eau qui bout ne dépasse pas 100 °C et ne brûle pas au fond.</p>
<p class="li"><strong>Dans une auge et des pierres chaudes.</strong> La gomme fond sans grande chaleur. Pierres sèches, ramassées loin de l’eau et chauffées dans le feu avant qu’on s’en approche : une pierre de rivière éclate (<span class="ref">ch. 94</span> <span class="ref">§9</span>). Les pierres vont dans un fond d’eau, la gomme par-dessus. Une pierre qui rougit est bien plus chaude qu’il n’en faut pour que la vapeur de la gomme s’enflamme toute seule, sans flamme : plongée dans la gomme nue, elle y met le feu.</p>
<h3 class="sub">Remplacer une pièce de bois en route</h3>
<p class="li"><strong>La traverse</strong> : un jeune arbre, bouts amincis, enroulés et ligaturés (étape 21).</p>
<p class="li"><strong>La membrure</strong> : une latte de bois vert, fendue, amincie au couteau croche, pliée sur le genou. Le bois vert se plie sans eau chaude ; le bois sec fend. Au chalet, les plats-bords d’un canot neuf trempent une semaine avant d’être pliés.</p>
<p class="li"><strong>Le plat-bord</strong> : deux jeunes arbres mis bout à bout par le gros bout, chaque gros bout taillé à plat pour que les deux se recouvrent face contre face, et ligaturés dans de petites rainures qui empêchent la ligature de glisser. Pressé, on se contente de superposer les deux bouts et de les lier : la ligne du bord fait un cran, sans conséquence.</p>
<p class="li"><strong>La ligature</strong> : racine d’épinette fendue et trempée jusqu’à ce qu’elle se noue sans casser : elle tient mouillée (<span class="ref">ch. 103</span>, étape 22). La babiche posée mouillée serre en séchant (<span class="ref">ch. 103</span>, étape 31), mais redevient molle une fois remouillée : sur un canot, elle dépanne, et on la refait au sec.</p>
<h3 class="sub">Porter sans courroie ni joug</h3>
<p class="p0">Deux pagaies, espacées d’une trentaine de centimètres, se couchent dans le sens de la longueur par- dessus la traverse du centre et les deux traverses voisines. Une lanière de peau ou d’écorce interne d’aulne (<span class="ref">ch. 103</span>, étape 23) fait d’abord le tour des bouts de la traverse du centre, à l’extérieur des épaules, et ses bouts lient les pagaies en place. La lanière s’appuie contre un épaulement de la traverse, à quelques pouces (5 à 10 cm) du plat-bord : sans lui, elle glisse vers le milieu et les pagaies se desserrent. Sur une traverse qui n’en a pas, une encoche au couteau en fait un. On lève le canot : les manches des pagaies reposent sur les épaules, la traverse du centre tombe juste derrière la tête, et la boucle de la lanière passe sur le front pour empêcher le canot de glisser vers l’arrière.</p>
<p class="p0 ri"><strong class="runin">La courroie de front se taille dans une peau.</strong> La pièce du front : une bande de cuir épais (<span class="ref">ch. 102</span>), d’environ 10 cm sur 46 cm (4 × 18 po), amincie vers les bouts, assez raide pour ne pas rouler. Les deux courroies cousues à ses bouts : souples, de 5 à 6,4 cm de large (2 à 2 ½ po) et d’environ 3 m (10 pi), amincies vers le bout libre. Couture au point sellier (<span class="ref">ch. 104</span>, étape 7). De l’écorce de bouleau sous le front.</p>
<h3 class="sub">Le canot de peaux d’orignal</h3>
<p class="p0">C’est le canot de peaux d’orignal des Wolastoqiyik (Malécites), un canot du Sud, pas du Nord : le chasseur le faisait au printemps quand il sortait du bois trop tôt pour que l’écorce d’épinette décolle. Il gardait pour ça deux ou trois peaux tendues sur leur cadre. Des peaux fraîches de la chasse font la même chose ; des peaux sèches se trempent jusqu’à redevenir souples (<span class="ref">ch. 102</span> <span class="ref">§5-C</span>). La charpente se prépare l’hiver, dans les heures creuses ; sinon, elle se fait vite.</p>
<p class="p0 ri"><strong class="runin">Ce qu’il donne.</strong> Une coque d’environ <strong>3,8 m (12 ½ pi)</strong> de long, <strong>1 m (40 po)</strong> de large et <strong>36 à 48 cm (14 à 19 po)</strong> de creux. C’est la taille des peaux qui décide de la longueur.</p>
<p class="p0 ri"><strong class="runin">Ce qu’il faut.</strong> Deux ou trois peaux d’orignal, avec ou sans poil. Quatre jeunes arbres pour les plats-bords. Un pour la traverse du centre. De la babiche torse pour les traverses des bouts. Deux étraves d’environ <strong>90 cm (3 pi)</strong>, en jeunes arbres pliés au profil voulu — ou une seule quille de toute la longueur. Des jeunes arbres minces pour les membrures, pliés verts. D’autres pour le bordé, en perches d’environ les <strong>trois quarts</strong> de la longueur du canot. De la babiche, du suif et de la gomme accumulés d’avance. Des piquets et des pierres. Pour les essences, le choix des canots de toile d’ici se transpose : l’épinette pour les plats-bords et les traverses — peu de nœuds, très souple ; le sapin, plus léger, pour le fond et les membrures, taillées et pliées pendant qu’il est encore vert.</p>
<p class="step"><span class="sn">1</span><strong>Coudre les peaux ensemble, dans le sens de la longueur</strong>, en les recouvrant d’environ <strong>15 cm (6 po)</strong> ou un peu moins, avec <strong>deux rangs de points</strong> de babiche (<span class="ref">ch. 103</span>), au point sellier par exemple (<span class="ref">ch. 104</span>, étape 7). Si le poil reste, le gratter le long des bords cousus ; il ira à l’extérieur.</p>
<p class="step"><span class="sn">2</span><strong>Monter le cadre des plats-bords.</strong> Quatre jeunes arbres, deux par côté, joints par le gros bout au milieu (voir le plat-bord, plus haut). La traverse du centre : un jeune arbre, bouts amincis, enroulés autour des plats-bords et ligaturés sous la traverse. Les bouts des plats-bords se croisent et se lient. À la place des traverses des bouts, une corde de babiche torse d’un plat-bord à l’autre.</p>
<p class="step"><span class="sn">3</span><strong>Percer le dessous des plats-bords</strong> à intervalles, pour recevoir la tête des membrures.</p>
<p class="step"><span class="sn">4</span><strong>Préparer le lit.</strong> Un sol plat et lisse — ou le plancher de la cabane s’il est assez grand. Planter quelques piquets autour du contour des plats-bords pour le marquer, puis les arracher.</p>
<p class="step"><span class="sn">5</span><strong>Poser les peaux sur le lit, le cadre dessus, et le charger de pierres.</strong></p>
<p class="step"><span class="sn">6</span><strong>Laisser sécher jusqu’à ce que la peau raidisse.</strong> Le signe : les bords de la peau commencent à rouler.</p>
<p class="step"><span class="sn">7</span><strong>Relever les flancs.</strong> Soulever le cadre, le fixer aux piquets replantés dans leurs trous, relever les côtés de la peau, y tailler des pinces là où elle fait des plis. On peut relever un peu les bouts des plats-bords contre les piquets des bouts pour donner de la tonture ; plusieurs canots s’en passaient.</p>
<p class="step"><span class="sn">8</span><strong>Tailler la peau à la ligne des plats-bords et l’y lacer</strong> à la babiche. Coudre les pinces.</p>
<p class="step"><span class="sn">9</span><strong>Placer les étraves</strong>, leur tête liée dans la pointe que forment les bouts des plats-bords.</p>
<p class="step"><span class="sn">10</span><strong>Forcer les premières membrures</strong>, pliées, contre la peau raidie, leurs bouts entrés dans les trous du dessous des plats-bords, à peu près d’équerre avec la courbe du fond.</p>
<p class="step"><span class="sn">11</span><strong>Tailler la peau au profil des étraves et la coudre</strong>, les points passant à l’extérieur de l’étrave, avec un tour de temps en temps par-dessus pour tenir la charpente. Plus facile : poser les étraves à blanc, tailler la peau, les enlever pour coudre, les remettre et ajouter quelques points.</p>
<p class="step"><span class="sn">12</span><strong>Poser le bordé</strong> : les perches couchées à quelques pouces (5 à 10 cm) les unes des autres, leurs bouts glissés sous la membrure la plus proche du milieu, sur chaque étrave, tenues par quelques membrures provisoires le temps des ajustements.</p>
<p class="step"><span class="sn">13</span><strong>Forcer les membrures une à une</strong>, chacune pliée d’avance à la forme de la section. Si la peau résiste, la remouiller pour qu’elle s’étire.</p>
<p class="step"><span class="sn">14</span><strong>Passer les coutures à la gomme ou au suif.</strong> Mettre à l’eau.</p>
<p class="p0 ri"><strong class="runin">Le premier voyage porte le bagage, le long de la rive</strong> (<span class="ref">§8</span>). Après chaque traversée, sortir le canot, le laisser égoutter, et graisser la peau au suif quand elle sèche. Il sert le temps d’un voyage : c’est un canot de passage, qu’on défait à l’arrivée, et ses peaux vont au tannage.</p>
<h3 class="sub">La cuve d’une seule peau</h3>
<p class="p0">Une seule peau lacée sur un cerceau de jeunes arbres, des membrures croisées en grille au fond, fait une cuve ronde à fond plat qui garde le bagage au sec. Beaucoup étaient trop petites pour porter quelqu’un : on les chargeait et un nageur les remorquait. Ici, personne ne nage dans cette eau : l’adaptation, c’est de la remorquer au bout d’une corde, derrière le canot, et elle s’essaie vide, près de la rive, avant d’y mettre quoi que ce soit. Une cuve ronde se remorque mal, et pleine d’eau elle ne se remorque plus : on la largue. La ligne se tient à la main, ou se noue d’un nœud qui se largue d’un geste, le couteau à portée : au chavirement, une ligne attachée à la coque s’enroule autour d’un bras ou d’un enfant.</p>
<h3 class="sub">Le canot d’écorce d’épinette</h3>
<p class="p0">L’épinette est partout, et c’est d’elle qu’on faisait le plus souvent le canot d’urgence. Son écorce se lève sur une épinette qu’on abat (<span class="ref">ch. 106</span>), avec une entaille en long <strong>et</strong> des entailles en travers : elle ne se fend pas d’elle-même autour du tronc comme celle du bouleau. Elle ne se garde pas : on la gratte de sa surface rugueuse et on l’emploie tout de suite. Elle décolle quand l’arbre pousse, sève montée : hors de cette saison, elle peut tenir au bois plus de deux fois plus fort. Le chasseur malécite qui sortait du bois trop tôt au printemps faisait un canot de peaux, pas d’épinette.</p>
<p class="p0 ri"><strong class="runin">En une seule feuille pliée, pour passer.</strong> Son grain grossier, dans le sens du tronc, fend : on n’y taille pas de pinces. Le canot d’urgence des Maritimes prend donc <strong>une seule grande feuille</strong> et la <strong>plie</strong> le long des plats-bords, à deux endroits ou plus de chaque côté : les plis aplatissent le fond et relèvent les bouts. Chaque bout se pince entre deux lattes, avec une corde d’écorce, et le tout se lie à la racine. Les bouts s’étanchent à la gomme ou au suif ; les grandes ouvertures se bouchent à l’herbe, aux copeaux, à la mousse ou à l’écorce interne mêlées de gomme ou de glaise. Plats-bords en jeunes arbres joints par le gros bout, traverses à bouts amincis enroulés, membrures en jeunes arbres fendus. Fait vite, il sert à une traversée et s’abandonne.</p>
<p class="p0 ri"><strong class="runin">Cousu comme un canot de bouleau, pour durer.</strong> Au nord, les Naskapis faisaient avec l’écorce d’épinette, qui s’y lève en assez grandes feuilles, le même canot qu’avec le bouleau, par la même méthode (plus bas) : pas un canot de passage, un canot. Avec du soin, un canot d’écorce d’épinette vaut presque un canot de bouleau. Elle se coud comme lui, mais son grain en long fend sous une rangée de points alignés sur une même fibre : là où la couture suit le grain, on alterne points courts et points longs, ou on coud une latte dans la couture. On amincit les bords des pièces avant de coudre et de gommer, et on passe deux ou trois tours dans un même trou plutôt que de percer serré. Sans racine, la babiche coud l’écorce.</p>
<h3 class="sub">Le canot d’écorce de bouleau</h3>
<p class="p0">Le bouleau à papier donne le meilleur canot d’écorce. La Basse-Côte-Nord n’en avait pas qui convienne, et la meilleure se trouvait en arrière de la côte, loin de la mer (<span class="ref">§2</span>). L’écorce doit faire <strong>plus de 3,2 mm (1/8 po)</strong> d’épaisseur ; au-delà de <strong>6,4 mm (1/4 po)</strong>, elle est rare. Son épaisseur ne se devine pas à la taille de l’arbre, et deux bouleaux pareils côte à côte n’ont pas la même : on l’essaie sur un échantillon<sup class="fnr" data-fn="90-3">3</sup>.</p>
<p>La bonne écorce vient avec sa couche interne collée dessous. Elle se lève pendant un long dégel d’hiver, surtout sous la pluie, ou dès que la sève commence à monter au printemps ; ailleurs, on la levait aussi à la fin de l’automne, après les premières gelées. Dans les gros arbres, la sève part plus tard, et par endroits la bonne écorce se prend encore en juin. Celle qu’on lève par temps chaud se sépare en feuillets de papier et ne vaut rien pour une coque. On la prend sur un arbre qu’on abat (<span class="ref">ch. 94</span> <span class="ref">§5-G</span>), couché sur des perches pour ne pas l’abîmer dans la chute, et c’est l’abattage qui permet le froid : sur l’arbre à terre, on chauffe l’écorce à l’eau chaude, et elle se lève par un temps où celle d’un arbre debout ne lâcherait pas. Pour la décoller sans la fendre : un carré d’écorce de bouleau sèche et épaisse, d’une trentaine de centimètres, un bord arrondi et biseauté, glissé dessous et basculé sur sa courbe.</p>
<p>Débarrasser l’écorce de ses écailles extérieures, puis la <strong>faire tremper plusieurs jours</strong> à l’eau douce : sèche, elle casse comme une coquille d’œuf. La racine d’épinette noire court près de la surface dans la mousse humide et se tire au bâton ou à la main (<span class="ref">ch. 94</span>, étape 10) ; fendue, amincie au couteau, trempée jusqu’à ce qu’elle se noue sans casser, elle coud l’écorce. On couche l’écorce sur une forme de terre tassée au creux du canot, on la coud, on pose les plats-bords, les étraves, puis le bordé, lattes jointives, et les membrures en travers, espacées d’à peu près leur largeur, avec cinq traverses ou plus. <strong>Pendant qu’il sèche, on mouille souvent le canot</strong> : sèche trop vite, l’écorce fend sous la tension. Les coutures se passent à la gomme chaude, à la palette, sur une surface sèche ; on laisse prendre <strong>une journée</strong>, puis on met à l’eau et on reprend tout ce qui suinte.</p>
<p class="p0 ri"><strong class="runin">Sans grande feuille, des petites pièces.</strong> Là où la bonne écorce manquait, au nord, on faisait la coque de beaucoup de petites pièces de bouleau cousues : plus long, plus rugueux, mais un canot.</p>
<p>C’est la même méthode, au clou et à la toile, que celle du canot de toile à membrures libres. Le canot de toile de fabrique, lui, se répare comme au <span class="ref">§5-C</span> et à l’étape 22.</p>
<h3 class="sub">Ce qui ne se remplace vraiment pas</h3>
<p class="li"><strong>Le VFI.</strong> Rien d’improvisé ne tient une tête d’enfant hors de l’eau (<span class="ref">ch. 39</span>, <span class="ref">ch. 00b</span>). Sans VFI d’enfant, l’enfant n’embarque pas — sauf le jour où la rive est pire que le lac : le chemin qui brûle (<span class="ref">ch. 11</span>), ou le printemps quand les VFI sont partis avec le canot perdu. Ce jour-là, ce qui donne le plus de marge : la traversée la plus courte, au ras de la rive ; un VFI d’adulte serré au plus court, avec une courroie d’entrejambe faite d’une corde passée entre les jambes et nouée devant et derrière, parce que sans elle le vêtement monte et l’enfant sort par en dessous (<span class="ref">ch. 39</span>, étape 6). L’essai, sur la grève : soulever l’enfant par les épaules du VFI. S’il reste <strong>plus de 7,6 cm</strong> entre ses épaules et le vêtement, le VFI est trop grand et nuit plus qu’il n’aide : l’enfant va alors contre un adulte qui porte le sien. Des bidons vides bien bouchés, attachés au tronc, aident à flotter ; ils ne tiennent pas la tête hors de l’eau (<span class="ref">ch. 00b</span>).</p>
<p class="li"><strong>Le budget de l’eau froide.</strong> Aucune technique ne rallonge la première minute ni les dix suivantes. Ce qui change, c’est ce qu’on porte en tombant : le VFI attaché et, au printemps et à l’automne, plusieurs couches de vêtements secs et légers sous une couche coupe-vent ou imperméable, le tout sous le VFI. Un VFI gonflable à déclenchement manuel ne flotte pas tant qu’on ne l’a pas déclenché (<span class="ref">ch. 39</span>, étape 6). On tire la poignée <strong>tout de suite</strong>, en tombant : dans l’eau froide, la poigne et l’adresse des doigts fondent de minute en minute, et le tube à gonfler par la bouche ne sert plus à grand-chose quand on a peine à garder la tête hors de l’eau.</p>
<p class="li"><strong>La bonne écorce de bouleau en grandes feuilles.</strong> Là où elle manque, un plan qui compte sur elle pour une coque ne tient pas : ce sont les petites pièces ou l’épinette.</p>
<p class="li"><strong>La saison.</strong> Le canot de peaux attend les peaux, le canot d’écorce attend la sève. Ni l’un ni l’autre ne se fait n’importe quand.</p>
<h3 class="sub">Ce qu’on perd, nommément</h3>
<p class="li"><strong>Avec la gomme,</strong> la durée : une pièce de gomme se surveille et se refait. Un voyage en canot gommé se termine, chaque soir, par un feu et une palette.</p>
<p class="li"><strong>Avec la gomme mâchée,</strong> l’adhérence : elle ne tient qu’une fois lissée au tison, et moins bien.</p>
<p class="li"><strong>Avec le canot de peaux,</strong> une coque qui ramollit et s’alourdit à l’eau et qui ne dure qu’un voyage, et deux ou trois peaux d’orignal prises par la coque : elles ne vont au tannage qu’une fois le canot défait, et seulement si elles en sortent sèches et intactes.</p>
<p class="li"><strong>Avec le canot d’une feuille d’épinette,</strong> tout ce qui dépasse une traversée : il se fait pour passer, pas pour durer.</p>
<p class="li"><strong>Avec la pièce d’aluminium rivetée à la main,</strong> la finition : un rivet frappé à la main tient en cisaillement, mal à l’arrachement (<span class="ref">ch. 107</span> <span class="ref">§9-D</span>). Une pièce, pas une coque neuve.</p>
</template>
<template id="notes">
<p class="fn" data-fn="12-1"><span class="fnn">1</span>Une braise se cache sous la cendre. Lampe éteinte, porte du poêle ouverte, on brasse la cendre au tisonnier jusqu’au fond : une braise vivante luit rouge. Tant qu’un seul point rouge luit, le feu n’est pas mort, et il fait du CO sans flamme.</p>
<p class="fn" data-fn="12-2"><span class="fnn">2</span>Le fil, tenu au bout d’une broche, s’approche d’une flamme, dehors. Le coton brûle sans reculer devant la flamme, sent le papier brûlé et laisse une cendre grise et fine. Le nylon et le polyester fondent en se recroquevillant loin de la flamme, sentent le produit chimique et laissent une petite bille fondue. Un tissu mélangé ne se lit pas à coup sûr : dans le doute, il se range avec la bâche.</p>
<p class="fn" data-fn="43-1"><span class="fnn">1</span>Le bord avant du gros coussinet, celui qui regarde les doigts, fait deux bosses arrondies côte à côte. Celui d’un canidé est un petit triangle, sans ces deux bosses.</p>
<p class="fn" data-fn="43-2"><span class="fnn">2</span>Un gros rocher posé seul au milieu d’une tourbière, d’un plat ou d’une forêt, loin de toute falaise d’où il aurait pu tomber : c’est la glace des glaciers qui l’a laissé là.</p>
<p class="fn" data-fn="43-3"><span class="fnn">3</span>Là où le loup et le coyote ont un petit coussinet en triangle, celui du pied avant du renard se réduit à une barre étroite, posée en travers de l’empreinte. Autour de cette barre, le vide entre les doigts et le coussinet est grand, et le X se lit net.</p>
<p class="fn" data-fn="90-1"><span class="fnn">1</span>Le bout d’une fissure est plus fin qu’un cheveu et continue au-delà de ce que l’œil voit. On nettoie la tôle à vif autour du bout, on tient la lampe basse, à moins de 45° de la tôle, puis le faisceau en travers de la fissure pour la suivre jusqu’au bout, et on la confirme à la loupe de 10. On perce sur le bout trouvé, pas sur la dernière trace visible. Si la fissure repart au-delà du trou, on en perce un second plus loin.</p>
<p class="fn" data-fn="90-2"><span class="fnn">2</span>De l’eau qui perle ou suinte autour de la tête du rivet, à l’intérieur de la coque, quand le canot est à l’eau. Au sec, un rivet desserré bouge ou tourne sous la pointe d’un couteau.</p>
<p class="fn" data-fn="90-3"><span class="fnn">3</span>Plier un échantillon d’écorce d’un côté, puis de l’autre : s’il se sépare en feuillets, l’écorce est mauvaise. Sur la face intérieure, des « yeux » bosselés ou trop rapprochés annoncent une écorce qui fend ; creux, ils ne gênent pas. Une écorce d’un blanc mort, ou dont la surface pèle en petites lanières, se rejette. La bonne écorce de saison froide porte, collée à sa face intérieure, une couche sombre qu’on gratte à l’usage.</p>
</template>

    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
