<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>90 — Le canot : réparer, porter, en refaire un — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}

<div id="book"></div>
<template id="open"><header class="open"><div class="open-top"><span>Tome 5 · La forêt, le jardin et le chalet</span><span>Chapitre</span></div><div class="open-title"><div class="num">90</div><h1>Le canot : réparer, porter, en refaire un</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span class="on">Chalet</span><span>Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">Le canot vit au lac du chalet ; à la maison, rien de ce chapitre ne sert. C’est le deuxième chemin du chapitre 11, le seul bateau qui se répare avec ce que la forêt donne, et le seul qui se refait avec ce que la chasse vient de donner.</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Refermer une coque ouverte en quelques minutes avec une pièce posée en deux couches de gomme d’épinette cuite au gras et au charbon, porter le canot seul d’un lac à l’autre sur la nuque et le front, et, s’il est perdu, en refaire un avec deux ou trois peaux d’orignal tendues sur des perches : le lac reste un chemin tant qu’il y a une épinette, un feu et une bête.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h3 class="sub">C’est le bon choix</h3>
<p class="li"><strong>Quand le lac est le chemin.</strong> Le filet (<span class="ref">ch. 60</span>), la talle de pêche (<span class="ref">ch. 57</span>), la rive d’en face où l’orignal traverse, et la sortie du chalet quand le chemin brûle (<span class="ref">ch. 11</span>). Un canot percé en août ferme tout ça d’un coup, et il n’y a pas de coque de rechange au chalet.</p>
<p class="li"><strong>Quand la coque s’ouvre en route.</strong> Posée à froid, sans feu, une pièce tient par le seul collant de la gomme si la distance qui reste est courte. Avec un feu et la gomme chauffée, elle se pose en quelques minutes, et un trou qui a l’air grave ne l’est pas.</p>
<p class="li"><strong>Chaque soir d’un voyage en canot d’écorce ou de toile.</strong> Les canots d’écorce des voyageurs d’autrefois se réparaient à la fin de chaque journée. La gomme n’est pas une réparation d’accident : c’est un entretien.</p>
<p class="li"><strong>Au printemps, quand on sort du bois sans canot.</strong> Le canot de peaux se fait quand il est trop tôt pour que l’écorce décolle et que le lac est la seule sortie. Les peaux de la chasse, gardées tendues sur leur cadre, en sont la matière (<span class="ref">§9</span>).</p>
<h3 class="sub">C’est un mauvais choix</h3>
<p class="li"><strong>La gomme seule sur une coque de polyéthylène</strong>, le plastique souple qui plie sans casser. Rien ne colle sur ce plastique tel quel : l’eau y perle au lieu de s’étaler, et une colle fait pareil. Il faut d’abord le traiter à la flamme, ou tenir la pièce mécaniquement (<span class="ref">§5-C</span>).</p>
<p class="li"><strong>Un rivet aveugle</strong> — celui qu’on pose d’un seul côté en tirant sa tige — <strong>sous la ligne de flottaison d’une coque d’aluminium.</strong> Il serre moins qu’un rivet frappé et il n’a pas sa place là où l’eau doit rester dehors. Sous l’eau, c’est un rivet plein d’aluminium frappé (<span class="ref">§5-C</span>).</p>
<p class="li"><strong>La gomme de sapin baumier (<em>Abies balsamea</em>) quand il y a de l’épinette.</strong> Le canot se gomme à l’épinette : le constructeur innu le dit sans détour, la gomme de sapin n’est pas faite pour ça. Faute d’épinette, elle dépanne (<span class="ref">§9</span>).</p>
<p class="li"><strong>Le canot de peaux dans l’eau haute du dégel, ou dans un rapide.</strong> C’est la saison où on le construit, et c’est celle où l’eau est à la fois la plus haute et la plus froide : une coque qui ramollit en route, dans une eau qui court, là où le budget de l’eau froide est le plus court (<span class="ref">§8</span>). Le canot de peaux traverse ; il ne descend pas une rivière en crue.</p>
<p class="li"><strong>Le bouleau en grandes feuilles comme coque.</strong> Il n’y avait pas de bonne écorce à canot sur la Basse-Côte-Nord : on remontait le fleuve l’été pour s’en procurer. En Ungava, elle venait des postes du Saint-Laurent. La meilleure se trouvait en arrière de la côte, loin de la mer. Ce que valent les bouleaux à papier (<em>Betula papyrifera</em>) autour du chalet, c’est l’essai de l’écorce qui le dit (<span class="ref">§9</span>) ; en petites pièces cousues, le Nord en a quand même fait des coques.</p>
<p class="li"><strong>Deux peaux d’orignal au canot quand l’hiver s’en vient.</strong> Ce sont aussi la babiche des raquettes, le cuir des mocassins et les mitaines (<span class="ref">ch. 102</span> à 104). Un canot de peaux fait en octobre se paie en février.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0 ri"><strong class="runin">La gomme est une colle qu’on règle.</strong> La résine d’épinette chauffée perd sa partie volatile et durcit en une matière cassante (<span class="ref">ch. 94</span> <span class="ref">§3</span>). Le gras la rend moins cassante et la garde souple et collante ; le charbon en poudre lui donne du corps. Trop de gras, elle ne durcit plus : elle colle aux doigts et s’essuie au frottement. Le réglage se fait donc entre deux échecs qui se voient — ça fend, ou ça colle — et l’essai de la languette (étape 9) montre les deux en quelques instants. La proportion se règle à l’essai : elle change avec la résine, et avec le froid de l’eau où le canot va naviguer. Plus l’eau est froide, plus la gomme demande de gras.</p>
<p class="p0 ri"><strong class="runin">La pièce tient par ses bords.</strong> La première couche colle la pièce sur la déchirure. La seconde, posée sur le pourtour une fois la première refroidie, ferme la ligne où la pièce rencontre la coque. C’est par cette ligne que l’eau entre sous une pièce et la soulève, et c’est elle que la seconde couche recouvre.</p>
<p class="p0 ri"><strong class="runin">Un canot d’écorce ou de peaux n’a pas de charpente rigide.</strong> C’est le revêtement qui tient la charpente ensemble. À l’intérieur, le bordé — des lattes minces couchées contre la peau dans le sens de la longueur — et les membrures — des lattes pliées en travers, forcées une à une contre le bordé. Chaque membrure pousse le bordé contre la peau, la peau résiste, et cette tension serre tout. Deux conséquences. Une pièce de bois cassée se remplace sans défaire le reste : les membrures ne sont pas clouées, et le constructeur en garde une de rechange par paquet. Et le canot de peaux se monte avec des perches à peine équarries, parce que c’est la peau qui fait la forme. Le canot de toile que les Innus montent encore est un canot d’écorce dont on a changé la peau au début du siècle dernier : la méthode est restée la même, ses membrures ne sont pas clouées, et tout ce chapitre s’y applique. C’est le <strong>canot de toile à membrures libres</strong>. Le canot de toile <strong>de fabrique</strong> est construit autrement : son bordé est cloué aux membrures par des broquettes rivées, et la toile est tendue par-dessus. Il se répare autrement aussi (<span class="ref">§5-C</span>, étape 22).</p>
<p class="p0 ri"><strong class="runin">La peau crue travaille avec l’eau.</strong> Mouillée, elle redevient molle ; en séchant, elle se rétracte et serre (<span class="ref">ch. 103</span>). Le canot de peaux s’en sert deux fois : la peau sèche à plat sous le cadre jusqu’à ce qu’elle raidisse, pour garder la forme qu’on va lui donner, puis on la remouille si elle résiste aux dernières membrures. C’est aussi sa limite : à l’eau, une peau crue se gorge d’eau et ramollit. Elle se sort et se sèche chaque jour, et se regraisse au suif.</p>
<p class="p0 ri"><strong class="runin">La courroie de front met la charge sur le squelette.</strong> Passée sur le front et attachée à la charge, elle soulage les épaules et laisse respirer. Coupée à la longueur du cou du porteur, elle fait passer le poids du front aux épaules quand il hausse les épaules, et des épaules au front quand il les relâche. On repose l’un pendant que l’autre travaille, sans poser le canot.</p>
<p class="p0 ri"><strong class="runin">L’eau froide noie avant de refroidir.</strong> La première minute est un choc thermique : on inspire d’un coup, puis la respiration s’emballe. Dans les dix minutes suivantes, bras, jambes et doigts cessent de répondre. L’hypothermie, le corps sous 35 °C, s’installe avant l’heure, et plus tôt chez un enfant (<span class="ref">ch. 25</span>, étape 31) : l’heure, c’est le temps qu’il faut parfois pour en perdre connaissance (<span class="ref">ch. 25</span>, étape 23). Ce qui tue un canoteur chaviré, ce n’est pas d’avoir froid : c’est la noyade que le froid provoque pendant qu’il a encore chaud. Le VFI porté est ce qui fait passer la première minute (<span class="ref">§8</span>) ; ce qui se fait dans les dix suivantes décide du reste (étape 34).</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">La trousse voyage dans le canot, toujours. Elle ne liste que ce que les procédures de ce chapitre demandent.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">VFI <strong>porté</strong>, ajusté à chaque enfant</td><td>1 par personne à bord</td><td><strong>Aucune.</strong> Un VFI sous le banc ne s’enfile pas dans l’eau (<span class="ref">§8</span>). L’ajustement des enfants est au <span class="ref">ch. 39</span>, étape 6</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Écope</td><td>1</td><td>Chaudière, bidon coupé en biais, écuelle d’écorce cousue (<span class="ref">ch. 94</span> <span class="ref">§9</span>)</td><td><span class="non">NON</span> <span class="negx">— un canot plein d’eau ne se répare pas</span></td></tr><tr><td class="c-item">Corde qui flotte, <strong>15 m</strong></td><td>1 par canot</td><td>Toute corde qui flotte (<span class="ref">ch. 15</span>), la ligne de bout du canot. Un bidon vide bien bouché noué au bout la fait flotter, et des nœuds espacés d’une brassée donnent des prises à une main qui ne serre plus (<span class="ref">ch. 25</span> <span class="ref">§4</span>)</td><td><span class="non">NON</span> <span class="negx">— elle se lance depuis la rive ou depuis l’autre canot : celui qui est au sec ne retourne pas à l’eau (étape 35)</span></td></tr><tr><td class="c-item">Gomme d’épinette trempée, en bâtonnets</td><td>Quelques bâtonnets</td><td>Coulées dures d’une épinette tombée, mâchées et lissées au tison (<span class="ref">§9</span>). Résine de pin trempée au suif, là où il n’y a pas d’épinette</td><td><span class="non">NON</span> <span class="negx">— c’est la réparation</span></td></tr><tr><td class="c-item">Gras animal</td><td>Une petite boîte</td><td>Suif d’orignal (<em>Alces americanus</em>) ou graisse d’ours noir (<em>Ursus americanus</em>) (<span class="ref">ch. 72</span>) ; huile de phoque (<span class="ref">ch. 56</span>)</td><td>Oui</td></tr><tr><td class="c-item">Charbon de bois en poudre</td><td>Une poignée</td><td>Charbon de saule (<em>Salix</em>) du feu de la veille, écrasé entre deux pierres et tamisé (<span class="ref">ch. 94</span> <span class="ref">§9</span>)</td><td>Oui</td></tr><tr><td class="c-item">Pièces</td><td>Quelques-unes, selon la coque</td><td>Écorce de bouleau mince pour tout ; toile pour la toile ; tôle d’aluminium <strong>de la même épaisseur</strong> que la coque, ou de l’épaisseur au-dessus ; cuir</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Fil</td><td>Une couronne</td><td>Racine d’épinette fendue (<span class="ref">ch. 94</span>, étape 10), babiche (<span class="ref">ch. 103</span>), fil de tendon</td><td>Oui</td></tr><tr><td class="c-item">Alêne, clous à river ou rivets pleins d’aluminium</td><td>1 alêne, une poignée</td><td>Alêne : clou affûté et emmanché (<span class="ref">ch. 104</span>). Rivet : bout de fil ou de tige d’aluminium, coupé et matté à froid (<span class="ref">§5-C</span>). Contre-masse : la tête de la hache</td><td>Oui</td></tr><tr><td class="c-item">Boîte pour la gomme, palette</td><td>1 de chaque</td><td>Contenant d’écorce et eau bouillante, ou auge et pierres chaudes (<span class="ref">§9</span>). La palette : une cuillère de bois aplatie</td><td>Oui</td></tr><tr><td class="c-item">Couteau croche</td><td>1</td><td>Couteau droit affûté ; lame de ressort biseautée d’un côté (<span class="ref">ch. 103</span> <span class="ref">§9</span>)</td><td>Oui</td></tr><tr><td class="c-item">Courroie de front</td><td>1 par porteur</td><td>Deux pagaies liées sur les traverses et une lanière de peau ou d’écorce (<span class="ref">§9</span>)</td><td>Oui</td></tr></tbody></table>
<p class="p0">Le VFI d’enfant est au palier 1 du chapitre 00b. La gomme, le gras, le charbon, la babiche et la racine se font avec les chapitres 94, 72 et 103.</p>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — La trousse, avant de perdre le chalet de vue (1 à 3)</h3>
<p class="step"><span class="sn">1</span><strong>Mettre dans le canot, à chaque sortie qui dépasse la distance d’un retour à pied :</strong> des pièces d’écorce, de la racine, de la gomme. C’est la trousse de base de tout canot d’écorce du Nord. Ajouter ce que la coque demande : toile pour un canot de toile ; tôle, rivets et contre-masse pour l’aluminium ; alêne et fil partout. Il faut de quoi refermer n’importe quelle fente de la coque.</p>
<p class="step"><span class="sn">2</span><strong>Garder la gomme en bâtonnets, dans une boîte fermée.</strong> Elle reste propre, elle se refond sur n’importe quel feu, et elle ne coule pas dans le fond du canot au soleil.</p>
<p class="step"><span class="sn">3</span><strong>Laisser la courroie de front attachée au canot</strong>, coupée à la longueur du porteur (étape 24), et roulée court contre la traverse sur l’eau. Une courroie qu’il faut ajuster sur la grève d’un portage se règle mal, et en retard ; une courroie qui pend fait une boucle où un bras ou un enfant s’enroule au chavirement.</p>
<h3 class="sub">B — Récolter et tremper la gomme (4 à 10)</h3>
<p class="p0">La fonte, la filtration et la poix d’usage général sont au chapitre 94 <span class="ref">§5-F</span>. Ici, ce qui change pour le canot.</p>
<p class="step"><span class="sn">4</span><strong>Épinette, pas sapin</strong> (<span class="ref">§2</span>). Épinette noire (<em>Picea mariana</em>) ou épinette blanche (<em>Picea glauca</em>).</p>
<p class="step"><span class="sn">5</span><strong>Récolter.</strong> Gratter la résine molle d’une épinette tombée, ou d’une épinette blessée pendant l’été. Pour en accumuler, la méthode ancienne des constructeurs de canots d’écorce : au printemps, enlever une <strong>bande étroite</strong> d’écorce sur une épinette, d’un seul côté, et revenir quand il fait chaud ramasser la résine qui s’amasse au bas de la cicatrice. Elle marche parce que l’arbre pousse sa résine pour fermer la plaie, et qu’une bande d’un seul côté laisse vivre le reste de l’écorce. Jamais en ceinture : un anneau complet d’écorce vivante coupé, l’arbre meurt (<span class="ref">ch. 94</span> <span class="ref">§3</span>). Le prix : la plaie est une porte d’entrée pour la carie et l’insecte, et c’est pour ça que le <span class="ref">ch. 94</span> (étape 32) n’entaille pas pour sa gomme un conifère qu’on veut garder. Donc une épinette qu’on accepte de perdre, près du chalet, une seule bande, et on y revient chaque été. Ramasser aussi les grains et les écailles durs d’une épinette tombée : ils ne fondent pas bien, mais ils se mâchent (<span class="ref">§9</span>).</p>
<p class="step"><span class="sn">6</span><strong>Fondre dehors, jamais de flamme sous la gomme.</strong> Les vapeurs de térébenthine s’enflamment (<span class="ref">ch. 94</span>, étape 33). La gomme fond facilement : il ne faut pas un grand feu. Sur des braises, dans une vieille boîte de conserve ; ou, mieux, dans de l’eau qui bout : la gomme crue fond et remonte à la surface, où elle se cueille à la cuillère (<span class="ref">§9</span>). Là, elle ne dépasse pas 100 °C.</p>
<p class="step"><span class="sn">7</span><strong>Écumer.</strong> Retirer les copeaux, les aiguilles et la saleté de la gomme chaude avec une lanière d’écorce ou un bâton plat. Pour une gomme plus propre, filtrer (<span class="ref">ch. 94</span>, étape 34).</p>
<p class="step"><span class="sn">8</span><strong>Tremper.</strong> Ajouter du gras fondu, peu à la fois, et une petite quantité de charbon de bois en poudre fine. Il n’y a pas de proportion fixe : c’est l’essai de l’étape 9 qui règle, et celle qui a passé s’écrit au feutre sur la boîte. Refondre la gomme plusieurs fois la fonce et la durcit : c’est une manière de rattraper une gomme trop grasse.</p>
<p class="step"><span class="sn">9</span><strong>L’essai de la languette.</strong> Tremper une languette d’écorce dans la gomme, puis dans l’eau froide du lac, et la plier.</p>
<p class="li l2"><strong>La gomme fend :</strong> trop cassante. Ajouter du gras, refaire l’essai.</p>
<p class="li l2"><strong>Elle ne fend pas :</strong> tenir la languette dans la main quelques instants. Si la gomme devient collante ou part en frottant : trop de gras. Ajouter de la gomme ou recuire, refaire l’essai.</p>
<p class="li l2"><strong>Ni fendue ni collante :</strong> prête.</p>
<p class="stepc">L’essai se fait dans l’eau où le canot va naviguer, pas dans l’eau tiède du chaudron. Une gomme réglée pour l’eau d’août peut fendre dans le lac de mai (<span class="ref">ch. 94</span> <span class="ref">§9</span> : la poix d’hiver porte plus de gras).</p>
<p class="step"><span class="sn">10</span><strong>Couler en bâtonnets</strong> dans une gouttière d’écorce, laisser prendre, ranger. La gomme se refond indéfiniment : les grattures d’une vieille pièce retournent au pot.</p>
<h3 class="sub">C — Poser la pièce en deux couches (11 à 22)</h3>
<p class="step"><span class="sn">11</span><strong>Sortir le canot, le vider, le retourner.</strong> Essuyer et laisser sécher la zone : la gomme se pose chaude sur une surface <strong>sèche</strong>. Sur une écorce ou une toile mouillée, elle fige avant d’avoir pris.</p>
<p class="step"><span class="sn">12</span><strong>Remettre en place ce qui a plié.</strong> Une écorce ramollie se repousse à la main ; une tôle d’aluminium bosselée se redresse au maillet de bois contre une bûche tenue derrière.</p>
<p class="step"><span class="sn">13</span><strong>Tailler la pièce</strong> dans la matière qui convient (tableau <span class="ref">§4</span>), plus grande que la déchirure de tous les côtés : assez pour que la gomme la colle sur de l’écorce ou de la toile saine tout autour, et non sur les bords éraillés. L’aluminium a sa règle, plus bas.</p>
<p class="step"><span class="sn">14</span><strong>Faire un petit feu, chauffer la gomme sur les braises, jamais dans la flamme</strong> (étape 6).</p>
<p class="step"><span class="sn">15</span><strong>Border la pièce de gomme chaude et la presser fermement sur la déchirure</strong>, à la palette.</p>
<p class="step"><span class="sn">16</span><strong>Laisser refroidir la première couche.</strong> Pas avant : la seconde couche posée sur une première encore molle la fait glisser.</p>
<p class="step"><span class="sn">17</span><strong>Poser la seconde couche sur le pourtour de la pièce</strong>, chaude, en débordant sur la coque.</p>
<p class="step"><span class="sn">18</span><strong>Lisser à la palette chauffée.</strong> La gomme lissée à chaud colle ; une gomme étendue froide reste posée dessus.</p>
<p class="step"><span class="sn">19</span><strong>Les coutures.</strong> Couler la gomme chaude le long de la couture et la pousser entre les points à la palette. Sur une couture qui travaille, presser par-dessus une bande étroite d’écorce enduite de gomme.</p>
<p class="step"><span class="sn">20</span><strong>Mettre à l’eau peu profonde avant de charger</strong> et regarder l’intérieur, à l’endroit de la pièce. Si ça suinte, sortir le canot, sécher et reprendre la seconde couche.</p>
<p class="p0 lab kh"><strong class="runin">Selon la coque.</strong></p>
<p class="li"><strong>Écorce et toile.</strong> Les étapes 11 à 20 telles quelles. Sur un canot de toile à membrures libres, la toile est clouée à environ <strong>10 cm (4 po)</strong> d’intervalle et chaque clou est rivé : un clou qui a levé se refrappe, une masse tenue derrière. Une déchirure de toile reçoit une pièce de toile, en deux couches. Sur un canot de toile de fabrique, une grande déchirure se ferme par en dessous d’abord : une mince toile de coton glissée entre la toile et le bordé, collée au revers de la toile d’origine, puis une pièce de toile épaisse par-dessus. La colle d’origine y était une colle de caoutchouc. Sans elle, c’est la gomme chaude, posée sur une toile sèche : une réparation de route, qui se regarde chaque soir et se refait au premier feu.</p>
<p class="li"><strong>Aluminium.</strong> Percer d’abord un <strong>trou d’arrêt</strong> de <strong>2,4 mm (3/32 po)</strong>, ou 3,2 mm (1/8 po), au bout de chaque fissure, là où elle finit vraiment et non là où on la voit finir<sup class="fnr" data-fn="90-1">1</sup> : sans lui, elle continue sous la pièce. Pièce de tôle de la même épaisseur que la coque, ou de l’épaisseur au-dessus, et <strong>au moins deux fois aussi longue que la fissure</strong>. Rivets pleins d’aluminium frappés, en un rang, <strong>au moins quatre par côté</strong> dans le sens de la longueur : <strong>3,2 mm (1/8 po)</strong> de diamètre sur une tôle de <strong>1 mm (0,040 po)</strong> ou moins, <strong>4 mm (5/32 po)</strong> au-delà. <strong>Au moins 2 diamètres de rivet</strong> entre le centre d’un trou et le bord de la pièce, et autant entre un trou et la fissure ; <strong>au moins 3 diamètres</strong> d’un trou au suivant. Plus près du bord, la tôle déchire ; plus serrés, les trous font une ligne de perforation. Sans rivet plein, un bout de fil ou de tige d’aluminium coupé à longueur et matté à froid des deux côtés en fait un. Pas de clou d’acier sous l’eau, sauf en tout dernier recours : l’acier et l’aluminium en contact dans l’eau font une pile, et c’est l’aluminium qui se ronge autour du clou. Le rivet serre, il ne rend pas étanche : entre la pièce et la coque, il faut une matière qui fasse le joint, et en forêt, c’est la gomme, avec une toile mince noyée dedans si on en a. L’aluminium tire la chaleur et fige la gomme avant qu’elle ne mouille le métal. Tiédir la pièce et la zone à gommer avant de poser la gomme, à la chaleur des braises, jamais à la flamme : l’aluminium ne change pas de couleur avant de s’effondrer (<span class="ref">ch. 107</span> <span class="ref">§2</span>). Un rivet d’origine qui pleure<sup class="fnr" data-fn="90-2">2</sup> se refrappe : la contre-masse tenue sur la tête, le marteau sur la queue.</p>
<p class="li"><strong>Fibre de verre.</strong> Même geste que l’écorce : une pièce de toile noyée entre deux couches de gomme. C’est une pièce de route, comme toute pièce de gomme : elle se regarde chaque soir et se refait au premier feu.</p>
<p class="li"><strong>Polyéthylène.</strong> Traiter la surface à la flamme avant toute colle : passer la pointe de la flamme d’un chalumeau ou d’une torche au propane tenue à la main, vite — <strong>30 à 40 cm par seconde</strong> — en deux ou trois passes, pour environ <strong>une seconde</strong> d’exposition en tout, sans que la surface change de couleur. La torche se tient <strong>bouteille debout</strong>, jamais penchée à plus de 60° : couchée, elle envoie du propane liquide au bout et crache une grande flamme jaune ; on la redresse et on ferme. C’est donc la coque qu’on tourne vers la flamme, canot couché sur le flanc, pas la torche qu’on couche sous la coque. Pas un réchaud : il ne se balaie pas à cette vitesse. L’essai : une goutte d’eau perle sur une surface non traitée et s’étale en nappe sur une surface traitée. Coller <strong>dans la demi-heure</strong> : l’effet s’estompe. Rien ne dit que la gomme d’épinette y tienne comme une colle d’atelier. Ce qui tient à coup sûr sur ce plastique, c’est la mécanique : une pièce boulonnée ou cousue au travers, posée dans la gomme.</p>
<p class="p0 lab kh"><strong class="runin">La charpente.</strong></p>
<p class="step"><span class="sn">21</span><strong>Traverse cassée.</strong> Un jeune arbre, les bouts amincis au couteau croche jusqu’à ce qu’ils plient, enroulés autour du plat-bord et ligaturés sous la traverse, côté intérieur. Une traverse de fortune tient les flancs comme l’autre.</p>
<p class="step"><span class="sn">22</span><strong>Membrure ou plat-bord cassé.</strong> Dans un canot d’écorce, de peaux ou de toile à membrures libres, la membrure se retire — elle n’est pas clouée — et se remplace par la membrure de rechange, ou par une latte de bois vert pliée sur le genou (<span class="ref">§9</span>). Dans un canot de toile de fabrique, elle est clouée au bordé : on enlève le morceau cassé, on ébouillante une latte sèche pour la plier, on la pose à sa place et on la cloue à travers le bordé, les broquettes rivées à l’intérieur contre le dos de la hache ou une roche. Une latte glissée entre deux membrures soutient aussi un bordé cassé. Le plat-bord se répare par une enture à recouvrement généreux (<span class="ref">ch. 110</span> <span class="ref">§5</span>.7), liée plutôt que chevillée : une cheville de plus fend une pièce déjà cassée. La ligature se fait à la racine d’épinette fendue, qui tient mouillée (<span class="ref">ch. 103</span>, étape 22). La babiche serre en séchant (<span class="ref">ch. 103</span>, étape 31), mais un plat-bord est mouillé toute la journée et elle y redevient molle : en dépannage seulement, refaite au sec.</p>
<h3 class="sub">D — Porter (23 à 30)</h3>
<p class="step"><span class="sn">23</span><strong>Seul, la traverse du centre sur la nuque.</strong> Retourner le canot en levant un bout, ou le lever d’un bloc, et le poser sur les épaules, la traverse du centre contre la nuque. Les mains, lancées vers l’arrière, tiennent le bout qui cherche le sol.</p>
<p class="step"><span class="sn">24</span><strong>La courroie de front, coupée au cou.</strong> Une bande de peau, de toile ou d’écorce passe sur le front et s’attache aux flancs du canot par deux cordons ; elle l’empêche de glisser des épaules. La courroie de portage innue se coupe <strong>à la longueur du cou du porteur</strong> : les épaules haussées prennent la charge, les épaules relâchées la rendent au front. On alterne en marchant. Dans une chute, la tête sort de la courroie et le canot part : une courroie attachée à la coque et passée sur le front tire sur le cou quand la coque tombe.</p>
<p class="step"><span class="sn">25</span><strong>De l’écorce de bouleau sous la courroie.</strong> Glissée entre le front et la lanière, elle ne se détrempe pas de sueur, et la peau du front ne chauffe pas.</p>
<p class="step"><span class="sn">26</span><strong>Le bagage à la courroie de front.</strong> La charge repose au creux des reins, le poids pris par les hanches ; les bouts de la courroie sont noués à la charge, la bande large sur le front. Le détail de la courroie est au <span class="ref">§9</span>.</p>
<p class="step"><span class="sn">27</span><strong>Le porteur du canot prend le long chemin.</strong> Un canot ne passe pas partout où passe un marcheur : sur un sol accidenté, le porteur contourne, et le reste du groupe coupe au plus court pour l’attendre au lac.</p>
<p class="step"><span class="sn">28</span><strong>Compter les voyages avant de partir.</strong> Une grosse famille faisait jusqu’à quatre voyages par portage, et un portage de dix kilomètres prenait deux jours avec le bagage. Chaque charge de plus que la première, ce sont deux longueurs de portage de plus : on revient la chercher à vide. Avec deux enfants de 4 et 6 ans, un long portage se compte en journées, pas en heures.</p>
<p class="step"><span class="sn">29</span><strong>Répartir entre canots.</strong> Les adultes se partagent le bagage pour alléger le canot qui porte le plus d’enfants.</p>
<p class="step"><span class="sn">30</span><strong>Au bout du portage, poser le canot à l’eau vide</strong> et regarder le fond avant de charger. Une fente qu’on voit à vide se répare sur la grève ; la même fente trouvée au large, chargée, se répare à l’écope.</p>
<h3 class="sub">E — Sur l’eau froide (31 à 36)</h3>
<p class="step pk-d"><span class="sn">31</span><strong>VFI attaché sur tout le monde avant d’embarquer.</strong> Une fois dans l’eau, l’attraper est presque impossible, et l’enfiler, encore moins : le choc thermique prend la respiration, puis les mains (<span class="ref">§8</span>).</p>
<p class="step"><span class="sn">32</span><strong>Charger en sachant ce que la charge enlève.</strong> Une charge trop lourde réduit la marge de roulis avant que les flancs n’embarquent, et de petites vagues suffisent alors à remplir le canot.</p>
<p class="step"><span class="sn">33</span><strong>Avec des enfants à bord, la route suit la rive</strong>, assez près pour qu’on la gagne en poussant le canot à la nage avant que les bras ne lâchent. Ce qu’on nage l’été ne dit rien de ce qu’on nage dans l’eau du printemps. La traversée au large gagne du temps et joue tout le budget. Pas d’eau grossie par la pluie ou la fonte : elle court et elle charrie, et celle de la fonte sort de la glace.</p>
<p class="step"><span class="sn">34</span><strong>Si le canot chavire :</strong> la première minute, garder la bouche et le nez hors de l’eau et ralentir la respiration, sans nager pour se réchauffer (<span class="ref">ch. 25</span>, étape 24). Puis rester avec le canot, qui flotte, et ne nager que pour rejoindre les autres ou un appui qu’on atteint à coup sûr. <strong>Ce qui n’est pas au sec à la fin des dix minutes n’y arrivera plus par ses propres forces</strong>, et personne ne vient : attendre sur la coque au milieu du lac, c’est attendre l’heure. Tant que les mains répondent :</p>
<p class="li l2"><strong>rive proche :</strong> pousser le canot vers la rive en battant des jambes, une main au plat-bord, les enfants sur la coque ou contre elle ;</p>
<p class="li l2"><strong>rive loin :</strong> retourner le canot à l’endroit, s’y hisser et le pagayer plein d’eau jusqu’à la rive, ou l’écoper. Est-ce que ce canot-là flotte plein d’eau, et avec qui dedans : ça s’essaie l’été, au bord, une fois, en le remplissant, pas le jour où il chavire. Celui qui coule ne sert pas à la traversée avec les enfants.</p>
<p class="stepc">Grimper sur la coque et attendre ne vaut que si quelqu’un est vraiment en route : l’autre canot, l’autre adulte déjà en train de revenir.</p>
<p class="step pk-d"><span class="sn">35</span><strong>Les enfants sortent de l’eau les premiers</strong>, sur la coque ou contre la poitrine d’un adulte, tenus par leur VFI — épaulettes, poignée — plutôt que par leur prise : leurs mains lâchent avant celles des adultes, et leur corps refroidit plus vite (<span class="ref">ch. 25</span>, étape 31). On les ramène ensemble, pas un à la fois : l’adulte qui dépose un enfant sur la rive et repart chercher l’autre fait le deuxième trajet avec des bras qui ont déjà dépensé une partie de leurs dix minutes (<span class="ref">§8</span>). Celui qui est déjà au sec ne retourne pas à l’eau : il lance la corde (<span class="ref">§4</span>). Un sauveteur à l’eau double le problème (<span class="ref">ch. 25</span>, étape 26).</p>
<p class="step"><span class="sn">36</span><strong>Sorti de l’eau :</strong> à l’horizontale, sans asseoir la personne ni lui faire lever les bras (<span class="ref">ch. 25</span>, étapes 5 et 27). Les vêtements mouillés se coupent, ils ne se passent pas par-dessus la tête, et on ne découvre la personne que lorsqu’il y a de quoi l’envelopper (<span class="ref">ch. 25</span>, étape 7). Puis la séquence B du <span class="ref">ch. 25</span>, et le feu (<span class="ref">ch. 13</span>). L’hypothermie continue de descendre après la sortie.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:19.1%"><col style="width:17.6%"><col style="width:32.5%"><col style="width:30.7%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Avant une sortie hors de vue du chalet</td><td>Trousse, écope, corde</td><td>Gomme, pièces, fil, alêne, gras dans le canot ; corde de 15 m, bidon bouché au bout</td><td>Compléter. Sans gomme ni pièce, rester à distance d’un retour à pied</td></tr><tr><td class="c-item">Avant d’embarquer</td><td>VFI des enfants</td><td>Porté et attaché ; soulevé par les épaulettes, pas plus de 7,6 cm entre les épaules et le vêtement (<span class="ref">ch. 39</span>)</td><td>L’enfant n’embarque pas — sauf le jour où la rive est pire que le lac (<span class="ref">§9</span>)</td></tr><tr><td class="c-item">Gomme, après trempe</td><td>Languette pliée après l’eau froide</td><td>Ne fend pas</td><td>Ajouter du gras, refaire l’essai</td></tr><tr><td class="c-item">Gomme, après trempe</td><td>Languette tenue dans la main</td><td>Ne colle pas, ne part pas au frottement</td><td>Recuire ou ajouter de la gomme</td></tr><tr><td class="c-item">Pièce posée, refroidie</td><td>Pourtour de la pièce</td><td>Seconde couche continue sur tout le tour, aucun bord levé</td><td>Sécher, reprendre la seconde couche</td></tr><tr><td class="c-item">Pièce posée, à l’eau peu profonde</td><td>Intérieur de la coque vis-à-vis de la pièce</td><td>Sec</td><td>Sortir, sécher, reprendre les bords</td></tr><tr><td class="c-item">Coque d’aluminium, avant la pièce</td><td>Bout de la fissure</td><td>Trou d’arrêt percé au-delà de la dernière trace visible</td><td>Percer avant de poser</td></tr><tr><td class="c-item">Coque d’aluminium, pièce et rivets</td><td>Géométrie</td><td>Pièce : au moins deux fois la longueur de la fissure. Au bord et à la fissure : au moins 2 diamètres. D’un trou à l’autre : au moins 3 diamètres</td><td>Pièce plus longue ; repercer plus loin du bord et de la fissure, espacer</td></tr><tr><td class="c-item">Polyéthylène traité</td><td>Goutte d’eau</td><td>S’étale en nappe</td><td>Perle : repasser la flamme ; coller dans les 30 minutes</td></tr><tr><td class="c-item">Courroie de front</td><td>Longueur</td><td>Celle du cou du porteur : épaules haussées, la charge quitte le front</td><td>Raccourcir ou rallonger au nœud</td></tr><tr><td class="c-item">Canot de peaux, sur le lit</td><td>Bords de la peau</td><td>Commencent à rouler</td><td>Pas encore : attendre. Trop raide pour se relever : remouiller</td></tr><tr><td class="c-item">Canot de peaux, à l’eau</td><td>Peau entre les membrures, coutures</td><td>Tendue, aucun suintement</td><td>Sortir, sécher, repasser les coutures à la gomme ou au suif</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:30.9%"><col style="width:34.5%"><col style="width:34.6%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">La languette fend à l’eau froide</td><td>Gomme trop cassante : pas assez de gras, ou trop cuite</td><td>Gras, peu à la fois, et réessayer</td></tr><tr><td class="c-item">La gomme colle aux doigts ou s’essuie</td><td>Trop de gras</td><td>Recuire, ou ajouter de la gomme</td></tr><tr><td class="c-item">La gomme fume, une flamme lèche le contenant</td><td>Trop chaud : vapeurs de térébenthine</td><td>Couvrir pour étouffer, ou jeter du sable. <strong>Jamais d’eau dessus</strong> (<span class="ref">§8</span>)</td></tr><tr><td class="c-item">La pièce suinte par le bord</td><td>Seconde couche manquante, ou posée sur une coque mouillée</td><td>Sécher, refaire la seconde couche</td></tr><tr><td class="c-item">La pièce part d’un bloc</td><td>Posée sur du mouillé ou du froid ; ou polyéthylène non traité</td><td>Sécher et refaire. Sur plastique : flamme, ou pièce boulonnée</td></tr><tr><td class="c-item">La fissure d’aluminium ressort de la pièce</td><td>Pas de trou d’arrêt, ou percé avant la vraie fin</td><td>Déposer la pièce, percer plus loin, reposer</td></tr><tr><td class="c-item">Un rivet pleure</td><td>Rivet desserré, rivet aveugle sous l’eau, ou clou d’acier qui ronge l’aluminium autour de lui</td><td>Refrapper ; remplacer par un rivet plein d’aluminium</td></tr><tr><td class="c-item">La membrure neuve fend en travers</td><td>Bois sec plié à froid</td><td>Refaire en bois vert</td></tr><tr><td class="c-item">La courroie brûle le front</td><td>Sueur sous la lanière</td><td>Écorce de bouleau entre le front et la courroie</td></tr><tr><td class="c-item">Canot de peaux mou entre les membrures, coutures qui pleurent</td><td>La peau crue a repris de l’eau</td><td>Sortir, sécher, regommer ; faire des traversées plus courtes</td></tr><tr><td class="c-item">La peau du canot sent, le poil se détache en plaques</td><td>La peau pourrit : c’est le coulage du <span class="ref">ch. 103</span> (étape 11), sur une coque</td><td>Finir la traversée, ne pas y remettre d’enfant, démonter</td></tr><tr><td class="c-item">Un enfant mouillé cesse de grelotter, devient mou ou somnolent</td><td>Hypothermie qui s’installe</td><td>Séquence B du <span class="ref">ch. 25</span>, tout de suite</td></tr></tbody></table>

<p class="pt"><span class="pn">1</span><strong class="plead">L’eau froide noie avant de refroidir.</strong> Dans la première minute, le choc thermique fait prendre une grande respiration d’un coup, puis emballe la respiration de 600 à 1 000 % : la tête sous l’eau à ce moment-là, on inspire l’eau. Même un bon nageur peut y succomber. Dans les dix minutes suivantes, les bras, les jambes et les doigts cessent de répondre : on ne nage plus, on ne s’accroche plus à la coque, et on n’enfile plus un VFI qu’on n’a pas sur le dos. L’hypothermie, le corps sous 35 °C, s’installe avant l’heure, et plus tôt chez un enfant : l’heure, c’est le temps qu’il faut parfois pour en perdre connaissance (<span class="ref">ch. 25</span>, étapes 23 et 31 ; <span class="ref">ch. 15</span>). <strong>Mécanisme :</strong> ce n’est pas le froid du corps qui tue le canoteur, c’est la noyade que le froid de l’eau provoque pendant que le corps est encore chaud. D’où le VFI <strong>porté et attaché</strong>, pas rangé : environ 90 % des noyés d’accidents de navigation de plaisance n’en portaient pas.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Le deuxième aller.</strong> Un adulte qui ramène un enfant à la rive, puis repart chercher l’autre, refait le trajet avec ce qui lui reste de ses dix minutes. Le réflexe est de sauver un enfant à la fois ; le budget de l’eau froide ne le permet pas. Les enfants sortent de l’eau les premiers, sur la coque, tenus par leur VFI, et le canot va à la rive avec eux (étapes 34 et 35). Celui qui est déjà au sec lance la corde ; il ne retourne pas à l’eau. On n’attend sur la coque que si quelqu’un est vraiment en route : personne d’autre ne viendra, et l’heure court plus vite pour un enfant de 4 ans.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Le canot de peaux se construit à la saison de l’eau la plus haute et la plus froide.</strong> Il naît au printemps, quand la fonte gonfle les rivières et que le lac sort de la glace. Sa peau crue ramollit en reprenant de l’eau, d’une traversée à l’autre. <strong>Mécanisme :</strong> une coque qui se détend en route se remplit en route, et elle le fait dans l’eau où le budget est d’une minute. Il traverse court, le long de la rive, jamais dans un courant ni dans une eau grossie par la fonte. Le premier voyage porte le bagage : il dit si la coque tient avant qu’on y mette un enfant.</p>
<p class="pt"><span class="pn">3</span><strong class="plead">La gomme grasse en feu ne s’éteint pas à l’eau.</strong> Coupée au gras, la gomme qui prend feu brûle comme un feu de graisse, et le lac est à trois pas. <strong>Mécanisme :</strong> l’eau jetée dessus coule sous la gomme brûlante, s’y vaporise d’un coup et projette la gomme en feu sur celui qui l’a jetée. On couvre la boîte, ou on jette du sable, et on ne la déplace pas. La fonte dans l’eau qui bout ne pose pas ce problème : la gomme n’y dépasse pas 100 °C, et l’eau n’a rien à vaporiser d’un coup.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">Ailleurs, volontairement :</strong> les brûlures de gomme chaude (<span class="ref">ch. 94</span> <span class="ref">§8</span>, entrée 5) ; la glace, les pics et la sortie d’un trou (<span class="ref">ch. 25</span> <span class="ref">§5-D</span>, <span class="ref">ch. 15</span>, <span class="ref">ch. 58</span>) ; l’abattage des arbres dont on prend l’écorce (<span class="ref">ch. 106</span>) ; le dépouillement de l’orignal et ses gants (<span class="ref">ch. 102</span>, étape 1).</p>
