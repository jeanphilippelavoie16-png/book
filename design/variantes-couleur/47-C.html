<template id="story-e">
<p class="p0">Sans cartouches, ou avec la dernière boîte réservée à l’orignal (<span class="ref">ch. 45</span> <span class="ref">§5-A</span>).</p>
<h3 class="sub">Ce qui change : on ne chasse plus la bête, on chasse l’immobilité</h3>
<p class="p0">Sans arme à feu, trois prises disparaissent : <strong>la gélinotte en vol, la sauvagine en vol, le lièvre qui court</strong>. Rien de ce qui se fabrique au chalet ne prend l’oiseau en vol (<span class="ref">ch. 45</span> <span class="ref">§9</span>), ni le lièvre lancé à pleine course. Il reste deux familles de bêtes. Celles dont on connaît le chemin — lièvre, écureuil, rat musqué — et qui vont aux engins (<span class="ref">ch. 48, 53</span>). Et celles <strong>qui se figent au lieu de fuir</strong> : le lièvre au gîte, le tétras sur sa branche, le lagopède dans sa bande, la gélinotte perchée à la brunante, l’écureuil qui s’est arrêté, le porc-épic d’Amérique (<em>Erethizon dorsatum</em>) dans son arbre (<span class="ref">ch. 51</span> <span class="ref">§9</span>). Ce sont elles que le bâton, la perche, le lance-pierre et la flèche mousse prennent, à condition d’arriver assez près.</p>
<p>C’est la répartition des Innus et des Naskapis pour ce territoire : le fusil pour le gros gibier, l’arc de mélèze et la flèche à tête ronde pour la « perdrix » et le lièvre, parce que la cartouche coûtait trop cher pour ce qui se prend autrement. La fabrication de l’arc, de la flèche mousse, du lance-pierre, de la fronde et du bâton est au chapitre 45 (<span class="ref">§9</span>). Ce qui suit est la chasse avec.</p>
<h3 class="sub">S’approcher sans arme : le contraire de la gélinotte au fusil</h3>
<p class="p0">Au fusil, on s’arrête pour faire lever la gélinotte (étape 13). Sans fusil, on veut exactement l’inverse : que la bête ne parte pas. Tout ce qui fait lever doit disparaître de l’approche.</p>
<p class="li"><strong>Ne jamais s’arrêter net.</strong> C’est l’arrêt brusque, puis la reprise, qui fait partir l’oiseau : la bête croit qu’on l’a vue. Avancer d’un mouvement lent et continu, même quand il faut ralentir à presque rien (<span class="ref">ch. 49</span> <span class="ref">§9</span>).</p>
<p class="li"><strong>Ne jamais marcher droit dessus.</strong> Avancer en biais, comme si l’on allait passer à côté, et refermer la distance par une courbe. Un écureuil ou un oiseau sauvage vers qui l’on marche droit part de plus loin que si l’on passe de biais. Le lièvre au gîte s’approche de la même façon.</p>
<p class="li"><strong>Bouger quand elle est occupée.</strong> L’écureuil qui mange, le tétras qui arrache des aiguilles, le lagopède qui gratte la neige regardent moins. Quand la bête s’immobilise et regarde, on s’immobilise aussi, sans à-coup.</p>
<p class="li"><strong>Garder un tronc entre soi et elle</strong> pour les derniers mètres, quand il y en a un.</p>
<p class="li"><strong>Se préparer avant d’arriver.</strong> Le bâton dans la main, la pierre dans la pochette, la flèche encochée : le geste qui prépare l’arme à quelques pas de la bête est celui qui la fait partir.</p>
<h3 class="sub">Le bâton de jet</h3>
<p class="p0">Un bâton solide, long comme le bras du bout des doigts à l’épaule (<span class="ref">ch. 45</span> <span class="ref">§9</span>), à bout mousse. Le meilleur est en bois franc lourd, naturellement coudé, <strong>aplati sur deux faces comme un boomerang</strong> : il vole à plat et touche plus souvent. Il marche sur ce qui s’immobilise au lieu de fuir, et sur rien d’autre.</p>
<p class="p0 ri"><strong class="runin">Lancer de côté, à plat, sur ce qui est au sol.</strong> Lancé de côté, le bâton tourne à plat et balaie une bande large comme sa longueur : il pardonne l’erreur de côté. Lancé bas, à hauteur de la bête, il file au ras de la neige au lieu de retomber sur un point : il pardonne aussi l’erreur de distance. C’est le lancer du lièvre au gîte et du lagopède dans la neige.</p>
<p class="p0 ri"><strong class="runin">Lancer par-dessus l’épaule sur ce qui est perché.</strong> Le bâton tourne alors à la verticale et balaie une bande haute comme sa longueur : il pardonne l’erreur de hauteur, qui est celle qu’on fait sur une branche. C’est le lancer du tétras sur sa branche basse.</p>
<p class="p0 ri"><strong class="runin">En porter deux ou trois.</strong> Le premier manque souvent, et une bête qui ne part pas au premier passage du bâton — le tétras le fait — reste une cible. Le deuxième est déjà dans l’autre main.</p>
<p class="p0 ri"><strong class="runin">Courir tout de suite à la bête.</strong> Une bête assommée se réveille. Le lièvre s’achève d’un coup sec du bâton derrière les oreilles ; l’oiseau, en lui cassant le cou d’un geste. <strong>Sauf le porc-épic</strong> : on n’arrive pas au-dessus de son dos. On l’approche de face, hors d’atteinte de la queue, on l’achève au bâton sur la tête, et on attend deux minutes d’immobilité avant de le retourner au bâton, jamais à la main (<span class="ref">ch. 51</span>, étapes 6 à 9). Gants aux mains pour le lièvre (<span class="ref">§8</span>, bloc 2) : le bâton ouvre la peau comme la balle, et le bâton qui l’a frappé se reprend ganté et reste réservé au lièvre, comme la flèche (<span class="ref">ch. 45</span> <span class="ref">§8</span>, bloc 4).</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd :</strong> la distance. Le bâton prend ce qui est à quelques longueurs de bâton, pas plus. Tout le travail est dans l’approche.</p>
<h3 class="sub">Le tétras : la perche, le bâton, et le plus bas d’abord</h3>
<p class="p0">Le tétras du Canada qui monte sur une branche basse et regarde est la prise la plus sûre du territoire sans munition. La perche à collet — hampe sèche fendue au bout, boucle de fil métallique fin, présentée de côté, passée par-dessus la tête et tirée sec — est décrite au chapitre 49 (<span class="ref">§9</span>). La distinction entre l’oiseau sain et l’oiseau malade, qui décide de tout, est au <span class="ref">§8</span> (bloc 1) : c’est le regard qui suit, pas la place ni le plumage.</p>
<p class="p0 ri"><strong class="runin">Ce que la bande ajoute.</strong> Quand trois ou quatre tétras sont dans le même arbre, commencer <strong>par le plus bas</strong>, à la perche comme au bâton ou à la flèche. L’oiseau pris en bas descend sans traverser la bande ; celui qu’on ferait tomber d’en haut passerait en battant des ailes devant tous les autres. Rapprocher la perche du suivant <strong>du même mouvement lent</strong>, sans reculer pour se reposer.</p>
<p class="p0 ri"><strong class="runin">Tous les tétras ne se laissent pas faire.</strong> Certains, ailleurs, sont plus farouches et partent d’un coup d’ailes. La perche se tente sur celui qui monte sur sa branche et regarde ; celui qui part se laisse.</p>
<h3 class="sub">Le lagopède, l’hiver où il descend</h3>
<p class="p0">L’autre oiseau qui se laisse approcher à découvert, et le plus facile des deux quand il est là (étapes 21 et 22). L’hiver où les bandes arrivent, c’est la prise sans munition de l’année : on le sait dès les premières neiges, aux traces de pattes emplumées<sup class="fnr" data-fn="47-2">2</sup> dans les saules et le long des chemins forestiers, et ce sont ces semaines-là qu’on sort tous les jours plutôt que de garder ses forces pour le lièvre, qui, lui, sera encore là en mars. La bande assise dans les saules se prend au bâton lancé à plat, à hauteur des oiseaux, puis au deuxième bâton sur ceux qui n’ont pas bougé ; la perche du tétras sert aussi. Par grand froid, le lagopède peut rester jusqu’à 17 heures sur 24 dans son trou de neige (étape 22) et part d’un coup sous les raquettes : on attend les heures où la bande ressort manger dans les saules plutôt que de la relever sans fin.</p>
<p class="p0 ri"><strong class="runin">Les collets du lagopède, qui travaillent sans personne.</strong> Deux montages. Le lagopède des saules, l’hiver, vit en bandes dans les saules et se prend facilement au collet :</p>
<p class="li"><strong>La haie de saules.</strong> Une haie mince de branches de saule plantées serré dans la neige, autour du bouquet où la bande mange, en laissant de petites ouvertures ; un collet dans chaque ouverture. L’oiseau qui longe la haie passe par l’ouverture.</p>
<p class="li"><strong>La ligne à plat.</strong> Une série de boucles attachées le long d’une ligne, posées <strong>à plat</strong> sur la neige autour d’un bouquet de saules fréquenté. Dans la neige molle, le lagopède traîne les pieds : il met le pied dans une boucle, la tire vers l’avant en marchant, et se prend par la patte.</p>
<p>Le fil, la boucle et l’œillet sont ceux du collet à lièvre (<span class="ref">ch. 48</span> <span class="ref">§9</span>). Posés là où la bande mange, ils travaillent pendant qu’on fait autre chose.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd :</strong> rien ne garantit la descente. Certains hivers, il n’y en a pas, et aucune marche n’y change rien.</p>
<h3 class="sub">Le lièvre sans arme</h3>
<p class="p0 ri"><strong class="runin">Au collet, d’abord.</strong> C’est la vraie réponse, et elle travaille la nuit (<span class="ref">ch. 48</span> <span class="ref">§5</span> et <span class="ref">§9</span>).</p>
<p class="p0 ri"><strong class="runin">Au gîte, le matin d’après une neige.</strong> Suivre la piste de la nuit (étape 6) jusqu’à voir l’œil et le bout noir des oreilles. S’arrêter de marcher droit vers lui à ce moment-là : continuer en biais, en refermant lentement la distance par une courbe, sans jamais s’arrêter net. Un lièvre accroupi à portée se prend au bâton lancé à plat, à la flèche mousse, au lance-pierre. Celui qui ne part pas quand on arrive sur lui, ou qui s’éloigne lentement, ne se prend pas : c’est le lièvre malade (<span class="ref">§8</span>, bloc 1). <strong>Ce qu’on perd :</strong> la plupart. Un lièvre qui part se prend rarement sans fusil.</p>
<p class="p0 ri"><strong class="runin">À deux, avec le cercle.</strong> Le lièvre poussé revient près de son point de départ (étape 8). L’un suit la piste sans relâche, sans chercher le silence ; l’autre attend près du point de départ, arc bandé à moitié ou bâton en main, <strong>posté de côté par rapport à la coulée</strong> : le pisteur revient par la même piste, juste derrière le lièvre, et une flèche ou un bâton lancés dans l’axe de la coulée partent vers lui. On ne lance qu’en travers. Et c’est souvent sur cette coulée-là qu’il faut ensuite poser le collet.</p>
<h3 class="sub">La flèche mousse et le lance-pierre, à la chasse</h3>
<p class="p0">Le chapitre 45 fabrique l’arc de mélèze, la flèche à tête en œuf et le lance-pierre. Ce qui compte ici, c’est <strong>à quoi on les tire</strong> :</p>
<p class="li"><strong>La gélinotte perchée à la brunante</strong>, l’hiver, dans un tremble (étape 12), quand un angle donne le tronc ou une grosse branche derrière elle. Découpée sur le ciel, la flèche qui manque est perdue : on l’accepte, ou on ne tire pas.</p>
<p class="li"><strong>Le tétras</strong> sur sa branche basse.</p>
<p class="li"><strong>Le lagopède</strong> dans sa bande, assis dans les saules. Un tireur exercé renversait à la flèche mousse un lagopède ou un lièvre accroupi <strong>à une vingtaine de mètres</strong> ; un débutant, à beaucoup moins.</p>
<p class="li"><strong>Le lièvre accroupi</strong> sous une épinette.</p>
<p class="li"><strong>L’écureuil</strong> au sommet d’un petit arbre : sur une bête aussi petite, une simple baguette sans plume ni tête suffit.</p>
<p class="li"><strong>Le porc-épic</strong> perché (<span class="ref">ch. 51</span>).</p>
<p>Derrière la cible, un talus ou un tronc : une flèche qui manque dans la neige profonde se perd, et une flèche se fait en une soirée. La flèche qui a touché un lièvre, un rat musqué ou un écureuil se reprend gants aux mains ; elle reste réservée au lièvre, marquée d’une entaille, et ne retourne jamais dans les flèches d’entraînement que les enfants ramassent (<span class="ref">ch. 45</span> <span class="ref">§8</span>, bloc 4). L’élastique du lance-pierre voyage dans une poche intérieure et se monte au moment de tirer, parce que le caoutchouc raidit au froid (<span class="ref">ch. 45</span> <span class="ref">§9</span>). Une pierre assomme, elle ne tue pas toujours : courir à la bête comme au bâton, sauf au porc-épic (plus haut).</p>
<h3 class="sub">L’écureuil, le rat musqué, la sauvagine sans cartouches</h3>
<p class="p0 ri"><strong class="runin">L’écureuil</strong> : son amas de cônes (étape 24) dit où appuyer la perche à collets du chapitre 53 (<span class="ref">§9</span>). Une perche contre l’arbre le plus proche de l’amas travaille toute la journée, pendant qu’on fait autre chose.</p>
<p class="p0 ri"><strong class="runin">Le rat musqué</strong> : au piège, dans son passage, jamais à côté (<span class="ref">ch. 53</span> <span class="ref">§9</span>). Sans arme, le tir du crépuscule disparaît, rien d’autre.</p>
<p class="p0 ri"><strong class="runin">La sauvagine</strong> : rien ne prend un canard en vol (<span class="ref">ch. 45</span> <span class="ref">§9</span>). Les appelants de fortune gardent leur utilité pour la dernière boîte (<span class="ref">ch. 54</span> <span class="ref">§9</span>). Les volées en mue, clouées au sol, se ramassent au complet : c’est manger d’un coup les volées des automnes qui viennent sur ce plan d’eau (<span class="ref">ch. 54</span> <span class="ref">§2</span>).</p>
<h3 class="sub">Quand il reste quelques cartouches</h3>
<p class="p0">La section 5-J devient la règle, sans exception :</p>
<p class="li">La .22 ne sort plus que sur ce qui est assis, à 25 m ou moins, tête visible, un arrêt derrière.</p>
<p class="li">Le 12 ne sort plus que pour la sauvagine, aux appelants, à 23 m.</p>
<p class="li">La gélinotte en vol n’est plus une cible : on l’attend perchée à la brunante, ou on la laisse.</p>
<p class="li">Tout ce qui se fige passe au bâton, à la perche et à la flèche, et la cartouche va à ce qui ne se fige pas.</p>
<p class="li">Les dernières cartouches de carabine — .308, 7 mm, .303 — vont à l’orignal (<span class="ref">ch. 45</span> <span class="ref">§5-A</span>).</p>
<h3 class="sub">Ce qui ne se remplace pas</h3>
<p class="li"><strong>L’oiseau en vol et le lièvre qui court.</strong> Sans fusil, ils sortent du menu. Il faut le savoir en septembre, pas en février.</p>
<p class="li"><strong>La pratique.</strong> Le bâton, la flèche et la pierre ne vont où l’on veut qu’après des heures. Elles se prennent l’automne d’avant, sur des souches et des cibles d’écorce, avec les enfants qui ramassent les flèches d’entraînement — jamais une flèche qui a servi à la chasse — et pas le jour où la boîte est vide.</p>
<p class="li"><strong>La lecture du territoire.</strong> Sans arme, on ne prend que ce qu’on a trouvé avant qu’il nous voie. C’est le chapitre 42, et c’est lui qui décide de tout ce qui précède.</p>
<p class="li"><strong>Le gras.</strong> Aucune quantité de lièvres et de « perdrix » ne le fournit (<span class="ref">§8</span>, bloc 4). La chasse au petit gibier sans gras à côté est une façon plus lente d’arriver au mal de caribou.</p>

<p class="fn" data-fn="45-1"><span class="fnn">1</span>Le renflement est un anneau où le canon a gonflé sous le choc de la balle contre l’obstacle. Il se voit parfois dehors, comme un anneau autour du canon. Sinon, l’âme bien propre, regardée par la chambre contre une lumière vive, y montre une ombre en anneau — une tache de graisse fait la même ombre, d’où l’âme propre — et les doigts passés doucement le long du canon le sentent comme une bosse. Deux balles restées dans l’âme : on présume le canon renflé. Un canon renflé ne s’arrange pas en tirant.</p>
<p class="fn" data-fn="47-1"><span class="fnn">1</span><strong>Le tambourinage de la gélinotte.</strong> Un bruit sourd qui pulse, comme un tambour qu’on bat au loin. Le mâle le fait en comprimant l’air sous ses ailes, le plus souvent debout sur un billot, parfois sur une racine ou une roche. On l’entend surtout au printemps, et parfois à l’automne.</p>
<p class="fn" data-fn="47-2"><span class="fnn">2</span><strong>La trace du lagopède.</strong> L’hiver, le dessous de ses pieds est couvert de plumes jusqu’au bout des doigts, au point de ressembler à une patte de lièvre, et seules ses longues griffes dépassent : l’empreinte est ronde et floue, sans doigts nets (<span class="ref">ch. 43</span>, <span class="ref">§5</span>-F). La gélinotte et le tétras n’ont pas le pied emplumé : l’hiver, la gélinotte porte seulement de petites franges en peigne le long des doigts, et ses doigts marquent.</p>

function part(el, s, first){
  const r=document.createRange();
  if(first){ r.setStart(el,0); r.setEnd(s[0],s[1]); } else { r.setStart(s[0],s[1]+1); r.setEnd(el, el.childNodes.length); }
  const c=el.cloneNode(false); c.appendChild(r.cloneContents());
  if(!first){ c.classList.add('cont'); }
  return c;
}
function splitPara(el, f){
  const st=stops(el); if(st.length<14) return null;
  let lo=0, hi=st.length-1, best=-1;
  while(lo<=hi){ const mid=(lo+hi)>>1; const a=part(el,st[mid],true); f.appendChild(a); syncNotes(f); const ok=!OVER(f); f.removeChild(a); syncNotes(f); if(ok){best=mid;lo=mid+1;} else hi=mid-1; }
  if(best<11) return null;
  if(st.length-best<6) best=st.length-7;
  if(best<11) return null;
  return [part(el,st[best],true), part(el,st[best],false)];
}
function splitTable(tb, f){
  const rows=Array.from(tb.tBodies[0].rows);
  const mk=(rs,kind)=>{ const t=tb.cloneNode(false); const cg=tb.querySelector('colgroup'); if(cg) t.appendChild(cg.cloneNode(true));
    if(kind==='first'){ const cap=document.createElement('caption'); cap.className='tsuite'; cap.textContent='Le tableau continue page suivante'; t.appendChild(cap); }
    t.appendChild(tb.tHead.cloneNode(true)); const b=document.createElement('tbody'); rs.forEach(r=>b.appendChild(r.cloneNode(true))); t.appendChild(b);
    if(kind==='rest') t.classList.add('suite'); return t; };
  let best=0;
  for(let k=1;k<=rows.length;k++){ const t=mk(rows.slice(0,k),'first'); f.appendChild(t); syncNotes(f); const ok=!OVER(f); f.removeChild(t); syncNotes(f); if(ok) best=k; else break; }
  if(best<2) return null;
  return [mk(rows.slice(0,best),'first'), mk(rows.slice(best),'rest')];
}
/* ---------- notes de bas de page ----------
   Chaque cadre a, juste après lui, une zone de notes à deux cases (une par colonne).
   On la resynchronise à chaque essai de remplissage : la note prend sa place dans la
   hauteur du cadre avant qu'on juge si le bloc tient. Si l'appel passe à la page
   suivante, sa note le suit. */
const NOTES={};
document.getElementById('notes').content.querySelectorAll('p.fn').forEach(n=>NOTES[n.dataset.fn]=n);
function noteZone(f, make){
  let z=f.nextElementSibling;
  if(z && z.classList.contains('fnz')) return z;
  if(!make) return null;
  z=document.createElement('div'); z.className='fnz';
  if(getComputedStyle(f).columnCount==='1') z.classList.add('one');
  z.innerHTML='<div class="fnc" data-side="l"></div><div class="fnc" data-side="r"></div>';
  f.after(z); return z;
}
function sideOf(c, f, z){
  if(z.classList.contains('one')) return 'l';
  const fr=f.getBoundingClientRect(), r=c.getBoundingClientRect();
  return (r.left-fr.left) < fr.width/2 ? 'l' : 'r';
}
function syncNotes(f){
  const seen=new Set();
  const calls=Array.from(f.querySelectorAll('sup.fnr')).filter(c=>NOTES[c.dataset.fn] && !seen.has(c.dataset.fn) && seen.add(c.dataset.fn));
  let z=noteZone(f, calls.length>0);
  if(!z) return;
  if(!calls.length){ z.remove(); return; }
  for(let it=0; it<4; it++){
    const want=calls.map(c=>c.dataset.fn+'|'+sideOf(c,f,z)).join(' ');
    const cur=Array.from(z.querySelectorAll('p.fn')).map(n=>n.dataset.fn+'|'+n.parentNode.dataset.side).join(' ');
    if(want===cur) break;
    z.querySelectorAll('.fnc').forEach(c=>c.textContent='');
    want.split(' ').forEach(w=>{ const [id,sd]=w.split('|'); z.querySelector('.fnc[data-side="'+sd+'"]').appendChild(NOTES[id].cloneNode(true)); });
    z.classList.add('on');
  }
}

/* =====================================================================
   Moteur de chapitre (build_chapitre.py). Les fonctions au-dessus
   (OVER, splitPara, splitTable, noteZone, syncNotes) sont celles de
   interieur.tpl.html, recopiées à la construction. Ici : les pages se
   créent à la volée, trois histoires se suivent (texte courant, encadré
   danger, variante d'urgence), les planches pleine page prennent la page
   qui suit leur mention, les demi-planches et les photos flottent au
   premier endroit où elles tiennent, jamais au milieu d'un paragraphe.
   ===================================================================== */
const C = JSON.parse(document.getElementById('meta').textContent);
const BOOK = document.getElementById('book');
const WARN = [];
const PAGES = [];
let P = null;                 // page courante
let pendingPlates = [];       // planches pleine page qui attendent la fin de la page courante
const DSVG = '<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#fff"/><path d="M15.2 10 H18.8 L18.1 20.5 H15.9 Z" fill="#9B2C1E"/><rect x="15.4" y="22.3" width="3.2" height="3.2" fill="#9B2C1E"/></svg>';
const PT = 96/72;

function mkPage(kind, plate){
  const n = PAGES.length + 1, side = n % 2 ? 'recto' : 'verso';
  const el = document.createElement('section'); el.className = 'page ' + side; el.id = 'p' + C.num + '-' + n;
  if(kind !== 'open') el.innerHTML = '<div class="rh"><div class="grp"><span class="fo">' + C.num + '-' + n + '</span><span class="ch">' + C.num + ' · ' + C.title + '</span></div><span class="to">' + C.tome + '</span></div>';
  const bl = document.createElement('div'); bl.className = 'block'; el.appendChild(bl);
  if(kind === 'open') bl.innerHTML = document.getElementById('open').innerHTML;
  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
