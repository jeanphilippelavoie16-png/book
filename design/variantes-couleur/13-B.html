<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>13 — Eau : puiser, filtrer, désinfecter — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t4       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}
.vA p.step .sn{color:var(--tsq)}
.vA p.li::before{background:var(--tsq)}
.vA thead th{border-top-color:var(--ta)}
.vA tbody tr:last-child td{border-bottom-color:var(--ta)}
.vA .lad li{border-color:var(--tsq)}
.vA .lad li.on{background:var(--tsq);color:#fff}
.vA .lad li.on.d{background:var(--red);border-color:var(--red)}
.vA .open-top{border-bottom-color:var(--ta)}
.vA .open-title{border-bottom-color:var(--ta)}
.vA .open-title .num{color:var(--tsq)}
.vA .toc .n{border-color:var(--tsq)}
.vA .toc li.d .n{border-color:var(--red)}
.vA .lieu .opts span{border-color:var(--tsq)}
.vA .lieu .opts span.on{background:var(--tsq);border-color:var(--tsq)}
.vA .encadre{border-color:var(--ta)}

<template id="open"><header class="open"><div class="open-top"><span>Tome 1 · Tenir</span><span>Chapitre</span></div><div class="open-title"><div class="num">13</div><h1>Eau : puiser, filtrer, désinfecter</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span>Chalet</span><span class="on">Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">À la maison, l’eau arrive au robinet et le problème est sa qualité : un avis d’ébullition, une conduite qui casse, du plomb dans l’entrée de service. Au chalet, il n’y a pas de robinet qui tienne tout seul : le problème est toute la chaîne, du lac au bidon. Les sections 5-A à 5-I sont celles du chalet ; la section 5-J est celle de la maison.</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Trois gestes dans l’ordre — décanter, filtrer, désinfecter — qui rendent buvable l’eau d’un lac, d’un ruisseau ou d’un puits, et dont le dernier seul est absolu : une eau portée à gros bouillons pendant au moins 1 minute est débarrassée de tous les micro-organismes pathogènes. La durée monte à <strong>cinq minutes</strong> là où vivent le castor, le rat musqué ou le lièvre — la tularémie, et presque tous les lacs d’ici. L’arbitrage entre ces deux durées est rendu à la section 5-E.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h3 class="sub">C’est le bon choix</h3>
<p class="p0 lab kh"><strong class="runin">À la maison, au village :</strong></p>
<p class="li">Avis d’ébullition. Il s’émet notamment pour un « entretien, réparation ou bris d’équipement du réseau de distribution pouvant, par exemple, mener à une baisse de pression ou à une intrusion de microorganismes ». Le mécanisme est là : une conduite sous pression repousse ce qui l’entoure ; une conduite qui perd sa pression aspire l’eau du sol par ses joints. L’avis arrive donc souvent <strong>avant</strong> le moindre résultat de laboratoire, et c’est ce qui fait sa valeur.</p>
<p class="li">Baisse de pression franche au robinet pendant des travaux ou un incendie de quartier, même sans avis émis. L’analyse vient après coup ; la famille boit pendant.</p>
<p class="li">Panne d’Hydro assez longue pour arrêter les pompes de l’aqueduc (<span class="ref">ch. 4</span>).</p>
<p class="li">Eau transportée dans un contenant dont on ne connaît pas l’historique. C’est le contenant qui est suspect, pas l’eau qu’on y a versée.</p>
<p class="p0 lab kh"><strong class="runin">Au chalet :</strong></p>
<p class="li">Eau de surface, toujours et sans exception : lac, ruisseau, étang, neige fondue, glace de lac. Le bassin versant d’un chalet boréal contient du castor (<em>Castor canadensis</em>), du rat musqué (<em>Ondatra zibethicus</em>) et de l’orignal (<em>Alces americanus</em>), et ces trois-là défèquent en amont de la prise d’eau. Le castor et le rat musqué sont des réservoirs reconnus de <em>Giardia lamblia</em>.</p>
<p class="li">Puits jamais analysé : il se traite comme un puits positif, pas comme un puits négatif. Une eau de puits qui n’a jamais vu de laboratoire n’est pas une eau réputée bonne, c’est une eau inconnue.</p>
<p class="li">Puits après une crue, une inondation, un dégel violent, des travaux d’excavation à proximité, ou le remplacement d’une pompe.</p>
<p class="li">Panne prolongée où la pompe ne tourne plus et où l’on redescend puiser à la main.</p>
<h3 class="sub">C’est un mauvais choix</h3>
<p class="li"><strong>Contamination chimique.</strong> L’ébullition « n’est généralement d’aucune utilité dans la gestion d’une contamination chimique (p. ex. plomb) ». Pire : l’eau s’évapore, le contaminant reste, la concentration monte. Bouillir une eau chargée en nitrate ou en arsenic la rend plus dangereuse, pas moins. Le cas courant à la maison est justement le plomb de l’entrée de service : le réflexe de faire bouillir « pour être sûr » est exactement le mauvais geste, et la réponse est à la section 5-J.</p>
<p class="li"><strong>Eau salée.</strong> Aucune des trois étapes n’enlève un sel dissous. Le fleuve, à la hauteur de la Côte-Nord, est de l’eau de mer pour ce qui nous concerne : de 27 à 29 g de sels dissous par litre, un peu moins en surface au printemps, quand la fonte et la crue l’adoucissent. Seules la distillation et l’osmose inverse enlèvent le sel : les deux seules méthodes qui font passer l’eau ailleurs que le sel, au lieu de retenir ce qui est plus gros qu’un pore.</p>
<p class="li"><strong>Chloration seule d’une eau de surface.</strong> « L’efficacité du chlore seul envers le Cryptosporidium est presque nulle » — voir la section 8.</p>
<p class="li"><strong>Chloration d’une eau froide.</strong> Le chlore ralentit avec le froid dans des proportions qui rendent le dosage domestique illusoire : contre les kystes de <em>Giardia</em>, le CT requis est « inférieur à 12 pour une eau à 25 °C, mais varierait de 65 à 360 pour désinfecter une eau de 3 à 5 °C ». Un lac boréal est à 4 °C une bonne partie de l’année.</p>
<p class="li"><strong>Chloration d’une eau trouble.</strong> Les particules abritent les micro-organismes et consomment le chlore avant qu’il les atteigne.</p>
<p class="li"><strong>Eau de pluie ou de neige recueillie sous le vent d’un feu, d’un moteur ou d’une cheminée.</strong> Les suies ne s’enlèvent ni à l’ébullition ni à la javel.</p>
<p class="li"><strong>Fonte de retombées.</strong> Ni l’ébullition ni la filtration ordinaire n’enlèvent les radionucléides — voir le chapitre 6.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0">La chaleur détruit les protéines des micro-organismes bien avant 100 °C : <em>E. coli</em> tombe à 70 °C en 1 minute, le virus de l’hépatite A à 85 °C en 1 minute, <em>Giardia lamblia</em> à 70 °C en 10 minutes, et les oocystes de <em>Cryptosporidium</em> demandent « une température de l’ordre de 73 °C […] pour les détruire en une minute alors qu’à 65 °C, le temps requis était de 5 minutes ». Le gros bouillon n’est pas une exigence biologique, c’est un indicateur visuel : il dit qu’on est à 100 °C sans thermomètre, donc très au-delà de toutes ces cibles.</p>
<p>Le chlore, lui, doit entrer en contact avec l’organisme et l’oxyder. Tout ce qui s’interpose — argile en suspension, matière organique, tanins de tourbière — le consomme ou l’abrite. Le froid ralentit la réaction. C’est pourquoi une dose de chlore se donne toujours avec un temps de contact et une température, jamais seule.</p>
<p>La filtration est un tamis mécanique : le pore retient ce qui est plus gros que lui. Un kyste de <em>Giardia</em> mesure environ 8 × 14 µm, un oocyste de <em>Cryptosporidium</em> de 4 à 6 µm, une bactérie comme <em>E. coli</em> 0,5 × 3 à 8 µm, un virus 0,03 µm. Un filtre à 1 µm arrête les deux protozoaires et la plupart des bactéries ; aucun filtre portatif courant n’arrête les virus.</p>
<p>Aucune des trois étapes n’enlève ce qui est dissous. Sel, arsenic, uranium, nitrate, manganèse, plomb : ils traversent le tissu, traversent la céramique, résistent au chlore, et l’ébullition les concentre. C’est pour ça qu’une eau de puits se juge par une analyse en laboratoire, pas par son goût.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Chaudière de puisage avec corde</td><td>1 de 15 à 20 L</td><td>Seau de plastique de qualité alimentaire</td><td>Oui</td></tr><tr><td class="c-item">Contenants de décantation</td><td>2 de 20 L, ou 1 baril de 200 L (45 gal)</td><td>N’importe quel contenant alimentaire à couvercle</td><td>Oui</td></tr><tr><td class="c-item">Tissu de préfiltration, coton serré</td><td>3 ou 4 carrés</td><td>Taie d’oreiller, filtre à café, bas de nylon</td><td>Oui</td></tr><tr><td class="c-item">Filtre à pores de 1 µm ou moins</td><td>1 + 2 cartouches de rechange</td><td>Bougie de céramique de campeur, qui a l’avantage de se récurer et de repartir ; à défaut, le filtre à sable et charbon de la section 9, qui clarifie sans désinfecter</td><td><span class="non">NON</span> <span class="negx">si on veut boire sans bouillir</span></td></tr><tr><td class="c-item">Marmite à couvercle</td><td>8 à 12 L</td><td>N’importe quel chaudron avec couvercle ; sinon un contenant qui ne va pas au feu, chauffé aux pierres (<span class="ref">§9</span>), mais on perd la preuve du gros bouillon</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Source de chaleur indépendante du réseau</td><td>—</td><td>Poêle à bois (<span class="ref">ch. 15</span>), réchaud (<span class="ref">ch. 14</span>), feu dehors sur deux pierres</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Eau de Javel non parfumée, 5,25 %, sans additif ni parfum ni agent épaississant</td><td>4 L, datée et renouvelée</td><td>Hypochlorite de calcium granulaire, qui se garde des années au lieu de mois, se dilue en solution mère et se dose à la bandelette (<span class="ref">§9</span>) ; sinon la marmite</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Compte-gouttes propre ou seringue de 1 mL</td><td>2</td><td>N’importe quel embout qui fait des gouttes régulières — paille coupée en biseau, tige de clou, tube de boyau à essence. Ce qui compte n’est pas l’instrument, c’est de connaître le volume de <strong>sa</strong> goutte : compter une fois combien il en faut pour remplir un contenant gradué, et écrire le nombre sur le manche</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Bandelettes de chlore libre, plage 0 à 200 mg/L</td><td>1 boîte</td><td>Pour l’eau de boisson, l’odeur, qui dit s’il reste du chlore mais jamais combien. Pour la solution mère d’hypochlorite et pour le choc du puits, rien : c’est là que la bandelette est irremplaçable, parce qu’on dose une poudre de titre inconnu</td><td><span class="non">NON</span> <span class="negx">pour la désinfection du puits</span></td></tr><tr><td class="c-item">Thermomètre de cuisson 0-120 °C</td><td>1</td><td>Ébullition visible</td><td>Oui</td></tr><tr><td class="c-item">Contenants d’entreposage opaques, alimentaires, à goulot étroit</td><td>100 L au total</td><td>Bidons de 20 L ; à défaut, n’importe quel fût alimentaire peint en noir ou gardé dans le noir, et un bout de boyau pour siphonner plutôt qu’une louche</td><td>Oui</td></tr><tr><td class="c-item">Analyse en laboratoire</td><td>2 microbiologiques + 1 chimique par année</td><td>Aucune pour la chimie : arsenic, uranium, nitrate et manganèse ne se voient, ne se sentent ni ne se goûtent. Faute d’analyse, la règle de remplacement est de traiter le puits comme un puits positif et de ne pas en faire de biberon (<span class="ref">§8</span>)</td><td><span class="non">NON</span> <span class="negx">si le chalet a un puits</span></td></tr><tr><td class="c-item">Avertisseur de monoxyde de carbone à pile</td><td>1 par niveau habité</td><td>Aucune. Aucun sens humain ne détecte le CO, et la vigilance ne compense pas un gaz sans odeur</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Pompe 12 V et boyau</td><td>1</td><td>Puisage à la chaudière ; dans un tubage de puits trop étroit pour une chaudière, la buse fabriquée de la section 9</td><td>Oui</td></tr></tbody></table>
<p class="p0">Le filtre est marqué non négociable pour un seul usage : boire sans bouillir. Si l’on accepte de bouillir chaque litre, il devient un confort. Ce qui n’est jamais négociable, c’est d’avoir <strong>deux</strong> moyens de désinfecter, parce que l’un des deux tombera en panne au mauvais moment : la marmite et la javel, ou la marmite et le filtre.</p>
<p>À la maison, la moitié de ce tableau ne sert pas. Il reste la marmite, la javel datée, les contenants d’entreposage et les bandelettes — et le filtre, qui y joue un autre rôle qu’au chalet. Au chalet, il tamise : il retient ce qui est plus gros que son pore. À la maison, contre le plomb, il n’y a rien à tamiser, parce que le plomb est dissous — il faut un filtre dont le média <strong>fixe</strong> le métal au passage, ce que tous les filtres à eau ne font pas. Un même boîtier peut donc être excellent contre les protozoaires et sans aucun effet sur le plomb. C’est la fiche du média qu’on lit, pas le prix. Les quantités à garder d’avance ne sont pas ici : elles sont au chapitre d’achat.</p>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — Choisir la prise d’eau</h3>
<p class="step"><span class="sn">1</span>Puiser <strong>en amont</strong> de tout ce qui vit : camp, fosse septique, enclos, sentier de motoneige, hutte de castor. Une hutte visible dans la baie ne disqualifie pas le lac ; elle disqualifie l’idée de boire sans traiter.</p>
<p class="step"><span class="sn">2</span>Pour un puits, compter la distance aux eaux usées : au moins 30 m d’un système de traitement non étanche, 15 m si le puits est scellé — foré au moins 10 cm plus large que son tubage, et cet espace autour du tubage rempli de bentonite ou de ciment-bentonite sur 5 m de profondeur au moins. Ce qui fait la différence entre les deux chiffres, ce n’est pas la paperasse, c’est le chemin de l’eau : ce bouchon autour du tuyau oblige l’eau de surface à descendre par le sol filtrant au lieu de couler le long du tubage. Voir le chapitre 28 pour l’autre bout du problème.</p>
<p class="step"><span class="sn">3</span>Prendre l’eau à 20 ou 30 cm sous la surface, jamais en raclant le fond : la couche superficielle concentre les pollens et les hydrocarbures, le fond concentre les sédiments.</p>
<h3 class="sub">B — Puiser</h3>
<p class="step"><span class="sn">4</span>Descendre la chaudière lestée, ouverte vers le bas, et la retourner sous l’eau.</p>
<p class="step"><span class="sn">5</span>Si la pompe est entraînée par une génératrice, l’installer dehors, loin des portes et des fenêtres. Jamais dans un bâtiment, un garage, un abri ou sous un auvent. Le mécanisme est à la section 8.</p>
<p class="step"><span class="sn">6</span>Rentrer l’eau brute dans des contenants réservés à l’eau brute, marqués, jamais mélangés avec ceux de l’eau traitée. La recontamination croisée est la façon la plus courante de perdre une journée de travail.</p>
<h3 class="sub">C — Décanter</h3>
<p class="step"><span class="sn">7</span>Laisser reposer sans bouger, couvercle posé, de 12 à 24 h. Le sable tombe en quelques minutes, l’argile et la matière organique fine prennent des heures.</p>
<p class="step"><span class="sn">8</span>Siphonner ou transvaser <strong>par-dessus</strong> le dépôt, sans le remettre en suspension. Sacrifier les deux ou trois derniers centimètres.</p>
<h3 class="sub">D — Filtrer</h3>
<p class="step"><span class="sn">9</span>Préfiltrer à travers trois ou quatre épaisseurs de coton serré. Cette étape ne désinfecte rien ; elle protège le filtre fin et fait durer la cartouche.</p>
<p class="step"><span class="sn">10</span>Passer au filtre à 1 µm. Ce seuil retient les oocystes de <em>Cryptosporidium</em> (4 à 6 µm) et les kystes de <em>Giardia</em> (8 × 14 µm). Il ne retient pas les virus (0,03 µm) : un filtre ne remplace donc jamais une désinfection quand l’eau peut avoir reçu des matières fécales humaines.</p>
<p class="step"><span class="sn">11</span>Viser une eau limpide. La filtration donne son plein rendement — « en moyenne un enlèvement de 3 log » — « lorsque la turbidité de l’eau ne dépasse pas 0,3 UNT ». Sans turbidimètre, le critère de terrain est : aucun voile visible en regardant à travers 20 cm d’eau contre une feuille imprimée. Ce test ne dit pas qu’on est à 0,3 UNT : l’œil ne voit un voile qu’au-dessus d’environ 5 UNT. Une eau limpide à l’œil peut donc être encore à plusieurs fois le seuil — le filtre y travaille, sans la garantie des 3 log.</p>
<h3 class="sub">E — Désinfecter : l’ébullition, méthode de référence</h3>
<p class="step"><span class="sn">12</span>Porter à <strong>gros bouillons</strong> et maintenir <strong>au moins 1 minute</strong>, et <strong>5 minutes</strong> dès que l’eau sort d’un bassin où vivent le castor, le rat musqué ou le lièvre, ou qu’on la boit en forêt sans le reste de la chaîne. Sur la Côte-Nord, ça donne cinq minutes pour toute eau de surface, et une minute pour un puits ou un avis d’ébullition au village. Un frémissement ne compte pas : on chronomètre à partir du moment où la surface roule.</p>
<p class="step"><span class="sn">13</span>Couvrir pendant l’ébullition : on perd moins d’eau et moins de bois.</p>
<p class="step"><span class="sn">14</span>Laisser refroidir dans la même marmite couverte. Ne pas remuer avec une cuillère qui a traîné, ne pas verser dans un contenant non lavé : tout le travail se perd dans les cinq dernières secondes.</p>
<p class="step"><span class="sn">15</span>Le goût plat de l’eau bouillie vient de l’air chassé. Transvaser deux ou trois fois d’un contenant à l’autre le rend potable au palais des enfants.</p>
<p class="p0 ri"><strong class="runin">Une minute ou cinq minutes : l’arbitrage.</strong> Une minute à gros bouillons suffit contre les organismes pathogènes courants de l’eau : le plus coriace, l’oocyste de <em>Cryptosporidium</em>, tombe à 73 °C en une minute, et 100 °C dépasse toutes ces cibles. La tularémie ne change pas ce calcul. Sa bactérie, <em>Francisella tularensis</em>, « survit plusieurs mois dans un environnement humide et froid tel que l’eau » et « résiste également très bien à la congélation », mais pas à la chaleur : dans l’eau, elle meurt en une minute à 56 °C, et il n’en reste aucune de vivante après 45 secondes à 94 °C. Une minute à gros bouillons la tue comme le reste. La consigne pour l’eau bue en forêt, là où la tularémie circule, est pourtant de cinq minutes. <strong>Le livre retient donc cinq minutes partout où la tularémie est présente</strong> — castor, rat musqué, lièvre, soit le bassin versant décrit à la section 2 — parce que c’est la plus haute des deux durées et que les quatre minutes de plus se paient en bois, pas en risque. Le filtre ne remplace pas ces cinq minutes : un pore de 1 µm arrête la plupart des bactéries, pas toutes, et celle-ci est un très petit coccobacille. Devant la tularémie, on bout. Les chapitres 44 (lièvre) et 46 (castor) appliquent la même durée.</p>
<h3 class="sub">F — Désinfecter : la javel, méthode d’appoint</h3>
<p class="step"><span class="sn">16</span>Utiliser de l’eau de Javel <strong>non parfumée</strong>, sans agent épaississant ni détergent. Titre accepté : 5,25 % ou 4 % à 6 %.</p>
<p class="step"><span class="sn">17</span>Dose : « environ 2 gouttes (0,2 millilitre) d’eau de Javel 5,25 % non parfumée à 1 litre ». Soit 20 gouttes, ou 2 mL, pour 10 L.</p>
<p class="step"><span class="sn">18</span>Brasser et laisser reposer <strong>30 minutes</strong>. Ces 30 minutes valent pour une eau à plus de 20 °C. Une eau à 8 °C sortie du lac ne remplit pas cette condition.</p>
<p class="step"><span class="sn">19</span>Eau trouble, colorée ou très froide : doubler la dose, soit 4 gouttes par litre, et allonger le temps de contact. Le doublement ne rattrape ni une eau franchement trouble — de 1 à 10 UNT, le chlore devient huit fois moins efficace — ni le <em>Cryptosporidium</em> : devant une eau de lac froide et colorée, <strong>bouillir plutôt que chlorer</strong>.</p>
<p class="step"><span class="sn">20</span>Après 30 minutes, l’eau doit garder une légère odeur de chlore. Si elle n’en a plus, la matière organique a tout consommé : redoser une fois et attendre encore 30 minutes. Si elle n’en a toujours pas, changer de méthode.</p>
<p class="step"><span class="sn">21</span>La javel perd son titre en entreposage, d’autant plus vite qu’il fait chaud : à l’abri de la chaleur et du soleil, elle tient environ un an depuis sa fabrication, puis se dégrade de plus en plus vite. Dater le contenant à l’achat, le garder au frais et à l’obscurité, et le remplacer avant l’année — le temps passé en magasin compte aussi — par principe et non parce qu’il est vide.</p>
<p class="p0 ri"><strong class="runin">Quand l’eau est froide et qu’il n’y a pas de feu.</strong> C’est le trou de la chloration, et il se bouche par le temps de contact, pas par la dose. Pour l’iode, l’échelle est explicite : « cinq gouttes de teinture d’iode à 2 % ou un comprimé […] par litre d’eau », puis 30 minutes à plus de 20 °C, <strong>60 minutes entre 15 et 20 °C, et 120 minutes entre 5 et 15 °C</strong>. Deux heures d’attente pour une eau de lac boréale, mais deux heures qui sont documentées, alors que la consigne de la javel en eau froide — doubler la dose — ne donne pas de durée. L’iode est contre-indiqué chez « les femmes enceintes (goitre néonatal) », chez « les voyageurs avec une maladie thyroïdienne, même si contrôlée par médication » et en cas d’allergie connue ; et « l’utilisation quotidienne d’iode à des dosages élevés devrait se limiter à une courte période, soit moins d’un mois ». Ce n’est donc pas une méthode de fond : c’est un dépannage de quelques jours, et c’est pour ça que la javel et la marmite restent les deux moyens du chalet. L’iode est un halogène comme le chlore et travaille par la même oxydation, à laquelle la paroi de l’oocyste de <em>Cryptosporidium</em> résiste : aux doses qu’on peut boire, l’iode ne l’inactive pas plus que le chlore, même en allongeant le contact. Contre ce parasite, il reste la chaleur ou le filtre à 1 µm.</p>
<p class="p0 ri"><strong class="runin">L’ultraviolet.</strong> Un stérilisateur UV couvre « bactéries, virus et protozoaires », donc plus large que le chlore et que le filtre. Il a deux défauts qu’il faut connaître avant d’y mettre de l’argent : il demande du courant, et « les particules dans l’eau peuvent bloquer les rayons ultraviolets et empêcher la désinfection ». Une eau trouble le met hors service sans prévenir, sans odeur ni goût pour le signaler — un UV se place donc toujours après la décantation et la filtration, jamais avant.</p>
<h3 class="sub">G — Entreposer</h3>
<p class="step"><span class="sn">22</span>Contenants alimentaires, opaques, à goulot étroit, remplis à ras bord, bouchés. L’opacité empêche les algues, le goulot étroit empêche les mains. Seule exception au « à ras bord » : un contenant qui risque de geler, dans un hangar, un véhicule ou une remise. L’eau prend de l’expansion en gelant et fend le contenant plein, qui ne se découvre qu’au dégel, vide. Laisser un vide d’air, et coucher le bidon.</p>
<p class="step"><span class="sn">23</span>Étiqueter la date de traitement. Une eau traitée n’est pas stérile et se recontamine par le contenant et par les mains. Durée à respecter : « Conservez l’eau bouillie dans des contenants hermétiques et propres jusqu’à trois jours au réfrigérateur ou pendant 24 heures à la température de la pièce ». Ces 24 heures sont courtes et ce sont elles qui commandent : une eau bouillie la veille et laissée sur le comptoir se rebout, elle ne se boit pas sur la foi qu’elle a déjà été traitée. Une eau chlorée dans les règles tient plus longtemps, parce qu’il lui reste un résiduel (section 9).</p>
<p class="step"><span class="sn">24</span>Réserve visée, deux chiffres officiels qui ne mesurent pas la même chose : <strong>4 L par personne par jour</strong> pour une trousse qui couvre tout, et <strong>6 L pour la consommation plus 6 L pour « la préparation des aliments et l’hygiène personnelle »</strong> quand c’est précisément l’eau qui manque ou qui est contaminée, soit 12 L. Le premier est le plancher de la trousse de 72 heures et il est calculé au chapitre 9 ; le second est la cible quand le problème est l’eau elle-même, et c’est celui de ce chapitre-ci. Pour quatre personnes : 48 L par jour, 144 L pour 72 heures, environ 1 440 L pour un mois. À 20 L par bidon, c’est 72 bidons pour le mois : personne ne stocke ça. Ce qui se stocke, c’est les 72 heures ; le reste se produit chaque jour, et c’est ce débit quotidien — pas le volume total — qui dicte la taille de la marmite et la réserve de bois.</p>
<h3 class="sub">H — Le puits : analyser, puis désinfecter</h3>
<p class="step"><span class="sn">25</span>Tant qu’il y a un laboratoire qui reçoit des échantillons, faire analyser l’eau du puits : c’est le seul geste de ce chapitre qui voit ce qui est dissous. Fréquence : « L’analyse des paramètres microbiologiques devrait se faire au moins deux fois par année et l’analyse des contaminants chimiques devrait être effectuée au moins une fois ». Paramètres chimiques visés : uranium, baryum, arsenic, nitrates/nitrites, fer, fluorures, manganèse.</p>
<p class="step"><span class="sn">26</span>Désinfection choc d’un puits existant : viser une concentration de chlore libre de <strong>50 mg/L</strong> ; pour un puits neuf, <strong>250 mg/L</strong>, avec de l’« eau de Javel non parfumée à 5,25 % ».</p>
<p class="step"><span class="sn">27</span>Calcul de la dose à partir de cette cible : une javel à 5,25 % titre 52 500 mg de chlore par litre. Pour amener 1 000 L d’eau à 50 mg/L, il faut 50 × 1 000 ÷ 52 500 ≈ 0,95 L de javel, soit environ <strong>1 L de javel par 1 000 L d’eau</strong>. Le chiffre difficile n’est pas celui-là : c’est le volume réel d’eau dans le puits et la plomberie.</p>
<p class="step"><span class="sn">28</span>Ce volume se calcule, il ne s’estime pas. La hauteur à utiliser n’est pas la profondeur du puits mais la colonne d’eau, soit « la profondeur du puits moins la profondeur de l’eau » : un puits de 40 m dont le niveau statique est à 12 m porte 28 m d’eau. Le reste est de la géométrie, π r² h :</p>
<table class="tcol nest"><colgroup><col style="width:58.7%"><col style="width:41.3%"></colgroup><thead><tr><th>Diamètre intérieur</th><th>Eau par mètre de colonne</th></tr></thead><tbody><tr><td>100 mm</td><td>7,9 L/m</td></tr><tr><td>150 mm (tubulaire courant)</td><td>17,7 L/m</td></tr><tr><td>900 mm (puits de surface)</td><td>636 L/m</td></tr></tbody></table>
<p class="stepc">Nos 28 m dans un tubage de 150 mm font donc 28 × 17,7 ≈ 495 L, soit environ 0,5 L de javel à 5,25 % pour atteindre 50 mg/L. Le calcul se refait pour n’importe quel diamètre sans table ni outil : le volume par mètre, en litres, c’est le rayon en centimètres au carré, multiplié par 3,14, divisé par 10. Mesurer la colonne avec une ficelle lestée et un nœud, et arrondir vers le bas plutôt que vers le haut « pour être sûr » : une surchloration se paie en purge, et la purge se paie en eau qu’il faut ensuite aller chercher ailleurs.</p>
<p class="step"><span class="sn">29</span>Faire circuler l’eau chlorée dans toute la plomberie en ouvrant chaque robinet jusqu’à ce qu’il sente le chlore, puis fermer. Laisser l’eau reposer dans la plomberie de 12 à 24 heures, et prendre les 24 heures : c’est la plus longue des deux durées et elle ne coûte qu’une nuit de plus sans eau courante.</p>
<p class="step"><span class="sn">30</span>Purger ensuite jusqu’à disparition complète du chlore au robinet, bandelette à l’appui — « une purge prolongée en laissant couler l’eau d’un robinet jusqu’à ce que l’odeur du chlore disparaisse ». Ne pas rejeter cette eau dans le champ d’épuration ni dans un plan d’eau. Le mécanisme : une fosse septique traite les eaux usées par une population bactérienne vivante, et cette eau de purge est dosée pour tuer des bactéries — elle stérilise la fosse, qui cesse de traiter (<span class="ref">ch. 28</span>), et elle fait la même chose au ruisseau. Purger au loin, sur un sol nu, en étalant.</p>
<p class="step"><span class="sn">31</span>Refaire analyser « une semaine suivant la désinfection et quatre semaines plus tard ». Les deux analyses sont nécessaires et ne disent pas la même chose : celle d’une semaine dit si le choc a fonctionné, celle de quatre semaines dit s’il tient. Une désinfection choc traite l’épisode, pas la cause. Un puits qui redevient positif deux fois de suite a un défaut d’étanchéité ou un voisin de contamination, et c’est le puits qu’il faut reprendre.</p>
<h3 class="sub">I — L’hiver</h3>
<p class="step"><span class="sn">32</span>Sous la glace : percer à l’écart des courants et des bouches de ruisseau, là où la glace est la plus épaisse et la plus régulière. La sécurité sur la glace est traitée au chapitre 54 ; elle ne se résume pas à une épaisseur, elle se lit.</p>
<p class="step"><span class="sn">33</span>Garder le trou ouvert avec un couvercle isolé et un matelas de neige plutôt que de le repercer chaque jour.</p>
<p class="step"><span class="sn">34</span>Fondre la neige coûte cher en bois et donne peu : la neige fraîche ne contient que 4 à 10 % d’eau, soit de 10 à 25 L de neige pour un litre. Et la fonte elle-même coûte presque autant de chaleur que de porter ensuite l’eau à ébullition : un litre de neige bouilli demande près de deux fois le bois d’un litre d’eau du lac. La neige tassée et vieillie, et mieux encore la glace, rendent beaucoup plus pour le même effort. Mettre toujours un fond d’eau liquide dans la marmite avant d’y ajouter la neige, sinon le métal surchauffe à sec et la neige brûle au fond avec un goût qui ne part plus.</p>
<p class="step"><span class="sn">35</span>La glace de lac donne plus d’eau que la neige à volume égal et se manipule mieux. Elle exige le même traitement : la glace n’est pas une désinfection.</p>
<p class="step"><span class="sn">36</span>Neige et glace passent par l’ébullition comme le reste. Une hutte de castor à 300 m en amont contamine la glace comme elle contamine l’eau libre.</p>
<h3 class="sub">J — À la maison : l’avis d’ébullition, la coupure, le plomb</h3>
<p class="step"><span class="sn">37</span>Pendant un avis, l’eau du robinet ne se bout pas pour tout : seulement pour ce qui finit dans la bouche. La liste est courte et elle se colle sur l’armoire.</p>
<table class="tcol nest"><colgroup><col style="width:45.3%"><col style="width:54.7%"></colgroup><thead><tr><th>Exige l’eau bouillie</th><th>Ne l’exige pas</th></tr></thead><tbody><tr><td>Boire, et les breuvages</td><td>« se laver les mains, à condition d’utiliser du savon »</td></tr><tr><td>« préparer le lait maternisé, les biberons »</td><td>« prendre un bain ou une douche, à condition de ne pas avaler de l’eau »</td></tr><tr><td>« laver les légumes et les fruits qui se mangent crus »</td><td>« laver la vaisselle avec du détergent »</td></tr><tr><td>« faire des glaçons »</td><td>« laver les vêtements »</td></tr><tr><td>« vous brosser les dents »</td><td>Cuisson des plats qui bouillent longtemps</td></tr></tbody></table>
<p class="stepc">La ligne du bain suppose un adulte. Un enfant de 4 ans avale l’eau du bain, boit au gant de toilette et se rince la bouche au robinet par habitude : pendant un avis, c’est le robinet de la salle de bain qu’on ferme et un verre d’eau bouillie qu’on laisse à côté de la brosse à dents.</p>
<p class="step"><span class="sn">38</span>La durée, ici, est <strong>une</strong> minute à gros bouillons, pas cinq : « Faites bouillir l’eau du robinet au moins une minute à gros bouillons ». Les cinq minutes de la section 5-E visent la tularémie d’une eau de surface prise sur le territoire, pas une eau traitée par une usine puis rendue douteuse par une baisse de pression.</p>
<p class="step"><span class="sn">39</span>Conserver l’eau bouillie « jusqu’à trois jours au réfrigérateur ou pendant 24 heures à la température de la pièce », dans des contenants hermétiques et propres. Bouillir le matin pour la journée fonctionne ; bouillir le dimanche pour la semaine, non.</p>
<p class="step"><span class="sn">40</span>Deux consignes divergent, et la divergence se tranche par le mécanisme, pas par la sévérité : l’une interdit l’eau contaminée pour laver la vaisselle et se laver les mains, l’autre l’autorise <strong>avec du savon ou du détergent</strong>. C’est la condition qui fait toute la différence — le savon décolle les organismes de la peau et le rinçage les emporte, ce que l’eau seule ne fait pas. Sans savon, la position sévère est la bonne ; avec savon, la souple. Ce qui reste indiscutable des deux côtés, c’est la bouche : rien de non bouilli n’y entre.</p>
<p class="step"><span class="sn">41</span>À la levée de l’avis, la plomberie de la maison contient encore l’eau de l’avis. Faire couler chaque robinet froid, jeter la glace faite par le congélateur pendant l’épisode, vider et rincer le réservoir de la machine à glaçons et la carafe filtrante, changer la cartouche si elle a filtré de l’eau sous avis.</p>
<p class="step"><span class="sn">42</span><strong>Le plomb, quand la maison est vieille.</strong> « Des entrées de service en plomb ont été installées dans des maisons unifamiliales et des immeubles de moins de 8 logements, particulièrement entre 1940 et 1955 et même jusque dans les années 1970 ». Le seuil est de 5 µg/L, soit 0,005 mg/L : « la concentration de plomb à ne pas dépasser dans l’eau potable ». Une maison bâtie hors de cette période peut encore avoir des soudures ou de la robinetterie au plomb, alors la seule réponse ferme est l’analyse. Ce n’est pas un problème d’eau de l’aqueduc, c’est un problème de tuyau : le plomb se dissout dans l’eau qui stagne la nuit dans l’entrée de service. Quatre gestes, aucun ne coûte rien :</p>
<p class="li l2">« laisser couler l’eau du robinet quelques minutes après qu’elle soit devenue froide (fraîche l’été) avant de la boire » — le matin et au retour du travail. Une chasse d’eau, une douche ou un lave-vaisselle font la même purge.</p>
<p class="li l2">« Pour la préparation des aliments, des préparations commerciales pour nourrissons et des breuvages, utilisez seulement l’eau froide du robinet ». L’eau chaude fait sortir davantage de plomb et d’autres métaux de la plomberie.</p>
<p class="li l2">« Enlevez et nettoyez régulièrement l’aérateur (petit filtre) placé dans le bec du robinet » : les particules de plomb s’y accumulent.</p>
<p class="li l2">Une carafe ou un filtre de robinet, à condition que son média soit fait pour <strong>réduire le plomb</strong> et pas seulement pour clarifier l’eau et en corriger le goût. Un filtre à sédiments, si fin soit-il, ne fait rien contre un métal dissous : il n’y a rien à tamiser.</p>
<p class="stepc">« Les enfants de moins de 6 ans et les femmes enceintes (pour l’enfant à naître) sont […] plus sensibles aux effets du plomb » — donc les deux enfants de la maison. Et pour ce contaminant-là, on ne bout pas : voir la section 8.</p>
<p class="step"><span class="sn">43</span><strong>Quand l’eau ne coule plus du tout</strong> — conduite gelée, bris majeur, pompes du réseau arrêtées par une panne. Cible de réserve : « six litres d’eau par personne pour la consommation » plus « six litres d’eau supplémentaires pour la préparation des aliments et l’hygiène personnelle », soit 48 L par jour pour la famille. La réserve de la maison couvre l’événement court ; si la coupure s’étire, c’est la bascule du chapitre 2 qui s’applique, et le chalet a de l’eau parce qu’il a un lac et un poêle, pas parce qu’il a un réseau.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:16.1%"><col style="width:16.3%"><col style="width:39.0%"><col style="width:28.6%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">Avant de puiser</td><td>Position de la prise par rapport aux eaux usées</td><td>≥ 30 m d’un système non étanche, ou 15 m si le puits est scellé (bouchon de bentonite de 5 m autour du tubage)</td><td>Déplacer la prise ou traiter l’eau comme une eau de surface contaminée</td></tr><tr><td class="c-item">Après décantation</td><td>Dépôt au fond, limpidité</td><td>Aucun voile visible à travers 20 cm d’eau — ce qui veut dire moins d’environ 5 UNT, pas 0,3</td><td>Prolonger le repos de 12 h, puis préfiltrer</td></tr><tr><td class="c-item">Avant filtration fine</td><td>Turbidité</td><td>≤ 0,3 UNT pour un enlèvement de 3 log</td><td>Préfiltrer encore ; sinon bouillir au lieu de filtrer</td></tr><tr><td class="c-item">Pendant l’ébullition</td><td>Aspect de la surface, chronomètre</td><td>Gros bouillons, ≥ 1 min chronométrée ; <strong>5 min</strong> pour toute eau de surface d’un bassin à castors, rats musqués ou lièvres — voir 5-E</td><td>Recommencer le chronométrage à zéro</td></tr><tr><td class="c-item">Avec thermomètre, si l’on économise le bois</td><td>Température tenue</td><td>≥ 73 °C pendant 1 min détruit les oocystes de <em>Cryptosporidium</em> ; 65 °C exige 5 min. Ne remplace pas les 5 min à gros bouillons sur un bassin à castors</td><td>Prolonger la durée ou monter la température</td></tr><tr><td class="c-item">Chloration — température de l’eau</td><td>Thermomètre dans le seau</td><td>&gt; 20 °C pour que les 30 min valent</td><td>Bouillir plutôt que chlorer</td></tr><tr><td class="c-item">Chloration — temps de contact</td><td>Montre</td><td>30 min</td><td>Attendre ; ne pas raccourcir</td></tr><tr><td class="c-item">Chloration — résiduel</td><td>Odeur, ou bandelette de chlore libre</td><td>Odeur de chlore encore perceptible à 30 min</td><td>Redoser 2 gouttes/L, attendre 30 min de plus</td></tr><tr><td class="c-item">Désinfection du puits</td><td>Chlore libre dans l’eau du puits</td><td>50 mg/L (puits existant), 250 mg/L (puits neuf)</td><td>Ajouter de la javel et remesurer</td></tr><tr><td class="c-item">Volume à chlorer</td><td>Colonne d’eau × section du tubage</td><td>Colonne = profondeur du puits moins profondeur de l’eau ; 17,7 L/m pour un tubage de 150 mm, ou rayon en cm au carré × 3,14 ÷ 10 pour tout autre diamètre</td><td>Recalculer : une dose posée sur un volume deviné ne vaut rien</td></tr><tr><td class="c-item">Contact dans la plomberie</td><td>Durée</td><td>12 à 24 h — retenir 24 h</td><td>Prolonger</td></tr><tr><td class="c-item">Purge après le choc</td><td>Chlore libre au robinet</td><td>Plus rien de détectable, ni à la bandelette ni à l’odeur</td><td>Continuer à purger avant tout usage</td></tr><tr><td class="c-item">Après une désinfection choc</td><td>Analyses de contrôle</td><td>Une à 1 semaine, une à 4 semaines</td><td>Les deux, pas une seule : la première dit si le choc a marché, la seconde s’il tient</td></tr><tr><td class="c-item">Eau bouillie mise de côté</td><td>Âge de l’eau dans le contenant</td><td>3 jours au réfrigérateur, 24 h à la température de la pièce</td><td>Rebouillir. Ne pas rallonger un vieux bidon avec de l’eau fraîche</td></tr><tr><td class="c-item">Deux fois l’an</td><td>Analyse microbiologique</td><td><em>E. coli</em> : « Aucun microorganisme détectable par 100 mL »</td><td>Avis d’ébullition maison, désinfection choc, nouvelle analyse</td></tr><tr><td class="c-item">Une fois par période d’usage</td><td>Analyse chimique, en mg/L</td><td>Nitrate 10 en azote ou 45 en nitrate ; nitrite 1 en azote ou 3 en nitrite ; arsenic 0,010 ; uranium 0,02 ; fluorure 1,5 ; plomb 0,005 ; baryum 2,0</td><td>Distillation ou osmose inverse pour l’eau de boisson, ou une autre source. Rien d’autre du chapitre n’y touche</td></tr><tr><td class="c-item">Une fois par période d’usage</td><td>Manganèse</td><td>0,12 mg/L ; valeur guide 0,06 mg/L pour les nourrissons ; taches sur la lessive dès 0,02 mg/L</td><td>Au-dessus de 0,12 mg/L : pas d’eau du puits pour un nourrisson</td></tr><tr><td class="c-item">Avant l’hiver</td><td>Réserve traitée</td><td>4 L par personne par jour pour la trousse (<span class="ref">ch. 9</span>) ; 6 L + 6 L par personne par jour quand c’est l’eau qui manque, soit 48 L/jour pour quatre</td><td>Compléter avant que le lac prenne</td></tr><tr><td class="c-item">Maison d’avant les années 1970</td><td>Purge du robinet avant de boire</td><td>Laisser couler « quelques minutes après qu’elle soit devenue froide » ; plomb ≤ 0,005 mg/L à l’analyse</td><td>Purger plus longtemps, eau froide seulement, filtre dont le média fixe le plomb, faire analyser</td></tr><tr><td class="c-item">À chaque achat de javel</td><td>Date sur le contenant</td><td>Moins d’un an depuis la fabrication, gardée au frais et à l’obscurité ; remplacer avant l’année</td><td>Remplacer même si le contenant est plein</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:30.0%"><col style="width:28.6%"><col style="width:41.4%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Analyse positive à <em>E. coli</em></td><td>Contamination fécale : fosse, ruissellement, tubage percé</td><td>Eau non potable. Bouillir tout usage de bouche, désinfecter le puits, réanalyser. Ne pas se fier au goût</td></tr><tr><td class="c-item">Coliformes totaux présents, <em>E. coli</em> absent</td><td>Défaut d’étanchéité, intrusion d’eau de surface</td><td>Inspecter couvercle et tubage, désinfecter, réanalyser</td></tr><tr><td class="c-item">Diarrhée qui s’installe 3 à 25 jours après avoir bu, médiane 7 à 10 jours</td><td>Giardiase (<em>Giardia lamblia</em>)</td><td>Traiter et réhydrater (<span class="ref">ch. 27</span>). Chercher le castor ou le rat musqué en amont (<span class="ref">ch. 46</span>). Passer à l’ébullition</td></tr><tr><td class="c-item">Diarrhée malgré une eau chlorée dans les règles</td><td><em>Cryptosporidium</em> : le chlore seul est presque sans effet</td><td>Bouillir, ou filtrer à 1 µm. La chloration ne reviendra pas comme méthode unique</td></tr><tr><td class="c-item">Eau claire au robinet qui brunit après quelques minutes à l’air</td><td>Fer ou manganèse dissous qui s’oxyde</td><td>Analyse chimique. Comparer au seuil de 0,12 mg/L pour le manganèse</td></tr><tr><td class="c-item">Taches noires sur la lessive et la porcelaine</td><td>Manganèse au-dessus de 0,02 mg/L</td><td>Analyse. Seuil esthétique, pas encore sanitaire — mais on veut savoir où on est</td></tr><tr><td class="c-item">Goût salé</td><td>Intrusion d’eau salée, ou sel de voirie</td><td>Rien dans ce chapitre ne l’enlève. Distillation, osmose inverse, ou autre source</td></tr><tr><td class="c-item">Filtre à 1 µm colmaté en quelques jours</td><td>Turbidité trop élevée en amont</td><td>Décanter plus longtemps et préfiltrer mieux. Une bougie de céramique se récure (<span class="ref">§9</span>) ; une cartouche plissée, non — la brosse ouvre le pli et le filtre laisse tout passer sans le dire</td></tr><tr><td class="c-item">Filtre qui se met à couler beaucoup plus vite qu’avant, sans qu’on l’ait nettoyé</td><td>Fêlure de la céramique ou pli crevé. Le débit est le seul témoin : l’eau sort limpide et non filtrée</td><td>Mettre la bougie au rebut. Une céramique fendue ne se répare pas : la colle bouche le pore autour et laisse la fissure ouverte</td></tr><tr><td class="c-item">Javel qui ne sent plus rien à l’ouverture du contenant</td><td>Perte de titre</td><td>Remplacer. Un dosage calculé sur un titre imaginaire ne désinfecte rien</td></tr><tr><td class="c-item">Bandelette à zéro 30 minutes après le dosage</td><td>Demande en chlore de la matière organique</td><td>Redoser une fois. Si ça recommence, bouillir</td></tr><tr><td class="c-item">Eau bouillie qui garde un goût métallique ou amer</td><td>Contaminant chimique, que l’ébullition a concentré</td><td>Cesser d’utiliser cette source. Analyse chimique</td></tr><tr><td class="c-item">Neige fondue au goût de fumée ou de suie</td><td>Retombées de combustion</td><td>Ne pas boire. Prélever la neige au vent du chalet, sous la croûte de surface</td></tr><tr><td class="c-item">Contenant d’eau traitée qui développe un film glissant sur les parois</td><td>Biofilm : le contenant est devenu la source de contamination</td><td>Vider, laver, désinfecter le contenant, recommencer</td></tr><tr><td class="c-item">Aucun signe, aucun goût, aucune couleur — maison desservie par l’aqueduc, bâtie entre 1940 et les années 1970</td><td>Entrée de service en plomb possible. Le plomb ne se voit pas, et l’ébullition le concentre</td><td>Purger le robinet froid avant de boire, eau froide seulement pour les biberons, faire analyser (<span class="ref">§5-J</span>)</td></tr><tr><td class="c-item">Bidon de réserve retrouvé vide ou fendu au printemps</td><td>Rempli à ras bord et laissé geler : l’eau a pris de l’expansion et a ouvert le contenant</td><td>Réserve à garder hors gel, ou vide d’air et bidon couché</td></tr></tbody></table>
