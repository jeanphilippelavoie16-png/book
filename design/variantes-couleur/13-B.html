<p class="pt"><span class="pn">1</span><strong class="plead">La génératrice, la pompe à essence, le barbecue et le réchaud ne rentrent jamais.</strong> Ni dans la maison, ni dans le chalet, ni dans le garage, ni dans l’appentis, ni sous un auvent, ni dans un abri de toile, même porte ouverte, même cinq minutes. Le mécanisme : le monoxyde de carbone est un gaz « toxique qui ne se voit pas et ne se sent pas. Il n’irrite pas les yeux ni les voies respiratoires ». Il n’y a donc <strong>aucun signal d’alarme</strong> avant les symptômes : « maux de tête ; fatigue ; nausées ; vomissements ; étourdissements », qui peuvent apparaître « dans les minutes suivant l’exposition ». Quelqu’un qui s’endort n’a plus de symptômes à ressentir. « Seul un avertisseur de monoxyde de carbone peut détecter la présence de ce gaz et vous la signaler ». La génératrice va dehors, le plus loin possible des portes et des fenêtres.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Une eau contaminée a l’apparence, l’odeur et le goût d’une eau propre.</strong> Il faut 10 kystes de <em>Giardia</em> pour infecter quelqu’un : 10 objets de 8 µm dans un litre. Aucun sens humain ne détecte ça. Un lac clair qui sent bon n’est pas une information. La seule information, c’est l’analyse ou le traitement.</p>
<p class="pt"><span class="pn">3</span><strong class="plead">Le chlore ne protège pas contre le Cryptosporidium.</strong> « L’efficacité du chlore seul envers le Cryptosporidium est presque nulle » : le CT requis atteint 7 000 mg-min/L, une valeur qu’aucune chloration domestique n’approche. Le mécanisme est la paroi de l’oocyste, qui résiste à l’oxydation. Une eau de lac traitée à la javel et bue sans autre étape est une eau non traitée contre ce parasite-là. Contre lui, il n’y a que la chaleur ou un filtre à 1 µm.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">Bouillir une eau chimiquement contaminée la rend pire.</strong> L’ébullition « n’est généralement d’aucune utilité dans la gestion d’une contamination chimique (p. ex. plomb) », et comme une partie de l’eau part en vapeur, ce qui reste est plus concentré qu’au départ. Deux cas, un par lieu.</p>
<p class="pt cont0">Au chalet, c’est le nitrate du puits : le seuil à ne pas dépasser est de 10 mg/L en azote, soit 45 mg/L en nitrate, et il est fixé là précisément pour protéger les nourrissons. Le mécanisme : « la toxicité des nitrates résulte de leur transformation en nitrites », ceux-ci « peuvent réagir avec le fer de l’hémoglobine des globules rouges et entraîner la formation subséquente de méthémoglobine », et « la méthémoglobine est une forme d’hémoglobine dans laquelle le fer est présent sous forme oxydée ou ferrique incapable de transporter l’oxygène ». Le cœur pompe, les poumons se remplissent, et l’oxygène ne se rend plus. « La méthémoglobinémie provoquée par les nitrates dans l’eau de boisson a principalement été observée chez les enfants de moins de 3 mois »<sup class="fnr" data-fn="13-1">1</sup>. Un puits jamais analysé ne sert pas à préparer un biberon, et bouillir son eau pour « la rendre sûre » monte la concentration de nitrate au lieu de la baisser.</p>
<p class="pt cont0">À la maison, c’est le plomb de l’entrée de service, avec le même piège exactement : le geste qui rassure est celui qui empire. La réponse est la purge du robinet froid et un filtre dont le média fixe le plomb, jamais la marmite (<span class="ref">§5-J</span>).</p>
<p class="pt"><span class="pn">5</span><strong class="plead">L’eau de Javel ne se mélange à rien.</strong> Ni vinaigre, ni détartrant, ni nettoyant à cuvette, ni ammoniaque, ni urine. Le mécanisme : un acide libère le chlore de l’hypochlorite sous forme de gaz, et l’ammoniaque forme des chloramines ; les deux brûlent les voies respiratoires, peuvent tuer, et c’est pire dans un espace fermé. Ce qui trompe : l’atteinte des poumons par le chlore — une grande difficulté à respirer — peut n’arriver que 24 à 48 heures plus tard. Quelqu’un qui a toussé la veille et va bien le matin n’est pas sorti d’affaire. La javel se verse dans l’eau, jamais l’inverse, et jamais dans un contenant qui a servi à autre chose.</p>
<p class="pt"><span class="pn">6</span><strong class="plead">L’eau du fleuve ne se boit pas.</strong> Le sel dissous traverse tous les traitements de ce chapitre. Boire de l’eau salée oblige le rein à excréter plus d’eau qu’elle n’en apporte : la déshydratation s’accélère au lieu de se corriger. Face à la Côte-Nord, le fleuve porte de 27 à 29 g de sels dissous par litre : c’est de l’eau de mer. En manque d’eau douce, c’est la neige, la glace ou l’alambic — jamais le fleuve tel quel.</p>
</template>
<template id="story-e">
<p class="p0">Sans électricité, sans filtre acheté, sans javel : il reste le feu, et le feu suffit, à un prix.</p>
<p class="p0 ri"><strong class="runin">À la maison, le feu n’est pas acquis.</strong> La cuisinière est électrique, et la seule source de chaleur qui reste est souvent le barbecue ou le réchaud de camping. Les deux brûlent dehors, jamais dans la maison, le garage, l’entrée ni sous un auvent, pour la raison donnée à la section 8 : le monoxyde de carbone ne se voit pas, ne se sent pas, n’irrite rien, et quelqu’un qui s’endort n’a plus de symptômes à ressentir. Faire bouillir vingt litres dehors à −20 °C prend plus de temps que prévu et coûte du combustible : le chapitre 14 donne les rendements, et c’est là que la réserve déjà traitée de la section 5-G paie sa place.</p>
<p class="p0 ri"><strong class="runin">La chaîne complète, version dégradée.</strong> Deux chaudières. La première reçoit l’eau brute et repose 12 à 24 h sous couvercle. On transvase par-dessus le dépôt dans la seconde, à travers quatre épaisseurs de coton, puis on bout à gros bouillons — 1 minute, 5 minutes si le bassin porte des castors, des rats musqués ou des lièvres (section 5-E) — et on laisse refroidir couvert. C’est tout. C’est suffisant contre les bactéries, les virus, <em>Giardia</em> et <em>Cryptosporidium</em>.</p>
<figure class="fig pl demi" data-id="13-01"><img src="../../images/planche-13-01-trois-temps-eau.svg" alt="Planche 13-01" style="height:4.251in"></figure>
<p class="p0 ri"><strong class="runin">Bouillir quand il n’y a pas de marmite.</strong> Un contenant qui ne va pas au feu — boîte d’écorce cousue et gommée (<span class="ref">ch. 60</span>), fût de plastique, caisse de bois, peau tendue dans un trou — se chauffe aux pierres. Faire un feu, y enfouir des pierres, les sortir une à une avec deux bâtons verts taillés en pince et les laisser tomber dans l’eau ; sortir chaque pierre refroidie avant d’en mettre une autre, sinon le fond se remplit et le contenant ne tient plus rien. <strong>Les pierres se prennent au sec, loin de l’eau, et jamais une pierre feuilletée ou une pierre ramassée dans le lit d’un ruisseau :</strong> l’eau emprisonnée dans les couches se détend d’un coup à la chaleur et la pierre éclate au visage de celui qui est penché dessus. Ce qu’on perd : la preuve. Une eau chauffée aux pierres fume, elle ne roule pas, et sans gros bouillon il n’y a plus rien qui dise qu’on est à 100 °C. C’est une manière de rendre un contenant utilisable, pas une manière de certifier de l’eau — devant un bassin à castors, ça ne remplace pas les cinq minutes.</p>
<p class="p0 ri"><strong class="runin">Puiser un puits quand la pompe est morte.</strong> Une chaudière n’entre pas dans un tubage de 150 mm. Ce qui entre, c’est une buse : un bout de tuyau rigide de 1,5 à 2 m, un clapet au bas, une corde en haut. Le clapet se fait d’un carré de chambre à air vissé d’un seul côté au-dessus d’un trou percé dans un bouchon — il s’ouvre à la descente, il se plaque à la remontée. Volume par voyage : la longueur immergée multipliée par le volume au mètre, soit le rayon en centimètres au carré × 3,14 ÷ 10. Un tuyau de 40 mm porte donc environ 1,2 L par mètre, et une buse de 2 m remonte 2,5 L. Pour les 48 L d’une journée de famille, c’est une vingtaine de voyages, et c’est pour ça qu’on stocke l’eau traitée au lieu de la puiser au fur et à mesure. Le piège n’est pas la fatigue, c’est que <strong>tout ce qu’on descend dans le tubage est désormais dans l’eau qu’on boit</strong> : corde, buse, mains. La corde s’enroule sur un bâton et ne touche jamais le sol, la buse se range bouchée et suspendue, et tout ce qui descend est attaché deux fois — ce qui tombe au fond d’un puits y reste et y pourrit.</p>
<figure class="fig plf" data-plate="full" data-id="13-02" data-src="../../images/planche-13-02-buse-pour-puiser-puits.svg"></figure>
<p class="p0 ri"><strong class="runin">Faire du chlore quand il n’y a plus de javel.</strong> Deux chemins, inégaux.</p>
<p>L’hypochlorite de calcium en granules se garde des années là où la javel liquide perd son titre en mois. Il ne se jette jamais tel quel dans l’eau de boisson : les granules ne se dissolvent pas également, et ce qui descend au fond est une concentration qui brûle. On dissout d’abord une petite quantité dans un litre d’eau propre pour faire une solution mère, on la laisse déposer, on dose l’eau avec le liquide clair au-dessus, et <strong>on vérifie à la bandelette</strong> — le titre du produit et son vieillissement font qu’aucune recette ne tient. Ces granules s’entreposent seuls, au sec, loin des huiles, des guenilles et du carburant : l’hypochlorite de calcium est un oxydant puissant et s’enflamme au contact de matière organique, sans flamme pour l’amorcer.</p>
<p>L’électrolyse d’une saumure donne de l’hypochlorite avec ce qui est déjà au chalet : du 12 V et deux électrodes de carbone. Le mécanisme : le courant continu arrache le chlore du sel dissous à l’anode, où il se recombine en hypochlorite dans l’eau, pendant que l’hydrogène se dégage à la cathode. Trois conditions qui ne se négocient pas. <strong>Carbone aux deux bornes</strong> — une électrode d’acier ou de cuivre se dissout dans le liquide et on boit le métal ; les charbons d’une grosse pile sèche ou des électrodes de gougeage font l’affaire. <strong>Contenant ouvert, dehors, au vent.</strong> L’hydrogène qui monte est explosif dès qu’il s’accumule sous un couvercle, et le chlore qui s’échappe de la surface brûle les poumons : un bidon fermé transforme une bricole utile en bombe. <strong>Et la bandelette</strong>, parce qu’on ne sait pas ce qu’on a fabriqué : la concentration dépend du sel, du courant et du temps, et elle ne se devine pas. Un appareil conçu pour ça tire d’une saumure à 25 g de sel par litre une solution à 5 g de chlore actif par litre ; un montage de fortune fera moins, sans qu’on sache combien. La solution perd son chlore en moins d’une journée : on la fait le jour où on s’en sert. Sans bandelette, cette méthode est un dosage à l’aveugle, ce qui est pire que de bouillir.</p>
<p class="p0 ri"><strong class="runin">Le filtre à sable.</strong> Un baril debout, un trou au bas avec un bout de boyau. Du fond vers le haut : une main de grosse pierre, une couche de gravier, puis du sable lavé — lavé jusqu’à ce que l’eau de rinçage sorte claire, faute de quoi c’est de la boue qu’on met dans le filtre. L’eau entre par le haut, doucement, sur une assiette percée qui l’empêche de creuser le sable. Plus la couche de sable est épaisse et plus l’eau la traverse lentement, mieux ça marche : ce n’est pas le pore du sable qui filtre, c’est le film vivant qui s’installe à sa surface et qui mange ce qui passe. Ce film met jusqu’à un mois à se faire, et pendant ce temps l’eau qui sort se désinfecte comme le reste ; il ne se voit pas — le sable qui fonce, c’est la saleté prise, pas le film. Il meurt si le filtre s’assèche ou s’il reste plus de deux jours sans eau neuve à manger, et se détruit si le baril gèle — un filtre à sable est un ouvrage d’été et d’automne qu’on ne peut pas improviser le jour où on en a besoin, et qu’on nourrit tous les jours une fois parti. Quand le débit tombe, on gratte les deux ou trois centimètres du dessus, on ne brasse pas le lit. Le charbon du poêle, concassé et rincé, ne se met pas dans ce baril-là : il fait un deuxième seau, <strong>après</strong> le sable, parce que déposé sur le sable il étouffe le film vivant qui fait tout le travail. Ce deuxième seau corrige le goût et la couleur. Le charbon de bois n’est pas du charbon actif. L’activation — une cuisson à la vapeur au-dessus de 800 °C qui ouvre ses pores — fait passer un charbon de bois de quelques m² à 300 m² de surface par gramme à 750 à 1 100 m², et il fixe alors trois à cinq fois plus. Le charbon du poêle retient donc un peu, mais il ne faut pas compter sur lui contre un métal ou un produit chimique dissous. Tout ça clarifie ; rien de tout ça ne désinfecte. On s’en sert avant l’ébullition, jamais à la place.</p>
<figure class="fig plf" data-plate="full" data-id="13-07" data-src="../../images/planche-13-07-filtre-sable-baril.svg"></figure>
<p class="p0 ri"><strong class="runin">L’alambic de fortune.</strong> Une marmite, un couvercle bombé posé à l’envers, un bol sur un trépied au centre : la vapeur monte, frappe le couvercle froid, glisse vers le creux et tombe dans le bol. Quatre détails font la différence entre un alambic et une marmite qui fume. Le joint : un boudin de guenille mouillée ou une pâte de farine et d’eau autour du couvercle, refait à chaque fois. Le froid : de la neige ou un linge mouillé sur le couvercle, renouvelé, sinon la vapeur repart au lieu de condenser. Le feu : un bouillon doux, parce qu’un gros bouillon projette des gouttes d’eau sale directement dans le bol et annule tout le travail. Et le bol : sorti à froid, jamais rempli à ras. Avec un bout de tuyau de cuivre enroulé dans un banc de neige en guise de serpentin, on récupère plus de la vapeur ; sans lui, on en perd beaucoup. Et même bien fait, l’alambic mange du bois : vaporiser un litre demande plus de cinq fois la chaleur qu’il a fallu pour l’amener à ébullition, donc plus de six fois le bois d’une simple ébullition. C’est la seule réponse d’urgence au sel, à l’arsenic, à l’uranium et au manganèse, et on la réserve à l’eau de boisson des enfants, pas à la vaisselle. <strong>Son angle mort, qui n’est pas intuitif :</strong> l’alambic laisse derrière ce qui est plus lourd que l’eau, mais il emporte avec la vapeur tout ce qui bout plus bas qu’elle. Une eau qui sent l’essence, le solvant ou le naphta ressort de l’alambic avec son contaminant dans le bol. Contre une contamination chimique volatile, distiller ne sert à rien.</p>
<figure class="fig pl demi" data-id="13-03"><img src="../../images/planche-13-03-alambic-fortune.svg" alt="Planche 13-03" style="height:4.251in"></figure>
<p class="p0 ri"><strong class="runin">Fondre sans gaspiller de bois.</strong> Toujours un fond d’eau liquide dans la marmite avant la neige (<span class="ref">§5-I</span>). Au-delà de ça, l’hiver donne deux fontes gratuites : un prélart noir ou une bâche foncée étalée sur la neige par une journée claire de mars, avec une pente et une rigole vers un seau ; et un sac souple accroché près du poêle, qui fond sur la chaleur perdue pendant qu’on cuisine autre chose. La glace de lac rend beaucoup plus d’eau que la neige à volume égal et vaut le voyage. <strong>Ce qui ne se fait pas, c’est manger la neige pour boire :</strong> la chaleur qu’il faut pour la fondre sort du corps, pas de rien, et un homme qui se rafraîchit l’intérieur pendant qu’il travaille dehors descend vers l’hypothermie en croyant s’hydrater (<span class="ref">ch. 3</span>). Et fondu ne veut pas dire traité : la neige et la glace passent par la marmite comme le reste.</p>
<p class="p0 ri"><strong class="runin">Dessaler par le gel, quand il n’y a que le fleuve.</strong> L’eau qui gèle se range en cristal et refuse le sel : la glace qui se forme est moins salée que l’eau qu’elle quitte, et la saumure rejetée concentre le reste. On laisse donc geler lentement, on sort la glace, on la rince à l’eau froide pour emporter la pellicule de saumure qui l’enrobe, et on la fond. Ce n’est pas du dessalement, c’est une dilution : la glace qui vient de se former garde encore beaucoup de sel, et ne s’adoucit qu’en perdant sa saumure. Une passe ne suffit pas, il en faut plusieurs. La tentation, c’est de juger au goût et de se dire que ça passe. Une eau encore salée au goût est très loin d’être buvable, et la boire assèche plus vite que de ne rien boire (<span class="ref">§8</span>). Le gel dépanne ; l’alambic tranche.</p>
<p class="p0 ri"><strong class="runin">Le soleil, l’été.</strong> Une bouteille de plastique transparent, remplie d’eau déjà claire, couchée sur le côté sur une surface sombre, en plein soleil : le rayonnement abîme les micro-organismes et la chaleur y ajoute. Trois conditions : l’eau doit être limpide, parce que la moindre particule fait de l’ombre ; la bouteille doit être claire, de plastique ou de verre, jamais teintée brune ou verte ; et il faut du vrai soleil — au moins six heures, deux jours de suite si le ciel est couvert —, ce qui raye cette méthode en hiver sur la Côte-Nord. Contre le <em>Cryptosporidium</em>, ça ne change rien à ce que dit la section 8 : il reste la chaleur ou le pore de 1 µm.</p>
<p class="p0 ri"><strong class="runin">Siphonner sans amorcer à la bouche.</strong> Remplir le boyau complètement dans le contenant plein, boucher les deux bouts avec les pouces, en descendre un dans le seau receveur et lâcher. Amorcer en aspirant met l’eau brute dans la bouche et la bouche dans le côté propre : c’est la manière la plus bête de perdre une journée de bois.</p>
<p class="p0 ri"><strong class="runin">Réparer plutôt que remplacer.</strong> Une bougie de céramique colmatée se récure sous l’eau propre avec une brosse dure ou le dos d’un couteau, et son débit repart ; chaque nettoyage lui enlève une pelure, alors on mesure son diamètre quand elle est neuve et on l’écrit sur le couvercle, sinon on la récure jusqu’à la percer sans le savoir. Une cartouche plissée, elle, ne se brosse jamais : on la rince à contre-courant et c’est tout, parce que la brosse ouvre le pli et le filtre continue de couler en ne filtrant plus rien. Un fût de plastique fendu se ressoude au fer, avec une bande découpée dans un fût du même plastique — un autre plastique ne fusionne pas, il colle et lâche. Un boyau crevé se recoupe de part et d’autre du trou et se raboute sur un manchon de tuyau rigide serré au fil de fer. Une pompe 12 V morte ne se commande pas : on la remplace par la hauteur. Un baril monté sur une plateforme distribue tout seul et la gravité ne tombe pas en panne — ce qu’elle ne fait pas, c’est remonter l’eau du lac, et ce bout-là reste à bras.</p>
<p class="p0 ri"><strong class="runin">Ce qui ne se remplace pas, et il faut le dire net.</strong> Les bandelettes de chlore : sans elles, l’hypochlorite maison et le choc du puits se dosent à l’aveugle. L’analyse chimique : rien dans cette section ne voit l’arsenic, l’uranium, le nitrate, le manganèse ni le plomb, et aucun de ces cinq-là ne se goûte. L’avertisseur de monoxyde. Et les virus : aucun filtre de terrain ne les arrête, donc partout où des matières fécales humaines ont pu entrer dans l’eau, c’est la chaleur ou rien.</p>
<p class="p0 lab kh"><strong class="runin">Ce qu’on perd en choisissant cette variante, nommément :</strong></p>
<p class="li"><strong>Le volume.</strong> Bouillir 16 L par jour pour quatre personnes — le plancher de la trousse — c’est une bûche de plus à fendre chaque jour, tous les jours, en plus du chauffage. Viser les 48 L de la cible de la section 5-G en bouillant chaque litre, c’est une deuxième corvée à temps plein, et c’est pour ça que l’hygiène redescend au minimum en premier (<span class="ref">ch. 28</span>). La réserve se construit à l’automne, pas en janvier.</p>
<p class="li"><strong>La rémanence.</strong> Une eau chlorée garde un résiduel qui la protège dans le contenant. Une eau bouillie n’en a aucun : elle est propre à la seconde où on ferme le couvercle et redevient suspecte dès qu’une main sale entre dans le bidon.</p>
<p class="li"><strong>Tout ce qui est dissous.</strong> Arsenic, uranium, nitrate, manganèse, sel : la variante d’urgence n’y touche pas, sauf par l’alambic et en très petite quantité.</p>
<p class="li"><strong>Le confort et la clarté.</strong> L’eau reste teintée par les tanins, plate au goût, et les enfants de 4 et 6 ans le remarquent et refusent de boire. C’est un problème réel en déshydratation d’hiver, pas un détail : voir les chapitres 7 et 33.</p>
<p class="li"><strong>La marge d’erreur.</strong> Avec deux méthodes, un oubli se rattrape. Avec une seule, un chronomètre mal parti est une gastro-entérite pour quatre personnes à 90 km du premier médecin.</p>

  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
