<h3 class="sub">Cinq choses tuent ici, et chacune trompe le réflexe</h3>
<p class="pt"><span class="pn">1</span><strong class="plead">Le monoxyde de carbone déguisé en gastro.</strong> Il n’a ni odeur ni couleur et n’irrite ni les yeux ni la gorge. Il donne mal à la tête, fatigue, nausées, vomissements, étourdissements : le tableau d’un virus. L’enfant, qui respire plus vite, est touché le premier, et il a l’air fatigué ou de mauvaise humeur ; un parent attentif conclut au caractère ou à la gastro, et le recouche dans la pièce qui l’empoisonne. Une maisonnée qui soigne calfeutre, chauffe plus et fait bouillir de l’eau toute la journée. <strong>Plusieurs malades en même temps, sans fièvre, qui vont mieux dehors : ce n’est pas une maladie. On sort tout le monde</strong>, et personne ne rentre chercher quoi que ce soit. Aucune génératrice, aucun barbecue, aucun réchaud au propane ni aucune chaufferette à combustion ne fonctionne à l’intérieur, même porte ouverte (étape 42).</p>
<p class="pt"><span class="pn">2</span><strong class="plead">Les taches qui ne s’effacent pas sous le verre.</strong> La méningite et l’infection du sang par le méningocoque commencent comme une grippe ou une gastro. Puis de petits points rouges, comme des piqûres d’épingle, apparaissent et s’étendent en taches violettes : c’est du sang sorti sous la peau, là où l’infection du sang a fait des caillots et des tissus meurent. Le mécanisme est une course : l’état peut basculer en quelques heures, plus vite chez l’enfant, et finir en coma. <strong>Le test du verre se fait sur toute tache nouvelle chez un fiévreux, la nuit comprise</strong>, et sur une peau foncée, aux paumes, aux plantes, au palais, aux yeux. Rien au chalet ne traite ça. La seule chose qu’on fabrique, c’est l’heure de la décision : la première tache, pas le matin (<span class="ref">ch. 35, 5</span>-C).</p>
<p class="pt"><span class="pn">3</span><strong class="plead">La respiration d’un enfant qui tousse.</strong> La pneumonie est la première cause infectieuse de mort chez l’enfant. Elle trompe de trois façons : l’enfant dit qu’il a mal au ventre ; la fièvre peut manquer, et c’est alors plutôt un mauvais signe ; et le bleu des lèvres n’arrive que quand il manque déjà beaucoup d’oxygène. Ce qui ne trompe pas, c’est le compte : <strong>une minute, montre en main, enfant calme — 40 et plus de 1 à 5 ans, 30 et plus après 5 ans</strong>. L’œil ne compte pas ; la montre, oui.</p>
<p class="pt"><span class="pn">4</span><strong class="plead">L’enfant qui bave assis, penché en avant.</strong> Quand l’épiglotte enfle, l’enfant garde l’air ouvert par sa posture. Le réflexe de le coucher pour le soigner aggrave l’obstruction, et lui abaisser la langue pour regarder peut l’aggraver aussi : c’est le peu d’air qui passe encore qu’on met en jeu. <strong>On le laisse assis dans la position qu’il a choisie, sur les genoux d’un parent, et on ne lui touche pas la gorge ; rien à boire s’il n’avale plus sa salive.</strong> C’est l’inverse de tout le reste du chapitre, et c’est pour ça que c’est écrit ici et en tête de la conduite d’attente (étape 10).</p>
<p class="pt"><span class="pn">5</span><strong class="plead">Le furoncle du nez et de la lèvre du haut.</strong> Les veines du centre du visage se vident vers une grosse veine à la base du crâne, derrière les yeux. Une infection de cette zone peut y monter et y faire un caillot infecté qui touche les nerfs des yeux et le cerveau ; même traitée, cette complication tue de 10 à 15 % des personnes atteintes. <strong>Aucun furoncle ne se presse, et celui du centre du visage ne s’ouvre pas non plus</strong> : chaleur humide et rien d’autre. Mal de tête qui monte, paupière qui enfle, œil qui avance, vision double, forte fièvre : la vie est en jeu.</p>

<p class="p0">Pas d’acétaminophène, pas d’ibuprofène, pas d’antibiotique, pas de gouttes. Il reste l’eau, la chaleur et le froid, la position, le lavage et le compte. Ce qu’on perd, on le dit chaque fois.</p>
<h3 class="sub">La fièvre sans médicament</h3>
<p class="p0">Le médicament contre la fièvre sert au confort, pas à la guérison : sans lui, la maladie dure autant et l’enfant est plus inconfortable, pas plus en danger. On découvre sans déshabiller, on fait boire souvent et peu, on laisse dormir. Pas d’éponge ni de linge mouillé : dans une pièce chauffée au bois en janvier, l’air du plancher est à une autre température que l’air à hauteur d’homme (<span class="ref">ch. 39</span>, section 9), et un enfant fiévreux mouillé couché au sol se refroidit plus qu’on le croit. <em>Ce qu’on perd :</em> le sommeil, surtout. Les signes de l’étape 10 restent les mêmes. Des seuils du <span class="ref">ch. 32</span> (section 6), celui de la fièvre « qui ne baisse pas malgré le médicament » tombe, puisqu’il n’y a pas de médicament ; restent 40,0 °C ou plus et 36,0 °C ou moins dans les fesses, et la durée (étape 14).</p>
<p class="p0 ri"><strong class="runin">Pas d’écorce de saule avant 18 ans</strong>, ni pour la fièvre ni pour la douleur. Le saule est un salicylé, de la même famille que l’AAS, et donné pendant une grippe ou une varicelle il expose au même syndrome de Reye (<span class="ref">ch. 34</span>, étapes 34 et 35 ; <span class="ref">ch. 32</span>, section 8). « Le saule, c’est de l’aspirine naturelle » est exactement la raison de ne pas en donner à un enfant.</p>
<h3 class="sub">La douleur sans comprimé</h3>
<p class="li"><strong>L’oreille :</strong> une débarbouillette tiède, ou le sac de sable chauffé du <span class="ref">ch. 34</span> (étape 3) roulé dans deux linges et posé contre l’oreille, l’enfant couché dessus s’il le veut : le sable ne fuit pas. On teste sur l’intérieur de son propre poignet : chaud, jamais brûlant. Un enfant fiévreux et épuisé ne retire pas toujours la tête à temps. Une bouteille d’eau chaude se tient à la main contre l’oreille, jamais sous la tête d’un enfant qui s’endort : sous le poids, c’est le bouchon qui cède, et l’eau sort sur son visage.</p>
<p class="li"><strong>La gorge :</strong> boire froid ; sucer une glace sur bâton, de l’eau bouillie gelée dehors dans un petit contenant avec un bâton de bois planté dedans, rentrée jusqu’à ce que sa surface mouille (étape 21) ; l’eau salée tiède en gargarisme pour qui sait cracher ; le miel dans l’eau chaude.</p>
<p class="li"><strong>Le sinus :</strong> un linge chaud et mouillé sur le visage, renouvelé quand il tiédit.</p>
<p class="li"><strong>Le zona :</strong> un linge frais et mouillé, des vêtements amples, rien qui colle.</p>
<p class="li"><strong>L’abcès :</strong> la chaleur, qui soulage en même temps qu’elle fait mûrir.</p>
<p class="li">Et quelqu’un qui s’assoit à côté. Pour un enfant de 4 ans, une compresse tiède et une histoire font une partie du travail d’un comprimé (<span class="ref">ch. 33</span>, <span class="ref">ch. 40</span>).</p>
<p><em>Ce qu’on perd :</em> la douleur forte ne se calme pas. Une otite de nuit sans médicament est une longue nuit.</p>
<h3 class="sub">La solution saline qu’on fabrique</h3>
<p class="p0 ri"><strong class="runin">La recette :</strong> 1 L d’eau bouillie 3 minutes, 10 mL (2 cuillères à thé) de sel — du sel à marinade, plus doux pour le nez que le sel de table — et 2,5 mL (une demi-cuillère à thé) de bicarbonate de soude. Laisser refroidir. <strong>Sans bicarbonate :</strong> 9 g de sel par litre, pesés, la concentration des solutions salines des trousses (<span class="ref">ch. 32</span>, section 9). Ni l’une ni l’autre ne se fait « plus salée pour que ça marche mieux » : une solution à 3 % de sel et plus — 30 g par litre, plus de trois fois la solution à 9 g — ne se met pas dans le nez d’un enfant ; c’est pour ça qu’elle se mesure. Elle se garde 24 heures à la température de la pièce, 7 jours au froid dans un contenant fermé. Au chalet l’hiver, le tambour fait le froid, mais il gèle : une bouteille de plastique, qu’on dégèle au complet et qu’on secoue avant l’usage, jamais une bouteille de verre pleine, qui fend en gelant. <strong>Un contenant et une seringue par personne</strong>, sinon on se passe le rhume par le nez.</p>
<p class="p0 ri"><strong class="runin">Sur un enfant de 4 ans :</strong> couché sur le dos, la tête tournée sur le côté, 5 à 10 mL dans la narine du haut, à la seringue ou à la cuillère, puis on tourne la tête de l’autre côté pour l’autre narine. Il se relève, crache, on lui essuie le nez. Trois à six fois par jour pendant le rhume, l’otite ou la sinusite. <em>Ce qu’on perd sans seringue :</em> la précision du volume, pas l’effet.</p>
<h3 class="sub">La compresse chaude qui garde sa chaleur</h3>
<p class="p0">Un linge de coton trempé dans l’eau chaude de la bouilloire du poêle, essoré, testé sur l’intérieur du poignet, posé sur l’abcès ; par-dessus, le sac de sable chauffé du <span class="ref">ch. 34</span> (étape 3) ou une bouteille de métal d’eau chaude, roulés dans un linge sec, qui gardent la chaleur au lieu de la laisser partir en vapeur ; par-dessus le tout, une serviette. On change le linge mouillé quand il tiédit. <strong>10 minutes, quatre fois par jour.</strong> Le linge sert une fois, puis va bouillir : il a touché du pus. <em>Ce qu’on perd :</em> rien ; c’est le traitement, pas un remplacement. Le piège est la peau déjà insensible d’une cellulite ou d’un malade qui somnole, qui ne dit pas que ça brûle (<span class="ref">ch. 26</span>).</p>
<h3 class="sub">Une lame propre sans scalpel</h3>
<p class="p0">Une lame de rasoir neuve sortie de son emballage est propre. Sinon, la lame la plus fine qu’on ait, affûtée (<span class="ref">ch. 105</span>), bouillie 30 minutes à gros bouillons dans une casserole couverte, sortie à la cuillère bouillie et posée sur un linge bouilli. Le rinçage se fait à la bouteille souple percée au clou chauffé (<span class="ref">ch. 26</span>). <em>Ce qu’on perd :</em> la stérilité et l’anesthésie ; la première se paie en surveillance de la rougeur au trait de crayon, la seconde limite le geste à l’étape 54.</p>
<h3 class="sub">Compter sans montre : le pendule d’une seconde</h3>
<p class="p0">Une ficelle de 1 m entre le point d’attache et le milieu d’un poids compact — un écrou, une pierre, pas une cuillère, qui freine dans l’air et dont on situe mal le milieu — suspendue au cadre de porte. Écartée d’une main et lâchée, elle fait un aller simple en une seconde environ, tant que l’élan reste petit. On compte les respirations pendant soixante allers ; le pouls pendant trente, et on double. <em>Ce qu’on perd :</em> presque rien sur le temps, que le pendule tient mieux qu’on ne compte ; l’erreur vient du compte des respirations, et on recompte quand on tombe juste sur un seuil.</p>
<h3 class="sub">Le test du verre avec ce qu’on a</h3>
<p class="p0">N’importe quel verre transparent à paroi lisse : un pot Mason, un verre à boire, le flanc d’une bouteille de plastique clair. On presse fort sur la tache et on regarde à travers la paroi. <em>Ce qu’on perd sans verre :</em> le test lui-même ; rien d’autre ne le remplace de façon fiable. Au moindre doute, on traite la tache comme une vraie.</p>
<h3 class="sub">La toux et l’air sec du poêle</h3>
<p class="p0">Une serviette mouillée sur le séchoir près du poêle, renouvelée quand elle sèche, ou un bol d’eau à côté du lit. Pour la nuit, la tête relevée sur deux oreillers ou un manteau plié sous le matelas. Une cuillère de miel au coucher après un an. <em>Ce qu’on perd sans sirop :</em> rien — les sirops n’étaient pas conseillés avant 6 ans, et la toux fait un travail.</p>
<h3 class="sub">Laver un œil et une peau sans produit</h3>
<p class="p0">L’eau bouillie refroidie fait le lavage d’un œil qui colle : un coton neuf ou un carré de coton bouilli par œil, de l’intérieur vers l’extérieur. Pour la peau, l’eau et le savon — le savon maison fait l’affaire (<span class="ref">ch. 112</span>) — puis un linge sec. Les pansements se font de coton bouilli (<span class="ref">ch. 26</span>). <em>Ce qu’on perd :</em> rien sur le lavage ; du temps sur l’impétigo et l’œil bactérien, dont l’antibiotique en crème ou en gouttes abrégeait la contagion.</p>
<h3 class="sub">Nourrir un malade qui guérit</h3>
<p class="p0">On reprend à manger dès que ça passe, en petites portions, sans attendre que l’appétit revienne tout seul (<span class="ref">ch. 39</span>). Le bouillon aide à boire ; il ne suffit pas à nourrir, et il ne remplace pas la solution de réhydratation dans une diarrhée. Un convalescent qui ne mange que du lièvre ou du dos d’orignal maigre pendant des semaines s’en va vers le mal de caribou : la moelle, la graisse, le poisson gras entrent au menu dès que l’estomac les accepte (<span class="ref">ch. 19</span>). <strong>Pas le foie ni les reins de l’orignal</strong>, que le réflexe ancien sert à qui est affaibli : ils peuvent contenir beaucoup de cadmium, qui s’accumule chez qui les mange et s’en élimine très lentement (section L ; <span class="ref">ch. 22</span>).</p>
<h3 class="sub">Ce qui ne se remplace pas</h3>
<p class="p0">Le dire franchement vaut mieux que laisser espérer une astuce.</p>
<p class="li"><strong>L’antibiotique,</strong> pour sept infections de ce chapitre : la pneumonie, la pyélonéphrite, la cellulite qui dépasse son trait, la mastoïdite, l’infection de l’orbite, la méningite et l’infection du sang. Aucun geste de cette section ne les renverse. Pour l’otite et l’angine, il abrège et évite des complications rares : là, l’attente est un pari raisonnable, et deux otites sans gravité sur trois le gagnent.</p>
<p class="li"><strong>Ce que l’antibiotique ne fait pas seul,</strong> pour trois autres : l’épiglotte qui enfle, où il faut aussi tenir l’air ouvert ; l’abcès derrière l’amygdale, qu’il faut vider ; l’infection qui mange les tissus profonds, qu’il faut ouvrir au bloc. Même avec un antibiotique au stock, ces trois-là partent.</p>
<p class="li"><strong>L’oxygène et le soluté.</strong> Aucune fenêtre, aucune vapeur, aucune cuillère ne relève un sang qui manque d’oxygène ni ne remplace ce qu’une veine reçoit (<span class="ref">ch. 30</span>).</p>
<p class="li"><strong>Le médicament contre le virus du zona,</strong> qui agit surtout dans les trois premiers jours.</p>
<p>Pour tout le reste, ce chapitre garde le corps en état de guérir ce qui guérit seul. Pour ces dix-là, ce qu’il donne, c’est une heure : celle où l’on sait qu’il faut partir, pendant que partir sert encore (<span class="ref">ch. 35, 5</span>-C).</p>
</template>
<template id="notes">
<p class="fn" data-fn="28-1"><span class="fnn">1</span>Chez l’enfant couché calme, torse nu : à chaque inspiration, le bas de la cage thoracique se creuse vers l’intérieur pendant que le haut du ventre se soulève. Ça compte seulement si c’est permanent et bien visible au repos ; un creux qui paraît quand l’enfant pleure ou mange, ou la peau qui se creuse seulement entre les côtes ou au-dessus de la clavicule, ne suffit pas. Chez l’adulte, c’est la peau qui se creuse entre les côtes ou au-dessus des clavicules.</p>
<p class="fn" data-fn="28-2"><span class="fnn">2</span>Les narines s’ouvrent grand à chaque inspiration, comme chez quelqu’un qui vient de courir, alors que la personne est couchée au repos.</p>
<p class="fn" data-fn="28-3"><span class="fnn">3</span>Un son court, répété, comme un petit grognement ou une plainte, à chaque expiration : l’enfant ferme à moitié sa gorge pour garder de l’air dans ses poumons.</p>
<p class="fn" data-fn="28-4"><span class="fnn">4</span>Un son rauque et aigu qu’on entend quand la personne <strong>inspire</strong>, pas quand elle expire. Au repos, il veut dire que le passage de l’air dans la gorge est en train de se fermer.</p>
<p class="fn" data-fn="28-5"><span class="fnn">5</span>Presser fermement le flanc d’un verre transparent sur la tache et regarder à travers. Une tache qui pâlit et disparaît sous la pression est une rougeur ordinaire. <strong>Une tache qui reste visible à travers le verre</strong> est du sang sorti sous la peau. Elle commence souvent en petits points rouges comme des piqûres d’épingle, puis s’étend en taches rouges ou violettes. Sur une peau foncée, on regarde les zones pâles : paumes, plantes des pieds, palais, blanc des yeux, intérieur des paupières. Tous les malades graves n’ont pas de taches : leur absence ne rassure pas.</p>
<p class="fn" data-fn="28-6"><span class="fnn">6</span>La personne couchée ou assise, on lui demande d’amener le menton sur la poitrine, ou on soulève doucement sa tête pour le faire. Une nuque raide résiste : le geste est très douloureux, parfois impossible, alors que tourner la tête de côté l’est beaucoup moins. Le signe se cherche chez l’enfant plus vieux et l’adulte ; le tout-petit peut ne pas l’avoir.</p>
<p class="fn" data-fn="28-7"><span class="fnn">7</span>Le bleu ou le gris se voit d’abord aux lèvres, à la langue, aux gencives et sous les ongles ; sur une peau foncée, aux paumes, aux lèvres, à la langue, aux gencives et autour des yeux. Il apparaît tard, quand il manque déjà beaucoup d’oxygène.</p>
<p class="fn" data-fn="28-8"><span class="fnn">8</span>Une peau tachetée de violet, de gris et de pâle, comme du marbre ; sur une peau foncée, elle se voit mieux aux paumes et à la plante des pieds. Avec la fièvre et des mains et des pieds froids, c’est la circulation qui se ferme à la peau pour garder le sang au centre du corps (<span class="ref">ch. 26</span>, section 8).</p>
<p class="fn" data-fn="28-9"><span class="fnn">9</span>Une fièvre qui dure au moins 5 jours et ne cède pas aux médicaments, le plus souvent chez un enfant de moins de 5 ans, avec plusieurs de ces signes : les yeux rouges <strong>sans écoulement</strong>, apparus au bout d’un ou deux jours ; les lèvres rouges, sèches et fendues, la langue rouge comme une fraise ; les paumes et la plante des pieds rouges ou violacées, les mains et les pieds enflés ; une éruption de taches rouges sur le tronc ; des ganglions enflés au cou. Vers le 10e jour, la peau du bout des doigts pèle.</p>
<p class="fn" data-fn="28-10"><span class="fnn">10</span>Derrière l’oreille, sur l’os qu’on sent en arrière du pavillon : une bosse rouge, chaude, douloureuse au toucher, qui pousse le pavillon vers l’avant et le décolle de la tête. On compare avec l’autre côté, en regardant l’enfant de face puis de derrière. L’enfant est fatigué, irritable, entend moins de ce côté.</p>
<p class="fn" data-fn="28-11"><span class="fnn">11</span>Des gestes brusques, sans but, que l’enfant ne contrôle pas, des mains d’abord, puis des pieds et du visage, avec des grimaces ; ils disparaissent pendant le sommeil. Dans les cas légers, l’enfant a seulement l’air maladroit et peine à s’habiller et à manger. Ils peuvent n’apparaître qu’une fois tous les autres signes disparus.</p>
<p class="fn" data-fn="28-12"><span class="fnn">12</span>L’enfant a une forte fièvre apparue en moins d’une journée, il est anxieux, assis, penché en avant, la bouche ouverte, la salive qui coule parce qu’avaler fait trop mal. Il ne tousse pas et sa voix n’est pas rauque, ce qui le distingue du croup, où la toux aboie. Il refuse de se coucher : c’est sa façon de garder l’air ouvert.</p>
<p class="fn" data-fn="28-13"><span class="fnn">13</span>Un mal de gorge qui s’aggrave au lieu de passer, plus fort d’un côté ; la voix étouffée, comme avec une patate chaude dans la bouche ; la bouche qui n’ouvre plus qu’à moitié parce que les mâchoires se contractent ; à la lampe, un côté du fond de la gorge bombe et pousse la luette — le petit bout de chair qui pend au milieu — vers l’autre côté.</p>
<p class="fn" data-fn="28-14"><span class="fnn">14</span>On demande à la personne de suivre un doigt des yeux, à gauche, à droite, en haut, en bas. Dans l’infection de l’orbite, bouger l’œil fait mal, un œil suit moins bien que l’autre, elle voit le doigt en double ; vu de profil ou d’en haut, l’œil malade dépasse l’autre.</p>
<p class="fn" data-fn="28-15"><span class="fnn">15</span>Aucune urine depuis plus de 8 heures ; pas de larmes quand il pleure ; les yeux enfoncés ; la bouche et la langue sèches ; une soif extrême, ou au contraire un enfant qui ne veut plus boire ; une respiration plus rapide ; étourdi ou confus ; une peau froide et bleutée qui, pincée doucement entre deux doigts, ne reprend pas sa place tout de suite.</p>
<p class="fn" data-fn="28-16"><span class="fnn">16</span>Un vomi vert franc, ou jaune-vert comme de l’herbe écrasée : c’est de la bile. Chez un enfant, c’est un signe qui ne se discute pas, même si le reste a l’air d’une gastro ordinaire.</p>
<p class="fn" data-fn="28-17"><span class="fnn">17</span>Des traînées rouges, chaudes et douloureuses partent de l’infection et remontent le long du bras ou de la jambe, vers l’aisselle ou l’aine, souvent avec fièvre et frissons : l’infection gagne les vaisseaux lymphatiques (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-18"><span class="fnn">18</span>La peau craque sous le doigt quand on appuie, comme s’il y avait des bulles dessous : c’est du gaz que l’infection fabrique. Elle peut aussi virer au bronze, au violet ou au noir et se couvrir de cloques au liquide brun. La douleur est bien plus forte que ce que la peau laisse voir, puis la zone devient insensible (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-19"><span class="fnn">19</span>Le triangle qui va des coins de la bouche jusqu’à la racine du nez, entre les yeux : le nez, la lèvre du haut, les ailes du nez, le creux à côté du nez. Les veines de cette zone se vident vers une grosse veine à la base du crâne, derrière les yeux.</p>
</template>

  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);
    if(parts){ f.appendChild(parts[0]); syncNotes(f); q.unshift(parts[1]); } else q.unshift(b);
    break;
  }
  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))
      q.unshift(f.removeChild(f.lastElementChild));
    syncNotes(f);
  }
  if(p.deferred.length){   // après la fin du paragraphe coupé, jamais au milieu
    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;
    q.splice(k, 0, ...p.deferred); p.deferred = [];
  }
  return q.length ? 'full' : 'done';
}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];
  if(B.rows.length === 1 && A.rows.length >= 4) B.insertBefore(A.rows[A.rows.length - 1], B.firstChild);
  return parts;
}
function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page
    if(first && !fresh && ((kind === 'd' && fr < 2.2 * 96) || (kind === 'e' && fr < 1.8 * 96) || (kind === 'main' && fr < 1.2 * 96))){ nextPage(); continue; }
    P.story = kind;
    const snapQ = q.slice(), snapPl = pendingPlates.slice();
    const R = region(P, kind, first);
    const r = pour(R.frame, q, P);
    if(!R.frame.children.length){
      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));
        R.frame.appendChild(q.shift()); first = false;
        if(!q.length){ finish(R, kind); break; }
        nextPage(); continue;
      }
      R.box.remove(); const z = R.frame.nextElementSibling; if(z && z.classList.contains('fnz')) z.remove();
      q.splice(0, q.length, ...snapQ); pendingPlates = snapPl;
      nextPage(); continue;
    }
    // l'encadré danger ne se coupe pas s'il tiendrait entier sur la page suivante
    if(kind === 'd' && first && r === 'full' && !fresh && fr < 0.62 * H){
      R.box.remove(); q.splice(0, q.length, ...snapQ); pendingPlates = snapPl; nextPage(); continue;
    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;
  const wrap = (pg) => { const c = document.createElement('div'); c.className = 'trim ' + (pg.classList.contains('recto') ? 'r' : 'v'); c.appendChild(pg); return c; };
  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
