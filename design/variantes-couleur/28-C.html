<!DOCTYPE html>
<html lang="fr-CA">
<head>
<meta charset="utf-8">
<title>28 — Les maladies ordinaires qui durent — Le Grand Livre du Chalet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=IBM+Plex+Serif:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=block" rel="stylesheet">
<style>
/* =====================================================================
   GRILLE — 8 × 10 po rogné, fond perdu 0,125 po en tête, en pied et au
   petit fond (bord extérieur). Page PDF : 8,125 × 10,25 po.
   Zone utile : 7 × 8,5 po — 0,5 po sur les côtés, 0,75 po en tête et en
   pied. C'est la zone des planches ; le texte s'y pose tel quel.
   ===================================================================== */
@page { size: 585pt 738pt; margin: 0; }
:root{
  --red:#9B2C1E;          /* le seul rouge : danger, et rien d'autre */
  --k:#000;
  --k70:#4d4d4d;          /* gris = noir tramé, jamais pour du texte courant */
  --k40:#999;
  --sans:'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif;
  --serif:'IBM Plex Serif', Georgia, serif;
  --lh:13pt;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
body{font-family:var(--serif);font-size:9.5pt;line-height:var(--lh);color:var(--k);
  font-variant-numeric:lining-nums;font-optical-sizing:auto;
  -webkit-print-color-adjust:exact;print-color-adjust:exact;
  text-rendering:geometricPrecision}
.page{position:relative;width:8.125in;height:10.25in;overflow:hidden;background:#fff;break-after:page;page-break-after:always}
.page:last-of-type{break-after:auto}
/* recto : reliure à gauche, fond perdu à droite ; verso : l'inverse */
.recto .block,.recto .rh,.recto .ft{left:0.5in}
.verso .block,.verso .rh,.verso .ft{left:0.625in}
.block{position:absolute;top:0.875in;width:7in;height:8.5in;display:flex;flex-direction:column}

/* ---------- titre courant ---------- */
.rh{position:absolute;top:0.36in;width:7in;height:0.3in;display:flex;align-items:flex-end;justify-content:space-between;
  border-bottom:1.5pt solid var(--k);padding-bottom:3pt;font-family:var(--sans);text-transform:uppercase}
.rh .fo{font-weight:700;font-size:12.5pt;letter-spacing:.02em;line-height:1}
.rh .ch{font-weight:600;font-size:8.5pt;letter-spacing:.09em;line-height:1}
.rh .to{font-weight:500;font-size:7.5pt;letter-spacing:.09em;color:var(--k70);line-height:1}
.rh .grp{display:flex;align-items:flex-end;gap:10pt}
.recto .rh,.recto .rh .grp{flex-direction:row-reverse}   /* recto : folio au bord extérieur, comme le pied */

/* ---------- pied : échelle des neuf sections ---------- */
.ft{position:absolute;top:9.52in;width:7in;height:0.2in;display:flex;align-items:center;justify-content:space-between;font-family:var(--sans)}
.recto .ft{flex-direction:row-reverse}
.lad{display:flex;align-items:center;gap:6pt}
.recto .lad{flex-direction:row-reverse}
.lad ol{display:flex;gap:1.5pt;margin:0;padding:0;list-style:none}
.lad li{width:12pt;height:12pt;border:0.75pt solid var(--k);font:600 7.5pt/11pt var(--sans);text-align:center}
.lad li.on{background:var(--k);color:#fff}
.lad li.on.d{background:var(--red);border-color:var(--red)}
.lad .lab{font:700 7.5pt/1 var(--sans);letter-spacing:.09em;text-transform:uppercase}
.lieu-ft{font:600 7pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--k70)}
.fo-ft{font:700 12.5pt/1 var(--sans)}

/* ---------- repère de tranche : rouge = danger, noir = section 9 ---------- */
.edge{position:absolute;width:0.3in;background:var(--k)}
.edge.d{background:var(--red)}
.recto .edge{right:0}.verso .edge{left:0}

/* ---------- cadres de texte ---------- */
.frame{flex:1 1 0;min-height:0;columns:2;column-gap:0.22in;column-fill:auto;column-rule:0.5pt solid var(--k40);overflow:hidden}
.frame.auto{flex:none;column-fill:balance;overflow:visible}
.frame.one{columns:1;column-rule:none}

p{margin:0;text-indent:1.1em;hyphens:auto;-webkit-hyphens:auto;hyphenate-limit-chars:7 3 3;orphans:2;widows:2}
p.p0,p.cont,h2+p,h3+p,h4+p,table+p{text-indent:0}
strong{font-weight:700}
.ref{font-family:var(--sans);font-weight:600;font-size:.94em;letter-spacing:.01em;white-space:nowrap}
.av{font-family:var(--sans);font-weight:600;font-size:7.4pt;letter-spacing:.06em;color:var(--k70);white-space:nowrap}

/* titres de section : pleine largeur, numéro en carré noir */
h2.sec{column-span:all;display:flex;align-items:center;gap:7pt;margin:9pt 0 6.5pt;padding-top:4pt;border-top:2.5pt solid var(--k);
  font:700 13pt/1 var(--sans);text-transform:uppercase;letter-spacing:.04em;break-after:avoid}
h2.sec:first-child{margin-top:0}
h2.sec .n{display:inline-block;width:19pt;height:19pt;background:var(--k);color:#fff;text-align:center;font:700 14pt/19pt var(--sans);letter-spacing:0}
h2.sec.s9{background:var(--k);color:#fff;padding:5pt 6pt 5pt 5pt;border-top:none;justify-content:flex-start}
h2.sec.s9 .n{background:#fff;color:var(--k)}
h2.sec.s9 .sub9{margin-left:auto;font:500 8pt/1.1 var(--sans);letter-spacing:.06em;text-transform:none;opacity:1}
h2.sec.s8 .n{background:var(--red)}

h3.sub{font:700 10pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.05em;margin:8pt 0 4pt;padding-top:3pt;border-top:0.75pt solid var(--k);break-after:avoid}
.frame > h3.sub:first-child{margin-top:0}
h4.choix{font:700 9pt/12pt var(--sans);text-transform:uppercase;letter-spacing:.06em;margin:6pt 0 3pt;break-after:avoid}
h4.choix:first-child{margin-top:0}

p.lead{column-span:all;font-size:12pt;line-height:15.5pt;text-indent:0;margin:0 0 4pt;hyphens:manual}

p.li{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt}
p.li::before{content:"";position:absolute;left:1pt;top:4.4pt;width:4.6pt;height:4.6pt;background:var(--k)}
p.li.cont::before{display:none}

p.step{position:relative;padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.step .sn{position:absolute;left:0;top:0;width:14pt;text-align:right;font:700 11pt/13pt var(--sans)}
p.step > strong:first-of-type{font-weight:700}

p.ri{margin-top:3pt}
strong.runin{font-family:var(--sans);font-weight:700;font-size:10.2pt;letter-spacing:.01em}

/* ---------- tableaux ---------- */
table{column-span:all;width:100%;border-collapse:collapse;font-size:8.6pt;line-height:10.8pt;margin:2pt 0 8pt;font-variant-numeric:lining-nums tabular-nums;hyphens:auto}
thead th{font:700 7.6pt/1.15 var(--sans);text-transform:uppercase;letter-spacing:.07em;text-align:left;vertical-align:bottom;
  border-top:2pt solid var(--k);border-bottom:1pt solid var(--k);padding:4pt 7pt 3pt 0}
td{border-bottom:0.5pt solid var(--k40);padding:3.2pt 7pt 3.4pt 0;vertical-align:top}
tbody tr:last-child td{border-bottom:1.5pt solid var(--k)}
td.c-item{font-weight:600}
td.c-neg{white-space:normal}
.non{display:inline-block;background:var(--k);color:#fff;font:700 7.4pt/1 var(--sans);letter-spacing:.08em;padding:2pt 3pt 1.6pt}
.negx{font-size:8pt;color:var(--k)}
caption.tsuite{caption-side:bottom;text-align:right;font:italic 600 7.5pt/1.3 var(--sans);letter-spacing:.03em;padding-top:2pt}
table.suite caption{display:none}

/* ---------- ouverture de chapitre ---------- */
.open{flex:none;margin-bottom:10pt}
.open-top{display:flex;justify-content:space-between;font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;padding-bottom:5pt;border-bottom:0.75pt solid var(--k)}
.open-title{display:flex;align-items:flex-end;gap:12pt;padding:8pt 0 7pt;border-bottom:5pt solid var(--k)}
.open-title .num{font:700 92pt/0.74 var(--sans);letter-spacing:-.02em}
.open-title h1{margin:0;font:700 38pt/0.95 var(--sans);text-transform:uppercase;letter-spacing:.01em;padding-bottom:1pt}
.open-meta{display:grid;grid-template-columns:1.95in 1fr;gap:0 0.2in;padding-top:7pt}
.lieu{display:flex;flex-direction:column;gap:3pt}
.lieu b{font:700 7.5pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.lieu .opts{display:flex;gap:3pt}
.lieu .opts span{flex:1;border:0.75pt solid var(--k);font:600 8.6pt/17pt var(--sans);text-transform:uppercase;letter-spacing:.04em;text-align:center;color:var(--k70);white-space:nowrap}
.lieu .opts span.on{background:var(--k);color:#fff;border-color:var(--k)}
.toc{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-flow:column;grid-template-rows:repeat(3,auto);gap:1.5pt 9pt;font:500 7.9pt/12.5pt var(--sans)}
.toc li{display:flex;align-items:baseline;gap:4pt;border-bottom:0.5pt solid var(--k40)}
.toc .n{flex:none;display:inline-block;width:11pt;height:11pt;border:0.75pt solid var(--k);font:700 7.5pt/10pt var(--sans);text-align:center;align-self:center}
.toc .t{flex:1;white-space:nowrap}
.toc .f{font-weight:700}
.toc li.d .n{background:var(--red);border-color:var(--red);color:#fff}
.toc li.h .n{background:var(--k);color:#fff}
.toc li.h{font-weight:700}

/* ---------- planche ---------- */
.planche{width:7in;height:8.5in;display:block}

/* ---------- encadré DANGER ---------- */
.danger{border:1.5pt solid var(--red);display:flex;flex-direction:column;min-height:0}
.danger.full{flex:1 1 0}
.dhead{flex:none;background:var(--red);color:#fff;display:flex;align-items:center;gap:8pt;padding:5pt 8pt 5pt 7pt;
  font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.dhead svg{flex:none;width:17pt;height:15pt}
.dhead.small{font-size:12pt;padding:3pt 8pt 3pt 7pt}
.dhead .sj{font-weight:600;letter-spacing:.03em}
.danger .frame{padding:8pt 9pt 2pt;column-gap:0.24in;column-rule:none}
.pt{position:relative;padding-left:17pt;text-indent:0;margin:0 0 6pt}
.pt .pn{position:absolute;left:0;top:0;color:var(--red);font:700 14pt/13pt var(--sans)}
.pt .plead{display:block;font-weight:700;font-size:10.2pt;margin-bottom:1pt}
.dcut{flex:none;border-top:1pt dashed var(--red);margin:0 9pt;padding:3pt 0 4pt;text-align:right;font:italic 600 8pt/1 var(--sans);color:var(--k);letter-spacing:.03em}
.s9wrap{flex:1 1 0;min-height:0;display:flex;flex-direction:column;margin-top:11pt}
.s9wrap h2.sec{margin-top:0}

/* ---------- chapitre principal ---------- */
.cp .block{padding-right:0.42in}
.thumb{position:absolute;width:0.545in;height:0.62in;background:var(--k);color:#fff;display:flex;align-items:center;justify-content:flex-start;padding-left:0.07in;font:700 17pt/1 var(--sans)}
.recto .thumb{right:0}
.cphead{display:flex;align-items:stretch;gap:12pt;border-bottom:5pt solid var(--k);padding-bottom:8pt}
.cpnum{flex:none;width:0.95in;height:0.95in;background:var(--k);color:#fff;font:700 70pt/0.95in var(--sans);text-align:center}
.cptitle{display:flex;flex-direction:column;justify-content:space-between}
.cpkicker{font:600 8pt/1 var(--sans);letter-spacing:.12em;text-transform:uppercase}
.cptitle h1{margin:3pt 0 5pt;font:700 30pt/0.98 var(--sans);text-transform:uppercase;letter-spacing:.01em}
.cptitle .lieu{flex-direction:row;align-items:center;gap:8pt}
.cptitle .lieu .opts{width:2.6in}
.cpintro{padding:8pt 0 2pt;font-size:10.6pt;line-height:13.8pt}
.cpintro p{text-indent:0;margin:0 0 5pt}
ol.cppoints{list-style:none;margin:2pt 0 0;padding:0}
.cppoints li{display:grid;grid-template-columns:0.3in 1fr 0.62in;grid-template-areas:"b c r" "b e r";border-top:2pt solid var(--k);padding:5pt 0 7pt}
.cppoints li::before{content:"";grid-area:b;width:10pt;height:10pt;background:var(--k);margin-top:4pt}
.cppoints .cmd{grid-area:c;font:700 14.5pt/16.5pt var(--sans);letter-spacing:.005em}
.cppoints .exp{grid-area:e;font-size:9.8pt;line-height:12.6pt;margin-top:3pt;padding-right:4pt}
.cppoints .refs{grid-area:r;display:flex;flex-direction:column;align-items:flex-end;gap:3pt;padding-top:2pt}
.cppoints .refs span{font:700 9.5pt/1 var(--sans);border:1pt solid var(--k);padding:3pt 4pt 2pt;white-space:nowrap}
.cpsans{margin-top:auto;background:var(--k);color:#fff;padding:6pt 9pt 7pt;display:grid;grid-template-columns:1.45in 1fr;gap:0 12pt}
.cpsans .go{font-family:var(--sans);font-size:9pt;margin-top:3pt}
.cpsans .go b{font-weight:700}
.cpsans h3{margin:0;font:700 12pt/14pt var(--sans);text-transform:uppercase;letter-spacing:.05em}
.cpsans h3 small{display:block;font:500 8pt/11pt var(--sans);letter-spacing:.06em;margin-top:3pt}
.cpsans p{text-indent:0;font-size:10pt;line-height:13pt;margin:0}
.cpsans ul{margin:0;padding:0;list-style:none;font-size:9.6pt;line-height:12.4pt}
.cpsans li{position:relative;padding-left:10pt;margin-bottom:2pt}
.cpsans li::before{content:"";position:absolute;left:0;top:4pt;width:4.4pt;height:4.4pt;background:var(--k)}

/* ---------- notes de bas de page ----------
   L'appel est un chiffre en exposant, collé au mot. La note tombe au pied de la
   colonne où se trouve l'appel (au pied de la page dans un cadre à une colonne),
   sous un filet court, en corps plus petit. Numérotation par chapitre. */
sup.fnr{position:relative;top:-.42em;vertical-align:baseline;font:700 .7em/0 var(--sans);letter-spacing:0;margin-left:.6pt}
.fnz{flex:none;display:none;grid-template-columns:1fr 1fr;column-gap:0.22in;align-items:end;margin-top:6pt}
.fnz.on{display:grid}
.fnz.one{grid-template-columns:1fr}
.fnc{min-width:0}
.fnc:not(:empty)::before{content:"";display:block;width:0.9in;border-top:0.75pt solid var(--k);margin-bottom:4pt}
p.fn{position:relative;padding-left:11pt;text-indent:0;margin:0 0 3pt;font-size:7.8pt;line-height:10pt}
p.fn:last-child{margin-bottom:0}
p.fn .fnn{position:absolute;left:0;top:0;font:700 7.8pt/10pt var(--sans)}
.danger .fnz{padding:0 9pt 6pt}

/* ---------- modes d'aperçu écran ---------- */
@media screen{
  body.contact{background:#cfcfcf;padding:0.6in}
  body.contact .sheet{zoom:.25;display:flex;flex-wrap:wrap;gap:1.2in 1.2in;width:33.3in}
  body.contact .spread{display:flex;gap:0;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .trim{position:relative;width:8in;height:10in;overflow:hidden;background:#fff}
  .trim.empty{background:transparent;box-shadow:none}
  .trim .page{position:absolute;top:-0.125in}
  .trim.r .page{left:0}.trim.v .page{left:-0.125in}
  .trim.r{box-shadow:inset 18px 0 22px -18px rgba(0,0,0,.35)}
  .trim.v{box-shadow:inset -18px 0 22px -18px rgba(0,0,0,.35)}
  body.single{background:#fff}
  body.single .trim{box-shadow:none}
}
#stats{display:none}

/* =====================================================================
   Ajouts du constructeur général (build_chapitre.py). Tout le reste vient
   tel quel de interieur.tpl.html.
   ===================================================================== */
/* régions d'une page : texte courant, encadré danger, variante d'urgence */
.rg{flex:1 1 0;min-height:0;display:flex;flex-direction:column}
.rg.fin{flex:none}
.block > .rg:not(:first-child){margin-top:10pt}
.block > .frame.auto + .rg, .block > .fnz + .rg{margin-top:12pt}
.rg .danger.full{flex:1 1 0}
.s9wrap.cont, .block > .s9wrap:first-child{margin-top:0}
.dcut:not(.on){display:none}

/* ouverture : titre long, note de lieu */
.open-title h1{hyphens:manual;line-height:1}   /* sur deux lignes, l’accent de la seconde touchait la première */
.lieu-note{margin:0;padding-top:6pt;text-indent:0;font:500 8.8pt/11.6pt var(--sans);letter-spacing:.01em;color:var(--k)}

/* étapes : paragraphe de suite, puce sous une étape, tableau sous une étape */
p.stepc{padding-left:19pt;text-indent:0;margin:0 0 4pt}
p.li.l2{padding-left:30pt}
p.li.l2::before{left:20pt}
p.lab{margin:5pt 0 3pt}
p.lab strong.runin{font-size:9.6pt;text-transform:uppercase;letter-spacing:.05em}
table.tcol{column-span:none;margin:3pt 0 7pt;break-inside:avoid}
table.tcol.nest{margin-left:19pt;width:calc(100% - 19pt)}
table.tcol td, table.tcol th{padding-right:5pt}
p.step + table.tcol, p.stepc + table.tcol{margin-top:1pt}

/* planches et photos dans le fil */
.fig{margin:0;break-inside:avoid}
.fig.pl.demi{column-span:all;margin:4pt 0 10pt}
.fig.pl.demi img{display:block;width:7in}
.fig.ph{margin:3pt 0 8pt}
.fig.ph img{display:block;width:100%;height:auto}
.fig.ph.demi{column-span:all}
.fig.ph figcaption{font:italic 600 7.8pt/10pt var(--sans);letter-spacing:.02em;margin-top:3pt}

/* encadré ordinaire (> hors section 8) */
.encadre{border:1pt solid var(--k);padding:5pt 7pt 3pt;margin:4pt 0 8pt;break-inside:avoid}
.encadre p{text-indent:0}
.danger .pt{orphans:4}   /* l’amorce en gras ne reste pas seule au pied d’une colonne */
.danger .pt .plead{break-after:avoid}

/* =====================================================================
   ÉTUDE DE COULEUR — trois variantes posées PAR-DESSUS le CSS du livre
   (interieur.tpl.html + chapitre.css, non modifiés). Injecté par
   variante.py. Classes de body :
     vA            A — discrète : la couleur du tome en accent
     vA vB         B — affirmée : A + aplat d'ouverture, teintes, bandeau 9
     vA vB vC      C — caractère : B + pictogrammes, chiffres clés, trame
     t1 … t6       couleur du tome ; lieu-m | lieu-c | lieu-2 : ligne de lieu
   Le rouge #9B2C1E reste le seul rouge, réservé au danger.
   ===================================================================== */

/* ---------- jetons de tome ----------
   --tf  aplat d'ouverture (le fond de la couverture)   --tfi encre sur l'aplat
   --tfn chiffre géant sur l'aplat                      --ta  filets, titre courant
   --tsq carrés, numéros d'étape, échelle               --t9  bandeau et tranche de la section 9
   --tp  teinte pâle (encadrés)   --tp2 teinte d'en-tête de tableau   --tx trame sur aplat
   Tome 2 : le bordeaux ne va qu'aux aplats, aux filets et aux teintes ; les carrés et
   le bandeau 9 restent noirs, pour que rien de petit et de plein ne ressemble au rouge. */
body.t1{--tf:#E2E7EA;--tfi:#15222B;--tfn:#2B5876;--ta:#2B5876;--tsq:#2B5876;--t9:#2B5876;--tp:#E8EDF0;--tp2:#D5DEE4;--tx:rgba(21,34,43,.075);--tx9:rgba(255,255,255,.07)}
body.t2{--tf:#5C1A15;--tfi:#F3ECE5;--tfn:#F3ECE5;--ta:#5C1A15;--tsq:#000;--t9:#000;--tp:#F3ECE5;--tp2:#E8DBD0;--tx:rgba(243,236,229,.07);--tx9:rgba(255,255,255,.07)}
body.t3{--tf:#1D392E;--tfi:#E9F0EA;--tfn:#E9F0EA;--ta:#2B5A45;--tsq:#2B5A45;--t9:#1D392E;--tp:#E9F0EA;--tp2:#D5E3D8;--tx:rgba(233,240,234,.07);--tx9:rgba(255,255,255,.07)}
body.t4{--tf:#25414F;--tfi:#EDF2F5;--tfn:#EDF2F5;--ta:#25414F;--tsq:#25414F;--t9:#25414F;--tp:#EDF2F5;--tp2:#D6E2E9;--tx:rgba(237,242,245,.07);--tx9:rgba(255,255,255,.07)}
/* Tomes 5 et 6 : proposition du 24 septembre 2026 (design/choix.md), à valider par JP.
   Tome 5, écorce : l'aplat est trop sombre pour les petits éléments, qui prennent un brun plus clair (comme le tome 1).
   Tome 6, rouille : même prudence que le tome 2 — la rouille ne va qu'aux aplats, filets et teintes ; carrés et bandeau 9 noirs. */
body.t5{--tf:#4B3A28;--tfi:#F2EBDF;--tfn:#F2EBDF;--ta:#6B5238;--tsq:#6B5238;--t9:#4B3A28;--tp:#F2EBDF;--tp2:#E3D6C3;--tx:rgba(242,235,223,.07);--tx9:rgba(255,255,255,.07)}
body.t6{--tf:#7A4424;--tfi:#F5ECE2;--tfn:#F5ECE2;--ta:#7A4424;--tsq:#000;--t9:#000;--tp:#F5ECE2;--tp2:#EBD8C8;--tx:rgba(245,236,226,.07);--tx9:rgba(255,255,255,.07)}

/* =============================== A — DISCRÈTE =============================== */
.vA .rh{border-bottom-color:var(--ta)}
.vA .rh .to{color:var(--ta)}
.vA h2.sec{border-top-color:var(--ta)}
.vA h2.sec .n{background:var(--tsq)}
.vA h2.sec.s8 .n{background:var(--red)}
.vA h2.sec.s9 .n{background:#fff;color:var(--k)}
.vA h3.sub{border-top-color:var(--ta)}

<template id="open"><header class="open"><div class="open-top"><span>Tome 2 · Le corps</span><span>Chapitre</span></div><div class="open-title"><div class="num">28</div><h1>Les maladies ordinaires qui durent</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span>Chalet</span><span class="on">Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">Une otite, une gorge, une gastro n’attendent pas la bascule : elles tombent sur la maison la semaine de la tempête comme sur le chalet en février. La méthode est la même aux deux endroits. Ce qui change, c’est l’eau chaude, la lumière pour regarder une gorge et la distance : à la maison, l’eau propre et la chaleur sont au robinet ; au chalet, chaque litre bouilli coûte du bois, l’air du poêle est sec, et la décision de partir (<span class="ref">ch. 35, 5</span>-C) se compte en heures de route. Aux deux endroits, le chapitre suppose qu’il n’y a pas de médecin.</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Garder un malade ordinaire en état de guérir seul — boire, dormir, respirer, uriner — pendant les quelques jours à quatre semaines que durent ces maladies, et reconnaître à temps les rares signes qui disent que l’infection a quitté son organe.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<h4 class="choix">C’est le bon choix quand :</h4>
<p class="li">La maladie porte un nom de la liste, la personne boit, urine et se réveille comme d’habitude, et on est dans la durée normale du tableau de la section 6. C’est le cas de la très grande majorité : sans antibiotique, deux otites sans gravité sur trois guérissent, plus lentement ; un mal de gorge passe en une semaine ; une sinusite virale, en moins de dix jours.</p>
<p class="li">Il n’y a plus d’antibiotique ni personne pour en prescrire. Le chapitre est écrit pour ce cas, et il nomme les sept infections sur lesquelles l’antibiotique change l’issue, et les trois où il ne suffit même pas (section 9).</p>
<p class="li">Un enfant « fait juste de la fièvre » depuis plus de trois jours. C’est la situation où le réflexe d’attendre encore est le mauvais (étape 14).</p>
<h4 class="choix">C’est un mauvais choix quand :</h4>
<p class="li">Toute la maisonnée a mal à la tête et au cœur, vomit, n’a pas de fièvre, et ça va mieux dehors. Ce n’est pas une gastro, c’est du monoxyde de carbone (étape 42, <span class="ref">ch. 26</span>).</p>
<p class="li">La « gastro » commence 12 à 72 heures après des conserves maison ou du poisson fumé, et les paupières tombent ou la vue double : c’est le botulisme (étape 42, <span class="ref">ch. 26</span>).</p>
<p class="li">La fièvre arrive 5 à 15 jours après un repas d’ours noir (<em>Ursus americanus</em>) ou de phoque, avec le visage enflé et les muscles douloureux, ou jusqu’à trois semaines après le dépouillement d’un lièvre, avec une plaie à la main et une bosse sous le bras. Ce sont des fièvres du territoire, pas des maladies ordinaires (étape 14, <span class="ref">ch. 52</span>, <span class="ref">ch. 48</span>).</p>
<p class="li">La fièvre suit une plaie (<span class="ref">ch. 26</span>) ou un mal de dent (<span class="ref">ch. 27</span>).</p>
<p class="li">Le ventre fait mal tout le temps et empire au moindre mouvement. C’est un ventre chirurgical, pas une gastro (<span class="ref">ch. 35</span>).</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0">Presque toutes ces maladies sont virales ou se règlent seules : le corps fait le travail en quelques jours. Ce qu’on fait sert à le garder en état de le faire — de l’eau, du sommeil, une température ni trop haute ni trop basse, des sécrétions qui s’écoulent au lieu de stagner dans l’oreille, le nez ou les bronches — et à ne pas nuire, ce qui arrive plus souvent qu’on croit : l’enfant fiévreux emmailloté, l’ibuprofène donné à un enfant déshydraté, à un rein infecté ou à une peau qui s’infecte, le furoncle du nez ouvert à la lame.</p>
<p>La fièvre n’est pas la maladie. C’est le thermostat que le corps remonte pour se battre, et elle ne fait en elle-même aucun mal. Son chiffre ne dit pas la gravité : une infection légère peut donner une forte fièvre, et une infection très grave, pas de fièvre du tout. Ce qui dit la gravité, surtout chez un enfant, c’est le comportement. Faire baisser le chiffre sert au confort ; ça ne soigne rien.</p>
<p>Chacune de ces maladies a une durée normale, et le danger ne vient presque jamais de la maladie restée à sa place : il vient de l’infection qui sort de son organe. L’oreille passe à l’os derrière elle, puis aux méninges ; la gorge fait un abcès, puis, des semaines plus tard, touche les articulations, le cœur ou les reins ; le sinus passe dans l’orbite de l’œil ; la vessie monte au rein, puis au sang ; la peau passe au sang. Les signes qui disent que la vie est en jeu sont les signes de ce passage, ou ceux d’un corps qui ne compense plus : la respiration qui s’accélère, la peau qui marbre, l’urine qui s’arrête, la conscience qui s’enfonce. D’où les deux outils du chapitre : <strong>compter</strong> (les respirations, les pipis, les jours) et <strong>regarder de nouveau</strong> à heures fixes. La rechute — ça allait mieux, et ça repart — est le signe de complication le plus simple à voir.</p>
<p>Un enfant de 4 ans situe mal ce qu’il sent : une pneumonie ou une angine lui fait dire « mal au ventre ». Ses signes se lisent dans ce qu’il fait — jouer, boire, répondre — bien plus que dans ce qu’il dit.</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Ce tableau ne liste que ce qui sert aux gestes du chapitre. Ce qui s’achète, en quelle quantité et dans quel ordre est au <span class="ref">ch. 00b</span> ; les médicaments se rangent, se datent et se dosent selon le <span class="ref">ch. 32</span>, <strong>à l’étiquette et nulle part ailleurs</strong>.</p>

graduée de 10 mL ou poire nasale</td><td>1 par personne</td><td>Cuillère à thé ; bouchon de bouteille d’eau, qui fait une mesure constante (<span class="ref">ch. 39</span>)</td><td>Oui</td></tr><tr><td class="c-item">Miel</td><td>1 pot</td><td>Le sirop de sapin du <span class="ref">ch. 34</span> (étape 1) : un sirop calme la toux surtout par son sucre (<span class="ref">ch. 34</span>, section 3)</td><td>Oui</td></tr><tr><td class="c-item">Débarbouillettes et linges de coton</td><td>Plusieurs par malade : un linge qui a touché du pus va bouillir</td><td>Drap déchiré, bouilli (<span class="ref">ch. 26</span>)</td><td>Oui</td></tr><tr><td class="c-item">Sac de sable chauffé, ou bouteille de métal à bouchon vissé, pour garder la chaleur</td><td>1</td><td>Pierre sèche chauffée près du poêle, roulée dans deux linges (<span class="ref">ch. 26</span> ; <span class="ref">ch. 34</span>, étape 3). Pas une bouteille de plastique mince : elle ramollit à l’eau presque bouillante, et son bouchon cède sous un poids</td><td>Oui</td></tr><tr><td class="c-item">Crayon feutre</td><td>1</td><td>Stylo à bille, charbon de bois, fil noué au bord de la rougeur (<span class="ref">ch. 26</span>)</td><td><span class="non">NON</span></td></tr><tr><td class="c-item">Lame neuve (scalpel ou lame de rasoir)</td><td>1 paquet</td><td>Couteau à lame fine affûté (<span class="ref">ch. 105</span>), bouilli 30 minutes</td><td>Oui</td></tr><tr><td class="c-item">Savon</td><td>1 pain réservé aux soins</td><td>Savon maison (<span class="ref">ch. 112</span>)</td><td><span class="non">NON</span></td></tr></tbody></table>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — Lire un malade, l’enfant d’abord</h3>
<p class="step"><span class="sn">1</span><strong>Regarder avant de mesurer.</strong> Est-ce qu’il joue, même un peu ? Est-ce qu’il boit ? Est-ce qu’il répond, sourit, regarde ? Un enfant brûlant qui rejoue entre deux montées de fièvre inquiète moins qu’un enfant tiède, mou, qui ne réclame rien (<span class="ref">ch. 39</span>). Les signes d’un enfant très atteint sont les mêmes quelle que soit la maladie : pleurs faibles ou gémissements, somnolent et difficile à réveiller, ne sourit plus, regard vide ou anxieux, pâle ou bleuté, tout mou.</p>
<p class="step"><span class="sn">2</span><strong>Prendre la température avec la bonne méthode, et lire le chiffre avec elle.</strong> De 2 à 5 ans, la prise dans les fesses est la plus juste ; l’oreille et l’aisselle dépannent. Passé 5 ans, la bouche. La main sur le front ne mesure rien. Si l’aisselle ne montre rien mais que l’enfant est chaud et mal en point, reprendre dans les fesses. Les seuils par méthode sont au <span class="ref">ch. 32</span> (section 6). L’heure où la fièvre commence s’écrit au crayon gras sur le cadre de la porte de la chambre : c’est d’elle que se comptent les jours.</p>
<p class="step"><span class="sn">3</span><strong>Compter les respirations.</strong> Une minute pleine à la montre, poitrine découverte, chez un enfant calme ou endormi — un enfant qui pleure respire vite pour une autre raison. Le chiffre se lit dans ce tableau :</p>
<table class="tcol nest"><colgroup><col style="width:42.6%"><col style="width:23.4%"><col style="width:34.0%"></colgroup><thead><tr><th>Âge</th><th>Au repos, normal</th><th>Rapide, à partir de</th></tr></thead><tbody><tr><td>1 à 5 ans (l’enfant de 4 ans)</td><td>20 à 30</td><td>40</td></tr><tr><td>Plus de 5 ans (l’enfant de 6 ans)</td><td>15 à 25</td><td>30</td></tr><tr><td>Adulte</td><td>—</td><td>Plus de 30 : signe de gravité</td></tr></tbody></table>
<p class="stepc">Le dernier compte s’écrit sur le cadre de porte, sous l’heure de la fièvre. Le chiffre qui monte d’un compte à l’autre compte autant que le seuil.</p>
<p class="step"><span class="sn">4</span><strong>Regarder respirer.</strong> Le tirage<sup class="fnr" data-fn="28-1">1</sup>, le battement des ailes du nez<sup class="fnr" data-fn="28-2">2</sup>, le geignement<sup class="fnr" data-fn="28-3">3</sup> et le stridor<sup class="fnr" data-fn="28-4">4</sup> se voient et s’entendent sans instrument, et chacun dit que la respiration coûte trop cher au corps.</p>
<p class="step"><span class="sn">5</span><strong>Compter les pipis et regarder l’urine.</strong> Un adulte boit jusqu’à uriner jaune pâle et clair. Plus de 8 heures sans uriner chez un enfant ou un adulte : c’est la déshydratation (étape 41 ; <span class="ref">ch. 26</span>, <span class="ref">ch. 30</span>).</p>
<p class="step"><span class="sn">6</span><strong>Chercher où est la fièvre, de la tête aux pieds, en pleine lumière.</strong> L’oreille (l’enfant se la tire, l’arrière est-il enflé ?) ; la gorge, à la lampe et à la cuillère ; le nez et le visage ; la respiration ; l’urine (brûle-t-il en urinant, a-t-il recommencé à mouiller ?) ; le ventre ; la peau, déshabillé au complet (une plaque rouge, des croûtes, des cloques en bande) ; les yeux ; les articulations. <strong>Un enfant qui boite avec de la fièvre</strong> a peut-être une infection de l’os ou de l’articulation, et ça ne se soigne pas ici. <strong>Un enfant qui dit « mal au ventre » avec de la fièvre</strong> a peut-être la gorge ou le poumon : on regarde la gorge et on compte les respirations avant de conclure au ventre.</p>
<p class="step"><span class="sn">7</span><strong>Passer le test du verre sur toute tache nouvelle</strong><sup class="fnr" data-fn="28-5">5</sup>, et sur un enfant fiévreux qui a l’air mal, même sans tache vue : on le déshabille et on cherche.</p>
<p class="step"><span class="sn">8</span><strong>Tester la nuque</strong> chez tout fiévreux qui a mal à la tête, vomit ou est somnolent<sup class="fnr" data-fn="28-6">6</sup>.</p>
<p class="step"><span class="sn">9</span><strong>Revoir à heures fixes, la nuit comprise.</strong> Matin et soir au minimum, plus souvent quand ça bouge. Un enfant fiévreux se regarde aussi la nuit, justement parce que c’est l’heure où personne ne le voit.</p>
<p class="step"><span class="sn">10</span><strong>Connaître la liste qui vaut pour toutes les maladies du chapitre.</strong> Chacun de ces signes veut dire que <strong>la vie est en jeu</strong>, quelle que soit la maladie de départ :</p>
<p class="li l2">des taches qui ne s’effacent pas sous le verre ;</p>
<p class="li l2">une nuque raide ;</p>
<p class="li l2">une respiration au-dessus du seuil de l’étape 3, un tirage, un geignement, des ailes du nez qui battent, un stridor au repos, des lèvres ou une langue bleues ou grises<sup class="fnr" data-fn="28-7">7</sup> ;</p>
<p class="li l2">un enfant difficile à réveiller, tout mou, dont le pleur est faible, aigu ou ne s’arrête pas ; un adulte confus, qui ne sait plus où il est ;</p>
<p class="li l2">une peau marbrée<sup class="fnr" data-fn="28-8">8</sup>, ou des mains et des pieds froids malgré la fièvre ;</p>
<p class="li l2">une convulsion de plus de 5 minutes (étape 13) ;</p>
<p class="li l2">une température trop basse chez un malade : 36,0 °C ou moins (dans les fesses chez l’enfant) ;</p>
<p class="li l2">plus de 8 heures sans uriner.</p>
<p class="stepc">Tous les signes ne sont pas toujours là en même temps. Un parent qui sent que quelque chose ne va pas, sans pouvoir dire quoi, se fie à ce sentiment : il recompte, il recherche les taches, et il ne se laisse pas rassurer par le chiffre du thermomètre. Devant l’un de ces signes, la décision de partir se prend maintenant et pas au matin (<span class="ref">ch. 35, 5</span>-C). En attendant, ou s’il n’y a nulle part où aller :</p>
<p class="li l2"><strong>s’il respire mal — stridor, tirage, geignement, ailes du nez, ou un enfant qui bave — il reste assis ou demi-assis, dans la position qu’il a choisie, et on ne le couche pas</strong> : l’enfant qui bave garde l’air ouvert par sa posture, et le coucher ferme le peu qui passe (étape 24, section 8) ; celui qui tire respire mieux demi-assis (étape 31). <strong>Rien par la bouche s’il bave ou n’avale plus sa salive</strong> : le liquide irait dans une voie qui se ferme. La position à plat du <span class="ref">ch. 35</span> (5-D) ne vaut pas pour lui ;</p>
<p class="li l2">sinon, couché sur le côté s’il est somnolent, de l’eau à petites gorgées s’il est bien réveillé ;</p>
<p class="li l2">dans les deux cas, ni emmailloté ni découvert au froid, et quelqu’un qui ne le quitte plus des yeux.</p>
<h3 class="sub">B — La fièvre, et celle qui ne tombe pas</h3>
<p class="step"><span class="sn">11</span><strong>Ce qui est normal.</strong> Chez l’enfant, une fièvre d’infection disparaît en général au bout de 72 heures, souvent entre 1 et 4 jours. Un adulte qui a chaud et froid et qui frissonne fait de la fièvre, même si le thermomètre marque moins de 38 °C.</p>
<p class="step"><span class="sn">12</span><strong>Soulager sans nuire.</strong></p>
<p class="li l2"><strong>Découvrir sans déshabiller.</strong> On retire les couvertures et les couches en trop pour laisser partir la chaleur. On ne met pas l’enfant nu : s’il grelotte, le frisson fabrique de la chaleur et la fièvre remonte. <strong>Pas d’éponge, pas d’enveloppement mouillé</strong> : c’est peu efficace, inconfortable, et ça refroidit un corps d’enfant jusqu’à l’hypothermie — au chalet, avec un plancher à 0 °C, le risque est réel (<span class="ref">ch. 25</span>, <span class="ref">ch. 39</span>).</p>
<p class="li l2"><strong>Faire boire,</strong> souvent, peu à la fois, et continuer d’offrir à manger.</p>
<p class="li l2"><strong>L’acétaminophène d’abord,</strong> selon l’étiquette. <strong>L’ibuprofène seulement à qui boit bien</strong> : le rein d’un corps qui manque d’eau encaisse mal l’anti-inflammatoire. Pas d’ibuprofène non plus pendant une varicelle, où il peut ouvrir la porte à une infection grave de la peau, ni sur une infection de la peau ou du rein (étapes 36 et 49). <strong>Ne pas alterner les deux molécules</strong> : les doses et les intervalles diffèrent, et c’est la façon la plus sûre de se tromper à 3 h du matin. <strong>Jamais d’AAS avant 18 ans</strong> (<span class="ref">ch. 32</span>, section 8).</p>
<p class="li l2"><strong>Une fièvre qui reste après le médicament ne dit pas, à elle seule, la gravité.</strong> Que le chiffre baisse ou non sous le médicament ne sépare pas une maladie grave d’une bénigne : le médicament sert au confort. Le <span class="ref">ch. 32</span> (section 6) fait d’une fièvre qui ne baisse pas malgré le médicament pendant plus de 4 heures le moment de poser la question du départ. La question se pose, et elle se tranche en refaisant l’étape 6 au complet et en relisant la liste de l’étape 10, pas au thermomètre. On ne réveille pas un enfant qui dort bien pour lui donner une dose.</p>
<p class="step pk-t"><span class="sn">13</span><strong>La convulsion fébrile.</strong> Elle touche 2 à 5 % des enfants de 6 mois à 5 ans — l’enfant de 4 ans est dans la tranche, celui de 6 ans en sort. Elle est souvent le premier signe de la fièvre : le corps se raidit, les yeux chavirent, la tête, les bras et les jambes font des secousses, l’enfant peut perdre connaissance. La plupart durent de 30 secondes à 2 minutes et ne laissent rien. <strong>Regarder l’heure au début.</strong> Coucher l’enfant sur le côté, sur une surface plate, loin de ce qui cogne. Ne pas le retenir. Ne rien mettre entre ses dents. Essuyer ce qui sort de sa bouche. Après, le garder sur le côté et le laisser dormir. <strong>Plus de 5 minutes, ou une deuxième crise dans les 5 minutes : la vie est en jeu</strong> (étape 10). Le médicament contre la fièvre ne prévient pas la convulsion : ce n’est pas une raison de doser plus souvent.</p>
<p class="step"><span class="sn">14</span><strong>La fièvre qui ne tombe pas.</strong></p>
<p class="li l2"><strong>Plus de 48 à 72 heures chez un enfant :</strong> on refait l’étape 6 au complet. Les trois endroits qu’on oublie sont l’oreille, l’urine — une fièvre sans cause chez un enfant fait penser à la vessie ou au rein (section G) — et le poumon, qui se compte (étape 3).</p>
<p class="li l2"><strong>Qui retombe, puis remonte :</strong> c’est une complication jusqu’à preuve du contraire — l’otite ou la pneumonie qui suit un rhume ou une grippe (<span class="ref">ch. 35</span>).</p>
<p class="li l2"><strong>5 jours ou plus chez un enfant, surtout avant 5 ans :</strong> penser à la maladie de Kawasaki<sup class="fnr" data-fn="28-9">9</sup>, qui enflamme les vaisseaux, ceux du cœur compris. Elle ne cède pas aux médicaments contre la fièvre. Traitée dans les 10 premiers jours, le risque pour les artères du cœur baisse nettement ; sans traitement, le cœur se prend une à quatre semaines plus tard, et la mort peut être soudaine. <strong>La vie est en jeu,</strong> et rien au chalet ne la traite : c’est une raison de partir pendant que les 10 jours courent (<span class="ref">ch. 35</span>).</p>
<p class="li l2"><strong>La fièvre du territoire.</strong> Trois questions à poser à tout fiévreux dont on ne trouve pas la source : qu’a-t-il mangé, dépouillé, et où s’est-il coupé dans les trois dernières semaines ? Une fièvre avec le visage enflé, des douleurs musculaires et la lumière qui fait mal, 5 à 15 jours après de l’ours ou du phoque, fait penser à une trichinellose ; ni le sel, ni le fumage, ni le gel domestique ne tuent ses larves, seule la cuisson à <strong>74 °C</strong> à cœur le fait (<span class="ref">ch. 52</span>, <span class="ref">ch. 56</span>). Une fièvre avec une plaie à la main et une bosse douloureuse sous le bras, 3 à 6 jours et jusqu’à trois semaines après un lièvre d’Amérique (<em>Lepus americanus</em>), fait penser à une tularémie : c’est pour elle que le lièvre se dépouille avec des gants (<span class="ref">ch. 48</span>). Une fièvre qui suit une plaie ou une dent appartient au <span class="ref">ch. 26</span> ou au <span class="ref">ch. 27</span>.</p>
<p class="li l2"><strong>Trop basse, pas seulement trop haute :</strong> chez un malade, 36,0 °C ou moins dans les fesses veut dire que la vie est en jeu (étape 10).</p>
<h3 class="sub">C — L’otite</h3>
<p class="step"><span class="sn">15</span><strong>Ce qu’on voit.</strong> L’enfant de 6 ans dit qu’il a mal à l’oreille. Celui de 4 ans ne le dit pas toujours : fièvre sans raison, irritable, dort mal, se tire l’oreille, n’entend plus les petits sons, perd l’équilibre. Elle arrive pendant ou juste après un rhume ; avant 5 ans, la trompe qui relie l’oreille à la gorge est courte, et le rhume y monte plus facilement. Du liquide peut couler de l’oreille, surtout au réveil : le tympan s’est percé pour laisser sortir le pus. <strong>Une oreille qui fait mal en même temps qu’une dent</strong> vient souvent de la dent, qui se soigne au <span class="ref">ch. 27</span> ; <strong>une oreille qui fait mal quand on avale</strong> vient souvent de la gorge (section D).</p>
<p class="step"><span class="sn">16</span><strong>Ce qu’on fait.</strong> Soulager la douleur, c’est le traitement : acétaminophène ou ibuprofène selon l’étiquette, ibuprofène seulement si l’enfant boit bien. Une débarbouillette tiède sur l’oreille. Rincer le nez à la solution saline, trois à six fois par jour (section 9). Si ça coule : essuyer le pavillon au coton sec, <strong>rien dans le conduit</strong> — ni coton-tige, ni doigt, ni goutte, ni lavage — et pas d’eau dans l’oreille tant qu’elle coule. Les décongestionnants et les antihistaminiques n’aident pas une otite : on ne les gaspille pas.</p>
<p class="step"><span class="sn">17</span><strong>Combien de temps c’est normal.</strong> Deux à trois jours pour la plupart, parfois jusqu’à une semaine. Sans antibiotique, deux otites sans gravité sur trois guérissent seules, plus lentement : devant une otite sans gravité, l’attente est un pari raisonnable. Après, du liquide peut rester des semaines derrière le tympan, et l’enfant entend un peu moins : ce n’est plus une infection, ça passe.</p>
<p class="step"><span class="sn">18</span><strong>Quand un antibiotique changerait quelque chose,</strong> s’il y en a un de prescrit pour cet enfant : fièvre de 39 °C ou plus, douleur forte, ou un enfant très malade depuis 48 heures. Sans antibiotique, on continue l’étape 16 et on surveille l’étape 19.</p>
<p class="step"><span class="sn">19</span><strong>La vie est en jeu quand</strong> l’arrière de l’oreille devient rouge, enflé et douloureux, et que l’oreille décolle de la tête : c’est la mastoïdite<sup class="fnr" data-fn="28-10">10</sup>, l’infection passée à l’os, d’où elle gagne les méninges ; ou quand l’otite s’accompagne d’une nuque raide, d’une somnolence ou de taches (étape 10). Sans aller jusque-là, <strong>une douleur qui résiste deux jours aux médicaments</strong> ou <strong>un enfant qui n’entend plus du tout</strong> sortent de la durée normale.</p>
<h3 class="sub">D — La gorge</h3>
<p class="step"><span class="sn">20</span><strong>Ce qu’on voit.</strong> Mal en avalant, gorge rouge, parfois des points blancs sur les amygdales. Le streptocoque touche surtout les enfants de 3 à 14 ans, donc les deux. Chez l’enfant, l’angine à streptocoque se présente comme un gros mal de gorge, de la fièvre, des ganglions enflés et sensibles au cou, <strong>souvent des maux de ventre, de tête et des nausées, et ni toux ni nez qui coule</strong>. Quatre signes la séparent d’un mal de gorge viral : fièvre de plus de 38 °C ; pas de toux ; ganglions du cou sensibles ; amygdales grosses ou couvertes de blanc. Zéro ou un signe : c’est viral. Deux ou plus : ça peut être le streptocoque. Une langue rouge framboise avec une éruption sur la peau, c’est la scarlatine, donc le streptocoque.</p>
<p class="step"><span class="sn">21</span><strong>Ce qu’on fait.</strong> Boire, froid de préférence. Sucer une glace sur bâton faite d’eau bouillie gelée dehors, un bâton de bois planté dedans (<span class="ref">ch. 39</span>). L’hiver, elle se rentre et attend que sa surface mouille avant d’aller dans la bouche : une surface qui mouille est à 0 °C et ne gèle plus rien. Sortie sèche du grand froid, et pire encore avec une cuillère de métal, elle colle aux lèvres et à la langue mouillées et arrache la peau en partant, comme la peau nue sur le métal gelé (<span class="ref">ch. 25</span>) : une plaie de plus dans une bouche qui refuse déjà d’avaler. Un bonbon dur ou une pastille au miel à sucer. Se gargariser à l’eau salée tiède — <strong>2,5 mL de sel (une demi-cuillère à thé) dans un verre d’eau tiède</strong>, puis cracher — pour l’adulte et l’enfant qui sait cracher ; celui qui avale n’en tire rien. Du miel dans une boisson chaude. Les antidouleurs selon l’étiquette.</p>
<p class="step"><span class="sn">22</span><strong>Combien de temps c’est normal.</strong> Trois à quatre jours pour une amygdalite, une semaine pour un mal de gorge. L’angine à streptocoque guérit en général sans traitement.</p>
<p class="step"><span class="sn">23</span><strong>Le prix du streptocoque sans antibiotique se paie plus tard.</strong> Deux complications, rares, arrivent quand la gorge est guérie depuis longtemps :</p>
<p class="li l2"><strong>2 à 3 semaines après,</strong> surtout entre 5 et 15 ans : une articulation — cheville, genou, coude, poignet — devient douloureuse, chaude et enflée, puis la douleur passe à une autre ; ou une douleur à la poitrine, un cœur qui bat vite. Plus tard encore, parfois après que tout le reste a disparu, des mouvements saccadés qu’il ne contrôle pas<sup class="fnr" data-fn="28-11">11</sup>. C’est le rhumatisme articulaire aigu, et ce sont les valves du cœur qu’il abîme. Le risque est très faible dans un pays comme le nôtre, mais c’est la raison d’être de l’antibiotique sur une angine.</p>
<p class="li l2"><strong>1 à 6 semaines après,</strong> en moyenne deux, surtout de 2 à 10 ans : <strong>urine foncée, moins d’urine, visage et paupières bouffis,</strong> puis les jambes. C’est le rein qui s’enflamme ; chez l’enfant, la plupart guérissent sans séquelle.</p>
<p class="stepc">Pendant les six semaines qui suivent une angine, on regarde l’urine du matin et le visage au réveil. C’est tout le suivi, et ça ne s’écrit nulle part.</p>
<p class="step"><span class="sn">24</span><strong>La vie est en jeu quand :</strong></p>
<p class="li l2"><strong>L’enfant bave, ne peut plus avaler sa salive, se tient assis penché en avant, la bouche ouverte, et fait un bruit aigu en inspirant</strong> — sans voix rauque et sans toux. C’est l’épiglotte qui enfle et ferme l’entrée de l’air<sup class="fnr" data-fn="28-12">12</sup> : rare chez un enfant vacciné, possible chez l’adulte, et mortelle. <strong>On ne le couche pas, et on ne lui regarde pas la gorge à la cuillère</strong> : l’un et l’autre peuvent aggraver l’obstruction. On le laisse assis sur les genoux d’un parent, dans la position qu’il a choisie (section 8).</p>
<p class="li l2"><strong>La douleur devient forte d’un seul côté, la voix s’étouffe, la bouche n’ouvre plus bien, et la luette est poussée de côté</strong> : c’est un abcès derrière l’amygdale<sup class="fnr" data-fn="28-13">13</sup>, qui peut gêner la respiration. <strong>Il ne s’ouvre pas ici</strong> (étape 54) : juste à côté de la gorge passent l’artère carotide et la grosse veine du cou, et à la lampe on ne voit pas jusqu’où va la poche. Ce qui se fait : assis, le gargarisme d’eau salée tiède, les antidouleurs selon l’étiquette, boire à petites gorgées tant qu’il avale, et la décision de partir, parce que seul le drainage le guérit (<span class="ref">ch. 35, 5</span>-C).</p>
<p class="li l2"><strong>L’enfant n’avale plus rien parce que ça fait trop mal.</strong> Là, ce n’est plus la gorge qui menace, c’est la déshydratation (section H).</p>
<h3 class="sub">E — Le nez et les sinus</h3>
<p class="step"><span class="sn">25</span><strong>Ce qu’on voit.</strong> Après un rhume : douleur des joues, du front ou autour des yeux, qui augmente quand on penche la tête en avant ; l’os sous l’œil fait mal quand on appuie ; nez bouché, écoulement jaune ou vert, odorat diminué ; peu ou pas de fièvre. Plusieurs dents du haut qui font mal en même temps, avec un nez bouché, c’est souvent le sinus et non les dents (<span class="ref">ch. 27</span>). L’enfant est irritable et respire par la bouche.</p>
<p class="step"><span class="sn">26</span><strong>Ce qu’on fait.</strong> Boire. Rincer le nez à la solution saline (section 9). Un linge chaud et mouillé sur le visage. L’adulte peut respirer la vapeur d’une eau qui a bouilli, pour le confort du nez bouché : elle n’a pas fait la preuve qu’elle abrège un rhume (<span class="ref">ch. 34</span>, étape 7). <strong>Jamais un bol d’eau bouillante sous le visage d’un enfant</strong>, qui s’ébouillante en le renversant. Essuyer le nez plutôt que se moucher fort : se moucher fort fait mal aux oreilles. Les antidouleurs selon l’étiquette.</p>
<p class="step"><span class="sn">27</span><strong>Combien de temps c’est normal.</strong> Un rhume dure une semaine, jusqu’à deux. Une sinusite virale guérit en moins de dix jours ; certaines traînent jusqu’à quatre semaines sans danger. Ce qui fait penser à une sinusite bactérienne, celle où un antibiotique aide : un écoulement coloré qui dure plus de 10 à 14 jours, des symptômes qui s’aggravent au bout de 5 à 7 jours de maladie au lieu de s’améliorer, ou une douleur forte avec forte fièvre.</p>
<p class="step pk-c"><span class="sn">28</span><strong>La vie est en jeu quand,</strong> chez un enfant surtout, <strong>les paupières ou le visage enflent avec une fièvre de plus de 39 °C</strong>. Le sinus est collé à l’orbite de l’œil ; l’infection passe dans l’orbite, et de là au cerveau. Les signes qui le disent : l’œil fait mal quand il bouge, il voit double, il avance hors de l’orbite<sup class="fnr" data-fn="28-14">14</sup>. Une paupière rouge et enflée après une piqûre de mouche noire, sans fièvre, avec un œil qui bouge librement et voit normalement, est en général une infection de la paupière seule, bénigne. Un mal de tête qui augmente avec une nuque raide : étape 8.</p>
<h3 class="sub">F — La toux qui descend : bronchite et pneumonie</h3>
<p class="step"><span class="sn">29</span><strong>Ce qu’on voit.</strong> Le rhume « descend » : la gorge, puis la voix, puis les bronches. <strong>La bronchite</strong> tousse fort, sec d’abord puis gras, avec une fièvre modérée — <strong>et la respiration n’est ni rapide ni essoufflée.</strong> <strong>La pneumonie</strong> tousse, fait de la fièvre (souvent plus de 39 °C chez l’enfant, mais parfois pas du tout, et c’est alors plutôt un mauvais signe), fait mal à la poitrine quand on respire ou qu’on tousse, donne de grands frissons, fatigue, coupe l’appétit — <strong>et la respiration est rapide.</strong> Chez l’enfant, c’est parfois le ventre qui fait le plus mal.</p>
<p class="step"><span class="sn">30</span><strong>Le geste qui les sépare, c’est le compte.</strong> L’oreille ne sépare pas une bronchite d’une pneumonie ; la montre, oui. Toux, fièvre et respiration au-dessus du seuil de l’étape 3 : c’est une pneumonie jusqu’à preuve du contraire. C’est la première cause infectieuse de mort chez l’enfant dans le monde, et à elle seule, plus d’un décès sur cinq entre 1 et 5 ans. Le bleu des lèvres n’apparaît que quand il manque déjà beaucoup d’oxygène : on n’attend pas le bleu, on compte.</p>
<p class="step"><span class="sn">31</span><strong>Ce qu’on fait.</strong></p>
<p class="li l2">Boire : l’eau rend le mucus plus facile à cracher.</p>
<p class="li l2">Demi-assis le jour, la tête relevée par des oreillers la nuit.</p>
<p class="li l2">Le nez dégagé à la solution saline (section 9), quatre à six fois par jour chez l’enfant.</p>
<p class="li l2">À manger et à boire à la cuillère, peu et souvent.</p>
<p class="li l2">La toux nettoie les bronches ; on ne la fait pas taire. <strong>Pas de sirop contre la toux avant 6 ans</strong> : rien ne prouve qu’il agit, ses effets secondaires rendent l’enfant plus malade, et bien des sirops contiennent déjà de l’acétaminophène, qui s’ajoute sans qu’on le voie à la dose donnée pour la fièvre. <strong>Jamais de codéine avant 12 ans</strong> : elle peut ralentir la respiration jusqu’à la mettre en danger. Contre la toux qui empêche de dormir, une cuillère de miel, dont l’effet n’est mesuré que sur les trois premiers jours de toux (<span class="ref">ch. 34</span>, étape 5), ou le jus d’un demi-citron et une à deux cuillères à thé de miel dans une tasse d’eau bouillie, pas trop chaude pour un enfant. Jamais de miel avant un an : il peut porter la bactérie du botulisme, qui fait sa toxine dans l’intestin d’un bébé. Sans miel, le sirop de sapin (<span class="ref">ch. 34</span>, section B), qui agit surtout par son sucre.</p>
<p class="li l2">Humidifier l’air sec du poêle avec une serviette mouillée étendue près du poêle, ou un bol d’eau à proximité — jamais un bol fumant devant le visage d’un enfant.</p>
<p class="step"><span class="sn">32</span><strong>Combien de temps c’est normal.</strong> Une infection des bronches va mieux en 7 à 10 jours ; la toux et les crachats peuvent durer trois semaines. Une pneumonie demande deux à quatre semaines. Avec un antibiotique, une pneumonie bactérienne doit aller mieux en 48 heures ; virale, elle guérit plus lentement.</p>
<p class="step"><span class="sn">33</span><strong>La vie est en jeu quand :</strong></p>
<p class="li l2">chez l’enfant : respiration au-dessus du seuil, tirage, geignement, ailes du nez qui battent, stridor, lèvres, langue ou gencives bleues ou grises, somnolent et difficile à réveiller, refuse de boire ;</p>
<p class="li l2">chez l’adulte : plus de 30 respirations ou plus de 125 battements de cœur à la minute (le pouls se compte comme au <span class="ref">ch. 26</span>, étape 36), confusion, bleu, sang dans les crachats ;</p>
<p class="li l2">après une bronchite, l’essoufflement apparaît, avec une fièvre de plus de 38,5 °C et des crachats de pus : les bronches se sont surinfectées ;</p>
<p class="li l2">une toux dure plus de trois semaines, ou étouffe l’enfant au point de vomir.</p>
<p class="stepc">Sans antibiotique et sans oxygène, rien de ce chapitre ne renverse une pneumonie grave (<span class="ref">ch. 30</span>, section 9). Ce qui se fait : demi-assis, boire, compter, et la décision de partir prise au premier signe, pas au troisième (<span class="ref">ch. 35, 5</span>-C).</p>
<h3 class="sub">G — L’infection urinaire</h3>
<p class="step"><span class="sn">34</span><strong>Ce qu’on voit.</strong> L’adulte : ça brûle en urinant, il faut y aller souvent pour peu, et vite ; l’urine est trouble, sent fort, parfois rosée ; le bas du ventre fait mal. L’enfant de 4 ou 6 ans : <strong>il recommence à mouiller alors qu’il était propre depuis des mois</strong>, pleure en urinant, a mal au ventre juste sous le nombril, ou fait de la fièvre sans autre raison. C’est plus fréquent chez les filles, dont l’urètre est court.</p>
<p class="step"><span class="sn">35</span><strong>La vessie ou le rein.</strong> La cystite, dans la vessie, ne donne pas de fièvre, ou peu, et pas de mal de dos. <strong>La pyélonéphrite, dans le rein,</strong> ajoute une fièvre de plus de 38 °C, une douleur <strong>au dos, juste sous les côtes, d’un côté</strong>, et souvent des nausées ou des vomissements.</p>
<p class="step"><span class="sn">36</span><strong>Ce qu’on fait.</strong></p>
<p class="li l2">Boire assez pour uriner pâle et régulièrement ; à petites gorgées si le cœur lève ; environ 1,5 L par jour chez l’adulte.</p>
<p class="li l2">Ne pas se retenir d’uriner : l’urine qui reste dans la vessie nourrit les bactéries. Chez l’enfant, régler la constipation, qui favorise l’infection.</p>
<p class="li l2">L’acétaminophène pour la douleur et la fièvre. <strong>Pas d’ibuprofène ni d’autre anti-inflammatoire devant des symptômes urinaires, et surtout pas dans une infection du rein</strong> : il diminue le sang qui passe dans le rein au moment où le rein se bat.</p>
<p class="li l2">La canneberge peut aider à prévenir ; elle ne soigne pas une infection commencée. On ne compte pas dessus.</p>
<p class="li l2">Chez une femme enceinte, rien ne s’attend : l’infection du rein y est plus grave qu’ailleurs (grossesse : <span class="ref">ch. 29</span>).</p>
<p class="step"><span class="sn">37</span><strong>Combien de temps c’est normal.</strong> Chez une femme en santé et non enceinte, une cystite peut passer seule : on peut attendre 48 heures en buvant. Une pyélonéphrite ne se laisse pas attendre de la même façon ; même traitée, elle demande jusqu’à deux semaines avant qu’on se sente capable de reprendre le travail.</p>
<p class="step"><span class="sn">38</span><strong>La vie est en jeu quand</strong> une pyélonéphrite s’accompagne de grands frissons, de vomissements qui empêchent de boire, de confusion ou de somnolence, ou d’une journée entière sans uriner. L’infection du rein non traitée peut passer au sang : c’est le sepsis (étape 10).</p>
<h3 class="sub">H — La gastro qui déshydrate</h3>
<p class="step"><span class="sn">39</span><strong>Ce qu’on voit.</strong> Les vomissements durent en général un à deux jours, la diarrhée cinq à sept. L’enfant se déshydrate bien plus vite que l’adulte (<span class="ref">ch. 39</span>).</p>
<p class="step"><span class="sn">40</span><strong>Ce qu’on fait.</strong> La réhydratation, sa recette et la façon de la faire boire sont au <span class="ref">ch. 30</span> (étape 20), au <span class="ref">ch. 39</span> (section 9, la glace à sucer, rentrée jusqu’à ce que sa surface mouille comme à l’étape 21) et au <span class="ref">ch. 26</span> (section 9) : elles ne se recopient pas ici. Continuer à nourrir (<span class="ref">ch. 39</span>). Ni jus de fruits ni boisson gazeuse seuls. <strong>Pas de médicament qui arrête la diarrhée avant 12 ans</strong>, ni chez l’adulte qui a de la fièvre, du sang ou des glaires dans les selles, ou des selles noires : ce n’est plus une gastro ordinaire (étape 41). L’acétaminophène si ça fait mal ; <strong>pas d’ibuprofène à un enfant déshydraté</strong> (étape 12). Toilette, linge et vaisselle : <span class="ref">ch. 31</span>.</p>
<p class="step"><span class="sn">41</span><strong>La vie est en jeu quand :</strong></p>
<p class="li l2">les signes de déshydratation s’installent<sup class="fnr" data-fn="28-15">15</sup> ;</p>
<p class="li l2">il vomit encore et ne garde rien au bout de 4 à 6 heures de petites cuillerées, ou il refuse de boire ;</p>
<p class="li l2"><strong>il vomit vert ou jaune-vert</strong><sup class="fnr" data-fn="28-16">16</sup>, ou du sang, ou un liquide qui ressemble à du marc de café ;</p>
<p class="li l2">il y a du sang dans les selles, ou elles sont noires ;</p>
<p class="li l2">le ventre fait mal soudainement et fort — tout le temps, au point de ne plus pouvoir penser, parler, dormir ni bouger — ou il fait mal sans arrêt et empire au moindre mouvement (<span class="ref">ch. 35</span>) ;</p>
<p class="li l2">la nuque est raide et la lumière fait mal (étape 8) : les premiers signes d’une méningite ressemblent à une gastro ;</p>
<p class="li l2">les vomissements durent plus de deux jours, ou la diarrhée plus de sept.</p>
<p class="step"><span class="sn">42</span><strong>Ce qui ressemble à une gastro et n’en est pas une.</strong></p>
<p class="li l2"><strong>Le monoxyde de carbone.</strong> Mal de tête, fatigue, nausées, vomissements, étourdissements, chez plusieurs personnes en même temps, <strong>sans fièvre</strong>, et ça va mieux dehors. Le gaz ne se voit pas, ne se sent pas et n’irrite ni les yeux ni la gorge : on met tout sur le dos d’un virus et on retourne se coucher dans la pièce qui empoisonne. Chez l’enfant, qui respire plus vite, il arrive en premier, et il a l’air fatigué ou de mauvaise humeur. <strong>Une génératrice ne fonctionne jamais dans un bâtiment, un garage ni sous un auvent, même porte ouverte.</strong> Même règle pour un barbecue, un réchaud au propane et une chaufferette à combustion : l’eau des compresses, de la solution saline et des linges bouillis se chauffe sur le poêle à bois ou dehors. Sortir tout le monde (<span class="ref">ch. 26</span>, <span class="ref">ch. 39</span> ; section 8).</p>
<p class="li l2"><strong>Le botulisme.</strong> 12 à 72 heures (parfois 2 heures, parfois 8 jours) après des conserves maison ou du poisson fumé, salé ou sous vide : paupières qui tombent, vision double, bouche sèche, peine à avaler et à parler, faiblesse qui descend de la tête vers les jambes. <strong>La toxine ne change ni l’odeur, ni le goût, ni l’apparence de l’aliment</strong>, et celle du poisson, le type E, se fabrique dès <strong>3 °C</strong>, donc au frigo. Conduite au <span class="ref">ch. 26</span>.</p>
<p class="li l2"><strong>Toute la maisonnée prise de diarrhée le même jour :</strong> une source commune, eau ou aliment, et non les mains (<span class="ref">ch. 31</span>, <span class="ref">ch. 10</span>). Le gibier servi à la maisonnée se cuit à <strong>74 °C</strong> à cœur.</p>
<h3 class="sub">I — L’œil rouge</h3>
<p class="step"><span class="sn">43</span><strong>Ce qu’on voit.</strong> Le blanc de l’œil rose ou rouge, une sensation de sable, des larmes, une paupière un peu enflée, collée au réveil — <strong>et une vision normale.</strong> Du pus épais, des cils collés, un seul œil au début : plutôt une bactérie. Beaucoup de larmes claires, sans démangeaison : plutôt un virus. Des démangeaisons fortes et des paupières enflées : plutôt une allergie.</p>
<p class="step"><span class="sn">44</span><strong>Chercher ce qui est entré.</strong> Au chalet, un œil rouge d’un seul côté peut cacher un corps étranger : bran de scie, éclat de bois, aiguille d’épinette. On regarde en pleine lumière, l’œil qui regarde en haut, en bas, de chaque côté, et on rince à l’eau bouillie refroidie. <strong>Ce qui reste collé ou planté après le rinçage ne se retire pas</strong> — ni à la pointe d’une aiguille, ni au coin d’un couteau ou d’un linge — et on ne frotte pas : l’œil est en jeu (étape 47). Un corps étranger dans l’œil fait vérifier le tétanos comme une plaie (<span class="ref">ch. 26</span>). Deux sosies de la conjonctivite viennent de l’atelier :</p>
<p class="li l2"><strong>L’éclat de métal.</strong> Après un travail au marteau, au burin ou à la meule, un œil rouge d’un seul côté est un éclat jusqu’à preuve du contraire. L’acier trempé qui éclate part plus vite que le clignement (<span class="ref">ch. 111</span>, section 8-E), et ce qui frappe l’œil à cette vitesse peut le percer.</p>
<p class="li l2"><strong>Le coup d’arc.</strong> Des yeux rouges, pleins de sable, qui pleurent et ne supportent plus la lumière, 6 à 12 heures après une soudure — même chez qui ne regardait pas l’arc — ou après une journée au soleil sur la neige. C’est l’ultraviolet qui a brûlé la surface de l’œil, pas un microbe. Un linge mouillé sur les yeux, qui arrête leur mouvement, et du repos ; ça guérit en un à deux jours si on ne s’y expose plus (<span class="ref">ch. 107</span>, section 7 ; <span class="ref">ch. 89</span>, section 8).</p>
<p class="step"><span class="sn">45</span><strong>Ce qu’on fait.</strong> Nettoyer quatre fois par jour à l’eau bouillie refroidie ou à la solution à 9 g par litre (section 9), <strong>un coton neuf pour chaque œil</strong>, en essuyant de l’intérieur vers l’extérieur, toujours dans le même sens. Une débarbouillette froide quelques minutes. Ne pas frotter ; chacun sa serviette et sa taie d’oreiller. <strong>Jamais les vieilles gouttes à la cortisone d’un autre traitement</strong> : un œil rouge qui larmoie avec une sensation de sable peut être un herpès de la surface de l’œil, et la cortisone réveille ce virus.</p>
<p class="step"><span class="sn">46</span><strong>Combien de temps c’est normal.</strong> Environ deux semaines. Un œil qui n’est pas guéri au bout de sept jours se regarde de nouveau.</p>
<p class="step"><span class="sn">47</span><strong>L’œil ou la vie est en jeu quand :</strong></p>
<p class="li l2">l’œil fait vraiment mal, bien plus qu’un grain de sable, la lumière fait mal, ou la vision change : ce n’est plus la membrane qui est touchée, c’est l’œil lui-même ;</p>
<p class="li l2">un éclat a frappé l’œil à grande vitesse, ou quelque chose y reste collé ou planté après le rinçage (étape 44) ;</p>
<p class="li l2">la paupière est rouge et enflée avec de la fièvre, et l’œil fait mal quand il bouge, voit double ou avance (étape 28) ;</p>
<p class="li l2">les yeux sont rouges <strong>sans écoulement</strong> chez un enfant fiévreux depuis plusieurs jours, avec une éruption : certaines maladies graves commencent comme une conjonctivite (étape 14, Kawasaki).</p>
<h3 class="sub">J — La peau qui s’infecte : cellulite, abcès, impétigo</h3>
<p class="p0 lab kh"><strong class="runin">La cellulite</strong></p>
<p class="step"><span class="sn">48</span><strong>Ce qu’on voit.</strong> Une plaque de peau rouge, chaude, enflée et douloureuse, parfois avec des cloques, le plus souvent au bas de la jambe. Elle part d’une égratignure, d’une piqûre, d’une morsure, d’une gerçure, d’un pied d’athlète — parfois d’une brèche trop petite pour qu’on la voie. Souvent, la fièvre, des ganglions enflés et un malaise de grippe. Elle ne s’attrape pas d’une autre personne.</p>
<p class="step"><span class="sn">49</span><strong>Ce qu’on fait.</strong></p>
<p class="li l2"><strong>Tracer le bord de la rougeur au crayon feutre, avec l’heure</strong> (<span class="ref">ch. 26</span>, étape 26). C’est la seule mesure qui existe, et elle tranche.</p>
<p class="li l2">Repos, la partie atteinte surélevée sur un oreiller ou une chaise ; bouger régulièrement l’articulation voisine pour qu’elle ne raidisse pas ; boire.</p>
<p class="li l2">L’acétaminophène. <strong>Pas d’ibuprofène sur une cellulite</strong> : l’anti-inflammatoire pourrait favoriser l’infection qui mange les tissus profonds.</p>
<p class="li l2">Vérifier le tétanos (<span class="ref">ch. 26</span>).</p>
<p class="step"><span class="sn">50</span><strong>Ce que ça donne.</strong> Avec un antibiotique, la guérison prend une semaine à dix jours. Sans, une cellulite peut passer au sang, aux muscles et aux os. Une rougeur qui dépasse son trait chaque jour est la situation du chapitre où l’antibiotique est ce qui guérit, et rien d’autre (<span class="ref">ch. 26</span>).</p>
<p class="step"><span class="sn">51</span><strong>La vie est en jeu quand :</strong></p>
<p class="li l2">la rougeur dépasse le trait de la veille, ou des traînées rouges remontent vers l’aisselle ou l’aine<sup class="fnr" data-fn="28-17">17</sup> ;</p>
<p class="li l2">la fièvre monte avec des frissons, le cœur ou la respiration s’accélèrent, des taches violacées apparaissent, la personne est étourdie, confuse, la peau froide et moite : l’infection est dans le sang ;</p>
<p class="li l2">la douleur est <strong>hors de proportion</strong> avec ce qu’on voit, la peau devient insensible, la rougeur avance à vue d’œil, la peau crépite sous le doigt ou noircit : c’est l’infection qui mange les tissus profonds<sup class="fnr" data-fn="28-18">18</sup>, une urgence de salle d’opération ;</p>
<p class="li l2">la cellulite touche l’œil ou le tour de l’œil (étape 28).</p>
<p class="p0 lab kh"><strong class="runin">L’abcès et le furoncle</strong></p>
<p class="step"><span class="sn">52</span><strong>Ce qu’on voit.</strong> Une bosse ronde, chaude et douloureuse, dont le centre devient mou quand le pus s’y rassemble. Le furoncle est un petit abcès centré sur un poil, avec une pointe blanche, aux cuisses, à l’aine, aux fesses, aux aisselles, au cou ou au dos, en général sans fièvre. <strong>Une bosse dure, qui ne bouge pas, qui grossit ou dure plus de deux semaines n’a pas l’allure d’un abcès</strong> et ne s’ouvre pas.</p>
<p class="step pk-t"><span class="sn">53</span><strong>Ce qu’on fait.</strong> Laver à l’eau et au savon deux fois par jour et couvrir d’un pansement sec. Appliquer une compresse chaude et humide <strong>10 minutes, quatre fois par jour</strong> (section 9) : la chaleur aide l’abcès à crever seul, et les petits le font souvent. <strong>On ne presse pas un furoncle, on ne le pique pas</strong> : il s’ouvre seul sous la chaleur, ou à la lame dans les conditions de l’étape 54, et au centre du visage jamais (section 8). Une fois ouvert, on continue de laver et de couvrir jusqu’à ce que ce soit refermé. Le linge du malade se lave à part.</p>
<p class="step pk-d"><span class="sn">54</span><strong>Ouvrir un abcès.</strong> Seulement quand les cinq conditions sont réunies : le centre est mou, la poche est juste sous la peau, bien délimitée — on en sent le bord tout autour — et fait moins de 5 cm environ, elle ne crève pas seule malgré la chaleur, <strong>l’endroit n’est pas sur la liste qui suit</strong>, et la personne est un adulte capable de rester immobile. On n’ouvre <strong>jamais</strong> : le devant ou le côté du cou ; le centre du visage<sup class="fnr" data-fn="28-19">19</sup> ; l’intérieur de la bouche et de la gorge ; la main ; le tour de l’anus ; le sein ; près d’une grosse artère, comme le pli de l’aine où l’on sent battre le pouls ; un abcès qui touche un os ou une articulation. Au cou et dans la gorge, l’artère carotide et la grosse veine du cou passent juste à côté, et on ne voit pas jusqu’où va la poche ; au centre du visage, l’infection monte vers le cerveau (section 8) ; près d’une artère, la lame ou le doigt tombe sur elle ; sur l’os ou l’articulation, c’est l’os ou l’articulation qui est infecté, et ça ne se vide pas à la lame (étape 6) ; à la main, le pus peut être dans la gaine des tendons qui plient les doigts, qui ne se vide pas d’un trait ; au tour de l’anus, la poche part de l’intérieur du canal et peut traverser le muscle qui retient les selles, que la lame couperait ; au sein, la poche est profonde et cloisonnée, une bosse n’y est pas toujours du pus — un kyste de lait ou une tumeur y ressemblent —, et chez une femme qui allaite, le lait peut ensuite sortir par la plaie et l’empêcher de guérir. Ceux-là restent à la chaleur, et la décision de partir se prend (<span class="ref">ch. 35, 5</span>-C). Un enfant et un gros abcès ne s’ouvrent pas au chalet non plus : les deux demandent qu’on endorme, et on n’a pas de quoi. 1. Se laver les mains au savon ; laver la peau autour à l’eau et au savon. 2. Lame neuve, ou lame fine bouillie 30 minutes (section 9). 3. Tenir la bosse entre le pouce et l’index de l’autre main. La lame perpendiculaire à la peau. 4. <strong>Un seul trait franc, dans le grand axe de la bosse</strong>, au centre mou, assez long pour y entrer un doigt. 5. Laisser couler. Un doigt ganté, ou lavé au savon, entre dans la cavité et défait les cloisons s’il y en a : il doit rester une seule poche, sinon une loge pleine de pus reste fermée. <strong>Si le doigt sent battre un pouls au fond, ou touche l’os, il ressort</strong> : on laisse couler, on rince et on couvre, sans aller plus loin. Rincer la cavité à grande eau au jet de seringue ou de bouteille percée, avec de l’eau bouillie refroidie ou la solution à 9 g par litre (<span class="ref">ch. 26</span>, étape 22). 6. Couvrir d’un pansement sec. Reprendre les compresses chaudes et le lavage.</p>
<p class="stepc">Ce qu’on perd : l’anesthésie. Le geste fait mal, le doigt surtout, et c’est pour ça qu’il se limite à la petite poche molle et superficielle d’un adulte ; la vitesse du trait unique fait le reste.</p>
<p class="step pk-d"><span class="sn">55</span><strong>La vie est en jeu quand</strong> la rougeur s’étend autour de la bosse (c’est une cellulite, étape 51), que la fièvre et les frissons arrivent, qu’une boiterie ou une douleur d’os apparaît près de l’abcès (l’infection passée à l’os ou à l’articulation), ou que le furoncle est au centre du visage (section 8).</p>
<p class="p0 lab kh"><strong class="runin">L’impétigo</strong></p>
<p class="step"><span class="sn">56</span><strong>Ce qu’on voit.</strong> Des plaies ou des cloques rouges qui crèvent vite et laissent des croûtes jaune-brun, couleur de miel, comme des flocons de maïs collés sur la peau, autour du nez, de la bouche et sur les mains. Il pousse sur une peau déjà abîmée : piqûres de mouches noires grattées, égratignures, eczéma, herbe à puce. <strong>Il ne donne pas de fièvre</strong> : un enfant qui en a fait de la fièvre, de l’enflure et de la douleur, l’infection est passée plus profond. Il est très contagieux, par la peau et par les serviettes.</p>
<p class="step"><span class="sn">57</span><strong>Ce qu’on fait.</strong> Laver à l’eau et au savon deux à trois fois par jour et bien sécher. Couper les ongles ras. Ne pas gratter, ne pas toucher, couvrir d’un pansement. Chacun sa débarbouillette, sa serviette et sa taie, lavées chaud. L’enfant atteint ne met pas la main à la nourriture des autres. Chercher dessous des poux ou la gale, qui l’entretiennent (<span class="ref">ch. 31</span>).</p>
<p class="step"><span class="sn">58</span><strong>Combien de temps c’est normal.</strong> Sans traitement, il reste contagieux 7 à 21 jours, jusqu’à ce que toutes les plaques aient séché en croûte.</p>
<p class="step"><span class="sn">59</span><strong>Après.</strong> Le même streptocoque peut enflammer le rein une à six semaines plus tard (étape 23) : on regarde l’urine du matin et les paupières au réveil autour de la troisième semaine.</p>
<p class="step"><span class="sn">60</span><strong>La vie est en jeu quand</strong> l’impétigo s’accompagne de fièvre, d’une rougeur qui s’étend ou de traînées rouges (étape 51).</p>
<h3 class="sub">K — Le zona</h3>
<p class="step"><span class="sn">61</span><strong>Ce qu’on voit.</strong> D’abord, une zone de peau qui picote ou qui fait mal, parfois un mal de tête et un malaise. Quelques jours plus tard, une éruption <strong>d’un seul côté du corps</strong>, en bande — le plus souvent sur le thorax ou le ventre, parfois au visage : des plaques, puis des cloques groupées qui démangent et coulent, puis sèchent en croûte. Une éruption des deux côtés n’est probablement pas un zona. C’est surtout une maladie d’adulte : le virus de la varicelle, resté endormi, se réveille.</p>
<p class="step"><span class="sn">62</span><strong>Ce qu’on fait.</strong> Laver à l’eau et au savon deux fois par jour, garder propre et sec. Vêtements amples. Une compresse fraîche quelques fois par jour — un linge mouillé, ou de la glace dans une serviette. Un pansement qui ne colle pas. L’acétaminophène.</p>
<p class="step"><span class="sn">63</span><strong>Qui garder loin.</strong> Tant que les cloques coulent, le zona donne <strong>la varicelle</strong> à qui ne l’a jamais eue ni reçu le vaccin : une femme enceinte dans ce cas, un bébé de moins d’un mois, une personne aux défenses affaiblies. On couvre l’éruption de vêtements amples. Savoir qui, dans la maisonnée, a eu la varicelle ou le vaccin se vérifie avant, pendant que tout marche.</p>
<p class="step"><span class="sn">64</span><strong>Combien de temps c’est normal.</strong> L’éruption met jusqu’à quatre semaines à guérir ; la peau peut rester douloureuse des semaines, parfois des mois. Le médicament contre le virus agit surtout s’il est commencé dans les trois jours qui suivent l’éruption.</p>
<p class="step"><span class="sn">65</span><strong>L’œil est en jeu quand</strong> l’éruption touche le tour de l’œil ou le nez, ou quand la vision change : le zona de l’œil peut coûter la vue. Un côté du visage qui tombe, une oreille qui entend moins : le zona touche le nerf du visage. Des cloques qui s’infectent (pus, rougeur qui s’étend) passent à la section J.</p>
<h3 class="sub">L — Les rappels qui s’appliquent ici</h3>
<p class="li"><strong>Le monoxyde de carbone se déguise en malade</strong> (étape 42). La maisonnée qui soigne calfeutre, chauffe plus, fait bouillir de l’eau toute la journée et sort moins : exactement ce qui l’accumule. Rien d’autre qu’un avertisseur ne le détecte (<span class="ref">ch. 26</span> ; section 8).</p>
<p class="li"><strong>Ne pas soigner au cèdre.</strong> Une maisonnée qui veille un malade fait des tisanes chaudes pour la gorge et la toux. Le thuya occidental (<em>Thuja occidentalis</em>), qu’on appelle cèdre ici, contient de la thuyone, un poison des nerfs. Pour une tisane, c’est le sapin baumier (<em>Abies balsamea</em>) ou l’épinette (<em>Picea mariana</em>, <em>Picea glauca</em>), et c’est la seule plante que le livre donne à un enfant (<span class="ref">ch. 20</span>, <span class="ref">ch. 33</span>). Aucune plante du <span class="ref">ch. 33</span> ne soigne une des infections de ce chapitre ; la tisane vaut pour la chaleur et le liquide.</p>
<p class="li"><strong>Un convalescent ne se nourrit pas de bouillon de lièvre.</strong> Des semaines de viande maigre seule, lièvre ou dos d’orignal (<em>Alces americanus</em>) sans gras, donnent le mal de caribou, mortel en quelques semaines. Le malade qui reprend a besoin de gras (<span class="ref">ch. 19</span>, <span class="ref">ch. 72</span>).</p>
<p class="li"><strong>Ni le foie ni les reins d’un cervidé pour le convalescent.</strong> Le réflexe ancien est de servir du foie à qui est affaibli. Le foie et les reins d’orignal, de caribou et de cerf peuvent contenir beaucoup de cadmium, qui s’accumule dans le foie et les reins de qui les mange et s’en élimine très lentement ; aucune cuisson n’enlève un métal (<span class="ref">ch. 22</span>).</p>
<p class="li"><strong>Le gibier se cuit à 74 °C à cœur</strong>, et l’ours et le phoque sans exception : la personne la moins capable d’encaisser une intoxication est celle qu’on nourrit (<span class="ref">ch. 26</span>).</p>
<p class="li"><strong>Le botulisme ne change ni l’odeur, ni le goût, ni l’apparence</strong> (étape 42).</p>
