<body class="vA vB vC t5 lieu-c">
<div id="book"></div>
<template id="open"><header class="open"><div class="open-top"><span>Tome 5 · La forêt, le jardin et le chalet</span><span>Chapitre</span></div><div class="open-title"><div class="num">98</div><h1>Ce qui nourrit un hiver</h1></div><div class="open-meta"><div class="lieu"><b>Lieu</b><div class="opts"><span>Maison</span><span class="on">Chalet</span><span>Les deux</span></div></div><ol class="toc"><li class="" data-n="1"><span class="n">1</span><span class="t">En une ligne</span><span class="f"></span></li><li class="" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span><span class="f"></span></li><li class="" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span><span class="f"></span></li><li class="" data-n="4"><span class="n">4</span><span class="t">Matériel</span><span class="f"></span></li><li class="" data-n="5"><span class="n">5</span><span class="t">Procédure</span><span class="f"></span></li><li class="" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span><span class="f"></span></li><li class="" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span><span class="f"></span></li><li class="d" data-n="8"><span class="n">8</span><span class="t">Danger</span><span class="f"></span></li><li class="h" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="f"></span></li></ol></div><p class="lieu-note">Le champ, le caveau et le fléau sont au chalet, et ce chapitre ne sert que si l’événement dure plus d’un été : la première récolte arrive trois à quatre mois après la plantation. Ce qui se fait à la maison se fait <strong>avant</strong>, tant que tout marche : la semence — pommes de terre, orge nue, gourganes, pois entiers — s’achète et se garde là (<span class="ref">ch. 00b</span>, <span class="ref">ch. 100</span>). Si la bascule du <span class="ref">ch. 2</span> arrive au printemps, un terrain du village peut porter les pommes de terre de la première année pendant que le champ du chalet s’ouvre (<span class="ref">ch. 96</span>).</p></header></template>
<template id="story-main">
<h2 class="sec" data-n="1"><span class="n">1</span><span class="t">En une ligne</span></h2>
<p class="lead">Un champ de subsistance — la pomme de terre d’abord, puis les racines et le chou, les pois et les gourganes secs, l’orge battue au fléau — porte sur 1 000 à 3 800 m², selon ce que la terre rend, environ la moitié des calories d’un hiver de quatre personnes, et ce qu’il donne se garde de quatre à huit mois au caveau pour les racines, longtemps pour le grain bien sec.</p>
<h2 class="sec" data-n="2"><span class="n">2</span><span class="t">Quand l’utiliser</span></h2>
<p class="p0 lab kh"><strong class="runin">Le bon choix.</strong></p>
<p class="li"><strong>L’événement dure plus d’un été.</strong> Le stock du <span class="ref">ch. 5</span> se compte en mois ; le champ prend le relais, et il se sème un printemps d’avance. Rien de ce qui n’est pas planté en mai ne se mange en septembre : la décision se prend au premier printemps, même si on espère ne jamais en avoir besoin.</p>
<p class="li"><strong>L’hiver se passe à la viande maigre.</strong> Le gibier donne la protéine et presque rien d’autre. On ne dépasse pas 35 % de son énergie en protéines, 30 % chez l’enfant (<span class="ref">ch. 21</span> <span class="ref">§5</span>.3) ; le reste doit venir du gras ou de l’amidon. Le champ fait l’amidon que la forêt ne fait pas : les 520 g de glucides par jour de la famille, c’est environ 300 kg de pommes de terre par 100 jours (<span class="ref">ch. 21</span> <span class="ref">§5</span>.4). <strong>Viande maigre seule : le mal de caribou, mortel en quelques semaines</strong> (<span class="ref">ch. 19</span>). La pomme de terre et le grain sont une moitié du remède ; le gras est l’autre (<span class="ref">ch. 72</span>).</p>
<p class="li"><strong>La terre est une trouée de pessière acide.</strong> Ce n’est pas un défaut pour tout. La pomme de terre fait moins de gale en sol acide, et l’avoine rend encore bien entre un pH de 5 et 5,5, là où l’orge et le blé préfèrent 6 à 7. Sur une terre neuve, on commence par elles.</p>
<p class="li"><strong>On est sur la Côte-Nord.</strong> La région est un pôle de la pomme de terre de semence au Québec, justement parce que son éloignement et son climat frais la tiennent loin des insectes et des maladies. Un carré isolé au chalet part avec le même avantage, tant qu’on n’y apporte pas soi-même la maladie (<span class="ref">§5-B</span>).</p>
<p class="p0 lab kh"><strong class="runin">Le mauvais choix.</strong></p>
<p class="li"><strong>Prendre le jardin familial pour un champ.</strong> Environ 100 m² de légumes de garde — pommes de terre, racines, choux, oignons — donnent, dans un bon jardin fumé et arrosé, de l’ordre de 300 kg : 150 000 kcal, soit <strong>seize jours</strong> de la famille. Le jardin du <span class="ref">ch. 95</span> fait la vitamine, le goût et le moral ; l’hiver demande dix à quarante fois plus de terre.</p>
<p class="li"><strong>Semer sans avoir gardé la semence l’automne d’avant.</strong> La pomme de terre rend à la terre du cinquième au quart de sa récolte, le grain du vingtième au huitième (<span class="ref">§3</span>). Ce qui n’a pas été mis de côté en octobre n’existe pas en mai (<span class="ref">ch. 100</span>).</p>
<p class="li"><strong>Faire du blé à pain (<em>Triticum aestivum</em>) la base du plan.</strong> Le blé mûrit 10 jours après l’orge si le mois qui suit la floraison est chaud et sec, 20 à 25 jours après s’il est frais et mouillé, et une gelée légère à l’épiaison rend l’épi stérile. Le blé du pain reste au stock (<span class="ref">ch. 5</span>, <span class="ref">ch. 88</span>) ; au champ, il se tente sur une planche d’essai.</p>
<p class="li"><strong>Compter ses calories sur la courge, le haricot ou le maïs.</strong> Sous un climat subarctique, la courge d’hiver se cultive à travers un plastique transparent ; le haricot ne mûrit pas en sol froid, rend bien les étés chauds sous ce même plastique, et gèle au premier froid. Ce sont des paris de belle année (<span class="ref">ch. 97</span>, <span class="ref">ch. 99</span>), pas un plan.</p>
<p class="li"><strong>Mettre le grain à l’automne.</strong> Le grain du plan est un grain de printemps (<span class="ref">ch. 99</span>, étape 7). Le seul semis d’automne qui a une chance, le seigle, se fait sur une planche d’essai (<span class="ref">§5-F</span>).</p>
<p class="p0 ri"><strong class="runin">Ce qui n’est pas dans ce chapitre.</strong> Le potager, l’eau, le compost et la toile contre le gel : <span class="ref">ch. 95</span>. Ouvrir le champ, la cendre, le varech, le poisson, la rotation et la première année en poquets et en billons : <span class="ref">ch. 96</span>. Les semis dans la maison, le châssis, le tunnel et la serre : <span class="ref">ch. 97</span>. Le foin, la faux et les Trois Sœurs : <span class="ref">ch. 99</span>. Garder la semence : <span class="ref">ch. 100</span>. Le caveau : <span class="ref">ch. 79</span>. La choucroute : <span class="ref">ch. 80</span>. Moudre, garder le grain et cuire : <span class="ref">ch. 88</span>.</p>
<h2 class="sec" data-n="3"><span class="n">3</span><span class="t">Pourquoi ça marche</span></h2>
<p class="p0">Une plante de garde met le soleil de l’été en réserve dans un organe fait pour attendre : le tubercule, la racine, la graine. Les cultures de subsistance sont celles dont on mange justement cet organe, et qui le gardent soit vivant — la pomme de terre et le rutabaga au caveau —, soit sec — le grain et le pois. La feuille garde mal, le chou pommé mis à part (<span class="ref">ch. 95</span>) : un jardin de laitues ne nourrit personne en février.</p>
<p class="p0 ri"><strong class="runin">Au mètre carré, le tubercule gagne.</strong> La pomme de terre est aux quatre cinquièmes de l’eau et ne porte que 770 kcal au kilo, mais un champ ordinaire en rend 1 kg/m² sans rien d’acheté, et un jardin bien mené 2,6 kg/m² : 700 à 2 000 kcal par mètre carré. Le grain porte 3 350 à 3 900 kcal au kilo, mais l’orge ne rend que 0,1 à 0,15 kg/m² au champ ordinaire, 0,24 à 0,34 kg/m² dans un bon jardin : 330 à 1 200 kcal/m². <strong>À surface égale, la pomme de terre nourrit environ deux fois plus que le grain.</strong> Le grain gagne ailleurs : il se garde sec longtemps, pèse quatre à cinq fois moins pour la même énergie, porte 12 à 17 % de protéines contre 2 % pour la pomme de terre, et il fait le pain. La gourgane et le pois portent 24 à 26 % de protéines : la protéine qui ne se sauve pas dans le bois.</p>
<p class="p0 ri"><strong class="runin">Le calendrier décide avant la terre.</strong> Entre la dernière gelée du printemps et la première de l’automne, la côte a 108 à 124 jours en moyenne, et 89 à 95 jours ou moins une année sur dix. On plante pour 90 (<span class="ref">ch. 41</span>). Ce qui supporte une gelée au départ gagne des semaines : la pomme de terre, le pois, la carotte, la betterave, le navet et le rutabaga se sèment jusqu’à deux semaines avant la dernière gelée ; la graine de gourgane encaisse −3 °C en terre ; l’avoine lève en sol froid et mouillé. Ce qui gèle à la fin les perd : le haricot, la courge, le blé à l’épiaison.</p>
<p class="p0 ri"><strong class="runin">Chaque culture rend une part d’elle-même avant de nourrir quelqu’un.</strong> Dans une terre qui rend 1 kg/m², la pomme de terre replante du cinquième au quart de sa récolte en morceaux de 40 à 60 g, environ le dixième si on coupe fin — dans une terre égouttée seulement (étape 9) —, le tiers quand on plante des tubercules entiers serrés. Le grain replante le vingtième dans un bon jardin, le huitième dans un champ maigre. Le compte se fait donc de la semence vers l’assiette, jamais l’inverse.</p>
<p class="p0 ri"><strong class="runin">La vitamine C de l’hiver</strong> vient en partie de ce champ — la pomme de terre cuite dans sa pelure (<span class="ref">ch. 20</span>), la choucroute (<span class="ref">ch. 80</span>) — et pour le reste des aiguilles de sapin baumier (<em>Abies balsamea</em>) ou d’épinette (<em>Picea</em> spp.). <strong>Jamais du cèdre</strong> (thuya occidental, <em>Thuja occidentalis</em>) : sa thuyone est toxique (<span class="ref">ch. 20</span>).</p>
<h2 class="sec" data-n="4"><span class="n">4</span><span class="t">Matériel</span></h2>
<p class="p0">Ce qui s’achète se range au <span class="ref">ch. 00b</span>. Bêche, fourche, râteau et cordeau sont au <span class="ref">ch. 95</span> ; la balance à fléau, au <span class="ref">ch. 5</span> <span class="ref">§9</span>. Le tableau ne donne que ce qu’il faut pour ces cultures-là.</p>
<table class="tspan"><colgroup><col style="width:25%"><col style="width:11%"><col style="width:48%"><col style="width:16%"></colgroup><thead><tr><th>Item</th><th>Quantité</th><th>Substitution possible</th><th>Négociable</th></tr></thead><tbody><tr><td class="c-item">Pommes de terre de semence (<em>Solanum tuberosum</em>)</td><td>0,2 à 0,25 kg/m² en morceaux de 40 à 60 g ; de 0,07 à 0,5 kg/m² selon la coupe (étape 9)</td><td>Tubercules moyens de sa récolte, gardés à part (<span class="ref">ch. 100</span> <span class="ref">§5-L</span>) ; yeux levés à la pointe du couteau sur des pommes de terre de table, le reste mangé s’il n’est ni vert ni amer (<span class="ref">§9</span>) — jamais sur une semence achetée, qui ne se mange pas ; germes cassés, qui repartent ; graine vraie (<span class="ref">ch. 100</span> <span class="ref">§9</span>)</td><td><strong>Non.</strong> Sans semence, pas de pomme de terre</td></tr><tr><td class="c-item">Grain de semence : orge nue d’abord (<em>Hordeum vulgare</em>), avoine (<em>Avena sativa</em>), seigle (<em>Secale cereale</em>)</td><td>12 à 15 g/m²</td><td>Grain entier vendu pour manger, s’il lève au test (<span class="ref">ch. 100</span> <span class="ref">§9</span>) : seigle et blé en grain, orge nue, blé du grain à oiseaux, passés à la saumure avant de semer (<span class="ref">§9</span>). <strong>Jamais</strong> l’orge perlée ni l’avoine roulée ou en gruau : polies ou chauffées, elles ne lèvent plus</td><td>Non, si on veut du grain</td></tr><tr><td class="c-item">Gourganes (<em>Vicia faba</em>) ou pois secs entiers (<em>Pisum sativum</em>)</td><td>17 à 20 g/m²</td><td>Gourganes et pois entiers du garde-manger, testés (<span class="ref">ch. 100</span> <span class="ref">§9</span>). Le pois cassé ne lève pas</td><td>Oui, mais c’est la protéine du champ</td></tr><tr><td class="c-item">Faucille ou faux</td><td>1</td><td>Couteau et sécateur, poignée par poignée ; faucille faite d’une lame de scie ou d’une lame de ressort (<span class="ref">ch. 111</span>, fil au <span class="ref">ch. 105</span>)</td><td>Oui</td></tr><tr><td class="c-item">Fléau</td><td>1</td><td>Fabriqué (<span class="ref">§9</span>) ; sacs de toile piétinés ; gerbes frappées sur un baril ; perches posées au-dessus d’une toile (<span class="ref">§9</span>)</td><td>Oui</td></tr><tr><td class="c-item">Toile de battage</td><td>1, grande</td><td>Bâche, draps cousus ensemble, aire de terre raclée et balayée</td><td><strong>Non.</strong> Le grain tombé dans l’herbe est perdu</td></tr><tr><td class="c-item">Sacs de toile ou de papier</td><td>Selon la récolte</td><td>Taies d’oreiller, poches de jute. <strong>Jamais un sac de plastique fermé</strong> : le reste d’humidité y moisit</td><td>Non</td></tr><tr><td class="c-item">Deux tamis : un qui retient la paille, un qui retient le grain entier et laisse passer le grain cassé et les petites graines</td><td>1 jeu</td><td>Grillage de poulailler ou panier pour le premier ; tôle ou fond de boîte percé au clou pour le second (<span class="ref">§9</span>). Une moustiquaire n’enlève que la poussière</td><td>Oui</td></tr><tr><td class="c-item">Vent ou ventilateur</td><td>—</td><td>Le vent régulier de l’après-midi ; ventilateur 12 V (<span class="ref">ch. 100</span> <span class="ref">§5-E</span>) ; un drap qu’on secoue</td><td>Oui</td></tr><tr><td class="c-item">Sel, pour trier l’ergot</td><td>250 g par litre d’eau</td><td>Sel du fleuve (<span class="ref">ch. 67</span>)</td><td>Oui : sans sel, on trie grain par grain (<span class="ref">ch. 88</span> <span class="ref">§5</span>.F)</td></tr><tr><td class="c-item">Claies de séchage</td><td>Selon la récolte</td><td>Moustiquaires de fenêtre, draps tendus sur des perches : au-dessus du poêle pour le grain de table (<span class="ref">ch. 5</span> <span class="ref">§9</span>), loin du poêle pour la semence (<span class="ref">ch. 100</span> <span class="ref">§9</span>)</td><td><strong>Non.</strong> Le grain humide moisit dans son contenant</td></tr><tr><td class="c-item">Contenants à grain</td><td>Selon la récolte</td><td><span class="ref">Ch. 88</span> <span class="ref">§5</span>.G</td><td>Non</td></tr></tbody></table>
<h2 class="sec" data-n="5"><span class="n">5</span><span class="t">Procédure</span></h2>
<h3 class="sub">A — Le compte : ce qu’il faut semer pour quatre</h3>
<p class="p0 ri"><strong class="runin">Tableau 1 — Ce que chaque culture rend.</strong> « Prudent » : pour les grains, le pois, la pomme de terre, le navet et le rutabaga, la moyenne du Québec en 1915 et 1916, au fumier et au cheval, sans engrais de synthèse ni fongicide ; pour la gourgane, une mauvaise année dans les fermes du Lac-Saint-Jean. « Bon » : un jardin fumé et arrosé sous un climat subarctique ; pour la gourgane, une bonne année au Lac-Saint-Jean ; pour le pois, un champ d’aujourd’hui. Pour planifier, on prend la colonne « prudent ». La carotte, la betterave, le chou et l’oignon n’ont que le chiffre du bon jardin : on en sème plus que le compte ne le dit.</p>
<table class="tspan"><colgroup><col style="width:17.0%"><col style="width:13.3%"><col style="width:14.2%"><col style="width:9.2%"><col style="width:14.8%"><col style="width:9.2%"><col style="width:22.4%"></colgroup><thead><tr><th>Culture</th><th>Prudent (kg/m²)</th><th>Bon (kg/m²)</th><th>kcal au kilo</th><th>kcal/m²</th><th>Protéines</th><th>Garde</th></tr></thead><tbody><tr><td class="c-item">Pomme de terre</td><td>0,9 à 1,0</td><td>2,6 (jardin)</td><td>770</td><td>700 à 2 000</td><td>2 %</td><td>4 à 8 mois au caveau, à 7-8 °C (<span class="ref">ch. 79</span>)</td></tr><tr><td class="c-item">Rutabaga (<em>Brassica napus</em> subsp. <em>rapifera</em>)</td><td>1,8 à 2,1 (racines des champs)</td><td>4,4 (jardin)</td><td>370</td><td>670 à 1 600</td><td>1 %</td><td>4 à 8 mois (<span class="ref">ch. 79</span>)</td></tr><tr><td class="c-item">Navet (<em>Brassica rapa</em>)</td><td>1,8 à 2,1 (racines des champs)</td><td>4,9 (jardin)</td><td>280</td><td>500 à 1 400</td><td>1 %</td><td>Caveau (<span class="ref">ch. 79</span>), fermentation (<span class="ref">ch. 80</span>)</td></tr><tr><td class="c-item">Carotte (<em>Daucus carota</em>)</td><td>—</td><td>3,3 (jardin)</td><td>410</td><td>1 300 au mieux</td><td>1 %</td><td>4 à 7 mois (<span class="ref">ch. 79</span>)</td></tr><tr><td class="c-item">Betterave (<em>Beta vulgaris</em>)</td><td>—</td><td>2,4 (jardin)</td><td>430</td><td>1 000 au mieux</td><td>1,6 %</td><td>4 à 8 mois (<span class="ref">ch. 79</span>)</td></tr><tr><td class="c-item">Chou (<em>Brassica oleracea</em>)</td><td>—</td><td>2,9 (jardin), 1,4 kg par tête</td><td>250</td><td>730 au mieux, dont le cinquième part au parage</td><td>1,3 %</td><td>4 à 7 mois ; choucroute (<span class="ref">ch. 80</span>)</td></tr><tr><td class="c-item">Oignon (<em>Allium cepa</em>)</td><td>—</td><td>4,2 (jardin)</td><td>400</td><td>1 700 au mieux</td><td>1 %</td><td>Au sec (<span class="ref">ch. 79</span>)</td></tr><tr><td class="c-item">Orge</td><td>0,10 à 0,15</td><td>0,24 à 0,34 (jardin, grain nu)</td><td>3 540 sans balle</td><td>330 à 1 200</td><td>12,5 %</td><td>Longtemps, à 13-15 % d’eau (<span class="ref">ch. 88</span> <span class="ref">§5</span>.G)</td></tr><tr><td class="c-item">Avoine</td><td>0,09 à 0,12 (avec la balle)</td><td>—</td><td>3 890 sans balle</td><td>230 à 360</td><td>17 %</td><td>Idem ; avoine nue sous 10 % d’eau</td></tr><tr><td class="c-item">Seigle</td><td>0,09 à 0,10</td><td>—</td><td>3 350</td><td>290 à 350</td><td>15 %</td><td>Longtemps, à 13-15 % d’eau</td></tr><tr><td class="c-item">Pois secs</td><td>0,09 à 0,11</td><td>0,21 (champ moderne)</td><td>3 520</td><td>330 à 740</td><td>24 %</td><td>Sec</td></tr><tr><td class="c-item">Gourgane sèche</td><td>0,21</td><td>0,39</td><td>3 410</td><td>720 à 1 330</td><td>26 %</td><td>Séchée à environ 13 % d’eau</td></tr></tbody></table>
<p class="p0">Les chiffres des grains « prudents » sont ceux d’un grain vêtu pesé avec sa balle : l’orge vêtue en garde environ 10 %, l’avoine vêtue 25 à 30 %, et ce poids-là ne se mange pas (<span class="ref">§5-F</span>). Les champs fertilisés d’aujourd’hui, au Saguenay–Lac-Saint-Jean et sur la Côte-Nord — les deux régions comptées ensemble —, rendent 3,7 kg/m² de pommes de terre, 0,27 kg/m² d’orge, 0,22 d’avoine et 0,30 de seigle : c’est le plafond, avec des engrais qu’on n’aura plus. Et un jardin ordinaire attend de la pomme de terre plutôt 1 kg/m² que 2,6 : la colonne « prudent » n’est pas pessimiste, c’est celle sur laquelle on compte.</p>
<p class="p0 ri"><strong class="runin">Tableau 2 — Un plan de départ pour un hiver de quatre.</strong> Trois lignes reprennent un besoin déjà calculé ailleurs ; trois sont des <strong>hypothèses de calcul</strong>, dites comme telles, à ajuster à ce que la famille mange vraiment.</p>
<table class="tspan"><colgroup><col style="width:9.1%"><col style="width:12.4%"><col style="width:24.9%"><col style="width:19.7%"><col style="width:9.3%"><col style="width:16.3%"><col style="width:8.3%"></colgroup><thead><tr><th>Poste</th><th>Combien manger</th><th>D’où vient ce chiffre</th><th>Surface, prudent</th><th>Surface, bon</th><th>Semence</th><th>kcal par jour, l’hiver</th></tr></thead><tbody><tr><td class="c-item">Pommes de terre</td><td>630 kg, d’octobre à avril (210 jours)</td><td>Le plancher de glucides du <span class="ref">ch. 21</span> : 300 kg par 100 jours</td><td>790 à 970 m²</td><td>265 m²</td><td>Morceaux de 40 à 60 g (étape 9) : 160 à 240 kg (prudent) ; 55 à 65 kg (bon)</td><td>2 300</td></tr><tr><td class="c-item">Grain</td><td>182 kg pour l’année</td><td>Hypothèse : 500 g de farine par jour, la moitié de la fournée du <span class="ref">ch. 88</span></td><td>1 400 à 2 000 m²</td><td>550 à 800 m²</td><td>7 à 27 kg</td><td>1 700</td></tr><tr><td class="c-item">Gourganes ou pois secs</td><td>50 kg pour l’année</td><td>Hypothèse : environ 140 g par jour pour la famille</td><td>515 à 680 m² en pois ; 265 m² en gourganes</td><td>135 m² en gourganes</td><td>2 à 14 kg</td><td>470</td></tr><tr><td class="c-item">Chou</td><td>115 kg (85 têtes)</td><td>La choucroute de six mois du <span class="ref">ch. 80</span></td><td>Au moins 40 m² : 1,4 kg la tête, c’est un bon jardin</td><td>40 m²</td><td>Plants partis à la maison (<span class="ref">ch. 97</span>)</td><td>130</td></tr><tr><td class="c-item">Racines de garde</td><td>150 kg</td><td>Hypothèse : un peu moins d’un kilo par jour d’octobre à mars</td><td>75 à 85 m² de rutabaga, sur la planche des choux (étape 3)</td><td>35 m²</td><td>Environ 1 g par 10 m de rang</td><td>310</td></tr><tr><td class="c-item"><strong>Total</strong></td><td></td><td></td><td><strong>2 600 à 3 800 m²</strong></td><td><strong>1 000 à 1 300 m²</strong></td><td></td><td><strong>environ 4 900 kcal/jour</strong></td></tr></tbody></table>
<p class="p0">Environ 4 900 kcal par jour, c’est un peu plus de la moitié des 9 500 kcal de la famille en hiver de travail (<span class="ref">ch. 21</span> <span class="ref">§5</span>.2). Le reste vient de la viande, du poisson et du gras (<span class="ref">ch. 21</span>, <span class="ref">ch. 72</span>). Un champ ne nourrit pas un hiver à lui seul ; il porte la moitié que la forêt ne porte pas.</p>
<p class="step"><span class="sn">1</span><strong>Partir de la semence, pas de l’assiette.</strong> Pour chaque ligne du tableau 2, la semence de l’année suivante se met de côté à la récolte, avant la première assiette (<span class="ref">ch. 100</span>). La semence de pomme de terre se choisit sur les plants les plus vigoureux, à la récolte, pas au printemps.</p>
<p class="step"><span class="sn">2</span><strong>Monter en trois ans, pas en un.</strong> La première année ne fait pas 3 000 m² à la bêche : c’est la <span class="ref">§9</span>, et le <span class="ref">ch. 96</span> <span class="ref">§9</span>. La deuxième ouvre le champ de pommes de terre. La troisième ajoute le grain. Une planche de 100 m² en grain nu rend 10 à 34 kg, de quoi semer 700 à 2 500 m² l’année d’après : la planche de grain de la première année est une planche de semence, pas de pain.</p>
<p class="step"><span class="sn">3</span><strong>Faire tourner le champ.</strong> Le principe et les piquets sont au <span class="ref">ch. 96</span> <span class="ref">§5-E</span>. Ce que le grain y ajoute : <strong>le grain vient derrière la pomme de terre</strong>, qui laisse une terre propre et meuble — un bon champ de pommes de terre est suivi d’une forte récolte de grain, et l’orge se sème après une culture sarclée. <strong>Jamais deux ans de grain au même endroit</strong> : les sclérotes d’ergot survivent environ un an dans le sol, et les maladies des feuilles de l’orge hivernent sur ses restes. Un ordre qui tient, celui du <span class="ref">ch. 96</span> (étape 28) avec le grain glissé derrière les pommes de terre : pommes de terre, puis orge ou avoine, puis pois ou gourganes, puis choux <strong>avec les navets et les rutabagas</strong>, puis carottes, betteraves, panais et oignons, puis de nouveau pommes de terre. Le navet et le rutabaga sont des choux : ils vont sur la planche des choux, jamais sur celle qui la suit, sinon deux années de crucifères se touchent (étape 19). La cendre va devant les pois (<span class="ref">ch. 96</span>, étape 16) et, dans ce champ, devant l’orge aussi (étape 30) ; <strong>jamais devant les pommes de terre</strong>.</p>
<p class="step"><span class="sn">4</span><strong>Le champ vit de la pluie.</strong> À 25 L par mètre carré et par semaine (<span class="ref">ch. 95</span>), 1 000 m² demandent 25 000 L par semaine sèche : personne ne porte ça à la chaudière. L’eau portée va au jardin, et, en sécheresse, aux pommes de terre en fleurs d’abord (étape 13).</p>
<p class="step"><span class="sn">5</span><strong>Mesurer le travail avant de mesurer la terre.</strong> Vers 1830, un champ de blé semé à la main, coupé à la faucille et battu au fléau demandait 125 à 150 heures de travail à l’hectare, <strong>charrue tirée par une bête comprise</strong> : 12 à 15 heures pour 1 000 m². À la bêche, sans bête, il en faut davantage. Au fléau, une personne battait de l’ordre de sept boisseaux par jour, soit 150 à 190 kg de grain. Ce n’est pas le battage qui limite ; c’est l’ouverture de la terre et la récolte au bon moment.</p>
<p class="step"><span class="sn">6</span><strong>Écrire sur la chose.</strong> La variété et l’année vont au crayon de plomb sur une étiquette dans le sac de semence et une autre dessus — le feutre s’efface à l’humidité et au froid (<span class="ref">ch. 100</span> <span class="ref">§5-I</span>) —, et au couteau sur le piquet du carré (<span class="ref">ch. 96</span>, étape 28). Rien à tenir dans un cahier.</p>
<h3 class="sub">B — La pomme de terre</h3>
<p class="step"><span class="sn">7</span><strong>Choisir la semence.</strong> Des tubercules moyens de plants vigoureux, choisis à la récolte (<span class="ref">ch. 100</span> <span class="ref">§5-L</span>). Jamais les petits : un petit tubercule fait une petite plante. La semence d’une récolte qui a eu le mildiou ne se plante jamais (étape 14).</p>
<p class="step"><span class="sn">8</span><strong>Couper, et laisser cicatriser.</strong> Des morceaux de 40 à 60 g avec au moins deux yeux : un seul suffit à pousser, le second sert de réserve si le premier est abîmé. C’est la taille du plan ; plus petit, c’est pour l’année où la semence manque (étape 9). Un tubercule de plus de 85 g se coupe ; en le fendant de la tête à la queue, chaque morceau reçoit des yeux vigoureux de la tête, ceux de la queue donnant des tiges plus faibles. Laver la lame dans l’eau savonneuse entre deux tubercules : le jus d’un tubercule malade sur la lame contamine les morceaux suivants. Laisser les morceaux 7 à 10 jours au frais pour que la coupe se referme, ou au moins une nuit à la température de la pièce si on coupe la veille.</p>
<p class="step"><span class="sn">9</span><strong>Compter la semence.</strong> Des morceaux de 40 à 60 g à 28 cm sur le rang, en rangs de 71 à 91 cm (étape 11), c’est 0,16 à 0,30 kg de semence par mètre carré, <strong>environ 0,2 à 0,25 kg/m² avec des morceaux de 50 g</strong> : le cinquième au quart d’une récolte prudente. C’est la dose du plan (tableau 2). Couper plus fin divise la semence ; en rangs de 71 cm, avec des tubercules de semence d’environ 57 g :</p>
<table class="tcol nest"><colgroup><col style="width:30.1%"><col style="width:26.5%"><col style="width:21.7%"><col style="width:21.7%"></colgroup><thead><tr><th>Semence</th><th>À 15 cm sur le rang</th><th>À 23 cm</th><th>À 30 cm</th></tr></thead><tbody><tr><td>Entière</td><td>0,52 kg/m²</td><td>0,34 kg/m²</td><td>0,26 kg/m²</td></tr><tr><td>Coupée en deux</td><td>0,26</td><td>0,17</td><td>0,13</td></tr><tr><td>Coupée en quatre</td><td>0,13</td><td>0,09</td><td>0,07</td></tr></tbody></table>
<p class="stepc">Pour 10 m de rang à 23 cm : 2,4 kg entière, 1,2 kg en deux, 0,6 kg en quatre. Mais coupé en deux, ce tubercule donne des morceaux d’environ 28 g, et coupé en quatre, d’environ 14 g : <strong>sous le minimum de l’étape 8</strong>. Ces petits morceaux sont pour l’année où la semence manque, et seulement dans une terre bien égouttée, sur le billon (<span class="ref">§9</span>) : dans une terre froide et mouillée, ils pourrissent au lieu de lever.</p>
<p class="step"><span class="sn">10</span><strong>Ne pas laisser les germes s’allonger.</strong> Un germe long épuise le morceau avant la plantation. La semence reste au noir et au frais jusqu’au jour de planter (<span class="ref">ch. 79</span>, <span class="ref">ch. 100</span>).</p>
<p class="step"><span class="sn">11</span><strong>Planter tôt.</strong> Dès que le sol a dégelé et se travaille, jusqu’à deux semaines avant la dernière gelée. La dernière gelée tombe en moyenne le 25 mai à Sept-Îles et le 30 mai à Baie-Comeau, mais une année sur dix après le 9 ou le 11 juin. Planter deux semaines avant la dernière gelée se fait avec peu de risque de perte ; planter dans un sol détrempé et froid, non : la semence y pourrit. Rangs de 71 à 91 cm, jamais sous 61 à 76 cm selon la variété, parce que le feuillage s’étale ; 28 cm sur le rang (18 cm pour de petits tubercules, 33 cm pour de gros). Couvrir de 10 à 15 cm de terre, de 5 à 10 cm seulement en sol froid et mouillé. Sur une terre pleine de souches, des buttes plutôt que des rangs : trois morceaux dans une butte de 60 cm de large, quatre ou cinq dans une de 90 cm, 1,8 m entre les buttes.</p>
<p class="step"><span class="sn">12</span><strong>Ni fumier frais, ni cendre, ni coquille dans la planche.</strong> Le fumier frais nourrit la bactérie de la gale, et un fumier trop riche pousse le plant en feuilles et donne des tubercules creux et filandreux ; la cendre et la coquille remontent le pH, et la gale aime un sol moins acide. La pomme de terre prend la place qui vient le plus loin de la dernière chaux (<span class="ref">ch. 96</span>, étapes 16 et 28). Le varech s’enfouit à l’automne d’avant (<span class="ref">ch. 96</span>).</p>
<p class="step"><span class="sn">13</span><strong>Butter à mesure, et finir avant la fleur.</strong> Au premier buttage, quand les plants font 20 à 30 cm, la terre de l’entre-rang remonte sur le rang. On recommence quand les tiges ont remonté ; le dernier buttage se fait <strong>avant la floraison</strong>. La butte haute fait deux choses : elle garde le tubercule au noir, ce qui l’empêche de verdir et de fabriquer son poison (<span class="ref">ch. 95</span>, étape 13), et elle empêche la pluie de laver les spores du mildiou jusqu’aux tubercules (étape 14). La floraison est le moment où les tubercules grossissent : c’est là que l’eau compte le plus, et c’est là qu’on porte les chaudières en sécheresse (<span class="ref">ch. 95</span>, étape 15).</p>
<p class="step"><span class="sn">14</span><strong>Le mildiou, chaque jour de brume.</strong> Le mildiou (<em>Phytophthora infestans</em>) a détruit des champs en quelques jours ; sans fongicide, il ne se soigne pas, il s’évite et il s’arrête. Il s’installe quand l’humidité de l’air dépasse 90 % ou que les feuilles restent mouillées longtemps, avec des nuits de 10 à 15 °C et des journées de 16 à 20 °C : c’est un juillet de brume sur la côte. Il paraît 7 à 10 jours après l’infection.</p>
<p class="li l2"><strong>Où regarder :</strong> les creux et les lisières d’arbres, où la rosée tient le plus longtemps ; le bas des plants ; <strong>l’envers</strong> des feuilles.</p>
<p class="li l2"><strong>Ce qu’on voit :</strong> des taches humides, vert foncé puis brunes, qui partent du bord ou de la pointe de la feuille et <strong>passent par-dessus les nervures</strong> ; à l’envers, un duvet blanc au bord de la tache<sup class="fnr" data-fn="98-1">1</sup> ; des taches brun-noir sur les tiges, qui cassent ; une odeur de vinaigre dans le rang.</p>
<p class="li l2"><strong>Ce qu’on fait :</strong> arracher les plants atteints <strong>et tous ceux d’une surface double autour</strong>, les sortir du champ dans un sac et les enfouir loin des planches. Jamais au compost (<span class="ref">ch. 95</span>).</p>
<p class="li l2"><strong>Ce qui le fait revenir :</strong> ici, il ne passe l’hiver que dans une pomme de terre vivante. Un tubercule malade gardé, un tas de rebuts laissé au bout du champ, une repousse<sup class="fnr" data-fn="98-2">2</sup> oubliée : ce sont les foyers de l’été suivant. On enfouit les rebuts avant la levée et on arrache toutes les repousses.</p>
<p class="li l2"><strong>Ce qu’on n’apporte pas :</strong> des plants de tomate venus d’ailleurs. La tomate prend le mildiou encore plus facilement que la pomme de terre, et elle le transporte.</p>
<p class="step"><span class="sn">15</span><strong>Défaner deux semaines avant d’arracher.</strong> Couper ou arracher les fanes et les laisser mourir complètement. La pelure s’épaissit pendant ces deux semaines, et, l’année du mildiou, les tubercules infectés ont le temps de pourrir dans la terre plutôt qu’au caveau. Si le gel du sol menace avant la fin des deux semaines, on arrache quand même, doucement : la pelure finira de s’épaissir pendant le préconditionnement (étape 17).</p>
<p class="step"><span class="sn">16</span><strong>Arracher par temps sec, avant que la terre gèle.</strong> Une pomme de terre gelée se défait au dégel et ne se mange plus. Creuser à 20-25 cm des tiges et à 20-25 cm de profond, pour ne pas les percer. Celles qu’on a blessées se mangent tout de suite ; elles ne descendent pas. Laisser les autres sur le sol jusqu’à ce que la terre qui les couvre soit sèche : deux heures suffisent souvent en sol léger.</p>
<p class="step"><span class="sn">17</span><strong>Trier, puis préconditionner.</strong> Les vertes : <span class="ref">ch. 95</span> <span class="ref">§7</span>. Les tachées de mildiou — pelure creusée, brun rougeâtre près des yeux, chair marbrée de rouille, grenue — ne vont ni au caveau ni à la semence. Une pomme de terre mouillée ou meurtrie prend le mildiou plus facilement. Si le feuillage a eu le mildiou, étaler la récolte au grand air sec tout de suite après l’arrachage, jusqu’à ce que les pelures soient sèches. Puis deux à trois semaines à 10-15 °C avant le caveau (<span class="ref">ch. 79</span>, étape 11).</p>
<h3 class="sub">C — Le chou, le navet et le rutabaga, la carotte, la betterave</h3>
<table class="tspan"><colgroup><col style="width:11.7%"><col style="width:14.8%"><col style="width:20.4%"><col style="width:9.8%"><col style="width:10.6%"><col style="width:12.7%"><col style="width:19.9%"></colgroup><thead><tr><th>Légume</th><th>Semis</th><th>Rangs / sur le rang</th><th>Jours</th><th>Par 10 m de rang</th><th>Semence par 10 m</th><th>Garde</th></tr></thead><tbody><tr><td class="c-item">Chou</td><td>Plants partis à la maison, repiqués (<span class="ref">ch. 97</span>)</td><td>76 cm / 46 à 61 cm</td><td>50 à 130</td><td>22 kg, 16 têtes</td><td>—</td><td>4 à 7 mois ; choucroute (<span class="ref">ch. 80</span>)</td></tr><tr><td class="c-item">Rutabaga</td><td>En place</td><td>51 cm / 10 cm, éclairci à 20-25 cm</td><td>50 à 75</td><td>22 kg</td><td>Environ 1 g</td><td>4 à 8 mois (<span class="ref">ch. 79</span>)</td></tr><tr><td class="c-item">Navet</td><td>En place</td><td>46 cm / 7,5 à 10 cm</td><td>50 à 75</td><td>22 kg</td><td>Environ 1 g</td><td>Caveau, fermentation</td></tr><tr><td class="c-item">Carotte</td><td>En place</td><td>46 cm / 5 à 10 cm</td><td>50 à 90</td><td>15 kg</td><td>Environ 1 g</td><td>4 à 7 mois</td></tr><tr><td class="c-item">Betterave</td><td>En place</td><td>61 cm / 5 à 10 cm</td><td>60 à 80</td><td>15 kg</td><td>Environ 9 g</td><td>4 à 8 mois</td></tr><tr><td class="c-item">Panais (<em>Pastinaca sativa</em>)</td><td>En place</td><td>61 cm / 7,5 cm</td><td>100 à 150</td><td>15 kg</td><td>Environ 1 g</td><td>Passe l’hiver dans le rang (<span class="ref">ch. 79</span> <span class="ref">§9</span>)</td></tr></tbody></table>
<p class="step"><span class="sn">18</span><strong>Semer tôt ce qui supporte le froid.</strong> Rutabaga, navet, carotte, betterave et panais se sèment en place jusqu’à deux semaines avant la dernière gelée. Le panais demande 100 à 150 jours : il se sème le premier ou pas du tout. La betterave, elle, supporte le froid, mais sous nos jours longs, semée tôt, elle monte plus souvent en graine sans faire de racine : un semis plus tardif, puis un éclaircissage, la retiennent (<span class="ref">§7</span>).</p>
<p class="step"><span class="sn">19</span><strong>Le chou se repique.</strong> Les plants se partent à la maison ou devant la fenêtre sud (<span class="ref">ch. 95</span>, étape 11 ; <span class="ref">ch. 97</span>). Les 115 kg de chou de la choucroute du <span class="ref">ch. 80</span>, c’est environ 85 têtes, 52 m de rang, 40 m². Toute la famille du chou — chou, navet, rutabaga — est attaquée par la mouche du chou, dont les larves mangent les racines : c’est une raison de plus pour laisser au moins quatre ans entre deux crucifères au même endroit (étape 3 ; <span class="ref">ch. 96</span>, étape 28).</p>
<p class="step"><span class="sn">20</span><strong>Le rutabaga, deuxième pilier.</strong> Parmi les racines qui mûrissent sûrement dans la saison, c’est celle qui porte le plus d’énergie au mètre carré — le panais en porte un peu plus, mais il lui faut 100 à 150 jours —, et une de celles qui se gardent le plus longtemps au caveau ; c’est aussi celle qui sort ferme d’un silo de terre quand on n’a pas de caveau (<span class="ref">ch. 79</span> <span class="ref">§9</span>). Le navet d’hiver est la leçon du potager d’autrefois (<span class="ref">ch. 99</span>) : semé en quantité, il va au caveau et au baril.</p>
<p class="step"><span class="sn">21</span><strong>Récolter avant le gros gel, ne pas laver</strong>, trier à la porte (<span class="ref">ch. 79</span>, étapes 8 à 10). Ce qui ne descend pas au caveau va au baril de fermentation (<span class="ref">ch. 80</span>), jamais en pot sans autoclave : une racine est un légume peu acide, et <strong>le botulisme ne change ni l’odeur, ni le goût, ni l’apparence du pot</strong> (<span class="ref">ch. 78</span>).</p>
<h3 class="sub">D — Les pois et les fèves, secs pour l’hiver</h3>
<p class="step"><span class="sn">22</span><strong>La gourgane d’abord.</strong> C’est la fève des marais du Saguenay, du Lac-Saint-Jean et de Charlevoix, cultivée au XIXe siècle dans les régions froides du Québec parce qu’elle aime le climat frais. La graine supporte −3 °C en terre, germe vers 3 °C, et le jeune plant résiste à une gelée de −3 °C.</p>
<p class="li l2"><strong>Semer le plus tôt possible,</strong> dès que la terre se travaille : plus le semis est tardif, plus les fleurs arrivent dans la chaleur sèche de l’été et tombent sans faire de gousses<sup class="fnr" data-fn="98-3">3</sup>.</p>
<p class="li l2"><strong>5 à 7 cm de profond ; 20 plants au mètre carré</strong>, soit 17,5 à 20 g/m² pour les grosses gourganes de pays. Ne pas semer un lot qui germe à moins de 85 % (test : <span class="ref">ch. 100</span> <span class="ref">§5-K</span>).</p>
<p class="li l2"><strong>Terre lourde mais égouttée</strong> : la gourgane souffre autant du manque d’eau que de l’eau qui stagne.</p>
<p class="li l2"><strong>Récolter sèche</strong> quand presque toutes les gousses sont noires et les graines dures, 115 à 120 jours après le semis, au début de septembre dans les fermes du Lac-Saint-Jean ; ou verte en juillet, pour la table. Sécher jusqu’à environ 13 % d’eau (étape 25).</p>
<p class="li l2"><strong>Rendement :</strong> 0,21 kg/m² une mauvaise année, 0,39 kg/m² une bonne. C’est la légumineuse qui rend le plus de protéines au mètre carré, deux à quatre fois le pois. Et c’est celle du <span class="ref">§8</span>, bloc 5.</p>
<p class="step"><span class="sn">23</span><strong>Le pois sec.</strong> Il se sème jusqu’à deux semaines avant la dernière gelée, et dru : à la main, 17 à 20 g/m², pour couvrir le sol et le garder humide. Semé tôt, il rend plus, mais les insectes s’y mettent davantage. Il se récolte quand la gousse est brune, sèche comme du papier, et qu’elle sonne quand on la secoue (<span class="ref">ch. 100</span> <span class="ref">§5-D</span>).</p>
<p class="step"><span class="sn">24</span><strong>Le haricot sec, en pari.</strong> Fèves jaunes, fèves blanches (<em>Phaseolus vulgaris</em>) : sous notre climat, le haricot gèle au premier froid et ne mûrit pas en sol froid. Il se tente contre le mur sud (<span class="ref">ch. 95</span> <span class="ref">§9</span>) ou sous abri (<span class="ref">ch. 97</span>), jamais dans le plan.</p>
<p class="step"><span class="sn">25</span><strong>Battre et sécher.</strong> Les gousses sèches se battent dans un sac de toile qu’on piétine ou qu’on frappe sur un billot, et se vannent au vent (<span class="ref">ch. 100</span> <span class="ref">§5-E</span>). La graine est sèche quand elle éclate sous un coup de marteau au lieu de s’écraser (<span class="ref">ch. 100</span> <span class="ref">§5-G</span>).</p>
<p class="step pk-t"><span class="sn">26</span><strong>Cuire à gros bouillon, jamais à petit feu.</strong> Les légumineuses sèches portent des lectines, en quantité variable, le haricot rouge plus que les autres. Mal cuites, elles donnent, une à trois heures après le repas, des nausées violentes, des vomissements et de la diarrhée. Le geste qui les détruit : tremper au moins 5 heures dans deux à trois fois leur volume d’eau, <strong>jeter l’eau</strong>, puis faire bouillir <strong>à gros bouillon au moins 10 minutes</strong> avant de finir la cuisson. La mijoteuse n’atteint pas la chaleur qu’il faut ; au chalet, la mijoteuse, c’est le chaudron qui frémit sur le bord du poêle toute la journée. Tout haricot sec et la gourgane sèche passent par ce bouillon : dix minutes ne coûtent presque rien en bois. Un mal de ventre après des gourganes n’est pas forcément une question de cuisson (<span class="ref">§7</span> ; <span class="ref">§8</span>, bloc 5).</p>
<h3 class="sub">E — L’oignon, l’ail et la courge</h3>
<p class="step"><span class="sn">27</span><strong>L’oignon</strong> se plante en bulbilles, en rangs de 36 cm, à 5-10 cm sur le rang, et se récolte en 45 à 70 jours. Il se garde au sec, jamais avec les racines (<span class="ref">ch. 79</span>). Peu de calories au total, mais c’était le repas des jours maigres des habitants (<span class="ref">ch. 99</span>), et c’est ce qui rend mangeable un hiver de pommes de terre et de rutabaga.</p>
<p class="step"><span class="sn">28</span><strong>L’ail</strong> (<em>Allium sativum</em>) se plante en caïeux à l’automne ; on garde les plus grosses têtes pour la semence (<span class="ref">ch. 100</span> <span class="ref">§5-L</span>). C’est un condiment, pas une culture de calories.</p>
<p class="step"><span class="sn">29</span><strong>La courge d’hiver</strong> (<em>Cucurbita maxima</em>) demande 120 à 135 jours, et sous un climat subarctique elle se cultive à travers un plastique transparent. Ici, c’est un pari contre le mur sud (<span class="ref">ch. 95</span> <span class="ref">§9</span>, <span class="ref">ch. 97</span>) ; cueillie avant le froid, mûre ou pas (<span class="ref">ch. 99</span>, étape 4), elle se préconditionne à 30 °C et se garde au tiède et au sec (<span class="ref">ch. 79</span>). À 340 kcal au kilo, elle ne compte pas dans le plan.</p>
<h3 class="sub">F — Les céréales à la main</h3>
<p class="step"><span class="sn">30</span><strong>Choisir la céréale.</strong></p>
<p class="li l2"><strong>L’orge, d’abord.</strong> C’est la céréale des étés courts et des jours longs, la plus hâtive. Les orges à six rangs mûrissent plus tôt et plus également que celles à deux rangs, mais leurs épis s’égrènent plus facilement quand on attend trop. <strong>Pour manger, de l’orge nue</strong> : sa balle se détache au battage. La balle de l’orge vêtue, environ le dixième du grain, ne se digère ni chez nous ni chez les bêtes qui ne ruminent pas, et ne s’enlève qu’à l’abrasion. L’orge nue rend un peu moins, parce que ses balles restent au champ, et son germe à nu s’abîme au battage : un lot qui germe à moins de 90 % n’a rien d’exceptionnel. L’orge préfère un pH de 6 à 7 : dans ce champ, la cendre se met devant elle, à l’automne, à la dose du <span class="ref">ch. 96</span> (étape 16).</p>
<p class="li l2"><strong>L’avoine</strong> mûrit 7 à 10 jours après l’orge, mais elle lève en sol froid et mal égoutté et rend encore bien entre un pH de 5 et 5,5 : c’est le grain de la terre neuve et acide. L’ergot la touche rarement. L’avoine vêtue perd 25 à 30 % de son poids en balle, qu’il faut enlever ; une fois décortiquée ou roulée, son gras rancit <strong>en quatre jours environ</strong> si on ne l’a pas étuvée 30 à 60 minutes au four à 116 °C. L’avoine nue devient du gruau au battage, mais son grain huileux attire les insectes et se garde sous 10 % d’eau.</p>
<p class="li l2"><strong>Le seigle</strong> est le grain du pain dense au levain (<span class="ref">ch. 88</span>) et la céréale d’automne qui résiste le mieux à l’hiver : il lui faut un froid sous 5 °C pour monter en épi l’été suivant. C’est aussi celle que l’ergot préfère, parce que sa fleur reste ouverte au vent, et elle se bat mal et s’égrène. Le seigle de printemps demande une saison aussi longue que le blé et rend moins : hors de question ici. Le seigle d’automne se sème vers la mi-août, au plus tard au début de septembre : il doit avoir fait sa touffe avant les neiges. Sous un hiver subarctique, le froid tue sa rosette — la touffe de feuilles qui passe l’hiver au ras du sol — et les moisissures des neiges l’attaquent, et on ne l’y conseille pas. Ici, il se tente sur une planche d’essai, <strong>jamais à côté d’une céréale de printemps</strong>.</p>
<p class="li l2"><strong>Le blé de printemps</strong> : planche d’essai (<span class="ref">§2</span>).</p>
<p class="li l2"><strong>Le sarrasin</strong> (<em>Fagopyrum esculentum</em>) mûrit en 9 à 10 semaines, mais une gelée d’automne le ruine s’il mûrit trop tard : il se sème après tout risque de gel et fait des galettes (<span class="ref">ch. 88</span>), ou de l’engrais vert (<span class="ref">ch. 96</span>).</p>
<p class="step"><span class="sn">31</span><strong>Préparer peu profond et fin.</strong> L’orge a les racines les plus courtes des grains : 8 à 10 cm de terre fine suffisent. <strong>Pas d’orge en sol froid</strong> : semée avant la pluie chaude du printemps, elle pourrit en terre, ou lève jaune et ne rattrape jamais son retard. L’avoine peut passer la première.</p>
<p class="step"><span class="sn">32</span><strong>Tester, puis doser.</strong> Test de germination de l’hiver (<span class="ref">ch. 100</span> <span class="ref">§5-K</span>), et on sème plus dru à proportion de ce qui ne lève pas. <strong>En rangs de 15 cm, 12 g/m², à 4-6 cm de profond</strong> : c’est la façon qui donne le champ le plus égal, et elle laisse passer la binette. <strong>À la volée, 13,5 à 15 g/m²</strong> : la profondeur est inégale, le grain mûrit inégalement et rend 5 à 10 % de moins. L’avoine semée trop clair rouille. On pèse la semence d’une planche une fois, à la balance du <span class="ref">ch. 5</span> <span class="ref">§9</span>, et on marque au couteau le niveau dans le contenant qui servira toujours.</p>
<p class="step"><span class="sn">33</span><strong>Semer à la volée.</strong> Diviser le carré en bandes au cordeau (<span class="ref">ch. 95</span>). Peser la semence de chaque bande ; en semer la moitié en marchant dans un sens, l’autre moitié en travers, à pleine main, d’un geste égal<sup class="fnr" data-fn="98-4">4</sup>. Enterrer au râteau, puis raffermir : une bûche roulée ou le pied à plat, pour que chaque grain touche la terre humide.</p>
<p class="step"><span class="sn">34</span><strong>Tenir les bords.</strong> Les grues et les oies arrachent le grain qui lève et mangent celui qui mûrit, en commençant par les bords, d’où elles voient venir. À l’automne, c’est l’outarde (<em>Branta canadensis</em>) — et c’est aussi un gibier (<span class="ref">ch. 54</span>) qu’on attend à l’affût (<span class="ref">ch. 47</span>, étapes 30 à 36). Faucher l’herbe tout autour du champ <strong>avant qu’elle fleurisse</strong> : les graminées du bord de chemin sont le premier hôte de l’ergot.</p>
<p class="step pk-d"><span class="sn">35</span><strong>Surveiller la fleur.</strong> Un temps frais, nuageux et mouillé allonge la floraison et laisse entrer l’ergot (<span class="ref">§8</span>, bloc 1). Moins d’une semaine après l’infection, la fleur atteinte suinte un miellat collant que les insectes promènent de fleur en fleur. À la fin de l’été, faire le tour du champ <strong>par les bords</strong>, où l’ergot est d’habitude le pire, et couper ces bandes à part : leur grain se bat et se trie à part, et s’il reste chargé, il ne va ni à la table ni aux bêtes (<span class="ref">§8</span>, bloc 1).</p>
<p class="step"><span class="sn">36</span><strong>Récolter au stade pâteux dur</strong><sup class="fnr" data-fn="98-5">5</sup>. Les épis sont jaune pâle et le grain ne se marque plus à l’ongle ; il contient encore 25 à 35 % d’eau. Plus tôt, le grain est maigre ; beaucoup plus tard, l’épi s’égrène au moindre choc, surtout l’orge à six rangs.</p>
<p class="step"><span class="sn">37</span><strong>Couper, lier, dresser.</strong> À la faucille, à la faux réglée sur soi (<span class="ref">ch. 99</span>, étape 54), ou au sécateur, à 8-10 cm du sol. Lier en gerbes d’une poignée de paille tordue, et dresser les gerbes en moyettes<sup class="fnr" data-fn="98-6">6</sup>. Elles sèchent en 7 à 10 jours par temps frais et humide, en 3 à 4 jours par temps chaud et sec. L’orge trop courte pour se lier se met en petits tas ronds. Une seule pluie sur de l’orge coupée la ternit : on rentre avant l’averse. Les épis d’orge nue couchés au sol germent dans l’épi : on les ramasse les premiers.</p>
<p class="step"><span class="sn">38</span><strong>Rentrer</strong> les épis la tête la première dans des sacs de toile ou de papier, <strong>jamais de plastique</strong>, et sous un toit.</p>
<p class="step"><span class="sn">39</span><strong>Battre.</strong> Sur la toile, au fléau (<span class="ref">§9</span>), les épis vers le milieu, la paille secouée et retirée à mesure. Ou dans les sacs mêmes : on les pose sur un plancher dur et on marche sur le bout où sont les épis. Pour la <strong>semence</strong> de grain nu, on arrête dès que le grain est sorti : battre trop longtemps pèle le grain et blesse le germe.</p>
<p class="step"><span class="sn">40</span><strong>Vanner et tamiser.</strong> Verser d’un contenant à l’autre dans le vent ou devant le ventilateur : la balle s’envole, le grain tombe (<span class="ref">ch. 100</span> <span class="ref">§5-E</span>). Puis deux tamis : le premier retient les tiges et les épis entiers, le second, percé d’un trou juste plus petit que le grain entier (<span class="ref">§9</span>), laisse passer la poussière, les petites graines de mauvaises herbes et le grain cassé ; le bon grain reste entre les deux.</p>
<p class="step"><span class="sn">41</span><strong>Nettoyer le jour même.</strong> La balle humide laissée dans le grain le fait chauffer et le gâte en quelques jours.</p>
<p class="step"><span class="sn">42</span><strong>Sécher à 13-15 % d’eau</strong> — l’avoine nue sous 10 % —, en couche mince, retournée chaque jour. Le grain de table sèche sur la claie au-dessus du poêle (<span class="ref">ch. 5</span> <span class="ref">§9</span>) et ne doit jamais dépasser 60 °C, sinon la farine perd sa qualité. <strong>La semence, non</strong> : elle sèche à l’air, loin du poêle, en semaines plutôt qu’en heures, et n’est jamais plus chaude que la main qui la touche ; au-dessus de 35 °C d’air, le germe s’abîme sans que rien ne paraisse (<span class="ref">ch. 100</span> <span class="ref">§5-G</span>, étape 30). La mesure et la débrouille sont au <span class="ref">§9</span>.</p>
<p class="step pk-d"><span class="sn">43</span><strong>Trier avant de garder.</strong> La saumure contre l’ergot pour le seigle, l’orge et le blé (<span class="ref">§9</span>), puis le drap blanc, grain par grain (<span class="ref">ch. 88</span> <span class="ref">§5</span>.F). Des grains minces, ratatinés, blanc craie ou rosés au germe sont de la fusariose : le lot ne se moud pas (<span class="ref">§8</span>, bloc 2).</p>
<p class="step"><span class="sn">44</span><strong>Garder et moudre.</strong> La semence à part, dans un sac marqué au crayon de plomb (étape 6) ; le grain de table en chaudières (<span class="ref">ch. 88</span> <span class="ref">§5</span>.G). On moud à mesure (<span class="ref">ch. 88</span> <span class="ref">§5</span>.F) : moulu entier, le grain donne 95 à 100 % de son poids en farine complète.</p>
<h2 class="sec" data-n="6"><span class="n">6</span><span class="t">Points de contrôle</span></h2>
<table class="tspan"><colgroup><col style="width:16.1%"><col style="width:16.0%"><col style="width:36.5%"><col style="width:31.4%"></colgroup><thead><tr><th>Moment</th><th>Ce qu’on vérifie</th><th>Cible chiffrée</th><th>Si c’est hors cible</th></tr></thead><tbody><tr><td class="c-item">L’hiver d’avant</td><td>Test de germination, grain et légumineuses (<span class="ref">ch. 100</span> <span class="ref">§5-K</span>)</td><td>Gourgane ≥ 85 % ; grain nu souvent sous 90 %</td><td>Semer plus dru à proportion ; sous 85 %, changer de lot de gourganes</td></tr><tr><td class="c-item">L’automne d’avant</td><td>Semence de pommes de terre mise de côté</td><td>Le cinquième au quart de la récolte prévue : 0,2 à 0,25 kg par mètre carré à planter, en morceaux de 40 à 60 g (étape 9)</td><td>Couper plus fin, en terre égouttée et sur le billon seulement (étape 9) ; planter les yeux (<span class="ref">§9</span>)</td></tr><tr><td class="c-item">Coupe de la semence</td><td>Poids et yeux</td><td>40 à 60 g, deux yeux ; 7 à 10 jours au frais</td><td>Morceaux plus gros en sol froid et mouillé</td></tr><tr><td class="c-item">Plantation</td><td>Date, rangs, profondeur</td><td>Au plus tôt deux semaines avant la dernière gelée ; 71 à 91 cm, 28 cm sur le rang ; 10 à 15 cm (5 à 10 cm en sol froid)</td><td>Sol détrempé : attendre qu’il s’égoutte, la semence y pourrit</td></tr><tr><td class="c-item">Plants à 20-30 cm</td><td>Buttage</td><td>Aucun tubercule visible ; dernier buttage avant la fleur</td><td>Rebutter tout de suite</td></tr><tr><td class="c-item">Floraison des pommes de terre</td><td>Eau reçue</td><td>25 L/m² par semaine, pluie comprise</td><td>Porter l’eau là d’abord</td></tr><tr><td class="c-item">Jours de brume : humidité &gt; 90 %, nuits 10-15 °C, jours 16-20 °C</td><td>Envers des feuilles du bas, creux, lisières</td><td>Aucune tache humide qui passe les nervures</td><td>Étape 14, le jour même</td></tr><tr><td class="c-item">Deux semaines avant d’arracher</td><td>Fanes</td><td>Complètement mortes</td><td>Défaner</td></tr><tr><td class="c-item">Arrachage</td><td>Sol et tubercules</td><td>Surface du sol sèche ; tubercules séchés en surface, environ 2 h en sol léger</td><td>Attendre une journée sèche ; jamais après le gel du sol</td></tr><tr><td class="c-item">Semis du grain</td><td>Dose et profondeur</td><td>12 g/m² en rangs, 13,5 à 15 g/m² à la volée ; 4 à 6 cm</td><td>Sol froid : attendre la pluie chaude pour l’orge</td></tr><tr><td class="c-item">Floraison du grain</td><td>Épis, surtout aux bords</td><td>Aucun miellat collant, aucun sclérote</td><td>Couper les bords à part ; <span class="ref">§8</span>, bloc 1</td></tr><tr><td class="c-item">Récolte du grain</td><td>Stade</td><td>Épi jaune pâle ; l’ongle ne marque plus le grain</td><td>Attendre ; ne pas laisser l’orge à six rangs s’égrener</td></tr><tr><td class="c-item">Moyettes</td><td>Durée</td><td>7 à 10 jours par temps frais et humide ; 3 à 4 jours par temps chaud et sec</td><td>Rentrer avant la pluie ; finir de sécher sous toit</td></tr><tr><td class="c-item">Grain avant les chaudières</td><td>Eau</td><td>13 à 15 % ; avoine nue sous 10 %</td><td>Remettre sur la claie</td></tr><tr><td class="c-item">Séchage</td><td>Chaleur du grain</td><td>≤ 60 °C pour la table ; semence jamais plus chaude que la main, loin du poêle (étape 42)</td><td>Éloigner du poêle ; la semence va sur une moustiquaire à l’air</td></tr><tr><td class="c-item">Tri</td><td>Grain</td><td>Aucun sclérote ; aucun grain blanc craie, ratatiné ou rosé</td><td>Sclérotes : saumure, puis drap blanc (<span class="ref">§9</span>). Grains fusariés : le lot ne se moud pas (<span class="ref">§8</span>, bloc 2)</td></tr><tr><td class="c-item">Gourganes sèches</td><td>Gousses et graines</td><td>Gousses noires, graines dures ; environ 13 % d’eau</td><td>Laisser sécher sur pied ou sur la claie</td></tr></tbody></table>
<h2 class="sec" data-n="7"><span class="n">7</span><span class="t">Signes d’échec</span></h2>
<table class="tspan"><colgroup><col style="width:39.2%"><col style="width:23.0%"><col style="width:37.8%"></colgroup><thead><tr><th>Observation</th><th>Diagnostic</th><th>Action</th></tr></thead><tbody><tr><td class="c-item">Taches humides sombres partant du bord des feuilles, duvet blanc dessous, qui passent par-dessus les nervures ; odeur de vinaigre dans le rang</td><td>Mildiou</td><td>Étape 14 : arracher et sortir le double de la surface ; défaner ; récolter au sec</td></tr><tr><td class="c-item">Taches brunes arrêtées net par les nervures</td><td>Brûlure hâtive, moins grave</td><td>Surveiller ; ne pas la confondre avec le mildiou</td></tr><tr><td class="c-item">Pelure creusée, brun rougeâtre près des yeux ; chair marbrée de rouille, grenue</td><td>Mildiou du tubercule</td><td>Ni caveau ni semence ; enfouir loin du champ</td></tr><tr><td class="c-item">Pommes de terre qui pourrissent au caveau et gagnent leurs voisines</td><td>Un tubercule malade est entré, ou la récolte était mouillée ou meurtrie</td><td>Trier chaque semaine (<span class="ref">ch. 79</span>) ; l’an prochain, étapes 15 à 17</td></tr><tr><td class="c-item">Pommes de terre qui se défont au dégel</td><td>Gelées avant l’arrachage</td><td>Jeter : elles ne se mangent plus. Arracher avant que la terre gèle</td></tr><tr><td class="c-item">Croûtes brunes et liégeuses sur la pelure</td><td>Gale : cendre, coquille ou fumier frais dans la planche</td><td><span class="ref">Ch. 96</span> <span class="ref">§7</span> ; peler, et changer la place des pommes de terre</td></tr><tr><td class="c-item">Tubercules verts sous la pelure</td><td>Lumière : buttage insuffisant</td><td><span class="ref">Ch. 95</span> <span class="ref">§7</span> et <span class="ref">§8</span></td></tr><tr><td class="c-item">Orge qui lève jaune et rabougrie, ou qui ne lève pas</td><td>Semée en sol froid : elle a pourri ou elle a été arrêtée</td><td>Resemer après une pluie chaude ; mettre l’avoine en premier sur le sol froid</td></tr><tr><td class="c-item">Betteraves qui fleurissent et montent en graine dès la première année, sans faire de racine</td><td>Les jours longs du Nord</td><td>Semer plus tard et éclaircir ; une betterave montée ne se rattrape pas</td></tr><tr><td class="c-item">Avoine rouillée<sup class="fnr" data-fn="98-7">7</sup> par bandes</td><td>Semis trop clair par endroits</td><td>Semer plus dru, en deux passages croisés</td></tr><tr><td class="c-item">Épis avec une corne noire ou violette à la place d’un grain ; dans le lot battu, des grains noir violacé, souvent de la taille des autres</td><td>Ergot</td><td><span class="ref">§8</span>, bloc 1</td></tr><tr><td class="c-item">Grains minces, ratatinés, blanc craie ou rosés au germe ; masse rosée sur l’épi</td><td>Fusariose</td><td>Le lot ne se moud pas (<span class="ref">§8</span>, bloc 2)</td></tr><tr><td class="c-item">Épis germés dans la moyette ou couchés au sol</td><td>Grain nu versé ou mouillé</td><td>Battre et sécher tout de suite. S’il n’y a ni grain blanc craie ou rosé, ni duvet, ni odeur de moisi : ce grain ne se garde pas longtemps, le manger d’abord ou le germer pour le pain (<span class="ref">ch. 88</span> <span class="ref">§9-D</span>). Sinon, <span class="ref">§8</span>, bloc 2</td></tr><tr><td class="c-item">Tas de grain qui chauffe, qui colle, ou qui sent le moisi ou le renfermé</td><td>Une moisissure qui travaille (<span class="ref">ch. 88</span> <span class="ref">§5</span>.G)</td><td><strong>Sort de la cuisine, sans y goûter</strong> (<span class="ref">§8</span>, bloc 2). Le sécher ne le rattrape pas : la toxine, s’il y en a, reste</td></tr><tr><td class="c-item">Grain encore froid et sans odeur, mais qui s’écrase sous l’ongle au lieu de casser net</td><td>Trop humide, pris à temps</td><td>Étaler mince et sécher tout de suite (étape 42)</td></tr><tr><td class="c-item">Gruau ou flocons d’avoine qui sentent le rance après quelques jours</td><td>Avoine décortiquée non étuvée</td><td>Étuver 30 à 60 min à 116 °C avant de garder</td></tr><tr><td class="c-item">Semence de grain nu qui lève mal</td><td>Germe blessé au battage</td><td>Battre moins longtemps la semence ; semer plus dru</td></tr><tr><td class="c-item">Gourganes qui ont fleuri sans faire de gousses, fleurs tombées</td><td>Coulure : chaleur et sécheresse à la floraison</td><td>Semer plus tôt l’an prochain</td></tr><tr><td class="c-item">Nausées violentes, vomissements et diarrhée 1 à 3 h après un plat de haricots secs</td><td>Lectines : cuisson insuffisante</td><td>Étape 26 : tremper, jeter l’eau, 10 minutes à gros bouillon</td></tr><tr><td class="c-item">Mal de ventre ou vomissements après un plat de gourganes</td><td>Cuisson insuffisante, <strong>ou début de favisme</strong> : sur le coup, on ne peut pas trancher</td><td>Ne pas lui en resservir. Regarder son urine et le blanc de ses yeux pendant trois jours : les signes du favisme viennent surtout le lendemain et le surlendemain ; <span class="ref">§8</span>, bloc 5</td></tr><tr><td class="c-item">Urine foncée, blanc des yeux jaune, souffle court après des gourganes</td><td>Favisme</td><td><span class="ref">§8</span>, bloc 5</td></tr></tbody></table>

<template id="story-d">
<p class="pt"><span class="pn">1</span><strong class="plead">1 — L’ergot de son propre seigle.</strong> L’ergot (<em>Claviceps purpurea</em>) pousse à la place du grain un sclérote dur, noir ou violet foncé dehors, blanc ou gris dedans quand on le casse. <strong>Il a souvent la taille et la forme du grain</strong> ; certains sont bien plus gros, jusqu’à dix fois, et dépassent des balles de l’épi. Au tri, ce n’est donc pas la taille qui le trahit : c’est la couleur. Il porte des alcaloïdes qui restent actifs dans la farine et dans le pain (<span class="ref">ch. 88</span>, <span class="ref">§8</span> bloc 2). L’empoisonnement coupe la circulation : des brûlures et des engelures qui alternent dans les mains et les pieds, puis la gangrène des extrémités, parfois des convulsions, et la mort. <strong>Chez une femme enceinte, une petite quantité suffit à faire contracter l’utérus : saignement, fausse couche.</strong> La farine du commerce court très peu de risque ; <strong>le grain qu’on a fait pousser soi-même ne se mange qu’après un tri serré</strong>. Le seigle est le plus touché, parce que sa fleur reste ouverte ; puis l’orge et le blé ; l’avoine, rarement. C’est un printemps mouillé après un hiver froid, puis une floraison fraîche, nuageuse et humide qui le font : un été de la Côte-Nord. Ce qu’on fait : couper à part les bords du champ, où il est d’habitude le pire ; trier à la saumure puis au drap blanc ; ne jamais remettre une céréale au même endroit l’année suivante ; faucher les herbes du bord avant leur floraison. <strong>Le grain des bords qui reste chargé, et tout lot où les sclérotes reviennent à chaque poignée, ne se moud pas et ne va pas aux bêtes</strong> : l’ergot les empoisonne aussi, et la moulée qu’on en tire est aussi toxique que le grain. Il se brûle, ou s’enterre loin des planches.</p>
<p class="pt"><span class="pn">2</span><strong class="plead">2 — Le grain rentré humide.</strong> Au-dessus de 15 % d’eau, le grain moisit (<span class="ref">ch. 88</span> <span class="ref">§3</span>), et les moisissures du grain font des toxines que le four ne détruit pas (<span class="ref">ch. 88</span>, <span class="ref">§8</span> bloc 3). La fusariose se voit parfois, pas toujours : sur l’épi, par temps humide, une masse rosée ; dans le lot, des grains minces, ratatinés, blanc craie, parfois rosés au germe, avec un duvet blanc ou rosâtre qui ne se voit guère qu’à la loupe (<span class="ref">ch. 88</span> <span class="ref">§5</span>.F). Un rose vif et égal sur tout un lot, c’est de la semence traitée (bloc 3). Elle se prend au champ pendant les étés mouillés et continue en entrepôt si le grain reste humide. <strong>Un lot qui porte de ces grains ne se moud pas, même s’il ne sent rien</strong> (<span class="ref">ch. 88</span> <span class="ref">§5</span>.F et <span class="ref">§7</span>) : trier les grains touchés ne dit rien du reste, et rien au chalet ne dose la toxine. Une moyette qui ne sèche pas dans la brume de septembre ne se rentre pas en sac pour « finir de sécher dedans ». Un grain qui sent le moisi, qui colle ou qui chauffe sort de la cuisine, et on ne le goûte pas pour décider : le sécher après coup ne le rattrape pas.</p>
<p class="pt"><span class="pn">3</span><strong class="plead">3 — La semence traitée n’entre jamais dans le grain de table.</strong> Le grain acheté pour semer le champ est souvent enrobé d’un fongicide ou d’un insecticide, teint en rouge ou en rose pour les céréales, en bleu ou en vert pour les légumineuses, et ça ne part pas au rinçage (<span class="ref">ch. 88</span>, <span class="ref">§8</span> bloc 1 ; <span class="ref">ch. 100</span> <span class="ref">§8</span>). Le lot de semence a son sac, marqué au crayon de plomb (<span class="ref">ch. 100</span> <span class="ref">§5-I</span>), et il ne passe jamais par la chaudière du grain de table. La pomme de terre de semence achetée n’est pas de la nourriture non plus, même une fois ses yeux levés (<span class="ref">ch. 100</span> <span class="ref">§8</span>).</p>
<p class="pt"><span class="pn">4</span><strong class="plead">4 — Les boules vertes au bout des tiges de pomme de terre.</strong> Après la floraison, certains plants font de petites boules vertes qui ressemblent à des tomates cerises. Elles sont toxiques : les mêmes glyco-alcaloïdes que la pelure verdie, plus concentrés, et la cuisson ne les enlève pas (<span class="ref">ch. 95</span> <span class="ref">§8</span> ; <span class="ref">ch. 100</span> <span class="ref">§9</span>). Un enfant de 4 ou 6 ans qui aide au jardin en août les trouve avant qu’on les voie. On les cueille et on les jette à mesure qu’elles paraissent — sauf celles qu’on garde exprès pour la graine vraie, qui se traitent comme un poison.</p>
<p class="pt"><span class="pn">5</span><strong class="plead">5 — La gourgane et le favisme.</strong> Certaines personnes manquent d’une enzyme qui protège leurs globules rouges : chez elles, la fève peut les faire éclater. C’est héréditaire, lié au chromosome X, donc surtout des garçons et des hommes, et fréquent dans les familles d’origine africaine, méditerranéenne — italienne, grecque, arabe, juive séfarade — ou asiatique. La plupart des crises légères ne donnent aucun signe : on peut porter le déficit sans le savoir. Les signes viennent le lendemain ou le surlendemain du repas, parfois dans les heures, jusqu’à cinq jours chez un bébé, et après une semaine si on en mange tous les jours : urine foncée, rouge, brune ou presque noire, jaunisse<sup class="fnr" data-fn="98-8">8</sup>, fatigue, souffle court, parfois mal au dos ou au ventre. Chez l’enfant, un peu de fièvre et un changement d’humeur, agité ou éteint, peuvent venir avant. Dans les cas graves, le rein lâche, et ça se voit : l’urine diminue, puis s’arrête. <strong>Ces signes après un plat de gourganes veulent dire que la vie est en jeu.</strong> Le traitement, c’est d’abord de retirer ce qui a déclenché la crise : plus jamais de gourgane pour cette personne, et pas pour ses frères et sœurs tant qu’on ne sait pas, puisque le défaut se transmet. Ensuite, ce qu’on fait ici : le repos, et à boire, beaucoup — ce que les globules éclatés relâchent passe par le rein et peut le boucher, et l’eau qui coule est la seule protection du rein qu’on connaisse ; à l’hôpital, c’est de l’eau salée qui entre par la veine — puis le compte des pipis du <span class="ref">ch. 28</span> (étape 5) ; plus de 8 heures sans uriner, la vie est en jeu (<span class="ref">ch. 28</span>, étape 10). La plupart des crises, même fortes, passent d’elles-mêmes en quelques jours. La gourgane verte de juillet déclenche aussi. Moins mûre, elle porte moins du poison que la sèche ; mais mangée crue, au jardin, elle déclenche plus souvent qu’une fève cuite. Pour qui a fait une crise : aucune gourgane, verte ou sèche, crue ou cuite, ni un plat qui en a touché. La gourgane est la légumineuse que ce chapitre pousse, et elle se partage entre familles (<span class="ref">ch. 16</span>, <span class="ref">ch. 18</span>) : avant d’en servir à quelqu’un d’une autre famille, on lui demande d’où vient sa famille, et s’il a déjà fait une crise — urine foncée ou jaunisse après des fèves ou un médicament.</p>
