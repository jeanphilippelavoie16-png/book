<template id="story-e">
<p class="p0 ri"><strong class="runin">Le premier printemps, sur une terre qu’on n’a jamais retournée.</strong> Le stock du <span class="ref">ch. 5</span> baisse, la trouée est de mousse sur du sable gris, il n’y a pas de catalogue, pas de bête de trait, pas de fumier, et la saison est déjà entamée. Le <span class="ref">ch. 96</span> <span class="ref">§9</span> dit comment faire la terre de cent trous et monter le billon de varech. Ce qui suit dit <strong>quoi y mettre, en quelle quantité, et comment en tirer à manger dès le premier automne</strong>.</p>
<p class="p0 lab kh"><strong class="runin">Ce qu’on sème la première année, dans l’ordre.</strong></p>
<p class="step pk-d"><span class="sn">1</span><strong>Des pommes de terre, avant tout.</strong> Sur une terre neuve dont la surface est tenue par un gazon ou une mousse, c’est la meilleure culture des premières années : les binages et les buttages qu’elle demande défont justement ce gazon, et elle laisse derrière elle une terre propre pour le grain. Là où un bois a brûlé — après un feu de forêt (<span class="ref">ch. 11</span>), pas un abattis qu’on allumerait sur l’humus (<span class="ref">ch. 96</span> <span class="ref">§8</span>) —, la cendre a laissé de la potasse, et la pomme de terre en profite la première.</p>
<p class="step"><span class="sn">2</span><strong>Des navets et des rutabagas</strong>, qui rendent en 50 à 75 jours et se sèment jusqu’à deux semaines avant la dernière gelée. Pas sur une terre brûlée à fond la première année : le navet y réussit mal.</p>
<p class="step"><span class="sn">3</span><strong>Des pois ou des gourganes</strong>, pour la protéine de l’hiver et pour l’azote de la planche de l’an prochain (<span class="ref">ch. 96</span>, étape 27). Une terre fraîchement défrichée manque justement d’azote.</p>
<p class="step"><span class="sn">4</span><strong>Une planche de 100 m² de grain nu</strong>, pour la semence. Les bonnes années, elle rend de quoi semer 700 à 2 500 m² l’année suivante. Elle ne fait pas de pain ; elle fait le champ de l’année d’après.</p>
<p class="step"><span class="sn">5</span><strong>Ce qu’on ne sème pas :</strong> le blé, la courge, le haricot, et un grand champ de grain. La fertilité qu’on a — varech, cendre d’os, urine, la terre noire des feuillus — va au trou des pommes de terre et des choux (<span class="ref">ch. 96</span> <span class="ref">§9</span>), pas à la volée sur du grain.</p>
<p class="p0 ri"><strong class="runin">La semence de pomme de terre quand il n’y en a pas.</strong> C’est le premier mur, parce que la semence, c’est de la nourriture qu’on enterre.</p>
<p class="li"><strong>Planter les yeux, manger le reste.</strong> Sur des pommes de terre de table — sa propre récolte, un sac d’épicerie qui germe —, on lève chaque œil à la pointe du couteau, avec une rondelle de chair sous l’œil, et on plante les rondelles ; le reste du tubercule va au chaudron <strong>s’il n’est ni vert ni amer</strong> (<span class="ref">ch. 95</span> <span class="ref">§8</span>). Jamais sur une semence achetée : elle est souvent traitée, et ce qui reste d’elle ne se mange pas (<span class="ref">§8</span>, bloc 3 ; <span class="ref">ch. 100</span> <span class="ref">§8</span>). Ça se faisait déjà au XIXe siècle quand la semence était rare et chère. Et un morceau dont on a cassé les germes au caveau repousse quand même : une semence qui a germé ne se jette pas.</p>
<p class="li"><strong>Ce qu’on perd :</strong> la réserve. Un œil seul avec peu de chair donne une plante plus faible, et dans une terre froide et mouillée, il pourrit au lieu de lever : les yeux seuls se plantent dans une terre bien égouttée, sur le billon (<span class="ref">ch. 96</span> <span class="ref">§9</span>), à 5-10 cm seulement. En terre mouillée, on plante plus gros, quitte à manger moins.</p>
<p class="li"><strong>Les pommes de terre d’épicerie</strong> ont pu être traitées contre la germination. Un sac qui refuse de germer au chaud et au noir est traité (<span class="ref">ch. 100</span> <span class="ref">§9</span>) : il se mange, il ne se plante pas.</p>
<p class="li"><strong>La semence qu’il faut</strong>, selon la coupe : le tableau de l’étape 9. Couper en quatre divise par quatre ce qu’on enterre, avec des morceaux d’environ 14 g qui ne se plantent que dans une terre égouttée, sur le billon.</p>
<p class="p0 ri"><strong class="runin">Le grain de semence quand il n’y a pas de sac.</strong> Du seigle ou du blé en grain, de l’orge nue vendue pour manger, le blé du grain à oiseaux : vingt grains au test d’abord (<span class="ref">ch. 100</span> <span class="ref">§9</span>). Ne lèvent pas : l’orge perlée, polie jusqu’au cœur ; l’avoine roulée, en flocons ou en gruau, parce que l’avoine décortiquée vendue pour manger est chauffée pour ne pas rancir, et que cette chaleur tue le germe ; le pois cassé. <strong>Un grain d’origine inconnue passe à la saumure avant d’être semé</strong> — grain à oiseaux, provende, grain de table —, comme au tri de l’ergot plus bas : le grain de provende tolère plus d’ergot que celui de la table (<span class="ref">ch. 88</span>, <span class="ref">§8</span> bloc 2), personne n’a trié le grain à oiseaux, et les sclérotes mêlés au sac se sèment avec lui et donnent l’ergot à un champ isolé qui n’en avait pas. Puis on le rince et on le sèche comme une semence, à l’air, loin du poêle (étape 42).</p>
<p class="p0 ri"><strong class="runin">Manger avant la récolte.</strong> Le premier été, le stock baisse avant que le champ donne. Trois choses se prennent tôt, et chacune se paie.</p>
<p class="li"><strong>Les gourganes vertes, en juillet.</strong> Elles se mangent comme un légume frais. Chaque gousse cueillie verte est une gousse qui ne sera pas sèche pour l’hiver. Pour le favisme, la verte n’est pas sans danger, surtout crue (<span class="ref">§8</span>, bloc 5).</p>
<p class="li"><strong>Les navets d’éclaircissage.</strong> Les jeunes navets arrachés à l’éclaircissage, quand les feuilles sont encore tendres, se mangent feuilles et tout. Ça ne coûte rien : il fallait les arracher.</p>
<p class="li"><strong>Les pommes de terre nouvelles.</strong> On creuse quelques plants et on laisse les autres finir. Une pomme de terre nouvelle a la pelure mince : elle se mange, elle ne se garde pas, et chaque plant creusé tôt est un plant qui ne remplira pas sa butte.</p>
<p>Et la terre libérée se ressème : un navet semé à la mi-juillet, là où une récolte hâtive a laissé de la place, donne de meilleurs navets de garde qu’un semis de printemps.</p>
<p class="p0 ri"><strong class="runin">La planche paresseuse : deux gestes de plus que le billon.</strong> Le billon de varech du <span class="ref">ch. 96</span> <span class="ref">§9</span> est une planche paresseuse. Faite au complet, elle ajoute deux choses qui comptent sur une terre neuve envahie de chiendent. Les planches font de 0,9 à 2,1 m de large, les tranchées entre elles de 46 à 91 cm de large et de 30 à 50 cm de profond selon la terre, et les morceaux de semence se posent à 23-25 cm sur le fumier ou le varech. <strong>Environ trois semaines après, quand les germes pointent, on recouvre toute la planche de 5 à 8 cm de terre tirée des tranchées</strong> : cette couche étouffe le chiendent et les mauvaises herbes qui levaient avec la pomme de terre. On butte encore avec la terre des tranchées, sans jamais recouvrir les plants après la fleur. La méthode sert surtout là où la terre est mince et mal égouttée ; on l’a faite à Terre-Neuve, avec du varech. <strong>Ce qu’on perd :</strong> le dos.</p>
<p class="p0 ri"><strong class="runin">Faucher sans faux.</strong> Un couteau et une poignée à la fois, ou un sécateur, à 8-10 cm du sol : c’est lent, et ça suffit pour une planche de semence. La faucille se fait d’une lame de scie ou d’une lame de ressort, dont on tire la courbe et le fil (<span class="ref">ch. 111</span>, <span class="ref">ch. 105</span>). La faux et son réglage sont au <span class="ref">ch. 99</span> ; la faucille y est donnée pour environ cinq fois plus lente.</p>
<p class="p0 ri"><strong class="runin">Le fléau qu’on fabrique.</strong> Deux bâtons, un long et un court, reliés par une corde, une lanière de cuir ou une petite chaîne. Le long, le manche, se tient à deux mains ; le court, le battoir, est en bois franc lourd, du merisier (<em>Betula alleghaniensis</em>) si on en a. La liaison — une lanière de cuir ou de babiche (<span class="ref">ch. 103</span>) passée dans une boucle au bout de chaque bâton — doit laisser le battoir tourner librement : c’est ce qui le fait tomber à plat sur les épis au lieu de les frapper du bout. Les gerbes se couchent sur la toile en deux rangées, épis vers le milieu ; on frappe, on retourne la couche, on refrappe, puis on secoue la paille et on la retire. <strong>Ce battoir libre est aussi ce qui blesse.</strong> Un coup mal pris le ramène sur la tête ou sur les mains de celui qui bat : le geste s’apprend lentement, à petits coups. Et la lanière s’use la première ; usée, elle cède en plein élan, et le battoir part comme une pierre vers ceux qui regardent. On la change dès qu’elle s’effiloche, pas quand elle casse, et on en garde une de rechange. Au fléau, une personne battait de l’ordre de 150 à 190 kg de grain par jour. <strong>Ce qu’on perd :</strong> rien en grain, beaucoup en bras.</p>
<p class="p0 lab kh"><strong class="runin">Battre sans fléau.</strong></p>
<p class="li"><strong>Les sacs piétinés</strong> : les épis dans un sac de toile fermé, posé sur un plancher dur, et on marche sur le bout où sont les épis. On sort une poignée de tiges de temps en temps pour voir où on en est.</p>
<p class="li"><strong>Le baril</strong> : la gerbe tenue par le pied et frappée sur le rebord d’un baril, le grain tombe dedans ; c’est le sac frappé sur un billot du <span class="ref">ch. 100</span> (étape 19), à la taille d’une gerbe.</p>
<p class="li"><strong>Les perches au-dessus de la toile</strong>, la vieille façon de battre au champ : une aire raclée et balayée, ou une toile, et par-dessus un lit de perches espacées de 2,5 à 5 cm, surélevées assez pour laisser de la place au grain. On jette la paille sur les perches et on bat : le grain passe entre les perches, la paille reste dessus et s’enlève d’un coup. On vanne ensuite sur place.</p>
<p class="p0 ri"><strong class="runin">Vanner sans tarare.</strong> Un jour de vent régulier, verser le grain de la hauteur de l’épaule sur la toile ; la balle part, le grain tombe (<span class="ref">ch. 100</span> <span class="ref">§5-E</span>). Le premier tamis se fait de grillage de poulailler cloué sur un cadre de lattes. Le second, d’une tôle ou d’un fond de boîte percé au clou, d’un trou juste plus petit que le grain entier : on essaie le clou sur une poignée de bon grain avant de percer toute la tôle. Le grain cassé et les petites graines passent, le grain entier reste. Une moustiquaire, même doublée, ne laisse passer que la poussière.</p>
<p class="p0 lab kh"><strong class="runin">Sécher, et savoir que c’est sec, sans instrument.</strong></p>
<p class="li"><strong>La claie au-dessus du poêle</strong>, pour le grain de table seulement : en couche mince, brassé à la main (<span class="ref">ch. 5</span> <span class="ref">§9</span>).</p>
<p class="li"><strong>La semence, loin du poêle.</strong> Sur une moustiquaire tendue à l’air, dans la pièce du poêle mais loin de lui, retournée à la main chaque jour, pendant des semaines (<span class="ref">ch. 100</span> <span class="ref">§9</span>). Elle n’est jamais plus chaude que la main qui la touche : une claie tiède au toucher est déjà trop chaude pour elle.</p>
<p class="li"><strong>La pesée.</strong> Peser un lot d’au moins 1 kg, étalé mince, le sécher 12 heures au four réglé à 60-65 °C, le repeser : la différence divisée par le poids de départ, fois 100, donne le pourcentage d’eau. On vise 13 à 15 %. Sur 1 kg, l’écart entre 13 et 15 % est de 20 g : il faut des masses divisées jusqu’à une quinzaine de grammes, six divisions d’un sac de 1 kg à la balance du <span class="ref">ch. 5</span> <span class="ref">§9</span>. Sans elles, la pesée dit seulement si le grain est encore franchement mouillé. Si le four du poêle ne tient pas une chaleur aussi basse, on garde le test de l’ongle du <span class="ref">ch. 88</span> : un grain sec casse net, un grain humide s’écrase.</p>
<p class="p0 ri"><strong class="runin">Trier l’ergot sans tamis ni lumière.</strong> Une saumure de <strong>250 g de sel par litre d’eau</strong> : 20 % du poids de la saumure. On y verse le grain, on brasse ; les sclérotes d’ergot, plus légers, remontent, et on les écume. On rince ensuite le grain à grande eau et on le sèche <strong>le jour même</strong> (étape 42). La saumure se fait pour le seigle, l’orge et le blé, les grains que l’ergot touche. <strong>Pas pour l’avoine vêtue</strong> : avec sa balle, elle pèse à peu près ce que pèse l’eau, et elle remonte avec l’ergot ; l’ergot la touche rarement, et pour elle, le tri se fait au drap blanc (<span class="ref">ch. 88</span> <span class="ref">§5</span>.F). Pour une orge vêtue, une poignée d’abord : si le grain remonte, la saumure ne trie rien. Le drap blanc du <span class="ref">ch. 88</span> <span class="ref">§5</span>.F passe après, pas à la place. <strong>Ce qu’on perd :</strong> du sel, que la viande de l’hiver réclame aussi (<span class="ref">ch. 09</span>) et qu’il faut tirer du fleuve s’il manque (<span class="ref">ch. 67</span>), et un grain mouillé qu’il faut sécher avant qu’il chauffe. La saumure se jette loin des planches. Les sclérotes écumés se brûlent ou s’enterrent loin : même morts, ils gardent leurs alcaloïdes.</p>
<p class="p0 ri"><strong class="runin">Le champ sans bête de trait.</strong> Les 125 à 150 heures à l’hectare de l’étape 5 supposent une charrue tirée par une bête. À la bêche, il en faut davantage. La première année se fait donc en planches paresseuses et en poquets (<span class="ref">ch. 96</span> <span class="ref">§9</span>), la planche de grain en rangs à la binette ; le champ vient la deuxième année, sur la terre que les pommes de terre ont nettoyée.</p>
<p class="p0 ri"><strong class="runin">Ce qu’on perd, en tout, la première année.</strong> Du rendement, franchement. Une terre neuve a peu d’azote disponible. Ce que la fumure pèse, on le sait d’une terre déjà cultivée : des pommes de terre sans aucune fumure y rendaient le tiers de ce que donnait le fumier de ferme. Sur une trouée neuve, la pomme de terre souffre moins que le reste, c’est sa terre (point 1). Le grain y perd presque tout : de l’orge semée sur un sable boréal défriché de l’année, sans rien pour la nourrir en azote, a rendu à peu près le dixième de la même orge nourrie, et guère mieux la deuxième année. Les racines y perdent aussi. La première année ne nourrit pas l’hiver ; elle en nourrit une part, et surtout elle fait la semence et la terre de la deuxième. C’est le stock (<span class="ref">ch. 5</span>), le gibier et le poisson qui portent ce premier hiver-là.</p>
<p class="p0 lab kh"><strong class="runin">Ce que la variante ne remplace jamais.</strong></p>
<p class="li"><strong>Les jours sans gel.</strong> Aucune planche, aucune butte, aucun geste ne donne à un blé ou à une courge les jours qu’ils n’ont pas. Les abris en gagnent quelques-uns aux deux bouts ; ils ne font pas un été (<span class="ref">ch. 95</span>, <span class="ref">ch. 97</span>).</p>
<p class="li"><strong>La semence gardée l’automne d’avant.</strong> Rien, dans ce chapitre, ne fabrique en mai une semence qu’on n’a pas mise de côté en octobre (<span class="ref">ch. 100</span>).</p>
<p class="li"><strong>L’autoclave</strong>, pour tout légume du champ qu’on voudrait mettre en pot. Il n’y a pas de variante : le caveau, le baril de fermentation, ou rien (<span class="ref">ch. 78</span>, <span class="ref">ch. 79</span>, <span class="ref">ch. 80</span>). Le botulisme ne change ni l’odeur, ni le goût, ni l’apparence.</p>
<p class="li"><strong>L’ergot, le grain moisi, la semence traitée.</strong> Aucune faim ne les rend mangeables (<span class="ref">§8</span>).</p>
<p class="li"><strong>Le gras.</strong> Le champ fait l’amidon, pas le gras. <strong>La viande maigre et la pomme de terre ne font pas un hiver sans gras</strong> : le mal de caribou se prévient au <span class="ref">ch. 19</span> et au <span class="ref">ch. 72</span>, pas au champ.</p>

<template id="notes">
<p class="fn" data-fn="28-1"><span class="fnn">1</span>Chez l’enfant couché calme, torse nu : à chaque inspiration, le bas de la cage thoracique se creuse vers l’intérieur pendant que le haut du ventre se soulève. Ça compte seulement si c’est permanent et bien visible au repos ; un creux qui paraît quand l’enfant pleure ou mange, ou la peau qui se creuse seulement entre les côtes ou au-dessus de la clavicule, ne suffit pas. Chez l’adulte, c’est la peau qui se creuse entre les côtes ou au-dessus des clavicules.</p>
<p class="fn" data-fn="28-2"><span class="fnn">2</span>Les narines s’ouvrent grand à chaque inspiration, comme chez quelqu’un qui vient de courir, alors que la personne est couchée au repos.</p>
<p class="fn" data-fn="28-3"><span class="fnn">3</span>Un son court, répété, comme un petit grognement ou une plainte, à chaque expiration : l’enfant ferme à moitié sa gorge pour garder de l’air dans ses poumons.</p>
<p class="fn" data-fn="28-4"><span class="fnn">4</span>Un son rauque et aigu qu’on entend quand la personne <strong>inspire</strong>, pas quand elle expire. Au repos, il veut dire que le passage de l’air dans la gorge est en train de se fermer.</p>
<p class="fn" data-fn="28-5"><span class="fnn">5</span>Presser fermement le flanc d’un verre transparent sur la tache et regarder à travers. Une tache qui pâlit et disparaît sous la pression est une rougeur ordinaire. <strong>Une tache qui reste visible à travers le verre</strong> est du sang sorti sous la peau. Elle commence souvent en petits points rouges comme des piqûres d’épingle, puis s’étend en taches rouges ou violettes. Sur une peau foncée, on regarde les zones pâles : paumes, plantes des pieds, palais, blanc des yeux, intérieur des paupières. Tous les malades graves n’ont pas de taches : leur absence ne rassure pas.</p>
<p class="fn" data-fn="28-6"><span class="fnn">6</span>La personne couchée ou assise, on lui demande d’amener le menton sur la poitrine, ou on soulève doucement sa tête pour le faire. Une nuque raide résiste : le geste est très douloureux, parfois impossible, alors que tourner la tête de côté l’est beaucoup moins. Le signe se cherche chez l’enfant plus vieux et l’adulte ; le tout-petit peut ne pas l’avoir.</p>
<p class="fn" data-fn="28-7"><span class="fnn">7</span>Le bleu ou le gris se voit d’abord aux lèvres, à la langue, aux gencives et sous les ongles ; sur une peau foncée, aux paumes, aux lèvres, à la langue, aux gencives et autour des yeux. Il apparaît tard, quand il manque déjà beaucoup d’oxygène.</p>
<p class="fn" data-fn="28-8"><span class="fnn">8</span>Une peau tachetée de violet, de gris et de pâle, comme du marbre ; sur une peau foncée, elle se voit mieux aux paumes et à la plante des pieds. Avec la fièvre et des mains et des pieds froids, c’est la circulation qui se ferme à la peau pour garder le sang au centre du corps (<span class="ref">ch. 26</span>, section 8).</p>
<p class="fn" data-fn="28-9"><span class="fnn">9</span>Une fièvre qui dure au moins 5 jours et ne cède pas aux médicaments, le plus souvent chez un enfant de moins de 5 ans, avec plusieurs de ces signes : les yeux rouges <strong>sans écoulement</strong>, apparus au bout d’un ou deux jours ; les lèvres rouges, sèches et fendues, la langue rouge comme une fraise ; les paumes et la plante des pieds rouges ou violacées, les mains et les pieds enflés ; une éruption de taches rouges sur le tronc ; des ganglions enflés au cou. Vers le 10e jour, la peau du bout des doigts pèle.</p>
<p class="fn" data-fn="28-10"><span class="fnn">10</span>Derrière l’oreille, sur l’os qu’on sent en arrière du pavillon : une bosse rouge, chaude, douloureuse au toucher, qui pousse le pavillon vers l’avant et le décolle de la tête. On compare avec l’autre côté, en regardant l’enfant de face puis de derrière. L’enfant est fatigué, irritable, entend moins de ce côté.</p>
<p class="fn" data-fn="28-11"><span class="fnn">11</span>Des gestes brusques, sans but, que l’enfant ne contrôle pas, des mains d’abord, puis des pieds et du visage, avec des grimaces ; ils disparaissent pendant le sommeil. Dans les cas légers, l’enfant a seulement l’air maladroit et peine à s’habiller et à manger. Ils peuvent n’apparaître qu’une fois tous les autres signes disparus.</p>
<p class="fn" data-fn="28-12"><span class="fnn">12</span>L’enfant a une forte fièvre apparue en moins d’une journée, il est anxieux, assis, penché en avant, la bouche ouverte, la salive qui coule parce qu’avaler fait trop mal. Il ne tousse pas et sa voix n’est pas rauque, ce qui le distingue du croup, où la toux aboie. Il refuse de se coucher : c’est sa façon de garder l’air ouvert.</p>
<p class="fn" data-fn="28-13"><span class="fnn">13</span>Un mal de gorge qui s’aggrave au lieu de passer, plus fort d’un côté ; la voix étouffée, comme avec une patate chaude dans la bouche ; la bouche qui n’ouvre plus qu’à moitié parce que les mâchoires se contractent ; à la lampe, un côté du fond de la gorge bombe et pousse la luette — le petit bout de chair qui pend au milieu — vers l’autre côté.</p>
<p class="fn" data-fn="28-14"><span class="fnn">14</span>On demande à la personne de suivre un doigt des yeux, à gauche, à droite, en haut, en bas. Dans l’infection de l’orbite, bouger l’œil fait mal, un œil suit moins bien que l’autre, elle voit le doigt en double ; vu de profil ou d’en haut, l’œil malade dépasse l’autre.</p>
<p class="fn" data-fn="28-15"><span class="fnn">15</span>Aucune urine depuis plus de 8 heures ; pas de larmes quand il pleure ; les yeux enfoncés ; la bouche et la langue sèches ; une soif extrême, ou au contraire un enfant qui ne veut plus boire ; une respiration plus rapide ; étourdi ou confus ; une peau froide et bleutée qui, pincée doucement entre deux doigts, ne reprend pas sa place tout de suite.</p>
<p class="fn" data-fn="28-16"><span class="fnn">16</span>Un vomi vert franc, ou jaune-vert comme de l’herbe écrasée : c’est de la bile. Chez un enfant, c’est un signe qui ne se discute pas, même si le reste a l’air d’une gastro ordinaire.</p>
<p class="fn" data-fn="28-17"><span class="fnn">17</span>Des traînées rouges, chaudes et douloureuses partent de l’infection et remontent le long du bras ou de la jambe, vers l’aisselle ou l’aine, souvent avec fièvre et frissons : l’infection gagne les vaisseaux lymphatiques (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-18"><span class="fnn">18</span>La peau craque sous le doigt quand on appuie, comme s’il y avait des bulles dessous : c’est du gaz que l’infection fabrique. Elle peut aussi virer au bronze, au violet ou au noir et se couvrir de cloques au liquide brun. La douleur est bien plus forte que ce que la peau laisse voir, puis la zone devient insensible (<span class="ref">ch. 26</span>).</p>
<p class="fn" data-fn="28-19"><span class="fnn">19</span>Le triangle qui va des coins de la bouche jusqu’à la racine du nez, entre les yeux : le nez, la lèvre du haut, les ailes du nez, le creux à côté du nez. Les veines de cette zone se vident vers une grosse veine à la base du crâne, derrière les yeux.</p>
<p class="fn" data-fn="37-1"><span class="fnn">1</span>Une douleur d’angine stable vient à un effort connu, toujours le même, reste courte et passe au repos. Celle qui interdit le sauna est prolongée et vient d’ordinaire au repos. Elle peut annoncer un infarctus : ce signe veut dire que la vie est en jeu, et la chaleur n’a rien à y faire.</p>
<p class="fn" data-fn="37-2"><span class="fnn">2</span>Dans les premières minutes d’un arrêt du cœur, la personne inconsciente fait souvent encore des bouffées : des halètements bruyants, comme un ronflement, de plus en plus espacés, la bouche qui s’ouvre comme celle d’un poisson sorti de l’eau. Ce n’est pas une respiration, c’est le signe de l’arrêt.</p>
<p class="fn" data-fn="38-1"><span class="fnn">1</span>On revit l’événement comme s’il recommençait : on revoit, on entend, parfois on sent la scène, et le corps réagit comme sur le moment — sursaut, cœur qui cogne, sueurs. Ça peut être assez réel pour faire croire qu’on hallucine ou qu’on devient fou. Ce n’est ni l’un ni l’autre : c’est une réaction ordinaire au stress.</p>
<p class="fn" data-fn="38-2"><span class="fnn">2</span>La personne pense sans arrêt à la personne morte, s’ennuie d’elle au point d’avoir mal, reste en colère contre la mort, s’isole, désespère, et n’arrive plus à ressentir quoi que ce soit de bon ni à reprendre ses activités. Elle peut même ressentir dans son corps les malaises que la personne morte avait à la fin de sa maladie. Ce qui distingue ce deuil-là, c’est que rien ne change d’un mois à l’autre.</p>
<p class="fn" data-fn="38-3"><span class="fnn">3</span>Les paroles qui alertent : « je veux en finir », « je vais me tuer », « vous seriez tellement mieux sans moi », « je suis inutile », « j’ai tout raté dans ma vie », « je serais bien mieux mort », « la vie ne vaut pas la peine d’être vécue ». Les comportements : s’isoler ; mettre de l’ordre dans ses affaires ; donner des objets personnels ; s’intéresser aux moyens de s’enlever la vie ; boire ou prendre des médicaments de façon inhabituelle ; être agité ou sans énergie ; écrire un testament ou un message d’adieu ; mal dormir, mal manger ; négliger son apparence et son hygiène ; et surtout, <strong>un regain d’énergie soudain après une période noire</strong>, que l’entourage prend pour une guérison.</p>
<p class="fn" data-fn="38-4"><span class="fnn">4</span>Environ 6 heures après le dernier verre : les mains tremblent, on sue, on a la nausée, mal à la tête. Entre 6 et 48 heures, des convulsions peuvent survenir — la personne tombe, se raidit, puis ses membres se secouent. Entre 12 et 24 heures, certains voient des choses qui n’existent pas. D’habitude entre 48 et 72 heures commence le délire, qui peut tuer : confusion croissante, angoisse, sueurs abondantes, cauchemars, visions qui terrifient, impression que le plancher bouge ou que les murs tombent.</p>
<p class="fn" data-fn="38-5"><span class="fnn">5</span>La vue devient floue, la lumière fait mal aux yeux ; on voit comme à travers une brume ou une peau posée sur l’œil, comme dans une tempête de neige, ou des points qui dansent et des éclairs. Puis la vue baisse, en partie ou au complet. Les pupilles restent grandes même à la lumière.</p>
<p class="fn" data-fn="38-6"><span class="fnn">6</span>Nausée et diarrhée chez quelqu’un qui mange pourtant de la viande maigre à sa faim, avec des repas de plus en plus gros, une faim qui revient au bout de chacun, un ventre tendu et une agitation sans cause. Seul le gras arrête la diarrhée.</p>
<p class="fn" data-fn="96-1"><span class="fnn">1</span>La couche pâle a la couleur de la cendre ou du sable délavé ; elle peut manquer. La couche du dessous est franchement plus rouge que tout le reste, avec une limite nette ; frottée mouillée entre les doigts, elle a un toucher un peu limoneux. Plus bas, la couleur tourne au jaune.</p>
<p class="fn" data-fn="96-2"><span class="fnn">2</span>La pâte est poussée vers le haut par le pouce, au-dessus de l’index, en une bande d’épaisseur égale, jusqu’à ce qu’elle casse sous son propre poids. On mesure ce qui dépassait avant la cassure. Ensuite, une pincée détrempée frottée dans la paume : si elle gratte, il y a du sable.</p>
<p class="fn" data-fn="96-3"><span class="fnn">3</span>Une graminée dont les racines blanches courent sous terre, à l’horizontale, en longs cordons articulés. Chaque morceau coupé par la bêche redonne un plant.</p>
<p class="fn" data-fn="96-4"><span class="fnn">4</span>Un piquet de métal ou une tige de fer enfoncé au cœur du tas et laissé une heure : il ressort chaud à la main quand le tas travaille, froid quand il dort. La main à plat dans le tas ouvert dit la même chose. Ni l’un ni l’autre ne dit si le tas a atteint 55 °C : pour ça, la sonde (étape 20).</p>
<p class="fn" data-fn="96-5"><span class="fnn">5</span>Une plante grimpante qui s’accroche aux autres par des vrilles au bout de ses feuilles ; chaque feuille porte huit à douze paires de petites folioles. Les fleurs, bleu violacé, en épis serrés, sont toutes tournées du même côté de la tige. Elle pousse en tapis dans les fossés, les bords de chemin et les vieux champs.</p>
<p class="fn" data-fn="96-6"><span class="fnn">6</span>Chez le pois et la vesce, les nodules sont de petits renflements allongés en doigt, souvent ramifiés, collés aux racines — pas des grains de terre : ils ne se détachent pas en rinçant. On les coupe au couteau.</p>
<p class="fn" data-fn="96-7"><span class="fnn">7</span>Des renflements blancs sur les racines, qui grossissent vite, puis noircissent et pourrissent. On arrache le plant qui flétrit à midi et on regarde : une racine saine est fine et ramifiée. Ne pas confondre avec les nodules d’un pois, beaucoup plus petits, allongés en doigt, et qui ne poussent que sur les légumineuses.</p>
<p class="fn" data-fn="96-8"><span class="fnn">8</span>Le ver fil de fer est la larve d’un petit coléoptère, le taupin : un ver allongé et dur au toucher, qui ressemble à un ver de farine, avec trois paires de pattes courtes à l’avant. Le ver blanc est une larve grasse, blanche ou jaune pâle, recourbée en C. On les trouve en retournant la terre autour d’un légume rongé.</p>
<p class="fn" data-fn="98-1"><span class="fnn">1</span>Le duvet se voit par temps humide, sur l’envers de la feuille : un feutrage blanc à la limite entre la partie brune et la partie encore verte. Une tache arrêtée net par les nervures est plutôt la brûlure hâtive (alternariose), moins grave.</p>
<p class="fn" data-fn="98-2"><span class="fnn">2</span>Une repousse, c’est un plant de pomme de terre qui lève tout seul au printemps d’un tubercule oublié en terre l’automne d’avant, souvent au milieu d’une autre culture.</p>
<p class="fn" data-fn="98-3"><span class="fnn">3</span>La coulure : les fleurs avortent et tombent sans laisser de gousse. Le plant a fleuri, et les tiges restent vides.</p>
<p class="fn" data-fn="98-4"><span class="fnn">4</span>Deux passages croisés corrigent les bandes trop claires qu’un seul passage laisse toujours, surtout au vent.</p>
<p class="fn" data-fn="98-5"><span class="fnn">5</span>On presse un grain pris au milieu de l’épi sous l’ongle du pouce. Tant que l’ongle y entre ou y laisse une marque, le grain n’est pas fait. Au stade pâteux dur, l’ongle ne marque plus, et l’épi a pris un jaune pâle.</p>
<p class="fn" data-fn="98-6"><span class="fnn">6</span>Une moyette, ce sont des gerbes dressées debout, épis en haut, appuyées les unes contre les autres en petit cône ou en double rangée, pour que l’air passe dedans et que la pluie coule dessus. Une gerbe couchée au sol ne sèche pas.</p>
<p class="fn" data-fn="98-7"><span class="fnn">7</span>La rouille : de petites pustules allongées, orange clair et poudreuses, surtout sur le limbe des feuilles, souvent dans une feuille qui jaunit autour. Les feuilles atteintes meurent.</p>
<p class="fn" data-fn="98-8"><span class="fnn">8</span>La jaunisse : la peau et le blanc des yeux deviennent jaunes. On regarde le blanc des yeux à la lumière du jour : sous une lampe jaune, tout le monde a l’air jaune.</p>

<script>
(function(){
const OVER = f => (f.scrollHeight > f.clientHeight + 1) || (f.scrollWidth > f.clientWidth + 1);
function stops(el){
  const out=[]; const tw=document.createTreeWalker(el, NodeFilter.SHOW_TEXT); let n;
  while((n=tw.nextNode())){ const t=n.data; for(let i=0;i<t.length;i++){ if(t[i]===' '||t[i]==='\n') out.push([n,i]); } }
  return out;
}
function part(el, s, first){
  const r=document.createRange();
  if(first){ r.setStart(el,0); r.setEnd(s[0],s[1]); } else { r.setStart(s[0],s[1]+1); r.setEnd(el, el.childNodes.length); }
  const c=el.cloneNode(false); c.appendChild(r.cloneContents());
  if(!first){ c.classList.add('cont'); }
  return c;
}
function splitPara(el, f){
  const st=stops(el); if(st.length<14) return null;
  let lo=0, hi=st.length-1, best=-1;
  while(lo<=hi){ const mid=(lo+hi)>>1; const a=part(el,st[mid],true); f.appendChild(a); syncNotes(f); const ok=!OVER(f); f.removeChild(a); syncNotes(f); if(ok){best=mid;lo=mid+1;} else hi=mid-1; }
  if(best<11) return null;
  if(st.length-best<6) best=st.length-7;
  if(best<11) return null;
  return [part(el,st[best],true), part(el,st[best],false)];
}
function splitTable(tb, f){
  const rows=Array.from(tb.tBodies[0].rows);
  const mk=(rs,kind)=>{ const t=tb.cloneNode(false); const cg=tb.querySelector('colgroup'); if(cg) t.appendChild(cg.cloneNode(true));
    if(kind==='first'){ const cap=document.createElement('caption'); cap.className='tsuite'; cap.textContent='Le tableau continue page suivante'; t.appendChild(cap); }
    t.appendChild(tb.tHead.cloneNode(true)); const b=document.createElement('tbody'); rs.forEach(r=>b.appendChild(r.cloneNode(true))); t.appendChild(b);
    if(kind==='rest') t.classList.add('suite'); return t; };
  let best=0;
  for(let k=1;k<=rows.length;k++){ const t=mk(rows.slice(0,k),'first'); f.appendChild(t); syncNotes(f); const ok=!OVER(f); f.removeChild(t); syncNotes(f); if(ok) best=k; else break; }
  if(best<2) return null;
  return [mk(rows.slice(0,best),'first'), mk(rows.slice(best),'rest')];
}
/* ---------- notes de bas de page ----------
   Chaque cadre a, juste après lui, une zone de notes à deux cases (une par colonne).
   On la resynchronise à chaque essai de remplissage : la note prend sa place dans la
   hauteur du cadre avant qu'on juge si le bloc tient. Si l'appel passe à la page
   suivante, sa note le suit. */
const NOTES={};
document.getElementById('notes').content.querySelectorAll('p.fn').forEach(n=>NOTES[n.dataset.fn]=n);
function noteZone(f, make){
  let z=f.nextElementSibling;
  if(z && z.classList.contains('fnz')) return z;
  if(!make) return null;
  z=document.createElement('div'); z.className='fnz';
  if(getComputedStyle(f).columnCount==='1') z.classList.add('one');
  z.innerHTML='<div class="fnc" data-side="l"></div><div class="fnc" data-side="r"></div>';
  f.after(z); return z;
}
function sideOf(c, f, z){
  if(z.classList.contains('one')) return 'l';
  const fr=f.getBoundingClientRect(), r=c.getBoundingClientRect();
  return (r.left-fr.left) < fr.width/2 ? 'l' : 'r';
}
function syncNotes(f){
  const seen=new Set();
  const calls=Array.from(f.querySelectorAll('sup.fnr')).filter(c=>NOTES[c.dataset.fn] && !seen.has(c.dataset.fn) && seen.add(c.dataset.fn));
  let z=noteZone(f, calls.length>0);
  if(!z) return;
  if(!calls.length){ z.remove(); return; }
  for(let it=0; it<4; it++){
    const want=calls.map(c=>c.dataset.fn+'|'+sideOf(c,f,z)).join(' ');
    const cur=Array.from(z.querySelectorAll('p.fn')).map(n=>n.dataset.fn+'|'+n.parentNode.dataset.side).join(' ');
    if(want===cur) break;
    z.querySelectorAll('.fnc').forEach(c=>c.textContent='');
    want.split(' ').forEach(w=>{ const [id,sd]=w.split('|'); z.querySelector('.fnc[data-side="'+sd+'"]').appendChild(NOTES[id].cloneNode(true)); });
    z.classList.add('on');
  }
}

/* =====================================================================
   Moteur de chapitre (build_chapitre.py). Les fonctions au-dessus
   (OVER, splitPara, splitTable, noteZone, syncNotes) sont celles de
   interieur.tpl.html, recopiées à la construction. Ici : les pages se
   créent à la volée, trois histoires se suivent (texte courant, encadré
   danger, variante d'urgence), les planches pleine page prennent la page
   qui suit leur mention, les demi-planches et les photos flottent au
   premier endroit où elles tiennent, jamais au milieu d'un paragraphe.
   ===================================================================== */
const C = JSON.parse(document.getElementById('meta').textContent);
const BOOK = document.getElementById('book');
const WARN = [];
const PAGES = [];
let P = null;                 // page courante
let pendingPlates = [];       // planches pleine page qui attendent la fin de la page courante
const DSVG = '<svg viewBox="0 0 34 30" aria-hidden="true"><path d="M17 1.5 L32.5 28.5 H1.5 Z" fill="#fff"/><path d="M15.2 10 H18.8 L18.1 20.5 H15.9 Z" fill="#9B2C1E"/><rect x="15.4" y="22.3" width="3.2" height="3.2" fill="#9B2C1E"/></svg>';
const PT = 96/72;

function mkPage(kind, plate){
  const n = PAGES.length + 1, side = n % 2 ? 'recto' : 'verso';
  const el = document.createElement('section'); el.className = 'page ' + side; el.id = 'p' + C.num + '-' + n;
  if(kind !== 'open') el.innerHTML = '<div class="rh"><div class="grp"><span class="fo">' + C.num + '-' + n + '</span><span class="ch">' + C.num + ' · ' + C.title + '</span></div><span class="to">' + C.tome + '</span></div>';
  const bl = document.createElement('div'); bl.className = 'block'; el.appendChild(bl);
  if(kind === 'open') bl.innerHTML = document.getElementById('open').innerHTML;
  if(kind === 'plate'){
    const img = document.createElement('img'); img.className = 'planche'; img.src = plate.dataset.src; img.alt = 'Planche ' + plate.dataset.id;
    bl.appendChild(img);
  }
  BOOK.appendChild(el);
  const p = {el, bl, kind, n, deferred: [], plate: plate ? plate.dataset.id : null};
  PAGES.push(p); return p;
}
function nextPage(){
  const pl = pendingPlates; pendingPlates = [];
  pl.forEach(b => { const pp = mkPage('plate', b); pp.story = P.story; });
  P = mkPage('text'); return P;
}
function free(p){       // hauteur libre sous le dernier élément du bloc, en px
  const br = p.bl.getBoundingClientRect(); const last = p.bl.lastElementChild;
  return last ? br.bottom - last.getBoundingClientRect().bottom : br.height;
}
function region(p, kind, first){
  const frame = document.createElement('div'); frame.className = 'frame';
  let box = frame;
  if(kind === 'd'){
    box = document.createElement('div'); box.className = 'rg';
    if(first) box.innerHTML = '<h2 class="sec s8" data-n="8"><span class="n">8</span><span class="t">Danger</span></h2>';
    const dg = document.createElement('div'); dg.className = 'danger full'; dg.dataset.edge = 'd';
    dg.innerHTML = '<div class="dhead' + (first ? '' : ' small') + '">' + DSVG + '<span>' +
      (first ? 'Danger' + (C.dsub ? ' — <span class="sj">' + C.dsub + '</span>' : '') : 'Danger <span class="sj">(suite)</span>') + '</span></div>';
    dg.appendChild(frame);
    const cut = document.createElement('div'); cut.className = 'dcut on'; cut.textContent = 'L’encadré continue page suivante';
    dg.appendChild(cut); box.appendChild(dg);
  } else if(kind === 'e'){
    box = document.createElement('div'); box.className = 'rg s9wrap' + (first ? '' : ' cont'); box.dataset.edge = 'k';
    if(first) box.innerHTML = '<h2 class="sec s9" data-n="9"><span class="n">9</span><span class="t">Variante d’urgence</span><span class="sub9">Sans courant, sans matériel acheté, sans personne à appeler</span></h2>';
    box.appendChild(frame);
  }
  p.bl.appendChild(box);
  return {box, frame};
}
function pour(f, q, p){
  while(q.length){
    const b = q.shift();
    if(b.dataset && b.dataset.plate === 'full'){ pendingPlates.push(b); continue; }
    f.appendChild(b); syncNotes(f);
    if(!OVER(f)) continue;
    f.removeChild(b); syncNotes(f);
    if(b.classList.contains('fig')){ p.deferred.push(b); continue; }   // la figure attend, le texte continue
    let parts = null;
    if(b.tagName === 'P') parts = splitPara(b, f); else if(b.tagName === 'TABLE') parts = splitTableBal(b, f);

  if(q.length){
    // pas de titre ni d'amorce seule en bas de page
    while(f.lastElementChild && (/^H[234]$/.test(f.lastElementChild.tagName) || f.lastElementChild.classList.contains('kh')))

    const k = (q[0] && q[0].classList && q[0].classList.contains('cont')) ? 1 : 0;

}
function splitTableBal(tb, f){   // jamais une rangée seule en haut de la page suivante
  const parts = splitTable(tb, f); if(!parts) return null;
  const A = parts[0].tBodies[0], B = parts[1].tBodies[0];

function finish(R, kind){
  if(kind === 'main'){ R.frame.classList.add('auto'); return; }
  R.box.classList.add('fin'); R.frame.classList.add('auto');
  if(kind === 'd'){ const dg = R.box.querySelector('.danger'); dg.classList.remove('full'); dg.querySelector('.dcut').classList.remove('on'); }
}
function story(kind){
  const tpl = document.getElementById('story-' + kind);
  const q = Array.from(tpl.content.children).map(n => n.cloneNode(true));
  if(!q.length) return;
  const H = P.bl.getBoundingClientRect().height;
  let first = true, guard = 0;
  while(q.length && guard++ < 120){
    const fr = free(P), fresh = P.kind === 'text' && !P.bl.children.length;
    // seuils de départ : l'encadré danger et la variante d'urgence ne commencent pas dans un fond de page

    const snapQ = q.slice(), snapPl = pendingPlates.slice();

      if(fresh){   // rien ne tient même sur une page vide : on force, et on le signale
        WARN.push(P.el.id + ' : bloc trop grand, ' + (q[0].textContent || q[0].className).slice(0, 40));

        if(!q.length){ finish(R, kind); break; }

    }
    first = false;
    if(r === 'done'){ finish(R, kind); break; }
    nextPage();
  }
}

/* ---------- après la coulée : pieds de page, sommaire, renvois, tranche ---------- */
function ladder(on, label, folio){
  let lis = '';
  Object.keys(C.secs).forEach(k => { lis += '<li class="' + (on.has(+k) ? 'on' + (k === '8' ? ' d' : '') : '') + '">' + k + '</li>'; });
  return '<div class="ft">' + (folio ? '<span class="fo-ft">' + folio + '</span>' : '') + '<div class="lad"><ol>' + lis + '</ol><span class="lab">' + label + '</span></div><span class="lieu-ft">Lieu · ' + C.lieu + '</span></div>';
}
function finishPages(){
  let cur = 0; const start = {};
  PAGES.forEach(p => {
    const on = new Set();
    const flow = p.el.querySelectorAll('.block h2.sec[data-n], .block .frame > *');
    const startsNew = flow.length && flow[0].matches('h2.sec[data-n]');
    if(cur && !startsNew) on.add(cur);
    p.el.querySelectorAll('.block h2.sec[data-n]').forEach(h => { const n = +h.dataset.n; on.add(n); cur = n; if(!start[n]) start[n] = p.n; });
    if(!on.size && p.kind === 'open') on.add(1);
    const mx = Math.max(...on);
    let label = (on.has(8) && on.has(9)) ? C.secs['8'] + ' · ' + C.secs['9'] : (C.secs[String(mx)] || '');
    if(p.plate) label += ' · Planche ' + p.plate;
    p.el.insertAdjacentHTML('beforeend', ladder(on, label, p.kind === 'open' ? C.num + '-' + p.n : null));
    if(p.plate && p.story === 'e') p.bl.querySelector('img').dataset.edge = 'k';
    if(p.plate && p.story === 'd') p.bl.querySelector('img').dataset.edge = 'd';
  });
  document.querySelectorAll('.toc li').forEach(li => { const n = li.dataset.n; li.querySelector('.f').textContent = start[n] ? C.num + '-' + start[n] : ''; });
  // « l'encadré continue page … » et « le tableau continue page … »
  PAGES.forEach((p, i) => {
    const nxt = PAGES.slice(i + 1).find(q => q.kind === 'text');
    p.el.querySelectorAll('.dcut.on').forEach(c => { if(nxt) c.textContent = 'L’encadré continue page ' + C.num + '-' + nxt.n; });
    p.el.querySelectorAll('caption.tsuite').forEach(c => { if(nxt && nxt.n !== p.n + 1) c.textContent = 'Le tableau continue page ' + C.num + '-' + nxt.n; });
  });
}
function fitTitle(){
  const h = document.querySelector('.open-title h1'); if(!h) return;
  let s = 38;
  while(s > 24 && h.getBoundingClientRect().height > 3 * 1.0 * s * PT + 4){ s -= 1; h.style.fontSize = s + 'pt'; }
}
function edges(){
  document.querySelectorAll('[data-edge]').forEach(el => {
    const pg = el.closest('.page'); const pr = pg.getBoundingClientRect(); const r = el.getBoundingClientRect();
    const e = document.createElement('div'); e.className = 'edge' + (el.dataset.edge === 'd' ? ' d' : '');
    e.style.top = (r.top - pr.top) + 'px'; e.style.height = r.height + 'px'; pg.appendChild(e);
  });
}
function checks(){
  // texte qui sort de la zone utile, page presque vide
  PAGES.forEach(p => {
    const br = p.bl.getBoundingClientRect();
    p.bl.querySelectorAll('.frame').forEach(f => { if(!f.classList.contains('auto') && OVER(f)) WARN.push(p.el.id + ' : cadre qui déborde'); });
    const last = p.bl.lastElementChild;
    if(last && last.getBoundingClientRect().bottom > br.bottom + 1) WARN.push(p.el.id + ' : sort de la zone utile');
    if(p.kind === 'text' && p !== PAGES[PAGES.length - 1] && free(p) > 0.4 * br.height) WARN.push(p.el.id + ' : page à moitié vide');
  });
}
function views(){
  const h = location.hash;

  if(h === '#stats'){
    const st = document.getElementById('stats'); st.style.cssText = 'display:block;position:fixed;top:0;left:0;z-index:99;background:#fff;font:15px/1.35 monospace;white-space:pre-wrap;width:760px;height:100vh;margin:0;padding:8px';
    st.textContent = st.textContent.replace(/,"/g, ',\n"');
  } else if(h.startsWith('#page=')){
    document.body.classList.add('single');
    const pg = document.getElementById(h.slice(6));
    document.querySelectorAll('.page').forEach(p => { if(p !== pg) p.style.display = 'none'; });
    if(pg) document.body.insertBefore(wrap(pg), document.body.firstChild);
  }
}
function words(t){ return t.split(/\s+/).filter(w => /[\p{L}\d]/u.test(w)).length; }
const faces = ['400 10pt "IBM Plex Serif"','600 10pt "IBM Plex Serif"','700 10pt "IBM Plex Serif"','italic 400 10pt "IBM Plex Serif"','italic 600 10pt "IBM Plex Serif"',
  '400 10pt "IBM Plex Sans Condensed"','500 10pt "IBM Plex Sans Condensed"','600 10pt "IBM Plex Sans Condensed"','700 10pt "IBM Plex Sans Condensed"','italic 600 10pt "IBM Plex Sans Condensed"'];
const imgs = Array.from(document.querySelectorAll('template')).flatMap(t => Array.from(t.content.querySelectorAll('img')).map(i => i.getAttribute('src')));
const imgLoads = imgs.map(src => new Promise(res => { const i = new Image(); i.onload = i.onerror = res; i.src = src; }));
Promise.all(faces.map(f => document.fonts.load(f, 'aéÀ§«»—'))).then(() => document.fonts.ready).then(() => Promise.all(imgLoads)).then(() => {
  P = mkPage('open'); fitTitle();
  ['main', 'd', 'e'].forEach(story);
  if(pendingPlates.length){ const pl = pendingPlates; pendingPlates = []; pl.forEach(b => { const pp = mkPage('plate', b); pp.story = 'e'; }); }
  finishPages(); edges(); checks();
  const st = {pages: PAGES.length, reste: 0, warn: WARN, mots: {}};
  PAGES.forEach(p => st.mots[p.n] = words(p.bl.innerText));
  document.getElementById('stats').textContent = JSON.stringify(st);
  views();
  document.documentElement.dataset.ready = '1';
});

})();
</script>
<script>
(function(){
  if(!location.hash.startsWith('#rapport')) return;
  const CIB = JSON.parse(decodeURIComponent(location.hash.slice(9)) || '{}');
  const t = setInterval(() => {
    if(document.documentElement.dataset.ready !== '1') return; clearInterval(t);
    const out = [];
    const st = JSON.parse(document.getElementById('stats').textContent);
    out.push('pages=' + st.pages);
    Object.keys(CIB).forEach(k => {
      const [sel, txt] = CIB[k];
      const el = Array.from(document.querySelectorAll('.page ' + sel)).find(e => ((e.textContent || '') + ' ' + (e.alt || '')).toLowerCase().includes(txt.toLowerCase()));
      out.push(k + '=' + (el ? el.closest('.page').id : 'absent'));
    });
    const s9 = document.querySelector('.page h2.sec.s9'); out.push('s9=' + (s9 ? s9.closest('.page').id : 'absent'));
    st.warn.forEach(w => out.push('ATTENTION ' + w));
    document.body.innerHTML = '<pre style="font:11px monospace;white-space:pre-wrap">' + out.map(l => '@@' + l + '@@').join('\n') + '</pre>';
  }, 20);
})();
</script>
