<style>
/* Mise en page : une liseuse plein écran, sombre comme une salle de lecture ; la page du catalogue (papier, vintage)
   au centre, l'interface autour en verre dépoli, discrète, façon iOS. Un seul thème, choisi : sombre. */
:root {
  --fond: #0E1117;
  --fond-2: #161A22;
  --verre: rgba(30, 34, 44, .72);
  --verre-fort: rgba(38, 43, 55, .92);
  --ligne: rgba(255, 255, 255, .09);
  --texte: #F4F1EA;
  --texte-2: #A3A9B6;
  --texte-3: #6E7482;
  --rouge: #E5483D;
  --rouge-fonce: #B8322A;
  --or: #F3C352;
  --creme: #FBF4E4;
  --ui: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
  --titre: "Shrikhand", "Cooper Black", Georgia, serif;
  --rayon: 22px;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--fond); color: var(--texte);
  font-family: var(--ui); font-size: 16px;
  overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none;
  -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--or); outline-offset: 2px; }
svg { display: block; }

/* ---------- Accueil ---------- */
#accueil {
  height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-left: max(20px, env(safe-area-inset-left, 0px));
  padding-right: max(20px, env(safe-area-inset-right, 0px));
  padding-block: 40px 40px;
  background:
    radial-gradient(1100px 520px at 50% -120px, rgba(229, 72, 61, .32), transparent 70%),
    radial-gradient(700px 400px at 90% 110%, rgba(243, 195, 82, .10), transparent 70%),
    var(--fond);
  display: grid; place-items: center;
}
.accueil-col { width: min(680px, 100%); display: grid; gap: 28px; }
.marque { text-align: center; display: grid; gap: 10px; justify-items: center; }
.sur-titre { font-size: 13px; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--or); }
.titre-grand { font-family: var(--titre); font-weight: 400; font-size: clamp(44px, 8vw, 76px); line-height: .98; margin: 0; color: var(--creme); text-wrap: balance; text-shadow: 0 6px 30px rgba(229, 72, 61, .35); }
.sous-titre { color: var(--texte-2); font-size: 17px; margin: 0; }
.question { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-3); margin: 6px 0 -14px 4px; }
.enfants { display: grid; gap: 14px; }
.carte-enfant {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px;
  text-align: left; padding: 18px 20px; border-radius: var(--rayon);
  background: linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.025));
  border: 1px solid var(--ligne);
  box-shadow: 0 10px 30px rgba(0,0,0,.25);
  transition: transform .18s ease, background .18s ease;
}
.carte-enfant:active { transform: scale(.98); background: rgba(255,255,255,.08); }
.avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-family: var(--titre); font-size: 30px; color: #fff; box-shadow: inset 0 -6px 14px rgba(0,0,0,.18), 0 6px 18px rgba(0,0,0,.3); }
.carte-texte { display: grid; gap: 3px; min-width: 0; }
.carte-nom { font-size: 24px; font-weight: 700; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.carte-info { color: var(--texte-2); font-size: 15px; }
.chevron { color: var(--texte-3); width: 22px; height: 22px; }
.rangee-enfant { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; align-items: stretch; }
.btn-consulter {
  display: grid; place-items: center; gap: 6px; padding: 12px 16px; border-radius: var(--rayon);
  background: rgba(255,255,255,.04); border: 1px solid var(--ligne); color: var(--texte-2);
  font-size: 13px; font-weight: 700; text-align: center; min-width: 108px;
}
.btn-consulter svg { width: 22px; height: 22px; color: var(--or); }
.btn-consulter:active { transform: scale(.97); }
@media (max-width: 520px) { .rangee-enfant { grid-template-columns: 1fr; } .btn-consulter { grid-auto-flow: column; padding: 10px; } }
.achat { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--ligne); }
.achat img { width: 76px; height: 76px; object-fit: contain; background: #fff; border-radius: 12px; padding: 6px; box-sizing: border-box; }
.achat .infos { display: grid; gap: 3px; min-width: 0; }
.achat b { font-size: 15px; font-weight: 700; line-height: 1.25; }
.achat small { color: var(--texte-3); font-size: 13px; }
.achat .droite { display: grid; gap: 6px; justify-items: end; }
.achat .prix { color: var(--or); font-weight: 800; font-size: 16px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.achat a { display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: rgba(255,255,255,.08); color: var(--texte); font-size: 13px; font-weight: 700; text-decoration: none; white-space: nowrap; }
.achat a svg { width: 14px; height: 14px; }
.achat .coeur-mini { display: inline-block; width: 16px; height: 16px; vertical-align: -2px; margin-right: 4px; }
.achat .coeur-mini svg { width: 16px; height: 16px; }
@media (max-width: 520px) { .achat { grid-template-columns: 60px minmax(0, 1fr); } .achat img { width: 60px; height: 60px; } .achat .droite { grid-column: 2; justify-items: start; grid-auto-flow: column; align-items: center; } }
.astuce-accueil { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; color: var(--texte-2); font-size: 15px; }
.astuce-accueil span { display: inline-flex; align-items: center; gap: 8px; }
.astuce-accueil svg { width: 20px; height: 20px; color: var(--or); }
.lien-parents { justify-self: center; color: var(--texte-3); font-size: 15px; font-weight: 600; padding: 10px 16px; border-radius: 999px; }
.lien-parents:active { background: rgba(255,255,255,.06); }

/* ---------- Lecteur ---------- */
#lecteur { position: fixed; inset: 0; background: radial-gradient(900px 600px at 50% 40%, #1A1F29, var(--fond) 70%); }
.scene { position: absolute; inset: 0; touch-action: none; }
#toile {
  position: absolute; display: block;
  border-radius: 3px;
  box-shadow: 0 2px 6px rgba(0,0,0,.25), 0 30px 80px rgba(0,0,0,.55);
  background: var(--creme);
}
.barre-verre {
  position: absolute; left: 50%; transform: translateX(-50%);
  display: flex; align-items: center; gap: 4px;
  padding: 6px; border-radius: 20px;
  background: var(--verre);
  -webkit-backdrop-filter: blur(24px) saturate(160%); backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--ligne);
  box-shadow: 0 10px 30px rgba(0,0,0,.35);
  max-width: calc(100% - 24px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
  z-index: 5;
}
.outils { top: calc(env(safe-area-inset-top, 0px) + 10px); }
.pied { bottom: calc(env(safe-area-inset-bottom, 0px) + 10px); gap: 2px; }
.ic {
  height: 44px; min-width: 44px; padding: 0 10px; border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  color: var(--texte); font-weight: 600; font-size: 15px; white-space: nowrap;
  transition: background .15s ease, transform .1s ease;
}
.ic svg { width: 22px; height: 22px; flex: none; }
.ic:active { transform: scale(.94); }
.ic:hover { background: rgba(255,255,255,.06); }
.ic[aria-pressed="true"] { background: var(--texte); color: var(--fond); }
.ic:disabled { opacity: .3; cursor: default; }
.sep { width: 1px; height: 26px; background: var(--ligne); margin: 0 4px; flex: none; }
.qui { display: inline-flex; align-items: center; gap: 8px; padding: 0 8px 0 4px; font-weight: 700; font-size: 15px; min-width: 0; }
.qui .mini-avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--titre); font-size: 15px; color: #fff; flex: none; }
.qui span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; }
.pastilles { display: flex; align-items: center; gap: 2px; }
.pastille {
  width: 40px; height: 44px; border-radius: 14px; display: grid; place-items: center;
}
.pastille i { width: 24px; height: 24px; border-radius: 50%; display: block; box-shadow: inset 0 -3px 6px rgba(0,0,0,.25); transition: transform .15s ease, box-shadow .15s ease; }
.pastille[aria-pressed="true"] i { transform: scale(1.12); box-shadow: 0 0 0 3px var(--fond-2), 0 0 0 5px currentColor; }
.coeurs-restants { display: inline-flex; gap: 1px; }
.coeurs-restants svg { width: 19px; height: 19px; transition: transform .2s ease; }
.coeur-btn[aria-pressed="true"] { background: #FFE4EA; }
.coeur-btn.secoue { animation: secoue .4s ease; }
@keyframes secoue { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }
.titre-section { margin: 4px 0 -6px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--texte-3); display: flex; align-items: center; gap: 8px; }
.titre-section svg { width: 16px; height: 16px; color: #FF4D6D; }
.choix { position: relative; }
.choix .badge-coeur { position: absolute; top: -8px; right: -8px; width: 44px; height: 44px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.35)); transform: rotate(12deg); }
.compte { background: var(--rouge); color: #fff; border-radius: 999px; min-width: 22px; height: 22px; padding: 0 7px; display: inline-grid; place-items: center; font-size: 13px; font-weight: 800; font-variant-numeric: tabular-nums; }
.lieu { padding: 0 12px; display: grid; gap: 1px; text-align: center; min-width: 0; }
.lieu b { font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lieu small { font-size: 12px; color: var(--texte-2); font-variant-numeric: tabular-nums; }
.progres { position: absolute; left: 14px; right: 14px; bottom: 3px; height: 2px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
.progres i { display: block; height: 100%; background: var(--or); border-radius: 2px; transition: width .3s ease; }
.etiquette-mobile { display: none; }
@media (max-width: 860px) {
  .ic .etiq { display: none; }
  .qui span { display: none; }
}
@media (max-width: 600px) {
  .pastille { width: 32px; }
  .pastille i { width: 20px; height: 20px; }
}

.astuce {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--verre-fort); border: 1px solid var(--ligne); border-radius: 24px;
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  padding: 22px 26px; display: grid; gap: 16px; justify-items: center; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.5); z-index: 6; pointer-events: none;
  animation: apparait .3s ease both;
}
.astuce .gestes { display: flex; gap: 28px; }
.astuce .geste { display: grid; gap: 8px; justify-items: center; font-size: 15px; font-weight: 600; color: var(--texte); max-width: 150px; }
.astuce svg { width: 54px; height: 54px; color: var(--or); }
.main-glisse { animation: glisse 1.6s ease-in-out infinite; }
@keyframes glisse { 0%, 15% { transform: translateX(14px); opacity: 0; } 30% { opacity: 1; } 75% { transform: translateX(-14px); opacity: 1; } 100% { transform: translateX(-14px); opacity: 0; } }
@keyframes apparait { from { opacity: 0; transform: translate(-50%, -46%); } to { opacity: 1; transform: translate(-50%, -50%); } }

/* ---------- Feuilles modales ---------- */
.voile {
  position: fixed; inset: 0; z-index: 20;
  background: rgba(5, 7, 10, .55);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  display: grid; align-items: end; justify-items: center;
  padding-top: calc(env(safe-area-inset-top, 0px) + 40px);
}
.boite {
  width: min(820px, 100%); max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: var(--fond-2); border: 1px solid var(--ligne); border-bottom: 0;
  border-radius: 26px 26px 0 0;
  box-shadow: 0 -20px 60px rgba(0,0,0,.5);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: monte .32s cubic-bezier(.2, .9, .3, 1) both;
  -webkit-user-select: text; user-select: text;
}
@keyframes monte { from { transform: translateY(40px); opacity: .4; } to { transform: none; opacity: 1; } }
.boite-haut {
  position: sticky; top: 0; z-index: 1;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px;
  padding: 10px 20px 14px;
  padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px));
  background: rgba(22, 26, 34, .92);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
}
.boite-haut::before { content: ""; grid-column: 1 / -1; justify-self: center; width: 40px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.18); margin-bottom: 6px; }
.boite-haut h2 { margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -.02em; min-width: 0; text-wrap: balance; }
.fermer { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.1); display: grid; place-items: center; color: var(--texte-2); }
.fermer svg { width: 16px; height: 16px; }
.boite-corps { padding: 6px 20px 24px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.vide { text-align: center; color: var(--texte-2); padding: 30px 0; margin: 0; font-size: 17px; }
.grille-liste { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
.choix { display: grid; gap: 6px; align-content: start; min-width: 0; }
.choix img { width: 100%; aspect-ratio: 1; object-fit: contain; background: #fff; border-radius: 16px; padding: 10px; box-sizing: border-box; }
.choix b { font-size: 15px; line-height: 1.25; font-weight: 650; }
.choix small { color: var(--texte-3); font-size: 13px; }
.choix .prix { color: var(--or); font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.total { color: var(--texte-2); font-weight: 600; font-variant-numeric: tabular-nums; }
.btn {
  min-height: 50px; padding: 0 20px; border-radius: 14px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 700; font-size: 16px;
  background: var(--texte); color: var(--fond);
}
.btn svg { width: 20px; height: 20px; }
.btn:active { transform: scale(.97); }
.btn.clair { background: rgba(255,255,255,.08); color: var(--texte); }
.btn.danger { background: transparent; color: var(--rouge); box-shadow: inset 0 0 0 1px rgba(229,72,61,.5); }
.btn.danger.arme { background: var(--rouge); color: #fff; box-shadow: none; }
.btn:disabled { opacity: .5; cursor: progress; }
.bloc-parent { background: rgba(255,255,255,.04); border: 1px solid var(--ligne); border-radius: 18px; padding: 16px; display: grid; gap: 12px; }
.bloc-parent h3 { margin: 0; font-size: 17px; font-weight: 750; }
.champ { display: grid; gap: 6px; color: var(--texte-2); font-size: 14px; font-weight: 600; }
.champ input { font: inherit; font-size: 17px; color: var(--texte); background: rgba(255,255,255,.06); border: 1px solid var(--ligne); border-radius: 12px; padding: 12px 14px; min-width: 0; }
.note { color: var(--texte-2); font-size: 14px; line-height: 1.5; margin: 0; }
.interrupteur { display: flex; align-items: center; justify-content: space-between; gap: 16px; color: var(--texte); font-weight: 600; }
.interrupteur small { display: block; color: var(--texte-2); font-weight: 400; font-size: 13px; margin-top: 2px; }
.bascule { width: 52px; height: 32px; border-radius: 16px; background: rgba(255,255,255,.16); position: relative; flex: none; transition: background .2s; }
.bascule::after { content: ""; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: transform .2s; }
.bascule[aria-checked="true"] { background: #34C759; }
.bascule[aria-checked="true"]::after { transform: translateX(20px); }
.grille-sommaire { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 14px; }
.rubrique { display: grid; gap: 8px; text-align: left; padding: 0; }
.rubrique .vignette { aspect-ratio: 4 / 3; background: var(--creme); border-radius: 16px; display: grid; place-items: center; overflow: hidden; transition: transform .15s; }
.rubrique:active .vignette { transform: scale(.97); }
.rubrique img { width: 82%; height: 82%; object-fit: contain; }
.rubrique b { font-size: 16px; font-weight: 700; line-height: 1.2; }
.rubrique small { color: var(--texte-3); font-size: 13px; font-weight: 600; }

#toast {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%);
  z-index: 40; max-width: min(520px, calc(100% - 32px));
  background: var(--verre-fort); border: 1px solid var(--ligne);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  color: var(--texte); padding: 13px 18px; border-radius: 16px; font-weight: 600; font-size: 15px;
  box-shadow: 0 12px 30px rgba(0,0,0,.4);
}
/* ===== Accueil : un soir de Noël, sapin profond, or fin, neige qui tombe doucement ===== */
#accueil {
  position: relative; display: block; padding: 0; overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
  background: radial-gradient(1200px 800px at 30% 45%, #1C4A37 0%, #123526 55%, #0B241A 100%);
  color: #F6EFDF; color-scheme: dark;
}
/* un cadre doré, double filet, comme une carte de vœux */
#accueil::before {
  content: ""; position: fixed; z-index: 1; pointer-events: none;
  inset: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px));
  border: 1px solid rgba(214,178,94,.55); box-shadow: inset 0 0 0 4px rgba(11,36,26,.0), inset 0 0 0 5px rgba(214,178,94,.28);
}
.neige { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.neige i {
  position: absolute; top: -12px; width: var(--t); height: var(--t); border-radius: 50%; background: #fff; opacity: var(--o);
  animation: tombe var(--d) linear infinite; animation-delay: var(--r); will-change: transform;
}
@keyframes tombe { to { transform: translate3d(var(--x), 105vh, 0); } }
.scene-accueil {
  position: relative; z-index: 2; min-height: 100%; box-sizing: border-box; max-width: 1160px; margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: clamp(28px, 5vw, 76px); align-items: center;
  padding-block: calc(env(safe-area-inset-top, 0px) + 44px) calc(env(safe-area-inset-bottom, 0px) + 44px);
  padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px));
}
@media (max-aspect-ratio: 1/1) { .scene-accueil { grid-template-columns: 1fr; align-content: start; gap: 30px; } }

.livre-zone { display: grid; place-items: center; }
.livre { position: relative; width: min(390px, 76vw, 60vh); aspect-ratio: 3 / 4; transform: rotate(-2deg); transition: transform .35s ease; }
.livre:hover { transform: rotate(-1deg) translateY(-4px); }
.livre::after { content: ""; position: absolute; left: 8%; right: 8%; bottom: -18px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.45); filter: blur(14px); z-index: -1; }
.couverture {
  position: absolute; inset: 0; overflow: hidden; border-radius: 3px 10px 10px 3px; background: #B9271F;
  box-shadow: inset 7px 0 0 rgba(0,0,0,.14), inset 8px 0 0 rgba(255,255,255,.06), 0 30px 60px -18px rgba(0,0,0,.6);
  display: grid; grid-template-rows: auto auto 1fr auto; text-align: center;
}
.couverture::before { content: ""; position: absolute; inset: 12px; border: 1px solid rgba(255,226,150,.55); border-radius: 2px 6px 6px 2px; pointer-events: none; }
.couv-ruban { margin: 26px auto 0; font: 700 10.5px/1 var(--ui); letter-spacing: .26em; color: #F2D58F; position: relative; z-index: 2; }
.couv-titre { margin: 12px 22px 0; font-family: var(--titre); font-weight: 400; font-size: clamp(30px, 4vw, 46px); line-height: 1; color: #FFF4DA; position: relative; z-index: 2; }
.couv-cadre { position: relative; min-height: 0; min-width: 0; z-index: 1; margin: 4px 16px 0; }
#couv-collage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.couv-pied { margin: 4px auto 26px; font: 700 10.5px/1.2 var(--ui); color: #F2D58F; letter-spacing: .22em; text-transform: uppercase; position: relative; z-index: 2; }

.cote-droit { display: grid; gap: 16px; min-width: 0; }
.surtitre { display: flex; align-items: center; gap: 12px; font: 600 11.5px/1 var(--ui); letter-spacing: .28em; text-transform: uppercase; color: #D6B25E; }
.surtitre::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(214,178,94,.6), transparent); }
.cote-droit .question {
  margin: 0; font-family: "Fraunces", Georgia, serif; font-style: italic; font-weight: 600; font-size: clamp(36px, 4.6vw, 58px);
  line-height: 1.02; letter-spacing: -.01em; color: #F6EFDF; text-transform: none; background: none; -webkit-text-fill-color: currentColor; filter: none;
}
.rebours { font: 500 15px/1.4 var(--ui); color: rgba(246,239,223,.72); }
.rebours b { color: #F2D58F; font-weight: 700; font-variant-numeric: tabular-nums; }
.enfants { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-top: 8px; }
/* les cartes sont des étiquettes-cadeaux : coins coupés, œillet, ficelle */
.carte-enf {
  --c: #1B64C8; position: relative; display: grid; grid-template-columns: auto 1fr; align-items: center; column-gap: 14px; row-gap: 10px;
  padding: 16px 16px 14px 34px; background: #FBF5E8; color: #1E2740;
  clip-path: polygon(16px 0, 100% 0, 100% 100%, 16px 100%, 0 calc(100% - 16px), 0 16px);
  border-radius: 0 10px 10px 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,.06);
  transition: transform .2s ease;
}
.carte-enf::before { content: ""; position: absolute; left: 12px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%; background: #123526; box-shadow: 0 0 0 2px #D6B25E; }
.carte-enf::after { content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 6px; background: var(--c); }
.carte-enf:hover { transform: translateY(-2px); }
.carte-enf .boule { position: absolute; inset: 0; background: none; border: 0; padding: 0; cursor: pointer; }
.carte-enf .boule:active ~ .pastille-age { transform: scale(.94); }
.carte-enf .pastille-age {
  width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--c); color: #fff;
  font-family: var(--titre); font-size: 25px; line-height: 1; pointer-events: none; transition: transform .15s ease;
  box-shadow: inset 0 0 0 3px rgba(255,255,255,.35);
}
.carte-enf .texte { display: grid; gap: 3px; min-width: 0; pointer-events: none; }
.carte-enf .texte b { font: italic 600 22px/1.05 "Fraunces", Georgia, serif; color: #1E2740; }
.carte-enf .texte small { font: 500 12.5px/1.3 var(--ui); color: #6B6F7E; }
.carte-enf .mini-liste {
  position: relative; z-index: 2; grid-column: 1 / -1; justify-self: start; display: inline-flex; align-items: center; gap: 6px;
  padding: 0; background: none; border: 0; color: #9A3B2A; font: 700 12.5px var(--ui); letter-spacing: .02em;
  text-decoration: underline; text-decoration-color: rgba(154,59,42,.35); text-underline-offset: 3px;
}
.carte-enf .mini-liste svg { width: 14px; height: 14px; }
.cote-droit .astuce-accueil { justify-content: flex-start; gap: 6px 20px; font-size: 13px; color: rgba(246,239,223,.6); margin-top: 4px; }
.cote-droit .astuce-accueil svg { color: #D6B25E; width: 16px; height: 16px; }
.cote-droit .lien-parents { justify-self: start; padding: 0; color: #F2D58F; font: 600 13.5px var(--ui); letter-spacing: .04em; text-decoration: underline; text-underline-offset: 4px; text-decoration-color: rgba(242,213,143,.4); background: none; }
@media (max-aspect-ratio: 1/1) { .cote-droit { justify-items: stretch; } }
@media (max-width: 560px) { .enfants { grid-template-columns: 1fr; } .scene-accueil { padding-left: 28px; padding-right: 28px; } }

/* rameaux dorés au trait, dans deux coins du cadre */
.rameau { position: fixed; z-index: 1; width: clamp(120px, 16vw, 200px); height: auto; pointer-events: none; opacity: .75; }
.rameau-hg { top: calc(env(safe-area-inset-top, 0px) + 6px); left: max(6px, env(safe-area-inset-left, 0px)); }
.rameau-bd { bottom: calc(env(safe-area-inset-bottom, 0px) + 6px); right: max(6px, env(safe-area-inset-right, 0px)); transform: rotate(180deg); }
.rameau .tige { fill: none; stroke: #D6B25E; stroke-width: 2; stroke-linecap: round; }
.rameau .aiguille { stroke: #D6B25E; stroke-width: 1.4; stroke-linecap: round; opacity: .85; }
.rameau .baie { fill: #C8302A; stroke: #F2D58F; stroke-width: 1; }
/* l'épaisseur du catalogue : la tranche des pages, à droite et en bas */
.livre::before {
  content: ""; position: absolute; inset: 6px -7px -7px 6px; border-radius: 3px 10px 10px 3px; z-index: -1;
  background: repeating-linear-gradient(90deg, #EFE6D2 0 2px, #D9CDB2 2px 3px), #EFE6D2;
  box-shadow: 0 20px 40px -14px rgba(0,0,0,.55);
}
/* le sceau doré, comme le macaron des vieux catalogues */
.sceau {
  position: absolute; z-index: 5; top: -22px; right: -26px; width: 92px; height: 92px; border-radius: 50%;
  display: grid; place-content: center; text-align: center; color: #5A3A0A; transform: rotate(12deg);
  background: radial-gradient(circle at 35% 30%, #FFF0B8, #E9C25E 45%, #B98A2B 100%);
  box-shadow: 0 0 0 3px #F6E3A6, 0 0 0 4px #A97D27, 0 10px 20px rgba(0,0,0,.4);
}
.sceau::before { content: ""; position: absolute; inset: 7px; border-radius: 50%; border: 1px dashed rgba(90,58,10,.5); }
.sceau b { font: 400 27px/1 var(--titre); }
.sceau span { font: 800 10px/1.1 var(--ui); letter-spacing: .2em; text-transform: uppercase; }
@media (max-width: 560px) { .sceau { width: 72px; height: 72px; right: -12px; } .sceau b { font-size: 21px; } .rameau { opacity: .5; } }
@media (prefers-reduced-motion: reduce) { .neige { display: none; } }

#accueil.ouverture::after { content: ""; position: fixed; inset: 0; z-index: 10; background: #FBF4E4; opacity: 0; animation: fondu .22s forwards; }
@keyframes fondu { to { opacity: 1; } }

.outils .pastille[aria-pressed="true"] i { transform: scale(1.25); box-shadow: inset 0 0 0 2px rgba(255,255,255,.9), 0 0 0 3px #fff, 0 4px 12px rgba(80,0,0,.35); }
.outils .compte { position: absolute; top: -4px; right: -6px; min-width: 20px; height: 20px; padding: 0 6px; font-size: 12px; background: #F3C352; color: #3A1A08; box-shadow: 0 2px 6px rgba(80,0,0,.3); }

@media (max-width: 900px) {

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script id="donnees" type="application/json">/*PRODUITS*/</script>
<script>
(() => {
  "use strict";
  const PRODUITS = JSON.parse(document.getElementById("donnees").textContent);

  /* ---------- Constantes ---------- */
  // Deux formats de page : portrait (tablette debout) et paysage (tablette couchée).
  const FORMATS = { P: { W: 1000, H: 1300 }, L: { W: 1300, H: 910 } };
  let FMT = "P", W = 1000, H = 1300, BAS = H - 30, H_ENTREE = 50;
  function regler(f) { FMT = f; W = FORMATS[f].W; H = FORMATS[f].H; BAS = H - 30; H_ENTREE = f === "L" ? 46 : 50; }
  const M = 32, G = 24, HAUT = 96;
  const CW = (W - 2 * M - G) / 2, CH = (BAS - HAUT - 2 * G) / 3, PAR_PAGE = 9;
  const LETTRES = "ABCDEFGHIJ";
  const CRAYONS = [
    { nom: "Rouge", c: "#D7263D" }, { nom: "Bleu", c: "#1B64C8" }, { nom: "Vert", c: "#1F8A4C" },
    { nom: "Mauve", c: "#7B3FBF" }, { nom: "Orange", c: "#EE7A12" },
  ];
  const ENFANTS = [
    { id: "k1", defaut: "5 ans", crayon: 1, voit: c => !c.startsWith("d2-") && c !== "papa" },
    { id: "k2", defaut: "4 ans", crayon: 0, voit: c => !c.startsWith("d2-") && c !== "papa" },
    { id: "k3", defaut: "1 an", crayon: 2, voit: c => c.startsWith("d2-") },
    { id: "k4", defaut: "33 ans", crayon: 4, voit: c => c === "papa" },
  ];
  const COUL = { papier: "#FBF4E4", encre: "#1E2740", douce: "#5B5E6E", rouge: "#C8302A", or: "#E9B53C", vert: "#1F7A4D", filet: "#E3D7BD" };
  const F_TITRE = '"Shrikhand", "Cooper Black", Georgia, serif';
  const F_TEXTE = '"Archivo", "Helvetica Neue", Arial, sans-serif';
  const CLE_LOCALE = "catalogue-souhaits-v5";

  function dimensionner() {
    if (etat.vue !== "catalogue") return;

      const n = choisis(e.id).length, nc = (etat.coeurs[e.id] || []).length, c = CRAYONS[etat.crayon[e.id]].c, nom = nomDe(e.id);
      const o = document.createElement("div"); o.className = "carte-enf"; o.style.setProperty("--c", c);
      o.innerHTML = `<button class="boule" type="button"></button><span class="pastille-age"></span>
        <span class="texte"><b></b><small></small></span>
        <button class="mini-liste" type="button">${SVG_LISTE}<span>Liste et prix</span></button>`;
      o.querySelector(".pastille-age").textContent = initiale(nom);
      o.querySelector(".texte b").textContent = nom;
      o.querySelector(".texte small").textContent = n ? nbCadeaux(n) + (nc ? " · " + nc + " ♥" : "") : "Ouvrir le catalogue";
      const boule = o.querySelector(".boule");
      boule.setAttribute("aria-label", "Ouvrir le catalogue de " + nom);
      boule.addEventListener("click", () => lancerOuverture(e.id));
      const l = o.querySelector(".mini-liste");
      l.setAttribute("aria-label", "Consulter la liste de " + nom + " avec les prix et où l'acheter");
      l.addEventListener("click", () => { rendreAchats(e.id); ouvrir("fen-achats"); });
      box.appendChild(o);
    });
  }
  let ouvertureEnCours = false;
  function lancerOuverture(id) {
    if (ouvertureEnCours) return;
    ouvertureEnCours = true; $("accueil").classList.add("ouverture");
    setTimeout(() => { ouvrirCatalogue(id); $("accueil").classList.remove("ouverture"); ouvertureEnCours = false; }, 200);
  }
  function rendrePastilles() {
    const box = $("pastilles"); box.innerHTML = "";
    CRAYONS.forEach((cr, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "pastille"; b.style.color = cr.c; b.style.setProperty("--c", cr.c);
      b.setAttribute("aria-label", "Crayon " + cr.nom.toLowerCase());
      b.setAttribute("aria-pressed", String(etat.outil === "crayon" && etat.crayon[etat.enfant] === i));
      b.innerHTML = `<i style="background:${cr.c}"></i>`;
      b.addEventListener("click", () => { etat.crayon[etat.enfant] = i; choisirOutil("crayon"); });
      box.appendChild(b);
    });
  }
  function choisirOutil(o) {
    etat.outil = o;
    $("outil-gomme").setAttribute("aria-pressed", String(o === "gomme"));
    $("outil-coeur").setAttribute("aria-pressed", String(o === "coeur"));
    rendrePastilles(); rendreBarre();
  }
  function rendreBarre() {
    if (!etat.enfant) return;
    const c = CRAYONS[etat.crayon[etat.enfant]].c, nom = nomDe(etat.enfant);
    $("qui").innerHTML = `<span class="mini-avatar" style="background:${c}"></span><span></span>`;
    $("qui").style.setProperty("--c", c);
    $("qui").firstElementChild.textContent = initiale(nom);
    $("qui").lastElementChild.textContent = nom;
    const idx = pageCourante();
    $("lieu-titre").textContent = PAGES[idx].titre;
    const L = PAGES_DE[etat.enfant], pos = L.indexOf(idx);
    $("lieu-page").textContent = "Page " + (pos + 1) + " sur " + L.length;
    $("progres").style.width = ((pos + 1) / L.length * 100) + "%";
    $("prec").disabled = voisin(idx, -1) < 0;
    $("suiv").disabled = voisin(idx, 1) < 0;
    majCompte();
  }
  const SVG_COEUR = (plein) => `<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.3C.9 8.3 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.4 2.6.8-1.4 2.3-2.6 4.4-2.6 3.7 0 5.8 3.8 4.3 7.2C19.5 16.4 12 21 12 21z" fill="${plein ? "#FF4D6D" : "none"}" stroke="${plein ? "#fff" : "currentColor"}" stroke-width="${plein ? 1.6 : 2}" stroke-linejoin="round"/></svg>`;
  function majCoeurs() {
    if (!etat.enfant) return;
    const reste = MAX_COEURS - (etat.coeurs[etat.enfant] || []).length;
    $("coeurs-restants").innerHTML = [0, 1, 2].map(i => SVG_COEUR(i < reste)).join("");
    $("outil-coeur").setAttribute("aria-label", "Super cœur : il t'en reste " + reste);
  }
  function majCompte() {
    majCoeurs(); if (etat.enfant) $("compte").textContent = choisis(etat.enfant).length; }

  let astuceVue = false;
  function montrerAstuce() {
    try { astuceVue = astuceVue || sessionStorage.getItem("astuce-vue") === "1"; } catch (_) {}
    if (astuceVue) return;
    astuceVue = true;
    try { sessionStorage.setItem("astuce-vue", "1"); } catch (_) {}
    $("astuce").hidden = false;
    setTimeout(() => { $("astuce").hidden = true; }, 3800);
  }
  function ouvrirCatalogue(id) {
    etat.enfant = id; etat.vue = "catalogue"; tour = null; trait = null; geste = null;
    $("accueil").hidden = true; $("lecteur").hidden = false;
    choisirOutil("crayon");
    requestAnimationFrame(dimensionner);
    montrerAstuce();
  }
  function allerAccueil() {
    etat.vue = "accueil"; tour = null; geste = null; trait = null;
    $("lecteur").hidden = true; $("accueil").hidden = false; rendreAccueil(); requestAnimationFrame(dessinerCollage);
  }
  function allerPage(n) {
    n = Math.max(0, Math.min(PAGES.length - 1, n));
    tour = null; trait = null; geste = null;
    etat.pages[etat.enfant] = n; rendreBarre(); planifier();
  }
  function rafraichir() {
    if (etat.vue === "accueil") rendreAccueil(); else { rendreBarre(); planifier(); }
    if (!$("fen-liste").hidden) rendreListe(listeDe);

  }

  $("maison").addEventListener("click", allerAccueil);
  $("prec").addEventListener("click", () => tournerAuto(-1));
  $("suiv").addEventListener("click", () => tournerAuto(1));
  $("outil-gomme").addEventListener("click", () => choisirOutil(etat.outil === "gomme" ? "crayon" : "gomme"));
  $("outil-coeur").addEventListener("click", () => choisirOutil(etat.outil === "coeur" ? "crayon" : "coeur"));
  $("annuler").addEventListener("click", () => {
    const k = cle(etat.enfant, pageCourante());
    if ((T[k] || []).length) { T[k].pop(); sauverPage(k); majCompte(); planifier(); }
  });
  document.addEventListener("keydown", e => {
    if (etat.vue !== "catalogue" || [...document.querySelectorAll(".voile")].some(v => !v.hidden)) return;
    if (e.key === "ArrowLeft") tournerAuto(-1);
    if (e.key === "ArrowRight") tournerAuto(1);
  });
  window.addEventListener("resize", () => requestAnimationFrame(dimensionner));

  /* ---------- Feuilles ---------- */
  let listeDe = null;
  function ouvrir(id) { $(id).hidden = false; $(id).querySelector(".boite").scrollTop = 0; }
  document.querySelectorAll(".voile").forEach(v => {
    v.addEventListener("click", e => { if (e.target === v || e.target.closest("[data-fermer]")) v.hidden = true; });
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") document.querySelectorAll(".voile").forEach(v => v.hidden = true); });

  function carteChoix(c) {
    const d = document.createElement("div"); d.className = "choix";
    const im = document.createElement("img"); vignetteDans(im, c.p); d.appendChild(im);
    const b = document.createElement("b"); b.textContent = c.p.nom; d.appendChild(b);
    const s = document.createElement("small"); s.textContent = "Page " + (c.page + 1) + " · article " + c.lettre; d.appendChild(s);
    const pr = document.createElement("span"); pr.className = "prix"; pr.textContent = prix(c.p.prix); d.appendChild(pr);
    if (c.coeur) { const h = document.createElement("span"); h.className = "badge-coeur"; h.innerHTML = SVG_COEUR(true); d.appendChild(h); }

  }
  function rendreListe(k) {
    const liste = choisis(k);
    $("titre-liste").textContent = "La liste de " + nomDe(k);
    const corps = $("corps-liste"); corps.innerHTML = "";
    if (!liste.length) {
      const v = document.createElement("p"); v.className = "vide";
      v.textContent = "Rien d'entouré pour l'instant. Fais un rond avec le crayon autour d'un jouet!";
      corps.appendChild(v);
    } else {
      const groupes = [["Mes super cœurs", liste.filter(c => c.coeur)], ["Mes autres choix", liste.filter(c => !c.coeur)]];
      for (const [titre, lot] of groupes) {
        if (!lot.length) continue;
        const h = document.createElement("p"); h.className = "titre-section";
        h.innerHTML = (titre === "Mes super cœurs" ? SVG_COEUR(true) : "") + "<span></span>"; h.lastChild.textContent = titre;
        corps.appendChild(h);
        const g = document.createElement("div"); g.className = "grille-liste";
        lot.forEach(c => g.appendChild(carteChoix(c)));
        corps.appendChild(g);
      }
    }
    const a = document.createElement("div"); a.className = "actions";
    const t = document.createElement("span"); t.className = "total";
    t.textContent = liste.length ? nbCadeaux(liste.length) + " · total " + prix(liste.reduce((s, c) => s + c.p.prix, 0)) : "";
    a.appendChild(t);
    a.appendChild(document.createElement("span")).style.flex = "1";
    a.appendChild(boutonPdf(k));
    corps.appendChild(a);
  }
  $("voir-sommaire").addEventListener("click", () => {
    const g = $("grille-sommaire"); g.innerHTML = "";
    for (const sec of SOMMAIRE.filter(x => (PAGES_DE[etat.enfant] || []).includes(x.debut))) {
      const b = document.createElement("button"); b.type = "button"; b.className = "rubrique";
      const v = document.createElement("span"); v.className = "vignette";
      const vedette = PAGES[sec.debut].items.reduce((m, p) => (p.prix > m.prix ? p : m));
      const im = document.createElement("img"); vignetteDans(im, vedette); v.appendChild(im); b.appendChild(v);
      const t = document.createElement("b"); t.textContent = sec.titre; b.appendChild(t);
      const pg = document.createElement("small"); pg.textContent = "Page " + ((PAGES_DE[etat.enfant] || []).indexOf(sec.debut) + 1); b.appendChild(pg);
      b.addEventListener("click", () => { $("fen-sommaire").hidden = true; allerPage(sec.debut); });
      g.appendChild(b);
    }
    ouvrir("fen-sommaire");
  });
  $("voir-liste").addEventListener("click", () => { listeDe = etat.enfant; rendreListe(listeDe); ouvrir("fen-liste"); });

  const armes = new Set();
  function rendreParents() {
    const corps = $("corps-parents"); corps.innerHTML = "";
    const noms = document.createElement("div"); noms.className = "bloc-parent";
    noms.innerHTML = `<h3>Les prénoms</h3>`;
    for (const e of ENFANTS) {
      const l = document.createElement("label"); l.className = "champ";
      l.textContent = "Catalogue « " + e.defaut + " »";
      const i = document.createElement("input"); i.id = "nom-" + e.id; i.type = "text"; i.maxLength = 24;
      i.value = etat.noms[e.id] || ""; i.placeholder = e.defaut; i.autocomplete = "off";
      i.addEventListener("change", () => { etat.noms[e.id] = i.value.trim(); sauverNoms(); rendreParents(); });
      l.appendChild(i); noms.appendChild(l);
    }
    corps.appendChild(noms);

    const reglage = document.createElement("div"); reglage.className = "bloc-parent";
    const ligne = document.createElement("div"); ligne.className = "interrupteur";
    ligne.innerHTML = `<div>Dessiner avec le doigt<small>Pour une tablette sans crayon. Les pages se tournent alors avec les flèches du bas.</small></div>`;
    const sw = document.createElement("button"); sw.type = "button"; sw.className = "bascule"; sw.setAttribute("role", "switch");
    sw.setAttribute("aria-checked", String(etat.doigtDessine)); sw.setAttribute("aria-label", "Dessiner avec le doigt");
    sw.addEventListener("click", () => {
      etat.doigtDessine = !etat.doigtDessine; sw.setAttribute("aria-checked", String(etat.doigtDessine));
      try { localStorage.setItem("catalogue-doigt", etat.doigtDessine ? "1" : "0"); } catch (_) {}
    });
    ligne.appendChild(sw); reglage.appendChild(ligne); corps.appendChild(reglage);

    for (const e of ENFANTS) {
      const liste = choisis(e.id);
      const b = document.createElement("div"); b.className = "bloc-parent";
      const h = document.createElement("h3"); h.textContent = nomDe(e.id); b.appendChild(h);
      const p = document.createElement("p"); p.className = "note";
      p.textContent = liste.length
        ? nbCadeaux(liste.length) + " · total " + prix(liste.reduce((s, c) => s + c.p.prix, 0))
        : (pagesDessinees(e.id).length ? "Des dessins, mais aucun jouet clairement entouré." : "Rien d'entouré pour l'instant.");
      b.appendChild(p);
      const a = document.createElement("div"); a.className = "actions";
      const voir = document.createElement("button"); voir.type = "button"; voir.className = "btn clair"; voir.textContent = "Voir la liste";
      voir.addEventListener("click", () => { $("fen-parents").hidden = true; listeDe = e.id; rendreListe(e.id); ouvrir("fen-liste"); });
      a.appendChild(voir);
      a.appendChild(boutonPdf(e.id));
      const eff = document.createElement("button"); eff.type = "button"; eff.className = "btn danger" + (armes.has(e.id) ? " arme" : "");
      eff.textContent = armes.has(e.id) ? "Toucher encore pour tout effacer" : "Tout effacer";
      eff.addEventListener("click", () => {
        if (!armes.has(e.id)) { armes.add(e.id); rendreParents(); setTimeout(() => { if (armes.delete(e.id) && !$("fen-parents").hidden) rendreParents(); }, 4000); return; }
        armes.delete(e.id);
        for (const k of Object.keys(T)) if (k.startsWith(e.id + ":")) { T[k] = []; sauverPage(k); }
        etat.coeurs[e.id] = []; sauverCoeurs(e.id);
        avis("Le catalogue de " + nomDe(e.id) + " est effacé.");
        rendreParents();
      });
      a.appendChild(eff);
      b.appendChild(a);
      corps.appendChild(b);
    }
    const n = document.createElement("p"); n.className = "note";
    n.textContent = (db ? "Les ronds se sauvegardent tout seuls, en ligne, à chaque trait. " : "Les ronds se sauvegardent tout seuls sur cette tablette. ")
      + "Le PDF donne la liste des cadeaux entourés avec les prix, puis chaque page telle que l'enfant l'a laissée.";
    corps.appendChild(n);
  }
  function rendreAchats(k) {
    const liste = choisis(k), corps = $("corps-achats");
    $("titre-achats").textContent = "La liste de " + nomDe(k);
    corps.innerHTML = "";
    const intro = document.createElement("p"); intro.className = "note";
    intro.textContent = liste.length
      ? nbCadeaux(liste.length) + " · total " + prix(liste.reduce((s, c) => s + c.p.prix, 0)) + ". Prix vus en ligne le 20 novembre 2026, avant taxes. Le bouton ouvre la page du magasin."
      : "Rien d'entouré pour l'instant.";
    corps.appendChild(intro);
    const groupes = [["Super cœurs", liste.filter(c => c.coeur)], ["Les autres choix", liste.filter(c => !c.coeur)]];
    for (const [titre, lot] of groupes) {
      if (!lot.length) continue;
      const h = document.createElement("p"); h.className = "titre-section";
      h.innerHTML = (titre === "Super cœurs" ? SVG_COEUR(true) : "") + "<span></span>"; h.lastChild.textContent = titre;
      corps.appendChild(h);
      const box = document.createElement("div");
      for (const c of lot) {
        const r = document.createElement("div"); r.className = "achat";
        const im = document.createElement("img"); vignetteDans(im, c.p); r.appendChild(im);
        const inf = document.createElement("div"); inf.className = "infos";
        const b = document.createElement("b"); b.textContent = c.p.nom; inf.appendChild(b);
        const sm = document.createElement("small");
        sm.textContent = [c.p.marque, c.p.age ? ageTexte(c.p.age) : "", "page " + (c.page + 1) + ", article " + c.lettre].filter(Boolean).join(" · ");
        inf.appendChild(sm); r.appendChild(inf);
        const dr = document.createElement("div"); dr.className = "droite";
        const pr = document.createElement("span"); pr.className = "prix"; pr.textContent = prix(c.p.prix); dr.appendChild(pr);
        if (c.p.url) {
          const a = document.createElement("a"); a.href = c.p.url; a.target = "_blank"; a.rel = "noopener noreferrer";
          a.innerHTML = `<span></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>`;
          a.firstChild.textContent = "Acheter chez " + (c.p.source || "le magasin");
          dr.appendChild(a);
        }
        r.appendChild(dr); box.appendChild(r);
      }
      corps.appendChild(box);
    }
    const act = document.createElement("div"); act.className = "actions";
    act.appendChild(boutonPdf(k));
    corps.appendChild(act);
  }
  $("ouvrir-parents").addEventListener("click", () => { rendreParents(); ouvrir("fen-parents"); });

  // les jouets vedettes de la couverture : le plus beau de chaque section
  const parId = new Map(PRODUITS.map(p => [p.id, p]));
  const VEDETTES = [["lego-60496", "lego"], ["t7-skidoo-mxz", "teleguides"], ["h7-lavage-requin", "autos"], ["k7-laser-x", "cool"], ["b7-connetix-billes", "batir"], ["p7-stihl-scie", "jouer"], ["t7-chargeuse-cat-950m", "dehors"]]
    .map(([id, c]) => parId.get(id) || PRODUITS.filter(p => p.categorie === c && p.prix <= 130).sort((a, b) => b.prix - a.prix)[0]).filter(Boolean);
  VEDETTES.forEach(p => fileAttente.unshift(p.sp[0]));
  const POSES = [[.5, .52, .62, -.05], [.2, .3, .38, -.18], [.55, .2, .34, .1], [.18, .75, .36, .12], [.82, .74, .36, -.12], [.5, .2, .3, .04], [.5, .86, .32, -.03]];
  function dessinerCollage() {
    const cv = $("couv-collage"); if (!cv || etat.vue !== "accueil") return;
    const r = cv.getBoundingClientRect(); if (!r.width) return;
    const d = Math.min(devicePixelRatio || 1, 2), w = Math.round(r.width * d), h = Math.round(r.height * d);
    if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
    const x = cv.getContext("2d"); x.clearRect(0, 0, w, h);
    const cases = [[0, 0], [1, 0], [2, 0], [0, 1], [1, 1], [2, 1]], pad = Math.min(w, h) * .02, cw = w / 3, ch = h / 2;
    cases.forEach(([c, l], i) => {
      const p = VEDETTES[i], im = p && imageDe(p.id); if (!im) return;
      const k = Math.min(cw * 1.12 / im.width, (ch - 2 * pad) / im.height), iw = im.width * k, ih = im.height * k;
      x.save(); x.translate(c * cw + cw / 2, l * ch + ch / 2); x.rotate([-.04, .03, -.03, .03, -.02, .04][i]);
      x.shadowColor = "rgba(60,0,0,.35)"; x.shadowBlur = 10 * d; x.shadowOffsetY = 5 * d;
      x.drawImage(im, -iw / 2, -ih / 2, iw, ih); x.restore();
    });
    if (PHOTO_GAG.naturalWidth) {
      const ph2 = h * .26, pw2 = ph2 * PHOTO_GAG.naturalWidth / PHOTO_GAG.naturalHeight, b = pw2 * .07;
      x.save(); x.translate(w - pw2 / 2 - b * 1.5, h * .5); x.rotate(.08);
      x.shadowColor = "rgba(40,0,0,.45)"; x.shadowBlur = 14 * d; x.shadowOffsetY = 6 * d;
      x.fillStyle = "#FDFBF6"; x.fillRect(-pw2 / 2 - b, -ph2 / 2 - b, pw2 + 2 * b, ph2 + b * 4.5);
      x.shadowColor = "transparent";
      x.filter = "grayscale(1)"; x.drawImage(PHOTO_GAG, -pw2 / 2, -ph2 / 2, pw2, ph2); x.filter = "none";
      x.fillStyle = "rgba(240,228,190,.8)"; x.rotate(-.15); x.fillRect(-pw2 * .22, -ph2 / 2 - b * 2.4, pw2 * .44, b * 2.6);
      x.restore();
    }
  }
  window.addEventListener("resize", dessinerCollage);

  (() => {
    const box = $("neige"), r = hasard(11); let h = "";
    for (let i = 0; i < 46; i++) {
      const t = (1.5 + r() * 3.5).toFixed(1), d = (9 + r() * 12).toFixed(1);
      h += `<i style="left:${(r() * 100).toFixed(1)}%;--t:${t}px;--o:${(.25 + r() * .5).toFixed(2)};--d:${d}s;--r:${(-r() * d).toFixed(1)}s;--x:${((r() - .5) * 80).toFixed(0)}px"></i>`;
    }
    box.innerHTML = h;
  })();

  function dessinerRameau(svg, graine) {
    const r = hasard(graine); let h = "";
    const tiges = [[[14, 14], [96, 40], [170, 112]], [[14, 14], [40, 92], [104, 176]], [[60, 30], [110, 50], [150, 46]]];
    tiges.forEach(([a, c, b], ti) => {
      h += `<path d="M${a} Q${c} ${b}" class="tige"/>`;
      const N = ti === 2 ? 9 : 18;
      for (let i = 2; i <= N; i++) {
        const t = i / (N + 1), u = 1 - t;
        const x = u * u * a[0] + 2 * u * t * c[0] + t * t * b[0], y = u * u * a[1] + 2 * u * t * c[1] + t * t * b[1];
        const dx = 2 * u * (c[0] - a[0]) + 2 * t * (b[0] - c[0]), dy = 2 * u * (c[1] - a[1]) + 2 * t * (b[1] - c[1]), L = Math.hypot(dx, dy);
        const nx = -dy / L, ny = dx / L, tx = dx / L, ty = dy / L, l = (ti === 2 ? 9 : 15) * (1 - t * .45);
        for (const sgn of [1, -1]) h += `<path d="M${x.toFixed(1)} ${y.toFixed(1)} l${((nx * sgn + tx * .55) * l).toFixed(1)} ${((ny * sgn + ty * .55) * l).toFixed(1)}" class="aiguille"/>`;
      }
    });
    for (const [x, y] of [[58, 58], [68, 52], [62, 68]]) h += `<circle cx="${x}" cy="${y}" r="5" class="baie"/>`;
    svg.innerHTML = h;
  }
  dessinerRameau($("rameau-hg"), 5); dessinerRameau($("rameau-bd"), 9);

  /* ---------- Démarrage ---------- */
  lireLocal();
  try { etat.doigtDessine = localStorage.getItem("catalogue-doigt") === "1"; } catch (_) {}
  rendreAccueil();
  const polices = ["48px Shrikhand", "900 26px Archivo", "800 16px Archivo", "500 14px Archivo", "700 16px Archivo"];
  Promise.race([Promise.all(polices.map(p => document.fonts.load(p))), new Promise(r => setTimeout(r, 2500))])
    .then(() => { BASES.clear(); planifier(); });
  brancherDb();
  suivante();

})();
</script>
