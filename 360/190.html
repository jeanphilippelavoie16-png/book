<svg xmlns="http://www.w3.org/2000/svg" width="680" height="413" viewBox="0 0 680 413" role="img">
<title>Planche 84-09 — Souder avec deux batteries</title>
<desc>Vue de côté. Deux batteries d'auto posées à plat par terre, reliées en série : un câble court va de la borne positive de la première à la borne négative de la seconde. La borne négative restée libre part vers la masse, un serre-joint en C mordu sur le bord de la tôle, le câble coincé sous le patin de la vis. La borne positive restée libre part vers le porte-électrode, une pince-étau aux poignées gainées de cuir qui mord le bout de l'électrode. Là où les deux câbles se croisent, celui de la masse enjambe l'autre sans le toucher. Les deux tôles à souder reposent sur deux bûches, bout à bout, chanfrein en haut. Le vent souffle des batteries vers le joint, et les batteries sont à deux ou trois pas du joint.</desc>
