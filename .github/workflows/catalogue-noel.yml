name: Catalogue de Noël (GitHub Pages)

on:
  push:
    branches: [main]
    paths: ["catalogue-noel/**", "catalogue-noel-source/**", ".github/workflows/catalogue-noel.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # une modification faite en ligne dans catalogue-noel-source/ (prix, noms, jouets retirés, interface) se reconstruit ici
      - name: Reconstruire l'app
        run: python3 catalogue-noel-source/construire.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: catalogue-noel
      - id: deploiement
        uses: actions/deploy-pages@v4
